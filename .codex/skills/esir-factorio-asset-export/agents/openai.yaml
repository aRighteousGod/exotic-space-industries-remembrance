interface:
  display_name: "ESIR Factorio Asset Export"
  short_description: "Stage ESIR-ready Factorio assets and snippets"
  default_prompt: "Use $esir-factorio-asset-export to stage Meshy, Blender, or local Factorio rendering preset bundles as Factorio-ready ESIR asset drafts with previews, manifests, Lua snippets, prototype-template hints, and optional approval galleries. Inspect render-manifest alpha_bounds/warnings for clipping before treating a draft as shippable. Pack raw Render/Object frames with --pack-raw-frames when needed; large exports may become Factorio stripes. Keep promotion dry-run unless the user explicitly approves --execute, and prefer --expected-asset-count plus --require-prototype-identity before any prototype patch."
