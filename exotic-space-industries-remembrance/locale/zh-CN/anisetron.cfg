[exotic-industries-informatron]
menu_gaian_hierophant=盖亚秘仪祭司
title_gaian_hierophant=盖亚秘仪祭司
gaian-hierophant-intro=圣所将虔诚化为切割的信号。盖亚秘仪祭司是一座缓缓前行的浮空圣堂，以原生 Spidertron 指挥核心为基础，装有两道晶体光束。
gaian-hierophant-controls=操控与补给
gaian-hierophant-controls-text=沿用 Spidertron 的常规驾驶、遥控选择与自动导航。装备、货舱、回收槽和载具物流均通过原生界面操作。手动射击与自动射击都会消耗弹药，启动同一种持续射击；载具可以边移动边开火。悬浮稳定系统限制叠加减速效果，但伤害与直接眩晕仍然生效。
gaian-hierophant-weapons=两枚晶体，两路锁定
gaian-hierophant-weapons-text=使用普通品质弹药时，顶部光束每__2__刻造成__1__点激光伤害，基础射程为__3__格，覆盖__4__度。正面光束每__2__刻造成__5__点激光伤害，攻击范围为__6__格以内、正前方__7__度的扇形区域。每道光束都会保持锁定符合条件的目标，失去目标后平滑转向新的目标。完成捕获后才会造成伤害；光束在视觉上扫过某个单位，并不意味着该单位成为攻击目标。载具品质会延长顶部光束的射程；正面光束的射程保持不变。
gaian-hierophant-charge=一枚充能匣，一段射击时间
gaian-hierophant-charge-text=消耗一枚[item=ei-anisetron-crystal-charge]，即可预付两道光束持续__1__秒所需的能量。当两路光束都命中目标时，在计入研究、升级和抗性之前，合计基础输出最高为每秒__2__点激光伤害。搜索目标和转向同样消耗这段射击时间；未用掉的伤害不会储存，也不会转移给另一道光束。通过载具弹药物流补给。弹药耗尽或松开手动射击后，已经付费启动的射击仍会继续。移除载具会取消余下的攻击；已经确定的坍缩和回响仍会完成。
gaian-hierophant-upgrades=光矛传承
gaian-hierophant-upgrades-text=弹药品质、[technology=laser-weapons-damage-6]及后续研究都会增强两道光束。只有顶部光束继承[technology=ei-singularity-lance-axial-rupture]、[technology=ei-singularity-lance-wound-memory]、[technology=ei-singularity-lance-terminal-collapse]和[technology=ei-singularity-lance-black-hole-testament]：增加切线、累积伤口伤害、延迟坍缩，并在顶部光束每安排__1__次脉冲时触发一次强化脉冲。这些升级不是建造前置条件。消耗充能匣时，该段射击的伤害、射程、品质和已研究升级随即固定；新研究从后续充能匣开始生效。
gaian-hierophant-construction=在盖亚组装
gaian-hierophant-construction-text=完成滑迹飞碟、奇点光矛和激光武器伤害5研究后，研究[technology=ei-anisetron]。在盖亚上，使用一具空的[item=ei-gaian-saucer]底盘、一座[item=ei-singularity-lance]及其余配方材料组装。请先拆除装备并清空底盘：这个普通配方会制造一艘全新的载具，不会转移原有配置。晶体充能匣可以在任何表面制造。
gaian-hierophant-visuals=视觉共鸣
gaian-hierophant-visuals-text=当前启动预设：__1__。它控制绿色移动丝缕、光束光晕和命中闪光。即使关闭装饰，两道核心光束和升级的重要视觉提示仍然可见。视觉品质不会改变伤害、目标选择、射程、充能匣消耗、射击时长或移动。更高的预设允许更多装饰效果；“解缚”取消这些数量上限，可能增加 UPS 开销。
