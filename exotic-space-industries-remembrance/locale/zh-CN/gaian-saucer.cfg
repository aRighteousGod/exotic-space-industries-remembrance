[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=船体封住自己的残像，穿过世界而不留下可见记忆。
ei-gaian-saucer-wake-visual-fidelity-lean=只有纤薄的色差拒绝跟随外壳，短暂而守律。
ei-gaian-saucer-wake-visual-fidelity-standard=尾迹清楚发声，然后在成为教义前淡去。
ei-gaian-saucer-wake-visual-fidelity-cinematic=尾迹扩展、停留，并随转向誓约弯曲。
ei-gaian-saucer-wake-visual-fidelity-maximal=外壳在所经之处留下浓密发光的运动伤口。
ei-gaian-saucer-wake-visual-fidelity-unbounded=束缚被解除；只要世界承受得住，飞碟便可写下每一道闪痕。

