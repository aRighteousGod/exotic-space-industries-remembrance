gaian-saucer-text=[item=ei-gaian-saucer] 滑迹飞碟是一艘盖亚悬浮器：Spidertron 指挥核心被葬入拒绝腿部的外壳。货舱、装备格架与虚空供养的驱动，使它成为穿越敌意门槛的朝圣器具。
gaian-saucer-2=尾迹共鸣
gaian-saucer-text-2=当前尾迹誓约为 [font=default-bold]__1__[/font]。它只改变外壳身后投下的色差记忆：滑迹绽放得多明亮，转向伤痕停留多久，以及世界被要求记住多少通行。飞碟本身不变。
