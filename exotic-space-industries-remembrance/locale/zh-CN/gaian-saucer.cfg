[item-description]
ei-gaian-saucer=快速的盖亚悬浮壳体，拥有封存货舱、装备格架和不可见的腿。它以被记住的步伐移动，并在身后留下色差裂痕。

[entity-description]
ei-gaian-saucer=围绕 Spidertron 指挥核心铸成的快速盖亚悬浮框架。\n它让地面记住虚假的脚步，以此滑行。当尾迹誓约更强时，机体身后的通行会绽成色差滑迹。

[recipe-description]
ei-gaian-saucer=将 Spidertron 指挥核心重置进盖亚悬浮壳，剥除发射器，只让引擎记住无肢的运动。

[technology-description]
ei-gaian-saucer=解锁滑迹飞碟：一艘盖亚悬浮器，其货舱、装备格架与色差尾迹让移动成为被大地铭记的誓言。

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=滑迹飞碟尾迹共鸣

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=决定滑迹飞碟能以多强的烈度记住自己的通行。誓约只触及色差尾迹；船身、货舱、格架、驱动、壳体与制造方式不变。

