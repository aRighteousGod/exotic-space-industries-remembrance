[mod-setting-name]
ei-beacon-diminishing-returns=插件塔效果递减

[mod-setting-description]
ei-beacon-overload=启用时，机器会在超过过载上限后停机。铜插件塔计为1个，铁插件塔计为2个；外星和跃迁插件塔不计入过载。禁用时，ESIR的四种插件塔均使用所选的效果递减方案。
ei-beacon-diminishing-returns=仅在禁用插件塔过载时生效。覆盖同一机器的插件塔越多，每个ESIR插件塔传递的所有插件效果越弱，包括能耗和污染效果。所有类型合并计数，每座算一个；加入较弱的插件塔可能降低总加成。单个插件塔保留全部效果。插件槽位、品质、冷却和燃料需求不变。\n覆盖机器的插件塔为1 / 4 / 8 / 16个时，每个插件塔的效果：\n__1__\n原版曲线仅复制递减曲线，保留ESIR各级性能及合并计数方式。曲线含4096项；超过此数量后沿用最后一项倍率。

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=温和
ei-beacon-diminishing-returns-vanilla=原版曲线
ei-beacon-diminishing-returns-strict=严格（默认）
ei-beacon-diminishing-returns-harsh=苛刻
ei-beacon-diminishing-returns-severe=严厉
ei-beacon-diminishing-returns-saturating=饱和

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=插件塔过载已启用：每台机器的加权上限为4。铜插件塔计为1，铁插件塔计为2；外星和跃迁插件塔不计入。效果递减方案不生效。
overload-disabled=插件塔过载已禁用。当前方案：__1__。ESIR的四种插件塔均受效果递减影响。覆盖机器的每座插件塔均计为一个，与等级无关；加入较弱的插件塔可能降低总加成。
