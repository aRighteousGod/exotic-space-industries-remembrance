[mod-setting-name]
ei-production-machine-lights=生产建筑状态灯

[mod-setting-description]
ei-production-machine-lights=适用于28种ESIR生产建筑：在20种建筑原有的指示灯上添加共23个同色灯罩与微光，没有指示灯的8种建筑不会获得状态灯。多色模式下，Bottleneck Lite仅跳过这20种建筑，其颜色设置不会改变ESIR的配色。原有生产过程光效在所有模式下均保留。电弧炉的工作光效仍由独立的闪烁设置控制。 灯罩和微光颜色一致：运行时为绿色，输出已满时为黄色，电力不足时为橙色，有能源但因其他原因停止时为红色。没有能源时，新增部分不可见。 恢复原有的25处白色工作照明。电弧炉、等离子加热器和铸造机保留原有效果，不添加状态灯罩或微光。不会改变Bottleneck Lite的显示。 不添加状态灯罩或照明。建筑贴图上的指示灯和生产过程光效保持不变。不会改变Bottleneck Lite的显示。

[string-mod-setting]
ei-production-machine-lights-off=关闭
ei-production-machine-lights-status=多色状态灯
ei-production-machine-lights-original=原始白光

[string-mod-setting-description]
ei-production-machine-lights-off=不添加状态灯罩或照明。建筑贴图上的指示灯和生产过程光效保持不变。不会改变Bottleneck Lite的显示。
ei-production-machine-lights-status=灯罩和微光颜色一致：运行时为绿色，输出已满时为黄色，电力不足时为橙色，有能源但因其他原因停止时为红色。没有能源时，新增部分不可见。 适用于28种ESIR生产建筑：在20种建筑原有的指示灯上添加共23个同色灯罩与微光，没有指示灯的8种建筑不会获得状态灯。多色模式下，Bottleneck Lite仅跳过这20种建筑，其颜色设置不会改变ESIR的配色。原有生产过程光效在所有模式下均保留。电弧炉的工作光效仍由独立的闪烁设置控制。
ei-production-machine-lights-original=恢复原有的25处白色工作照明。电弧炉、等离子加热器和铸造机保留原有效果，不添加状态灯罩或微光。不会改变Bottleneck Lite的显示。

