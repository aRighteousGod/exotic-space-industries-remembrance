[technology-description]
ei-severance-array=解锁量子时代激光炮塔，让一道光之誓约沿不断变化的瞄准线被拖曳。

[mod-setting-name]
ei-severance-array-visual-fidelity=断绝阵列视觉保真度

[mod-setting-description]
ei-severance-array-visual-fidelity=仅控制断绝阵列的可见光束见证、辉光/火焰/焦痕持续时间、音效密度和运行时视觉预算。伤害、射程、能耗、生命值和配方成本不会改变。极限是带上限的截图/压力测试预设；无上限会移除硬性视觉限制，可能严重摧毁UPS。

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=精简
ei-severance-array-visual-fidelity-standard=标准
ei-severance-array-visual-fidelity-cinematic=电影化
ei-severance-array-visual-fidelity-maximal=极限
ei-severance-array-visual-fidelity-unbounded=无上限

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=UPS优先：更少的光束切片、更短的见证效果，并更严格限制火焰与焦痕。
ei-severance-array-visual-fidelity-standard=这是日常游玩的目标档位：可见扫切、见证命中，以及保守的运行时预算。
ei-severance-array-visual-fidelity-cinematic=更丰富的演出：更多光束切片和见证效果，辉光与焦痕保留更久。
ei-severance-array-visual-fidelity-maximal=这是带上限的演出档位：截图级光束与见证效果，同时保留紧急限制。
ei-severance-array-visual-fidelity-unbounded=移除硬性视觉上限，并积极清空已就绪的断绝任务。它追求的是场面，不是安全。

[item-description]
ei-severance-array=4x4量子武器平台，消耗巨量储能，在敌方阵形中刻下移动的激光创口。

[entity-description]
ei-severance-array=4x4量子武器平台。原生激光命中负责杀伤边缘；高负载时，只有可见瞄准轨迹会衰减。

[exotic-industries-informatron]
menu_severance_array=断绝阵列
title_severance_array=断绝阵列
turrets-text-6=[item=ei-severance-array]断绝阵列是位于等离子炮塔与战略遗物武器之间的量子时代刃式协议。它储存庞大电荷，然后在原生激光命中承担极高首击伤害的同时，把一道可见光束从上一个瞄准点拖向下一个瞄准点。轨迹采用视觉预算：多座阵列同时开火时，部分光束切片会被抑制，以保持伤害稳定。
severance-array=断绝阵列
severance-array-text=[item=ei-severance-array]断绝阵列是一台紧凑的量子时代处刑引擎。它占用4x4地基，消耗巨大的电脉冲，并通过在战场上打开一道明亮创口来回应目标，而不是把每个受害者都当成独立弹丸追踪。
severance-array-2=瞄准轨迹协议
severance-array-text-2=每次射击都会对目标使用普通炮塔伤害，并为该阵列重定向一道活动的可见轨迹。光束切片只是切割的装饰见证，并非真实伤害来源。
severance-array-3=负载削减
severance-array-text-3=当过多阵列同时开火时，运行时会在它们之间分配可用视觉切片。战场上显示的光痕可能减少，但伤害会留在原生炮塔路径上，然后才把时间花在演出上。
