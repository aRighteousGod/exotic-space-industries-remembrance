[item-description]
ei-loader=带有一个共享过滤器的装卸机。仅搬运未堆叠物品。
ei-fast-loader=带有一个共享过滤器的高速装卸机。仅搬运未堆叠物品。
ei-express-loader=带有一个共享过滤器的装卸机。堆叠大小可调，最高 [font=default-bold]2[/font]。
ei-turbo-loader=带有两个车道过滤器的装卸机，可分别控制左右车道。堆叠大小可调，最高 [font=default-bold]2[/font]。
ei-neo-loader=带有两个车道过滤器的装卸机，可分别控制左右车道。堆叠大小可调，最高为当前传送带堆叠上限。

