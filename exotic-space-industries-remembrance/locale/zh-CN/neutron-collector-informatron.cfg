menu_neutron_collector=中子收集器
title_neutron_collector=中子收集器
neutron-collector=中子收集器
neutron-collector-text=[color=orange]中子收集器[/color] [item=ei-neutron-collector] 是量子时代的充能设备。它会从附近裂变源、玄冥星上运行中的太空时代高密度等离子体聚变反应堆泄出的微弱中子，以及更强且可调的 ESIR 热核聚变反应堆中捕获自由中子，并利用这些中子通量把 [item=ei-neutron-container] 充成 [item=ei-charged-neutron-container]。\n\n它不会制造中子。它只是收割附近反应堆没能留住的那一部分。收集器一次只会绑定一个源，不会把周围所有机器的产出平均，而是优先选择范围内最强、仍然在线的产出。
neutron-collector-2=绑定、距离与待机
neutron-collector-text-2=效率由源类型、活动状态和布局几何共同决定。玄冥星的太空时代高密度等离子体聚变反应堆只有在运行时才提供微弱泄漏；ESIR 热核聚变反应堆仍是更强、可通过温度和注入设定调节的来源。显示出来的效率始终限制在 0-300%，距离越远，充能时间越长。\n\n如果附近没有有效源，中子通量低于充能阈值，绑定源转入休眠，输出被堵住，或电路条件把装配机停掉，收集器就会退回待机配方。这样机器仍然可以打开，诊断信息也不会消失。
neutron-collector-3=电路遥测
neutron-collector-text-3=当收集器接入电路网络时，它的隐藏接口会向收集器所在的网络发布 5 个专用信号：[virtual-signal=ei-neutron-efficiency]、[virtual-signal=ei-neutron-distance]、[virtual-signal=ei-neutron-collector-agent]、[virtual-signal=ei-neutron-source-agent]、[virtual-signal=ei-neutron-scan-agent]。\n\n效率范围是 0-300。距离以 0.1 格为单位输出。收集器代理为 1 运行、2 空闲、3 阻塞。源代理为 1 在线、2 休眠、3 缺失。扫描代理为 1 稳定、2 待重算、3 待重新绑定。这些信号会在收集器的计划遥测轮次中刷新，而不是每 tick 都刷新。
