menu_neutron_collector=中子收集器
title_neutron_collector=中子收集器
neutron-collector=中子收集器
neutron-collector-text=[color=orange]中子收集器[/color] [item=ei-neutron-collector] 是量子时代的充能设备。它会捕获附近裂变与聚变设施泄出的自由中子，并利用这些中子通量把 [item=ei-neutron-container] 充成 [item=ei-charged-neutron-container]。\n\n它不会制造中子。它只是收割附近反应堆没能留住的那一部分。收集器一次只会绑定一个源，不会把周围所有机器的产出平均，而是优先选择范围内最强、仍然在线的那一个。
neutron-collector-2=绑定、距离与待机
neutron-collector-text-2=效率由源类型和布局几何共同决定。强力聚变源可以把实时效率推到 100% 以上，遥远或微弱的发射源则会把它压低；显示出来的效率始终限制在 0-300%。距离越远，充能时间越长。\n\n如果附近没有有效源，中子通量太弱，绑定源转入休眠，输出被堵住，或电路条件把装配机停掉，收集器就会退回待机配方。这样机器仍然可以打开，诊断信息也不会消失。
neutron-collector-3=电路遥测
neutron-collector-text-3=当收集器接入电路网络时，它的隐藏接口会向收集器所在的网络发布 5 个专用信号：[virtual-signal=ei-neutron-efficiency]、[virtual-signal=ei-neutron-distance]、[virtual-signal=ei-neutron-collector-agent]、[virtual-signal=ei-neutron-source-agent]、[virtual-signal=ei-neutron-scan-agent]。\n\n效率范围是 0-300。距离以 0.1 格为单位输出。收集器代理为 1 运行、2 空闲、3 阻塞。源代理为 1 在线、2 休眠、3 缺失。扫描代理为 1 稳定、2 待重算、3 待重新绑定。这些信号会在收集器的计划遥测轮次中刷新，而不是每 tick 都刷新。
