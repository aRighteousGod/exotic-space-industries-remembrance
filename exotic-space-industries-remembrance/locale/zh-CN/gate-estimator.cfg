[gate-estimator]
route-snapshot=快照固定路线
power-draw=消耗功率
title=传送门估算器
close=关闭
help-launch=打开独立的假设计算窗口，不改变传送门设置或货物。
snapshot=读取传送门状态
help-snapshot=复制电量、应力、冷却、品质和路线，保留选定物品及供给假设。
reset=重置假设
help-reset=以满电、无应力和冷却、每秒1件及1 GW供电开始，不重置实际传送门。
item=物品
help-item=选择任意可用物品，不消耗物品。货物品质不影响传送能耗。
batch=堆叠数量／单次最大投入
help-batch=用于单次传送报价，也是每模拟刻的最大投入量。传送门不会等待凑满此数量；多次投入可合并成堆叠。
stress=应力
help-stress=发送端初始应力，范围0–100，每秒降低1。增加维持功率和冷却时间，不增加直接传送费用。
quality=发送端品质
help-quality=可见发送端的品质将传送及维持能耗乘以1 / (1 + 0.2 × 品质等级)。货物和接收端品质不影响该折扣。
from=发送星球
to=接收星球
help-route=选定两个星球后，距离锁定为星图间距。同一星球视为同一地表。清空任一星球可手动设置距离，不生成地表。
local=同一地表
orbital=同一天体，不同地表
distance=星际距离
unknown=未解析的跨地表路线
help-distance=星图距离，不是格数或太空航线长度。同一地表×0.15；同一天体的不同地表×2.5；未解析跨地表路线×3。
rate=供给速率
help-rate=恒定的供给需求。无法投入的物品在上游等待，实际送达速率可能较低。小数会累计为完整物品。
per-second=件／秒
per-minute=件／分
power=可用功率
help-power=假定恒定供电，并非电网实测值。充电受原生输入上限及剩余储能空间限制。
initial-state=初始运行状态
help-initial-state=可编辑的快照值。模拟货物和上游队列初始为空，实际传送门不受影响。
energy=储存电量（GJ）
help-energy=初始电量。传送门至少需要100 GJ才能运行，还必须足以支付下一整堆物品的费用。
cooldown=冷却时间（秒）
help-cooldown=初始剩余冷却，单位为游戏秒。冷却中停止自动投入和传送，结束后等待下次传送门处理才开放输入。
saturation=接收端饱和度
help-saturation=初始值0–100。达到100时停止传送，但仍可暂存输入。每秒恢复1.5，假设输出货物和残留物自动清除。
calculation=计算明细
projections=趋势预测
burden=传送负荷
help-burden=传送门质量表中的权重×数量。未收录物品权重为1，与火箭载荷质量不同。
distance-factor=距离倍率
help-distance-factor=星际倍率=2.5 + 5.5 × (距离 / 星图最大间距)^0.6，限制在已安装星图范围内。跨度比例=(倍率−0.15)/7.85。
quality-factor=品质倍率
help-quality-factor=仅发送端品质降低能耗。模组新增品质等级使用同一公式。
toll=传送能耗
help-toll=负荷曲线超线性增长，因此大堆叠的单件费用更高。将负荷能量、距离及品质相乘后，仅对最终结果向下取整一次。
per-item=单件传送能耗
help-per-item=本次传送费用除以物品数量，不含维持消耗。单价随堆叠数量变化，并非固定。
stress-result=增加应力／传送后应力
help-stress-result=每次最多增加35，总上限100。达到75后，不在冷却时控制台显示危险状态。
cooldown-result=传送后冷却
help-cooldown-result=使用传送后的应力。各刻数项分别取整，再换算为秒。处理周期、电量和接收端恢复可能进一步推迟下次传送。
saturation-result=增加饱和度／传送后饱和度
help-saturation-result=物理负荷最多增加20饱和度，总上限100。发送端品质不会减轻此惩罚。
upkeep-result=传送后／传送前维持功率
help-upkeep-result=就绪时为30 MW，加每点应力1.5 MW及冷却中30 MW，再乘品质倍率。未激活或电量不足时无脚本维持消耗。
hardware=容量：__1__ GJ · 充电上限：__2__ MW · 处理周期：__3__ 秒
help-hardware=原生硬件限制和根据当前传送门数量、更新预算得出的固定周期。后续数量变化可能改变实际周期。
fallback=该物品不在传送门质量表中，按权重1计算。
assumptions=一个启用的发送端、一种物品、一个接收端。输出和残留物自动清除，无其他发送端竞争。时间为游戏时间。
help-assumptions=模拟饱和度、维持消耗、堆叠合并、冷却和支付能力。不包括腐坏、损伤、电路变化、机械臂运动、电网竞争或平台路线移动。
run=运行预测
help-run=计算当前方案及基准。计算分批执行且可取消；编辑后将已有图表标记为过期。
minutes=__1__ 分钟
help-horizon=预测时长，单位为游戏分钟。基准使用相同时长。
pin=保存比较基准
clear-baseline=清除比较基准
help-pin=保存一份独立方案及初始状态。实线为当前方案，虚线为基准；更改后需重新运行。
baseline=比较基准
pinned=已保存基准
no-baseline=无比较基准
legend=青色：第一序列 · 橙色：第二序列 · 实线：当前 · 虚线：基准
help-chart=电量：GJ，红线100 GJ。应力：发送端／接收端，红线75。冷却：剩余时间／传送间隔。吞吐：送达／供给。队列：上游／门内。功率：传送／维持。竖线保留区间极值。
throughput=吞吐量
queue=排队货物
axis=0–__1__ __2__ · 时间0–__3__ 秒
unit-1=GJ
unit-2=%
unit-3=秒
unit-4=件／秒
unit-5=件
unit-6=MW
sample=__1__–__2__ 秒：__3__
help-sample=移动时间游标，显示区间末值［最小–最大］。吞吐量与功率为区间平均值。
summary=送达：__1__ · 平均：__2__ 件／秒\n上游：__3__ · 门内：__4__\n传送：__5__ GJ · 维持：__6__ GJ · 平均功率：__7__ MW\n最低电量：__8__ GJ · 峰值应力：__9__\n等待 — 冷却：__10__ 秒；电量：__11__ 秒；接收端：__12__ 秒\n产生残留物：__13__
help-summary=等待原因可能重叠，不可相加。能量统计只包含实际消耗。残留物计数后清除，排队物品不会丢弃。
difference=当前−基准：送达物品__1__件；消耗__2__ GJ
help-status=单次报价即时更新。预测显示上次运行结果，修改后标记为过期。不会改变实际传送门。
running=计算中…
stale=预测已过期，请重新运行
ready=预测就绪
invalid=请输入控件范围内的有限数值。
missing-prototype=物品、品质或星球不可用，请重新选择。
too-expensive=该堆叠费用超过传送门储能容量。原生传送不会为适应剩余电量而拆分堆叠。
