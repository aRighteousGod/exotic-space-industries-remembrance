clock=当前：__1__\n完整周期：__2__\n全日照：__3__ · 全黑夜：__4__\n黄昏过渡：__5__ · 黎明过渡：__6__\n__7__
next-light=接下来：约 __2__ 后进入__1__。
held=昼夜周期已暂停，不预测下一次转换。
permanent=永久日照，不预测入夜时间。
permanent-held=永久日照；昼夜周期也已暂停。
variable=当地昼夜周期可变：时长可以独立于季节发生变化。
clock-help=时长使用模拟时间。时间条从全日照开始时算起，标记显示当前观测到的周期位置。预测使用现有日照边界和周期时长，其他控制器可能改变这些值。这里不预测太阳能发电量。
no-cycle=这里没有可用的星球昼夜周期。
invalid-cycle=无法可靠读取当前周期，不预测下一次转换。
seasons=__1__ · 本季已过 __2__%\n本年已过 __3__%\n距下一季还有 __4__\n年长：__5__\n按当前昼夜周期，约合 __6__ 个当地日。
calendar-help=季节历法和当地昼夜各自计时。一个历法年等于 __1__ 个基准日。当地日数按当前周期时长换算，不是对过去自转次数的统计。
no-calendar=季节历法不可用。
daylight-active=季节性昼长正在生效。
daylight-disabled=这里已关闭季节性昼长。
daylight-paused=季节性昼长已暂停。
daylight-external=日照由其他控制器管理。
daylight-independent=Fulgora 的日照仍独立于季节历法。
daylight-pending=季节性昼长正在等待下一次检查。
status-observed=近期当地观测
status-outdated=较早的当地观测
status-unknown=尚未观测
status-disabled=这里已关闭生态
status-suspended=生态变化已暂停
status-unsupported=这里不支持生态
effect=__1__：记录了 __2__ 次 · __3__
last=上次活动在 __1__ 前
no-time=活动时间未知
no-activity=没有活动记录
feature-off=已关闭
feature-unavailable=这里不适用
record-help=次数统计的是 ESIR 成功造成的变化，不是独立地块数量，也不是完整的地形调查。同一块地面可能变化多次。旧存档会保留总数，但可能没有活动时间。森林火灾次数记录的是点火，不是森林损失。
ground-help=条件允许时，恢复可以沿已记录的地形变化逐步返回。覆盖地面或由外部替换地形，可能让保存的变化步骤不再适用；移除覆盖物也不会重建记录。基础设施、栽培土地和特殊地点仍受保护。
ground-conditions=土壤损伤需要污染至少为 __1__ 并持续 __2__；恢复需要读数至多为 __3__ 并持续 __4__。仍然需要可靠的观测，并等待各自的处理机会。
pollution-unavailable=这个世界的污染物不能用于判断工业污染程度。Gleba 的孢子不算工业污染。
mining-recovery-on=采矿恢复已开启。满足所需的洁净条件并通过保护检查后，有记录的痕迹可以恢复。
mining-recovery-off=采矿恢复已关闭。有记录的采矿痕迹会保留，直到开启此选项或地形被替换。
woodland-help=这些是对已适配野生树木的变化记录。栽培植物和受保护植物不参与。树木天然呈灰色，本身不能证明它受到污染损伤。
woodland-unavailable=这个世界没有适用于这些效果的原生林木。
other-help=效果仍需要合适的当地地形，并通过保护检查。岸线转换仅适用于指定的 Nauvis 淡水与沿岸地形组合。铺装腐蚀另有明确的适用条件。
survey=最近一次当地读数：__1__ 前。__2__\n观测只涵盖已经访问的区域。未观测的地面不能直接视为健康。
survey-none=尚无可靠的当地读数。观测只涵盖已经访问的区域；未观测的地面不能直接视为健康。
coverage-discovering=初次巡查仍在进行。
coverage-observed=初次巡查已经结束，但这不代表完成了全面的健康调查。
coverage-limited=调查覆盖范围仍然有限。
coverage-unknown=调查覆盖范围尚未确定。
duration-s=__1__ 秒
duration-ms=__1__ 分 __2__ 秒
duration-hm=__1__ 小时 __2__ 分
legend-day=日照 · 黄昏 · 黑夜 · 黎明
legend-season=上升季 · 旺盛季 · 衰退季 · 低谷季
phase-marker=▼
recorded=活动记录
guide-summary=简洁报告把当地昼夜与季节历法分开呈现。昼夜条显示该地表现有的原生日照边界和完整自转时长；季节条遵循 ESIR 的年度历法。倒计时估算依据当前设置。Fulgora 保留独立的昼夜控制器，时间暂停或永久日照时不会给出普通转换预测。景观横幅只作装饰。活动卡片统计成功记录的变化，同一块地面可能计入多次。每类活动会显示最近一次已知时间；旧记录的总数可能没有保存时间。读数距今多久、调查涵盖哪里，描述的都是有限的实地观测，不能代表整个世界的健康状况。
