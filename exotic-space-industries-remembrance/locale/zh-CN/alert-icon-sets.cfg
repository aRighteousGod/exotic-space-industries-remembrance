[mod-setting-name]
ei-alert-icon-set=警报图标样式
ei-alert-icon-set-default=默认警报图标样式

[mod-setting-description]
ei-alert-icon-set=选择个人ESIR警报和生态设置中的图标样式。“应用启动设置”会将当前启动设置复制到个人设置。之后更改启动设置不会覆盖已保存的个人选择。
ei-alert-icon-set-default=尚未保存个人选择的玩家使用的初始图标样式。已有的个人选择会保留。默认：立体物件。

[string-mod-setting]
ei-alert-icon-set-vanilla=Factorio原版风格
ei-alert-icon-set-default-vanilla=Factorio原版风格
ei-alert-icon-set-startup-default=应用启动设置
ei-alert-icon-set-original=原版图标
ei-alert-icon-set-svg=铸金属符印
ei-alert-icon-set-rendered=立体物件
ei-alert-icon-set-default-original=原版图标
ei-alert-icon-set-default-svg=铸金属符印
ei-alert-icon-set-default-rendered=立体物件
