[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=最短的破裂。4 个环、严格上限、没有次级家族点缀，也没有 massive-explosion。
ei-flammable-rupture-fidelity-runtime-standard=默认设置。6 个环、中等上限、1 个有意义的次级点缀，以及节制的 massive-explosion。
ei-flammable-rupture-fidelity-runtime-cinematic=8 个环，更高的烟雾与火焰预算，更丰富的家族点缀，以及更慢的外扩绽放。
ei-flammable-rupture-fidelity-runtime-unbounded=移除硬性视觉上限，并让调度器在同一 tick 内积极清空已就绪的环。它追求的是场面，不是安全。
ei-gaian-saucer-wake-visual-fidelity-runtime-off=船体封住自己的残像，穿过世界而不留下可见记忆。
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=只有纤薄的色差拒绝跟随外壳，短暂而守律。
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=尾迹清楚发声，然后在成为教义前淡去。
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=尾迹扩展、停留，并随转向誓约弯曲。
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=外壳在所经之处留下浓密发光的运动伤口。
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=束缚被解除；只要世界承受得住，飞碟便可写下每一道闪痕。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=腹部封闭圆环，移动时不显示悬浮微光。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=四道发射器圆环短暂回应地面，只留下克制的棱镜边缘。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=当运动化为压力时，发射器在车体下写出稳定的翡翠圆环。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=圆环增强、叠加，并在每个悬浮足周围剪裂成薄荷绿的棱镜碎片。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=每个发射器都在遗物下打开致密的发光印记，其暴烈近乎虔诚。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=调节器已经破裂；每个悬浮足都可能迫使地面记住坦克的经过。
