ei-emerald-fusion-core-equipment=封存在天启车体内的翡翠心脏。核心不会嗡鸣；它诵读压力。
ei-emerald-aegis-shield-equipment=与悬浮坦克誓约相连的棱镜护盾膜。来袭之力撞上它，仿佛忽然想起了错误的几何。

