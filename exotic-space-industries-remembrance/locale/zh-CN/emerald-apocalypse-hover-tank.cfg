ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=四道发射器圆环短暂回应地面，只留下克制的棱镜边缘。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=当运动化为压力时，发射器在车体下写出稳定的翡翠圆环。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=圆环增强、叠加，并在每个悬浮足周围剪裂成薄荷绿的棱镜碎片。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=每个发射器都在遗物下打开致密的发光印记，其暴烈近乎虔诚。
