[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=翡翠天启悬浮坦克
title_emerald_apocalypse_hover_tank=翡翠天启悬浮坦克
emerald-apocalypse-hover-tank=翡翠天启悬浮坦克
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank]是异质时代晚期的悬浮堡垒：沉重到无法优雅，虔诚到拒绝坠落。发射器圆环把车体托在世界上方，固定炮把朝向化作判词。
emerald-apocalypse-hover-tank-2=水晶充能
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge]是为[item=ei-emerald-apocalypse-cannon]携带的单一封存裂变。开火时，坦克并不散播怒意。它开启一道绿色戒律，并让战场作答。
emerald-apocalypse-hover-tank-3=轨道碎晶教义
emerald-apocalypse-hover-tank-text-3=轨道碎晶是脚本教义，不是炮塔装备。碎晶流形把碎晶环从3枚提升到6枚活动碎晶。装填礼赞把每枚碎晶的节奏从1.17秒压缩到0.92、0.75，最后到0.58秒。目标裁决不再只看距离，而是用威胁评分衡量巢穴、炮塔、生命值、伤势与距离。裁决孔径会拓宽光束，让每次命中把有上限的伤害溢向附近目标或光束走廊中的目标。
emerald-apocalypse-hover-tank-4=轨道碎晶控制台
emerald-apocalypse-hover-tank-text-4=打开坦克物品栏时，旁侧会展开紧凑的碎晶面板。每辆已放置坦克都可维持0到已研究上限之间的碎晶数量。分散索敌会把判决分配给附近最佳威胁；Focus会命令所有活动碎晶攻击同一个当前目标。显示的DPS会计入活动碎晶数量、激光武器伤害7+重复科技，以及已放置坦克的品质。

emerald-apocalypse-hover-tank-5=车体教义
emerald-apocalypse-hover-tank-text-5=车体教义是有限的。蓄能教义把蓄能从9.48秒缩短到8.5、7.58、最终6.67秒，每级教义都会响起对应的更短充能声。惯性誓约把发射后封印从15秒降到13.17和11.33秒。圣盾盟约让护盾伤痛回应附近敌人。矢量龙骨改善悬浮底盘而不移除重型侧滑。坍缩敕令强化52格终点波，但不扩张边界。
emerald-apocalypse-hover-tank-6=解封控制
emerald-apocalypse-hover-tank-text-6=天启递归会开启每辆坦克的开关，默认开启：充能回收、龙骨尾迹、分枝伤痕、分裂尾迹和解封冲击。这些不是温和教义。若某辆坦克的誓约必须保持狭窄，请单独关闭。
