[item-description]
ei-emerald-apocalypse-hover-tank=一座遗物般的悬浮堡垒，载着固定的水晶巨炮和拒绝触地的心脏。它以压力之姿推进，并在确信曾经站立的地方留下翡翠色的寂静。
ei-emerald-apocalypse-cannon=固定在车体上的水晶光束炮。它不追踪目标。它只审判坦克正面对着的一切。
ei-emerald-apocalypse-charge=为翡翠天启炮封存的水晶裂变。一道誓言，一次释放，一处刻进世界的绿色伤口。

[entity-description]
ei-emerald-apocalypse-hover-tank=由翡翠发射器托起的遗物悬浮堡垒。炮管在开火前聚集压力；充能弹化作等离子、后坐力，以及确信之处留下的绿色空缺。

[technology-description]
ei-emerald-apocalypse-hover-tank=唤醒翡翠天启悬浮坦克：这台漂浮的攻城引擎让固定水晶巨炮把前进化为教义，再把教义化为废墟。
ei-emerald-shard-manifold-1=将翡翠天启的轨道碎晶教义提升到4枚活动碎晶。
ei-emerald-shard-manifold-2=向碎晶流形编入第二道加固，将教义提升到5枚活动碎晶。
ei-emerald-shard-manifold-3=完成流形誓约，让6枚活动碎晶同时回应坦克。
ei-emerald-reload-litany-1=将轨道碎晶装填教义缩短到每枚0.92秒。
ei-emerald-reload-litany-2=反复诵读礼赞，直到碎晶环每0.75秒重新成列。
ei-emerald-reload-litany-3=将装填节律封在0.58秒：少些等待，多些审判。
ei-emerald-target-verdict=让轨道碎晶优先选择巢穴、炮塔、近处敌人和已经受伤的目标，而非把判决浪费在较小威胁上。
ei-emerald-verdict-aperture-1=在碎晶打击周围开启第一道翡翠孔径，并附加有上限的次级伤害。
ei-emerald-verdict-aperture-2=将碎晶的冲击孔径扩展成更宽的范围判决。
ei-emerald-verdict-aperture-3=让碎晶判决化为足以惩罚密集敌群的翡翠伤口。

ei-emerald-charge-catechism-1=让炮管更快祈祷，将天启蓄能缩短到8.5秒。
ei-emerald-charge-catechism-2=再次压缩翡翠音节，将蓄能缩短到7.58秒。
ei-emerald-charge-catechism-3=封定最凶烈的节奏：发射前6.67秒。
ei-emerald-inertial-oath-1=让车体更快从后坐中恢复，发射后冷却降至13.17秒。
ei-emerald-inertial-oath-2=硬化后坐誓约，发射后冷却降至11.33秒。
ei-emerald-aegis-covenant-1=把护盾痛楚转化为只伤敌人的翡翠等离子回击。
ei-emerald-aegis-covenant-2=深化圣盾盟约，膜受伤时回击更远更强。
ei-emerald-vector-keel-1=调整悬浮龙骨，在保留重型侧滑的同时改善操控。
ei-emerald-vector-keel-2=进一步改善倒车、制动与漂移控制。
ei-emerald-collapse-mandate-1=提高终点坍缩压力，但让伤痕保持有界。
ei-emerald-collapse-mandate-2=让同一52格裁决承载更多等离子。
ei-emerald-collapse-mandate-3=完成敕令：边界不变，裁决更残酷。
ei-emerald-apocalypse-recursion=解封每辆坦克的危险控制：充能回收、尾迹、分枝伤痕、分裂光束和过量冲击。

