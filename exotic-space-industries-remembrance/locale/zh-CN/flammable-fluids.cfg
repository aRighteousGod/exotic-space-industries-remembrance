[mod-setting-name]
ei-flammable-rupture-fidelity=可燃破裂保真度
ei-fluid-safety-ignored-entities=流体安全忽略的实体

[mod-setting-description]
ei-flammable-rupture-fidelity=决定可燃流体破裂时，视觉效果与危险传播会铺得多密。精简最克制。标准是默认值。电影会把场面拉成更多环。无上限会移除硬性效果上限，大型储罐破裂时可能严重拖垮 UPS。
ei-fluid-safety-ignored-entities=ESIR 流体安全与可燃破裂系统应忽略的实体原型名。可用逗号、分号、空格、制表符或换行分隔。默认值会保护 Interplanetary Fluid Funnel / Linked Pipe 的辅助实体；删除名称即可让 ESIR 安全系统重新处理它们。

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=精简
ei-flammable-rupture-fidelity-standard=标准
ei-flammable-rupture-fidelity-cinematic=电影
ei-flammable-rupture-fidelity-unbounded=无上限

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=最短的破裂。4 个环、严格上限、没有次级家族点缀，也没有 massive-explosion。
ei-flammable-rupture-fidelity-standard=默认设置。6 个环、中等上限、1 个有意义的次级点缀，以及节制的 massive-explosion。
ei-flammable-rupture-fidelity-cinematic=8 个环，更高的烟雾与火焰预算，更丰富的家族点缀，以及更慢的外扩绽放。
ei-flammable-rupture-fidelity-unbounded=移除硬性视觉上限，并让调度器在同一 tick 内积极清空已就绪的环。它追求的是场面，不是安全。

[exotic-industries-informatron]
menu_flammable_ruptures=可燃破裂
title_flammable_ruptures=可燃破裂

flammable-ruptures=可燃流体破裂
flammable-ruptures-text=储罐、管道本体、地下流体连接、罐车，以及带流体的机器，只要在死亡时内部还困着足够多的可燃流体，就可能发生破裂。运行时读取的是最终加载后的流体原型，而不是手写白名单，所以石油产物、气体管线与异质燃料混合物都会保留各自不同的余波语言。\n\n触发仍然会看致死伤害类型。火焰、撞击、爆炸、等离子体和其他高能死亡，比寒冷或毒性更容易点燃破裂。
flammable-ruptures-2=保真模式
flammable-ruptures-text-2=当前启动模式：[font=default-bold]__1__[/font]\n\n[font=default-bold]精简[/font]会把整段序列压得更短、更紧。[font=default-bold]标准[/font]是默认路线。[font=default-bold]电影[/font]会把更大的绽放分摊到更多 tick 上。[font=default-bold]无上限[/font]会取消硬性上限，并让调度器在同一 tick 内尽可能激进地清空已就绪的环。
flammable-ruptures-3=传播与代价
flammable-ruptures-text-3=污染会在死亡时立刻施加，但破裂的其余部分现在会按环向外推进。爆炸、烟雾、火焰铺设、焦痕以及对附近目标的伤害只会预先计算一次，然后在后续多个 tick 中释放，因此一群巨型储罐不会再试图在一帧里把整场末日一次性生成完。\n\n地下成对管线的后续也走同一套队列。无上限模式本来就对性能很危险：四个满载的 silo-2 依然可以很壮观，但代价也还是由你承担。
flammable-ruptures-4=平台与管线
flammable-ruptures-text-4=在太空平台上，破裂仍会保留伤害与沿已连接管线传播的效果，但不会再变成铺满整个平台甲板的地表火海。喷散烟雾会更收束，不再铺设焦痕，火焰只会出现在破裂源头和被直接点燃的管段上。地基损伤也沿着这条局部链路推进，而不会随机泼洒到整片甲板。
