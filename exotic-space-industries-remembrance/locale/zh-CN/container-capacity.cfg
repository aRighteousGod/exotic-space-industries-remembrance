[mod-setting-name]
ei-container-capacity-profile=容器容量预设

[mod-setting-description]
ei-container-capacity-profile=设置所有储物箱的容量，包括其他模组中的储物箱。以下为普通品质的格数；列顺序：木箱 / 铁箱 / 钢箱 / 小型 / 中型 / 仓库。\n__1__\n\n同一尺寸的普通、筛选和物流容器使用相同容量。保留原有品质加成。机器的功能性库存不受影响。调低此设置可能缩减已有库存并造成物品丢失。

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=普通品质格数：木箱 __1__ / 铁箱 __2__ / 钢箱 __3__ / 小型 __4__ / 中型 __5__ / 仓库 __6__。

[string-mod-setting]
ei-container-capacity-profile-restrained=受限（默认）
ei-container-capacity-profile-standard=标准
ei-container-capacity-profile-expanded=扩展
ei-container-capacity-profile-generous=充裕
ei-container-capacity-profile-industrial=工业
ei-container-capacity-profile-massive=海量
ei-container-capacity-profile-vast=超大
ei-container-capacity-profile-extreme=极限

[string-mod-setting-description]
ei-container-capacity-profile-restrained=普通品质格数：木箱 8 / 铁箱 16 / 钢箱 16 / 小型 24 / 中型 32 / 仓库 64。
ei-container-capacity-profile-standard=普通品质格数：木箱 8 / 铁箱 16 / 钢箱 24 / 小型 32 / 中型 64 / 仓库 128。
ei-container-capacity-profile-expanded=普通品质格数：木箱 16 / 铁箱 24 / 钢箱 32 / 小型 48 / 中型 96 / 仓库 192。
ei-container-capacity-profile-generous=普通品质格数：木箱 16 / 铁箱 32 / 钢箱 48 / 小型 64 / 中型 128 / 仓库 256。
ei-container-capacity-profile-industrial=普通品质格数：木箱 24 / 铁箱 48 / 钢箱 64 / 小型 96 / 中型 192 / 仓库 384。
ei-container-capacity-profile-massive=普通品质格数：木箱 32 / 铁箱 64 / 钢箱 96 / 小型 128 / 中型 256 / 仓库 512。
