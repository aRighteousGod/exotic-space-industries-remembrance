[item-description]
ei-singularity-lance=围绕悬浮晶体之心建成的异星誓约引擎。它的炫彩光线并非单纯灼烧目标，而是把目标从“完整”的记忆中切离。

[entity-description]
ei-singularity-lance=升起的晶体祭坛，专为聚焦异星暴力而造。棱晶悬浮在机器上方，聚拢不可能的色彩，并沿选定直线释放为奇点光矛。

[exotic-industries-informatron]
menu_singularity_lance=奇点光矛
title_singularity_lance=奇点光矛
turrets-text-6=[item=ei-singularity-lance]奇点光矛是一套异星刃式协议，围绕悬浮棱晶与金字塔祭坛建成。它囤积晶体电荷，直到被选中的直线变成切口。光束不是弹丸，而是一道被拖过空间的判词，让火焰、焦痕与沉默在下一次呼吸里找到目标。
singularity-lance=奇点光矛
singularity-lance-text=[item=ei-singularity-lance]奇点光矛是一台紧凑的异星时代处刑引擎。悬浮晶体吊在金字塔冠顶上方，吞饮巨大的电脉冲，并通过在战场上打开一道明亮创口来回应目标，而不是把每个受害者都当成独立弹丸追踪。
singularity-lance-2=炫彩见证
singularity-lance-text-2=每次耗能射击都会跟随选定目标，直到光束接触。直击与贯穿伤害在接触时结算。研究终末坍缩后，光束接触点会收缩，再释放核心伤害更强的独立范围攻击。黑洞遗言会在同一地点留下一次延迟回响。
singularity-lance-3=见证甄别
singularity-lance-text-3=即使众多长矛同时开火，切线、创伤印记与坍缩预警仍会保留。过量焦痕与装饰优先削减，伤害不依赖视觉演出。
singularity-lance-4=见证誓约
singularity-lance-text-4=当前视觉精度：__1__。所有设置均保留已研究升级的核心形状动画与流动色彩；更高精度增加辉光、冠状闪光、焦痕与声音。放置后查看长矛状态，可读取当前阵营的持续直击DPS。创伤记忆与遗言的额外威力需满足条件。
