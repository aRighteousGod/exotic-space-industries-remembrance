[mod-setting-description]
ei-singularity-lance-visual-fidelity=决定奇点光矛会以多强的烈度记住每一道切口。誓约只触及光束见证、辉光、火焰、焦痕与声响；刃的饥渴、抵达之距、形体与铸造不变。启示见证索取被束缚的显现。解缚见证打碎制御，让棱晶写下世界还能承受的每一道伤。

