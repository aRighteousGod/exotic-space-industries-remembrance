[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=短促光束及所有已研究升级的标志形状，不添加装饰性辉光或焦痕。
ei-singularity-lance-visual-fidelity-standard=光线被清楚记住，然后在伤口成为教义前放手。
ei-singularity-lance-visual-fidelity-cinematic=光束残影持续更久，增加辉光、装饰性焦痕和声音。
ei-singularity-lance-visual-fidelity-maximal=光束残影持续更久。预兆保持精确时序，装饰数量仍受限制。
ei-singularity-lance-visual-fidelity-unbounded=光束残影持续最久。保留旧名称，但装饰上限仍维持世界运转的节奏。

