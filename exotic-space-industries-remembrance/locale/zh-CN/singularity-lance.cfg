[mod-setting-description]
ei-singularity-lance-visual-fidelity=决定奇点光矛如何以光记住每一道切口。所有预设均保留切线、伤痕印记、坍缩预兆和遗嘱轮廓。更高预设增加辉光、光束残影、装饰性焦痕和声音。高负载时仍限制装饰数量；伤害、能耗和射程不变。

