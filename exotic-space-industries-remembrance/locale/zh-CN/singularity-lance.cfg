[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=只允许必要的痕迹越过切口：短促光束、短暂见证、守律的火焰与焦痕。
ei-singularity-lance-visual-fidelity-standard=光线被清楚记住，然后在伤口成为教义前放手。
ei-singularity-lance-visual-fidelity-cinematic=更多切口被允许停留：更明亮的切片、更丰盛的见证，以及伤痕上更长久的辉光。
ei-singularity-lance-visual-fidelity-maximal=棱晶得到受束缚的启示：密集光束与长存见证仍由制御压住。
ei-singularity-lance-visual-fidelity-unbounded=制御被打碎；光矛会把它能迫使世界承受的每一道闪痕都写下来。

