menu_auric_inoculation_vat=金沼接种槽
title_auric_inoculation_vat=金沼接种槽
auric-inoculation-vat=金沼接种槽
auric-inoculation-vat-text=Gleba 的 [entity=ei-auric-inoculation-vat] 并不会直接勾连现成的 [entity=ei-auric-cyst-node]。它会先把周围一片连续的湿地盆地认领下来，再把这具活沼的压力压进一套批次流程，最后催生出新的节点。\n\n[font=default-bold]放置与盆地认领：[/font] 这类接种槽就是给 Gleba 用的。要把它放在认领场真正能碰到足够多湿地地块的位置。有效盆地需要24-160块连通的湿地地块；更大的连通湿地必须切小或分割，而且不能与另一座接种槽共享。足迹重叠会引发冲突；没有有效盆地的接种槽，也就没有稳定的接种对象。
auric-inoculation-vat-2=循环投入与带级缩放
auric-inoculation-vat-text-2=这座接种槽按 [font=default-bold]播种 -> 灌注 -> 发酵（可用 bioflux 选择性富集） -> 排放 -> 绽放 -> 休止[/font] 的顺序运作，而不是被动抽干沼泽。播种消耗[item=spoilage]和[fluid=ei-bio-oil]，灌注消耗[fluid=ei-dirty-water]，发酵消耗[item=jelly]和[item=yumako-mash]。在富集窗口内送入[item=bioflux]，会让这次发酵在排放和绽放前切换为富集发酵。\n\n盆地大小会决定当前带级。b1 对应24-39块已认领地块，b2 对应40-55块，b3 对应56-71块，b4 对应72-87块，b5 对应88-103块，b6 对应104-127块，b7 对应128-160块。同一套带级也会限制盆地内存活的胞囊节点上限：3、4、6、8、10、12、14。带级越高，能容纳的绽放产出越多，但对试剂稳定供给和水处理的要求也越重。
auric-inoculation-vat-3=活力、污染与绽放失效
auric-inoculation-vat-text-3=每个循环都在[font=default-bold]活力[/font]与[font=default-bold]污染[/font]之间拉扯。健康的盆地、喂饱的阶段和可控的带级压力会让活力保持领先。饥饿、排放堵塞、认领冲突以及被压榨过度的湿地地块都会抬高污染，把接种槽推入紧绷状态。\n\n一旦污染撞上失效阈值，绽放稳定性就会崩掉。接种槽会开始把盆地地块降解成更死的湿地状态，并退回休止，而不是维持一次干净的绽放。如果控制台不断从稳定滑向紧绷，就该收紧盆地足迹，或者把循环喂得更厚一点，别等机器把整片沼泽压死。
auric-inoculation-vat-4=囊体洗涤、污水回收与遥测
auric-inoculation-vat-text-4=健康的接种槽会在之后催生新的 [entity=ei-auric-cyst-node]。把它们采下来得到[item=ei-auric-cyst]，再运行[recipe=ei-auric-cyst-washing]，把囊体拆成有用产物，同时把一部分[fluid=ei-dirty-water]送回更大的 Gleba 水循环。接种槽自身的排放阶段也会输出[fluid=ei-dirty-water]，有时还会输出[fluid=ei-acidic-water]；这些出口必须排空，下一阶段才会开始。排放堵塞会把接种槽钉在原地，并持续推高污染，直到管路重新喘过气来。\n\n电路遥测让这片沼泽变得可读。接种槽可以输出[virtual-signal=ei-auric-vat-vigor]、[virtual-signal=ei-auric-vat-contamination]、[virtual-signal=ei-auric-vat-band]、[virtual-signal=ei-auric-vat-claims]和[virtual-signal=ei-auric-vat-bloom]。用它们去比较盆地足迹、为冲突或失效状态报警，或判断洗涤线与排放处理何时该跟着下一档湿地带级一起放大。
