ei-thorium-232-fuel=基于钍-232的核燃料，仅在[color=green]高温反应堆[/color] [item=ei-high-temperature-reactor]中起作用。当在[color=green]高温反应堆[/color] [item=ei-high-temperature-reactor]中使用时，一根燃料棒在120秒内产生[color=orange]30万单位蒸汽[/color] [fluid=steam]。
ei-plutonium-239-fuel=基于钚-239的核燃料。当在[color=green]高温反应堆[/color] [item=ei-high-temperature-reactor]中使用时，一根燃料棒在120秒内产生[color=orange]70万单位蒸汽[/color] [fluid=steam]。
ei-uranium-235-fuel=基于铀-235的核燃料。当在[color=green]高温反应堆[/color] [item=ei-high-temperature-reactor]中使用时，一根燃料棒在120秒内产生[color=orange]60万单位蒸汽[/color] [fluid=steam]。
ei-uranium-233-fuel=基于铀-233的核燃料。当在[color=green]高温反应堆[/color] [item=ei-high-temperature-reactor]中使用时，一根燃料棒在120秒内产生[color=orange]40万单位蒸汽[/color] [fluid=steam]。
ei-burner-inserter=这个机械臂通过燃烧燃料来移动物品。可以从它提取物品的机器中获取[color=orange]可燃燃料[/color]。
