[item-description]
atomic-bomb=钚原子火箭。外面是兼容外壳，里面是完整破口教义。破口先开口，后面的辐射沉降把句子说完。
ei-atomic-bomb-u235=U-235 原子火箭。核心更紧，放射性尾迹也更干净，但依旧没有怜悯。
ei-atomic-bomb-plutonium=钚原子火箭。更宽、更脏的辐射沉降会跟在破口后面。
dw-deer-ammo-atomic-u235=U-235 原子炮兵火箭。为炮架准备的更紧原子核心，沉降也更贴近弹坑。
dw-deer-ammo-atomic-plutonium=钚原子炮兵火箭。给愿意近距离听见它的炮位准备的全面破口语言，外加更宽的辐射沉降。
ei-nuclear-locomotive=X1“歌利亚”原子机车。一台滚动的紧凑反应堆，礼仪像战争罪。要是车体裂开，绿色临界闪光只是通知，剩下的话由沉降来说完。
ei-exotic-magazine-body=教义之前的壳体。钢材、陶瓷，以及足以承载昂贵暴力的纪律。
ei-exotic-magazine-driver=为异装系列提供点火、脉冲时序与释放控制。它教会弹匣如何正确地赴死。
ei-exotic-magazine-core=异装系列的共同心脏：壳体、驱动和爆炸纪律被锁进同一药室。
ei-magazine-payload-compound=结晶能量与炸药调成的混合回答。一发子弹，数重裁决。
ei-magazine-payload-corrosive=被封成装药的硝酸伤口。子弹停下了，争论还在扩散。
ei-magazine-payload-cryo=被纪律束缚的低温粉末。它最大的伤害，是拿走机动和自信。
ei-magazine-payload-oxyfluoride=一包白热的自燃化学物。太亮，太不稳定，也正因此被需要。
ei-magazine-payload-morphium=被说服成为弹道装药的浓缩通元。它以污染而不是毒药的方式进入目标。
ei-magazine-payload-hexafluoride=一间氟化药室，先穿孔，再与毁灭谈判。
ei-magazine-payload-arc=折叠成装药的过充。短促、凶狠、绝不会认错。
ei-magazine-payload-neutron=被压缩成教义的带电中子容器。它会留下某种看不见的东西来收尾。
ei-compound-ammo=异装系列里的第一桩异端。破裂、放电与失稳，被塞进同一个昂贵弹匣。
ei-corrosive-ammo=装满酸液的异装弹匣。第一下只是引子，真正的判决由腐蚀来下。
ei-cryo-ammo=寒控弹匣。当目标已无法继续逼近时，活着也就没那么重要了。
ei-oxyfluoride-ammo=白焰弹匣，把每一次命中都变成化学许可。
ei-morphium-ammo=缓慢污染弹。它伤身体，再让恐惧把余下的算术做完。
ei-hexafluoride-ammo=氟化穿透弹。入体时干净，之后就难以解释了。
ei-arc-ammo=过充弹匣。它不只是打中，而是把目标锁进痉挛里。
ei-neutron-ammo=这一系列里最昂贵的病灶。冲击过去了，光环还在。
ei-orbital-combinator=以三个只读模式镜像同一表面上的平台物流：请求、在途和需求。\n正交相邻的扫描器形成一个共享银行，把大型平台输出分摊到多台扫描器上，并在银行满载时发出 [virtual-signal=ei-orbital-overflow]。\n配线、刷新时效和使用方法请见 Informatron 里的“新物流”页面。
ei-platform-transponder=为平台分配一个势力本地的稳定数字 ID。轨道物流集群按 ID 解析目标，所以平台改名不会打断调度。\n直接打开转发器即可设置或清除手动平台 ID 覆写。
ei-orbital-selector=把轨道物流集群聚焦到单个平台，并重新发布该平台当前的需求清单。支持手动模式、电路读取平台 ID，以及按策略自动挑选候选目标。\n直接打开选择器即可设置模式与目标。新放下的选择器在完成配置前会一直处于空闲状态。
ei-orbital-coordinator=单个表面的轨道物流指挥核心。它维持每个势力与表面只有一个活跃协调器，负责仲裁任务租约，并防止多条发射线路同时扑向同一平台。\n直接打开协调器即可查看它是活跃还是待命，并请求刷新集群。
ei-orbital-dispatch-uplink=把一个火箭发射井接入轨道物流集群。它发布当前任务的混合货单，一次只持有一个租约，并为超大请求提供 Sticky、Single Shot 和 Threshold 三种模式。\n在拥有有效发射井绑定、活跃协调器以及带正需求的选择器任务之前，它都会保持阻塞状态。\n直接打开上行站即可确认、更换或清除它的发射井绑定。

ei-carbide-precipitation-core=一种由碳化钨衍生出的种核，用于稳定金析出。它本就被设计成牺牲品：蒸汽唤醒喷口，核心维持节流，净化器则留下蒸汽吐出的东西。
ei-calcite-bed=一种牺牲性的方解石填料床，用在高温矿物流需要新鲜石质接触面的地方。它扩大反应表面，稳住化学过程，本来就该定期更换。
ei-auric-slag=从含金蒸汽中析出的含金熔渣。里面仍困着热量、矿物颗粒和微量金属；用酸与水洗涤，才能把埋在里面的黄金逼出来。
ei-precipitation-core=一种由碳化钨衍生出的种核，用于稳定含金冷凝。它本就被设计成牺牲品：蒸汽唤醒喷口，核心维持节流，熔炉则留下蒸汽吐出的东西。
ei-cargo-bot=一种能够搬运大量物品的慢速物流机器人。
ei-construction-bot=高速建设机器人
ei-advanced-logistic-bot=高度先进的物流机器人。速度快，运输距离远，并且能够搬运更多物品。
ei-advanced-construction-bot=高度先进的建设机器人。速度快，运输距离远，并且能够搬运更多物品。

ei-excavator=消耗[color=blue]水[/color][fluid=water]来生产[color=orange]每秒15个石头[/color][item=stone]以及[color=brown]脏水[/color][fluid=ei-dirty-water]。
ei-metalworks_1=高速且高效地加工[color=orange]金属锭[/color]。
ei-metalworks_2=高速且高效地加工[color=orange]金属锭[/color]。
ei-metalworks_3=高速且高效地加工[color=orange]金属锭[/color]。
ei-metalworks_4=高速且高效地加工[color=orange]金属锭[/color]。


ei-fluid-heater=通过燃烧来产生热量：
ei-fluid-boiler=通过燃烧来产生蒸汽：
ei-insulated-pipe=这种保温管道是一种特殊类型的管道，可用于输送[color=red]非常热的（气体等离子体）[/color]或[color=blue]冷的流体（液态气体）[/color]，否则这些物质会损坏管道。
ei-insulated-underground-pipe=这种保温管道是一种特殊类型的管道，可用于输送[color=red]非常热的（气体等离子体）[/color]或[color=blue]冷的流体（液态气体）[/color]，否则这些物质会损坏管道。
ei-insulated-tank=这种保温储液罐是一种特殊类型的储液罐，可用于储存[color=red]非常热的（气体等离子体）[/color]或[color=blue]冷的流体（液态气体）[/color]，否则这些物质会损坏储液罐。
ei-cooler=一种用于将气体冷却成液态的超冷装置。使用[color=blue]保温管道[/color] [item=ei-insulated-pipe]来输送液态气体。
ei-data-pipe=专门的数据线缆，可传输[color=blue]计算能力[/color] [fluid=ei-computing-power]。
ei-stone-quarry=这个采石钻机可以从任何地方开采[color=orange]石头[/color] [item=stone]。
ei-electric-stone-quarry=这个电动采石钻机可以从任何地方开采[color=orange]石头[/color] [item=stone]。
ei-deep-drill=这个钻机可以开采矿脉。需要[color=orange]每秒1单位的钻探流体[/color] [fluid=ei-drill-fluid]才能工作。
ei-advanced-drill=这个钻机可以开采矿脉。需要[color=orange]每秒2单位的钻探流体[/color] [fluid=ei-drill-fluid]才能工作。
ei-deep-pumpjack=一种升级后的抽油机。也可以开采[color=blue]低温通量[/color][fluid=ei-cryoflux]、[color=green]生物气[/color][fluid=ei-phythogas]矿床和金析喷气孔。
ei-exotic-assembler=这个组装机可用于制作[color=orange]异域物品[/color]。然而，由于异域物质似乎非常不稳定，它需要放置在[color=blue]物质稳定器[/color]附近以防止其爆炸。
ei-computer-core=需要电力和一些电子元件来提供[color=blue]计算能力[/color] [fluid=ei-computing-power]。连接一根[color=orange]数据线缆[/color] [item=ei-data-pipe]来使用它。
ei-quantum-computer=一台高度先进的计算机。提供各种输入以获取高科技数据。
ei-matter-stabilizer=一种人造的物质稳定器。它可用于稳定[color=orange]异域物质组装机[/color] [item=ei-exotic-assembler]并防止它们爆炸。
ei-copper-beacon=一种液冷插件效果分享塔。需要[color=blue]每秒1单位的液氮[/color] [fluid=ei-liquid-nitrogen]才能运行。在插件效果分享塔过载方面计为[color=orange]1个[/color]插件效果分享塔。
ei-iron-beacon=一种液冷插件效果分享塔。需要[color=blue]每秒2单位的液氮[/color] [fluid=ei-liquid-nitrogen]才能运行。在插件效果分享塔过载方面计为[color=orange]2个[/color]插件效果分享塔。
ei-induction-matrix-core=感应矩阵多结构的核心。每个矩阵只能放置一个核心。
ei-induction-matrix-core-circuit-interface=感应矩阵多结构的核心。每个矩阵只能放置一个核心。通过 signal-C 输出当前电量，通过 signal-T 输出总容量，并通过 signal-M 输出最大输入/输出速率。
ei-induction-matrix-basic-coil=感应矩阵多结构的基本线圈。将矩阵的能量容量增加[color=yellow]25兆焦耳[/color]。
ei-induction-matrix-advanced-coil=感应矩阵多结构的高级线圈。将矩阵的能量容量增加[color=yellow]100兆焦耳[/color]。
ei-induction-matrix-superior-coil=感应矩阵多结构的优质线圈。将矩阵的能量容量增加[color=yellow]1000兆焦耳[/color]。
ei-induction-matrix-basic-converter=感应矩阵多结构的基本转换器。提高矩阵的能量传输速率。
ei-induction-matrix-advanced-converter=感应矩阵多结构的高级转换器。提高矩阵的能量传输速率。计为[color=orange]2个[/color]基本转换器。
ei-induction-matrix-superior-converter=感应矩阵多结构的优质转换器。最多支持4个。计为[color=orange]4个[/color]基本转换器。
ei-induction-matrix-basic-solenoid=感应矩阵多结构的螺线管。当与线圈串联放置在其旁边时可以提高线圈的效率。然而，过多的螺线管会导致矩阵的能量容量下降。
ei-fission-facility=获取与核裂变相关的数据以开发核裂变反应堆。
ei-high-temperature-reactor=需要来自其他反应堆的[color=red]热量[/color]来供电。产生大量蒸汽，并且还可以使用基于[color=orange]钍[/color] [item=ei-thorium-232]的燃料。当使用[color=green]铀-235燃料棒[/color] [item=ei-uranium-235-fuel]时，这台机器可产生500MW的电力。
ei-castor=将你肮脏的[color=yellow]核废料[/color] [item=ei-nuclear-waste]储存在这里。
ei-neutron-collector=从诸如核反应堆、核聚变反应堆等中子源吸收中子，为[color=blue]中子容器[/color] [item=ei-charged-neutron-container]充电。根据收集器与中子源的距离，其效率会发生变化。距离越近，效率越高。效率越低意味着，将一个[color=blue]中子容器[/color] [item=ei-neutron-container] -> [item=ei-charged-neutron-container]的一次充电过程将花费更长时间。
ei-neutron-activator=用来自[color=blue]中子容器[/color] [item=ei-charged-neutron-container]的中子注入各种元素，以获得有价值的核聚变燃料。
ei-fusion-reactor=一种热核聚变反应堆。它可以将各种核聚变燃料融合在一起，加热[color=orange]液铅冷却剂[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]以进行发电。该反应堆可以在各种模式下工作。请务必查看InformaTron维基以获取更多信息。
ei-gauss-module=[font=default-bold]神级插件。[/font] 这个插件可以用于[font=default-bold]任何接受生产率的机器[/font]，但不受某些配方的限制。
ei-small-inserter=一个带有过滤槽的2x2机械臂。可以一次移动整堆物品。
ei-big-inserter=一个带有过滤槽的2x2机械臂。可以高速一次移动整堆物品。
ei-small-inserter-normal=一个2x2机械臂。可以一次移动整堆物品。不能用于过滤物品。
ei-big-inserter-normal=一个2x2机械臂。可以高速一次移动整堆物品。不能用于过滤物品。
ei-module-base=插件的基础。可用于制作各种插件。
ei-photon-cavity=一个设计用于储存光子的腔体。
ei-z-boson-cavity=一个设计用于储存Z玻色子的腔体。
ei-gluon-cavity=一个设计用于储存胶子的腔体。
ei-destill-tower=一种需要[color=red]热量[/color]才能运行的蒸馏塔。可以将[color=orange]残油[/color] [fluid=ei-residual-oil]分离成其组成部分。
