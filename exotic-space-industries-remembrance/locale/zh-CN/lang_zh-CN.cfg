[technology-description]
ei-exotic-magazines=将异装弹匣系列从旧式弹药阶梯中分离出来。壳体、驱动、核心，然后才是装药。弹匣本身成了教义。
ei-corrosive-magazines=让异装系列携带硝酸腐蚀作为第二道创伤。命中撕开伤口，化学继续争辩。
ei-cryo-magazines=把低温粉末封进控制型弹匣。它先夺走速度，再考虑夺命。
ei-oxyfluoride-magazines=把二氟化氧塞进足以装膛的格式里。先是白光，后是后悔。
ei-morphium-magazines=将浓缩通元装入这一系列，把弹道命中变成污染、迟滞与异信号。
ei-hexafluoride-magazines=把六氟化铀化学和穿透体结合起来，让惩罚在入体之后继续。
ei-arc-magazines=把异装弹匣重构成过充牢笼。子弹不只是命中，它会攫住目标。
ei-neutron-magazines=需要带电中子容器，并让弹药学会把辐照当作第二道伤害留下。
ei-auric-precipitation=解锁 Vulcanus 金析喷气孔链。碳化钨被塑造成牺牲性的析出核心，以蒸汽唤醒喷口，并将含金蒸汽凝成高热蒸汽与含金熔渣。产量凶猛，地表危险，窗口有限。
ei-dark-age=异域工业模组的第一个时代。引入最初的基于热能的自动化。
ei-steam-age=异域工业模组的第二个时代。使用蒸汽动力机器来实现基地的自动化并进一步发展。
ei-electricity-age=异域工业模组的第三个时代。利用电力并进入更先进的化学加工领域。
ei-computer-age=异域工业模组的第四个时代。基于计算机的系统将使你能够进一步提高工厂的效率，并实现更复杂任务的自动化。
ei-quantum-age=异域工业模组的第五个时代。核聚变和高科技机械在等着你！
ei-exotic-age=异域工业模组的第六个时代，也是最后一个时代。通过完成一个超级结构的建造来赢得游戏。

ei-steam-assember=基本的基于蒸汽的自动化。
ei-steam-oil-processing=进入基本的石油加工领域，并将其用于基础化学或燃料生产。
ei-electricity-power=进入基本的电力生产领域，并使用电力为你的机器供电。
ei-destill-tower=将石油蒸馏成其组成成分。
ei-computer-core=进入基本的基于计算机的自动化领域。
ei-big-lab=需要高级研究中心来研究更先进的技术。
ei-induction-matrix=感应矩阵是一个巨大的能量存储多结构。更多信息可以在InformaTron维基百科中找到。
ei-neodym-refining=将钕矿精炼成钕锭。这些对于高科技机械来说至关重要。
ei-deep-mining=进入深层领域，并利用它获取更多资源，以及仅在新地星深层才能找到的资源。
ei-moon-exploration=获取月球鱼类并进入太空探索领域。
ei-quantum-computer=进入基于量子计算机的自动化领域。
ei-fluid-boiler=消耗[color=orange]可燃流体[/color]以产生蒸汽。[color=orange]可燃流体[/color]包括石油、石油产品以及一般具有燃料价值的流体。
ei-small-inserter=一个带有过滤槽的2x2机械臂。能够一次移动整堆物品。
ei-big-inserter=一个带有过滤槽的2x2机械臂。能够以高速一次移动整堆物品。
ei-rocket-silo=使你能够向太空发射火箭。

