turrets=防御炮位
turrets-text=Remembrance 大幅扩展了固定防御。从临时近距离火力、蒸汽火炮、腐蚀性喷流武器，到电驱弹幕炮位和遗物级能源平台，整条防线都被重新拉长了。这些炮位并不是[item=gun-turret]机枪炮塔的简单替代品：每一种都要求不同的后勤、不同的杀伤区和不同的升级支撑。\n\n大多数弹道系新增炮塔仍然吃物理弹丸伤害研究，喷流炮塔则跟随火焰伤害路线成长。后期遗物平台更看重极端供电、稀有部件和慎重布局。
turrets-2=霰弹炮塔与加农炮
turrets-text-2=[item=ei-shotgun-turret]霰弹炮塔在黑暗时代解锁，位于机枪炮塔和军事之后。它是典型的贴墙防线答案：15 射程，慢射速，不需要复杂供电，但凡真的冲到墙边的敌人，都会被它硬生生打碎。到了电气时代，它会升级成[item=ei-auto-shotgun-turret]战斗霰弹炮塔，射速翻倍，射程提高到 18，转向更快，并开始消耗持续电力与每发能量，用密集的散弹幕压住狭窄通道。\n\n[item=ei-cannon-turret-mk1]加农炮塔是蒸汽时代的攻城防御步骤。它发射[item=cannon-shell]炮弹，射程 25，最小射程 8，转向慢，但单发打击极重。之后，两座 MK1 再加更重的部件可以合成为[item=ei-cannon-turret]双管加农炮塔：更耐打，射速更高，带电力辅助，射程 30、最小射程 10，更适合在重型目标碰墙前把它们提前抹掉。
turrets-3=酸液与火焰
turrets-text-3=[item=ei-acidthrower-turret]喷酸炮塔是喷火炮塔的腐蚀版本。它的射程是 38，最小射程 9，可以使用[fluid=sulfuric-acid]硫酸、[fluid=ei-nitric-acid]硝酸、[fluid=ei-hydrofluoric-acid]氢氟酸，甚至较弱的[fluid=ei-acidic-water]酸性水，而且每种液体都有各自的伤害倍率。对于更愿意把化工产品武器化、而不是继续烧油的工厂来说，它就是喷流炮塔答案。\n\n原版[item=flamethrower-turret]喷火炮塔也被重做了。EI 把它们移到蒸汽时代，把交战带扩展到同样的 38/9，让它们更早进入准备状态，并显著提高液体消耗。燃料质量现在真正重要：原油仍然能用，但重油、轻油、石油气和[fluid=ei-kerosene]煤油会逐步打出更高伤害，而较差的馏分只能算偏弱的应急燃料。
turrets-4=机枪与激光
turrets-text-4=[item=ei-gatling-turret]机枪炮塔是电气时代的子弹水管。它把一挺装载的[item=ei-minigun]迷你机枪与电驱机构结合起来，带来 32 射程、4 最小射程、优秀的转火能力和极其凶狠的持续射速。代价也和外表一样直接：无休止地吞[item=firearm-magazine]弹匣，再加持续供电。\n\n原版[item=laser-turret]激光炮塔仍然存在，但 EI 把它调整成一种更讲究的电气时代投资。它们的射程和光束长度都被推到 30，科技明确要求[item=battery]电池和[item=advanced-circuit]高级电路，配方也重构为以[item=ei-steel-beam]钢梁、[item=steel-plate]钢板、[item=battery]电池、[item=advanced-circuit]高级电路和[item=ei-energy-crystal]能量水晶为核心。它们因此成了更干净的后勤型炮塔，但不再是廉价的通用答案。
turrets-5=遗物级平台
turrets-text-5=[item=ei-plasma-turret]等离子炮塔是量子时代的堡垒重炮。它体型巨大，会狠狠抽干电网，而且需要感应矩阵部件和多座[item=laser-turret]激光炮塔来制造。作为回报，它会把起步很慢的等离子弹投送到 200 射程外，自身周围保留 40 格安全半径，并在命中后引发巨大的溅射，直接撕碎阵型、工事和地表。\n\n[item=zeus-wrath-zeus-turret]波塞冬装置则通过[technology=zeus-wrath-zeus-wrath]站上更高的遗物阶梯。EI 把它重构成战略武器：350 射程、70 最小射程、每发 1 GJ、极大的储能，以及内外两圈等离子爆炸环。它已经不是守墙炮塔了，而是你用来宣判某个目标必须消失的固定武器。
