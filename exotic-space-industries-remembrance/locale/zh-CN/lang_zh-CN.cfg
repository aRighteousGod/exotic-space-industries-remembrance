ei-mining-satellite=一种可以从各自的太空目的地开采[color=orange]行星岩石[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock]的卫星。每次发射将始终开采[color=red]10000[/color]块岩石。
