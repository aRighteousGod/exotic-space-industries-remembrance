ei-scanner=一种用于分析异星文物的扫描仪。选择一个异星生命形式或文物将开始扫描，返回[color=#d43e8e]异星单位KU[/color]。\n\n[color=red][注意事项][/color] 扫描过程中将摧毁所选的异星生命形式或文物。

