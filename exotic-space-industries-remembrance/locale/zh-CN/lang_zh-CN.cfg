rocket-ammo-schema=火箭弹药结构图
rocket-ammo-schema-text=火箭弹药按层组装：[item=ei-rocket-airframe]弹体骨架、[item=ei-rocket-motor-basic]推进器、[item=ei-rocket-warhead-impact]弹头，然后才是成品弹药。骨架稳住外壳，推进器决定射程，弹头决定伤害类型。炮兵线也遵循同一套逻辑，只是更重，也更不讲情面。
rocket-ammo-schema-2=弹头分支
rocket-ammo-schema-text-2=基础线现在也配得上成本：撞击弹和爆炸弹都更凶，腐蚀弹在手持发射器和炮兵线之间共用同一套化学包，先给一记强酸冲击，再留下持续腐蚀云层去啃结构；冷冻弹则在两条线路之间保持相同的控制持续时间，但命中依旧更有分量。原子线则明确分开，U-235 最终会变成 ESIR 自有的 [item=ei-atomic-bomb-u235]，并带着更紧的沉降包；钚则仍显示为钚原子火箭，保留 vanilla 原子爆炸，并在破口之后留下更宽的放射性污染。
rocket-ammo-schema-3=特效家族
rocket-ammo-schema-text-3=每个家族都有自己的爆炸、烟雾和贴花，这样爆点在运动里仍然清楚，而不是糊成一团白闪。
rocket-ammo-schema-4=炮兵原子线
rocket-ammo-schema-text-4=固定扇面的炮兵发射架现在也可装填 U-235 与钚制的单装或整箱原子火箭。整箱齐射本质上属于自毁式用法：裂变材料的生产与解锁路线依旧分开，U-235 使用更紧凑的 ESIR 中心爆炸与更干净的沉降足迹，钚则保留 vanilla 原子爆炸，但会抛出更宽的放射性污染；若在过近距离开火，破口依旧很可能连炮位一起撕开。
