# PAGES
welcome=欢迎来到异域工业！
welcome-text=这是维基页面。在这里你可以找到关于该模组的信息、其特性和机制。此外，新的发现可能会触发此维基中出现新的条目，所以一定要时不时查看一下。如果你有问题或困扰，请随时在该模组的Discord服务器上提问。你可以在模组门户网站上该模组的描述中找到服务器的链接。
welcome-text-2=在这个模组中有许多新的机器、生产链和独特的特性等待着你去探索，有些比较简单，有些则更具挑战性。一定要好好探索一番！ 
game-related=游戏玩法相关信息
game-related-text=本节包含有关该模组游戏玩法特性和机制的信息。它分为几个子类别。你可以在左侧菜单中找到它们。
overall=总体信息
overall-text=异域工业是一个全面改造的模组，它影响/完全重做了原版《异星工厂》几乎所有方面。自然地，异域工业没有与其他大型模组（如Krastorio 2或太空探索SE）的内置集成。官方模组包中列出的推荐模组，与异域工业有原生集成。为获得最佳体验，建议将这些模组与你自己选择的提高游戏生活质量的模组一起使用。在开始新游戏之前，一定要检查模组设置，因为可以使用它们来调整该模组的一些重要方面。
biters=虫子和敌人
biters-text=在核心星球上，爆炸、寒冰、毒性、装甲、蛛形与电力敌人都由专门的难度阶梯处理，而不是改写地图生成。Nauvis 上，[font=default-bold]ei-default[/font] 仍然与这条阶梯分开，实际被缩放的是依赖里已经存在的敌对原型。打开敌人难度页面查看完整内容。
enemy-difficulty=压力阶梯
enemy-difficulty-text=本页记录的是压在敌对堆栈上的最后一只手。它不会重写 [font=default-bold]ei-default[/font]，也不会凭空捏造第二套生态。它只会弯折依赖虫群里原本就存在的血肉: 撕咬虫、喷吐虫、蠕虫、虫巢、装甲分支、寒冰分支、毒性分支、爆炸分支、母体、蛛形敌人、电力敌人，以及 [entity=tb_infected_ship_boss] 这样的感染结构。
enemy-difficulty-2=如何阅读表格
enemy-difficulty-text-2=每个百分比都以 [font=default-bold]Original[/font] 为基准。[font=default-bold]100%[/font] 表示保持依赖模组的原值。高于 100% 会让该属性更高或更强，低于 100% 会让它更低或更弱。[font=default-bold]攻击间隔[/font] 和 [font=default-bold]生成间隔[/font] 相反：数值越低，攻击或生成越快；数值越高，压力越慢。表中的数值为了便于阅读做了取整。
enemy-difficulty-3=这条阶梯会改变什么
enemy-difficulty-text-3=这条阶梯只会修改属性。它会调整敌方单位生命、正向回复、装甲敌人生命、装甲敌人的正向抗性、攻击伤害、攻击射程、移动速度、攻击间隔、巢穴生命、巢穴回复、生成间隔以及附近单位上限。它不会改写进化权重、污染吸收、加入攻击阈值、result_units，也不会改写敌方武器共用的投射物、光束、云、流体与弹药。五足怪、demolisher、Gleba 生成巢、玩家机器人和机器人港都不在这个范围内。
enemy-difficulty-4=顶级单位额外修正
enemy-difficulty-text-4=Merciful 与 Impossible 还会对利维坦、母体、MAF Boss 链、步行电系 Boss 链以及 [entity=tb_infected_ship_boss] 施加额外的顶级修正。特例 [entity=arachnid-biter-royalwarrior-unit] 会保留普通的单位生命数值，只单独调整它的伤害和移动速度。在 [font=default-bold]Impossible[/font] 下，即使启动开关开启，Nauvis 的宽限也会被禁用。
enemy-difficulty-5=Impossible 反击
enemy-difficulty-text-5=在 [font=default-bold]Impossible[/font] 下，从敌对地表发射火箭还可能把附近已经存在的敌人集结成对发射井的袭击。反击通常会从大约 [font=default-bold]100 到 250 格[/font] 的范围内拉来一支本地战群，常见规模约为 [font=default-bold]8 到 30 个单位[/font]；发射越重，反应越凶。如果发射地表没有本地敌对生态，就不会生成反击小队。
enemy-difficulty-6=边界
enemy-difficulty-text-6=[font=default-bold]Original[/font] 会直接使用依赖模组的数值，不做 EI 的敌人修正。[font=default-bold]Tempered[/font] 是默认设置。高于它会增加压力，低于它会降低压力，但不会改写地图预设本身。
