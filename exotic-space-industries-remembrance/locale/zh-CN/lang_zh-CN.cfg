ei-auric-fumarole-rescan-vulcanus-only=金析重扫拒绝在这片表面上执行。仅限 Vulcanus。
ei-auric-fumarole-rescan-success=Vulcanus 金析喷气孔重扫已为 __1__ 个已生成区块重建待处理的休眠资格队列。
