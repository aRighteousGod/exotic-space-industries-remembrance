[string-mod-setting]
ei-gate-difficulty-Recovered=Recovered
ei-gate-difficulty-Attuned=Attuned
ei-gate-difficulty-Resonant=Resonant
ei-gate-difficulty-Paradox=Paradox
[mod-setting-description]
ei-enable-preliminary-k2so-patch=默认让仍在开发中的 Krastorio2 Spaced Out 兼容层保持关闭。只有在你明确想测试当前这套预备补丁时才启用它。
ei-tech-scaling-maxCost=每项科技的 [color=red]单个[/color] 科学包成本上限。\n[color=pink]Sunday stroll[/color] — 207\n[color=white]Walk in the park[/color] — 415\n[color=#D2B48C]Almost free[/color] — 831\n[color=gray]Very Cheap[/color] — 1662\n[color=white]Default[/color] — 2500\n[color=cyan]More Cheap[/color] — 3325\n[color=blue]Cheap[/color] — 6750\n[color=yellow]Fairly priced[/color] — 12500\n[color=orange]Less Expensive[/color] — 25000\n[color=red]Expensive[/color] — 50000\n[color=purple]Very Expensive[/color] — 100000\nFactorio 仍然把内部研究价格倍率封顶在 [color=red]x1000[/color]，所以 ESIR 会在需要时自动抬高隐藏的有效基础起始价格，让你选的更高上限仍然可达。
ei-tech-scaling-startPrice=曲线里的变量 C。若你选的上限会撞上 Factorio 的 x1000 限制，ESIR 会在后台自动抬高隐藏的有效基础起始价格。\n游戏开始后再改，仍可能出现意料之外的结果。
ei-tech-scaling-additionalMultiplier=曲线和上限结算完成后的额外最终倍率。\n这是存档进行中最安全的调整项。
ei-tech-scaling-curveForm=曲线形式决定研究费用如何上升。linear 走势平稳，quadratic 前缓后重，exponential 前期很软、后期陡升，而 age-ramp 会按时代分段，把压力更多推向后期时代。\n改变这个选项，中途仍可能带来不理想的结果。
ei-gate-difficulty=调整门的调谐阶段与推进节奏。Recovered 保留当前门阶段。Attuned 会把它推到异星时代后期。Resonant 会把它推到量子时代后期。Paradox 会把它推到异域时代。建议用于新存档，或在研究门之前修改。
ei-gate-notifications=显示与门相关的聊天通知，例如目的地更新和低功率警告。
ei-black-hole-notifications=显示与黑洞相关的聊天通知，例如收容失效警告。
ei-matter-machine-notifications=显示与物质机器相关的聊天通知，例如维护、不稳定或供电不足警告。
ei-insulated-pipe-notifications=显示与隔热管道相关的聊天通知，例如汽化、破裂和污染警告。
ei-nauvis-pressure-grace=在电气时代之前，暂时减缓新地星上敌人过快的进化。每 5 分钟检查一次，只会将进化值缓慢拉回到前期时代的目标附近；不会降低污染、不会清除虫巢，也不会让失败变得不可能。
ei-enemy-difficulty=选择 EI: Remembrance 使用的敌人属性阶梯。Gentle 到 Nightmare 只调整敌人的战斗与生成数值。Original 保持 1.0。Merciful 和 Impossible 还会施加少数首领特例。Impossible 还会关闭 Nauvis 缓冲，并在已有敌对生态的敌对表面上把火箭发射污染变成附近敌人的集结反击。

[map-gen-preset-name]
ei-default=异域工业-太空时代

[map-gen-preset-description]
ei-default=游玩异域工业 Remembrance 的推荐方式。你将从 Nauvis（新地星）开始旅程，核心资源与前期基础设施都在这里。\n这里是摇篮，伤痕累累、熟悉，却也充满限制。\nNauvis 的前期敌人压力已被放缓：更大的起始缓冲区、更慢的早期进化，而这份宽限会在电气时代结束。\n后期材料与高级系统将在之后逐步解锁的其他地表等待你。


[damage-type-name]
ei-plasma=等离子
ei-radiological=放射性
ei-morphium=通元
asteroid-anomalies=空间数据异常
asteroid-anomalies-text=每一类差异化小行星都隐藏着一种异常物。这六种异常物会进入专用的[entity=ei-computer-core]配方，在模拟器中变成数据卡，最终重组成[item=ei-space-data]，并在零重力环境中由[entity=ei-quantum-computer]完成处理。\n\n小行星带不只是原料来源。它还是第二条研究前线。
fulgora-day-variation=Fulgora 日长调节器
fulgora-day-variation-text=Fulgora 不会保持固定的日长。在每个周期开始时，模组会根据启动设置的最小与最大倍率重新决定[font=default-bold]昼夜循环时长[/font]。在默认设置下，这意味着 Fulgora 的每一天都可能落在标准周期长度的[font=default-bold]10% 到 200%[/font]之间。
fulgora-day-variation-2=何时适用重投
fulgora-day-variation-text-2=重滚尝试在明亮、稳定的光线窗口期间进行，因此表面不会在黑暗中突然进入新的周期长度。如果 Fulgora 从未提供安全窗口，则故障保护会在大约一个标准天后强制进行更改。\n\n 启动设置定义了信封。每个实际的日子都会在其中选择自己的随机长度。

artifacts=异星文物
artifacts-text=一些文物是由一个古老的文明遗留下来的，这个文明能够利用异域物质的力量。你可以在世界各地找到他们遗留的文物。其中一些甚至可能仍然可以使用。
actifacts-text-2=但是要小心，它们可能由于某种原因未被触碰过……
gate=跨维度传送门
gate-text=跨维度门是穿过受控维度裂口运送物品的空间转运结构。\n\n每一座门都绑定到接收器 ID，而不是原始表面坐标。源端控制台选择接收器，接收锚点占用一个 ID，而电路控制在需要时可以覆盖两者。\n\n传输代价现在同时取决于负载和跨度。同一表面内的短跳仍然便宜。跨星体转运则不是。\n这不是传送门。[font=default-bold]这是会记住自己撕开何处的机器。[/font]
gate-2=接收器和 ID
gate-text-2=门接收器是目的地锚点。每个都声称其力量的最低自由正 ID，除非电路信号 [color=orange]I[/color] 覆盖它。\n\n重复的有效 ID 发生冲突，并且在冲突解决之前无法使用。\n在门控控制台中选择接收器会将门绑定到该接收器 ID，而不是原始位置。
gate-3=门接线
gate-text-3=控制输入从源端读取。\n把导线接到门的可见本体上，就会连到源端用于控制输入的隐藏容器。\n[color=orange]signal-D[/color] 选择接收器 ID。\n[color=orange]signal-E[/color] 在大于 0 时启用门。\n接收器上的 [color=orange]signal-I[/color] 可以覆盖其自动 ID。\n如果 [color=orange]signal-D[/color] 解析到一个有效接收器，电路控制会覆盖手动选择。\n如果 [color=orange]signal-D[/color] 缺失、无效或冲突，门会回退到手动接收器和手动启用状态。
gate-control-signals=Control signals read by the gate
gate-4=门遥测
gate-text-4=门从隐藏的 [entity=ei-gate-circuit-interface] 输出。\n当您想要直接访问门遥测时，该不可见接口可以用作专用连线目标。\n该接口仅在实际连接到外部电路时更新，并且每秒最多刷新一次。\n当门被打开时，[color=orange]ei-gate-active[/color] 为 1 \n[color=orange]ei-gate-energy[/color] 报告存储的能量，单位为 MJ。\n[color=orange]ei-gate-stress[/color] 报告 0-100 范围内的压力。\n使用这些信号来驱动警报、缓冲器或控制逻辑。
gate-telemetry-signals=Telemetry signals emitted by the gate
gate-5=压力和残留物
gate-text-5=每次成功的转移都会增加压力。压力会提高维护成本，延长冷却时间，并且如果流量重复得太快，可能会使接收器饱和。\n\n控制台中的 [font=default-bold]Transit Span[/font] 条会显示当前路线压力。同一表面内的转移仍然便宜，轨道到行星的跳跃会支付一层很高的基础代价，而移动平台接收器会使用实时路线进度。\n\n过度使用也会产生 [item=ei-breach-residue]，这是一种维度疤痕的废品。在变得杂乱之前，应该通过净化器链将其中和。\n闸门是用于突发物流的，而不是用于连续货运的。
gate-6=旧版大门
gate-text-6=仍然指向箱子或原始位置的旧保存将继续工作，直到重新配置为止。\n一旦将门分配给接收器，该接收器就成为事实来源，而旧的原始目的地仅保留信息性。\n这将保留旧的保存，同时将新设置移动到接收器 ID。
gate-7=门调谐
gate-text-7=当前启动调谐： [font=default-bold]__1__[/font]\n\nRecovered 保留当前的门推进阶段。\nAttuned 会把它推到异星时代后期，并显著抬高配方成本。\nResonant 会把它推到量子时代后期。\nParadox 会把它推到异域时代。\n\n调谐会改变门何时可用以及建造成本，不会改变门建成后的运行行为。
drone=无人机端口
drone-text=一个无人机端口，允许接管并控制一架[color=blue]无人机[/color][entity=ei-drone]。放置这个建筑将创建一个相关联的无人机，点击端口时可以显示该无人机。从那里可以“上行链接”到无人机并操控它。无人机可以飞越地形，放置和开采建筑，从其自身的库存中移入和移出物品。然而，它无法战斗。在任何时候，你都可以使用[color=orange]退出（EXIT）[/color]与无人机断开连接，或者使用收回控制权[color=orange]重置（RESET）[/color]将其传送回其站点。让无人机通过传送门飞行将启动运输。
repair=文物修复
repair-text=你可以通过制作[color=blue]文物修复包[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]来修复损坏的异星文物。这将使你能够再次使用它们。修复过程可以通过将修复工具包拖到文物上来启动。请注意，修复工具包在这个过程中会被消耗。
alien=古代异星数据
knowledge-text=留下这些文物的古代文明也留下了他们的一些数据。 
new-logistics=新物流系统
new-logistics-text=异域工业还引入了一些新的物流特性。这些特性分为几个子类别。你可以在左侧菜单中找到它们。
train-progression=火车发展
train-progression-text-2=火车在蒸汽时代就会很早开放。你的第一种选择是[color=orange]蒸汽机车[/color] [item=ei-steam-basic-locomotive]，它可以拉货，但不能运输流体。\n\n随后会解锁[color=orange]高级蒸汽机车[/color] [item=ei-steam-advanced-locomotive]，补上流体运输能力。这两种车型都依赖煤炭、固体生物质等可燃燃料，后期还可以继续吃火箭、核能或聚变燃料来提高表现。\n\n当燃烧变得太脏、太粗暴时，传统铁路会转向[color=brown]柴油燃料[/color] [item=ei-diesel-fuel-unit]和[color=orange]柴油机车[/color] [item=locomotive]。\n\n物流会随着技术继续升级。\n燃料决定边界。\n火车不会问你要去哪里，它只要求有东西可烧。\n\n而当盖娅向你敞开时，铁路会再次分岔。这条分支现在在本节里拥有独立的[font=default-bold]电磁列车[/font]条目，因为它不再是燃烧物流，而是联网供能基础设施。
train-progression-text=在蒸汽时代早期就可以使用火车。起初，你只能建造基本的[color=orange]蒸汽机车[/color] [item=ei-steam-basic-locomotive]，它可以运输物品但不能运输流体。使用改进的[color=orange]高级蒸汽机车[/color] [item=ei-steam-advanced-locomotive]，你也可以运输流体。这两种火车都由可燃燃料（如煤）提供动力。然而，在后期，需要[color=brown]柴油燃料[/color] [item=ei-diesel-fuel-unit]来为更好的[color=orange]柴油机车[/color] [item=locomotive]提供动力。
em-trains=电磁列车
em-trains-text=盖娅并不要求她后期的铁路去燃烧。她要求它们去耦合。[item=ei_charger]电磁充能器会在轨道上方铺开一层晶体场网，[item=ei_em-locomotive]电磁机车连同[item=ei_em-cargo-wagon]货运车厢和[item=ei_em-fluid-wagon]流体车厢，就在这层场网上运行，而不是往炉膛里塞煤或柴油。\n\n因为牵引力来自充能器网络，而不是车上的燃烧装置，同一套车辆既能跑行星内铁路，也能跑离星轨道。盖娅的工程师坚持说，这些晶体并不是在顶着烟、蒸汽，甚至空气前进；它们是在“记住”轨道的几何形状，并沿着那段记忆把整列车拖过去。不管这是物理还是礼仪，它在真空里都工作得很好。
em-trains-2=品质、缓冲期与传输效率
em-trains-text-2=品质现在会同时影响连接的两端。更高品质的[item=ei_charger]充能器可将自身场维持开销最多降低[font=default-bold]20%[/font]，并额外把传输效率再提高[font=default-bold]12%[/font]。更高品质的[item=ei_em-locomotive]机车可将自身所需的场功率最多降低[font=default-bold]16%[/font]。这些加成会按当前启用的品质阶梯归一化处理，所以即使有其他模组加入更多品质等级，它们也会在最低和最高等级之间平滑缩放，而不是死绑原版台阶。\n\n机车品质还会在离开充能覆盖后提供一个[font=default-bold]缓冲窗口[/font]。在最高品质下，场相干性最多还能维持[font=default-bold]480 tick，也就是 8 秒[/font]。普通品质完全没有这段缓冲。它的用途是跨过短缺口、网络接缝或短暂的路径失误，而不是替死区轨道开脱。
em-trains-3=研究与场行为
em-trains-text-3=[font=default-bold]ei_acc[/font]、[font=default-bold]ei_spd[/font]和[font=default-bold]ei_eff[/font]这三条研究线仍然是主要的全局乘区。速度与加速度每级都提供[font=default-bold]+10%[/font]，最高可达[font=default-bold]+200%[/font]。充能器效率共有五级，最高可把网络负担压低到[font=default-bold]少 90%[/font]。在实际供能发生时，本地充能器品质与本地机车品质会再叠加到这些全局研究之上。\n\n实际运作里，好的电磁铁路既靠科技，也靠硬件。只要覆盖持续刷新，列车就会保持场燃料充盈，像沿着导线行走的光一样前进。若覆盖崩塌，系统会先吃掉缓冲储备，之后机车就会变成惰性车体。盖娅能原谅很多事，断场不在其中。
orbital-scanner=轨道物流扫描器
orbital-scanner-text=轨道物流集群从 [entity=ei-orbital-combinator] 开始。它仍然是那个只读的表面扫描器，只会镜像[font=default-bold]空间位置与扫描器当前表面一致[/font]的平台。请求模式发布配置的最低需求；在途模式发布已经承诺送往该平台的货物；需求模式则在扣除在途货物和当前枢纽库存后，给出剩余缺口。\n\n正交相邻的扫描器依旧会组成一个银行，把超大的输出拆成连续页，在银行容量耗尽时发出 [virtual-signal=ei-orbital-overflow]，并且每台持续消耗 [font=default-bold]750 kW[/font]。接入电路网络会让银行保持热状态；未接线的银行在 GUI 打开时仍会刷新，关闭后则转为稀疏维护。
orbital-scanner-2=转发器、选择器与协调
orbital-scanner-text-2=[font=default-bold]集群分工[/font]\n\n[entity=ei-platform-transponder] 放在平台甲板上，为平台分配稳定的数字 ID，后续所有装置都靠这个 ID 识别目标。允许手动覆写，但不同平台共用同一个 ID 时会一直保持冲突，直到你清掉其中一个。\n\n[entity=ei-orbital-selector] 放在调度表面上，一次只提名一个目标。手动模式使用输入的 ID，电路模式读取 [virtual-signal=ei-platform-id]，策略模式则会挑选同表面上尚未被租约占用、且需求为正的平台。\n\n[entity=ei-orbital-coordinator] 是这张表面的唯一仲裁者。每个势力和表面只会保留一个活跃协调器。它负责分配租约，避免多条发射线盲目服务同一个平台。\n\n[entity=ei-orbital-dispatch-uplink] 放在火箭发射井旁边，向工厂重新发布当前租约中的混合货单。请直接打开各个集群实体来使用它们的侧边面板。可见的组合器页面只是只读遥测，不是配置界面。\n\n[font=default-bold]侧边面板会改什么[/font]\n\n转发器面板负责设置或清除手动平台 ID 覆写。选择器面板负责切换模式，并且只会在手动模式下编辑目标 ID。协调器面板会把集群刷新排入队列，管理员还能在那里触发状态重建。上行站面板负责绑定或清除发射井、抓取最近的相邻发射井，并设置超量策略和阈值下限。
orbital-scanner-text-2b=[font=default-bold]先打开侧边面板[/font]\n\n可见的组合器页面只是只读遥测。要改设置，请打开扫描器或其他集群设备的侧边面板，然后按下面的图例去读最上面一行、中间几行和最下面的提示行。
orbital-scanner-3=调度上行站与混合装载
orbital-scanner-text-3=[font=default-bold]启动流程[/font]\n\n1. 先把转发器放到各个平台本体上。\n2. 在调度表面放置至少一个选择器，并通过手动、电路或策略模式给它一个目标。\n3. 在同一张调度表面启用一个协调器。\n4. 把上行站放在火箭发射井旁边。相邻会给出第一个快速选择；之后请在上行站侧边面板里确认、替换或清除绑定，并为这条发射线选择超量策略。\n\n当选择器显示就绪、该表面上有一个活动协调器，而且上行站同时拥有有效的发射井绑定和租约时，这套集群就算真正上线。\n\n[font=default-bold]常见阻塞状态[/font]\n\n无目标表示选择器还没有有效的平台 ID。无需求表示目标平台当前已经没有剩余需求。缺少发射井绑定表示上行站还没有锁定到真实的发射井。缺少活动协调器表示这张调度表面还缺少唯一的活动协调器。\n\nv1 仍然采用混合装载：真正搬货的还是机械臂、列车、请求器和线路电路。粘性模式会让超大任务跨多枚火箭持续保留租约，单发模式会在一次发射后释放，阈值模式则只会在剩余需求高于设定下限时继续服务，因此下限设置只在阈值模式中生效。

steam-bots-text-2=交易的筹码是耐力。蒸汽机器人没有无底的电力储备；它们依靠储存的压力飞行，必须在机器人港耗尽之前返回。如果它们在途中蒸汽耗尽，它们会[font=default-bold]从天上掉下来[/font]，而不是体面地等待救援。\n\n蒸汽机器人港会催促它们尽早回充，但长工单、拥挤的港口和过度延伸的网络，仍然会把早期的便利变成废墟。
loaders-2=堆叠
exotic-stabilizers-text=异域物质不是资源，而是被驯化后仍在咬人的威胁。处理它需要严密收容、精确控制，以及足以承受其不稳定性的机器。\n\n[color=orange]异域物质组装机[/color] [item=ei-exotic-assembler] 是唯一能够处理这种能量特征的结构。即便如此，不稳定仍不可避免 - 组装机可能在受压时爆炸。当晶格仍然维持稳定时，机器会发出可见的收容脉冲低鸣；一旦开始失去控制，那道脉冲就会硬化为噼啪声、弧光放电，以及沉重得几乎可以触摸到的警告。\n\n为降低这种风险，请在组装机周围放置 [color=orange]异域物质稳定器[/color] [item=ei-matter-stabilizer]。这些装置会抑制关键失效事件，并稳定周围的能量场。有些甚至能在世界各处找到 - 那是前一个循环的遗迹。\n[color=gray]品质物质稳定器每个按 3 x (品质 - 1) 个稳定器计算。\n品质异域组装机每秒发生熵级联的概率会降低 (品质 - 1)%，也就是说，不常见会把基础概率从 12% 降到 11%。[/color]\n\n不要把异域物质当成另一种普通原料。\n\n它[font=default-bold]是活的、易变的，而且在注视着你。[/font]
beacon-overhaul-text=异域工业对插件塔影响施加了严格限制：一台机器最多只能受到 4 个插件塔影响。[font=default-bold]无限叠堆的时代已经结束。[/font]\n\n此外，除第一个之外的插件塔现在需要冷却液 [fluid=ei-liquid-nitrogen] 才能运行。没有它们，插件塔就会过热并停机。电力不再是功能的源头 - 物流必须支撑热力学稳定。\n\n为此，插件塔在结构上进行了升级：\n\n增加模块容量\n引入改良插件塔\n计入上限时算作 2 个插件塔\n可容纳更多模块\n需要更多基础设施\n\n[font=default-bold]增幅不再是小事。[/font]\n它是一门机械技艺。\n精确建造 - 否则就会[font=default-bold]落入低效。[/font]
bots-text-2=一旦工厂进入完整的电动机器人阶段，EI 会扩展群体：用于大宗搬运的重型货运机器人、用于激进建造的重型建造机器人，以及后续速度、范围、耐久与任务重点更高的高级变体。[font=default-bold][color=orange]高级机器人港[/color][/font] 通过更快充电、更多机器人槽位和更大的工作半径来支撑那一套后期网络。\n\n这不只是一个无人机网络。[font=default-bold]它是一套机械化群体协议。[/font]
ages-and-tech-text-2=该模组被划分为六个时代，每个时代都是更深一层的递归、机械与控制。它们不是进步的年代，而是支配的门槛 - 每一个都比前一个更暴烈、更无情。\n\n[font=default-bold]黑暗时代[/font]\n一个畸形的诞生。灰烬、腐烂与沉默。你在原始蒸汽与破碎岩石中爬行。没有自动化。一切都要付出鲜血。\n\n[font=default-bold]蒸汽时代[/font]\n石油被发现 - 不是作为资源，而是作为武器。燃烧它来移动，燃烧它来活下去。大地开始尖叫。\n\n[font=default-bold]电气时代[/font]\n电路噼啪作响。机器苏醒。机器人出现 - 不是作为帮手，而是意志的延伸。核火变得合法。血肉落在后面。\n\n[font=default-bold]计算机时代[/font]\n思维被形式化。模块、插件塔、信号 - 心智被分裂在机器之间。优化变成必需品。冗余即死亡。\n\n[font=default-bold]量子时代[/font]\n现实弯折。机器服从的逻辑不属于这个世界。边界溶解。熔炉变得有智能 - 而它不会原谅误用。\n\n[font=default-bold]异域时代[/font]\n一切都在崩解。帷幕已去。你要么支配异常，要么被它吞没。胜利并不保证。它是从失败时间线的骨头里榨出来的。\n\n每个时代都是一个没有反向的棘轮。\n\n[font=default-bold]这里没有天真。[/font]\n\n只有力量 - 暴烈、递归、绝对。
loaders-text-4=EI 装卸机在放置时会自动[font=default-bold]朝向有效连接吸附[/font]，并在附近传送带改变时重新判断绑定。它们检查的是真实可用的传送带、容器、货车与贴轨放置，而不是盲目信任游标的第一次旋转。\n\n实际上，把装卸机放在货车、箱子、机器或贴轨接口旁时，它可能会旋转甚至翻转流向，只为真正锁定那条连接。机器遵循的是实际绑定，而不是第一眼的猜测。
loaders-5=电力胃口
nauvis-pressure-grace-text-2=在[font=default-bold]蒸汽时代[/font]之前，目标上限是[font=default-bold]0.25[/font]。在蒸汽时代研究完成、但尚未进入[font=default-bold]电气时代[/font]之前，目标会上升到[font=default-bold]0.5[/font]。一旦研究出电气时代，宽限会立刻关闭。\n\n如果你关闭该设置，新地星会保留它所积累的一切压力。
nauvis-pressure-grace=新地星进化压力宽限
rocket-launch-pollution-2=曲线模式与烟雾
spidertron=蜘蛛机甲变化
loaders-text-3=[item=ei-express-loader]高速装卸机获得[font=default-bold]一个共享过滤器[/font]，贯穿整个装卸机。[item=ei-turbo-loader]涡轮装卸机与[item=ei-neo-loader]新型装卸机获得[font=default-bold]两个车道过滤器[/font]，可分别控制传送带左右两侧。\n\n到了这个层级，一台装卸机不只决定什么能通过，也能决定它该走哪一侧。
new-mechanics=新游戏机制
spidertron-text=与原版相比，[font=default-bold]蜘蛛机甲会更早可用[/font] - 在仿真时代就能解锁。不过，与新地星版本不同，它不再是自足的奇迹。它需要燃料。\n\n起初，可燃固体就足够了 - 煤、生物质以及类似材料都能让它继续爬行。但随着推进，核燃料和聚变燃料会为速度、加速度与作业范围带来显著加成。\n\n这不只是载具。它是[font=default-bold]升级的平台。[/font]\n\n像 [color=green]Spidertron Patrols[/color] 和 [color=green]Constructron-Continued[/color] 之类的模组包含专门集成，会将它们的系统调整为与异域工业中被修改过的蜘蛛机甲框架对齐。\n\n蜘蛛更早行走了。但它带着目的、重量与需求而行。\n\n喂饱它 - 否则就会[font=default-bold]落后。[/font]
loaders=装卸机
cranes-and-belts-text=异域工业引入了新一阶物流基础设施：[color=orange]Neo 物流传送带[/color] [item=ei-neo-belt]。它由高科技材料制成，吞吐量高达[font=default-bold]每秒 90 个物品[/font] - 超越所有原版运输极限。这些传送带是为终局吞吐量与递归规模工厂而设计的。\n\n此外，模组还加入了[color=orange]起重机[/color] [item=ei-big-inserter-normal] - 为大宗转移而设计的大型高容量机械臂。\n\n可用于：\n\n快速卸载火车\n\n跨越大型库存结构（例如箱子 ↔ 仓库）\n\n在标准机械臂承压失效时维持物资流动\n\n[font=default-bold]速度不再是奢侈品。\n它是基线。\n物流必须随力量扩展，否则就会被力量压垮。[/font]
steam-bots-2=锅炉之血与失败
beacon-overhaul=插件塔重制
bots=更多机器人
rocket-launch-pollution-text=火箭发射会把污染直接倾倒到发射地表。系统会在该地表采样发射势力的进化因子，套用所选的启动曲线，并按配置上限进行缩放。\n\n默认情况下，上限在进化值[font=default-bold]1.0[/font]时为[font=default-bold]10,000 污染[/font]。大多数曲线模式还会保留[font=default-bold]10% 下限[/font]，所以低进化阶段的发射仍然会产生明显影响。
bots-2=后期机器人线路

cranes-and-belts=新的传送带和插入式起重机
loaders-text=[item=ei-loader]装卸机、[item=ei-fast-loader]快速装卸机、[item=ei-express-loader]高速装卸机、[item=ei-turbo-loader]涡轮装卸机与[item=ei-neo-loader]新型装卸机构成了 EI 物流中的直连支系。阶级越高，吞吐越强，但电力胃口也越重。\n\n它们不是把物品抛过空气，而是把传送带流量直接咬合到机器、容器、货车和贴轨接口上。
loaders-text-2=[item=ei-express-loader]高速装卸机最多可堆叠到 [font=default-bold]2[/font]，并且堆叠大小可以调节。[item=ei-turbo-loader]涡轮装卸机同样最多堆叠到 [font=default-bold]2[/font]。[item=ei-neo-loader]新型装卸机会继承游戏中的完整传送带堆叠上限，也可以在需要精细控制时手动调低。\n\n高阶装卸机不只是跟上更快的带速，而是在同一格里推进更密集的物料脉冲。
loaders-3=过滤
loaders-4=吸附与放置
loaders-text-5=所有 EI 装卸机都需要 [font=default-bold]电力[/font]。每搬运一个物品都会消耗内部缓冲中的能量，而阶级越高，内部缓冲与单件耗电都会一起上升。高阶机型更强，但绝不更省。\n\n装卸机可以靠内部储能短暂扛过掉电，但若没有稳定电网支撑，就无法长时间维持满吞吐。
bots-text=Remembrance 不等待清洁电动物流才将机器投放到空中。机器人进程开始于 [font=default-bold]蒸汽时代[/font] 和 [item=rp-steam-roboport], [item=rp-steam-logistic-bot]， 和 [item=rp-steam-construction-bot]，然后成熟为更重、更先进的电群。\n\n结果是与空中自动化建立了异常早期的关系：首先是粗糙的，然后是优雅的。
steam-bots=蒸汽机器人
steam-bots-text=这些不是抛光的电动无人机。他们是由活塞、压力和粗略计算托起的黄铜身体的工人精神，是这个仍然充满热金属和潮湿蒸汽气味的行业的第一批空中仆人。\n\n因为蒸汽机器人港口线位于 [font=default-bold]蒸汽时代[/font] 后来香草机器人在它后面进行了修补，你获得飞行后勤和建筑帮助的时间远远早于正常运行所允许的时间。
new-mechanics-text=异域工业引入了许多新机制。这些机制分为几个子类别。你可以在左侧菜单中找到它们。
specialised-pipes=专用管道和数据电缆
specialised-pipes-text=异域工业把流体载具当作封存硬件，而不是可以互换的管线。\n\n[color=orange]绝缘管道[/color]能让[fluid=ei-liquid-oxygen]、[fluid=ei-liquid-nitrogen]和[fluid=ei-heated-helium-3]这类低温、热态以及化学上凶险的流体保持稳定。[color=orange]数据电缆[/color]承载[color=blue]模拟基质[/color] [fluid=ei-computing-power]，不是通用流体管线：把普通化学物质灌进去，导管就会短路。\n\n当你选择一种载具时，你也在选择这条线允许承受哪一种失败。
specialised-pipes-2=失效类型
specialised-pipes-text-2=非绝热管道、地下区段、高架管线和储罐并不会以同一种方式失效。[fluid=ei-liquid-nitrogen]液氮和[fluid=ei-liquid-oxygen]液氧在普通管路里会重新汽化回气体。[fluid=ei-heated-helium-3]高温工艺流体和熔岩会以高温破裂，氟酮和电解液则会以化学排放把管线冲坏。\n\n储罐的破裂会比一段普通管线更沉重，而[font=default-bold]高架管道能把占地收得更紧，避免大面积甲板污染。[/font]
specialised-pipes-3=封存纪律
specialised-pipes-text-3=绝缘管道同样无视常规管线的加热需求。绝缘管道、地下绝缘管道和绝缘储罐原型都使用[font=default-bold]0 加热能耗[/font]，因此在 Aquilo 或任何其他寒冷地表上都不需要外部供热来避免冻结。\n\n当流体必须保持精确配方时就用它们：冷液体保持寒冷，反应性混合物继续受控，而普通管路会放气、短路或爆裂的地方，专用管线仍能存活。
specialised-pipes-4=特征与监控
specialised-pipes-text-4=破裂后的表现现在取决于载具和污染物。在混合管段里，破裂会跟随真正威胁该段载具组合的污染物，即使那种流体不是占比最大的那一份。数据故障会放电并短路，低温故障会喷出霜雾，热故障会灼烧发热，化学故障会喷出薄雾或腐蚀性排放。数据电缆即使遇到热性或化学性污染也不会起火，而高架管会把影响限制在局部。重复发生在同一管段的故障会被限流，这样一条坏线就不会用重复的后果刷满屏幕。\n\n如果你需要检查一座运行中的工厂，`/ei_runtime_status` 里 `fluid(t/u/d/s/cursor/mode)` 表示跟踪数 / 紧急数 / 待复查管段数 / 扫描数 / 服务游标 / 下一服务模式，`fluidfx(qh/ql|sh/sl)` 表示重/轻效果入队数 | 重/轻效果抑制数，`rupture(mode/a/p/d|ob/oi)` 表示表现精度模式 / 活动作业 / 待处理环层 / 已计划延迟桶 | 逾期桶 / 逾期条目。
ei-runtime-status-enabled=已启用 ESIR 运行时遥测。
ei-runtime-status-disabled=已禁用 ESIR 运行时遥测。
ei-runtime-status-usage=用法：/ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off]（不带参数运行可打印实时运行时摘要）。
ei-runtime-status-command-help=默认打印 ESIR 的实时运行时摘要。可通过同一命令使用 snapshot、auric、auric-detail、telemetry-on 或 telemetry-off。
incompatible-pipe-data-1=[img=utility/warning_icon]数据污染 [fluid=__1__] [color=red]短路失效[/color] [color=black]__2__[/color] 于 __3__。
incompatible-pipe-data-2=[img=utility/warning_icon]数据污染 [color=red]短路失效[/color] [color=black]__1__[/color] 于 __2__。
incompatible-pipe-cryo-1=[img=utility/warning_icon]低温过载 [fluid=__1__] [color=red]破裂[/color] [color=black]__2__[/color] 于 __3__。
incompatible-pipe-cryo-2=[img=utility/warning_icon]低温过载 [color=red]破裂[/color] [color=black]__1__[/color] 于 __2__。
incompatible-pipe-thermal-1=[img=utility/warning_icon]热破裂 [fluid=__1__] [color=red]破裂[/color] [color=black]__2__[/color] 于 __3__。
incompatible-pipe-thermal-2=[img=utility/warning_icon]热破裂 [color=red]破裂[/color] [color=black]__1__[/color] 于 __2__。
incompatible-pipe-chemical-1=[img=utility/warning_icon]化学破损 [fluid=__1__] [color=red]蚀穿[/color] [color=black]__2__[/color] 于 __3__。
incompatible-pipe-chemical-2=[img=utility/warning_icon]化学破损 [color=red]蚀穿[/color] [color=black]__1__[/color] 于 __2__。
phase-shift-pipe-1=[img=utility/warning_icon]低温流体 [fluid=__1__] [color=blue]沸腾逸散[/color] 于 [color=black]__2__[/color] 内 __3__。
phase-shift-pipe-2=[img=utility/warning_icon]低温流体 [color=blue]沸腾逸散[/color] 于 [color=black]__1__[/color] 内 __2__。
pipe-breach-generic=管道破裂
pipe-breach-data=数据短路
pipe-breach-cryo=低温破裂
pipe-breach-thermal=热破裂
pipe-breach-chemical=化学破损
pipe-breach-phase-shift=低温排放
space-destinations=太空目的地
space-destinations-text=[color=orange]火箭发射井[/color] [item=rocket-silo]可用于将其货物发送到不同的目的地。当它在计算机时代首次解锁时，你只能将卫星发送到[color=green]新地星轨道[/color]。根据发送的卫星或火箭货物的类型，你可以接收到数据或其他有用的发射产品。
space-destinations-2-text=随着你的推进，你所在的太阳系内外的各种目的地将变得可用。根据所选目的地的距离，你将或多或少地需要火箭燃料。此外，一些目的地需要首先被发现，要么通过发送专门的[color=orange]探索卫星[/color] [item=ei-exploration-satellite]，要么在发送载有普通货物的火箭时偶然发现。一些新的目的地可能位于深空，[color=purple]超出太阳系[/color]。请注意，即使发送探索卫星，发现新目的地也总是取决于运气。  
induction-matrix=感应矩阵
induction-matrix-text=[color=orange]感应矩阵[/color]是一种复合机器，可用于存储大量能量。它可以像普通蓄电池一样存储多余的电力，然后在以后释放。通过研究相应的科技，可以解锁不同等级的矩阵规模。
induction-matrix-2=感应矩阵组件

exotic-stabilizers=异域物质稳定器

black-hole=黑洞发生器
black-hole-text=强大的[color=orange]黑洞发生器[/color]是一种能够利用物质本身能量的机器。建造这台机器并使其达到[color=green]完全运行[/color]状态就能赢得游戏。为了使这个反应堆运行，你将需要大量的建筑材料、稳定的可消耗物质供应以及大量的电力。因此，考虑事先建立良好的[color=orange]核聚变反应堆[/color]基础设施或一些高端的[color=orange]感应矩阵[/color]装置。
black-hole-2=反应堆组件
fission-reactors=核裂变的变化
fission-reactors-text=在这个模组中，核裂变能量发生了变化。[color=orange]核反应堆[/color] [item=nuclear-reactor]不再获得邻接加成，并且能量输出增加。与原版相比，铀更难获取。回收用过的燃料棒可以在新的燃料棒中重复使用核裂变产物，以提高效率。需要处理[color=brown]核废料[/color] [item=ei-nuclear-waste]。
fission-reactors-2-text=[color=orange]高温核反应堆[/color] [item=ei-high-temperature-reactor]是一种新的核裂变反应堆，可用于产生更多的能量。当加热到其工作温度并供应极大量的水和一根燃料棒时，它比热交换器更有效地产生大量蒸汽。它甚至可以使用原本不可裂变的[color=brown]钍[/color] [item=ei-thorium-232-fuel]燃料。
fusion-power-text=[color=orange]核聚变反应堆[/color] [item=ei-fusion-reactor]是一种新的机器，可以通过将轻原子聚变在一起来产生大量能量。它通过[color=orange]铅冷却剂[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]循环进行冷却。然而，建造这个反应堆相当昂贵，并且需要持续输入燃料。在开始时，最好的燃料选择是[color=blue]锂[/color]和[color=blue]氕[/color]。在后期，你也可以使用[color=blue]氘[/color]和[color=blue]氚[/color]作为燃料，甚至[color=blue]氦-3[/color]。
