menu_auric_fumarole=金析喷气孔
title_auric_fumarole=金析喷气孔
auric-fumarole=金析喷气孔
auric-fumarole-text=Vulcanus 记得伤口会在哪里重新裂开；下面的规则都是字面意义上的，不是象征。\n\n[font=default-bold]它们能出现在哪里:[/font] 金析喷气孔只会出现在 Vulcanus。它们只能生成在火山性非熔岩地面上。距离表面原点 3 个区块以内的区块出现概率为 0；超过这片死区后，概率会平滑上升，并在距离原点 32 个区块时达到完整权重。\n\n[font=default-bold]首次出现:[/font] 新生成的外缘区块只会进行一次按距离加权的轻量即时播种，不会一开始就把整片外围灌满喷口。如果这次轻量播种失败，该区块会进入休眠登记，而不是被忘记。重扫与旧存档回填只会为已生成的 Vulcanus 区块重建休眠资格，不会强行再来一波即时喷发。\n\n[font=default-bold]产量与寿命:[/font] 每个喷气孔生成时带有 4000-8000 的产量。如果无人抽取，它会在一个确定性的 35-65 分钟窗口后自行封闭。一旦被抽取，它就会一直存在，直到耗尽。封闭或耗尽的地点会冷却约 60 分钟，并附带一个很小的确定性抖动，之后可通过休眠系统再次返回。
auric-fumarole-2=生成纪律与重扫
auric-fumarole-text-2=[font=default-bold]休眠调度:[/font] 每 30 秒，脚本会在全局范围内重新检查最多 6 个休眠区块。普通休眠区块仍然先进行一次 0.25% 的基础喷发判定，然后再叠加距离权重、硫酸调制、局部压制，以及生成区域距离带的充填修正。\n\n[font=default-bold]距离带调节:[/font] 已生成且合格的 Vulcanus 区块会按距离原点的 3-6、6-16、16-24、24-32 与 32+ 区块带进行追踪。欠额带会获得更强的休眠恢复压力，过满带会自然降温，而恢复尝试会优先瞄准最弱的距离带，避免某一个已探索区域长期垄断未来喷口。\n\n[font=default-bold]局部压制与保底:[/font] 6 个区块范围内附近的活跃金析喷气孔会按距离降低休眠几率，而不是靠一个硬性数量直接切断。更近的喷口压制更强，多个附近喷口会叠加压力。如果 Vulcanus 连续 5 分钟低于 2 个活跃金析喷气孔，旧的 keepalive 路径仍会在每个脉冲中强制进行最多 2 次应急恢复尝试。\n\n[font=default-bold]放置与重扫:[/font] 喷气孔不必落在区块正中心；放置位置可在区块内变化，并会尝试最多 24 个候选位置。金析喷气孔之间保持 64 格间距。硫酸间歇泉只会阻止约 16 格内的非常近重叠，不再是整片 32 格禁区。/ei-auric-fumarole-rescan 命令只在 Vulcanus 上可用，并会为已生成区块重建休眠资格，而不是制造另一波即时泛滥。
