menu_railgun_cooling=轨道炮冷却
title_railgun_cooling=轨道炮冷却
railgun-cooling=轨道炮冷却
railgun-cooling-text=轨道炮整机是在炮体上降温的，而不是把弹药改造成另一种冷却弹。冷氟酮在炮座处被消耗，热氟酮必须被回收；当冷却回路跟不上时，武器会自行阻塞。\n\n这是有意如此。炮体会发热，炮身会保留一段短暂余辉，而支撑持续开火的正是冷却系统。
railgun-cooling-2=冷却回路与备用配方
railgun-cooling-text-2=常规运作是在炮座消耗冷氟酮。回路供给不足时，轨道炮会累积热负债，关闭自身并进入恢复，而不是假装这一发是免费的。\n\n我们还提供一个基于冰的备用配方，用来在液氮不是唯一答案时生成冷氟酮；多余热量会以蒸汽形式排出。
railgun-cooling-3=地表差异
railgun-cooling-text-3=不同地表的散热速度不同。太空平台散热最慢，大气世界散热更快。Aquilo 的自然回冷最快，Vulcanus 会保持高温更久，而稀薄或低污染地表介于两者之间。同样的轨道炮，固定在不同地方就会表现得很不一样。
railgun-cooling-4=恢复与状态
railgun-cooling-text-4=正常的轨道炮不会长时间停留在固定队列中。只有过热或被阻塞的炮才会进入恢复流程，并且在热负债清除、热输出路径重新可以接收废热氟酮之前保持关闭。\n\n因此状态提示很有意义：绿色表示就绪，黄色表示恢复中或输出受阻，红色表示冷却硬件缺失或严重过热。
