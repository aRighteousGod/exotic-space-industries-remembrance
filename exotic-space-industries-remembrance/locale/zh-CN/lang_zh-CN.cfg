ages-and-tech=科技时代
ages-and-tech-text=Exotic Industries 不再把研究费用做成原版那种平直阶梯。这个模组仍然用[font=default-bold]起始价格[/font]、[font=default-bold]曲线形状[/font]和具名的[font=default-bold]上限档位[/font]来生成研究成本，只是 [font=default-bold]linear[/font] 走得平稳，[font=default-bold]quadratic[/font] 前期更缓、后期更重，[font=default-bold]exponential[/font] 前期很软、后期陡升，而 [font=default-bold]age-ramp[/font] 会把压力更多推向后期时代。\n\n时代门槛还是决定哪些分支能解锁，但缩放决定了窄冲有多疼。它仍然沿用现有的科技权重库，所以被降权的科技推进更慢。
tech-2=启动设置实际控制什么
tech-text-2=[font=default-bold]起始价格[/font]仍然指曲线起点附近每个科技瓶的单价。[font=default-bold]上限档位[/font]仍然决定远端每包的大致目标区间，从 Sunday stroll 到 Very Expensive。[font=default-bold]曲线形状[/font]现在也包含 age-ramp，它会把更多成本送到后期时代，而[font=default-bold]额外倍率[/font]仍然会在曲线计算完成后再缩放最终结果。\n\n如果你选的上限会碰到 Factorio 的 [font=default-bold]x1000[/font] 限制，ESIR 现在会自动抬高隐藏的有效基础起始价格，让更高的上限仍然可达。\n\n如果你想重调 EI，请继续使用这些内部设置，而不是原版的研究倍率。这个模组默认由自己接管这部分进程，原版倍率描述的也不是同一种曲线。
tech-3=实际极限与中途改动
tech-text-3=具名的[font=default-bold]上限档位[/font]本身不是绝对保证。Factorio 仍然会把内部研究价格倍率封顶在 [font=default-bold]x1000[/font]，所以游戏里的真实上限依旧和你选的[font=default-bold]起始价格[/font]有关。ESIR 现在会在需要时自动抬高隐藏的有效基础起始价格，让更高的上限仍然可以被表达出来。\n\n[font=default-bold]额外倍率[/font]仍然是最适合在存档进行中调整的参数。开始一局之后再去改[font=default-bold]起始价格[/font]或[font=default-bold]曲线形状[/font]，都有可能带来不理想或难以预料的结果。
tech-output=当前时代进度
tech-output-text=你接下来需要推进到的时代是[font=default-bold]__3__[/font]。为了解锁下一个时代，你目前已经研发了所需科技的[font=default-bold]__1__ / __2__[/font]百分比。
world-gen-related=世界生成相关信息
world-gen-related-text=本节说明该模组引入的世界生成系统。为保证结构清晰，它被划分为若干聚焦的子类别。\n\n可通过左侧菜单访问。\n这些不是装饰性改动。\n它们从根本上决定了地形、资源行为与空间逻辑。\n\n[font=default-bold]理解这一层，否则你就会被它塑形。[/font]
resources=新资源系统
resources-text=Exotic Industries 重构了资源系统。传统矿区不再是唯一的获取方式，资源如今被划分为不同类别，每一类都有自己的逻辑、生产流和空间行为。\n开采不再是件简单事。\n[font=default-bold]获取资源需要适应。[/font]\n理解类别，否则什么也造不出来。
stone=石头
stone-text=石头是整个系统里最丰富的资源。你仍可通过地表矿区常规开采它，但 Exotic Industries 扩展了它的获取途径：\n\n[color=orange]地表采集机[/color] [item=ei-burner-surface-harvester] 可以在任何地形上进行深层采集。\n\n[font=default-bold]手动收集仍然可行，只是效率很低。[/font]\n石头无处不在。\n效率是可选的，产出不是。
surface-patches=地表矿区
surface-patches-text=Nauvis 的地表并不均匀。在着陆区周围，地壳仍维持为一片受保护的工业储备区：[item=ei-poor-iron-chunk]铁、[item=ei-poor-copper-chunk]铜、[item=coal]煤、[item=stone]石头，以及附近受[fluid=crude-oil]原油压力支撑的油田，仍足以建立最初的工业基础。\n\n越过这片摇篮地带，地表便开始碎裂。[item=ei-poor-iron-chunk]铁、[item=ei-poor-copper-chunk]铜，甚至[item=ei-poor-uranium-chunk]铀，大多只以浅层残余、断裂带和枯竭疤痕区的形式存留。它们确实存在，但不足以支撑持久的金属经济。\n\n煤、石头与石油仍是 Nauvis 运转着的表皮。利用这片储备建立热力、传送带和化工体系。之后就得学会正确读懂地形，否则地壳会欺骗你。
veins=深层矿脉
veins-text=矿脉在开局时无法开采。它们需要[color=orange]深层钻机[/color] [item=ei-deep-drill]，一种为垂直产出而设计的中期采掘系统。\n\n这些矿脉不再以泛泛的稀有度掷骰方式生成。Nauvis 上的结构性金属会沿着[font=default-bold]金属带[/font]与[font=default-bold]沉积盆地[/font]分布：[item=ei-iron-chunk]铁与[item=ei-copper-chunk]铜偏向山脊地带，而[item=ei-coal-chunk]煤与[item=ei-sulfur-chunk]硫则在较低的盆地地形中聚集。\n\n[font=default-bold]热液前缘[/font]会在受保护的起始区域之外带来[item=ei-lead-chunk]铅与[item=ei-gold-chunk]金。[font=default-bold]外缘疤痕地[/font]蕴藏[item=ei-uranium-chunk]铀，而只有这些破碎地带中最稀有的异常口袋才会暴露[item=ei-neodym-chunk]钕。\n\n包括铀、铅、金、钕和沉浸岩在内的关键材料，只存在于这些深层地带。\n它们不是可选项。\n它们是结构性的。\n\n[font=default-bold]地表采矿无法带你走到终局。[/font] 去钻探，去读懂地形，否则就只能停滞。
chunk-grades=贫矿块与富矿块
chunk-grades-text=并不是所有矿块都一样。[item=ei-poor-iron-chunk]贫铁块和[item=ei-poor-copper-chunk]贫铜块，是破碎上层地壳里残留下来的浅层、受污染碎块。它们的意义是让你起家，而不是长期养活整套工业。它们的低品位会立刻体现在冶炼上：[font=default-bold]3 个贫矿块 -> 1 块板材[/font]，而且还会带来更多炉渣。\n\n来自深层矿脉的[item=ei-iron-chunk]铁块和[item=ei-copper-chunk]铜块，才是真正的矿体。即使不做进一步处理，[font=default-bold]3 个优质矿块 -> 2 块板材[/font]，炉渣压力也低得多。[item=ei-poor-uranium-chunk]贫铀块也遵循同样的规律：地表只给你一点迹象，真正的[item=ei-uranium-chunk]铀仍在深层。
chunk-refining=净化器与纯矿
chunk-refining-text=[item=ei-purifier]净化器是第一台真正提升矿块品质，而不只是勉强接受它们的机器。它会用[fluid=water]水清洗[item=ei-iron-chunk]铁块和[item=ei-copper-chunk]铜块，把它们变成[item=ei-pure-iron]纯铁或[item=ei-pure-copper]纯铜，同时产出需要处理的[fluid=ei-dirty-water]脏水。\n\n这一步非常值得。[font=default-bold]3 个贫矿块 -> 1 块板材[/font]，[font=default-bold]3 个优质矿块 -> 2 块板材[/font]，而[font=default-bold]1 份纯矿 -> 2 块板材[/font]，且[font=default-bold]炉渣概率只有约 1%[/font]。深层矿块让真正的金属经济成为可能，净化则让它变得更紧凑、更干净、更工业化。
chunk-refining-2=电弧炉与等离子加热器
chunk-refining-text-2=[item=ei-arc-furnace]电弧炉把矿块处理推进到真正的冶金阶段：它能把矿块、纯矿、板材和零件熔成[fluid=ei-molten-iron]熔融铁与[fluid=ei-molten-copper]熔融铜，接入后续的铸造链。它确实也能吃贫矿块，但数字已经说明了为什么你不该止步于此：[font=default-bold]3 个贫矿块只能得到 15 单位熔融金属[/font]，而[font=default-bold]1 份纯矿可以得到 40 单位[/font]，几乎不再产生炉渣。\n\n[item=ei-plasma-heater]等离子加热器会在量子时代延续这条路线。它仍然可以处理电弧炉的金属配方，同时解锁极端高温的气体与等离子流程。净化器提升原料品质，电弧炉提升冶金层级，而等离子加热器则把整条链一路带到后期。
mining-scars=采矿伤痕
mining-scars-text=耗尽沉积物不再使地形保持不变。当提取完成时，Exotic Industries 可能会在附近的地面上留下疤痕，但仅限于 [item=ei-burner-quarry]、[item=ei-steam-quarry]、[item=ei-electric-quarry] 和 [item=big-mining-drill]。\n\n 每个耗尽事件都可以在耗尽矿床附近的随机偏移处播种一个小疤痕斑块。效果是地形损害，而不是奖励资源脉冲。
mining-scars-2=行星退化
mining-scars-text-2=疤痕会沿着行星特定的链降解瓷砖：Nauvis 草塌陷成泥土和沙子，Fulgora 岩石脱落成沙子、灰尘和沙丘，Gleba 腐烂，Vulcanus 炭化，Aquilo 压实雪和冰。水瓦片和隐藏瓦片将被忽略，匹配的装饰物将被剥离。\n\nT将伤痕视为地图，记住您从中获取的内容。
asteroid-variants=分化的小行星
asteroid-variants-text=Exotic Industries 在普通太空碎片之上添加了六个额外的小行星家族：[item=ei-chemical-asteroid-chunk]、[item=ei-organic-asteroid-chunk]、[item=ei-rock-asteroid-chunk]、[item=ei-uranium-asteroid-chunk]、[item=ei-petrified-asteroid-chunk] 和 [item=ei-scrap-asteroid-chunk]。它们被分层到行星路线中，在 [entity=crusher] 中破碎，所有 12 个基本和高级 EI 小行星配方都受益于 [font=default-bold] 行星生产力 [/font].\n\n 破碎机还通过流体端口和更大的结果库存进行了扩展，因此这些混合输出适合。
chemical-asteroid=化学小行星
chemical-asteroid-text=通过 [font=default-bold] 星球发现解锁：Aquilo[/font]。基本和高级粉碎从块中拉出[fluid=ammonia]、[item=ei-fluorite]和[fluid=fluorine]，而高级配方还可以额外滚动[fluid=lithium-brine]。他们的罕见异常是[item=ei-neuro-reactive-residue]。
organic-asteroid=有机小行星
organic-asteroid-text=通过 [font=default-bold] 星球发现解锁：Gleba[/font]。基础破碎消耗[fluid=water]，产出[item=spoilage]、[fluid=ei-bio-sludge]、[fluid=ei-ammonia-gas]。高级通证增加了[item=nutrients]，可以返还[item=yumako]、[item=jellynut]、[item=ei-bio-matter]，甚至是稀有的[item=pentapod-egg]。他们的异常是[item=ei-sporeglass-heart]。
rock-asteroid=岩石小行星
rock-asteroid-text=通过 [font=default-bold] 星球发现解锁：Vulcanus[/font]。基本配方主要是[item=stone]。高级配方开启更丰富的矿物层：[item=tungsten-ore]、[item=calcite]、[item=ei-gold-chunk]。他们的异常是[item=ei-gravity-braided-ore]。
uranium-asteroid=铀小行星
uranium-asteroid-text=一旦 [font=default-bold] 空间平台 [/font] 研究即可解锁，可以进入差异化领域。两种食谱均消耗 [fluid=sulfuric-acid]。作为回报，它们会产生 [item=stone]、[item=ei-uranium-chunk] 和 [item=ei-lead-chunk]，先进的配方会花费更多的酸来获得更强的铀回报。他们的异常是[item=ei-isotopic-ghost-shell]。
petrified-asteroid=石化小行星
petrified-asteroid-text=也可通过 [font=default-bold] 空间平台 [/font] 解锁。基本粉碎给出了 [item=wood]、[item=raw-fish]、[fluid=ei-liquid-nitrogen] 和 [fluid=ei-liquid-oxygen] 的奇怪组合。高级通行证增加了[item=bioflux]和[fluid=fluoroketone-cold]，改善了生物滚动，甚至允许[item=biter-egg]的小机会。他们的异常是[item=ei-chrono-fossil-shard]。
scrap-asteroid=废弃小行星
scrap-asteroid-text=通过 [font=default-bold] 星球发现解锁：Fulgora[/font]。这些配方被连接到废料回收表中，因此粉碎它们成为废品流，而不是单一输出的矿石配方。两层都保留其 [item=ei-crushed-neodym] 卷，并且都很少会暴露 [item=ei-worm-torn-relay-core]。\n\n 如果您希望轨道垃圾变成工厂库存，这就是路线。
crystal-accumulator-resonance=Crystal accumulator resonance
crystal-accumulator-resonance-text=Crystal accumulators are not ordinary batteries. They are alien resonance shells seeded into generated relic clusters, and the useful way to read them is through [font=default-bold]load[/font] and [font=default-bold]coherence[/font], not a simple on/off toggle.\n\nIn the current live shell ladder, the unstable profile can sit at a [font=default-bold]4 MW low shell[/font], a [font=default-bold]7.5 MW base shell[/font], or a [font=default-bold]10 MW surged shell[/font]. Gaia resolves the same geometry into a [font=default-bold]15 MW Gaia shell[/font]. Offline husks sit outside that ladder entirely until repaired.
crystal-accumulator-resonance-2=Nauvis profile
crystal-accumulator-resonance-text-2=Nauvis is the explicit grounded profile for the unstable shell. When you discover or place [item=ei-crystal-accumulator] there, read it as the baseline resonance case: productive, alien, and never quite settled.\n\nThe shell may drift between low, base, and surged rungs, but it remains the same unstable class. Nauvis is not the cure. It is the reference wound.
crystal-accumulator-resonance-3=Other surfaces and orbit
crystal-accumulator-resonance-text-3=Outside Nauvis, treat non-Gaia planets and orbital platforms as foreign-profile space. The unstable shell can still operate there, but it does not gain stability simply by leaving its point of discovery.\n\nGaia is the exception. There the same chassis resolves into [item=ei-crystal-accumulator-gaia]the stable crystal accumulator, doubling base output from [font=default-bold]7.5 MW to 15 MW[/font] and lifting the whole shell ladder with it.
crystal-accumulator-resonance-4=Quality is not coherence
crystal-accumulator-resonance-text-4=Do not confuse [font=default-bold]quality[/font] with [font=default-bold]resonance profile[/font]. Quality is the usual item layer; low shell, base shell, surged shell, Gaia shell, and offline husk are shell states this page is documenting.\n\nIf a crystal item carries quality, that does not replace the load/coherence read. The page legend is about how the lattice is singing, not how finely the item rolled.
crystal-accumulator-resonance-5=Mining and repair
crystal-accumulator-resonance-text-5=Crystal accumulators are relics first and equipment second. Mining an unstable shell should be read as a violent break in coherence: the safe expectation is a broken body, not a clean relocation. The off-state shells [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] persist until a [item=ei-crystal-accumulator-repair]repair kit is dragged across them.\n\nAlt-selecting with the repair tool inspects crystal accumulators and husks without spending the kit. Dragging it normally performs the repair. If that restoration happens on Gaia, the surface resolves it immediately into the stable variant.
crystal-accumulator-resonance-6=UI legend
crystal-accumulator-resonance-text-6=[font=default-bold]Low shell[/font]: coherence is damped and output sits below the base rung.\n[font=default-bold]Base shell[/font]: the unstable chassis is holding its default 7.5 MW band.\n[font=default-bold]Surged shell[/font]: output is above base and the lattice is under strain.\n[font=default-bold]Gaia shell[/font]: Gaia has resolved the same chassis into the stable 15 MW rung.\n[font=default-bold]Offline husk[/font]: inert artifact body awaiting repair.\n\nCrowding reads the nearby shell chorus as [font=default-bold]Clear -> Crowded -> Strained -> Chaotic[/font]. Read the ladder in that order and the crystal stops looking random.
crystal-accumulator-resonance-text-7=使用 [item=ei-crystal-accumulator-repair] 进行 Alt 选择，可在不消耗修复包的情况下检查水晶蓄能器与残壳。只有当你真的要修复时，才正常拖拽工具。\n\n遥测行会显示 [font=default-bold]地表输出 + 应变[/font] 或 [font=default-bold]应变回退[/font]。同一地表上、同一外壳与同一品质的晶体会共享这部分平均化的地表输出项；真正把耗竭的外壳和旁边的同类区分开的，仍然是局部应变。

