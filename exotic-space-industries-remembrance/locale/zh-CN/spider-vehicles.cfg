ei-spider-range-aware-cycling=车辆开启武器轮换时，自动选择射程内有目标的武器，并按轮次持续射击。定期搜索附近目标。关闭此设置后使用原生轮换，不运行脚本目标搜索；武器射程不同可能导致原生轮换停滞。

