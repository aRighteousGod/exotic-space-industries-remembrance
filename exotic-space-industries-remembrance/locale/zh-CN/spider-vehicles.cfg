[entity-name]
ei-scout-spidertron=侦察蜘蛛机甲
assault_spidertron=突击蜘蛛机甲
[entity-description]
ei-scout-spidertron=用于侦察和物流的三足载具。没有固定武器；装备网格可安装个人激光防御和其他护甲装备。享受蜘蛛载具通用底盘研究的加成。
assault_spidertron=模拟时代的战斗载具，配备一门加农炮、一挺机枪和一具火焰喷射器。研究可增加重炮、武器改良和自动烟幕。享受通用底盘研究的加成。
[item-name]
ei-stored-spidertron=__1__（__2__×__3__装备网格）
ei-assault-smoke-charge=突击蜘蛛机甲烟幕弹
[item-description]
ei-assault-smoke-charge=放入突击蜘蛛机甲的后备箱。完成研究后，载具在遭受重击或受击后生命值低于一半时消耗一枚，使附近敌方单位减速六秒。冷却时间：30秒。
[technology-name]
ei-spider-vehicles=蜘蛛载具
ei-assault-spidertron=突击蜘蛛机甲
ei-assault-smokescreen=蜘蛛机甲自动烟幕
[technology-description]
ei-spider-vehicles=具有物流、遥控和装备网格功能的三足侦察蜘蛛机甲。解锁侦察型、突击型和火箭型共用的底盘研究。
ei-assault-spidertron=模拟时代的突击蜘蛛机甲，配备一门加农炮、一挺机枪和一具火焰喷射器。解锁其武器和烟幕研究。
ei-assault-smokescreen=敌方单次攻击造成至少5%最大生命值的伤害，或使受击后的生命值低于50%时，突击蜘蛛机甲消耗后备箱中的一枚烟幕弹。固定烟幕持续六秒，使八格半径内最多64个敌方移动单位的速度降低35%。冷却时间：30秒。不造成伤害，也不提供隐形效果。
