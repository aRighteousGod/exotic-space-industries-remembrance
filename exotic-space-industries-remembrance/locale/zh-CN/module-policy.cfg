[mod-setting-name]
ei-beacon-quality-modules=插件塔允许使用品质插件
ei-beacon-productivity-modules=插件塔允许使用产能插件
ei-quality-module-effects=品质插件效果

[mod-setting-description]
ei-beacon-quality-modules=选择哪些ESIR插件塔可以使用提供品质加成的插件。液氮冷却组包括__ENTITY__ei-copper-beacon__和__ENTITY__ei-iron-beacon__；异星组包括__ENTITY__ei-alien-beacon__和__ENTITY__ei-warp-beacon__。需要启用Quality模组。\n收紧限制后，已安装但不再允许使用的插件会返还到插件塔旁的地面上。
ei-beacon-productivity-modules=选择哪些ESIR插件塔可以使用提供产能加成的插件。液氮冷却组包括__ENTITY__ei-copper-beacon__和__ENTITY__ei-iron-beacon__；异星组包括__ENTITY__ei-alien-beacon__和__ENTITY__ei-warp-beacon__。停用Quality模组时仍然生效。\n收紧限制后，已安装但不再允许使用的插件会返还到插件塔旁的地面上。
ei-quality-module-effects=ESIR模式采用ESIR为品质插件设定的加成和惩罚。接近原版模式不应用ESIR对其效果的修改。两种模式均保留ESIR的配方和研究进度。停用Quality模组时，此设置无效。

[string-mod-setting]
ei-beacon-quality-modules-neither=两组都不允许
ei-beacon-quality-modules-nitrogen=仅液氮冷却插件塔
ei-beacon-quality-modules-alien=仅异星与跃迁插件塔
ei-beacon-quality-modules-both=两组都允许（默认）
ei-beacon-productivity-modules-neither=两组都不允许
ei-beacon-productivity-modules-nitrogen=仅液氮冷却插件塔
ei-beacon-productivity-modules-alien=仅异星与跃迁插件塔
ei-beacon-productivity-modules-both=两组都允许（默认）
ei-quality-module-effects-esir=ESIR（默认）
ei-quality-module-effects-vanilla=接近原版

