[ei-ecology-guide]
intro-heading=读懂工厂周围的土地
intro=工厂留下的不只有建筑。污染可以使自然地面退化，让附近树木变灰；采矿可以留下裸露的斑块。环境变洁净后，一部分受损地面和林木便有机会恢复。地形演变还带来了局部环境灾害和季节历法，并为 Nauvis、Gaia、Vulcanus、Gleba、Fulgora 和 Aquilo 分别采用合适的规则。太空平台、未知星球和无关的辅助地表不在覆盖范围内。\n\n想了解土壤、恢复、采矿和血液效果，请从地面页开始。林地页讲树木与火灾，岸线页讲水域与悬崖。季节页介绍历法和各个世界的差异；设置页帮助你选择配置、阅读报告，并排查迟迟不出现的效果。系统从 TerrainEvolution 和 TerrainEvolution2 汲取灵感，使用 ESIR 自身的处理上限和保护规则。
defaults-heading=从默认环境开始
defaults=新配置会开启生态系统及其所有单项功能，包括新采矿痕迹的恢复、树木老化、枯木腐朽、岸线变化、悬崖风化、血液效果、铺装腐蚀、季节性生态变化和季节性昼长。你可以分别关闭功能，保留自己希望看到的景观变化。\n\n[font=default-bold]默认设置：[/font]生态强度为克制，处理预设为轻量。森林火灾采用不蔓延模式；可蔓延需要单独选择。已有存档会保留保存的设置和明确的地表覆盖值，这些默认值不会重置你的选择。\n\n[font=default-bold]实际限制：[/font]启用的功能仍需要合适的地面或植被、相应的环境条件，以及轮到该区域处理的时间。有概率判定时，一次检查可能什么也不改变。开启功能是允许它发生，并非让所有地方同时发生变化。
observation-heading=判断污染或洁净，需要可靠的读数
observation=系统轮流检查地图上的部分区域，也就是区块，并用每次污染读数为附近的变化作判断。只有反复取得读数，才能认定环境一直洁净或一直受污染。一个区域若很久没有被检查，情况就是未知，不能直接算作健康。\n\n[font=default-bold]默认设置：[/font]污染条件要求污染量至少为 100，并持续观测五分钟。洁净条件要求污染量至多为 25，并持续观测十分钟。污染量严格处于 25 与 100 之间时，两段观测时间都会重置。两次读数相隔超过 20 模拟秒，也会中断连续环境条件的依据。\n\n[font=default-bold]实际限制：[/font]缺失的读数或另一种污染物，都不能充当空气洁净的证据。已探索地图越大，完成覆盖所需的时间越长。观测时长是效果的一个条件，并不是倒计时结束后每个地格都会改变的承诺。
protection-heading=给工厂和特殊地点留下空间
protection=普通生态变化不会动铺装、填海地块、地基和被覆盖的地面。机器及其他基础设施、虚影、尚存矿床、栽培植物及其土壤、金沼占用区域、预设特殊地点和不支持的地形也受保护。普通的已适配野生树木和小型自然装饰物，本身不会让一块地方被算作工业占用。\n\n[font=default-bold]实际限制：[/font]保护范围可以延伸到障碍物周围。即使通用缓冲范围更小，岸线变化和对树木、悬崖等自然物体的影响，也至少保留八格的距离。系统会在真正修改前再次检查保护条件，因此新放下的机器可以阻止已经在等待的变化。\n\n铺装腐蚀有一项有限例外，只针对符合条件且未被占用的道路和混凝土。岸线变化只允许特定的地面与水域组合。可蔓延火焰可以超出经过保护检查的初始点火位置。关闭功能会停止新活动；已经发生的变化通常会保留，直到有适用的恢复过程将其修复。
soil-heading=污染让自然地面逐步退化
soil=在持续工业污染下，自然地面可以一步一步改变。Nauvis 的草地可以退化为泥土、荒漠和沙地；其他世界则使用各自的火山、湿地、岩石或积雪地形。降低污染，让环境不再满足条件，就能阻止后续污染损伤。\n\n[font=default-bold]默认设置：[/font]克制强度下，土壤检查的基准间隔为两分钟，对应的基础设置是 60 秒。季节性生态和处理延迟会影响何时轮到某个区域。五分钟的持续污染观测要求仍然适用。\n\n[font=default-bold]实际限制：[/font]一次检查只考虑一小片地面，不会重画整个区块。最大退化深度限制一块地面能够记录的变化步数。已经到达适用变化链末端的地面，没有进一步的变化；每个星球始终使用自己的地形类型。
recovery-heading=环境变洁净后，已记录的损伤可以恢复
recovery=环境变洁净，会给受损地面恢复的机会。ESIR 记住自己造成的地形变化，再沿着这些步骤逐步返回确切的原始地面。如果草地先变成泥土，后来又变成沙地，恢复就沿保存的步骤返回，而不是随便挑一块草地替换。\n\n[font=default-bold]默认设置：[/font]克制强度下，恢复间隔为八分钟，对应的基础设置是 240 秒。这个基础间隔是土壤基础间隔的四倍。区域还需要十分钟的洁净观测；两项要求可以同时推进。强度会改变恢复间隔，季节性生态不会。两种时间要求都不保证到点后立刻发生恢复。\n\n[font=default-bold]实际限制：[/font]恢复需要可靠的 ESIR 损伤记录。在地面上施工，或由其他系统替换地面，都可能让记录不再适用；后来移除覆盖物也不会重建记录。恢复不能重建未记录的旧地面或岸线，不能重建悬崖，也不能让被毁的树木复活。
depletion-heading=矿床耗尽可能留下痕迹
depletion=有限矿床耗尽后，附近裸露的地面可能受到扰动。耗尽的位置必须在热能采矿场、蒸汽采矿场、电动采矿场或大型采矿机的采矿范围内，而且采矿机必须支持该资源类别。品质带来的采矿范围变化也会计入。普通采矿机和无限矿床不符合条件。\n\n[font=default-bold]默认设置：[/font]系统在 56 格的扰动半径内选出一片区域，这片区域自身的半径为三格。其中每个合格位置都有 70% 的变化概率。尚存矿石和受保护地面不会被修改。\n\n[font=default-bold]实际限制：[/font]触发原因是矿床耗尽；耗尽事件并不会告诉 ESIR 是哪台采矿机完成了开采。关键在于位置是否受到合格采矿机的覆盖。区域内的地格会逐步处理，所以采矿机停工后仍可能出现痕迹。大量资源集中耗尽时，附近请求可能合并，也可能停止接受更多请求；但已接受的请求不会仅因等待过久而被丢弃。
working-heading=工作中的采矿场也会扰动周围地面
working=符合条件的采矿场或大型采矿机，在仍然开采有限矿床时也可能留下痕迹。它必须已激活、显示工作中状态，并以同一地表上的有效有限矿床为开采目标。这与矿床耗尽时触发的痕迹是两回事。空闲的采矿机不会产生工作痕迹。\n\n[font=default-bold]默认设置：[/font]克制强度下，两次机会的基准间隔为十分钟，对应的基础设置是 300 秒。每次机会有 10% 的概率申请一片采矿扰动区域，之后区域内每个合格位置再各自进行 70% 的判定。季节和处理延迟可以改变实际检查时间。\n\n[font=default-bold]实际限制：[/font]尚存矿石仍受保护，因此痕迹可能落在附近的裸露地面上。ESIR 保存一个容量有限的列表，记录同样的四类合格采矿机，并随建造和移除更新；空闲采矿机可以继续留在列表里。迟到的检查只尝试当前一次，不会补算错过的机会。关闭该地表的生态，会暂停检查和等待中痕迹的应用。
mining-recovery-heading=采矿痕迹能恢复到什么程度
mining-recovery=采矿恢复会朝着痕迹形成前的地面返回。如果污染已经把草地变成泥土，采矿恢复就可以让这片地面回到泥土。采矿记录会替代更早的生态恢复步骤，因此不能再依靠这份记录找回之前的草地。后续记录的采矿损伤仍然可以逐步恢复。\n\n[font=default-bold]默认设置：[/font]新记录的采矿痕迹默认开启恢复。一般地形恢复和采矿恢复必须同时开启，地面需要满足洁净观测要求，且恢复记录必须仍然有效。\n\n[font=default-bold]实际限制：[/font]采矿恢复关闭时产生的损伤是永久的。后来开启恢复，也不能重建这些未记录的痕迹。关闭某个地表的生态会暂停已经接受的采矿工作；重新开启后，工作按普通处理上限继续，不会集中补算错过的尝试。
blood-heading=异星血液可以帮助受损地面恢复
blood=敌方生物或巢穴死亡时，血液效果可以帮助附近地面沿已记录的损伤退回一步。这是直接恢复效果，不需要等待普通的洁净观测期。它仍然需要有效的 ESIR 损伤记录、相应的功能开关和通常的地形保护检查。采矿损伤还需要开启采矿恢复。\n\n[font=default-bold]默认设置：[/font]一次合格死亡有 10% 的概率，让一小片局部区域被接受并等待处理。随着处理容量腾出，系统会在之后修改这片区域。\n\n[font=default-bold]实际限制：[/font]有尸体不代表地面一定会恢复，也不会留下永久的治疗区域。没有记录时，效果不能凭空还原以前的地形。它与战斗中可见的死亡效果是分开的，繁忙时还会限制新接受的区域数量。
paving-heading=血液也可能腐蚀裸露铺装
paving=同时开启血液效果和铺装腐蚀后，敌人死亡影响的区域可以剥除符合条件的石砖路或混凝土，露出保存的下层地格。有效的地形恢复步骤优先执行；无法进行这种恢复时，才会考虑铺装。如果希望合格的裸露铺装保持完好，可以关闭这项功能。\n\n[font=default-bold]默认设置：[/font]血液事件通过接受判定后，腐蚀再进行一次 1% 的判定。这是已接受区域内的概率，不是任意地点每杀死一个敌人都有 1% 的概率。\n\n[font=default-bold]实际限制：[/font]被占用或受到其他保护的铺装和地基不参与，而且下层地格必须仍然已知且有效。这是普通铺装保护的特定例外。移除的铺装不会返还，也不会由恢复过程重建。即使铺装开关保持开启，关闭血液效果也会停止新的腐蚀尝试。
stress-heading=污染可以让野生树木变灰
stress=在持续污染条件下，已适配的野生树木可能逐渐失去颜色。它们仍然活着，仍在原处；灰化和烧毁或变成枯木不同。ESIR 会记住原始颜色阶段，以及自己施加的衰弱，让这些变化以后能够逆转。栽培植物、特殊植物、受保护地点和不支持的树种不会受影响。\n\n[font=default-bold]默认设置：[/font]克制强度下，衰弱检查的基准间隔为十分钟，对应的基础间隔为五分钟。强度、季节性生态、观测覆盖和有限的树木搜索，会影响何时轮到某一棵树。持续污染观测的要求仍然适用。\n\n[font=default-bold]实际限制：[/font]已经完全变灰的树无法再灰化一步。如果其他系统改变了有记录树木的颜色阶段，ESIR 可能放弃这份记录，而不覆盖新的外观。
greening-heading=衰弱的树木可以找回原来的颜色
greening=让污染保持足够长时间的低水平，受 ESIR 影响而衰弱的树就可以逐步恢复原貌。天然灰色的树仍会保留天然颜色。恢复需要同一棵活树、与记录一致的颜色阶段，以及持续洁净的观测。\n\n[font=default-bold]实际限制：[/font]砍伐、替换或摧毁这棵树，会终止这次恢复机会。恢复颜色属于树木衰弱功能，使用自己的记录，与地面恢复、再生、老化和腐朽分开。地面看起来健康，并不保证以前的树会回来；一棵树正在恢复，也不代表附近每块地面都已准备好恢复。
regrowth-heading=留下的树木能让林地慢慢扩展
regrowth=在持续洁净条件下，合适的野生树木可以在附近繁衍出一棵已适配的新树。保留部分原生林木，便给再生留下了起点。新树需要适合当地地面，并通过保护检查；在 Gaia，树种还会按当地生态区选择。栽培作物绝不会被选作再生树种。\n\n[font=default-bold]默认设置：[/font]克制强度下，生长机会的基准间隔为二十分钟，对应的基础间隔为十分钟，再考虑季节变化和处理延迟。新位置沿任一地图坐标轴的偏移都不超过八格。如果四格邻域内已有 16 棵已适配自然树木，就会抑制生长。所有地表共用的成功新生树木间隔至少为十秒。\n\n[font=default-bold]实际限制：[/font]这是缓慢的局部林地扩张。孤立的空地若没有合适的存活种源树，可能一直空着。洁净读数、足够空间和处理机会必须同时具备；到了间隔并不保证每棵树都能再长出一棵。
aging-heading=活树也会变成枯木
aging=树木老化可以移除符合条件的 Nauvis 活树，并用原生枯木替代。它与污染衰弱独立，因此绿色的树也可能被选中。如果希望活树保留到被其他过程移除，请关闭老化。\n\n[font=default-bold]默认设置：[/font]老化默认开启。克制强度下的基准间隔为两小时，对应的基础设置为一小时，季节性生态还会影响时机。这是对搜索区域的检查间隔，并非每棵新树获分配的固定寿命。\n\n[font=default-bold]实际限制：[/font]目前只有 Nauvis 有已适配的枯木替换类型。保护检查仍然适用。活树的消失是永久的，颜色恢复不能让它复活。老化本身不会点火。
rot-heading=枯木可以逐渐消失
rot=枯木腐朽会随时间移除已适配的死树。它能清除旧林地残留，但不会把枯木换成活树。再生是另一种独立过程，日后可能在附近建立新林地。老化和腐朽可以分别开关。\n\n[font=default-bold]默认设置：[/font]克制强度下，腐朽的基准间隔为一小时，对应的基础设置为三十分钟。强度、季节性生态和处理覆盖会影响何时轮到某片区域。\n\n[font=default-bold]实际限制：[/font]移除的枯木不会留下恢复记录。不支持的树种、受保护地点和栽培植物不参与。腐朽有自己的计时，因此迟到的检查不会突然补算区域未被观测时错过的所有机会。
thermal-heading=被火烧死的树可能留下地面损伤
thermal=树木因符合条件的火焰伤害死亡时，可以在原来的位置周围留下一小片灼痕。地面按所在星球的地形规则变化，并可以记录下来供以后恢复。环境变洁净后，地面可能修复，但树本身已经不在。\n\n[font=default-bold]实际限制：[/font]死亡需要有符合条件的火焰来源，通常的地面保护仍然适用。战斗火焰和自发森林火灾都可能造成这样的死亡。灼烧痕迹响应的是死亡事件，不会再点燃一团火。因此，即使附近的树烧毁，受保护的机器场地仍可能保持不变。
wildfire-heading=选择不蔓延还是可蔓延的火焰
wildfire=工业污染偶尔可以在已适配野生树木附近引发火灾。区域需要污染达到或超过上限阈值、附近有合适燃料，并且点火位置不受保护。读数低于阈值时，该区域会停止产生新的森林火灾请求；已经接受的点火可能仍在等待处理。这项功能不等待土壤的五分钟持续污染观测期。\n\n[font=default-bold]默认设置：[/font]采用不蔓延模式。克制强度下，灾害的基准间隔为二十分钟，对应的基础间隔为十分钟。一次合格的森林火灾机会有 1% 的概率尝试点火；季节、灾害轮流处理和覆盖情况可能进一步延迟它。这不是每棵树每秒的概率。所有地表的初始点火合计限制为每十秒一次，最多保留 16 笔火焰记录。\n\n[font=default-bold]实际限制：[/font]不蔓延模式会产生一团不扩散的地面火焰，最多持续十秒。可蔓延模式会点起普通 Factorio 树木火焰；后续火焰可以扩散到最初检查的区域之外，并消耗生态脚本上限之外的引擎时间。关闭生态会清除其不蔓延火焰，但不会动无关的战斗火焰和后续蔓延火焰。森林火灾警报确认的是成功点火，不是森林已经烧毁。
flood-heading=水域可以向沙质岸边推进
flood=在 Nauvis，洪水可以把符合条件的沙质岸线变成水域，但旁边必须已有符合条件的淡水。它造成的是小范围岸线变化。熔岩、石油海和氨海不在作用范围内，远离合适岸线的任意地面也不会变成水。\n\n[font=default-bold]默认设置：[/font]每次洪水机会的概率为 2%。时机取决于灾害间隔、强度、季节性生态和处理覆盖，不要求降雨、低污染或可见的天气。\n\n[font=default-bold]实际限制：[/font]正北、正南、正东或正西方向直接相邻的合适岸线，会让最初的请求符合条件。真正修改地格前，系统会检查地面变水的组合是否受支持，以及保护规则是否仍允许修改。有记录的洪水可以在损伤记录仍有效时恢复；仅关闭洪水不会立即把水排走。这是局部岸线移动，不是全局海平面模拟。
drought-heading=水域可以从沙质岸边退去
drought=在 Nauvis，干旱可以把合适沙岸旁符合条件的淡水变成沙地，让沿岸多出少量裸露地面。其他星球的液体不参与，缺少所需岸线关系的水域也不符合条件。\n\n[font=default-bold]默认设置：[/font]每次干旱机会的概率为 2%。时机取决于灾害间隔、强度、季节性生态和处理覆盖，没有另外的高污染或天气要求。\n\n[font=default-bold]实际限制：[/font]基础设施、尚存资源和特殊地点仍受保护。等待中的变化可能在应用前变得不再合格。洪水和干旱可以分别开关；同时开启会允许局部随时间向相反方向变化。两者都不模拟温度或降雨，也不会强制岸线立刻来回切换。
cliff-heading=风化可以移除普通悬崖
cliff=悬崖风化检查附近保护条件后，可以移除一段符合条件的普通悬崖。这会永久改变这道天然屏障。如果希望悬崖一直留到你亲手清除，请关闭这项功能。\n\n[font=default-bold]默认设置：[/font]一次悬崖风化机会的概率为 1%，不要求污染暴露、降雨、战斗伤害或测得的悬崖年龄。\n\n[font=default-bold]实际限制：[/font]特殊星球的悬崖类型不会被当作受支持的普通悬崖。即使已经找到悬崖，附近的基础设施或受保护地点仍可能阻止移除。地面恢复不能重建已移除的悬崖。
calendar-heading=每个世界都有自己的历法
calendar=每个受支持的世界都有季节历法。按星图距离计算，离恒星较远的世界通常拥有更长的一年。历法用来安排季节变化，不会移动行星或改变航线。上升季、旺盛季、衰退季和低谷季是四个阶段的名称，并不保证特定天气。\n\n[font=default-bold]默认设置：[/font]基准年是 360 个 Nauvis 日，使用历法开始时保存的有效 Nauvis 日长。各世界的年长，是这个基准乘以该世界与 Nauvis 的距离之比的 1.5 次方。星图方位决定一年中的起点。后来对 Nauvis 昼夜控制器的修改，不会不断重定义这个基准。\n\n[font=default-bold]使用历法：[/font]管理员的历法面板显示基准日数、等效当地日数和模拟时长。改变年长会保留当前在季节中的位置。管理员也可以调整这个位置来预览。
daylight-heading=改变的是白昼比例，不是一整天的长度
daylight=季节性昼长会在星球现有的一天内延长或缩短白昼。可以把它想成移动日出和日落的时刻，但完整自转一周所需的时间保持不变。这会改变太阳能板接受日照的时长。晨昏过渡仍保留原来的持续时间。\n\n[font=default-bold]默认设置：[/font]Nauvis、Gaia、Vulcanus、Gleba 和 Aquilo 符合条件。假定地轴倾角为 23.5 度、纬度为 45 度。即使设置很极端，一个周期中也至少保留 2% 的全日照和 2% 的全黑夜。\n\n[font=default-bold]实际限制：[/font]冻结时间或永久日照会暂停季节调整。ESIR 也会向 Diurnal Dynamics 或修改相同黎明、黄昏设置的其他控制器让出控制。关闭功能时，只有上次调整仍未被改动，才会恢复原设置。Fulgora 的独立昼夜控制器始终保有完整控制权；季节性昼长绝不会调整或恢复其日照边界。
modulation-heading=季节可以改变生态变化的节奏
modulation=季节性生态变化会让土壤、树木、灾害和工作采矿机痕迹的机会，在一年中变得更频繁或更稀疏。即使季节性昼长关闭，或由其他系统控制光照，它仍能运作，Fulgora 也一样。改变机会节奏，不会改变每次机会的成功概率。\n\n[font=default-bold]默认设置：[/font]调节强度为 25%。速率在旺盛季附近平滑升至所选强度基准的 125%，在低谷季附近降至 75%。速率高会缩短间隔，速率低会延长间隔。\n\n[font=default-bold]实际限制：[/font]季节不会开启已关闭的灾害，不会改变污染或洁净观测要求，也不会改变普通地面恢复间隔。生长机会仍需要洁净读数、合适种源树、空间和处理容量。历法不会移动行星，也不会为了配合季节重画世界。冬季配色的启动按钮只是提示，不代表会下雪。
nauvis-heading=Nauvis：土壤、沙地和林木
nauvis=Nauvis 的地面可以依次经过草地、泥土、荒漠和沙地；有记录的地面可以恢复到确切的原始地形。已适配的原生树木可以衰弱、恢复颜色和再生。Nauvis 也是首个支持淡水岸线变化的世界，并且是唯一能通过老化把活树替换为枯木的世界。\n\n[font=default-bold]实际限制：[/font]铺装厂区、尚存资源、基础设施和特殊地点仍受保护。符合条件的铺装腐蚀，是针对裸露铺装的明确例外。
gaia-heading=Gaia：保留当地景观的特点
gaia=Gaia 的草甸和湿地可以退化到裸露的 Gaia 岩地。恢复会沿记录返回原来的地形变体，再生则选择适合当地生态区的树木。ESIR 放置的特殊地点设有保护范围，让普通生态变化不会损坏它们。\n\n[font=default-bold]实际限制：[/font]旧存档中仍存留的地点标记，有助于判断应当保护哪里。尚在检查的区域，或旧保护记录曾超过容量的区域，可能仍禁止生态变化。如果有辨识作用的标记已经消失，系统无法凭空还原旧地点的确切边界。
vulcanus-heading=Vulcanus：火山灰和火山土壤的变化
vulcanus=Vulcanus 使用自己的火山灰、火山土壤和裂隙地面变化。熔岩始终受保护，树木效果只使用已适配的原生树种。喷气孔仍保留独立的种群、储量和地形变化周期。\n\n[font=default-bold]实际限制：[/font]生态不会接管喷气孔效果，不会引入普通的地球式林地，也不会把火山液体变成淡水。
gleba-heading=Gleba：孢子需要区别对待
gleba=Gleba 保留各生态区自己的地面变化和已适配野生树木的生境，包括湿地放置规则。栽培植物及其特殊土壤、金沼植物和占用的盆地仍受保护。孢子是另一种污染物，不算有毒工业污染。\n\n[font=default-bold]实际限制：[/font]只有孢子的读数，既不算工业污染读数，也不能证明工业环境洁净。因此，仅有孢子无法满足污染地面损伤、普通恢复、树木衰弱或颜色恢复、自然再生和污染森林火灾的条件。符合条件的采矿、树木火焰致死痕迹、血液效果、独立灾害和历法仍可运作。开启开关不会把孢子变成可用的工业污染读数。
fulgora-heading=Fulgora：它的昼夜仍由自己掌管
fulgora=Fulgora 的已适配地面可以经过岩地、沙地、尘土和沙丘变化，石油海始终受保护。它的生态历法可以调节合格效果的节奏，并改变机械树启动按钮的颜色。这里没有已适配的原生林木类型，不能借此长出普通树木。\n\n[font=default-bold]实际限制：[/font]Fulgora 的独立昼夜系统继续管理日照。季节性昼长绝不会读取、改变或恢复 Fulgora 的黎明和黄昏边界，包括全局生态或历法设置发生变化时。
aquilo-heading=Aquilo：工厂周围的积雪与冰面
aquilo=Aquilo 使用自己的积雪压实和冰面变化，记录恢复可以沿这些步骤返回。氨海、地基和基础设施始终受保护。季节性昼长可以改变一天中的日照比例，但不改变星球自转周期。\n\n[font=default-bold]实际限制：[/font]这里没有已适配的原生林木类型，不能用普通树木填满 Aquilo。生态不提供通用的冻结、融化或海洋转换模拟。
settings-heading=设置全局规则和局部例外
settings=启动阶段的集成开关让生态系统可用。模组设置 → 地图提供功能开关、污染阈值、间隔、概率、星球启用状态和处理上限。管理员可以在地形与生态中覆盖现有地表上支持的设置；重置地表覆盖设置会移除局部例外。选择一个星球或阅读它的报告，不会创建其地表。\n\n[font=default-bold]实际限制：[/font]最终行为由全局设置、星球规则和明确的地表覆盖值共同决定。总开关禁用、不支持的地形、保护规则和模组兼容性暂停仍有优先权。升级会保留保存的设置。关闭恢复会暂停恢复，不会立即还原地面。关闭其他效果，也不会返还被毁的树木、悬崖或铺装。关闭启动集成时，只有 ESIR 上次日照调整仍未被改动的地方，才会恢复季节性日照的原设置。
presets-heading=强度决定节奏，处理量决定覆盖速度
presets=强度决定生态变化机会应有多频繁，处理预设决定系统能检查多少地面，以及多快处理等待中的工作。提高处理量，可以让繁忙或探索范围广的地图更早得到关注，但不会提高每次检查所配置的成功概率。\n\n[font=default-bold]默认设置：[/font]克制使用 0.5 的速率倍率，标准为 1，强烈为 2，自定义使用你选定的倍率。更强的强度不会开启已关闭的功能。处理默认为轻量。七种具名预设是超低负载、低负载、轻量、均衡、详细、高保真和超高保真，另外还有自定义。轻量每 16 刻处理一小批工作，每 32 刻允许一次实体搜索。\n\n[font=default-bold]实际限制：[/font]处理和存储上限由所有地表共用，自定义也有有限上限。降低存储上限会保留已有记录，但在腾出空间前阻止新记录。当恢复记录空间已满，ESIR 会拒绝新的可逆损伤，而不是忘记旧地面如何恢复。较高的预设可能消耗更多处理时间，没有哪种预设能保证所有工厂都达到特定 UPS。
reports-heading=阅读当前查看世界的报告
reports=左上角的铜质机械树会打开当前所看地表的生态报告，包括远程视图。树叶颜色随历法变化：上升季为黄绿色，旺盛季为翠绿色，衰退季为琥珀红，低谷季为青色。将鼠标移到按钮上即可查看季节名称。没有可用历法时，按钮保持翠绿，并提示季节信息不可用。\n\n[font=default-bold]使用报告：[/font]简洁页以实地报告的语言描述已观测的地面、林木、采矿扰动和季节条件。高级页进一步显示实际生效的地表设置、读数、等待工作、因保护而拒绝的变化和维护状态，并将这些信息与共用的全局上限和计数区分开。没有观测就是未知，不是健康。\n\n报告打开时，会更新此前已收集的事实；关闭后就停止这些报告更新。启动按钮独立的颜色检查可以继续，不需要搜索地形。
alerts-heading=选择你想收到哪些变化通知
alerts=生态通知会出现在 Factorio 的普通警报窗口，带有图标和可前往的位置。你可以在生态窗口的警报页，或模组设置 → 每位玩家中选择；两处修改的是同一组个人偏好。警报表示某个效果确实已经发生，不只是计划了一次检查。\n\n[font=default-bold]默认设置：[/font]森林火灾、洪水、干旱、悬崖风化和铺装腐蚀的警报已开启。其他类别，包括污染损伤、恢复、采矿和树木效果，初始关闭，可分别选择。所有实际地表默认被选中；仅限当前地表是独立的可选筛选条件。例行日照调整不会触发警报。\n\n[font=default-bold]实际限制：[/font]你的阵营必须当前能够看见事件区块，过去探索过并不够。管理员可以绕过可见性要求，但类别和地表筛选仍然有效，失去管理员身份后例外也会撤销。附近事件会合并，每位玩家最多保留四条生态警报，一起事件可在 60 秒内发出通知。离线事件不会积攒到之后发送。警报过期绝不会删除恢复记录或等待中的采矿工作。
maintenance-heading=重建窗口告诉你的是什么
maintenance=ESIR 重建窗口显示有明确终点的准备和修复工作：转换旧存档数据、进行初次发现巡查、检查变化后的配置，以及修复已存信息。地表被禁用或因其他原因无法继续时，任务可以等待。总工作量未知时，窗口只显示已完成的工作，不会编出一个百分比。\n\n[font=default-bold]实际限制：[/font]初次发现巡查在开始时固定参与地表的列表。每个地表遍历会在没有更多区块，或达到 100,000 次区块访问时结束。达到这个上限表示覆盖尚未验证，不是地图每一处都已经检查过。\n\n日常观测、恢复、工作采矿机检查和已接受的采矿痕迹独立继续，显示在高级页中，不会让重建窗口永远开着。旧存档会逐步准备；重新打开或启用生态，不会补做停用期间错过的全部机会。
troubleshooting-heading=景观迟迟不变时，从哪里查起
troubleshooting=先打开当前所看地表的高级页。确认生态在这里确实启用，并支持这个世界。再检查是否有合适的地面或树木，需要时是否有可用污染读数，连续观测是否足够，以及所选地点周围是否受保护。最后查看是否还有工作在等待，或存储空间已满。一个安静的区域可能只是需要更多时间，尤其是概率低、间隔长的效果。\n\n[font=default-bold]有用的检查：[/font]地面到达变化链末端后，不能继续退化。再生需要一棵仍存活的已适配种源树。采矿需要在合格采矿机覆盖内真正耗尽有限矿床，周期痕迹则需要合格采矿机确实显示工作中。火灾需要工业污染、附近已适配的燃料，以及预期的不蔓延或可蔓延模式。仅有成功尝试计数，不能证明已创建点火。恢复需要原来的 ESIR 记录，采矿恢复还需要两种恢复开关同时开启。\n\n[font=default-bold]实际限制：[/font]TerrainEvolution 或 TerrainEvolution2 会暂停重叠的生态功能；ESIR 会向 Diurnal Dynamics 让出季节性日照控制。探索地面越多、活动地表越多，在相同全局处理额度内完成覆盖就越慢。读数未知或检查延迟，并不能说明土地健康，也不能直接说明功能失效。
