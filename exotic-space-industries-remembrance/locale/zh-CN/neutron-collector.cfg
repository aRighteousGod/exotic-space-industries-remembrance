[recipe-name]
ei-neutron-collector-idle=收集器待机

[recipe-description]
ei-neutron-collector-idle=在没有可运行的中子充能配方时，仍让收集器界面保持可用。

[virtual-signal-name]
ei-neutron-efficiency=中子效率
ei-neutron-distance=源距离
ei-neutron-collector-agent=收集器代理
ei-neutron-source-agent=源代理
ei-neutron-scan-agent=扫描代理

[virtual-signal-description]
ei-neutron-efficiency=输出当前收集器效率，范围为0到300。
ei-neutron-distance=以十分之一格为单位输出已绑定源的距离。
ei-neutron-collector-agent=输出收集器代理状态：1 运行，2 空闲，3 阻塞。
ei-neutron-source-agent=输出源代理状态：1 在线，2 休眠，3 缺失。
ei-neutron-scan-agent=输出扫描代理状态：1 稳定，2 脏，3 等待重绑。

