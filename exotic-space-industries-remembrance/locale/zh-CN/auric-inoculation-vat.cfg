[recipe-description]
ei-auric-inoculation-vat=建造一座会认领附近湿地盆地、在 Gleba 上运行接种循环，并在之后从沼泽中催生新的金沼囊节点的金沼接种槽。
ei-auric-cyst-washing=洗涤收获到的金沼囊，回收有用产物，并把一部分污水送回 Gleba 的循环。

[technology-name]
ei-auric-marsh-inoculation=金沼湿地接种

[technology-description]
ei-auric-marsh-inoculation=解锁 Gleba 的金沼接种槽、囊体处理与洗涤链。认领有效的沼泽盆地，喂入循环试剂，并在污染压垮绽放之前把它压住。

[virtual-signal-name]
ei-auric-vat-vigor=槽活力
ei-auric-vat-contamination=槽污染
ei-auric-vat-band=盆地带级
ei-auric-vat-claims=已认领盆地地块
ei-auric-vat-bloom=绽放状态

[virtual-signal-description]
ei-auric-vat-vigor=输出接种槽当前循环活力，范围为0到100。
ei-auric-vat-contamination=输出接种槽当前污染压力，范围为0到100。
ei-auric-vat-band=输出依据已认领湿地地块计算的当前盆地带级指数，范围为1到7。
ei-auric-vat-claims=输出当前被接种槽认领的湿地盆地地块数量。
ei-auric-vat-bloom=输出绽放状态：1 稳定，2 紧绷，3 失效。

