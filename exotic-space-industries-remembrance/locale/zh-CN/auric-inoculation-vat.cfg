[item-description]
ei-auric-inoculation-vat=一种 Gleba 盆地控制器，用来给相邻湿地盆地接种，并把它推过整套金沼绽放循环。
ei-auric-cyst=从稳定金沼绽放中收获的矿化囊体物质。

