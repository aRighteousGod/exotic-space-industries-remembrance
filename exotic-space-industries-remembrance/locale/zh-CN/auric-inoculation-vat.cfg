[entity-description]
ei-auric-inoculation-vat=在 Gleba 上认领附近的湿地盆地，运行分阶段接种循环，并在污染受控时催生金沼囊节点。
ei-auric-cyst-node=由一次成功的接种槽循环创造出的沼泽生长金沼绽放节点。

