[exotic-industries-informatron]
orbital-native-title=优先使用原生物流
orbital-native-shipping=普通火箭配送和平台间转运使用 Factorio 原生请求及供货功能，无需群组设备。请在原生窗口中设置来源、最小配送量及供货状态。原生自动配送负责装货、混载、选择目标和发射时机。侧边面板显示实际原生目标。\n\n新建上行链路默认选择原生自动配送，但放置时不会修改发射井。点击原生自动配送才会明确启用自动请求。已有上行链路保留群组控制。仅在载荷为空、无在途货物且未在发射时才能切换控制方。
orbital-native-cohort=若需固定目标或由工厂/电路装货，请在每个参与的平台上放置 [entity=ei-platform-transponder]，并在发射地点设置选择器、通电的协调器和已绑定发射井的上行链路，再选择群组控制。新选择器默认使用策略模式；手动模式按名称选择，电路模式读取 [virtual-signal=ei-platform-id]。\n\n目标保持沿用原规则：持续保持直到需求满足，单次在一次发射后释放，阈值模式在剩余需求高于阈值时保持。ID、绑定修复、租约操作和阈值位于高级设置。粘贴设置、克隆和蓝图只复制配置，不复制活动租约。自动 ID 会重新分配，重复的手动 ID 会报告冲突。复制的上行链路仅在旁边有唯一明确可用的发射井时自动绑定。
orbital-native-sources=请求和需求可按行星、平台或所有来源筛选。“所有来源”允许两种配送路径。火箭任务排除仅限平台来源的请求。在途仍为全部到货总量。需求先逐个平台计算，再求和：max(0, 请求 − 库存 − 在途)。其他平台的库存不能抵消本平台的缺口。\n\n平台间转运遵循原生请求和供货规则。ESIR 不修改请求分区或储备/补货策略。混载中出现未请求的物品类型或品质时，群组会暂停发射；已请求类型的超额数量仍可发送。面板会指出需要移除的货物。从外部启用原生请求会暂停群组配送。
orbital-native-radar-title=原生雷达遥测
orbital-native-radar-one=[font=default-bold]一个平台，一个频道[/font]\n1. 在枢纽上启用所需库存/状态的红线输出。如使用“设置请求”，将输入设为绿线并隔离网络。\n2. 将红线输出及发出专用连接存在信号（例如 L=1）的常量运算器连接至通电雷达。选择宇宙模式和此平台专用的信号频道。\n3. 接收工厂使用同阵营、同宇宙频道的通电雷达，将其红线接入接收电路，并与请求输入分离。\n\n配置的频道标识该平台，移动时仍继续广播。存在信号=1 且没有物品信号表示库存为空；没有存在信号则可能是发送端或链路不可用。两端都要供电。此路径无需扫描仪轮询，但原生电路和雷达仍有运算开销。
orbital-native-radar-shared=[font=default-bold]共享库存频道[/font]\n将多个枢纽的库存输出接入同阵营、同宇宙频道的雷达。信号会相加。每个发送端发出相同的存在信号，其总数可表示当前连接的发送端数量。请将此网络标为“汇总库存”。它无法保留各平台的归属，也不代表精确需求或保证可供配送的数量。\n\n雷达传输电路信号；枢纽不输出已配置请求或已确认的在途货物。请求/在途/需求请使用精确扫描仪。切勿将无线汇总值作为单个平台需求输入群组配送。ESIR 不创建中继器、不分配频道，也不修改接线。
