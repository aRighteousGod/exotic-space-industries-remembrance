[mod-setting-description]
ei-terrain-evolution-enabled=启用 ESIR 的星球地形生态：污染引起的地形变化与恢复、由事件触发的采矿痕迹、野生树木的污染灰化与再生，以及季节性昼长。可在“模组设置 → 地图设置”中调整各项功能、星球开关和 UPS 处理预算。可选灾害默认关闭；Fulgora 保留其独立昼夜控制器。关闭后停止新变化，不会重置地形；仅在昼长仍由 ESIR 控制时恢复原值。
ei-terrain-active=在已启用且受支持的地表上运行生态变化与季节性昼长。关闭后停止新工作，不会撤销地形变化；仅在其他控制器未改动昼长时恢复 ESIR 控制前的原值。
ei-terrain-intensity=克制模式使用 0.5 倍变化速率，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。强度与处理预算分开控制，绝不会启用已关闭的灾害。
ei-terrain-performance=以较小批次频繁处理。超低负载和低负载优先减少工作量；轻量是保守的默认预设。均衡、详细、高保真和超高保真依次提高处理覆盖率和 UPS 开销。自定义使用各项独立上限。所有预算均由全部地表共享；变化强度和灾害开关仍独立控制。
ei-terrain-custom-rate-multiplier=克制模式使用 0.5 倍强度，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。处理预算单独控制。
ei-terrain-degradation=持续污染后，符合条件的自然地形会沿所属星球的地格变化链逐步退化。默认条件：污染值连续五分钟不低于 100。Gleba 孢子不计为有毒污染。
ei-terrain-recovery=仅沿原始变化路径恢复 ESIR 已记录的地形变化。默认条件：污染值连续十分钟不高于 25，恢复间隔为退化间隔的四倍。地格被外部替换后，ESIR 不再负责恢复它。
ei-terrain-mining-scars=由有限资源耗尽事件触发，耗尽位置须在符合条件的采矿场或大型采矿机覆盖范围内。附近的采矿痕迹会排队处理，受共享工作量上限约束；事件集中爆发时，超额痕迹可能被跳过。默认永久保留。耗尽事件不会指出是哪台采矿设备造成的。
ei-terrain-tree-stress=持续污染会使已适配的原生野生树木灰化；环境持续洁净后，会逆转 ESIR 造成的灰化。栽培植物和受保护植被不受影响。
ei-terrain-tree-regrowth=环境持续洁净后，在现有树木附近缓慢长出已适配的当地树木。受局部密度上限和地形保护规则约束；Gaia 会按所在生态区选择树种。
ei-terrain-thermal-scars=树木被符合条件的火源烧死后，可能留下小范围地形灼痕。此效果本身不会点火。
ei-terrain-seasonal-daylight=默认开启。随季节改变日照时长和游戏原生太阳能发电量，不改变完整昼夜周期的长度。始终不影响 Fulgora；昼夜冻结设置和外部控制器优先。
ei-terrain-mining-recovery=默认关闭。记录今后产生的采矿痕迹以便恢复；此前的永久痕迹无法重建。采矿损伤会取代原有的生态恢复路径。
ei-terrain-aging=默认关闭。将符合条件的 Nauvis 活树替换为原生枯木。其他星球没有已适配的枯木替代类型，因此不受影响。此效果不会引发火灾。
ei-terrain-rot=默认关闭。逐渐移除符合条件的原生枯木。受保护的树木和地点不受影响。
ei-terrain-flood=默认关闭。将 Nauvis 上已适配的沙质岸边地格变为水，要求紧邻现有淡水。其他星球的液体和受保护区域不受影响。
ei-terrain-drought=默认关闭。将 Nauvis 上已适配的岸边水域地格变为沙地，要求紧邻现有沙质岸边。其他星球的液体和受保护区域不受影响。
ei-terrain-cliffs=默认关闭。偶尔移除符合条件的普通悬崖。各星球的特殊悬崖和受保护区域不受影响。
ei-terrain-blood=默认关闭。敌方单位或巢穴死亡时，可能逆转附近一层已记录的地形损伤。恢复采矿痕迹仍须启用采矿痕迹恢复。
ei-terrain-paving=默认关闭。需要启用血液效果：敌人死亡时，可能剥除符合条件的石砖或混凝土铺装，露出下方地格。基础设施和其他保护规则仍然有效。
ei-terrain-seasonal-ecology=默认关闭。随季节调整土壤退化、树木活动与再生，以及灾害触发尝试的速率。无论季节性昼长由谁控制均可独立生效；不会启用已关闭的灾害。
ei-terrain-wildfire=默认关闭。污染可能触发数量受限的点火。不蔓延模式的火焰最长存活 10 秒；原生火势蔓延可能超出 ESIR 的脚本处理预算。其他战斗火灾仍独立运行。
ei-terrain-planet-nauvis=启用 Nauvis 的生态变化与季节性昼长：草地、泥土、荒漠和沙地的退化链、原生野生树木，以及可选的岸线变化。各项功能开关和保护规则仍然有效。
ei-terrain-planet-gaia=启用 Gaia 的生态变化与季节性昼长：草甸和湿地变体会退化为裸露的 Gaia 岩地，可按记录恢复原始变体，并再生适合当地生态区的树木。预设特殊地点仍受保护。
ei-terrain-planet-vulcanus=启用 Vulcanus 的生态变化与季节性昼长，使用火山灰、土壤和裂隙地形的变化链。熔岩受保护；喷气孔保留其独立效果。
ei-terrain-planet-gleba=启用 Gleba 的生态变化与季节性昼长，使用各生态区的地形和原生野生树木。孢子不会造成有毒污染损伤；栽培植物、栽培土壤和金沼盆地仍受保护。
ei-terrain-planet-fulgora=启用 Fulgora 的地形生态变化，包括岩地、沙地、尘土地和沙丘之间的转换。石油海洋仍受保护。季节性昼长绝不接管 Fulgora，其独立昼夜控制器始终保持控制权。
ei-terrain-planet-aquilo=启用 Aquilo 的生态变化与季节性昼长，使用已适配的积雪压实与冰面变化链。氨海、地基和基础设施仍受保护。
ei-terrain-pollution-high=超过上限开始累计污染持续时间，低于下限开始累计清洁持续时间。下限必须小于上限。读取当地的原生污染量，不直接改变污染。
ei-terrain-pollution-low=超过上限开始累计污染持续时间，低于下限开始累计清洁持续时间。下限必须小于上限。读取当地的原生污染量，不直接改变污染。
ei-terrain-mining-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-wildfire-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-flood-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-drought-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-cliff-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-blood-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-paving-probability=每次符合条件的判定所使用的概率：0 表示从不发生，1 表示必定发生。必须启用对应功能，且仍需通过保护检查。
ei-terrain-axial-tilt=用于计算季节性日照差异的假定地轴倾角，默认为 23.5 度。数值越大，季节差异通常越明显。全亮和全暗时段各保留至少全天的 2%；不影响 Fulgora。
ei-terrain-latitude=用于季节性昼长的假定纬度，默认为 45 度。纬度绝对值越大，季节差异越明显；正负号会对调夏季与冬季。此设置不会移动玩家或改变行星自转。
ei-terrain-season-strength=季节对生态变化速率的影响强度。仅在启用季节性生态变化时生效。
ei-terrain-dirty-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-clean-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-soil-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-recovery-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-mining-radius=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-mining-patch-radius=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-tree-growth-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-tree-density-limit=当指定邻域内的树木数量达到此上限时，暂停自然再生。
ei-terrain-tree-neighborhood=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-tree-stress-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-tree-aging-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-tree-rot-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-hazard-seconds=以模拟秒数表示的延迟或间隔。执行时仍需满足环境条件，并有可用的处理预算。
ei-terrain-wildfire-radius=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-hazard-radius=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-calendar-days=以记录的 Nauvis 日长为基准设置一年长度，默认为 360 天。各星球的年长按已加载星图中的距离缩放。修改时保留当前季节相位，绝不改变行星自转。
ei-terrain-protection-buffer=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-max-depth=相对于记录中的原始地形，允许经历的最大退化阶段数。
ei-terrain-seed-distance=以地块为单位的距离或半径。即使位置符合其他条件，保护检查仍可能阻止修改。
ei-terrain-interval=自定义预设：全局处理检查的间隔，以游戏刻（tick）计。数值越大，处理频率越低，覆盖速度越慢；延后的工作绝不会集中补算。
ei-terrain-search-interval=自定义预设：两次补充实体搜索额度之间的最少游戏刻数，额度由所有地表共享。此设置与处理间隔分开；较短间隔允许更多搜索，也可能增加 UPS 开销。未使用的额度不会累积。
ei-terrain-cold-chunks=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-active-chunks=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-candidates=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-histories=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-writes=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-recovery-reserved=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-searches=自定义预设：搜索间隔到期后，单次处理允许的实体搜索上限。所有地表共享此额度，未使用的搜索次数不会保留到下次。
ei-terrain-result-limit=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-events=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-mining-queries=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-mining-candidates=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-admissions=仅在自定义处理预设下使用。这是所有地表共享的有限工作量上限，并非每颗行星各自拥有的额度。提高数值可能增加处理器负载。
ei-terrain-active-cap=生态状态数据的最大存储量。提高上限会占用更多内存。每轮处理限制仍然生效。
ei-terrain-pending-cap=生态状态数据的最大存储量。提高上限会占用更多内存。每轮处理限制仍然生效。
ei-terrain-tile-history-cap=生态状态数据的最大存储量。提高上限会占用更多内存。每轮处理限制仍然生效。
ei-terrain-tree-history-cap=生态状态数据的最大存储量。提高上限会占用更多内存。每轮处理限制仍然生效。

