[string-mod-setting-description]
ei-terrain-intensity-restrained=克制模式使用 0.5 倍强度，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。处理预算单独控制。
ei-terrain-intensity-standard=克制模式使用 0.5 倍强度，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。处理预算单独控制。
ei-terrain-intensity-severe=克制模式使用 0.5 倍强度，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。处理预算单独控制。
ei-terrain-intensity-custom=克制模式使用 0.5 倍强度，标准为 1 倍，强烈为 2 倍。自定义使用所设倍率。处理预算单独控制。
ei-terrain-performance-ultra-low=每 16 刻处理一次；每 128 刻最多搜索 1 次实体。每次处理最多检查 1 条恢复记录、修改 1 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-low=每 16 刻处理一次；每 64 刻最多搜索 1 次实体。每次处理最多检查 2 条恢复记录、修改 2 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-lean=每 16 刻处理一次；每 32 刻最多搜索 1 次实体。每次处理最多检查 4 条恢复记录、修改 4 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-balanced=每 8 刻处理一次；每 16 刻最多搜索 1 次实体。每次处理最多检查 4 条恢复记录、修改 4 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-detailed=每 4 刻处理一次；每 8 刻最多搜索 1 次实体。每次处理最多检查 8 条恢复记录、修改 4 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-high-fidelity=每 2 刻处理一次；每 4 刻最多搜索 1 次实体。每次处理最多检查 8 条恢复记录、修改 4 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-ultra-high-fidelity=每 1 刻处理一次；每 2 刻最多搜索 2 次实体。每次处理最多检查 16 条恢复记录、修改 8 块地面。上限由所有地表共享；实际工作量取决于条件是否满足。
ei-terrain-performance-custom=使用单独设置的处理间隔、实体搜索间隔、工作量上限和存储上限。较小批次和较长搜索间隔可降低峰值负载，但会减慢覆盖速度。切换预设会保留已记录的恢复历史。
ei-terrain-wildfire-off=关闭生态系统主动点火。灼痕效果和其他战斗火灾仍由各自设置独立控制。
ei-terrain-wildfire-contained=不会蔓延的受控火焰，最长持续10秒。点火次数受限；不会接管其他火灾。
ei-terrain-wildfire-spreading=使用原生蔓延火焰。初始点火次数受限，但之后的引擎蔓延不受 ESIR 脚本预算约束，可能明显降低 UPS。

[exotic-industries-informatron]
menu_terrain_evolution=地形演变
title_terrain_evolution=地形演变

[ei-terrain]
overview=地形演变统一管理污染造成的土壤变化、基于记录的恢复、采矿痕迹与树木的自然反应。火灾、海岸线、悬崖、血液和铺装效果可以独立配置。Nauvis、Gaia 与支持的行星各自保留原有的地形体系。设计灵感来自 TerrainEvolution 与 TerrainEvolution2。
protections=常规土壤变化会保护玩家铺设的地面、基础设施、矿床以及不受支持的地形。恢复沿着 ESIR 记录的变化进行，不会把所有生态区都变成草地。灾害功能也需要通过保护检查。关闭功能只会停止新变化，不会撤销已有变化。
calendar=抽象季节历法使用已加载星图中的距离和方向，不移动行星，也不改变完整昼夜周期的长度。季节性昼长与季节性生态变化分别控制。Fulgora 保留独立时钟。发现已知的外部昼夜控制模组或检测到外部修改时，ESIR 会让出昼夜控制权。
performance=以较小批次频繁处理。超低负载和低负载优先减少工作量；轻量是保守的默认预设。均衡、详细、高保真和超高保真依次提高处理覆盖率和 UPS 开销。自定义使用各项独立上限。所有预算均由全部地表共享；变化强度和灾害开关仍独立控制。
effective=状态：__1__；处理：__2__；强度：__3__
mining-note=有限矿床在符合条件的采矿机覆盖范围内耗尽时，可能留下采矿痕迹；耗尽事件无法确定具体是哪台采矿机造成的。痕迹默认永久保留。可在生态设置中配置开关、范围及今后痕迹的恢复。
unsupported=不支持此地表或功能。
invalid-value=数值或设置组合无效。
updated=生态设置已更新。
status-enabled=已启用
status-disabled=已关闭
status-active=运行中
status-active-clamped=运行中，季节变化范围受限
status-external-control=由外部控制
status-frozen=时间已冻结
status-pending=等待中
status-released=已让出控制
status-excluded=已排除
status-invalid-input=输入无效
status-invalid-baseline=昼夜基准值无效
status-invalid-geometry=季节几何参数无效
status-incompatible-baseline=昼夜基准值不兼容
status-diurnal-dynamics=Diurnal Dynamics
status-TerrainEvolution2=Terrain Evolution 2
status-TerrainEvolution=TerrainEvolution

