[mod-setting-name]
ei-thrower-performance-profile=火焰与喷酸炮塔性能

[mod-setting-description]
ei-thrower-performance-profile=仅降低火焰与喷酸炮塔的液流粒子数、射击频率、烟雾量以及燃烧和腐蚀伤害的结算频率。提高单次命中伤害和每次射击的流体消耗，以维持持续射击时的理论每秒伤害和流体消耗。地面火焰的伤害、增强机制及各燃料对应的持续时间均不变。原始模式保留现有行为。8倍和16倍模式的射击间隔较大，会改变对移动目标的覆盖、火势增强过程及固定数值抗性的影响。倍率表示处理频率的降低幅度，不保证同等倍率的UPS提升。手持武器和载具武器不受影响。\n下列数值未计入品质、科技或其他模组的影响。各列依次为：射击间隔／粒子间隔／每秒粒子数／命中伤害与流体消耗倍率／燃烧结算间隔／腐蚀结算间隔。间隔单位为刻（60刻＝1秒）。

[string-mod-setting]
ei-thrower-performance-profile-original=原始
ei-thrower-performance-profile-2x=频率降至1/2
ei-thrower-performance-profile-4x=频率降至1/4
ei-thrower-performance-profile-8x=频率降至1/8
ei-thrower-performance-profile-16x=频率降至1/16

[string-mod-setting-description]
ei-thrower-performance-profile-original=现有行为：每4刻射击一次；每2刻产生一个粒子；每秒30个粒子；命中伤害和流体消耗不变；燃烧每10刻结算一次；腐蚀每刻结算一次。
ei-thrower-performance-profile-2x=每8刻射击一次；每4刻产生一个粒子；每秒15个粒子；命中伤害及每次射击的流体消耗为2倍；燃烧每20刻结算；腐蚀每2刻结算。
ei-thrower-performance-profile-4x=每16刻射击一次；每8刻产生一个粒子；每秒7.5个粒子；命中伤害及每次射击的流体消耗为4倍；燃烧每30刻结算；腐蚀每4刻结算。
ei-thrower-performance-profile-8x=每32刻射击一次；每16刻产生一个粒子；每秒3.75个粒子；命中伤害及每次射击的流体消耗为8倍；燃烧每30刻结算；腐蚀每8刻结算。稀疏射击会改变目标覆盖和固定数值抗性的影响。
ei-thrower-performance-profile-16x=每64刻射击一次；每32刻产生一个粒子；每秒1.875个粒子；命中伤害及每次射击的流体消耗为16倍；燃烧每30刻结算；腐蚀每16刻结算。极稀疏射击会改变目标覆盖和固定数值抗性的影响。

