[lance-upgrades]
axial=宽__1__格的中央切线向瞄准点后方延伸最多__2__格，命中最多__3__个额外敌方军事目标，各造成__4__激光伤害。两条分支从瞄准点以±__5__°展开，每条宽__6__格、长最多__7__格；两条合计命中最多__8__个额外目标，各造成__9__激光伤害。所有光线均限于有效射程内；每个敌人每次射击最多承受一次贯穿伤害，中央切线优先。
wound=直击从首击起获得+__1__%伤害。对同一目标每次连续造成有效直击伤害后，下一次直击的加成再增加__1__个百分点，最高+__2__%。更换目标或间隔达到__3__秒时重置。零伤害不会增加层数或刷新持续时间。次级伤害不享受此加成。
collapse=取代普通溅射，在开火__1__秒后于原瞄准点发生一次坍缩：半径__6__格内造成__5__激光伤害，其外至半径__3__格内造成__2__激光伤害。最多命中__4__个额外敌方军事目标；原直击目标若仍在范围内，也会单独受到伤害。核心与外圈伤害不叠加。
testament=每__1__次耗能射击触发：直击伤害（含创伤记忆）×__2__；中央切线目标上限__3__，两条分支共用目标上限__7__。第一次坍缩：半径__9__格内造成__8__激光伤害，其外至半径__5__格内造成__4__激光伤害；最多命中__6__个额外目标，另加符合条件的原直击目标。开火__10__秒后仅触发一次回响：__11__激光伤害、半径__12__格、最多__13__个额外目标，另加符合条件的原直击目标。即使原目标已消失或受到保护，该次射击仍计数。
research-row=__1__（研究解锁）
protection-title=目标保护
protection=原直击目标不承受普通溅射或任何贯穿光线的伤害，但只要位于相应范围内，便可受到每次坍缩的伤害，且不占用额外目标名额。同阵营、中立、友好或停火阵营均受保护，外交关系按双方任一方向判定。一个敌人可承受一次贯穿伤害，以及每次坍缩各一次伤害。
status=基础直击DPS：__1__ • __2__
status-wound= • 创伤直击 __1__–__2__
status-testament= • 每__1__次射击×__2__
baseline=基础能力
force-values=当前阵营 • 伤害倍率×__1__ • 直击__2__激光伤害 • 持续直击DPS __3__（未计创伤记忆与遗言）• 基础射程__4__格，品质可增加射程。下列数值已计入当前阵营的伤害研究。
base-area=普通溅射：__1__激光伤害，半径__2__格，最多__3__个额外目标。终末坍缩将取代此效果。
rules=每次耗能射击与每次坍缩的伤害均独立结算。符合中央切线条件的目标优先归入中央切线，重叠光线不会重复造成贯穿伤害。每次坍缩只造成核心或外圈伤害，两者不叠加。坍缩范围与核心范围均按目标中心判定；中心恰好位于边界上的目标也计入。目标移动或长矛被移除后，两次坍缩仍留在原瞄准点；移出范围可以躲避。数值在开火时确定。创伤会在中断后失效，印记跟随目标。遗言统计射击次数，而非命中数或击杀数。最后一级只要求完成黑洞研究，无需运行黑洞。品质与目标碰撞范围决定直击射程。所有视觉精度下均保留核心提示，装饰效果不影响伤害。
research-state=__1__ — __2__
active=已启用
locked=未解锁
prerequisites=直接前置科技：
science=所需科技包：
legend-1=视觉提示：白金色中央切线与青色边缘，两条较细的棱彩分支从瞄准点展开。流动光带与渐细光尾延伸至各条光线的真实终点。
legend-2=视觉提示：色彩沿裂纹流动；1—2层为裂缝，3—4层为分支裂纹，5层为破碎圆环。印记跟随目标，随创伤失效而消失。
legend-3=视觉提示：固定瞄准点处可见收缩的外环与核心边界，棱彩彗尾盘旋汇入其中，伤害结算时核心放出更强的闪光。
legend-4=视觉提示：宽阔棱彩光带之间的暗色光束核心；更大的暗色坍缩核心与明亮吸积环，随后再次收缩，以终末十字闪光标示回响。
static-values=所列伤害为长矛伤害研究生效前的基础值。创伤记忆取决于连续直击次数，遗言取决于耗能射击次数，因此不存在固定的范围DPS。
