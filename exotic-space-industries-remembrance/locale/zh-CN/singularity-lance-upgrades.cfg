[lance-upgrades]
axial=宽__1__格的切线在有效射程内向瞄准点后方延伸最多__2__格，命中最多__3__个额外敌方军事目标，各造成__4__激光伤害。
wound=对同一目标连续造成有效直击伤害时，下一次直击伤害增加__1__%，最高+__2__%。首击无加成。更换目标或间隔达到__3__秒时重置。零伤害不会增加层数或刷新持续时间。次级伤害不享受此加成。
collapse=取代普通溅射，在开火__1__秒后于原瞄准点发生一次坍缩：__2__激光伤害，半径__3__格，最多命中__4__个额外敌方军事目标。
testament=每__1__次耗能射击触发：直击伤害（含创伤记忆）×__2__；轴向目标上限__3__；坍缩伤害__4__、半径__5__、目标上限__6__。即使原目标已消失或受到保护，该次射击仍计数。
research-row=__1__（研究解锁）
protection-title=目标保护
protection=原直击目标不承受任何次级伤害。同阵营、中立、友好或停火阵营均受保护，外交关系按双方任一方向判定。其他敌人可同时承受贯穿与范围伤害。
status=持续直击DPS：__1__ • __2__
baseline=基础能力
force-values=当前阵营 • 伤害倍率×__1__ • 直击__2__激光伤害 • 持续直击DPS __3__（未计创伤记忆与遗言）• 基础射程__4__格，品质可增加射程。下列数值已计入当前阵营的伤害研究。
base-area=普通溅射：__1__激光伤害，半径__2__格，最多__3__个额外目标。终末坍缩将取代此效果。
rules=每次耗能射击的伤害均独立结算。目标移动或长矛被移除后，坍缩仍留在原瞄准点，其数值在开火时确定。创伤会在中断后失效，印记跟随目标。遗言统计射击次数，而非命中数或击杀数。最后一级只要求完成黑洞研究，无需运行黑洞。品质与目标碰撞范围决定直击射程。所有视觉精度下均保留核心提示，装饰效果不影响伤害。
research-state=__1__ — __2__
active=已启用
locked=未解锁
prerequisites=直接前置科技：
science=所需科技包：
legend-1=视觉提示：白色切线，两侧伴有青色裂纹，延伸至真实贯穿终点。
legend-2=视觉提示：1—2层为裂缝，3—4层为分支裂纹，5层为破碎圆环。印记随创伤失效而消失。
legend-3=视觉提示：圆环在固定瞄准点向内收缩，并在伤害结算时闪光。
legend-4=视觉提示：暗色光束核心、宽阔白紫边缘、暗色坍缩圆盘、明亮光环与终末十字闪光。
static-values=所列伤害为长矛伤害研究生效前的基础值。创伤记忆与遗言需满足触发条件，因此不存在固定的范围DPS。
