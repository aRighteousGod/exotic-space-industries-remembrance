[recipe-description]
ei-irradiated-water-purification=从冷却液中剥离放射性污染，将其转化为污水和浓缩核废料。
ei-sulfuric-uranium-235-reprocessing=较早可用的硫酸路线，以更高的废料负担把铀-238推向铀-235。
ei-fluoride-uranium-235-reprocessing=更干净的氟化路线，在把铀-238推向铀-235的同时回收更多物料。

