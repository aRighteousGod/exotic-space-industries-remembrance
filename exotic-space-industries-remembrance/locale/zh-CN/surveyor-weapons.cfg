[technology-description]
ei-surveyor-carbine=给旧机枪框架加入玻璃、压力与铁制校正机构。它不会更快。它会更远。
ei-surveyor-rifle=用电力复进和更好的光学系统稳定勘测者结构，把远射学说推进到电气时代。
ei-surveyor-cannon=用模拟数据和碳纤维板加固勘测者系列，将其变为自动反器材武器。武器持续开火，但每一发仍然属于瞄具。
ei-adaptive-surveyor=利用高级数据、奇特镀层和自适应膛室学说，将勘测者系列转化为量子远程处决系统。
military-5=将模拟杀伤学说正规化：预测陷阱、破障装药、炼狱弹药与火焰机器人升级都纳入同一获准指挥框架。
ei-inferno-grenade=授权将集束手雷重构为模拟火焰区域封锁装药：外壳破裂，碎片坠落，每次撞击都会写下新的火环。
ei-incinerator=授权毁灭者衍生的焚灭者：五台高速护卫会追随、焚烧，并拒绝火焰的仁慈。
