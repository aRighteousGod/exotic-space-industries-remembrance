[item-description]
ei-surveyor-carbine=带玻璃瞄具的蒸汽时代卡宾枪。射速很慢，但经过压力校正的枪管比普通自动武器打得更远。
ei-surveyor-rifle=电力稳定的勘测者枪架。开火依旧克制，瞄准图像却更加清晰。
ei-surveyor-cannon=模拟时代的反器材勘测者。自动化的大口径纪律依靠建模命中和碳纤维后坐结构运行。
ei-adaptive-surveyor=量子时代的模块化狙击系统。高级数据会在扳机尚未走完前预测膛室、枪管、风和目标。
ei-inferno-grenade=改造成会在目标处裂成爆炸性燃烧碎片的集束手雷。每枚碎片都会在撞击时爆炸，随后播撒自己的火环。
ei-incinerator-capsule=释放五台高速的毁灭者衍生焚灭者。它们追随、焚烧，并拒绝火焰的仁慈。
ei-prediction-snare-mine=一种部署式模拟陷阱，会预测敌方移动，并向附近生物灌入扰乱运动的虚假信号。
ei-breach-solver-charge=一种紧凑求解装药，把模拟数据倾注进狭窄的过量爆炸，用于撕开虫巢、沙虫和硬化目标。

