[mod-setting-description]
ei-pyric-radiance=为燃烧火焰、火焰喷流、普通爆炸、枪口闪光和实体弹丸添加照明。保留各燃料的颜色和专属特效。仅改变视觉表现：火势蔓延、地图、夜视、手电筒和昼夜时长均保留现有行为。关闭后仍保留所选教义。
ei-pyric-radiance-preset=选择火光、爆炸照明、曳光照明和枪口闪光的比例。倍率改变光照半径；零倍率保留该类效果原有的视觉表现。频繁命中的额外光效和额外核爆闪光仅用于更强烈的教义；现有核爆屏幕效果保持不变。异装弹药和能量武器的专属特效保留自身的视觉表现。\n
ei-ballistic-divergence=子弹会飞行、偏离目标，并击中沿途的其他目标。适用于现有子弹弹匣、霰弹颗粒和发射子弹的战斗机器人。己方阵营的玩家和建筑不会阻挡这些弹丸；其他盟友阵营和中立地形物体仍可能被击中。现有溅射和燃烧效果保留各自规则。穿甲及铀子弹弹匣使用原生穿透机制，穿透预算为其基础物理伤害的25倍，可继续穿过被击杀的目标；存活目标会使子弹停止。异装弹药保留单次命中的完整效果。不增加弹药或研究。关闭后仍保留所选教义。
ei-ballistic-divergence-preset=选择弹丸的最大额外飞行距离、子弹散布、弹匣容量和霰弹飞行距离变化的指定倍率。基础飞行距离覆盖兼容且启用的武器所需的最远射程，并计入弹药射程修正、品质和枪口位置余量。超过这一基础距离的额外飞行距离最多为16格；武器的目标锁定范围不变。子弹散布倍率作用于0.16的角度偏差和0.40的指定飞行距离偏差；零倍率去除新增的子弹散布。子弹和霰弹的飞行距离变化受所选额外飞行距离上限约束，霰弹枪原有的散布锥保持不变。弹匣容量向上取整；霰弹弹匣容量和机器人弹药不变。地形保护为树木设置至少2点固定减免和65%的物理抗性，为岩石设置至少4点固定减免和75%的物理抗性，影响它们受到的所有物理伤害。\n

