pyric-radiance=Pyric Radiance
pyric-radiance-text=炉火向黑夜献上见证。燃烧火焰保留各燃料的颜色；普通射击与爆炸照亮自身经过的地方。在启动设置中选择教义，让余烬、射击阵地、曳光轨迹或广阔的攻城火光成为主角。地图、火势蔓延、夜视、手电筒和昼夜循环均保留现有行为。异装弹药的爆发与能量武器的专属特效保留自身的视觉特征。
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=子弹承载的是誓言，而非必中。现有子弹变为实体弹丸，沿弹道飞行；敌人与中立障碍物能够将其截住。己方阵营不会阻挡这些弹丸，独立的盟友阵营仍可能被击中。现有溅射与燃烧效果保留各自规则。穿甲及铀子弹弹匣的原生穿透预算为基础物理伤害的25倍：子弹可以穿过被击杀的目标，存活目标则会使其停止。异装弹药只触发一次完整命中效果。兼容且启用的武器共用弹丸飞行距离上限，其中计入弹药射程修正、品质和枪口位置余量。教义允许在这一基础距离之外增加有限的飞行距离，并约束子弹和霰弹的飞行距离变化，不改变武器的目标锁定范围或霰弹枪原有的散布锥。未命中的弹丸达到引擎原生距离上限后会消失。新上限适用于新发射的弹丸；已经在飞行中的弹丸保留已保存的距离和命中效果。部分教义增加子弹弹匣容量或保护地形；配方、科技、霰弹容量和机器人伤害不变。
