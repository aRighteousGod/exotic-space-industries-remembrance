[string-mod-setting-description]
ei-pyric-radiance-preset-ember=少量增强光照，较少移动光源。
ei-pyric-radiance-preset-veiled=为普通战斗效果提供克制的照明。
ei-pyric-radiance-preset-furnace-vigil=以燃烧的地面和森林为主；不新增移动光源。
ei-pyric-radiance-preset-iron-benediction=以更强的枪口闪光突出射击阵地。
ei-pyric-radiance-preset-signal-threads=以更强的曳光照明突出弹丸轨迹。
ei-pyric-radiance-preset-tempered=适中的默认照明；无额外命中或核爆光效。
ei-pyric-radiance-preset-night-liturgy=广泛而温暖的战斗照明，包含额外命中光效。
ei-pyric-radiance-preset-siege-hymn=强烈的枪口闪光，让来袭火力清晰可见。
ei-pyric-radiance-preset-cataclysm=大范围爆炸照明和明显的核爆闪光。
ei-pyric-radiance-preset-apotheosis=最强的氛围和最高的光源密度。
ei-ballistic-divergence-preset-needle-oath=子弹沿直线飞行，不增加散布或额外飞行距离；保留现有弹匣容量和霰弹枪原有的散布锥。
ei-ballistic-divergence-preset-measured-volleys=子弹偏差较小，保护地形，并保留现有弹匣容量。
ei-ballistic-divergence-preset-breach-doctrine=更大的子弹散布和弹匣容量；地形仍易受损。
ei-ballistic-divergence-preset-tempered=适中的散布和额外飞行距离；保留当前子弹弹药的消耗水平。
ei-ballistic-divergence-preset-distant-thunder=更长的额外弹丸飞行距离，子弹散布较小。
ei-ballistic-divergence-preset-fortress-oath=更大的弹匣、适中的散布，并保护地形。
ei-ballistic-divergence-preset-wildfire-doctrine=较大的子弹散布和霰弹飞行距离变化指定倍率，更大的弹匣，并保护地形。
ei-ballistic-divergence-preset-crossfire=更长的额外弹丸飞行距离和较大的子弹散布；地形仍易受损。
ei-ballistic-divergence-preset-saturation=更长的额外飞行距离、较大的散布、双倍子弹弹匣容量，并保护地形。
ei-ballistic-divergence-preset-terminal-barrage=最大的额外飞行距离、散布和子弹弹匣容量；地形仍易受损。

