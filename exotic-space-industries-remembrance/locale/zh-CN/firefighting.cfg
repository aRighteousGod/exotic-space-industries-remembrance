[item-description]
ei-water-turret=消耗水和100 kW电力，使敌人减速25%，持续2秒，不造成伤害；也可自动扑灭附近火灾。射程：24。每次灭火脉冲消耗15单位水。可在炮塔界面设置优先级。
ei-extinguisher=手动清除小范围内的火焰和酸液池。需要灭火器罐。
ei-extinguisher-ammo=手持灭火器用罐。容量：100。

