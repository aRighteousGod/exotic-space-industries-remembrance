ei-water-turret-fire-targeting=从邻近区块选择首次找到的火焰，可减少搜索开销。最近火焰会比较射程内所有已登记的火焰。两种模式都会保留仍然有效的目标。仅在火焰生成时检测，不进行周期性搜索。

