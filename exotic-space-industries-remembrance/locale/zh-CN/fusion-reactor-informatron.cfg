[exotic-industries-informatron]
menu_fusion_power=核聚变动力
title_fusion_power=核聚变动力
fusion-power=核聚变动力
fusion-power-text=[color=orange]核聚变反应堆[/color] [item=ei-fusion-reactor] 是后期动力系统，在受控等离子容器中消耗轻原子燃料。\n\n它依靠封闭的铅冷却剂回路运行：[fluid=ei-cold-coolant]进入炉体，[fluid=ei-hot-coolant]带着热负荷离开。反应堆建造昂贵，运行更饥渴。启动后，它会持续索取加热后的聚变燃料。\n\n早期燃料包括[fluid=ei-heated-protium]和[fluid=ei-heated-lithium-6]。更强的燃料链会通向[fluid=ei-heated-deuterium]、[fluid=ei-heated-tritium]和[fluid=ei-heated-helium-3]。\n\n聚变并不洁净，也并不免费。它是一颗被管道、磁场和拒绝熄灭的意志驯服的小型恒星。
fusion-power-2=中子与你
fusion-power-2-text=聚变反应堆也可以作为中子源。低温有利于中子泄漏，中温保持折中，高温会压制中子通量并偏向功率输出。\n\n附近的[color=orange]中子收集器[/color] [item=ei-neutron-collector]会绑定范围内最强的可用来源。反应堆模式、距离和活动状态共同决定可用通量。\n\n中子不是装饰品。它们是高级聚变燃料的货币。贴近建造，谨慎调校，不要把更明亮的恒星误认为更慷慨的恒星。
menu_fusion_reactor_controls=聚变反应堆控制
title_fusion_reactor_controls=聚变反应堆控制
fusion-reactor-controls=手动控制
fusion-reactor-controls-text=反应堆控制台保留四项手动控制：燃料1、燃料2、温度和注入率。这些选择会共同选中一个锁定的隐藏配方，决定燃料消耗、冷却剂吞吐量、预计功率和中子通量。
fusion-reactor-controls-2=燃料组合与锁定配方
fusion-reactor-controls-text-2=只有有效燃料组合才能点火。如果所选第二燃料无法与第一燃料反应，控制台会回退到反应堆有序表中的第一个有效第二燃料，而不是让炉体停在不可能的状态。
fusion-reactor-controls-3=温度与注入
fusion-reactor-controls-text-3=温度和注入是两根独立的杠杆。低温中子丰富但功率低。中温是折中。高温压制中子输出并偏向发电。低注入节省燃料，中注入稳定，高注入燃烧更猛烈，燃料代价也更高。
menu_fusion_reactor_circuit_interface=聚变电路接口
title_fusion_reactor_circuit_interface=聚变电路接口
fusion-reactor-circuit-interface=隐藏组合器接口
fusion-reactor-circuit-interface-text=反应堆电路面沿用其他 ESIR 系统的隐形组合器模式。隐藏接口会内部连接到可见反应堆接头，发布遥测，并在反应堆处于 Circuit 模式时接受控制信号。
fusion-reactor-circuit-interface-2=读写信号契约
fusion-reactor-circuit-interface-text-2=Manual 模式会忽略写入信号，但接线时仍会发布可读状态。Circuit 模式读取 [virtual-signal=ei-fusion-set-fuel-1]、[virtual-signal=ei-fusion-set-fuel-2]、[virtual-signal=ei-fusion-set-temperature] 和 [virtual-signal=ei-fusion-set-injection]。燃料数值为：1 氕，2 氘，3 氚，4 氦-3，5 锂-6。温度和注入使用 1 低、2 中、3 高。缺失或为零的字段使用手动回退值。读回状态使用独立信号，因此反应堆不会被自己的信号回声命令。
menu_fusion_reactor_agents=聚变反应堆代理
title_fusion_reactor_agents=聚变反应堆代理
fusion-reactor-agents=代理状态
fusion-reactor-agents-text=代理是供电路和诊断使用的紧凑状态值。控制代理报告 Manual 或 Circuit 权限。燃料代理报告所选组合有效或已校正。热代理报告低、中、高约束姿态。冷却剂代理报告所选配方是否具有有效冷却需求。电路代理报告未接线、可读取或正在命令。
fusion-reactor-agents-2=信号数值
fusion-reactor-agents-text-2=数字规则刻意保持简单。控制代理：1 手动，2 电路。燃料代理：1 有效，2 已校正。热代理：1 低，2 中，3 高。冷却剂代理：1 有效需求，3 无效或干涸。电路代理：1 未接线，2 可读取，3 命令中。
menu_fusion_reactor_options=聚变反应堆选项
title_fusion_reactor_options=聚变反应堆选项
fusion-reactor-options=选项与回退
fusion-reactor-options-text=选项是叠加在同四项手动控制上的便捷命令。重置默认会回到氘-氚、中温、中注入。刷新收集器会强制附近中子收集器重新评估该反应堆。
fusion-reactor-options-2=预设与覆盖
fusion-reactor-options-text-2=功率、通量、平衡预设会选择合理的手动值，但不会隐藏精细控制。在 Circuit 模式下，如果某个电路字段缺失、为零或无效，这些手动值仍会作为回退。
menu_fusion_neutron_collectors=聚变与中子收集器
title_fusion_neutron_collectors=聚变与中子收集器
fusion-neutron-collectors=与中子收集器的关系
fusion-neutron-collectors-text=聚变反应堆与中子收集器由源强度、活动状态和距离相连。改变反应堆配方会改变范围内收集器看到的中子倍率，因此反应堆模式改变时会刷新收集器队列。
fusion-neutron-collectors-2=布局压力
fusion-neutron-collectors-text-2=收集器奖励几何。近距离低温反应堆能用强通量供养燃料生产；高温发电反应堆可能产生更多热量，却让收集器挨饿。工厂必须决定，这颗星是发电机、增殖源，还是被精确分割的誓约。

