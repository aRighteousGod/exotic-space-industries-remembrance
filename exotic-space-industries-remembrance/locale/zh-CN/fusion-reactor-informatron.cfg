ei-fusion-set-fuel-1=设置聚变燃料1
ei-fusion-set-fuel-2=设置聚变燃料2
ei-fusion-set-temperature=设置聚变温度
ei-fusion-set-injection=设置聚变注入
ei-fusion-state-fuel-1=聚变燃料1状态
ei-fusion-state-fuel-2=聚变燃料2状态
ei-fusion-state-temperature=聚变温度状态
ei-fusion-state-injection=聚变注入状态
ei-fusion-power=聚变功率
ei-fusion-neutron-flux=聚变中子通量
ei-fusion-efficiency=聚变效率
ei-fusion-coolant-rate=聚变冷却剂流量
ei-fusion-control-agent=聚变控制代理
ei-fusion-fuel-agent=聚变燃料代理
ei-fusion-thermal-agent=聚变热代理
ei-fusion-coolant-agent=聚变冷却剂代理
ei-fusion-circuit-agent=聚变电路代理

[virtual-signal-description]
ei-fusion-set-fuel-1=燃料1的电路输入。数值：1 氕，2 氘，3 氚，4 氦-3，5 锂-6。
ei-fusion-set-fuel-2=燃料2的电路输入。数值：1 氕，2 氘，3 氚，4 氦-3，5 锂-6。
ei-fusion-set-temperature=温度的电路输入。数值：1 低，2 中，3 高。
ei-fusion-set-injection=注入速率的电路输入。数值：1 低，2 中，3 高。
ei-fusion-state-fuel-1=输出有效燃料1索引。
ei-fusion-state-fuel-2=输出有效燃料2索引。
ei-fusion-state-temperature=输出有效温度索引。
ei-fusion-state-injection=输出有效注入索引。
ei-fusion-power=输出估算反应堆功率，单位 MW。
ei-fusion-neutron-flux=输出中子通量乘以100。
ei-fusion-efficiency=输出效率百分比。
ei-fusion-coolant-rate=输出每秒热冷却剂量乘以100。
ei-fusion-control-agent=输出 1 手动或 2 电路。
ei-fusion-fuel-agent=输出 1 有效或 2 已校正。
ei-fusion-thermal-agent=输出 1 低、2 中或 3 高。
ei-fusion-coolant-agent=输出 1 有效冷却剂需求或 3 无效。
ei-fusion-circuit-agent=输出 1 未接线、2 可读取或 3 命令中。
