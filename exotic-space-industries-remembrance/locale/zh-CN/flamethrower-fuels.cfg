[item-name]
ei-flamethrower-fuel=火焰喷射器弹药（__1__）
[item-description]
ei-flamethrower-fuel=火焰伤害：原油弹药的__1__%。地面火焰初始持续__2__秒，持续补充燃料后最长可达__3__秒。目标身上的燃烧持续时间不变。载具火焰喷射器保留原有的燃烧机制。
[entity-description]
ei-flamethrower-fuel=燃料特效：__1__。地面火焰初始持续__2__秒，持续补充燃料后最长可达__3__秒。
[mod-setting-name]
ei-flamethrower-fuel-adaptation=火焰炮塔燃料专属特效
[mod-setting-description]
ei-flamethrower-fuel-adaptation=根据正在消耗的燃料自动调整炮塔的火焰、烟雾和地面火焰持续时间。关闭后，炮塔使用统一特效和正常燃烧时间；所有燃料伤害倍率和弹药种类仍然可用。每16刻更新一次。燃料检查次数和炮塔替换尝试次数均以每刻脚本更新次数的完整设定值为上限。关闭时会在此预算内逐步恢复现有炮塔。默认开启。
