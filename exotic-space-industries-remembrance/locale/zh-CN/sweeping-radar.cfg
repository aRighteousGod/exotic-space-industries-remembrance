[sweeping-radar]
description=可通过研究升级的定向雷达。基础最大半径：__1__区块。设备上限：每秒__2__次观测。红线输入控制，绿线输出报告。打开以配置。实际刷新速度受电力和共享处理能力限制。研究和品质提高范围、扫描能力和能效。
