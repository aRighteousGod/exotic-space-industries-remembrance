informatron-body=红线控制已启用覆盖的字段，绿线输出报告。零也是实际输入值。五种模式和三种报告策略从一开始就可用。研究提高范围、扫描能力和能效；品质还会提高这些性能和生命值。\n\n一次观测绘制一个区块，并采样存活的敌对军事目标。位置和时间表示最后一次观测，不会持续追踪目标。有效的零目标报告与不可用数据不同。每次查询最多保留128个候选，每个工作集合最多2,048条记录。截断后的数量是下限。\n\n监视不生成地形。勘测在全体雷达中每30刻最多提交一次生成请求。60秒仍无法完成的请求会被放弃并标记覆盖不完整。改变几何设置会取消未完成工作并清除报告。暂停、冻结和无效设置会使报告失效；完成一次脉冲后等待时可以保留结果。取消的工作不退还已消耗电力。\n\n全体雷达共享每秒最多120次观测启动，之后还受电力、生成和目标处理限制。速度设置是请求值。面板显示自放置以来的平均实测速率、理想耗时和上一轮实际耗时。波束跟随已完成的观测；天线动画不代表准确方向。\n\n待机和观测由同一个隐藏电力缓冲设备供电。复制和修复后的缓冲设备初始为空。升级保留设置并转移现有电力，但不超过新容量。普通雷达仍可使用。\n\n基础电力参数：扫掠雷达待机功耗1 MW，每次观测8 MJ，输入上限64 MW，储能容量16 MJ；相控阵雷达待机功耗2 MW，每次观测5 MJ，输入上限128 MW，储能容量10 MJ。品质最多增加4区块半径和50%扫描能力，并使每次观测耗能最多降低20%。这些加成与研究效果共同生效，品质加成以传说等级为上限。品质不改变待机功耗或共享处理上限。暂停或等待脉冲时仍消耗待机电力。输入上限是充电功率上限；实际耗电量取决于待机时间和已接受的观测次数。
