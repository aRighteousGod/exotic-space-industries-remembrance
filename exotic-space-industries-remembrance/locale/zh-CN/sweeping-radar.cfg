tip-mode=1 全周，2 扇区，3 环带，4 脉冲，5 固定方位。各模式分别保留手动几何设置。
tip-radius=正值会限制在研究和品质允许的最大范围内。一区块为32格。
tip-near=必须小于外半径。用于环带、脉冲和固定方位模式。
tip-start=顺时针覆盖区间的起点，与实际扫描方向无关。
tip-stop=顺时针覆盖区间的终点，支持跨越北方。两端相同表示360°。
tip-bearing=反复观测宽32格的条带。
tip-speed=0暂停。100请求设备、研究和品质允许的上限；共享处理能力可能降低实际速度。
tip-direction=1 顺时针，-1 逆时针，0 在扇区内往返。固定方位也接受0。
tip-policy=监视只处理已生成且已绘制到地图上的区块。勘测允许生成新地形。
tip-contacts=保留近期各目标的最后观测、一次性发布上一轮完整扫描，或仅保留最近一次观测。
tip-expiry=从实际观测时刻起保留1–300秒，而非从发布时间起计算。
tip-run=正信号运行，零或负值暂停。取消的已付费工作不退还电力。
tip-trigger=上升沿启动一次扫描。忙碌时忽略额外触发。保持信号直到“扫描中”输出确认，然后归零再触发。按钮可手动启动。
