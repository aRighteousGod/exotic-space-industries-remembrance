[ei-factory-passage-guide]
walking-heading=在机器之间行走
walking=给工程师留条路。通行功能缩小受支持的生产、电力、物流建筑和炮塔的碰撞范围，让你能从相邻建筑之间穿过。实体中心仍然阻挡通行。防御墙、闸门、自然障碍、车辆、敌人、非网格实体和不可见辅助实体保留原有碰撞。
modes-heading=选择管道模式
modes=Vanilla保留游戏及其他模组提供的碰撞。Squeak Through允许穿过相邻接头，无需额外模组。ESIR让实际连接的地上接头保持阻挡，同时开放未连接的空隙。地下段不会增加屏障。普通管道会向侧面连接：紧贴的两排会形成连通网格，并不是行走通道。
controls-heading=找到设置
controls=类别和管道模式属于启动设置，修改后需要重启。运行中的处理速度在模组设置 → 地图，或管理 → 选项 → 性能中调整。两处修改的是同一组存档全局值。主要预算（默认__3__）用于端点更新、被占用接头重试及界面观察。首次发现实体和即时清除辅助实体仍是同步操作。
recipes-heading=配方变化
recipes=建造、旋转、粘贴设置等受支持事件会安排局部更新。打开原生机器界面时会及时检查配方。使用原生电路选配方且未打开界面的组装机交给后台扫描器。关闭界面的手动机器没有周期性检查。其他模组若静默修改配方或电路选择，必须调用现有的工厂通行刷新接口。
scanner-heading=调整扫描器
scanner=????????????????????电路预算默认每刻__1__次尝试，额外加在主要预算之外。每台机器在成功检查或完成更新后有__2__刻冷却；界面及事件更新不受此限制。正常速度下，默认值允许整个存档每秒最多__4__次尝试。稳定的600台符合条件的机器扫描一轮大约需要__5__秒。这只是示例，不是响应时间保证，连接更新积压还会增加延迟。提高预算能更快更新，降低预算能限制工作量；两个预算都不保证每刻耗时。
troubleshooting-heading=关闭扫描与排查问题
troubleshooting=关闭扫描器后，无人查看的电路变化可能暂未反映到碰撞；界面与事件更新仍有效。检查工厂通行是否启用、管道模式是否为ESIR。Squeak Through 2拥有优先权。若接头正在等待角色离开，请让出位置。获授权的管理员可使用诊断 → 工厂通行 → 修复，或 /ei-admin-repair factory-passage，重建追踪信息而不替换机器。
current-heading=当前设置
current=所选模式：__1__\n实际模式：__2__\n未运行原因：__3__\n主要更新预算：每刻__4__\n电路扫描器：__5__\n额外电路预算：每刻__6__\n重新打开页面时刷新此快照。
