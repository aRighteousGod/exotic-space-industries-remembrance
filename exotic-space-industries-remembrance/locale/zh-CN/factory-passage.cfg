[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=?????在后台检查使用原生电路选配方、且未打开界面的组装机。关闭后，电路变化可能要等到事件或显式刷新才会更新管道碰撞。已打开界面的观察和事件更新仍然工作。下一个处理刻生效，不重建辅助实体。非ESIR管道模式、关闭工厂通行或Squeak Through 2优先时不运行。
ei-factory-passage-circuit-scan-budget=整个存档每刻额外允许的电路扫描尝试次数（1–1,024；默认1），与主要更新预算分开。每台机器在成功检查配方或完成连接更新后，至少等待60刻才可再次后台扫描。较低值减少脚本工作量，但会延迟碰撞更新；较高值更快清理队列，但可能增加每刻耗时。两个预算都不保证毫秒耗时。无需重启，关闭扫描器时仍保留该值。
ei-factory-passage-update-budget=每 tick 处理的排队任务数上限（1–1,024；默认 256）。较低的值可减少脚本工作量，但会延迟管道碰撞更新；较高的值可更快处理队列，但可能增加每 tick 的计算耗时。立即对所有地表生效，无需重启。首次扫描世界中的设施以及清理碰撞辅助实体均为同步操作，不受此设置限制。在管道模式不是 ESIR、工厂设施间通行已禁用，或 Squeak Through 2 优先生效时，此设置不起作用。
ei-factory-passage-enabled=允许从相邻且受支持的工厂设施之间通行。关闭后会停用ESIR的所有通行调整，但保留各类别的选择。
ei-factory-passage-production=允许从相邻的生产机器、采矿机、研究中心等设施之间通行。
ei-factory-passage-power=允许从相邻的发电机、锅炉、反应堆、蓄电池、太阳能板及电力设施之间通行。
ei-factory-passage-logistics=允许从相邻的仓储设施、机械臂、电路设备、插件效果分享塔、雷达、机器人指令平台及火车站之间通行。
ei-factory-passage-turrets=允许从玩家建造的相邻炮塔之间通行。
ei-factory-passage-pipe-mode=原版：保留管道原有的碰撞规则。\nSqueak Through：允许从相邻管段之间通行，包括已连接的接头；管道中心仍不可穿过。\nESIR：允许通过未连接的间隙，但已连接的地上接头仍会阻挡通行。新接头的阻挡区域会等角色离开后才启用。地下管段及原本就可通行的热管仍可通行。

