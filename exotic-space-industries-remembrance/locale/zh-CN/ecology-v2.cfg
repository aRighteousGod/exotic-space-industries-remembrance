[mod-setting-description]
ei-ecology-alert-enabled=在原版警报窗口接收所选的成功生态事件。仅控制个人通知的总开关。
ei-ecology-alert-surfaces=使用 all 或精确名称的 JSON 数组。[] 表示不选。最多128个名称、4096字节。生态界面修改同一设置。不存在的名称不匹配任何地表。
ei-ecology-alert-current-surface-only=将所选通知进一步限制为当前查看的地表，包括远程视图。默认关闭。
ei-ecology-alert-allow-unrevealed=仅管理员：绕过区块当前可见性。类别与地表筛选仍有效。默认关闭。普通玩家仅探索过该地块仍不够。
ei-terrain-periodic-mining-scars=符合条件的采石场和大型采矿机开采有限矿床时，可扰动周边裸露的自然地面。尚存矿床、设施及保护区不受影响。矿床耗尽产生的痕迹仍由独立事件触发。
ei-terrain-periodic-mining-seconds=强度和季节调整前的基础间隔。默认300秒在克制强度下为600秒，再应用季节调整。延迟检查只进行一次尝试，不补做错过的抽取。
ei-terrain-periodic-mining-probability=每次符合条件的周期机会的概率。默认10%。不改变已选斑块内每格独立70%的概率。
ei-ecology-alert-wildfire=生态效果成功后通知：山火点燃。通知不会启用效果本身，仍受个人地表筛选及可见性约束。山火仅表示成功点燃，不代表森林已经烧毁。
ei-ecology-alert-flood=生态效果成功后通知：洪水。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-drought=生态效果成功后通知：岸边干涸。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-cliff=生态效果成功后通知：悬崖风化。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-paving=生态效果成功后通知：铺装腐蚀。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-pollution=生态效果成功后通知：污染损伤。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-restoration=生态效果成功后通知：地形恢复。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-depletion-scars=生态效果成功后通知：矿床耗尽痕迹。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-working-scars=生态效果成功后通知：工作采矿机痕迹。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-mining-restoration=生态效果成功后通知：采矿痕迹恢复。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-tree-stress=生态效果成功后通知：树木衰弱。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-tree-recovery=生态效果成功后通知：树木恢复。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-regrowth=生态效果成功后通知：野生树木再生。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-aging=生态效果成功后通知：树木老化。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-rot=生态效果成功后通知：枯木腐朽。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-thermal=生态效果成功后通知：热损伤痕迹。通知不会启用效果本身，仍受个人地表筛选及可见性约束。
ei-ecology-alert-blood=生态效果成功后通知：异星血液修复。通知不会启用效果本身，仍受个人地表筛选及可见性约束。

[ei-terrain]
controls=左上角的机械树按钮打开简洁、高级和警报页。树叶颜色随当前查看世界的季节变化，悬停时显示季节名称。简洁显示实地调查；高级显示有效设置、成功效果与处理上限。警报与 MOD设置→每玩家共用偏好，使用原版警报窗口，通常只报告当前可见的区块。管理员玩法设置仍在地形与生态控制台。
v2-coverage=观测在有限区块组中轮换。未调查土地视为未知；缺失或陈旧的读数不能证明持续洁净或污染。仅恢复ESIR记录的损伤。有限迁移、初始化和维护在ESIR重建窗口报告；常规生态处理显示在高级页。初始巡查上限10万次访问不代表全地图已验证。
mining-v2-note=工作采矿机有独立周期痕迹选项，默认开启：每300基础秒有10%概率，克制强度下为600秒，再应用季节调整。已接收请求不会仅因时间而过期，停用地表时暂停。默认恢复新记录的采矿痕迹。
status-unsupported=不支持的地表
status-independent=弗戈拉独立控制器

