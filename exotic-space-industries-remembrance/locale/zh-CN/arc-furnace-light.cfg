[mod-setting-name]
ei-arc-furnace-light-flicker-preset=电弧炉工作灯闪烁

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=只调整电弧炉的活动工作灯。原始闪烁保留当前躁动的电弧光。降低闪烁和柔和脉动会让闪烁更安定。静态辉光保留稳定光源。关闭会移除活动工作灯，但保留炉体动画和待机红色电容辉光。

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=关闭
ei-arc-furnace-light-flicker-preset-static=静态辉光
ei-arc-furnace-light-flicker-preset-soft=柔和脉动
ei-arc-furnace-light-flicker-preset-reduced=降低闪烁
ei-arc-furnace-light-flicker-preset-original=原始闪烁

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=移除活动工作灯。炉体动画和待机红色电容辉光仍会保留。
ei-arc-furnace-light-flicker-preset-static=保留稳定的活动辉光，不再闪烁。
ei-arc-furnace-light-flicker-preset-soft=保留暗淡、缓慢的脉动，让电弧炉阵列更平稳。
ei-arc-furnace-light-flicker-preset-reduced=保留层叠的电弧色彩，但闪烁更慢、范围更窄。
ei-arc-furnace-light-flicker-preset-original=保留当前躁动的电弧炉照明。
