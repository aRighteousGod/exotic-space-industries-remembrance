ei-tesla-turret=对崩溃前富戈拉电弧武器的重建仿制品。尽管其底层超导线圈几何仍只被部分理解，这座复制塔依然能把受控电弧投向附近威胁。与真正的富戈拉设计相比，它的输出与效率仍然有限，但借助先进材料，依然能提供可靠的区域压制和极高的爆发潜力。

