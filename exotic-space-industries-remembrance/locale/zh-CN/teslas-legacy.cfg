[technology-description]
tl-basic-tesla-coils-technology=特斯拉线圈是一种经改造的谐振变压器，可向附近敌人释放高电流放电。直接伤害不算极高，但能同时影响多个目标。
tl-advanced-tesla-coils-technology=大幅强化后的特斯拉线圈版本。射程更长、伤害极高，并以厚重钢甲提高生存性。
tl-tesla-tank-technology=一种致命的坦克变体，装备两座中型高级特斯拉线圈。便携特斯拉线圈会提供必要的能量脉冲，让两门武器同时开火。
ei-tesla-weapons=从崩溃前富戈拉研究库中回收并逆向工程出的电弧技术。原始原理至今仍只被部分理解，但工程师已经重建出一种可用的仿制型号，能够向敌对目标投射稳定化电弧。其输出、效率与放电模式仍逊于真正的富戈拉设计，但依然远比常规电磁武器先进。只要真正的富戈拉设计图尚未破译，进一步改良就会受到限制。
tl-tesla-ammo-upgrade-technology=便携特斯拉线圈技术的进步暴露了基础特斯拉线圈结构中的设计缺陷。把这些弱点补上之后，就能得到效率更高、整体性能更强的特斯拉线圈。
tl-tesla-coil-damage-technology=通过安装更强的电容器，并给电流频率加入轻微振荡，可以提高特斯拉线圈闪电电弧的有效伤害。
tl-tesla-coil-shooting-speed=近来的电池效率改进也能应用到特斯拉线圈设计上，让线圈更快达到临界容量，从而提升射速。
tl-flames-explosion-technology=特斯拉线圈电弧中灌注的能量高到足以点燃空气本身。这种短暂的连锁反应会表现为猛烈的火焰爆炸。\n\n“喷燃”的每一级都会扩大爆炸的作用范围。\n\n伤害：炮塔伤害的 60%。
tl-flames-count-technology=当地面的干土与尘埃颗粒因极高电流而着火时，结果会是一场出乎意料的猛烈燃烧反应。火焰只会持续几秒，但会释放危险级别的高热，把一切烧成焦黑。\n\n“闪焰”的每一级都会增加生成火焰的数量以及它们每秒造成的伤害。
tl-flames-probability-technology=极端集中的能量足以点燃地表植被、尘埃颗粒，甚至点燃空气本身。\n\n“燃烧”的每一级都会提高点燃特斯拉线圈目标及其周边区域的概率。
tl-single-zap-count-technology=当生物被高级特斯拉线圈击中时，它可能会吸收大量静电能量。这种过载会猛烈地撕碎宿主。如果宿主被摧毁后仍残留部分电荷，它就会朝附近的阻力源抽打出去。这个现象被称为补充放电。\n\n“补充放电”的每一级都会增加炮塔击杀敌人时释放出的补充放电数量。
tl-single-zap-damage-technology=如果目标被摧毁后仍残留电荷，它就会化为一次补充放电。那道放电只携带初始电荷的一部分，但通过精细调节特斯拉线圈的整体共振水平，仍可放大这部分剩余能量。\n\n“重雷”的每一级都会提高补充放电造成的伤害。
tl-single-zap-probability-technology=高级特斯拉线圈导引着难以置信的电能。如果目标无法容纳这股电流，它就会沿着被电离的空气分子溢出，化作独立的闪电电弧去电击附近实体。\n\n“过充”的每一级都会提高高级特斯拉线圈击杀敌人时生成额外闪电电弧的概率。
tl-multi-zap-range-technology=线圈中的电流越强，周围静电场中的电离粒子就越多。这样一来，电荷就更容易穿过空气，抵达更远的目标。\n\n“电离”的每一级都会提高电荷传播的有效距离。
tl-multi-zap-damage-technology=精细调节发射出的集中能量波长后，电荷在静电场中传播时就能形成更稳定、也更具杀伤力的闪电电弧。\n\n“雷击”的每一级都会提高传播电荷造成的伤害。
tl-multi-zap-probability-technology=持续使用特斯拉线圈会让周围充满电离粒子。正是这些粒子让被导引的电荷能够越过最初目标，跳向附近物体。\n\n“静电场”的每一级都会提高电荷向每个附近敌人传播的概率。
tl-slowdown-duration-technology=更高能级的电流会带来更强的效果，并且会在目标体内残留得更久。\n\n“持续”的每一级都会延长“电击”效果的持续时间。
tl-slowdown-multiplier-technology=特定能级与高频率组合在一起，会引发严重的肌肉痉挛，从而明显妨碍移动。\n\n“麻痹”的每一级都会提高“电击”的强度，并进一步降低移动速度。
tl-slowdown-probability-technology=直接接触电流会引发生理与神经层面的副作用，例如肌肉痉挛与瘫痪。\n\n“电击”等级越高，这些副作用在每次攻击中出现的概率就越高。
tl-volatility-modulation-technology=电离是提升电流型军事系统效能的常见手段。当双线圈以交替频率进行电离时，能量轮廓中会出现一种协同模式。这种效应被称为生体电离，它会大幅拓宽该电流的波动包络。\n\n“生体电离”的每一级都会压低可能出现的最低伤害，同时显著抬高可能出现的最高伤害。
tl-volatility-probability-technology=双线圈电流的波动本性，会在一体化振幅调节器的作用下被推到极限。实战中，生成的闪电电弧会获得足以把任何小于一间中型公寓的生物完全解体的能量。\n\n“汽化”的每一级都会提高瞬间击杀目标的概率。生命值高于 5000 的目标不会直接死亡，而是受到重创。
ei-waveform-harmonics-1=为 Legacy 线圈与桥接后的特斯拉家族对齐第一套共用放电轮廓。TL 主射束的外观暂时保持原样，但这条线已经开始说同一种电学方言：更清晰的命中反馈、更干净的桥接语义，以及通往 teslagun、特斯拉弹药和复制版富戈拉线圈的第一层直接联动。
ei-waveform-harmonics-2=把这套共用波形扩展为现代化的连锁后续放电族系。基础线圈获得协调后的场弧传播，高级线圈开始使用现代化的后续放电家族，而桥接特斯拉家族也终于能打出真正的连锁爆发。
ei-waveform-harmonics-3=完成谐调主干。后续电弧全面采用 Space Age 的连锁语言，桥接炮塔获得更重的后期链式收益，而 Legacy 分支终于准备好进入真正的教义分化，而不只是继续堆原始数值。
ei-storm-lattice-1=基础线圈不再只是“第一座特斯拉塔”，而是成为真正的控制教义。风暴晶格 I 改善目标接力，扩宽传播弧网，让虫群被困在电场中而不是从边缘漏出去。
ei-storm-lattice-2=这时的电弧已经不再只是碰运气的散射。风暴晶格 II 会在更大的压力下维持分支网络，让基础线圈能持续把电荷传给更宽、更密的敌军前线。
ei-storm-lattice-3=这是基础线圈控制路线的终态。风暴晶格 III 把分支场弧塔推进到后期群控阶段：更多跳跃、更远延伸，以及更明确的“风暴帷幕”身份。
ei-dielectric-rupture-1=高级线圈并不是为整条战线做压制而生的。它是为了先杀死目标，再让剩余电荷去找下一个。介电破裂 I 让第一次后续放电保留更多可用能量。
ei-dielectric-rupture-2=介电破裂 II 让后续放电链活得更久，也让放电更愿意点燃它碰到的东西。高级线圈仍然是处决用尖塔，而不是基础塔的翻版。
ei-dielectric-rupture-3=后期高级线圈会成为真正的击杀连锁武器。介电破裂 III 提高残留电弧、延伸距离与燃烧继承，让一次确认击杀就足以撕开一整波密集攻势。
ei-bridge-coupling-1=通往原版特斯拉家族的桥接是刻意克制的。桥接耦合 I 提高 teslagun、特斯拉弹药和复制版富戈拉线圈的后期伤害与控制继承，但不会把它们直接压成披着皮的 TL 塔。
ei-bridge-coupling-2=桥接线的终点刻意偏向炮塔。桥接耦合 II 让复制版富戈拉塔继承更浓的后期后续放电语言，而手持特斯拉装备依旧维持更轻的形态。
ei-reactance-overdrive-1=两座高级线圈焊在坦克壳体上，本来就不可能温顺。电抗过驱 I 扩大波动包络并增加饱和电弧数量，同时不把这辆车变成另一座固定炮塔。
ei-reactance-overdrive-2=聚变时代的线圈控制让特斯拉坦克能维持更长的过载窗口。电抗过驱 II 进一步强化它作为风暴前线的感觉：更剧烈的调制摆动、更多外溢，以及在打击走廊边缘更大的压力。
ei-reactance-overdrive-3=这是坦克的最终特化形态。电抗过驱 III 保持它与塔类在机制上的差异，同时让它更像一股移动的电气前线，而不是装了装饰闪电的武器平台。
ei-exotic-waveform-convergence=在教义的终点，Legacy 塔不再只是借用现代链式语言，而是终于得到属于自己的现代主射束。基础线圈会成为分支场弧塔，并在每次成功的主命中后得到一次保底侧向分支爆发。高级线圈会成为聚焦的过充长枪尖塔，而每次击杀确认都会在其正常余震逻辑之上额外触发一次保底的异构处决风暴。特斯拉坦克只会部分并入：它的命中会得到相邻放电现代化，而正向的波动尖峰则能触发一次风暴前线爆发，同时又不会把载具压扁成另一座塔。复制版富戈兰塔也会在击杀确认时得到炮塔专属的异构余震绽放，而手持特斯拉装备则不会。

