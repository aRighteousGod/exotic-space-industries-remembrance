ei-waveform-harmonics-1-effect=波形谐调 I：统一命中语义，并给出第一层共享桥接加成。
ei-waveform-harmonics-2-effect=波形谐调 II：Legacy 线圈与桥接特斯拉家族解锁现代化连锁后续放电族系。
ei-waveform-harmonics-3-effect=波形谐调 III：完整接入 Space Age 的后续链式语言，并强化桥接炮塔端的连锁。
ei-storm-lattice-1-effect=风暴晶格 I：基础线圈获得更宽的场弧传播与更干净的目标交接。
ei-storm-lattice-2-effect=风暴晶格 II：基础线圈能在更大压力下维持更密的弧网。
ei-storm-lattice-3-effect=风暴晶格 III：基础线圈成为真正的后期压制塔。
ei-dielectric-rupture-1-effect=介电破裂 I：高级后续放电在确认击杀后保留更多电荷。
ei-dielectric-rupture-2-effect=介电破裂 II：高级后续放电打得更远，也更容易引燃。
ei-dielectric-rupture-3-effect=介电破裂 III：高级线圈把确认击杀变成短促的处决风暴。
ei-bridge-coupling-1-effect=桥接耦合 I：提高桥接线后期伤害，同时不把原版特斯拉家族压扁成 TL 教义。
ei-bridge-coupling-2-effect=桥接耦合 II：复制版富戈拉塔继承更重的后期桥接收益。
ei-reactance-overdrive-1-effect=电抗过驱 I：特斯拉坦克扩大波动包络，并抛出更多饱和电弧。
ei-reactance-overdrive-2-effect=电抗过驱 II：特斯拉坦克能维持更长的过载与更沉重的风暴前线放电。
ei-reactance-overdrive-3-effect=电抗过驱 III：特斯拉坦克到达聚变时代双线圈的最终凶暴状态。
ei-exotic-waveform-convergence-effect=异构波形收敛：Legacy 线圈解锁异构分支爆发、处决风暴与风暴前线爆发，而复制版富戈兰塔则获得炮塔专属的异构余震绽放。

