title_teslas_legacy=Tesla's Legacy
teslas-legacy=Tesla's Legacy武库
teslas-legacy-text=曾经作为 Tesla's Legacy 额外挂接进来的这条线，如今已并入 Remembrance 自己的电击兵器谱系。[item=tl-basic-tesla-coil]基础特斯拉线圈、[item=tl-advanced-tesla-coil]高级特斯拉线圈，以及[item=tl-tesla-tank]特斯拉坦克，都保留公开名称与 TL 外形，却不再只是挂在旁边的外来阶梯，而是被编进同一条工业脉络：先是粗砺的电场塔，再是更重的处刑支柱，最后是装甲化的风暴前线。\n\n这条线也向原版特斯拉家族架桥。[item=teslagun]特斯拉枪、[item=tesla-ammo]特斯拉弹药，以及[item=tesla-turret]复制版富戈拉特斯拉线圈，共享同一根电性脊骨，但各自仍保留本来的战斗角色。
teslas-legacy-2=行为模式
teslas-legacy-text-2=当前启动行为模式: [font=default-bold]__1__[/font]\n\n[font=default-bold]遗产忠实[/font]现在是默认路线。这就是原版 Tesla's Legacy 的完整底层：旧辅助递归、持续辅助、计时器清理、受伤来源、高级线圈的击杀后余震、单次电弧的燃烧副作用，以及坦克的挥发流，全都按优先行为执行。[font=default-bold]混合[/font]则是可选的轻量路线。它不再让旧 TL 递归充当主要延续模型，而是由 TL 专用辅助格架接手，再让后续的调和科技与教义科技在其上选择更丰富的隐藏辅助家族。\n\n教义阶梯本身是共通的，但应用顺序不同。在混合模式下，教义格架成为主要行为。在遗产忠实模式下，原始 TL 行为永远先触发，之后才叠加现代化特性。
teslas-legacy-3=波形谐调
teslas-legacy-text-3=波形谐调现在是共同的现代化主干。谐调之前，Legacy 线圈保留原始 TL 的光束语言。到谐调 I，它们开始与桥接特斯拉家族说同一种电学方言。到谐调 II，基础与高级线圈都转入现代化的后续放电家族。到谐调 III，这些后续电弧完全接入更深层的连锁语法，桥接炮塔也终于拿到它一直缺少的浓密后续放电轮廓。\n\n这也是旧“互不相容”故事真正结束的地方。Legacy 塔、复制版富戈拉塔与手持特斯拉家族，如今共享一条刻意设计的交汇线，而不是继续彼此无视。
teslas-legacy-4=量子专精
teslas-legacy-text-4=在谐调之后，教义会清晰分岔。[font=default-bold]风暴晶格[/font]属于[item=tl-basic-tesla-coil]基础线圈，把它推进成一座虫群控制塔：传播更宽、目标交接更稳、压制更持久。[font=default-bold]介电破裂[/font]属于[item=tl-advanced-tesla-coil]高级线圈，强化确认击杀后的后续放电、残余电荷与燃烧继承。\n\n[font=default-bold]桥接耦合[/font]则是桥接家族的后期专精。它会强化原版特斯拉家族，但不会把它们压成 TL 塔的变体。复制版富戈拉塔拿到更重的炮塔收益，而手持特斯拉装备则继续保持更轻的定位。
teslas-legacy-5=聚变过驱
teslas-legacy-text-5=[item=tl-tesla-tank]特斯拉坦克并不直接共享塔系的专精。它的后期教义是[font=default-bold]电抗过驱[/font]：一条聚变时代的坦克路线，强调双线圈饱和、更宽的波动窗口，以及沿着行进带溢出的更多电弧。它在机制上仍与塔系不同，不像固定尖塔，更像一股履带上的风暴前线。\n\n它同时还是整条线的挥发专门化载体。暴击峰值、调制摇摆和汽化，依旧属于坦克，而不是塔。
teslas-legacy-6=异构收敛
teslas-legacy-text-6=最终阶段是[font=default-bold]异构波形收束[/font]。它不会把 TL 塔换成新世代复制品。[item=tl-basic-tesla-coil]基础线圈会保留其临时拼装的本体，并成长为现代化的[font=default-bold]分岔场弧塔[/font]，每次主命中都会放出一次确定的侧向爆发。[item=tl-advanced-tesla-coil]高级线圈会保留高耸支柱本体，并成长为集中的[font=default-bold]过充长枪塔[/font]，而每次确认击杀还会额外释放一次确定的异构处刑风暴。\n\n在[font=default-bold]遗产忠实[/font]中，这些终局效果会叠加在原始 TL 底层之上。在[font=default-bold]混合[/font]中，它们位于更轻的教义格架顶端。[item=tl-tesla-tank]特斯拉坦克只会部分参与：挥发峰值与汽化事件都可能引发风暴前线爆发，但载具依然还是这条家族里的装甲成员，不会收束成另一座塔。[item=tesla-turret]复制版富戈拉塔也会在确认击杀时获得专属炮塔异构余震，但[item=teslagun]特斯拉枪与[item=tesla-ammo]特斯拉弹药仍停留在更轻的桥接路线。
teslas-legacy-7=战斗提示与默认浮动文字
teslas-legacy-text-7=战斗提示是刻意筛选过的。[font=default-bold]暴击[/font]和[font=default-bold]汽化[/font]浮动文字默认开启，因为真正特殊的瞬间应该被看见。常规[font=default-bold]伤害[/font]浮动文字默认关闭，以免每场交火都变成一团电光纸屑。\n\n这比以前更重要，因为教义里现在有更多可动部件：传播跳跃、后续放电连锁、桥接耦合、坦克挥发，以及最终光束现代化。默认配置会保留最戏剧性的瞬间，但不会让整片战场都淹没在噪音里。
