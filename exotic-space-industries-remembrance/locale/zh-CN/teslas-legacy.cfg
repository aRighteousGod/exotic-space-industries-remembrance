[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=可选的轻量路线。以 TL 专用教义格架作为主要延续路径，让桥接辅助保持分离，并让原始辅助递归退场，以换取更好的 UPS。
ei-tl-behavior-mode-legacy-fidelity=默认值。完整保留原版 Tesla's Legacy 的行为。旧辅助递归、辅助持续、计时器清理、受伤来源、击杀后余震、以及坦克的挥发流，都按原样复现，不计 UPS 成本。
tl-advanced-attack-anim-charge-up=使用这种动画时，明亮能量会沿着高级特斯拉线圈的核心上升，并在抵达顶端时开火。如果 A 炮塔先于 B 炮塔完成蓄势就击杀了目标，偶尔会出现轻微的重新锁定延迟。
tl-advanced-attack-anim-simple=使用这种动画时，只要敌人靠近，电流就会立刻在各线圈之间跳动，线圈会马上开火。

