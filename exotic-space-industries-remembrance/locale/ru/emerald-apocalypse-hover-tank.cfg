[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=Парящий танк Изумрудного Апокалипсиса
title_emerald_apocalypse_hover_tank=Парящий танк Изумрудного Апокалипсиса
emerald-apocalypse-hover-tank=Парящий танк Изумрудного Апокалипсиса
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank] — парящая крепость позднего экзотического века: слишком тяжелая для грации, слишком преданная, чтобы упасть. Кольца излучателей держат корпус над миром, пока неподвижное орудие превращает направление в приговор.
emerald-apocalypse-hover-tank-2=Кристаллический заряд
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge] — одиночный запечатанный разлом для [item=ei-emerald-apocalypse-cannon]. При выстреле танк не рассеивает гнев. Он открывает одну зеленую заповедь и заставляет поле боя ответить.
emerald-apocalypse-hover-tank-3=Доктрина орбитальных осколков
emerald-apocalypse-hover-tank-text-3=Орбитальные осколки — скриптовая доктрина, а не турельное оборудование. Коллектор осколков поднимает кольцо с трех до шести активных осколков. Литания перезарядки сокращает каденцию каждого осколка с 1.17 с до 0.92, 0.75, затем 0.58 с. Приговор цели заменяет простую близость оценкой угрозы, где важны ульи, турели, запас здоровья, раны и расстояние. Апертура приговора расширяет луч и позволяет каждому попаданию проливать ограниченный урон на близкие цели или цели в коридоре луча.
emerald-apocalypse-hover-tank-4=Консоль орбитальных осколков
emerald-apocalypse-hover-tank-text-4=Откройте инвентарь танка, чтобы рядом с ним появилась компактная панель осколков. Каждый поставленный танк может держать от 0 до изученного максимума осколков. Разделенное наведение распределяет их приговоры между лучшими ближайшими угрозами; Focus приказывает всем активным осколкам бить по одной текущей цели. Отображаемый DPS учитывает число активных осколков, повторяемые уровни урона лазерного оружия 7+ и качество поставленного танка.

emerald-apocalypse-hover-tank-5=Доктрина корпуса
emerald-apocalypse-hover-tank-text-5=Доктрина корпуса конечна. Катехизис заряда сокращает разгон с 9.48 с до 8.5, 7.58 и 6.67 с; каждая ступень звучит своим укороченным зарядным гимном. Инерционная клятва снижает печать после выстрела с 15 с до 13.17 и 11.33 с. Эгида отвечает ближайшим врагам, киль улучшает движение без потери скольжения, а мандат усиливает конечную волну радиусом 52 клетки без расширения границы.
emerald-apocalypse-hover-tank-6=Распечатанные контуры
emerald-apocalypse-hover-tank-text-6=Рекурсия Апокалипсиса открывает переключатели для каждого танка. По умолчанию включены: возврат зарядов, кильватер, ветвящиеся шрамы, раздвоенный след и распечатанный удар. Выключайте их на отдельных танках, когда клятва должна оставаться узкой.
