[string-mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=Нижняя часть корпуса запечатывает круги и движется без видимого мерцания.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Четыре круга излучателей кратко отвечают земле, оставляя лишь сдержанную призматическую кромку.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=Излучатели пишут устойчивые изумрудные кольца под корпусом, пока движение становится давлением.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=Кольца ярче, плотнее, и вокруг каждой парящей опоры срезаются в мятно-зеленые призматические осколки.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Каждый излучатель открывает под реликтом плотную светящуюся печать, почти молитвенную в своей жестокости.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=Ограничитель сломан; каждая парящая опора может заставить землю вспомнить проход танка.

