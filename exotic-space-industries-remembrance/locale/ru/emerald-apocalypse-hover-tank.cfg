[item-description]
ei-emerald-apocalypse-hover-tank=Реликтовая парящая крепость с неподвижным кристаллическим орудием и сердцем, которое отказывается признавать землю. Она движется как давление, а затем оставляет изумрудную тишину там, где стояла уверенность.
ei-emerald-apocalypse-cannon=Кристаллическое лучевое орудие, намертво вросшее в корпус. Оно не сопровождает цель. Оно судит то, на что смотрит танк.
ei-emerald-apocalypse-charge=Запечатанный кристаллический разлом для орудия Изумрудного Апокалипсиса. Одна клятва, один разряд, одна зеленая рана в мире.

[entity-description]
ei-emerald-apocalypse-hover-tank=Реликтовая парящая крепость, подвешенная на изумрудных излучателях. Ствол собирает давление перед выстрелом; заряд уходит плазмой, отдачей и зеленым отсутствием там, где стояла уверенность.

[technology-description]
ei-emerald-apocalypse-hover-tank=Пробуждает парящий танк Изумрудного Апокалипсиса: осадную машину, чье неподвижное кристаллическое орудие превращает движение вперед в доктрину, а доктрину — в руины.
ei-emerald-shard-manifold-1=Поднимает доктрину орбитальных осколков Изумрудного Апокалипсиса до четырех активных осколков.
ei-emerald-shard-manifold-2=Вплетает второе усиление в коллектор осколков и поднимает доктрину до пяти активных осколков.
ei-emerald-shard-manifold-3=Завершает клятву коллектора и позволяет шести активным осколкам отвечать танку одновременно.
ei-emerald-reload-litany-1=Сокращает доктрину перезарядки орбитальных осколков до 0.92 с на осколок.
ei-emerald-reload-litany-2=Повторяет литанию, пока кольцо осколков не восстанавливается каждые 0.75 с.
ei-emerald-reload-litany-3=Запечатывает ритм перезарядки на 0.58 с: меньше ожидания, больше суда.
ei-emerald-target-verdict=Позволяет орбитальным осколкам предпочитать ульи, турели, близких врагов и уже раненые цели вместо того, чтобы тратить вердикт на меньшие угрозы.
ei-emerald-verdict-aperture-1=Открывает первую изумрудную апертуру вокруг ударов осколков, добавляя ограниченный вторичный урон.
ei-emerald-verdict-aperture-2=Расширяет ударные апертуры осколков в более широкий областной приговор.
ei-emerald-verdict-aperture-3=Превращает приговоры осколков в изумрудную рану, достаточно широкую, чтобы наказать сгруппированных врагов.

ei-emerald-charge-catechism-1=Сокращает разгон апокалипсиса до 8.5 с.
ei-emerald-charge-catechism-2=Сжимает разгон апокалипсиса до 7.58 с.
ei-emerald-charge-catechism-3=Закрепляет самый жесткий ритм: 6.67 с до выстрела.
ei-emerald-inertial-oath-1=Снижает откат после выстрела до 13.17 с.
ei-emerald-inertial-oath-2=Снижает откат после выстрела до 11.33 с.
ei-emerald-aegis-covenant-1=Превращает боль щита в короткий плазменный ответ только по врагам.
ei-emerald-aegis-covenant-2=Усиливает ответ эгиды, когда мембрана ранена.
ei-emerald-vector-keel-1=Улучшает управление парящим шасси, сохраняя тяжелое скольжение.
ei-emerald-vector-keel-2=Улучшает задний ход, торможение и контроль дрейфа.
ei-emerald-collapse-mandate-1=Повышает давление конечного схлопывания, не расширяя шрам.
ei-emerald-collapse-mandate-2=Проводит больше плазмы через тот же приговор радиусом 52 клетки.
ei-emerald-collapse-mandate-3=Завершает мандат: граница остается, приговор становится жестоким.
ei-emerald-apocalypse-recursion=Открывает опасные переключатели танка: возврат, следы, шрамы, раздвоение и избыток удара.

