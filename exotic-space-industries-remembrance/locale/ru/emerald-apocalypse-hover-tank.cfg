[equipment-description]
ei-emerald-fusion-core-equipment=Запечатанное изумрудное сердце корпуса Апокалипсиса. Ядро не гудит; оно читает давление.
ei-emerald-aegis-shield-equipment=Призматическая мембрана щита, настроенная на клятву парящего танка. Входящая сила разбивается о нее, будто вспоминает неверную геометрию.

[mod-setting-name]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Резонанс парящих излучателей Изумрудного Апокалипсиса

[mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Задает, насколько яростно мерцают нижние излучатели танка Изумрудного Апокалипсиса. Клятва касается только призматических колец под реликтом; остальное остается нетронутым.

