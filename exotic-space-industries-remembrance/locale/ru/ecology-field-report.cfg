guide-summary=Простой отчёт разделяет местные сутки и сезонный календарь. Суточная полоса показывает текущие границы освещения поверхности и длительность полного оборота; сезонная полоса следует годовому календарю ESIR. Оценки оставшегося времени используют текущие настройки. Фульгора сохраняет независимую систему суток, а остановленное время или постоянный день отменяют обычные прогнозы. Изображения ландшафта декоративны. Карточки изменений считают успешные записанные изменения, в том числе неоднократные изменения одного участка. Для каждой категории показано последнее известное время; старые общие числа могут не иметь сохранённого времени. Возраст наблюдений и охват описывают ограниченные полевые измерения, а не состояние всего мира.
