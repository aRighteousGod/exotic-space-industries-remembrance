feature-unavailable=здесь не применяется
record-help=Счётчики отражают успешные изменения ESIR, а не отдельные участки или полное обследование ландшафта. Один участок может меняться неоднократно. Старые сохранения сохраняют общие числа, но могут не содержать времени изменений. Счётчик лесных пожаров записывает возгорания, а не потерю леса.
ground-help=В подходящих условиях восстановление может пройти записанные изменения почвы в обратном порядке. Покрытие или внешняя замена могут сделать сохранённую последовательность непригодной; последующее удаление не воссоздаёт запись. Инфраструктура, возделываемая земля и особые места сохраняют защиту.
ground-conditions=Для повреждения почвы нужно загрязнение не ниже __1__ в течение __2__; для восстановления — измерения не выше __3__ в течение __4__. По-прежнему нужны достоверные наблюдения и отдельные возможности обработки.
pollution-unavailable=Загрязнение этого мира не позволяет судить о промышленной загрязнённости. Споры Глебы не являются промышленным загрязнением.
mining-recovery-on=Восстановление следов добычи включено. Записанные следы могут восстановиться при соблюдении нужных чистых условий и защитных проверок.
mining-recovery-off=Восстановление следов добычи отключено. Записанные следы сохраняются до включения этой функции или замены почвы.
woodland-help=Это записанные изменения подходящих диких деревьев. Выращиваемые растения и защищённая флора исключены. Естественно серые деревья сами по себе не доказывают ущерб от загрязнения.
woodland-unavailable=В этом мире нет подходящего местного леса для этих эффектов.
other-help=Эффектам по-прежнему нужны подходящая местная почва и защитные проверки. Изменение берегов ограничено разрешёнными сочетаниями пресной воды и береговой почвы Наувиса. Для коррозии покрытия действуют собственные явные условия.
survey=Последнее местное измерение: __1__ назад. __2__\nНаблюдения охватывают только посещённые участки. Здоровье необследованной земли неизвестно.
survey-none=Достоверного местного измерения пока нет. Наблюдения охватывают только посещённые участки; здоровье необследованной земли неизвестно.
coverage-discovering=Первоначальное обследование ещё идёт.
coverage-observed=Первоначальный обход закончен; это не полное обследование состояния земли.
coverage-limited=Охват обследования остаётся ограниченным.
coverage-unknown=Охват обследования ещё не установлен.
