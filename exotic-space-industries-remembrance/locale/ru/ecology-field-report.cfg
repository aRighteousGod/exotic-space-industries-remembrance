variable=Местный цикл переменный: его длительность может меняться независимо от сезонов.
clock-help=Длительности указаны в игровом времени. Полоса начинается с начала полного дня; отметка показывает наблюдаемое положение внутри цикла. Прогноз использует текущие границы освещения и длительность цикла, которые может изменить другая система. Это не прогноз солнечной выработки.
