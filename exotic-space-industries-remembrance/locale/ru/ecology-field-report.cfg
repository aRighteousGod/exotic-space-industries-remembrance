invalid-cycle=Текущий цикл нельзя достоверно прочитать. Смена освещения не прогнозируется.
seasons=__1__ · прошло __2__% сезона\nПрошло за год: __3__%\nДо следующего сезона: __4__\nДлительность года: __5__\nЭквивалент __6__ местных суток при текущей длительности цикла.
calendar-help=Сезонный календарь и местные сутки — отдельные часы. Календарный год равен __1__ опорным суткам. Пересчёт в местные сутки использует нынешнюю длительность цикла, а не число уже совершённых оборотов.
no-calendar=Сезонный календарь недоступен.
daylight-active=Сезонный световой день действует.
daylight-disabled=Сезонный световой день здесь отключён.
daylight-paused=Сезонный световой день приостановлен.
daylight-external=Освещением управляет другая система.
daylight-independent=Освещение Фульгоры остаётся независимым от сезонного календаря.
daylight-pending=Сезонный световой день ожидает следующей проверки.
