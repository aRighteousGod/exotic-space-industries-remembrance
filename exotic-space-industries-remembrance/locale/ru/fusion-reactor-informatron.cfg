[exotic-industries-informatron]
menu_fusion_power=Энергия синтеза
title_fusion_power=Энергия синтеза
fusion-power=Энергия синтеза
fusion-power-text=[color=orange]Термоядерный реактор[/color] [item=ei-fusion-reactor] — поздняя энергетическая система, сжигающая легкие атомные топлива в управляемой плазменной камере.\n\nОн работает на замкнутом контуре свинцового теплоносителя: [fluid=ei-cold-coolant] входит в камеру, а [fluid=ei-hot-coolant] выходит, унося тепло. Реактор дорог в строительстве и прожорлив в работе. После запуска он постоянно требует нагретые термоядерные топлива.\n\nРанние циклы используют [fluid=ei-heated-protium] и [fluid=ei-heated-lithium-6]. Более мощные цепочки открываются через [fluid=ei-heated-deuterium], [fluid=ei-heated-tritium] и [fluid=ei-heated-helium-3].\n\nСинтез не чист и не бесплатен. Это заключенная звезда, принужденная к послушанию трубами, магнитами и отказом от слабости.
fusion-power-2=Нейтроны и вы
fusion-power-2-text=Синтез также может быть источником нейтронов. Низкая температура реактора усиливает нейтронную утечку, средняя сохраняет компромисс, а высокая подавляет нейтронный поток ради большей мощности.\n\nБлижайшие [color=orange]нейтронные коллекторы[/color] [item=ei-neutron-collector] привязываются к самому сильному пригодному источнику в радиусе. Режим реактора, расстояние и активность определяют полезный поток.\n\nНейтроны не украшение. Это валюта для продвинутого термоядерного топлива. Стройте близко, настраивайте осознанно и не путайте более яркую звезду с более щедрой.
menu_fusion_reactor_controls=Управление термоядерным реактором
title_fusion_reactor_controls=Управление термоядерным реактором
fusion-reactor-controls=Ручное управление
fusion-reactor-controls-text=Консоль реактора оставляет открытыми четыре ручных параметра: топливо 1, топливо 2, температуру и скорость впрыска. Вместе они выбирают заблокированный скрытый рецепт, определяющий расход топлива, поток теплоносителя, расчетную мощность и нейтронный поток.
fusion-reactor-controls-2=Топливные пары и заблокированные рецепты
fusion-reactor-controls-text-2=Зажечься могут только допустимые пары топлива. Если выбранное второе топливо не реагирует с первым, консоль возвращается к первому допустимому второму топливу из упорядоченной таблицы реактора, а не оставляет камеру в невозможном состоянии.
fusion-reactor-controls-3=Температура и впрыск
fusion-reactor-controls-text-3=Температура и впрыск — разные рычаги. Низкая температура богата нейтронами и бедна мощностью. Средняя держит компромисс. Высокая подавляет нейтронный выход и тянет реактор к мощности. Низкий впрыск бережет топливо, средний стабилен, высокий горит сильнее за резкую цену топлива.
menu_fusion_reactor_circuit_interface=Цепной интерфейс синтеза
title_fusion_reactor_circuit_interface=Цепной интерфейс синтеза
fusion-reactor-circuit-interface=Скрытый комбинаторный интерфейс
fusion-reactor-circuit-interface-text=Цепная поверхность реактора использует тот же шаблон невидимого комбинатора, что и другие системы ESIR. Скрытый интерфейс внутренне подключен к видимому разъему реактора, публикует телеметрию и принимает управляющие сигналы, когда реактор находится в режиме Circuit.
fusion-reactor-circuit-interface-2=Контракт сигналов чтения и записи
fusion-reactor-circuit-interface-text-2=Режим Manual игнорирует сигналы записи, но при подключении все равно публикует состояние. Режим Circuit читает [virtual-signal=ei-fusion-set-fuel-1], [virtual-signal=ei-fusion-set-fuel-2], [virtual-signal=ei-fusion-set-temperature] и [virtual-signal=ei-fusion-set-injection]. Значения топлива: 1 протий, 2 дейтерий, 3 тритий, 4 гелий-3, 5 литий-6. Температура и впрыск используют 1 низкий, 2 средний, 3 высокий. Отсутствующие или нулевые поля используют ручной запасной выбор. Обратное чтение использует отдельные сигналы, поэтому реактор не командует собой через эхо.
menu_fusion_reactor_agents=Агенты термоядерного реактора
title_fusion_reactor_agents=Агенты термоядерного реактора
fusion-reactor-agents=Состояния агентов
fusion-reactor-agents-text=Агенты — компактные значения состояния для цепей и диагностики. Агент управления сообщает власть Manual или Circuit. Агент топлива сообщает, допустима ли пара или была исправлена. Тепловой агент сообщает низкую, среднюю или высокую позу удержания. Агент теплоносителя сообщает, требует ли выбранный рецепт допустимый поток. Цепной агент сообщает состояние без проводов, чтения или командования.
fusion-reactor-agents-2=Значения сигналов
fusion-reactor-agents-text-2=Числовое правило нарочно простое. Агент управления: 1 ручной, 2 схема. Агент топлива: 1 допустимый, 2 исправленный. Тепловой агент: 1 низкий, 2 средний, 3 высокий. Агент теплоносителя: 1 допустимый расход, 3 недопустимо или сухо. Агент схемы: 1 не подключен, 2 читаемый, 3 командующий.
menu_fusion_reactor_options=Опции термоядерного реактора
title_fusion_reactor_options=Опции термоядерного реактора
fusion-reactor-options=Опции и запасной выбор
fusion-reactor-options-text=Опции — удобные команды поверх тех же четырех ручных параметров. Сброс возвращает дейтерий-тритий, среднюю температуру и средний впрыск. Обновить коллекторы заставляет ближайшие нейтронные коллекторы заново оценить реактор.
fusion-reactor-options-2=Предустановки и переопределение
fusion-reactor-options-text-2=Предустановки Мощность, Поток и Баланс выбирают разумные ручные значения, не скрывая тонкие регуляторы. В режиме Circuit эти ручные значения остаются запасными, если цепное поле отсутствует, равно нулю или недопустимо.
menu_fusion_neutron_collectors=Синтез и нейтронные коллекторы
title_fusion_neutron_collectors=Синтез и нейтронные коллекторы
fusion-neutron-collectors=Связь с нейтронными коллекторами
fusion-neutron-collectors-text=Термоядерный реактор и нейтронный коллектор связаны силой источника, активностью и расстоянием. Изменение рецепта реактора меняет нейтронный множитель, видимый коллекторами в радиусе, поэтому их очереди обновляются при смене режима реактора.
fusion-neutron-collectors-2=Давление планировки
fusion-neutron-collectors-text-2=Коллекторы вознаграждают геометрию. Близкий низкотемпературный реактор может кормить производство топлива сильным потоком; высокотемпературный силовой реактор может морить коллекторы голодом, создавая больше тепла. Фабрика должна решить, является ли ее звезда генератором, размножителем или точно разделенной клятвой.

