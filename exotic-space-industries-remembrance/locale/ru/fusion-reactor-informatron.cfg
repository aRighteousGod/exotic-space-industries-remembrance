[virtual-signal-description]
ei-fusion-set-fuel-1=Вход схемы для топлива 1. Значения: 1 протий, 2 дейтерий, 3 тритий, 4 гелий-3, 5 литий-6.
ei-fusion-set-fuel-2=Вход схемы для топлива 2. Значения: 1 протий, 2 дейтерий, 3 тритий, 4 гелий-3, 5 литий-6.
ei-fusion-set-temperature=Вход схемы для температуры. Значения: 1 низкая, 2 средняя, 3 высокая.
ei-fusion-set-injection=Вход схемы для скорости впрыска. Значения: 1 низкая, 2 средняя, 3 высокая.
ei-fusion-state-fuel-1=Выводит эффективный индекс топлива 1.
ei-fusion-state-fuel-2=Выводит эффективный индекс топлива 2.
ei-fusion-state-temperature=Выводит эффективный индекс температуры.
ei-fusion-state-injection=Выводит эффективный индекс впрыска.
ei-fusion-power=Выводит оценочную мощность реактора в МВт.
ei-fusion-neutron-flux=Выводит нейтронный поток, умноженный на 100.
ei-fusion-efficiency=Выводит процент эффективности.
ei-fusion-coolant-rate=Выводит горячий теплоноситель в секунду, умноженный на 100.
ei-fusion-control-agent=Выводит 1 ручной или 2 схема.
ei-fusion-fuel-agent=Выводит 1 допустимый или 2 исправленный.
ei-fusion-thermal-agent=Выводит 1 низкая, 2 средняя или 3 высокая.
ei-fusion-coolant-agent=Выводит 1 допустимый расход теплоносителя или 3 недопустимый.
ei-fusion-circuit-agent=Выводит 1 не подключен, 2 читаемый или 3 командующий.
