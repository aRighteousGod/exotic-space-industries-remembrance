[exotic-industries-informatron]
orbital-native-title=Начните со штатной логистики
orbital-native-shipping=Обычные ракетные поставки и передача между платформами используют запросы и снабжение Factorio без устройств когорты. Источники, минимальные объёмы доставки и снабжение задаются в штатных окнах. Автоматика игры управляет загрузкой, смешанными грузами, выбором цели и запуском. Боковая панель показывает фактическую цель.\n\nНовые модули отправки по умолчанию выбирают штатную автоматику, но при установке не меняют силос. Кнопка явно включает его автоматические запросы. Существующие модули сохраняют управление когортой. Смена возможна только без груза, входящих доставок и выполняющегося запуска.
orbital-native-cohort=Для фиксированной цели или загрузки фабрикой/схемой установите [entity=ei-platform-transponder] на каждой участвующей платформе, а у места запуска — селектор, запитанный координатор и привязанный модуль отправки. Новые селекторы используют режим политики; ручной режим выбирает имя, а схемный читает [virtual-signal=ei-platform-id]. Выберите управление когортой.\n\nУдержание цели сохраняет прежние правила: до удовлетворения потребности, до одного запуска либо пока остаток выше порога. ID, исправление привязок, резервирование и порог находятся в разделе «Дополнительно». Вставка настроек, клонирование и чертежи копируют настройки, но не действующие резервации. Автоматические ID назначаются заново; повторяющиеся ручные ID вызывают конфликт. Копия модуля автоматически привязывается только к единственному однозначно доступному соседнему силосу.
orbital-native-sources=Запросы и Потребность фильтруются по источникам Планета, Платформы или Все. «Все» разрешает оба пути. Ракеты исключают запросы только с платформ. «В пути» по-прежнему объединяет все входящие грузы. Потребность рассчитывается отдельно для каждой платформы до суммирования: max(0, запросы − запас − входящий груз). Запас другой платформы не покрывает её дефицит.\n\nПередачей между платформами управляют штатные правила. ESIR не меняет секции запросов или правила резервов/пополнения. Незатребованный предмет или качество в смешанном грузе блокирует запуск когорты; избыточные количества допустимых типов разрешены. Панель указывает, что убрать. Включение штатных запросов извне приостанавливает когорту.
orbital-native-radar-title=Штатная радарная телеметрия
orbital-native-radar-one=[font=default-bold]Одна платформа — один канал[/font]\n1. Включите выход запаса/состояния центра на красный провод. Для «Задать запросы» выберите зелёный вход и разделите сети.\n2. Подключите красный выход и постоянный комбинатор с выделенным сигналом присутствия (например, L=1) к запитанному радару. Выберите режим Вселенной и сигнальный канал только для этой платформы.\n3. В принимающей фабрике используйте запитанный радар той же фракции на том же канале. Красный провод подключите к принимающей схеме отдельно от входов запросов.\n\nКанал идентифицирует платформу и продолжает передавать данные при движении. Присутствие=1 без предметов означает пустой запас; отсутствие присутствия может означать потерю связи. Питание нужно с обеих сторон. Штатные схемы и радары всё равно требуют вычислений, хотя опрос сканера здесь не нужен.
orbital-native-radar-shared=[font=default-bold]Общий канал запасов[/font]\nПодключите несколько центров через радары одной фракции к общему каналу Вселенной. Сигналы суммируются. Одинаковый сигнал присутствия от каждого передатчика показывает число подключённых передатчиков. Назовите сеть «Суммарный запас». Она теряет принадлежность отдельным платформам и не показывает точную потребность или гарантированно доступный объём поставок.\n\nРадары передают сигналы схем; центры не выдают настроенные запросы или уже назначенные входящие грузы. Для Запросов / В пути / Потребности используйте точный сканер. Никогда не подавайте радиосуммы в когорту как потребность отдельной платформы. ESIR не создаёт ретрансляторы, не назначает каналы и не меняет проводку.
