[mod-setting-name]
ei-singularity-lance-visual-fidelity=Резонанс свидетельства Копья сингулярности

[mod-setting-description]
ei-singularity-lance-visual-fidelity=Определяет, насколько яростно Копьё сингулярности помнит каждый разрез. Клятва касается только свидетелей луча, свечения, огня, подпалин и звука; голод, досягаемость, тело и изготовление клинка остаются неизменными. Свидетель-откровение просит откровения под уздой. Освобождённый свидетель ломает ограничитель и позволяет призме записать каждую рану, которую выдержит мир.

[string-mod-setting]
ei-singularity-lance-visual-fidelity-lean=Тонкий свидетель
ei-singularity-lance-visual-fidelity-standard=Стойкий свидетель
ei-singularity-lance-visual-fidelity-cinematic=Сияющий свидетель
ei-singularity-lance-visual-fidelity-maximal=Свидетель-откровение
ei-singularity-lance-visual-fidelity-unbounded=Освобождённый свидетель

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Через разрез проходит только необходимый след: краткий луч, короткий свидетель, сдержанный огонь и подпалины.
ei-singularity-lance-visual-fidelity-standard=Луч ясно запоминается, а затем отпускается до того, как рана станет доктриной.
ei-singularity-lance-visual-fidelity-cinematic=Большей части разреза позволено задержаться: ярче срезы, богаче свидетели, дольше свечение на шраме.
ei-singularity-lance-visual-fidelity-maximal=Призме дозволено откровение на привязи: плотные лучи и стойкие свидетели, пока ограничитель ещё бодрствует.
ei-singularity-lance-visual-fidelity-unbounded=Ограничитель сломан. Копьё может записывать каждый отблеск, который сумеет продавить сквозь мир.

