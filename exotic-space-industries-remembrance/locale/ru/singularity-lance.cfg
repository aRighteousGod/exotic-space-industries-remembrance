[item-description]
ei-singularity-lance=Инопланетный двигатель-клятва вокруг парящего кристального сердца. Его хроматический луч не столько жжёт цель, сколько отделяет её от памяти о целостности.

[entity-description]
ei-singularity-lance=Вознесённый кристальный алтарь сосредоточенного чужого насилия. Призма висит над машиной, собирает невозможный цвет и выпускает его копьём сингулярности вдоль выбранной линии.

[exotic-industries-informatron]
menu_singularity_lance=Копьё сингулярности
title_singularity_lance=Копьё сингулярности
turrets-text-6=[item=ei-singularity-lance]Копьё сингулярности - инопланетный протокол клинка вокруг подвешенной призмы и пирамидального алтаря. Оно копит кристаллический заряд, пока выбранная линия не становится разрезом. Луч не снаряд; это приговор, протянутый сквозь пространство, оставляющий огонь, подпалину и тишину найти цель на вдох позже.
singularity-lance=Копьё сингулярности
singularity-lance-text=[item=ei-singularity-lance]Копьё сингулярности - компактный инопланетный двигатель казни. Левитирующий кристалл висит над его пирамидальной крышкой, пьёт огромный электрический импульс и отвечает цели светящейся раной на поле боя, а не отдельным снарядом для каждой жертвы.
singularity-lance-2=Хроматический след
singularity-lance-text-2=Каждый выстрел будит один живой след этого копья. Конец луча становится свидетелем: огонь, подпалина, метка, всплеск и лазерная рана отвечают на видимый разрез после того, как призма назовёт цель.
singularity-lance-3=Отбор свидетелей
singularity-lance-text-3=Когда слишком много копий говорит сразу, призма выбирает, какие разрезы достойны памяти. Одни полосы бледнеют или исчезают, но рана всё равно приходит; отсутствие зрелища не является милостью.
singularity-lance-4=Клятва свидетеля
singularity-lance-text-4=Текущая клятва свидетеля: __1__. Клятва решает, сколько хроматического разреза останется видимым: луч, свечение, огонь, подпалины, звук и послеслед. Она не переписывает голод или тело копья; она лишь решает, насколько громко рана будет запомнена.\n\nЗа живым числом смотрите статус установленного копья: там оно называет текущий устойчивый DPS с учётом силы.
