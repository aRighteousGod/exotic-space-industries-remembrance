[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Краткий луч и узнаваемые формы всех изученных улучшений, без декоративного свечения и шрамов.
ei-singularity-lance-visual-fidelity-standard=Луч ясно запоминается, а затем отпускается до того, как рана станет доктриной.
ei-singularity-lance-visual-fidelity-cinematic=Более долгий след луча, свечение и больше декоративных шрамов и звуков.
ei-singularity-lance-visual-fidelity-maximal=Ещё более долгий след луча. Предупреждения сохраняют точное время, а декорации остаются ограниченными.
ei-singularity-lance-visual-fidelity-unbounded=Самый долгий след луча. Старое название сохранено, но пределы декораций по-прежнему берегут ритм мира.

