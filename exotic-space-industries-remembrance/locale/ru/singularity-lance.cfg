[mod-setting-description]
ei-singularity-lance-visual-fidelity=Определяет световую память каждого разреза. Все режимы сохраняют линию разреза, знак раны, предупреждение о схлопывании и силуэт Завещания. Высшие режимы добавляют свечение, долгий след луча, шрамы и звук. При нагрузке декорации ограничены; урон, расход энергии и дальность не меняются.

