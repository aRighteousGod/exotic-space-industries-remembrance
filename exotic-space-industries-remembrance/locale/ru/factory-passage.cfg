[ei-factory-passage-guide]
walking-heading=Проход между машинами
walking=Инженеру тоже нужен проход. Функция сужает коллизии поддерживаемых производственных, энергетических и логистических построек, а также турелей, позволяя ходить между соседями. Центры остаются непроходимыми. Стены, ворота, природные препятствия, транспорт, враги, объекты вне сетки и невидимые вспомогательные объекты сохраняют предусмотренные коллизии.
modes-heading=Выбор режима труб
modes=Vanilla сохраняет коллизии игры и других модов. Squeak Through позволяет проходить через соседние стыки без дополнительного мода. ESIR блокирует реальные надземные соединения, оставляя несоединённые промежутки открытыми. Подземные участки не получают барьеров. Обычные трубы соединяются и сбоку: соприкасающиеся ряды образуют связанную решётку, а не коридор.
controls-heading=Где находятся настройки
controls=Категории и режим труб задаются при запуске и требуют перезапуска. Скорость обработки меняется в Настройки модов → Карта либо Администрирование → Параметры → Производительность. Оба экрана меняют одни и те же значения для всего сохранения. Основной лимит (по умолчанию __3__) охватывает обновления концов, повторные проверки занятых стыков и открытых окон. Первичное обнаружение и немедленное удаление вспомогательных объектов остаются синхронными.
recipes-heading=Изменения рецептов
recipes=Строительство, поворот, вставка настроек и другие поддерживаемые события ставят локальные обновления в очередь. При открытом нативном окне машины рецепты проверяются оперативно. Сборочные автоматы с нативным выбором рецепта через сеть и закрытым окном проверяет фоновый сканер. Закрытые машины с ручной настройкой не проверяются периодически. Другие моды при скрытом изменении рецепта или управления схемой должны вызывать существующий интерфейс обновления.
scanner-heading=Настройка сканера
scanner=?????? ?? ????????? ????????. ????????? ?????? ????????? ????? ??? ?????????. По умолчанию сканер получает __1__ попытку за тик сверх основного лимита. После успешной проверки или завершённого обновления машина ждёт __2__ тиков; окна и события обходят эту задержку. При обычной скорости это не более __4__ попыток в секунду на всё сохранение. Для стабильной группы из 600 подходящих машин полный проход займёт около __5__ секунд. Это пример, а не гарантия: очередь обновлений может добавить задержку. Увеличьте лимит для ускорения обновлений или уменьшите для ограничения работы. Лимиты не гарантируют длительность тика.
troubleshooting-heading=Отключение сканера и устранение проблем
troubleshooting=При выключенном сканере изменения схем у закрытых машин могут оставаться необработанными; окна и события продолжают работать. Проверьте включение проходов и режим ESIR. Squeak Through 2 имеет приоритет. Если стык ждёт освобождения места персонажем, отойдите. Уполномоченный администратор может выбрать Диагностика → Проходы на фабрике → Исправить либо выполнить /ei-admin-repair factory-passage, чтобы восстановить учёт без замены машин.
current-heading=Текущие настройки
current=Выбранный режим: __1__\nДействующий режим: __2__\nПричина неактивности: __3__\nОсновной лимит: __4__ за тик\nСканер схем: __5__\nДополнительный лимит: __6__ за тик\nСнимок обновляется при повторном открытии страницы.
