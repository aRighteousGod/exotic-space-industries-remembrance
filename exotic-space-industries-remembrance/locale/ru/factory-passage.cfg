[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=?? ????????? ????????. Проверяет сборочные автоматы с нативным выбором рецепта через логическую сеть, когда их окно закрыто. При отключении изменения схемы могут не отражаться в коллизиях до события или явного обновления. Открытые окна и событийные обновления продолжают работать. Изменение действует со следующего тика обслуживания без перестройки. Неактивно вне режима ESIR, при отключённых проходах или при приоритете Squeak Through 2.
ei-factory-passage-circuit-scan-budget=Дополнительные попытки сканирования за тик для всего сохранения (1–1024; по умолчанию 1), отдельно от основного лимита. После успешной проверки рецепта или завершённого обновления машина ждёт не менее 60 тиков до следующей фоновой проверки. Меньшие значения сокращают работу скрипта, но задерживают обновление коллизий; большие быстрее обрабатывают очередь и могут увеличить стоимость тика. Лимиты не гарантируют время в миллисекундах. Перезапуск не нужен; значение сохраняется при выключенном сканере.
ei-factory-passage-update-budget=Максимум задач из очереди за тик (1–1024; по умолчанию 256). Меньшие значения снижают нагрузку скриптов, но задерживают обновление коллизий труб. Большие значения быстрее опустошают очереди и могут увеличить время обработки тика. Применяется сразу ко всем поверхностям, без перезапуска игры. Первичный поиск объектов в мире и удаление вспомогательных объектов коллизий выполняются синхронно и не ограничиваются этой настройкой. Не действует, если выбран режим труб, отличный от ESIR, проходы между объектами фабрики отключены или Squeak Through 2 имеет приоритет.
ei-factory-passage-enabled=Позволяет проходить между поддерживаемыми объектами фабрики, установленными вплотную друг к другу. Отключение отменяет все изменения проходимости ESIR, сохраняя выбор категорий.
ei-factory-passage-production=Позволяет проходить между соседними производственными машинами, бурами, лабораториями и подобными зданиями.
ei-factory-passage-power=Позволяет проходить между соседними генераторами, котлами, реакторами, аккумуляторами, солнечными панелями и электрическими устройствами.
ei-factory-passage-logistics=Позволяет проходить между соседними хранилищами, манипуляторами, устройствами логической сети, маяками, радарами, робопортами и железнодорожными станциями.
ei-factory-passage-turrets=Позволяет проходить между соседними турелями, построенными игроком.
ei-factory-passage-pipe-mode=Ванильный: сохраняет исходные границы столкновений труб.\nSqueak Through: позволяет проходить между соседними секциями труб, включая места соединений. Центры труб остаются непроходимыми.\nESIR: позволяет проходить через свободные промежутки, но наземные соединения остаются непроходимыми. Новая преграда на соединении появляется только после того, как персонажи освободят её место. Подземные участки и уже проходимые тепловые трубы остаются проходимыми.

