[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=Самый короткий разрыв. Четыре кольца, жёсткие лимиты, без вторичного семейного акцента и без massive-explosion.
ei-flammable-rupture-fidelity-runtime-standard=По умолчанию. Шесть колец, умеренные лимиты, один осмысленный вторичный акцент и сдержанные massive-explosion.
ei-flammable-rupture-fidelity-runtime-cinematic=Восемь колец, более широкий бюджет на дым и огонь, более богатые семейные акценты и медленное торжественное раскрытие наружу.
ei-flammable-rupture-fidelity-runtime-unbounded=Убирает жёсткие визуальные пределы и позволяет планировщику агрессивно выпускать готовые кольца в тот же тик. Это режим для зрелища, а не для безопасности.
ei-gaian-saucer-wake-visual-fidelity-runtime-off=Судно запечатывает свой призрак и проходит без видимой памяти.
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=За оболочкой тянется лишь тонкий хроматический отказ, краткий и строгий.
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=След говорит ясно, затем меркнет, прежде чем стать доктриной.
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=След ширится, задерживается и изгибается вместе с клятвой поворота.
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=Оболочка оставляет плотную светящуюся рану движения всюду, где проходит.
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=Сдерживающее ярмо снято; тарелка может записать каждый отблеск, который выдержит мир.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=Нижняя часть корпуса запечатывает круги и движется без видимого мерцания.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=Четыре круга излучателей кратко отвечают земле, оставляя лишь сдержанную призматическую кромку.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=Излучатели пишут устойчивые изумрудные кольца под корпусом, пока движение становится давлением.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=Кольца ярче, плотнее, и вокруг каждой парящей опоры срезаются в мятно-зеленые призматические осколки.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=Каждый излучатель открывает под реликтом плотную светящуюся печать, почти молитвенную в своей жестокости.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=Ограничитель сломан; каждая парящая опора может заставить землю вспомнить проход танка.
