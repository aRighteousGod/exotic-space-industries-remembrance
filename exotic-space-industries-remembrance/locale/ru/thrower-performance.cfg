[mod-setting-name]
ei-thrower-performance-profile=Производительность огнемётных и кислотных турелей

[mod-setting-description]
ei-thrower-performance-profile=Уменьшает число частиц струи, частоту выстрелов, количество дыма и частоту нанесения урона от горения и коррозии только у турелей. Более сильные попадания сохраняют номинальный урон в секунду при непрерывной стрельбе, а повышенный расход жидкости за выстрел сохраняет расход в секунду. Урон, усиление и зависящая от топлива длительность огня на земле не меняются. Исходный режим сохраняет прежнее поведение. При 8× и 16× выстрелы редкие: меняются покрытие движущихся целей, разгорание огня и влияние фиксированного сопротивления. Множители не гарантируют соответствующего прироста UPS. Ручное оружие и вооружение транспорта не затрагиваются.\nБазовые значения без учёта качества, исследований и других модов. Столбцы: интервал выстрелов / интервал частиц / частиц в секунду / множитель прямого урона и расхода жидкости / интервал горения / интервал коррозии. Интервалы указаны в тиках (60 тиков = 1 секунда).

[string-mod-setting]
ei-thrower-performance-profile-original=Исходный
ei-thrower-performance-profile-2x=Сокращение в 2 раза
ei-thrower-performance-profile-4x=Сокращение в 4 раза
ei-thrower-performance-profile-8x=Сокращение в 8 раз
ei-thrower-performance-profile-16x=Сокращение в 16 раз

[string-mod-setting-description]
ei-thrower-performance-profile-original=Прежнее поведение: выстрел каждые 4 тика; частица каждые 2 тика; 30 частиц/с; обычный прямой урон и расход жидкости; горение каждые 10 тиков; коррозия каждый тик.
ei-thrower-performance-profile-2x=Выстрел каждые 8 тиков; частица каждые 4 тика; 15 частиц/с; прямой урон и жидкость за выстрел ×2; горение каждые 20 тиков; коррозия каждые 2 тика.
ei-thrower-performance-profile-4x=Выстрел каждые 16 тиков; частица каждые 8 тиков; 7,5 частицы/с; прямой урон и жидкость за выстрел ×4; горение каждые 30 тиков; коррозия каждые 4 тика.
ei-thrower-performance-profile-8x=Выстрел каждые 32 тика; частица каждые 16 тиков; 3,75 частицы/с; прямой урон и жидкость за выстрел ×8; горение каждые 30 тиков; коррозия каждые 8 тиков. Редкие выстрелы меняют покрытие целей и влияние фиксированного сопротивления.
ei-thrower-performance-profile-16x=Выстрел каждые 64 тика; частица каждые 32 тика; 1,875 частицы/с; прямой урон и жидкость за выстрел ×16; горение каждые 30 тиков; коррозия каждые 16 тиков. Очень редкие выстрелы меняют покрытие целей и влияние фиксированного сопротивления.

[thrower-performance]
profile-row=\n__1__: __2__ / __3__ / __4__ / ×__5__ / __6__ / __7__
