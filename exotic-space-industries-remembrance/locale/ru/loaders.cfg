[item-description]
ei-loader=Погрузчик прямой подачи с одним общим фильтром на обе линии ленты. Перемещает только одиночные предметы.
ei-fast-loader=Быстрый погрузчик прямой подачи с одним общим фильтром на обе линии ленты. Перемещает только одиночные предметы.
ei-express-loader=Погрузчик прямой подачи с одним общим фильтром на обе линии ленты. Поддерживает настраиваемое штабелирование ленты до [font=default-bold]2[/font].
ei-turbo-loader=Погрузчик прямой подачи с двумя фильтрами по линиям, по одному на каждую сторону ленты. Поддерживает настраиваемое штабелирование ленты до [font=default-bold]2[/font].
ei-neo-loader=Погрузчик прямой подачи с двумя фильтрами по линиям, по одному на каждую сторону ленты. Поддерживает настраиваемое штабелирование ленты до текущего глобального лимита стека ленты.

