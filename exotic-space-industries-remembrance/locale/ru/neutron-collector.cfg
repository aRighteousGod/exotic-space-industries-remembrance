[recipe-name]
ei-neutron-collector-idle=Режим ожидания коллектора

[recipe-description]
ei-neutron-collector-idle=Сохраняет интерфейс коллектора доступным, когда ни один рецепт нейтронной зарядки не может работать.

[virtual-signal-name]
ei-neutron-efficiency=Нейтронная эффективность
ei-neutron-distance=Дистанция источника
ei-neutron-collector-agent=Агент коллектора
ei-neutron-source-agent=Агент источника
ei-neutron-scan-agent=Агент сканирования

[virtual-signal-description]
ei-neutron-efficiency=Выводит текущую эффективность коллектора от 0 до 300.
ei-neutron-distance=Выводит дистанцию до связанного источника в десятых долях тайла.
ei-neutron-collector-agent=Выводит состояние агента коллектора: 1 активен, 2 простаивает, 3 заблокирован.
ei-neutron-source-agent=Выводит состояние агента источника: 1 активен, 2 спит, 3 отсутствует.
ei-neutron-scan-agent=Выводит состояние агента сканирования: 1 стабилен, 2 загрязнен, 3 ожидает перепривязки.

