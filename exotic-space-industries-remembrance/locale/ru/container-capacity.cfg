[mod-setting-name]
ei-container-capacity-profile=Профиль вместимости контейнеров

[mod-setting-description]
ei-container-capacity-profile=Задаёт вместимость складских сундуков, в том числе из других модов. Число ячеек при обычном качестве; столбцы: Дерево / Железо / Сталь / Малый / Средний / Склад.\n__1__\n\nОбычные, фильтруемые и логистические варианты одного размера имеют одинаковую вместимость. Существующие бонусы качества сохраняются. Служебные инвентари машин исключены. Снижение настройки может уменьшить существующие инвентари и привести к потере предметов.

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=Ячейки при обычном качестве: Дерево __1__ / Железо __2__ / Сталь __3__ / Малый __4__ / Средний __5__ / Склад __6__.

