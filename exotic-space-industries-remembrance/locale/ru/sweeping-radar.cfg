tip-speed=0 приостанавливает. 100 запрашивает предел оборудования, исследований и качества; общий лимит может снизить скорость.
tip-direction=1 по часовой стрелке, -1 против, 0 возвратно-поступательно в секторе. Фиксированное направление допускает 0.
tip-policy=Наблюдение работает только с созданными и открытыми чанками. Разведка разрешает создание территории.
tip-contacts=Последние отдельные обнаружения, целиком опубликованный завершённый проход или последнее наблюдение.
tip-expiry=1–300 секунд после фактического наблюдения, а не публикации.
tip-run=Положительный сигнал включает; ноль или отрицательный приостанавливает. Энергия отменённой работы не возвращается.
tip-trigger=Передний фронт запускает один проход. Во время работы новые запуски игнорируются. Держите сигнал до подтверждения «Сканирование», затем обнулите. Кнопка запускает вручную.
