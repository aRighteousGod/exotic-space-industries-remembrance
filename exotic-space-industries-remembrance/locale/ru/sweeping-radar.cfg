informatron-body=Красный провод управляет отмеченными полями, зелёный передаёт данные. Ноль является настоящим значением. Все пять режимов и три способа хранения доступны сразу. Исследования улучшают дальность, скорость и эффективность; качество также улучшает эти характеристики и увеличивает здоровье.\n\nНаблюдение открывает один чанк и проверяет живые враждебные военные цели. Положение и возраст относятся к последнему наблюдению, а не к непрерывному слежению. Пустой действительный отчёт отличается от отсутствия данных. Лимит запроса — 128 кандидатов, рабочего набора — 2048 целей. При усечении числа являются нижними границами.\n\nНаблюдение не создаёт территорию. Разведка подаёт не более одного запроса каждые 30 тиков для всей сети. Невыполнимый запрос истекает через 60 секунд и помечает покрытие неполным. Смена геометрии отменяет незавершённую работу и данные. Пауза, замерзание и неверные настройки отключают действительность отчёта. После одиночного прохода данные могут сохраняться. Энергия отменённой работы не возвращается.\n\nОбщий предел — 120 начатых наблюдений/с до учёта прочих ограничений. Скорость задаёт запрос. Панель показывает среднюю скорость с момента установки, идеальную длительность и длительность последнего прохода. Луч следует завершённым наблюдениям; вращающаяся антенна следует за ним с небольшим отставанием.\n\nОдин электрический буфер питает ожидание и наблюдения. Копии и восстановленные буферы изначально пусты. Улучшение сохраняет настройки и имеющуюся энергию в пределах нового буфера. Обычный радар остаётся доступен.\n\nБазовые электрические параметры: сканирующий радар — ожидание 1 МВт, 8 МДж на наблюдение, предел входа 64 МВт, буфер 16 МДж; радар с фазированной решёткой — ожидание 2 МВт, 5 МДж на наблюдение, предел входа 128 МВт, буфер 10 МДж. Качество добавляет до 4 чанков радиуса и 50% скорости сканирования, а затраты энергии на наблюдение снижает до 20%. Эти бонусы сочетаются с исследованиями и ограничены легендарным уровнем. Качество не меняет потребление в ожидании и общие лимиты обработки. Потребление в ожидании сохраняется во время паузы и ожидания импульса. Входные пределы ограничивают зарядку; фактическое потребление зависит от времени ожидания и принятых наблюдений.
