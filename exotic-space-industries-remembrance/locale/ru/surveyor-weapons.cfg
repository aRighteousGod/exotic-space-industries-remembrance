[item-description]
ei-surveyor-carbine=Паровой карабин со стеклянным прицелом. Стреляет медленно, но ствол с давлением и коррекцией достает дальше обычного автоматического оружия.
ei-surveyor-rifle=Электрически стабилизированная рама «Геодезиста». Выстрел остается размеренным, зато прицельная картина становится чище.
ei-surveyor-cannon=Противоматериальное оружие линии «Геодезист» эпохи симуляции. Автоматический крупнокалиберный режим опирается на смоделированные попадания и углеволоконную структуру отдачи.
ei-adaptive-surveyor=Квантовая модульная снайперская система. Превосходные данные предсказывают патронник, ствол, ветер и цель раньше, чем спуск завершает ход.
ei-inferno-grenade=Кластерная граната, перестроенная так, чтобы у цели раскалываться на горящие взрывные осколки. Каждый осколок детонирует при ударе, а затем сеет собственное кольцо огня.
ei-incinerator-capsule=Выпускает пять быстрых «Испепелителей», выведенных из разрушителей. Они следуют, жгут и отказывают огню в милости.
ei-prediction-snare-mine=Развертываемая симуляционная ловушка, которая предсказывает движение врага и заливает ближайшую биологию ложными моторными сигналами.
ei-breach-solver-charge=Компактный заряд, расходующий данные симуляции на узкий избыточный взрыв для вскрытия гнезд, червей и укрепленных целей.

