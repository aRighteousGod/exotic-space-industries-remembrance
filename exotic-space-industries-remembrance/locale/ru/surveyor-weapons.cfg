[technology-description]
ei-surveyor-carbine=Добавляет стекло, давление и железную коррекцию к старой раме пулемета. Итог не быстрее. Он дальше.
ei-surveyor-rifle=Стабилизирует схему «Геодезиста» электрическим возвратом и улучшенной оптикой, перенося доктрину дальнего выстрела в эпоху электричества.
ei-surveyor-cannon=Превращает линию «Геодезист» в автоматическое противоматериальное оружие, усиленное данными симуляции и углеволоконными пластинами. Оно продолжает стрелять, но каждый выстрел все еще принадлежит прицелу.
ei-adaptive-surveyor=Использует превосходные данные, странную обшивку и адаптивный патронник, превращая линию «Геодезист» в квантовую дальнобойную систему исполнения.
military-5=Оформляет доктрину симулированного убийства: предсказательные ловушки, заряды пролома, инфернальные боеприпасы и эскалацию огневых роботов в единую санкционированную командную основу.
ei-inferno-grenade=Разрешает кластерные гранаты, перестроенные в заряды блокирования местности симулированным огнём: оболочка рвётся, осколки падают, и каждый удар пишет новое кольцо огня.
ei-incinerator=Разрешает «Испепелителей», выведенных из разрушителей: пять быстрых сопровождающих, которые следуют, жгут и отказывают огню в милости.
