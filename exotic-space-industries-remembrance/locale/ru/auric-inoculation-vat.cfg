ei-auric-vat-vigor=Вигор чана
ei-auric-vat-contamination=Загрязнение чана
ei-auric-vat-band=Пояс бассейна
ei-auric-vat-claims=Закрепленные плитки бассейна
ei-auric-vat-bloom=Состояние цветения

[virtual-signal-description]
ei-auric-vat-vigor=Выводит текущий вигор цикла чана по шкале от 0 до 100.
ei-auric-vat-contamination=Выводит текущее давление загрязнения чана по шкале от 0 до 100.
ei-auric-vat-band=Выводит текущий индекс пояса бассейна от 1 до 7 по числу закрепленных болотных плиток.
ei-auric-vat-claims=Выводит количество плиток болотного бассейна, которые сейчас закреплены за чаном.
ei-auric-vat-bloom=Выводит состояние цветения: 1 стабильно, 2 напряжено, 3 сорвано.

