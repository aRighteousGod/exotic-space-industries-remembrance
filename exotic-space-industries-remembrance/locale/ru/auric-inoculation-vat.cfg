[recipe-description]
ei-auric-inoculation-vat=Строит чан аурической инокуляции, который закрепляет ближайший болотный бассейн, ведет циклы инокуляции на Глебе и позже выводит из болота новые узлы аурических кист.
ei-auric-cyst-washing=Обваривает собранные аурические кисты перегретым паром, затем протравливает вскрытую оболочку серной кислотой. Золотоносное ядро раскалывается на куски, а отработанная ткань сходит в порчу и грязную воду.

[technology-name]
ei-auric-marsh-inoculation=Инокуляция аурических болот

[technology-description]
ei-auric-marsh-inoculation=Открывает глебские чаны аурической инокуляции, обработку кист и цепочку промывки. Закрепите пригодный болотный бассейн, подавайте реагенты цикла и не дайте загрязнению обрушить цветение.

