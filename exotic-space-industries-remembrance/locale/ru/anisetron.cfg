[exotic-industries-informatron]
menu_gaian_hierophant=Иерофант Гайи
title_gaian_hierophant=Иерофант Гайи
gaian-hierophant-intro=Святилище превращает преданность в режущий сигнал. Иерофант Гайи — медленный парящий собор с двумя кристальными лучами, построенный вокруг штатного командного ядра Spidertron.
gaian-hierophant-controls=Управление и снабжение
gaian-hierophant-controls-text=Используйте обычное управление Spidertron, дистанционный выбор и автопилот. Оборудование, грузовой отсек, слоты для ненужных предметов и логистика машины работают через штатные интерфейсы игры. Ручной и автоматический огонь запускают один и тот же оплаченный цикл; судно может двигаться во время стрельбы. Стабилизация парения ограничивает суммарное действие замедлений, но урон и прямые оглушения сохраняются.
gaian-hierophant-weapons=Два кристалла, два захвата цели
gaian-hierophant-weapons-text=С боеприпасами обычного качества корона наносит __1__ единиц лазерного урона каждые __2__ тиков, имеет базовую дальность __3__ клеток и охватывает __4__ градусов. Фасад наносит __5__ единиц лазерного урона каждые __2__ тиков в пределах __6__ клеток и переднего сектора шириной __7__ градусов. Каждый луч удерживает подходящую цель и плавно поворачивается к новой, когда прежняя потеряна. Урон наносится только после захвата цели; визуальное пересечение лучом другой единицы не делает её целью. Качество машины увеличивает дальность короны; дальность фасада остаётся неизменной.
gaian-hierophant-charge=Один заряд, один цикл стрельбы
gaian-hierophant-charge-text=Один [item=ei-anisetron-crystal-charge] заранее оплачивает работу обоих лучей на __1__ с. Их суммарная базовая мощность достигает __2__ единиц лазерного урона в секунду, пока оба канала попадают в цели, до учёта исследований, улучшений и сопротивлений. Поиск целей и повороты расходуют время того же цикла; неиспользованный урон не сохраняется и не передаётся между лучами. Пополняйте боеприпасы через логистику машины. Оплаченный огонь продолжается после исчерпания боеприпасов или отпускания кнопки стрельбы. Удаление судна отменяет оставшиеся попадания; уже назначенные коллапсы и эхо всё равно завершаются.
gaian-hierophant-upgrades=Наследие Копья
gaian-hierophant-upgrades-text=Качество боеприпасов, [technology=laser-weapons-damage-6] и последующие исследования усиливают оба луча. Только корона наследует [technology=ei-singularity-lance-axial-rupture], [technology=ei-singularity-lance-wound-memory], [technology=ei-singularity-lance-terminal-collapse] и [technology=ei-singularity-lance-black-hole-testament]: дополнительные разрезы, накапливающийся урон раны, отложенный коллапс и усиленный импульс каждые __1__ запланированных импульсов короны. Эти улучшения не требуются для постройки. При оплате заряда фиксируются его урон, дальности, качество и изученные улучшения; новые исследования влияют на следующие заряды.
gaian-hierophant-construction=Сборка на Гайе
gaian-hierophant-construction-text=Исследуйте [technology=ei-anisetron] после Тарелки Slipwake, Копья сингулярности и Урона лазерного оружия 5. Соберите судно на Гайе, используя пустое шасси [item=ei-gaian-saucer], одно [item=ei-singularity-lance] и остальные материалы рецепта. Сначала снимите оборудование и опустошите шасси: этот обычный рецепт создаёт новое судно и не переносит его конфигурацию. Кристаллические заряды можно производить на любой поверхности.
gaian-hierophant-visuals=Визуальный резонанс
gaian-hierophant-visuals-text=Выбранный режим настройки запуска: __1__. Он управляет зелёными нитями движения, ореолами лучей и вспышками попаданий. Оба основных луча и важнейшие признаки улучшений остаются видимыми даже при отключённых украшениях. Режим не меняет урон, выбор целей, дальность, оплату заряда, продолжительность стрельбы или движение. Высшие режимы допускают больше декоративных эффектов; Освобождённый снимает эти ограничения и может снизить UPS.
