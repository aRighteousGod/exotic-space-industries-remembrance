[technology-description]
ei-severance-array=Открывает лазерную турель квантовой эпохи, тянущую единую клятву света за меняющейся линией прицела.

[mod-setting-name]
ei-severance-array-visual-fidelity=Визуальная точность Массива Отсечения

[mod-setting-description]
ei-severance-array-visual-fidelity=Управляет только видимыми следами луча, временем жизни свечения, огня и подпалин, плотностью звука и визуальным бюджетом Массива Отсечения. Урон, дальность, энергия, прочность и стоимость рецепта не меняются. Максимальный — это ограниченный режим для снимков и стресс-тестов; Безграничный убирает жёсткие визуальные пределы и может сокрушить UPS.

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=Экономный
ei-severance-array-visual-fidelity-standard=Стандартный
ei-severance-array-visual-fidelity-cinematic=Кинематографичный
ei-severance-array-visual-fidelity-maximal=Максимальный
ei-severance-array-visual-fidelity-unbounded=Безграничный

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=Приоритет UPS: меньше срезов луча, короче видимые следы, сильнее ограничены огонь и подпалины.
ei-severance-array-visual-fidelity-standard=Это профиль для обычной игры: видимые рассечения, подтверждённые попадания и осторожные бюджеты выполнения.
ei-severance-array-visual-fidelity-cinematic=Больше зрелищности: больше срезов, больше видимых следов, дольше держатся свечение и подпалины.
ei-severance-array-visual-fidelity-maximal=Это ограниченный зрелищный профиль: лучи и следы для снимков, но аварийные пределы всё ещё включены.
ei-severance-array-visual-fidelity-unbounded=Убирает жёсткие визуальные пределы и агрессивно выпускает готовую работу Массива. Это режим для зрелища, а не для осторожности.

[item-description]
ei-severance-array=Квантовая оружейная платформа 4x4, расходующая огромный накопленный заряд, чтобы прорезать в строях врага движущуюся лазерную рану.

[entity-description]
ei-severance-array=Квантовая оружейная платформа 4x4. Ее нативный лазерный удар несет смертельную кромку; при высокой нагрузке редеет только видимый след прицела.

[exotic-industries-informatron]
menu_severance_array=Массив Отсечения
title_severance_array=Массив Отсечения
turrets-text-6=[item=ei-severance-array]Массив Отсечения - квантовый протокол клинка между Плазменной турелью и стратегическим реликтовым оружием. Он хранит колоссальный заряд, затем тянет один видимый луч от прежней точки прицела к следующей, пока нативный лазерный удар несет экстремальный первый урон. След имеет визуальный бюджет: когда много массивов стреляет одновременно, часть срезов луча подавляется, чтобы урон оставался стабильным.
severance-array=Массив Отсечения
severance-array-text=[item=ei-severance-array]Массив Отсечения - компактный квантовый двигатель казни. Он занимает основание 4x4, расходует огромный электрический импульс и отвечает цели светящейся раной на поле боя, а не отдельным снарядом для каждой жертвы.
severance-array-2=Протокол следа прицела
severance-array-text-2=Каждый выстрел использует обычный урон турели по цели и перенаправляет один живой визуальный след этой турели. Срезы луча - декоративные свидетели разреза, а не источник истины.
severance-array-3=Сброс нагрузки
severance-array-text-3=Когда слишком много массивов стреляет сразу, рантайм делит доступные визуальные срезы между ними. На поле боя может быть меньше полос света, но урон остается на нативном пути турели прежде, чем время тратится на зрелище.
