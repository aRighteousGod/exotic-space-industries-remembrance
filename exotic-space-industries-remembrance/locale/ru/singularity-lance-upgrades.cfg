[lance-upgrades]
axial=Центральный разрез шириной __1__ клетки продолжается до __2__ клеток за точкой прицеливания и наносит по __4__ ед. лазерного урона не более чем __3__ дополнительным вражеским военным целям. Два ответвления расходятся под углами ±__5__°; ширина каждого — __6__ клетка, длина — до __7__ клеток. Вместе они поражают до __8__ дополнительных целей, нанося каждой __9__ ед. лазерного урона. Все лучи остаются в пределах эффективной дальности; каждый противник получает не более одного пробивающего попадания, с приоритетом центрального луча.
wound=Основные попадания начинаются с бонусом +__1__% урона. Каждое последовательное попадание, наносящее урон той же цели, увеличивает бонус следующего ещё на __1__ процентных пунктов, до +__2__%. Смена цели или перерыв от __3__ с сбрасывают серию. Нулевой урон не добавляет зарядов и не продлевает срок раны. Дополнительный урон не усиливается.
collapse=Заменяет обычный урон по площади одним коллапсом в исходной точке прицеливания через __1__ с: __5__ ед. лазерного урона в радиусе __6__, иначе __2__ в пределах радиуса __3__. Поражает до __4__ дополнительных вражеских военных целей и основную цель, если она всё ещё находится в зоне. Урон ядра и внешней области не складывается.
testament=Каждый __1__-й оплаченный выстрел: основной урон ×__2__, включая Память раны; центральный лимит __3__, общий лимит ответвлений __7__. Первый коллапс: __8__ ед. лазерного урона в радиусе __9__, иначе __4__ в пределах радиуса __5__; до __6__ дополнительных целей и допустимая основная цель. Одно эхо через __10__ с после выстрела: __11__ ед. лазерного урона, радиус __12__, до __13__ дополнительных целей и допустимая основная цель. Выстрел учитывается, даже если цель исчезла или получила защиту.
research-row=__1__ (открывается исследованием)
protection-title=Защита целей
protection=Основная цель исключена из обычного урона по площади и всех пробивающих лучей, но может получить урон от каждого коллапса, находясь в его зоне, без расходования лимита дополнительных целей. Своя и нейтральная стороны, союзники и стороны с перемирием защищены; отношения проверяются в обоих направлениях. Противник может получить одно пробивающее попадание и по одному попаданию от каждого коллапса.
status=Базовый прямой урон/с: __1__ • __2__
status-wound= • Основной удар с Памятью __1__–__2__
status-testament= • Каждый __1__-й выстрел ×__2__
baseline=Базовые возможности
force-values=Ваша сторона • множитель урона ×__1__ • основной удар __2__ лазерного урона • устойчивый прямой урон/с __3__ до Памяти/Завещания • базовая дальность __4__ клеток, повышается качеством. Значения ниже учитывают ваши исследования урона.
base-area=Обычный урон по площади: __1__ лазерного урона, радиус __2__, до __3__ дополнительных целей. Заменяется Конечным коллапсом.
rules=Урон каждого оплаченного выстрела и каждого коллапса обрабатывается отдельно. Принадлежность к центральному лучу имеет приоритет над ответвлениями; пересекающиеся лучи никогда не дублируют пробивающий урон. Каждый коллапс наносит урон ядра или внешней области, но не обоих одновременно. Попадание в область поражения и ядро определяется по центру цели; цели, чей центр находится точно на границе, включаются. Оба коллапса остаются в исходной точке прицеливания, даже если противник движется или копьё убрано; выход из зоны позволяет избежать урона. Их параметры фиксируются при выстреле. Рана исчезает после перерыва, метка следует за целью. Завещание считает выстрелы, а не жертв. Достаточно исследовать чёрную дыру; запускать её не требуется. Качество и границы цели определяют дальность прямого огня. Основные сигналы видны при любой детализации; украшения не влияют на урон.
research-state=__1__ — __2__
active=Активно
locked=Недоступно
prerequisites=Прямые предпосылки:
science=Необходимые исследовательские пакеты:
legend-1=Сигнал: бело-золотой центральный разрез с голубыми краями и двумя тонкими призматическими ответвлениями из точки прицеливания. Текучие ленты и сужающиеся шлейфы показывают фактический конец каждого луча.
legend-2=Сигнал: цвет течёт вдоль трещины при 1–2 зарядах, ответвлений при 3–4 и разорванного кольца при 5. Метка следует за целью и исчезает вместе с раной.
legend-3=Сигнал: призматические шлейфы спиралью сходятся к стягивающемуся внешнему кольцу и видимой границе ядра в исходной точке прицеливания. Усиленная центральная вспышка отмечает момент урона.
legend-4=Сигнал: тёмная сердцевина луча между широкими призматическими полосами; увеличенное тёмное ядро коллапса и яркое аккреционное кольцо, затем повторное сжатие и конечная крестообразная вспышка эха.
static-values=Указан базовый урон до исследований урона копья. Память зависит от серии основных попаданий, а Завещание — от числа оплаченных выстрелов; единого значения площадного урона в секунду нет.
