[lance-upgrades]
axial=Разрез шириной __1__ клетку продолжается до __2__ клеток за точкой прицеливания в пределах эффективной дальности. До __3__ дополнительных вражеских военных целей получают по __4__ ед. лазерного урона.
wound=Каждое успешное основное попадание усиливает следующее по той же цели на __1__%, до +__2__%. Первое попадание без бонуса. Смена цели или перерыв от __3__ с сбрасывают рану. Нулевой урон не добавляет зарядов и не продлевает срок раны. Дополнительный урон не усиливается.
collapse=Заменяет обычный урон по площади одним коллапсом в исходной точке прицеливания через __1__ с: __2__ ед. лазерного урона, радиус __3__, до __4__ дополнительных вражеских военных целей.
testament=Каждый __1__-й оплаченный выстрел: основной урон ×__2__, включая Память раны; осевой лимит __3__; коллапс __4__ ед. лазерного урона, радиус __5__, лимит __6__. Выстрел учитывается, даже если цель исчезла или получила защиту.
research-row=__1__ (открывается исследованием)
protection-title=Защита целей
protection=Основная цель исключена из всех дополнительных ударов. Своя и нейтральная стороны, союзники и стороны с перемирием защищены; отношения проверяются в обоих направлениях. Другой противник может получить и пробивающий, и площадной урон.
status=Устойчивый прямой урон/с: __1__ • __2__
baseline=Базовые возможности
force-values=Ваша сторона • множитель урона ×__1__ • основной удар __2__ лазерного урона • устойчивый прямой урон/с __3__ до Памяти/Завещания • базовая дальность __4__ клеток, повышается качеством. Значения ниже учитывают ваши исследования урона.
base-area=Обычный урон по площади: __1__ лазерного урона, радиус __2__, до __3__ дополнительных целей. Заменяется Конечным коллапсом.
rules=Урон каждого оплаченного выстрела обрабатывается отдельно. Коллапс остаётся в исходной точке прицеливания, даже если противник движется или копьё убрано. Его параметры фиксируются при выстреле. Рана исчезает после перерыва, метка следует за целью. Завещание считает выстрелы, а не жертв. Достаточно исследовать чёрную дыру; запускать её не требуется. Качество и границы цели определяют дальность прямого огня. Основные сигналы видны при любой детализации; украшения не влияют на урон.
research-state=__1__ — __2__
active=Активно
locked=Недоступно
prerequisites=Прямые предпосылки:
science=Необходимые исследовательские пакеты:
legend-1=Сигнал: бело-золотой разрез с двумя голубыми краями, текучими призматическими лентами и сужающимися шлейфами до фактического конца луча.
legend-2=Сигнал: цвет течёт вдоль трещины при 1–2 зарядах, ответвлений при 3–4 и разорванного кольца при 5. Метка следует за целью и исчезает вместе с раной.
legend-3=Сигнал: призматические шлейфы спиралью сходятся к кольцу, стягивающемуся в исходной точке прицеливания. Вспышка отмечает момент урона.
legend-4=Сигнал: тёмная сердцевина луча между широкими призматическими полосами; тёмный диск с ярким аккреционным кольцом, втягивающимися шлейфами и конечной крестообразной вспышкой.
static-values=Указан базовый урон до исследований урона копья. Память и Завещание зависят от условий; единого значения площадного урона в секунду нет.
