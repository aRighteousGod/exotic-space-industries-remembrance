[autoplace-control-descriptions]
ei-auric-fumarole=Частота регулирует вероятность извержений и число попыток восстановления фумарол. Размер задаёт целевое число активных фумарол, а не их габариты. Богатство масштабирует запасы: при 100% каждая новая фумарола содержит 40 000–80 000 единиц. Отключение запрещает все новые извержения. Оставшиеся запасы существующих залежей не меняются. Фумаролы не отображаются в предпросмотре генерации карты. Они появляются только во время игры, когда работает скрипт.

[exotic-industries-informatron]
auric-fumarole-defaults=Значения ниже соответствуют настройкам карты на 100%. Целевое число фумарол ограничено доступной местностью и расстоянием между ними.
