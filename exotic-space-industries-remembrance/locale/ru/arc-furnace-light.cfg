[mod-setting-name]
ei-arc-furnace-light-flicker-preset=Мерцание света дуговой печи

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=Меняет только активные рабочие огни дуговой печи. Исходное мерцание сохраняет нынешнюю беспокойную дугу. Сниженное мерцание и Мягкая пульсация успокаивают эффект. Статичное свечение оставляет ровный свет. Выключено убирает активные рабочие огни, но сохраняет анимацию печи и красное свечение конденсатора в простое.

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=Выключено
ei-arc-furnace-light-flicker-preset-static=Статичное свечение
ei-arc-furnace-light-flicker-preset-soft=Мягкая пульсация
ei-arc-furnace-light-flicker-preset-reduced=Сниженное мерцание
ei-arc-furnace-light-flicker-preset-original=Исходное мерцание

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=Убирает активные рабочие огни. Анимация печи и красное свечение конденсатора в простое остаются.
ei-arc-furnace-light-flicker-preset-static=Оставляет активное свечение ровным, без мерцания.
ei-arc-furnace-light-flicker-preset-soft=Оставляет тусклую медленную пульсацию, чтобы цеха печей светили спокойнее.
ei-arc-furnace-light-flicker-preset-reduced=Сохраняет слоистые цвета дуги, но делает мерцание медленнее и уже.
ei-arc-furnace-light-flicker-preset-original=Сохраняет нынешнее беспокойное освещение дуговой печи.
