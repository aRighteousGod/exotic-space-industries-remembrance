[item-name]
ei-flamethrower-fuel=Боеприпасы для огнемёта (__1__)
[item-description]
ei-flamethrower-fuel=Огненный урон: __1__% от урона боеприпасов на сырой нефти. Огонь на земле изначально горит __2__ с; при непрерывной подаче топлива длительность может достигать __3__ с. Время горения поражённых целей не меняется. Огнемёты техники сохраняют обычный характер действия.
[entity-description]
ei-flamethrower-fuel=Эффекты топлива: __1__. Огонь на земле изначально горит __2__ с; при непрерывной подаче топлива длительность может достигать __3__ с.
[mod-setting-name]
ei-flamethrower-fuel-adaptation=Эффекты огнемётных турелей в зависимости от топлива
[mod-setting-description]
ei-flamethrower-fuel-adaptation=Автоматически меняет пламя, дым и длительность горения на земле в зависимости от расходуемого топлива. Если отключено, турели используют общие эффекты и обычную длительность горения; все топливные множители урона и варианты боеприпасов сохраняются. Обновление выполняется каждые 16 тиков. Лимит проверок топлива и лимит попыток замены турелей равны полному значению максимального числа обновлений скриптов за тик. При отключении существующие турели постепенно возвращаются к обычному виду в пределах этого лимита. По умолчанию включено. При отключении также прекращается удаление перекрывающихся огненных эффектов, поэтому огонь от разных видов топлива может накладываться.
