[mod-setting-description]
ei-pyric-radiance=Добавляет освещение от обычного огня, огненных струй, обычных взрывов, вспышек выстрелов и физических снарядов. Сохраняет цвета топлива и специально созданные эффекты. Меняет только внешний вид: распространение огня, карты, ночное видение, фонари и длительность суток сохраняют прежнее поведение. При отключении выбранная доктрина сохраняется.
ei-pyric-radiance-preset=Выберите соотношение света пламени, взрывов, трассирующих снарядов и вспышек выстрелов. Множители изменяют радиус света; ноль сохраняет исходный вид эффектов этой группы. Дополнительный свет частых попаданий и дополнительная ядерная вспышка доступны лишь в более насыщенных доктринах; существующий экранный эффект ядерного взрыва сохраняется. Специально созданные экзотические и энергетические эффекты сохраняют свой внешний вид.\n
ei-ballistic-divergence=Пули летят, промахиваются и поражают цели на своём пути. Применяется к существующим магазинам патронов, дроби и роботам, стреляющим пулями. Игроки и постройки вашей стороны не перехватывают эти снаряды; отдельные союзные стороны и нейтральные объекты местности могут быть поражены. Существующие эффекты урона по области и горения сохраняют свои правила. Магазины бронебойных и урановых патронов получают штатный запас пробития, равный 25-кратному базовому физическому урону: пуля может пройти сквозь убитую цель, но выжившая цель останавливает её. Экзотические патроны сохраняют полный набор эффектов одного попадания. Не добавляет боеприпасов или исследований. При отключении выбранная доктрина сохраняется.
ei-ballistic-divergence-preset=Выберите максимальную дополнительную дальность, разброс пуль, ёмкость магазинов и заданную вариацию дальности дроби. Необходимая дальность покрывает наибольшую дальность совместимого действующего оружия с учётом модификаторов дальности боеприпасов, качества и запаса на смещение дульного среза. Дополнительный полёт не превышает 16 клеток сверх этой основы; дальность выбора целей оружием не меняется. Множитель разброса пуль применяется к угловому отклонению 0,16 и заданному отклонению дальности 0,40; ноль убирает добавленный разброс пуль. Вариация дальности пуль и дроби ограничивается выбранным пределом дополнительного полёта, а исходный конус разброса дробовика сохраняется. Ёмкость магазинов округляется вверх; ёмкость боеприпасов для дробовика и боеприпасы роботов не меняются. Защита местности устанавливает минимальное сопротивление физическому урону: для деревьев — 2 единицы фиксированного поглощения и 65%, для камней — 4 единицы и 75%. Эти изменения действуют на весь физический урон.\n

