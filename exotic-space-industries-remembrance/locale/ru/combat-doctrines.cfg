[string-mod-setting-description]
ei-pyric-radiance-preset-ember=Небольшие добавления света и мало движущихся источников.
ei-pyric-radiance-preset-veiled=Сдержанное освещение обычных боевых эффектов.
ei-pyric-radiance-preset-furnace-vigil=Преобладает свет горящей земли и лесов; без дополнительных движущихся источников.
ei-pyric-radiance-preset-iron-benediction=Более сильные вспышки выстрелов выделяют огневые позиции.
ei-pyric-radiance-preset-signal-threads=Более сильное трассирующее освещение выделяет пути снарядов.
ei-pyric-radiance-preset-tempered=Умеренное освещение по умолчанию; без дополнительного света попаданий и ядерных вспышек.
ei-pyric-radiance-preset-night-liturgy=Обширное тёплое боевое освещение с дополнительным светом попаданий.
ei-pyric-radiance-preset-siege-hymn=Сильные вспышки выстрелов и заметные летящие к вам снаряды.
ei-pyric-radiance-preset-cataclysm=Большие зоны света взрывов и выраженные ядерные вспышки.
ei-pyric-radiance-preset-apotheosis=Максимальная атмосфера и плотность источников света.
ei-ballistic-divergence-preset-needle-oath=Прямые траектории пуль без добавленного разброса и дополнительного полёта; прежняя ёмкость магазинов и исходный конус разброса дробовика.
ei-ballistic-divergence-preset-measured-volleys=Небольшие отклонения пуль, защищённая местность и прежняя ёмкость магазинов.
ei-ballistic-divergence-preset-breach-doctrine=Повышенный разброс пуль и увеличенная ёмкость магазинов; местность остаётся уязвимой.
ei-ballistic-divergence-preset-tempered=Умеренные разброс и дополнительная дальность; сохраняет нынешнюю экономику пулевых боеприпасов.
ei-ballistic-divergence-preset-distant-thunder=Увеличенная дополнительная дальность снарядов при сдержанном разбросе пуль.
ei-ballistic-divergence-preset-fortress-oath=Вместительные магазины, умеренный разброс и защищённая местность.
ei-ballistic-divergence-preset-wildfire-doctrine=Большой разброс пуль и высокая заданная вариация дальности дроби, вместительные магазины и защищённая местность.
ei-ballistic-divergence-preset-crossfire=Увеличенная дополнительная дальность и большой разброс пуль; местность остаётся уязвимой.
ei-ballistic-divergence-preset-saturation=Увеличенная дополнительная дальность, большой разброс, удвоенная ёмкость пулевых магазинов и защищённая местность.
ei-ballistic-divergence-preset-terminal-barrage=Максимальные дополнительная дальность, разброс и ёмкость пулевых магазинов; местность остаётся уязвимой.

