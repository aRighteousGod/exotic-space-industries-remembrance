pyric-radiance=Pyric Radiance
pyric-radiance-text=Печь приносит ночи своё свидетельство. Обычное пламя сохраняет цвета топлива; выстрелы и взрывы освещают свой путь. Выберите доктрину в начальных настройках, чтобы выделить тлеющие угли, огневые позиции, трассирующие траектории или обширный осадный свет. Карты, распространение огня, ночное видение, фонари и смена дня и ночи сохраняют прежнее поведение. Специально созданные экзотические всплески и энергетические эффекты сохраняют собственный визуальный облик.
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=Выстрел несёт клятву, но не обещание точности. Существующие пули получают физические траектории; враги и нейтральные препятствия могут их перехватить. Ваша сторона не перехватывает эти снаряды, но отдельные союзные стороны остаются допустимыми целями попадания. Существующие эффекты урона по области и горения сохраняют свои правила. Магазины бронебойных и урановых патронов получают штатный запас пробития, равный 25-кратному базовому физическому урону: пули могут пройти сквозь убитые цели, а выжившие цели останавливают выстрел. Экзотические патроны доставляют полный набор эффектов один раз. Совместимое действующее оружие использует общий предел дальности полёта снарядов с учётом модификаторов дальности боеприпасов, качества и запаса на смещение дульного среза. Доктрины разрешают ограниченный дополнительный полёт сверх этой основы и ограничивают вариацию дальности пуль и дроби, не меняя дальность выбора целей и исходный конус разброса дробовика. Промахнувшиеся снаряды исчезают благодаря штатному ограничению дальности движка. Новые пределы действуют на новые выстрелы; снаряды, уже находящиеся в полёте, сохраняют записанные дальности и эффекты попадания. Некоторые доктрины увеличивают ёмкость пулевых магазинов или защищают местность; рецепты, технологии, ёмкость боеприпасов для дробовика и урон роботов не меняются.
