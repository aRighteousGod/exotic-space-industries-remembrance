[mod-setting-description]
ei-ecology-alert-enabled=Получать выбранные успешно применённые экологические эффекты в стандартном окне оповещений. Главный переключатель личных уведомлений.
ei-ecology-alert-surfaces=Введите all или JSON-массив точных названий. [] означает ничего. Максимум 128 названий и 4096 байт. Окно Экология меняет ту же настройку. Отсутствующие названия ничего не выбирают.
ei-ecology-alert-current-surface-only=Ограничить выбранные уведомления поверхностью текущего просмотра, включая удалённый вид. По умолчанию выключено.
ei-ecology-alert-allow-unrevealed=Только администраторы: обойти текущую видимость чанка. Фильтры категорий и поверхностей остаются. По умолчанию выключено. Просто исследованной территории обычно недостаточно.
ei-terrain-periodic-mining-scars=Поддерживаемые карьеры и большие буры при работе могут нарушать открытый природный грунт вокруг конечных месторождений. Активные залежи, инфраструктура и защищённые области сохраняются. Следы истощения по-прежнему запускаются событиями.
ei-terrain-periodic-mining-seconds=Интервал до влияния интенсивности и сезона. Базовые 300 секунд превращаются в 600 при Сдержанной интенсивности до сезонной поправки. Поздняя проверка даёт одну попытку без наверстывания.
ei-terrain-periodic-mining-probability=Шанс каждой подходящей периодической попытки. По умолчанию 10%. Отдельный шанс 70% для каждой клетки выбранного пятна не меняется.
ei-ecology-alert-wildfire=Уведомлять после успешного экологического эффекта: Возгорание. Уведомление не включает сам эффект. Действуют фильтры и видимость. Возгорание означает создание огня, а не сгоревший лес.
ei-ecology-alert-flood=Уведомлять после успешного экологического эффекта: Затопление. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-drought=Уведомлять после успешного экологического эффекта: Высыхание берега. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-cliff=Уведомлять после успешного экологического эффекта: Выветривание скал. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-paving=Уведомлять после успешного экологического эффекта: Коррозия покрытия. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-pollution=Уведомлять после успешного экологического эффекта: Ущерб от загрязнения. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-restoration=Уведомлять после успешного экологического эффекта: Восстановление почвы. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-depletion-scars=Уведомлять после успешного экологического эффекта: Следы истощения. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-working-scars=Уведомлять после успешного экологического эффекта: Следы работающих буров. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-mining-restoration=Уведомлять после успешного экологического эффекта: Восстановление следов добычи. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-tree-stress=Уведомлять после успешного экологического эффекта: Угнетение деревьев. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-tree-recovery=Уведомлять после успешного экологического эффекта: Восстановление деревьев. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-regrowth=Уведомлять после успешного экологического эффекта: Дикий прирост. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-aging=Уведомлять после успешного экологического эффекта: Старение деревьев. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-rot=Уведомлять после успешного экологического эффекта: Разложение сухостоя. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-thermal=Уведомлять после успешного экологического эффекта: Термические следы. Уведомление не включает сам эффект. Действуют фильтры и видимость.
ei-ecology-alert-blood=Уведомлять после успешного экологического эффекта: Исцеление кровью пришельцев. Уведомление не включает сам эффект. Действуют фильтры и видимость.

[ei-terrain]
controls=Кнопка с механическим деревом слева вверху открывает Простой отчёт, Подробный отчёт и Оповещения. Цвет листьев соответствует сезону просматриваемого мира; название сезона показано в подсказке. Простой показывает полевые сведения; Подробный — настройки, результаты и лимиты. Оповещения используют стандартное окно и общие личные настройки мода, обычно для видимых сейчас чанков. Настройки администратора остаются в разделе Рельеф и экология.
v2-coverage=Наблюдения охватывают конечную сменяемую группу чанков. Необследованная земля остаётся неизвестной; старые или отсутствующие замеры не доказывают непрерывную чистоту или загрязнение. Восстанавливаются только записанные ESIR изменения. Конечные миграции, инициализация и обслуживание видны в окне перестройки; постоянная экология — в Подробном отчёте. Лимит 100 000 посещений не подтверждает охват всей карты.
mining-v2-note=У работающих буров есть отдельная периодическая опция, включённая по умолчанию: 10% каждые 300 базовых секунд, или 600 при Сдержанной интенсивности до сезонной поправки. Принятые запросы не истекают со временем; отключение поверхности их приостанавливает. Восстановление новых записанных следов включено по умолчанию.
status-unsupported=Неподдерживаемая поверхность
status-independent=Независимое управление Фульгорой

