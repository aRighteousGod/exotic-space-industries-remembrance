gaian-saucer-text=[item=ei-gaian-saucer] Тарелка Slipwake — гайанское парящее судно: командное ядро Spidertron, погребенное в оболочке, которая отвергает ноги. Грузовой отсек, сетка снаряжения и привод, питаемый пустотой, делают ее сосудом паломника для враждебных порогов.
gaian-saucer-2=Резонанс следа
gaian-saucer-text-2=Текущая клятва следа: [font=default-bold]__1__[/font]. Она меняет только хроматическую память за оболочкой: яркость цветения Slipwake, стойкость шрама поворота и то, сколько прохода мир должен запомнить. Само судно остается прежним.
