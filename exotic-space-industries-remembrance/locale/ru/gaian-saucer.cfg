[item-description]
ei-gaian-saucer=Быстрая гайанская парящая оболочка с запечатанным грузовым отсеком, сеткой снаряжения и без видимых ног. Она движется как вспоминаемый шаг и оставляет за собой хроматический разлом.

[entity-description]
ei-gaian-saucer=Быстрая гайанская парящая рама вокруг командного ядра Spidertron.\nОна скользит, заставляя землю помнить ложные ступни. Когда клятва следа крепнет, за машиной расцветает хроматический Slipwake.

[recipe-description]
ei-gaian-saucer=Переселяет командное ядро Spidertron в гайанскую парящую оболочку, снимает пусковые установки и оставляет двигателю память о движении без конечностей.

[technology-description]
ei-gaian-saucer=Открывает тарелку Slipwake: гайанское парящее судно, чьи грузовой отсек, сетка снаряжения и хроматический след превращают движение в клятву, запомненную землей.

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=Резонанс следа тарелки Slipwake

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=Определяет, насколько яростно тарелка Slipwake может помнить свой проход. Клятва касается только хроматического следа; отсек, сетка, привод, оболочка и изготовление остаются прежними.

[string-mod-setting]
ei-gaian-saucer-wake-visual-fidelity-off=Спящий
ei-gaian-saucer-wake-visual-fidelity-lean=Тонкий
ei-gaian-saucer-wake-visual-fidelity-standard=Запомненный
ei-gaian-saucer-wake-visual-fidelity-cinematic=Сияющий
ei-gaian-saucer-wake-visual-fidelity-maximal=Откровенный
ei-gaian-saucer-wake-visual-fidelity-unbounded=Освобождённый

[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=Судно запечатывает свой призрак и проходит без видимой памяти.
ei-gaian-saucer-wake-visual-fidelity-lean=За оболочкой тянется лишь тонкий хроматический отказ, краткий и строгий.
ei-gaian-saucer-wake-visual-fidelity-standard=След говорит ясно, затем меркнет, прежде чем стать доктриной.
ei-gaian-saucer-wake-visual-fidelity-cinematic=След ширится, задерживается и изгибается вместе с клятвой поворота.
ei-gaian-saucer-wake-visual-fidelity-maximal=Оболочка оставляет плотную светящуюся рану движения всюду, где проходит.
ei-gaian-saucer-wake-visual-fidelity-unbounded=Сдерживающее ярмо снято; тарелка может записать каждый отблеск, который выдержит мир.

