[item-description]
ei-fueler=Автономная [color=orange]заправочная вышка[/color]. В режиме транспорта она обслуживает поезда, автомобили, танки, паукотроны, пулемётные турели, артиллерийские турели и артиллерийские вагоны. В режиме оборудования она снабжает топливом [color=blue]оборудование, работающее на горючем топливе, в сетках оборудования транспорта и персонажа, включая реакторное оборудование, работающее на горючем топливе[/color]. Также извлекает [color=red]продукты сгорания топлива[/color]. Более высокое качество позволяет одной вышке обслуживать больше целей за один проход обновления, но не увеличивает радиус; обычные правила качества контейнеров по-прежнему повышают вместимость инвентаря. Подробнее см. во внутриигровой вики Informatron.

