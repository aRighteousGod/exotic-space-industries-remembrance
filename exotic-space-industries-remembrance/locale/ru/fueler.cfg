[technology-name]
ei-fueler=Автозаправочная вышка

[technology-description]
ei-fueler=Автозаправочная вышка работает в двух режимах. Режим транспорта обслуживает поезда, автомобили, танки, паукотроны, пулемётные турели, артиллерийские турели и артиллерийские вагоны. Режим оборудования снабжает топливом оборудование, работающее на горючем топливе, в сетках оборудования транспорта и персонажа, включая реакторное оборудование, работающее на горючем топливе. В интерфейсе вышки можно выбрать тип цели и то, куда подавать топливо: в топливные инвентари транспорта или в оборудование на горючем топливе внутри сеток оборудования. При наличии места вышка также забирает отработанное топливо обратно в свой инвентарь.

