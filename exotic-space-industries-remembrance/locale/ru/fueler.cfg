welcome=Exotic Industries: Заправщик
welcome-text=Автозаправочная вышка - это автоматическое вспомогательное сооружение. Она отслеживает подходящие цели поблизости и подаёт им топливо из собственного инвентаря.\n\nВ режиме транспорта она обслуживает поезда, автомобили, танки, паукотроны, пулемётные турели, артиллерийские турели и артиллерийские вагоны. В режиме оборудования она снабжает топливом оборудование, работающее на горючем топливе, в сетках оборудования транспорта и персонажа, включая реакторное оборудование, работающее на горючем топливе. Если в ней есть место, вышка также может забирать в себя отработанное топливо и продукты сгорания.\n\nЧерез интерфейс выберите и тип цели, и направление подачи топлива. Если вышка кажется бездействующей, чаще всего причина именно в этом: вышка, настроенная на локомотив и переведённая в режим оборудования, не будет заполнять топливные инвентари транспорта, а режим оборудования работает только с оборудованием на горючем топливе внутри сеток.\n\n[font=default-bold]Она не спрашивает. Она служит тому контуру, который ей задан.\nОна не выходит за пределы своего радиуса и выбранного режима.\n\nНастройте её один раз, а дальше пусть работает.[/font]

welcome-text-2=Автозаправочные вышки успевают работать и с движущимися целями, включая поезда на ходу. Качество не меняет радиус действия и задержки между срабатываниями, но вышки более высокого качества могут обслуживать больше целей за один проход обновления, поэтому они лучше справляются с загруженными депо.\n\nЕсли из-за миграции, взаимодействия модов или повреждённого состояния рантайма система выйдет из синхронизации, администраторы могут пересобрать состояние рантайма командой /rescan_fuelers. На инвентарь вышки по-прежнему распространяются обычные правила качества контейнеров в Factorio, так что более высокое качество также означает больше места для топлива и боеприпасов.\n\n[font=default-bold]Эти вышки эффективны, но не всеведущи.\nЧем лучше вышка, тем больше работы она может выполнить за раз.[/font]
welcome-text-3=В режиме оборудования учитывается и реакторное оборудование на горючем топливе.
