[entity-name]
ei-fueler=Автозаправочная вышка

[item-description]
ei-fueler=Автоматическая [color=orange]заправочная вышка[/color]. Может использоваться для заправки поездов, автомобилей и танков, а также их [color=blue]сеток оборудования[/color] и слотов для боеприпасов в башнях. Также удаляет [color=red]отработанное топливо[/color]. Подробнее в вики Informatron в игре.

[mod-setting-name]
ei_fueler_max_updates_per_tick=Максимальное количество обновлений автозаправочной вышки за тик
ei-fueler_range=Диапазон автозаправочной вышки

[mod-setting-description]
ei_fueler_max_updates_per_tick=УСТАРЕЛО, заменено общей настройкой обновлений сущностей. Количество обновлений за тик. Заправочные вышки обновляются циклично. Увеличение этого числа означает, что больше заправочных вышек будут обновляться за меньшее время, но производительность при этом снизится. Если вышки используются только для дозаправки стационарных целей, достаточно настройки по умолчанию.
ei-fueler_range=Более высокий диапазон позволяет находить цели, которые находятся дальше. Однако производительность снизится, поскольку вышкам придется сканировать большие площади.

[technology-name]
ei-fueler=Автозаправочная вышка

[technology-description]
ei-fueler=Заправочные вышки могут заправлять транспортные средства, паукотроны, поезда и сетки оборудования транспортных средств/игроков в своем радиусе действия. Заправочная вышка будет переносить предметы из своего инвентаря в топливные инвентари поблизости. Одновременно можно заправлять только один тип цели. Чтобы задать тип цели, которая будет заправляться вышкой, вы можете использовать графический интерфейс, который появляется при нажатии на вышку. Вы можете выбрать либо заправку оборудования,потребляющего топливо, либо само транспортное средство. Вышка также будет забирать все использованное топливо и сохранять его в своем собственном инвентаре, если это возможно.

[exotic-industries-fueler]
fueler-gui-title=Консоль
fueler-gui-control-title=Управление
fueler-gui-control-description=[font=default-bold]Тип цели[/font] [img=info]
fueler-gui-control-description-tooltip=Выберите тип цели, которую заправляет вышка.\nДругие модифицированные поезда поддерживаются типом локомотива.\nДругие модифицированные автомобили и танки поддерживаются типом автомобиля.\nТо же самое для всех типов паукотронов.
fueler-gui-equipment-description=[font=default-bold]Назначение топлива[/font] [img=info]
fueler-gui-equipment-description-tooltip=Должна ли эта вышка заправлять автомобили или их оборудование?

vehicle=Только транспортные средства
equipment=Только сетку оборудования

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=Заправочная вышка
title_exotic-industries-fueler-informatron=Заправочная вышка

welcome=Exotic Industries: Заправщик
welcome-text=Автозаправочная вышка — это автоматическое вспомогательное сооружение, предназначенное для обслуживания транспортных средств, поездов, паукотронов и сеток оборудования в пределах радиуса её действия.\n\nОна переносит топливо из своего внутреннего инвентаря ближайшим целям, но может заправлять только один тип целей одновременно. Его можно настроить через графический интерфейс, выбрав между:\n\nТопливным инвентарём транспорта, или\n\nПотребителями топлива в сетке оборудования\n\nВ дополнение к дозаправке, вышка будет автоматически извлекать отработанное топливо — забирая использованные элементы или пустые ёмкости и сохраняя их в своём инвентаре, если там есть место.\n\n[font=default-bold]Она не спрашивает. Она снабжает.\nОна не ждёт. Она опустошает и наполняет.\n\nНастройте её один раз — и пусть работает.[/font]

welcome-text-2=Автозаправочные вышки способны обслуживать движущиеся цели, включая поезда на ходу. Передача топлива происходит динамически, что позволяет заправлять мобильные единицы без остановки — [font=default-bold]при оптимальных условиях.[/font]\n\nДля поддержания производительности система не масштабируется по количеству установленных вышек. Вместо этого [font=default-bold]частота обновлений снижается по мере роста числа вышек.[/font] Это обеспечивает стабильный показатель UPS, но вносит вариативность в тайминги для быстро движущихся целей.\n\nКак частоту обновлений, так и дальность действия вышек можно изменить в настройках мода.\n\nЗначения по умолчанию оптимизированы для неподвижного транспорта и паукотронов.\n\nПри большом количестве вышек или для движущихся поездов рассмотрите возможность увеличения частоты обновлений, чтобы не пропускать окна дозаправки.\n\n[font=default-bold]Эти вышки эффективны, но не всеведущи.\nЧем больше вы их размещаете, тем точнее должны быть настройки.[/font]
