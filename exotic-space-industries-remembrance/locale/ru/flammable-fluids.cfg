[mod-setting-name]
ei-flammable-rupture-fidelity=Насыщенность горючих разрывов

[mod-setting-description]
ei-flammable-rupture-fidelity=Определяет, насколько плотно разыгрываются визуальные эффекты и опасность при разрыве горючих жидкостей. Облегчённый режим короткий и сдержанный. Стандартный используется по умолчанию. Кинематографичный растягивает зрелище на большее число колец. Безграничный снимает жёсткие лимиты эффектов и при взрыве крупных резервуаров может сильно ударить по UPS.

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=Облегчённый
ei-flammable-rupture-fidelity-standard=Стандартный
ei-flammable-rupture-fidelity-cinematic=Кинематографичный
ei-flammable-rupture-fidelity-unbounded=Безграничный

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Самый короткий разрыв. Четыре кольца, жёсткие лимиты, без вторичных акцентов и без massive-explosion.
ei-flammable-rupture-fidelity-standard=Настройка по умолчанию. Шесть колец, умеренные лимиты, один заметный вторичный акцент и сдержанные massive-explosion.
ei-flammable-rupture-fidelity-cinematic=Восемь колец, больше дыма и пламени, богаче акценты семейств и медленнее внешний разлёт.
ei-flammable-rupture-fidelity-unbounded=Снимает жёсткие визуальные лимиты и позволяет планировщику агрессивно выталкивать готовые кольца в том же тике. Это режим ради зрелища, а не ради безопасности.

[exotic-industries-informatron]
menu_flammable_ruptures=Горючие разрывы
title_flammable_ruptures=Горючие разрывы
flammable-ruptures=Разрыв горючей жидкости
flammable-ruptures-text=Резервуары, трубы, подземные жидкостные линии, вагоны и машины с жидкостью могут разорваться при гибели, если внутри осталось достаточно горючего содержимого. Рантайм читает финальные загруженные прототипы жидкостей, а не жёсткий рукописный список, поэтому нефтепродукты, газовые линии и экзотические топливные смеси сохраняют собственный язык последствий.\n\nСрабатывание по-прежнему зависит от типа смертельного урона. Огонь, удар, взрыв, плазма и другие высокоэнергетические смерти вызывают разрыв намного охотнее, чем холод или яд.
flammable-ruptures-2=Режим насыщенности
flammable-ruptures-text-2=Текущий стартовый режим: [font=default-bold]__1__[/font]\n\n[font=default-bold]Облегчённый[/font] держит последовательность короткой и жёстко ограниченной. [font=default-bold]Стандартный[/font] — основной публичный путь по умолчанию. [font=default-bold]Кинематографичный[/font] сохраняет более широкий разлёт на большем числе тиков. [font=default-bold]Безграничный[/font] убирает лимиты эффектов и велит планировщику агрессивно тратить готовые кольца в том же тике.
flammable-ruptures-3=Распространение и цена
flammable-ruptures-text-3=Загрязнение применяется сразу в момент смерти, но остальная часть разрыва теперь идёт наружу кольцами. Взрывы, дым, постановка огня, подпалины и урон ближайшим жертвам вычисляются один раз, а затем выпускаются по нескольким тикам, поэтому группа гигантских баков больше не пытается породить весь свой апокалипсис в одном кадре.\n\nПодземные парные добивания используют ту же очередь. Безграничный режим намеренно опасен для производительности: четыре полных silo-2 всё ещё могут выглядеть великолепно, но платить за это будете вы.
