[string-mod-setting-description]
ei-terrain-intensity-restrained=Умеренная интенсивность использует множитель 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Вычислительные бюджеты задаются отдельно.
ei-terrain-intensity-standard=Умеренная интенсивность использует множитель 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Вычислительные бюджеты задаются отдельно.
ei-terrain-intensity-severe=Умеренная интенсивность использует множитель 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Вычислительные бюджеты задаются отдельно.
ei-terrain-intensity-custom=Умеренная интенсивность использует множитель 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Вычислительные бюджеты задаются отдельно.
ei-terrain-performance-ultra-low=Интервал обработки (тики): 16. Лимит поисков объектов: 1; интервал (тики): 128. Лимиты за проход: проверок записей восстановления 1, изменений клеток 1. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-low=Интервал обработки (тики): 16. Лимит поисков объектов: 1; интервал (тики): 64. Лимиты за проход: проверок записей восстановления 2, изменений клеток 2. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-lean=Интервал обработки (тики): 16. Лимит поисков объектов: 1; интервал (тики): 32. Лимиты за проход: проверок записей восстановления 4, изменений клеток 4. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-balanced=Интервал обработки (тики): 8. Лимит поисков объектов: 1; интервал (тики): 16. Лимиты за проход: проверок записей восстановления 4, изменений клеток 4. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-detailed=Интервал обработки (тики): 4. Лимит поисков объектов: 1; интервал (тики): 8. Лимиты за проход: проверок записей восстановления 8, изменений клеток 4. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-high-fidelity=Интервал обработки (тики): 2. Лимит поисков объектов: 1; интервал (тики): 4. Лимиты за проход: проверок записей восстановления 8, изменений клеток 4. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-ultra-high-fidelity=Интервал обработки (тики): 1. Лимит поисков объектов: 2; интервал (тики): 2. Лимиты за проход: проверок записей восстановления 16, изменений клеток 8. Общие для всех поверхностей; фактическая работа зависит от условий.
ei-terrain-performance-custom=Использует отдельные интервалы обработки и поиска, лимиты работы и объёма хранимых данных. Небольшие порции и более редкий поиск снижают пиковую нагрузку, но замедляют охват. Смена профиля сохраняет записанную историю восстановления.
ei-terrain-wildfire-off=Отключает пожары, вызываемые экологическими процессами. Выжженные участки и посторонние боевые пожары регулируются отдельно.
ei-terrain-wildfire-contained=Нераспространяющееся пламя живёт не более 10 секунд. Число поджогов ограничено; посторонние пожары не переходят под управление ESIR.
ei-terrain-wildfire-spreading=Использует нативное распространение огня. Начальные поджоги ограничены, но дальнейшая работа движка не входит в бюджет скриптов ESIR и может существенно снизить UPS.

[exotic-industries-informatron]
menu_terrain_evolution=Изменение ландшафта
title_terrain_evolution=Изменение ландшафта

[ei-terrain]
overview=Изменение ландшафта объединяет воздействие загрязнения на почву, восстановление по истории, следы добычи и естественные реакции деревьев. Огонь, береговая линия, скалы, кровь и покрытия настраиваются отдельно. Наувис, Гайя и поддерживаемые планеты сохраняют свои типы ландшафта. Источниками вдохновения послужили TerrainEvolution и TerrainEvolution2.
protections=Обычные изменения почвы учитывают покрытия игрока, инфраструктуру, месторождения и неподдерживаемый ландшафт. Восстановление следует истории ESIR, а не превращает все биомы в траву. Опасные явления также проходят защитные проверки. Отключение функции прекращает новую работу, но не отменяет прошлые изменения.
calendar=Условный сезонный календарь использует расстояние и ориентацию загруженной звёздной карты. Он не перемещает планеты и не меняет общую продолжительность суток. Сезонный световой день и экология включаются отдельно. Фульгора сохраняет собственные часы. ESIR уступает управление освещением известным внешним модулям или при обнаружении сторонних изменений.
performance=Небольшие порции работы обрабатываются часто. Профили Очень низкий и Низкий сводят объём работы к минимуму; Экономный — щадящий вариант по умолчанию. Сбалансированный, Подробный, Высокая точность и Очень высокая точность постепенно увеличивают охват и нагрузку на UPS. Пользовательский использует отдельные ограничения. Все бюджеты общие для всех поверхностей; интенсивность и опасные явления настраиваются отдельно.
effective=Состояние: __1__; обработка: __2__; интенсивность: __3__
mining-note=Истощение конечного месторождения в зоне подходящего бура может оставить след добычи; событие не определяет, какой бур вызвал истощение. По умолчанию следы постоянны. Их включение, форму и восстановление будущих следов можно настроить в параметрах экологии.
unsupported=Эта поверхность или функция не поддерживается.
invalid-value=Недопустимое значение или сочетание настроек.
updated=Настройки экологии обновлены.
status-enabled=Включено
status-disabled=Выключено
status-active=Активно
status-active-clamped=Активно, сезонный диапазон ограничен
status-external-control=Внешнее управление
status-frozen=Время суток заморожено
status-pending=Ожидание
status-released=Управление освобождено
status-excluded=Исключено
status-invalid-input=Недопустимый ввод
status-invalid-baseline=Недопустимый исходный цикл дня
status-invalid-geometry=Недопустимая геометрия сезона
status-incompatible-baseline=Несовместимый исходный цикл дня
status-diurnal-dynamics=Diurnal Dynamics
status-TerrainEvolution2=Terrain Evolution 2
status-TerrainEvolution=TerrainEvolution

[ei-admin]
ecology-diagnostics=Самый старый замер: __1__ с; самое старое событие в очереди: __2__ с; отклонено из-за лимита: __3__; пропущено защищённых участков: __4__; записей об изменении тайлов: __5__/__6__
ecology-gaia-legacy=Некоторые участки Гайи из старых версий нельзя достоверно классифицировать. Неопределённые области остаются защищёнными.
page-ecology=Ландшафт и экология
ecology-note=Переопределения действуют только на выбранной поверхности. Наследование удаляет одно переопределение, сброс — все переопределения этой поверхности. Существующий ландшафт не восстанавливается.
ecology-apply=Применить переопределение
ecology-inherit=Использовать общее значение
ecology-reset=Сбросить настройки поверхности
ecology-phase=Фаза сезона (0–1)
ecology-set-phase=Задать фазу сезона
ecology-unavailable=Экология недоступна на этой поверхности.
ecology-overridden=настройка поверхности
ecology-inherited=общее значение
ecology-invalid-phase=Введите фазу сезона от 0 до 1.
ecology-invalid-setting=Эту настройку нельзя переопределить здесь.
ecology-invalid-number=Введите допустимое число в пределах настройки.
ecology-status=__1__: __2__; активных чанков: __3__; событий в очереди: __4__; историй клеток: __5__; историй деревьев: __6__
