[mod-setting-description]
ei-terrain-evolution-enabled=Включает планетарную экологию ESIR: изменение и восстановление ландшафта под влиянием загрязнения, следы добычи по событиям истощения ресурсов, угнетение и возобновление диких деревьев, сезонную продолжительность дня. Отдельные функции, планеты и ограничения нагрузки на UPS настраиваются в меню «Настройки модов → Карта». Необязательные опасные эффекты по умолчанию выключены; Фульгора сохраняет независимое управление сутками. Отключение прекращает новые изменения, не сбрасывая ландшафт, и восстанавливает освещение только пока им управляет ESIR.
ei-terrain-active=Запускает экологические процессы и сезонное изменение продолжительности дня на включённых поддерживаемых поверхностях. Отключение прекращает новую работу, не отменяя изменений ландшафта; прежнее освещение восстанавливается только если другой контроллер его не изменил.
ei-terrain-intensity=Умеренная интенсивность использует множитель скорости 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Интенсивность не зависит от вычислительных бюджетов и никогда не включает отключённые опасные эффекты.
ei-terrain-performance=Небольшие порции работы обрабатываются часто. Профили Очень низкий и Низкий сводят объём работы к минимуму; Экономный — щадящий вариант по умолчанию. Сбалансированный, Подробный, Высокая точность и Очень высокая точность постепенно увеличивают охват и нагрузку на UPS. Пользовательский использует отдельные ограничения. Все бюджеты общие для всех поверхностей; интенсивность и опасные явления настраиваются отдельно.
ei-terrain-custom-rate-multiplier=Умеренная интенсивность использует множитель 0,5, Стандартная — 1, Сильная — 2. Пользовательская использует заданный множитель. Вычислительные бюджеты задаются отдельно.
ei-terrain-degradation=При длительном загрязнении постепенно ухудшает подходящий природный ландшафт по цепочкам плиток его планеты. По умолчанию требуется загрязнение не ниже 100 в течение пяти минут. Споры Глебы не считаются токсичным загрязнением.
ei-terrain-recovery=Восстанавливает только записанные изменения ландшафта ESIR, точно проходя исходный путь в обратном порядке. По умолчанию требуется загрязнение не выше 25 в течение десяти минут; интервал восстановления в четыре раза больше интервала деградации. Внешняя замена плитки отменяет её восстановление ESIR.
ei-terrain-mining-scars=Срабатывает по событию исчерпания конечного ресурса в зоне добычи подходящей карьерной установки или большого бура. Следы поблизости ставятся в очередь с общими ограничениями обработки; при массовом истощении лишние следы могут пропускаться. По умолчанию следы постоянны. Событие не указывает, какой бур исчерпал ресурс.
ei-terrain-tree-stress=При длительном загрязнении придаёт серый цвет разрешённым местным диким деревьям; после длительного очищения отменяет посерение, вызванное ESIR. Культурные растения и защищённая флора исключены.
ei-terrain-tree-regrowth=После длительного периода чистой среды медленно выращивает разрешённые местные деревья рядом с существующими. Учитывает местную плотность деревьев и защиту ландшафта; на Гайе выбирает деревья по биому.
ei-terrain-thermal-scars=Деревья, погибшие от огня подходящего источника, могут оставлять небольшие выжженные участки. Этот эффект не вызывает пожары.
ei-terrain-seasonal-daylight=Включено по умолчанию. Сезонно меняет продолжительность светового дня и штатную солнечную выработку, сохраняя общую длительность суток. Фульгора всегда исключена; фиксированное освещение и внешние контроллеры имеют приоритет.
ei-terrain-mining-recovery=Выключено по умолчанию. Записывает будущие следы добычи для восстановления; прежние постоянные следы восстановить невозможно. Повреждения от добычи заменяют более ранние пути экологического восстановления.
ei-terrain-aging=Выключено по умолчанию. Заменяет подходящие живые деревья Наувиса местным сухостоем. На других планетах нет разрешённой замены сухостоем, поэтому они исключены. Пожары не возникают.
ei-terrain-rot=Выключено по умолчанию. Постепенно удаляет подходящий местный сухостой. Защищённые деревья и участки исключены.
ei-terrain-flood=Выключено по умолчанию. Превращает разрешённые песчаные прибрежные плитки Наувиса в воду рядом с существующей пресной водой. Другие планетарные жидкости и защищённые участки исключены.
ei-terrain-drought=Выключено по умолчанию. Превращает разрешённые прибрежные водные плитки Наувиса в песок рядом с существующим песчаным берегом. Другие планетарные жидкости и защищённые участки исключены.
ei-terrain-cliffs=Выключено по умолчанию. Изредка удаляет подходящие обычные скалы. Особые планетарные скалы и защищённые участки исключены.
ei-terrain-blood=Выключено по умолчанию. Гибель вражеского существа или уничтожение гнезда может обратить один записанный этап повреждения ландшафта поблизости. Для следов добычи по-прежнему требуется включённое восстановление следов добычи.
ei-terrain-paving=Выключено по умолчанию. Требует включённых эффектов крови: гибель врагов может снимать подходящее каменное или бетонное покрытие, открывая плитку под ним. Защита инфраструктуры и остальные ограничения сохраняются.
ei-terrain-seasonal-ecology=Выключено по умолчанию. Сезонно меняет скорость деградации почвы, активность и возобновление деревьев, частоту попыток опасных эффектов. Работает независимо от того, кто управляет сезонным освещением; отключённые опасные эффекты не включает.
ei-terrain-wildfire=Выключено по умолчанию. Загрязнение может вызывать ограниченное число возгораний. Ограниченное пламя не распространяется и существует не более 10 секунд; штатное распространение огня может выйти за вычислительный бюджет ESIR. Посторонние боевые пожары остаются независимыми.
ei-terrain-planet-nauvis=Включает экологию и сезонную продолжительность дня на Наувисе: цепочки деградации травы, грунта, пустыни и песка, местные дикие деревья и необязательные изменения берегов. Отдельные переключатели функций и правила защиты сохраняют силу.
ei-terrain-planet-gaia=Включает экологию и сезонную продолжительность дня на Гайе: варианты лугов и болот деградируют до обнажённой породы Гайи, восстанавливают записанные исходные варианты и обрастают деревьями своего биома. Специально созданные локации остаются защищены.
ei-terrain-planet-vulcanus=Включает экологию и сезонную продолжительность дня на Вулканусе с цепочками вулканического пепла, почвы и трещин. Лава защищена; независимые эффекты фумарол сохраняются.
ei-terrain-planet-gleba=Включает экологию и сезонную продолжительность дня на Глебе с ландшафтом разных биомов и местными дикими деревьями. Споры не наносят урон от токсичного загрязнения; культурные растения, почвы для их выращивания и бассейны чанов аурической инокуляции остаются защищены.
ei-terrain-planet-fulgora=Включает экологические изменения ландшафта Фульгоры: переходы между породой, песком, пылью и дюнами. Нефтяные океаны остаются защищены. Сезонное освещение никогда не управляет Фульгорой; её независимый контроллер суток сохраняет приоритет.
ei-terrain-planet-aquilo=Включает экологию и сезонную продолжительность дня на Аквило через разрешённое уплотнение снега и переходы ледяных плиток. Аммиачные океаны, фундаменты и инфраструктура остаются защищены.
ei-terrain-pollution-high=Верхний порог запускает отсчёт загрязнённого состояния, нижний — чистого и должен быть меньше верхнего. Используется местное загрязнение игры без его непосредственного изменения.
ei-terrain-pollution-low=Верхний порог запускает отсчёт загрязнённого состояния, нижний — чистого и должен быть меньше верхнего. Используется местное загрязнение игры без его непосредственного изменения.
ei-terrain-mining-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-wildfire-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-flood-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-drought-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-cliff-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-blood-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-paving-probability=Вероятность при одной допустимой попытке: от 0 (никогда) до 1 (всегда). Соответствующая функция должна быть включена. Защитные проверки сохраняются.
ei-terrain-axial-tilt=Условный наклон оси для расчёта сезонной разницы в продолжительности дня; по умолчанию 23,5 градуса. Большие значения обычно усиливают сезонные различия. Полный дневной свет и полная ночь длятся не менее 2% суток каждый; Фульгора исключена.
ei-terrain-latitude=Условная широта для сезонной продолжительности дня; по умолчанию 45 градусов. Чем больше модуль широты, тем сильнее сезонные различия; знак меняет лето и зиму местами. Не перемещает игроков и не меняет вращение планеты.
ei-terrain-season-strength=Сила сезонного изменения скорости экологических процессов. Действует только при включённых сезонных изменениях экосистемы.
ei-terrain-dirty-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-clean-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-soil-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-recovery-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-mining-radius=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-mining-patch-radius=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-tree-growth-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-tree-density-limit=Максимальное число деревьев в заданной окрестности, после которого естественное возобновление приостанавливается.
ei-terrain-tree-neighborhood=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-tree-stress-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-tree-aging-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-tree-rot-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-hazard-seconds=Задержка или интервал в секундах симуляции. По-прежнему необходимы подходящие условия и свободный бюджет обработки.
ei-terrain-wildfire-radius=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-hazard-radius=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-calendar-days=Длина опорного года в сутках Наувиса с зафиксированной длительностью; по умолчанию 360. Длина года каждой планеты масштабируется по её расстоянию на загруженной звёздной карте. Изменение сохраняет текущую фазу сезона и никогда не меняет вращение планет.
ei-terrain-protection-buffer=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-max-depth=Максимальное число ступеней деградации относительно записанного исходного ландшафта.
ei-terrain-seed-distance=Расстояние или радиус в клетках. Защитные проверки могут отклонить место, подходящее по остальным условиям.
ei-terrain-interval=Пользовательский профиль: число тиков между возможностями общей обработки. Большие значения снижают частоту обработки и замедляют охват; отложенная работа никогда не вызывает всплеска обработки накопившихся задач.
ei-terrain-search-interval=Пользовательский профиль: минимальное число тиков между выделением квот поиска объектов, общих для всех поверхностей. Настраивается отдельно от интервала обработки. Меньшие значения позволяют выполнять больше поисков и могут повысить нагрузку на UPS. Неиспользованные квоты не накапливаются.
ei-terrain-cold-chunks=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-active-chunks=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-candidates=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-histories=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-writes=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-recovery-reserved=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-searches=Пользовательский профиль: максимум поисков объектов за проход, для которого истёк интервал поиска. Лимит общий для всех поверхностей; неиспользованные поиски не переносятся.
ei-terrain-result-limit=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-events=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-mining-queries=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-mining-candidates=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-admissions=Используется в пользовательском профиле обработки. Это конечный общий предел для всех поверхностей, а не отдельная квота каждой планеты. Увеличение значений может повысить нагрузку на процессор.
ei-terrain-active-cap=Максимальный объём сохраняемых экологических данных. Более высокие пределы требуют больше памяти. Ограничения обработки сохраняются.
ei-terrain-pending-cap=Максимальный объём сохраняемых экологических данных. Более высокие пределы требуют больше памяти. Ограничения обработки сохраняются.
ei-terrain-tile-history-cap=Максимальный объём сохраняемых экологических данных. Более высокие пределы требуют больше памяти. Ограничения обработки сохраняются.
ei-terrain-tree-history-cap=Максимальный объём сохраняемых экологических данных. Более высокие пределы требуют больше памяти. Ограничения обработки сохраняются.

