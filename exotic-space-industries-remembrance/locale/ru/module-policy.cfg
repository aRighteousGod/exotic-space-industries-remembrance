[mod-setting-name]
ei-beacon-quality-modules=Модули качества в маяках
ei-beacon-productivity-modules=Модули продуктивности в маяках
ei-quality-module-effects=Эффекты модулей качества

[mod-setting-description]
ei-beacon-quality-modules=Выбирает семейства маяков ESIR, в которые можно устанавливать модули с бонусом качества. Азотное охлаждение: __ENTITY__ei-copper-beacon__ и __ENTITY__ei-iron-beacon__. Инопланетные: __ENTITY__ei-alien-beacon__ и __ENTITY__ei-warp-beacon__. Требуется мод Quality.\nПри ужесточении ограничений установленные модули, которые стали запрещены, возвращаются на землю рядом с маяком.
ei-beacon-productivity-modules=Выбирает семейства маяков ESIR, в которые можно устанавливать модули с бонусом продуктивности. Азотное охлаждение: __ENTITY__ei-copper-beacon__ и __ENTITY__ei-iron-beacon__. Инопланетные: __ENTITY__ei-alien-beacon__ и __ENTITY__ei-warp-beacon__. Действует и при отключённом моде Quality.\nПри ужесточении ограничений установленные модули, которые стали запрещены, возвращаются на землю рядом с маяком.
ei-quality-module-effects=ESIR применяет собственные бонусы и штрафы модулей качества. Режим, близкий к базовой игре, не применяет изменения их эффектов от ESIR. Оба режима сохраняют рецепты и порядок исследований ESIR. Не действует при отключённом моде Quality.

[string-mod-setting]
ei-beacon-quality-modules-neither=Ни одно семейство
ei-beacon-quality-modules-nitrogen=Только маяки с азотным охлаждением
ei-beacon-quality-modules-alien=Только инопланетные и варп-маяки
ei-beacon-quality-modules-both=Оба семейства (по умолчанию)
ei-beacon-productivity-modules-neither=Ни одно семейство
ei-beacon-productivity-modules-nitrogen=Только маяки с азотным охлаждением
ei-beacon-productivity-modules-alien=Только инопланетные и варп-маяки
ei-beacon-productivity-modules-both=Оба семейства (по умолчанию)
ei-quality-module-effects-esir=ESIR (по умолчанию)
ei-quality-module-effects-vanilla=Как в базовой игре

