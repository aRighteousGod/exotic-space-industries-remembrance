[mod-setting-name]
ei-alert-icon-set=Набор значков оповещений
ei-alert-icon-set-default=Набор значков оповещений по умолчанию

[mod-setting-description]
ei-alert-icon-set=Выберите значки для своих оповещений ESIR и настроек экологии. «Применить настройку запуска» копирует текущий выбор при запуске в личную настройку. Сохранённый личный выбор не меняется при изменении настройки запуска.
ei-alert-icon-set-default=Начальный набор значков для игроков без сохранённого личного выбора. Существующий личный выбор сохраняется. По умолчанию: Объёмные объекты.

[string-mod-setting]
ei-alert-icon-set-vanilla=Оповещения в стиле Factorio
ei-alert-icon-set-default-vanilla=Оповещения в стиле Factorio
ei-alert-icon-set-startup-default=Применить настройку запуска
ei-alert-icon-set-original=Исходные значки
ei-alert-icon-set-svg=Литые металлические сигилы
ei-alert-icon-set-rendered=Объёмные объекты
ei-alert-icon-set-default-original=Исходные значки
ei-alert-icon-set-default-svg=Литые металлические сигилы
ei-alert-icon-set-default-rendered=Объёмные объекты
