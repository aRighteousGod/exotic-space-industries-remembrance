menu_auric_inoculation_vat=Чаны аурической инокуляции
title_auric_inoculation_vat=Чаны аурической инокуляции
auric-inoculation-vat=Чаны аурической инокуляции
auric-inoculation-vat-text=Глебский [entity=ei-auric-inoculation-vat] не цепляется напрямую за уже существующие [entity=ei-auric-cyst-node]. Он закрепляет вокруг себя непрерывный болотный бассейн и переводит это живое тело болота в пакетный процесс, который позже выводит новые узлы.\n\n[font=default-bold]Размещение и закрепление бассейна:[/font] Этот чан предназначен для Глебы. Ставьте его там, где поле закрепления действительно достает до достаточного числа болотных плиток. Пригодный бассейн требует 24-160 связанных болотных плиток; более крупный непрерывный участок нужно отсечь или разделить, и он не делится с другим чаном. Перекрывающиеся отпечатки создают конфликты, а чан без пригодного бассейна просто не имеет стабильной среды для инокуляции.
auric-inoculation-vat-2=Входы цикла и масштабирование по поясам
auric-inoculation-vat-text-2=Чан идет по последовательности [font=default-bold]засев -> затопление -> ферментация (при желании обогащенная биофлюксом) -> слив -> цветение -> покой[/font], а не работает как пассивный дренаж болота. Засев потребляет [item=spoilage] и [fluid=ei-bio-oil], затопление потребляет [fluid=ei-dirty-water], а ферментация потребляет [item=jelly] и [item=yumako-mash]. Во время окна обогащения подача [item=bioflux] переключает этот этап на обогащенную ферментацию перед сливом и цветением.\n\nРазмер бассейна определяет текущий пояс. b1 охватывает 24-39 закрепленных плиток, b2 - 40-55, b3 - 56-71, b4 - 72-87, b5 - 88-103, b6 - 104-127, а b7 - 128-160. Эти же пояса ограничивают живые узлы кист в бассейне значениями 3, 4, 6, 8, 10, 12 и 14. Высокие пояса выдерживают больший урожай цветения, но требуют и более надежной подачи реагентов, и более тяжелой водной обвязки.
auric-inoculation-vat-3=Вигор, загрязнение и срыв цветения
auric-inoculation-vat-text-3=Каждый цикл уравновешивает [font=default-bold]вигор[/font] и [font=default-bold]загрязнение[/font]. Здоровые бассейны, накормленные фазы и разумное давление по поясам удерживают вигор впереди. Голодание, заблокированные сливы, конфликты закрепления и изношенные болотные плитки поднимают загрязнение и толкают чан в напряженное состояние.\n\nКогда загрязнение доходит до порогов срыва, устойчивость цветения рушится. Чан начинает деградировать плитки бассейна в более мертвые состояния болот и откатывается к покою вместо того, чтобы удерживать чистое цветение. Если консоль постоянно соскальзывает из стабильного в напряженное, ужмите отпечаток бассейна или лучше кормите цикл, пока болото не умерло под машиной.
auric-inoculation-vat-4=Промывка кист, возврат грязной воды и телеметрия
auric-inoculation-vat-text-4=Здоровый чан позже выводит новые [entity=ei-auric-cyst-node]. Добудьте из них [item=ei-auric-cyst], затем запустите [recipe=ei-auric-cyst-washing], чтобы разобрать кисты на полезный выход и одновременно вернуть часть [fluid=ei-dirty-water] в более широкий водный контур Глебы. Собственная фаза слива чана выводит [fluid=ei-dirty-water], а иногда и [fluid=ei-acidic-water]; эти выходы должны освободиться до начала следующей фазы. Забитый слив удерживает чан на месте и поднимает загрязнение, пока трубам не дадут снова дышать.\n\nСхемная телеметрия делает болото читаемым. Чан может выдавать [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims] и [virtual-signal=ei-auric-vat-bloom]. Используйте их, чтобы сравнивать отпечатки бассейнов, поднимать тревогу по конфликтам или состояниям срыва и решать, когда линия промывки и сливная обвязка должны вырасти вместе со следующим болотным поясом.
