menu_neutron_collector=Нейтронный коллектор
title_neutron_collector=Нейтронный коллектор
neutron-collector=Нейтронный коллектор
neutron-collector-text=[color=orange]Нейтронный коллектор[/color] [item=ei-neutron-collector] — это зарядная машина квантовой эпохи. Она ловит свободные нейтроны от ближайших источников деления, из слабой утечки активных реакторов синтеза на плотной плазме Космической эры на Аквило и от более сильных, настраиваемых термоядерных реакторов ESIR. Она использует этот поток, чтобы превращать [item=ei-neutron-container] в [item=ei-charged-neutron-container].\n\nОн не создаёт нейтроны. Он собирает то, что соседние реакторы не сумели удержать. Коллектор привязывается только к одному источнику за раз и выбирает самый сильный активный источник в радиусе вместо усреднения всех машин вокруг.
neutron-collector-2=Привязка, дистанция и ожидание
neutron-collector-text-2=Эффективность коллектора зависит от типа источника, его активности и геометрии. Реакторы на плотной плазме Космической эры на Аквило дают только слабую утечку и только пока активны; термоядерные реакторы ESIR остаются более сильными источниками, настраиваемыми температурой и впрыском. Сообщаемая эффективность ограничена диапазоном 0-300%, а чем больше дистанция, тем дольше зарядка.\n\nЕсли поблизости нет подходящего источника, поток ниже порога зарядки, привязанный источник засыпает, выход заблокирован или условие схемы отключает сборщик, коллектор откатывается на рецепт ожидания, чтобы машину всё ещё можно было открыть, а диагностика не исчезала.
neutron-collector-3=Сигнальная телеметрия
neutron-collector-text-3=Когда коллектор подключён к сети, его скрытый интерфейс публикует в сеть коллектора пять собственных сигналов: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] и [virtual-signal=ei-neutron-scan-agent].\n\nЭффективность передаётся в диапазоне 0-300. Дистанция выдаётся в десятых долях тайла. Агент коллектора: 1 активен, 2 простаивает, 3 заблокирован. Агент источника: 1 активен, 2 спит, 3 отсутствует. Агент сканирования: 1 стабилен, 2 требует пересчёта, 3 ждёт перепривязки. Эти сигналы обновляются в плановом проходе телеметрии коллектора, а не на каждом тике.
