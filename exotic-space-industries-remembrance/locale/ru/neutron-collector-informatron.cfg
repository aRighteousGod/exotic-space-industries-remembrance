[exotic-industries-informatron]
menu_neutron_collector=Нейтронный коллектор
title_neutron_collector=Нейтронный коллектор
neutron-collector=Нейтронный коллектор
neutron-collector-text=[color=orange]Нейтронный коллектор[/color] [item=ei-neutron-collector] — это зарядная машина квантовой эпохи. Она ловит свободные нейтроны, утекающие из ближайшей инфраструктуры деления и синтеза, и использует этот поток, чтобы превращать [item=ei-neutron-container] в [item=ei-charged-neutron-container].\n\nОн не создаёт нейтроны. Он собирает то, что соседние реакторы не сумели удержать. Коллектор привязывается только к одному источнику за раз и выбирает самый сильный живой выход в радиусе вместо усреднения всех машин вокруг.
neutron-collector-2=Привязка, дистанция и ожидание
neutron-collector-text-2=Эффективность зависит от типа источника и геометрии. Сильные источники синтеза могут поднимать значение выше 100%, а слабые или удалённые эмиттеры могут опускать его ниже; сообщаемая эффективность ограничена диапазоном 0-300%. Чем больше дистанция, тем дольше зарядка.\n\nЕсли поблизости нет подходящего источника, поток слишком слаб, привязанный источник засыпает, выход заблокирован или условие схемы отключает сборщик, коллектор откатывается на рецепт ожидания, чтобы машину всё ещё можно было открыть, а диагностика не исчезала.
neutron-collector-3=Сигнальная телеметрия
neutron-collector-text-3=Когда коллектор подключён к сети, его скрытый интерфейс публикует в сеть коллектора пять собственных сигналов: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] и [virtual-signal=ei-neutron-scan-agent].\n\nЭффективность передаётся в диапазоне 0-300. Дистанция выдаётся в десятых долях тайла. Агент коллектора: 1 активен, 2 простаивает, 3 заблокирован. Агент источника: 1 активен, 2 спит, 3 отсутствует. Агент сканирования: 1 стабилен, 2 требует пересчёта, 3 ждёт перепривязки. Эти сигналы обновляются в плановом проходе телеметрии коллектора, а не на каждом тике.
