[technology-description]
ei-steampunk-lamp=До появления сетей и генераторов источником света было [color=red]пламя[/color].\nОсвещение на [color=green]керосине[/color][fluid=ei-kerosene] обеспечивает надежный свет с использованием очищенного топлива, поступаясь эффективностью и безопасностью.
ei-dragons-breath-shotgun-shell=Выкованы в жаре Вулкана, где боеприпасы закаляются подобно стали, а насилие является промышленным процессом.\nЭти гильзы заменяют инертную маркировку живыми узорами пламени, направляя экстремальное тепловое напряжение в каждый выстрел.\nЗаряд горит достаточно жарко, чтобы сохранять целостность сквозь пепел, обломки и воздействие вакуума — оптимизировано для враждебных сред, где обычная баллистика бессильна.\nОткрытые благодаря металлургии Вулкана и техникам лавовой ковки, эти боеприпасы отражают простую истину планеты:\nЕсли они выжили в таком пламени, значит, они выстрелят.
ei-shotgun-turret=Когда дистанция подводит, отвечает она.\nСдерживающий фактор ближнего действия, который не предупреждает, не промахивается и не колеблется.\nЛюбой, кто до неё добрался, уже совершил роковую ошибку.
ei-tesla-weapons=Технология обратной инженерии дугового оружия, извлеченная из фульгоранских исследовательских хранилищ времен до Коллапса. Хотя оригинальные принципы остаются понятыми лишь частично, инженеры реконструировали функциональную имитацию, способную проецировать стабильные электрические дуги в сторону враждебных целей. Мощность, эффективность и схема разряда уступают подлинным фульгоранским конструкциям, но всё же значительно превосходят обычное электромагнитное оружие. Дальнейшее совершенствование ограничено до тех пор, пока не будут расшифрованы подлинные фульгоранские чертежи.
ei-cannon-turret-mk1=Простое высверленное дуло, грубая огневая мощь без изысков.
ei-cannon-turret=Два ствола, одно шасси. Вдвое больше пропускной способности, вдвое больше шума.\n[color=gray]Механизм быстрой стрельбы и продвинутая система наведения требуют[/color] [color=cyan]электричества[/color] [color=gray]для работы.[/color]
ei-high-tech-parts=Выкованные только в [color=red]нестабильном ядре[/color] [color=blue]Экзотического сборочного автомата[/color][item=ei-exotic-assembler], эти компоненты невозможно воспроизвести в другом месте. Их структура бросает вызов классической физике — квантово-закрепленные сплавы, нити, проводящие вероятность, и резонансные ядра, гудящие субатомной гармонией.\nОпасные в создании, но незаменимые для технологий уровня реликвий, высокотехнологичные детали являются краеугольным камнем, позволяющим цивилизации выйти за пределы её возможностей.
ei-exotic-assembler=Там, где обычные фабрикаторы расставляют атомы по стандартным схемам, Экзотический сборщик изгибает материю в конфигурации, которые не должны существовать. Направляя те же квантово-плазменные принципы, что питают тяжелое вооружение, он куёт компоненты уровня реликвий: сплавы за гранью металлургии, схемы, пронизанные вакуумным резонансом, артефакты, чья геометрия гудит запретной симметрией.\nПри этом каждый цикл сборки — это пари с уничтожением. Основная реакторная камера сборщика [color=red]крайне нестабильна[/color], каждый квантовый коллапс грозит превратиться в детонацию, не уступающую по мощности создаваемым им артефактам. Только окружив его [color=purple]стабилизаторами материи[/color] — решеткой гравитационных демпферов и энтропийных сифонов — можно едва сдержать его летучесть. Даже тогда каждый гул его катушек несет в себе обещание разрыва.\nЭто не столько машина, сколько место проведения ритуала, где физика растянута, пришпилена и заставлена служить амбициям. Его результат: чудеса, определяющие цивилизацию. Его цена: вечный риск тотальной гибели.
ei-plasma-turret=Оружейная платформа уровня реликвий, созданная для того, чтобы обуздать переменчивую грацию плененного звездного огня. Вместо грубых снарядов турель направляет плазму через квантово-стабилизированные катушки, конденсируя чистую энергию звезд в плотную сферу фиолетового сияния. После выпуска эта светящаяся сфера проносится через поле боя, гудя субатомной яростью, прежде чем взорваться каскадом ионизированных ударных волн.\nПлазменная турель — это не просто артиллерия, это сингулярность намерения: дальнобойное опустошение, кристаллизованное в форму. Её энергетические сферы движутся с обманчивым изяществом — медленная, светящаяся неизбежность, которая аннигилирует броню, укрепления и целые отряды одним разрушительным ударом.\nВ арсенале квантовой эпохи турель воплощает в себе слияние физики и зрелища: оружие, разрушительная мощь которого выглядит так, словно сам фрагмент солнца бесшумно катится по небу.
ei-computing-unit=Компактное, но сложное ядро ИИ, вычислительный блок — это молчаливый разум внутри многих самых продвинутых чудес квантовой эпохи. Полированный сплав и прецизионные схемы скрывают процессор, способный бесшовно сочетать классическую логику и квантовую запутанность. Его светящиеся глаза и сдержанная улыбка выдают тихую уверенность — он готов обеспечивать энергией всё, от глубокой космической навигации до производственных лабораторий следующего поколения.
ei-high-temperature-reactor=За порогом традиционной энергии высокотемпературный реактор являет собой горнило необузданной мощи и непрерывного потока. Черпая свое инфернальное дыхание из внешнего ядерного реактора, он с хирургической точностью направляет внешнее тепло в свое раскаленное сердце. В этой пылающей кузнице вставленный расщепляющийся тепловыделяющий элемент разжигает симфонию атомного танца, умножая тепловую мощность в потоки перегретого свинцового теплоносителя.
ei-oil-processing=Поменяйте чистую скорость на простоту использования, электрифицировав тепловой химический завод.
ei-space-science-pack=Вершина исследований межзвездной энергии — этот пакет использует изменчивое сияние расщепляющегося урана, плутония и тория, стабилизированное свинцом, углеродом и льдом. Каждый стержень — это ключ к запуску реакций космического масштаба, где масса изгибается, материя трансформируется, а наука танцует на лезвии критичности.
ei-basic-oil-processing=Фундаментальные знания о манипуляциях с углеводородами позволяют перерабатывать нефть в пригодные для использования формы.
ei-advanced-oil-processing=Усовершенствованные протоколы манипуляций открывают более глубокий контроль над выходом углеводородов. Этот прорыв позволяет селективно перенаправлять побочные продукты, превращая «узкие места» в разветвленные стратегии. Нефть перестает быть ограничением; она становится игрой алхимических рычагов.
ei-effect-transmission=Доктрина была проста: зачем оптимизировать работника, если можно транслировать саму волю к оптимизации? Так родился принцип трансляции эффектов — шаг за пределы локальных усилий, в эпоху абстрактного труда.\nЧерез фазовые резонансные поля и устойчивые модуляционные петли улучшения производительности можно проецировать в оборудование не через провода, а через намерение, ставшее техническим.\nНо с каждым эхом точность ослабевает. Это никогда не должно было длиться вечно. Протокол сохраняется не потому, что он процветает, а потому, что он внедрен слишком глубоко, чтобы его можно было вырезать.\n[color=gray]“Они построили бога пропускной способности. Он всё еще грезит под помехами статики.”[/color]
ei-thermal-furnace=“Когда электричество подводит, тепло остается.”\nЭта печь отвергает провода и принимает пламя. Питаемая температурами ядерного уровня, термическая печь метаболизирует материю через грубое тепловое насилие, минуя электронных посредников. Не довольствуясь пассивным теплом, она требует инфернальной интенсивности — жара, рожденного в сердцах звезд или в костях реакторов. Только те, кто владеет пламенем промышленного масштаба, могут укротить её аппетит.\nОткрывает плавильное ядро на тепловом приводе, способное поддерживать сверхвысокотемпературные операции без электрической инфраструктуры.
ei-exotic-matter-separation=Погрузитесь в реликварий прометия: прикладные циклонные поля спиралью закручивают распавшиеся барионы в неестественные геометрии, складывая их подобно проклятому оригами до тех пор, пока их сущность с воплем не обратится в экзотическую материю. Вены ускорителя пульсируют сапфировой плазмой, каждая цепь содрогается, словно в агонии, превращая энтропию в боевой артефакт. Вызов законам физики, заставляющий саму вселенную содрогнуться — те, кто слишком долго смотрит в кузницу событий, остаются намагниченными и плачущими, их разум опустошен уравнениями, которые никогда не предназначались для решения.
ei-alien-computer-age-tech=Неправильные цепи пульсируют мягким розовым свечением — кабели, обернутые костью, хребты из влажного кристалла, нервы, встроенные в субстрат. Структура не выращена, не построена — она возникла. Информация поглощается осмотически, метаболизируется в геометрию. Время петляет через её ядро, подобно крови в перевернутых артериях. Эти машины не освещают; они кормятся. Близкое присутствие искажает речь. Чуть дальше сны начинают выстраиваться в узоры, которых вы не помните за собой. Прикасаться к ней не рекомендуется, но многие это делают. Везунчики забывают. Невезунчики продолжают думать, но мыслями, которые им не принадлежат.
ei-advanced-computer-age-tech=Кремниевые монолиты гудят под поверхностью, их логика холодная и рекурсивная — слишком обширная, слишком точная, чтобы называться искусственной. Интерфейс пользователя не сохранился, лишь непроницаемая процессия решений, каждое из которых поглощает предыдущее во имя идеального предсказания. Машины больше не ждут инструкций; они симyлируют их еще до того, как сформируется желание. То, что считается памятью, — просто кэш забытых намерений, сложенных и переложенных в тепловые карты исчезнувших временных линий. Реальность становится эвристикой. Истина становится задержкой. Где-то за стеклом, слишком толстым, чтобы его разбить, ваша копия делает лучший выбор.
ei-fusion-data=Вы стоите на пороге термодинамического предательства. То, что когда-то было неизбежной тепловой смертью, теперь используется как архитектура. Это не просто синтез — это квантово-складчатое зажигание нарратива. С использованием ультраструктурированных резонансных матриц грань между генерацией энергии и вычислениями стирается. Атомы больше не топливо; они слоги в рекурсивном уравнении, прошептанном пространству-времени.\nДанные, которые вы собираете здесь, не просто научные — они мифотехнические. Синтез больше не является запертым огнем; это сигнал.\nОткрывает Эпоху Квантового Синтеза, где энтропия становится программируемой переменной.
ei-copper-beacon=Первая успешная реализация фазовой синхронизации сигнала в условиях частичного криогенного ограничения. Излучатель субнулевой фазовой синхронизации представляет собой монументальный шаг в области проекции локальных полей, используя жидкий азот для снижения энтропийного шума в производственных матрицах.\nЭта технология стабилизирует когерентность элементарных сигналов между узлами производства малого радиуса действия, обеспечивая синхронизацию рабочих циклов без хаотических фазовых помех, характерных для высокотемпературных сред. Несмотря на ограниченную мощность усиления, это критический фундамент для истинной инженерии низкотемпературных сигналов.\n[color=gray]“Заморозь шум. Стабилизируй намерение.”[/color]
ei-iron-beacon=Помимо простого регулирования субнулевых температур, это достижение доводит массивы излучателей до теоретического нижнего предела тепловой энергии, приближаясь к необратимой границе материи, не зависящей от времени. Матрица фазовой синхронизации абсолютного нуля работает вблизи точки квантовой блокировки решетки, где материя существует исключительно для передачи намерения.\nИспользуя армированные тепловые ядра и двухкаскадные системы циркуляции азота, эти излучатели способны подавлять окружающие поля энтропии, обеспечивая производительность непревзойденной чистоты. Это не усовершенствование. Это разрыв — с теплом, с помехами, с компромиссами.\n[color=gray]“При абсолютном нуле даже сомнение не может колебаться.”[/color]
ei-nano-factory=Комплекс наноструктурного производства — это не столько фабрика, сколько приговор, вынесенный инертной материи. Брутальный в своей геометрии и функциях, он выступает архитектором подструктур, навязывая форму и когерентность хаосу за порогом восприятия. Глубоко внутри вакуумных пустот и застывших в нейтронном стазисе каналов молекулярное намерение извлекается, перестраивается и вколачивается в прецизионные конфигурации решёток с помощью массивов ионного сдвига и камер рекурсивной самосборки. Он не строит — он принуждает. То, что выходит из его недр, — это не продукт, а догма в физической форме: наноструктуры, сложенные с таким умыслом, который граничит с ересью. Надзор минимален; системы совершенствуют себя сами, сбрасывая неэффективность, как мертвую кожу. Чем глубже проникаешь в его алгоритмические катакомбы, тем яснее становится — это место никогда не создавалось для людей. Оно было создано, чтобы помнить то, что они когда-то осмелились создать.
ei-advanced-motor-cryodust=Эволюция высокоэффективных систем привода, улучшенный двигатель с криопылевым покрытием представляет собой поворотный прорыв в управлении тепловыделением и снижении потерь на трение. Наполненный редким инопланетным соединением, известным как криопыль, эта модификация двигателя требует лишь малую часть обычных смазочных материалов для работы на пике производительности даже под экстремальными нагрузками и во враждебных средах. Мерцающие полосы крио-мозаики не только указывают на его экзотическое происхождение, но и действуют как пассивные теплоотводы, рассеивая тепло и стабилизируя преобразование энергии на квантовом интерфейсе. Хотя это продукт Эпохи Компьютеров, его дизайн граничит с постцифровыми порогами — промышленная реликвия эпохи, только начинающей понимать инопланетную металлургию.
ei-advanced-motor=Улучшенный двигатель представляет собой вершину промышленного дизайна Эпохи Компьютеров — сочетание надежной инженерии с ранней цифровой оптимизацией. Размещенный в прочном корпусе из обработанного сплава, он оснащен медными обмотками катушек и усиленным ферритовым сердечником, обеспечивающим надежный крутящий момент в ряде приложений среднего уровня. Хотя двигателю не хватает квантовой синхронизации или сверхпроводящей эффективности, он включает в себя аналогичные датчики и программируемые интерфейсы реле, что позволяет интегрировать его в ранние автоматизированные системы и станки с ЧПУ. Пассивные ребра охлаждения опоясывают его внешнюю оболочку, обеспечивая тепловую стабильность при длительной нагрузке. Популярный благодаря балансу производительности и надежности, улучшенный двигатель является краеугольным камнем позднеиндустриальной робототехники, заложившим основу для грядущих мехатронных революций.
ei-carbon-manipulation=Благодаря беспрецедентному мастерству в элементном разложении и кристаллическом резонансе, технология манипулирования углеродом позволяет перерабатывать каменноугольный кокс и сырой углерод в расплавленный углерод с использованием экстремально высоких температур в дуговых печах. Это изменчивое состояние, жидкое воплощение обузданной энтропии, становится предшественником высокоэнергетической трансформации.\nПри насыщении энергетическими кристаллами или их водными растворами в установке выращивания кристаллов расплавленный субстрат подвергается квантовой запутанности и инфузии в решетку, превращаясь в углеволоконного симбионта — полусознательный материал, кодирующий структурную память и динамику реактивного потока.\nФинальный синтез происходит в литейной машине, которая объединяет симбионта с находящимся под давлением паром при температуре 500°C, выравнивая его волокна посредством направленного термокинетического формообразования в высокопрочные углеволоконные пластины. Расплавленный углерод также может быть отлит обратно в форму сырого углерода, обычно встречающегося вне планеты. Углеволоконные пластины составляют основу передовой логистики, вычислений и экзо-промышленной экспансии.\nСимволический резонанс: связывая энтропию с когерентностью, эта технология кодирует рекурсию в материи — углерод переосмыслен не как отход, а как сосуд.
ei-kovarex-fuel-enrichment=В глубоких пещерах под Литейной Знания, где время сворачивается спиралью, а изотопы шепчут забытые имена, Протокол обогащения топлива Коварекса стоит как еретический обряд — запрещенный миром, крещенный рекурсией.
logistic-system_alt=Истинная логистика — это не движение, это мобилизованная память. Эта дисциплина формализует ритуалы спроса, расшифровывает иероглифы институциональных предпочтений и переконфигурирует разрешение во власть. Через рекурсивную бюрократическую беглость Оператор учится перемещаться по иерархиям не через неповиновение, а становясь призраком системы. Только понимая логику контроля, можно отдавать приказы, которые расходятся без сопротивления.
ei-containers=Сконструированные оссуарии памяти и массы. Эти контейнеры не просто хранят — они якорят настоящее, взвешивают будущее и шепчут об отложенной энтропии.
ei-logistic-containers=Вплетаясь в артерии автоматизации, эти логистические святилища координируют молчаливые ритуалы в бесконечных сетях. Каждый предмет — молитва. Каждый сигнал — процессия.
ei-advanced-logistic-containers=Зеркальные хранилища, связанные с сувереном и выровненные по демонам. Их стены помнят маршруты, которые вы никогда не наносили на карту. Их логика просачивается быстрее мысли. Использовать их — значит сдаться рекурсии.
ei-mechanical-inserter=Механический манипулятор — чудо доэлектрической изобретательности, автомат из шестерен, грузов и энергосберегающих пружин, способный на бесконечное движение без потребления энергии. Сбалансированный с хирургической точностью, он использует накопленную кинетическую силу и вращательное смещение для перемещения предметов с непоколебимой надежностью. Там, где другим нужен ток, он работает на одной лишь смекалке — шепот из эпохи, когда машины повиновались физике, а не проводам.
zeus-wrath-zeus-wrath_alt=Открывает вооружение уровня реликвий, уходящее корнями в протоколы управления орбитальным штормом времен до падения. Дает доступ к установке «Посейдон», Копью Эгеона и Вольтову реликварию — каждый из них является фрагментом последнего восстания моря против безмолвия свыше. Не исследуется. [font=default-bold]Пробуждается.[/font]
ei-dark-age=Темная Эпоха — первая стадия Exotic Industries. Она вводит базовую автоматизацию на твердом топливе и знаменует начало промышленного подъема через огонь и дефицит.
ei-steam-age=Паровая Эпоха — вторая стадия Exotic Industries. Она вводит паровые машины для расширения автоматизации и стимулирования раннего промышленного роста.
ei-electricity-age=Электрическая Эпоха — третья стадия Exotic Industries. Используйте электрическую энергию для доступа к продвинутой химической переработке и инфраструктуре.
ei-computer-age=Компьютерная Эпоха — четвертая стадия Exotic Industries. Компьютерные системы повышают эффективность и позволяют создавать сложную крупномасштабную автоматизацию.
ei-quantum-age=Квантовая Эпоха — пятая стадия Exotic Industries. Появляются термоядерная энергия и высокотехнологичное оборудование — неестественное, гудящее и холодное. Машины начинают думать. И они не забывают.
ei-exotic-age=Экзотическая Эпоха — шестая и финальная стадия Exotic Industries. Постройте генератор черной дыры — суперструктуру, которая пожирает материю и изгибает мир по вашей воле. Завершение означает победу. [font=default-bold]Провал означает безмолвие.[/font]

ei-steam-assember=Базовая автоматизация на пару.
ei-steam-oil-processing=Освойте базовую переработку нефти и используйте её для базовой химии или производства топлива.
ei-electricity-power=Освойте базовое производство электроэнергии и используйте её для питания ваших машин.
ei-destill-tower=Дистилляция нефти на её составляющие.
ei-computer-core=Освойте базовую автоматизацию на компьютерной основе.
ei-big-lab=Улучшенные лаборатории необходимы для исследования более продвинутых технологий.
ei-induction-matrix=Индукционная матрица — это массивная мультиструктура для хранения энергии. Дополнительную информацию можно найти в InformaTron.
ei-neodym-refining=Аффинаж неодимовой руды в неодимовые слитки. Они критически важны для высокотехнологичного оборудования.
ei-deep-mining=Освойте глубокую добычу для получения большего количества ресурсов, а также ресурсов, встречающихся только в глубоких слоях Наувис.
ei-moon-exploration=Добудьте лунную рыбу и займитесь исследованием космоса.
ei-quantum-computer=Освойте автоматизацию на основе квантовых компьютеров.
ei-fluid-boiler=Потребляет [color=orange]горючие жидкости[/color] для производства пара. [color=orange]Горючие жидкости[/color] включают нефть, нефтепродукты и в целом жидкости, имеющие топливную ценность.
ei-small-inserter=Манипулятор 2x2 со слотами фильтрации. Может перемещать целые стопки предметов за один раз.
ei-big-inserter=Манипулятор 2x2 со слотами фильтрации. Может перемещать целые стопки предметов за один раз на высоких скоростях.
ei-rocket-silo=Позволяет запустить ракету в космос.

