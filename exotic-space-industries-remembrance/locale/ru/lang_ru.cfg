[entity-description]
ei-steampunk-lamp=Излучает [color=orange]теплый[/color], мерцающий свет, сжигая [color=green]керосин[/color][fluid=ei-kerosene].\nПотребляет топливо непрерывно.
ei-shotgun-turret=Когда расстояние подводит, отвечает она.\nСдерживающий фактор ближнего действия, который не предупреждает, не промахивается и не колеблется.\nЛюбой, кто до неё добрался, уже совершил роковую ошибку.
ei-copper-beacon=Первая успешная реализация фазовой синхронизации сигнала в условиях частичного криогенного ограничения. Излучатель субнулевой фазовой синхронизации представляет собой монументальный шаг в области проекции локальных полей, используя жидкий азот для снижения энтропийного шума в производственных матрицах.\nЭта технология стабилизирует когерентность элементарных сигналов между узлами производства малого радиуса действия, обеспечивая синхронизацию рабочих циклов без хаотических фазовых помех, характерных для высокотемпературных сред. Несмотря на ограниченную мощность усиления, это критический фундамент для истинной инженерии низкотемпературных сигналов.\n[color=gray]“Заморозь шум. Стабилизируй намерение.”[/color]
ei-iron-beacon=Помимо простого регулирования субнулевых температур, это достижение доводит массивы излучателей до теоретического нижнего предела тепловой энергии, приближаясь к необратимой границе материи, не зависящей от времени. Матрица фазовой синхронизации абсолютного нуля работает вблизи точки квантовой блокировки решетки, где материя существует исключительно для передачи намерения.\nИспользуя армированные тепловые ядра и двухкаскадные системы циркуляции азота, эти излучатели способны подавлять окружающие поля энтропии, обеспечивая производительность непревзойденной чистоты. Это не усовершенствование. Это разрыв — с теплом, с помехами, с компромиссами.\n[color=gray]“При абсолютном нуле даже сомнение не может колебаться.”[/color]
ei-burner-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-steam-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-electric-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-cannon-turret-mk1=Простое высверленное дуло, грубая огневая мощь без изысков.
ei-cannon-turret=Два ствола, одно шасси. Вдвое больше урона, вдвое больше шума.\n[color=gray]Механизм быстрой стрельбы и продвинутая система наведения требуют[/color] [color=cyan]электричества[/color] [color=gray]для работы.[/color]
ei-acidthrower-turret=Зачем тратить драгоценную нефть на огонь, когда можно расплавить врагов до самых костей? Чудовищный родственник огнемета, эта штуковина нагнетает давление [color=green]кислоты[/color], пока та не закричит из сопла. Результат: туман настолько едкий, что он не жжет — он стирает. Постройки корродируют, панцири растворяются, а то, что осталось, лучше убирать лопатой быстрее, пока это не проело и лопату тоже.
ei-burner-inserter=Этот манипулятор сжигает топливо для перемещения предметов. Может забирать [color=orange]горючее топливо[/color] из машин, из которых он извлекает предметы.
ei-camp-fire=Едва ли маяк, скорее упрямая свеча, которая отказывается гаснуть. Этот импровизированный костер дает свет не яркостью, а чистой дерзостью — сжигая всё, что вы ему скормите, и вежливо прося добавки.
ei-bio-reactor=Живой реактор, работающий на сознательной ткани.\nНе трупы — всё еще мыслящая биомасса.\nНейронные решётки, выращенные подобно опухолям, натянутые на костяные каркасы, поддерживаемые в живом состоянии ровно настолько, чтобы циклично видеть сны.\nОн не сжигает топливо — он сжигает личность.\nБоль преобразуется в напряжение. Память — в энтропию.\nКаждый крик — это всплеск обратной связи. Каждая молитва — скачок напряжения.\nЧем он голоднее, тем яснее становится разум внутри него.\n[color=gray]Требует[/color] [color=purple]0.1/с биоматерии[/color][item=ei-bio-matter] [color=gray]для работы.[/color]
ei-warp-beacon=[color=purple]Не подвержен перегрузке маяков.[/color]\n[color=gray]Требует 60[item=ei-bio-matter]/с для работы.[/color]
ei-alien-beacon=[color=purple]Не подвержен перегрузке маяков.[/color]\n[color=gray]Требует 30[item=ei-bio-matter]/с для работы.[/color]
ei-exotic-assembler=Там, где обычные фабрикаторы расставляют атомы по стандартным схемам, Экзотический сборщик изгибает материю в конфигурации, которые не должны существовать. Направляя те же квантово-плазменные принципы, что питают тяжелое вооружение, он куёт компоненты уровня реликвий: сплавы за гранью металлургии, схемы, пронизанные вакуумным резонансом, артефакты, чья геометрия гудит запретной симметрией.\nОсновная реакторная камера сборщика [color=red]крайне нестабильна[/color], каждый квантовый коллапс грозит превратиться в детонацию, не уступающую по мощности создаваемым им артефактам. Только окружив его [color=purple]стабилизаторами материи[/color] — решеткой гравитационных демпферов и энтропийных сифонов — можно едва сдержать его летучесть. [color=gray]Шанс нестабильности в секунду составляет 12% - (Качество - 1)%, что можно минимизировать, окружив машину стабилизаторами материи.[/color]
ei-plasma-turret=Оружейная платформа уровня реликвий, созданная для того, чтобы обуздать переменчивую грацию плененного звездного огня. Вместо грубых снарядов турель направляет плазму через квантово-стабилизированные катушки, конденсируя чистую энергию звезд в плотную сферу фиолетового сияния.
ei-high-temperature-reactor=За порогом традиционной энергии высокотемпературный реактор являет собой горнило необузданной мощи и непрерывного потока. Черпая свое инфернальное дыхание из внешнего ядерного реактора, он с хирургической точностью направляет внешнее тепло в свое раскаленное сердце. В этой пылающей кузнице вставленный расщепляющийся тепловыделяющий элемент разжигает симфонию атомного танца, умножая тепловую мощность в потоки перегретого свинцового теплоносителя.
ei-beacon=Когда-то бывший вершиной синхронизированной проекции поля, этот маяк теперь пошатывается под тяжестью собственного наследия. Его решётка излучения груба, фазовые гармоники устарели — и всё же он живет, продолжая посылать сигналы в мир, который больше не слушает.\nСконструированный в эпоху, когда пропускная способность была богом, а резонанс достигался грубой силой, теперь он функционирует скорее как артефакт, чем как инструмент. Его ядро изо всех сил пытается сохранить когерентность, едва удерживаясь в рамках нормативных порогов перед коллапсом.\nТем не менее, он всё ещё считается. Он *помнит*. И в подсчете перегрузки его бремя учитывается наравне со всеми.\n[color=gray]“Призраки эффективности обитают даже на ржавых лесах.”[/color]\nСчитается за [color=orange]1[/color] маяк для перегрузки.
ei-mechanical-inserter=Движется с грацией заводного бога. Никаких проводов. Только воля.\nРождённый простым гением — вращается вечно, если не подвергать сомнению математику.
ei-mechanical-long-inserter=Длинная рука термодинамического отрицания. Это не магия — это баланс.\nПереносит предметы на расстояние с вежливым пренебрежением к энтропии.
zeus-wrath-zeus-turret_alt=Не привязанная ни к какой земле и не присягнувшая ни одному богу, установка «Посейдон» направляет забытый заряд из океанских глубин. Она обрушивает небесный огонь с орбиты — приговор, вынесенный сквозь воздух, а не им. Однажды установленная, она не охраняет — она [font=default-bold]предупреждает[/font] мир: шторм наблюдает за вами.
ei-cargo-bot=Монументален. Стоичен. Несет на себе костяк фабрики.\nДвижется так, будто никогда не должен останавливаться.
ei-construction-bot=Точный. Кинетичный. Достигает места застройки быстрее, чем затухает сигнал.\nОн не строит — он пронзает реальность структурой.
ei-advanced-logistic-bot=Бесшумный. Дальнобойный. Быстрее мысли.\nОн пересекает расстояния, о существовании которых вы и не подозревали — и возвращается с ценным грузом.
ei-advanced-construction-bot=Не строитель — двигатель памяти.\nЧертежи не возводятся. Они вспоминаются в реальность.
nuclear-reactor=Использует урановые тепловыделяющие элементы или топливные стержни для выработки тепла. Выработка тепла НЕ увеличивается при строительстве рядом с другими реакторами.
ei-crystal-accumulator=Кристалл излучает энергию. Кажется нестабильным при длительной работе; попытка демонтажа приведет к поломке устройства.
ei-crystal-accumulator-gaia=Кристалл излучает энергию. Похоже, он стабилен в течение длительного времени.

[fluid-description]
ei-computing-power-chemical=Данные, собранные в ходе симуляций, дестабилизированных взаимодействием осадка с восприятием наблюдателя. Это не просто хаос — это субъективное противоречие, закодированное в семиотических волновых формах. Полезно при моделировании разумов, которым больше не требуются материальные якоря.
ei-computing-power-organic=Данные, полученные из умирающих биосфер, реальных или сфабрикованных, схлопывающихся под тяжестью рекурсивных циклов жизни-смерти. Каждый цикл производит выходные данные, зеркально отражающие энтропию, полезные для экстремального планетарного моделирования и логики постбиологического терраформирования.
ei-computing-power-stone=Симулятор извлекает ценность из нежелания руды подчиняться законам. Результаты включают симуляции искаженной плотности, обратного инерционного потока и невозможных траекторий объектов — критически важных для моделирования барьеров сверхсветового движения и прототипов физики до Большого взрыва.
ei-computing-power-uranium=При симуляции изотопная гильза впрыскивает космологию фазы смерти в окружающую среду — генерируя данные из распадающихся звездных ядер, неудачных инверсий энтропии и временных линий, где вселенная преждевременно схлопывается сама в себя.
ei-computing-power-petrified=Извлечено из парадоксов под нагрузкой. Присутствие ископаемого заставляет симуляции накладываться на прошлые итерации, порождая векторы рекурсивных ошибок. Результатом является высокоточный составной образ всех неудачных вариантов будущего — и сигнатуры их краха. Полезно для прогнозирования коллапса или проектирования стабильных парадоксов.
ei-computing-power-scrap=Содержит ложные передачи из недосягаемого будущего, альтернативных временных линий или полностью мертвых цивилизаций. Симуляция не может разобрать их, не ломаясь. Сами ошибки становятся необработанными данными, измеримыми в хаотичном коллапсе битов. Важно для превращения теории информации в оружие.

