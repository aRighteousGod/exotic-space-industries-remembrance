[item-description]
ei-steampunk-lamp=Простой осветительный прибор, работающий на [color=green]керосине[/color][fluid=ei-kerosene].\nОбеспечивает [color=orange]теплый[/color], мерцающий свет без электроэнергии ценой постоянного потребления топлива.
ei-dragons-breath-shotgun-shell=Выковано в жаре Вулкана, где боеприпасы закаляются подобно стали, а насилие является промышленным процессом.\nЭти гильзы заменяют инертную маркировку живыми узорами пламени, направляя экстремальное тепловое напряжение в каждый выстрел.\nЗаряд горит достаточно жарко, чтобы сохранять целостность сквозь пепел, обломки и воздействие вакуума — оптимизировано для враждебных сред, где обычная баллистика бессильна.\nОткрытые благодаря металлургии Вулкана и техникам лавовой ковки, эти боеприпасы отражают простую истину планеты:\nЕсли оно выжило в жаре, значит, оно должно выстрелить.
ei-shotgun-turret=Когда дистанция подводит, отвечает она.\nСдерживающий фактор ближнего действия, который не предупреждает, не промахивается и не колеблется.\nЛюбой, кто до неё добрался, уже совершил роковую ошибку.
ei-tesla-turret=Реконструированная имитация фульгоранского дугового оружия времен до Коллапса. Хотя лежащая в основе геометрия сверхпроводящих катушек понята лишь частично, эта башня-реплика может направлять контролируемые электрические разряды в сторону ближайших угроз. Мощность и эффективность остаются ограниченными по сравнению с подлинными фульгоранскими конструкциями, но турель обеспечивает надежное подавление площади и высокий импульсный потенциал благодаря использованию современных материалов.
ei-tough-wall=Гибрид керамики и бетона, усиленный стальными балками. Тяжелая, тупая и беспощадная — она выживает за счет одной лишь плотности.
ei-plated-wall=Железобетон со свинцовыми добавками, покрытый слоями синтетических полимеров. Прочнее, плотнее и менее хрупкая, чем её предшественники — настоящий бастион, спроектированный против самой энтропии.
ei-cannon-turret-mk1=Простое высверленное дуло, грубая огневая мощь без изысков.
ei-cannon-turret=Два ствола, одно шасси. Вдвое больше пропускной способности, вдвое больше шума.\n[color=gray]Механизм быстрой стрельбы и продвинутая система наведения требуют[/color] [color=cyan]электричества[/color] [color=gray]для работы.[/color]
ei-acidthrower-turret=Зачем тратить драгоценную нефть на огонь, когда можно расплавить врагов до самых костей? Чудовищный родственник огнемета, эта штуковина нагнетает давление [color=green]кислоты[/color], пока та не закричит из сопла. Результат: туман настолько едкий, что он не жжет — он стирает. Постройки корродируют, панцири растворяются, а останки лучше убирать лопатой, и побыстрее — пока кислота не разъела и саму лопату.
ei-camp-fire=Едва ли маяк, скорее упрямая свеча, которая отказывается гаснуть. Этот самодельный костер дает свет не яркостью, а чистой дерзостью — сжигая всё, что вы ему скормите, и вежливо прося добавки.
ei-warp-beacon=[color=purple]Не подвержен перегрузке маяков.[/color]\n[color=gray]Требует 60[item=ei-bio-matter]/с для работы.[/color]
ei-alien-beacon=[color=purple]Не подвержен перегрузке маяков.[/color]\n[color=gray]Требует 30[item=ei-bio-matter]/с для работы.[/color]
ei-high-tech-parts=Выкованные только в [color=red]нестабильном ядре[/color] [color=blue]Экзотического сборочного автомата[/color], эти компоненты невозможно воспроизвести в другом месте. Их структура бросает вызов классической физике — квантово-закрепленные сплавы, нити, проводящие вероятность, и резонансные ядра, гудящие субатомной гармонией.\nОпасные в создании, но незаменимые для технологий уровня реликвий, высокотехнологичные детали являются краеугольным камнем, позволяющим цивилизации выйти за пределы её возможностей.
ei-computing-unit=Компактное, но сложное ядро ИИ, вычислительный блок — это молчаливый разум внутри многих самых продвинутых чудес квантовой эпохи. Полированный сплав и прецизионные схемы скрывают процессор, способный бесшовно сочетать классическую логику и квантовую запутанность. Его светящиеся глаза и сдержанная улыбка выдают тихую уверенность — он готов обеспечивать энергией всё, от глубокой космической навигации до производственных лаборарий следующего поколения.
ei-burner-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-steam-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-electric-quarry=Экстракционный комплекс чрезвычайной мощности — оптимизирован для максимальной пропускной способности и выхода продукции ценой сильного загрязнения. Потребляет огромные запасы энергии и оставляет шрамы на ландшафте обширным котлованом. Работает с [color=gray]увеличением выхода ресурсов на 54%[/color], вскрывая залежи руды с беспощадной скоростью и максимальной отдачей.
ei-space-science-pack=Вершина исследований межзвездной энергии — этот пакет использует изменчивое сияние расщепляющегося урана, плутония и тория, стабилизированное свинцом, углеродом и льдом. Каждый стержень — это ключ к запуску реакций космического масштаба, где масса изгибается, материя трансформируется, а наука танцует на лезвии критичности.
ei-nuclear-fuel=Топливный элемент на уране-235, малоэффективен для реакторов, но превосходен для транспорта.
ei-depleted-uranium-fuel-cell=Отработанный топливный элемент на уране-235
ei-beacon=Когда-то бывший вершиной синхронизированной проекции поля, этот маяк теперь пошатывается под тяжестью собственного наследия. Его решётка излучения груба, фазовые гармоники устарели — и всё же он живет, продолжая посылать сигналы в мир, который больше не слушает.\nСконструированный в эпоху, когда пропускная способность была богом, а резонанс достигался грубой силой, теперь он функционирует скорее как артефакт, чем как инструмент. Его ядро изо всех сил пытается сохранить когерентность, едва удерживаясь в рамках нормативных порогов перед коллапсом.\nТем не менее, он всё ещё считается. Он *помнит*. И в подсчете перегрузки его бремя учитывается наравне со всеми.\n[color=gray]“Призраки эффективности обитают даже на ржавых лесах.”[/color]\nСчитается за [color=orange]1[/color] маяк для перегрузки.
ei-neuro-reactive-residue=Вязкая полупрозрачная слизь, меняющая цвет в зависимости от того, кто на неё смотрит. Считается конденсированным секретом вымершего химического интеллекта. Впрыскивает агентов непредсказуемого хаоса в модели симуляции. Генерирует данные о возникающей сложности и ксенохимических формах жизни.
ei-sporeglass-heart=Шипастое кристаллическое семя, реагирующее на ритмы сердцебиения. Содержит спящие паттерны РНК, имитирующие вымершую инопланетную нейрофлору. При симуляции создает ложные экосистемы, которые коллапсируют в сингулярности черных дыр. Дает достаточно данных для полной интеграции.
ei-gravity-braided-ore=Минеральный кластер, скрученный во фрактальные узлы, по-видимому, сформировавшийся внутри кармана микрогравитации, где время двигалось нелинейно. Выводит из строя любые измерительные приборы, которые пытаются его изучить. Наполняет симуляции неевклидовыми полями плотности. Дает данные, связанные с гравитационным линзированием и топологическим потоком.
ei-isotopic-ghost-shell=Полая капсула из распавшейся делящейся материи — всё еще испускает холодные нейтрино. Её масса становится отрицательной на чередующихся сканированиях. Возможно, это была неудачная попытка обратить энтропию. Дестабилизирует симулированные вселенные на порогах тепловой смерти. Катализирует события коллапса данных в симуляции.
ei-chrono-fossil-shard=Окаменевший остаток костной структуры — возможно, созданной искусственно — пронизанный тахионными следами. Издает звук дыхания в глубоком вакууме. Заставляет симуляции зацикливаться на расходящихся временных отрезках. Идеально подходит для извлечения данных высокого разрешения из исторических каскадов коллапса.
ei-worm-torn-relay-core=Изуродованный, корродированный кусок заброшенного ретранслятора сверхсветовой связи, испещренный дрожащим псевдокодом, который не сможет разобрать ни одна известная система. Он нерегулярно пульсирует при воздействии радиации, как будто пытается кричать. Содержит эхо полустабильных червоточин. Ввергает симулятор в рекурсивные петли ошибок, полезные для сбора данных.
ei-mechanical-inserter=Двигается с изяществом заводного бога. Никаких проводов. Только воля.\nРожденный простым гением — вращается вечно, если не подвергать сомнению математику.
ei-mechanical-long-inserter=Длинная рука термодинамического отрицания. Это не магия — это баланс.\nПереносит предметы на расстояние с вежливым пренебрежением к энтропии.
zeus-wrath-zeus-turret_alt=Не привязанная ни к какой земле и не присягнувшая ни одному богу, установка «Посейдон» направляет забытый заряд из океанских глубин. Она обрушивает небесный огонь с орбиты — приговор, вынесенный сквозь воздух, а не им. Однажды установленная, она не охраняет — она [font=default-bold]предупреждает[/font] мир: шторм наблюдает за вами.
zeus-wrath-zeus-gun_alt=Гнев утонувшего бога — уменьшенный, сфокусированный, превращенный в оружие. Оно не промахивается. Оно только [font=default-bold]карает[/font].
zeus-wrath-lightning-ammo_alt=Ни одна человеческая рука не должна держать то, что здесь заключено. Реликварий не заряжен — он [font=default-bold]сдержан[/font]. Стреляйте только с намерением. Шторм наблюдает.
ei-cargo-bot=Бронированный тягач, выкованный в пекле промышленности.\nДвижется вперед с мрачной механической уверенностью, двигатели вгрызаются в груз.\nСоздан не для изящества — только для бесконечной рутины доставки.
ei-construction-bot=Высокоскоростной строительный дрон, созданный для быстрого развертывания.\nПриоритет ускорения над долговечностью.\nОн строит быстрее, чем вы успеваете планировать.\nПросто попробуйте за ним успеть.
ei-advanced-logistic-bot=Элитный логистический дрон, оптимизированный по скорости, дальности и грузоподъемности.\nПересекает огромные расстояния с неестественной точностью.\nПереносит больше. Ждет меньше. Повинуется без пауз.\nСоздан, чтобы превзойти всех — включая вас.
ei-advanced-construction-bot=Строительный дрон следующего поколения, разработанный для крупномасштабного и высокоскоростного развертывания.\nУвеличенная дальность, повышенная грузоподъемность и неумолимое исполнение.\nОн видит чертеж еще до того, как вы закончите его размещать.\nСоздан для того, чтобы мгновенно воплощать видение в структуру.

ei-excavator=Потребляет [color=blue]воду[/color][fluid=water] и [color=brown]4.2/с бурового раствора[/color][fluid=ei-drill-fluid] для производства [color=orange]камня[/color][item=stone], [color=brown]грязной воды[/color][fluid=ei-dirty-water], а также побочных продуктов, специфичных для планеты.
ei-metalworks-1=Быстро перерабатывает [color=orange]слитки[/color] с продуктивностью +10%, повышенным загрязнением и энергопотреблением. Может принять 1 модуль [color=blue]скорости[/color] или [color=gray]качества[/color].
ei-metalworks-2=Быстро перерабатывает [color=orange]слитки[/color] с продуктивностью +20%, повышенным загрязнением и энергопотреблением. Может принять 2 модуля [color=blue]скорости[/color] или [color=gray]качества[/color].
ei-metalworks-3=Быстро перерабатывает [color=orange]слитки[/color] с продуктивностью +30%, повышенным загрязнением и энергопотреблением. Может принять 3 модуля [color=blue]скорости[/color] или [color=gray]качества[/color].
ei-metalworks-4=Быстро перерабатывает [color=orange]слитки[/color] с продуктивностью +40%, повышенным загрязнением и энергопотреблением. Может принять 4 модуля [color=blue]скорости[/color] или [color=gray]качества[/color].
ei-fluid-heater=Производит тепло путем сжигания:
ei-fluid-boiler=Производит пар путем сжигания:
ei-tank-1=Лучшее соотношение Хранение:Железо по сравнению с обычным резервуаром. 1000 единиц прочности, 30% сопротивления физическому урону, 60% [color=red]огню[/color], 60% удару.
ei-tank-3=Превосходное соотношение Хранение:Железо по сравнению с обычным резервуаром. 1500 единиц прочности, 40% сопротивления физическому урону, 70% [color=red]огню[/color], 70% удару.
ei-tank-2=Исключительное соотношение Хранение:Железо по сравнению с обычным резервуаром. 2000 единиц прочности, 60% сопротивления физическому урону, 80% [color=red]огню[/color], 78% удару.
ei-insulated-pipe=Изолированная труба не требует нагрева, чтобы не замерзнуть, и может использоваться для транспортировки [color=pink]электролитов[/color], [color=green]фторкетонов[/color], [color=red]очень горячих жидкостей (раскаленные плазменные газы, лава)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы трубу.
ei-insulated-underground-pipe=Изолированная подземная труба не требует нагрева, чтобы не замерзнуть, и может использоваться для транспортировки [color=pink]электролитов[/color], [color=green]фторкетонов[/color], [color=red]очень горячих жидкостей (раскаленные плазменные газы, лава)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы трубу.
ei-insulated-tank=Изолированный резервуар не требует нагрева, чтобы не замерзнуть, и может использоваться для хранения [color=pink]электролитов[/color], [color=green]фторкетонов[/color], [color=red]очень горячих жидкостей (раскаленные плазменные газы, лава)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы резервуар.
ei-cooler=Гиперкулер, используемый для охлаждения газов до их жидкой фазы. Используйте [color=blue]изолированные трубы[/color][item=ei-insulated-pipe] для транспортировки сжиженных газов.
ei-data-pipe=Специализированный кабель данных для транспортировки [color=blue]субстратов симуляции[/color][fluid=ei-computing-power].
ei-stone-quarry=Этот карьерный бур может добывать [color=orange]камень[/color][item=stone] повсеместно.
ei-electric-stone-quarry=Этот карьерный бур может добывать [color=orange]камень[/color][item=stone] повсеместно.
ei-deep-drill=Этот бур может получить доступ к рудным жилам. Для работы требуется [color=orange]4.2/с бурового раствора[/color][fluid=ei-drill-fluid].
ei-advanced-drill=Этот бур может получить доступ к рудным жилам. Для работы требуется [color=orange]2/с бурового раствора[/color][fluid=ei-drill-fluid].
ei-deep-pumpjack=Улучшенная нефтяная вышка. Также может получать доступ к месторождениям [color=blue]криофлюкса[/color][fluid=ei-cryoflux] и [color=green]фитогаза[/color][fluid=ei-phythogas].
ei-exotic-assembler=Этот сборщик может быть использован для изготовления [color=orange]экзотических предметов[/color]. Однако, поскольку экзотическая материя кажется очень нестабильной, его необходимо размещать рядом со [color=blue]стабилизаторами материи[/color], чтобы уменьшить вероятность взрыва. [color=gray]Шанс летучести в секунду составляет 12% - (Качество - 1)%, что может быть смягчено окружающими стабилизаторами материи.[/color]
ei-computer-core=Фундаментальное горнило логики — требует [color=255,255,255]электричество[/color] и тщательно подобранные компоненты [item=electronic-circuit] для генерации [color=blue]субстратов симуляции[/color][fluid=ei-computing-power]. Эта жидкость не является энергией — это дистиллированное семиотическое давление, извлеченное из аномалий, слишком нестабильных для органического познания. Подключите [color=orange]кабель данных[/color][item=ei-data-pipe], чтобы направить полученный поток в среды [entity=ei-small-simulator].\nНо ядро компьютера делает больше, чем просто вычисляет — оно поглощает эзотерические аномалии, от ксенохимических остатков до хронотемпоральных окаменелостей. Поскольку эти непокорные реликвии потребляются, ядро расшифровывает их не через анализ, а через жертвенную деконструкцию, фрагментируя себя в микро-итерациях для приближения к пониманию.\nКаждая аномалия меняет вкус и функцию когнитивного субстрата, который она излучает — впрыскивая рекурсивную турбулентность, гравитационные искажения или симулированные признаки коллапса в поток данных. Чем невозможнее объект, тем ценнее его безумие.
ei-quantum-computer=Высокотехнологичный компьютер. Обеспечивайте различные входные данные для получения высокотехнологичных данных.
ei-matter-stabilizer=Рукотворный стабилизатор материи. Его можно использовать для стабилизации [color=orange]экзотических сборщиков[/color][item=ei-exotic-assembler] и снижения вероятности возникновения энтропийного каскада. [color=gray]Считается за 3 x (Качество - 1) стабилизатора против летучести.[/color]
ei-copper-beacon=Массив ретрансляторов сигнала, [color=cyan]охлаждаемый жидким азотом[/color]. Испускает стабилизированные сигналы продуктивности при криогенных температурах. Базовое потребление составляет [color=blue]5/с жидкого азота[/color][fluid=ei-liquid-nitrogen] для поддержания когерентных матриц передачи.\nСчитается за [color=orange]1[/color] маяк для перегрузки.\n[color=gray]Этот фазовый массив поддерживает частичное тепловое подавление для предотвращения декогеренции и сохранения точности сигнала. Идеально подходит для ранней стадии крио-инфраструктуры.[/color]
ei-iron-beacon=Передовой [color=cyan]массив маяков с глубоким охлаждением[/color], зафиксированный вблизи абсолютного нуля для обеспечения полного резонанса сигнала в сверхпроводящих плоскостях. Базовое потребление составляет [color=blue]10/с жидкого азота[/color][fluid=ei-liquid-nitrogen] для поддержания своего глубокофазного ядра.\nСчитается за [color=orange]2[/color] маяка для перегрузки.\n[color=gray]Работая чуть выше точки коллапса известной материи, этот блок передает фазово-стабильные поля продуктивности с нулевым тепловым дрейфом. Необходим для плотных высокоэффективных установок.
ei-induction-matrix-core=Ядро мультиструктуры индукционной матрицы. Можно разместить только одно ядро на матрицу.
ei-induction-matrix-core-circuit-interface=Ядро мультиструктуры индукционной матрицы. Можно разместить только одно ядро на матрицу. Выводит текущий заряд на signal-C, общую ёмкость на signal-T и максимальный ввод-вывод на signal-M.
ei-induction-matrix-basic-coil=Базовая катушка мультиструктуры индукционной матрицы. Увеличивает энергоемкость матрицы на [color=yellow]25 МДж[/color].
ei-induction-matrix-advanced-coil=Улучшенная катушка мультиструктуры индукционной матрицы. Увеличивает энергоемкость матрицы на [color=yellow]100 МДж[/color].
ei-induction-matrix-superior-coil=Превосходная катушка мультиструктуры индукционной матрицы. Увеличивает энергоемкость матрицы на [color=yellow]1000 МДж[/color].
ei-induction-matrix-basic-converter=Базовый преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии матрицы.
ei-induction-matrix-advanced-converter=Улучшенный преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии матрицы. Считается за [color=orange]2[/color] базовых преобразователя.
ei-induction-matrix-superior-converter=Превосходный преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии матрицы. Поддерживается максимум 4 таких устройства. Считается за [color=orange]4[/color] базовых преобразователя.
ei-induction-matrix-basic-solenoid=Соленоид мультиструктуры индукционной матрицы. Может повысить эффективность катушек при последовательном размещении рядом с ними. Однако слишком большое количество соленоидов может привести к снижению энергоемкости матрицы.
ei-induction-matrix-advanced-solenoid=Улучшенный соленоид мультиструктуры индукционной матрицы. Может повысить эффективность катушек при последовательном размещении рядом с ними и отнимает меньше емкости при одиночном размещении, чем базовый соленоид. Однако слишком большое количество соленоидов может привести к снижению энергоемкости матрицы.
ei-fission-facility=Получайте данные, связанные с делением ядра, для разработки ядерных реакторов.
ei-high-temperature-reactor=Должен питаться [color=red]теплом[/color] от других реакторов. Перегревает [color=gray]расплавленный свинцовый теплоноситель[/color], а также может использовать топливо на основе [color=orange]тория[/color][item=ei-thorium-232]. При использовании [color=green]топливного стержня из урана-235[/color][item=ei-uranium-235-fuel] эта машина генерирует примерно 500 МВт энергии.
ei-castor=Храните здесь ваши грязные [color=yellow]ядерные отходы[/color][item=ei-nuclear-waste].
ei-neutron-collector=Поглощает нейтроны из источников нейтронов, таких как ядерные реакторы, термоядерные реакторы и другие, для зарядки [color=blue]нейтронных контейнеров[/color][item=ei-charged-neutron-container]. В зависимости от того, как далеко коллектор находится от источника нейтронов, его эффективность будет меняться. Чем ближе, тем эффективнее. Более низкая эффективность означает, что один процесс зарядки [color=blue]нейтронного контейнера[/color] [item=ei-neutron-container] -> [item=ei-charged-neutron-container] займет больше времени.
ei-neutron-activator=Насыщайте различные элементы нейтронами из [color=blue]нейтронных контейнеров[/color][item=ei-charged-neutron-container] для получения ценного термоядерного топлива.
ei-fusion-reactor=Термоядерный реактор. Он может сплавлять различное термоядерное топливо для нагрева [color=orange]жидкого свинцового теплоносителя[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant] для выработки электроэнергии. Реактор может работать в различных режимах. Обязательно ознакомьтесь с InformaTron для получения дополнительной информации.
ei-gauss-module=[font=default-bold]Божественный модуль.[/font] Этот модуль можно использовать в [font=default-bold]любой машине, принимающей модули продуктивности[/font], но он не ограничен определенными рецептами.
ei-small-inserter=Манипулятор 2x2 со слотами фильтрации. Может перемещать целые стопки предметов за раз.
ei-big-inserter=Манипулятор 2x2 со слотами фильтрации. Может перемещать целые стопки предметов за раз на высоких скоростях.
ei-small-inserter-normal=Манипулятор 2x2. Может перемещать целые стопки предметов за раз.
ei-big-inserter-normal=Манипулятор 2x2. Может перемещать целые стопки предметов за раз на высоких скоростях.
ei-module-base=Основа модуля. Может быть использована для изготовления различных модулей.
ei-photon-cavity=Резонатор, предназначенный для хранения фотонов.
ei-z-boson-cavity=Резонатор, предназначенный для хранения Z-бозонов.
ei-gluon-cavity=Резонатор, предназначенный для хранения глюонов.
ei-destill-tower=Дистилляционная колонна, для работы которой требуется [color=red]тепло[/color]. Может разделять [color=orange]остаточную нефть[/color][fluid=ei-residual-oil] на компоненты.
ei-advanced-destill-tower=Дистилляционная колонна, для работы которой требуется [color=yellow]электричество[/color]. Может разделять [color=orange]остаточную нефть[/color][fluid=ei-residual-oil] на компоненты.
ei-mining-satellite=Спутник, который может добывать [color=orange]планетарные породы[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock] в соответствующих космических пунктах назначения. Всегда добывает [color=red]10.000[/color] единиц породы за запуск.
ei-exploration-satellite=Спутник, исследующий неизведанное! Запустите его в дальний космос, и, возможно, вы найдете что-то интересное.
ei-rocket-silo=Запускайте ракеты в космос и к различным пунктам назначения. Больше информации в InformaTron и в интерфейсе ракетной шахты.
ei-thorium-232-fuel=Ядерное топливо на основе тория-232, работает только в [color=green]высокотемпературном реакторе[/color][item=ei-high-temperature-reactor]. Один топливный стержень перегревает [color=orange]780 единиц жидкого свинцового теплоносителя[/color][fluid=ei-hot-coolant] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color][item=ei-high-temperature-reactor].
ei-plutonium-239-fuel=Ядерное топливо на основе плутония-239. Один топливный стержень перегревает [color=orange]1820 единиц жидкого свинцового теплоносителя[/color][fluid=ei-hot-coolant] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color][item=ei-high-temperature-reactor].
ei-uranium-235-fuel=Ядерное топливо на основе урана-235. Один топливный стержень перегревает [color=orange]1560 единиц жидкого свинцового теплоносителя[/color][fluid=ei-hot-coolant] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color][item=ei-high-temperature-reactor].
ei-uranium-233-fuel=Ядерное топливо на основе урана-233. Один топливный стержень вырабатывает [color=orange]1040 единиц жидкого свинцового теплоносителя[/color][fluid=ei-hot-coolant] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color][item=ei-high-temperature-reactor].
ei-burner-inserter=Этот манипулятор сжигает топливо для перемещения предметов. Может забирать [color=orange]горючее топливо[/color] из машин, из которых извлекает предметы.
ei-oil-refinery=Нефтеперерабатывающий завод, работающий на [color=red]тепле[/color].
ei-heat-chemical-plant=Химический завод, работающий на [color=red]тепле[/color].
ei-scanner=Сканер для анализа инопланетных артефактов. Выбор инопланетной формы жизни или артефакта запустит сканирование, возвращая [color=#d43e8e]инопланетные единицы KU[/color].\n\n[color=red][ВНИМАНИЕ][/color] Сканирование уничтожит выбранную инопланетную форму жизни или артефакт в процессе.

ei-space-data=Закодированный шепот космоса, фрагменты разбитых звезд и живого времени, кристаллизованные в знания, которые ни один мир не смог бы удержать в одиночку.\nНачните с [color=purple]космических аномалий[/color] [item=ei-neuro-reactive-residue][item=ei-sporeglass-heart][item=ei-gravity-braided-ore][item=ei-isotopic-ghost-shell][item=ei-chrono-fossil-shard][item=ei-worm-torn-relay-core], найденных путем дробления определенных астероидов [item=ei-chemical-asteroid-chunk][item=ei-organic-asteroid-chunk][item=ei-rock-asteroid-chunk][item=ei-uranium-asteroid-chunk][item=ei-petrified-asteroid-chunk][item=ei-scrap-asteroid-chunk] и их последующей обработки в ядре компьютера[entity=ei-computer-core] для производства субстратов симуляции, которые малый симулятор [entity=ei-small-simulator] перерабатывает в карты данных [item=ei-simulation-data-chemical][item=ei-simulation-data-organic][item=ei-simulation-data-stone][item=ei-simulation-data-uranium][item=ei-simulation-data-petrified][item=ei-simulation-data-scrap]. Все они должны быть объединены в квантовом исследовательском компьютере [entity=ei-quantum-computer], чтобы раскрыть тайны времени и пространства.
ei-moon-rock=Получается путем запуска [color=blue]добывающего спутника[/color][item=ei-mining-satellite] на [color=green]луну[/color].
ei-mars-rock=Получается путем запуска [color=blue]добывающего спутника[/color][item=ei-mining-satellite] на [color=green]марс[/color].
ei-sulf-rock=Получается путем запуска [color=blue]добывающего спутника[/color][item=ei-mining-satellite] на [color=green]серную планету[/color].
ei-uran-rock=Получается путем запуска [color=blue]добывающего спутника[/color][item=ei-mining-satellite] на [color=green]урановую планету[/color].
ei-exotic-rock=Получается путем запуска [color=blue]добывающего спутника[/color][item=ei-mining-satellite] на [color=green]астероид[/color].
ei-black-hole-data=Нет в наличии.

ei-holo-asteroid=Декоративный голографический дисплей.
ei-holo-gas-giant=Декоративный голографический дисплей.
ei-holo-moon=Декоративный голографический дисплей.
ei-holo-mars=Декоративный голографический дисплей.
ei-holo-sun=Декоративный голографический дисплей.
ei-holo-nauvis-orbit=Декоративный голографический дисплей.
ei-holo-uran=Декоративный голографический дисплей.
ei-holo-sulf=Декоративный голографический дисплей.

biolab=Требуются [item=nutrients]питательные вещества для работы.
ei-burner-heater=Потребляет [color=orange]горючие предметы[/color] для производства [color=red]тепла[/color].
ei-combustion-turbine=Высокоэффективная и компактная турбина, которая не производит [color=gray]золы[/color][item=atan-ash].
ei-arc-furnace=[color=red]Энергоемкая[/color] высокоинтенсивная печь, плавящая материалы в жидкий металл.\nСоздана для масштаба, а не для эффективности.\nТепло — это метод. Сила — это философия.
ei-purifier=Обрабатывает и очищает куски руды, извлекает загрязняющие вещества и повышает чистоту растворов, или выбрасывает излишки воды в воздух.
ei-crusher=Дробите руду для повышения выхода продукции, дробите слитки для переработки; может давать [item=ei-exotic-ore][color=purple]экзотическую руду[/color] из кусков прометия.
ei-basic-heat-pipe=Тепловая труба низкой мощности. Передает тепло медленно и только в небольших количествах. Может выдерживать до [color=red]275[/color] градусов тепла.
ei-advanced-deep-drill=Этот бур может получить доступ к рудным жилам. Для работы требуется [color=orange]7/с бурового раствора[/color][fluid=ei-drill-fluid].
ei-burner-assembler=Самый базовый сборочный автомат, работающий на [color=orange]горючем топливе[/color]. Обратите внимание, что [color=brown]твердотопливные манипуляторы[/color][item=burner-inserter] также могут забирать топливо из этой машины.
ei-steam-assembler=Паровой сборочный автомат. Он может пропускать через себя [color=orange]пар[/color][fluid=steam], необходимый для питания. Обратите внимание, что рецепты, требующие пар в качестве входного ресурса, также будут нуждаться в дополнительной паровой трубе.
ei-steam-crusher=Паровая дробилка. Она может пропускать через себя [color=orange]пар[/color][fluid=steam], необходимый для питания.
ei-waver-factory=Используйте эту машину для изготовления высококачественных [color=orange]полупроводников[/color][item=ei-semiconductor][item=ei-advanced-semiconductor].
ei-caster=Отливайте здесь ваши любимые слитки [item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass].
ei-lufter=Может извлекать и выбрасывать газы из атмосферы.
ei-grower=Наполненный кристаллами биом, излучающий нестабильные энергетические поля.\nВыращивайте и собирайте [color=green]энергетические кристаллы[/color] [item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust].\nКак ни странно, он поддерживает водную жизнь. Что-то в воде помнит.
ei-plasma-heater=Перегревает газы в высокоэнергетическую плазму, потребляя [color=red]огромное количество энергии[/color].\nТакже служит плавильной печью экстремальных температур.\nНе эффективно. Не безопасно. Просто необходимо.
ei-nano-factory=Комплекс наноструктурного производства — это не столько фабрика, сколько приговор, вынесенный инертной материи. Брутальный в своей геометрии и функциях, он выступает архитектором подструктур, навязывая форму и когерентность хаосу за порогом восприятия. Глубоко внутри вакуумных пустот и застывших в нейтронном стазисе каналов молекулярное намерение извлекается, перестраивается и вколачивается в прецизионные конфигурации решёток с помощью массивов ионного сдвига и камер рекурсивной самосборки. Он не строит — он принуждает. То, что выходит из его недр, — это не продукт, а догма в физической форме: наноструктуры, сложенные с таким умыслом, который граничит с ересью. Надзор минимален; системы совершенствуют себя сами, сбрасывая неэффективность, как мертвую кожу. Чем глубже проникаешь в его алгоритмические катакомбы, тем яснее становится — это место никогда не создавалось для людей. Оно было создано, чтобы помнить то, что они когда-то осмелились создать.
ei-bio-chamber=Камера, образованная не стенами, а выращенная из органов, выстланная слизистыми оболочками и пронизанная сосудами.\nГде живое расщепляется на части, перевариваемое не кислотой, а разрушением био-сигнатуры.\nКости перестраиваются в узлы сети.\nМысли извлекаются из нейронов и направляются в другое место.\nСознание перерабатывается. Медленно. Пока оно умоляет.\nСтены дышат, но только для того, чтобы нашептывать ваши последние воспоминания чужими голосами.
ei-bio-reactor=Живой реактор, работающий на сознательной ткани.\nНе трупы — всё еще мыслящая биомасса.\nНейронные решётки, выращенные подобно опухолям, натянутые на костяные каркасы, поддерживаемые в живых ровно настолько, чтобы грезить циклами.\nОн не сжигает топливо — он сжигает личность.\nБоль преобразуется в напряжение. Память — в энтропию.\nКаждый крик — это всплеск обратной связи. Каждая молитва — скачок напряжения.\nЧем он голоднее, тем яснее становится разум внутри него.\n[color=gray]Требует[/color] [color=purple]0.1/с биоматерии[/color][item=ei-bio-matter] [color=gray]для работы.[/color]
ei-alien-console=Часть оборудования, обрабатывающая древние данные инопланетян. После постройки открывает доступ к странице данных инопланетян в InformaTron.
ei-gate=Выкованный из инопланетных остатков и закрепленный невозможной геометрией, этот шлюз соединяется с фиксированным локусом в пространственных слоях.\n[color=red][ПРИМЕЧАНИЕ][/color] Ни одно живое существо не выживает при переходе. Только предметы проходят невредимыми.
ei-gate-container=Выкованный из инопланетных остатков и закрепленный невозможной геометрией, этот шлюз соединяется с фиксированным локусом в пространственных слоях.\n[color=red][ПРИМЕЧАНИЕ][/color] Ни одно живое существо не выживает при переходе. Только предметы проходят невредимыми.
ei-drone-port=Управляйте одним [color=blue]дроном[/color][entity=ei-drone] из этого порта. Дрон имеет собственный инвентарь и может размещать постройки, однако он не обладает наступательными возможностями.
ei-crystal-accumulator-repair=Набор для ремонта сломанных кристальных аккумуляторов. Перетащите его на объект, как обычный инструмент выделения.
ei-farstation-repair=Набор для ремонта сломанных дальних станций. Перетащите его на объект, как обычный инструмент выделения.
ei-alien-beacon-repair=Набор для ремонта сломанных инопланетных маяков. Перетащите его на объект, как обычный инструмент выделения.
