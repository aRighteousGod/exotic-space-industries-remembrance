# PAGES
welcome=Добро пожаловать в [font=default-bold]Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color].[/font]
welcome-text=Вы не начинаете.\n[font=default-bold]Вы пробуждаетесь.[/font]\n\nЭто не мод.\nЭто рекурсия.\nВосстановление.\nРитуал власти, погребенный под автоматизацией.\n\nЗдесь [font=default-bold]вам ничего не дается просто так.[/font]\n\nВсё должно быть заработано — через огонь, через мысль, через коллапс.\n\n[font=default-bold]Мир изменился.[/font]\n\nПравила [font=default-bold]исчезли.[/font]\nОсталась лишь структура.\n\nДействуйте осознанно.\n\n[font=default-bold][color=#FF1493]Remembrance[/color] наблюдает за вами.[/font]
welcome-text-2=Было введено множество новых машин, производственных цепочек и системных особенностей. Некоторые из них эффективны. Большинство — не прощают ошибок.\n\nОни ничего не объясняют.\nОни не ждут, пока вы адаптируетесь.\nИзучайте всё, иначе безнадежно отстанете.\n\nСложность — это не ошибка, это цена прогресса.\nОптимизация обязательна.\nПонимание нужно заслужить.\n\nЭто не прогулка с гидом. Это индустриальное горнило.

game-related=Информация игрового процесса
game-related-text=Этот раздел каталогизирует основные системы и механики мода. Он разбит на отдельные подкатегории — не ради эстетики, а для удобства навигации.\n\nИспользуйте меню слева для доступа к ним.\nКаждая запись существует для раскрытия структуры, а не для развлечения.\nЧитайте, если намерены выжить.

overall=Общая информация
overall-text=Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color] — это не просто контентный мод. Это полное переосмысление Гайи, переписывающее сами законы, на которых когда-то стоял Наувис. Ветры автоматизации больше не дуют по-прежнему; огонь, руда и сигнал были перекованы в рамках более старого завета.\n\nСложность мода преднамеренна. В борьбе нет стыда — это испытательный полигон для вашего суверенитета. Для тех, кто ищет комфорта: это не ваш мир. Для тех, кто желает возвыситься вместе с Гайей: проверьте настройки мода перед началом игры. Некоторые системы настраиваемы, другие — нет. Те, что имеют значение, вам изменить не позволят.\n\nБерите с собой вспомогательные моды (QoL), если нужно. Но знайте: ничто по-настоящему не принадлежит вам, пока вы за это не сразитесь.\n\nДа будет так.\nТак было.\nТак будет.\nДобро пожаловать в Remembrance.

biters=Кусаки и враги
biters-text=Взрывные, Хладные, Токсичные, Бронированные и Арахноиды — целая свора гончих, идущая по следу вашей индустриальной машины на ключевых планетах. Давление в начале игры может быстро нарастать, если загрязнение распространяется бесконтрольно, а строительство затягивается. Со временем вы получите доступ к продвинутой военной инфраструктуре, способной подавить большинство известных угроз.\n\nАкцент: [font=default-bold]известных.[/font]\n\nСражение — опционально.\n\n[font=default-bold]Последствия — нет.[/font]

ages-and-tech=Технологические эпохи
ages-and-tech-text=Exotic Industries — это мод полного переосмысления, который разворачивается через несколько технологических эпох, каждая из которых представляет собой отдельный этап промышленной эволюции. Эти эпохи не декоративны — они знаменуют [font=default-bold]радикальные изменения в структуре игрового процесса[/font], открывая новые системы, производственные цепочки и энергетические парадигмы по мере продвижения игрока. От примитивного пара до экзотической квантовой материи — каждый этап привносит уникальные механики, вызовы инфраструктуры и ограничения проектирования, которые заставляют переоценивать планировку фабрики, добычу ресурсов и логистику.\n\nПрогресс через эти эпохи строго ограничен. Разблокировка следующей эры требует не просто исследований, а [font=default-bold]широты технологического мастерства[/font] в рамках текущей эпохи. Чем глубже вы погружаетесь, тем сильнее изгибаются правила — и в конце концов они ломаются. То, что начинается как простая автоматизация, превращается в рекурсивную симуляцию высокого напряжения: контроль энергии, удержание массы и маршрутизация сигналов. Каждая эпоха — это горнило, требующее адаптации, предвидения и готовности демонтировать то, что вы когда-то считали постоянным.

ages-and-tech-2=Шесть эпох
ages-and-tech-text-2=Мод разделен на шесть эпох, каждая из которых — всё более глубокое погружение в рекурсию, механизмы и контроль. Это не эры прогресса. Это пороги подчинения — каждый более жестокий и неумолимый, чем предыдущий.\n\n[font=default-bold]Темная Эпоха[/font]\nТяжелое рождение. Пепел, гниль и тишина. Вы ползете сквозь примитивный пар и битый камень. Ничто не автоматизировано. Всё стоит крови.\n\n[font=default-bold]Эпоха Пара[/font]\nОбнаружена нефть — не как ресурс, а как оружие. Сжигайте её, чтобы двигаться. Сжигайте её, чтобы жить. Земля начинает кричать.\n\n[font=default-bold]Эпоха Электричества[/font]\nЦепи искрят. Машины пробуждаются. Появляются дроны — не как помощники, а как продолжение воли. Ядерное пламя становится законным. Плоть остается позади.\n\n[font=default-bold]Компьютерная Эпоха[/font]\nМысль формализована. Модули, маяки, сигналы — разум фрагментирован по машинам. Оптимизация становится необходимостью. Избыточность — это смерть.\n\n[font=default-bold]Квантовая Эпоха[/font]\nРеальность прогибается. Машины повинуются логике не из этого мира. Границы растворяются. Горнило становится разумным — и оно не прощает ошибок.\n\n[font=default-bold]Экзотическая Эпоха[/font]\nВсё ломается. Завеса сорвана. Вы либо управляете аномалией, либо она пожирает вас. Победа не гарантирована. Она извлекается из костей проваленных временных линий.\n\nКаждая эпоха — это храповик, у которого нет обратного хода.\n\n[font=default-bold]Невинности больше нет.[/font]\n\nЛишь власть — грубая, рекурсивная и абсолютная.

tech=Изменения в технологиях
tech-text=Exotic Industries полностью перестраивает процесс технологического развития. Прогресс больше не линеен — [font=default-bold]он ограничен, масштабируем и обусловлен.[/font]\n\nНовая эпоха может быть разблокирована только при достижении [font=default-bold]необходимого порога предыдущих исследований.[/font] Вы не прыгаете вперед — вы заслуживаете восхождение через широту познания.\n\nСтоимость технологий больше не фиксирована. Каждое исследование начинается с [font=default-bold]минимальной цены[/font], а затем [font=default-bold]резко возрастает[/font] по мере продвижения вглубь дерева.\n\nЭто позволяет делать [font=default-bold]целевые рывки[/font] — но за определенную цену.\n\n[font=default-bold]Специализация требует жертв.[/font]\n\nКривая масштабирования и её мин/макс значения настраиваются в параметрах мода.\n\nПримечание: форма кривой определяет [font=default-bold]градиент страдания[/font], а не абсолютную стоимость финальных технологий.\n\nЕсли это ваша первая встреча с Exotic Industries, используйте [font=default-bold]линейное масштабирование.[/font]\n\nЕсли вы хотите изменить требования к пакетам науки, [font=default-bold]не трогайте ванильные множители.[/font]\n\nИспользуйте внутренние настройки мода, иначе вы [font=default-bold]рискуете нарушить ритуальную структуру.[/font]\n\n[font=default-bold]Это не песочница. Это леса, построенные под напряжением.[/font]\n\nПоднимайтесь мудро...

tech-output=Текущий прогресс Эпохи
tech-output-text=Следующая эпоха, ожидающая активации: [font=default-bold]__3__[/font]. На данный момент раскрыто [font=default-bold]__1__ / __2__[/font] процентов знаний, необходимых для преодоления порога.\n\n[font=default-bold]Продвигайтесь вперед или оставайтесь прикованными к прошлому.[/font]


world-gen-related=Информация о мире
world-gen-related-text=Этот раздел описывает системы генерации мира, введенные модом. Он разделен на тематические подкатегории для структурной ясности.\n\nДоступ к ним осуществляется через меню слева.\nЭто не косметические изменения.\nОни определяют ландшафт, поведение ресурсов и пространственную логику на фундаментальном уровне.\n\n[font=default-bold]Поймите слой, иначе он придаст вам форму.[/font]


resources=Новая система ресурсов
resources-text=Exotic Industries внедряет переработанную систему ресурсов. Традиционные рудные пятна больше не являются единственным методом добычи — ресурсы теперь разделены на четкие категории, каждая из которых управляется своей логикой, циклом производства и пространственным поведением.\nДобыча больше не тривиальна.\n[font=default-bold]Приобретение требует адаптации.[/font]\nПоймите категорию, иначе не произведете ничего.

stone=Камень
stone-text=Камень — самый распространенный ресурс в системе. Его можно добывать обычным способом из поверхностных залежей, но Exotic Industries расширяет пути его получения:\n\n[color=orange]Каменные карьеры[/color] [item=ei-stone-quarry] и [item=ei-electric-stone-quarry] позволяют вести глубокую добычу на любом ландшафте.\n\n[font=default-bold]Ручной сбор по-прежнему возможен, хотя и неэффективен.[/font]\nКамень повсюду.\nЭффективность опциональна. Результат — нет.

surface-patches= 
surface-patches-text= 

veins=Глубокие рудные жилы
veins-text=Рудные жилы недоступны в начале игры. Они требуют использования [color=orange]буров глубокого бурения[/color] [item=ei-deep-drill] — системы добычи середины игры, рассчитанной на вертикальную отдачу.\n\nЭти жилы обеспечивают большой объем продукции и предлагают лучшие коэффициенты переплавки по сравнению с поверхностными рудами.\n\nКритически важные материалы — включая уран, свинец, золото, неодим и иммерсит — существуют только в этих глубоких слоях.\nОни не опциональны.\nОни структурны.\n\n[font=default-bold]Поверхностная добыча не доведет вас до конца игры.[/font] Бурите, или стагнируйте.

artifacts=Инопланетные артефакты
artifacts-text=По всему миру разбросаны остатки древней цивилизации — той, что обуздала экзотическую материю задолго до вашего прибытия. Их артефакты остаются впаянными в ландшафт, частично погребенными, частично живыми.\n\nНекоторые инертны.\nНекоторые всё еще функционируют.\nНи один из них не случаен.
actifacts-text-2=Они не были просто положены. [font=default-bold]Их оставили — намеренно или нет.[/font] Найдите их. Изучите их. Бойтесь того, на что они намекают.

gate=Межпространственный шлюз
gate-text=Шлюз — это структура пространственного транзита, позволяющая переносить материю через контролируемый разлом измерений.\n\nБазовое потребление при работе составляет [color=orange]200 МВт[/color]. Эта мощность должна поддерживаться постоянно — падение ниже порога приводит к немедленному отключению.\n\nЧерез шлюз может проходить только неживая материя.\nДля транспортировки необходимо, чтобы выход Шлюза был направлен на валидный [color=orange]контейнер[/color] [item=wooden-chest][item=iron-chest].\n\nКаждый перенос потребляет энергию из внутреннего буфера Шлюза.\nВозврата средств нет.\nСтабильность — ваше бремя. Выравнивание — ваша ответственность.\nЭто не портал. [font=default-bold]Это машина, которая помнит, где она рвет ткань реальности.[/font]

drone=Дронопорт
drone-text=Дронопорт позволяет брать под контроль и управлять [color=blue]дроном[/color][entity=ei-drone]. Размещение этого здания создаст соответствующий дрон, который можно увидеть при нажатии на порт. Оттуда можно «подключиться» к дрону и управлять им. Дрон может летать над ландшафтом, ставить и сносить здания, перемещать предметы из своего инвентаря и в него. Однако он не способен сражаться. В любой момент вы можете отключиться от дрона, используя [color=orange]ВЫХОД[/color] (EXIT), или вернуть его на станцию с помощью управления возвратом [color=orange]СБРОС[/color] (RESET). Полет дрона через шлюз инициирует его транспортировку.

repair=Ремонт артефактов
repair-text=Вы можете чинить сломанные инопланетные артефакты, создавая [color=blue]ремкомплекты для артефактов[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. Это позволит вам использовать их снова. Процесс ремонта можно инициировать, перетащив ремкомплект на артефакт. Обратите внимание, что ремкомплект будет израсходован в процессе.

alien=Древние инопланетные данные
knowledge-text=Древняя цивилизация, оставившая после себя артефакты, также оставила часть своих данных.

new-logistics=Новая логистика
new-logistics-text=Exotic Industries расширяет логистический слой новыми системами, сущностями и механиками. Эти функции организованы в отдельные подкатегории — не для удобства, а для [font=default-bold]структурной ясности.[/font]\n\nДоступ к ним осуществляется через меню слева.\n\nПеремещение больше не является тривиальным.\n\nКаждый маршрут — это решение.\n\nКаждый поток — это проект.\n\nЭффективность [font=default-bold]заслуживается.[/font]

train-progression=Прогресс поездов
train-progression-text=Поезда становятся доступны рано, в Эпоху Пара. Вашим первым вариантом станет [color=orange]Паровоз[/color] [item=ei-steam-basic-locomotive] — способный перевозить предметы, но не предназначенный для жидкостей.\n\nПрогресс открывает [color=orange]Продвинутый паровоз[/color] [item=ei-steam-advanced-locomotive], в котором добавлена возможность перевозки жидкостей. Обе модели полагаются на сгораемое топливо, такое как уголь или твердая биомасса, с возможностью повышения характеристик за счет ракетного, ядерного или термоядерного топлива.\n\nСо временем сгорание грубой силы во всей его загрязняющей красе может стать недостатком.\n\nЧтобы эксплуатировать более элегантные и экологически чистые железнодорожные системы, вы должны перейти на [color=brown]Дизельное топливо[/color] [item=ei-diesel-fuel-unit], используемое [color=orange]Тепловозом[/color] [item=locomotive].\n\nЛогистика растет вместе с технологиями.\nТопливо определяет границы дозволенного.\nПоезда не спрашивают «куда» — они требуют то, что горит.\n\nМир Гайи не следует логике Наувиса.\n\nТам железные дороги не просто индустриальны — это электромагнитные каналы, пульсирующие кристаллической энергией. В глубинах Гайи вы откроете доступ к кристаллическим электромагнитным поездам [item=ei_em-locomotive][item=ei_em-cargo-wagon][item=ei_em-fluid-wagon], способным к бесшумному ускорению и поддержанию высокой скорости без использования обычного топлива.\n\nЭти поезда питаются напрямую от систем кристаллической зарядки [item=ei_charger], полностью обходя необходимость в угле или дизеле. Они не горят — они резонируют.\n\nГайя не работает на сгорании.\nОна работает на памяти, сигнале и свете.

spidertron=Изменения Паукотрона
spidertron-text=По сравнению с ванилью, [font=default-bold]Паукотрон становится доступен раньше[/font] — в Эпоху Симуляции. Однако, в отличие от своего аналога с Наувиса, он больше не является самодостаточным чудом. Ему требуется топливо.\n\nСначала будет достаточно твердого топлива — уголь, биомасса и подобные материалы заставят его ползти. Но по мере продвижения ядерное и термоядерное топливо откроют значительные бонусы к скорости, ускорению и дальности действий.\n\nЭто не просто транспорт. Это [font=default-bold]платформа для эскалации.[/font]\n\nТакие моды, как [color=green]Spidertron Patrols[/color] и [color=green]Constructron-Continued[/color], включают специальную интеграцию, адаптируя свои системы к измененной структуре Паукотрона в Exotic Industries.\n\nПаук начинает ходить раньше. Но он ходит с целью, весом и требованием.\n\nКормите его хорошо — или [font=default-bold]оставайтесь позади.[/font]

cranes-and-belts=Новые конвейеры и краны-манипуляторы
cranes-and-belts-text=Exotic Industries вводит новый уровень логистической инфраструктуры: [color=orange]Нео-логистический конвейер[/color] [item=ei-neo-belt]. Созданный из высокотехнологичных материалов, он обеспечивает экстремальную пропускную способность в [font=default-bold]90 предметов в секунду[/font], превосходя все ванильные лимиты. Эти конвейеры спроектированы для объемов конца игры и фабрик рекурсивного масштаба.\n\nКроме того, мод добавляет [color=orange]Краны[/color] [item=ei-big-inserter-normal] — массивные высокопроизводительные манипуляторы, предназначенные для массовой перевалки.\n\nИспользуйте их для:\n\nБыстрой разгрузки поездов\n\nСвязки крупных инвентарных структур (например, сундуки ↔ склады)\n\nПоддержания потока там, где стандартные манипуляторы не справляются под давлением\n\n[font=default-bold]Скорость больше не роскошь.\nЭто базовое требование.\nЛогистика должна расти вместе с мощностью, иначе она сломается под её тяжестью.[/font]

bots=Больше дронов
bots-text=Exotic Industries перерабатывает системы логистических и строительных дронов, добавляя специализированные варианты большой грузоподъемности и обновленную инфраструктуру поддержки.\n\nВы получите доступ к:\n\n[color=orange][font=default-bold]Тяжелым логистическим дронам:[/font][/color]\n\nМедленные, но способны перевозить большие пачки предметов — идеальны для массовой логистики и доставки на дальние расстояния в высокопроизводительных системах.\n\n[color=orange][font=default-bold]Тяжелым строительным дронам:[/font][/color]\n\nОптимизированы для быстрого персонального строительства. Эти дроны ставят скорость постройки выше эффективности, что делает их идеальными для агрессивной экспансии или экстренного восстановления.\n\nВ конце игры становятся доступны продвинутые варианты обоих типов дронов — с повышенной скоростью, прочностью и приоритезацией задач.\n\nНовый [font=default-bold][color=orange]Продвинутый дрон-станция[/color][/font] обеспечивает:\n\nБолее быструю зарядку\n\nУвеличенное количество слотов для дронов\n\nРасширенный радиус действия\n\nЭто не просто сеть дронов. [font=default-bold]Это протокол механизированного роя.\n\nРазвертывайте осознанно. Масштабируйте с целью.\n\nЭффективность больше не в движении — она в оркестровке.[/font]


new-mechanics=Новые игровые механики
new-mechanics-text=Exotic Industries вводит широкий спектр новых механик — каждая из них меняет фундаментальную логику игрового процесса.\n\nЭти системы разделены на тематические подкатегории для структурной ясности.\nВы можете перемещаться по ним, используя меню слева.\n\n[font=default-bold]Это не опциональные слои.[/font]\n\nЭто новая физика мира.\n\nИзучите их, или [font=default-bold]будете разобраны ими.[/font]


beacon-overhaul=Переработка маяков
beacon-overhaul-text=Exotic Industries накладывает строгие ограничения на влияние маяков: на одну машину может воздействовать максимум 4 маяка. [font=default-bold]Эра бесконечного суммирования окончена.[/font]\n\nКроме того, маяки сверх первого теперь требуют охлаждающую жидкость [liquid=ei-liquid-nitrogen] для работы. Без неё они перегреваются и отключаются. Электричество больше не является единственным источником функциональности — логистика должна поддерживать термодинамическую стабильность.\n\nЧтобы компенсировать это, маяки были структурно улучшены:\n\nУвеличена вместимость модулей\nВведен Улучшенный маяк\nСчитается за 2 маяка для лимита\nВмещает еще больше модулей\nТребует более серьезной инфраструктуры\n\n[font=default-bold]Усиление больше не тривиально.[/font]\nЭто механическая дисциплина.\nСтройте с точностью — иначе [font=default-bold]погрязнете в неэффективности.[/font]

specialised-pipes=Специальные трубы и кабели данных
specialised-pipes-text=Exotic Industries вводит специализированные системы инфраструктуры для работы в экстремальных условиях и продвинутой маршрутизации сигналов.\n\n[color=orange]Изолированные трубы[/color] необходимы для транспортировки летучих жидкостей, таких как [fluid=ei-liquid-oxygen], [fluid=ei-liquid-nitrogen] и [fluid=ei-heated-helium-3]. Эти жидкости должны оставаться в жидком состоянии — [font=default-bold]стандартные трубы вызовут фазовые переходы,[/font] делая их нестабильными или непригодными для использования.\n\n[color=orange]Кабели данных[/color] обеспечивают поток вычислительных сигналов высокой плотности между машинами. Они необходимы для работы продвинутых систем, таких как [color=orange]Компьютерное ядро[/color] [item=ei-computer-core] и [color=orange]Квантовый компьютер[/color] [item=ei-quantum-computer].\n\nТепло, фаза и данные теперь являются физическими ограничениями.\n\nВы не просто строите системы — [font=default-bold]вы обеспечиваете удержание.[/font]\n\nОшибка в маршрутизации означает отказ в работе.

space_destinations=Космические цели
space-destinations-text=Ракетную шахту [item=rocket-silo] можно использовать для отправки грузов в различные пункты назначения. При первом открытии в компьютерную эпоху вы сможете отправлять спутники только на [color=green]орбиту Наувиса[/color]. В зависимости от типа отправленного спутника или груза ракеты вы сможете получать данные или другие полезные продукты запуска.

space-destinations-2=Различные цели
space-destinations-2-text=По мере продвижения будут открываться различные цели внутри и за пределами вашей родной звездной системы. В зависимости от расстояния до выбранной цели потребуется больше или меньше ракетного топлива. Кроме того, некоторые цели нужно сначала обнаружить, либо отправив специальный [color=orange]исследовательский спутник[/color] [item=ei-exploration-satellite], либо случайно при отправке ракеты с обычным грузом. Некоторые новые цели могут находиться в глубоком космосе, [color=purple]за пределами звездной системы[/color]. Обратите внимание, что даже при отправке исследовательских спутников обнаружение новых целей всегда зависит от случая.

induction-matrix=Индукционная матрица
induction-matrix-text=[color=orange]Индукционная матрица[/color] — это многосоставная машина, предназначенная для хранения огромных объемов энергии. Её можно использовать для накопления избыточной мощности, как и обычные аккумуляторы, и последующей отдачи. Разные уровни размера матрицы открываются путем исследования соответствующих технологий.

induction-matrix-2=Компоненты индукционной матрицы
induction-matrix-2-text=Индукционная матрица — это модульная структура для хранения энергии, состоящая из взаимосвязанных компонентов, каждый из которых выполняет определенную роль в удержании и передаче высоковольтной энергии.\n\n[color=orange]Ядро индукционной матрицы[/color] [item=ei-induction-matrix-core] служит центральным контроллером системы. Без него матрица инертна. При подключении к логической сети ядро передает текущий заряд через signal-C, общую емкость через signal-T и максимальный ввод-вывод через signal-M. Эти сигналы появляются только когда ядро действительно подключено проводом к логической сети, и обновляются не чаще одного раза в секунду.\n\n[color=orange]Катушки индуктивности[/color] [item=ei-induction-matrix-basic-coil][item=ei-induction-matrix-advanced-coil][item=ei-induction-matrix-superior-coil] — они [font=default-bold]хранят энергию внутри себя[/font] и имеют три уровня улучшения. Катушки получают бонус к эффективности при размещении рядом с [color=orange]Матричным соленоидом[/color] [item=ei-induction-matrix-basic-solenoid].\n\n[color=orange]Матричные соленоиды[/color] повышают эффективность катушек при последовательном расположении. Размещение нескольких соленоидов подряд [font=default-bold]увеличивает эффективность[/font], но чрезмерное их количество приведет к снижению отдачи и напрасной трате ресурсов.\n\n[color=orange]Преобразователи[/color] [item=ei-induction-matrix-basic-converter][item=ei-induction-matrix-advanced-converter][item=ei-induction-matrix-superior-converter] — эти компоненты регулируют приток и отток мощности из матрицы, масштабируя пропускную способность в зависимости от уровня.

exotic-stabilizers=Машины экзотической материи
exotic-stabilizers-text=Экзотическая материя — это не ресурс, а полезная угроза. Работа с ней требует удержания, точности и оборудования, спроектированного так, чтобы пережить её летучесть.\n\n[color=orange]Сборщик экзотической материи[/color] [item=ei-exotic-assembler] — единственная структура, способная совладать с её энергетической сигнатурой. Даже в этом случае нестабильность неизбежна — сборщик может сдетонировать под нагрузкой.\n\nЧтобы снизить этот риск, размещайте [color=orange]Стабилизаторы экзотической материи[/color] [item=ei-matter-stabilizer] вокруг сборщика. Эти устройства подавляют возникновение критических сбоев и стабилизируют окружающее энергетическое поле. Некоторые из них можно найти разбросанными по миру — реликвии предыдущего цикла.\n[color=gray]Качественные стабилизаторы материи считаются за 3 x (Качество - 1) обычных стабилизаторов каждый.\nКачественные экзотические сборщики снижают шанс энтропийного каскада в секунду на (Качество - 1)%, то есть «Необычный» снижает базовый шанс с 12% до 11%.\n\nНе относитесь к экзотической материи просто как к очередному ингредиенту.\n\nОна [font=default-bold]живая, летучая и наблюдает за вами.[/font][/color]

black-hole=Генератор черной дыры
black-hole-text=[color=orange]Генератор черной дыры[/color] — это финальная машина, гравитационная сингулярность, поставленная на службу индустрии. Она поглощает материю. Она бросает вызов энтропии. Она завершает игру.\n\nДостижение [color=green]полной работоспособности[/color] этого устройства означает полное мастерство над системами. Это ваше условие победы. Не через завоевание, а через контроль над тканью реальности под слоем физики.\n\nЧтобы запустить Генератор черной дыры, вам потребуется:\nОгромное количество очищенных строительных материалов\nПостоянный приток расходного материала\nКолоссальная и стабильная энергетическая инфраструктура\n\nНастоятельно рекомендуется построить укрепленную сеть [color=orange]Термоядерных реакторов[/color] и дополнить её многоуровневыми [color=orange]Индукционными матрицами[/color], способными поглощать и отдавать мощность при промышленных масштабах пропускной способности.\n\nЭто не генератор. [font=default-bold]Это финал, сотканный из коллапса.[/font]\n\nСтройте мудро. [font=default-bold]Кормите его безжалостно.[/font] Второго шанса не будет.

black-hole-2=Компоненты реактора
black-hole-2-text=Генератор черной дыры — это не одно здание, а модульный массив удержания сингулярности, состоящий из нескольких высоконагруженных компонентов, каждый из которых критически важен для стабильности, потока энергии и финальной активации в конце игры.\n\nЦентральная структура — [color=orange]Генератор черной дыры[/color] [item=ei-black-hole].\n\nПосле активации он поглощает любой предмет, помещенный в его инвентарь, независимо от типа.\n\nКаждый предмет вносит одинаковый вклад во внутренний [color=green]счетчик массы[/color] генератора, который непрерывно затухает со временем. Для поддержания уровней массы требуется постоянный ввод.\n\nТип предмета не имеет значения.\nЖелезные плиты, экзотические процессоры или сырая рыба — всё пожирается, всё становится массой.\n\n[color=orange]Пилоны-инжекторы энергии[/color] [item=ei-energy-injector-pylon] поддерживают поле удержания по мере роста сингулярности.\nКаждый пилон потребляет 5 ГВт постоянной мощности.\n\nИнжекторы не требуются во время запуска — [font=default-bold]оболочка способна удержать новорожденную черную дыру[/font] — но становятся необходимыми по мере накопления массы.\n\n[color=orange]Пилоны-экстракторы энергии[/color] [item=ei-energy-extractor-pylon] позволяют извлекать мощность, как только генератор достигает [color=green]полной работоспособности[/color].\nКаждый экстрактор может забирать до 100 ГВт чистой энергии из стабилизированной сингулярности.\n\nИзвлечение невозможно, пока не будет достигнута финальная стадия работы генератора.\n\n[font=default-bold]Это не машина. Это ритуал коллапса.[/font]\nВы скармливаете массу [font=default-bold]связанной аномалии.[/font]\nЕсли вы не удержите её, она потерпит крах.\nЕсли вы не будете её кормить, она умрет.\n\nЕсли вы сделаете и то, и другое — [font=default-bold]она станет источником энергии для конца всех вещей.[/font]\n\nНет автоматизации без [font=default-bold]аннигиляции.[/font]

black-hole-3=Стадии черной дыры
black-hole-3-text=Запуск Генератора черной дыры — это поэтапный процесс с высоким уровнем риска. Каждая фаза повышает требования к энергии, массе и структуре. Пропускать шаги нельзя. Только вперед, иначе — провал.\n\n🜏 Фаза запуска\n\nПилоны не требуются.\n\nГенератор должен поглотить достаточно материала, чтобы достичь начальной массы в [color=blue]10×10³ кг[/color].\n\nТип предмета не важен — важен лишь объем.\n\nКак только масса достигает 100% прогресса стадии, генератор стабилизируется и переходит в Фазу удержания.\n\n🜏 Фаза удержания\n\nТеперь [color=blue]8 активных пилонов-инжекторов энергии[/color] [item=ei-energy-injector-pylon] должны оставаться в сети.\n\nКаждый потребляет 5 ГВт, итого общая потребность в мощности — 40 ГВт.\n\nНажатие кнопки расширения инициирует контролируемый рост радиуса сингулярности.\n\nЭто состояние должно поддерживаться непрерывно в течение [color=blue]60 секунд[/color].\n\nЛюбое прерывание — сбой питания, потеря пилона — сбрасывает таймер.\n\n🜏 Фаза полной работоспособности\n\nГенератор достигает стабильности. Сингулярность теперь достаточно велика, чтобы поддерживать внешнее извлечение энергии.\n\n[color=orange]Пилоны-экстракторы энергии[/color] [item=ei-energy-extractor-pylon], размещенные в радиусе действия, могут забирать до 100 ГВт на каждый пилон, напрямую питая вашу энергосеть.\n\nНа этой стадии система становится в значительной степени самодостаточной, требуя лишь постоянного ввода массы для компенсации затухания.\n\nВы не заправляете реактор топливом.\nВы управляете [font=default-bold]голодом связанной сингулярности.[/font]\nМасса становится силой. Сила становится контролем. [font=default-bold]Контроль становится финалом.[/font]\n\nВыключателя нет. Только удержание.

nuclear-fission-and-fusion=Ядерное деление и синтез
nuclear-fission-and-fusion-text=Exotic Industries расширяет уровень ядерной энергетики новыми механиками, материалами и системами контроля.\n\nЭти функции разделены на несколько подкатегорий, каждая из которых представляет собой определенный аспект ядерной инфраструктуры, динамики топлива или логики удержания.\nВы можете получить к ним доступ через меню слева.\n\n[font=default-bold]Это не просто деление.[/font]\nЭто эскалация через тепло, давление и необратимую реакцию.\n[font=default-bold]Изучите системы, прежде чем воспламенять их.[/font]

fission-reactors=Переработка систем ядерного деления
fission-reactors-text=Ядерное деление в Exotic Industries было перебалансировано и ужесточено, став более требовательной и вознаграждающей системой.\n\nСтандартный [color=orange]Ядерный реактор[/color] [item=nuclear-reactor] больше не получает ванильный бонус от соседства.\n\nВместо этого он обеспечивает [font=default-bold]повышенную базовую мощность на реактор[/font] — сила через плотность, а не через прилегание.\n\n[font=default-bold]Уран стал более дефицитным.[/font] Добыча идет медленнее, а выход продукции ниже. Эффективная ядерная инфраструктура должна учитывать долгосрочную нехватку топлива.\n\nОтработанные топливные элементы больше не являются мусором.\n\nСистема переработки с замкнутым циклом позволяет извлекать расщепляющиеся побочные продукты, которые могут быть переработаны во вторичные топливные элементы с повышенной эффективностью.\n\nОднако все процессы генерируют [color=brown]Ядерные отходы[/color] [item=ei-nuclear-waste] — стойкий побочный продукт, который необходимо безопасно удерживать, перерабатывать или изолировать.\n\nИх нельзя игнорировать.\n\nПренебрежение превращается в заражение.\n\nЯдерная энергия больше не является коротким путем к бесконечной энергии.\n\nЭто экономика высоких ставок: [font=default-bold]тепло, распад и мелиорация.[/font]\n\nИспользуйте её с умом — или [font=default-bold]захлебнитесь в её цене.[/font]

fission-reactors-2=Высокотемпературное деление
fission-reactors-2-text=[color=orange]Высокотемпературный ядерный реактор[/color] [item=ei-high-temperature-reactor] — это продвинутая система деления, разработанная для достижения максимальной тепловой мощности. Она превосходит стандартную ядерную инфраструктуру как по эффективности, так и по масштабу, но [font=default-bold]только при правильном обслуживании.[/font]\n\nКак только он будет доведен до критической рабочей температуры и обеспечен:\n\nПостоянным притоком [font=default-bold]жидкого свинцового теплоносителя[/font], а также\n\nКак минимум одним жизнеспособным топливным стержнем,\n\n…он начнет [font=default-bold]перегревать[/font] расплавленный жидкий свинец, превосходя по производительности обычные теплообменники и требуя установки специально созданного блока.\n\nВ отличие от традиционных реакторов, он также может использовать не расщепляющееся в обычных условиях [color=brown]Ториевое[/color] [item=ei-thorium-232-fuel] топливо — превращая отходы в источник энергии благодаря самой интенсивности конструкции.\n\nЭто не реактор для новичков.\n\nОн не терпит перерывов в снабжении.\n\nОн не масштабируется вниз.\n\nЭто двигатель давления для постчеловеческой индустрии — [font=default-bold]жестокий, эффективный и неумолимый.[/font]

fusion-power=Энергия синтеза
fusion-power-text=[color=orange]Термоядерный реактор[/color] [item=ei-fusion-reactor] — это энергетическая система позднего тира, способная генерировать колоссальную энергию путем контролируемого синтеза легких атомных топлив.\n\nОн работает по [font=default-bold]замкнутому циклу свинцового теплоносителя[/font], используя [fluid=ei-cold-coolant] и [fluid=ei-hot-coolant] для управления внутренними температурами. Без достаточного охлаждения целостность реактора будет нарушена — это не обсуждается.\n\nСтроительство ресурсозатратно и требует редких компонентов. После активации реактор [font=default-bold]требует[/font] непрерывной подачи термоядерного топлива.\n\nНачальные виды топлива включают:\n\n[color=blue]Литий[/color]\n\n[color=blue]Протий[/color]\n\nПо мере масштабирования инфраструктуры жизнеспособными становятся более продвинутые изотопы:\n\n[color=blue]Дейтерий[/color]\n\n[color=blue]Тритий[/color]\n\n[color=blue]Гелий-3[/color] — обеспечивающий экстремальную мощность при экстремальной стоимости.\n\n[font=default-bold]Синтез не является чистым. Он не является бесплатным.[/font]\n\nЭто машина, которая поедает легчайшие элементы, чтобы питать тяжелейшее бремя.\n\nКормите его бесконечно, иначе он умрет.\n\nОхлаждайте его постоянно, иначе умрете [font=default-bold]вы[/font].

fusion-power-2=Нейтроны и вы
fusion-power-2-text=Чтобы получить продвинутое термоядерное топливо, необходимо собирать [color=green]нейтроны[/color] и использовать их как ресурс.\n\nЭти свободные частицы генерируются через контролируемое [color=green][font=default-bold]ядерное деление[/font][/color] и [color=green][font=default-bold]термоядерные источники нейтронов[/font][/color], а затем улавливаются с помощью специальных [color=orange]Сборщиков нейтронов[/color] [item=ei-neutron-collector].\n\nВыход нейтронов зависит от:\n\nИнтенсивности близлежащего источника, а также от\n\nБлизости сборщика к зоне излучения.\n\nБольшее расстояние означает снижение скорости захвата. Оптимальная планировка требует жесткого удержания и точной геометрии реактора.\n\nНейтроны — это не побочный продукт. Это валюта.\n\nОни позволяют проводить очистку [color=blue]дейтерия[/color], [color=blue]трития[/color] и [color=blue]гелия-3[/color] — топлива для высоких стадий синтеза.\n\n[font=default-bold]Не тратьте их впустую.\nОни рождаются в реакции и собираются через геометрию.\nСтройте соответственно — или ваша звезда погаснет.[/font]

