[mod-setting-description]
ei-check-for-recipe-icons-improvement-mod=Проверять при загрузке/возрождении наличие [color=red]НАСТОЯТЕЛЬНО РЕКОМЕНДУЕМОГО[/color] мода Recipe Icons Improvement для Exotic Space Industries Remembrance от [color=orange]NaK1119[/color].\nСортирует рецепты/предметы/жидкости и изменяет их иконки, чтобы их было легче видеть и находить.\nОсобенности:\nПерерабатывает группы и порядок всех рецептов, предметов и жидкостей.\nИзменяет различные иконки для лучшей видимости.\nСкрывает ненужные рецепты и сущности из Факториопедии и GUI сигналов.\nКаждую функцию можно отключить в настройках запуска игры.\nДля сохраненной игры:\nВы можете добавлять и удалять этот мод в любые файлы сохранений. Однако, если вы установили рецепты по сигналам предметов/жидкостей (кроме сигналов рецептов), они могут измениться при применении/удалении этого мода.\nОГРАНИЧЕНИЕ:\nНЕ поддерживает Krastorio 2 Space Out.
ei-tech-scaling-maxCost=Максимальная стоимость [color=red]отдельного[/color] пакета науки за одну технологию.\n[color=pink]Воскресная прогулка[/color] — 207\n[color=white]Прогулка в парке[/color] — 415\n[color=#D2B48C]Почти бесплатно[/color] — 831\n[color=gray]Очень дешево[/color] — 1662\n[color=white]По умолчанию[/color] — 2500\n[color=cyan]Дешевле[/color] — 3325\n[color=blue]Дешево[/color] — 6750\n[color=yellow]Справедливая цена[/color] — 12500\n[color=orange]Менее дорого[/color] — 25000\n[color=red]Дорого[/color] — 50000\n[color=purple]Очень дорого[/color] — 100000\nFactorio в конечном итоге ограничивает внутренний множитель масштабирования до [color=red]x1000[/color], так что функциональный потолок будет неявно зависеть от начальной стоимости технологии. Например, начальная цена 10 x максимальный множитель 1000 = 10 000. Чтобы достичь стоимости «Дорого» (50 000), начальная цена должна быть 50.
ei-tech-scaling-curveForm=ВЫВОД ФОРМУЛЫ — Масштабирование стоимости технологий\nНастройка:\nТочка входа A = (0, C) → C = начальная цена\nТочка выхода B = (N, X) → X = макс. стоимость\nN = общее кол-во технологий, n = индекс текущей технологии\nФункции стоимости:\nЛинейная: cost(n) = (X − C) / N · n + C\nКвадратичная: cost(n) = (X − C) / N² · n² + C\nЭкспоненциальная: cost(n) = exp(n/N · ln(X + 1 − C)) + C − 1\nФормы множителя цены технологии (cost(n) / C):\nЛинейная: f_lin = (X − C) / (N·C) · n + 1\nКвадратичная: f_qua = (X − C) / (N²·C) · n² + 1\nЭкспоненциальная: f_exp = (exp(n/N · ln(X + 1 − C)) − 1) / C + 1\nИнтегрированная стоимость (всего пакетов науки):\nЛинейная: Area_lin = N/2 · (X + C)\nКвадратичная: Area_qua = N/3 · (X + 2C)\nЭкспоненциальная: Area_exp = N · (C − 1 + (X + 1 − C) / ln(X + 1 − C))\nПриближение для больших X:\nArea_exp ≈ N·X / 9\nArea_qua ≈ N·X / 3\nArea_lin ≈ N·X / 2\nОтносительная сложность:\nЭкспоненциальная < Квадратичная < Линейная.\nЭкспоненциальная медленно растет вначале и резко в конце; линейная резко растет вначале и замедляется в конце; квадратичная — промежуточный вариант.\n[color=red]Изменение этой настройки в середине игры может привести к нежелательным результатам.[/color]
ei-tech-scaling-startPrice=Переменная C для вывода формулы. Хотя её можно изменить после начала игры, возможны неожиданные результаты.
ei-tech-scaling-additionalMultiplier=Дополнительный финальный множитель к форме кривой.\nМожет быть безопасно изменен в [color=red]ЛЮБОЕ[/color] время.
ei-science-pack-yield-dark=Устанавливает результат выхода при создании пакетов науки [color=red]Тёмной[/color] эпохи.
ei-science-pack-yield-steam=Устанавливает результат выхода при создании пакетов науки [color=gray]Паровой[/color] эпохи.
ei-science-pack-yield-electricity=Устанавливает результат выхода при создании пакетов науки [color=blue]Электрической[/color] эпохи.
ei-science-pack-yield-computer=Устанавливает результат выхода при создании пакетов науки [color=yellow]Компьютерной[/color] эпохи.
ei-science-pack-yield-simulation=Устанавливает результат выхода при создании пакетов науки эпохи [color=green]Симуляции[/color].
ei-science-pack-yield-alien=Устанавливает результат выхода при создании пакетов науки [color=pink]Инопланетной[/color] эпохи.
ei-science-pack-yield-quantum=Устанавливает результат выхода при создании пакетов науки [color=purple]Квантовой[/color] эпохи.
ei-science-pack-yield-fusion-quantum=Устанавливает результат выхода при создании пакетов науки эпохи [color=cyan]Термоядерно-Квантовой[/color].
ei-science-pack-yield-exotic=Устанавливает результат выхода при создании пакетов науки [color=#00912E]Экзотической[/color] эпохи.
ei-science-pack-yield-black-hole=Устанавливает результат выхода при создании пакетов науки экзотической эпохи [color=black]Черной дыры[/color].
ei-em_updater_que=Отображать визуальный индикатор между или над ЭМ-поездами и зарядниками во время передачи энергии.
ei-em_updater_que_width=Настройка радиуса отображаемых колец.
ei-em_updater_que_transparency=Настройка прозрачности отображаемых колец. Диапазон 1->100 (Непрозрачный).
ei-em_updater_que_timetolive=Настройка длительности до исчезновения кольца.
ei-em_train_glow=Переключить эффект свечения при передаче электричества ЭМ-поездом.
ei-em_train_glow_timetolive=Тактов до затухания свечения поезда. Может суммироваться. Уменьшите это число для повышения производительности. 60 тактов = 1 секунда.
ei-em_charger_glow=Переключить эффект свечения при передаче электричества ЭМ-зарядником.
ei-em_charger_glow_timetolive=Тактов до затухания свечения зарядника. Может суммироваться. Уменьшите это число для повышения производительности. 60 тактов = 1 секунда.
ei-max_updates_per_tick=Количество обновлений на каждый тип сущности, выполняемых за такт.
ei-ticks_per_full_update=Настройка количества тактов, за которые обновляются все сущности EI.
ei-beacon-overload=Предполагаемое поведение. Устанавливает потолок количества маяков, которые могут влиять на любое отдельное здание (аналогично Space Exploration).
ei-barrel-capacity=Вместимость должна быть высокой, так как бочки теперь стакаются только по 1.
ei-solar-icon-scaling=Масштабирует все 3 уровня солнечных панелей как по занимаемой площади, так и по выходной энергии.\nМасштаб ниже 75% увеличит [color=cyan]гибкость[/color] размещения.\nМасштаб выше 75% позволяет [color=yellow]легче[/color] достичь заданного выхода энергии при тех же затратах ресурсов.
ei-nauvis-main-tracks-override=Позволяет заменяющему саундтреку Remembrance переопределять основные треки ванильного Наувиса.
ei-nauvis-interlude-tracks-override=Позволяет заменяющему саундтреку Remembrance переопределять интерлюдии ванильного Наувиса.

