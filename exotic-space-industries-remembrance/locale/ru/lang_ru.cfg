ei-default=Рекомендуемый способ игры в Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]. Ваше путешествие начинается на Наувисе, где расположены все основные ресурсы и начальная инфраструктура.\nЭто колыбель — истерзанная, знакомая и ограниченная.\nМатериалы конца игры и продвинутые системы ждут на отдельной поверхности, открывающейся позже по мере прогресса.\nВы покинете мир, который знали.\n[font=default-bold]И вы не вернетесь прежними.[/font]


