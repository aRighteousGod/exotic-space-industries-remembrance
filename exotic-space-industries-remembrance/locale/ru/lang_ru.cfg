ei-bio-chamber=Культивируйте инопланетные семена для выращивания биоулучшенных пластин — органических материалов, сплавленных с промышленными целями.\nНачальный запас семян скуден и должен быть собран с враждебной инопланетной флоры.\nОни не отдают свой геном добровольно.\nРост требует терпения. И крови.
ei-gate=Выкованный из инопланетных остатков и закрепленный невозможной геометрией, этот шлюз соединяется с фиксированным локусом в пространственных слоях.\nШлюз не ведет в другое место.\nОн ведет глубже.\nВ местность, слишком стабильную для снов и слишком враждебную для карт.\nВы не были созданы для того, что вас ждет.\nИспользуйте его всё равно.
