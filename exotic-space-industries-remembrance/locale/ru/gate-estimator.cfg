[gate-estimator]
route-snapshot=Фиксированный маршрут снимка
power-draw=Потребляемая мощность
title=Калькулятор шлюза
close=Закрыть
help-launch=Открывает отдельный калькулятор. Не изменяет настройки или груз настоящего шлюза.
snapshot=Считать состояние шлюза
help-snapshot=Копирует энергию, стресс, время остывания, качество и маршрут. Сохраняет выбранный груз и параметры подачи.
reset=Сбросить допущения
help-reset=Готовность: полный заряд, нет стресса и остывания, 1 предмет/с и питание 1 ГВт. Настоящий шлюз не меняется.
item=Предмет
help-item=Выберите доступный предмет. Предметы не расходуются. Качество груза не влияет на стоимость переноса.
batch=Размер стопки / максимум за загрузку
help-batch=Количество для расчёта одного переноса и максимум загрузки за такт симуляции. Шлюз отправляет доступные стопки, не дожидаясь этого количества; загруженное может объединяться.
stress=Стресс
help-stress=Начальный стресс отправителя, 0–100. Снижается на 1/с. Увеличивает содержание и время остывания, но не непосредственную стоимость переноса.
quality=Качество отправителя
help-quality=Качество видимого шлюза умножает расходы энергии на 1 / (1 + 0,2 × уровень качества). Качество груза и приёмника на скидку не влияет.
from=Планета отправления
to=Планета назначения
help-route=Две выбранные планеты фиксируют расстояние по звёздной карте. Одинаковая планета означает одну поверхность. Очистите один слот для ручного расстояния. Поверхности не создаются.
local=Одна поверхность
orbital=Одна точка, разные поверхности
distance=Межпланетное расстояние
unknown=Неопределённый межповерхностный путь
help-distance=Расстояние звёздной карты, не клетки и не длина космического маршрута. Одна поверхность ×0,15; одна точка на разных поверхностях ×2,5; неопределённый путь ×3.
rate=Предлагаемый поток предметов
help-rate=Постоянная подача. Заблокированные предметы ждут перед шлюзом; фактическая доставка может быть ниже. Доли накапливаются до целых предметов.
per-second=Предметов/секунду
per-minute=Предметов/минуту
power=Доступная мощность
help-power=Предполагаемое постоянное питание, а не измерение сети. Заряд ограничен мощностью приёма и свободной ёмкостью.
initial-state=Начальное состояние
help-initial-state=Редактируемые начальные значения. Груз и очередь симуляции изначально пусты. Настоящий шлюз не меняется.
energy=Запас энергии (ГДж)
help-energy=Начальный запас. Для работы нужно минимум 100 ГДж и достаточно энергии для оплаты следующей стопки целиком.
cooldown=Остывание (с)
help-cooldown=Начальное оставшееся время остывания в игровых секундах. Автозагрузка и перенос остановлены. Открытие входа ждёт следующего обслуживания шлюза.
saturation=Насыщение приёмника
help-saturation=Начальное значение 0–100. При 100 перенос останавливается, но загрузка может продолжаться. Спадает на 1,5/с. Выход и остатки считаются автоматически очищаемыми.
calculation=Расчёт
projections=Прогнозы
burden=Массовая нагрузка
help-burden=Вес из таблицы шлюза × количество. Для отсутствующих предметов вес 1. Это не ракетная масса.
distance-factor=Множитель расстояния
help-distance-factor=Межпланетный: 2,5 + 5,5 × (расстояние / максимальное расстояние карты)^0,6, ограниченное картой. Доля дальности = (множитель − 0,15) / 7,85.
quality-factor=Множитель качества
help-quality-factor=Только качество отправителя снижает энергию. Дополнительные уровни качества используют ту же формулу.
toll=Энергия переноса
help-toll=Сверхлинейная зависимость повышает удельную стоимость больших стопок. Округление вниз выполняется один раз после всех множителей.
per-item=Энергия переноса на предмет
help-per-item=Стоимость этого переноса, делённая на количество, без содержания. Цена зависит от размера стопки.
stress-result=Добавленный / итоговый стресс
help-stress-result=Не более 35 за перенос, общий предел 100. При 75 и выше, когда шлюз не остывает, консоль показывает критическое состояние.
cooldown-result=Остывание после переноса
help-cooldown-result=Использует итоговый стресс. Слагаемые в тактах округляются отдельно до перевода в секунды. Обслуживание, энергия и восстановление приёмника могут задержать следующий перенос.
saturation-result=Добавленное / итоговое насыщение
help-saturation-result=Масса добавляет до 20 насыщения с общим пределом 100. Качество отправителя не уменьшает этот штраф.
upkeep-result=Содержание после / до переноса
help-upkeep-result=В готовности: 30 МВт + 1,5 МВт на единицу стресса + 30 МВт при остывании, с множителем качества. Неактивные или недостаточно заряженные шлюзы не платят скриптовое содержание.
hardware=Ёмкость: __1__ ГДж · Предел заряда: __2__ МВт · Обслуживание: __3__ с
help-hardware=Нативные ограничения и фиксированный интервал из числа шлюзов и бюджета обновлений. Изменение количества шлюзов может изменить реальную частоту.
fallback=Предмет отсутствует в таблице массы шлюза; используется вес 1.
assumptions=Один активный отправитель, один предмет, один приёмник. Выход и остатки очищаются; других отправителей нет. Время игровое.
help-assumptions=Учитывает насыщение, содержание, объединение стопок, остывание и доступность энергии. Без порчи, повреждений, изменений схем, движения манипуляторов, конкуренции сети и движения маршрутов.
run=Рассчитать прогноз
help-run=Вычисляет сценарий и эталон. Работа ограничена и отменяема. Редактирование помечает прежние графики устаревшими.
minutes=__1__ мин
help-horizon=Длительность в игровых минутах, одинаковая для сравнения.
pin=Сохранить эталон
clear-baseline=Удалить эталон
help-pin=Сохраняет один независимый сценарий с начальным состоянием. Сплошная линия — текущий, пунктир — эталон. После изменения рассчитайте заново.
baseline=Эталон
pinned=Эталон сохранён
no-baseline=Эталон не задан
legend=Голубой: первый ряд · Оранжевый: второй · Сплошной: текущий · Пунктир: эталон
help-chart=Энергия: ГДж, красный порог 100 ГДж. Стресс: отправитель / приёмник, порог 75. Остывание: остаток / интервал. Поток: доставлено / предложено. Очередь: перед / внутри шлюза. Мощность: перенос / содержание. Вертикальные диапазоны сохраняют экстремумы.
throughput=Пропускная способность
queue=Ожидающий груз
axis=0–__1__ __2__ · Время 0–__3__ с
unit-1=ГДж
unit-2=%
unit-3=с
unit-4=предм./с
unit-5=предметы
unit-6=МВт
sample=__1__–__2__ с: __3__
help-sample=Переместите курсор времени. Показано конечное значение [минимум–максимум] интервала. Поток и мощность — средние за интервал.
summary=Доставлено: __1__ · Среднее: __2__ предм./с\nПеред шлюзом: __3__ · Внутри: __4__\nПеренос: __5__ ГДж · Содержание: __6__ ГДж · Средняя мощность: __7__ МВт\nМинимум энергии: __8__ ГДж · Пик стресса: __9__\nОжидание — остывание: __10__ с; энергия: __11__ с; приёмник: __12__ с\nСоздано остатков: __13__
help-summary=Причины ожидания могут пересекаться: их нельзя складывать. Энергия учитывает только расход. Остатки подсчитываются и удаляются. Предметы в очереди не теряются.
difference=Текущий − эталон: __1__ доставленных предметов; __2__ ГДж расхода
help-status=Разовый расчёт обновляется сразу. Прогнозы отражают последний запуск и помечаются при изменении. Настоящий шлюз не меняется.
running=Вычисление…
stale=Прогноз устарел — запустите снова
ready=Прогноз готов
invalid=Введите конечное число в допустимом диапазоне.
missing-prototype=Предмет, качество или планета недоступны. Выберите замену.
too-expensive=Стоимость этой стопки превышает ёмкость шлюза. Стопки не делятся для подгонки под доступную энергию.
