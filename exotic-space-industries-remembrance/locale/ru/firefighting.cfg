ei-extinguisher=Огнетушитель
ei-extinguisher-ammo=Баллон для огнетушителя

[item-description]
ei-water-turret=Использует воду и 100 кВт, чтобы замедлять врагов на 25% на 2 секунды без урона или автоматически тушить близкие пожары. Дальность: 24. Один импульс тушения расходует 15 воды. Приоритеты задаются в интерфейсе турели.
ei-extinguisher=Вручную убирает огонь и лужи кислоты в небольшой области. Требует баллоны для огнетушителя.
ei-extinguisher-ammo=Баллон для ручного огнетушителя. Ёмкость: 100.

