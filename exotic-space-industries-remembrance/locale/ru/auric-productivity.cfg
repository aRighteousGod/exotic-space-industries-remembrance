[technology-name]
ei-productivity-auric-precipitation=Продуктивность аурического осаждения

[technology-description]
ei-productivity-auric-precipitation=Каждый уровень повышает продуктивность промывки аурического шлака на 10 процентных пунктов. Дополнительные циклы дают только золото, без дополнительного шлака и грязной воды. Можно использовать модули продуктивности; общий предел всех бонусов продуктивности составляет +300%. Исследование можно продолжать бесконечно, но после достижения предела выход продукции больше не растёт.
