[entity-description]
tl-basic-tesla-coil=Катушка Теслы — это резонансный электрический трансформатор, переделанный для высокотоковых разрядов по ближайшим врагам.
tl-advanced-tesla-coil=Значительно улучшенная версия катушки Теслы.
tl-tesla-tank=Вариант танка, оснащённый двумя средними продвинутыми катушками Теслы.
ei-tesla-turret=Реконструированная имитация фульгоранского дугового оружия времён до Коллапса. Хотя лежащая в основе геометрия сверхпроводящих катушек понята лишь частично, эта башня-реплика может направлять контролируемые электрические разряды в сторону ближайших угроз. Мощность и эффективность остаются ограниченными по сравнению с подлинными фульгоранскими конструкциями, но турель обеспечивает надёжное подавление площади и высокий импульсный потенциал благодаря использованию современных материалов.

