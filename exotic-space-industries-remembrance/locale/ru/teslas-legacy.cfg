tl-advanced-attack-anim-simple=Искры

[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=Необязательный облегчённый путь. Использует собственную для TL доктринальную решётку как основной путь продолжения, держит мостовые помощники отдельно и убирает исходную вспомогательную рекурсию ради лучшего UPS.
ei-tl-behavior-mode-legacy-fidelity=По умолчанию. Точное поведение оригинального Tesla's Legacy. Возвращает старую вспомогательную рекурсию, постоянство помощников, очистку таймером, происхождение через урон, добивающие постразряды и поток волатильности танка независимо от цены в UPS.
tl-advanced-attack-anim-charge-up=При этой анимации яркая энергия поднимается вверх по сердечнику продвинутой катушки Теслы. Турель стреляет, когда энергия достигает вершины катушки. Иногда это может вызывать задержку с переназначением цели, если турель A убивает врага до того, как турель B завершит подготовку.
tl-advanced-attack-anim-simple=При этой анимации электрический ток начинает перескакивать между катушками, как только рядом появляются враги. Катушка стреляет сразу.

