ei-waveform-harmonics-1-effect=Гармоники формы волны I: согласованная семантика попадания и первый общий бонус моста.
ei-waveform-harmonics-2-effect=Гармоники формы волны II: для катушек Legacy и мостового тесла-семейства открываются современные семейства цепных добивающих разрядов.
ei-waveform-harmonics-3-effect=Гармоники формы волны III: полный язык последующих дуг из Space Age и более сильные цепи у мостовой турели.
ei-storm-lattice-1-effect=Штормовая решётка I: базовая катушка получает более широкое распространение полевых дуг и более чистую передачу цели.
ei-storm-lattice-2-effect=Штормовая решётка II: базовая катушка удерживает более плотные дуговые сети под тяжёлым давлением.
ei-storm-lattice-3-effect=Штормовая решётка III: базовая катушка становится настоящей башней подавления поздней игры.
ei-dielectric-rupture-1-effect=Диэлектрический разрыв I: продвинутые добивающие разряды сохраняют больше заряда после подтверждённого убийства.
ei-dielectric-rupture-2-effect=Диэлектрический разрыв II: продвинутые добивающие разряды бьют дальше и надёжнее поджигают.
ei-dielectric-rupture-3-effect=Диэлектрический разрыв III: продвинутые катушки превращают подтверждённые убийства в короткие казнящие бури.
ei-bridge-coupling-1-effect=Сцепление моста I: поздний урон мостовой линии растёт, не расплющивая ванильное тесла-семейство в доктрину TL.
ei-bridge-coupling-2-effect=Сцепление моста II: реплика фульгоранской башни наследует более тяжёлую позднюю награду мостовой линии.
ei-reactance-overdrive-1-effect=Реактивное форсирование I: танк Теслы расширяет окно волатильности и выбрасывает больше дуг насыщения.
ei-reactance-overdrive-2-effect=Реактивное форсирование II: танк Теслы удерживает более долгую перегрузку и более тяжёлый грозовой фронт разрядов.
ei-reactance-overdrive-3-effect=Реактивное форсирование III: танк Теслы достигает финальной жестокости двойной катушки эпохи термояда.
ei-exotic-waveform-convergence-effect=Экзотическая сходимость формы волны: катушки Legacy открывают экзотические ветвящиеся, исполнительные и грозофронтовые всплески, а реплика фульгоранской башни получает башенный экзотический послеударный всплеск.

