[technology-description]
tl-basic-tesla-coils-technology=Катушка Теслы — это резонансный электрический трансформатор, переделанный для высокотоковых разрядов по ближайшим врагам. Её прямой урон сравнительно невысок, но она может затрагивать несколько целей одновременно.
tl-advanced-tesla-coils-technology=Сильно улучшенная версия катушки Теслы. У неё больше дальность, намного выше урон и тяжёлая стальная защита для лучшей живучести.
tl-tesla-tank-technology=Смертоносный вариант танка с двумя средними продвинутыми катушками Теслы. Портативные катушки Теслы дают энергетический импульс, необходимый для одновременного выстрела обоих орудий.
ei-tesla-weapons=Технология обратной инженерии дугового оружия, извлечённая из фульгоранских исследовательских хранилищ времён до Коллапса. Хотя оригинальные принципы остаются понятыми лишь частично, инженеры реконструировали функциональную имитацию, способную проецировать стабильные электрические дуги в сторону враждебных целей. Мощность, эффективность и схема разряда уступают подлинным фульгоранским конструкциям, но всё же значительно превосходят обычное электромагнитное оружие. Дальнейшее совершенствование ограничено до тех пор, пока не будут расшифрованы подлинные фульгоранские чертежи.
tl-tesla-ammo-upgrade-technology=Развитие технологии портативной катушки Теслы выявило конструктивные слабости базовой катушки. Устранив их, можно получить более эффективные катушки Теслы и более широкий общий прирост их возможностей.
tl-tesla-coil-damage-technology=Эффективный урон молниеносной дуги катушки Теслы можно увеличить, установив более мощные конденсаторы и введя лёгкое колебание частоты тока.
tl-tesla-coil-shooting-speed=Недавние улучшения эффективности аккумуляторов можно перенести в конструкцию катушек Теслы, чтобы они быстрее достигали критической ёмкости и тем самым повышали скорострельность.
tl-flames-explosion-technology=Через разряды катушки Теслы проходит столько энергии, что они способны поджечь сам воздух. Короткая цепная реакция принимает форму яростного огненного взрыва.\n\nКаждый уровень «Извержения» увеличивает область действия взрыва.\n\nУрон: 60% от урона турели.
tl-flames-count-technology=Когда сухая почва и частицы пыли вспыхивают из-за крайне высокого уровня электрического тока, возникает удивительно яростная реакция горения. Пламя живёт всего несколько секунд, но создаёт опасный жар и выжигает всё дотла.\n\nКаждый уровень «Вспышки огня» увеличивает количество создаваемых языков пламени и их урон в секунду.
tl-flames-probability-technology=Экстремально концентрированная энергия может поджигать растительность на земле, частицы пыли или даже сам воздух.\n\nКаждый уровень «Воспламенения» повышает шанс поджечь цель катушки Теслы и ближайшее окружение.
tl-single-zap-count-technology=Когда существо поражает продвинутая катушка Теслы, оно может поглотить огромный объём статической энергии. Такая перегрузка способна разрушить носителя с ужасающей силой. Если после его гибели часть заряда всё ещё остаётся, она срывается к ближайшему сопротивлению. Это явление называется добивающим разрядом.\n\nКаждый уровень «Добивающего разряда» увеличивает количество таких разрядов, выпускаемых при убийстве врага турелью.
tl-single-zap-damage-technology=Если после разрушения цели остаётся электрический заряд, он превращается в добивающий разряд. Такой разряд несёт лишь часть исходного заряда, но остаточную энергию можно усилить, тонко настроив общий уровень резонанса катушки Теслы.\n\nКаждый уровень «Тяжёлой молнии» повышает урон добивающих разрядов.
tl-single-zap-probability-technology=Продвинутые катушки Теслы проводят невероятное количество электрической энергии. Если цель не способна удержать такой ток, он переливается через ионизированные молекулы воздуха отдельными молниями, которые поражают ближайшие объекты.\n\nКаждый уровень «Перегрузки» увеличивает вероятность появления дополнительных молниеносных дуг всякий раз, когда продвинутая катушка Теслы убивает врага.
tl-multi-zap-range-technology=Более сильные токи в катушках увеличивают количество ионизированных частиц в окружающем статическом поле. Из-за этого заряду легче проходить через воздух и достигать более далёких целей.\n\nКаждый уровень «Ионизации» увеличивает эффективную дальность распространения заряда.
tl-multi-zap-damage-technology=Точная настройка длины волны испускаемой концентрированной энергии позволяет формировать более стабильные и более разрушительные молниевые дуги, когда заряд распространяется по статическому полю.\n\nКаждый уровень «Молнии» увеличивает урон распространяющихся зарядов.
tl-multi-zap-probability-technology=Постоянное использование катушки Теслы насыщает окружающее пространство ионизированными частицами. Именно они позволяют направленному заряду пройти дальше исходной цели и перескочить на близлежащие объекты.\n\nКаждый уровень «Статического поля» увеличивает шанс распространения заряда на каждого ближайшего врага.
tl-slowdown-duration-technology=Более высокоэнергетические токи вызывают более сильные эффекты, которые дольше удерживаются в поражённой цели.\n\nКаждый уровень «Стойкости» увеличивает длительность эффектов «Электрошока».
tl-slowdown-multiplier-technology=Определённые уровни энергии в сочетании с высокими частотами могут вызывать мышечные спазмы, серьёзно мешающие движению.\n\nКаждый уровень «Оглушения» усиливает «Электрошок» и ещё сильнее замедляет цель.
tl-slowdown-probability-technology=Прямой контакт с электрическим током может вызывать физиологические и неврологические побочные эффекты вроде мышечных спазмов и паралича.\n\nБолее высокие уровни «Электрошока» делают эти побочные эффекты вероятнее при каждой атаке.
tl-volatility-modulation-technology=Ионизация — распространённый способ повысить эффективность военных систем, основанных на электрическом токе. Когда две катушки ионизируются чередующимися частотами, в энергетическом профиле возникает синергетический рисунок. Этот эффект, называемый бионизацией, сильно расширяет окно волатильности затронутого тока.\n\nКаждый уровень «Бионизации» снижает возможный минимум урона, одновременно заметно повышая возможный максимум.
tl-volatility-probability-technology=Волатильная природа тока двойной катушки доводится до предела встроенным регулятором амплитуды. На практике создаваемые молниевые болты получают достаточно энергии, чтобы полностью дезинтегрировать любое существо меньше квартиры среднего размера.\n\nКаждый уровень «Испарения» увеличивает шанс мгновенно убить цель. Цели с более чем 5000 здоровья вместо этого получают тяжёлое ранение.
ei-waveform-harmonics-1=Настраивает первый общий профиль разряда между катушками Legacy и мостовым тесла-семейством. Главная TL-внешность пока ещё остаётся прежней, но линия уже начинает говорить на одном электрическом диалекте: лучшее ощущение попадания, чище логика моста и первый прямой переход в теслаган, тесла-боеприпасы и реплику фульгоранской катушки.
ei-waveform-harmonics-2=Растягивает эту общую волну в современные семейства цепных добивающих разрядов. Базовые катушки получают гармонизированное распространение полевой дуги, продвинутые катушки переходят на модернизированные семейства послеударных разрядов, а мостовое тесла-семейство наконец получает настоящие цепные всплески.
ei-waveform-harmonics-3=Завершает гармонический позвоночник линии. Последующие дуги принимают полный цепной язык Space Age, мостовая турель получает более тяжёлую позднюю награду, а ветка Legacy наконец готова к настоящей доктринальной специализации, а не только к лестнице чисел.
ei-storm-lattice-1=Базовая катушка перестаёт быть просто «первой тесла-башней» и становится настоящей доктриной контроля. Штормовая решётка I улучшает передачу цели и расширяет сеть распространяемых дуг, чтобы рои вязли в поле, а не просачивались по краям.
ei-storm-lattice-2=Это уже не случайная россыпь дуг. Штормовая решётка II удерживает разветвлённую сеть под более тяжёлым давлением и позволяет базовой катушке передавать заряд через более широкий и плотный вражеский фронт.
ei-storm-lattice-3=Финальное состояние контрольной ветки базовой катушки. Штормовая решётка III доводит башню полевых дуг до позднеигрового подавления толпы: больше прыжков, больше дальность и более ясная личность «грозового занавеса».
ei-dielectric-rupture-1=Продвинутые катушки не предназначены для подавления целого фронта. Их задача — убить цель, а затем направить остаточный заряд к следующей жертве. Диэлектрический разрыв I усиливает эту доктрину, сохраняя больше полезной энергии в первом послеударном разряде.
ei-dielectric-rupture-2=Диэлектрический разрыв II продлевает жизнь цепочке послеударных разрядов и делает её охотнее поджигающей всё, к чему она прикасается. Продвинутая катушка остаётся палачом, а не копией базовой башни.
ei-dielectric-rupture-3=Поздняя продвинутая катушка становится настоящим оружием цепных казней. Диэлектрический разрыв III поднимает дальность, силу сохранённых дуг и профиль воспламенения так, чтобы одно подтверждённое убийство могло развалить плотную волну атаки.
ei-bridge-coupling-1=Мост к ванильному тесла-семейству нарочно остаётся сдержанным. Сцепление моста I поднимает поздний урон и наследование контроля для теслагана, тесла-боеприпасов и фульгоранской реплики, не превращая их в замаскированные TL-башни.
ei-bridge-coupling-2=Мостовая линия умышленно заканчивается перекосом в сторону турели. Сцепление моста II позволяет фульгоранской реплике унаследовать более плотный язык поздних послеударных разрядов, а ручное тесла-оружие остаётся легче и мобильнее.
ei-reactance-overdrive-1=Две продвинутые катушки на танковом корпусе никогда не собирались вести себя вежливо. Реактивное форсирование I расширяет окно волатильности и увеличивает число дуг насыщения, не превращая машину в ещё одну неподвижную башню.
ei-reactance-overdrive-2=Управление катушками эпохи термояда позволяет танку Теслы дольше держать перегрузку. Реактивное форсирование II ещё сильнее толкает его в образ грозового фронта: сильнее качает модуляцию, больше пролива и больше давления по краю ударной полосы.
ei-reactance-overdrive-3=Это финальное специализированное состояние танка. Реактивное форсирование III сохраняет его механическую отдельность от башен, но заставляет ощущаться как подвижный электрический фронт, а не как оружейная платформа с декоративной молнией.
ei-exotic-waveform-convergence=В финале доктрины башни Legacy перестают лишь заимствовать современный язык цепей и наконец получают собственные современные основные лучи. Базовая катушка становится башней ветвящейся полевой дуги и получает гарантированный боковой всплеск при каждом успешном основном попадании. Продвинутая катушка становится сфокусированным пилоном копья перегрузки, а каждое подтверждённое убийство дополнительно выпускает гарантированную экзотическую исполнительную бурю поверх обычной логики послеударных разрядов. Танк Теслы присоединяется лишь частично: его попадания получают соседнюю модернизацию разрядов, а положительные всплески волатильности могут запускать всплеск грозового фронта, не сплющивая машину в ещё одну башню. Реплика фульгоранской башни тоже получает башенно-эксклюзивный экзотический послеударный всплеск при подтверждённых убийствах, тогда как ручное тесла-оружие остаётся без него.

[exotic-industries-informatron]
menu_teslas_legacy=Tesla's Legacy
title_teslas_legacy=Tesla's Legacy
teslas-legacy=Арсеналы Tesla's Legacy
teslas-legacy-text=То, что раньше приходило как Tesla's Legacy, теперь встроено в родную доктрину электрического вооружения Remembrance. [item=tl-basic-tesla-coil]Базовая катушка Теслы, [item=tl-advanced-tesla-coil]продвинутая катушка Теслы и [item=tl-tesla-tank]танк Теслы сохраняют публичные имена, TL-корпуса и индустриальную идентичность, но ветка больше не висит сбоку как чужая лестница. Она идёт в ритме EI-прогрессии: сперва грубая полевая башня, затем более тяжёлый пилон казни, потом бронированный грозовой фронт.\n\nЛиния теперь также уходит мостом в ванильное семейство теслы. [item=teslagun]Теслаган, [item=tesla-ammo]тесла-боеприпасы и [item=tesla-turret]реплика фульгоранской катушки наследуют общий гармонический позвоночник, не сплющиваясь в замаскированные TL-башни.
teslas-legacy-2=Режим поведения
teslas-legacy-text-2=Режим поведения при запуске: [font=default-bold]__1__[/font]\n\n[font=default-bold]Верность Legacy[/font] теперь является путём по умолчанию. Это точный сердечник оригинального Tesla's Legacy: старая вспомогательная рекурсия, постоянные помощники, очистка по таймеру, наследование через урон, прямые добивающие послеразряды продвинутой катушки, огненные побочные эффекты одиночных разрядов и поток волатильности танка остаются без изменений. [font=default-bold]Гибридный[/font] — опциональный облегчённый путь. Он убирает старую TL-рекурсию из роли основного механизма продолжения, ставит на её место собственную TL-решётку помощников, а затем позволяет поздним гармоникам и доктрине поднимать над ней более богатые скрытые семейства помощников.\n\nДоктринальная лестница общая, но работает по-разному. В гибриде решётка доктрины становится основным поведением. В Верности Legacy исходное TL-поведение всегда срабатывает первым, а современные возможности накладываются уже потом.
teslas-legacy-3=Гармоники формы волны
teslas-legacy-text-3=Гармоники формы волны теперь стали общим позвоночником модернизации. До них катушки Legacy сохраняют свой исходный TL-визуальный язык. На гармонике I они начинают говорить тем же электрическим диалектом, что и мостовое семейство теслы. На гармонике II базовые и продвинутые катушки переходят к современным семействам дальнейших дуг. На гармонике III эти дуги полностью принимают язык цепей новой эпохи, а мостовая турель наконец получает плотный профиль поздних послеразрядов, которого ей давно не хватало.\n\nИменно здесь заканчивается старая несостыковка. Башни Legacy, фульгоранская реплика и ручное семейство теслы теперь делят осмысленную зону пересечения вместо того, чтобы молча игнорировать друг друга.
teslas-legacy-4=Квантовая специализация
teslas-legacy-text-4=После гармоник доктрина расходится чётко. [font=default-bold]Штормовая решётка[/font] принадлежит [item=tl-basic-tesla-coil]базовой катушке и превращает её в башню контроля роя: шире распространение, чище передача цели и более устойчивое подавление. [font=default-bold]Диэлектрический разрыв[/font] принадлежит [item=tl-advanced-tesla-coil]продвинутой катушке и заостряет послеразрядные удары, удержанный заряд и наследование воспламенения.\n\n[font=default-bold]Мостовое сцепление[/font] — поздняя специализация мостовой семьи. Оно усиливает обычное семейство теслы, не растворяя его идентичность в дорожках TL-башен. Фульгоранская реплика получает более тяжёлую награду со стороны турели, а ручное тесла-вооружение остаётся более лёгким.
teslas-legacy-5=Термоядерное форсирование
teslas-legacy-text-5=[item=tl-tesla-tank]Танк Теслы не делит напрямую квантовые специализации башен. Его поздняя доктрина — [font=default-bold]реактивное форсирование[/font], танковая линия эпохи термояда, сосредоточенная на насыщении двойной катушки, более широких окнах волатильности и большем проливе по полосе поражения. Машина остаётся механически отдельной от башен: меньше неподвижный пилон, больше грозовой фронт на гусеницах.\n\nОн также остаётся специалистом по волатильности всей линии. Критические всплески, модуляционные качели и испарение по-прежнему принадлежат танку так, как башни этого не делают.
teslas-legacy-6=Экзотическая сходимость
teslas-legacy-text-6=Последний шаг доктрины — [font=default-bold]экзотическая конвергенция формы волны[/font]. Она не заменяет TL-башни копиями из новой эпохи. [item=tl-basic-tesla-coil]Базовая катушка сохраняет своё импровизированное тело и становится современной [font=default-bold]башней ветвящейся полевой дуги[/font], которая при каждом успешном основном попадании выпускает одну гарантированную боковую вспышку. [item=tl-advanced-tesla-coil]Продвинутая катушка сохраняет высокий корпус-пилон и становится сфокусированным [font=default-bold]копьём перегрузки[/font], а каждое подтверждённое убийство дополнительно высвобождает гарантированную экзотическую исполнительную бурю. Их основные лучи наконец модернизируются, но боевые роли остаются раздельными.\n\nВ [font=default-bold]Верности Legacy[/font] эти высшие эффекты наслаиваются поверх исходного TL-субстрата. В [font=default-bold]Гибридном[/font] они венчают облегчённую доктринальную решётку. [item=tl-tesla-tank]Танк Теслы присоединяется лишь частично: всплески волатильности и испарения могут запускать серию грозового фронта, но машина всё равно остаётся бронированным грозовым членом семьи, а не ещё одной башней. [item=tesla-turret]Реплика фульгоранской турели тоже получает собственный башенный экзотический послеразрядный всплеск при подтверждённых убийствах, тогда как [item=teslagun]теслаган и [item=tesla-ammo]тесла-боеприпасы остаются на более лёгкой мостовой ветке.
teslas-legacy-7=Боевые уведомления и плавающий текст по умолчанию
teslas-legacy-text-7=Боевые уведомления остаются намеренно выборочными. Тексты [font=default-bold]критического попадания[/font] и [font=default-bold]испарения[/font] включены по умолчанию, чтобы исключительные события по-прежнему бросались в глаза. Обычный текст [font=default-bold]урона[/font] по умолчанию выключен, чтобы каждая перестрелка не рассыпалась в электрическое конфетти.\n\nЭтот баланс особенно важен теперь, когда в доктрине больше движущихся частей: прыжки распространения, цепи послеразрядов, мостовое сцепление, волатильность танка и финальная модернизация луча. Набор по умолчанию сохраняет читабельность самых драматичных моментов, не заливая поле боя шумом.
