[mod-setting-description]
ei-tl-behavior-mode=Выбирает, использует ли Tesla's Legacy более лёгкий гибридный режим исполнения или более прожорливый по UPS путь рекурсии «Верность Legacy».
tl-advanced-attack-anim=Меняет анимацию, которая используется, когда продвинутая катушка Теслы готовится к атаке.
tl-basic-sound-volume=Задаёт громкость звука выстрела катушки Теслы. 0 отключает этот звук, 70 сохраняет текущий уровень, 100 даёт полную громкость.
tl-advanced-sound-volume=Задаёт громкость звука выстрела продвинутой катушки Теслы. 0 отключает этот звук, 70 сохраняет текущий уровень, 100 даёт полную громкость.
tl-critical-multiplier=Когда происходит критическое попадание, исходное значение урона этого удара умножается на этот коэффициент.
tl-critical-chance=Вероятность критического попадания при атаках Tesla в процентах.
tl-flying-text-critical=Включает плавающий текст для успешного критического попадания.
tl-flying-text-vaporize=Включает плавающий текст для успешного мгновенного убийства технологией «Испарение».
tl-flying-text-damage=Включает плавающий текст для модулируемого урона танка Теслы из технологии «Бионизация».

