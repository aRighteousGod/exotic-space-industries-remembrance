[mod-setting-name]
ei-production-machine-lights=Индикаторы состояния производственных зданий

[mod-setting-description]
ei-production-machine-lights=Затрагивает 28 производственных зданий ESIR: 23 цветные линзы и источника света на существующих индикаторах 20 зданий. Восемь зданий без индикаторов не получают подсветку. В цветном режиме Bottleneck Lite пропускает только эти 20 зданий; его настройки цвета не меняют палитру ESIR. Технологические эффекты сохраняются во всех режимах. Рабочее свечение дуговой печи управляется отдельной настройкой мерцания. Линзы и свечение одного цвета: зелёного при работе, жёлтого при заполненном выходе, оранжевого при нехватке электричества и красного при остальных остановках с доступной энергией. Без энергии добавленные элементы невидимы. Возвращает 25 исходных белых источников рабочего освещения. Дуговая печь, плазменный нагреватель и литейная машина сохраняют исходные эффекты без дополнительных линз и подсветки. Работа Bottleneck Lite не меняется. Без дополнительных линз и подсветки состояния. Нарисованные на зданиях индикаторы и технологические эффекты сохраняются. Работа Bottleneck Lite не меняется.

[string-mod-setting]
ei-production-machine-lights-off=Выключено
ei-production-machine-lights-status=Цветные индикаторы
ei-production-machine-lights-original=Исходный белый свет

[string-mod-setting-description]
ei-production-machine-lights-off=Без дополнительных линз и подсветки состояния. Нарисованные на зданиях индикаторы и технологические эффекты сохраняются. Работа Bottleneck Lite не меняется.
ei-production-machine-lights-status=Линзы и свечение одного цвета: зелёного при работе, жёлтого при заполненном выходе, оранжевого при нехватке электричества и красного при остальных остановках с доступной энергией. Без энергии добавленные элементы невидимы. Затрагивает 28 производственных зданий ESIR: 23 цветные линзы и источника света на существующих индикаторах 20 зданий. Восемь зданий без индикаторов не получают подсветку. В цветном режиме Bottleneck Lite пропускает только эти 20 зданий; его настройки цвета не меняют палитру ESIR. Технологические эффекты сохраняются во всех режимах. Рабочее свечение дуговой печи управляется отдельной настройкой мерцания.
ei-production-machine-lights-original=Возвращает 25 исходных белых источников рабочего освещения. Дуговая печь, плазменный нагреватель и литейная машина сохраняют исходные эффекты без дополнительных линз и подсветки. Работа Bottleneck Lite не меняется.

