[mod-setting-name]
ei-beacon-diminishing-returns=Убывающая отдача маяков

[mod-setting-description]
ei-beacon-overload=Включено: машины останавливаются при превышении порога перегрузки. Медный маяк считается за 1, железный — за 2; инопланетные и варп-маяки исключены. Выключено: все четыре типа ESIR используют выбранный профиль убывающей отдачи.
ei-beacon-diminishing-returns=Действует только при отключённой перегрузке маяков. Каждый маяк, охватывающий машину, уменьшает все передаваемые маяками ESIR эффекты модулей, включая энергопотребление и загрязнение. Все типы считаются вместе, по одному; добавление слабого маяка может ослабить более сильные. Один маяк сохраняет полную силу. Вместимость модулей, качество, охлаждение и топливо не меняются.\nСила каждого маяка при 1 / 4 / 8 / 16 маяках:\n__1__\nБазовая кривая сохраняет параметры ESIR и общий подсчёт. Таблицы содержат 4096 значений; далее повторяется последнее.

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Мягкий
ei-beacon-diminishing-returns-vanilla=Базовая кривая
ei-beacon-diminishing-returns-strict=Строгий (по умолчанию)
ei-beacon-diminishing-returns-harsh=Жёсткий
ei-beacon-diminishing-returns-severe=Суровый
ei-beacon-diminishing-returns-saturating=Насыщение

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=Перегрузка включена: взвешенный предел 4 на машину. Медный маяк считается за 1, железный — за 2; инопланетные и варп-маяки исключены. Профиль убывающей отдачи не действует.
overload-disabled=Перегрузка отключена. Профиль: __1__. Все четыре типа ESIR имеют убывающую отдачу. Каждый охватывающий машину маяк считается один раз независимо от типа; слабые маяки могут уменьшить общий бонус.
