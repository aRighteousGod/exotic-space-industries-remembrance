chassis-hull-description=Общее улучшение: максимальное здоровье разведчика — __1__; штурмового и ракетного пауков — __2__. Сохраняет текущую долю здоровья.
chassis-cargo-description=Общее улучшение: __1__ ячеек багажника у разведчика; __2__ у штурмового и ракетного пауков.
chassis-fuel-description=Общее улучшение: инвентари топлива и отработанного топлива получают по __1__ ячеек у разведчика и по __2__ у двух других машин.
chassis-efficiency-description=Коэффициент эффективности топлива всех трёх машин становится равен __1__. Каждая единица топлива даёт больше полезной энергии для движения.
chassis-armor-description=Все три машины получают __1__ процентных пунктов сопротивления физическому урону и взрывам сверх своих базовых значений, но не более 90%. Фиксированное поглощение урона не меняется.
chassis-grid-description=Увеличенные сетки: разведчик — __1__; штурмовой паук — __2__; ракетный паук — __3__. Снаряжение сохраняется. После демонтажа используется хранимый вариант машины, позволяющий безопасно восстановить увеличенную сетку.
