[mod-setting-name]
ei-spider-range-aware-cycling=Переключение оружия паукотрона с учётом дальности

[mod-setting-description]
ei-spider-range-aware-cycling=При включённом переключении оружия выбирает орудия, способные поразить цель, и ведёт огонь продолжительными очередями. Периодически ищет цели поблизости. При отключении используется штатное переключение без поиска целей скриптом; разная дальность оружия может остановить переключение.

