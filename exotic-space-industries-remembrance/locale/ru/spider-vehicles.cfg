[entity-name]
ei-scout-spidertron=Паук-разведчик
assault_spidertron=Штурмовой паук
[entity-description]
ei-scout-spidertron=Трёхногая машина для разведки и логистики. Встроенного оружия нет; в сетку можно устанавливать персональные лазеры и другое снаряжение для брони. Получает общие улучшения шасси пауков.
assault_spidertron=Боевая машина эпохи симуляции с пушкой, пулемётом и огнемётом. Исследования добавляют артиллерию, улучшения оружия и автоматическую дымовую завесу. Получает общие улучшения шасси пауков.
[item-name]
ei-stored-spidertron=__1__ (сетка снаряжения __2__×__3__)
ei-assault-smoke-charge=Дымовой заряд штурмового паука
[item-description]
ei-assault-smoke-charge=Хранится в багажнике штурмового паука. После исследования машина расходует заряд при сильном попадании или когда после удара остаётся менее половины здоровья. Замедляет ближайших врагов на шесть секунд. Перезарядка: 30 секунд.
[technology-name]
ei-spider-vehicles=Шагающие пауки
ei-assault-spidertron=Штурмовой паук
ei-assault-smokescreen=Автоматическая дымовая завеса
[technology-description]
ei-spider-vehicles=Трёхногие пауки-разведчики с логистикой, дистанционным управлением и сеткой снаряжения. Открывает общие исследования шасси для разведывательных, штурмовых и ракетных пауков.
ei-assault-spidertron=Штурмовые пауки эпохи симуляции с одной пушкой, одним пулемётом и одним огнемётом. Открывает исследования их оружия и дымовой завесы.
ei-assault-smokescreen=Штурмовой паук расходует дымовой заряд из багажника, если вражеский удар снимает не менее 5% максимального здоровья или оставляет менее 50%. Неподвижное облако на шесть секунд замедляет на 35% до 64 подвижных врагов в радиусе восьми клеток. Перезарядка: 30 секунд. Не наносит урона и не даёт невидимости.
