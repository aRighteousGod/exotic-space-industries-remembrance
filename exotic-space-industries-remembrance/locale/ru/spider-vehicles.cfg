weapon-description=Улучшает это оружие у всех соответствующих пауков вашей стороны. __1__: интервал стрельбы — __2__ тиков; дальность — __3__ клеток; минимальная дальность — __4__. Использует существующие боеприпасы и обычные исследования их характеристик. Фактическая скорострельность также зависит от чередования оружия и модификаторов боеприпасов.
