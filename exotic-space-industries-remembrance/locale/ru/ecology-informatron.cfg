[ei-ecology-guide]
intro-heading=Присмотритесь к земле вокруг фабрики
intro=Фабрика оставляет после себя не только постройки. Загрязнение может разрушать естественную почву и лишать деревья цвета, а добыча — оставлять оголённые участки. Когда воздух становится чище, часть земли и леса получает возможность восстановиться. «Изменение ландшафта» также добавляет местные опасные явления и сезонный календарь с отдельными правилами для Наувиса, Гайи, Вулкануса, Глебы, Фульгоры и Аквило. Космические платформы, неизвестные планеты и не связанные с ними служебные поверхности не охватываются.\n\nНачните с раздела о почве: там объясняются её изменения, восстановление, добыча и действие крови. Раздел о лесах посвящён деревьям и огню, о берегах — воде и скалам. Раздел о сезонах объясняет календарь и различия миров. Настройки и отчёты помогут выбрать параметры и разобраться, почему изменения долго не появляются. Источником вдохновения послужили TerrainEvolution и TerrainEvolution2, но ESIR использует собственные ограничения обработки и правила защиты.
defaults-heading=С чего начинается новая настройка
defaults=В новой конфигурации экология и все её отдельные функции включены. Это касается восстановления новых следов добычи, старения деревьев, разложения сухостоя, изменения берегов, выветривания скал, действия крови, коррозии покрытий, сезонной активности и сезонного светового дня. Каждую функцию можно отключить отдельно, чтобы получить желаемый характер изменений.\n\n[font=default-bold]По умолчанию:[/font] Интенсивность — «Умеренная», профиль обработки — «Экономный». Для лесных пожаров выбран режим «Ограниченные»; «Распространяющиеся» включаются отдельно. Старые сохранения сохраняют свои настройки и явные переопределения поверхностей. Начальные значения не сбрасывают ваш выбор.\n\n[font=default-bold]Что учитывать:[/font] Даже включённой функции нужны подходящая почва или растительность, нужные условия и время, чтобы система добралась до участка. При случайном выборе проверка может не привести к изменениям. Включение разрешает явление, но не заставляет его происходить повсюду сразу.
observation-heading=Чистоту и загрязнение нужно подтвердить наблюдениями
observation=Система по очереди измеряет загрязнение на выбранных участках карты, называемых чанками, и использует каждое измерение для решений поблизости. Прежде чем считать условия устойчиво чистыми или загрязнёнными, нужны повторные измерения. Состояние давно не проверявшегося участка неизвестно; считать его здоровым оснований нет.\n\n[font=default-bold]По умолчанию:[/font] Для загрязнённых условий требуется не менее 100 загрязнения за пять минут наблюдений. Для чистых — не более 25 за десять минут. При значении строго между 25 и 100 оба периода наблюдения начинаются заново. Перерыв дольше 20 секунд игрового времени также прерывает подтверждённую непрерывность условий.\n\n[font=default-bold]Что учитывать:[/font] Отсутствие измерений или другой вид загрязнения не заменяют чистый воздух. Чем больше исследована карта, тем дольше её обход. Период наблюдения — условие для изменения, а не таймер, по окончании которого обязана измениться каждая клетка.
protection-heading=Оставляем место фабрике и особым участкам
protection=Обычные экологические изменения не затрагивают покрытия, отсыпку, фундаменты и закрытую ими почву. Защищены также машины и другая инфраструктура, призраки построек, действующие залежи, выращиваемые растения и их почвы, аурические владения, специально размещённые локации и неподдерживаемый ландшафт. Обычные подходящие дикие деревья и небольшие природные украшения сами по себе не делают участок промышленным.\n\n[font=default-bold]Что учитывать:[/font] Защита может распространяться за пределы самого препятствия. Изменения берегов и воздействия на природные объекты оставляют зазор как минимум в восемь клеток, даже если общий отступ меньше. Проверка повторяется непосредственно перед изменением, поэтому недавно построенная машина может остановить уже ожидавшую работу.\n\nДля коррозии есть узкое исключение: подходящие свободные дорожки и бетон. Берега меняются только между определёнными видами почвы и воды. Распространяющийся пожар может выйти за пределы проверенного места возгорания. Отключение функции прекращает новую активность; уже сделанные изменения обычно остаются, пока их не исправит подходящий процесс восстановления.
soil-heading=Загрязнение постепенно изнашивает почву
soil=При длительном промышленном загрязнении естественная почва может меняться по одному шагу. На Наувисе трава уступает место грунту, пустыне и песку. На других мирах используются собственные вулканические, болотные, каменистые или снежные виды местности. Снижение загрязнения может остановить дальнейший ущерб, когда условия перестанут подходить.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» исходный интервал проверки почвы — две минуты; базовая настройка составляет 60 секунд. Сезонная активность и задержки обработки влияют на то, когда будет проверен конкретный участок. Требование пяти минут наблюдаемого загрязнения сохраняется.\n\n[font=default-bold]Что учитывать:[/font] Проверка затрагивает небольшой участок, а не перекрашивает весь чанк. Максимальная глубина деградации ограничивает число записанных шагов изменения. У почвы, дошедшей до конца своей цепочки, следующего шага нет; каждая планета сохраняет свои виды ландшафта.
recovery-heading=В чистых условиях записанный ущерб может отступить
recovery=Чистый воздух даёт повреждённой земле возможность восстановиться. ESIR запоминает сделанные им изменения и проходит их в обратном порядке, шаг за шагом, к точному исходному виду почвы. Если трава стала грунтом, а затем песком, восстановление проследует по сохранённым шагам, а не выберет произвольную травяную клетку.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» интервал восстановления — восемь минут; базовая настройка составляет 240 секунд. Этот базовый интервал вчетверо длиннее базового интервала изменения почвы. Также нужны десять минут чистых наблюдений; эти требования могут выполняться одновременно. Интенсивность меняет интервал восстановления, сезонная активность — нет. Ни один из интервалов не гарантирует немедленного результата.\n\n[font=default-bold]Что учитывать:[/font] Восстановлению нужна достоверная запись ущерба, нанесённого ESIR. Строительство поверх почвы или её замена другой системой могут сделать запись непригодной; последующее снятие покрытия не воссоздаст её. Нельзя восстановить старую незаписанную почву или береговую линию, заново построить скалы либо оживить уничтоженные деревья.
depletion-heading=Истощённая залежь может оставить след
depletion=Когда конечная залежь заканчивается, открытая почва поблизости может пострадать. Место истощения должно находиться в зоне добычи твердотопливной, паровой или электрической карьерной установки либо большого бура, работающего с этой категорией ресурсов. Учитываются изменения зоны добычи от качества. Обычные буры и бесконечные залежи не подходят.\n\n[font=default-bold]По умолчанию:[/font] В пределах радиуса воздействия в 56 клеток выбирается участок с собственным радиусом в три клетки. Каждая подходящая позиция на нём имеет 70% вероятности измениться. Оставшаяся руда и защищённая почва сохраняются.\n\n[font=default-bold]Что учитывать:[/font] Причина запуска — исчерпание залежи; событие истощения не сообщает ESIR, какой бур её исчерпал. Важно покрытие подходящим буром. Участки обрабатываются постепенно, поэтому след может появиться уже после остановки установки. Массовое истощение может объединять близкие запросы или мешать принимать новые, но уже принятый запрос не удаляется только потому, что долго ждал.
working-heading=Работающие карьеры тоже оставляют следы
working=Подходящая карьерная установка или большой бур могут оставлять следы и во время добычи конечной залежи. Установка должна быть активна, показывать состояние «Работает» и иметь действительную конечную цель добычи на той же поверхности. Это отдельный источник следов, помимо истощения. Простаивающие буры таких следов не создают.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» исходный промежуток между попытками — десять минут; базовая настройка составляет 300 секунд. Каждая попытка с вероятностью 10% запрашивает участок повреждения. Затем на нём отдельно действует вероятность 70% для каждой подходящей позиции. Сезоны и задержки обработки могут менять время проверок.\n\n[font=default-bold]Что учитывать:[/font] Оставшаяся руда защищена, поэтому след может образоваться на открытой земле рядом. ESIR ведёт ограниченный список тех же четырёх семейств буров и обновляет его при создании и удалении установок; простаивающие буры могут оставаться в списке. Запоздалая проверка делает одну текущую попытку, не повторяя пропущенные. Отключение экологии на поверхности приостанавливает проверки и применение ожидающих следов.
mining-recovery-heading=К какой почве возвращается след добычи
mining-recovery=Восстановление следа добычи стремится вернуть почву, существовавшую непосредственно перед его появлением. Если загрязнение уже превратило траву в грунт, восстановление после добычи может вернуть участок к грунту. Запись добычи заменяет старую последовательность экологического восстановления, поэтому более раннюю траву по ней вернуть нельзя. Последующие записанные повреждения от добычи по-прежнему можно проследить назад.\n\n[font=default-bold]По умолчанию:[/font] Восстановление новых записанных следов добычи включено. Должны быть включены и общее восстановление почвы, и восстановление следов добычи; также нужны чистые наблюдения и сохранившаяся действительная запись.\n\n[font=default-bold]Что учитывать:[/font] Повреждения, возникшие при отключённом восстановлении добычи, постоянны. Позднее включение не восстановит эти незаписанные следы. Отключение экологии на поверхности приостанавливает уже принятую работу по добыче; повторное включение продолжает её в обычных пределах обработки, без потока пропущенных попыток.
blood-heading=Кровь чужих может помочь земле восстановиться
blood=После гибели вражеского существа или гнезда действие крови может вернуть ближайшую почву на один шаг назад по записи повреждений. Это прямое восстановление: оно может сработать без ожидания обычного периода чистых наблюдений. Нужны действительная запись ущерба ESIR, включённые соответствующие функции и соблюдение обычной защиты. Для следов добычи также требуется их восстановление.\n\n[font=default-bold]По умолчанию:[/font] Подходящая гибель с вероятностью 10% позволяет принять небольшой местный участок в обработку. Изменения выполняются позднее, когда система может выделить на них время.\n\n[font=default-bold]Что учитывать:[/font] Труп не гарантирует восстановление и не оставляет постоянного целебного поля. Если записи нет, эффект не может придумать прежний вид земли. Он отделён от видимых эффектов смерти в бою; высокая нагрузка может ограничивать приём новых участков.
paving-heading=Кровь может разъедать открытое покрытие
paving=Если включены и действие крови, и коррозия покрытия, участок вокруг погибшего врага может потерять подходящую каменную дорожку или бетон, открыв сохранённую под ними клетку. Доступный шаг восстановления почвы имеет приоритет; покрытие рассматривается, когда такого восстановления нет. Отключите эту функцию, если хотите сохранить подходящее открытое покрытие целым.\n\n[font=default-bold]По умолчанию:[/font] Коррозия проверяется с вероятностью 1% после успешной проверки приёма эффекта крови. Это шанс внутри принятого участка, а не вероятность 1% для любого убитого врага в любом месте.\n\n[font=default-bold]Что учитывать:[/font] Занятые или иначе защищённые покрытия и фундаменты исключены, а лежащая под ними клетка должна быть известна и действительна. Это особое исключение из обычной защиты покрытия. Удалённое покрытие не возвращается предметами и не восстанавливается. Отключение действия крови прекращает новые попытки коррозии, даже если её собственный переключатель остаётся включённым.
stress-heading=Загрязнение может сделать дикие деревья серыми
stress=Подходящие дикие деревья могут терять цвет после длительного загрязнения. Они остаются живыми и на месте; посерение отличается от сгорания или превращения в сухостой. ESIR помнит исходную степень окраски и внесённое угнетение, чтобы позднее обратить его. Выращиваемые растения, особая флора, защищённые локации и неподдерживаемые виды остаются нетронутыми.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» исходный интервал проверки угнетения — десять минут; базовый — пять минут. Интенсивность, сезонная активность, охват наблюдений и ограниченный поиск деревьев влияют на время проверки конкретного дерева. Требование наблюдаемого загрязнения сохраняется.\n\n[font=default-bold]Что учитывать:[/font] Полностью серое дерево не может посереть ещё сильнее. Если другая система изменит записанную степень окраски дерева, ESIR может отказаться от записи, сохранив новый внешний вид.
greening-heading=Угнетённое дерево может вернуть свой цвет
greening=Если достаточно долго удерживать загрязнение низким, дерево, угнетённое ESIR, может постепенно вернуть первоначальный вид. Природно серое дерево сохраняет естественный цвет. Нужны то же живое дерево, ожидаемая записанная степень окраски и длительные чистые наблюдения.\n\n[font=default-bold]Что учитывать:[/font] Рубка, замена или уничтожение дерева прекращают эту возможность. Возвращение цвета относится к функции угнетения деревьев, которая ведёт собственные записи. Оно отделено от восстановления почвы, возобновления леса, старения и разложения. Здоровый вид земли не обещает возвращения её прежних деревьев, а восстановление одного дерева не доказывает готовность всех соседних участков.
regrowth-heading=Лес медленно разрастается от сохранившихся деревьев
regrowth=После длительных чистых условий подходящее дикое дерево может дать начало новому дереву рядом. Сохранив часть местного леса, вы оставляете отправную точку для возобновления. Новому дереву нужны подходящая почва и разрешение защитных проверок; на Гайе вид выбирается по местному биому. Выращиваемые культуры для этого никогда не используются.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» исходный промежуток между возможностями роста — двадцать минут при базовом интервале десять минут, до сезонных изменений и задержек обработки. Новая позиция может отстоять до восьми клеток по каждой из осей карты. Рост подавляется, если в пределах четырёх клеток по каждому направлению уже есть 16 подходящих природных деревьев. Между успешными появлениями новых деревьев на всех поверхностях выдерживается не менее десяти секунд.\n\n[font=default-bold]Что учитывать:[/font] Это медленное местное распространение леса. Изолированная вырубка без подходящего сохранившегося дерева-источника может остаться пустой. Нужны чистые измерения, свободное место и своя очередь на обработку; интервал не обещает, что каждое дерево даст новое.
aging-heading=Старение заменяет живое дерево сухостоем
aging=Старение может удалить подходящее живое дерево Наувиса и заменить местным сухостоем. Оно работает независимо от угнетения загрязнением, поэтому может быть выбрано и зелёное дерево. Отключите старение, если хотите сохранять живые деревья до тех пор, пока их не уберёт другая причина.\n\n[font=default-bold]По умолчанию:[/font] Старение включено. При интенсивности «Умеренная» исходный интервал — два часа при базовой настройке один час; сезонная активность меняет время проверок. Проверяется обследуемый участок, а не отсчитывается неизменный срок жизни каждого нового дерева.\n\n[font=default-bold]Что учитывать:[/font] Пока подходящая замена сухостоем существует только на Наувисе. Защитные проверки сохраняются. Потеря живого дерева постоянна: восстановление цвета не оживит его. Само старение не вызывает пожар.
rot-heading=Сухостой постепенно исчезает
rot=Разложение со временем убирает подходящие мёртвые деревья. Оно может расчистить старые остатки леса, но не заменяет их живыми деревьями. Новый лес поблизости может появиться благодаря отдельной функции возобновления. Старение и разложение можно переключать независимо.\n\n[font=default-bold]По умолчанию:[/font] При интенсивности «Умеренная» исходный интервал разложения — час при базовой настройке тридцать минут. Интенсивность, сезонная активность и охват обработки влияют на то, когда система доберётся до участка.\n\n[font=default-bold]Что учитывать:[/font] Удалённый сухостой не записывается для восстановления. Неподдерживаемые виды, защищённые места и выращиваемая флора исключены. У разложения собственное расписание, поэтому поздний обход не повторяет сразу все проверки, пропущенные во время отсутствия наблюдений.
thermal-heading=Сгоревшее дерево может оставить повреждённую почву
thermal=Дерево, погибшее от подходящего огневого урона, может оставить небольшой повреждённый участок на прежнем месте. Почва меняется по правилам своей планеты и может быть записана для последующего восстановления. Чистые условия способны восстановить землю, хотя само дерево уже потеряно.\n\n[font=default-bold]Что учитывать:[/font] Нужен подходящий источник огня, и обычная защита почвы сохраняется. Такие смерти могут вызывать и боевые, и самопроизвольные лесные пожары. Выжженный участок — реакция на гибель дерева; он не зажигает новое пламя. Поэтому защищённая площадка с машиной может остаться нетронутой, даже когда рядом горит дерево.
wildfire-heading=Выберите ограниченный или распространяющийся пожар
wildfire=Промышленное загрязнение иногда может вызвать огонь рядом с подходящими дикими деревьями. Нужны загрязнение не ниже верхнего порога, подходящая растительность поблизости и незащищённое место возгорания. Измерение ниже порога прекращает приём новых запросов на лесной пожар в этом месте; ранее принятая попытка возгорания ещё может ждать обработки. Функция не ждёт пяти минут наблюдаемого загрязнения, необходимых почве.\n\n[font=default-bold]По умолчанию:[/font] Выбран режим «Ограниченные». При интенсивности «Умеренная» исходный интервал опасных явлений — двадцать минут при базовых десяти минутах. Подходящая возможность лесного пожара даёт 1% вероятности попытки возгорания; сезоны, очередь других опасных явлений и охват могут задержать её ещё сильнее. Это не шанс для каждого дерева каждую секунду. Первичные возгорания на всех поверхностях ограничены одним за десять секунд и 16 хранимыми записями огня.\n\n[font=default-bold]Что учитывать:[/font] «Ограниченные» создают нераспространяющееся наземное пламя длительностью не более десяти секунд. «Распространяющиеся» запускают обычный пожар дерева Factorio; последующее пламя может выйти за пределы проверенной области и занять время движка за пределами скриптовых ограничений экологии. Отключение экологии удаляет её ограниченное пламя, но не трогает посторонние боевые пожары и дальнейшее распространение. Оповещение о пожаре подтверждает создание возгорания, а не сгоревший лес.
flood-heading=Вода может наступать на песчаный берег
flood=На Наувисе затопление может превращать подходящий песчаный берег в воду рядом с существующей подходящей пресной водой. Ожидайте небольших местных изменений берега. Эффект не затрагивает лаву, нефтяные и аммиачные океаны, а также произвольную землю вдали от подходящего берега.\n\n[font=default-bold]По умолчанию:[/font] Каждая возможность затопления имеет шанс 2%. Время зависит от интервала опасных явлений, интенсивности, сезонной активности и охвата обработки. Дождь, низкое загрязнение и видимая погода не требуются.\n\n[font=default-bold]Что учитывать:[/font] Подходящий берег прямо к северу, югу, востоку или западу позволяет принять первоначальный запрос. Перед изменением клетки система проверяет допустимость перехода из почвы в воду и сохранение разрешения защиты. Записанное затопление может отступить, пока запись повреждения действительна; одно лишь отключение затопления не осушает воду немедленно. Это местное движение береговой линии, а не общее моделирование уровня моря.
drought-heading=Вода может отступать от песчаного берега
drought=На Наувисе засуха может превращать подходящую пресную воду в песок рядом с подходящим песчаным берегом. Вдоль побережья может появиться немного больше открытой земли. Другие планетарные жидкости исключены, а вода без требуемого соседства с берегом не подходит.\n\n[font=default-bold]По умолчанию:[/font] Каждая возможность засухи имеет шанс 2%. Время определяется интервалом опасных явлений, интенсивностью, сезонной активностью и охватом обработки, без отдельного требования сильного загрязнения или погоды.\n\n[font=default-bold]Что учитывать:[/font] Инфраструктура, действующие ресурсы и особые места защищены. Ожидающее изменение может перестать подходить ещё до применения. У затопления и засухи отдельные переключатели; совместное включение разрешает противоположные местные изменения со временем. Они не моделируют температуру или осадки и не заставляют берег немедленно ходить туда и обратно.
cliff-heading=Выветривание может убрать обычную скалу
cliff=Выветривание может удалить подходящую обычную скалу после проверки защиты поблизости. Природная преграда исчезнет навсегда. Отключите функцию, если хотите сохранять скалы до самостоятельного удаления.\n\n[font=default-bold]По умолчанию:[/font] Возможность выветривания имеет шанс 1%. Загрязнение, осадки, боевой урон или измеренный возраст скалы не требуются.\n\n[font=default-bold]Что учитывать:[/font] Особые планетарные семейства скал не подставляются вместо поддерживаемой обычной скалы. Близкая инфраструктура или защищённое место могут запретить удаление даже после обнаружения скалы. Восстановление почвы не построит её заново.
calendar-heading=У каждого мира свой календарь
calendar=У каждого поддерживаемого мира есть сезонный календарь. Удалённые от звезды миры обычно имеют более длинные годы, рассчитанные по расстояниям на звёздной карте. Календарь упорядочивает сезонные изменения; он не перемещает планеты и не меняет маршруты. Сезон подъёма, высокий сезон, сезон спада и низкий сезон — названия его четырёх частей, а не обещание определённой погоды.\n\n[font=default-bold]По умолчанию:[/font] Опорный год равен 360 суткам Наувиса, с длительностью суток, сохранённой при запуске календаря. Для года другого мира это значение умножается на отношение его расстояния к расстоянию Наувиса, возведённое в степень 1.5. Ориентация на звёздной карте задаёт исходное положение в году. Позднейшие изменения системы суток Наувиса не переопределяют эту основу постоянно.\n\n[font=default-bold]Как пользоваться календарём:[/font] Календарная панель администратора показывает опорные сутки, равнозначное количество местных суток и игровую длительность. Изменение длины года сохраняет положение внутри сезона. Администратор также может менять его для предварительного просмотра.
daylight-heading=Меняется светлая часть суток, а не все сутки
daylight=Сезонный световой день удлиняет или сокращает дневной свет внутри существующих суток планеты. Представьте смещение восхода и заката при неизменном времени полного оборота. Это меняет длительность освещения солнечных панелей. Сумерки сохраняют прежнюю продолжительность.\n\n[font=default-bold]По умолчанию:[/font] Подходят Наувис, Гайя, Вулканус, Глеба и Аквило. Принятый наклон оси — 23.5 градуса, широта — 45 градусов. Даже при крайних настройках минимум 2% цикла остаются полным днём и 2% — полной ночью.\n\n[font=default-bold]Что учитывать:[/font] Замороженное время суток или постоянный день приостанавливают сезонную настройку. ESIR также уступает Diurnal Dynamics или другой системе, меняющей те же параметры рассвета и заката. При отключении исходные настройки возвращаются, только если последнее изменение ESIR всё ещё нетронуто. Независимая система суток Фульгоры сохраняет полный контроль: сезонный световой день никогда не меняет и не восстанавливает её границы.
modulation-heading=Сезоны могут менять темп экологических процессов
modulation=Сезонная активность делает изменения почвы, эффекты деревьев, опасные явления и возможности следов работающих буров более или менее частыми в течение года. Она может действовать при отключённом сезонном световом дне или внешнем управлении светом, в том числе на Фульгоре. Изменение темпа не меняет вероятность успеха отдельной попытки.\n\n[font=default-bold]По умолчанию:[/font] Сила — 25%. Частота плавно растёт до 125% основы выбранной интенсивности возле высокого сезона и падает до 75% возле низкого. Более высокая частота сокращает интервалы, более низкая удлиняет их.\n\n[font=default-bold]Что учитывать:[/font] Сезоны не включают отключённые опасные явления, не меняют требования чистых или загрязнённых наблюдений и обычный интервал восстановления почвы. Для роста по-прежнему нужны чистые измерения, подходящее дерево-источник, место и время на обработку. Календарь не перемещает планеты и не перекрашивает мир под сезон. Зимний цвет кнопки — указатель, а не обещание снега.
nauvis-heading=Наувис: почва, песок и лес
nauvis=Земля Наувиса может проходить через траву, грунт, пустыню и песок; восстановление ведёт записанные участки к их точному первоначальному виду. Подходящие местные деревья могут проявлять угнетение, возвращать цвет и давать новый лес. Наувис также первым поддерживает изменение пресноводных берегов и единственный имеет замену живого дерева сухостоем при старении.\n\n[font=default-bold]Что учитывать:[/font] Покрытые участки фабрики, действующие ресурсы, инфраструктура и особые места защищены. Подходящая коррозия — явное исключение для открытого покрытия.
gaia-heading=Гайя: сохраняем характер местного ландшафта
gaia=Луга и болота Гайи могут изнашиваться до обнажённой породы Гайи. Восстановление идёт назад по сохранённым вариантам почвы, а возобновление выбирает деревья местного биома. У особых локаций, размещённых ESIR, есть защищённые области, которые обычная экология оставляет нетронутыми.\n\n[font=default-bold]Что учитывать:[/font] В старых сохранениях уцелевшие признаки локаций помогают определить границы защиты. Ещё проверяемые области и места, чьи старые записи защиты переполнились, могут оставаться закрытыми для экологических изменений. Если отличительные признаки исчезли, система не может восстановить точную старую границу из ничего.
vulcanus-heading=Вулканус: изменения пепла и вулканической почвы
vulcanus=Вулканус использует собственные изменения пепла, вулканической почвы и растрескавшегося грунта. Лава защищена, а эффекты деревьев работают только с подходящими местными видами. Фумаролы сохраняют отдельную численность, запасы и цикл изменения ландшафта.\n\n[font=default-bold]Что учитывать:[/font] Экология не перехватывает эффекты фумарол, не создаёт обычные земные леса и не превращает вулканические жидкости в пресную воду.
gleba-heading=Глеба: споры требуют другого подхода
gleba=Глеба сохраняет свои изменения почвы по биомам и подходящие места обитания диких деревьев, включая правила размещения на болотах. Выращиваемые растения и их особые почвы, аурическая флора и занятые бассейны защищены. Споры — другой вид загрязнения, не считающийся ядовитым промышленным загрязнением.\n\n[font=default-bold]Что учитывать:[/font] Измерение одних спор не означает ни промышленного загрязнения, ни промышленной чистоты. Поэтому сами споры не подходят для повреждения почвы загрязнением, обычного восстановления, угнетения или возвращения цвета деревьев, естественного возобновления и пожара от загрязнения. Подходящая добыча, следы погибших от огня деревьев, действие крови, независимые опасные явления и календарь могут продолжать работать. Включение функции не превращает споры в пригодное промышленное измерение.
fulgora-heading=Фульгора: её день остаётся под собственным управлением
fulgora=Подходящая почва Фульгоры может проходить через камень, песок, пыль и дюны; нефтяные океаны защищены. Экологический календарь может менять темп подходящих эффектов и цвет механического дерева на кнопке. Поддерживаемого местного лесного семейства для роста обычных деревьев здесь нет.\n\n[font=default-bold]Что учитывать:[/font] Светом продолжает управлять независимая система суток Фульгоры. Сезонный световой день никогда не читает, не меняет и не восстанавливает её границы рассвета и заката, в том числе при изменениях общих настроек экологии или календаря.
aquilo-heading=Аквило: снег и лёд вокруг защищённой фабрики
aquilo=Аквило использует собственные изменения уплотнённого снега и льда; записанное восстановление проходит эти шаги назад. Аммиачные океаны, фундаменты и инфраструктура защищены. Сезонный световой день может менять светлую долю суток, сохраняя вращение планеты.\n\n[font=default-bold]Что учитывать:[/font] Поддерживаемого местного лесного семейства для заселения Аквило обычными деревьями нет. Экология не даёт общей симуляции замерзания, таяния или превращения океанов.
settings-heading=Выберите общие настройки и местные исключения
settings=Переключатель интеграции при запуске делает экологию доступной. В «Настройки модов → Карта» находятся переключатели функций, пороги загрязнения, интервалы, вероятности, включение планет и пределы обработки. Администраторы могут использовать «Ландшафт и экология», чтобы переопределять поддерживаемые настройки существующей поверхности. Сброс к наследуемым значениям снимает местное исключение. Выбор планеты или чтение отчёта не создаёт её поверхность.\n\n[font=default-bold]Что учитывать:[/font] Итоговое поведение сочетает общие настройки, правила планеты и явные переопределения поверхности. Главное отключение, неподдерживаемый ландшафт, защита и приостановки совместимости с модами сохраняют приоритет. Обновления сохраняют выбранные настройки. Отключение восстановления приостанавливает его, а не возвращает почву немедленно. Отключение другого эффекта не возвращает уничтоженные деревья, скалы или покрытия. Отключение интеграции при запуске восстанавливает исходный световой день только там, где последнее изменение ESIR ещё нетронуто.
presets-heading=Интенсивность задаёт темп, обработка — охват
presets=Интенсивность определяет, как часто должны возникать экологические возможности; обработка — сколько земли система сможет проверить и как быстро разберёт ожидающую работу. Усиление обработки помогает раньше охватить занятую или широко исследованную карту. Настроенную вероятность успеха каждой проверки оно не повышает.\n\n[font=default-bold]По умолчанию:[/font] «Умеренная» использует множитель частоты 0.5, «Стандартная» — 1, «Сильная» — 2; «Пользовательская» использует выбранный вами множитель. Более высокая интенсивность не включает отключённые функции. Профиль обработки по умолчанию — «Экономный». Семь именованных вариантов: «Очень низкий», «Низкий», «Экономный», «Сбалансированный», «Подробный», «Высокая точность» и «Очень высокая точность», плюс «Пользовательский». «Экономный» выполняет небольшую порцию работы каждые 16 тиков, разрешая один поиск объектов за 32 тика.\n\n[font=default-bold]Что учитывать:[/font] Ограничения обработки и хранения общие для всех поверхностей; пользовательские пределы тоже конечны. Снижение лимита хранения сохраняет существующие записи, но блокирует новые, пока не освободится место. При заполнении хранилища восстановления ESIR отказывает в новом обратимом повреждении вместо забывания старого пути восстановления. Более высокие профили могут требовать больше вычислительного времени; ни один не гарантирует определённый UPS на любой фабрике.
reports-heading=Читайте отчёт о мире, на который смотрите
reports=Медное механическое дерево слева сверху открывает отчёт «Экология» для просматриваемой поверхности, в том числе в удалённом просмотре. Листва следует календарю: салатовая в сезон подъёма, изумрудная в высокий сезон, янтарно-красная в сезон спада и голубая в низкий. Наведите курсор, чтобы увидеть название сезона. Без доступного календаря дерево остаётся изумрудным и сообщает об отсутствии сезонных сведений.\n\n[font=default-bold]Как пользоваться отчётом:[/font] «Простой» описывает наблюдаемую почву, лес, следы добычи и сезонные условия языком полевого отчёта. «Подробный» добавляет действующие настройки поверхности, измерения, ожидающую работу, отказы защиты и состояние обслуживания, отделяя их от общих глобальных лимитов и счётчиков. Нет наблюдения — состояние неизвестно, а не здорово.\n\nОткрытый отчёт обновляет ранее собранные сведения. Закрытие прекращает эти обновления. Отдельная проверка цвета кнопки может продолжаться без обследования ландшафта.
alerts-heading=Выберите изменения, о которых хотите узнавать
alerts=Экологические уведомления появляются в обычном окне оповещений Factorio со значками и доступными для перехода позициями. Выберите их во вкладке «Оповещения» окна «Экология» или в «Настройки модов → Для игрока»: оба места меняют одни личные предпочтения. Оповещение означает, что эффект действительно произошёл, а не просто была назначена проверка.\n\n[font=default-bold]По умолчанию:[/font] Включены оповещения о лесных пожарах, затоплении, засухе, выветривании скал и коррозии покрытия. Остальные категории, в том числе ущерб от загрязнения, восстановление, добыча и эффекты деревьев, изначально выключены и выбираются отдельно. Выбраны все существующие поверхности; только текущая поверхность — отдельный необязательный фильтр. Обычные настройки дневного света не вызывают оповещений.\n\n[font=default-bold]Что учитывать:[/font] Ваша фракция должна видеть чанк происшествия прямо сейчас; прошлой разведки недостаточно. Администратор может обойти требование видимости, но фильтры категорий и поверхностей сохраняются, а при утрате прав обход снимается. Близкие происшествия объединяются, на игрока хранится до четырёх экологических оповещений, а происшествие доступно для уведомления в течение 60 секунд. Происшествия для отсутствующих игроков не копятся на будущее. Истечение оповещения никогда не удаляет записи восстановления или ожидающую работу по добыче.
maintenance-heading=Что показывает окно перестроения
maintenance=Окно перестроения ESIR показывает подготовку и ремонт с конечным объёмом: преобразование старого сохранения, первоначальный обход, проверку изменённых настроек и исправление сохранённых сведений. Задача может ждать, пока её поверхности отключены или иначе не готовы продолжать. Если общий объём неизвестен, окно показывает выполненную работу без выдуманного процента.\n\n[font=default-bold]Что учитывать:[/font] Первоначальный обход фиксирует список поверхностей при запуске. Обход каждой заканчивается, когда чанки исчерпаны или достигнуто 100,000 посещений чанков. Этот предел означает, что полнота охвата не подтверждена, а не что проверена вся карта.\n\nПовседневные наблюдения, восстановление, проверки работающих буров и принятые следы добычи идут независимо и видны в режиме «Подробный». Они не держат окно перестроения открытым бесконечно. Старые сохранения подготавливаются постепенно; повторное открытие или включение экологии не воспроизводит все пропущенные за время простоя попытки.
troubleshooting-heading=Если ландшафт не меняется
troubleshooting=Начните с режима «Подробный» для просматриваемой поверхности. Убедитесь, что экология действительно включена и поддерживает этот мир. Затем проверьте наличие подходящей почвы или деревьев, пригодных измерений загрязнения там, где они нужны, достаточных непрерывных наблюдений и защиты вокруг выбранного места. Наконец, проверьте ожидающую работу и заполнение хранилища. Тихому участку может просто понадобиться время, особенно при низкой вероятности и длинном интервале.\n\n[font=default-bold]Полезные проверки:[/font] Почва в конце цепочки больше не деградирует. Возобновлению нужен уцелевший источник семян подходящего вида. Для добычи требуется либо настоящее истощение конечной залежи в зоне подходящего бура, либо подходящий бур со статусом «Работает» для периодических следов. Огню нужны промышленное загрязнение, подходящая растительность поблизости и нужный режим «Ограниченные» или «Распространяющиеся». Один счётчик успешных попыток ещё не доказывает создание огня. Для восстановления нужна исходная запись ESIR, а для добычи — оба переключателя восстановления.\n\n[font=default-bold]Что учитывать:[/font] TerrainEvolution или TerrainEvolution2 приостанавливает пересекающуюся экологию; ESIR уступает сезонный световой день Diurnal Dynamics. Чем больше исследовано земли и активно поверхностей, тем дольше охват при том же общем пределе обработки. Неизвестное измерение или запоздалая проверка не доказывают ни здоровье земли, ни неисправность функции.
