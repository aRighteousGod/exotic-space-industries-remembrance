guide-summary=簡潔報告將當地晝夜與季節曆法分開呈現。晝夜條顯示該地表目前的原生日照邊界與完整自轉時長；季節條依循 ESIR 的年度曆法。倒數估算依據目前設定。Fulgora 保留獨立的晝夜控制器，時間暫停或永久日照時不會提供一般轉換預測。景觀橫幅僅作裝飾。活動卡片統計成功記錄的變化，同一塊地面可能計入多次。每類活動會顯示最近一次已知時間；舊記錄的總數可能沒有儲存時間。讀數距今多久、調查涵蓋哪裡，描述的都是有限的實地觀測，不能代表整個世界的健康狀況。
