seasons=__1__ · 本季已過 __2__%\n本年已過 __3__%\n距下一季還有 __4__\n年長：__5__\n依目前晝夜週期，約合 __6__ 個當地日。
calendar-help=季節曆法和當地晝夜各自計時。一個曆法年等於 __1__ 個基準日。當地日數依目前週期時長換算，不是對過去自轉次數的統計。
