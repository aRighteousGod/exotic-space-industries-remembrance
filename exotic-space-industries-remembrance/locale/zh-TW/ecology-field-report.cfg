record-help=次數統計的是 ESIR 成功造成的變化，不是獨立地塊數量，也不是完整的地形調查。同一塊地面可能改變多次。舊存檔會保留總數，但可能沒有活動時間。森林火災次數記錄的是點火，不是森林損失。
ground-help=條件允許時，恢復可以循已記錄的地形變化逐步返回。覆蓋地面或由外部替換地形，可能讓儲存的變化步驟不再適用；移除覆蓋物也不會重建記錄。基礎設施、栽培土地與特殊地點仍受保護。
ground-conditions=土壤損傷需要污染至少為 __1__ 並持續 __2__；恢復需要讀數最多為 __3__ 並持續 __4__。仍需要可靠的觀測，並等待各自的處理機會。
pollution-unavailable=這個世界的污染物不能用來判斷工業污染程度。Gleba 的孢子不算工業污染。
mining-recovery-on=採礦恢復已啟用。滿足所需的潔淨條件並通過保護檢查後，有記錄的痕跡可以恢復。
mining-recovery-off=採礦恢復已關閉。有記錄的採礦痕跡會保留，直到啟用此選項或地形被替換。
woodland-help=這些是對已適配野生樹木的變化記錄。栽培植物與受保護植物不參與。樹木天然呈灰色，本身不能證明它受到污染損傷。
woodland-unavailable=這個世界沒有適用於這些效果的原生林木。
other-help=效果仍需要合適的當地地形，並通過保護檢查。岸線轉換只適用於指定的 Nauvis 淡水與沿岸地形組合。鋪裝腐蝕另有明確的適用條件。
survey=最近一次當地讀數：__1__ 前。__2__\n觀測只涵蓋已經走訪的區域。未觀測的地面不能直接視為健康。
survey-none=尚無可靠的當地讀數。觀測只涵蓋已經走訪的區域；未觀測的地面不能直接視為健康。
coverage-discovering=初次巡查仍在進行。
coverage-observed=初次巡查已結束，但這不表示完成了全面的健康調查。
coverage-limited=調查涵蓋範圍仍然有限。
coverage-unknown=調查涵蓋範圍尚未確定。
