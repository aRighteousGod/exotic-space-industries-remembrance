[item-name]
ei-flamethrower-fuel=火焰噴射器彈藥（__1__）
[item-description]
ei-flamethrower-fuel=火焰傷害：原油彈藥的__1__%。地面火焰初始持續__2__秒，持續補充燃料後最長可達__3__秒。目標身上的燃燒持續時間不變。載具火焰噴射器保留原有的燃燒機制。
[entity-description]
ei-flamethrower-fuel=燃料特效：__1__。地面火焰初始持續__2__秒，持續補充燃料後最長可達__3__秒。
[mod-setting-name]
ei-flamethrower-fuel-adaptation=火焰砲塔燃料專屬特效
[mod-setting-description]
ei-flamethrower-fuel-adaptation=依照正在消耗的燃料自動調整砲塔的火焰、煙霧與地面火焰持續時間。關閉後，砲塔使用統一特效與正常燃燒時間；所有燃料傷害倍率與彈藥種類仍然可用。每16刻更新一次。燃料檢查次數與砲塔替換嘗試次數均以每刻腳本更新次數的完整設定值為上限。關閉時會在此預算內逐步恢復現有砲塔。預設開啟。 關閉後也會停止清除重疊火焰，因此不同燃料的火焰效果可以疊加。
