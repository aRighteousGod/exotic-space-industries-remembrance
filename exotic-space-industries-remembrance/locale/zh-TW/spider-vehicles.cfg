ei-spider-range-aware-cycling=車輛開啟武器輪替時，自動選擇射程內有目標的武器，並依序持續射擊。定期搜尋附近目標。關閉此設定後使用原生輪替，不執行腳本目標搜尋；武器射程不同可能導致原生輪替停滯。

