[entity-name]
ei-scout-spidertron=偵察蜘蛛機甲
assault_spidertron=突擊蜘蛛機甲
[entity-description]
ei-scout-spidertron=用於偵察與物流的三足載具。沒有固定武器；裝備網格可安裝個人雷射防禦及其他護甲裝備。享有蜘蛛載具共用底盤研究的加成。
assault_spidertron=模擬時代的戰鬥載具，配備一門加農砲、一挺機槍和一具火焰噴射器。研究可增加重砲、武器改良及自動煙幕。享有共用底盤研究的加成。
[item-name]
ei-stored-spidertron=__1__（__2__×__3__裝備網格）
ei-assault-smoke-charge=突擊蜘蛛機甲煙幕彈
[item-description]
ei-assault-smoke-charge=放入突擊蜘蛛機甲的行李廂。完成研究後，載具在遭受重擊或受擊後生命值低於一半時消耗一枚，使附近敵方單位減速六秒。冷卻時間：30秒。
[technology-name]
ei-spider-vehicles=蜘蛛載具
ei-assault-spidertron=突擊蜘蛛機甲
ei-assault-smokescreen=蜘蛛機甲自動煙幕
[technology-description]
ei-spider-vehicles=具備物流、遙控及裝備網格功能的三足偵察蜘蛛機甲。解鎖偵察型、突擊型與火箭型共用的底盤研究。
ei-assault-spidertron=模擬時代的突擊蜘蛛機甲，配備一門加農砲、一挺機槍和一具火焰噴射器。解鎖其武器與煙幕研究。
ei-assault-smokescreen=敵方單次攻擊造成至少5%最大生命值的傷害，或使受擊後的生命值低於50%時，突擊蜘蛛機甲消耗行李廂中的一枚煙幕彈。固定煙幕持續六秒，使八格半徑內最多64個敵方移動單位的速度降低35%。冷卻時間：30秒。不造成傷害，也不提供隱形效果。
