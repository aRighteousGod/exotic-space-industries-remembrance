chassis-fuel-description=共用改良：偵察型的燃料與廢燃料欄各有__1__格，另外兩種載具各有__2__格。
chassis-efficiency-description=三種載具的燃燒效率係數均變為__1__。每份燃料可提供更多有效移動能量。
chassis-armor-description=三種載具的物理與爆炸抗性在各自基礎值上增加__1__個百分點，上限為90%。固定傷害減免不變。
chassis-grid-description=擴充裝備網格：偵察型__1__；突擊型__2__；火箭型__3__。保留既有裝備。回收後的載具使用可安全還原擴充網格的儲存變體。
