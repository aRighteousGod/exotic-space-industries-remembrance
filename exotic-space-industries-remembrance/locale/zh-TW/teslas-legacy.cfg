ei-tesla-turret=對崩潰前富戈拉電弧武器的重建仿製品。雖然其底層超導線圈幾何仍只被部分理解，這座複製塔依然能把受控電弧投向附近威脅。與真正的富戈拉設計相比，它的輸出與效率仍然有限，但借助先進材料，依然能提供可靠的區域壓制與極高的爆發潛力。

