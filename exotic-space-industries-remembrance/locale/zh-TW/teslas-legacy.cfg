menu_teslas_legacy=Tesla's Legacy
title_teslas_legacy=Tesla's Legacy
teslas-legacy=Tesla's Legacy武庫
teslas-legacy-text=過去作為 Tesla's Legacy 額外掛進來的那條路線，如今已被內化成 Remembrance 自身的電系武器分支。[item=tl-basic-tesla-coil]基礎特斯拉線圈、[item=tl-advanced-tesla-coil]高階特斯拉線圈，以及[item=tl-tesla-tank]特斯拉坦克，都保留了它們公開的名字、TL 的機體外觀與工業氣質，但這條線路已不再是掛在旁邊的外來階梯。它現在按 EI 的節奏推進：先是粗獷的電場塔，再是更重的處決尖塔，最後是裝甲化的風暴前線。\n\n這條線如今也會橋接進原版特斯拉家族。[item=teslagun]特斯拉槍、[item=tesla-ammo]特斯拉彈藥，以及[item=tesla-turret]複製版富戈拉特斯拉線圈，會繼承同一根諧調主幹，但不會被壓扁成偽裝的 TL 塔。
teslas-legacy-2=行為模式
teslas-legacy-text-2=目前啟動行為模式: [font=default-bold]__1__[/font]\n\n[font=default-bold]遺產忠實[/font]現在是預設路線。這就是原版 Tesla's Legacy 的完整底層：舊輔助遞迴、持續存在的輔助、計時器清理、受傷事件來源、高階線圈的擊殺後餘震、單次電弧的燃燒副作用，以及坦克的揮發流，全都會先作為權威行為執行。[font=default-bold]混合[/font]則是可選的輕量路線。它不再讓舊 TL 遞迴充當主要延續模型，而是改由 TL 專用輔助格架接手，再讓後續的諧調與教義技術在其上選擇更豐富的隱藏輔助家族。\n\n教義階梯本身是共通的，但套用方式不同。在混合模式下，教義格架會成為主要行為。在遺產忠實模式下，原始 TL 行為永遠先觸發，之後才疊加現代化特性。
teslas-legacy-3=波形諧調
teslas-legacy-text-3=波形諧調現在是共同的現代化主幹。諧調之前，Legacy 線圈會保留原始 TL 的光束語言。到諧調 I，它們開始與橋接特斯拉家族說同一種電學方言。到諧調 II，基礎與高階線圈都會轉入現代化的後續放電家族。到諧調 III，這些後續電弧完全接上更深層的連鎖語法，橋接炮塔也終於拿到它一直缺少的濃密後續放電輪廓。\n\n這也是舊「不相容」故事真正結束的地方。Legacy 塔、複製版富戈拉塔與手持特斯拉家族，如今共享一條刻意設計的交匯線，而不是繼續彼此無視。
teslas-legacy-4=量子專精
teslas-legacy-text-4=在諧調之後，教義會清楚分岔。[font=default-bold]風暴晶格[/font]屬於[item=tl-basic-tesla-coil]基礎線圈，把它推成一座蟲群控制塔：傳播更寬、目標交接更穩、壓制更持久。[font=default-bold]介電破裂[/font]屬於[item=tl-advanced-tesla-coil]高階線圈，強化確認擊殺後的後續放電、殘餘電荷與燃燒繼承。\n\n[font=default-bold]橋接耦合[/font]則是橋接家族的後期專精。它會強化原版特斯拉家族，但不會把它們壓成 TL 塔的變體。複製版富戈拉塔拿到更重的炮塔收益，而手持特斯拉裝備則繼續保持更輕的定位。
teslas-legacy-5=聚變過驅
teslas-legacy-text-5=[item=tl-tesla-tank]特斯拉坦克並不直接共享塔系的專精。它的後期教義是[font=default-bold]電抗過驅[/font]：一條聚變時代的坦克路線，強調雙線圈飽和、更寬的波動窗口，以及沿著行進帶溢出的更多電弧。它在機制上仍與塔系不同，不像固定尖塔，更像一股履帶上的風暴前線。\n\n它同時也是整條線的揮發專長載體。暴擊峰值、調制搖擺和汽化，依舊屬於坦克，而不是塔。
teslas-legacy-6=異構收斂
teslas-legacy-text-6=最終階段是[font=default-bold]異構波形收束[/font]。它不會把 TL 塔換成新世代複製品。[item=tl-basic-tesla-coil]基礎線圈會保留其臨時拼裝的本體，並成長為現代化的[font=default-bold]分岔場弧塔[/font]，每次主命中都會放出一次確定的側向爆發。[item=tl-advanced-tesla-coil]高階線圈會保留高聳支柱本體，並成長為集中的[font=default-bold]過充長槍塔[/font]，而每次確認擊殺還會額外釋放一次確定的異構處刑風暴。\n\n在[font=default-bold]遺產忠實[/font]中，這些終局效果會疊加在原始 TL 底層之上。在[font=default-bold]混合[/font]中，它們位於更輕的教義格架頂端。[item=tl-tesla-tank]特斯拉坦克只會部分參與：揮發峰值與汽化事件都可能引發風暴前線爆發，但載具依然還是這條家族裡的裝甲成員，不會收束成另一座塔。[item=tesla-turret]複製版富戈拉塔也會在確認擊殺時獲得專屬炮塔異構餘震，但[item=teslagun]特斯拉槍與[item=tesla-ammo]特斯拉彈藥仍停留在更輕的橋接路線。
teslas-legacy-7=戰鬥提示與預設浮動文字
teslas-legacy-text-7=戰鬥提示是刻意篩選過的。[font=default-bold]暴擊[/font]和[font=default-bold]汽化[/font]浮動文字預設開啟，因為真正特殊的瞬間應該被看見。常規[font=default-bold]傷害[/font]浮動文字預設關閉，以免每場交火都變成一團電光紙屑。\n\n這比以前更重要，因為教義裡現在有更多可動部件：傳播跳躍、後續放電連鎖、橋接耦合、坦克揮發，以及最終光束現代化。預設配置會保留最戲劇性的瞬間，但不會讓整片戰場都淹沒在噪音裡。
