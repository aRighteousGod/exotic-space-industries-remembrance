[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=可選的輕量路線。以 TL 專用教義格架作為主要延續路徑，讓橋接輔助保持分離，並讓原始輔助遞迴退場，以換取更好的 UPS。
ei-tl-behavior-mode-legacy-fidelity=預設值。完整保留原版 Tesla's Legacy 的行為。舊輔助遞迴、輔助持續、計時器清理、受傷來源、擊殺後餘震，以及坦克的揮發流，都按原樣復現，不計 UPS 成本。
tl-advanced-attack-anim-charge-up=使用這種動畫時，明亮能量會沿著高階特斯拉線圈的核心上升，並在抵達頂端時開火。如果 A 炮塔先於 B 炮塔完成蓄勢就擊殺了目標，偶爾會出現輕微的重新鎖定延遲。
tl-advanced-attack-anim-simple=使用這種動畫時，只要敵人靠近，電流就會立刻在各線圈之間跳動，線圈會馬上開火。

