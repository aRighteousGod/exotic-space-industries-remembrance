tl-critical-multiplier=當暴擊發生時，該次命中的原始傷害會乘上這個係數。
tl-critical-chance=特斯拉攻擊觸發暴擊的百分比機率。
tl-flying-text-critical=為成功暴擊顯示浮動提示文字。
