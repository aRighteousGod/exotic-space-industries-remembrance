ei-waveform-harmonics-1-effect=波形諧調 I：統一命中語義，並提供第一層共享橋接加成。
ei-waveform-harmonics-2-effect=波形諧調 II：Legacy 線圈與橋接特斯拉家族解鎖現代化連鎖後續放電族系。
ei-waveform-harmonics-3-effect=波形諧調 III：完整接入 Space Age 的後續鏈式語言，並強化橋接砲塔端的連鎖。
ei-storm-lattice-1-effect=風暴晶格 I：基礎線圈獲得更寬的場弧傳播與更乾淨的目標交接。
ei-storm-lattice-2-effect=風暴晶格 II：基礎線圈能在更大壓力下維持更密的弧網。
ei-storm-lattice-3-effect=風暴晶格 III：基礎線圈成為真正的後期壓制塔。
ei-dielectric-rupture-1-effect=介電破裂 I：高級後續放電在確認擊殺後保留更多電荷。
ei-dielectric-rupture-2-effect=介電破裂 II：高級後續放電打得更遠，也更容易引燃。
ei-dielectric-rupture-3-effect=介電破裂 III：高級線圈把確認擊殺化為短促的處決風暴。
ei-bridge-coupling-1-effect=橋接耦合 I：提高橋接線後期傷害，同時不把原版特斯拉家族壓扁成 TL 教義。
ei-bridge-coupling-2-effect=橋接耦合 II：複製版富戈拉塔繼承更重的後期橋接收益。
ei-reactance-overdrive-1-effect=電抗過驅 I：特斯拉坦克擴大波動包絡，並拋出更多飽和電弧。
ei-reactance-overdrive-2-effect=電抗過驅 II：特斯拉坦克能維持更長的過載與更沉重的風暴前線放電。
ei-reactance-overdrive-3-effect=電抗過驅 III：特斯拉坦克到達聚變時代雙線圈的最終兇暴狀態。
ei-exotic-waveform-convergence-effect=異構波形收斂：Legacy 線圈解鎖異構分支爆發、處決風暴與風暴前線爆發，而複製版富戈蘭塔則獲得砲塔專屬的異構餘震綻放。

