[technology-description]
tl-basic-tesla-coils-technology=特斯拉線圈是一種經改造的諧振變壓器，可向附近敵人釋放高電流放電。直接傷害不算極高，但能同時影響多個目標。
tl-advanced-tesla-coils-technology=大幅強化後的特斯拉線圈版本。射程更長、傷害更高，並用厚重鋼甲提升生存性。
tl-tesla-tank-technology=一種致命的坦克變體，裝備兩座中型高級特斯拉線圈。便攜特斯拉線圈會提供必要的能量脈衝，讓兩門武器同時開火。
ei-tesla-weapons=從崩潰前富戈拉研究庫中回收並逆向工程出的電弧技術。原始原理至今仍只被部分理解，但工程師已經重建出能向敵對目標投射穩定化電弧的可用仿製品。其輸出、效率與放電模式仍遜於真正的富戈拉設計，但仍遠比傳統電磁武器先進。只要真正的富戈拉設計圖尚未解譯，進一步改良就會受到限制。
tl-tesla-ammo-upgrade-technology=便攜特斯拉線圈技術的進步暴露了基礎特斯拉線圈結構中的設計缺陷。把這些弱點補上之後，就能得到效率更高、整體性能更強的特斯拉線圈。
tl-tesla-coil-damage-technology=透過安裝更強的電容器，並對電流頻率加入輕微振盪，可以提高特斯拉線圈閃電電弧的有效傷害。
tl-tesla-coil-shooting-speed=近來的電池效率改良也能應用到特斯拉線圈設計上，讓線圈更快達到臨界容量，進而提升射速。
tl-flames-explosion-technology=流經特斯拉線圈放電的能量高到足以點燃空氣本身。這種短暫的連鎖反應會化成猛烈的火焰爆炸。\n\n「噴燃」的每一級都會擴大爆炸的作用範圍。\n\n傷害：砲塔傷害的 60%。
tl-flames-count-technology=當地面的乾土與塵埃顆粒因極高電流而著火時，結果會是一場出人意料地猛烈的燃燒反應。火焰只持續幾秒，但會釋放危險等級的高熱，把一切燒成焦黑。\n\n「閃焰」的每一級都會增加生成火焰的數量以及它們每秒造成的傷害。
tl-flames-probability-technology=極端集中的能量足以點燃地表植被、塵埃顆粒，甚至點燃空氣本身。\n\n「燃燒」的每一級都會提高點燃特斯拉線圈目標及其周邊區域的機率。
tl-single-zap-count-technology=當生物被高級特斯拉線圈擊中時，它可能會吸收大量靜電能量。這種過載會猛烈地撕碎宿主。如果宿主被摧毀後仍殘留部分電荷，它就會朝附近的阻力源抽打出去。這種現象被稱為補充放電。\n\n「補充放電」的每一級都會增加砲塔擊殺敵人時釋放出的補充放電數量。
tl-single-zap-damage-technology=如果目標被摧毀後仍殘留電荷，它就會化為一次補充放電。那道放電只攜帶初始電荷的一部分，但透過細緻調整特斯拉線圈的整體共振水準，仍可放大這部分剩餘能量。\n\n「重雷」的每一級都會提高補充放電造成的傷害。
tl-single-zap-probability-technology=高級特斯拉線圈導引著難以置信的電能。如果目標無法容納這股電流，它就會沿著被電離的空氣分子溢出，化作獨立的閃電電弧去電擊附近實體。\n\n「過充」的每一級都會提高高級特斯拉線圈擊殺敵人時生成額外閃電電弧的機率。
tl-multi-zap-range-technology=線圈中的電流越強，周圍靜電場中的電離粒子就越多。如此一來，電荷更容易穿過空氣，抵達更遠的目標。\n\n「電離」的每一級都會提高電荷傳播的有效距離。
tl-multi-zap-damage-technology=精細調整發射出的集中能量波長之後，電荷在靜電場中傳播時就能形成更穩定、也更具殺傷力的閃電電弧。\n\n「雷擊」的每一級都會提高傳播電荷造成的傷害。
tl-multi-zap-probability-technology=持續使用特斯拉線圈會讓周圍充滿電離粒子。正是這些粒子讓被導引的電荷能夠越過最初目標，跳向附近物體。\n\n「靜電場」的每一級都會提高電荷向每個附近敵人傳播的機率。
tl-slowdown-duration-technology=更高能級的電流會帶來更強的效果，並且會在目標體內殘留得更久。\n\n「持續」的每一級都會延長「電擊」效果的持續時間。
tl-slowdown-multiplier-technology=特定能級與高頻率結合在一起，會引發嚴重的肌肉痙攣，進而大幅妨礙移動。\n\n「麻痺」的每一級都會提高「電擊」的強度，並進一步降低移動速度。
tl-slowdown-probability-technology=直接接觸電流會引發生理與神經層面的副作用，例如肌肉痙攣與癱瘓。\n\n「電擊」等級越高，這些副作用在每次攻擊中出現的機率就越高。
tl-volatility-modulation-technology=電離是提升電流型軍事系統效能的常見手段。當雙線圈以交替頻率進行電離時，能量輪廓中會出現一種協同模式。這種效應被稱為生體電離，它會大幅拓寬該電流的波動包絡。\n\n「生體電離」的每一級都會壓低可能出現的最低傷害，同時顯著抬高可能出現的最高傷害。
tl-volatility-probability-technology=雙線圈電流的波動本性，會在整合式振幅調節器的作用下被推到極限。實戰中，生成的閃電電弧會獲得足以把任何小於一間中型公寓的生物完全解體的能量。\n\n「汽化」的每一級都會提高瞬間擊殺目標的機率。生命值高於 5000 的目標不會直接死亡，而是受到重創。
ei-waveform-harmonics-1=為 Legacy 線圈與橋接後的特斯拉家族對齊第一套共用放電輪廓。TL 主射束的外觀暫時維持原樣，但這條線已經開始說同一種電學方言：更清晰的命中回饋、更乾淨的橋接語義，以及通往 teslagun、特斯拉彈藥與複製版富戈拉線圈的第一層直接聯動。
ei-waveform-harmonics-2=把這套共用波形延伸為現代化的連鎖後續放電族系。基礎線圈獲得協調後的場弧傳播，高級線圈開始使用現代化的後續放電家族，而橋接特斯拉家族也終於能打出真正的連鎖爆發。
ei-waveform-harmonics-3=完成諧調主幹。後續電弧全面採用 Space Age 的連鎖語言，橋接砲塔獲得更重的後期鏈式收益，而 Legacy 分支終於準備好進入真正的教義分化，而不只是繼續堆原始數值。
ei-storm-lattice-1=基礎線圈不再只是「第一座特斯拉塔」，而是成為真正的控制教義。風暴晶格 I 改善目標接力，擴寬傳播弧網，讓蟲群被困在電場中而不是從邊緣漏出去。
ei-storm-lattice-2=這時的電弧已經不再只是碰運氣的散射。風暴晶格 II 會在更大壓力下維持分支網路，讓基礎線圈能持續把電荷傳給更寬、更密的敵軍前線。
ei-storm-lattice-3=這是基礎線圈控制路線的終態。風暴晶格 III 把分支場弧塔推進到後期群控階段：更多跳躍、更遠延伸，以及更明確的「風暴帷幕」身份。
ei-dielectric-rupture-1=高級線圈並不是為整條戰線做壓制而生的。它是為了先殺死目標，再讓剩餘電荷去找下一個。介電破裂 I 讓第一次後續放電保留更多可用能量。
ei-dielectric-rupture-2=介電破裂 II 讓後續放電鏈活得更久，也讓放電更願意點燃它碰到的東西。高級線圈仍然是處決用尖塔，而不是基礎塔的翻版。
ei-dielectric-rupture-3=後期高級線圈會成為真正的擊殺連鎖武器。介電破裂 III 提高殘留電弧、延伸距離與燃燒繼承，讓一次確認擊殺就足以撕開一整波密集攻勢。
ei-bridge-coupling-1=通往原版特斯拉家族的橋接是刻意克制的。橋接耦合 I 提高 teslagun、特斯拉彈藥與複製版富戈拉線圈的後期傷害與控制繼承，但不會把它們直接壓成披著皮的 TL 塔。
ei-bridge-coupling-2=橋接線的終點刻意偏向砲塔。橋接耦合 II 讓複製版富戈拉塔繼承更濃的後期後續放電語言，而手持特斯拉裝備依舊維持更輕的形態。
ei-reactance-overdrive-1=兩座高級線圈焊在坦克殼體上，本來就不可能溫順。電抗過驅 I 擴大波動包絡並增加飽和電弧數量，同時不把這輛車變成另一座固定砲塔。
ei-reactance-overdrive-2=聚變時代的線圈控制讓特斯拉坦克能維持更長的過載視窗。電抗過驅 II 進一步強化它作為風暴前線的感覺：更劇烈的調制擺動、更多外溢，以及在打擊走廊邊緣更大的壓力。
ei-reactance-overdrive-3=這是坦克的最終特化形態。電抗過驅 III 保持它與塔類在機制上的差異，同時讓它更像一股移動的電氣前線，而不是裝了裝飾閃電的武器平台。
ei-exotic-waveform-convergence=在教義的終點，Legacy 塔不再只是借用現代連鎖語言，而是終於得到屬於自己的現代主射束。基礎線圈會成為分支場弧塔，並在每次成功的主命中後得到一次保底側向分支爆發。高級線圈會成為聚焦的過充長槍尖塔，而每次擊殺確認都會在其正常餘震邏輯之上額外觸發一次保底的異構處決風暴。特斯拉坦克只會部分併入：它的命中會得到相鄰放電現代化，而正向的波動尖峰則能觸發一次風暴前線爆發，同時又不會把載具壓扁成另一座塔。複製版富戈蘭塔也會在擊殺確認時得到砲塔專屬的異構餘震綻放，而手持特斯拉裝備則不會。

