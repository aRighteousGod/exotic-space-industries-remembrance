[mod-setting-name]
ei-beacon-quality-modules=插件塔允許使用品質組件
ei-beacon-productivity-modules=插件塔允許使用產能組件
ei-quality-module-effects=品質組件效果

[mod-setting-description]
ei-beacon-quality-modules=選擇哪些ESIR插件塔可以使用提供品質加成的組件。液氮冷卻組包括__ENTITY__ei-copper-beacon__和__ENTITY__ei-iron-beacon__；異星組包括__ENTITY__ei-alien-beacon__和__ENTITY__ei-warp-beacon__。需要啟用Quality模組。\n收緊限制後，已安裝但不再允許使用的組件會返還到插件塔旁的地面上。
ei-beacon-productivity-modules=選擇哪些ESIR插件塔可以使用提供產能加成的組件。液氮冷卻組包括__ENTITY__ei-copper-beacon__和__ENTITY__ei-iron-beacon__；異星組包括__ENTITY__ei-alien-beacon__和__ENTITY__ei-warp-beacon__。停用Quality模組時仍然生效。\n收緊限制後，已安裝但不再允許使用的組件會返還到插件塔旁的地面上。
ei-quality-module-effects=ESIR模式採用ESIR為品質組件設定的加成與懲罰。接近原版模式不套用ESIR對其效果的修改。兩種模式均保留ESIR的配方與研究進度。停用Quality模組時，此設定無效。

[string-mod-setting]
ei-beacon-quality-modules-neither=兩組皆不允許
ei-beacon-quality-modules-nitrogen=僅液氮冷卻插件塔
ei-beacon-quality-modules-alien=僅異星與躍遷插件塔
ei-beacon-quality-modules-both=兩組皆允許（預設）
ei-beacon-productivity-modules-neither=兩組皆不允許
ei-beacon-productivity-modules-nitrogen=僅液氮冷卻插件塔
ei-beacon-productivity-modules-alien=僅異星與躍遷插件塔
ei-beacon-productivity-modules-both=兩組皆允許（預設）
ei-quality-module-effects-esir=ESIR（預設）
ei-quality-module-effects-vanilla=接近原版

[beacon-module-policy]
summary=品質組件：__1__。產能組件：__2__。
allowed=允許
