menu_auric_inoculation_vat=金沼接種槽
title_auric_inoculation_vat=金沼接種槽
auric-inoculation-vat=金沼接種槽
auric-inoculation-vat-text=Gleba 的 [entity=ei-auric-inoculation-vat] 並不會直接勾連現成的 [entity=ei-auric-cyst-node]。它會先把周圍一片連續的濕地盆地認領下來，再把這具活沼的壓力壓進一套批次流程，最後催生出新的節點。\n\n[font=default-bold]放置與盆地認領：[/font] 這類接種槽就是給 Gleba 用的。要把它放在認領場真的能碰到足夠多濕地地塊的位置。有效盆地需要24-160塊連通的濕地地塊；更大的連通濕地必須切小或分割，而且不能與另一座接種槽共享。足跡重疊會引發衝突；沒有有效盆地的接種槽，也就沒有穩定的接種對象。
auric-inoculation-vat-2=循環投入與帶級縮放
auric-inoculation-vat-text-2=這座接種槽依照 [font=default-bold]播種 -> 灌注 -> 發酵（可用 bioflux 選擇性富集） -> 排放 -> 綻放 -> 休止[/font] 的順序運作，而不是被動抽乾沼澤。播種消耗[item=spoilage]和[fluid=ei-bio-oil]，灌注消耗[fluid=ei-dirty-water]，發酵消耗[item=jelly]和[item=yumako-mash]。在富集窗口內送入[item=bioflux]，會讓這次發酵在排放和綻放前切換為富集發酵。\n\n盆地大小會決定目前帶級。b1 對應24-39塊已認領地塊，b2 對應40-55塊，b3 對應56-71塊，b4 對應72-87塊，b5 對應88-103塊，b6 對應104-127塊，b7 對應128-160塊。同一套帶級也會限制盆地內存活的胞囊節點上限：3、4、6、8、10、12、14。帶級越高，能容納的綻放產出越多，但對試劑穩定供給與水處理的要求也越重。
auric-inoculation-vat-3=活力、污染與綻放失效
auric-inoculation-vat-text-3=每個循環都在[font=default-bold]活力[/font]與[font=default-bold]污染[/font]之間拉扯。健康的盆地、餵飽的階段與可控的帶級壓力會讓活力維持領先。飢餓、排放阻塞、認領衝突以及被壓榨過度的濕地地塊都會抬高污染，把接種槽推入緊繃狀態。\n\n一旦污染撞上失效門檻，綻放穩定性就會崩掉。接種槽會開始把盆地地塊降解成更死的濕地狀態，並退回休止，而不是維持一次乾淨的綻放。如果控制台不斷從穩定滑向緊繃，就該收緊盆地足跡，或者把循環餵得更厚一點，別等機器把整片沼澤壓死。
auric-inoculation-vat-4=囊體洗滌、污水回收與遙測
auric-inoculation-vat-text-4=健康的接種槽會在之後催生新的 [entity=ei-auric-cyst-node]。把它們採下來得到[item=ei-auric-cyst]，再運行[recipe=ei-auric-cyst-washing]，把囊體拆成有用產物，同時把一部分[fluid=ei-dirty-water]送回更大的 Gleba 水循環。接種槽自身的排放階段也會輸出[fluid=ei-dirty-water]，有時還會輸出[fluid=ei-acidic-water]；這些出口必須排空，下一階段才會開始。排放堵塞會把接種槽釘在原地，並持續推高污染，直到管路重新喘過氣來。\n\n電路遙測讓這片沼澤變得可讀。接種槽可以輸出[virtual-signal=ei-auric-vat-vigor]、[virtual-signal=ei-auric-vat-contamination]、[virtual-signal=ei-auric-vat-band]、[virtual-signal=ei-auric-vat-claims]和[virtual-signal=ei-auric-vat-bloom]。用它們去比較盆地足跡、為衝突或失效狀態發出警報，或判斷洗滌線與排放處理何時該跟著下一檔濕地帶級一起放大。
