[exotic-industries-informatron]
menu_gaian_hierophant=蓋亞秘儀祭司
title_gaian_hierophant=蓋亞秘儀祭司
gaian-hierophant-intro=聖所將虔誠化為切割的訊號。蓋亞秘儀祭司是一座緩緩前行的浮空聖堂，以原生 Spidertron 指揮核心為基礎，裝有兩道晶體光束。
gaian-hierophant-controls=操控與補給
gaian-hierophant-controls-text=沿用 Spidertron 的常規駕駛、遙控選取與自動導航。裝備、貨艙、回收槽和載具物流均透過原生介面操作。手動射擊與自動射擊都會消耗彈藥，啟動同一種持續射擊；載具可以邊移動邊開火。懸浮穩定系統限制疊加減速效果，但傷害與直接暈眩仍然生效。
gaian-hierophant-weapons=兩枚晶體，兩路鎖定
gaian-hierophant-weapons-text=使用普通品質彈藥時，頂部光束每__2__刻造成__1__點雷射傷害，基礎射程為__3__格，涵蓋__4__度。正面光束每__2__刻造成__5__點雷射傷害，攻擊範圍為__6__格以內、正前方__7__度的扇形區域。每道光束都會保持鎖定符合條件的目標，失去目標後平滑轉向新的目標。完成捕捉後才會造成傷害；光束在視覺上掃過某個單位，並不代表該單位成為攻擊目標。載具品質會延長頂部光束的射程；正面光束的射程保持不變。
gaian-hierophant-charge=一枚充能匣，一段射擊時間
gaian-hierophant-charge-text=消耗一枚[item=ei-anisetron-crystal-charge]，即可預付兩道光束持續__1__秒所需的能量。當兩路光束都命中目標時，在計入研究、升級和抗性之前，合計基礎輸出最高為每秒__2__點雷射傷害。搜尋目標和轉向同樣消耗這段射擊時間；未用掉的傷害不會儲存，也不會轉移給另一道光束。透過載具彈藥物流補給。彈藥耗盡或鬆開手動射擊後，已經付費啟動的射擊仍會繼續。移除載具會取消餘下的攻擊；已經確定的坍縮和回響仍會完成。
gaian-hierophant-upgrades=光矛傳承
gaian-hierophant-upgrades-text=彈藥品質、[technology=laser-weapons-damage-6]及後續研究都會增強兩道光束。只有頂部光束繼承[technology=ei-singularity-lance-axial-rupture]、[technology=ei-singularity-lance-wound-memory]、[technology=ei-singularity-lance-terminal-collapse]和[technology=ei-singularity-lance-black-hole-testament]：增加切線、累積傷口傷害、延遲坍縮，並在頂部光束每安排__1__次脈衝時觸發一次強化脈衝。這些升級不是建造前置條件。消耗充能匣時，該段射擊的傷害、射程、品質和已研究升級隨即固定；新研究從後續充能匣開始生效。
gaian-hierophant-construction=在蓋亞組裝
gaian-hierophant-construction-text=完成滑跡飛碟、奇點光矛和雷射武器傷害5研究後，研究[technology=ei-anisetron]。在蓋亞上，使用一具空的[item=ei-gaian-saucer]底盤、一座[item=ei-singularity-lance]及其餘配方材料組裝。請先拆除裝備並清空底盤：這個普通配方會製造一艘全新的載具，不會轉移原有配置。晶體充能匣可以在任何表面製造。
gaian-hierophant-visuals=視覺共鳴
gaian-hierophant-visuals-text=目前啟動預設：__1__。它控制綠色移動絲縷、光束光暈和命中閃光。即使關閉裝飾，兩道核心光束和升級的重要視覺提示仍然可見。視覺品質不會改變傷害、目標選擇、射程、充能匣消耗、射擊時長或移動。更高的預設允許更多裝飾效果；「解縛」取消這些數量上限，可能增加 UPS 開銷。
