[ei-ecology-guide]
intro-heading=讀懂工廠周圍的土地
intro=工廠留下的不只是建築。污染會讓自然地面退化，使附近樹木灰化；採礦可能留下裸露的地塊。環境變得潔淨後，部分受損地面和林木就有機會恢復。地形演變也帶來局部環境災害與季節曆法，並為 Nauvis、Gaia、Vulcanus、Gleba、Fulgora 和 Aquilo 分別採用適合的規則。太空平台、未知星球與無關的輔助地表不在涵蓋範圍內。\n\n想了解土壤、恢復、採礦與血液效果，可以從地面頁開始。林地頁介紹樹木與火災，岸線頁說明水域與懸崖。季節頁解釋曆法和各世界的差異；設定頁則協助你選擇配置、閱讀報告，並找出效果遲遲未出現的原因。系統從 TerrainEvolution 與 TerrainEvolution2 汲取靈感，使用 ESIR 自己的處理上限和保護規則。
defaults-heading=從預設環境開始
defaults=新的設定會啟用生態系統及所有個別功能，包括新採礦痕跡的恢復、樹木老化、枯木腐朽、岸線變化、懸崖風化、血液效果、鋪裝腐蝕、季節性生態變化與季節性晝長。你可以分別關閉功能，留下自己希望看到的景觀變化。\n\n[font=default-bold]預設設定：[/font]生態強度是節制，處理預設是輕量。森林火災使用不蔓延模式；可蔓延需要另外選擇。既有存檔保留已儲存的設定與明確的地表覆寫值，這些預設值不會重設你的選擇。\n\n[font=default-bold]實際限制：[/font]啟用的功能仍需要合適的地面或植被、相應環境條件，以及輪到該區域處理的時間。有機率判定時，一次檢查可能不會造成任何變化。開啟功能是允許它發生，不是保證所有地方立刻一起改變。
observation-heading=判斷污染或潔淨，需要可靠的讀數
observation=系統會輪流檢查地圖上的部分區域，也就是區塊，並用每次污染讀數判斷附近的變化。只有反覆取得讀數，才能認定環境持續潔淨或持續受污染。很久沒有檢查的區域，狀況就是未知，不能直接當作健康。\n\n[font=default-bold]預設設定：[/font]污染條件要求污染量至少 100，並持續觀測五分鐘。潔淨條件要求污染量最多 25，並持續觀測十分鐘。污染量嚴格介於 25 與 100 之間時，兩段觀測時間都會重設。兩次讀數相隔超過 20 模擬秒，也會中斷連續環境條件的依據。\n\n[font=default-bold]實際限制：[/font]缺少的讀數或另一種污染物，都不能當作空氣潔淨的證據。探索過的地圖越大，完成觀測涵蓋所需的時間就越長。觀測時長只是效果的一項條件，不是倒數結束後每個地格都會改變的保證。
protection-heading=為工廠與特殊地點留出空間
protection=一般生態變化不會動到鋪裝、填海地塊、地基或已被覆蓋的地面。機器及其他基礎設施、虛影、尚存礦床、栽培植物及其土壤、金沼佔用區域、預設特殊地點和不支援的地形也受到保護。一般的已適配野生樹木和小型自然裝飾物，本身不會讓一個地方被算作工業佔用。\n\n[font=default-bold]實際限制：[/font]保護範圍可以延伸至障礙物周圍。即使通用緩衝範圍較小，岸線變化與對樹木、懸崖等自然物體的影響，仍至少保留八格距離。系統會在實際改變前再檢查一次保護條件，因此新放置的機器可以阻止已在等待的變化。\n\n鋪裝腐蝕有一項有限例外，只針對符合條件且未被佔用的道路與混凝土。岸線變化只允許特定的地面與水域組合。可蔓延火焰可以超出經過保護檢查的初始點火位置。關閉功能會停止新活動；已經造成的變化通常會保留，直到適用的恢復過程將它修復。
soil-heading=污染使自然地面逐步退化
soil=在持續工業污染下，自然地面可以一步步改變。Nauvis 的草地可能退化成泥土、荒漠與沙地；其他世界則使用各自的火山、濕地、岩石或積雪地形。降低污染，讓環境不再符合條件，就能阻止後續的污染損傷。\n\n[font=default-bold]預設設定：[/font]節制強度下，土壤檢查的基準間隔是兩分鐘，對應的基礎設定為 60 秒。季節性生態與處理延遲會影響何時輪到某個區域。五分鐘的持續污染觀測要求仍然適用。\n\n[font=default-bold]實際限制：[/font]每次檢查只考慮一小片地面，不會重畫整個區塊。最大退化深度限制一塊地面能記錄的變化步數。已到達適用變化鏈末端的地面，沒有下一步可變；每個星球始終使用自己的地形類型。
recovery-heading=環境潔淨後，已記錄的損傷有機會恢復
recovery=環境變潔淨，會給受損地面恢復的機會。ESIR 記得自己造成的地形變化，再循著這些步驟逐步回到確切的原始地面。若草地先變成泥土，後來又成了沙地，恢復就沿著已儲存的步驟返回，而不是隨意挑一種草地替換。\n\n[font=default-bold]預設設定：[/font]節制強度下，恢復間隔是八分鐘，對應的基礎設定為 240 秒。這個基礎間隔是土壤基礎間隔的四倍。區域也需要十分鐘的潔淨觀測；兩項要求可以同時推進。強度會改變恢復間隔，季節性生態不會。兩種時間要求都不保證時間一到就立即恢復。\n\n[font=default-bold]實際限制：[/font]恢復需要可靠的 ESIR 損傷記錄。在地面上施工，或由其他系統替換地面，都可能讓記錄不再適用；之後移除覆蓋物也不會重建記錄。恢復無法重建沒有記錄的舊地面或岸線，無法重建懸崖，也無法讓已毀的樹木復活。
depletion-heading=礦床耗盡可能留下痕跡
depletion=有限礦床耗盡後，附近裸露地面可能受到擾動。耗盡的位置必須在熱能採礦場、蒸汽採礦場、電動採礦場或大型採礦機的採礦範圍內，而且採礦機必須支援該資源類別。品質帶來的採礦範圍變化也會計入。普通採礦機與無限礦床不符合條件。\n\n[font=default-bold]預設設定：[/font]系統會在 56 格的擾動半徑內選出一片區域，這片區域本身的半徑是三格。其中每個合格位置都有 70% 機率改變。尚存礦石與受保護地面不會被修改。\n\n[font=default-bold]實際限制：[/font]觸發原因是礦床耗盡；耗盡事件不會告訴 ESIR 究竟是哪台採礦機完成開採。關鍵是該位置是否在合格採礦機的涵蓋範圍內。區域中的地格會逐步處理，因此採礦機停工後仍可能出現痕跡。大量資源集中耗盡時，附近請求可能合併，也可能停止接受更多請求；但已接受的請求不會只因等待太久就被丟棄。
working-heading=運作中的採礦場也會擾動周圍地面
working=符合條件的採礦場或大型採礦機，在仍開採有限礦床時也可能留下痕跡。它必須已啟用、顯示工作中狀態，且開採目標是同一地表上的有效有限礦床。這與礦床耗盡時觸發的痕跡分開運作。閒置採礦機不會產生工作痕跡。\n\n[font=default-bold]預設設定：[/font]節制強度下，兩次機會的基準間隔是十分鐘，對應的基礎設定為 300 秒。每次機會有 10% 機率申請一片採礦擾動區域，之後區域內每個合格位置再各自進行 70% 的判定。季節與處理延遲會影響實際檢查時間。\n\n[font=default-bold]實際限制：[/font]尚存礦石仍受保護，因此痕跡可能出現在附近裸露的地面。ESIR 保留一份容量有限的清單，記錄同樣的四類合格採礦機，並隨建造與移除更新；閒置的採礦機可以繼續列在其中。延遲的檢查只嘗試目前一次，不補算錯過的機會。關閉該地表的生態，會暫停檢查及等待中痕跡的套用。
mining-recovery-heading=採礦痕跡能恢復到什麼程度
mining-recovery=採礦恢復會朝痕跡形成前的地面返回。如果污染早已將草地變成泥土，採礦恢復就能讓這片地面朝泥土恢復。採礦記錄會取代更早的生態恢復步驟，因此不能再靠這份記錄找回先前的草地。後續記錄的採礦損傷仍能逐步回復。\n\n[font=default-bold]預設設定：[/font]新記錄的採礦痕跡預設啟用恢復。一般地形恢復與採礦恢復必須同時開啟，地面需要滿足潔淨觀測要求，而且恢復記錄必須仍然有效。\n\n[font=default-bold]實際限制：[/font]採礦恢復關閉時造成的損傷是永久的。之後再啟用恢復，也無法重建這些未記錄的痕跡。關閉某個地表的生態，會暫停已接受的採礦工作；重新啟用後依一般處理上限繼續，不會集中補做錯過的嘗試。
blood-heading=異星血液可以幫助受損地面恢復
blood=敵方生物或巢穴死亡時，血液效果可以幫助附近地面沿已記錄的損傷退回一步。這是直接恢復效果，不必等待一般的潔淨觀測期。它仍需要有效的 ESIR 損傷記錄、相應功能開關和一般地形保護檢查。採礦損傷也需要開啟採礦恢復。\n\n[font=default-bold]預設設定：[/font]一次合格死亡有 10% 機率，讓一小片局部區域被接受並等待處理。當處理容量有餘裕時，系統會在之後修改這片區域。\n\n[font=default-bold]實際限制：[/font]有屍體不表示地面一定會恢復，也不會留下永久的治療區域。沒有記錄時，效果不能憑空還原以前的地形。它與戰鬥中可見的死亡效果分開運作，忙碌時也會限制新接受的區域數量。
paving-heading=血液也可能腐蝕裸露鋪裝
paving=同時開啟血液效果與鋪裝腐蝕後，敵人死亡影響的區域可以剝除符合條件的石磚路或混凝土，露出已儲存的下層地格。有有效地形恢復步驟時，會優先恢復；無法進行這種恢復時，才考慮鋪裝。如果希望符合條件的裸露鋪裝保持完整，可以關閉這項功能。\n\n[font=default-bold]預設設定：[/font]血液事件通過接受判定後，腐蝕再進行一次 1% 的判定。這是已接受區域內的機率，不是在任意地方每殺死一個敵人就有 1% 機率。\n\n[font=default-bold]實際限制：[/font]被佔用或受到其他保護的鋪裝與地基不參與，而且下層地格必須仍然已知且有效。這是一般鋪裝保護的特定例外。被移除的鋪裝不會退還，也不會由恢復過程重建。即使鋪裝開關仍開著，關閉血液效果也會停止新的腐蝕嘗試。
stress-heading=污染可以讓野生樹木灰化
stress=在持續污染條件下，已適配的野生樹木可能逐漸失去顏色。它們仍然活著，也仍在原處；灰化和燒毀或變成枯木不同。ESIR 會記住原始顏色階段與自己施加的衰弱，讓這些變化日後可以逆轉。栽培植物、特殊植物、受保護地點與不支援的樹種不會受影響。\n\n[font=default-bold]預設設定：[/font]節制強度下，衰弱檢查的基準間隔是十分鐘，對應的基礎間隔為五分鐘。強度、季節性生態、觀測涵蓋情況與有限的樹木搜尋，都會影響何時輪到某棵樹。持續污染觀測的要求仍然適用。\n\n[font=default-bold]實際限制：[/font]完全灰化的樹無法再多灰化一步。如果其他系統改變了有記錄樹木的顏色階段，ESIR 可能放棄這份記錄，而不覆寫新的外觀。
greening-heading=衰弱的樹可以找回原來的顏色
greening=讓污染維持足夠久的低水準，受 ESIR 影響而衰弱的樹就能逐步恢復原貌。天然灰色的樹仍會保留天然顏色。恢復需要同一棵活樹、符合記錄的顏色階段，以及持續潔淨的觀測。\n\n[font=default-bold]實際限制：[/font]砍伐、替換或摧毀這棵樹，都會結束這次恢復機會。恢復顏色屬於樹木衰弱功能，使用自己的記錄，與地面恢復、再生、老化及腐朽分開。地面看起來健康，不保證以前的樹會回來；一棵樹正在恢復，也不表示附近每塊地面都已準備好恢復。
regrowth-heading=留下的樹木能讓林地慢慢擴展
regrowth=在持續潔淨條件下，合適的野生樹木可以在附近繁衍出一棵已適配的新樹。保留部分原生林木，就為再生留下了起點。新樹必須適合當地地面，並通過保護檢查；在 Gaia，樹種也會依當地生態區選擇。栽培作物絕不會被選為再生樹種。\n\n[font=default-bold]預設設定：[/font]節制強度下，生長機會的基準間隔是二十分鐘，對應的基礎間隔為十分鐘，再考慮季節變化與處理延遲。新位置沿任一地圖座標軸的偏移都不超過八格。四格鄰域內若已有 16 棵已適配自然樹木，就會抑制生長。所有地表共用的成功新生樹木間隔至少為十秒。\n\n[font=default-bold]實際限制：[/font]這是緩慢的局部林地擴張。孤立空地若沒有合適的存活種源樹，可能一直空著。潔淨讀數、足夠空間與處理機會必須同時具備；間隔到了，不表示每棵樹都一定能再長出一棵。
aging-heading=活樹也會變成枯木
aging=樹木老化可以移除符合條件的 Nauvis 活樹，再用原生枯木替換。它與污染衰弱各自獨立，所以綠色的樹也可能被選中。如果希望活樹保留到被其他過程移除，請關閉老化。\n\n[font=default-bold]預設設定：[/font]老化預設開啟。節制強度下的基準間隔是兩小時，對應的基礎設定為一小時，季節性生態也會影響時機。這是對搜尋區域的檢查間隔，不是每棵新樹被指定的固定壽命。\n\n[font=default-bold]實際限制：[/font]目前只有 Nauvis 有已適配的枯木替換類型。保護檢查仍然適用。活樹的消失是永久的，顏色恢復無法讓它復活。老化本身不會點火。
rot-heading=枯木可以逐漸消失
rot=枯木腐朽會隨時間移除已適配的死樹。它能清除舊林地的殘留，卻不會把枯木換成活樹。再生是另一個獨立過程，之後可能在附近建立新林地。老化與腐朽可以分別開關。\n\n[font=default-bold]預設設定：[/font]節制強度下，腐朽的基準間隔是一小時，對應的基礎設定為三十分鐘。強度、季節性生態和處理涵蓋情況會影響何時輪到某個區域。\n\n[font=default-bold]實際限制：[/font]移除的枯木不會留下恢復記錄。不支援的樹種、受保護地點與栽培植物不參與。腐朽有自己的計時，因此延遲的檢查不會突然補算區域未受觀測時錯過的每次機會。
thermal-heading=被火燒死的樹可能留下地面損傷
thermal=樹木因符合條件的火焰傷害死亡時，可能在原來的位置周圍留下一小片灼痕。地面依該星球的地形規則改變，並能記錄下來供日後恢復。環境潔淨後，地面可能修復，但樹本身已經消失。\n\n[font=default-bold]實際限制：[/font]死亡必須有符合條件的火焰來源，一般地面保護仍然適用。戰鬥火焰與自發森林火災都可能造成這種死亡。灼燒痕跡回應的是死亡事件，不會再點起一團火。因此，即使附近的樹燒毀，受保護的機器場地仍可能保持原樣。
wildfire-heading=選擇不蔓延或可蔓延的火焰
wildfire=工業污染偶爾會在已適配的野生樹木附近引發火災。區域需要污染達到或超過上限門檻、附近有合適燃料，而且點火位置未受保護。讀數低於門檻時，該區域會停止產生新的森林火災請求；已接受的點火可能仍在等待處理。這項功能不必等待土壤的五分鐘持續污染觀測期。\n\n[font=default-bold]預設設定：[/font]使用不蔓延模式。節制強度下，災害基準間隔是二十分鐘，對應的基礎間隔為十分鐘。每次合格的森林火災機會有 1% 機率嘗試點火；季節、災害輪流處理與涵蓋情況可能再延後時機。這不是每棵樹每秒的機率。所有地表的初始點火合計限制為每十秒一次，最多保留 16 筆火焰記錄。\n\n[font=default-bold]實際限制：[/font]不蔓延模式會產生不擴散的地面火焰，最多持續十秒。可蔓延模式會點起一般 Factorio 樹木火焰；後續火焰能傳到最初檢查的區域之外，並消耗生態腳本上限以外的引擎時間。關閉生態會清除其不蔓延火焰，但不會動到無關的戰鬥火焰與後續蔓延火焰。森林火災警報確認的是成功點火，不表示森林已燒毀。
flood-heading=水域可以朝沙質岸邊推進
flood=在 Nauvis，洪水可把符合條件的沙質岸線變成水域，但旁邊必須已有符合條件的淡水。它造成的是小範圍岸線變化。熔岩、石油海與氨海不受此效果影響，遠離合適岸線的任意地面也不會變成水。\n\n[font=default-bold]預設設定：[/font]每次洪水機會的機率為 2%。時機由災害間隔、強度、季節性生態與處理涵蓋情況決定，不需要降雨、低污染或看得見的天氣效果。\n\n[font=default-bold]實際限制：[/font]正北、正南、正東或正西方向直接相鄰的合適岸線，會讓最初的請求符合條件。實際改變地格前，系統會檢查地面轉水域的組合是否受支援，以及保護規則是否仍允許修改。有記錄的洪水，在損傷記錄仍有效時可以恢復；只關閉洪水不會立刻把水排掉。這是局部岸線移動，不是全域海平面模擬。
drought-heading=水域可以從沙質岸邊退去
drought=在 Nauvis，乾旱可以把合適沙岸旁符合條件的淡水變成沙地，讓沿岸多出一點裸露地面。其他星球的液體不參與，缺少所需岸線關係的水域也不符合條件。\n\n[font=default-bold]預設設定：[/font]每次乾旱機會的機率為 2%。時機由災害間隔、強度、季節性生態與處理涵蓋情況決定，沒有額外的高污染或天氣要求。\n\n[font=default-bold]實際限制：[/font]基礎設施、尚存資源與特殊地點仍受保護。等待中的變化可能在套用前變得不再合格。洪水與乾旱可以分別開關；同時啟用時，局部會隨時間有機會往相反方向變化。兩者都不模擬溫度或雨量，也不會強制岸線立刻來回切換。
cliff-heading=風化可以移除普通懸崖
cliff=懸崖風化檢查附近保護條件後，可以移除一段符合條件的普通懸崖。這會永久改變天然屏障。如果希望懸崖一直保留到你親自清除，請關閉這項功能。\n\n[font=default-bold]預設設定：[/font]一次懸崖風化機會的機率為 1%，不需要污染暴露、降雨、戰鬥傷害或測得的懸崖年齡。\n\n[font=default-bold]實際限制：[/font]特殊星球的懸崖類型不會被當作已支援的普通懸崖。即使已找到懸崖，附近的基礎設施或受保護地點仍可能阻止移除。地面恢復無法重建已移除的懸崖。
calendar-heading=每個世界都有自己的曆法
calendar=每個受支援的世界都有季節曆法。依星圖距離計算，離恆星較遠的世界通常有更長的一年。曆法用來安排季節變化，不會移動行星或改變航線。上升季、旺盛季、衰退季和低谷季是四個階段的名稱，不代表一定會有特定天氣。\n\n[font=default-bold]預設設定：[/font]基準年是 360 個 Nauvis 日，使用曆法開始時儲存的有效 Nauvis 日長。各世界的年長，是這個基準乘以該世界與 Nauvis 的距離之比的 1.5 次方。星圖方位決定一年中的起點。之後對 Nauvis 晝夜控制器的修改，不會不斷重新定義這個基準。\n\n[font=default-bold]使用曆法：[/font]管理員的曆法面板顯示基準日數、等效當地日數與模擬時長。變更年長會保留目前在季節中的位置。管理員也可以調整這個位置來預覽。
daylight-heading=改變的是白晝比例，不是一整天的長度
daylight=季節性晝長會在星球現有的一天內，延長或縮短白晝。可以想成移動日出、日落的時刻，但完整自轉一圈所需的時間不變。這會改變太陽能板接受日照的時長。晨昏過渡仍保留原來的持續時間。\n\n[font=default-bold]預設設定：[/font]Nauvis、Gaia、Vulcanus、Gleba 和 Aquilo 符合條件。假定地軸傾角為 23.5 度、緯度為 45 度。即使設定很極端，一個週期中也至少保留 2% 的全日照與 2% 的全黑夜。\n\n[font=default-bold]實際限制：[/font]時間凍結或永久日照會暫停季節調整。ESIR 也會向 Diurnal Dynamics 或改變同一組黎明、黃昏設定的其他控制器讓出控制。關閉功能時，只有上次調整仍未被改動，才會恢復原設定。Fulgora 的獨立晝夜控制器始終保有完整控制權；季節性晝長絕不會調整或恢復它的日照邊界。
modulation-heading=季節可以改變生態變化的步調
modulation=季節性生態變化會讓土壤、樹木、災害及工作採礦機痕跡的機會，在一年中變得較頻繁或較稀疏。即使季節性晝長關閉，或由其他系統控制光照，它仍可運作，Fulgora 也一樣。改變機會的步調，不會改變每次機會的成功機率。\n\n[font=default-bold]預設設定：[/font]調節強度為 25%。速率在旺盛季附近平滑上升至所選強度基準的 125%，在低谷季附近降至 75%。速率提高會縮短間隔，降低則會延長間隔。\n\n[font=default-bold]實際限制：[/font]季節不會啟用已關閉的災害，不會改變污染或潔淨觀測要求，也不會改變一般地面恢復間隔。生長機會仍需要潔淨讀數、合適種源樹、空間與處理容量。曆法不會移動行星，也不會為了季節重畫世界。冬季配色的啟動按鈕只是提示，不表示一定會下雪。
nauvis-heading=Nauvis：土壤、沙地與林木
nauvis=Nauvis 的地面可以依序經過草地、泥土、荒漠與沙地；有記錄的地面能恢復到確切的原始地形。已適配的原生樹木可以衰弱、恢復顏色與再生。Nauvis 也是首個支援淡水岸線變化的世界，並且是唯一能透過老化把活樹替換成枯木的世界。\n\n[font=default-bold]實際限制：[/font]鋪裝廠區、尚存資源、基礎設施與特殊地點仍受保護。符合條件的鋪裝腐蝕，是針對裸露鋪裝的明確例外。
gaia-heading=Gaia：保留當地景觀的特色
gaia=Gaia 的草甸和濕地可以退化成裸露的 Gaia 岩地。恢復沿著記錄返回原來的地形變體，再生則選用適合當地生態區的樹木。ESIR 放置的特殊地點設有保護範圍，讓一般生態變化不會破壞它們。\n\n[font=default-bold]實際限制：[/font]舊存檔中仍留著的地點標記，有助於判斷哪裡該受保護。還在檢查的區域，或舊保護記錄曾超過容量的區域，可能仍禁止生態變化。如果有辨識作用的標記已消失，系統無法憑空還原舊地點的確切邊界。
vulcanus-heading=Vulcanus：火山灰與火山土壤的變化
vulcanus=Vulcanus 使用自己的火山灰、火山土壤與裂隙地面變化。熔岩始終受保護，樹木效果只使用已適配的原生樹種。噴氣孔保留獨立的種群、儲量與地形變化週期。\n\n[font=default-bold]實際限制：[/font]生態不會接管噴氣孔效果，不會引進一般的地球式林地，也不會把火山液體變成淡水。
gleba-heading=Gleba：孢子需要分開看待
gleba=Gleba 保留各生態區自己的地面變化與已適配野生樹木的棲地，包括濕地放置規則。栽培植物及其特殊土壤、金沼植物與已佔用的盆地仍受保護。孢子是另一種污染物，不算有毒工業污染。\n\n[font=default-bold]實際限制：[/font]只有孢子的讀數，既不是工業污染讀數，也不能證明工業環境潔淨。因此，單靠孢子無法滿足污染地面損傷、一般恢復、樹木衰弱或顏色恢復、自然再生與污染森林火災的條件。符合條件的採礦、樹木火焰致死痕跡、血液效果、獨立災害與曆法仍可運作。開啟開關不會讓孢子變成可用的工業污染讀數。
fulgora-heading=Fulgora：它的晝夜仍由自己掌管
fulgora=Fulgora 的已適配地面可以經過岩地、沙地、塵土與沙丘變化，石油海始終受保護。它的生態曆法可以調整合格效果的步調，並改變機械樹啟動按鈕的顏色。這裡沒有已適配的原生林木類型，不能藉此長出普通樹木。\n\n[font=default-bold]實際限制：[/font]Fulgora 的獨立晝夜系統繼續掌管日照。季節性晝長絕不會讀取、改變或恢復 Fulgora 的黎明與黃昏邊界，包括全域生態或曆法設定變更時。
aquilo-heading=Aquilo：工廠周圍的積雪與冰面
aquilo=Aquilo 使用自己的積雪壓實與冰面變化，記錄恢復可以循這些步驟返回。氨海、地基與基礎設施始終受保護。季節性晝長可以改變一天中的日照比例，但不改變星球的自轉週期。\n\n[font=default-bold]實際限制：[/font]這裡沒有已適配的原生林木類型，不能用普通樹木填滿 Aquilo。生態不提供通用的凍結、融化或海洋轉換模擬。
settings-heading=設定全域規則與局部例外
settings=啟動階段的整合開關讓生態系統可用。模組設定 → 地圖提供功能開關、污染門檻、間隔、機率、星球啟用狀態與處理上限。管理員可在地形與生態中覆寫既有地表上支援的設定；重設地表覆寫設定會移除局部例外。選擇星球或閱讀它的報告，不會建立地表。\n\n[font=default-bold]實際限制：[/font]最終行為由全域設定、星球規則與明確的地表覆寫值共同決定。總開關停用、不支援的地形與保護規則仍有優先權。升級保留已儲存的設定。關閉恢復會暫停恢復，不會立刻還原地面。關閉其他效果也不會退還已毀的樹木、懸崖或鋪裝。關閉啟動整合時，只有 ESIR 上次日照調整仍未被改動的地方，才會還原季節性日照的原設定。
presets-heading=強度決定步調，處理量決定涵蓋速度
presets=強度決定生態變化機會應有多頻繁，處理預設決定系統能檢查多少地面，以及多快處理等待中的工作。提高處理量，可以讓忙碌或探索範圍廣的地圖更早得到關注，但不會提高每次檢查所設定的成功機率。\n\n[font=default-bold]預設設定：[/font]節制使用 0.5 的速率倍率，標準為 1，強烈為 2，自訂使用你選擇的倍率。更高的強度不會啟用已關閉的功能。處理預設為輕量。七種具名預設是超低負載、低負載、輕量、均衡、詳細、高保真與超高保真，另有自訂。輕量每 16 刻處理一小批工作，每 32 刻允許一次實體搜尋。\n\n[font=default-bold]實際限制：[/font]處理與儲存上限由所有地表共用，自訂也有有限上限。降低儲存上限會保留既有記錄，但在有空間前阻止新記錄。恢復記錄空間已滿時，ESIR 會拒絕新的可逆損傷，而不遺忘舊地面該如何恢復。較高的預設可能需要更多處理時間，沒有任何預設能保證每座工廠都達到特定 UPS。
reports-heading=閱讀目前查看世界的報告
reports=左上角的銅質機械樹會開啟目前查看地表的生態報告，也包含遠端視圖。樹葉顏色隨曆法改變：上升季是黃綠色，旺盛季是翠綠色，衰退季是琥珀紅，低谷季是青色。將滑鼠停在按鈕上，就能查看季節名稱。沒有可用曆法時，按鈕維持翠綠，並提示季節資訊無法使用。\n\n[font=default-bold]使用報告：[/font]簡潔頁以實地報告的語言描述已觀測的地面、林木、採礦擾動與季節條件。進階頁進一步顯示實際生效的地表設定、讀數、等待工作、因保護而拒絕的變化與維護狀態，並將這些資訊和共用的全域上限與計數區分開來。沒有觀測就是未知，不是健康。\n\n報告開著時，會更新先前已收集的事實；關閉後就停止這些報告更新。啟動按鈕獨立的顏色檢查仍可繼續，不必搜尋地形。
alerts-heading=選擇你想收到哪些變化通知
alerts=生態通知會出現在 Factorio 的一般警報視窗，帶有圖示和可以前往的位置。你可以在生態視窗的警報頁，或模組設定 → 每位玩家中選擇；兩處修改的是同一組個人偏好。警報代表效果確實發生，不只是安排了一次檢查。\n\n[font=default-bold]預設設定：[/font]森林火災、洪水、乾旱、懸崖風化與鋪裝腐蝕的警報已開啟。其他類別，包括污染損傷、恢復、採礦與樹木效果，初始關閉，可以分別選擇。所有實際地表預設都選取；僅限目前地表是另外的可選篩選條件。例行日照調整不會發出警報。\n\n[font=default-bold]實際限制：[/font]你的陣營必須目前能看見事件區塊，先前探索過並不夠。管理員可以略過可見性要求，但類別與地表篩選仍適用，失去管理員身分後例外也會撤銷。附近事件會合併，每位玩家最多保留四條生態警報，一起事件可在 60 秒內發出通知。離線事件不會累積起來留待之後傳送。警報過期絕不會刪除恢復記錄或等待中的採礦工作。
maintenance-heading=重建視窗告訴你的是什麼
maintenance=ESIR 重建視窗顯示有明確終點的準備與修復工作：轉換舊存檔資料、進行初次發現巡查、檢查變更後的設定，以及修復已存資訊。地表停用或因其他原因無法繼續時，工作可以等待。總工作量未知時，視窗只顯示已完成的工作，不會編造百分比。\n\n[font=default-bold]實際限制：[/font]初次發現巡查會在開始時固定參與地表的清單。每個地表的走訪在沒有更多區塊，或達到 100,000 次區塊訪查時結束。達到上限代表涵蓋範圍尚未驗證，不表示地圖每個角落都檢查過了。\n\n日常觀測、恢復、工作採礦機檢查與已接受的採礦痕跡會獨立繼續，顯示在進階頁，不會讓重建視窗永遠開著。舊存檔會逐步準備；重新開啟或啟用生態，不會補做停用期間錯過的每次機會。
troubleshooting-heading=景觀遲遲沒變，可以從哪裡查起
troubleshooting=先打開目前查看地表的進階頁。確認生態在這裡確實啟用，也支援這個世界。接著檢查有沒有合適的地面或樹木，需要時是否有可用污染讀數，連續觀測是否足夠，以及選定位置周圍是否受保護。最後看看是否還有工作在等待，或儲存空間已滿。安靜的區域可能只是需要更多時間，尤其是機率低、間隔長的效果。\n\n[font=default-bold]有幫助的檢查：[/font]地面到達變化鏈末端，就無法繼續退化。再生需要一棵仍存活的已適配種源樹。採礦需要在合格採礦機涵蓋範圍內真正耗盡有限礦床，週期痕跡則需要合格採礦機確實顯示工作中。火災需要工業污染、附近已適配的燃料，以及預期的不蔓延或可蔓延模式。只有成功嘗試計數，不能證明已經建立點火。恢復需要原來的 ESIR 記錄，採礦恢復還要兩種恢復開關都開啟。\n\n[font=default-bold]實際限制：[/font]ESIR 與 TerrainEvolution 和 TerrainEvolution2 不相容；ESIR 會向 Diurnal Dynamics 讓出季節性日照控制。探索過的地面越多、活動地表越多，在同樣全域處理額度內完成涵蓋就越慢。讀數未知或檢查延遲，並不能證明土地健康，也不能直接認定功能壞了。
