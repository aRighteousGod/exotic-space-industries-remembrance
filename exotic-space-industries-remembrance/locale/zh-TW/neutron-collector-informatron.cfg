menu_neutron_collector=中子收集器
title_neutron_collector=中子收集器
neutron-collector=中子收集器
neutron-collector-text=[color=orange]中子收集器[/color] [item=ei-neutron-collector] 是量子時代的充能設備。它會從附近裂變來源、阿魁洛星上運作中的太空時代高密度電漿核融合反應堆洩出的微弱中子，以及更強且可調的 ESIR 熱核融合反應堆捕捉自由中子，並利用這些中子通量把 [item=ei-neutron-container] 充成 [item=ei-charged-neutron-container]。\n\n它不會製造中子。它只是收割附近反應爐沒能留住的那一部分。收集器一次只會綁定一個來源，不會把周圍所有機器的產出平均，而是優先選擇範圍內最強、仍然在線的產出。
neutron-collector-2=綁定、距離與待機
neutron-collector-text-2=效率由來源類型、活動狀態與佈局幾何共同決定。阿魁洛星的太空時代高密度電漿核融合反應堆只有在運作時才提供微弱洩漏；ESIR 熱核融合反應堆仍是更強、可透過溫度與注入設定調整的來源。顯示出來的效率始終限制在 0-300%，距離越遠，充能時間越長。\n\n如果附近沒有有效來源，中子通量低於充能門檻，綁定來源轉入休眠，輸出被堵住，或電路條件把組裝機停掉，收集器就會退回待機配方。這樣機器仍然可以打開，診斷資訊也不會消失。
neutron-collector-3=電路遙測
neutron-collector-text-3=當收集器接入電路網路時，它的隱藏介面會向收集器所在的網路發布 5 個專用訊號：[virtual-signal=ei-neutron-efficiency]、[virtual-signal=ei-neutron-distance]、[virtual-signal=ei-neutron-collector-agent]、[virtual-signal=ei-neutron-source-agent]、[virtual-signal=ei-neutron-scan-agent]。\n\n效率範圍是 0-300。距離以 0.1 格為單位輸出。收集器代理為 1 運作、2 閒置、3 阻塞。來源代理為 1 在線、2 休眠、3 缺失。掃描代理為 1 穩定、2 待重算、3 待重新綁定。這些訊號會在收集器的計畫遙測輪次中刷新，而不是每 tick 都刷新。
