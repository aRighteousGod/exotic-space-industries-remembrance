[exotic-industries-informatron]
orbital-native-title=優先使用原生物流
orbital-native-shipping=普通火箭配送和平台間轉運使用 Factorio 原生請求及供貨功能，無需群組設備。請在原生視窗設定來源、最小配送量及供貨狀態。原生自動配送負責裝貨、混載、選擇目標和發射時機。側邊面板顯示實際原生目標。\n\n新建上行鏈路預設選擇原生自動配送，但放置時不會修改發射井。點擊原生自動配送才會明確啟用自動請求。既有上行鏈路保留群組控制。只有在載荷為空、沒有運送中的貨物且未在發射時才能切換控制方。
orbital-native-cohort=若需固定目標或由工廠／電路裝貨，請在每個參與的平台放置 [entity=ei-platform-transponder]，並在發射地點設置選擇器、通電的協調器和已綁定發射井的上行鏈路，再選擇群組控制。新選擇器預設使用策略模式；手動模式依名稱選擇，電路模式讀取 [virtual-signal=ei-platform-id]。\n\n目標保持沿用原規則：持續保持直到需求滿足，單次在一次發射後釋放，閾值模式在剩餘需求高於閾值時保持。ID、綁定修復、租約操作和閾值位於進階設定。貼上設定、複製和藍圖只複製組態，不複製活動租約。自動 ID 會重新分配，重複的手動 ID 會回報衝突。複製的上行鏈路僅在旁邊有唯一明確可用的發射井時自動綁定。
orbital-native-sources=請求和需求可依行星、平台或所有來源篩選。「所有來源」允許兩種配送路徑。火箭任務排除僅限平台來源的請求。「運送中」仍為全部到貨總量。需求先逐一平台計算再加總：max(0, 請求 − 庫存 − 運送中)。其他平台的庫存不能抵銷本平台的缺口。\n\n平台間轉運遵循原生請求和供貨規則。ESIR 不修改請求分區或儲備／補貨策略。混載中出現未請求的物品類型或品質時，群組會暫停發射；已請求類型的超額數量仍可傳送。面板會指出需要移除的貨物。從外部啟用原生請求會暫停群組配送。
orbital-native-radar-title=原生雷達遙測
orbital-native-radar-one=[font=default-bold]一個平台，一個頻道[/font]\n1. 在樞紐啟用所需庫存／狀態的紅線輸出。如使用「設定請求」，將輸入設為綠線並隔離網路。\n2. 將紅線輸出及發出專用連線存在訊號（例如 L=1）的常數運算器連接至通電雷達。選擇宇宙模式與此平台專用的訊號頻道。\n3. 接收工廠使用同陣營、同宇宙頻道的通電雷達，將其紅線接入接收電路，並與請求輸入分離。\n\n設定的頻道識別該平台，移動時仍持續廣播。存在訊號=1 且沒有物品訊號表示庫存為空；沒有存在訊號則可能是傳送端或連線無法使用。兩端都需要供電。此路徑無需掃描器輪詢，但原生電路和雷達仍有運算成本。
orbital-native-radar-shared=[font=default-bold]共用庫存頻道[/font]\n將多個樞紐的庫存輸出接入同陣營、同宇宙頻道的雷達。訊號會相加。每個傳送端發出相同的存在訊號，其總數可表示目前連線的傳送端數量。請將此網路標為「彙總庫存」。它無法保留各平台的歸屬，也不代表精確需求或保證可供配送的數量。\n\n雷達傳輸電路訊號；樞紐不輸出已設定請求或已確認的運送中貨物。請求／運送中／需求請使用精確掃描器。切勿將無線彙總值作為單一平台需求輸入群組配送。ESIR 不建立中繼器、不分配頻道，也不修改接線。
