[item-description]
ei-loader=具有一個共用過濾器的裝卸機。只搬運未堆疊物品。
ei-fast-loader=具有一個共用過濾器的快速裝卸機。只搬運未堆疊物品。
ei-express-loader=具有一個共用過濾器的裝卸機。堆疊大小可調，最高 [font=default-bold]2[/font]。
ei-turbo-loader=具有兩個車道過濾器的裝卸機，可分別控制左右車道。堆疊大小可調，最高 [font=default-bold]2[/font]。
ei-neo-loader=具有兩個車道過濾器的裝卸機，可分別控制左右車道。堆疊大小可調，最高為目前傳送帶堆疊上限。

