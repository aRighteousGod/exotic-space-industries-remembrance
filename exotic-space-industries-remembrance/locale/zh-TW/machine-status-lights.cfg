[mod-setting-name]
ei-production-machine-lights=生產建築狀態燈

[mod-setting-description]
ei-production-machine-lights=適用於28種ESIR生產建築：在20種建築原有的指示燈上加入共23個同色燈罩與微光，沒有指示燈的8種建築不會獲得狀態燈。多色模式下，Bottleneck Lite僅略過這20種建築，其色彩設定不會改變ESIR的配色。原有生產過程光效在所有模式下均保留。電弧爐的工作光效仍由獨立的閃爍設定控制。 燈罩和微光顏色一致：運作時為綠色，輸出已滿時為黃色，電力不足時為橘色，有能源但因其他原因停止時為紅色。沒有能源時，新增部分不可見。 恢復原有的25處白色工作照明。電弧爐、電漿加熱器和鑄造機保留原有效果，不加入狀態燈罩或微光。不會改變Bottleneck Lite的顯示。 不加入狀態燈罩或照明。建築貼圖上的指示燈和生產過程光效維持不變。不會改變Bottleneck Lite的顯示。

[string-mod-setting]
ei-production-machine-lights-off=關閉
ei-production-machine-lights-status=多色狀態燈
ei-production-machine-lights-original=原始白光

