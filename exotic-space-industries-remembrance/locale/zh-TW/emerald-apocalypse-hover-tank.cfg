[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=翡翠天啟懸浮坦克
title_emerald_apocalypse_hover_tank=翡翠天啟懸浮坦克
emerald-apocalypse-hover-tank=翡翠天啟懸浮坦克
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank]是異質時代晚期的懸浮堡壘：沉重到無法優雅，虔誠到拒絕墜落。發射器圓環把車體托在世界上方，固定砲把朝向化作判詞。
emerald-apocalypse-hover-tank-2=水晶充能
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge]是為[item=ei-emerald-apocalypse-cannon]攜帶的單一封存裂變。開火時，坦克並不散播怒意。它開啟一道綠色戒律，並讓戰場作答。
emerald-apocalypse-hover-tank-3=軌道碎晶教義
emerald-apocalypse-hover-tank-text-3=軌道碎晶是腳本教義，不是砲塔裝備。碎晶流形把碎晶環從3枚提升到6枚活動碎晶。裝填禱文把每枚碎晶的節奏從1.17秒壓縮到0.92、0.75，最後到0.58秒。目標裁決不再只看距離，而是用威脅評分衡量巢穴、砲塔、生命值、傷勢與距離。裁決孔徑會拓寬光束，讓每次命中把有上限的傷害溢向附近目標或光束走廊中的目標。
emerald-apocalypse-hover-tank-4=軌道碎晶控制台
emerald-apocalypse-hover-tank-text-4=打開坦克物品欄時，旁側會展開緊湊的碎晶面板。每輛已放置坦克都可維持0到已研究上限之間的碎晶數量。分散索敵會把判決分配給附近最佳威脅；Focus會命令所有活動碎晶攻擊同一個目前目標。顯示的DPS會計入活動碎晶數量、雷射武器傷害7+重複科技，以及已放置坦克的品質。

emerald-apocalypse-hover-tank-5=車體教義
emerald-apocalypse-hover-tank-text-5=車體教義是有限的。蓄能教義把蓄能從9.48秒縮短到8.5、7.58、最終6.67秒，每級教義都會響起對應的更短充能聲。慣性誓約把發射後封印從15秒降到13.17和11.33秒。聖盾盟約讓護盾傷痛回應附近敵人。向量龍骨改善懸浮底盤而不移除重型側滑。坍縮敕令強化52格終點波，但不擴張邊界。
emerald-apocalypse-hover-tank-6=解封控制
emerald-apocalypse-hover-tank-text-6=天啟遞歸會開啟每輛坦克的開關，預設開啟：充能回收、龍骨尾跡、分枝傷痕、分裂尾跡和解封衝擊。這些不是溫和教義。若某輛坦克的誓約必須保持狹窄，請單獨關閉。
