ei-emerald-fusion-core-equipment=封存在天啟車體內的翡翠心臟。核心不會嗡鳴；它誦讀壓力。
ei-emerald-aegis-shield-equipment=與懸浮坦克誓約相連的稜鏡護盾膜。來襲之力撞上它，彷彿忽然想起了錯誤的幾何。

