[item-description]
ei-emerald-apocalypse-hover-tank=一座遺物般的懸浮堡壘，承載固定的水晶巨砲與拒絕觸地的心臟。它以壓力之姿推進，並在確信曾經站立的地方留下翡翠色的寂靜。
ei-emerald-apocalypse-cannon=固定在車體上的水晶光束砲。它不追蹤目標。它只審判坦克正面所指的一切。
ei-emerald-apocalypse-charge=為翡翠天啟砲封存的水晶裂變。一道誓言，一次釋放，一處刻進世界的綠色傷口。

[entity-description]
ei-emerald-apocalypse-hover-tank=由翡翠發射器托起的遺物懸浮堡壘。砲管在開火前聚集壓力；充能彈化作電漿、後座力，以及確信之處留下的綠色空缺。

[technology-description]
ei-emerald-apocalypse-hover-tank=喚醒翡翠天啟懸浮坦克：這台漂浮的攻城引擎讓固定水晶巨砲把前進化為教義，再把教義化為廢墟。
ei-emerald-shard-manifold-1=將翡翠天啟的軌道碎晶教義提升到4枚活動碎晶。
ei-emerald-shard-manifold-2=向碎晶流形編入第二道加固，將教義提升到5枚活動碎晶。
ei-emerald-shard-manifold-3=完成流形誓約，讓6枚活動碎晶同時回應坦克。
ei-emerald-reload-litany-1=將軌道碎晶裝填教義縮短到每枚0.92秒。
ei-emerald-reload-litany-2=反覆誦讀禱文，直到碎晶環每0.75秒重新成列。
ei-emerald-reload-litany-3=將裝填節律封在0.58秒：少些等待，多些審判。
ei-emerald-target-verdict=讓軌道碎晶優先選擇巢穴、砲塔、近處敵人和已經受傷的目標，而非把判決浪費在較小威脅上。
ei-emerald-verdict-aperture-1=在碎晶打擊周圍開啟第一道翡翠孔徑，並附加有上限的次級傷害。
ei-emerald-verdict-aperture-2=將碎晶的衝擊孔徑擴展成更寬的範圍判決。
ei-emerald-verdict-aperture-3=讓碎晶判決化為足以懲罰密集敵群的翡翠傷口。

ei-emerald-charge-catechism-1=讓砲管更快祈禱，將天啟蓄能縮短到8.5秒。
ei-emerald-charge-catechism-2=再次壓縮翡翠音節，將蓄能縮短到7.58秒。
ei-emerald-charge-catechism-3=封定最凶烈的節奏：發射前6.67秒。
ei-emerald-inertial-oath-1=讓車體更快從後座中恢復，發射後冷卻降至13.17秒。
ei-emerald-inertial-oath-2=硬化後座誓約，發射後冷卻降至11.33秒。
ei-emerald-aegis-covenant-1=把護盾痛楚轉化為只傷敵人的翡翠電漿回擊。
ei-emerald-aegis-covenant-2=深化聖盾盟約，膜受傷時回擊更遠更強。
ei-emerald-vector-keel-1=調整懸浮龍骨，在保留重型側滑的同時改善操控。
ei-emerald-vector-keel-2=進一步改善倒車、制動與漂移控制。
ei-emerald-collapse-mandate-1=提高終點坍縮壓力，但讓傷痕保持有界。
ei-emerald-collapse-mandate-2=讓同一52格裁決承載更多電漿。
ei-emerald-collapse-mandate-3=完成敕令：邊界不變，裁決更殘酷。
ei-emerald-apocalypse-recursion=解封每輛坦克的危險控制：充能回收、尾跡、分枝傷痕、分裂光束和過量衝擊。

