ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=四道發射器圓環短暫回應地面，只留下克制的稜鏡邊緣。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=當運動化為壓力時，發射器在車體下寫出穩定的翡翠圓環。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=圓環增亮、疊加，並在每個懸浮足周圍剪裂成薄荷綠的稜鏡碎片。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=每個發射器都在遺物下打開緻密的發光印記，其暴烈近乎虔誠。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=調節器已經破裂；每個懸浮足都可能迫使地面記住坦克的經過。

