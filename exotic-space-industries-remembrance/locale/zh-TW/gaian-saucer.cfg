[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=船體封住自己的殘像，穿過世界而不留下可見記憶。
ei-gaian-saucer-wake-visual-fidelity-lean=只有纖薄的色差拒絕跟隨外殼，短暫而守律。
ei-gaian-saucer-wake-visual-fidelity-standard=尾跡清楚發聲，然後在成為教義前淡去。
ei-gaian-saucer-wake-visual-fidelity-cinematic=尾跡擴展、停留，並隨轉向誓約彎曲。
ei-gaian-saucer-wake-visual-fidelity-maximal=外殼在所經之處留下濃密發光的運動傷口。
ei-gaian-saucer-wake-visual-fidelity-unbounded=束縛被解除；只要世界承受得住，飛碟便可寫下每一道閃痕。

