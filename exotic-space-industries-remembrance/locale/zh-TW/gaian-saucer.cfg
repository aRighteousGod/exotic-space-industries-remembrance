gaian-saucer-text=[item=ei-gaian-saucer] 滑跡飛碟是一艘蓋亞懸浮器：Spidertron 指揮核心被葬入拒絕腿部的外殼。貨艙、裝備格架與虛空供養的驅動，使它成為穿越敵意門檻的朝聖器具。
gaian-saucer-2=尾跡共鳴
gaian-saucer-text-2=目前尾跡誓約為 [font=default-bold]__1__[/font]。它只改變外殼身後投下的色差記憶：滑跡綻放得多明亮，轉向傷痕停留多久，以及世界被要求記住多少通行。飛碟本身不變。
