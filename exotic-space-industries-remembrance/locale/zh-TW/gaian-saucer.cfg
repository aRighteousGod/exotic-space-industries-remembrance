[item-description]
ei-gaian-saucer=快速的蓋亞懸浮殼體，具備封存貨艙、裝備格架與不可見的腿。它以被記住的步伐移動，並在身後留下色差裂痕。

[entity-description]
ei-gaian-saucer=圍繞 Spidertron 指揮核心鑄成的快速蓋亞懸浮框架。\n它迫使地面記住虛假的腳步，藉此滑行。當尾跡誓約更強時，機體身後的通行會綻成色差滑跡。

[recipe-description]
ei-gaian-saucer=將 Spidertron 指揮核心重置進蓋亞懸浮殼，剝除發射器，只讓引擎記住無肢的運動。

[technology-description]
ei-gaian-saucer=解鎖滑跡飛碟：一艘蓋亞懸浮器，其貨艙、裝備格架與色差尾跡讓移動成為被大地銘記的誓言。

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=滑跡飛碟尾跡共鳴

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=決定滑跡飛碟能以多強的烈度記住自己的通行。誓約只觸及色差尾跡；船身、貨艙、格架、驅動、殼體與製造方式不變。

