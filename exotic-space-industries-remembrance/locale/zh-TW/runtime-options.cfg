[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=最短的破裂。4 個環、嚴格上限、沒有次級家族點綴，也沒有 massive-explosion。
ei-flammable-rupture-fidelity-runtime-standard=預設設定。6 個環、中等上限、1 個有意義的次級點綴，以及節制的 massive-explosion。
ei-flammable-rupture-fidelity-runtime-cinematic=8 個環，更高的煙霧與火焰預算，更豐富的家族點綴，以及更慢的外擴綻放。
ei-flammable-rupture-fidelity-runtime-unbounded=移除硬性視覺上限，並讓排程器在同一 tick 內積極清空已就緒的環。它追求的是場面，不是安全。
ei-gaian-saucer-wake-visual-fidelity-runtime-off=船體封住自己的殘像，穿過世界而不留下可見記憶。
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=只有纖薄的色差拒絕跟隨外殼，短暫而守律。
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=尾跡清楚發聲，然後在成為教義前淡去。
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=尾跡擴展、停留，並隨轉向誓約彎曲。
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=外殼在所經之處留下濃密發光的運動傷口。
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=束縛被解除；只要世界承受得住，飛碟便可寫下每一道閃痕。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=腹部封閉圓環，移動時不顯示懸浮微光。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=四道發射器圓環短暫回應地面，只留下克制的稜鏡邊緣。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=當運動化為壓力時，發射器在車體下寫出穩定的翡翠圓環。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=圓環增亮、疊加，並在每個懸浮足周圍剪裂成薄荷綠的稜鏡碎片。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=每個發射器都在遺物下打開緻密的發光印記，其暴烈近乎虔誠。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=調節器已經破裂；每個懸浮足都可能迫使地面記住坦克的經過。
