[item-description]
ei-singularity-lance=圍繞懸浮晶體之心建成的異星誓約引擎。它的炫彩光線並非單純灼燒目標，而是把目標從「完整」的記憶中切離。

[entity-description]
ei-singularity-lance=升起的晶體祭壇，專為聚焦異星暴力而造。稜晶懸浮在機器上方，聚攏不可能的色彩，並沿選定直線釋放為奇點光矛。

[exotic-industries-informatron]
menu_singularity_lance=奇點光矛
title_singularity_lance=奇點光矛
turrets-text-6=[item=ei-singularity-lance]奇點光矛是一套異星刃式協議，圍繞懸浮稜晶與金字塔祭壇建成。它囤積晶體電荷，直到被選中的直線變成切口。光束不是彈丸，而是一道被拖過空間的判詞，讓火焰、焦痕與沉默在下一次呼吸裡找到目標。
singularity-lance=奇點光矛
singularity-lance-text=[item=ei-singularity-lance]奇點光矛是一台緊湊的異星時代處刑引擎。懸浮晶體吊在金字塔冠頂上方，吞飲巨大的電脈衝，並透過在戰場上打開一道明亮創口來回應目標，而不是把每個受害者都當成獨立彈丸追蹤。
singularity-lance-2=炫彩見證
singularity-lance-text-2=每次耗能射擊都會立即造成直擊與貫穿傷害。光束是傷口的見證，不是引信。研究終末坍縮後，原瞄準點會收縮半秒，再釋放獨立的範圍傷害。
singularity-lance-3=見證甄別
singularity-lance-text-3=即使眾多長矛同時開火，切線、創傷印記與坍縮預警仍會保留。過量焦痕與裝飾優先削減，傷害不依賴視覺演出。
singularity-lance-4=見證誓約
singularity-lance-text-4=目前視覺精細度：__1__。所有設定均保留已研究升級的核心形狀動畫與流動色彩；更高精細度增加輝光、冠狀閃光、焦痕與聲音。放置後查看長矛狀態，可讀取目前陣營的持續直擊DPS。創傷記憶與遺言的額外威力須滿足條件。
