[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=短促光束及所有已研究升級的標誌形狀，不添加裝飾性輝光或焦痕。
ei-singularity-lance-visual-fidelity-standard=光線被清楚記住，然後在傷口成為教義前放手。
ei-singularity-lance-visual-fidelity-cinematic=光束殘影持續更久，增加輝光、裝飾性焦痕和聲音。
ei-singularity-lance-visual-fidelity-maximal=光束殘影持續更久。預兆保持精確時序，裝飾數量仍受限制。
ei-singularity-lance-visual-fidelity-unbounded=光束殘影持續最久。保留舊名稱，但裝飾上限仍維持世界運轉的節奏。

