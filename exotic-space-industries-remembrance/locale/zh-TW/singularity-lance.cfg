[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=只允許必要的痕跡越過切口：短促光束、短暫見證、守律的火焰與焦痕。
ei-singularity-lance-visual-fidelity-standard=光線被清楚記住，然後在傷口成為教義前放手。
ei-singularity-lance-visual-fidelity-cinematic=更多切口被允許停留：更明亮的切片、更豐盛的見證，以及傷痕上更長久的輝光。
ei-singularity-lance-visual-fidelity-maximal=稜晶得到受束縛的啟示：密集光束與長存見證仍由制御壓住。
ei-singularity-lance-visual-fidelity-unbounded=制御被打碎；光矛會把它能迫使世界承受的每一道閃痕都寫下來。

