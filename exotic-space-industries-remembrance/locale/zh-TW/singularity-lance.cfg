[mod-setting-description]
ei-singularity-lance-visual-fidelity=決定奇點光矛會以多強的烈度記住每一道切口。誓約只觸及光束見證、輝光、火焰、焦痕與聲響；刃的飢渴、抵達之距、形體與鑄造不變。啟示見證索取被束縛的顯現。解縛見證打碎制御，讓稜晶寫下世界還能承受的每一道傷。

