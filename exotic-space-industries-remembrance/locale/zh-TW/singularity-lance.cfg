[mod-setting-description]
ei-singularity-lance-visual-fidelity=決定奇點光矛如何以光記住每一道切口。所有預設均保留切線、傷痕印記、坍縮預兆和遺囑輪廓。更高預設增加輝光、光束殘影、裝飾性焦痕和聲音。高負載時仍限制裝飾數量；傷害、能耗和射程不變。

