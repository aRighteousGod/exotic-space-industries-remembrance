informatron-body=紅線控制已啟用覆寫的欄位，綠線輸出報告。零也是實際輸入值。五種模式和三種報告策略從一開始就可用。研究提高範圍、掃描能力和能效；品質還會提高這些性能和生命值。\n\n一次觀測繪製一個區塊，並取樣存活的敵對軍事目標。位置和時間表示最後一次觀測，不會持續追蹤目標。有效的零目標報告與無法使用的資料不同。每次查詢最多保留128個候選，每個工作集合最多2,048筆紀錄。截斷後的數量是下限。\n\n監視不生成地形。勘測在全體雷達中每30刻最多提交一次生成要求。60秒仍無法完成的要求會被放棄並標記涵蓋不完整。改變範圍設定會取消未完成工作並清除報告。暫停、凍結和無效設定會使報告失效；完成一次脈衝後等待時可以保留結果。取消的工作不退還已消耗電力。\n\n全體雷達共用每秒最多120次觀測啟動，之後還受電力、生成和目標處理限制。速度設定是要求值。面板顯示自放置以來的平均實測速率、理想耗時和上一輪實際耗時。波束跟隨已完成的觀測；天線動畫不代表準確方向。\n\n待機和觀測由同一個隱藏電力緩衝設備供電。複製和修復後的緩衝設備初始為空。升級保留設定並轉移現有電力，但不超過新容量。普通雷達仍可使用。\n\n基礎電力參數：掃掠雷達待機功耗1 MW，每次觀測8 MJ，輸入上限64 MW，儲能容量16 MJ；相位陣列雷達待機功耗2 MW，每次觀測5 MJ，輸入上限128 MW，儲能容量10 MJ。品質最多增加4區塊半徑和50%掃描能力，並使每次觀測耗能最多降低20%。這些加成與研究效果共同生效，品質加成以傳奇等級為上限。品質不改變待機功耗或共用處理上限。暫停或等待脈衝時仍消耗待機電力。輸入上限是充電功率上限；實際耗電量取決於待機時間和已接受的觀測次數。
