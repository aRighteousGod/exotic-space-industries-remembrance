description=可透過研究升級的定向雷達。基礎最大半徑：__1__區塊。設備上限：每秒__2__次觀測。紅線輸入控制，綠線輸出報告。開啟以設定。實際更新速度受電力和共用處理能力限制。研究和品質提高範圍、掃描能力和能效。
