tip-mode=1 全周，2 扇區，3 環帶，4 脈衝，5 固定方位。各模式分別保留手動範圍設定。
tip-radius=正值會限制在研究和品質允許的最大範圍內。一區塊為32格。
tip-near=必須小於外半徑。用於環帶、脈衝和固定方位模式。
tip-start=順時針涵蓋區間的起點，與實際掃描方向無關。
tip-stop=順時針涵蓋區間的終點，支援跨越北方。兩端相同表示360°。
tip-bearing=反覆觀測寬32格的長條區域。
tip-speed=0暫停。100要求設備、研究和品質允許的上限；共用處理能力可能降低實際速度。
tip-direction=1 順時針，-1 逆時針，0 在扇區內往返。固定方位也接受0。
tip-policy=監視只處理已生成且已繪製到地圖上的區塊。勘測允許生成新地形。
tip-contacts=保留近期各目標的最後觀測、一次發布上一輪完整掃描，或僅保留最近一次觀測。
tip-expiry=從實際觀測時刻起保留1–300秒，而非從發布時間起計算。
tip-run=正訊號運作，零或負值暫停。取消的已付費工作不退還電力。
tip-trigger=上升緣啟動一次掃描。忙碌時忽略額外觸發。保持訊號直到「掃描中」輸出確認，再歸零後觸發。按鈕可手動啟動。
