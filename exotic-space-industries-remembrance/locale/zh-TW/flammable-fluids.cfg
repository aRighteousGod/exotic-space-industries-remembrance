[mod-setting-name]
ei-flammable-rupture-fidelity=可燃破裂保真度
ei-fluid-safety-ignored-entities=流體安全忽略的實體

[mod-setting-description]
ei-flammable-rupture-fidelity=決定可燃流體破裂時，視覺效果與危險傳播要鋪得多密。精簡最克制。標準是預設值。電影會把場面拉成更多環。無上限會移除硬性效果上限，大型儲槽破裂時可能嚴重拖垮 UPS。
ei-fluid-safety-ignored-entities=ESIR 流體安全與可燃破裂系統應忽略的實體原型名稱。可用逗號、分號、空格、定位字元或換行分隔。預設值會保護 Interplanetary Fluid Funnel / Linked Pipe 的輔助實體；刪除名稱即可讓 ESIR 安全系統重新處理它們。

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=精簡
ei-flammable-rupture-fidelity-standard=標準
ei-flammable-rupture-fidelity-cinematic=電影
ei-flammable-rupture-fidelity-unbounded=無上限

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=最短的破裂。4 個環、嚴格上限、沒有次級家族點綴，也沒有 massive-explosion。
ei-flammable-rupture-fidelity-standard=預設設定。6 個環、中等上限、1 個有意義的次級點綴，以及節制的 massive-explosion。
ei-flammable-rupture-fidelity-cinematic=8 個環，更高的煙霧與火焰預算，更豐富的家族點綴，以及更慢的外擴綻放。
ei-flammable-rupture-fidelity-unbounded=移除硬性視覺上限，並讓排程器在同一 tick 內積極清空已就緒的環。它追求的是場面，不是安全。

[exotic-industries-informatron]
menu_flammable_ruptures=可燃破裂
title_flammable_ruptures=可燃破裂

flammable-ruptures=可燃流體破裂
flammable-ruptures-text=儲槽、管線本體、地下流體連結、液罐車，以及帶流體的機器，只要在死亡時內部仍困著足夠多的可燃流體，就可能發生破裂。執行時讀取的是最終載入後的流體原型，而不是手寫白名單，所以石油產物、氣體管線與異質燃料混合物都會保留各自不同的後果語言。\n\n觸發仍然會看致死傷害類型。火焰、撞擊、爆炸、電漿與其他高能死亡，比寒冷或毒性更容易點燃破裂。
flammable-ruptures-2=保真模式
flammable-ruptures-text-2=目前啟動模式：[font=default-bold]__1__[/font]\n\n[font=default-bold]精簡[/font]會把整段序列壓得更短、更緊。[font=default-bold]標準[/font]是預設路線。[font=default-bold]電影[/font]會把更大的綻放分攤到更多 tick 上。[font=default-bold]無上限[/font]會取消硬性上限，並讓排程器在同一 tick 內盡可能激進地清空已就緒的環。
flammable-ruptures-3=傳播與代價
flammable-ruptures-text-3=污染會在死亡時立刻套用，但破裂的其餘部分現在會按環向外推進。爆炸、煙霧、火焰鋪設、焦痕以及對附近目標的傷害只會預先計算一次，然後在後續多個 tick 中釋放，因此一群巨型儲槽不會再試圖在一幀裡把整場末日一次生成完。\n\n地下成對管線的後續也走同一套佇列。無上限模式本來就對效能很危險：四個滿載的 silo-2 依然可以很壯觀，但代價也還是由你承擔。
flammable-ruptures-4=平台與管線
flammable-ruptures-text-4=在太空平台上，破裂仍會保留傷害與沿著已連接管線傳播的效果，但不會再變成鋪滿整個甲板的地表火海。噴散煙霧會更收束，不再鋪設焦痕，火焰只會出現在破裂源頭與被直接點燃的管段上。地基損傷也沿著這條局部鏈路推進，而不會隨機潑灑到整片甲板。
