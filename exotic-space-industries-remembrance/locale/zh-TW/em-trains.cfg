[technology-name]
ei_em-trains=EM列車

[technology-description]
ei_em-trains=EM 列車是一種建立在水晶電網基礎上的新型運輸體系。[item=ei_charger][color=orange]充能器[/color]會鋪設出讓 EM 車輛同步並沿鐵道輸送牽引力的場網。這套架構同時支援地表線路與可在太空使用的走廊，並且能透過研究大幅提高速度與加速度。只要場覆蓋失去連續性，推進就會立刻失效。

[item-description]
ei_charger=EM 充能器。它是建立並維持 EM 運輸場網的主動節點，也是行星線與太空線共用的運作樞紐。場一旦斷開，EM 推進就會失效。高品質節點更省電，也能維持更穩定的晶格。
ei_em-locomotive=EM 機車。它是 [item=ei_charger][color=orange]充能器[/color] 網路的場驅動客戶端，動力直接由場網提供；一旦離開覆蓋範圍，列車就會失去動力。更高品質的耦合器能在離網後短暫維持場相干性。
ei_em-cargo-wagon=EM 貨運車廂。被動式場耦合運輸模組，可在充能器覆蓋的路線中運行，包括軌道補給線。
ei_em-fluid-wagon=EM 流體車廂。被動式場耦合流體運輸模組，能在地表與離星路線上的充能場流中維持完整性。

[entity-description]
ei_charger=EM 充能器。它是建立並維持 EM 運輸場網的主動節點，也是行星線與太空線共用的運作樞紐。場一旦斷開，電磁牽引就會失效。高品質節點更省電，也能維持更穩定的晶格。
ei_em-locomotive=EM 機車。它是 [item=ei_charger][color=orange]充能器[/color] 網路的場驅動客戶端，動力直接由場網提供；一旦離開覆蓋範圍，列車就會失去動力。更高品質的耦合器能在離網後短暫維持場相干性。
ei_em-cargo-wagon=EM 貨運車廂。被動式場耦合運輸模組，可在充能器覆蓋的路線中運行，包括軌道補給線。
ei_em-fluid-wagon=EM 流體車廂。被動式場耦合流體運輸模組，能在地表與離星路線上的充能場流中維持完整性。

