[ei-factory-passage-guide]
walking-heading=在機器之間行走
walking=給工程師留條路。通行功能縮小支援的生產、電力、物流建築和砲塔的碰撞範圍，讓你能從相鄰建築之間穿過。實體中心仍然阻擋通行。防禦牆、閘門、自然障礙、車輛、敵人、非網格實體和不可見輔助實體保留原有碰撞。
modes-heading=選擇管線模式
modes=Vanilla保留遊戲及其他模組提供的碰撞。Squeak Through允許穿過相鄰接頭，無需額外模組。ESIR讓實際連接的地上接頭保持阻擋，同時開放未連接的空隙。地下段不會增加屏障。普通管線會向側面連接：緊貼的兩排會形成連通網格，並不是行走通道。
controls-heading=找到設定
controls=類別和管線模式屬於啟動設定，修改後需要重新啟動。執行中的處理速度在模組設定 → 地圖，或管理 → 選項 → 效能中調整。兩處修改的是同一組存檔全域值。主要預算（預設__3__）用於端點更新、被佔用接頭重試及介面觀察。首次尋找實體和即時清除輔助實體仍是同步操作。
recipes-heading=配方變化
recipes=建造、旋轉、貼上設定等支援事件會安排局部更新。開啟原生機器介面時會及時檢查配方。使用原生電路選配方且未開啟介面的組裝機交給背景掃描器。關閉介面的手動機器沒有週期性檢查。其他模組若靜默修改配方或電路選擇，必須呼叫現有的工廠通行重新整理介面。
scanner-heading=調整掃描器
scanner=????????????????????電路預算預設每刻__1__次嘗試，額外加在主要預算之外。每台機器在成功檢查或完成更新後有__2__刻冷卻；介面及事件更新不受此限制。正常速度下，預設值允許整個存檔每秒最多__4__次嘗試。穩定的600台符合條件的機器掃描一輪大約需要__5__秒。這只是範例，不是回應時間保證，連接更新積壓還會增加延遲。提高預算能更快更新，降低預算能限制工作量；兩個預算都不保證每刻耗時。
troubleshooting-heading=關閉掃描與排查問題
troubleshooting=關閉掃描器後，無人查看的電路變化可能暫未反映到碰撞；介面與事件更新仍有效。檢查工廠通行是否啟用、管線模式是否為ESIR。Squeak Through 2擁有優先權。若接頭正在等待角色離開，請讓出位置。獲授權的管理員可使用診斷 → 工廠通行 → 修復，或 /ei-admin-repair factory-passage，重建追蹤資訊而不替換機器。
current-heading=目前設定
current=所選模式：__1__\n實際模式：__2__\n未執行原因：__3__\n主要更新預算：每刻__4__\n電路掃描器：__5__\n額外電路預算：每刻__6__\n重新開啟頁面時更新此快照。
