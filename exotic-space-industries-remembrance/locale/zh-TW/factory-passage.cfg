[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=?????在背景檢查使用原生電路選配方、且未開啟介面的組裝機。關閉後，電路變化可能要等到事件或明確重新整理才會更新管線碰撞。已開啟介面的觀察和事件更新仍然運作。下一個處理刻生效，不重建輔助實體。非ESIR管線模式、關閉工廠通行或Squeak Through 2優先時不執行。
ei-factory-passage-circuit-scan-budget=整個存檔每刻額外允許的電路掃描嘗試次數（1–1,024；預設1），與主要更新預算分開。每台機器在成功檢查配方或完成連接更新後，至少等待60刻才可再次背景掃描。較低值減少指令碼工作量，但會延遲碰撞更新；較高值更快清理佇列，但可能增加每刻耗時。兩個預算都不保證毫秒耗時。無需重新啟動，關閉掃描器時仍保留此值。
ei-factory-passage-update-budget=每 tick 處理的佇列工作數上限（1–1,024；預設 256）。較低的值可減少腳本工作量，但會延遲管線碰撞更新；較高的值可更快處理佇列，但可能增加每 tick 的運算時間。立即對所有地表生效，無須重新啟動。首次掃描世界中的設施及清理碰撞輔助實體均為同步作業，不受此設定限制。在管線模式不是 ESIR、工廠設施間通行已停用，或 Squeak Through 2 優先生效時，此設定不會作用。
ei-factory-passage-enabled=允許從相鄰且受支援的工廠設施之間通行。關閉後會停用ESIR的所有通行調整，但保留各類別的選擇。
ei-factory-passage-production=允許從相鄰的生產機器、採礦機、研究中心等設施之間通行。
ei-factory-passage-power=允許從相鄰的發電機、鍋爐、反應爐、蓄電池、太陽能板及電力設施之間通行。
ei-factory-passage-logistics=允許從相鄰的儲物設施、機械臂、電路裝置、插件塔、雷達、機器人基地及火車站之間通行。
ei-factory-passage-turrets=允許從玩家建造的相鄰砲塔之間通行。
ei-factory-passage-pipe-mode=原版：保留管線原有的碰撞規則。\nSqueak Through：允許從相鄰管段之間通行，包括已連接的接頭；管線中心仍無法穿過。\nESIR：允許通過未連接的間隙，但已連接的地上接頭仍會阻擋通行。新接頭的阻擋區域會等角色離開後才啟用。地下管段及原本就可通行的熱導管仍可通行。

