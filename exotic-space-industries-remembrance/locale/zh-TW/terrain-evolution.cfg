[mod-setting-description]
ei-terrain-evolution-enabled=啟用 ESIR 的星球地形生態：污染引起的地形變化與恢復、由事件觸發的採礦痕跡、野生樹木的污染灰化與再生，以及季節性晝長。可在「模組設定 → 地圖」中調整各項功能、星球開關和 UPS 處理預算。可選災害預設關閉；Fulgora 保留其獨立晝夜控制器。關閉後停止新變化，不會重設地形；僅在晝長仍由 ESIR 控制時恢復原值。
ei-terrain-active=在已啟用且受支援的地表上運作生態變化與季節性晝長。關閉後停止新工作，不會撤銷地形變化；僅在其他控制器未改動晝長時恢復 ESIR 控制前的原值。
ei-terrain-intensity=節制模式使用 0.5 倍變化速率，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。強度與處理預算分開控制，絕不會啟用已關閉的災害。
ei-terrain-performance=以較小批次頻繁處理。超低負載和低負載優先減少工作量；輕量是保守的預設選項。均衡、詳細、高保真和超高保真依序提高處理涵蓋率和 UPS 開銷。自訂使用各項獨立上限。所有預算均由全部地表共用；變化強度和災害開關仍獨立控制。
ei-terrain-custom-rate-multiplier=節制模式使用 0.5 倍強度，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。處理預算另行控制。
ei-terrain-degradation=持續污染後，符合條件的自然地形會沿所屬星球的地格變化鏈逐步退化。預設條件：污染值連續五分鐘不低於 100。Gleba 孢子不計為有毒污染。
ei-terrain-recovery=僅沿原始變化路徑恢復 ESIR 已記錄的地形變化。預設條件：污染值連續十分鐘不高於 25，恢復間隔為退化間隔的四倍。地格被外部替換後，ESIR 不再負責恢復它。
ei-terrain-mining-scars=由有限資源耗盡事件觸發，耗盡位置須在符合條件的採礦場或大型採礦機涵蓋範圍內。附近的採礦痕跡會排入佇列，受共享工作量上限約束；事件集中爆發時，超額痕跡可能被略過。預設永久保留。耗盡事件不會指出是哪台採礦設備造成的。
ei-terrain-tree-stress=持續污染會使已適配的原生野生樹木灰化；環境持續潔淨後，會逆轉 ESIR 造成的灰化。栽培植物和受保護植被不受影響。
ei-terrain-tree-regrowth=環境持續潔淨後，在現有樹木附近緩慢長出已適配的當地樹木。受局部密度上限和地形保護規則約束；Gaia 會依所在生態區選擇樹種。
ei-terrain-thermal-scars=樹木被符合條件的火源燒死後，可能留下小範圍地形灼痕。此效果本身不會點火。
ei-terrain-seasonal-daylight=預設開啟。隨季節改變日照時長和遊戲原生太陽能發電量，不改變完整晝夜週期的長度。始終不影響 Fulgora；晝夜凍結設定和外部控制器優先。
ei-terrain-mining-recovery=預設關閉。記錄今後產生的採礦痕跡以便恢復；先前的永久痕跡無法重建。採礦損傷會取代原有的生態恢復路徑。
ei-terrain-aging=預設關閉。將符合條件的 Nauvis 活樹替換為原生枯木。其他星球沒有已適配的枯木替代類型，因此不受影響。此效果不會引發火災。
ei-terrain-rot=預設關閉。逐漸移除符合條件的原生枯木。受保護的樹木和地點不受影響。
ei-terrain-flood=預設關閉。將 Nauvis 上已適配的沙質岸邊地格變為水，要求緊鄰現有淡水。其他星球的液體和受保護區域不受影響。
ei-terrain-drought=預設關閉。將 Nauvis 上已適配的岸邊水域地格變為沙地，要求緊鄰現有沙質岸邊。其他星球的液體和受保護區域不受影響。
ei-terrain-cliffs=預設關閉。偶爾移除符合條件的普通懸崖。各星球的特殊懸崖和受保護區域不受影響。
ei-terrain-blood=預設關閉。敵方單位或巢穴死亡時，可能逆轉附近一層已記錄的地形損傷。恢復採礦痕跡仍須啟用採礦痕跡恢復。
ei-terrain-paving=預設關閉。需要啟用血液效果：敵人死亡時，可能剝除符合條件的石磚或混凝土鋪裝，露出下方地格。基礎設施和其他保護規則仍然有效。
ei-terrain-seasonal-ecology=預設關閉。隨季節調整土壤退化、樹木活動與再生，以及災害觸發嘗試的速率。無論季節性晝長由誰控制均可獨立生效；不會啟用已關閉的災害。
ei-terrain-wildfire=預設關閉。污染可能觸發數量受限的點火。不蔓延模式的火焰最長存活 10 秒；原生火勢蔓延可能超出 ESIR 的腳本處理預算。其他戰鬥火災仍獨立運作。
ei-terrain-planet-nauvis=啟用 Nauvis 的生態變化與季節性晝長：草地、泥土、荒漠和沙地的退化鏈、原生野生樹木，以及可選的岸線變化。各項功能開關和保護規則仍然有效。
ei-terrain-planet-gaia=啟用 Gaia 的生態變化與季節性晝長：草甸和濕地變體會退化為裸露的 Gaia 岩地，可依記錄恢復原始變體，並再生適合當地生態區的樹木。預設特殊地點仍受保護。
ei-terrain-planet-vulcanus=啟用 Vulcanus 的生態變化與季節性晝長，使用火山灰、土壤和裂隙地形的變化鏈。熔岩受保護；噴氣孔保留其獨立效果。
ei-terrain-planet-gleba=啟用 Gleba 的生態變化與季節性晝長，使用各生態區的地形和原生野生樹木。孢子不會造成有毒污染損傷；栽培植物、栽培土壤和金沼盆地仍受保護。
ei-terrain-planet-fulgora=啟用 Fulgora 的地形生態變化，包括岩地、沙地、塵土地和沙丘之間的轉換。石油海洋仍受保護。季節性晝長絕不接管 Fulgora，其獨立晝夜控制器始終保有控制權。
ei-terrain-planet-aquilo=啟用 Aquilo 的生態變化與季節性晝長，使用已適配的積雪壓實與冰面變化鏈。氨海、地基和基礎設施仍受保護。
ei-terrain-pollution-high=超過上限開始累計污染持續時間，低於下限開始累計清潔持續時間。下限必須小於上限。讀取當地的原生污染量，不直接改變污染。
ei-terrain-pollution-low=超過上限開始累計污染持續時間，低於下限開始累計清潔持續時間。下限必須小於上限。讀取當地的原生污染量，不直接改變污染。
ei-terrain-mining-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-wildfire-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-flood-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-drought-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-cliff-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-blood-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-paving-probability=每次符合條件的判定所使用的機率：0 表示從不發生，1 表示必定發生。必須啟用對應功能，且仍需通過保護檢查。
ei-terrain-axial-tilt=用於計算季節性日照差異的假定地軸傾角，預設為 23.5 度。數值越大，季節差異通常越明顯。全亮和全暗時段各保留至少全天的 2%；不影響 Fulgora。
ei-terrain-latitude=用於季節性晝長的假定緯度，預設為 45 度。緯度絕對值越大，季節差異越明顯；正負號會對調夏季與冬季。此設定不會移動玩家或改變行星自轉。
ei-terrain-season-strength=季節對生態變化速率的影響強度。僅在啟用季節性生態變化時生效。
ei-terrain-dirty-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-clean-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-soil-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-recovery-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-mining-radius=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-mining-patch-radius=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-tree-growth-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-tree-density-limit=當指定鄰域內的樹木數量達到此上限時，暫停自然再生。
ei-terrain-tree-neighborhood=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-tree-stress-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-tree-aging-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-tree-rot-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-hazard-seconds=以模擬秒數表示的延遲或間隔。執行時仍需滿足環境條件，並有可用的處理預算。
ei-terrain-wildfire-radius=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-hazard-radius=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-calendar-days=以記錄的 Nauvis 日長為基準設定一年長度，預設為 360 天。各星球的年長依已載入星圖中的距離縮放。修改時保留目前的季節相位，絕不改變行星自轉。
ei-terrain-protection-buffer=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-max-depth=相對於紀錄中的原始地形，允許經歷的最大退化階段數。
ei-terrain-seed-distance=以地塊為單位的距離或半徑。即使位置符合其他條件，保護檢查仍可能阻止修改。
ei-terrain-interval=自訂預設：全域處理檢查的間隔，以遊戲刻（tick）計。數值越大，處理頻率越低，涵蓋速度越慢；延後的工作絕不會集中補算。
ei-terrain-search-interval=自訂預設：兩次補充實體搜尋額度之間的最少遊戲刻數，額度由所有地表共用。此設定與處理間隔分開；較短間隔允許更多搜尋，也可能增加 UPS 開銷。未使用的額度不會累積。
ei-terrain-cold-chunks=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-active-chunks=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-candidates=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-histories=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-writes=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-recovery-reserved=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-searches=自訂預設：搜尋間隔到期後，單次處理允許的實體搜尋上限。所有地表共用此額度，未使用的搜尋次數不會保留到下次。
ei-terrain-result-limit=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-events=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-mining-queries=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-mining-candidates=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-admissions=僅在自訂處理預設下使用。這是所有地表共用的有限工作量上限，並非每顆行星各自擁有的額度。提高數值可能增加處理器負載。
ei-terrain-active-cap=生態狀態資料的最大儲存量。提高上限會占用更多記憶體。每輪處理限制仍然生效。
