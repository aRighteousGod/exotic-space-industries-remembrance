[string-mod-setting-description]
ei-terrain-intensity-restrained=節制模式使用 0.5 倍強度，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。處理預算另行控制。
ei-terrain-intensity-standard=節制模式使用 0.5 倍強度，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。處理預算另行控制。
ei-terrain-intensity-severe=節制模式使用 0.5 倍強度，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。處理預算另行控制。
ei-terrain-intensity-custom=節制模式使用 0.5 倍強度，標準為 1 倍，強烈為 2 倍。自訂使用所設倍率。處理預算另行控制。
ei-terrain-performance-ultra-low=每 16 刻處理一次；每 128 刻最多搜尋 1 次實體。每次處理最多檢查 1 筆恢復記錄、修改 1 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-low=每 16 刻處理一次；每 64 刻最多搜尋 1 次實體。每次處理最多檢查 2 筆恢復記錄、修改 2 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-lean=每 16 刻處理一次；每 32 刻最多搜尋 1 次實體。每次處理最多檢查 4 筆恢復記錄、修改 4 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-balanced=每 8 刻處理一次；每 16 刻最多搜尋 1 次實體。每次處理最多檢查 4 筆恢復記錄、修改 4 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-detailed=每 4 刻處理一次；每 8 刻最多搜尋 1 次實體。每次處理最多檢查 8 筆恢復記錄、修改 4 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-high-fidelity=每 2 刻處理一次；每 4 刻最多搜尋 1 次實體。每次處理最多檢查 8 筆恢復記錄、修改 4 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-ultra-high-fidelity=每 1 刻處理一次；每 2 刻最多搜尋 2 次實體。每次處理最多檢查 16 筆恢復記錄、修改 8 塊地面。上限由所有地表共用；實際工作量取決於條件是否滿足。
ei-terrain-performance-custom=使用個別設定的處理間隔、實體搜尋間隔、工作量上限和儲存上限。較小批次和較長搜尋間隔可降低峰值負載，但會減慢涵蓋速度。切換預設會保留已記錄的恢復歷史。
ei-terrain-wildfire-off=關閉生態系統主動點火。灼痕效果和其他戰鬥火災仍由各自設定獨立控制。
ei-terrain-wildfire-contained=不會蔓延的受控火焰，最長持續10秒。點火次數受限；不會接管其他火災。
ei-terrain-wildfire-spreading=使用原生蔓延火焰。初始點火次數受限，但之後的引擎蔓延不受 ESIR 腳本預算約束，可能明顯降低 UPS。

[exotic-industries-informatron]
menu_terrain_evolution=地形演變
title_terrain_evolution=地形演變

[ei-terrain]
overview=地形演變統一管理污染造成的土壤變化、基於紀錄的恢復、採礦痕跡與樹木的自然反應。火災、海岸線、懸崖、血液和鋪面效果可以獨立設定。Nauvis、Gaia 與支援的行星各自保留原有的地形體系。設計靈感來自 TerrainEvolution 與 TerrainEvolution2。
protections=一般土壤變化會保護玩家鋪設的地面、基礎設施、礦床以及不支援的地形。恢復沿著 ESIR 紀錄的變化進行，不會把所有生態區都變成草地。災害功能也需要通過保護檢查。關閉功能只會停止新變化，不會撤銷既有變化。
calendar=抽象季節曆法使用已載入星圖中的距離和方向，不移動行星，也不改變完整晝夜週期的長度。季節性晝長與季節性生態變化分別控制。Fulgora 保留獨立時鐘。發現已知的外部晝夜控制模組或偵測到外部修改時，ESIR 會讓出晝夜控制權。
performance=以較小批次頻繁處理。超低負載和低負載優先減少工作量；輕量是保守的預設選項。均衡、詳細、高保真和超高保真依序提高處理涵蓋率和 UPS 開銷。自訂使用各項獨立上限。所有預算均由全部地表共用；變化強度和災害開關仍獨立控制。
effective=狀態：__1__；處理：__2__；強度：__3__
mining-note=有限礦床在符合條件的採礦機覆蓋範圍內耗盡時，可能留下採礦痕跡；耗盡事件無法確定具體是哪台採礦機造成的。痕跡預設永久保留。可在生態設定中配置開關、範圍及今後痕跡的恢復。
unsupported=不支援此地表或功能。
invalid-value=數值或設定組合無效。
updated=生態設定已更新。
status-enabled=已啟用
status-disabled=已關閉
status-active=運作中
status-active-clamped=運作中，季節變化範圍受限
status-external-control=由外部控制
status-frozen=時間已凍結
status-pending=等待中
status-released=已讓出控制
status-excluded=已排除
status-invalid-input=輸入無效
status-invalid-baseline=晝夜基準值無效
status-invalid-geometry=季節幾何參數無效
status-incompatible-baseline=晝夜基準值不相容
status-diurnal-dynamics=Diurnal Dynamics
status-TerrainEvolution2=Terrain Evolution 2
