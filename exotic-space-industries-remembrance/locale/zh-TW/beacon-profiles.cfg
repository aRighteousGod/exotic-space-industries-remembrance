[mod-setting-name]
ei-beacon-diminishing-returns=插件塔效果遞減

[mod-setting-description]
ei-beacon-overload=啟用時，機器會在超過超載上限後停機。銅插件塔計為1個，鐵插件塔計為2個；外星和躍遷插件塔不計入超載。停用時，ESIR的四種插件塔均使用所選的效果遞減方案。
ei-beacon-diminishing-returns=僅在停用插件塔超載時生效。覆蓋同一機器的插件塔越多，每個ESIR插件塔傳遞的所有模組效果越弱，包括能耗和污染效果。所有類型合併計數，每座算一個；加入較弱的插件塔可能降低總加成。單個插件塔保留全部效果。模組欄位、品質、冷卻和燃料需求不變。\n覆蓋機器的插件塔為1 / 4 / 8 / 16個時，每個插件塔的效果：\n__1__\n原版曲線僅複製遞減曲線，保留ESIR各級性能及合併計數方式。曲線含4096項；超過此數量後沿用最後一項倍率。

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=溫和
ei-beacon-diminishing-returns-vanilla=原版曲線
ei-beacon-diminishing-returns-strict=嚴格（預設）
ei-beacon-diminishing-returns-harsh=苛刻
ei-beacon-diminishing-returns-severe=嚴厲
ei-beacon-diminishing-returns-saturating=飽和

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=插件塔超載已啟用：每台機器的加權上限為4。銅插件塔計為1，鐵插件塔計為2；外星和躍遷插件塔不計入。效果遞減方案不生效。
overload-disabled=插件塔超載已停用。目前方案：__1__。ESIR的四種插件塔均受效果遞減影響。覆蓋機器的每座插件塔均計為一個，與等級無關；加入較弱的插件塔可能降低總加成。
