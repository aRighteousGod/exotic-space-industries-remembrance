[mod-setting-name]
ei-container-capacity-profile=容器容量預設

[mod-setting-description]
ei-container-capacity-profile=設定所有儲物箱的容量，包括其他模組中的儲物箱。以下為普通品質的格數；欄位順序：木箱 / 鐵箱 / 鋼箱 / 小型 / 中型 / 倉庫。\n__1__\n\n同一尺寸的一般、篩選和物流容器使用相同容量。保留原有品質加成。機器的功能性庫存不受影響。調低此設定可能縮減既有庫存並造成物品遺失。

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=普通品質格數：木箱 __1__ / 鐵箱 __2__ / 鋼箱 __3__ / 小型 __4__ / 中型 __5__ / 倉庫 __6__。

[string-mod-setting]
ei-container-capacity-profile-restrained=受限（預設）
ei-container-capacity-profile-standard=標準
ei-container-capacity-profile-expanded=擴充
ei-container-capacity-profile-generous=充裕
ei-container-capacity-profile-industrial=工業
ei-container-capacity-profile-massive=海量
ei-container-capacity-profile-vast=超大
ei-container-capacity-profile-extreme=極限

[string-mod-setting-description]
ei-container-capacity-profile-restrained=普通品質格數：木箱 8 / 鐵箱 16 / 鋼箱 16 / 小型 24 / 中型 32 / 倉庫 64。
ei-container-capacity-profile-standard=普通品質格數：木箱 8 / 鐵箱 16 / 鋼箱 24 / 小型 32 / 中型 64 / 倉庫 128。
ei-container-capacity-profile-expanded=普通品質格數：木箱 16 / 鐵箱 24 / 鋼箱 32 / 小型 48 / 中型 96 / 倉庫 192。
ei-container-capacity-profile-generous=普通品質格數：木箱 16 / 鐵箱 32 / 鋼箱 48 / 小型 64 / 中型 128 / 倉庫 256。
ei-container-capacity-profile-industrial=普通品質格數：木箱 24 / 鐵箱 48 / 鋼箱 64 / 小型 96 / 中型 192 / 倉庫 384。
ei-container-capacity-profile-massive=普通品質格數：木箱 32 / 鐵箱 64 / 鋼箱 96 / 小型 128 / 中型 256 / 倉庫 512。
ei-container-capacity-profile-vast=普通品質格數：木箱 48 / 鐵箱 96 / 鋼箱 128 / 小型 192 / 中型 384 / 倉庫 768。
ei-container-capacity-profile-extreme=普通品質格數：木箱 64 / 鐵箱 128 / 鋼箱 192 / 小型 256 / 中型 512 / 倉庫 1024。
