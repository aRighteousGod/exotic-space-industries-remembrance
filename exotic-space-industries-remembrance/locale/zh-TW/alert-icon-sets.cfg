[mod-setting-name]
ei-alert-icon-set=警報圖示樣式
ei-alert-icon-set-default=預設警報圖示樣式

[mod-setting-description]
ei-alert-icon-set=選擇個人ESIR警報與生態設定中的圖示樣式。「套用啟動設定」會將目前的啟動設定複製到個人設定。之後變更啟動設定不會覆蓋已儲存的個人選擇。
ei-alert-icon-set-default=尚未儲存個人選擇的玩家使用的初始圖示樣式。既有的個人選擇會保留。預設：立體物件。

[string-mod-setting]
ei-alert-icon-set-vanilla=Factorio原版風格
ei-alert-icon-set-default-vanilla=Factorio原版風格
ei-alert-icon-set-startup-default=套用啟動設定
ei-alert-icon-set-original=原版圖示
ei-alert-icon-set-svg=鑄金屬符印
ei-alert-icon-set-rendered=立體物件
ei-alert-icon-set-default-original=原版圖示
ei-alert-icon-set-default-svg=鑄金屬符印
ei-alert-icon-set-default-rendered=立體物件
