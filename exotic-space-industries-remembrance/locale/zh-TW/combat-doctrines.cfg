[mod-setting-description]
ei-pyric-radiance=為燃燒火焰、火焰噴流、普通爆炸、槍口閃光和實體彈丸添加照明。保留各燃料的顏色和專屬特效。僅改變視覺表現：火勢蔓延、地圖、夜視、手電筒和晝夜時長均保留現有行為。關閉後仍保留所選教義。
ei-pyric-radiance-preset=選擇火光、爆炸照明、曳光照明和槍口閃光的比例。倍率改變光照半徑；零倍率保留該類效果原有的視覺表現。頻繁命中的額外光效和額外核爆閃光僅用於更強烈的教義；現有核爆畫面效果保持不變。異裝彈藥和能量武器的專屬特效保留自身的視覺表現。\n
ei-ballistic-divergence=子彈會飛行、偏離目標，並擊中沿途的其他目標。適用於現有子彈彈匣、霰彈顆粒和發射子彈的戰鬥機器人。己方陣營的玩家和建築不會阻擋這些彈丸；其他盟友陣營和中立地形物體仍可能被擊中。現有濺射和燃燒效果保留各自規則。穿甲及鈾子彈彈匣使用原生穿透機制，穿透預算為其基礎物理傷害的25倍，可繼續穿過被擊殺的目標；存活目標會使子彈停止。異裝彈藥保留單次命中的完整效果。不增加彈藥或研究。關閉後仍保留所選教義。
ei-ballistic-divergence-preset=選擇彈丸的最大額外飛行距離、子彈散布、彈匣容量和霰彈飛行距離變化的指定倍率。基礎飛行距離涵蓋相容且啟用的武器所需的最遠射程，並計入彈藥射程修正、品質和槍口位置餘量。超過這一基礎距離的額外飛行距離最多為16格；武器的目標鎖定範圍不變。子彈散布倍率作用於0.16的角度偏差和0.40的指定飛行距離偏差；零倍率去除新增的子彈散布。子彈和霰彈的飛行距離變化受所選額外飛行距離上限約束，霰彈槍原有的散布錐保持不變。彈匣容量向上取整；霰彈彈匣容量和機器人彈藥不變。地形保護為樹木設定至少2點固定減免和65%的物理抗性，為岩石設定至少4點固定減免和75%的物理抗性，影響它們受到的所有物理傷害。\n

