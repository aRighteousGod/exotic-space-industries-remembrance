[string-mod-setting-description]
ei-pyric-radiance-preset-ember=少量增強光照，較少移動光源。
ei-pyric-radiance-preset-veiled=為普通戰鬥效果提供克制的照明。
ei-pyric-radiance-preset-furnace-vigil=以燃燒的地面和森林為主；不新增移動光源。
ei-pyric-radiance-preset-iron-benediction=以更強的槍口閃光突出射擊陣地。
ei-pyric-radiance-preset-signal-threads=以更強的曳光照明突出彈丸軌跡。
ei-pyric-radiance-preset-tempered=適中的預設照明；無額外命中或核爆光效。
ei-pyric-radiance-preset-night-liturgy=廣泛而溫暖的戰鬥照明，包含額外命中光效。
ei-pyric-radiance-preset-siege-hymn=強烈的槍口閃光，讓來襲火力清晰可見。
ei-pyric-radiance-preset-cataclysm=大範圍爆炸照明和明顯的核爆閃光。
ei-pyric-radiance-preset-apotheosis=最強的氛圍和最高的光源密度。
ei-ballistic-divergence-preset-needle-oath=子彈沿直線飛行，不增加散布或額外飛行距離；保留現有彈匣容量和霰彈槍原有的散布錐。
ei-ballistic-divergence-preset-measured-volleys=子彈偏差較小，保護地形，並保留現有彈匣容量。
ei-ballistic-divergence-preset-breach-doctrine=更大的子彈散布和彈匣容量；地形仍易受損。
ei-ballistic-divergence-preset-tempered=適中的散布和額外飛行距離；保留目前子彈彈藥的消耗水準。
ei-ballistic-divergence-preset-distant-thunder=更長的額外彈丸飛行距離，子彈散布較小。
ei-ballistic-divergence-preset-fortress-oath=更大的彈匣、適中的散布，並保護地形。
ei-ballistic-divergence-preset-wildfire-doctrine=較大的子彈散布和霰彈飛行距離變化指定倍率，更大的彈匣，並保護地形。
ei-ballistic-divergence-preset-crossfire=更長的額外彈丸飛行距離和較大的子彈散布；地形仍易受損。
ei-ballistic-divergence-preset-saturation=更長的額外飛行距離、較大的散布、雙倍子彈彈匣容量，並保護地形。
ei-ballistic-divergence-preset-terminal-barrage=最大的額外飛行距離、散布和子彈彈匣容量；地形仍易受損。

