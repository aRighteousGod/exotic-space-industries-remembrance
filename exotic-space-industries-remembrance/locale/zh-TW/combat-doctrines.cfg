pyric-radiance=Pyric Radiance
pyric-radiance-text=爐火向黑夜獻上見證。燃燒火焰保留各燃料的顏色；普通射擊與爆炸照亮自身經過的地方。在啟動設定中選擇教義，讓餘燼、射擊陣地、曳光軌跡或廣闊的攻城火光成為主角。地圖、火勢蔓延、夜視、手電筒和晝夜循環均保留現有行為。異裝彈藥的爆發與能量武器的專屬特效保留自身的視覺特徵。
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=子彈承載的是誓言，而非必中。現有子彈變為實體彈丸，沿彈道飛行；敵人與中立障礙物能夠將其截住。己方陣營不會阻擋這些彈丸，獨立的盟友陣營仍可能被擊中。現有濺射與燃燒效果保留各自規則。穿甲及鈾子彈彈匣的原生穿透預算為基礎物理傷害的25倍：子彈可以穿過被擊殺的目標，存活目標則會使其停止。異裝彈藥只觸發一次完整命中效果。相容且啟用的武器共用彈丸飛行距離上限，其中計入彈藥射程修正、品質和槍口位置餘量。教義允許在這一基礎距離之外增加有限的飛行距離，並約束子彈和霰彈的飛行距離變化，不改變武器的目標鎖定範圍或霰彈槍原有的散布錐。未命中的彈丸達到引擎原生距離上限後會消失。新上限適用於新發射的彈丸；已經在飛行中的彈丸保留已儲存的距離和命中效果。部分教義增加子彈彈匣容量或保護地形；配方、科技、霰彈容量和機器人傷害不變。
