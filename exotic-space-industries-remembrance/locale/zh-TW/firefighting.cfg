[item-description]
ei-water-turret=消耗水和100 kW電力，使敵人減速25%，持續2秒，不造成傷害；也可自動撲滅附近火災。射程：24。每次滅火脈衝消耗15單位水。可在砲塔介面設定優先順序。
ei-extinguisher=手動清除小範圍內的火焰和酸液池。需要滅火器罐。
ei-extinguisher-ammo=手持滅火器用罐。容量：100。

