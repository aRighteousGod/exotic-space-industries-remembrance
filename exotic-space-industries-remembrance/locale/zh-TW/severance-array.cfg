[technology-description]
ei-severance-array=解鎖量子時代雷射砲塔，讓一道光之誓約沿不斷變化的瞄準線被拖曳。

[mod-setting-name]
ei-severance-array-visual-fidelity=斷絕陣列視覺保真度

[mod-setting-description]
ei-severance-array-visual-fidelity=僅控制斷絕陣列的可見光束見證、輝光/火焰/焦痕持續時間、音效密度與執行期視覺預算。傷害、射程、能耗、生命值與配方成本不會改變。極限是帶上限的截圖/壓力測試預設；無上限會移除硬性視覺限制，可能嚴重摧毀UPS。

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=精簡
ei-severance-array-visual-fidelity-standard=標準
ei-severance-array-visual-fidelity-cinematic=電影化
ei-severance-array-visual-fidelity-maximal=極限
ei-severance-array-visual-fidelity-unbounded=無上限

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=UPS優先：較少光束切片、較短見證效果，並更嚴格限制火焰與焦痕。
ei-severance-array-visual-fidelity-standard=這是日常遊玩的目標檔位：可見掃切、見證命中，以及保守的執行期預算。
ei-severance-array-visual-fidelity-cinematic=更豐富的演出：更多光束切片與見證效果，輝光和焦痕保留更久。
ei-severance-array-visual-fidelity-maximal=這是帶上限的演出檔位：截圖級光束與見證效果，同時保留緊急限制。
ei-severance-array-visual-fidelity-unbounded=移除硬性視覺上限，並積極清空已就緒的斷絕任務。它追求的是場面，不是安全。

[item-description]
ei-severance-array=4x4量子武器平台，消耗巨量儲能，在敵方陣形中刻下移動的雷射創口。

[entity-description]
ei-severance-array=4x4量子武器平台。原生雷射命中負責殺傷邊緣；高負載時，只有可見瞄準軌跡會衰減。

[exotic-industries-informatron]
menu_severance_array=斷絕陣列
title_severance_array=斷絕陣列
turrets-text-6=[item=ei-severance-array]斷絕陣列是位於電漿砲塔與戰略遺物武器之間的量子時代刃式協定。它儲存龐大電荷，接著在原生雷射命中承擔極高首擊傷害的同時，把一道可見光束從上一個瞄準點拖向下一個瞄準點。軌跡採用視覺預算：多座陣列同時開火時，部分光束切片會被抑制，以保持傷害穩定。
severance-array=斷絕陣列
severance-array-text=[item=ei-severance-array]斷絕陣列是一台緊湊的量子時代處刑引擎。它占用4x4地基，消耗巨大的電脈衝，並透過在戰場上打開一道明亮創口來回應目標，而不是把每個受害者都當成獨立彈丸追蹤。
severance-array-2=瞄準軌跡協定
severance-array-text-2=每次射擊都會對目標使用普通砲塔傷害，並為該陣列重定向一道活動的可見軌跡。光束切片只是切割的裝飾見證，並非真實傷害來源。
severance-array-3=負載削減
severance-array-text-3=當過多陣列同時開火時，執行期會在它們之間分配可用視覺切片。戰場上顯示的光痕可能減少，但傷害會留在原生砲塔路徑上，然後才把時間花在演出上。
