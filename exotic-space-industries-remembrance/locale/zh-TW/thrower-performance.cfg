[mod-setting-name]
ei-thrower-performance-profile=火焰與噴酸砲塔效能

[mod-setting-description]
ei-thrower-performance-profile=僅降低火焰與噴酸砲塔的液流粒子數、射擊頻率、煙霧量，以及燃燒和腐蝕傷害的結算頻率。提高單次命中傷害和每次射擊的流體消耗，以維持持續射擊時的理論每秒傷害和流體消耗。地面火焰的傷害、增強機制及各燃料對應的持續時間均不變。原始模式保留現有行為。8倍和16倍模式的射擊間隔較大，會改變對移動目標的覆蓋、火勢增強過程及固定數值抗性的影響。倍率表示處理頻率的降低幅度，不保證同等倍率的UPS提升。手持武器和載具武器不受影響。\n下列數值未計入品質、科技或其他模組的影響。各欄依序為：射擊間隔／粒子間隔／每秒粒子數／命中傷害與流體消耗倍率／燃燒結算間隔／腐蝕結算間隔。間隔單位為刻（60刻＝1秒）。

[string-mod-setting]
ei-thrower-performance-profile-original=原始
ei-thrower-performance-profile-2x=頻率降至1/2
ei-thrower-performance-profile-4x=頻率降至1/4
ei-thrower-performance-profile-8x=頻率降至1/8
ei-thrower-performance-profile-16x=頻率降至1/16

[string-mod-setting-description]
ei-thrower-performance-profile-original=現有行為：每4刻射擊一次；每2刻產生一個粒子；每秒30個粒子；命中傷害和流體消耗不變；燃燒每10刻結算一次；腐蝕每刻結算一次。
ei-thrower-performance-profile-2x=每8刻射擊一次；每4刻產生一個粒子；每秒15個粒子；命中傷害及每次射擊的流體消耗為2倍；燃燒每20刻結算；腐蝕每2刻結算。
ei-thrower-performance-profile-4x=每16刻射擊一次；每8刻產生一個粒子；每秒7.5個粒子；命中傷害及每次射擊的流體消耗為4倍；燃燒每30刻結算；腐蝕每4刻結算。
ei-thrower-performance-profile-8x=每32刻射擊一次；每16刻產生一個粒子；每秒3.75個粒子；命中傷害及每次射擊的流體消耗為8倍；燃燒每30刻結算；腐蝕每8刻結算。稀疏射擊會改變目標覆蓋和固定數值抗性的影響。
ei-thrower-performance-profile-16x=每64刻射擊一次；每32刻產生一個粒子；每秒1.875個粒子；命中傷害及每次射擊的流體消耗為16倍；燃燒每30刻結算；腐蝕每16刻結算。極稀疏射擊會改變目標覆蓋和固定數值抗性的影響。

