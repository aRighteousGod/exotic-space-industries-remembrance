[ei-terrain]
controls=左上角的機械樹按鈕開啟簡潔、進階和警報頁。樹葉顏色隨目前檢視世界的季節變化，游標停留時顯示季節名稱。簡潔顯示實地調查；進階顯示有效設定、成功效果與處理上限。警報與 MOD設定→每玩家共用偏好，使用原版警報視窗，通常只報告目前可見的區塊。管理員玩法設定仍在地形與生態控制台。
v2-coverage=觀測在有限區塊組中輪換。未調查土地視為未知；缺失或陳舊的讀數不能證明持續潔淨或污染。僅恢復ESIR記錄的損傷。有限遷移、初始化和維護在ESIR重建視窗報告；常規生態處理顯示在進階頁。初始巡查上限10萬次訪問不代表全地圖已驗證。
mining-v2-note=工作採礦機有獨立週期痕跡選項，預設開啟：每300基礎秒有10%機率，克制強度下為600秒，再套用季節調整。已接收請求不會僅因時間而過期，停用地表時暫停。預設恢復新記錄的採礦痕跡。
status-unsupported=不支援的地表
status-independent=弗戈拉獨立控制器

