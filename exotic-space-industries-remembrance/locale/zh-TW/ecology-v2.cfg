[mod-setting-description]
ei-ecology-alert-enabled=在原版警報視窗接收所選的成功生態事件。僅控制個人通知的總開關。
ei-ecology-alert-surfaces=使用 all 或精確名稱的 JSON 陣列。[] 表示不選。最多128個名稱、4096位元組。生態介面修改同一設定。不存在的名稱不匹配任何地表。
ei-ecology-alert-current-surface-only=將所選通知進一步限制為目前查看的地表，包括遠端視圖。預設關閉。
ei-ecology-alert-allow-unrevealed=僅管理員：繞過區塊目前可見性。類別與地表篩選仍有效。預設關閉。普通玩家僅探索過該地塊仍不夠。
ei-terrain-periodic-mining-scars=符合條件的採石場和大型採礦機開採有限礦床時，可擾動周邊裸露的自然地面。尚存礦床、設施及保護區不受影響。礦床耗盡產生的痕跡仍由獨立事件觸發。
ei-terrain-periodic-mining-seconds=強度和季節調整前的基礎間隔。預設300秒在克制強度下為600秒，再套用季節調整。延遲檢查只進行一次嘗試，不補做錯過的抽取。
ei-terrain-periodic-mining-probability=每次符合條件的週期機會的機率。預設10%。不改變已選斑塊內每格獨立70%的機率。
ei-ecology-alert-wildfire=生態效果成功後通知：山火點燃。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。山火僅表示成功點燃，不代表森林已經燒毀。
ei-ecology-alert-flood=生態效果成功後通知：洪水。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-drought=生態效果成功後通知：岸邊乾涸。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-cliff=生態效果成功後通知：懸崖風化。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-paving=生態效果成功後通知：鋪裝腐蝕。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-pollution=生態效果成功後通知：污染損傷。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-restoration=生態效果成功後通知：地形恢復。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-depletion-scars=生態效果成功後通知：礦床耗盡痕跡。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-working-scars=生態效果成功後通知：工作採礦機痕跡。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-mining-restoration=生態效果成功後通知：採礦痕跡恢復。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-tree-stress=生態效果成功後通知：樹木衰弱。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-tree-recovery=生態效果成功後通知：樹木恢復。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-regrowth=生態效果成功後通知：野生樹木再生。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-aging=生態效果成功後通知：樹木老化。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
ei-ecology-alert-rot=生態效果成功後通知：枯木腐朽。通知不會啟用效果本身，仍受個人地表篩選及可見性約束。
