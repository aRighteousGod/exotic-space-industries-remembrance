[item-description]
ei-surveyor-carbine=配有玻璃瞄具的蒸汽時代卡賓槍。射速很慢，但經壓力校正的槍管比一般自動武器打得更遠。
ei-surveyor-rifle=電力穩定的勘測者槍架。射擊仍然克制，瞄準畫面卻更加清楚。
ei-surveyor-cannon=模擬時代的反器材勘測者。自動化的大口徑紀律依靠建模命中與碳纖維後座結構運作。
ei-adaptive-surveyor=量子時代的模組化狙擊系統。優質資料會在扳機尚未走完前預測膛室、槍管、風與目標。
ei-inferno-grenade=改造成會在目標處裂成爆炸性燃燒碎片的集束手榴彈。每枚碎片都會在撞擊時爆炸，隨後播撒自己的火環。
ei-incinerator-capsule=釋放五台高速的毀滅者衍生焚滅者。它們追隨、焚燒，並拒絕火焰的仁慈。
ei-prediction-snare-mine=一種部署式模擬陷阱，會預測敵方移動，並向附近生物灌入擾亂運動的虛假訊號。
ei-breach-solver-charge=一種緊湊求解裝藥，把模擬資料傾注進狹窄的過量爆炸，用於撕開蟲巢、沙蟲和硬化目標。

