[technology-description]
ei-surveyor-carbine=給舊機槍框架加入玻璃、壓力與鐵製校正機構。它不會更快。它會更遠。
ei-surveyor-rifle=用電力復進和更好的光學系統穩定勘測者結構，把遠射學說推進到電氣時代。
ei-surveyor-cannon=用模擬資料與碳纖維板加固勘測者系列，將其變為自動反器材武器。武器持續開火，但每一發仍然屬於瞄具。
ei-adaptive-surveyor=利用優質資料、奇怪鍍層與自適應膛室學說，將勘測者系列轉化為量子遠程處決系統。
military-5=將模擬殺傷學說正規化：預測陷阱、破障裝藥、煉獄彈藥與火焰機器人升級都納入同一獲准指揮框架。
ei-inferno-grenade=授權將集束手榴彈重構為模擬火焰區域封鎖裝藥：外殼破裂，碎片墜落，每次撞擊都會寫下新的火環。
ei-incinerator=授權毀滅者衍生的焚滅者：五台高速護衛會追隨、焚燒，並拒絕火焰的仁慈。
