[mod-setting-name]
ei-arc-furnace-light-flicker-preset=電弧爐工作燈閃爍

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=只調整電弧爐的活動工作燈。原始閃爍會保留目前躁動的電弧光。降低閃爍與柔和脈動會讓閃爍更安定。靜態輝光保留穩定光源。關閉會移除活動工作燈，但保留爐體動畫與待機紅色電容輝光。

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=關閉
ei-arc-furnace-light-flicker-preset-static=靜態輝光
ei-arc-furnace-light-flicker-preset-soft=柔和脈動
ei-arc-furnace-light-flicker-preset-reduced=降低閃爍
ei-arc-furnace-light-flicker-preset-original=原始閃爍

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=移除活動工作燈。爐體動畫與待機紅色電容輝光仍會保留。
ei-arc-furnace-light-flicker-preset-static=保留穩定的活動輝光，不再閃爍。
ei-arc-furnace-light-flicker-preset-soft=保留暗淡、緩慢的脈動，讓電弧爐陣列更平穩。
ei-arc-furnace-light-flicker-preset-reduced=保留層疊的電弧色彩，但閃爍更慢、範圍更窄。
ei-arc-furnace-light-flicker-preset-original=保留目前躁動的電弧爐照明。
