[exotic-industries-informatron]
menu_fusion_power=核融合動力層級
title_fusion_power=核融合動力層級
fusion-power=核融合動力層級
fusion-power-text=Space Age 的阿魁洛星[color=orange]核融合反應堆[/color] [item=fusion-reactor] 是高密度電漿核融合反應堆：緊湊、偏重供熱，而且大多封閉。它可能洩漏微弱的次級中子，但這些中子只是殘餘，不是可靠的增殖源。\n\nESIR 的[color=orange]熱核融合反應堆[/color] [item=ei-fusion-reactor] 是更後期、更沉重的機器。它在受控電漿容器中燃燒加熱後的輕原子燃料，並把中子產生作為有意輸出。\n\n它依靠封閉的鉛冷卻劑迴路運作：[fluid=ei-cold-coolant]進入爐體，[fluid=ei-hot-coolant]帶著熱負荷離開。反應堆建造昂貴，運轉更加飢渴。啟動後，它會持續索取加熱後的融合燃料。\n\nESIR 早期燃料包括[fluid=ei-heated-protium]和[fluid=ei-heated-lithium-6]。更強的燃料鏈會通往[fluid=ei-heated-deuterium]、[fluid=ei-heated-tritium]和[fluid=ei-heated-helium-3]。
fusion-power-2=中子源
fusion-power-2-text=高密度電漿核融合反應堆 [item=fusion-reactor] 只能提供微弱的次級中子洩漏。它可以被識別為來源，但無法調校成高階燃料所需的強通量。\n\nESIR 熱核融合反應堆 [item=ei-fusion-reactor] 被設計為強力且可調的中子源。低溫有利於中子洩漏，中溫保持折衷，高溫會壓制中子通量並偏向功率輸出。\n\n附近的[color=orange]中子收集器[/color] [item=ei-neutron-collector]會綁定範圍內最強的可用來源。反應堆類型、模式、距離與活動狀態共同決定可用通量。\n\n中子不是裝飾品。它們是高階融合燃料的貨幣。貼近建造，謹慎調校，不要把更明亮的恆星誤認為更慷慨的恆星。
menu_fusion_reactor_controls=熱核融合反應堆控制
title_fusion_reactor_controls=熱核融合反應堆控制
fusion-reactor-controls=手動控制
fusion-reactor-controls-text=ESIR 熱核融合反應堆控制台保留四項手動控制：燃料1、燃料2、溫度和注入率。這些選擇會共同選中一個鎖定的隱藏配方，決定燃料消耗、冷卻劑吞吐量、預估功率和可調中子通量。
fusion-reactor-controls-2=燃料組合與鎖定配方
fusion-reactor-controls-text-2=只有有效燃料組合才能點火。如果所選第二燃料無法與第一燃料反應，控制台會退回反應堆有序表中的第一個有效第二燃料，而不是讓爐體停在不可能的狀態。
fusion-reactor-controls-3=溫度與注入
fusion-reactor-controls-text-3=溫度和注入是兩根獨立的槓桿。低溫會讓中子洩漏最強，但功率較低。中溫是折衷。高溫壓制中子源並偏向發電。低注入節省燃料，中注入穩定，高注入燃燒更猛烈，燃料代價也更高。
menu_fusion_reactor_circuit_interface=融合電路介面
title_fusion_reactor_circuit_interface=融合電路介面
fusion-reactor-circuit-interface=隱藏組合器介面
fusion-reactor-circuit-interface-text=反應堆電路面沿用其他 ESIR 系統的隱形組合器模式。隱藏介面會內部連接到可見反應堆接頭，發布遙測，並在反應堆處於 Circuit 模式時接受控制訊號。
fusion-reactor-circuit-interface-2=讀寫訊號契約
fusion-reactor-circuit-interface-text-2=Manual 模式會忽略寫入訊號，但接線時仍會發布可讀狀態。Circuit 模式讀取 [virtual-signal=ei-fusion-set-fuel-1]、[virtual-signal=ei-fusion-set-fuel-2]、[virtual-signal=ei-fusion-set-temperature] 和 [virtual-signal=ei-fusion-set-injection]。燃料數值為：1 氕，2 氘，3 氚，4 氦-3，5 鋰-6。溫度和注入使用 1 低、2 中、3 高。缺失或為零的欄位使用手動退回值。讀回狀態使用獨立訊號，因此反應堆不會被自己的訊號回聲命令。
menu_fusion_reactor_agents=核融合反應堆代理
title_fusion_reactor_agents=核融合反應堆代理
fusion-reactor-agents=代理狀態
fusion-reactor-agents-text=代理是供電路和診斷使用的緊湊狀態值。控制代理回報 Manual 或 Circuit 權限。燃料代理回報所選組合有效或已校正。熱代理回報低、中、高約束姿態。冷卻劑代理回報所選配方是否具有有效冷卻需求。電路代理回報未接線、可讀取或正在命令。
fusion-reactor-agents-2=訊號數值
fusion-reactor-agents-text-2=數字規則刻意保持簡單。控制代理：1 手動，2 電路。燃料代理：1 有效，2 已校正。熱代理：1 低，2 中，3 高。冷卻劑代理：1 有效需求，3 無效或乾涸。電路代理：1 未接線，2 可讀取，3 命令中。
menu_fusion_reactor_options=核融合反應堆選項
title_fusion_reactor_options=核融合反應堆選項
fusion-reactor-options=選項與退回
fusion-reactor-options-text=選項是疊加在同四項手動控制上的便利命令。重設預設會回到氘-氚、中溫、中注入。刷新收集器會強制附近中子收集器重新評估該反應堆。
fusion-reactor-options-2=預設與覆寫
fusion-reactor-options-text-2=功率、通量、平衡預設會選擇合理的手動值，但不會隱藏精細控制。在 Circuit 模式下，如果某個電路欄位缺失、為零或無效，這些手動值仍會作為退回。
menu_fusion_neutron_collectors=核融合源與中子收集器
title_fusion_neutron_collectors=核融合源與中子收集器
fusion-neutron-collectors=收集器來源優先級
fusion-neutron-collectors-text=中子收集器可以看到兩個融合層級，但來源強度才是關鍵。阿魁洛星高密度電漿核融合反應堆 [item=fusion-reactor] 只提供微弱的次級洩漏；ESIR 熱核融合反應堆 [item=ei-fusion-reactor] 在運作並調校後可以提供強通量。改變熱核融合反應堆配方會改變範圍內收集器看到的中子倍率，因此反應堆模式改變時會刷新收集器佇列。
fusion-neutron-collectors-2=布局壓力
fusion-neutron-collectors-text-2=收集器獎勵幾何。近距離低溫熱核融合反應堆 [item=ei-fusion-reactor] 能用強通量供養燃料生產；高溫發電配置可能產生更多熱量，卻讓收集器挨餓。附近的高密度電漿反應堆 [item=fusion-reactor] 只是背景洩漏。工廠必須決定，這顆星是發電機、增殖源，還是被精確分割的誓約。

[virtual-signal-name]
ei-fusion-set-fuel-1=設定核融合燃料1
ei-fusion-set-fuel-2=設定核融合燃料2
ei-fusion-set-temperature=設定核融合溫度
ei-fusion-set-injection=設定核融合注入
ei-fusion-state-fuel-1=核融合燃料1狀態
ei-fusion-state-fuel-2=核融合燃料2狀態
ei-fusion-state-temperature=核融合溫度狀態
ei-fusion-state-injection=核融合注入狀態
ei-fusion-power=核融合功率
ei-fusion-neutron-flux=核融合中子通量
ei-fusion-efficiency=核融合效率
ei-fusion-coolant-rate=核融合冷卻劑流量
ei-fusion-control-agent=核融合控制代理
ei-fusion-fuel-agent=核融合燃料代理
ei-fusion-thermal-agent=核融合熱代理
ei-fusion-coolant-agent=核融合冷卻劑代理
ei-fusion-circuit-agent=核融合電路代理

[virtual-signal-description]
ei-fusion-set-fuel-1=燃料1的電路輸入。數值：1 氕，2 氘，3 氚，4 氦-3，5 鋰-6。
ei-fusion-set-fuel-2=燃料2的電路輸入。數值：1 氕，2 氘，3 氚，4 氦-3，5 鋰-6。
ei-fusion-set-temperature=溫度的電路輸入。數值：1 低，2 中，3 高。
ei-fusion-set-injection=注入速率的電路輸入。數值：1 低，2 中，3 高。
ei-fusion-state-fuel-1=輸出有效燃料1索引。
ei-fusion-state-fuel-2=輸出有效燃料2索引。
ei-fusion-state-temperature=輸出有效溫度索引。
ei-fusion-state-injection=輸出有效注入索引。
ei-fusion-power=輸出估算反應堆功率，單位 MW。
ei-fusion-neutron-flux=輸出中子通量乘以100。
ei-fusion-efficiency=輸出效率百分比。
ei-fusion-coolant-rate=輸出每秒熱冷卻劑量乘以100。
ei-fusion-control-agent=輸出 1 手動或 2 電路。
ei-fusion-fuel-agent=輸出 1 有效或 2 已校正。
ei-fusion-thermal-agent=輸出 1 低、2 中或 3 高。
ei-fusion-coolant-agent=輸出 1 有效冷卻劑需求或 3 無效。
ei-fusion-circuit-agent=輸出 1 未接線、2 可讀取或 3 命令中。
