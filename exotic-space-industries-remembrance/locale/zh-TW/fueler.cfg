[entity-name]
ei-fueler=自動補給塔

[item-description]
ei-fueler=一座自動[color=orange]補給塔[/color]。可為列車、汽車、坦克，以及它們的[color=blue]裝備網格[/color]與砲塔彈藥槽補充燃料。更多資訊請參閱遊戲內的 Informatron wiki。

[mod-setting-name]
ei_fueler_max_updates_per_tick=補給塔每 tick 最大更新次數
ei-fueler_range=補給塔範圍

[mod-setting-description]
ei_fueler_max_updates_per_tick=每 tick 的更新次數。補給塔會以循環方式輪流更新。提高這個數值，代表更短時間內會更新更多補給塔，但效能也會下降。如果你只拿這些塔去補給靜止目標，預設值就已經足夠。
ei-fueler_range=更高的範圍可以找到更遠的目標，但塔必須掃描更大的區域，因此效能也會下降。

[technology-name]
ei-fueler=補給塔

[technology-description]
ei-fueler=補給塔可以替範圍內的車輛、Spidertron、列車，以及車輛／玩家的裝備網格補給。塔會把自身庫存中的物品轉移到附近的燃料庫存裡。一次只能補給一種目標類型；要設定塔要服務哪一類目標，請使用點擊塔後出現的 GUI。你可以選擇替車輛本體補給，或替裝備網格中的燃料消耗設備補給。只要條件允許，塔也會把燃盡後的燃料回收到自己的庫存中。

[exotic-industries-fueler]
fueler-gui-title=控制台
fueler-gui-control-title=控制
fueler-gui-control-description=[font=default-bold]目標類型[/font] [img=info]
fueler-gui-control-description-tooltip=選擇這座塔要替哪一類目標補給。其他模組的列車可用機車類型支援；其他模組的汽車和坦克可用車輛類型支援。各種 Spidertron 也都適用同樣邏輯。
fueler-gui-equipment-description=[font=default-bold]燃料補給對象[/font] [img=info]
fueler-gui-equipment-description-tooltip=這座塔應該替車輛本體補給，還是替它們的裝備網格補給？

vehicle=僅車輛
equipment=僅裝備網格

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=補給塔
title_exotic-industries-fueler-informatron=補給塔

welcome=Exotic Industries：補給塔
welcome-text=補給塔是一種會把自身庫存中的燃料推送到附近目標的機器。它可以替範圍內的車輛、Spidertron、列車，以及車輛／玩家的裝備網格補給。一次只能服務一種目標類型；要決定塔要補哪種目標，請使用點擊塔時打開的 GUI。你可以選擇替車輛本體補給，或替裝備網格中的燃料消耗設備補給。只要條件允許，塔也會把燃盡後的燃料回收到自己的庫存裡。

welcome-text-2=這些塔也能替移動目標補給，例如行進中的列車。此模組的效能負擔不會隨塔數直接暴增，而是會表現在每座塔的更新頻率下降。你可以在模組設定裡調整更新頻率與塔的範圍。預設值對所有靜止目標都已足夠；如果目標正在移動，而且塔的數量很多，就有可能錯過剛好經過的列車。
