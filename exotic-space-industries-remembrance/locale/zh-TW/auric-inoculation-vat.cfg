[virtual-signal-description]
ei-auric-vat-vigor=輸出接種槽目前的循環活力，範圍為0到100。
ei-auric-vat-contamination=輸出接種槽目前的污染壓力，範圍為0到100。
ei-auric-vat-band=輸出依據已認領濕地地塊計算的目前盆地帶級指數，範圍為1到7。
ei-auric-vat-claims=輸出目前被接種槽認領的濕地盆地地塊數量。
ei-auric-vat-bloom=輸出綻放狀態：1 穩定，2 緊繃，3 失效。

