[recipe-description]
ei-auric-inoculation-vat=建造一座會認領附近濕地盆地、在 Gleba 上運作接種循環，並在之後從沼澤中催生新的金沼囊節點的金沼接種槽。
ei-auric-cyst-washing=用過熱蒸汽燙開收成的金沼囊，再用硫酸蝕穿裂開的囊殼。含金核心碎裂成金塊，耗盡的組織則剝落成腐敗物和污水。

[technology-name]
ei-auric-marsh-inoculation=金沼濕地接種

[technology-description]
ei-auric-marsh-inoculation=解鎖 Gleba 的金沼接種槽、囊體處理與洗滌鏈。認領有效的沼澤盆地，餵入循環試劑，並在污染壓垮綻放之前把它壓住。

