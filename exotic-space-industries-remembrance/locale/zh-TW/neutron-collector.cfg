[recipe-name]
ei-neutron-collector-idle=收集器待機

[recipe-description]
ei-neutron-collector-idle=在沒有可運行的中子充能配方時，仍讓收集器介面保持可用。

[virtual-signal-name]
ei-neutron-efficiency=中子效率
ei-neutron-distance=來源距離
ei-neutron-collector-agent=收集器代理
ei-neutron-source-agent=來源代理
ei-neutron-scan-agent=掃描代理

[virtual-signal-description]
ei-neutron-efficiency=輸出目前收集器效率，範圍為0到300。
ei-neutron-distance=以十分之一格為單位輸出已綁定來源的距離。
ei-neutron-collector-agent=輸出收集器代理狀態：1 運作，2 閒置，3 阻塞。
ei-neutron-source-agent=輸出來源代理狀態：1 在線，2 休眠，3 缺失。
ei-neutron-scan-agent=輸出掃描代理狀態：1 穩定，2 髒，3 等待重綁。

