[lance-upgrades]
axial=寬__1__格的中央切線向接觸點後方延伸最多__2__格，命中最多__3__個額外敵方軍事目標，各造成__4__雷射傷害。兩條分支從接觸點以±__5__°展開，每條寬__6__格、長最多__7__格；兩條合計命中最多__8__個額外目標，各造成__9__雷射傷害。所有光線均限於有效射程內；每個敵人每次射擊最多承受一次貫穿傷害，中央切線優先。
wound=首次直擊沒有傷害加成，第二次直擊獲得+__1__%傷害。對同一目標每次連續造成有效直擊傷害後，下一次直擊的加成再增加__1__個百分點，最高+__2__%。更換目標或間隔達到__3__秒時重置。零傷害不會增加層數或刷新持續時間。次級傷害不享有此加成。
collapse=取代普通濺射，在光束接觸__1__秒後於接觸點發生一次坍縮：半徑__6__格內造成__5__雷射傷害，其外至半徑__3__格內造成__2__雷射傷害。最多命中__4__個額外敵方軍事目標；原直擊目標若仍在範圍內，也會單獨受到傷害。核心與外圈傷害不疊加。
testament=每__1__次耗能射擊觸發：直擊傷害（含創傷記憶）×__2__；中央切線目標上限__3__，兩條分支共用目標上限__7__。第一次坍縮：半徑__9__格內造成__8__雷射傷害，其外至半徑__5__格內造成__4__雷射傷害；最多命中__6__個額外目標，另加符合條件的原直擊目標。光束接觸__10__秒後僅觸發一次回響：__11__雷射傷害、半徑__12__格、最多__13__個額外目標，另加符合條件的原直擊目標。即使原目標已消失或受到保護，該次射擊仍計數。
research-row=__1__（研究解鎖）
protection-title=目標保護
protection=原直擊目標不承受普通濺射或任何貫穿光線的傷害，但只要位於相應範圍內，便可受到每次坍縮的傷害，且不占用額外目標名額。同陣營、中立、友好或停火陣營均受保護，外交關係依雙方任一方向判定。一個敵人可承受一次貫穿傷害，以及每次坍縮各一次傷害。
status=基礎直擊DPS：__1__
contact-title=光束接觸
contact=光束在開火__1__–__3__刻後接觸目標（最長__4__秒），實際時間取決於轉向角度與排隊射擊。標稱轉向速度為每刻__2__°。光束在接觸前跟隨選定目標，接觸時結算直擊與研究解鎖的貫穿傷害。研究解鎖的坍縮延遲從接觸時開始計算，範圍攻擊均固定在該位置。
status-wound= • 創傷直擊 __1__–__2__
status-testament= • 每__1__次射擊×__2__
baseline=基礎能力
force-values=目前陣營 • 傷害倍率×__1__ • 直擊__2__雷射傷害 • 持續直擊DPS __3__（未計創傷記憶與遺言）• 基礎射程__4__格，品質可增加射程。下列數值已計入目前陣營的傷害研究。
base-area=普通濺射：__1__雷射傷害，半徑__2__格，最多__3__個額外目標。終末坍縮將取代此效果。
rules=每次耗能射擊與每次坍縮的傷害均獨立結算。符合中央切線條件的目標優先歸入中央切線，重疊光線不會重複造成貫穿傷害。每次坍縮只造成核心或外圈傷害，兩者不疊加。坍縮範圍與核心範圍均依目標中心判定；中心恰好位於邊界上的目標也計入。目標移動或長矛被移除後，兩次坍縮仍留在光束接觸點；移出範圍可以躲避。數值在開火時確定。創傷會在中斷後失效，印記跟隨目標。遺言統計射擊次數，而非命中數或擊殺數。最後一級只要求完成黑洞研究，無須運作黑洞。品質與目標碰撞範圍決定直擊射程。所有視覺精細度下均保留核心提示，裝飾效果不影響傷害。
research-state=__1__ — __2__
active=已啟用
locked=未解鎖
prerequisites=直接前置科技：
science=所需科技包：
legend-1=視覺提示：白金色中央切線與青色邊緣，兩條較細的稜彩分支從接觸點展開。流動光帶與漸細光尾延伸至各條光線的實際終點。
legend-2=視覺提示：色彩沿裂紋流動；1—2層為裂縫，3—4層為分支裂紋，5層為破碎圓環。印記跟隨目標，隨創傷失效而消失。
legend-3=視覺提示：固定接觸點處可見收縮的外環與核心邊界，稜彩彗尾盤旋匯入其中，傷害結算時核心放出更強的閃光。
legend-4=視覺提示：寬闊稜彩光帶之間的暗色光束核心；更大的暗色坍縮核心與明亮吸積環，隨後再次收縮，以終末十字閃光標示回響。
static-values=所列傷害為長矛傷害研究生效前的基礎值。創傷記憶取決於連續直擊次數，遺言取決於耗能射擊次數，因此不存在固定的範圍DPS。
