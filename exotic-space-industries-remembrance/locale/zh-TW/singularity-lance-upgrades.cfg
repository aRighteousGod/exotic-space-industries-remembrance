[lance-upgrades]
axial=寬__1__格的切線在有效射程內向瞄準點後方延伸最多__2__格，命中最多__3__個額外敵方軍事目標，各造成__4__雷射傷害。
wound=對同一目標連續造成有效直擊傷害時，下一次直擊傷害增加__1__%，最高+__2__%。首擊無加成。更換目標或間隔達到__3__秒時重置。零傷害不會增加層數或刷新持續時間。次級傷害不享有此加成。
collapse=取代普通濺射，在開火__1__秒後於原瞄準點發生一次坍縮：__2__雷射傷害，半徑__3__格，最多命中__4__個額外敵方軍事目標。
testament=每__1__次耗能射擊觸發：直擊傷害（含創傷記憶）×__2__；軸向目標上限__3__；坍縮傷害__4__、半徑__5__、目標上限__6__。即使原目標已消失或受到保護，該次射擊仍計數。
research-row=__1__（研究解鎖）
protection-title=目標保護
protection=原直擊目標不承受任何次級傷害。同陣營、中立、友好或停火陣營均受保護，外交關係依雙方任一方向判定。其他敵人可同時承受貫穿與範圍傷害。
status=持續直擊DPS：__1__ • __2__
baseline=基礎能力
force-values=目前陣營 • 傷害倍率×__1__ • 直擊__2__雷射傷害 • 持續直擊DPS __3__（未計創傷記憶與遺言）• 基礎射程__4__格，品質可增加射程。下列數值已計入目前陣營的傷害研究。
base-area=普通濺射：__1__雷射傷害，半徑__2__格，最多__3__個額外目標。終末坍縮將取代此效果。
rules=每次耗能射擊的傷害均獨立結算。目標移動或長矛被移除後，坍縮仍留在原瞄準點，其數值在開火時確定。創傷會在中斷後失效，印記跟隨目標。遺言統計射擊次數，而非命中數或擊殺數。最後一級只要求完成黑洞研究，無須運作黑洞。品質與目標碰撞範圍決定直擊射程。所有視覺精細度下均保留核心提示，裝飾效果不影響傷害。
research-state=__1__ — __2__
active=已啟用
locked=未解鎖
prerequisites=直接前置科技：
science=所需科技包：
legend-1=視覺提示：白色切線，兩側伴有青色裂紋，延伸至實際貫穿終點。
legend-2=視覺提示：1—2層為裂縫，3—4層為分支裂紋，5層為破碎圓環。印記隨創傷失效而消失。
legend-3=視覺提示：圓環在固定瞄準點向內收縮，並在傷害結算時閃光。
legend-4=視覺提示：暗色光束核心、寬闊白紫邊緣、暗色坍縮圓盤、明亮光環與終末十字閃光。
static-values=所列傷害為長矛傷害研究生效前的基礎值。創傷記憶與遺言須滿足觸發條件，因此不存在固定的範圍DPS。
