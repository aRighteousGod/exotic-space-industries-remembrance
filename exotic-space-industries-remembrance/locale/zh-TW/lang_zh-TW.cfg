[exotic-industries-informatron]
menu_auric_fumarole=金析噴氣孔
title_auric_fumarole=金析噴氣孔
auric-fumarole=金析噴氣孔
auric-fumarole-text=Vulcanus 記得傷口會在哪裡重新裂開；下面的規則都是字面意思，不是象徵。\n\n[font=default-bold]它們能出現在哪裡:[/font] 金析噴氣孔只會出現在 Vulcanus。它們只能生成在火山性非熔岩地面上。距離表面原點 3 個區塊以內的區塊出現機率為 0；超過這片死區後，機率會平滑上升，並在距離原點 32 個區塊時達到完整權重。\n\n[font=default-bold]首次出現:[/font] 新生成的外緣區塊只會進行一次按距離加權的輕量即時播種，不會一開始就把整片外圍灌滿噴口。如果這次輕量播種失敗，該區塊會進入休眠登記，而不是被忘記。重掃與舊存檔回填只會為已生成的 Vulcanus 區塊重建休眠資格，不會強行再來一波即時噴發。\n\n[font=default-bold]產量與壽命:[/font] 每個噴氣孔生成時帶有 4000-8000 的產量。如果無人抽取，它會在一個確定性的 35-65 分鐘窗口後自行封閉。一旦被抽取，它就會一直存在，直到耗盡。封閉或耗盡的地點會冷卻約 60 分鐘，並附帶一個很小的確定性抖動，之後可透過休眠系統再次返回。
auric-fumarole-2=生成紀律與重掃
auric-fumarole-text-2=[font=default-bold]休眠排程:[/font] 每 30 秒，腳本會在全域範圍內重新檢查最多 6 個休眠區塊。普通休眠區塊仍會先進行一次 0.25% 的基礎噴發判定，然後再套用距離權重、硫酸調制、局部壓制，以及生成區域距離帶的充填修正。\n\n[font=default-bold]距離帶調節:[/font] 已生成且合格的 Vulcanus 區塊會按距離原點的 3-6、6-16、16-24、24-32 與 32+ 區塊帶進行追蹤。欠額帶會獲得更強的休眠恢復壓力，過滿帶會自然降溫，而恢復嘗試會優先瞄準最弱的距離帶，避免某一個已探索區域長期壟斷未來噴口。\n\n[font=default-bold]局部壓制與保底:[/font] 6 個區塊範圍內附近的活躍金析噴氣孔會依距離降低休眠機率，而不是靠單一硬性數量直接切斷。越近的噴口壓制越強，數個附近噴口會疊加壓力。如果 Vulcanus 連續 5 分鐘低於 2 個活躍金析噴氣孔，舊的 keepalive 路徑仍會在每個脈衝中強制進行最多 2 次應急恢復嘗試。\n\n[font=default-bold]放置與重掃:[/font] 噴氣孔不必落在區塊正中心；放置位置可在區塊內變化，並會嘗試最多 24 個候選位置。金析噴氣孔之間保持 64 格間距。硫酸間歇泉只會阻止約 16 格內的非常近重疊，不再是整片 32 格禁區。/ei-auric-fumarole-rescan 命令只在 Vulcanus 上可用，並會為已生成區塊重建休眠資格，而不是製造另一波即時氾濫。
