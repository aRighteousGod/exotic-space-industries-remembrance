tech-output=目前時代
tech-output-text=下個時代是 [font=default-bold]__3__[/font] 。您已研究時代進步所需要的 [font=default-bold]__1__ / __2__[/font] 科技。
world-gen-related=世界生成相關資訊
world-gen-related-text=本節說明此模組引入的世界生成系統。為了保持結構清晰，它被劃分為數個聚焦的子類別。\n\n可透過左側選單存取。\n這些不是裝飾性改動。\n它們從根本上決定了地形、資源行為與空間邏輯。\n\n[font=default-bold]理解這一層，否則你就會被它塑形。[/font]
resources=新資源系統
resources-text=Exotic Industries 重構了資源系統。傳統礦區不再是唯一的取得方式，資源如今被劃分為不同類別，每一類都有自己的邏輯、生產流與空間行為。\n開採不再是件簡單事。\n[font=default-bold]取得資源需要適應。[/font]\n理解類別，否則什麼也造不出來。
stone=石頭
stone-text=石頭是整個系統裡最豐富的資源。你仍可透過地表礦區常規開採它，但 Exotic Industries 擴展了它的取得途徑：\n\n[color=orange]地表採集機[/color] [item=ei-burner-surface-harvester] 可以在任何地形上進行深層採集。\n\n[font=default-bold]手動收集仍然可行，只是效率很低。[/font]\n石頭無處不在。\n效率是可選的，產出不是。
surface-patches=地表礦區
surface-patches-text=Nauvis 的地表並不均勻。在著陸區周圍，地殼仍維持成一片受保護的工業儲備區：[item=ei-poor-iron-chunk]鐵、[item=ei-poor-copper-chunk]銅、[item=coal]煤、[item=stone]石頭，以及附近受[fluid=crude-oil]原油壓力支撐的油田，仍足以建立最初的工業基礎。\n\n越過這片搖籃地帶，地表便開始碎裂。[item=ei-poor-iron-chunk]鐵、[item=ei-poor-copper-chunk]銅，甚至[item=ei-poor-uranium-chunk]鈾，大多只以淺層殘餘、斷裂帶與枯竭疤痕地的形式存留。它們確實存在，但不足以支撐持久的金屬經濟。\n\n煤、石頭與石油仍是 Nauvis 運作中的表皮。利用這片儲備建立熱能、輸送帶與化工體系。之後就得學會正確讀懂地形，否則地殼會欺騙你。
veins=深層礦脈
veins-text=礦脈在開局時無法開採。它們需要[color=orange]深層鑽機[/color] [item=ei-deep-drill]，一種為垂直產出而設計的中期採掘系統。\n\n這些礦脈不再以籠統的稀有度擲骰方式生成。Nauvis 上的結構性金屬會沿著[font=default-bold]金屬帶[/font]與[font=default-bold]沉積盆地[/font]分布：[item=ei-iron-chunk]鐵與[item=ei-copper-chunk]銅偏向山脊地帶，而[item=ei-coal-chunk]煤與[item=ei-sulfur-chunk]硫則會在較低的盆地地形中聚集。\n\n[font=default-bold]熱液前線[/font]會在受保護的起始區域之外帶來[item=ei-lead-chunk]鉛與[item=ei-gold-chunk]金。[font=default-bold]外緣疤痕地[/font]蘊藏[item=ei-uranium-chunk]鈾，而只有這些破碎地帶中最稀有的異常口袋才會暴露[item=ei-neodym-chunk]釹。\n\n包括鈾、鉛、金、釹與沉浸岩在內的關鍵材料，只存在於這些深層地帶。\n它們不是可選項。\n它們是結構性的。\n\n[font=default-bold]地表採礦無法帶你走到終局。[/font] 去鑽探，去讀懂地形，否則就只能停滯。
chunk-grades=貧礦塊與富礦塊
chunk-grades-text=並不是所有礦塊都一樣。[item=ei-poor-iron-chunk]貧鐵塊與[item=ei-poor-copper-chunk]貧銅塊，是破碎上層地殼中留下的淺層、受污染碎塊。它們的用途是讓你起家，而不是長期支撐整套工業。它們的低品位會立刻反映在冶煉上：[font=default-bold]3 個貧礦塊 -> 1 塊板材[/font]，而且還會帶來更多爐渣。\n\n來自深層礦脈的[item=ei-iron-chunk]鐵塊與[item=ei-copper-chunk]銅塊，才是真正的礦體。即使不再進一步處理，[font=default-bold]3 個優質礦塊 -> 2 塊板材[/font]，爐渣壓力也低得多。[item=ei-poor-uranium-chunk]貧鈾塊也遵循同樣的規律：地表只給你一點徵兆，真正的[item=ei-uranium-chunk]鈾仍在深層。
chunk-refining=淨化器與純礦
chunk-refining-text=[item=ei-purifier]淨化器是第一台真正提升礦塊品質，而不只是勉強接受它們的機器。它會用[fluid=water]水清洗[item=ei-iron-chunk]鐵塊與[item=ei-copper-chunk]銅塊，把它們轉成[item=ei-pure-iron]純鐵或[item=ei-pure-copper]純銅，同時產出需要處理的[fluid=ei-dirty-water]污水。\n\n這一步非常值得。[font=default-bold]3 個貧礦塊 -> 1 塊板材[/font]，[font=default-bold]3 個優質礦塊 -> 2 塊板材[/font]，而[font=default-bold]1 份純礦 -> 2 塊板材[/font]，且[font=default-bold]爐渣機率只有約 1%[/font]。深層礦塊讓真正的金屬經濟成形，淨化則讓它變得更緊湊、更乾淨、更工業化。
chunk-refining-2=電弧爐與電漿加熱器
chunk-refining-text-2=[item=ei-arc-furnace]電弧爐把礦塊處理推進到真正的冶金階段：它能把礦塊、純礦、板材與零件熔成[fluid=ei-molten-iron]熔融鐵與[fluid=ei-molten-copper]熔融銅，接上後續的鑄造鏈。它確實也能吃貧礦塊，但數字已經說明了為什麼你不該止步於此：[font=default-bold]3 個貧礦塊只能得到 15 單位熔融金屬[/font]，而[font=default-bold]1 份純礦可以得到 40 單位[/font]，幾乎不再產生爐渣。\n\n[item=ei-plasma-heater]電漿加熱器會在量子時代延續這條路線。它仍然可以處理電弧爐的金屬配方，同時解鎖極端高溫的氣體與電漿流程。淨化器提升原料品質，電弧爐提升冶金層級，而電漿加熱器則把整條鏈一路帶到後期。
mining-scars=採礦傷痕
mining-scars-text=耗盡沉積物不再使地形保持不變。當提取完成時，Exotic Industries 可能會在附近的地面上留下疤痕，但僅限於 [item=ei-burner-quarry]、[item=ei-steam-quarry]、[item=ei-electric-quarry] 和 [item=big-mining-drill]。 \n\n 每個耗盡事件都可以在耗盡礦床附近的隨機偏移處播種一個小疤痕斑塊。效果是地形損害，而不是獎勵資源脈衝。
mining-scars-2=行星退化
mining-scars-text-2=疤痕會沿著行星特定的鏈降解瓷磚：Nauvis 草塌陷成泥土和沙子，Fulgora 岩石脫落成沙子、灰塵和沙丘，Gleba 腐爛，Vulcanus 炭化，Aquilo 壓實雪和冰腐爛。水瓦片和隱藏瓦片將被忽略，匹配的裝飾物將被剝離。 \n\nT將傷痕視為地圖，記住您從中獲取的內容。
asteroid-variants=分化的小行星
asteroid-variants-text=Exotic Industries 在普通太空碎片之上增加了六個額外的小行星家族：[item=ei-chemical-asteroid-chunk]、[item=ei-organic-asteroid-chunk]、[item=ei-rock-asteroid-chunk]、[item=ei-uranium-asteroid-chunk]、[item=ei-petrified-asteroid-chunk] 和 [item=ei-scrap-asteroid-chunk]。它們被分層到行星路線中，在 [entity=crusher] 中破碎，所有 12 個基本和高級 EI 小行星配方都受益於 [font=default-bold] 行星生產力 [/font].\n\n 破碎機還通過流體和更大的結果庫存進行了擴展，因此這些混合輸出適合。
chemical-asteroid=化學小行星
chemical-asteroid-text=透過 [font=default-bold] 星球發現解鎖：Aquilo[/font]。基本和高級粉碎從塊中拉出[fluid=ammonia]、[item=ei-fluorite]和[fluid=fluorine]，而高級配方還可以額外滾動[fluid=lithium-brine]。他們的罕見異常是[item=ei-neuro-reactive-residue]。
organic-asteroid=有機小行星
organic-asteroid-text=透過 [font=default-bold] 星球發現解鎖：Gleba[/font]。基礎破碎消耗[fluid=water]，產出[item=spoilage]、[fluid=ei-bio-sludge]、[fluid=ei-ammonia-gas]。高級通證增加了[item=nutrients]，可以返還[item=yumako]、[item=jellynut]、[item=ei-bio-matter]，甚至是稀有的[item=pentapod-egg]。他們的異常是[item=ei-sporeglass-heart]。
rock-asteroid=岩石小行星
rock-asteroid-text=透過 [font=default-bold] 星球發現解鎖：Vulcanus[/font]。基本配方主要是[item=stone]。高級配方開啟更豐富的礦物層：[item=tungsten-ore]、[item=calcite]、[item=ei-gold-chunk]。他們的異常是[item=ei-gravity-braided-ore]。
uranium-asteroid=鈾小行星
uranium-asteroid-text=一旦 [font=default-bold] 空間平台 [/font] 研究即可解鎖，可以進入差異化領域。兩種食譜均消耗 [fluid=sulfuric-acid]。作為回報，它們會產生 [item=stone]、[item=ei-uranium-chunk] 和 [item=ei-lead-chunk]，先進的配方會花費更多的酸來獲得更強的鈾回報。他們的異常是[item=ei-isotopic-ghost-shell]。
petrified-asteroid=石化小行星
petrified-asteroid-text=也可透過 [font=default-bold] 空間平台 [/font] 解鎖。基本粉碎給出了 [item=wood]、[item=raw-fish]、[fluid=ei-liquid-nitrogen] 和 [fluid=ei-liquid-oxygen] 的奇怪組合。高級通行證增加了[item=bioflux]和[fluid=fluoroketone-cold]，改善了生物滾動，甚至允許[item=biter-egg]的小機會。他們的異常是[item=ei-chrono-fossil-shard]。
scrap-asteroid=廢棄小行星
scrap-asteroid-text=透過 [font=default-bold] 星球發現解鎖：Fulgora[/font]。這些配方被連接到廢料回收表中，因此粉碎它們成為廢料流，而不是單一輸出的礦石配方。兩層都保留其 [item=ei-crushed-neodym] 卷，並且都很少會暴露 [item=ei-worm-torn-relay-core]。 \n\n 如果您希望軌道垃圾變成工廠庫存，這就是路線。
asteroid-anomalies=空間資料異常
asteroid-anomalies-text=每一類差異化小行星都隱藏著一種異常物。這六種異常物會進入專用的[entity=ei-computer-core]配方，在模擬器中變成資料卡，最終重組成[item=ei-space-data]，並在零重力環境中由[entity=ei-quantum-computer]完成處理。\n\n小行星帶不只是原料來源。它還是第二條研究前線。
fulgora-day-variation=Fulgora 日長調節器
fulgora-day-variation-text=Fulgora 不會維持固定的日長。在每個週期開始時，模組會根據啟動設定的最小與最大倍率重新決定[font=default-bold]晝夜循環時長[/font]。在預設設定下，這意味著 Fulgora 的每一天都可能落在標準週期長度的[font=default-bold]10% 到 200%[/font]之間。
fulgora-day-variation-2=何時適用重投
fulgora-day-variation-text-2=重滾嘗試在明亮、穩定的光線視窗期間進行，因此表面不會在黑暗中突然進入新的週期長度。如果 Fulgora 從未提供安全窗口，則故障保護會在大約一個標準天後強制進行更改。 \n\n 啟動設定定義了信封。每個實際的日子都會在其中選擇自己的隨機長度。

artifacts=異星神器
artifacts-text=遠古異星文明留下了一些利用奇異物質的神器。您可以在世界各地找到它們。某些甚至還在運作。
actifacts-text-2=小心！它們可能是因為不明原因而被留在那裡...。
gate=__ENTITY__ei_gate__
gate-text=__ENTITY__ei_gate__讓您進行跨維度傳送。它必須透過使用[color=blue]__ITEM__ei_knowledge-tech__[/color][item=ei_knowledge-tech] 在[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。__ENTITY__ei_gate__會消耗最多[color=orange]50 MW[/color]的電力來維持。電量過低將會導致__ENTITY__ei_gate__被關閉。__ENTITY__ei_gate__無法傳送生物，僅能傳送物品和[color=blue]無人機[/color][entity=ei_drone]。__ENTITY__ei_gate__的出口必須指向[color=orange]容器[/color][item=wooden-chest][item=iron-chest]的座標才能傳送物品。
gate-2=接收器和 ID
gate-text-2=門接收器是目的地錨點。每個都聲稱其力量的最低自由正 ID，除非電路訊號 [color=orange]I[/color] 覆蓋它。 \n\n重複的有效 ID 發生衝突，並且在衝突解決之前無法使用。 \n在門控控制台中選擇接收器會將門綁定到該接收器 ID，而不是原始位置。
gate-3=門接線
gate-text-3=門偵聽隱藏的來源端容器。 \n如果此連接器難以定位，也可以直接連接門下部中心附近的隱藏 [entity=ei-gate-circuit-interface]。 \n[[PH1]]]signal-D[/color] 選擇接收器 ID。 \n[color=orange]signal-E[/color] 在上述情況下啟用閘門0.\n接收器上的[color=orange]signal-I[/color]可以覆寫其自動ID。 \n如果[color=orange]signal-D[/color]解析為一個有效接收器，電路控制將覆蓋手動選擇。 \n如果[color=orange]signal-D[/color]遺失，則無效，或衝突時，門回退到手動接收器和手動啟用狀態。
gate-4=門遙測
gate-text-4=閘從隱藏的 [entity=ei-gate-circuit-interface] 輸出。 \n當您想要直接存取閘遙測時，此不可見介面可用作專用連線目標。 \n此介面僅在實際連接到外部電路時更新，並且每秒最多刷新一次。 \n當門被打開時，[color=orange]ei-gate-active[/color] 為 1 \n[color=orange]ei-gate-energy[/color] 報告儲存的能量，單位為 MJ。 \n[color=orange]ei-gate-stress[/color] 報告 0-100 範圍內的壓力。 \n使用這些訊號來驅動警報、緩衝器或控制邏輯。
gate-5=壓力與殘留物
gate-text-5=每次成功的轉移都會增加壓力。壓力會提高維護成本，延長冷卻時間，如果流量重複得太快，可能會使接收器飽和。 \n\n過度使用也會產生[item=ei-breach-residue]，這是一種維度疤痕的廢品。在變得雜亂之前，應該透過淨化器鏈將其中和。 \n閘門是用來突發物流的，而不是用來連續貨運的。
gate-6=舊版大門
gate-text-6=仍然指向箱子或原始位置的舊保存將繼續工作，直到重新配置為止。 \n一旦將門分配給接收器，該接收器就成為事實來源，而舊的原始目的地僅保留資訊性。 \n這將保留舊的保存，同時將新設定移至接收器 ID。
drone=__ENTITY__ei_drone-port__
drone-text=__ENTITY__ei_drone-port__可以讓您控制[color=blue]__ENTITY__ei_drone__[/color][entity=ei_drone]。__ENTITY__ei_drone__可以不受地形影響的移動、放置和移除建築以及攜帶物品，但是無法進行射擊。若[color=blue]__ENTITY__ei_drone__[/color][entity=ei_drone]飛越__ENTITY__ei_gate__則會被傳送。
repair=神器維修工具
repair-text=獲得足夠[color=blue]__ITEM__ei_knowledge-tech__[/color]後您將可以透過[color=blue]維修工具[/color] [item=ei_crystal-accumulator-repair][item=ei_farstation-repair][item=ei_alien-beacon-repair]修復異星神器。神器維修工具會在維修後被消耗。
alien=遠古外星人數據
knowledge-text=遠古異星文明留下神器的同時也留下了部份__ITEM__ei_knowledge-tech__。透過[color=green]__ITEM__ei_scanner__[/color] [item=ei_scanner] 掃描異星生命和神器可以獲得__ITEM__ei_knowledge-tech__。不同複雜度的科技被分為不同的__ITEM__ei_knowledge-tech__等級。
new-logistics=物流系統
new-logistics-text=Exotic Industries 也修改了物流系統。
train-progression=火車
train-progression-text-2=火車會在蒸汽時代很早開放。你的第一個選項是[color=orange]蒸汽機車[/color] [item=ei-steam-basic-locomotive]，它能拉貨，但不能運送流體。\n\n之後會解鎖[color=orange]進階蒸汽機車[/color] [item=ei-steam-advanced-locomotive]，補上流體運輸能力。這兩種型號都依賴煤炭、固體生質等可燃燃料，後期還能繼續吃火箭、核能或聚變燃料來提升表現。\n\n當燃燒變得太髒、太粗暴時，傳統鐵路就會轉向[color=brown]柴油燃料[/color] [item=ei-diesel-fuel-unit]和[color=orange]柴油機車[/color] [item=locomotive]。\n\n物流會隨著科技繼續升級。\n燃料決定邊界。\n火車不會問你要去哪裡，它只要求有東西可燒。\n\n而當蓋婭向你敞開時，鐵路會再次分岔。這條分支現在在本節裡擁有獨立的[font=default-bold]電磁列車[/font]條目，因為它不再是燃燒物流，而是聯網供能基礎設施。
train-progression-text=火車在蒸氣時代即可使用。[color=orange]__ENTITY__ei_steam-basic-locomotive__[/color] [item=ei_steam-basic-locomotive]不能運送流體。更好的[color=orange]__ENTITY__ei_steam-advanced-locomotive__[/color] [item=ei_steam-advanced-locomotive]則可以運送流體。這兩種火車都是透過燃燒燃料來運作。更快的[color=orange]__ENTITY__locomotive__[/color] [item=locomotive]則需要消耗[color=brown]__ITEM__ei_diesel-fuel-unit__[/color] [item=ei_diesel-fuel-unit]。
em-trains=電磁列車
em-trains-text=蓋婭並不要求她後期的鐵路去燃燒。她要求它們去耦合。[item=ei_charger]電磁充能器會在軌道上方鋪開一層晶體場網，[item=ei_em-locomotive]電磁機車連同[item=ei_em-cargo-wagon]貨運車廂與[item=ei_em-fluid-wagon]流體車廂，就在這層場網上運行，而不是往爐膛裡塞煤或柴油。\n\n因為牽引力來自充能器網路，而不是車上的燃燒裝置，同一套車輛既能跑行星內鐵路，也能跑離星走廊。蓋婭的工程師堅稱，這些晶體並不是頂著煙、蒸汽，甚至空氣前進；它們是在「記住」軌道的幾何形狀，並沿著那段記憶把整列車拖過去。不管這是物理還是禮儀，它在真空裡都運作得很好。
em-trains-2=品質、緩衝期與傳輸效率
em-trains-text-2=品質現在會同時影響連結的兩端。更高品質的[item=ei_charger]充能器可將自身場維持開銷最多降低[font=default-bold]20%[/font]，並額外把傳輸效率再提高[font=default-bold]12%[/font]。更高品質的[item=ei_em-locomotive]機車可將自身所需的場功率最多降低[font=default-bold]16%[/font]。這些加成會依目前啟用的品質階梯正規化處理，所以即使有其他模組加入更多品質等級，它們也會在最低與最高等級之間平滑縮放，而不是死綁原版台階。\n\n機車品質還會在離開充能覆蓋後提供一段[font=default-bold]緩衝窗口[/font]。在最高品質下，場相干性最多還能維持[font=default-bold]480 tick，也就是 8 秒[/font]。普通品質完全沒有這段緩衝。它的用途是跨過短缺口、網路接縫或短暫的路徑失誤，而不是替死區軌道開脫。
em-trains-3=研究與場行為
em-trains-text-3=[font=default-bold]ei_acc[/font]、[font=default-bold]ei_spd[/font]與[font=default-bold]ei_eff[/font]這三條研究線仍然是主要的全域乘區。速度與加速度每級都提供[font=default-bold]+10%[/font]，最高可達[font=default-bold]+200%[/font]。充能器效率共有五級，最高可把網路負擔壓低到[font=default-bold]少 90%[/font]。在實際供能發生時，本地充能器品質與本地機車品質會再疊加到這些全域研究之上。\n\n實際運作裡，好的電磁鐵路既靠科技，也靠硬體。只要覆蓋持續刷新，列車就會保持場燃料充盈，像沿著導線前進的光一樣奔跑。若覆蓋崩塌，系統會先吃掉緩衝儲備，之後機車就會變成惰性車體。蓋婭能原諒很多事，斷場不在其中。
orbital-scanner=平台請求掃描器
orbital-scanner-text=[entity=ei-orbital-combinator] 鏡子向 [font=default-bold] 空間位置與掃描器目前表面匹配的空間平台請求最小值。 [/font]\n\n它是唯讀遙測源：掃描器不會發出後勤指令、火箭路線或覆蓋平台行為。它只是重新發布這些平台已經要求的內容，以便您可以將這些資訊連接到車站、警報、商場和導入計劃中。 \n\n平台按確定的順序列出，請求訊號保留其 [font=default-bold]品質[/font] 身份，而不是將每一層折疊為項目計數。
orbital-scanner-2=庫、連續頁和溢出
orbital-scanner-text-2=相同力和表面上的正交相鄰掃描器形成一個共享庫。 \n\n該庫將平台部分分佈在所有相鄰成員上，讓大型軌道交通摘要規模超過單一恆定組合器的槽上限。如果一個平台需要的空間超過單一部分頁面可容納的空間，掃描器將繼續使用 [font=default-bold] 平台名稱 [2/N][/font]、[font=default-bold][3/N][/font]，依此類推。 \n\n如果完整的相鄰庫仍然沒有空間，則錨定掃描器會發出 [virtual-signal=ei-orbital-overflow]。它的值是銀行填滿後省略的請求過濾器的數量。
orbital-scanner-3=實際使用
orbital-scanner-text-3=在軌道需求最重要的地方使用掃描器：\n\n在發射基礎設施上決定下一步應該上演哪些有效載荷。 \n在火車站僅當出現表面可見的平台請求時才召集進口貨物。 \n在商場和緩衝筒倉，當軌道開始要求稀有零件、科學或彈藥時發出警報。 \n\n掃描器在被視為[font=default-bold]規劃時最有用匯流排[/font]。它告訴工廠目前想要什麼軌道；您的電路邏輯決定如何處理該資訊。
spidertron=__ENTITY__spidertron__
spidertron-text=__ENTITY__spidertron__在電腦時代即可使用。但是需要燃料來運作，可以透過高級的核燃料來提高速度和加速度。其他模組中的__ENTITY__spidertron__例如[color=green] Spidertron Patrols [/color]和[color=green] Constructron-Continued [/color]有和此修改相容。
cranes-and-belts=輸送帶和起重機
cranes-and-belts-text=Exotic Industries 加入了新的[color=orange]__ENTITY__ei_neo-belt__[/color] [item=ei_neo-belt]。另外，2x2的[color=orange]__ENTITY__ei_small-inserter-normal__[/color] [item=ei_small-inserter-normal][item=ei_big-inserter-normal]可以用來在容器之間移動大量物品。
bots=更多無人機
bots-text=Remembrance 不等待清潔電動物流才將機器投放到空中。機器人進程開始於 [font=default-bold]蒸氣時代[/font] 和 [item=rp-steam-roboport], [item=rp-steam-logistic-bot]， 和 [item=rp-steam-construction-bot]，然後成熟為更重、更先進的電群。\n\n結果是與空中自動化建立了異常早期的關係：首先是粗糙的，然後是優雅的。
steam-bots=蒸汽機器人
steam-bots-text=這些不是拋光的電動無人機。他們是由活塞、壓力和粗略計算托起的黃銅身體的工人精神，是這個仍然充滿熱金屬和潮濕蒸汽氣味的行業的第一批空中僕人。\n\n因為蒸汽機器人港口線位於 [font=default-bold]蒸氣時代[/font] 後來香草機器人在它後面進行了修補，你獲得飛行後勤和建築幫助的時間遠早於正常運作所允許的時間。
steam-bots-2=熱血沸騰與失敗
steam-bots-text-2=討價還價的是耐力。蒸汽機器人並不具有無窮無盡的電力儲備；它們依靠儲存的壓力飛行，必須在機器人機場耗盡之前返回。如果他們的蒸汽在運輸過程中耗盡，他們 [font=default-bold]從天上掉下來[/font] 而不是優雅地等待救援。\n\n蒸汽機器人港口迫使他們儘早尋求充電，但長時間的工作、擁擠的港口和過度延伸的網路仍然可能將早期的便利性變成廢墟。
bots-2=後來的機器人線路
bots-text-2=一旦工廠實現全電動機器人， EI 透過用於散裝運輸的重型貨運機器人、用於激進構建爆發的重型建築機器人以及後來具有更高速度、範圍、耐用性和任務重點的高級變體來擴展集群。這 [font=default-bold][color=orange]Advanced Roboport[/color][/font] 支援更高的網絡，具有更快的充電速度、更多的機器人插槽和更廣泛的工作半徑。\n\n這不僅僅是一個無人機網路。 [font=default-bold]它是一種機械化群體協議。[/font]
new-mechanics=遊戲機制
new-mechanics-text=Exotic Industries 修改了許多遊戲機制。
beacon-overhaul=__ENTITY__beacon__重製
beacon-overhaul-text=Exotic Industries 限制每台機器只能被[color=red] 4 [/color]台__ENTITY__beacon__影響。__ENTITY__beacon__現在需要__FLUID__ei_liquid-nitrogen__來冷卻且只有25％效率。
specialised-pipes=特殊水管和電纜
specialised-pipes-text=[color=orange]__ENTITY__ei_insulated-pipe__[/color]被用來運輸[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。若使用普通水管則會造成相變。[color=orange]__ENTITY__ei_data-pipe__[/color] [item=ei_data-pipe]可以用來傳輸__FLUID__ei_computing-power__。__FLUID__ei_computing-power__會於部份機器中使用。
specialised-pipes-2=絕熱管線與失穩流體
specialised-pipes-text-2=非絕熱的管線、地下管段與儲槽並不適合所有流體。[fluid=ei-liquid-nitrogen]液態氮與[fluid=ei-liquid-oxygen]液態氧在普通管路中無法維持液態，會重新汽化成[fluid=ei-nitrogen-gas]氮氣與[fluid=ei-oxygen-gas]氧氣。\n\n其他流體，例如[fluid=ei-heated-helium-3]高溫製程流體、熔岩、氟酮與電解液，甚至會直接[font=default-bold]撐裂並摧毀[/font]非絕熱的管線或儲槽。只要介質本身夠危險，絕熱就不是可有可無的選項。
specialised-pipes-3=低溫穩定性與抗凍
specialised-pipes-text-3=絕熱管線也不受一般管路加熱需求限制。絕熱管、地下絕熱管與絕熱儲槽的原型都使用[font=default-bold]0 加熱能耗[/font]，因此即使在 Aquilo 這類極寒地表上，也不需要外部供熱來避免凍結。\n\n當你需要流體維持原本狀態時，就該使用它們：低溫液體維持低溫，反應性混合物持續被安全封存，而普通管路會失效的地方，它們仍然能夠撐住。
space-destinations=太空
space-destinations-text=[color=orange]__ENTITY__ei_rocket-silo__[/color] [item=rocket-silo] 可以將火箭發射至不同目的地。一開始可以將__ITEM__satellite__發射至[color=green]Nauvis 軌道[/color]。根據__ITEM__satellite__的類型或是其他火箭酬載可以獲得不同資源。
space-destinations-2=太空目的地
space-destinations-2-text=隨著遊戲進行，更多的目的地將會被發現。發射所需的[color=orange]燃料[/color] [item=rocket-fuel][item=ei_advanced-rocket-fuel][item=ei_dt-mix]量和品質會隨著距離增加。一些地點需要先被找到才能前往，您可以使用[color=orange]__ITEM__ei_exploration-satellite__[/color] [item=ei_exploration-satellite]提高發現的機率。某些地點甚至位於[color=purple]系外深空[/color]。
induction-matrix=感應矩陣
induction-matrix-text=[color=orange]感應矩陣[/color]是用來儲存大量能量的結構。可以當成是一種可模組化的__ENTITY__accumulator__ [item=accumulator]。可以透過研究來升級。
induction-matrix-2=感應矩陣元件
induction-matrix-2-text=[color=orange]感應矩陣[/color]由各種元件組成。[color=orange]感應矩陣核心[/color] [item=ei_induction-matrix-core]顧名思義就是核心。接入電路網路後，核心會在 signal-C 輸出目前電量、在 signal-T 輸出總容量，並在 signal-M 輸出最大輸入/輸出。只有在核心實際接入電路網路時才會輸出這些訊號，而且更新頻率不會超過每秒一次。\n[color=orange]__ENTITY__ei_induction-matrix-basic-coil__[/color] [item=ei_induction-matrix-basic-coil][item=ei_induction-matrix-advanced-coil][item=ei_induction-matrix-superior-coil]用來儲存能量，與[color=orange]__ENTITY__ei_induction-matrix-basic-solenoid__[/color] [item=ei_induction-matrix-basic-solenoid]相臨時可以提高效率。\n[color=orange]__ENTITY__ei_induction-matrix-basic-converter__[/color] [item=ei_induction-matrix-basic-converter][item=ei_induction-matrix-advanced-converter][item=ei_induction-matrix-superior-converter]增加感應矩陣的充放電效率。
teslas-legacy=Tesla's Legacy武庫
teslas-legacy-text=Tesla's Legacy為Remembrance增加了一條平行的電系武器分支：[item=tl-basic-tesla-coil]基礎特斯拉線圈、[item=tl-advanced-tesla-coil]高級特斯拉線圈，最後還有[item=tl-tesla-tank]特斯拉坦克。它們不像完好無損的古代科技，反而更像是被固執人類雙手重新拼起來的工業雷霆：纏滿電纜的電線桿、綁在裝甲上的蓄電池組，以及被強行寫進條令的閃電。\n\n實驗室裡通常把它們簡稱為[font=default-bold]遺產線圈[/font]。不是因為它們是完美的遺物，而是因為它們繼承了只被理解一半的原理，卻依然能運轉。
teslas-legacy-2=通往複製武器的升級路徑
teslas-legacy-text-2=在Remembrance裡，這條分支有一條清楚的上升鏈。[item=tl-basic-tesla-coil]基礎線圈是第一座可部署的塔。[item=tl-advanced-tesla-coil]高級線圈則直接由基礎線圈與更重型的電網部件製成。再往上，[item=tesla-turret]複製版富戈拉特斯拉線圈分支被補丁為必須先掌握高級線圈技術，而且其配方還要額外消耗一個高級線圈。\n\n[item=tl-tesla-tank]特斯拉坦克位於這棵樹的裝甲側：它仍然從[item=tank]坦克底盤和兩個高級線圈起步，但EI把它進一步後推到了高級電腦時代與碳操縱基礎設施之後。
teslas-legacy-3=研究升級與坦克
teslas-legacy-text-3=Tesla's Legacy做的並不只是增加固定面板數值。線圈路線擁有自己的[font=default-bold]傷害[/font]和[font=default-bold]射速[/font]科技，而腳本層還會加入連鎖追擊電弧、減速效果、放電火焰，以及由波動性驅動的傷害起伏甚至直接汽化。[item=tl-tesla-tank]特斯拉坦克也繼承了這種實驗氣質，而EI又把它進一步上調為更高的生命值，並支援柴油、火箭、核能與聚變級燃料。\n\n把這輛坦克當成一場在地面滾動的雷暴實驗：它與其說是乾淨俐落的裝甲升級，不如說是有人真的把一次電容事故武器化了的戰場證明。

teslas-legacy-4=為什麼富戈拉線圈暫時吃不到這些升級
teslas-legacy-text-4=Tesla's Legacy專屬的升級科技目前作用於[font=default-bold]Legacy線圈彈藥類別[/font]，而不是[item=tesla-turret]複製版富戈拉特斯拉線圈本體。實際效果就是，Legacy路線的傷害與速度升級目前[font=default-bold]不會[/font]強化富戈拉線圈，儘管富戈拉分支現在已經依賴高級Legacy硬體。\n\n官方說法是波形失配只是暫時的：富戈拉電弧幾何仍然拒絕與我們的改裝線圈架構穩定同步。非官方說法則是，實驗室裡最好的科學家們已經把手肘伸進燒焦的電容堆裡了，而只要他們不再和閃電吵架，一切皆有可能。
exotic-stabilizers=奇異物質穩定器

black-hole=__ENTITY__ei_black-hole__
black-hole-text=[color=orange]__ENTITY__ei_black-hole__[/color]透過消滅物質來產生能量。將它進入[color=green]正常運作[/color]狀態將會獲勝。您需要大量材料來建造它，不停的輸入大量物質和能量。建議先建造[color=orange]__ENTITY__ei-fusion-reactor__[/color] [item=ei-fusion-reactor]或[color=orange]感應矩陣[/color]。
black-hole-2=__ENTITY__ei_black-hole__元件
black-hole-2-text=[color=orange]__ENTITY__ei_black-hole__[/color]由各種元件組成。[color=orange]__ENTITY__ei_black-hole__[/color] [item=ei_black-hole]是核心，啟動後它會消耗任何輸入的物品並增加它的 [color=green]質量[/color]。質量會隨時間流逝不停減少。輸入的物品類型不影響增加的質量。\n[color=orange]__ENTITY__ei_energy-injector-pylon__[/color] [item=ei_energy-injector-pylon] 輸入能量來維持黑洞。每個__ENTITY__ei_energy-injector-pylon__會消耗 5GW 的電力。在初始的啟動階段還不需要__ENTITY__ei_energy-injector-pylon__，因為黑洞本身還能安全存在反應爐中。\n[color=orange]__ENTITY__ei_energy-extractor-pylon__[/color] [item=ei_energy-extractor-pylon]可以從__ENTITY__ei_black-hole__中輸出電力，每個__ENTITY__ei_energy-extractor-pylon__可以輸出 100GW 電力。只能在[color=green]正常運作[/color]時使用。
black-hole-3=黑洞階段
black-hole-3-text=__ENTITY__ei_black-hole__需要許多步驟才能運作。一開始的啟動階段只需要達到[color=blue]10 公噸[/color]的質量。下個階段需要[color=blue]8個__ENTITY__ei_energy-injector-pylon__[/color] [item=ei_energy-injector-pylon]來運作。[color=blue]60秒[/color]後__ENTITY__ei_black-hole__將會進入[color=green]正常運作[/color]。[color=green]正常運作[/color]時透過[color=orange]__ENTITY__ei_energy-extractor-pylon__[/color] [item=ei_energy-extractor-pylon]提取的能量不僅能用於維持黑洞運作，還能併入電網使用。此時只需要維持物品輸入即可。
nuclear-fission-and-fusion=核能
nuclear-fission-and-fusion-text=Exotic Industries 新增了新的核能機制。
fission-reactors=核分裂重製
fission-reactors-text=[color=orange]__ENTITY__nuclear-reactor__[/color] [item=nuclear-reactor]不再獲得相鄰加成並具有固定的熱量輸出。__ITEM__uranium-235__ 因為移除鈾增殖而更難取得。對於使用後的燃料棒進行回收分解可以取回部份材料和新的可燃核燃料。[color=brown]__ITEM__ei_nuclear-waste__[/color] [item=ei_nuclear-waste]則需要額外的處理。
fission-reactors-2=__ENTITY__ei_high-temperature-reactor__
fission-reactors-2-text=[color=orange]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]可以更有效率的燃燒核燃料且能直接產生[color=orange]__FLUID__steam__[/color][fluid=steam]。需要大量的水、熱量和核燃料來運作。它甚至可以使用[color=brown]__ITEM__ei_thorium-232__[/color] [item=ei_thorium-232-fuel]作為燃料！
fusion-power=核融合
fusion-power-text=[color=orange]__ENTITY__ei-fusion-reactor__[/color] [item=ei-fusion-reactor]透過核融合反應產生大量能量。它需要循環[color=blue]__FLUID__ei_cold-coolant__[/color] [fluid=ei_cold-coolant]<-->[color=red]__FLUID__ei_hot-coolant__[/color] [fluid=ei_hot-coolant]來進行冷卻。但是此反應爐較為昂貴且需要不停輸入燃料來運作。一開始只有[color=blue]__FLUID__ei_lithium-6__[/color] [fluid=ei_heated-lithium-6]和[color=blue]__FLUID__ei_protium__[/color] [fluid=ei_heated-protium]可以使用。後期透過中子可以獲取[color=blue]__FLUID__ei_deuterium__[/color] [fluid=ei_heated-deuterium]和[color=blue]__FLUID__ei_tritium__[/color] [fluid=ei_heated-tritium]甚至是[color=blue]__FLUID__ei_helium-3__[/color] [fluid=ei_heated-helium-3]。
fusion-power-2=中子
fusion-power-2-text=[color=green]中子[/color]可以用來製造高階核融合燃料。中子可以從[color=green]核分裂[/color]和[color=green]核融合[/color]反應中使用[color=orange]__ENTITY__ei_neutron-collector__[/color] [item=ei_neutron-collector]捕捉。捕捉效率會隨著中子源的數量和距離改變。

