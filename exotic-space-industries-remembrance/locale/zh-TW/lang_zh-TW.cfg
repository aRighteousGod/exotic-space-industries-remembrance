turrets=防禦炮位
turrets-text=Remembrance 大幅擴展了固定防禦。從臨時近距離火力、蒸汽火砲、腐蝕性噴流武器，到電驅彈幕砲座與遺物級能源平台，整條防線都被重新拉長。這些炮位不是[item=gun-turret]機槍砲塔的簡單替代品：每一種都要求不同的後勤、不同的擊殺區與不同的升級支撐。\n\n大多數彈道系新增砲塔仍然吃物理投射物傷害研究，噴流砲塔則跟著火焰傷害路線成長。後期遺物平台更重視極端供電、稀有部件與謹慎配置。
turrets-2=霰彈砲塔與加農砲
turrets-text-2=[item=ei-shotgun-turret]霰彈砲塔在黑暗時代解鎖，位於機槍砲塔與軍事之後。它是典型的貼牆防線答案：15 射程、慢射速、不需要複雜供電，但凡真的衝到牆邊的敵人都會被它硬生生打碎。到了電氣時代，它會升級成[item=ei-auto-shotgun-turret]戰鬥霰彈砲塔，射速翻倍、射程提高到 18、轉向更快，並開始消耗持續電力與每發能量，用密集散彈幕壓住狹窄通道。\n\n[item=ei-cannon-turret-mk1]加農砲塔是蒸汽時代的攻城防禦階段。它發射[item=cannon-shell]炮彈，射程 25、最小射程 8、轉向緩慢，但單發威力極重。之後，兩座 MK1 加上更重的部件可以合成[item=ei-cannon-turret]雙管加農砲塔：更耐打、射速更高、帶電力輔助，射程 30、最小射程 10，更適合在重型目標撞上牆之前先把它們抹掉。
turrets-3=酸液與火焰
turrets-text-3=[item=ei-acidthrower-turret]噴酸砲塔是噴火砲塔的腐蝕版本。它的射程為 38，最小射程 9，可使用[fluid=sulfuric-acid]硫酸、[fluid=ei-nitric-acid]硝酸、[fluid=ei-hydrofluoric-acid]氫氟酸，甚至較弱的[fluid=ei-acidic-water]酸性水，而且每種液體都有各自的傷害倍率。對於更願意把化工產品武器化，而不是單純燒油的工廠來說，它就是噴流砲塔的答案。\n\n原版[item=flamethrower-turret]噴火砲塔也被重做了。EI 把它們移到蒸汽時代，把交戰帶擴展到同樣的 38/9，讓它們更早進入備戰狀態，並顯著提高液體消耗。燃料品質現在真的重要：原油仍然能用，但重油、輕油、石油氣與[fluid=ei-kerosene]煤油會逐步打出更高傷害，而較差的餾分只能算偏弱的緊急燃料。
turrets-4=機槍與雷射
turrets-text-4=[item=ei-gatling-turret]機槍砲塔是電氣時代的子彈水管。它把裝載的[item=ei-minigun]迷你機槍與電驅機構結合，帶來 32 射程、4 最小射程、優秀的轉火能力與極其兇猛的持續射速。代價也和外表一樣直接：無休止地吞[item=firearm-magazine]彈匣，再加上持續供電。\n\n原版[item=laser-turret]雷射砲塔仍然保留，但 EI 把它調整成更講究的電氣時代投資。它們的射程與光束長度都被推到 30，科技明確要求[item=battery]電池與[item=advanced-circuit]進階電路，配方也重構為以[item=ei-steel-beam]鋼梁、[item=steel-plate]鋼板、[item=battery]電池、[item=advanced-circuit]進階電路與[item=ei-energy-crystal]能量水晶為核心。它們因此成了更乾淨的後勤型砲塔，但不再是廉價的通用答案。
turrets-5=遺物級平台
turrets-text-5=[item=ei-plasma-turret]電漿砲塔是量子時代的堡壘重炮。它體型巨大，會狠狠抽乾電網，而且需要感應矩陣部件與多座[item=laser-turret]雷射砲塔來製造。作為回報，它會把起步很慢的電漿彈投送到 200 射程外，自身周圍保留 40 格安全半徑，並在命中後引發巨大的濺射，直接撕碎陣型、工事與地表。\n\n[item=zeus-wrath-zeus-turret]波塞頓裝置則透過[technology=zeus-wrath-zeus-wrath]站上更高的遺物階梯。EI 把它重構成戰略武器：350 射程、70 最小射程、每發 1 GJ、極大的儲能，以及內外兩圈電漿爆炸環。它已經不是守牆砲塔了，而是你用來宣判某個目標必須消失的固定武器。
