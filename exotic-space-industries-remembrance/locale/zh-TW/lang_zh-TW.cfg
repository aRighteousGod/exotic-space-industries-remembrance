# PAGES
welcome=歡迎來到 Exotic Industries！
welcome-text=這是wiki頁面。在這裡，您可以找到有關模組、其功能和機制的資訊。新的發現可能會觸發新條目在這個 wiki 中出現。如果您有問題，請隨時在模組的 Discord 伺服器上提問。您可以在模組頁面上找到伺服器的鏈接。
welcome-text-2=在這個模組中，有很多新的機器、配方和獨特的機制等待著您。有些簡單，有些更具挑戰性。
game-related=遊戲相關資訊
game-related-text=本章節包含有關模組遊戲機制的資訊。
overall=總覽
overall-text=Exotic Industries 是一個大型模組，修改了原本遊戲的幾乎所有東西。因此和許多其他大型模組並不相容。您可以在官方模組包的推薦模組裡找到相容的模組。建議與您喜愛的 QoL 模組一起使用來獲得更好的遊戲體驗。在模組設定裡可以微調一些遊戲機制。
biters=蟲族
biters-text=核心星球上的爆炸、寒冰、毒性、裝甲、蛛形與電系敵人，現在由專用難度階梯處理，而不是改寫地圖生成。在 Nauvis 上，[font=default-bold]ei-default[/font] 仍與這條階梯分開，而真正被縮放的是依賴中已存在的敵對原型。請開啟敵人難度頁面查看完整內容。
enemy-difficulty=壓力階梯
enemy-difficulty-text=本頁記錄的是壓在敵對堆疊上的最後一隻手。它不會改寫 [font=default-bold]ei-default[/font]，也不會憑空捏造第二套生態。它只會彎折依賴蟲群裡原本就存在的血肉: 撕咬蟲、噴吐蟲、蠕蟲、蟲巢、裝甲分支、寒冰分支、毒性分支、爆炸分支、母體、蛛形敵人、電力敵人，以及 [entity=tb_infected_ship_boss] 這樣的感染結構。
enemy-difficulty-2=如何閱讀表格
enemy-difficulty-text-2=每個百分比都以 [font=default-bold]Original[/font] 為基準。[font=default-bold]100%[/font] 表示保留依賴模組的原值。高於 100% 會讓該屬性更高或更強，低於 100% 會讓它更低或更弱。[font=default-bold]攻擊間隔[/font] 和 [font=default-bold]生成間隔[/font] 相反：數值越低，攻擊或生成越快；數值越高，壓力越慢。表中的數值為了便於閱讀做了取整。
enemy-difficulty-3=這條階梯會改變什麼
enemy-difficulty-text-3=這條階梯只會修改屬性。它會調整敵方單位生命、正向回復、裝甲敵人生命、裝甲敵人的正向抗性、攻擊傷害、攻擊射程、移動速度、攻擊間隔、巢穴生命、巢穴回復、生成間隔以及附近單位上限。它不會改寫進化權重、污染吸收、加入攻擊門檻、result_units，也不會改寫敵方武器共用的投射物、光束、雲、流體與彈藥。五足怪、demolisher、Gleba 生成巢、玩家機器人和機器人港都不在這個範圍內。
enemy-difficulty-4=頂級單位額外修正
enemy-difficulty-text-4=Merciful 與 Impossible 還會對利維坦、母體、MAF Boss 鏈、步行電系 Boss 鏈以及 [entity=tb_infected_ship_boss] 施加額外的頂級修正。特例 [entity=arachnid-biter-royalwarrior-unit] 會保留普通的單位生命數值，只單獨調整它的傷害和移動速度。在 [font=default-bold]Impossible[/font] 下，即使啟動開關開啟，Nauvis 的寬限也會被停用。
enemy-difficulty-5=Impossible 反擊
enemy-difficulty-text-5=在 [font=default-bold]Impossible[/font] 下，從敵對地表發射火箭還可能把附近已經存在的敵人集結成對發射井的襲擊。反擊通常會從大約 [font=default-bold]100 到 250 格[/font] 的範圍內拉來一支本地戰群，常見規模約為 [font=default-bold]8 到 30 個單位[/font]；發射越重，反應越兇。如果發射地表沒有本地敵對生態，就不會建立反擊小隊。
enemy-difficulty-6=邊界
enemy-difficulty-text-6=[font=default-bold]Original[/font] 會直接使用依賴模組的數值，不做 EI 的敵人修正。[font=default-bold]Tempered[/font] 是預設設定。高於它會增加壓力，低於它會降低壓力，但不會改寫地圖預設本身。
