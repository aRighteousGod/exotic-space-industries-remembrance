[technology-description]
ei-exotic-magazines=將異裝彈匣系列自舊式彈藥階梯中分離出來。殼體、驅動、核心，然後才是裝藥。彈匣本身成了教義。
ei-corrosive-magazines=讓異裝系列攜帶硝酸腐蝕作為第二道創傷。命中撕開傷口，化學繼續爭辯。
ei-cryo-magazines=把低溫粉末封進控制型彈匣。它先奪走速度，再考慮奪命。
ei-oxyfluoride-magazines=把二氟化氧塞進足以裝膛的格式裡。先是白光，後是後悔。
ei-morphium-magazines=將濃縮通元裝入這一系列，把彈道命中變成污染、遲滯與異信號。
ei-hexafluoride-magazines=把六氟化鈾化學與穿透體結合起來，讓懲罰在入體之後繼續。
ei-arc-magazines=把異裝彈匣重構成過充牢籠。子彈不只是命中，它會攫住目標。
ei-neutron-magazines=需要已充能的中子容器，並讓彈藥學會把輻照當作第二道傷害留下。
ei-auric-precipitation=解鎖 Vulcanus 金析噴氣孔鏈。碳化鎢被塑形成犧牲性的析出核心，以蒸汽喚醒噴口，並將含金蒸汽凝成高熱蒸汽與含金熔渣。產量兇猛，地面危險，窗口有限。
ei-dark-age=Exotic Industries 模組的第一個時代。基於使用燃料熱能的自動化。
ei-steam-age=Exotic Industries 模組的第二個時代。使用蒸汽動力來進一步發展。
ei-electricity-age=Exotic Industries 模組的第三個時代。利用電力進行更高級的化學處理。
ei-computer-age=Exotic Industries 模組的第四個時代。基於電腦的系統可以提高工廠的效率並完成更複雜的任務。
ei-quantum-age=Exotic Industries 模組的第五個時代。等待您的是核融合和高科技！
ei-exotic-age=Exotic Industries 模組的第六個也是最後一個時代。通過建造結構來贏得遊戲。

ei-steam-assember=基本的蒸汽自動化。
ei-steam-oil-processing=進行基本的原油處理，用於基本化學或燃料生產。
ei-electricity-power=進行基本的電力生產，並用它來為您的機器供電。
ei-destill-tower=將原油分餾成各種部分。
ei-computer-core=進行基於電腦的自動化。
ei-big-lab=使用進階實驗室來研究更高級的技術。
ei-induction-matrix=感應矩陣是一個能量儲存結構。更多資訊可以在 InformaTron wiki 中找到。
ei-neodym-refining=將釹礦石精煉成釹板。這對於高科技機械非常重要。
ei-deep-mining=進行深層挖掘來獲得在 Nauvis 的深層礦脈中才能找到的資源。
ei-moon-exploration=獲得__ITEM__ei_moon-fish__，並進行太空探索。
ei-quantum-computer=進行基於量子電腦的自動化。
ei-fluid-boiler=消耗[color=orange]可燃流體[/color]以產生蒸汽。
ei-small-inserter=帶有選擇器的2x2機械臂。可以移動大量物品。
ei-big-inserter=帶有選擇器的2x2機械臂。可以高速移動大量物品。
ei-rocket-silo=發射火箭到太空。

ei-crystal-accumulator-repair=無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-bio-chamber=種植異星植物並用它們生產生物鍍板。種子可以透過射擊異星花來獲得。\n\n無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-gate=傳送至異次元！ \n\n無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-bio-energy-crystal=無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-bio-insulated-wire=無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-bio-high-energy-crystal=無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
ei-bio-electronic-parts=無法研究。使用[color=blue]__ENTITY__ei_knowledge-console__[/color][item=ei_knowledge-console]解鎖。
