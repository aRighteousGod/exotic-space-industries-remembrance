ei-burner-heater=燃燒[color=orange]燃料[/color]來生產[color=red]熱[/color]。
ei-combustion-turbine=高效率且緊湊的蒸汽發電機。包含燃料燃燒和蒸汽循環系統。
ei-basic-heat-pipe=__ENTITY__ei_basic-heat-pipe__可以緩慢地傳遞少量的熱。\n最高溫度為[color=red]275 攝氏度[/color]。
ei-burner-assembler=基礎的組裝機。透過燃燒[color=orange]燃料[/color]運作。[color=brown]__ENTITY__burner-inserter__[/color][item=burner-inserter]可以從這台機器偷取燃料。
ei-steam-assembler=蒸汽動力的組裝機。可以讓[color=orange]__FLUID__steam__[/color][fluid=steam]通過。\n若配方需要蒸汽，則需要額外的蒸汽管線。
ei-steam-crusher=蒸汽動力的粉碎機。可以讓[color=orange]__FLUID__steam__[/color][fluid=steam]通過。
ei-waver-factory=製造高品質[color=orange]__ITEM__ei_semiconductor__[/color][item=ei_semiconductor][item=ei_advanced-semiconductor]。
ei-caster=在這裡鑄造您最愛的金屬錠[item=ei_iron-ingot][item=ei_copper-ingot][item=ei_steel-ingot][item=ei_gold-ingot][item=ei_lead-ingot][item=ei_neodym-ingot][item=ei_glass]。
ei-lufter=從大氣中分離氣體或是排放氣體。
ei-grower=培養[color=green]__ITEM__ei_energy-crystal__[/color][item=ei_energy-crystal][item=ei_high-energy-crystal][item=ei_enriched-cryodust]。也可以養魚！
ei-plasma-heater=將氣體加熱成電漿，消耗大量電力，也可以當作__ENTITY__ei_arc-furnace__使用。
ei-nano-factory=高階物質處理。
ei-bio-chamber=處理異星生物的__ENTITY__ei_bio-chamber__。\n[color=red][注意][/color]只能在 Gaia 建造
ei-bio-reactor=處理異星生物的__ENTITY__ei_bio-reactor__。\n[color=red][注意][/color]只能在 Gaia 建造
ei-knowledge-console=處理遠古異星知識的地方。建造後將可以存取 InformaTron wiki 中有關異星知識的頁面。
ei-gate=使用遠古異星知識建造的__ENTITY__ei_gate__。它似乎自動連接至某處。\n[color=red][注意][/color]無法傳送生物，僅能傳送物品和[color=blue]__ENTITY__ei_drone__[/color][entity=ei_drone]。
ei-gate-container=使用遠古異星知識建造的__ENTITY__ei_gate__。它似乎自動連接至某處。\n[color=red][注意][/color]無法傳送生物，只能傳送物品和[color=blue]__ENTITY__ei_drone__[/color][entity=ei_drone]。
ei-drone-port=控制[color=blue]__ENTITY__ei_drone__[/color][entity=ei_drone]。__ENTITY__ei_drone__有自己的背包和裝甲槽，並可以建造建築。但是它不能製造物品和攻擊敵人。
