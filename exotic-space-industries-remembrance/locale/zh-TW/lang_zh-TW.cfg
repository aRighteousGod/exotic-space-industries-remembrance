exotic-stabilizers-text=奇異物質不是普通資源，而是被迫為你所用的威脅。處理它需要嚴密收容、精確控制，以及能承受其揮發性的專用機械。\n\n[color=orange]奇異物質組裝機[/color] [item=ei-exotic-assembler] 是唯一能承受這種能量特徵的結構。即便如此，不穩定仍然無可避免：組裝機可能會在壓力下爆炸。當晶格仍維持住時，機器會以可見的收容脈衝低鳴；一旦開始失去控制，這種脈衝就會硬化成爆裂聲、弧光放電，以及沉重到幾乎能壓在你身上的警告。\n\n為了降低這種風險，請在組裝機周圍放置 [color=orange]奇異物質穩定器[/color] [item=ei-matter-stabilizer]。這些裝置會壓制關鍵失效事件，並穩定周圍的能量場。有些甚至能在世界各處找到，那是前一個循環留下來的遺骸。\n[color=gray]品質物質穩定器每個都按 3 x (品質 - 1) 個穩定器計算。\n品質奇異組裝機每秒發生熵級聯的機率會降低 (品質 - 1)%，也就是說，非凡會把基礎機率從 12% 降到 11%。[/color]\n\n不要把奇異物質當成普通原料。\n\n它[font=default-bold]是活的、不穩定的，而且正在看著你。[/font]
