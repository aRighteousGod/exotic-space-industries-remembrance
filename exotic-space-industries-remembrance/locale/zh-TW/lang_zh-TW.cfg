[technology-description]
ei_dark-age=Exotic Industries 模組的第一個時代。基於使用燃料熱能的自動化。
ei_steam-age=Exotic Industries 模組的第二個時代。使用蒸汽動力來進一步發展。
ei_electricity-age=Exotic Industries 模組的第三個時代。利用電力進行更高級的化學處理。
ei_computer-age=Exotic Industries 模組的第四個時代。基於電腦的系統可以提高工廠的效率並完成更複雜的任務。
ei_quantum-age=Exotic Industries 模組的第五個時代。等待您的是核融合和高科技！
ei_exotic-age=Exotic Industries 模組的第六個也是最後一個時代。通過建造結構來贏得遊戲。

ei_steam-assember=基本的蒸汽自動化。
ei_steam-oil-processing=進行基本的原油處理，用於基本化學或燃料生產。
ei_electricity-power=進行基本的電力生產，並用它來為您的機器供電。
ei_destill-tower=將原油分餾成各種部分。
ei_computer-core=進行基於電腦的自動化。
ei_big-lab=使用進階實驗室來研究更高級的技術。
ei_induction-matrix=感應矩陣是一個能量儲存結構。更多資訊可以在 InformaTron wiki 中找到。
ei_neodym-refining=將釹礦石精煉成釹板。這對於高科技機械非常重要。
ei_deep-mining=進行深層挖掘來獲得在 Nauvis 的深層礦脈中才能找到的資源。
ei_moon-exploration=獲得__ITEM__ei_moon-fish__，並進行太空探索。
ei_quantum-computer=進行基於量子電腦的自動化。
ei_fluid-boiler=消耗[color=orange]可燃流體[/color]以產生蒸汽。
ei_small-inserter=帶有選擇器的2x2機械臂。可以移動大量物品。
ei_big-inserter=帶有選擇器的2x2機械臂。可以高速移動大量物品。
