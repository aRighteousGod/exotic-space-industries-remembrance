rocket-ammo-schema=火箭彈藥結構圖
rocket-ammo-schema-text=火箭彈藥按層組裝：[item=ei-rocket-airframe]彈體骨架、[item=ei-rocket-motor-basic]推進器、[item=ei-rocket-warhead-impact]彈頭，然後才是成品彈藥。骨架穩住外殼，推進器決定射程，彈頭決定傷害類型。砲兵線也遵循同一套邏輯，只是更重，也更不講情面。
rocket-ammo-schema-2=彈頭分支
rocket-ammo-schema-text-2=基礎線現在也配得上成本：撞擊彈和爆炸彈都更兇，腐蝕彈在手持發射器和砲兵線之間共用同一套化學包，先打一記強酸衝擊，再留下持續腐蝕雲去啃結構；冷凍彈則在兩條線路之間保持相同的控制持續時間，但命中也更有份量。原子線則明確分開，U-235 最終會變成 ESIR 自有的 [item=ei-atomic-bomb-u235]，鈽則仍顯示為鈽原子火箭，並使用 vanilla 原子爆炸。
rocket-ammo-schema-3=特效家族
rocket-ammo-schema-text-3=每個家族都有自己的爆炸、煙霧和貼花，這樣爆點在運動裡仍然清楚，而不是糊成一團白閃。
rocket-ammo-schema-4=砲兵原子線
rocket-ammo-schema-text-4=固定扇面的砲兵發射架現在也可裝填 U-235 與鈽製的單裝或整箱原子火箭。整箱齊射本質上屬於自毀式用法：裂變材料的生產與解鎖路線依舊分開，U-235 使用更緊湊的 ESIR 中心爆炸，鈽則使用 vanilla 原子爆炸與其完整原子破口，若在過近距離開火，破口依舊很可能連砲位一起撕開。
