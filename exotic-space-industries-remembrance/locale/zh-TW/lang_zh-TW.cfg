[item-description]
ei_excavator=消耗[color=blue]__FLUID__water__[/color][fluid=water]來生產[color=orange]15/秒的__ITEM__stone__[/color][item=stone]和[color=brown]__FLUID__ei_dirty-water__[/color][fluid=ei_dirty-water]。
ei_metalworks_1=更快速的生產[color=orange]金屬錠[/color]相關的配方。
