cranes-and-belts=輸送帶和起重機
loaders-text=[item=ei-loader]裝卸機、[item=ei-fast-loader]快速裝卸機、[item=ei-express-loader]高速裝卸機、[item=ei-turbo-loader]渦輪裝卸機與[item=ei-neo-loader]新型裝卸機構成了 EI 物流中的直連支系。階層越高，吞吐越強，但耗電也越重。\n\n它們不是把物品拋過空中，而是把輸送帶流量直接咬合到機器、容器、貨車與貼軌介面上。
loaders-text-2=[item=ei-express-loader]高速裝卸機最多可堆疊到 [font=default-bold]2[/font]，而且堆疊大小可以調整。[item=ei-turbo-loader]渦輪裝卸機同樣最多堆疊到 [font=default-bold]2[/font]。[item=ei-neo-loader]新型裝卸機則會繼承遊戲中的完整輸送帶堆疊上限，也可以在需要精細控制時手動下調。\n\n高階裝卸機不只是追上更快的帶速，而是在同一格內推送更密集的物料脈衝。
loaders-3=過濾
loaders-4=吸附與放置
loaders-text-5=所有 EI 裝卸機都需要 [font=default-bold]電力[/font]。每搬運一個物品都會消耗內部緩衝中的能量，而階層越高，內部緩衝與單件耗電都會一起上升。高階機型更強，但絕不更省。\n\n裝卸機可以靠內部儲能短暫撐過掉電，但若沒有穩定電網支撐，就無法長時間維持滿吞吐。
bots-text=Remembrance 不等待清潔電動物流才將機器投放到空中。機器人進程開始於 [font=default-bold]蒸氣時代[/font] 和 [item=rp-steam-roboport], [item=rp-steam-logistic-bot]， 和 [item=rp-steam-construction-bot]，然後成熟為更重、更先進的電群。\n\n結果是與空中自動化建立了異常早期的關係：首先是粗糙的，然後是優雅的。
steam-bots=蒸汽機器人
steam-bots-text=這些不是拋光的電動無人機。他們是由活塞、壓力和粗略計算托起的黃銅身體的工人精神，是這個仍然充滿熱金屬和潮濕蒸汽氣味的行業的第一批空中僕人。\n\n因為蒸汽機器人港口線位於 [font=default-bold]蒸氣時代[/font] 後來香草機器人在它後面進行了修補，你獲得飛行後勤和建築幫助的時間遠早於正常運作所允許的時間。
new-mechanics-text=Exotic Industries 修改了許多遊戲機制。
specialised-pipes=特殊水管和電纜
specialised-pipes-text=[color=orange]__ENTITY__ei_insulated-pipe__[/color]被用來運輸[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。若使用普通水管則會造成相變。[color=orange]__ENTITY__ei_data-pipe__[/color] [item=ei_data-pipe]可以用來傳輸__FLUID__ei_computing-power__。__FLUID__ei_computing-power__會於部份機器中使用。
specialised-pipes-text-2=非絕熱的管線、地下管段與儲槽並不適合所有流體。[fluid=ei-liquid-nitrogen]液態氮與[fluid=ei-liquid-oxygen]液態氧在普通管路中無法維持液態，會重新汽化成[fluid=ei-nitrogen-gas]氮氣與[fluid=ei-oxygen-gas]氧氣。\n\n其他流體，例如[fluid=ei-heated-helium-3]高溫製程流體、熔岩、氟酮與電解液，甚至會直接[font=default-bold]撐裂並摧毀[/font]非絕熱的管線或儲槽。只要介質本身夠危險，絕熱就不是可有可無的選項。
space-destinations-2=太空目的地
induction-matrix-2-text=[color=orange]感應矩陣[/color]由各種元件組成。[color=orange]感應矩陣核心[/color] [item=ei_induction-matrix-core]顧名思義就是核心。接入電路網路後，核心會在 signal-C 輸出目前電量、在 signal-T 輸出總容量，並在 signal-M 輸出最大輸入/輸出。只有在核心實際接入電路網路時才會輸出這些訊號，而且更新頻率不會超過每秒一次。\n[color=orange]__ENTITY__ei_induction-matrix-basic-coil__[/color] [item=ei_induction-matrix-basic-coil][item=ei_induction-matrix-advanced-coil][item=ei_induction-matrix-superior-coil]用來儲存能量，與[color=orange]__ENTITY__ei_induction-matrix-basic-solenoid__[/color] [item=ei_induction-matrix-basic-solenoid]相臨時可以提高效率。\n[color=orange]__ENTITY__ei_induction-matrix-basic-converter__[/color] [item=ei_induction-matrix-basic-converter][item=ei_induction-matrix-advanced-converter][item=ei_induction-matrix-superior-converter]增加感應矩陣的充放電效率。
black-hole-2-text=[color=orange]__ENTITY__ei_black-hole__[/color]由各種元件組成。[color=orange]__ENTITY__ei_black-hole__[/color] [item=ei_black-hole]是核心，啟動後它會消耗任何輸入的物品並增加它的 [color=green]質量[/color]。質量會隨時間流逝不停減少。輸入的物品類型不影響增加的質量。\n[color=orange]__ENTITY__ei_energy-injector-pylon__[/color] [item=ei_energy-injector-pylon] 輸入能量來維持黑洞。每個__ENTITY__ei_energy-injector-pylon__會消耗 5GW 的電力。在初始的啟動階段還不需要__ENTITY__ei_energy-injector-pylon__，因為黑洞本身還能安全存在反應爐中。\n[color=orange]__ENTITY__ei_energy-extractor-pylon__[/color] [item=ei_energy-extractor-pylon]可以從__ENTITY__ei_black-hole__中輸出電力，每個__ENTITY__ei_energy-extractor-pylon__可以輸出 100GW 電力。只能在[color=green]正常運作[/color]時使用。
black-hole-3=黑洞階段
black-hole-3-text=__ENTITY__ei_black-hole__需要許多步驟才能運作。一開始的啟動階段只需要達到[color=blue]10 公噸[/color]的質量。下個階段需要[color=blue]8個__ENTITY__ei_energy-injector-pylon__[/color] [item=ei_energy-injector-pylon]來運作。[color=blue]60秒[/color]後__ENTITY__ei_black-hole__將會進入[color=green]正常運作[/color]。[color=green]正常運作[/color]時透過[color=orange]__ENTITY__ei_energy-extractor-pylon__[/color] [item=ei_energy-extractor-pylon]提取的能量不僅能用於維持黑洞運作，還能併入電網使用。此時只需要維持物品輸入即可。
nuclear-fission-and-fusion=核能
nuclear-fission-and-fusion-text=Exotic Industries 新增了新的核能機制。
fission-reactors-2=__ENTITY__ei_high-temperature-reactor__
fusion-power=核融合
fusion-power-2=中子
fusion-power-2-text=[color=green]中子[/color]可以用來製造高階核融合燃料。中子可以從[color=green]核分裂[/color]和[color=green]核融合[/color]反應中使用[color=orange]__ENTITY__ei_neutron-collector__[/color] [item=ei_neutron-collector]捕捉。捕捉效率會隨著中子源的數量和距離改變。
ages-and-tech-2=黑暗、蒸汽、電力、電腦、量子和奇異時代
nauvis-pressure-grace-text=此啟動切換為 Nauvis 提供了臨時的演化煞車。每 18,000 個刻度或 5 分鐘，腳本會檢查 Nauvis 上敵方力量的演變，並僅在當前值高於特定年齡的寬限目標時將其降低至多 [font=default-bold]0.005[/font]。 \n\n 它不會清除污染、刪除巢穴或取消攻擊。它只會將多餘的進化削減到遊戲早期的上限。Impossible 也會在此開關開啟時直接關閉這份緩衝。
nauvis-pressure-grace-2=年齡上限
rocket-launch-pollution=火箭發射污染
rocket-launch-pollution-text-2=啟動 [font=default-bold] 曲線形式 [/font] 可以設定為線性、二次、指數、閾值或混合。線性直接追蹤進化。二次和指數將更多的懲罰推到以後的發布中。閾值跨越固定的進化帶。混合使用線性底座並添加額外的遊戲後期尖峰。 \n\n發射序列也在筒倉上繪製了揮之不去的煙霧螺旋，因此污染事件是可見的而不是無聲的。在 Impossible 下，如果附近已經有本地敵人，煙霧也可能伴隨反擊。
[virtual-signal-name]
ei-orbital-overflow=軌道掃描器溢出
ei-platform-id=平台 ID
ei-orbital-ready=軌道就緒
ei-orbital-blocked=軌道阻塞
ei-orbital-invalid=軌道無效
ei-orbital-lease=軌道租約

[virtual-signal-description]
ei-orbital-overflow=顯示因相鄰掃描器銀行容量不足而被省略的請求過濾器數量。
ei-platform-id=勢力本地的平台數字標識，供軌道物流集群用於目標選擇與仲裁。
ei-orbital-ready=表示軌道節點、任務或目標已準備好進入下一步調度。
ei-orbital-blocked=表示目前軌道路徑被租約衝突、發射井狀態或策略條件阻塞。
ei-orbital-invalid=表示目前目標、綁定或平台解析結果無效。
ei-orbital-lease=表示該調度任務目前正由活躍協調器持有租約。

spidertron=__ENTITY__spidertron__
spidertron-text=__ENTITY__spidertron__在電腦時代即可使用。但是需要燃料來運作，可以透過高級的核燃料來提高速度和加速度。其他模組中的__ENTITY__spidertron__例如[color=green] Spidertron Patrols [/color]和[color=green] Constructron-Continued [/color]有和此修改相容。
cranes-and-belts-text=Exotic Industries 加入了新的[color=orange]__ENTITY__ei_neo-belt__[/color] [item=ei_neo-belt]。另外，2x2的[color=orange]__ENTITY__ei_small-inserter-normal__[/color] [item=ei_small-inserter-normal][item=ei_big-inserter-normal]可以用來在容器之間移動大量物品。
loaders=裝卸機
loaders-2=堆疊
loaders-text-3=[item=ei-express-loader]高速裝卸機擁有 [font=default-bold]一個共用過濾器[/font]。[item=ei-turbo-loader]渦輪裝卸機與[item=ei-neo-loader]新型裝卸機則擁有 [font=default-bold]兩個車道過濾器[/font]，可以分別控制左右車道。\n\n到這個層級，一台裝卸機不只決定什麼能通過，也能決定它該走哪一側。
loaders-text-4=裝卸機在放置時會 [font=default-bold]自動吸附到有效連接[/font]，附近輸送帶變化時也會重新判定。它們檢查的是真正可用的輸送帶、容器、貨車與貼軌連接，而不是盲信游標最初的朝向。\n\n因此，把裝卸機貼著貨車、箱子、機器或貼軌介面放下時，它可能會轉向，甚至翻轉進出方向，只為真正鎖定那條連接。
loaders-5=電力
bots=更多無人機
steam-bots-2=熱血沸騰與失敗
steam-bots-text-2=討價還價的是耐力。蒸汽機器人並不具有無窮無盡的電力儲備；它們依靠儲存的壓力飛行，必須在機器人機場耗盡之前返回。如果他們的蒸汽在運輸過程中耗盡，他們 [font=default-bold]從天上掉下來[/font] 而不是優雅地等待救援。\n\n蒸汽機器人港口迫使他們儘早尋求充電，但長時間的工作、擁擠的港口和過度延伸的網路仍然可能將早期的便利性變成廢墟。
bots-2=後來的機器人線路
bots-text-2=一旦工廠實現全電動機器人， EI 透過用於散裝運輸的重型貨運機器人、用於激進構建爆發的重型建築機器人以及後來具有更高速度、範圍、耐用性和任務重點的高級變體來擴展集群。這 [font=default-bold][color=orange]Advanced Roboport[/color][/font] 支援更高的網絡，具有更快的充電速度、更多的機器人插槽和更廣泛的工作半徑。\n\n這不僅僅是一個無人機網路。 [font=default-bold]它是一種機械化群體協議。[/font]
new-mechanics=遊戲機制
beacon-overhaul=__ENTITY__beacon__重製
beacon-overhaul-text=Exotic Industries 限制每台機器只能被[color=red] 4 [/color]台__ENTITY__beacon__影響。__ENTITY__beacon__現在需要__FLUID__ei_liquid-nitrogen__來冷卻且只有25％效率。
specialised-pipes-2=絕熱管線與失穩流體
specialised-pipes-3=低溫穩定性與抗凍
specialised-pipes-text-3=絕熱管線也不受一般管路加熱需求限制。絕熱管、地下絕熱管與絕熱儲槽的原型都使用[font=default-bold]0 加熱能耗[/font]，因此即使在 Aquilo 這類極寒地表上，也不需要外部供熱來避免凍結。\n\n當你需要流體維持原本狀態時，就該使用它們：低溫液體維持低溫，反應性混合物持續被安全封存，而普通管路會失效的地方，它們仍然能夠撐住。
space-destinations=太空
space-destinations-text=[color=orange]__ENTITY__ei_rocket-silo__[/color] [item=rocket-silo] 可以將火箭發射至不同目的地。一開始可以將__ITEM__satellite__發射至[color=green]Nauvis 軌道[/color]。根據__ITEM__satellite__的類型或是其他火箭酬載可以獲得不同資源。
space-destinations-2-text=隨著遊戲進行，更多的目的地將會被發現。發射所需的[color=orange]燃料[/color] [item=rocket-fuel][item=ei_advanced-rocket-fuel][item=ei_dt-mix]量和品質會隨著距離增加。一些地點需要先被找到才能前往，您可以使用[color=orange]__ITEM__ei_exploration-satellite__[/color] [item=ei_exploration-satellite]提高發現的機率。某些地點甚至位於[color=purple]系外深空[/color]。
induction-matrix=感應矩陣
induction-matrix-text=[color=orange]感應矩陣[/color]是用來儲存大量能量的結構。可以當成是一種可模組化的__ENTITY__accumulator__ [item=accumulator]。可以透過研究來升級。
induction-matrix-2=感應矩陣元件

exotic-stabilizers=奇異物質穩定器

black-hole=__ENTITY__ei_black-hole__
black-hole-text=[color=orange]__ENTITY__ei_black-hole__[/color]透過消滅物質來產生能量。將它進入[color=green]正常運作[/color]狀態將會獲勝。您需要大量材料來建造它，不停的輸入大量物質和能量。建議先建造[color=orange]__ENTITY__ei-fusion-reactor__[/color] [item=ei-fusion-reactor]或[color=orange]感應矩陣[/color]。
black-hole-2=__ENTITY__ei_black-hole__元件
fission-reactors=核分裂重製
fission-reactors-text=[color=orange]__ENTITY__nuclear-reactor__[/color] [item=nuclear-reactor]不再獲得相鄰加成並具有固定的熱量輸出。__ITEM__uranium-235__ 因為移除鈾增殖而更難取得。對於使用後的燃料棒進行回收分解可以取回部份材料和新的可燃核燃料。[color=brown]__ITEM__ei_nuclear-waste__[/color] [item=ei_nuclear-waste]則需要額外的處理。
fission-reactors-2-text=[color=orange]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]可以更有效率的燃燒核燃料且能直接產生[color=orange]__FLUID__steam__[/color][fluid=steam]。需要大量的水、熱量和核燃料來運作。它甚至可以使用[color=brown]__ITEM__ei_thorium-232__[/color] [item=ei_thorium-232-fuel]作為燃料！
fusion-power-text=[color=orange]__ENTITY__ei-fusion-reactor__[/color] [item=ei-fusion-reactor]透過核融合反應產生大量能量。它需要循環[color=blue]__FLUID__ei_cold-coolant__[/color] [fluid=ei_cold-coolant]<-->[color=red]__FLUID__ei_hot-coolant__[/color] [fluid=ei_hot-coolant]來進行冷卻。但是此反應爐較為昂貴且需要不停輸入燃料來運作。一開始只有[color=blue]__FLUID__ei_lithium-6__[/color] [fluid=ei_heated-lithium-6]和[color=blue]__FLUID__ei_protium__[/color] [fluid=ei_heated-protium]可以使用。後期透過中子可以獲取[color=blue]__FLUID__ei_deuterium__[/color] [fluid=ei_heated-deuterium]和[color=blue]__FLUID__ei_tritium__[/color] [fluid=ei_heated-tritium]甚至是[color=blue]__FLUID__ei_helium-3__[/color] [fluid=ei_heated-helium-3]。

