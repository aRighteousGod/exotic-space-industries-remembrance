ei_fluid-heater=燃燒下列流體來產生熱:\n
ei_fluid-boiler=燃燒下列流體，把水煮成蒸氣:\n
ei_insulated-pipe=__ENTITY__ei_insulated-pipe__可以用來運輸會損壞一般水管的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei_insulated-underground-pipe=__ENTITY__ei_insulated-underground-pipe__可以用來運輸會損壞一般水管的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei_insulated-tank=__ENTITY__ei_insulated-tank__可以用來儲存會損壞一般儲存罐的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei_cooler=__ENTITY__ei_cooler__空氣冷卻器可以將氣體冷凝。液態空氣需要使用[color=blue]__ENTITY__ei_insulated-pipe__[/color] [item=ei_insulated-pipe]來運輸。
ei_data-pipe=可以用來傳輸[color=blue]__FLUID__ei_computing-power__[/color] [fluid=ei_computing-power]。
ei_stone-quarry=採石場可以在任何位置挖掘[color=orange]__ITEM__stone__[/color] [item=stone]。
ei_electric-stone-quarry=採石場可以在任何位置挖掘[color=orange]__ITEM__stone__[/color] [item=stone]。
ei_deep-drill=__ENTITY__ei_deep-drill__可以開採礦脈。需要[color=orange]1/秒 __FLUID__ei_drill-fluid__[/color] [fluid=ei_drill-fluid]來運作。
ei_advanced-deep-drill=__ENTITY__ei_advanced-deep-drill__可以開採礦脈。需要[color=orange]2/秒 __FLUID__ei_drill-fluid__[/color] [fluid=ei_drill-fluid]來運作。
ei_deep-pumpjack=進階的抽油幫浦。可以抽取[color=blue]__FLUID__ei_cryoflux__[/color][fluid=ei_cryoflux]和[color=green]__FLUID__ei_pythogas__[/color][fluid=ei_pythogas]礦藏。
ei_exotic-assembler=__ENTITY__ei_exotic-assembler__可以用來處理[color=orange]奇異物質[/color]。\n但是因為奇異物質相當不穩定，所以需要靠近一台[color=blue]__ENTITY__ei_matter-stabilizer__[/color]來防止爆炸。
ei_computer-core=消耗電力和__ITEM__ei_electronic-parts__來提供[color=blue]__FLUID__ei_computing-power__[/color] [fluid=ei_computing-power]。__FLUID__ei_computing-power__可以透過連接[color=orange]__ENTITY__ei_data-pipe__[/color] [item=ei_data-pipe]來傳輸。
ei_quantum-computer=高級的電腦。提供多項輸入來獲得複雜的高科技資料。
ei_matter-stabilizer=人造的__ENTITY__ei_matter-stabilizer__。可以用來穩定[color=orange]__ENTITY__ei_exotic-assembler__[/color] [item=ei_exotic-assembler]以防止爆炸。
ei_copper-beacon=液冷__ENTITY__beacon__。需要消耗[color=blue]1/秒 __FLUID__ei_liquid-nitrogen__[/color] [fluid=ei_liquid-nitrogen]的冷卻液。計算超載時被當成[color=orange]1[/color]個__ENTITY__beacon__。
ei_iron-beacon=液冷__ENTITY__beacon__。需要消耗[color=blue]2/秒 __FLUID__ei_liquid-nitrogen__[/color] [fluid=ei_liquid-nitrogen]的冷卻液。計算超載時被當成[color=orange]2[/color]個__ENTITY__beacon__。
ei_induction-matrix-core=感應矩陣結構的核心。每個矩陣只能擁有一個核心。
ei_induction-matrix-basic-coil=基礎的感應矩陣線圈。提供[color=yellow]25 MJ[/color]的電力儲存。
ei_induction-matrix-advanced-coil=進階的感應矩陣線圈。提供[color=yellow]100 MJ[/color]的電力儲存。
ei_induction-matrix-superior-coil=優質的感應矩陣線圈。提供[color=yellow]1000 MJ[/color]的電力儲存。
ei_induction-matrix-basic-converter=基礎的感應矩陣變壓器。增加[color=yellow]2倍[/color]的能量傳輸效率。
ei_induction-matrix-advanced-converter=進階的感應矩陣變壓器。增加[color=yellow]4倍[/color]的能量傳輸效率。
ei_induction-matrix-superior-converter=優質的感應矩陣變壓器。增加[color=yellow]16倍[/color]的能量傳輸效率。[color=red]每個感應矩陣最多存在4個[/color]。
ei_induction-matrix-basic-solenoid=感應矩陣螺線管。可以增加相鄰8格線圈的效率。[color=red]多於一個螺線管作用於單個線圈會造成效率下降[/color]。
ei_fission-facility=研究核分裂相關知識來開發核分裂反應爐。
ei_high-temperature-reactor=需要大量的[color=red]熱[/color]來運作並產生大量蒸汽。甚至可以使用[color=orange]__ITEM__ei_thorium-232__[/color] [item=ei_thorium-232]作為燃料！。
ei_castor=在這裡儲存無處可去的[color=yellow]__ITEM__ei_nuclear-waste__[/color] [item=ei_nuclear-waste]。
ei_neutron-collector=從中子源(核反應爐等)吸收中子，並用來將[color=blue]__ITEM__ei_neutron-container__[/color] [item=ei_neutron-container]充能。越靠近中子源充能速度越快。
ei_neutron-activator=讓元素和來自[color=blue]__ITEM__ei_charged-neutron-container__[/color] [item=ei_charged-neutron-container]的中子融合來生成核融合燃料。
ei-fusion-reactor=核融合反應爐。使用核融合燃料來加熱[color=orange]液態鉛冷卻液[/color] [fluid=ei_cold-coolant][fluid=ei_hot-coolant]。反應爐可以在多種模式下運作。透過 InformaTron wiki 來了解更多細節。
ei_gauss-module=[font=default-bold][color=#FFAF00]神之組件[/color][/font]\n這個組件可以被用在[font=default-bold]任何接受產能組件的機器[/font]且不受配方限制。
ei_small-inserter=帶有選擇器的2x2機械臂。可以移動大量物品。
ei_big-inserter=帶有選擇器的2x2機械臂。可以高速移動大量物品。
ei_small-inserter-normal=2x2的機械臂。可以移動大量物品。
ei_big-inserter-normal=2x2的機械臂。可以高速移動大量物品。
ei_module-base=組件的核心，可以用來製造各種組件。
ei_photon-cavity=一個用來儲存光子的空腔。
ei_z-boson-cavity=一個用來儲存Z-玻色子的空腔。
ei_gluon-cavity=一個用來儲存膠子的空腔。
ei_destill-tower=透過[color=red]熱[/color]來運作的分餾塔。可以將[color=orange]蒸餘油[/color] [fluid=ei_residual-oil]分離。
ei_advanced-destill-tower=透過[color=yellow]電力[/color]來運作的分餾塔。可以將[color=orange]蒸餘油[/color] [fluid=ei_residual-oil]分離。
ei_mining-satellite=一個可以挖掘[color=orange]行星岩石[/color] [item=ei_moon-rock][item=ei_sulf-rock][item=ei_mars-rock][item=ei_uran-rock][item=ei_exotic-rock]的__ITEM__satellite__，每次可以挖掘[color=red]10000[/color]對應位置的岩石。
ei_watch-satellite=一個可以觀測星球來獲得[color=orange]觀測資料[/color] [item=ei_sun-data][item=ei_gas-giant-data]的__ITEM__satellite__。\n每次發射固定獲得[color=red]10000[/color]觀測資料。\n但是部分目標由於物理環境每次僅能獲得[color=red]500[/color]觀測資料。
ei_exploration-satellite=一個用來探索未知的__ITEM__satellite__，將它發射至系外深空或許可以發現一些有趣的事。
ei_rocket-silo=將火箭和酬載發射至不同目的地。透過 InformaTron wiki 和__ENTITY__rocket-silo__的介面來了解更多細節。
ei_thorium-232-fuel=基於__ITEM__ei_thorium-232__ 的核燃料。只能用於[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]。使用時可以在 2 分鐘生成 [color=orange]300k __FLUID__steam__[/color] [fluid=steam]。
ei_plutonium-239-fuel=基於__ITEM__ei_plutonium-239__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]700k __FLUID__steam__[/color] [fluid=steam]。
ei_uranium-235-fuel=基於__ITEM__uranium-235__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]600k __FLUID__steam__[/color] [fluid=steam]。
ei_uranium-233-fuel=基於__ITEM__ei_uranium-233__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]400k __FLUID__steam__[/color] [fluid=steam]。
ei_burner-inserter=透過燃燒燃料來運作的機械臂。可以從機器中偷取[color=orange]燃料[/color]。
ei_oil-refinery=透過[color=red]熱[/color]來運作的煉油廠。
ei_heat-chemical-plant=透過[color=red]熱[/color]來運作的化工廠。
ei_scanner=掃描異星神器。框選異星生命或神器可以開始掃描並獲得[color=#d43e8e]知識 KU[/color]。\n[color=red][注意][/color]掃描器會摧毀被掃描的物件。

