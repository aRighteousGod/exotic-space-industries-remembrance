title_railgun_cooling=軌道炮冷卻
railgun-cooling=軌道炮冷卻
railgun-cooling-text=軌道炮整體是在砲體上降溫，而不是把彈藥改造成另一種冷卻彈。冷氟酮會在砲座處被消耗，熱氟酮必須回收；當冷卻迴路跟不上時，武器會自行阻塞。\n\n這是刻意如此。砲體會發熱，砲身會保留一段短暫餘暉，而支撐持續開火的正是冷卻系統。
railgun-cooling-2=冷卻迴路與備用配方
railgun-cooling-text-2=正常運作會在砲座消耗冷氟酮。當迴路供給不足時，軌道炮會累積熱負債，關閉自己並進入回復，而不是假裝這一發是免費的。\n\n我們也提供一個以冰為基礎的備用配方，用來在液氮不是唯一答案時製造冷氟酮；多餘熱量會以蒸氣形式排出。
railgun-cooling-3=地表差異
railgun-cooling-text-3=不同地表的散熱速度不同。太空平台散熱最慢，大氣世界散熱更快。Aquilo 的自然回冷最快，Vulcanus 會維持高溫更久，而稀薄或低污染地表介於兩者之間。同樣的軌道炮，固定在不同地方就會表現得很不一樣。
railgun-cooling-4=回復與狀態
railgun-cooling-text-4=正常的軌道炮不會長時間停留在固定佇列中。只有過熱或被阻塞的砲才會進入回復流程，並且在熱負債清除、熱輸出路徑重新可以接收廢熱氟酮之前保持關閉。\n\n因此狀態提示很有意義：綠色表示就緒，黃色表示回復中或輸出受阻，紅色表示冷卻硬體缺失或嚴重過熱。
