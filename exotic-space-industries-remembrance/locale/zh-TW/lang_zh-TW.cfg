# PAGES
welcome=歡迎來到 Exotic Industries！
welcome-text=這是wiki頁面。在這裡，您可以找到有關模組、其功能和機制的資訊。新的發現可能會觸發新條目在這個 wiki 中出現。如果您有問題，請隨時在模組的 Discord 伺服器上提問。您可以在模組頁面上找到伺服器的鏈接。
welcome-text-2=在這個模組中，有很多新的機器、配方和獨特的機制等待著您。有些簡單，有些更具挑戰性。
game-related=遊戲相關資訊
game-related-text=本章節包含有關模組遊戲機制的資訊。
overall=總覽
overall-text=Exotic Industries 是一個大型模組，修改了原本遊戲的幾乎所有東西。因此和許多其他大型模組並不相容。您可以在官方模組包的推薦模組裡找到相容的模組。建議與您喜愛的 QoL 模組一起使用來獲得更好的遊戲體驗。在模組設定裡可以微調一些遊戲機制。
biters=蟲族
biters-text=蟲族在 Exotic Industries 中影響不大。遊戲初期它們可能具有一定的威脅性。此模組並未增強蟲族，因此隨著科技研究應付它們將會變得更加簡單。而遊戲後期的強大武力可以輕鬆的摧毀它們。官方模組包裡有推薦的蟲族模組。
ages-and-tech=時代與科技
ages-and-tech-text=Exotic Industries 將遊戲劃分為不同時代，每個時代具有獨特的特色和挑戰。
ages-and-tech-2=黑暗、蒸汽、電力、電腦、量子和奇異時代
ages-and-tech-text-2=模組將遊戲劃分為這六個時代。黑暗時代非常短暫，以直接燃燒燃料的熱能工廠為主。蒸氣時代透過燃燒流體和燃料來產生蒸氣並推動機器，這個時代發現了原油的用途：作為燃料或是用來對付蟲族。隨著蒸氣發電機的運作，遊戲邁入電力時代，利用燃料甚至是核分裂來產生電力，並使用無人機進行工廠的建造。電腦時代透過__ENTITY__beacon__和組件來提高機器的效率，並提供更多的物流箱。量子時代開發了高科技的機器以及電磁場技術的革新，核融合成為發電的選項之一。而最後的奇異時代讓您贏得遊戲。
nauvis-pressure-grace=Nauvis演化壓力恩典
nauvis-pressure-grace-text=此啟動切換為 Nauvis 提供了臨時的演化煞車。每 18,000 個刻度或 5 分鐘，腳本會檢查 Nauvis 上敵方力量的演變，並僅在當前值高於特定年齡的寬限目標時將其降低至多 [font=default-bold]0.005[/font]。 \n\n 它不會清除污染、刪除巢穴或取消攻擊。它只會將多餘的進化削減到遊戲早期的上限。
nauvis-pressure-grace-2=年齡上限
nauvis-pressure-grace-text-2=在[font=default-bold]蒸氣時代[/font]之前，目標上限為[font=default-bold]0.25[/font]。完成蒸氣時代研究之後、但在[font=default-bold]電力時代[/font]之前，目標會上升到[font=default-bold]0.5[/font]。一旦研究完成電力時代，這個緩衝就會自動關閉。\n\n如果停用這個設定，Nauvis 將保留它累積的全部壓力。
rocket-launch-pollution=火箭發射污染
rocket-launch-pollution-text=火箭發射可以將污染物直接傾倒到發射表面。系統對此表面上的發射力的演化因子進行採樣，透過選定的啟動曲線對其進行饋送，並根據配置的上限縮放結果。 \n\n預設情況下，演化 [font=default-bold]1.0[/font] 時的上限為 [font=default-bold]10,000 污染 [/font]。大多數曲線模式也保留 [font=default-bold]10% 下限 [/font]，因此仍感覺低進化發射。
rocket-launch-pollution-2=曲線模式和煙霧
rocket-launch-pollution-text-2=啟動 [font=default-bold] 曲線形式 [/font] 可以設定為線性、二次、指數、閾值或混合。線性直接追蹤進化。二次和指數將更多的懲罰推到以後的發布中。閾值跨越固定的進化帶。混合使用線性底座並添加額外的遊戲後期尖峰。 \n\n發射序列也在筒倉上繪製了揮之不去的煙霧螺旋，因此污染事件是可見的而不是無聲的。

