crystal-accumulator-resonance=Crystal accumulator resonance
crystal-accumulator-resonance-text=Crystal accumulators are not ordinary batteries. They are alien resonance shells seeded into generated relic clusters, and the useful way to read them is through [font=default-bold]load[/font] and [font=default-bold]coherence[/font], not a simple on/off toggle.\n\nIn the current live shell ladder, the unstable profile can sit at a [font=default-bold]4 MW low shell[/font], a [font=default-bold]7.5 MW base shell[/font], or a [font=default-bold]10 MW surged shell[/font]. Gaia resolves the same geometry into a [font=default-bold]15 MW Gaia shell[/font]. Offline husks sit outside that ladder entirely until repaired.
crystal-accumulator-resonance-2=Nauvis profile
crystal-accumulator-resonance-text-2=Nauvis is the explicit grounded profile for the unstable shell. When you discover or place [item=ei-crystal-accumulator] there, read it as the baseline resonance case: productive, alien, and never quite settled.\n\nThe shell may drift between low, base, and surged rungs, but it remains the same unstable class. Nauvis is not the cure. It is the reference wound.
crystal-accumulator-resonance-3=Other surfaces and orbit
crystal-accumulator-resonance-text-3=Outside Nauvis, treat non-Gaia planets and orbital platforms as foreign-profile space. The unstable shell can still operate there, but it does not gain stability simply by leaving its point of discovery.\n\nGaia is the exception. There the same chassis resolves into [item=ei-crystal-accumulator-gaia]the stable crystal accumulator, doubling base output from [font=default-bold]7.5 MW to 15 MW[/font] and lifting the whole shell ladder with it.
crystal-accumulator-resonance-4=Quality is not coherence
crystal-accumulator-resonance-text-4=Do not confuse [font=default-bold]quality[/font] with [font=default-bold]resonance profile[/font]. Quality is the usual item layer; low shell, base shell, surged shell, Gaia shell, and offline husk are shell states this page is documenting.\n\nIf a crystal item carries quality, that does not replace the load/coherence read. The page legend is about how the lattice is singing, not how finely the item rolled.
crystal-accumulator-resonance-5=Mining and repair
crystal-accumulator-resonance-text-5=Crystal accumulators are relics first and equipment second. Mining an unstable shell should be read as a violent break in coherence: the safe expectation is a broken body, not a clean relocation. The off-state shells [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] persist until a [item=ei-crystal-accumulator-repair]repair kit is dragged across them.\n\nAlt-selecting with the repair tool inspects crystal accumulators and husks without spending the kit. Dragging it normally performs the repair. If that restoration happens on Gaia, the surface resolves it immediately into the stable variant.
crystal-accumulator-resonance-6=UI legend
crystal-accumulator-resonance-text-6=[font=default-bold]Low shell[/font]: coherence is damped and output sits below the base rung.\n[font=default-bold]Base shell[/font]: the unstable chassis is holding its default 7.5 MW band.\n[font=default-bold]Surged shell[/font]: output is above base and the lattice is under strain.\n[font=default-bold]Gaia shell[/font]: Gaia has resolved the same chassis into the stable 15 MW rung.\n[font=default-bold]Offline husk[/font]: inert artifact body awaiting repair.\n\nCrowding reads the nearby shell chorus as [font=default-bold]Clear -> Crowded -> Strained -> Chaotic[/font]. Read the ladder in that order and the crystal stops looking random.
crystal-accumulator-resonance-text-7=使用 [item=ei-crystal-accumulator-repair] 進行 Alt 選取，可在不消耗修復包的情況下檢查水晶蓄能器與殘殼。只有當你真的要修復時，才正常拖曳工具。\n\n遙測行會顯示 [font=default-bold]地表輸出 + 應變[/font] 或 [font=default-bold]應變回退[/font]。同一地表上、同一外殼與同一品質的晶體會共享這部分平均化的地表輸出項；真正把耗竭的外殼和旁邊的同類區分開的，仍然是局部應變。

