[item-description]
atomic-bomb=鈽原子火箭。外面是相容外殼，裡面是完整破口教義。破口先開口，後面的輻射沉降把句子說完。
ei-atomic-bomb-u235=U-235 原子火箭。核心更緊，放射性尾跡也更乾淨，但依舊沒有憐憫。
ei-atomic-bomb-plutonium=鈽原子火箭。更寬、更髒的輻射沉降會跟在破口後面。
dw-deer-ammo-atomic-u235=U-235 原子砲兵火箭。為砲架準備的更緊原子核心，沉降也更貼近彈坑。
dw-deer-ammo-atomic-plutonium=鈽原子砲兵火箭。給願意近距離聽見它的砲位準備的全面破口語言，外加更寬的輻射沉降。
ei-nuclear-locomotive=X1「歌利亞」原子機車。一台滾動的緊湊反應爐，禮儀像戰爭罪。要是車體裂開，綠色臨界閃光只是通知，剩下的話由沉降說完。
ei-exotic-magazine-body=教義之前的殼體。鋼材、陶瓷，以及足以承載昂貴暴力的紀律。
ei-exotic-magazine-driver=為異裝系列提供點火、脈衝時序與釋放控制。它教會彈匣如何正確地赴死。
ei-exotic-magazine-core=異裝系列的共同心臟：殼體、驅動與爆炸紀律被鎖進同一藥室。
ei-magazine-payload-compound=結晶能量與炸藥調成的混合回答。一發子彈，數重裁決。
ei-magazine-payload-corrosive=被封成裝藥的硝酸傷口。子彈停下了，爭論還在擴散。
ei-magazine-payload-cryo=被紀律束縛的低溫粉末。它最大的傷害，是奪走機動與自信。
ei-magazine-payload-oxyfluoride=一包白熱的自燃化學物。太亮，太不穩定，也正因此被需要。
ei-magazine-payload-morphium=被說服成為彈道裝藥的濃縮通元。它以污染而不是毒藥的方式進入目標。
ei-magazine-payload-hexafluoride=一間氟化藥室，先穿孔，再與毀滅談判。
ei-magazine-payload-arc=折疊成裝藥的過充。短促、兇狠、絕不會認錯。
ei-magazine-payload-neutron=被壓縮成教義的已充能中子容器。它會留下某種看不見的東西來收尾。
ei-compound-ammo=異裝系列裡的第一樁異端。破裂、放電與失穩，被塞進同一個昂貴彈匣。
ei-corrosive-ammo=裝滿酸液的異裝彈匣。第一下只是引子，真正的判決由腐蝕來下。
ei-cryo-ammo=寒控彈匣。當目標已無法繼續逼近時，活著也就沒那麼重要了。
ei-oxyfluoride-ammo=白焰彈匣，把每一次命中都變成化學許可。
ei-morphium-ammo=緩慢污染彈。它傷害肉體，再讓恐懼把餘下的算術做完。
ei-hexafluoride-ammo=氟化穿透彈。入體時乾淨，之後就難以解釋了。
ei-arc-ammo=過充彈匣。它不只是打中，而是把目標鎖進痙攣裡。
ei-neutron-ammo=這一系列裡最昂貴的病灶。衝擊過去了，光環還在。
ei-orbital-combinator=以三個唯讀模式鏡像同一表面上的平台物流：請求、在途與需求。\n正交相鄰的掃描器形成一個共享銀行，把大型平台輸出分攤到多台掃描器上，並在銀行滿載時發出 [virtual-signal=ei-orbital-overflow]。\n配線、刷新時效和使用方法請見 Informatron 裡的「新物流」頁面。
ei-platform-transponder=為平台分配一個勢力本地的穩定數字 ID。軌道物流集群按 ID 解析目標，所以平台改名不會打斷調度。\n直接打開轉發器即可設定或清除手動平台 ID 覆寫。
ei-orbital-selector=把軌道物流集群聚焦到單一平台，並重新發布該平台目前的需求清單。支援手動模式、電路讀取平台 ID，以及按策略自動挑選候選目標。\n直接打開選擇器即可設定模式與目標。新的選擇器在完成設定前會一直維持閒置。
ei-orbital-coordinator=單一表面的軌道物流指揮核心。它維持每個勢力與表面只有一個活躍協調器，負責仲裁任務租約，並防止多條發射線同時撲向同一平台。\n直接打開協調器即可查看它是活躍還是待命，並要求刷新集群。
ei-orbital-dispatch-uplink=把一座火箭發射井接入軌道物流集群。它發布目前任務的混合貨單，一次只持有一個租約，並為超大請求提供 Sticky、Single Shot 與 Threshold 三種模式。\n在擁有有效發射井綁定、活躍協調器，以及帶正需求的選擇器任務之前，它都會維持阻塞狀態。\n直接打開上行站即可確認、更換或清除它的發射井綁定。

ei-carbide-precipitation-core=一種由碳化鎢衍生出的種核，用來穩定金析出。它本來就是犧牲品：蒸汽喚醒噴口，核心維持節流，而淨化器留下蒸汽吐出的東西。
ei-calcite-bed=一種犧牲性的方解石填料床，用在高溫礦物流需要新鮮石質接觸面的地方。它擴大反應表面，穩住化學過程，本來就該定期更換。
ei-auric-slag=從含金蒸汽中析出的含金熔渣。裡面仍困著熱量、礦物顆粒與微量金屬；用酸與水洗滌，才能把埋在裡面的黃金逼出來。
ei-precipitation-core=一種由碳化鎢衍生出的種核，用來穩定含金冷凝。它本來就是犧牲品：蒸汽喚醒噴口，核心維持節流，而熔爐留下蒸汽吐出的東西。
ei-excavator=消耗[color=blue]__FLUID__water__[/color][fluid=water]來生產[color=orange]15/秒的__ITEM__stone__[/color][item=stone]和[color=brown]__FLUID__ei_dirty-water__[/color][fluid=ei_dirty-water]。
ei-metalworks-1=更快速的生產[color=orange]金屬錠[/color]相關的配方。
ei-metalworks-2=更快速的生產[color=orange]金屬錠[/color]相關的配方。
ei-metalworks-3=更快速的生產[color=orange]金屬錠[/color]相關的配方。
ei-metalworks-4=更快速的生產[color=orange]金屬錠[/color]相關的配方。


ei-fluid-heater=燃燒下列流體來產生熱:\n
ei-fluid-boiler=燃燒下列流體，把水煮成蒸氣:\n
ei-insulated-pipe=__ENTITY__ei_insulated-pipe__可以用來運輸會損壞一般水管的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei-insulated-underground-pipe=__ENTITY__ei_insulated-underground-pipe__可以用來運輸會損壞一般水管的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei-insulated-tank=__ENTITY__ei_insulated-tank__可以用來儲存會損壞一般儲存罐的[color=red]高溫電漿[fluid=ei_heated-protium][fluid=ei_heated-deuterium][fluid=ei_heated-tritium][fluid=ei_heated-lithium-6][fluid=ei_heated-helium-3][/color]或[color=blue]液態氣體 [fluid=ei_liquid-nitrogen][fluid=ei_liquid-oxygen][/color]。
ei-cooler=__ENTITY__ei_cooler__空氣冷卻器可以將氣體冷凝。液態空氣需要使用[color=blue]__ENTITY__ei_insulated-pipe__[/color] [item=ei_insulated-pipe]來運輸。
ei-data-pipe=可以用來傳輸[color=blue]__FLUID__ei_computing-power__[/color] [fluid=ei_computing-power]。
ei-stone-quarry=採石場可以在任何位置挖掘[color=orange]__ITEM__stone__[/color] [item=stone]。
ei-electric-stone-quarry=採石場可以在任何位置挖掘[color=orange]__ITEM__stone__[/color] [item=stone]。
ei-deep-drill=__ENTITY__ei_deep-drill__可以開採礦脈。需要[color=orange]1/秒 __FLUID__ei_drill-fluid__[/color] [fluid=ei_drill-fluid]來運作。
ei-advanced-deep-drill=__ENTITY__ei_advanced-deep-drill__可以開採礦脈。需要[color=orange]2/秒 __FLUID__ei_drill-fluid__[/color] [fluid=ei_drill-fluid]來運作。
ei-deep-pumpjack=進階的抽油幫浦。可以抽取[color=blue]__FLUID__ei_cryoflux__[/color][fluid=ei_cryoflux]、[color=green]__FLUID__ei_pythogas__[/color][fluid=ei_pythogas]礦藏和金析噴氣孔。
ei-exotic-assembler=__ENTITY__ei_exotic-assembler__可以用來處理[color=orange]奇異物質[/color]。\n但是因為奇異物質相當不穩定，所以需要靠近一台[color=blue]__ENTITY__ei_matter-stabilizer__[/color]來防止爆炸。
ei-computer-core=消耗電力和__ITEM__ei_electronic-parts__來提供[color=blue]__FLUID__ei_computing-power__[/color] [fluid=ei_computing-power]。__FLUID__ei_computing-power__可以透過連接[color=orange]__ENTITY__ei_data-pipe__[/color] [item=ei_data-pipe]來傳輸。
ei-quantum-computer=高級的電腦。提供多項輸入來獲得複雜的高科技資料。
ei-matter-stabilizer=人造的__ENTITY__ei_matter-stabilizer__。可以用來穩定[color=orange]__ENTITY__ei_exotic-assembler__[/color] [item=ei_exotic-assembler]以防止爆炸。
ei-copper-beacon=液冷__ENTITY__beacon__。需要消耗[color=blue]1/秒 __FLUID__ei_liquid-nitrogen__[/color] [fluid=ei_liquid-nitrogen]的冷卻液。計算超載時被當成[color=orange]1[/color]個__ENTITY__beacon__。
ei-iron-beacon=液冷__ENTITY__beacon__。需要消耗[color=blue]2/秒 __FLUID__ei_liquid-nitrogen__[/color] [fluid=ei_liquid-nitrogen]的冷卻液。計算超載時被當成[color=orange]2[/color]個__ENTITY__beacon__。
ei-induction-matrix-core=感應矩陣結構的核心。每個矩陣只能擁有一個核心。
ei-induction-matrix-basic-coil=基礎的感應矩陣線圈。提供[color=yellow]25 MJ[/color]的電力儲存。
ei-induction-matrix-advanced-coil=進階的感應矩陣線圈。提供[color=yellow]100 MJ[/color]的電力儲存。
ei-induction-matrix-superior-coil=優質的感應矩陣線圈。提供[color=yellow]1000 MJ[/color]的電力儲存。
ei-induction-matrix-basic-converter=基礎的感應矩陣變壓器。增加[color=yellow]2倍[/color]的能量傳輸效率。
ei-induction-matrix-advanced-converter=進階的感應矩陣變壓器。增加[color=yellow]4倍[/color]的能量傳輸效率。
ei-induction-matrix-superior-converter=優質的感應矩陣變壓器。增加[color=yellow]16倍[/color]的能量傳輸效率。[color=red]每個感應矩陣最多存在4個[/color]。
ei-induction-matrix-basic-solenoid=感應矩陣螺線管。可以增加相鄰8格線圈的效率。[color=red]多於一個螺線管作用於單個線圈會造成效率下降[/color]。
ei-fission-facility=研究核分裂相關知識來開發核分裂反應爐。
ei-high-temperature-reactor=需要大量的[color=red]熱[/color]來運作並產生大量蒸汽。甚至可以使用[color=orange]__ITEM__ei_thorium-232__[/color] [item=ei_thorium-232]作為燃料！。
ei-castor=在這裡儲存無處可去的[color=yellow]__ITEM__ei_nuclear-waste__[/color] [item=ei_nuclear-waste]。
ei-neutron-collector=從中子源(核反應爐等)吸收中子，並用來將[color=blue]__ITEM__ei_neutron-container__[/color] [item=ei_neutron-container]充能。越靠近中子源充能速度越快。
ei-neutron-activator=讓元素和來自[color=blue]__ITEM__ei_charged-neutron-container__[/color] [item=ei_charged-neutron-container]的中子融合來生成核融合燃料。
ei-fusion-reactor=核融合反應爐。使用核融合燃料來加熱[color=orange]液態鉛冷卻液[/color] [fluid=ei_cold-coolant][fluid=ei_hot-coolant]。反應爐可以在多種模式下運作。透過 InformaTron wiki 來了解更多細節。
ei-gauss-module=[font=default-bold][color=#FFAF00]神之組件[/color][/font]\n這個組件可以被用在[font=default-bold]任何接受產能組件的機器[/font]且不受配方限制。
ei-small-inserter=帶有選擇器的2x2機械臂。可以移動大量物品。
ei-big-inserter=帶有選擇器的2x2機械臂。可以高速移動大量物品。
ei-small-inserter-normal=2x2的機械臂。可以移動大量物品。
ei-big-inserter-normal=2x2的機械臂。可以高速移動大量物品。
ei-module-base=組件的核心，可以用來製造各種組件。
ei-photon-cavity=一個用來儲存光子的空腔。
ei-z-boson-cavity=一個用來儲存Z-玻色子的空腔。
ei-gluon-cavity=一個用來儲存膠子的空腔。
ei-destill-tower=透過[color=red]熱[/color]來運作的分餾塔。可以將[color=orange]蒸餘油[/color] [fluid=ei_residual-oil]分離。
ei-advanced-destill-tower=透過[color=yellow]電力[/color]來運作的分餾塔。可以將[color=orange]蒸餘油[/color] [fluid=ei_residual-oil]分離。
ei-mining-satellite=一個可以挖掘[color=orange]行星岩石[/color] [item=ei_moon-rock][item=ei_sulf-rock][item=ei_mars-rock][item=ei_uran-rock][item=ei_exotic-rock]的__ITEM__satellite__，每次可以挖掘[color=red]10000[/color]對應位置的岩石。
ei-watch-satellite=一個可以觀測星球來獲得[color=orange]觀測資料[/color] [item=ei_sun-data][item=ei_gas-giant-data]的__ITEM__satellite__。\n每次發射固定獲得[color=red]10000[/color]觀測資料。\n但是部分目標由於物理環境每次僅能獲得[color=red]500[/color]觀測資料。
ei-exploration-satellite=一個用來探索未知的__ITEM__satellite__，將它發射至系外深空或許可以發現一些有趣的事。
ei-rocket-silo=將火箭和酬載發射至不同目的地。透過 InformaTron wiki 和__ENTITY__rocket-silo__的介面來了解更多細節。
ei-thorium-232-fuel=基於__ITEM__ei_thorium-232__ 的核燃料。只能用於[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]。使用時可以在 2 分鐘生成 [color=orange]300k __FLUID__steam__[/color] [fluid=steam]。
ei-plutonium-239-fuel=基於__ITEM__ei_plutonium-239__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]700k __FLUID__steam__[/color] [fluid=steam]。
ei-uranium-235-fuel=基於__ITEM__uranium-235__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]600k __FLUID__steam__[/color] [fluid=steam]。
ei-uranium-233-fuel=基於__ITEM__ei_uranium-233__ 的核燃料。在[color=green]__ENTITY__ei_high-temperature-reactor__[/color] [item=ei_high-temperature-reactor]使用時可以在 2 分鐘生成 [color=orange]400k __FLUID__steam__[/color] [fluid=steam]。
ei-burner-inserter=透過燃燒燃料來運作的機械臂。可以從機器中偷取[color=orange]燃料[/color]。
ei-oil-refinery=透過[color=red]熱[/color]來運作的煉油廠。
ei-heat-chemical-plant=透過[color=red]熱[/color]來運作的化工廠。
ei-scanner=掃描異星神器。框選異星生命或神器可以開始掃描並獲得[color=#d43e8e]知識 KU[/color]。\n[color=red][注意][/color]掃描器會摧毀被掃描的物件。

ei-space-data=將[color=blue]__ITEM__satellite__[/color] [item=satellite]發射至[color=green]Nauvis 軌道[/color]來獲取。
ei-moon-fish=將[color=blue]__ITEM__raw-fish__[/color] [item=raw-fish]發射至[color=green]月球[/color]來獲取。
ei-moon-rock=將[color=blue]採礦__ITEM__satellite__[/color] [item=ei_mining-satellite]發射至[color=green]月球[/color]來獲取。
ei-mars-rock=將[color=blue]採礦__ITEM__satellite__[/color] [item=ei_mining-satellite]發射至[color=green]火星[/color]來獲取。
ei-sulf-rock=將[color=blue]採礦__ITEM__satellite__[/color] [item=ei_mining-satellite]發射至[color=green]硫星[/color]來獲取。
ei-uran-rock=將[color=blue]採礦__ITEM__satellite__[/color] [item=ei_mining-satellite]發射至[color=green]鈾星[/color]來獲取。
ei-exotic-rock=將[color=blue]採礦__ITEM__satellite__[/color] [item=ei_mining-satellite]發射至[color=green]小行星[/color]來獲取。
