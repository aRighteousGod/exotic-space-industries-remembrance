[mod-setting-description]
ei-tech-scaling-maxCost=每項科技的 [color=red]單個[/color] 科學包成本上限。\n[color=pink]Sunday stroll[/color] — 207\n[color=white]Walk in the park[/color] — 415\n[color=#D2B48C]Almost free[/color] — 831\n[color=gray]Very Cheap[/color] — 1662\n[color=white]Default[/color] — 2500\n[color=cyan]More Cheap[/color] — 3325\n[color=blue]Cheap[/color] — 6750\n[color=yellow]Fairly priced[/color] — 12500\n[color=orange]Less Expensive[/color] — 25000\n[color=red]Expensive[/color] — 50000\n[color=purple]Very Expensive[/color] — 100000\nFactorio 仍然會把內部研究價格倍率封頂在 [color=red]x1000[/color]，所以 ESIR 會在需要時自動抬高隱藏的有效基礎起始價格，讓你選的更高上限仍然可達。
ei-tech-scaling-startPrice=曲線裡的變數 C。若你選的上限會撞上 Factorio 的 x1000 限制，ESIR 會在背景自動抬高隱藏的有效基礎起始價格。\n存檔開始後再改，仍可能出現意料之外的結果。
ei-tech-scaling-additionalMultiplier=曲線和上限結算完成後的額外最終倍率。\n這是在進行中的存檔裡最安全的調整項。
ei-tech-scaling-curveForm=曲線形式決定研究費用如何上升。linear 走勢平穩，quadratic 前期較輕、後期較重，exponential 前期很軟、後期陡升，而 age-ramp 會按時代分段，把壓力更多推向後期時代。\n中途變更這個選項，仍可能帶來不理想的結果。
ei-gate-difficulty=調整閘門的調諧階段與推進節奏。Recovered 會保留目前的閘門階段。Attuned 會把它推到異星時代後期。Resonant 會把它推到量子時代後期。Paradox 會把它推到奇異時代。建議用於新存檔，或在研究閘門之前變更。
ei-nauvis-pressure-grace=在電氣時代之前，暫時減緩 Nauvis 上敵人過快的進化。每 5 分鐘檢查一次，只會把進化值慢慢拉回前期時代的目標；不會降低污染、不會清除蟲巢，也不會讓失敗變得不可能。Impossible 也會在此開關開啟時直接關閉這份緩衝。
ei-enemy-difficulty=選擇 Exotic Industries: Remembrance 使用的敵人屬性階梯。Gentle 到 Nightmare 只調整敵人的戰鬥與生成數值。Original 保持 1.0。Merciful 和 Impossible 也會施加少數首領特例。Impossible 也會關閉 Nauvis 緩衝，並在已有敵對生態的敵對表面上把火箭發射污染變成附近敵人的集結反擊。
ei-gate-notifications=顯示與閘門相關的聊天通知，例如目的地更新與低電力警告。
ei-black-hole-notifications=顯示與黑洞相關的聊天通知，例如收容失效警告。
ei-matter-machine-notifications=顯示與物質機器相關的聊天通知，例如維護、不穩定或供電不足警告。
ei-insulated-pipe-notifications=顯示與隔熱管道相關的聊天通知，例如放氣或爆裂警告。
ei-em_updater_que=Draw a visual indicator between or over EM trains & chargers when energy transfer occurs
ei-max_updates_per_tick=Amount of updates per entity type executed on tick
ei-ticks_per_full_update=Adjust the # of ticks over which all EI entities are updated
ei-loader-prototype-complexity=Enable/disable complex Loader recipes, if enabled express loader gains filtering and neo loader gains stacking
ei-rocket-lift-capacity-buff=Multiplies rocket & landing pad capacity by x. CIRCUIT LAUNCHABLE ROCKETS RECOMMENDED
ei-beacon-overload=Intended behavior. Sets a ceiling on the number of beacons that can affect any individual building ala Space Exploration
ei-ash=Burning chemical fuels produces ash which can be reprocessed but must be dealt with
ei-slag=Smelters other than the plasma heater produce slag which can be reprocessed but must be dealt with

