[gate-estimator]
route-snapshot=快照固定路線
power-draw=消耗功率
title=傳送門估算器
close=關閉
help-launch=開啟獨立的假設計算視窗，不改變傳送門設定或貨物。
snapshot=讀取傳送門狀態
help-snapshot=複製電量、應力、冷卻、品質和路線，保留選定物品及供給假設。
reset=重設假設
help-reset=以滿電、無應力和冷卻、每秒1件及1 GW供電開始，不重設實際傳送門。
item=物品
help-item=選擇任意可用物品，不消耗物品。貨物品質不影響傳送能耗。
batch=堆疊數量／單次最大投入
help-batch=用於單次傳送報價，也是每模擬刻的最大投入量。傳送門不會等待湊滿此數量；多次投入可合併成堆疊。
stress=應力
help-stress=發送端初始應力，範圍0–100，每秒降低1。增加維持功率和冷卻時間，不增加直接傳送費用。
quality=發送端品質
help-quality=可見發送端的品質將傳送及維持能耗乘以1 / (1 + 0.2 × 品質等級)。貨物和接收端品質不影響該折扣。
from=發送星球
to=接收星球
help-route=選定兩個星球後，距離鎖定為星圖間距。同一星球視為同一地表。清空任一星球可手動設定距離，不產生地表。
local=同一地表
orbital=同一天體，不同地表
distance=星際距離
unknown=未解析的跨地表路線
help-distance=星圖距離，不是格數或太空航線長度。同一地表×0.15；同一天體的不同地表×2.5；未解析跨地表路線×3。
rate=供給速率
help-rate=恆定的供給需求。無法投入的物品在上游等待，實際送達速率可能較低。小數會累計為完整物品。
per-second=件／秒
per-minute=件／分
power=可用功率
help-power=假定恆定供電，並非電網實測值。充電受原生輸入上限及剩餘儲能空間限制。
initial-state=初始運作狀態
help-initial-state=可編輯的快照值。模擬貨物和上游佇列初始為空，實際傳送門不受影響。
energy=儲存電量（GJ）
help-energy=初始電量。傳送門至少需要100 GJ才能運作，還必須足以支付下一整堆物品的費用。
cooldown=冷卻時間（秒）
help-cooldown=初始剩餘冷卻，單位為遊戲秒。冷卻中停止自動投入和傳送，結束後等待下次傳送門處理才開放輸入。
saturation=接收端飽和度
help-saturation=初始值0–100。達到100時停止傳送，但仍可暫存輸入。每秒恢復1.5，假設輸出貨物和殘留物自動清除。
calculation=計算明細
projections=趨勢預測
burden=傳送負荷
help-burden=傳送門質量表中的權重×數量。未收錄物品權重為1，與火箭載荷質量不同。
distance-factor=距離倍率
help-distance-factor=星際倍率=2.5 + 5.5 × (距離 / 星圖最大間距)^0.6，限制在已安裝星圖範圍內。跨度比例=(倍率−0.15)/7.85。
quality-factor=品質倍率
help-quality-factor=僅發送端品質降低能耗。模組新增品質等級使用同一公式。
toll=傳送能耗
help-toll=負荷曲線超線性增長，因此大堆疊的單件費用更高。將負荷能量、距離及品質相乘後，僅對最終結果向下取整一次。
per-item=單件傳送能耗
help-per-item=本次傳送費用除以物品數量，不含維持消耗。單價隨堆疊數量變化，並非固定。
stress-result=增加應力／傳送後應力
help-stress-result=每次最多增加35，總上限100。達到75後，不在冷卻時控制台顯示危險狀態。
cooldown-result=傳送後冷卻
help-cooldown-result=使用傳送後的應力。各刻數項分別取整，再換算為秒。處理週期、電量和接收端恢復可能進一步推遲下次傳送。
saturation-result=增加飽和度／傳送後飽和度
help-saturation-result=物理負荷最多增加20飽和度，總上限100。發送端品質不會減輕此懲罰。
upkeep-result=傳送後／傳送前維持功率
help-upkeep-result=就緒時為30 MW，加每點應力1.5 MW及冷卻中30 MW，再乘品質倍率。未啟用或電量不足時無腳本維持消耗。
hardware=容量：__1__ GJ · 充電上限：__2__ MW · 處理週期：__3__ 秒
help-hardware=原生硬體限制和根據目前傳送門數量、更新預算得出的固定週期。後續數量變化可能改變實際週期。
fallback=該物品不在傳送門質量表中，按權重1計算。
assumptions=一個啟用的發送端、一種物品、一個接收端。輸出和殘留物自動清除，無其他發送端競爭。時間為遊戲時間。
help-assumptions=模擬飽和度、維持消耗、堆疊合併、冷卻和支付能力。不包括腐壞、損傷、電路變化、機械臂運動、電網競爭或平台路線移動。
run=執行預測
help-run=計算目前方案及基準。計算分批執行且可取消；編輯後將既有圖表標記為過期。
minutes=__1__ 分鐘
help-horizon=預測時長，單位為遊戲分鐘。基準使用相同時長。
pin=儲存比較基準
clear-baseline=清除比較基準
help-pin=儲存一份獨立方案及初始狀態。實線為目前方案，虛線為基準；更改後需重新執行。
baseline=比較基準
pinned=已儲存基準
no-baseline=無比較基準
legend=青色：第一序列 · 橙色：第二序列 · 實線：目前 · 虛線：基準
help-chart=電量：GJ，紅線100 GJ。應力：發送端／接收端，紅線75。冷卻：剩餘時間／傳送間隔。吞吐：送達／供給。佇列：上游／門內。功率：傳送／維持。豎線保留區間極值。
throughput=吞吐量
queue=排隊貨物
axis=0–__1__ __2__ · 時間0–__3__ 秒
unit-1=GJ
unit-2=%
unit-3=秒
unit-4=件／秒
unit-5=件
unit-6=MW
sample=__1__–__2__ 秒：__3__
help-sample=移動時間游標，顯示區間末值［最小–最大］。吞吐量與功率為區間平均值。
summary=送達：__1__ · 平均：__2__ 件／秒\n上游：__3__ · 門內：__4__\n傳送：__5__ GJ · 維持：__6__ GJ · 平均功率：__7__ MW\n最低電量：__8__ GJ · 峰值應力：__9__\n等待 — 冷卻：__10__ 秒；電量：__11__ 秒；接收端：__12__ 秒\n產生殘留物：__13__
help-summary=等待原因可能重疊，不可相加。能量統計只包含實際消耗。殘留物計數後清除，排隊物品不會丟棄。
difference=目前−基準：送達物品__1__件；消耗__2__ GJ
help-status=單次報價即時更新。預測顯示上次執行結果，修改後標記為過期。不會改變實際傳送門。
running=計算中…
stale=預測已過期，請重新執行
ready=預測就緒
invalid=請輸入控制項範圍內的有限數值。
missing-prototype=物品、品質或星球不可用，請重新選擇。
too-expensive=該堆疊費用超過傳送門儲能容量。原生傳送不會為適應剩餘電量而拆分堆疊。
