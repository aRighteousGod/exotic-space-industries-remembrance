[string-mod-setting-description]
ei-pyric-radiance-preset-ember=Niewielkie dodatkowe światła i mało świateł ruchomych.
ei-pyric-radiance-preset-veiled=Stonowane oświetlenie zwykłych efektów walki.
ei-pyric-radiance-preset-furnace-vigil=Dominuje ogień na ziemi i w płonących lasach; bez dodatkowych świateł ruchomych.
ei-pyric-radiance-preset-iron-benediction=Podkreśla pozycje strzeleckie silniejszymi błyskami wystrzałów.
ei-pyric-radiance-preset-signal-threads=Podkreśla tory pocisków silniejszym oświetleniem.
ei-pyric-radiance-preset-tempered=Domyślne, umiarkowane oświetlenie; bez dodatkowych świateł trafień i wybuchów jądrowych.
ei-pyric-radiance-preset-night-liturgy=Rozległe, ciepłe oświetlenie walki z dodatkowymi światłami trafień.
ei-pyric-radiance-preset-siege-hymn=Silne błyski wystrzałów i dobrze widoczny nadlatujący ostrzał.
ei-pyric-radiance-preset-cataclysm=Duże światła eksplozji i wyraźne błyski jądrowe.
ei-pyric-radiance-preset-apotheosis=Maksymalny klimat i gęstość świateł.
ei-ballistic-divergence-preset-needle-oath=Proste tory pocisków bez dodatkowego rozrzutu i dodatkowego lotu; dotychczasowa pojemność magazynków i oryginalny stożek rozrzutu strzelby.
ei-ballistic-divergence-preset-measured-volleys=Mały rozrzut pocisków, ochrona terenu i dotychczasowa pojemność magazynków.
ei-ballistic-divergence-preset-breach-doctrine=Większy rozrzut i pojemniejsze magazynki; teren pozostaje podatny na uszkodzenia.
ei-ballistic-divergence-preset-tempered=Umiarkowany rozrzut i dodatkowa odległość lotu; zachowuje dotychczasową ekonomię amunicji karabinowej.
ei-ballistic-divergence-preset-distant-thunder=Większa dodatkowa odległość lotu pocisków z ograniczonym rozrzutem.
ei-ballistic-divergence-preset-fortress-oath=Pojemniejsze magazynki, umiarkowany rozrzut i ochrona terenu.
ei-ballistic-divergence-preset-wildfire-doctrine=Duży rozrzut pocisków i duża żądana zmienność lotu śrutu, pojemniejsze magazynki i ochrona terenu.
ei-ballistic-divergence-preset-crossfire=Większa dodatkowa odległość lotu pocisków i duży rozrzut; teren pozostaje podatny na uszkodzenia.
ei-ballistic-divergence-preset-saturation=Większa dodatkowa odległość lotu, duży rozrzut, podwojona pojemność magazynków amunicji karabinowej i ochrona terenu.
ei-ballistic-divergence-preset-terminal-barrage=Maksymalna dodatkowa odległość lotu, rozrzut i pojemność magazynków; teren pozostaje podatny na uszkodzenia.

