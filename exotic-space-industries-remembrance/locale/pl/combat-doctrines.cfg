[mod-setting-description]
ei-pyric-radiance=Oświetla ogień, strumienie płomieni, zwykłe eksplozje, błyski wystrzałów i fizyczne pociski. Zachowuje kolory paliw i indywidualne efekty specjalne. Zmienia wyłącznie wygląd: rozprzestrzenianie się ognia, mapy, noktowizja, latarki i długość dnia działają jak dotychczas. Wyłączenie zachowuje wybraną doktrynę.
ei-pyric-radiance-preset=Wybierz proporcje światła płomieni, eksplozji, torów pocisków i błysków wystrzałów. Mnożniki zmieniają promień światła; zero zachowuje dotychczasowy wygląd danej grupy efektów. Światła częstych trafień i dodatkowy błysk jądrowy występują tylko w bogatszych doktrynach; dotychczasowy jądrowy efekt kamery pozostaje bez zmian. Efekty egzotyczne i energetyczne zachowują własny wygląd.\n
ei-ballistic-divergence=Pociski lecą, mogą chybić i trafiają obiekty na swojej drodze. Obejmuje istniejące magazynki amunicji karabinowej, śrut ze strzelb i roboty strzelające pociskami. Gracze i budowle twojej frakcji nie przechwytują tych pocisków; inne sprzymierzone frakcje i neutralne przeszkody mogą zostać trafione. Dotychczasowe efekty obszarowe i podpalenia zachowują własne zasady. Przebijająca i uranowa amunicja karabinowa może przelatywać przez zabite cele, z natywnym limitem przebijania równym 25-krotności bazowych obrażeń fizycznych; cele, które przeżyją, zatrzymują pocisk. Amunicja egzotyczna zachowuje pełny zestaw efektów jednego trafienia. Nie dodaje amunicji ani badań. Wyłączenie zachowuje wybraną doktrynę.
ei-ballistic-divergence-preset=Wybierz maksymalną dodatkową odległość lotu, rozrzut pocisków, pojemność magazynków i żądaną zmienność odległości lotu śrutu. Wymagana odległość obejmuje największy zasięg zgodnej, aktywnej broni, z uwzględnieniem modyfikatorów zasięgu amunicji, jakości i zapasu przy wylocie lufy. Dodatkowy lot nie przekracza 16 pól ponad tę podstawę; zasięg namierzania celów pozostaje bez zmian. Mnożnik rozrzutu pocisków skaluje odchylenie kątowe 0.16 oraz żądane odchylenie odległości 0.40; zero usuwa dodatkowy rozrzut. Zmienność odległości lotu pocisków i śrutu jest ograniczona wybranym limitem dodatkowego lotu, a oryginalny stożek rozrzutu strzelby pozostaje bez zmian. Pojemność magazynków amunicji karabinowej jest zaokrąglana w górę; liczba strzałów z amunicji do strzelby i amunicja robotów pozostają bez zmian. Ochrona terenu ustala minimalną odporność fizyczną: drzewa 2 punkty i 65%, skały 4 punkty i 75%. Wpływa to na wszystkie obrażenia fizyczne.\n

