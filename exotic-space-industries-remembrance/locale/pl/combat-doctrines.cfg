title_ballistic_divergence=Ballistic Divergence
pyric-radiance=Pyric Radiance
pyric-radiance-text=Świadectwo pieca rozświetla noc. Płomienie zachowują kolory paliw, a zwykłe strzały i eksplozje rozjaśniają swój ślad. Wybierz doktrynę w ustawieniach startowych, aby podkreślić żar, pozycje strzeleckie, tory pocisków lub rozległe światło oblężenia. Mapy, rozprzestrzenianie się ognia, noktowizja, latarki i cykl dnia zachowują dotychczasowe działanie. Egzotyczne rozbłyski i efekty energetyczne zachowują własną tożsamość wizualną.
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=Strzał niesie przysięgę, nie pewność. Istniejące pociski zyskują fizyczne tory lotu; wrogowie i neutralne przeszkody mogą je przechwycić. Twoja frakcja nie przechwytuje tych pocisków, ale inne sprzymierzone frakcje mogą zostać trafione. Dotychczasowe efekty obszarowe i podpalenia zachowują własne zasady. Przebijająca i uranowa amunicja karabinowa ma natywny limit przebijania równy 25-krotności bazowych obrażeń fizycznych: może przelatywać przez zabite cele, natomiast cele, które przeżyją, zatrzymują pocisk. Amunicja egzotyczna stosuje pełny zestaw efektów tylko raz. Zgodna, aktywna broń korzysta ze wspólnego limitu odległości lotu pocisków, uwzględniającego modyfikatory zasięgu amunicji, jakość i zapas przy wylocie lufy. Doktryny pozwalają na ograniczony dodatkowy lot ponad tę podstawę i ograniczają zmienność odległości lotu pocisków oraz śrutu, nie zmieniając zasięgu namierzania ani oryginalnego stożka rozrzutu strzelby. Chybione pociski znikają dzięki natywnemu limitowi odległości silnika gry. Nowe limity dotyczą nowo wystrzelonych pocisków; pociski już w locie zachowują zapisane odległości i efekty trafienia. Wybrane doktryny zwiększają pojemność magazynków lub chronią teren; receptury, technologie, liczba strzałów z amunicji do strzelby i obrażenia robotów pozostają bez zmian.
