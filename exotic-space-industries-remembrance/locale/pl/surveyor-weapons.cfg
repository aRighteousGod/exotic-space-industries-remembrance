[technology-description]
ei-surveyor-carbine=Dodaje szkło, ciśnienie i żelazną korekcję do starej ramy karabinu maszynowego. Wynik nie jest szybszy. Jest dalszy.
ei-surveyor-rifle=Stabilizuje wzór Surveyora elektrycznym powrotem i lepszą optyką, przenosząc doktrynę dalekiego strzału do ery elektryczności.
ei-surveyor-cannon=Zmienia linię Surveyor w automatyczną broń przeciwmateriałową wzmocnioną danymi symulacyjnymi i płytami z włókna węglowego. Broń strzela dalej, ale każdy pocisk nadal należy do celownika.
ei-adaptive-surveyor=Wykorzystuje dane najwyższej jakości, dziwne pokrycie i adaptacyjną komorę, aby zmienić linię Surveyor w kwantowy system egzekucji dalekiego zasięgu.
military-5=Formalizuje doktrynę symulowanego zabicia: predykcyjne pułapki, ładunki wyłomowe, amunicję infernalną i eskalację robotów ogniowych w jednych zatwierdzonych ramach dowodzenia.
ei-inferno-grenade=Zatwierdza granaty kasetowe przebudowane na ładunki odcinania terenu symulowanym ogniem: skorupa pęka, odłamki spadają, a każde uderzenie zapisuje kolejny krąg ognia.
ei-incinerator=Zatwierdza Incineratory wywiedzione z niszczycieli: pięć szybkich eskort, które podążają, palą i odmawiają ogniowi litości.
