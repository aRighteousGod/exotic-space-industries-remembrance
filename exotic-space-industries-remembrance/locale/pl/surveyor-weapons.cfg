[item-description]
ei-surveyor-carbine=Parowy karabinek z celownikiem ze szkła. Strzela wolno, ale lufa z korekcją ciśnienia sięga dalej niż zwykła broń automatyczna.
ei-surveyor-rifle=Elektrycznie stabilizowana rama Surveyora. Strzał pozostaje rozważny; obraz celu jest czystszy.
ei-surveyor-cannon=Symulacyjna broń przeciwmateriałowa Surveyor. Automatyczna dyscyplina dużego kalibru opiera się na modelowanych trafieniach i węglowej konstrukcji odrzutu.
ei-adaptive-surveyor=Kwantowy modułowy system snajperski. Dane najwyższej jakości przewidują komorę, lufę, wiatr i cel, zanim spust skończy ruch.
ei-inferno-grenade=Granat kasetowy przerobiony tak, by nad celem pękał na płonące, wybuchowe odłamki. Każdy odłamek detonuje przy uderzeniu, po czym zasiewa własny krąg ognia.
ei-incinerator-capsule=Uwalnia pięć szybkich Incineratorów wywiedzionych z niszczycieli. Podążają, palą i odmawiają ogniowi litości.
ei-prediction-snare-mine=Rozstawiana pułapka symulacyjna, która przewiduje ruch wroga, po czym zalewa pobliską biologię fałszywymi sygnałami ruchowymi.
ei-breach-solver-charge=Zwarty ładunek, który zużywa dane symulacyjne na wąski, przesadzony wybuch do rozbijania gniazd, robaków i utwardzonych celów.

