[exotic-industries-informatron]
orbital-native-title=Najpierw logistyka gry
orbital-native-shipping=Zwykłe dostawy rakietowe i transfery między platformami korzystają z żądań i zaopatrywania Factorio. Nie wymagają urządzeń kohorty. Źródła, minimalne dostawy i zaopatrywanie ustawiaj w oknach gry. Automatyka gry obsługuje załadunek, ładunki mieszane, wybór celu i start. Panel boczny pokazuje rzeczywisty cel.\n\nNowe uplinki domyślnie używają automatyki gry, lecz samo postawienie nie zmienia silosu. Przycisk Automatyka gry jawnie włącza jego żądania. Istniejące uplinki zachowują sterowanie kohorty. Zmiana wymaga pustego ładunku, braku dostaw w drodze i braku trwającego startu.
orbital-native-cohort=Dla stałego celu lub załadunku przez fabrykę/obwody umieść [entity=ei-platform-transponder] na każdej obsługiwanej platformie, a selektor, zasilany koordynator i przypisany uplink przy miejscu startu. Nowe selektory używają trybu automatycznego; tryb ręczny wybiera nazwę, a obwodowy czyta [virtual-signal=ei-platform-id]. Na uplinku wybierz sterowanie kohorty.\n\nUtrzymanie celu zachowuje dotychczasowe reguły: do zaspokojenia potrzeb, do jednego startu lub dopóki potrzeby przekraczają próg. ID, naprawy przypisań, dzierżawy i próg są w ustawieniach zaawansowanych. Wklejanie, klonowanie i schematy kopiują ustawienia, nie aktywne dzierżawy. Automatyczne ID są nadawane na nowo; powielone ręczne ID zgłaszają konflikt. Kopia uplinku wiąże się automatycznie tylko z jednym jednoznacznym sąsiednim silosem.
orbital-native-sources=Żądania i Potrzeby można filtrować według Planety, Platform lub Wszystkich źródeł. Wszystkie dopuszcza oba rodzaje dostaw. Rakiety pomijają żądania wyłącznie z platform. W drodze nadal sumuje wszystkie dostawy. Potrzeby liczone są osobno dla każdej platformy przed sumowaniem: max(0, żądania − zapasy − dostawy). Zapasy innej platformy nie pokrywają jej niedoboru.\n\nTransferami platform sterują reguły gry. ESIR nie zmienia sekcji żądań ani reguł rezerw/uzupełniania. Nieżądany typ przedmiotu lub jakość w mieszanym ładunku blokuje start kohorty; nadmiar żądanych typów jest dozwolony. Panel wskazuje ładunek do usunięcia. Zewnętrzne włączenie żądań gry wstrzymuje kohortę.
orbital-native-radar-title=Telemetria radarowa gry
orbital-native-radar-one=[font=default-bold]Jedna platforma, jeden kanał[/font]\n1. Włącz wyjścia zapasów/stanu centrum na czerwonym przewodzie. Dla Ustaw żądania wybierz zielone wejście i rozdziel sieci.\n2. Podłącz czerwone wyjście oraz stały kombinator z zarezerwowanym sygnałem obecności (np. L=1) do zasilanego radaru. Wybierz Wszechświat i kanał sygnałowy przeznaczony tylko dla tej platformy.\n3. W fabryce użyj zasilanego radaru tej samej frakcji na tym samym kanale. Czerwony przewód podłącz do odbiornika, osobno od wejść żądań.\n\nKanał identyfikuje platformę również podczas podróży. Obecność=1 bez sygnałów przedmiotów oznacza pusty magazyn; brak obecności może oznaczać utratę połączenia. Zasilaj oba końce. Obwody i radary nadal zużywają czas obliczeń, choć ta droga nie wymaga odpytywania skanera.
orbital-native-radar-shared=[font=default-bold]Wspólny kanał zapasów[/font]\nPołącz kilka centrów przez radary tej samej frakcji na wspólnym kanale Wszechświat. Sygnały się sumują. Ten sam sygnał obecności z każdego nadajnika pozwala policzyć podłączone nadajniki. Nazwij sieć „Łączne zapasy”. Nie zachowuje ona tożsamości platform i nie oznacza dokładnych Potrzeb ani gwarantowanej dostępnej podaży.\n\nRadary przesyłają sygnały obwodów; centra nie wysyłają skonfigurowanych żądań ani już przydzielonych dostaw. Do Żądań / W drodze / Potrzeb używaj dokładnego skanera. Nigdy nie podawaj sum radiowych kohorcie jako potrzeb pojedynczej platformy. ESIR nie stawia przekaźników, nie wybiera kanałów ani nie zmienia przewodów.
