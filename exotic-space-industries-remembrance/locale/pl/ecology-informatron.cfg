[ei-ecology-guide]
intro-heading=Odczytaj ślady w terenie wokół fabryki
intro=Fabryka pozostawia po sobie nie tylko budynki. Zanieczyszczenie może niszczyć naturalne podłoże i powodować szarzenie pobliskich drzew, a wydobycie zostawiać odsłonięte plamy ziemi. Czystsze warunki dają części tego terenu i lasu szansę na regenerację. Ewolucja terenu dodaje też lokalne zagrożenia i kalendarz sezonowy, z zasadami dostosowanymi do Nauvis, Gai, Vulcanus, Gleby, Fulgory i Aquilo. Nie obejmuje platform kosmicznych, nieznanych planet ani pomocniczych powierzchni bez powiązanej planety.\n\nZacznij od strony Podłoże, aby poznać zmiany gleby, regenerację, wydobycie i działanie krwi. Lasy wyjaśniają zachowanie drzew i ognia, a Brzegi opisują wodę i klify. Pory roku przedstawiają kalendarz i różnice między światami. Ustawienia pomagają dobrać opcje, odczytać raporty i zrozumieć efekty, na które długo czekasz. System czerpie inspirację z TerrainEvolution i TerrainEvolution2, korzystając z własnych limitów przetwarzania i zasad ochrony ESIR.
defaults-heading=Warunki początkowe
defaults=Nowa konfiguracja włącza system ekologii i wszystkie jego funkcje. Obejmuje to regenerację nowych śladów wydobycia, starzenie drzew, rozkład martwego drewna, zmiany brzegów, wietrzenie klifów, efekty krwi, korozję nawierzchni, aktywność sezonową i sezonową długość dnia. Poszczególne funkcje możesz wyłączać zależnie od tego, jaki krajobraz chcesz zachować.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność to Łagodna, a przetwarzanie — Oszczędny. Pożary używają trybu Ograniczone; Rozprzestrzeniające się to osobny wybór. Istniejące zapisy zachowują swoje ustawienia i jawne nadpisania powierzchni. Wartości domyślne nie resetują twoich wyborów.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Włączona funkcja nadal potrzebuje odpowiedniego terenu lub roślinności, właściwych warunków i czasu, by system dotarł do danego miejsca. Jeśli działa losowanie, sprawdzenie może nie przynieść zmiany. Włączenie funkcji pozwala jej działać, ale nie obiecuje efektu wszędzie naraz.
observation-heading=Czyste lub zanieczyszczone — potrzebny jest wiarygodny pomiar
observation=System mierzy zanieczyszczenie w zmieniającym się zestawie obszarów mapy, zwanych chunkami, i wykorzystuje każdy odczyt do decyzji w pobliżu. Potrzebuje kolejnych pomiarów, zanim uzna warunki za trwale czyste lub zanieczyszczone. Obszar, którego ostatnio nie sprawdzono, ma stan nieznany; nie jest automatycznie zdrowy.\n\n[font=default-bold]Ustawienia domyślne:[/font] Warunki zanieczyszczone oznaczają co najmniej 100 zanieczyszczenia przez pięć minut obserwacji. Warunki czyste wymagają najwyżej 25 przez dziesięć minut obserwacji. Ściśle między 25 a 100 oba okresy obserwacji zaczynają się od nowa. Przerwa dłuższa niż 20 sekund symulacji również przerywa potwierdzoną ciągłość warunków.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Brak pomiaru ani inny rodzaj zanieczyszczenia nie zastępują dowodu na czyste powietrze. Większe odkryte mapy wymagają więcej czasu na sprawdzenie. Okres obserwacji jest warunkiem efektu, a nie odliczaniem gwarantującym zmianę każdego pola po jego zakończeniu.
protection-heading=Zostaw miejsce dla fabryki i szczególnych miejsc
protection=Zwykłe zmiany ekologiczne pozostawiają w spokoju nawierzchnie, zasypiska, fundamenty i przykryte podłoże. Chronione są także maszyny i pozostała infrastruktura, duchy budynków, niewyczerpane złoża, rośliny uprawne i ich gleby, obszary zajęte przez Auric, specjalnie umieszczone miejsca oraz nieobsługiwany teren. Obsługiwane dzikie drzewa i drobne naturalne dekoracje same w sobie nie czynią obszaru przemysłowym.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Ochrona może sięgać poza samą przeszkodę. Zmiany brzegów i efekty dotyczące obiektów naturalnych zachowują co najmniej osiem pól odstępu, nawet gdy ogólny bufor jest mniejszy. System ponownie sprawdza ochronę tuż przed zmianą, więc nowo postawiona maszyna może zatrzymać pracę, która już czekała.\n\nKorozja nawierzchni ma wąski wyjątek dla odpowiednich, niezajętych ścieżek i betonu. Zmiany brzegów dotyczą tylko określonych par podłoża i wody. Rozprzestrzeniający się ogień może wyjść poza początkowo sprawdzone miejsce zapłonu. Wyłączenie funkcji zatrzymuje nową aktywność; wykonane zmiany zwykle pozostają, dopóki obsługiwany proces regeneracji ich nie naprawi.
soil-heading=Zanieczyszczenie niszczy naturalne podłoże
soil=Przy utrzymującym się zanieczyszczeniu przemysłowym naturalny teren może zmieniać się etapami. Na Nauvis trawa może ustąpić ziemi, pustyni i piaskowi. Inne światy korzystają z własnych terenów wulkanicznych, mokradeł, skał lub śniegu. Ograniczenie zanieczyszczenia może zatrzymać dalsze uszkodzenia, gdy warunki przestaną je umożliwiać.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność Łagodna daje dwuminutowy odstęp odniesienia między sprawdzeniami gleby, przy ustawieniu bazowym 60 sekund. Aktywność sezonowa i opóźnienia przetwarzania wpływają na moment dotarcia do obszaru. Nadal wymagane jest pięć minut obserwacji warunków zanieczyszczonych.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Każde sprawdzenie dotyczy małego obszaru, zamiast przemalowywać cały chunk. Maksymalna głębokość degradacji ogranicza liczbę zapisanych etapów dla danego fragmentu. Podłoże na końcu obsługiwanego ciągu nie ma dalszego kroku; każda planeta zachowuje własne typy terenu.
recovery-heading=Czystsze warunki pozwalają naprawić zapisane uszkodzenia
recovery=Czystsze warunki dają uszkodzonemu podłożu szansę na regenerację. ESIR pamięta wykonane przez siebie zmiany i cofa je krok po kroku w stronę dokładnie tego terenu, który był wcześniej. Jeśli trawa stała się ziemią, a potem piaskiem, regeneracja odtwarza zapisane etapy zamiast wybierać dowolne pole trawy.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność Łagodna daje ośmiominutowy odstęp regeneracji, przy ustawieniu bazowym 240 sekund. Ten bazowy odstęp jest cztery razy dłuższy od bazowego odstępu degradacji. Obszar potrzebuje też dziesięciu minut czystych obserwacji; oba wymagania mogą być spełniane równolegle. Intensywność zmienia odstęp regeneracji, ale aktywność sezonowa go nie zmienia. Żaden z tych odstępów nie gwarantuje natychmiastowego wyniku.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Regeneracja wymaga wiarygodnego zapisu uszkodzeń ESIR. Zabudowanie ziemi lub zastąpienie jej przez inny system może uczynić ten zapis bezużytecznym; późniejsze usunięcie pokrycia go nie odtworzy. Regeneracja nie odtworzy starszego, niezapisanego terenu ani linii brzegowej, nie odbuduje klifów i nie ożywi zniszczonych drzew.
depletion-heading=Wyczerpane złoże może pozostawić ślad
depletion=Gdy skończone złoże się wyczerpie, odsłonięta ziemia w pobliżu może zostać naruszona. Wyczerpana pozycja musi leżeć w obszarze wydobycia kamieniołomu spalinowego, parowego, elektrycznego lub dużej wiertnicy obsługującej tę kategorię zasobu. Zmiany obszaru wydobycia wynikające z jakości są uwzględniane. Zwykłe wiertnice i nieskończone złoża nie kwalifikują się.\n\n[font=default-bold]Ustawienia domyślne:[/font] Fragment terenu wybierany jest w promieniu zaburzenia 56 pól i ma własny promień trzech pól. Każda kwalifikująca się pozycja w tym fragmencie ma 70% szans na zmianę. Pozostała ruda i chroniony teren pozostają nietknięte.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Wyzwalaczem jest wyczerpanie złoża; zdarzenie nie mówi ESIR, która wiertnica je wydobyła. Liczy się zasięg odpowiedniej maszyny. Fragmenty są przetwarzane stopniowo, więc ślad może pojawić się już po zatrzymaniu wiertnicy. Liczne wyczerpania naraz mogą łączyć pobliskie żądania lub uniemożliwić przyjęcie kolejnych, ale zaakceptowane żądanie nie znika tylko dlatego, że długo czeka.
working-heading=Pracujące kamieniołomy mogą naruszać pobliską ziemię
working=Odpowiedni kamieniołom lub duża wiertnica mogą pozostawiać ślady również podczas wydobywania skończonego złoża. Maszyna musi być aktywna, mieć stan Pracuje i prawidłowy skończony cel wydobycia na tej samej powierzchni. To osobny mechanizm od śladu powstającego po wyczerpaniu złoża. Bezczynne wiertnice nie tworzą śladów pracy.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność Łagodna daje dziesięciominutowy odstęp odniesienia między okazjami, przy ustawieniu bazowym 300 sekund. Każda okazja ma 10% szans na zgłoszenie fragmentu śladu wydobycia. Następnie każda kwalifikująca się pozycja tego fragmentu korzysta z oddzielnej szansy 70%. Pory roku i opóźnienia przetwarzania mogą zmieniać moment sprawdzeń.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Pozostała ruda jest chroniona, więc ślad może powstać na odsłoniętej ziemi obok. ESIR prowadzi ograniczoną listę tych samych czterech rodzin wiertnic i aktualizuje ją przy tworzeniu lub usuwaniu maszyn; bezczynne wiertnice mogą pozostać na liście. Spóźnione sprawdzenie wykonuje jedną bieżącą próbę, zamiast odtwarzać pominięte okazje. Wyłączenie ekologii na powierzchni wstrzymuje sprawdzenia i nanoszenie oczekujących śladów.
mining-recovery-heading=Do jakiego stanu może wrócić ślad wydobycia
mining-recovery=Regeneracja śladu wydobycia dąży do podłoża, które istniało tuż przed jego powstaniem. Jeśli zanieczyszczenie zdążyło zmienić trawę w ziemię, naprawa po wydobyciu może przywrócić ten fragment w stronę ziemi. Zapis wydobycia zastępuje wcześniejszą ścieżkę regeneracji ekologicznej, więc nie pozwala już odzyskać z niej dawnej trawy. Kolejne zapisane uszkodzenia wydobywcze nadal można cofać.\n\n[font=default-bold]Ustawienia domyślne:[/font] Regeneracja wydobycia jest włączona dla nowych zapisanych śladów. Włączona musi być zarówno ogólna regeneracja terenu, jak i regeneracja wydobycia. Ziemia musi spełniać wymagania czystych obserwacji, a zapis regeneracji musi pozostać poprawny.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Uszkodzenia wykonane przy wyłączonej regeneracji wydobycia są trwałe. Jej późniejsze włączenie nie odtworzy niezapisanych śladów. Wyłączenie ekologii powierzchni wstrzymuje zaakceptowaną pracę wydobywczą; ponowne włączenie wznawia ją w zwykłych limitach przetwarzania, bez nagłej serii pominiętych prób.
blood-heading=Krew obcych może pomóc uszkodzonej ziemi
blood=Gdy ginie wroga istota lub gniazdo, efekt krwi może pomóc pobliskiemu podłożu cofnąć jeden zapisany etap uszkodzenia. To bezpośrednia regeneracja: może działać bez oczekiwania na zwykły okres czystych obserwacji. Nadal potrzebuje poprawnego zapisu uszkodzeń ESIR, właściwych przełączników i zwykłych zasad ochrony. Uszkodzenia wydobywcze wymagają dodatkowo włączonej regeneracji wydobycia.\n\n[font=default-bold]Ustawienia domyślne:[/font] Kwalifikująca się śmierć ma 10% szans na przyjęcie małego lokalnego fragmentu do przetworzenia. Zmiany są wykonywane później, gdy dostępna jest moc przetwarzania.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Zwłoki nie gwarantują odnowionej ziemi i nie pozostawiają trwałego pola uzdrawiania. Efekt nie odgadnie wcześniejszego terenu, gdy brak zapisu. Działa oddzielnie od widocznych efektów śmierci w walce, a duża liczba zdarzeń może ograniczyć przyjmowanie nowych fragmentów.
paving-heading=Krew może również niszczyć odsłonięte nawierzchnie
paving=Gdy efekty krwi i korozja nawierzchni są włączone, fragment związany ze śmiercią wroga może usunąć odpowiednią kamienną ścieżkę lub beton, odsłaniając zapisane pod nimi pole. Prawidłowa regeneracja terenu ma pierwszeństwo; nawierzchnia jest rozpatrywana wtedy, gdy taka regeneracja jest niedostępna. Wyłącz tę opcję, jeśli chcesz zachować kwalifikujące się odsłonięte nawierzchnie.\n\n[font=default-bold]Ustawienia domyślne:[/font] Korozja ma losowanie 1% po przyjęciu zdarzenia krwi. To szansa wewnątrz zaakceptowanego fragmentu, a nie 1% dla każdego wroga zabitego w dowolnym miejscu.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Zajęte lub w inny sposób chronione nawierzchnie oraz fundamenty są wykluczone, a podłoże pod nimi musi nadal być znane i poprawne. To konkretny wyjątek od zwykłej ochrony nawierzchni. Usunięte pokrycie nie jest zwracane ani odbudowywane przez regenerację. Wyłączenie efektów krwi zatrzymuje też nowe próby korozji, nawet gdy przełącznik nawierzchni pozostaje włączony.
stress-heading=Zanieczyszczenie może powodować szarzenie dzikich drzew
stress=Obsługiwane dzikie drzewa mogą tracić kolor po długotrwałym zanieczyszczeniu. Pozostają żywe i na swoim miejscu; szarzenie różni się od spalenia lub przemiany w martwe drewno. ESIR pamięta pierwotny stopień zabarwienia i wywołane osłabienie, dzięki czemu może je później cofnąć. Rośliny uprawne, szczególna flora, chronione miejsca i nieobsługiwane gatunki pozostają nietknięte.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność Łagodna daje dziesięciominutowy odstęp odniesienia między sprawdzeniami osłabienia, przy bazowym odstępie pięciu minut. Intensywność, aktywność sezonowa, zasięg obserwacji i ograniczona liczba wyszukiwań drzew wpływają na moment dotarcia do konkretnego drzewa. Nadal obowiązuje wymagany okres obserwacji zanieczyszczenia.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] W pełni szare drzewo nie może przejść kolejnego etapu szarzenia. Jeśli inny system zmieni zapisany stopień zabarwienia, ESIR może porzucić zapis zamiast nadpisać nowy wygląd.
greening-heading=Osłabione drzewo może odzyskać kolor
greening=Utrzymuj niskie zanieczyszczenie wystarczająco długo, a drzewo osłabione przez ESIR może stopniowo wrócić do pierwotnego wyglądu. Naturalnie szare drzewo zachowuje swój naturalny kolor. Regeneracja wymaga tego samego żywego drzewa, oczekiwanego zapisanego stopnia zabarwienia i ciągłych czystych obserwacji.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Ścięcie, zastąpienie lub zniszczenie drzewa kończy tę możliwość regeneracji. Przywracanie koloru należy do funkcji osłabienia drzew, która prowadzi własne zapisy. Jest oddzielne od regeneracji ziemi, odrastania, starzenia i rozkładu. Zdrowo wyglądające podłoże nie obiecuje powrotu dawnych drzew, a jedno regenerujące się drzewo nie dowodzi, że wszystkie pobliskie fragmenty są gotowe do odnowy.
regrowth-heading=Las rozrasta się od ocalałych drzew
regrowth=Po długotrwałych czystych warunkach odpowiednie dzikie drzewo może dać początek nowemu obsługiwanemu drzewu w pobliżu. Pozostawienie części rodzimego lasu daje odrastaniu punkt startowy. Nowe drzewo musi pasować do podłoża i przejść sprawdzenia ochrony; na Gai gatunek jest dobierany do lokalnego biomu. Uprawy nigdy nie służą jako gatunki do odrastania.\n\n[font=default-bold]Ustawienia domyślne:[/font] Intensywność Łagodna daje dwudziestominutowy odstęp odniesienia między okazjami wzrostu, przy bazowych dziesięciu minutach, przed zmianami sezonowymi i opóźnieniami przetwarzania. Nowa pozycja może być oddalona o najwyżej osiem pól wzdłuż każdej osi mapy. Wzrost jest blokowany, gdy otoczenie sięgające czterech pól wzdłuż obu osi zawiera już 16 obsługiwanych naturalnych drzew. Na wszystkich powierzchniach łącznie co najmniej dziesięć sekund dzieli pomyślne utworzenie kolejnych drzew.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] To powolne, lokalne rozrastanie się lasu. Odizolowana polana bez odpowiedniego ocalałego drzewa dostarczającego nasion może pozostać pusta. Czyste pomiary, dość miejsca i dostępna kolej przetwarzania muszą wystąpić razem; odstęp nie obiecuje, że każde drzewo wyda następne.
aging-heading=Żywe drzewa mogą stać się martwym drewnem
aging=Starzenie może usunąć obsługiwane żywe drzewo Nauvis i zastąpić je rodzimym martwym drewnem. Działa niezależnie od osłabienia zanieczyszczeniem, więc wybrane może zostać nawet zielone drzewo. Wyłącz starzenie, jeśli chcesz zachować żywe drzewa do czasu, aż usunie je coś innego.\n\n[font=default-bold]Ustawienia domyślne:[/font] Starzenie jest włączone. Przy intensywności Łagodnej odstęp odniesienia wynosi dwie godziny, przy bazowej jednej godzinie, a aktywność sezonowa wpływa na tempo. Są to sprawdzenia przeszukiwanego obszaru, nie stały czas życia przypisany każdemu nowemu drzewu.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Nauvis jest obecnie jedynym światem z obsługiwanym zastępowaniem drzew martwym drewnem. Ochrona nadal obowiązuje. Utrata żywego drzewa jest trwała; odzyskanie koloru go nie przywróci. Samo starzenie nie rozpoczyna pożaru.
rot-heading=Martwe drewno może stopniowo znikać
rot=Rozkład martwego drewna z czasem usuwa obsługiwane martwe drzewa. Może oczyścić stare pozostałości lasu, ale nie zastępuje ich żywymi drzewami. Odrastanie to oddzielny proces, który może kiedyś utworzyć nowy las w pobliżu. Starzenie i rozkład można włączać niezależnie.\n\n[font=default-bold]Ustawienia domyślne:[/font] Przy intensywności Łagodnej rozkład ma godzinny odstęp odniesienia, przy bazowych trzydziestu minutach. Intensywność, aktywność sezonowa i pokrycie przetwarzania wpływają na moment dotarcia do danego obszaru.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Usunięte martwe drewno nie jest zapisywane do późniejszej regeneracji. Nieobsługiwane gatunki, chronione miejsca i flora uprawna są wykluczone. Rozkład ma własne terminy, więc spóźniona wizyta nie odtwarza nagle wszystkich sprawdzeń pominiętych podczas braku obserwacji.
thermal-heading=Drzewo utracone w ogniu może pozostawić uszkodzoną ziemię
thermal=Drzewo zabite przez kwalifikujące się obrażenia ogniste może zostawić mały ślad wokół dawnej pozycji. Podłoże zmienia się zgodnie z zasadami terenu danej planety i może zostać zapisane do późniejszej regeneracji. Czystsze warunki mogą naprawić ziemię, choć samo drzewo pozostaje utracone.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Śmierć musi pochodzić od kwalifikującego się źródła ognia, a zwykła ochrona podłoża nadal obowiązuje. Takie śmierci mogą wynikać zarówno z pożarów bojowych, jak i samoczynnych pożarów lasu. Ślady wypalenia reagują na śmierć; nie zapalają kolejnego płomienia. Chronione miejsce pod maszyną może więc pozostać nietknięte, nawet jeśli pobliskie drzewo płonie.
wildfire-heading=Wybierz ogień ograniczony lub rozprzestrzeniający się
wildfire=Zanieczyszczenie przemysłowe może czasem wywołać ogień przy obsługiwanych dzikich drzewach. Obszar potrzebuje zanieczyszczenia co najmniej na górnym progu, odpowiedniego paliwa w pobliżu i niechronionego miejsca zapłonu. Odczyt poniżej progu zatrzymuje nowe żądania pożaru w tym obszarze; wcześniej zaakceptowany zapłon może nadal czekać. Ta funkcja nie czeka na pięć minut obserwacji zanieczyszczenia wymaganych dla gleby.\n\n[font=default-bold]Ustawienia domyślne:[/font] Wybrany jest tryb Ograniczone. Przy intensywności Łagodnej odstęp odniesienia dla zagrożeń wynosi dwadzieścia minut, przy bazowych dziesięciu minutach. Kwalifikująca się okazja pożaru ma 1% szans na próbę zapłonu; pory roku, wspólne kolejki zagrożeń i pokrycie mogą ją dodatkowo opóźnić. Nie jest to szansa na każde drzewo w każdej sekundzie. Początkowe zapłony na wszystkich powierzchniach są ograniczone do jednego na dziesięć sekund i 16 zachowanych zapisów ognia.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Ograniczone tworzy nierozprzestrzeniający się płomień na ziemi, trwający najwyżej dziesięć sekund. Rozprzestrzeniające się rozpoczyna zwykły pożar drzewa w Factorio; dalsze płomienie mogą wyjść poza pierwotnie sprawdzony obszar i zużywać czas silnika poza limitami skryptów ekologii. Wyłączenie ekologii usuwa jej ograniczone płomienie, ale pozostawia niezależne pożary bojowe i kolejne rozprzestrzeniające się płomienie. Alert potwierdza utworzenie zapłonu, a nie spalenie lasu.
flood-heading=Woda może wejść na piaszczysty brzeg
flood=Na Nauvis powódź może zmienić obsługiwany piaszczysty brzeg w wodę obok istniejącej, obsługiwanej wody słodkiej. Spodziewaj się małych lokalnych zmian linii brzegowej. Lawa oraz oceany ropy i amoniaku są poza działaniem tego efektu, podobnie jak dowolny teren daleko od właściwego brzegu.\n\n[font=default-bold]Ustawienia domyślne:[/font] Każda okazja powodzi ma szansę 2%. Tempo wynika z odstępu zagrożeń, intensywności, aktywności sezonowej i pokrycia przetwarzania. Deszcz, niskie zanieczyszczenie i widoczna pogoda nie są wymagane.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Odpowiednie sąsiedztwo brzegu bezpośrednio na północ, południe, wschód lub zachód kwalifikuje początkowe żądanie. Przed zmianą pola system sprawdza, czy zamiana jego podłoża w wodę jest obsługiwana i czy ochrona nadal ją dopuszcza. Zapisana powódź może się cofnąć w ramach regeneracji, dopóki zapis uszkodzenia pozostaje poprawny; samo wyłączenie powodzi nie osusza od razu wody. To lokalny ruch brzegu, nie ogólna symulacja poziomu morza.
drought-heading=Woda może cofnąć się wzdłuż piaszczystego brzegu
drought=Na Nauvis susza może zmienić obsługiwaną wodę słodką w piasek obok odpowiedniego piaszczystego brzegu. Może zostawić nieco więcej odsłoniętej ziemi wzdłuż wybrzeża. Inne płyny planetarne są wykluczone, a woda bez wymaganego sąsiedztwa brzegu nie kwalifikuje się.\n\n[font=default-bold]Ustawienia domyślne:[/font] Każda okazja suszy ma szansę 2%. Jej tempo wynika z odstępu zagrożeń, intensywności, aktywności sezonowej i pokrycia przetwarzania, bez osobnego wymogu wysokiego zanieczyszczenia lub pogody.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Infrastruktura, niewyczerpane zasoby i specjalne miejsca pozostają chronione. Oczekująca zmiana może przestać spełniać warunki przed wykonaniem. Powódź i susza mają osobne przełączniki; włączenie obu pozwala na przeciwne lokalne zmiany z upływem czasu. Żadna nie modeluje temperatury ani opadów i nie zmusza brzegu do natychmiastowego cyklu naprzód i wstecz.
cliff-heading=Wietrzenie może usunąć zwykłe klify
cliff=Wietrzenie może usunąć obsługiwany zwykły klif po sprawdzeniu pobliskich stref ochrony. Trwale zmienia to naturalną barierę. Wyłącz funkcję, jeśli chcesz zachować klify do czasu ich własnoręcznego usunięcia.\n\n[font=default-bold]Ustawienia domyślne:[/font] Okazja wietrzenia klifu ma szansę 1%. Nie wymaga ekspozycji na zanieczyszczenie, deszczu, obrażeń bojowych ani zmierzonego wieku klifu.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Specjalne planetarne rodziny klifów nie zastępują obsługiwanego zwykłego klifu. Pobliska infrastruktura lub chronione miejsca mogą uniemożliwić usunięcie, nawet gdy klif został już znaleziony. Regeneracja podłoża nie odbuduje usuniętego klifu.
calendar-heading=Kalendarz dla każdego świata
calendar=Każdy obsługiwany świat ma kalendarz sezonowy. Światy dalsze od gwiazdy mają zwykle dłuższe lata, zgodnie z odległościami na mapie gwiezdnej. Kalendarz porządkuje zmiany sezonowe; nie przesuwa planet i nie zmienia tras podróży. Pora narastania, Pora szczytu, Pora opadania i Pora spoczynku nazywają jego cztery części, nie obiecując określonej pogody.\n\n[font=default-bold]Ustawienia domyślne:[/font] Rok odniesienia wynosi 360 dni Nauvis, według rzeczywistej długości dnia zapamiętanej przy uruchomieniu kalendarza. Rok świata wykorzystuje tę wartość pomnożoną przez stosunek jego odległości do odległości Nauvis, podniesiony do potęgi 1,5. Orientacja na mapie gwiezdnej wyznacza początkowe miejsce w roku. Późniejsze zmiany modułu dnia Nauvis nie przedefiniowują ciągle tej wartości odniesienia.\n\n[font=default-bold]Korzystanie z kalendarza:[/font] Administracyjny panel kalendarza pokazuje dni odniesienia, równoważną liczbę dni lokalnych i czas symulacji. Zmiana długości roku zachowuje to samo miejsce w porze roku. Administrator może też je dostosować, aby zobaczyć podgląd.
daylight-heading=Zmienia się jasna część doby, nie cała doba
daylight=Sezonowa długość dnia wydłuża lub skraca światło dzienne wewnątrz istniejącej doby planety. Wyobraź sobie przesuwanie wschodu i zachodu słońca bez zmiany czasu pełnego obrotu. Zmienia to czas, przez który panele słoneczne otrzymują światło dzienne. Świt i zmierzch zachowują swoje długości.\n\n[font=default-bold]Ustawienia domyślne:[/font] Funkcję obsługują Nauvis, Gaia, Vulcanus, Gleba i Aquilo. Przyjęte nachylenie osi wynosi 23,5 stopnia, a szerokość geograficzna 45 stopni. Nawet przy skrajnych ustawieniach co najmniej 2% cyklu pozostaje pełnym dniem i 2% pełną nocą.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Zamrożona pora dnia lub stały dzień wstrzymuje sezonowe zmiany. ESIR ustępuje też Diurnal Dynamics lub innemu modułowi zmieniającemu te same ustawienia świtu i zmierzchu. Przy wyłączeniu przywraca początkowe ustawienia tylko wtedy, gdy jego ostatnia zmiana pozostała nietknięta. Niezależny moduł dnia Fulgory zachowuje pełną kontrolę; sezonowa długość dnia nigdy nie zmienia ani nie przywraca jego granic.
modulation-heading=Pory roku mogą zmieniać tempo ekologii
modulation=Aktywność sezonowa sprawia, że okazje do zmian gleby, efektów drzew, zagrożeń i śladów pracujących wiertnic pojawiają się częściej lub rzadziej w ciągu roku. Może działać nawet wtedy, gdy sezonowa długość dnia jest wyłączona lub światłem steruje inny system, również na Fulgorze. Zmiana tempa nie zmienia szansy powodzenia pojedynczej okazji.\n\n[font=default-bold]Ustawienia domyślne:[/font] Siła wynosi 25%. Tempo płynnie rośnie do 125% wartości odniesienia wybranej intensywności w pobliżu Pory szczytu i spada do 75% w pobliżu Pory spoczynku. Wyższe tempo skraca odstępy, a niższe je wydłuża.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Pory roku nie włączają wyłączonych zagrożeń, nie zmieniają wymaganych obserwacji czystych lub zanieczyszczonych i nie wpływają na zwykły odstęp regeneracji podłoża. Okazja wzrostu nadal wymaga czystych pomiarów, odpowiedniego drzewa dającego nasiona, miejsca i dostępnego przetwarzania. Kalendarz nie przesuwa planet ani nie przemalowuje świata zgodnie z porą roku. Zimowy kolor przycisku jest wskaźnikiem, nie obietnicą śniegu.
nauvis-heading=Nauvis: gleba, piasek i las
nauvis=Podłoże Nauvis może przechodzić od trawy przez ziemię i pustynię do piasku, a regeneracja kieruje zapisane fragmenty ku ich dokładnemu pierwotnemu terenowi. Obsługiwane rodzime drzewa mogą słabnąć, odzyskiwać kolor i odrastać. Nauvis jest też pierwszym obsługiwanym światem dla zmian brzegów wody słodkiej oraz jedynym, na którym starzenie zastępuje żywe drzewo martwym drewnem.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Utwardzone obszary fabryki, niewyczerpane zasoby, infrastruktura i specjalne miejsca pozostają chronione. Kwalifikująca się korozja nawierzchni jest jawnym wyjątkiem dla odsłoniętego pokrycia.
gaia-heading=Gaia: zachowaj charakter miejscowego krajobrazu
gaia=Łąki i mokradła Gai mogą niszczeć aż do odsłonięcia skały Gai. Regeneracja odtwarza zapisane warianty podłoża, a odrastanie dobiera drzewa do lokalnego biomu. Specjalne miejsca umieszczane przez ESIR mają chronione obszary, aby zwykła praca ekologii pozostawiała je nietknięte.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] W starszych zapisach ocalałe znaczniki miejsc pomagają ustalić, gdzie należy zastosować ochronę. Obszary nadal sprawdzane lub takie, których dawne zapisy ochrony się przepełniły, mogą pozostać zamknięte dla zmian ekologicznych. Jeśli wyróżniające znaczniki zniknęły, system nie odtworzy z niczego dokładnej dawnej granicy miejsca.
vulcanus-heading=Vulcanus: zmiany popiołu i gleby wulkanicznej
vulcanus=Vulcanus korzysta z własnych zmian popiołu, gleby wulkanicznej i spękanego podłoża. Lawa pozostaje chroniona, a efekty drzew dotyczą tylko obsługiwanych rodzimych gatunków. Fumarole zachowują własne cykle populacji, rezerw i terenu.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Ekologia nie przejmuje efektów fumaroli, nie wprowadza zwykłego lasu podobnego do ziemskiego i nie zamienia płynów wulkanicznych w wodę słodką.
gleba-heading=Gleba: zarodniki wymagają innego traktowania
gleba=Gleba zachowuje zmiany podłoża właściwe swoim biomom i obsługiwane siedliska dzikich drzew, w tym zasady umieszczania na mokradłach. Rośliny uprawne i ich specjalne gleby, flora Auric i zajęte obszary zbiorników pozostają chronione. Zarodniki są innym rodzajem zanieczyszczenia i nie liczą się jako toksyczne skażenie przemysłowe.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Odczyt samych zarodników nie jest ani pomiarem zanieczyszczenia przemysłowego, ani dowodem czystych warunków przemysłowych. Same zarodniki nie mogą więc spełnić warunków degradacji podłoża od zanieczyszczenia, zwykłej regeneracji, osłabienia drzew lub odzyskania koloru, naturalnego odrastania ani pożaru od zanieczyszczenia. Kwalifikujące się wydobycie, ślady śmierci od ognia, efekty krwi, niezależne zagrożenia i kalendarz nadal mogą działać. Włączenie przełącznika nie zmieni zarodników w użyteczny odczyt przemysłowy.
fulgora-heading=Fulgora: doba pozostaje pod własną kontrolą
fulgora=Obsługiwane podłoże Fulgory może przechodzić przez skałę, piasek, pył i wydmy, podczas gdy oceany ropy pozostają chronione. Jej kalendarz ekologiczny może zmieniać tempo kwalifikujących się efektów i kolor przycisku mechanicznego drzewa. Nie ma tu obsługiwanej rodzimej rodziny leśnej, która pozwalałaby rosnąć zwykłym drzewom.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Niezależny system cyklu dnia Fulgory nadal steruje światłem dziennym. Sezonowa długość dnia nigdy nie odczytuje, nie zmienia ani nie przywraca jej granic świtu i zmierzchu, także przy zmianach globalnych ustawień ekologii lub kalendarza.
aquilo-heading=Aquilo: śnieg i lód wokół chronionej fabryki
aquilo=Aquilo korzysta z własnych zmian ubijania śniegu i lodu, a regeneracja cofa zapisane etapy. Oceany amoniaku, fundamenty i infrastruktura pozostają chronione. Sezonowa długość dnia może zmieniać jasną część doby bez zmiany obrotu planety.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Nie ma obsługiwanej rodzimej rodziny leśnej, która obsadziłaby Aquilo zwykłymi drzewami. Ekologia nie zapewnia ogólnej symulacji zamarzania, topnienia ani przekształcania oceanów.
settings-heading=Wybierz ustawienia globalne i lokalne wyjątki
settings=Przełącznik integracji przy uruchamianiu udostępnia ekologię. W Ustawienia modyfikacji → Mapa wybierzesz funkcje, progi zanieczyszczenia, odstępy, szanse, włączenie planet i limity przetwarzania. Administratorzy mogą używać panelu Teren i ekologia do nadpisywania obsługiwanych ustawień na istniejącej powierzchni. Przywrócenie dziedziczenia usuwa taki lokalny wyjątek. Wybranie planety lub odczyt jej raportu nie tworzy powierzchni.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Ostateczne zachowanie łączy ustawienia globalne, zasady planet i jawne nadpisania powierzchni. Główne wyłączenie, nieobsługiwany teren, ochrona i zawieszenia zgodności między modyfikacjami nadal mają pierwszeństwo. Aktualizacje zachowują zapisane ustawienia. Wyłączenie regeneracji wstrzymuje ją, zamiast od razu przywracać ziemię. Wyłączenie innego efektu nie zwraca zniszczonych drzew, klifów ani nawierzchni. Wyłączenie integracji startowej przywraca sezonowe oświetlenie tylko tam, gdzie ostatnia zmiana ESIR nadal jest nietknięta.
presets-heading=Intensywność ustala tempo, przetwarzanie — pokrycie
presets=Intensywność wybierz według tego, jak często mają pojawiać się okazje ekologiczne, a przetwarzanie według ilości terenu do sprawdzenia i szybkości obsługi oczekującej pracy. Zwiększenie przetwarzania może pomóc wcześniej dotrzeć do obszarów na intensywnie używanej lub szeroko odkrytej mapie. Nie zwiększa ustawionej szansy powodzenia przy każdym sprawdzeniu.\n\n[font=default-bold]Ustawienia domyślne:[/font] Łagodna używa mnożnika tempa 0,5, Standardowa 1, a Silna 2; Własna korzysta z wybranego mnożnika. Większa intensywność nie włącza wyłączonych funkcji. Domyślnym przetwarzaniem jest Oszczędny. Siedem nazwanych wyborów to Bardzo niski, Niski, Oszczędny, Zrównoważony, Szczegółowy, Wysoka wierność i Bardzo wysoka wierność, a dodatkowo dostępny jest Własny. Oszczędny wykonuje małą partię co 16 tików, dopuszczając jedno wyszukiwanie obiektów co 32 tiki.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Limity przetwarzania i pamięci są wspólne dla wszystkich powierzchni, a Własny także pozostaje ograniczony. Obniżenie limitu pamięci zachowuje istniejące zapisy, ale blokuje nowe, dopóki nie zwolni się miejsce. Gdy pamięć regeneracji jest pełna, ESIR odmawia nowych odwracalnych uszkodzeń zamiast zapominać ścieżkę odnowy starszego fragmentu. Większe profile mogą wymagać więcej czasu obliczeń; żaden nie gwarantuje określonego UPS dla każdej fabryki.
reports-heading=Odczytaj raport świata, na który patrzysz
reports=Miedziane mechaniczne drzewo w lewym górnym rogu otwiera raport Ekologia dla oglądanej powierzchni, także w widoku zdalnym. Liście podążają za kalendarzem: limonkowe w Porze narastania, szmaragdowe w Porze szczytu, bursztynowoczerwone w Porze opadania i cyjanowe w Porze spoczynku. Najedź kursorem, aby zobaczyć nazwę pory. Bez użytecznego kalendarza drzewo pozostaje szmaragdowe i informuje, że dane sezonowe są niedostępne.\n\n[font=default-bold]Korzystanie z raportu:[/font] Prosty opisuje obserwowane podłoże, lasy, zaburzenia wydobywcze i warunki sezonowe językiem raportu terenowego. Zaawansowany dodaje efektywne ustawienia powierzchni, pomiary, oczekującą pracę, odmowy wynikające z ochrony i stan utrzymania, odróżniając je od wspólnych globalnych limitów i liczników. Brak obserwacji oznacza stan nieznany, nie zdrowy.\n\nOtwarty raport odświeża wcześniej zebrane informacje. Zamknięcie zatrzymuje te aktualizacje. Oddzielne sprawdzanie koloru przycisku może trwać bez przeszukiwania terenu.
alerts-heading=Wybierz zmiany, o których chcesz wiedzieć
alerts=Powiadomienia ekologiczne pojawiają się w zwykłym oknie alertów Factorio, z ikonami i pozycjami, do których możesz przejść. Wybierz je na karcie Alerty okna Ekologia lub w Ustawienia modyfikacji → Dla gracza; oba miejsca zmieniają te same osobiste preferencje. Alert oznacza, że efekt rzeczywiście nastąpił, a nie tylko zaplanowano sprawdzenie.\n\n[font=default-bold]Ustawienia domyślne:[/font] Alerty są włączone dla pożarów, powodzi, suszy, wietrzenia klifów i korozji nawierzchni. Pozostałe kategorie, w tym uszkodzenia od zanieczyszczenia, regeneracja, wydobycie i efekty drzew, są początkowo wyłączone i można je wybierać osobno. Wszystkie istniejące powierzchnie są wybrane; tylko bieżąca powierzchnia to osobny opcjonalny filtr. Zwykłe korekty światła dziennego nie wywołują alertów.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Twoja frakcja musi obecnie widzieć chunk zdarzenia; wcześniejsze odkrycie nie wystarcza. Administrator może pominąć wymóg widoczności, ale filtry kategorii i powierzchni nadal obowiązują, a wyjątek jest usuwany po utracie uprawnień. Pobliskie zdarzenia są łączone, zachowywane są najwyżej cztery alerty ekologii na gracza, a zdarzenie może zostać zgłoszone przez 60 sekund. Zdarzenia z czasu nieobecności nie czekają na późniejsze doręczenie. Wygaśnięcie alertu nigdy nie usuwa zapisów regeneracji ani oczekującej pracy wydobywczej.
maintenance-heading=Co mówi okno przebudowy
maintenance=Okno przebudowy ESIR pokazuje przygotowania i naprawy, które mają koniec: przekształcanie danych starych zapisów, pierwszy przebieg odkrywania, sprawdzanie zmienionej konfiguracji i naprawę przechowywanych informacji. Zadanie może czekać, gdy jego powierzchnie są wyłączone lub z innego powodu nie mogą kontynuować. Jeśli całkowita ilość pracy jest nieznana, okno pokazuje wykonaną pracę bez wymyślania procentu.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] Początkowy przebieg odkrywania ustala listę swoich powierzchni przy rozpoczęciu. Przejście każdej powierzchni kończy się po wyczerpaniu chunków lub osiągnięciu 100 000 wizyt chunków. Osiągnięcie pułapu oznacza brak potwierdzenia pokrycia, a nie sprawdzenie każdego miejsca mapy.\n\nCodzienne obserwacje, regeneracja, sprawdzanie pracujących wiertnic i zaakceptowane ślady wydobycia trwają niezależnie i są widoczne w trybie Zaawansowanym. Nie utrzymują okna przebudowy otwartego bez końca. Stare zapisy są przygotowywane stopniowo; ponowne otwarcie lub włączenie ekologii nie odtwarza wszystkich okazji pominiętych podczas jej nieaktywności.
troubleshooting-heading=Gdy krajobraz wydaje się niezmieniony
troubleshooting=Zacznij od trybu Zaawansowany dla oglądanej powierzchni. Sprawdź, czy ekologia jest tam faktycznie włączona i obsługuje ten świat. Następnie sprawdź odpowiednie podłoże lub drzewa, użyteczne pomiary zanieczyszczenia tam, gdzie są wymagane, wystarczająco długą ciągłą obserwację i ochronę wokół wybranego miejsca. Na końcu poszukaj oczekującej pracy lub pełnego limitu pamięci. Spokojny obszar może po prostu potrzebować więcej czasu, zwłaszcza przy małej szansie i długim odstępie.\n\n[font=default-bold]Pomocne sprawdzenia:[/font] Podłoże na końcu ciągu zmian nie może dalej degradować. Odrastanie potrzebuje ocalałego drzewa dającego nasiona, należącego do obsługiwanego gatunku. Wydobycie wymaga rzeczywistego wyczerpania skończonego złoża w zasięgu odpowiedniej wiertnicy albo kwalifikującej się maszyny faktycznie w stanie Pracuje dla śladów okresowych. Ogień wymaga zanieczyszczenia przemysłowego, obsługiwanego paliwa w pobliżu i zamierzonego trybu Ograniczone lub Rozprzestrzeniające się. Sam licznik udanych prób nie dowodzi utworzenia zapłonu. Regeneracja wymaga oryginalnego zapisu ESIR, a regeneracja wydobycia obu przełączników odnowy.\n\n[font=default-bold]Ograniczenia w praktyce:[/font] TerrainEvolution lub TerrainEvolution2 zawiesza pokrywające się funkcje ekologiczne; ESIR ustępuje Diurnal Dynamics w sprawie sezonowego światła dziennego. Więcej odkrytej ziemi i aktywnych powierzchni wymaga dłuższego pokrywania przy tym samym globalnym limicie przetwarzania. Nieznany odczyt lub opóźnione sprawdzenie nie dowodzą, że ziemia jest zdrowa albo funkcja jest zepsuta.
