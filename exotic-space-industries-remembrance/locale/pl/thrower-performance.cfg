[mod-setting-name]
ei-thrower-performance-profile=Wydajność wieżyczek miotających ogień i kwas

[mod-setting-description]
ei-thrower-performance-profile=Zmniejsza liczbę cząstek strumienia, częstotliwość strzałów, ilość dymu i częstotliwość obrażeń od podpalenia lub korozji wyłącznie dla wieżyczek. Silniejsze trafienia zachowują nominalne obrażenia na sekundę przy ciągłym ostrzale, a większe zużycie płynu na strzał zachowuje jego zużycie na sekundę. Obrażenia, narastanie i zależny od paliwa czas trwania ognia na ziemi pozostają bez zmian. Profil Oryginalny zachowuje dotychczasowe działanie. Przy 8× i 16× strzały są rzadkie: zmieniają się pokrycie ruchomych celów, narastanie ognia i wpływ odporności o stałej wartości. Mnożniki nie oznaczają gwarantowanego wzrostu UPS. Broń ręczna i uzbrojenie pojazdów pozostają bez zmian.\nWartości bazowe przed wpływem jakości, badań i innych modów. Kolumny: odstęp między strzałami / odstęp między cząstkami / cząstki na sekundę / mnożnik trafień i płynu / odstęp obrażeń od podpalenia / odstęp obrażeń od korozji. Odstępy w tickach (60 ticków = 1 sekunda).

[string-mod-setting]
ei-thrower-performance-profile-original=Oryginalny
ei-thrower-performance-profile-2x=Redukcja 2×
ei-thrower-performance-profile-4x=Redukcja 4×
ei-thrower-performance-profile-8x=Redukcja 8×
ei-thrower-performance-profile-16x=Redukcja 16×

[string-mod-setting-description]
ei-thrower-performance-profile-original=Dotychczasowe działanie: strzał co 4 ticki; cząstka co 2 ticki; 30 cząstek/s; zwykłe obrażenia trafienia i zużycie płynu; podpalenie co 10 ticków; korozja co tick.
ei-thrower-performance-profile-2x=Strzał co 8 ticków; cząstka co 4 ticki; 15 cząstek/s; obrażenia trafienia i płyn na strzał ×2; podpalenie co 20 ticków; korozja co 2 ticki.
ei-thrower-performance-profile-4x=Strzał co 16 ticków; cząstka co 8 ticków; 7,5 cząstki/s; obrażenia trafienia i płyn na strzał ×4; podpalenie co 30 ticków; korozja co 4 ticki.
ei-thrower-performance-profile-8x=Strzał co 32 ticki; cząstka co 16 ticków; 3,75 cząstki/s; obrażenia trafienia i płyn na strzał ×8; podpalenie co 30 ticków; korozja co 8 ticków. Rzadkie strzały zmieniają pokrycie celów i wpływ stałych odporności.
ei-thrower-performance-profile-16x=Strzał co 64 ticki; cząstka co 32 ticki; 1,875 cząstki/s; obrażenia trafienia i płyn na strzał ×16; podpalenie co 30 ticków; korozja co 16 ticków. Bardzo rzadkie strzały zmieniają pokrycie celów i wpływ stałych odporności.

