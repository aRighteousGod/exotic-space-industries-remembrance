[item-description]
ei-singularity-lance=Obcy silnik-przysięga zbudowany wokół unoszącego się serca z kryształu. Jego chromatyczny promień nie tyle pali cel, ile oddziela go od pamięci bycia całością.

[entity-description]
ei-singularity-lance=Wzniesiony kryształowy ołtarz skupionej przemocy obcych. Pryzmat zawisa nad maszyną, zbiera niemożliwy kolor i wypuszcza go jako lancę osobliwości wzdłuż wybranej linii.

[exotic-industries-informatron]
menu_singularity_lance=Lanca Osobliwości
title_singularity_lance=Lanca Osobliwości
turrets-text-6=[item=ei-singularity-lance]Lanca Osobliwości to obcy protokół ostrza zbudowany wokół zawieszonego pryzmatu i piramidalnego ołtarza. Gromadzi ładunek kryształu, aż wybrana linia staje się nacięciem. Wiązka nie jest pociskiem; to wyrok przeciągnięty przez przestrzeń, zostawiający ogień, przypalenie i ciszę, by odnalazły cel oddech później.
singularity-lance=Lanca Osobliwości
singularity-lance-text=[item=ei-singularity-lance]Lanca Osobliwości to zwarty silnik egzekucyjny epoki obcych. Lewitujący kryształ wisi nad jej piramidalnym kapturkiem, wypija ogromny impuls elektryczny i odpowiada celowi, otwierając jasną ranę na polu bitwy zamiast śledzić każdą ofiarę jako osobny pocisk.
singularity-lance-2=Ślad chromatyczny
singularity-lance-text-2=Każdy opłacony strzał trafia natychmiast. Wiązka jest świadkiem, nie zapalnikiem. Po zbadaniu Końcowego kolapsu pierwotny punkt celowania kurczy się przez pół sekundy, a następnie uwalnia osobne obrażenia obszarowe.
singularity-lance-3=Triage świadków
singularity-lance-text-3=Gdy wiele lanc przemawia naraz, szczeliny, znaki ran i ostrzegawcze pierścienie pozostają widoczne. Nadmiar osmaleń i ozdobników ustępuje pierwszy. Obrażenia nie zależą od widowiska.
singularity-lance-4=Przysięga świadka
singularity-lance-text-4=Obecna wierność świadectwa: __1__. Każde ustawienie zachowuje animowane podstawowe kształty i płynące kolory zbadanych ulepszeń. Wyższe poziomy dodają blask, rozbłyski korony, blizny i dźwięk. Status lancy pokazuje stałe bezpośrednie DPS twoich sił; Pamięć i Testament wzmacniają je warunkowo.
