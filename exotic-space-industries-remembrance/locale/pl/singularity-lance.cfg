[mod-setting-description]
ei-singularity-lance-visual-fidelity=Określa, jak żarliwie Lanca Osobliwości pamięta każde cięcie. Przysięga dotyka tylko świadectw wiązki, poświaty, ognia, przypaleń i dźwięku; głód, sięganie, ciało i wykonanie ostrza pozostają stałe. Objawiony prosi o objawienie trzymane na uwięzi. Wyzwolony łamie regulator i pozwala pryzmatowi zapisać każdą ranę, którą świat zdoła udźwignąć.

