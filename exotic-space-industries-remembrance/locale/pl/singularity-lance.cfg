[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Tylko konieczny ślad przeżywa cięcie: krótka wiązka, krótki świadek oraz zdyscyplinowany ogień i przypalenie.
ei-singularity-lance-visual-fidelity-standard=Promień zostaje jasno zapamiętany, a potem zwolniony, zanim rana stanie się doktryną.
ei-singularity-lance-visual-fidelity-cinematic=Większa część cięcia może pozostać: jaśniejsze odcinki, bogatsi świadkowie i dłuższa poświata na bliźnie.
ei-singularity-lance-visual-fidelity-maximal=Pryzmat otrzymuje objawienie na uwięzi: gęste wiązki i trwałe świadectwa, regulator wciąż czuwa.
ei-singularity-lance-visual-fidelity-unbounded=Regulator zostaje złamany. Lanca może zapisać każdy rozbłysk, który przeciśnie przez świat.

