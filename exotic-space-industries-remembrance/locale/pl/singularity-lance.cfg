[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Krótka wiązka i charakterystyczne kształty wszystkich zbadanych ulepszeń, bez ozdobnej poświaty i blizn.
ei-singularity-lance-visual-fidelity-standard=Promień zostaje jasno zapamiętany, a potem zwolniony, zanim rana stanie się doktryną.
ei-singularity-lance-visual-fidelity-cinematic=Dłuższy ślad wiązki, poświata oraz więcej ozdobnych blizn i dźwięków.
ei-singularity-lance-visual-fidelity-maximal=Jeszcze dłuższy ślad wiązki. Ostrzeżenia zachowują dokładny czas, a ozdoby pozostają ograniczone.
ei-singularity-lance-visual-fidelity-unbounded=Najdłuższy ślad wiązki. Historyczna nazwa pozostaje, lecz limity ozdób nadal chronią płynność świata.

