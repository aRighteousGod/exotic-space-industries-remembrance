[mod-setting-description]
ei-singularity-lance-visual-fidelity=Określa świetlną pamięć każdego cięcia. Każdy profil zachowuje linię cięcia, znak rany, ostrzeżenie przed zapadnięciem i sylwetkę Testamentu. Wyższe profile dodają poświatę, dłuższy ślad wiązki, blizny i dźwięk. Ozdoby pozostają ograniczone pod obciążeniem; obrażenia, zużycie energii i zasięg nie zmieniają się.

