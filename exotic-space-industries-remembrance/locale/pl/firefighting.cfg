[item-description]
ei-water-turret=Zużywa wodę i 100 kW, by spowalniać wrogów o 25% na 2 sekundy bez obrażeń lub automatycznie gasić pobliskie pożary. Zasięg: 24. Każdy impuls gaszenia zużywa 15 wody. Priorytety ustawia się w oknie wieżyczki.
ei-extinguisher=Ręcznie usuwa ogień i kałuże kwasu na małym obszarze. Wymaga nabojów do gaśnicy.
ei-extinguisher-ammo=Nabój do ręcznej gaśnicy. Pojemność: 100.

