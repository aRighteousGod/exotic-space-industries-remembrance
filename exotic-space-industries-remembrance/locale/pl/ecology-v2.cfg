[mod-setting-description]
ei-ecology-alert-enabled=Otrzymuj wybrane pomyślnie wykonane zmiany ekologiczne w standardowym oknie alertów. Główny przełącznik osobistych powiadomień.
ei-ecology-alert-surfaces=Użyj all lub tablicy JSON dokładnych nazw. [] oznacza brak. Maksymalnie 128 nazw i 4096 bajtów. Okno Ekologia zmienia to samo ustawienie. Brakujące nazwy niczego nie wybierają.
ei-ecology-alert-current-surface-only=Ogranicza wybrane powiadomienia do obecnie oglądanej powierzchni, także w widoku zdalnym. Domyślnie wyłączone.
ei-ecology-alert-allow-unrevealed=Tylko administratorzy: pomija wymóg aktualnej widoczności sektora. Filtry kategorii i powierzchni nadal obowiązują. Domyślnie wyłączone. Zwykłe odkrycie terenu nie wystarcza.
ei-terrain-periodic-mining-scars=Obsługiwane kamieniołomy i duże wiertnice podczas pracy mogą naruszać odsłonięty naturalny teren wokół skończonych złóż. Czynne złoża, infrastruktura i obszary chronione pozostają bezpieczne. Ślady wyczerpania nadal wywołują zdarzenia.
ei-terrain-periodic-mining-seconds=Odstęp przed zmianą przez intensywność i sezon. Domyślne 300 sekund daje 600 przy intensywności Powściągliwej przed zmianą sezonową. Spóźniona kontrola daje jedną próbę bez nadrabiania.
ei-terrain-periodic-mining-probability=Szansa przy każdej kwalifikującej się próbie okresowej. Domyślnie 10%. Nie zmienia osobnej szansy 70% dla każdej płytki wybranego śladu.
ei-ecology-alert-wildfire=Powiadom po udanym efekcie ekologicznym: Zapłon pożaru. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność. Zapłon oznacza utworzenie ognia, a nie spalenie lasu.
ei-ecology-alert-flood=Powiadom po udanym efekcie ekologicznym: Zalanie. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-drought=Powiadom po udanym efekcie ekologicznym: Wysychanie brzegu. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-cliff=Powiadom po udanym efekcie ekologicznym: Wietrzenie klifów. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-paving=Powiadom po udanym efekcie ekologicznym: Korozja nawierzchni. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-pollution=Powiadom po udanym efekcie ekologicznym: Szkody od zanieczyszczeń. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-restoration=Powiadom po udanym efekcie ekologicznym: Regeneracja terenu. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-depletion-scars=Powiadom po udanym efekcie ekologicznym: Ślady wyczerpania złóż. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-working-scars=Powiadom po udanym efekcie ekologicznym: Ślady pracujących wiertnic. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-mining-restoration=Powiadom po udanym efekcie ekologicznym: Regeneracja śladów wydobycia. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-tree-stress=Powiadom po udanym efekcie ekologicznym: Osłabienie drzew. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-tree-recovery=Powiadom po udanym efekcie ekologicznym: Regeneracja drzew. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-regrowth=Powiadom po udanym efekcie ekologicznym: Naturalny odrost. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-aging=Powiadom po udanym efekcie ekologicznym: Starzenie drzew. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-rot=Powiadom po udanym efekcie ekologicznym: Rozkład martwego drewna. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-thermal=Powiadom po udanym efekcie ekologicznym: Blizny termiczne. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.
ei-ecology-alert-blood=Powiadom po udanym efekcie ekologicznym: Regeneracja przez krew obcych. Powiadomienie nie włącza efektu. Obowiązują filtry i widoczność.

[ei-terrain]
controls=Przycisk z mechanicznym drzewem u góry po lewej otwiera raport Prosty, Zaawansowany i Alerty. Kolor liści odpowiada porze roku oglądanego świata; jej nazwę pokazuje podpowiedź. Prosty przedstawia badania terenu; Zaawansowany podaje ustawienia, wyniki i limity. Alerty współdzielą ustawienia moda na gracza i używają standardowego okna, zwykle dla obecnie widocznych sektorów. Ustawienia administratora pozostają w Teren i Ekologia.
v2-coverage=Obserwacje obejmują ograniczoną, rotującą grupę sektorów. Niezbadany teren pozostaje nieznany; brakujące lub stare odczyty nie dowodzą ciągłej czystości ani skażenia. Regeneracja obejmuje tylko zapisane szkody ESIR. Skończone migracje, inicjalizacja i konserwacja pojawiają się w oknie przebudowy; stała ekologia w raporcie Zaawansowanym. Limit 100 000 wizyt nie potwierdza zbadania całej mapy.
mining-v2-note=Pracujące wiertnice mają osobną, domyślnie włączoną opcję: 10% co 300 sekund bazowych, czyli 600 przy intensywności Powściągliwej przed wpływem sezonu. Przyjęte żądania nie wygasają z wiekiem; wyłączenie powierzchni je wstrzymuje. Regeneracja nowych zapisanych śladów jest domyślnie włączona.
status-unsupported=Nieobsługiwana powierzchnia
status-independent=Niezależne sterowanie Fulgory

