[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=Najkrótsze rozerwanie. Cztery pierścienie, ciasne limity efektów, bez drugorzędnego akcentu rodziny i bez massive-explosion.
ei-flammable-rupture-fidelity-runtime-standard=Domyślnie. Sześć pierścieni, umiarkowane limity, jeden sensowny akcent drugorzędny i powściągliwe massive-explosion.
ei-flammable-rupture-fidelity-runtime-cinematic=Osiem pierścieni, szerszy budżet dymu i ognia, bogatsze akcenty rodzin i wolniejszy ceremonialny rozkwit na zewnątrz.
ei-flammable-rupture-fidelity-runtime-unbounded=Usuwa twarde limity wizualne i pozwala planiście agresywnie opróżniać gotowe pierścienie w tym samym ticku. To tryb dla widowiska, nie dla ostrożności.
ei-gaian-saucer-wake-visual-fidelity-runtime-off=Statek pieczętuje swój powidok i przelatuje bez widzialnej pamięci.
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=Tylko cienka chromatyczna odmowa podąża za skorupą, krótka i zdyscyplinowana.
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=Ślad przemawia wyraźnie, po czym gaśnie, zanim stanie się doktryną.
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=Ślad rozszerza się, trwa dłużej i zgina razem z przysięgą skrętu.
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=Skorupa zostawia gęstą, świetlistą ranę ruchu wszędzie, gdzie przechodzi.
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=Zdejmuje się jarzmo; spodek może zapisać każdy poblask, jaki świat zdoła unieść.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=Podkadłubowe kręgi zamykają się, a ruch nie pokazuje widocznego migotu.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=Cztery kręgi emiterów krótko odpowiadają ziemi, zostawiając tylko zdyscyplinowaną pryzmatyczną krawędź.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=Emitery piszą równe szmaragdowe pierścienie pod kadłubem, gdy ruch staje się naciskiem.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=Pierścienie jaśnieją, warstwują się i ścinają w miętowozielone odłamki pryzmatu wokół każdej stopy nośnej.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=Każdy emiter otwiera pod reliktem gęstą świetlistą pieczęć, niemal dewocyjną w swojej przemocy.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=Regulator jest złamany; każda stopa nośna może zmusić ziemię, by pamiętała przejazd czołgu.
