[entity-name]
ei-fueler=Wieża tankująca

[item-description]
ei-fueler=Autonomiczna [color=orange]wieża tankująca[/color]. W trybie pojazdów obsługuje pociągi, samochody, czołgi, spidertrony, wieżyczki amunicyjne, wieżyczki artyleryjskie i wagony artyleryjskie. W trybie wyposażenia zasila [color=blue]wyposażenie zasilane paliwem w siatkach wyposażenia pojazdów i graczy, w tym sprzęt reaktorowy zasilany paliwem[/color]. Usuwa też [color=red]pozostałości po spaleniu paliwa[/color]. Wyższa jakość pozwala tej samej wieży obsłużyć więcej celów w tym samym przebiegu aktualizacji, ale nie zwiększa zasięgu; standardowe zasady jakości pojemników nadal zwiększają pojemność ekwipunku. Więcej informacji znajdziesz w wiki Informatron w grze.

[mod-setting-name]
ei_fueler_max_updates_per_tick=Maksymalna liczba aktualizacji wieży tankującej na tick
ei-fueler_range=Zasięg wieży paliwowej

[mod-setting-description]
ei_fueler_max_updates_per_tick=Przestarzałe; zastąpione ustawieniem liczby aktualizacji encji na tick.
ei-fueler_range=Większy zasięg pozwala znaleźć cele znajdujące się dalej. Jednak wydajność spadnie, ponieważ wieże będą musiały skanować większe obszary.

[technology-name]
ei-fueler=Wieża tankująca

[technology-description]
ei-fueler=Wieża tankująca działa w dwóch trybach. Tryb pojazdów obsługuje pociągi, samochody, czołgi, spidertrony, wieżyczki amunicyjne, wieżyczki artyleryjskie i wagony artyleryjskie. Tryb wyposażenia zasila wyposażenie zasilane paliwem w siatkach wyposażenia pojazdów i graczy, w tym sprzęt reaktorowy zasilany paliwem. Użyj GUI wieży, aby wybrać typ celu oraz to, czy wieża ma uzupełniać zasobniki paliwa pojazdów, czy wyposażenie zasilane paliwem w siatkach wyposażenia. Jeśli jest miejsce, wieża pobiera też zużyte paliwo z powrotem do własnego ekwipunku.

[exotic-industries-fueler]
fueler-gui-title=Konsola
fueler-gui-control-title=Sterowanie
fueler-gui-control-description=[font=default-bold]Typ celu[/font] [img=info]
fueler-gui-control-description-tooltip=Wybierz typ celu, który zostanie zatankowany przez wieżę. Inne zmodyfikowane pociągi są obsługiwane przez typ lokomotywy. Inne zmodyfikowane samochody i czołgi są obsługiwane przez typ samochodu. To samo dotyczy wszystkich typów spidertronów.
fueler-gui-equipment-description=[font=default-bold]Miejsce docelowe paliwa[/font] [img=info]
fueler-gui-equipment-description-tooltip=Czy ta wieża ma uzupełniać zasobniki paliwa pojazdów czy wyposażenie zasilane paliwem w siatkach wyposażenia, w tym sprzęt reaktorowy zasilany paliwem?

vehicle=Tylko pojazdy
equipment=Tylko siatki wyposażenia

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=Wieża tankująca
title_exotic-industries-fueler-informatron=Wieża tankująca

welcome=Exotic Industries: Wieża tankująca
welcome-text=Wieża tankująca to zautomatyzowana konstrukcja pomocnicza, która wykrywa pobliskie cele, które może obsłużyć, i podaje im paliwo z własnego ekwipunku.\n\nW trybie pojazdów obsługuje pociągi, samochody, czołgi, spidertrony, wieżyczki amunicyjne, wieżyczki artyleryjskie i wagony artyleryjskie. W trybie wyposażenia zasila wyposażenie zasilane paliwem w siatkach wyposażenia pojazdów i graczy, w tym sprzęt reaktorowy zasilany paliwem. Jeśli jest miejsce, może też pobrać z powrotem zużyte paliwo lub pozostałości po spaleniu.\n\nUżyj GUI, aby wybrać zarówno typ celu, jak i tryb miejsca docelowego paliwa. Jeśli wieża wygląda na bezczynną, najczęstszą przyczyną jest właśnie niedopasowanie tych ustawień: wieża ustawiona na lokomotywy w trybie wyposażenia nie napełni zasobników paliwa pojazdów, a tryb wyposażenia działa wyłącznie na wyposażenie zasilane paliwem wewnątrz siatek.\n\n[font=default-bold]Nie pyta. Służy obwodowi, który jej wyznaczono.\nNie wychodzi poza swój zasięg ani wybrany tryb.\n\nUstaw ją raz, a potem pozwól jej pracować.[/font]


welcome-text-2=Wieże tankujące nadążają za ruchomymi celami, w tym za pociągami w ruchu. Jakość nie zmienia zasięgu ani czasów odświeżania, ale wieże wyższej jakości potrafią obsłużyć więcej celów w tym samym przebiegu aktualizacji, więc lepiej radzą sobie w ruchliwych zajezdniach.\n\nJeśli migracja, interakcja z innym modem albo uszkodzony runtime rozstroi system, administratorzy mogą odbudować jego stan poleceniem /rescan_fuelers. Ekwipunek wieży nadal korzysta ze standardowych zasad jakości pojemników w Factorio, więc lepsza jakość oznacza też więcej miejsca na paliwo i amunicję.\n\n[font=default-bold]Te wieże są wydajne, ale nie wszechwiedzące.\nIm lepsza wieża, tym więcej pracy potrafi wykonać naraz.[/font]
welcome-text-3=W trybie wyposażenia uwzględniany jest też sprzęt reaktorowy zasilany paliwem.
