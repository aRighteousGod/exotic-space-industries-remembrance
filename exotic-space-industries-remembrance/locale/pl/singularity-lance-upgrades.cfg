[lance-upgrades]
axial=Szczelina szerokości __1__ pola sięga do __2__ pól za punkt celowania, w granicach skutecznego zasięgu. Trafia do __3__ dodatkowych wrogich celów wojskowych, zadając każdemu __4__ obrażeń laserowych.
wound=Każde kolejne trafienie główne, które zada obrażenia, wzmacnia następne o __1__%, do +__2__%. Pierwsze trafienie nie ma premii. Zmiana celu lub przerwa co najmniej __3__ s zeruje ranę. Zerowe obrażenia nie dodają kumulacji ani nie przedłużają czasu rany. Obrażenia dodatkowe nie korzystają z premii.
collapse=Zastępuje zwykłe obrażenia obszarowe jednym kolapsem w pierwotnym punkcie celowania po __1__ s: __2__ obrażeń laserowych, promień __3__, do __4__ dodatkowych wrogich celów wojskowych.
testament=Co __1__ opłaconych strzałów: główne obrażenia ×__2__, z premią Pamięci rany; limit osiowy __3__; kolaps __4__ obrażeń laserowych, promień __5__, limit __6__. Strzał liczy się nawet po zniknięciu lub objęciu celu ochroną.
research-row=__1__ (wymaga badań)
protection-title=Ochrona celów
protection=Cel główny jest wykluczony ze wszystkich obrażeń dodatkowych. Własne, neutralne i zaprzyjaźnione siły oraz siły objęte rozejmem są chronione w obu kierunkach. Inny wróg może otrzymać zarówno obrażenia przebicia, jak i obszarowe.
status=Stałe bezpośrednie DPS: __1__ • __2__
baseline=Wersja podstawowa
force-values=Twoje siły • mnożnik obrażeń ×__1__ • główne trafienie __2__ laserowych • stałe bezpośrednie DPS __3__ przed Pamięcią/Testamentem • podstawowy zasięg __4__ pól, zwiększany przez jakość. Poniższe wartości uwzględniają badania obrażeń twoich sił.
base-area=Zwykłe obrażenia obszarowe: __1__ laserowych, promień __2__, do __3__ dodatkowych celów. Zastępowane przez Końcowy kolaps.
rules=Każdy opłacony strzał zadaje obrażenia osobno. Kolaps pozostaje w pierwotnym punkcie celowania mimo ruchu wroga lub usunięcia lancy. Jego parametry ustala moment strzału. Rana wygasa po przerwie, a znak podąża za celem. Testament liczy strzały, nie ofiary. Wystarczą badania czarnej dziury; jej uruchomienie nie jest wymagane. Jakość i obrys celu wpływają na bezpośredni zasięg. Podstawowe efekty są widoczne przy każdej jakości grafiki; ozdobniki nie zmieniają obrażeń.
research-state=__1__ — __2__
active=Aktywne
locked=Zablokowane
prerequisites=Bezpośrednie wymagania:
science=Wymagane pakiety naukowe:
legend-1=Efekt: biało-złota szczelina z dwiema cyjanowymi krawędziami, płynącymi pryzmatycznymi wstęgami i zwężającymi się smugami, sięgająca rzeczywistego końca promienia.
legend-2=Efekt: kolory płyną wzdłuż pęknięcia przy 1–2 ładunkach, rozgałęzień przy 3–4 i przerwanego pierścienia przy 5. Znak podąża za celem i wygasa razem z raną.
legend-3=Efekt: pryzmatyczne smugi spiralnie zbiegają się ku pierścieniowi kurczącemu się w stałym punkcie celowania. Błysk wyznacza chwilę zadania obrażeń.
legend-4=Efekt: ciemny rdzeń wiązki między szerokimi pryzmatycznymi pasmami; ciemny dysk z jasnym pierścieniem akrecyjnym, smugami skierowanymi do środka i końcowym krzyżem.
static-values=Podane obrażenia są wartościami bazowymi, przed badaniami obrażeń lancy. Pamięć i Testament działają warunkowo; nie istnieje jedna stała wartość obszarowych DPS.
