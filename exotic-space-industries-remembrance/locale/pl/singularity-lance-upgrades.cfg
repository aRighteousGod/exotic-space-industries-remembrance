[lance-upgrades]
axial=Centralna szczelina szerokości __1__ pól sięga do __2__ pól za punkt celowania i trafia do __3__ dodatkowych wrogich celów wojskowych, zadając każdemu __4__ obrażeń laserowych. Dwie odnogi rozchodzą się pod kątem ±__5__°; każda ma szerokość __6__ pola i długość do __7__ pól. Wspólnie trafiają do __8__ dodatkowych celów, zadając każdemu __9__ obrażeń laserowych. Wszystkie promienie pozostają w skutecznym zasięgu; każdy wróg otrzymuje najwyżej jedno trafienie przebicia, a centralny promień ma pierwszeństwo.
wound=Główne trafienia zaczynają z premią +__1__% obrażeń. Każde kolejne trafienie, które zada obrażenia temu samemu celowi, zwiększa premię następnego o __1__ punktów procentowych, do +__2__%. Zmiana celu lub przerwa co najmniej __3__ s zeruje serię. Zerowe obrażenia nie dodają kumulacji ani nie przedłużają czasu rany. Obrażenia dodatkowe nie korzystają z premii.
collapse=Zastępuje zwykłe obrażenia obszarowe jednym kolapsem w pierwotnym punkcie celowania po __1__ s: __5__ obrażeń laserowych w promieniu __6__, a poza nim __2__ do promienia __3__. Trafia do __4__ dodatkowych wrogich celów wojskowych oraz cel główny, jeśli nadal znajduje się w obszarze. Obrażenia rdzenia i zewnętrznego obszaru nie sumują się.
testament=Co __1__ opłaconych strzałów: główne obrażenia ×__2__, z premią Pamięci rany; limit centralny __3__, wspólny limit odnóg __7__. Pierwszy kolaps: __8__ obrażeń laserowych w promieniu __9__, a poza nim __4__ do promienia __5__; do __6__ dodatkowych celów oraz kwalifikujący się cel główny. Jedno echo po __10__ s od strzału: __11__ obrażeń laserowych, promień __12__, do __13__ dodatkowych celów oraz kwalifikujący się cel główny. Strzał liczy się nawet po zniknięciu lub objęciu celu ochroną.
research-row=__1__ (wymaga badań)
protection-title=Ochrona celów
protection=Cel główny jest wykluczony ze zwykłych obrażeń obszarowych i wszystkich promieni przebicia, ale może otrzymać obrażenia od każdego kolapsu, gdy znajduje się w jego obszarze, bez zajmowania miejsca w limicie dodatkowych celów. Własne, neutralne i zaprzyjaźnione siły oraz siły objęte rozejmem są chronione w obu kierunkach. Wróg może otrzymać jedno trafienie przebicia oraz jedno trafienie od każdego kolapsu.
status=Bazowe bezpośrednie DPS: __1__ • __2__
status-wound= • Główne trafienie z Pamięcią __1__–__2__
status-testament= • Co __1__ strzałów ×__2__
baseline=Wersja podstawowa
force-values=Twoje siły • mnożnik obrażeń ×__1__ • główne trafienie __2__ laserowych • stałe bezpośrednie DPS __3__ przed Pamięcią/Testamentem • podstawowy zasięg __4__ pól, zwiększany przez jakość. Poniższe wartości uwzględniają badania obrażeń twoich sił.
base-area=Zwykłe obrażenia obszarowe: __1__ laserowych, promień __2__, do __3__ dodatkowych celów. Zastępowane przez Końcowy kolaps.
rules=Każdy opłacony strzał i każdy kolaps zadają obrażenia osobno. Kwalifikacja do centralnego promienia ma pierwszeństwo przed odnogami; nakładające się promienie nigdy nie powielają obrażeń przebicia. Każdy kolaps zadaje obrażenia rdzenia albo zewnętrznego obszaru, nigdy obu naraz. O przynależności do obszaru rażenia i rdzenia decyduje środek celu; cele ze środkiem dokładnie na granicy są uwzględniane. Oba kolapsy pozostają w pierwotnym punkcie celowania mimo ruchu wroga lub usunięcia lancy; wyjście z obszaru pozwala ich uniknąć. Ich parametry ustala moment strzału. Rana wygasa po przerwie, a znak podąża za celem. Testament liczy strzały, nie ofiary. Wystarczą badania czarnej dziury; jej uruchomienie nie jest wymagane. Jakość i obrys celu wpływają na bezpośredni zasięg. Podstawowe efekty są widoczne przy każdej jakości grafiki; ozdobniki nie zmieniają obrażeń.
research-state=__1__ — __2__
active=Aktywne
locked=Zablokowane
prerequisites=Bezpośrednie wymagania:
science=Wymagane pakiety naukowe:
legend-1=Efekt: biało-złota centralna szczelina z cyjanowymi krawędziami i dwiema cieńszymi pryzmatycznymi odnogami wychodzącymi z punktu celowania. Płynące wstęgi i zwężające się smugi wskazują rzeczywisty koniec każdego promienia.
legend-2=Efekt: kolory płyną wzdłuż pęknięcia przy 1–2 ładunkach, rozgałęzień przy 3–4 i przerwanego pierścienia przy 5. Znak podąża za celem i wygasa razem z raną.
legend-3=Efekt: pryzmatyczne smugi spiralnie zbiegają się ku kurczącemu się zewnętrznemu pierścieniowi i widocznej granicy rdzenia w stałym punkcie celowania. Silniejszy centralny błysk wyznacza chwilę zadania obrażeń.
legend-4=Efekt: ciemny rdzeń wiązki między szerokimi pryzmatycznymi pasmami; większy ciemny rdzeń kolapsu i jasny pierścień akrecyjny, a następnie drugie kurczenie i końcowy krzyż oznaczający echo.
static-values=Podane obrażenia są wartościami bazowymi, przed badaniami obrażeń lancy. Pamięć zależy od serii głównych trafień, a Testament od liczby opłaconych strzałów; nie istnieje jedna stała wartość obszarowych DPS.
