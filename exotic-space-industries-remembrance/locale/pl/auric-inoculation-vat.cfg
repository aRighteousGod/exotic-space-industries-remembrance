[recipe-description]
ei-auric-inoculation-vat=Buduje kadź auricznej inokulacji, która przejmuje pobliski basen mokradła, prowadzi cykle inokulacji na Glebie i później wybija z bagna nowe węzły auricznych cyst.
ei-auric-cyst-washing=Myje zebrane auriczne cysty, odzyskuje użyteczny produkt i zawraca część brudnej wody do glebiańskiej pętli.

[technology-name]
ei-auric-marsh-inoculation=Inokulacja auricznych mokradeł

[technology-description]
ei-auric-marsh-inoculation=Odblokowuje glebiańskie kadzie auricznej inokulacji, obsługę cyst i łańcuch ich mycia. Przejmij prawidłowy basen mokradła, podawaj odczynniki cyklu i nie dopuść, by skażenie zawaliło rozkwit.

