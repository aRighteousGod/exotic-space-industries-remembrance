[virtual-signal-description]
ei-auric-vat-vigor=Wysyła bieżący wigor cyklu kadzi w skali od 0 do 100.
ei-auric-vat-contamination=Wysyła bieżące ciśnienie skażenia kadzi w skali od 0 do 100.
ei-auric-vat-band=Wysyła bieżący indeks pasma basenu od 1 do 7, liczony z przejętych kafli mokradła.
ei-auric-vat-claims=Wysyła liczbę kafli mokradłowego basenu aktualnie przejętych przez kadź.
ei-auric-vat-bloom=Wysyła stan rozkwitu: 1 stabilny, 2 napięty, 3 załamany.

