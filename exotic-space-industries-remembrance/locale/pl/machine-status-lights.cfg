[mod-setting-name]
ei-production-machine-lights=Kontrolki stanu budynków produkcyjnych

[mod-setting-description]
ei-production-machine-lights=Dotyczy 28 budynków produkcyjnych ESIR: 23 kontrolki na istniejących wskaźnikach 20 budynków. Osiem budynków bez wskaźników nie otrzymuje kontrolek. W trybie wielobarwnym Bottleneck Lite pomija tylko te 20 budynków; jego ustawienia kolorów nie zmieniają palety ESIR. Efekty produkcji pozostają bez zmian we wszystkich trybach. Poświatą pieca łukowego nadal steruje osobne ustawienie migotania. Soczewki i poświaty mają ten sam kolor: zielony podczas pracy, żółty przy pełnym wyjściu, pomarańczowy przy niedoborze prądu i czerwony podczas innych przestojów z dostępną energią. Bez energii dodatki są niewidoczne. Przywraca 25 oryginalnych białych świateł pracy. Piec łukowy, podgrzewacz plazmowy i odlewnia zachowują oryginalne efekty bez dodatkowych soczewek i poświat. Nie zmienia działania Bottleneck Lite. Bez dodatkowych soczewek i poświat kontrolek. Wskaźniki narysowane na budynkach i efekty produkcji pozostają bez zmian. Nie zmienia działania Bottleneck Lite.

[string-mod-setting]
ei-production-machine-lights-off=Wyłączone
ei-production-machine-lights-status=Wielobarwne kontrolki
ei-production-machine-lights-original=Oryginalne białe światło

