ei-production-machine-lights-status=Soczewki i poświaty mają ten sam kolor: zielony podczas pracy, żółty przy pełnym wyjściu, pomarańczowy przy niedoborze prądu i czerwony podczas innych przestojów z dostępną energią. Bez energii dodatki są niewidoczne. Dotyczy 28 budynków produkcyjnych ESIR: 23 kontrolki na istniejących wskaźnikach 20 budynków. Osiem budynków bez wskaźników nie otrzymuje kontrolek. W trybie wielobarwnym Bottleneck Lite pomija tylko te 20 budynków; jego ustawienia kolorów nie zmieniają palety ESIR. Efekty produkcji pozostają bez zmian we wszystkich trybach. Poświatą pieca łukowego nadal steruje osobne ustawienie migotania.
