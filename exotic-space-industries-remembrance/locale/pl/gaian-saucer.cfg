gaian-saucer-text=[item=ei-gaian-saucer] Spodek Slipwake to gaiańska łódź lewitacyjna: rdzeń dowodzenia Spidertrona pogrzebany w skorupie, która odmawia nóg. Ładownia, krata ekwipunku i napęd karmiony próżnią czynią z niego narzędzie pielgrzyma przekraczającego wrogie progi.
gaian-saucer-2=Rezonans śladu
gaian-saucer-text-2=Obecna przysięga śladu to [font=default-bold]__1__[/font]. Zmienia jedynie chromatyczną pamięć rzucaną za skorupą: jasność rozkwitu slipwake, trwałość blizny skrętu i to, ile przejścia świat ma zapamiętać. Sam statek pozostaje niezmieniony.
