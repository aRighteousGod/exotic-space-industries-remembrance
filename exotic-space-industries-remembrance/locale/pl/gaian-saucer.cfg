[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=Statek pieczętuje swój powidok i przelatuje bez widzialnej pamięci.
ei-gaian-saucer-wake-visual-fidelity-lean=Tylko cienka chromatyczna odmowa podąża za skorupą, krótka i zdyscyplinowana.
ei-gaian-saucer-wake-visual-fidelity-standard=Ślad przemawia wyraźnie, po czym gaśnie, zanim stanie się doktryną.
ei-gaian-saucer-wake-visual-fidelity-cinematic=Ślad rozszerza się, trwa dłużej i zgina razem z przysięgą skrętu.
ei-gaian-saucer-wake-visual-fidelity-maximal=Skorupa zostawia gęstą, świetlistą ranę ruchu wszędzie, gdzie przechodzi.
ei-gaian-saucer-wake-visual-fidelity-unbounded=Zdejmuje się jarzmo; spodek może zapisać każdy poblask, jaki świat zdoła unieść.

