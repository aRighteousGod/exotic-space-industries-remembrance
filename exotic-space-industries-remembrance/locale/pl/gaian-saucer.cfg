[item-description]
ei-gaian-saucer=Szybka gaiańska skorupa lewitacyjna z zamkniętą ładownią, kratą ekwipunku i bez widocznych nóg. Porusza się jak zapamiętany krok i zostawia w śladzie chromatyczne pęknięcie.

[entity-description]
ei-gaian-saucer=Szybka gaiańska rama lewitacyjna zbudowana wokół rdzenia dowodzenia Spidertrona.\nŚlizga się, każąc ziemi pamiętać fałszywe stopy. Gdy przysięga śladu jest silna, za maszyną rozkwita chromatyczny slipwake.

[recipe-description]
ei-gaian-saucer=Zamyka rdzeń sterowania Spidertrona w gaiańskiej skorupie, usuwa wyrzutnie i zostawia silnikowi pamięć ruchu bez kończyn.

[technology-description]
ei-gaian-saucer=Odblokowuje Spodek Slipwake: gaiańską łódź lewitacyjną, której ładownia, krata ekwipunku i chromatyczny ślad czynią z ruchu przysięgę zapamiętaną przez ziemię.

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=Rezonans śladu Spodka Slipwake

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=Określa, jak żarliwie Spodek Slipwake może pamiętać swoje przejście. Przysięga dotyka tylko chromatycznego śladu; ładownia, krata, napęd, skorupa i wykonanie pozostają bez zmian.

