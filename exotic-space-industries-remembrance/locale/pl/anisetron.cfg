[exotic-industries-informatron]
menu_gaian_hierophant=Hierofant Gai
title_gaian_hierophant=Hierofant Gai
gaian-hierophant-intro=Sanktuarium przemienia oddanie w tnący sygnał. Hierofant Gai to powolna, lewitująca katedra z dwiema kryształowymi wiązkami, zbudowana wokół natywnego rdzenia sterowania Spidertrona.
gaian-hierophant-controls=Sterowanie i zaopatrzenie
gaian-hierophant-controls-text=Korzystaj ze zwykłego sterowania Spidertronem, zdalnego wyboru pojazdu i autopilota. Wyposażenie, ładownia, miejsca na zbędne przedmioty i logistyka pojazdu działają przez standardowe interfejsy gry. Ostrzał ręczny i automatyczny rozpoczynają tę samą opłaconą salwę; pojazd może poruszać się podczas strzelania. Stabilizacja lewitacji ogranicza nakładające się spowolnienia, ale obrażenia i bezpośrednie ogłuszenia nadal działają.
gaian-hierophant-weapons=Dwa kryształy, dwa niezależne cele
gaian-hierophant-weapons-text=Przy amunicji normalnej jakości korona zadaje __1__ obrażeń laserowych co __2__ ticków, ma bazowy zasięg __3__ pól i obejmuje __4__ stopni. Fasada zadaje __5__ obrażeń laserowych co __2__ ticków, w zasięgu __6__ pól i przednim sektorze o szerokości __7__ stopni. Każda wiązka utrzymuje prawidłowy cel, a po jego utracie płynnie obraca się ku nowemu. Obrażenia są zadawane dopiero po namierzeniu; samo wizualne przecięcie jednostki wiązką nie czyni z niej celu. Jakość pojazdu zwiększa zasięg korony; zasięg fasady pozostaje stały.
gaian-hierophant-charge=Jeden ładunek, jeden okres ostrzału
gaian-hierophant-charge-text=Jeden [item=ei-anisetron-crystal-charge] opłaca z góry działanie obu wiązek przez __1__ s. Ich łączna bazowa moc wynosi do __2__ obrażeń laserowych na sekundę, gdy oba kanały trafiają, przed uwzględnieniem badań, ulepszeń i odporności. Wyszukiwanie celów i obracanie wiązek zużywają ten sam czas ostrzału; niewykorzystane obrażenia nie są zachowywane ani przekazywane między wiązkami. Uzupełniaj amunicję przez logistykę pojazdu. Opłacony ostrzał trwa dalej po wyczerpaniu amunicji lub zwolnieniu przycisku strzału. Usunięcie pojazdu anuluje pozostałe trafienia; zapadnięcia i echa, których wykonanie już zaplanowano, nadal dochodzą do skutku.
gaian-hierophant-upgrades=Dziedzictwo Lancy
gaian-hierophant-upgrades-text=Jakość amunicji oraz [technology=laser-weapons-damage-6] i dalsze badania wzmacniają obie wiązki. Tylko korona dziedziczy [technology=ei-singularity-lance-axial-rupture], [technology=ei-singularity-lance-wound-memory], [technology=ei-singularity-lance-terminal-collapse] i [technology=ei-singularity-lance-black-hole-testament]: dodatkowe cięcia, narastające obrażenia rany, opóźnione zapadnięcie i wzmocniony impuls co __1__ zaplanowanych impulsów korony. Te ulepszenia nie są wymagane do budowy. W chwili opłacenia ładunku zostają ustalone jego obrażenia, zasięgi, jakość i zbadane ulepszenia; nowe badania wpływają na kolejne ładunki.
gaian-hierophant-construction=Montaż na Gai
gaian-hierophant-construction-text=Zbadaj [technology=ei-anisetron] po Spodku Slipwake, Lancy Osobliwości i Obrażeniach broni laserowej 5. Zmontuj pojazd na Gai, używając pustego podwozia [item=ei-gaian-saucer], jednej [item=ei-singularity-lance] i pozostałych materiałów z przepisu. Najpierw wyjmij wyposażenie i opróżnij podwozie: ten zwykły przepis tworzy nowy pojazd i nie przenosi jego konfiguracji. Ładunki kryształu można wytwarzać na dowolnej powierzchni.
gaian-hierophant-visuals=Rezonans wizualny
gaian-hierophant-visuals-text=Wybrany profil ustawienia startowego: __1__. Steruje zielonymi włóknami ruchu, aureolami wiązek i błyskami trafień. Obie główne wiązki i najważniejsze oznaki ulepszeń pozostają widoczne także po wyłączeniu ozdób. Profil nie zmienia obrażeń, wyboru celów, zasięgu, zużycia ładunków, czasu ostrzału ani ruchu. Wyższe profile pozwalają na więcej ozdób; Uwolniony usuwa te limity i może obniżyć UPS.
