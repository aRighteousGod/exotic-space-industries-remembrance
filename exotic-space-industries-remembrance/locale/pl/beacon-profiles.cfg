[mod-setting-name]
ei-beacon-diminishing-returns=Malejąca skuteczność nadajników

[mod-setting-description]
ei-beacon-overload=Włączone: maszyny zatrzymują się po przekroczeniu limitu przeciążenia. Nadajnik miedziany liczy się jako 1, żelazny jako 2; nadajniki obcych i warp są wyłączone z limitu. Wyłączone: wszystkie cztery typy ESIR stosują wybrany profil malejącej skuteczności.
ei-beacon-diminishing-returns=Działa tylko przy wyłączonym przeciążeniu nadajników. Każdy nadajnik obejmujący maszynę zmniejsza wszystkie efekty modułów przekazywane przez nadajniki ESIR, także zużycie energii i zanieczyszczenie. Wszystkie typy liczą się razem, po jednej sztuce; słaby nadajnik może osłabić silniejsze. Jeden nadajnik zachowuje pełną skuteczność. Liczba modułów, jakość, chłodzenie i paliwo pozostają bez zmian.\nSkuteczność każdego nadajnika przy 1 / 4 / 8 / 16 nadajnikach:\n__1__\nKrzywa podstawowa zachowuje parametry ESIR i wspólne liczenie. Tabele mają 4096 wartości; powyżej tej liczby powtarzana jest ostatnia.

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Łagodny
ei-beacon-diminishing-returns-vanilla=Krzywa podstawowa
ei-beacon-diminishing-returns-strict=Surowy (domyślnie)
ei-beacon-diminishing-returns-harsh=Ostry
ei-beacon-diminishing-returns-severe=Dotkliwy
ei-beacon-diminishing-returns-saturating=Nasycenie

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=Przeciążenie włączone: limit ważony 4 na maszynę. Miedziany liczy się jako 1, żelazny jako 2; obcych i warp są wyłączone z limitu. Profil malejącej skuteczności jest nieaktywny.
overload-disabled=Przeciążenie wyłączone. Aktywny profil: __1__. Wszystkie cztery typy ESIR mają malejącą skuteczność. Każdy nadajnik liczy się raz, niezależnie od typu; słabsze nadajniki mogą zmniejszyć łączną premię.
