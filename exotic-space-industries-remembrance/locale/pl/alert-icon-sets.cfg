[mod-setting-name]
ei-alert-icon-set=Zestaw ikon alertów
ei-alert-icon-set-default=Domyślny zestaw ikon alertów

[mod-setting-description]
ei-alert-icon-set=Wybierz ikony swoich alertów ESIR i ustawień ekologii. „Użyj ustawienia startowego” kopiuje bieżący wybór z ustawień startowych do ustawienia osobistego. Zapisany wybór pozostaje po zmianie ustawienia startowego.
ei-alert-icon-set-default=Początkowy zestaw ikon dla graczy bez zapisanego osobistego wyboru. Istniejące wybory osobiste zostają zachowane. Domyślnie: Renderowane obiekty.

