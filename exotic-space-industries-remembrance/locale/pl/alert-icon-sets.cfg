ei-alert-icon-set-startup-default=Użyj ustawienia startowego
ei-alert-icon-set-original=Pierwotne ikony
ei-alert-icon-set-svg=Sigile z odlewanego metalu
ei-alert-icon-set-rendered=Renderowane obiekty
ei-alert-icon-set-default-original=Pierwotne ikony
ei-alert-icon-set-default-svg=Sigile z odlewanego metalu
