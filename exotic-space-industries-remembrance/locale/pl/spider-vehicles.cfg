weapon-description=Ulepsza tę broń we wszystkich odpowiednich pajęczych pojazdach twojej frakcji. __1__: odstęp między strzałami __2__ tyknięć; zasięg __3__ pól; minimalny zasięg __4__ pól. Korzysta z istniejącej amunicji i jej zwykłych badań. Rzeczywista szybkostrzelność zależy także od przełączania broni i modyfikatorów amunicji.
