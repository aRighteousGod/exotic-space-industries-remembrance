chassis-hull-description=Wspólne ulepszenie: maksymalne zdrowie zwiadowcy wynosi __1__, a szturmowca i pojazdu rakietowego __2__. Zachowuje aktualny procent zdrowia.
chassis-cargo-description=Wspólne ulepszenie: bagażnik zwiadowcy ma __1__ miejsc, a bagażniki szturmowca i pojazdu rakietowego po __2__.
chassis-fuel-description=Wspólne ulepszenie: magazyny paliwa i zużytego paliwa mają po __1__ miejsc u zwiadowcy i po __2__ w pozostałych dwóch pojazdach.
chassis-efficiency-description=Wszystkie trzy pojazdy otrzymują współczynnik wydajności spalania __1__. Każda sztuka paliwa zapewnia więcej użytecznej energii ruchu.
chassis-armor-description=Wszystkie trzy pojazdy otrzymują __1__ punktów procentowych odporności na obrażenia fizyczne i wybuchy ponad własne wartości bazowe, maksymalnie do 90%. Stała redukcja obrażeń pozostaje bez zmian.
chassis-grid-description=Większe siatki wyposażenia: zwiadowca __1__; szturmowiec __2__; pojazd rakietowy __3__. Wyposażenie zostaje zachowane. Zdemontowany pojazd jest przechowywany w wariancie pozwalającym bezpiecznie odtworzyć większą siatkę.
