[entity-name]
ei-scout-spidertron=Pajęczy zwiadowca
assault_spidertron=Pajęczy szturmowiec
[entity-description]
ei-scout-spidertron=Trójnożny pojazd zwiadowczy i logistyczny. Nie ma wbudowanej broni; jego siatka wyposażenia przyjmuje lasery osobiste i pozostałe wyposażenie pancerza. Korzysta ze wspólnych badań podwozia.
assault_spidertron=Pojazd bojowy ery symulacji z działem, karabinem maszynowym i miotaczem ognia. Badania dodają artylerię, ulepszenia broni i automatyczną zasłonę dymną. Korzysta ze wspólnych badań podwozia.
[item-name]
ei-stored-spidertron=__1__ (siatka wyposażenia __2__×__3__)
ei-assault-smoke-charge=Ładunek dymny pajęczego szturmowca
[item-description]
ei-assault-smoke-charge=Przechowuj w bagażniku pajęczego szturmowca. Po zbadaniu zasłony dymnej pojazd zużywa ładunek po silnym trafieniu lub gdy po trafieniu ma mniej niż połowę zdrowia. Spowalnia pobliskich wrogów przez sześć sekund. Odnowienie: 30 sekund.
[technology-name]
ei-spider-vehicles=Pajęcze pojazdy
ei-assault-spidertron=Pajęczy szturmowiec
ei-assault-smokescreen=Automatyczna zasłona dymna
[technology-description]
ei-spider-vehicles=Trójnożne pojazdy zwiadowcze z logistyką, zdalnym sterowaniem i siatką wyposażenia. Otwiera wspólne badania podwozia zwiadowców, szturmowców i pojazdów rakietowych.
ei-assault-spidertron=Pajęcze szturmowce ery symulacji z jednym działem, jednym karabinem maszynowym i jednym miotaczem ognia. Otwiera badania ich broni i zasłony dymnej.
ei-assault-smokescreen=Szturmowiec zużywa ładunek z bagażnika, gdy wrogie trafienie odbierze co najmniej 5% maksymalnego zdrowia albo pozostawi mniej niż 50%. Nieruchoma chmura przez sześć sekund spowalnia o 35% do 64 ruchomych wrogich jednostek w promieniu ośmiu pól. Odnowienie: 30 sekund. Nie zadaje obrażeń ani nie zapewnia niewidzialności.
[spider-vehicles]
controls-title=Uzbrojenie spidertrona
control-cycling=Przełączanie broni
control-cycling-smart=Włączone: serie ognia z doborem broni według zasięgu. Wyłączone: utrzymanie wybranej broni. Nadal obowiązują ustawienia automatycznego celowania.
control-cycling-native=Włączone: standardowe przełączanie broni. Wyłączone: utrzymanie wybranej broni po bezpiecznej wymianie pojazdu.
control-artillery=Artyleria
control-doeworks=Wyrzutnia Doeworks
control-mount-help=Wyjęta amunicja trafia do bagażnika. Ponowne włączenie załaduje pasującą amunicję, jeśli jest dostępna. Zmiana czeka na bezpieczną wymianę pojazdu i wolne miejsce.
