[mod-setting-name]
ei-spider-range-aware-cycling=Przełączanie broni spidertrona według zasięgu

[mod-setting-description]
ei-spider-range-aware-cycling=Po włączeniu przełączania broni w pojeździe wybiera uzbrojenie mogące dosięgnąć celu i prowadzi dłuższe serie ognia. Okresowo wyszukuje pobliskie cele. Po wyłączeniu używa standardowego przełączania bez skryptowego wyszukiwania; różne zasięgi broni mogą zatrzymać cykl.

