[virtual-signal-description]
ei-fusion-set-fuel-1=Wejście obwodu dla paliwa 1. Wartości: 1 prot, 2 deuter, 3 tryt, 4 hel-3, 5 lit-6.
ei-fusion-set-fuel-2=Wejście obwodu dla paliwa 2. Wartości: 1 prot, 2 deuter, 3 tryt, 4 hel-3, 5 lit-6.
ei-fusion-set-temperature=Wejście obwodu dla temperatury. Wartości: 1 niski, 2 średni, 3 wysoki.
ei-fusion-set-injection=Wejście obwodu dla szybkości wtrysku. Wartości: 1 niski, 2 średni, 3 wysoki.
ei-fusion-state-fuel-1=Wyprowadza efektywny indeks paliwa 1.
ei-fusion-state-fuel-2=Wyprowadza efektywny indeks paliwa 2.
ei-fusion-state-temperature=Wyprowadza efektywny indeks temperatury.
ei-fusion-state-injection=Wyprowadza efektywny indeks wtrysku.
ei-fusion-power=Wyprowadza szacowaną moc reaktora w MW.
ei-fusion-neutron-flux=Wyprowadza strumień neutronów pomnożony przez 100.
ei-fusion-efficiency=Wyprowadza procent wydajności.
ei-fusion-coolant-rate=Wyprowadza gorące chłodziwo na sekundę pomnożone przez 100.
ei-fusion-control-agent=Wyprowadza 1 ręczne lub 2 obwód.
ei-fusion-fuel-agent=Wyprowadza 1 poprawne lub 2 skorygowane.
ei-fusion-thermal-agent=Wyprowadza 1 niski, 2 średni lub 3 wysoki.
ei-fusion-coolant-agent=Wyprowadza 1 poprawne zapotrzebowanie chłodziwa lub 3 niepoprawne.
ei-fusion-circuit-agent=Wyprowadza 1 bez przewodu, 2 czytelny lub 3 rozkazujący.
