[exotic-industries-informatron]
menu_fusion_power=Energia syntezy jądrowej
title_fusion_power=Energia syntezy jądrowej
fusion-power=Energia syntezy jądrowej
fusion-power-text=[color=orange]Reaktor termojądrowy[/color] [item=ei-fusion-reactor] to późny system zasilania, który spala lekkie paliwa atomowe w kontrolowanym naczyniu plazmowym.\n\nPracuje w zamkniętej pętli ołowianego chłodziwa: [fluid=ei-cold-coolant] wpływa do naczynia, a [fluid=ei-hot-coolant] wynosi z niego ciężar ciepła. Reaktor jest kosztowny w budowie i głodny w pracy. Po uruchomieniu bezustannie żąda podgrzanych paliw fuzyjnych.\n\nPoczątkowe paliwa to [fluid=ei-heated-protium] i [fluid=ei-heated-lithium-6]. Silniejsze łańcuchy paliwowe prowadzą przez [fluid=ei-heated-deuterium], [fluid=ei-heated-tritium] oraz [fluid=ei-heated-helium-3].\n\nSynteza nie jest czysta. Nie jest darmowa. To uwięziona gwiazda zmuszona do posłuszeństwa przez rury, magnesy i odmowę kapitulacji.
fusion-power-2=Neutrony i Ty
fusion-power-2-text=Reaktor fuzyjny może być również źródłem neutronów. Niska temperatura sprzyja wyciekowi neutronów, średnia utrzymuje kompromis, a wysoka tłumi strumień neutronów, jednocześnie wzmacniając produkcję mocy.\n\nPobliskie [color=orange]kolektory neutronów[/color] [item=ei-neutron-collector] wiążą się z najsilniejszym użytecznym źródłem w zasięgu. Tryb reaktora, odległość i aktywność decydują, ile użytecznego strumienia do nich dociera.\n\nNeutrony nie są ozdobą. Są walutą dla zaawansowanego paliwa fuzyjnego. Buduj blisko, stroić świadomie i nie myl jaśniejszej gwiazdy z bardziej hojną.
menu_fusion_reactor_controls=Sterowanie reaktorem fuzyjnym
title_fusion_reactor_controls=Sterowanie reaktorem fuzyjnym
fusion-reactor-controls=Sterowanie ręczne
fusion-reactor-controls-text=Konsola reaktora pozostawia cztery ręczne ustawienia: paliwo 1, paliwo 2, temperaturę i tempo wtrysku. Razem wybierają zablokowaną ukrytą recepturę, która określa zużycie paliwa, przepływ chłodziwa, szacowaną moc i strumień neutronów.
fusion-reactor-controls-2=Pary paliw i zablokowane receptury
fusion-reactor-controls-text-2=Zapłon jest możliwy tylko dla poprawnych par paliw. Jeśli wybrane drugie paliwo nie reaguje z pierwszym, konsola wraca do pierwszego poprawnego paliwa z uporządkowanej tabeli reaktora zamiast zostawić naczynie w stanie niemożliwym.
fusion-reactor-controls-3=Temperatura i wtrysk
fusion-reactor-controls-text-3=Temperatura i wtrysk to oddzielne dźwignie. Niska temperatura daje dużo neutronów i małą moc. Średnia jest kompromisem. Wysoka tłumi neutrony i kieruje reaktor ku mocy. Niski wtrysk oszczędza paliwo, średni jest stabilny, a wysoki pali mocniej za stromą cenę paliwową.
menu_fusion_reactor_circuit_interface=Interfejs obwodów fuzyjnych
title_fusion_reactor_circuit_interface=Interfejs obwodów fuzyjnych
fusion-reactor-circuit-interface=Ukryty interfejs kombinatora
fusion-reactor-circuit-interface-text=Powierzchnia obwodów reaktora używa tego samego wzorca niewidzialnego kombinatora co inne systemy ESIR. Ukryty interfejs jest wewnętrznie podłączony do widocznego złącza reaktora, publikuje telemetrię i przyjmuje sygnały sterujące, gdy reaktor działa w trybie Circuit.
fusion-reactor-circuit-interface-2=Kontrakt sygnałów odczytu i zapisu
fusion-reactor-circuit-interface-text-2=Tryb Manual ignoruje sygnały zapisu, ale nadal publikuje stan po podłączeniu przewodów. Tryb Circuit czyta [virtual-signal=ei-fusion-set-fuel-1], [virtual-signal=ei-fusion-set-fuel-2], [virtual-signal=ei-fusion-set-temperature] i [virtual-signal=ei-fusion-set-injection]. Wartości paliw to 1 prot, 2 deuter, 3 tryt, 4 hel-3, 5 lit-6. Temperatura i wtrysk używają 1 niski, 2 średni, 3 wysoki. Brakujące lub zerowe pola używają ręcznego ustawienia awaryjnego. Odczyt stanu używa osobnych sygnałów, więc reaktor nie rozkazuje samemu sobie przez echo.
menu_fusion_reactor_agents=Agenci reaktora fuzyjnego
title_fusion_reactor_agents=Agenci reaktora fuzyjnego
fusion-reactor-agents=Stany agentów
fusion-reactor-agents-text=Agenci to zwarte wartości stanu dla obwodów i diagnostyki. Agent sterowania zgłasza władzę Manual albo Circuit. Agent paliwa mówi, czy para jest poprawna lub skorygowana. Agent termiczny zgłasza niski, średni albo wysoki profil utrzymania. Agent chłodziwa mówi, czy receptura ma poprawne żądanie chłodzenia. Agent obwodu zgłasza brak przewodów, odczyt albo wydawanie poleceń.
fusion-reactor-agents-2=Wartości sygnałów
fusion-reactor-agents-text-2=Konwencja liczbowa jest prosta. Agent sterowania to 1 ręczny, 2 obwód. Agent paliwa to 1 poprawny, 2 skorygowany. Agent cieplny to 1 niski, 2 średni, 3 wysoki. Agent chłodziwa to 1 poprawne zapotrzebowanie, 3 niepoprawne lub suche. Agent obwodu to 1 bez przewodu, 2 czytelny, 3 rozkazujący.
menu_fusion_reactor_options=Opcje reaktora fuzyjnego
title_fusion_reactor_options=Opcje reaktora fuzyjnego
fusion-reactor-options=Opcje i ustawienia awaryjne
fusion-reactor-options-text=Opcje są wygodnymi poleceniami nałożonymi na te same cztery ręczne sterowania. Reset przywraca deuter-tryt, średnią temperaturę i średni wtrysk. Odśwież kolektory zmusza pobliskie kolektory neutronów do ponownej oceny reaktora.
fusion-reactor-options-2=Presety i nadpisanie
fusion-reactor-options-text-2=Presety Mocy, Strumienia i Równowagi wybierają sensowne wartości ręczne, nie ukrywając dokładnych kontrolek. W trybie Circuit te wartości pozostają ustawieniem awaryjnym, gdy pole obwodu jest puste, zerowe albo niepoprawne.
menu_fusion_neutron_collectors=Fuzja i kolektory neutronów
title_fusion_neutron_collectors=Fuzja i kolektory neutronów
fusion-neutron-collectors=Relacja z kolektorami neutronów
fusion-neutron-collectors-text=Reaktor fuzyjny i kolektor neutronów łączy siła źródła, aktywność i odległość. Zmiana receptury reaktora zmienia mnożnik neutronowy widziany przez kolektory w zasięgu, dlatego kolejki kolektorów są odświeżane po zmianie trybu reaktora.
fusion-neutron-collectors-2=Presja układu
fusion-neutron-collectors-text-2=Kolektory nagradzają geometrię. Bliski reaktor niskotemperaturowy może karmić produkcję paliwa silnym strumieniem; wysokotemperaturowy reaktor energetyczny może głodzić kolektory, produkując więcej ciepła. Fabryka musi zdecydować, czy jej gwiazda jest generatorem, źródłem rozmnażania, czy precyzyjnie rozdzieloną przysięgą.

