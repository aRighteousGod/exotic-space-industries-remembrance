[mod-setting-name]
ei-container-capacity-profile=Profil pojemności kontenerów

[mod-setting-description]
ei-container-capacity-profile=Ustawia pojemność skrzyń magazynowych, także z innych modów. Liczba miejsc przy normalnej jakości; kolumny: Drewno / Żelazo / Stal / Mały / Średni / Magazyn.\n__1__\n\nWarianty zwykłe, filtrowane i logistyczne tego samego rozmiaru mają jednakową pojemność. Istniejące premie jakości pozostają bez zmian. Ekwipunki służące do działania maszyn są pomijane. Obniżenie ustawienia może zmniejszyć istniejące ekwipunki i spowodować utratę przedmiotów.

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=Miejsca przy normalnej jakości: Drewno __1__ / Żelazo __2__ / Stal __3__ / Mały __4__ / Średni __5__ / Magazyn __6__.

[string-mod-setting]
ei-container-capacity-profile-restrained=Ograniczony (domyślny)
ei-container-capacity-profile-standard=Standardowy
ei-container-capacity-profile-expanded=Rozszerzony
ei-container-capacity-profile-generous=Pojemny
ei-container-capacity-profile-industrial=Przemysłowy
ei-container-capacity-profile-massive=Ogromny
ei-container-capacity-profile-vast=Rozległy
ei-container-capacity-profile-extreme=Ekstremalny

[string-mod-setting-description]
ei-container-capacity-profile-restrained=Miejsca przy normalnej jakości: Drewno 8 / Żelazo 16 / Stal 16 / Mały 24 / Średni 32 / Magazyn 64.
ei-container-capacity-profile-standard=Miejsca przy normalnej jakości: Drewno 8 / Żelazo 16 / Stal 24 / Mały 32 / Średni 64 / Magazyn 128.
ei-container-capacity-profile-expanded=Miejsca przy normalnej jakości: Drewno 16 / Żelazo 24 / Stal 32 / Mały 48 / Średni 96 / Magazyn 192.
ei-container-capacity-profile-generous=Miejsca przy normalnej jakości: Drewno 16 / Żelazo 32 / Stal 48 / Mały 64 / Średni 128 / Magazyn 256.
ei-container-capacity-profile-industrial=Miejsca przy normalnej jakości: Drewno 24 / Żelazo 48 / Stal 64 / Mały 96 / Średni 192 / Magazyn 384.
ei-container-capacity-profile-massive=Miejsca przy normalnej jakości: Drewno 32 / Żelazo 64 / Stal 96 / Mały 128 / Średni 256 / Magazyn 512.
ei-container-capacity-profile-vast=Miejsca przy normalnej jakości: Drewno 48 / Żelazo 96 / Stal 128 / Mały 192 / Średni 384 / Magazyn 768.
ei-container-capacity-profile-extreme=Miejsca przy normalnej jakości: Drewno 64 / Żelazo 128 / Stal 192 / Mały 256 / Średni 512 / Magazyn 1024.
