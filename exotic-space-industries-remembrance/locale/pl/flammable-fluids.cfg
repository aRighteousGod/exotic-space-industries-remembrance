[mod-setting-name]
ei-flammable-rupture-fidelity=Wierność pęknięć palnych płynów

[mod-setting-description]
ei-flammable-rupture-fidelity=Określa, jak gęsto mają być rozgrywane efekty i zagrożenia przy rozerwaniu zbiorników z palnym płynem. Lekki jest krótki i oszczędny. Standard to ustawienie domyślne. Kinowy rozciąga widowisko na więcej pierścieni. Nieograniczony usuwa twarde limity efektów i przy pękaniu wielkich zbiorników może mocno uderzyć w UPS.

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=Lekki
ei-flammable-rupture-fidelity-standard=Standard
ei-flammable-rupture-fidelity-cinematic=Kinowy
ei-flammable-rupture-fidelity-unbounded=Nieograniczony

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Najkrótsze pęknięcie. Cztery pierścienie, ciasne limity, bez akcentu wtórnej rodziny i bez massive-explosion.
ei-flammable-rupture-fidelity-standard=Ustawienie domyślne. Sześć pierścieni, umiarkowane limity, jeden sensowny akcent wtórny i ograniczone massive-explosion.
ei-flammable-rupture-fidelity-cinematic=Osiem pierścieni, większy budżet dymu i ognia, bogatsze akcenty rodzin i wolniejszy rozkwit na zewnątrz.
ei-flammable-rupture-fidelity-unbounded=Usuwa twarde limity wizualne i pozwala planistowi agresywnie opróżniać gotowe pierścienie w tym samym ticku. To tryb dla widowiska, nie dla bezpieczeństwa.

[exotic-industries-informatron]
menu_flammable_ruptures=Palne pęknięcia
title_flammable_ruptures=Palne pęknięcia
flammable-ruptures=Pęknięcie palnego płynu
flammable-ruptures-text=Zbiorniki, rury, podziemne łącza płynowe, wagony i maszyny z płynem mogą rozerwać się przy śmierci, jeśli w środku nadal tkwi dość palnego medium. Runtime odczytuje finalnie załadowane prototypy płynów zamiast ręcznie spisanej listy, więc produkty naftowe, linie gazowe i egzotyczne mieszanki paliwowe zachowują własny język następstw.\n\nWyzwolenie nadal patrzy na typ śmiertelnych obrażeń. Ogień, uderzenie, eksplozja, plazma i inne wysokoenergetyczne zgony dużo łatwiej zapalają rozerwanie niż zimno albo trucizna.
flammable-ruptures-2=Tryb wierności
flammable-ruptures-text-2=Aktualny tryb startowy: [font=default-bold]__1__[/font]\n\n[font=default-bold]Lekki[/font] utrzymuje sekwencję krótką i mocno ograniczoną. [font=default-bold]Standard[/font] jest domyślną drogą publiczną. [font=default-bold]Kinowy[/font] zachowuje większy rozkwit rozłożony na więcej ticków. [font=default-bold]Nieograniczony[/font] usuwa limity i każe planistowi agresywnie wydawać gotowe pierścienie w tym samym ticku.
flammable-ruptures-3=Propagacja i koszt
flammable-ruptures-text-3=Zanieczyszczenie jest nakładane natychmiast po śmierci, ale reszta rozerwania maszeruje teraz na zewnątrz w pierścieniach. Eksplozje, dym, stawianie ognia, ślady spalenizny i obrażenia pobliskich ofiar są liczone raz, a potem uwalniane przez kolejne ticki, więc skupisko ogromnych zbiorników nie próbuje już stworzyć całej apokalipsy w jednej klatce.\n\nDopalenia dla podziemnych par rur przechodzą przez ten sam system kolejki. Nieograniczony jest świadomie niebezpieczny dla wydajności: cztery pełne silo-2 nadal mogą wyglądać wspaniale, ale cenę płacisz ty.
