[mod-setting-name]
ei-flammable-rupture-fidelity=Wierność palnych rozerwań
ei-fluid-safety-ignored-entities=Encje ignorowane przez bezpieczeństwo płynów

[mod-setting-description]
ei-flammable-rupture-fidelity=Określa, jak gęsto rozerwania palnych płynów rozkładają efekty wizualne i propagację zagrożenia. Lekki trzyma wybuch krótko. Standard jest domyślny. Kinowy rozciąga widowisko na więcej pierścieni. Nieograniczony usuwa twarde limity efektów i może mocno uderzyć w UPS, gdy pękają duże zbiorniki.
ei-fluid-safety-ignored-entities=Nazwy prototypów encji, które system bezpieczeństwa płynów i palnych rozerwań ESIR ma ignorować. Rozdzielaj nazwy przecinkami, średnikami, spacjami, tabulatorami albo nowymi liniami. Domyślnie chroni pomocnicze encje Interplanetary Fluid Funnel / Linked Pipe; usuń nazwy, aby znów podlegały zabezpieczeniom ESIR.

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=Lekki
ei-flammable-rupture-fidelity-standard=Standard
ei-flammable-rupture-fidelity-cinematic=Kinowy
ei-flammable-rupture-fidelity-unbounded=Nieograniczony

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Najkrótsze rozerwanie. Cztery pierścienie, ciasne limity efektów, bez drugorzędnego akcentu rodziny i bez massive-explosion.
ei-flammable-rupture-fidelity-standard=Domyślnie. Sześć pierścieni, umiarkowane limity, jeden sensowny akcent drugorzędny i powściągliwe massive-explosion.
ei-flammable-rupture-fidelity-cinematic=Osiem pierścieni, szerszy budżet dymu i ognia, bogatsze akcenty rodzin i wolniejszy ceremonialny rozkwit na zewnątrz.
ei-flammable-rupture-fidelity-unbounded=Usuwa twarde limity wizualne i pozwala planiście agresywnie opróżniać gotowe pierścienie w tym samym ticku. To tryb dla widowiska, nie dla ostrożności.

[exotic-industries-informatron]
menu_flammable_ruptures=Palne pęknięcia
title_flammable_ruptures=Palne pęknięcia

flammable-ruptures=Pęknięcie palnego płynu
flammable-ruptures-text=Zbiorniki, rury, podziemne łącza płynowe, wagony i maszyny z płynem mogą rozerwać się przy śmierci, jeśli w środku nadal tkwi dość palnego medium. Runtime odczytuje finalnie załadowane prototypy płynów zamiast ręcznie spisanej listy, więc produkty naftowe, linie gazowe i egzotyczne mieszanki paliwowe zachowują własny język następstw.\n\nWyzwolenie nadal patrzy na typ śmiertelnych obrażeń. Ogień, uderzenie, eksplozja, plazma i inne wysokoenergetyczne zgony dużo łatwiej zapalają rozerwanie niż zimno albo trucizna.
flammable-ruptures-2=Tryb wierności
flammable-ruptures-text-2=Aktualny tryb startowy: [font=default-bold]__1__[/font]\n\n[font=default-bold]Lekki[/font] utrzymuje sekwencję krótką i mocno ograniczoną. [font=default-bold]Standard[/font] jest domyślną drogą publiczną. [font=default-bold]Kinowy[/font] zachowuje większy rozkwit rozłożony na więcej ticków. [font=default-bold]Nieograniczony[/font] usuwa limity i każe planiście agresywnie wydawać gotowe pierścienie w tym samym ticku.
flammable-ruptures-3=Propagacja i koszt
flammable-ruptures-text-3=Zanieczyszczenie jest nakładane natychmiast po śmierci, ale reszta rozerwania maszeruje teraz na zewnątrz w pierścieniach. Eksplozje, dym, stawianie ognia, ślady spalenizny i obrażenia pobliskich ofiar są liczone raz, a potem uwalniane przez kolejne ticki, więc skupisko ogromnych zbiorników nie próbuje już stworzyć całej apokalipsy w jednej klatce.\n\nDopalenia dla podziemnych par rur przechodzą przez ten sam system kolejki. Nieograniczony jest świadomie niebezpieczny dla wydajności: cztery pełne silo-2 nadal mogą wyglądać wspaniale, ale cenę płacisz ty.
flammable-ruptures-4=Platformy i ciągi rur
flammable-ruptures-text-4=Na platformach kosmicznych rozerwanie zachowuje obrażenia i przechodzenie przez połączone rury, ale nie zamienia się w rozlany po całym pokładzie pożar podłogi. Dym jest ciaśniej skupiony, ślady spalenizny są pomijane, a ogień pojawia się tylko w miejscu rozerwania i na bezpośrednio podpalonych odcinkach rur. Uszkodzenia fundamentu idą tą samą lokalną ścieżką zamiast losowo rozlewać się po pokładzie.
