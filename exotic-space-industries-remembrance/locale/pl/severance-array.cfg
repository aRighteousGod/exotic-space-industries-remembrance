[technology-description]
ei-severance-array=Odblokowuje kwantową wieżyczkę laserową, która przeciąga jeden przysięgły rozbłysk światła po zmieniającym się celowaniu.

[mod-setting-name]
ei-severance-array-visual-fidelity=Wierność wizualna Matrycy Odcięcia

[mod-setting-description]
ei-severance-array-visual-fidelity=Steruje tylko widocznymi świadkami promienia, czasem życia poświaty, ognia i przypaleń, gęstością dźwięku oraz budżetem wizualnym Matrycy Odcięcia. Obrażenia, zasięg, energia, wytrzymałość i koszt receptury pozostają bez zmian. Maksymalny to limitowany tryb do zrzutów ekranu i testów obciążeniowych; Bez ograniczeń usuwa twarde limity wizualne i może zniszczyć UPS.

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=Lekki
ei-severance-array-visual-fidelity-standard=Standardowy
ei-severance-array-visual-fidelity-cinematic=Filmowy
ei-severance-array-visual-fidelity-maximal=Maksymalny
ei-severance-array-visual-fidelity-unbounded=Bez ograniczeń

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=Priorytet UPS: mniej odcinków promienia, krótsze świadectwa oraz mocniejsze limity ognia i przypaleń.
ei-severance-array-visual-fidelity-standard=To profil do codziennej gry: widoczne przecięcia, świadkowane trafienia i ostrożne budżety wykonania.
ei-severance-array-visual-fidelity-cinematic=Bogatsze widowisko: więcej odcinków, więcej świadków oraz dłuższa poświata i przypalenia.
ei-severance-array-visual-fidelity-maximal=To limitowany profil widowiskowy: promienie i świadkowie do zrzutów ekranu, z awaryjnymi ograniczeniami nadal włączonymi.
ei-severance-array-visual-fidelity-unbounded=Usuwa twarde limity wizualne i agresywnie opróżnia gotowe zadania Matrycy. To tryb dla widowiska, nie dla ostrożności.

[item-description]
ei-severance-array=Platforma broni kwantowej 4x4, która zużywa ogromny zgromadzony ładunek, aby wyciąć ruchomą ranę laserową przez formacje wroga.

[entity-description]
ei-severance-array=Platforma broni kwantowej 4x4. Jej natywne uderzenie laserowe niesie krawędź zabijania; przy dużym obciążeniu zanika tylko widoczny ślad celowania.

[exotic-industries-informatron]
menu_severance_array=Matryca Odcięcia
title_severance_array=Matryca Odcięcia
turrets-text-6=[item=ei-severance-array]Matryca Odcięcia to kwantowy protokół ostrza między Wieżyczką plazmową a strategiczną bronią reliktową. Gromadzi kolosalny ładunek, po czym przeciąga jeden widoczny promień od poprzedniego punktu celowania do następnego, gdy natywne uderzenie lasera niesie ekstremalne obrażenia alfa. Ślad ma budżet wizualny: gdy wiele matryc strzela jednocześnie, część odcinków promienia jest tłumiona, aby obrażenia pozostały stabilne.
severance-array=Matryca Odcięcia
severance-array-text=[item=ei-severance-array]Matryca Odcięcia to kompaktowy kwantowy silnik egzekucyjny. Zajmuje fundament 4x4, zużywa ogromny impuls elektryczny i odpowiada na cel, otwierając jasną ranę na polu bitwy zamiast śledzić każdą ofiarę jako osobny pocisk.
severance-array-2=Protokół śladu celowania
severance-array-text-2=Każdy strzał używa zwykłych obrażeń wieżyczki na celu i przekierowuje jeden żywy ślad wizualny tej matrycy. Odcinki promienia są dekoracyjnymi świadkami cięcia, nie źródłem prawdy.
severance-array-3=Zrzucanie obciążenia
severance-array-text-3=Gdy zbyt wiele matryc strzela naraz, runtime dzieli dostępne odcinki wizualne między nie. Pole bitwy może pokazać mniej smug, ale obrażenia pozostają na natywnej ścieżce wieżyczki, zanim czas zostanie wydany na widowisko.
