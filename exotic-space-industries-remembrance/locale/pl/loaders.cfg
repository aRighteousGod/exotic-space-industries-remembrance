[item-description]
ei-steam-loader=Parowa ładowarka z bezpośrednim podawaniem i jednym wspólnym filtrem dla obu pasów taśmy. Przenosi tylko przedmioty nieułożone w stos i wymaga działającej pary.
ei-loader=Ładowarka z bezpośrednim podawaniem i jednym wspólnym filtrem dla obu pasów taśmy. Przenosi tylko przedmioty nieułożone w stos.
ei-fast-loader=Szybka ładowarka z bezpośrednim podawaniem i jednym wspólnym filtrem dla obu pasów taśmy. Przenosi tylko przedmioty nieułożone w stos.
ei-express-loader=Ładowarka z bezpośrednim podawaniem i jednym wspólnym filtrem dla obu pasów taśmy. Stackowanie regulowane do [font=default-bold]2[/font].
ei-turbo-loader=Ładowarka z bezpośrednim podawaniem i dwoma filtrami linii, po jednym na każdą stronę taśmy. Stackowanie regulowane do [font=default-bold]2[/font].
ei-neo-loader=Ładowarka z bezpośrednim podawaniem i dwoma filtrami linii, po jednym na każdą stronę taśmy. Stackowanie regulowane do aktualnego globalnego limitu stackowania taśm.

