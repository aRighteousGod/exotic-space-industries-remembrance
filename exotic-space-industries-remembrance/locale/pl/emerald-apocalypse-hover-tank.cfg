[string-mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=Podkadłubowe kręgi zamykają się, a ruch nie pokazuje widocznego migotu.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Cztery kręgi emiterów krótko odpowiadają ziemi, zostawiając tylko zdyscyplinowaną pryzmatyczną krawędź.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=Emitery piszą równe szmaragdowe pierścienie pod kadłubem, gdy ruch staje się naciskiem.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=Pierścienie jaśnieją, warstwują się i ścinają w miętowozielone odłamki pryzmatu wokół każdej stopy nośnej.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Każdy emiter otwiera pod reliktem gęstą świetlistą pieczęć, niemal dewocyjną w swojej przemocy.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=Regulator jest złamany; każda stopa nośna może zmusić ziemię, by pamiętała przejazd czołgu.

