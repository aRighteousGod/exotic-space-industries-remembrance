[item-description]
ei-emerald-apocalypse-hover-tank=Reliktowa forteca na poduszce, z nieruchomym kryształowym działem i sercem, które odmawia ziemi. Sunie jak nacisk, a potem zostawia szmaragdową ciszę tam, gdzie stała pewność.
ei-emerald-apocalypse-cannon=Kryształowe działo wiązkowe przytwierdzone do kadłuba. Nie śledzi celu. Osądza to, ku czemu zwrócony jest czołg.
ei-emerald-apocalypse-charge=Zapieczętowane kryształowe pęknięcie dla działa Szmaragdowej Apokalipsy. Jedna przysięga, jedno wyładowanie, jedna zielona rana w świecie.

[entity-description]
ei-emerald-apocalypse-hover-tank=Reliktowa forteca zawieszona na szmaragdowych emiterach. Lufa gromadzi nacisk przed strzałem; ładunek odchodzi jako plazma, odrzut i zielona nieobecność tam, gdzie stała pewność.

[technology-description]
ei-emerald-apocalypse-hover-tank=Budzi czołg poduszkowy Szmaragdowej Apokalipsy: unoszącą się maszynę oblężniczą, której nieruchome kryształowe działo zmienia ruch naprzód w doktrynę, a doktrynę w ruinę.
ei-emerald-shard-manifold-1=Podnosi doktrynę odłamków orbitalnych Szmaragdowej Apokalipsy do czterech aktywnych odłamków.
ei-emerald-shard-manifold-2=Wplata drugie wzmocnienie w kolektor odłamków i podnosi doktrynę do pięciu aktywnych odłamków.
ei-emerald-shard-manifold-3=Domyka przysięgę kolektora i pozwala sześciu aktywnym odłamkom odpowiadać czołgowi naraz.
ei-emerald-reload-litany-1=Skraca doktrynę przeładowania odłamków orbitalnych do 0.92 s na odłamek.
ei-emerald-reload-litany-2=Powtarza litanię, aż pierścień odłamków odnawia się co 0.75 s.
ei-emerald-reload-litany-3=Zamyka rytm przeładowania na 0.58 s: mniej czekania, więcej osądu.
ei-emerald-target-verdict=Pozwala odłamkom orbitalnym wybierać gniazda, wieżyczki, bliskich wrogów i już zranione cele zamiast marnować werdykt na mniejsze zagrożenia.
ei-emerald-verdict-aperture-1=Otwiera pierwszą szmaragdową aperturę wokół trafień odłamków, dodając ograniczone obrażenia wtórne.
ei-emerald-verdict-aperture-2=Rozszerza apertury uderzeń odłamków w szerszy wyrok obszarowy.
ei-emerald-verdict-aperture-3=Pozwala werdyktom odłamków stać się szmaragdową raną dość szeroką, by ukarać skupionych wrogów.

ei-emerald-charge-catechism-1=Skraca narastanie apokalipsy do 8.5 s.
ei-emerald-charge-catechism-2=Skraca narastanie apokalipsy do 7.58 s.
ei-emerald-charge-catechism-3=Pieczętuje najszybszy rytm: 6.67 s przed wyzwoleniem.
ei-emerald-inertial-oath-1=Obniża odnowienie po strzale do 13.17 s.
ei-emerald-inertial-oath-2=Obniża odnowienie po strzale do 11.33 s.
ei-emerald-aegis-covenant-1=Zamienia ból tarczy w krótki odwet plazmowy tylko przeciw wrogom.
ei-emerald-aegis-covenant-2=Wzmacnia odwet egidy, gdy membrana zostaje zraniona.
ei-emerald-vector-keel-1=Poprawia sterowność poduszki, zachowując ciężki poślizg.
ei-emerald-vector-keel-2=Ulepsza cofanie, hamowanie i kontrolę dryfu.
ei-emerald-collapse-mandate-1=Zwiększa presję końcowego zapadnięcia w granicach blizny.
ei-emerald-collapse-mandate-2=Przenosi więcej plazmy przez tę samą 52-polową sentencję.
ei-emerald-collapse-mandate-3=Kończy mandat: granica zostaje, werdykt brutalnieje.
ei-emerald-apocalypse-recursion=Odblokowuje niebezpieczne przełączniki czołgu: odzysk, ślady, blizny, rozdzielenie i nadmiar uderzenia.

