[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=Czołg poduszkowy Szmaragdowej Apokalipsy
title_emerald_apocalypse_hover_tank=Czołg poduszkowy Szmaragdowej Apokalipsy
emerald-apocalypse-hover-tank=Czołg poduszkowy Szmaragdowej Apokalipsy
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank] to forteca z późnej ery egzotycznej: zbyt ciężka na grację, zbyt oddana, by spaść. Pierścienie emiterów trzymają kadłub nad światem, a nieruchome działo zmienia kierunek w wyrok.
emerald-apocalypse-hover-tank-2=Ładunek kryształu
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge] jest pojedynczym zapieczętowanym pęknięciem niesionym dla [item=ei-emerald-apocalypse-cannon]. Po strzale czołg nie rozsiewa gniewu. Otwiera jedno zielone przykazanie i pozwala polu bitwy odpowiedzieć.
emerald-apocalypse-hover-tank-3=Doktryna odłamków orbitalnych
emerald-apocalypse-hover-tank-text-3=Odłamki orbitalne są skryptową doktryną, nie wyposażeniem wieżyczki. Kolektor odłamków podnosi pierścień z trzech do sześciu aktywnych odłamków. Litania przeładowania skraca kadencję każdego odłamka z 1.17 s do 0.92, 0.75, a potem 0.58 s. Werdykt namierzania zastępuje prostą bliskość oceną zagrożenia, w której liczą się gniazda, wieżyczki, punkty życia, rany i dystans. Apertura werdyktu poszerza promień i pozwala każdemu trafieniu rozlać ograniczone obrażenia na pobliskie cele albo cele w korytarzu wiązki.
emerald-apocalypse-hover-tank-4=Konsola odłamków
emerald-apocalypse-hover-tank-text-4=Po otwarciu ekwipunku czołgu obok okna pojazdu pojawia się zwarty panel odłamków orbitalnych. Każdy postawiony czołg może utrzymywać od 0 do zbadanego maksimum odłamków. Celowanie rozdzielone rozdziela ich werdykty między najlepsze pobliskie zagrożenia; Focus każe wszystkim aktywnym odłamkom bić w ten sam obecny cel. Pokazany DPS uwzględnia liczbę aktywnych odłamków, powtarzalne poziomy obrażeń broni laserowej 7+ oraz jakość postawionego czołgu.

emerald-apocalypse-hover-tank-5=Doktryna kadłuba
emerald-apocalypse-hover-tank-text-5=Doktryna kadłuba jest skończona. Katechizm ładunku skraca narastanie z 9.48 s do 8.5, 7.58 i 6.67 s; każdy stopień ma własny krótszy dźwięk ładowania. Przysięga bezwładności zmniejsza pieczęć po strzale z 15 s do 13.17 i 11.33 s. Egida odpowiada pobliskim wrogom, stępka poprawia ruch bez utraty poślizgu, a mandat wzmacnia 52-polową falę końcową bez rozszerzania jej granicy.
emerald-apocalypse-hover-tank-6=Odpieczętowane sterowanie
emerald-apocalypse-hover-tank-text-6=Rekursja Apokalipsy otwiera przełączniki dla każdego czołgu. Domyślnie są włączone: odzysk ładunków, ślad stępki, rozgałęzione blizny, rozdzielony ślad i odpieczętowane uderzenie. Wyłącz je na konkretnym czołgu, gdy przysięga ma pozostać wąska.
