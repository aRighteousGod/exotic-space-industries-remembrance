[equipment-description]
ei-emerald-fusion-core-equipment=Zapieczętowane szmaragdowe serce kadłuba Apokalipsy. Rdzeń nie mruczy; on recytuje nacisk.
ei-emerald-aegis-shield-equipment=Pryzmatyczna membrana tarczy związana z przysięgą czołgu. Nadchodząca siła pęka o nią, jakby przypomniała sobie błędną geometrię.

[mod-setting-name]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Rezonans emiterów Szmaragdowej Apokalipsy

[mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Określa, jak gwałtownie migoczą emitery pod kadłubem czołgu Szmaragdowej Apokalipsy. Przysięga dotyka tylko pryzmatycznych pierścieni pod reliktem; reszta pozostaje nienaruszona.

