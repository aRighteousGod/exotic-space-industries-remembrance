[string-mod-setting-description]
ei-terrain-intensity-restrained=Łagodna stosuje mnożnik 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Budżety obliczeń pozostają niezależne.
ei-terrain-intensity-standard=Łagodna stosuje mnożnik 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Budżety obliczeń pozostają niezależne.
ei-terrain-intensity-severe=Łagodna stosuje mnożnik 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Budżety obliczeń pozostają niezależne.
ei-terrain-intensity-custom=Łagodna stosuje mnożnik 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Budżety obliczeń pozostają niezależne.
ei-terrain-performance-ultra-low=Odstęp przetwarzania (tiki): 16. Limit wyszukiwań obiektów: 1; odstęp (tiki): 128. Limity na przebieg: sprawdzone zapisy regeneracji 1, zmiany podłoża 1. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-low=Odstęp przetwarzania (tiki): 16. Limit wyszukiwań obiektów: 1; odstęp (tiki): 64. Limity na przebieg: sprawdzone zapisy regeneracji 2, zmiany podłoża 2. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-lean=Odstęp przetwarzania (tiki): 16. Limit wyszukiwań obiektów: 1; odstęp (tiki): 32. Limity na przebieg: sprawdzone zapisy regeneracji 4, zmiany podłoża 4. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-balanced=Odstęp przetwarzania (tiki): 8. Limit wyszukiwań obiektów: 1; odstęp (tiki): 16. Limity na przebieg: sprawdzone zapisy regeneracji 4, zmiany podłoża 4. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-detailed=Odstęp przetwarzania (tiki): 4. Limit wyszukiwań obiektów: 1; odstęp (tiki): 8. Limity na przebieg: sprawdzone zapisy regeneracji 8, zmiany podłoża 4. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-high-fidelity=Odstęp przetwarzania (tiki): 2. Limit wyszukiwań obiektów: 1; odstęp (tiki): 4. Limity na przebieg: sprawdzone zapisy regeneracji 8, zmiany podłoża 4. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-ultra-high-fidelity=Odstęp przetwarzania (tiki): 1. Limit wyszukiwań obiektów: 2; odstęp (tiki): 2. Limity na przebieg: sprawdzone zapisy regeneracji 16, zmiany podłoża 8. Wspólne dla wszystkich powierzchni; rzeczywista praca zależy od spełnienia warunków.
ei-terrain-performance-custom=Używa indywidualnych odstępów przetwarzania i wyszukiwania, limitów pracy oraz pojemności pamięci. Małe partie i dłuższy odstęp wyszukiwania zmniejszają szczytowe obciążenie, ale spowalniają pokrycie mapy. Zmiana profilu zachowuje zapisaną historię regeneracji.
ei-terrain-wildfire-off=Wyłącza pożary wywoływane przez ekologię. Ślady wypalenia i niezwiązane z nią pożary bojowe pozostają sterowane oddzielnie.
ei-terrain-wildfire-contained=Płomienie bez rozprzestrzeniania, trwające najwyżej 10 sekund. Liczba zapłonów jest ograniczona; inne pożary nie są przejmowane.
ei-terrain-wildfire-spreading=Używa natywnego rozprzestrzeniania ognia. Początkowe zapłony są ograniczone, ale dalsza propagacja silnika nie podlega budżetowi skryptów ESIR i może znacznie obniżyć UPS.

[exotic-industries-informatron]
menu_terrain_evolution=Ewolucja terenu
title_terrain_evolution=Ewolucja terenu

[ei-terrain]
overview=Ewolucja terenu łączy wpływ zanieczyszczenia na glebę, regenerację na podstawie historii, ślady wydobycia i naturalne reakcje drzew. Ogień, linia brzegowa, klify, krew i nawierzchnie mają osobne ustawienia. Nauvis, Gaia i obsługiwane planety zachowują własne rodziny terenu. Inspiracją były TerrainEvolution i TerrainEvolution2.
protections=Zwykłe zmiany gleby respektują nawierzchnie gracza, infrastrukturę, złoża i nieobsługiwany teren. Regeneracja odtwarza zmiany zapisane przez ESIR zamiast zamieniać każdy biom w trawę. Zagrożenia również podlegają ochronie. Wyłączenie funkcji zatrzymuje nowe działania, ale nie cofa wcześniejszych zmian.
calendar=Umowny kalendarz sezonowy korzysta z odległości i orientacji wczytanej mapy gwiezdnej. Nie przemieszcza planet ani nie zmienia całkowitej długości doby. Sezonowa długość dnia i ekologia mają osobne przełączniki. Fulgora zachowuje własny zegar. ESIR oddaje kontrolę nad oświetleniem rozpoznanym zewnętrznym modułom lub po wykryciu obcych zmian.
performance=Małe partie pracy są przetwarzane często. Bardzo niski i Niski ograniczają pracę do minimum; Oszczędny to zachowawczy profil domyślny. Zrównoważony, Szczegółowy, Wysoka wierność i Bardzo wysoka wierność stopniowo zwiększają zakres przetwarzania i koszt dla UPS. Własny używa poszczególnych limitów. Wszystkie budżety są globalne; intensywność i zagrożenia ustawia się osobno.
effective=Stan: __1__; przetwarzanie: __2__; intensywność: __3__
mining-note=Wyczerpanie skończonego złoża w zasięgu obsługiwanej wiertnicy może pozostawić ślad wydobycia; zdarzenie nie wskazuje wiertnicy, która go spowodowała. Domyślnie ślady są trwałe. Ich włączenie, kształt i opcjonalną regenerację przyszłych śladów można ustawić w konfiguracji ekologii.
unsupported=Ta powierzchnia lub funkcja nie jest obsługiwana.
invalid-value=Wartość lub kombinacja ustawień jest nieprawidłowa.
updated=Zaktualizowano ustawienia ekologii.
