[mod-setting-description]
ei-terrain-evolution-enabled=Włącza planetarną ekologię terenu ESIR: zmiany i regenerację terenu zależne od zanieczyszczenia, ślady wydobycia wyzwalane zdarzeniami, osłabianie i odrastanie dzikich drzew oraz sezonową długość dnia. Poszczególne funkcje, przełączniki planet i budżety obliczeń wpływające na UPS można skonfigurować w menu „Ustawienia modyfikacji → Mapa”. Opcjonalne zagrożenia są domyślnie wyłączone; Fulgora zachowuje niezależny moduł cyklu dnia. Wyłączenie zatrzymuje nowe zmiany bez przywracania terenu i przywraca początkowe oświetlenie tylko wtedy, gdy ESIR nadal nim steruje.
ei-terrain-active=Uruchamia ekologię i sezonową długość dnia na włączonych, obsługiwanych powierzchniach. Wyłączenie zatrzymuje nowe działania bez cofania zmian terenu; początkowe oświetlenie jest przywracane tylko wtedy, gdy nie zmienił go inny moduł sterujący.
ei-terrain-intensity=Łagodna stosuje mnożnik tempa 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Intensywność pozostaje niezależna od budżetów obliczeń i nigdy nie włącza wyłączonych zagrożeń.
ei-terrain-performance=Małe partie pracy są przetwarzane często. Bardzo niski i Niski ograniczają pracę do minimum; Oszczędny to zachowawczy profil domyślny. Zrównoważony, Szczegółowy, Wysoka wierność i Bardzo wysoka wierność stopniowo zwiększają zakres przetwarzania i koszt dla UPS. Własny używa poszczególnych limitów. Wszystkie budżety są globalne; intensywność i zagrożenia ustawia się osobno.
ei-terrain-custom-rate-multiplier=Łagodna stosuje mnożnik 0,5, Standardowa 1, a Silna 2. Własna używa ustawionego mnożnika. Budżety obliczeń pozostają niezależne.
ei-terrain-degradation=Stopniowo degraduje obsługiwany naturalny teren według etapów właściwych danej planecie po długotrwałym zanieczyszczeniu. Domyślnie: zanieczyszczenie co najmniej 100 przez pięć minut. Zarodniki Gleby nie są traktowane jako toksyczne zanieczyszczenie.
ei-terrain-recovery=Przywraca wyłącznie zmiany terenu zapisane przez ESIR, odtwarzając dokładną ścieżkę w odwrotnej kolejności. Domyślnie: zanieczyszczenie najwyżej 25 przez dziesięć minut, z odstępem regeneracji czterokrotnie dłuższym niż odstęp degradacji. Zewnętrzna zmiana pola odbiera ESIR kontrolę nad jego regeneracją.
ei-terrain-mining-scars=Wyzwalane przez zdarzenie wyczerpania skończonego zasobu w zasięgu obsługiwanego kamieniołomu lub dużej wiertnicy. Pobliskie ślady trafiają do kolejki i powstają w ramach wspólnych limitów pracy; seria zdarzeń może spowodować pominięcie dodatkowych śladów. Domyślnie są trwałe. Zdarzenie nie wskazuje wiertnicy odpowiedzialnej za wyczerpanie zasobu.
ei-terrain-tree-stress=Powoduje szarzenie obsługiwanych rodzimych dzikich drzew po długotrwałym zanieczyszczeniu i cofa szarzenie kontrolowane przez ESIR po powrocie czystych warunków. Rośliny uprawne i chroniona flora są wykluczone.
ei-terrain-tree-regrowth=Powoli tworzy obsługiwane lokalne drzewa w pobliżu istniejących drzew po dłuższym okresie czystych warunków. Obowiązują limity lokalnego zagęszczenia i ochrona terenu; na Gai gatunki drzew są dobierane do biomu.
ei-terrain-thermal-scars=Drzewa zabite przez ogień mogą pozostawić niewielkie ślady wypalenia terenu, jeśli źródło ognia spełnia wymagania. Ten efekt nie wywołuje pożarów.
ei-terrain-seasonal-daylight=Domyślnie włączone. Sezonowo zmienia czas oświetlenia i natywną produkcję energii słonecznej bez zmiany całkowitej długości doby. Fulgora jest zawsze wykluczona; zamrożona pora dnia i zewnętrzne moduły sterujące mają pierwszeństwo.
ei-terrain-mining-recovery=Domyślnie wyłączone. Zapisuje przyszłe ślady wydobycia na potrzeby regeneracji; wcześniejszych trwałych śladów nie można odtworzyć. Uszkodzenia górnicze zastępują wcześniejsze ścieżki regeneracji ekologicznej.
ei-terrain-aging=Domyślnie wyłączone. Zastępuje obsługiwane żywe drzewa Nauvis rodzimym martwym drewnem. Inne planety są wykluczone, ponieważ nie mają odpowiedniego zatwierdzonego zamiennika. Ta opcja nie wywołuje pożarów.
ei-terrain-rot=Domyślnie wyłączone. Stopniowo usuwa obsługiwane rodzime martwe drewno. Chronione drzewa i miejsca są wykluczone.
ei-terrain-flood=Domyślnie wyłączone. Zamienia obsługiwane piaszczyste pola brzegowe Nauvis w wodę obok istniejącej wody słodkiej. Inne płyny planetarne i chronione obszary są wykluczone.
ei-terrain-drought=Domyślnie wyłączone. Zamienia obsługiwane pola wody przy brzegu Nauvis w piasek obok istniejącego piaszczystego brzegu. Inne płyny planetarne i chronione obszary są wykluczone.
ei-terrain-cliffs=Domyślnie wyłączone. Sporadycznie usuwa zwykłe klify spełniające warunki. Specjalne klify planetarne i chronione obszary są wykluczone.
ei-terrain-blood=Domyślnie wyłączone. Śmierć wrogiej jednostki lub zniszczenie gniazda może cofnąć jeden zapisany etap uszkodzenia pobliskiego terenu. Ślady wydobycia nadal wymagają włączenia ich regeneracji.
ei-terrain-paving=Domyślnie wyłączone. Wymaga efektów krwi: śmierć wrogów może usunąć obsługiwaną kamienną lub betonową nawierzchnię, odsłaniając pole pod nią. Ochrona infrastruktury i pozostałe zasady ochrony nadal obowiązują.
ei-terrain-seasonal-ecology=Domyślnie wyłączone. Sezonowo zmienia tempo degradacji gleby, aktywności i odrastania drzew oraz częstotliwość prób wywołania zagrożeń. Działa niezależnie od kontroli nad sezonową długością dnia i nie włącza wyłączonych zagrożeń.
ei-terrain-wildfire=Domyślnie wyłączone. Zanieczyszczenie może wywoływać ograniczoną liczbę zapłonów. Ograniczone płomienie nie rozprzestrzeniają się i trwają najwyżej 10 sekund; natywne rozprzestrzenianie może przekroczyć budżet pracy skryptu ESIR. Niezwiązane z ekologią pożary bojowe pozostają niezależne.
ei-terrain-planet-nauvis=Włącza ekologię i sezonową długość dnia na Nauvis: etapy degradacji trawy, ziemi, pustyni i piasku, rodzime dzikie drzewa oraz opcjonalne zmiany linii brzegowej. Przełączniki poszczególnych funkcji i zasady ochrony nadal obowiązują.
ei-terrain-planet-gaia=Włącza ekologię i sezonową długość dnia na Gai: odmiany łąk i mokradeł degradują się do odsłoniętej skały Gai, odzyskują zapisane pierwotne odmiany i umożliwiają odrastanie drzew właściwych dla biomu. Specjalnie zaprojektowane miejsca pozostają chronione.
ei-terrain-planet-vulcanus=Włącza ekologię i sezonową długość dnia na Vulcanus, korzystając z etapów przemian popiołu, gleby i spękań wulkanicznych. Lawa jest chroniona; fumarole zachowują niezależne efekty.
ei-terrain-planet-gleba=Włącza ekologię i sezonową długość dnia na Glebie, korzystając z terenu właściwego dla jej biomów i rodzimych dzikich drzew. Zarodniki nie powodują uszkodzeń od toksycznego zanieczyszczenia; rośliny i gleby uprawne oraz baseny auriczne pozostają chronione.
ei-terrain-planet-fulgora=Włącza ekologię terenu na Fulgorze: przemiany skały, piasku, pyłu i wydm. Oceany ropy pozostają chronione. Sezonowa długość dnia nigdy nie steruje Fulgorą; jej niezależny moduł cyklu dnia zachowuje kontrolę.
ei-terrain-planet-aquilo=Włącza ekologię i sezonową długość dnia na Aquilo, korzystając z dozwolonych etapów zagęszczania śniegu i przemian lodu. Oceany amoniaku, fundamenty i infrastruktura pozostają chronione.
ei-terrain-pollution-high=Górny próg rozpoczyna okres narażenia na zanieczyszczenie, a dolny okres czystego powietrza i musi być niższy. Używa lokalnego zanieczyszczenia gry, nie zmieniając go bezpośrednio.
ei-terrain-pollution-low=Górny próg rozpoczyna okres narażenia na zanieczyszczenie, a dolny okres czystego powietrza i musi być niższy. Używa lokalnego zanieczyszczenia gry, nie zmieniając go bezpośrednio.
ei-terrain-mining-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-wildfire-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-flood-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-drought-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-cliff-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-blood-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-paving-probability=Szansa na jedną próbę spełniającą warunki: od 0 (nigdy) do 1 (zawsze). Odpowiednia funkcja musi być włączona. Zasady ochrony nadal obowiązują.
ei-terrain-axial-tilt=Przyjęte nachylenie osi do obliczania sezonowych różnic oświetlenia; domyślnie 23,5 stopnia. Wyższe wartości zwykle wzmacniają różnice między porami roku. Pełne światło dzienne i pełna noc trwają co najmniej po 2% doby; Fulgora jest wykluczona.
ei-terrain-latitude=Przyjęta szerokość geograficzna dla sezonowej długości dnia; domyślnie 45 stopni. Większa odległość od równika wzmacnia różnice sezonowe; znak zamienia lato z zimą. To ustawienie nie przemieszcza graczy ani nie zmienia rotacji planet.
ei-terrain-season-strength=Siła sezonowych zmian tempa procesów ekologicznych. Działa tylko przy włączonej ekologii sezonowej.
ei-terrain-dirty-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-clean-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-soil-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-recovery-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-mining-radius=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-mining-patch-radius=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-tree-growth-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-tree-density-limit=Maksymalna liczba drzew w ustawionym sąsiedztwie, po której naturalne odrastanie zostaje wstrzymane.
ei-terrain-tree-neighborhood=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-tree-stress-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-tree-aging-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-tree-rot-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-hazard-seconds=Opóźnienie lub odstęp w sekundach symulacji. Nadal wymagane są odpowiednie warunki i dostępny budżet przetwarzania.
ei-terrain-wildfire-radius=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-hazard-radius=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-calendar-days=Rok odniesienia w dobach Nauvis o zapamiętanej długości; domyślnie 360. Długość roku każdej planety skaluje się z jej odległością na wczytanej mapie gwiezdnej. Zmiana tego ustawienia zachowuje bieżącą fazę sezonową i nigdy nie zmienia rotacji planet.
ei-terrain-protection-buffer=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-max-depth=Maksymalna liczba etapów degradacji względem zapisanego pierwotnego terenu.
ei-terrain-seed-distance=Odległość lub promień w polach. Zasady ochrony mogą odrzucić miejsce, które spełnia pozostałe warunki.
ei-terrain-interval=Profil Własny: liczba tików między kolejnymi terminami przetwarzania globalnego. Wyższe wartości zmniejszają częstotliwość obliczeń i spowalniają przetwarzanie obszarów; odłożona praca nigdy nie powoduje nagłego nadrabiania zaległości.
ei-terrain-search-interval=Profil Własny: minimalna liczba tików między przydziałami wyszukiwań obiektów, wspólnymi dla wszystkich powierzchni. To osobne ustawienie od odstępu przetwarzania. Mniejsze wartości pozwalają na więcej wyszukiwań i mogą zwiększyć koszt dla UPS. Niewykorzystane przydziały nie kumulują się.
ei-terrain-cold-chunks=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-active-chunks=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-candidates=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-histories=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-writes=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-recovery-reserved=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-searches=Profil Własny: maksymalna liczba wyszukiwań obiektów w przebiegu, gdy upłynął odstęp wyszukiwania. Limit wspólny dla wszystkich powierzchni; niewykorzystane wyszukiwania nie przechodzą na kolejny przebieg.
ei-terrain-result-limit=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-events=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-mining-queries=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
ei-terrain-mining-candidates=Używane w profilu Własny. To skończony, globalny limit pracy współdzielony przez wszystkie powierzchnie, a nie osobny limit dla każdej planety. Wyższe wartości mogą zwiększać obciążenie procesora.
