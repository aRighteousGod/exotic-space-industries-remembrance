[gate-estimator]
route-snapshot=Stała trasa ze stanu bramy
power-draw=Pobór mocy
title=Kalkulator bramy
close=Zamknij
help-launch=Otwiera niezależny kalkulator. Nie zmienia ustawień ani ładunku bramy.
snapshot=Wczytaj stan bramy
help-snapshot=Kopiuje energię, stres, czas chłodzenia, jakość i trasę. Zachowuje wybrany ładunek oraz założenia zasilania.
reset=Zresetuj założenia
help-reset=Gotowość, pełna energia, brak stresu i chłodzenia, 1 przedmiot/s i 1 GW zasilania. Rzeczywista brama pozostaje bez zmian.
item=Przedmiot
help-item=Wybierz dostępny przedmiot. Nic nie jest zużywane. Jakość ładunku nie wpływa na koszt przesyłu.
batch=Rozmiar stosu / maksymalny wkład
help-batch=Ilość do wyceny pojedynczego przesyłu i maksymalny wkład na takt symulacji. Brama wysyła dostępne stosy bez czekania na tę ilość; wkłady mogą się łączyć.
stress=Stres
help-stress=Początkowy stres 0–100, spadający o 1/s. Zwiększa koszt utrzymania i czas chłodzenia, ale nie bezpośredni koszt przesyłu.
quality=Jakość nadajnika
help-quality=Jakość widocznego nadajnika mnoży energię przesyłu i utrzymania przez 1 / (1 + 0,2 × poziom jakości). Jakość ładunku i odbiornika nie ma wpływu.
from=Planeta nadawcza
to=Planeta odbiorcza
help-route=Dwie wybrane planety blokują odległość na wartość z mapy gwiezdnej. Ta sama planeta oznacza tę samą powierzchnię. Usuń jedną planetę, aby ustawić odległość ręcznie. Powierzchnie nie są generowane.
local=Ta sama powierzchnia
orbital=Ta sama lokacja, różne powierzchnie
distance=Odległość międzyplanetarna
unknown=Nierozpoznana trasa między powierzchniami
help-distance=Odległość na mapie gwiezdnej, nie liczba pól ani długość trasy lotu. Ta sama powierzchnia ×0,15; ta sama lokacja ×2,5; trasa nierozpoznana ×3.
rate=Oferowany dopływ
help-rate=Stała podaż. Zablokowane przedmioty czekają przed bramą; faktyczna przepustowość może być niższa. Ułamki kumulują się do pełnych przedmiotów.
per-second=Przedmioty/sekundę
per-minute=Przedmioty/minutę
power=Dostępna moc
help-power=Założone stałe zasilanie, a nie pomiar sieci. Dopływ ogranicza limit ładowania i wolna pojemność bufora.
initial-state=Stan początkowy
help-initial-state=Edytowalne wartości początkowe. Symulowany ładunek i kolejka zaczynają puste. Rzeczywista brama nie jest zmieniana.
energy=Zgromadzona energia (GJ)
help-energy=Początkowa energia. Brama wymaga co najmniej 100 GJ do pracy i energii na opłacenie całego następnego stosu.
cooldown=Chłodzenie (s)
help-cooldown=Początkowy pozostały czas chłodzenia w sekundach gry. Automatyczny wkład i przesył są wstrzymane. Ponowne otwarcie następuje przy kolejnej aktualizacji bramy.
saturation=Nasycenie odbiornika
help-saturation=Początkowo 0–100. Przy 100 przesył staje, ale wkład może być buforowany. Spada o 1,5/s. Wyjście i pozostałości są automatycznie usuwane.
calculation=Obliczenia
projections=Prognozy
burden=Masa przesyłu
help-burden=Waga z tabeli bramy × liczba przedmiotów. Brak wpisu oznacza wagę 1. To nie masa rakietowa.
distance-factor=Mnożnik odległości
help-distance-factor=Międzyplanetarnie: 2,5 + 5,5 × (odległość / maksymalna odległość mapy)^0,6, z ograniczeniem do mapy. Współczynnik zasięgu = (mnożnik − 0,15) / 7,85.
quality-factor=Mnożnik jakości
help-quality-factor=Tylko jakość nadajnika zmniejsza koszt energii. Dodatkowe poziomy jakości używają tego samego wzoru.
toll=Energia przesyłu
help-toll=Ponadliniowy wzrost kosztu zwiększa cenę za przedmiot w większych stosach. Zaokrąglenie w dół następuje tylko raz, po wszystkich mnożnikach.
per-item=Energia przesyłu na przedmiot
help-per-item=Koszt tego przesyłu podzielony przez jego ilość, bez utrzymania. Zależy od rozmiaru stosu.
stress-result=Przyrost / wynikowy stres
help-stress-result=Przyrost najwyżej 35 na przesył, łącznie najwyżej 100. Od 75 konsola pokazuje stan krytyczny poza chłodzeniem.
cooldown-result=Chłodzenie po przesyle
help-cooldown-result=Używa wynikowego stresu. Składniki w taktach są osobno zaokrąglane przed przeliczeniem na sekundy. Aktualizacja, energia lub regeneracja odbiornika mogą dodatkowo opóźnić przesył.
saturation-result=Przyrost / wynikowe nasycenie
help-saturation-result=Masa dodaje najwyżej 20 nasycenia, do limitu 100. Jakość nadajnika nie zmniejsza tej kary.
upkeep-result=Utrzymanie po / przed przesyłem
help-upkeep-result=Gotowa brama: 30 MW + 1,5 MW na punkt stresu + 30 MW podczas chłodzenia, z mnożnikiem jakości. Brak skryptowego utrzymania dla bramy nieaktywnej lub niedoładowanej.
hardware=Bufor: __1__ GJ · Limit ładowania: __2__ MW · Aktualizacja: __3__ s
help-hardware=Natywne limity i stały okres wyliczony z liczby bram oraz budżetu aktualizacji. Zmiany liczby bram mogą zmienić rzeczywisty okres.
fallback=Brak przedmiotu w tabeli mas bramy; używana waga 1.
assumptions=Jeden aktywny nadajnik, jeden przedmiot, jeden odbiornik. Wyjście i pozostałości usuwane; brak innych nadajników. Czas symulacji.
help-assumptions=Uwzględnia nasycenie, utrzymanie, łączenie stosów, chłodzenie i dostępność energii. Pomija psucie, uszkodzenia, zmiany obwodów, ruch podajników, konkurencję sieci i ruchome trasy.
run=Uruchom prognozę
help-run=Oblicza scenariusz i punkt odniesienia. Ograniczona, przerywalna praca. Edycja oznacza poprzednie wykresy jako nieaktualne.
minutes=__1__ min
help-horizon=Czas w minutach gry, taki sam dla porównania.
pin=Zapisz punkt odniesienia
clear-baseline=Usuń punkt odniesienia
help-pin=Zachowuje niezależny scenariusz i stan początkowy. Linia ciągła: bieżący; przerywana: odniesienie. Po zmianie uruchom ponownie.
baseline=Punkt odniesienia
pinned=Punkt odniesienia zapisany
no-baseline=Brak punktu odniesienia
legend=Cyjan: pierwsza seria · Pomarańczowy: druga · Ciągła: bieżący · Przerywana: odniesienie
help-chart=Energia: GJ, czerwony próg 100 GJ. Stres: nadajnik / odbiornik, próg 75. Chłodzenie: pozostałe / odstęp przesyłu. Przepływ: dostarczony / oferowany. Kolejka: przed / w bramie. Moc: przesył / utrzymanie. Pionowe zakresy zachowują ekstrema.
throughput=Przepustowość
queue=Oczekujący ładunek
axis=0–__1__ __2__ · Czas 0–__3__ s
unit-1=GJ
unit-2=%
unit-3=s
unit-4=przedm./s
unit-5=przedmioty
unit-6=MW
sample=__1__–__2__ s: __3__
help-sample=Przesuń kursor czasu. Wartość końcowa [minimum–maksimum] przedziału. Przepustowość i moc są średnimi przedziału.
summary=Dostarczono: __1__ · Średnio: __2__ przedm./s\nPrzed bramą: __3__ · W bramie: __4__\nPrzesył: __5__ GJ · Utrzymanie: __6__ GJ · Średnia moc: __7__ MW\nMinimum energii: __8__ GJ · Szczyt stresu: __9__\nOczekiwanie — chłodzenie: __10__ s; energia: __11__ s; odbiornik: __12__ s\nWytworzone pozostałości: __13__
help-summary=Przyczyny oczekiwania mogą się nakładać; nie sumuj ich. Energia obejmuje tylko zużycie. Pozostałości są liczone i usuwane. Oczekujące przedmioty nie przepadają.
difference=Bieżący − odniesienie: __1__ dostarczonych przedmiotów; __2__ GJ zużycia
help-status=Wycena zmienia się natychmiast. Wykresy pokazują ostatni przebieg i są oznaczane po zmianach. Rzeczywista brama pozostaje bez zmian.
running=Obliczanie…
stale=Prognoza nieaktualna — uruchom ponownie
ready=Prognoza gotowa
invalid=Wpisz skończoną liczbę w dozwolonym zakresie.
missing-prototype=Przedmiot, jakość lub planeta niedostępna. Wybierz zamiennik.
too-expensive=Koszt tego stosu przekracza pojemność bramy. Brama nie dzieli stosów, aby dopasować koszt do dostępnej energii.
