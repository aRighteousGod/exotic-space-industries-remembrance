[mod-setting-name]
ei-arc-furnace-light-flicker-preset=Migotanie światła pieca łukowego

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=Zmienia tylko aktywne światła robocze pieca łukowego. Oryginalne migotanie zachowuje obecny niespokojny łuk. Zredukowane migotanie i Łagodny puls uspokajają efekt. Statyczna poświata zostawia stałe światło. Wyłączone usuwa aktywne światła robocze, ale zachowuje animację pieca i bezczynny czerwony blask kondensatora.

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=Wyłączone
ei-arc-furnace-light-flicker-preset-static=Statyczna poświata
ei-arc-furnace-light-flicker-preset-soft=Łagodny puls
ei-arc-furnace-light-flicker-preset-reduced=Zredukowane migotanie
ei-arc-furnace-light-flicker-preset-original=Oryginalne migotanie

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=Usuwa aktywne światła robocze. Animacja pieca i bezczynny czerwony blask kondensatora pozostają.
ei-arc-furnace-light-flicker-preset-static=Zostawia aktywną poświatę bez migotania.
ei-arc-furnace-light-flicker-preset-soft=Zostawia przygaszony, powolny puls, żeby hale pieców świeciły spokojniej.
ei-arc-furnace-light-flicker-preset-reduced=Zachowuje warstwowe kolory łuku, ale migotanie jest wolniejsze i węższe.
ei-arc-furnace-light-flicker-preset-original=Zachowuje obecne niespokojne światło pieca łukowego.
