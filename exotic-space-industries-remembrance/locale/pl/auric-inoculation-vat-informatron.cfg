title_auric_inoculation_vat=Kadzie auricznej inokulacji
auric-inoculation-vat=Kadzie auricznej inokulacji
auric-inoculation-vat-text=Glebiańska [entity=ei-auric-inoculation-vat] nie podczepia się bezpośrednio do istniejących [entity=ei-auric-cyst-node]. Przejmuje wokół siebie ciągły basen mokradła i zamienia to żywe ciało bagna w proces wsadowy, który później wybija nowe węzły.\n\n[font=default-bold]Ustawienie i przejęcie basenu:[/font] Ta kadź jest dla Gleby. Stawiaj ją tam, gdzie pole przejęcia naprawdę dosięga dość dużej liczby kafli mokradła. Prawidłowy basen wymaga 24-160 połączonych kafli mokradła; większe ciągłe mokradło trzeba przyciąć albo rozdzielić, a samego basenu nie da się współdzielić z inną kadzią. Nakładające się ślady tworzą konflikty, a kadź bez prawidłowego basenu nie ma czego stabilnie inokulować.
auric-inoculation-vat-2=Składniki cyklu i skalowanie pasm
auric-inoculation-vat-text-2=Kadź pracuje w sekwencji [font=default-bold]zasiew -> zalanie -> fermentacja (opcjonalnie wzbogacona biofluxem) -> spust -> rozkwit -> spoczynek[/font], a nie jak bierny dren bagna. Zasiew zużywa [item=spoilage] i [fluid=ei-bio-oil], zalanie zużywa [fluid=ei-dirty-water], a fermentacja zużywa [item=jelly] i [item=yumako-mash]. W oknie wzbogacania podanie [item=bioflux] przełącza ten etap na wzbogaconą fermentację przed spustem i rozkwitem.\n\nRozmiar basenu wyznacza bieżące pasmo. b1 obejmuje 24-39 przejętych kafli, b2 40-55, b3 56-71, b4 72-87, b5 88-103, b6 104-127, a b7 128-160. Wyższe pasma wybijają więcej węzłów cyst, ale wymagają też stabilniejszego zasilania odczynnikami i mocniejszej obsługi wodnej.
auric-inoculation-vat-3=Wigor, skażenie i załamanie rozkwitu
auric-inoculation-vat-text-3=Każdy cykl równoważy [font=default-bold]wigor[/font] i [font=default-bold]skażenie[/font]. Zdrowe baseny, nakarmione fazy i rozsądne ciśnienie pasm trzymają wigor z przodu. Głodzenie, zablokowane spusty, konflikty przejęcia i zajechane kafle mokradła podbijają skażenie i pchają kadź w stan napięcia.\n\nGdy skażenie dobije do progów awarii, stabilność rozkwitu się załamuje. Kadź zaczyna degradować kafle basenu do coraz bardziej martwych stanów mokradła i cofa się ku spoczynkowi zamiast utrzymać czysty rozkwit. Jeśli konsola stale zsuwa się ze stanu stabilnego w napięty, zawęź ślad basenu albo dokarm cykl, zanim bagno padnie pod maszyną.
auric-inoculation-vat-4=Mycie cyst, odzysk brudnej wody i telemetria
auric-inoculation-vat-text-4=Zdrowa kadź później wybija nowe [entity=ei-auric-cyst-node]. Wydobądź z nich [item=ei-auric-cyst], a potem uruchom [recipe=ei-auric-cyst-washing], żeby rozebrać cysty na użyteczny produkt i jednocześnie oddać część [fluid=ei-dirty-water] do szerszej glebiańskiej pętli wodnej. Planuj myjnię, odzysk brudnej wody i miejsce w magazynie razem; wyższe pasma basenu zwiększają zarówno odzysk, jak i plon.\n\nTelemetria obwodowa utrzymuje bagno w czytelnej postaci. Kadź może wysyłać [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims] i [virtual-signal=ei-auric-vat-bloom]. Używaj ich do porównywania śladów basenu, alarmów o konfliktach albo stanach awarii oraz do decyzji, kiedy linia mycia ma rosnąć wraz z następnym pasmem mokradła.
