[item-name]
ei-flamethrower-fuel=Amunicja do miotacza ognia (__1__)
[item-description]
ei-flamethrower-fuel=Obrażenia od ognia: __1__% obrażeń amunicji na ropę naftową. Ogień na ziemi początkowo utrzymuje się przez __2__ s, a przy ciągłym podsycaniu może osiągnąć __3__ s. Czas palenia się trafionych celów pozostaje bez zmian. Miotacze ognia pojazdów zachowują dotychczasowe działanie.
[entity-description]
ei-flamethrower-fuel=Efekty paliwa: __1__. Ogień na ziemi początkowo utrzymuje się przez __2__ s, a przy ciągłym podsycaniu może osiągnąć __3__ s.
[mod-setting-name]
ei-flamethrower-fuel-adaptation=Efekty wieżyczek z miotaczem ognia zależne od paliwa
[mod-setting-description]
ei-flamethrower-fuel-adaptation=Automatycznie dostosowuje płomienie, dym i czas palenia się ognia na ziemi do zużywanego paliwa. Po wyłączeniu wieżyczki używają wspólnych efektów i standardowego czasu palenia; premie do obrażeń oraz warianty amunicji pozostają dostępne. Aktualizacja odbywa się co 16 ticków. Zarówno liczba kontroli paliwa, jak i prób wymiany wieżyczek jest ograniczona do pełnej wartości maksymalnej liczby aktualizacji skryptów na tick. Wyłączenie stopniowo przywraca istniejące wieżyczki w ramach tego limitu. Domyślnie włączone.
