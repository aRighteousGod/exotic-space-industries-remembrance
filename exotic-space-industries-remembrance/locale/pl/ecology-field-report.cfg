feature-unavailable=nie dotyczy tego miejsca
record-help=Liczniki obejmują pomyślne zmiany ESIR, a nie osobne fragmenty terenu ani pełne badanie powierzchni. Ten sam fragment może zmienić się wielokrotnie. Starsze zapisy zachowują sumy, ale mogą nie zawierać czasów aktywności. Licznik pożarów zapisuje zapłony, a nie utracony las.
ground-help=Regeneracja może cofać zapisane zmiany terenu, gdy pozwalają na to warunki. Pokrycie lub zastąpienie podłoża przez inny system może uczynić zapisaną kolejność bezużyteczną; późniejsze usunięcie nie odtworzy zapisu. Infrastruktura, uprawy i specjalne miejsca zachowują ochronę.
ground-conditions=Uszkodzenia gleby wymagają co najmniej __1__ zanieczyszczenia przez __2__; regeneracja wymaga odczytów najwyżej __3__ przez __4__. Nadal potrzebne są wiarygodne obserwacje i oddzielne okazje do działania.
pollution-unavailable=Zanieczyszczenie tego świata nie pozwala ocenić skażenia przemysłowego. Zarodniki Gleby nie są zanieczyszczeniem przemysłowym.
mining-recovery-on=Regeneracja śladów wydobycia jest włączona. Zapisane ślady mogą się regenerować po spełnieniu wymaganych czystych warunków i sprawdzeniu ochrony.
mining-recovery-off=Regeneracja śladów wydobycia jest wyłączona. Zapisane ślady pozostają do włączenia tej opcji lub zastąpienia terenu.
woodland-help=To zapisane zmiany obsługiwanych dzikich drzew. Rośliny uprawne i chroniona flora są wykluczone. Naturalnie szare drzewa same w sobie nie dowodzą szkód od zanieczyszczeń.
woodland-unavailable=Ten świat nie ma obsługiwanych rodzimych lasów dla tych efektów.
other-help=Efekty nadal wymagają odpowiedniego lokalnego terenu i sprawdzenia ochrony. Zmiany linii brzegowej są ograniczone do obsługiwanych par wody słodkiej i brzegu na Nauvis. Korozja nawierzchni ma własne, wyraźnie określone warunki.
survey=Ostatni lokalny odczyt: __1__ temu. __2__\nObserwacje obejmują tylko odwiedzone obszary. Nie wiadomo, czy niezbadany teren jest zdrowy.
survey-none=Brak jeszcze wiarygodnego lokalnego odczytu. Obserwacje obejmują tylko odwiedzone obszary; nie wiadomo, czy niezbadany teren jest zdrowy.
coverage-discovering=Wstępne badanie terenu nadal trwa.
coverage-observed=Wstępny przegląd zakończony; nie jest to pełna ocena stanu środowiska.
coverage-limited=Pokrycie rozpoznania pozostaje ograniczone.
coverage-unknown=Pokrycie rozpoznania nie zostało ustalone.
