guide-summary=Raport Prosty oddziela lokalną dobę od kalendarza sezonowego. Pasek doby pokazuje bieżące granice faz światła na powierzchni i długość pełnego obrotu; pasek pór roku podąża za rocznym kalendarzem ESIR. Szacowany czas pozostały do zmiany korzysta z bieżących ustawień. Fulgora zachowuje niezależny system dnia, a zatrzymany czas lub stały dzień wyłączają zwykłe prognozy. Banery krajobrazów są dekoracyjne. Karty aktywności liczą pomyślne zapisane zmiany, w tym wielokrotne zmiany tego samego fragmentu. Pokazują ostatnią znaną aktywność każdej kategorii; starsze sumy mogą nie mieć zapisanego czasu. Wiek obserwacji i pokrycie opisują ograniczone odczyty terenowe, a nie stan całego świata.
