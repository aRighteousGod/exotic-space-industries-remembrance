clock-help=Czasy podano według symulacji. Pasek zaczyna się od początku pełnego dnia; znacznik pokazuje zaobserwowane miejsce w cyklu. Prognozy wykorzystują bieżące granice i długość cyklu, które inny system sterowania może zmienić. Nie jest to prognoza produkcji energii słonecznej.
no-cycle=Brak dostępnego lokalnego cyklu planetarnego.
invalid-cycle=Nie można wiarygodnie odczytać bieżącego cyklu. Nie przewiduje się przejścia.
seasons=__1__ · minęło __2__% tej pory roku\nPostęp roku: __3__%\nNastępna pora roku za __4__\nDługość roku: __5__\nOdpowiada __6__ lokalnym dobom przy bieżącej długości cyklu.
calendar-help=Kalendarz sezonowy i lokalna doba to oddzielne zegary. Jeden rok kalendarzowy odpowiada __1__ dniom odniesienia. Przeliczenie na lokalne doby korzysta z dzisiejszej długości cyklu, a nie z liczby minionych obrotów.
no-calendar=Kalendarz sezonowy niedostępny.
