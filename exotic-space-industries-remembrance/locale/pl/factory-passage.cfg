[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=Domy?lnie wy??czony. Obserwuje automaty montażowe z natywnym wyborem receptury przez obwód, gdy ich okno jest zamknięte. Po wyłączeniu zmiany obwodu mogą pozostawić nieaktualne kolizje złączy do następnego zdarzenia lub jawnego odświeżenia. Otwarte okna i aktualizacje zdarzeniowe nadal działają. Zmiana obowiązuje od następnego taktu obsługi, bez przebudowy. Skaner nie działa poza trybem ESIR, przy wyłączonych przejściach lub pierwszeństwie Squeak Through 2.
ei-factory-passage-circuit-scan-budget=Dodatkowe próby skanowania na takt dla całego zapisu (1–1024; domyślnie 1), niezależnie od głównego budżetu. Po udanym sprawdzeniu receptury lub zakończonej aktualizacji maszyna czeka co najmniej 60 taktów na kolejne skanowanie w tle. Mniejsze wartości ograniczają pracę skryptu, ale opóźniają kolizje; większe szybciej opróżniają kolejkę i mogą zwiększyć koszt taktu. Żaden budżet nie gwarantuje czasu w milisekundach. Bez restartu; wartość pozostaje zapisana po wyłączeniu skanera.
ei-factory-passage-update-budget=Maksymalna liczba zadań z kolejki przetwarzanych na tick (1–1024; domyślnie 256). Niższe wartości zmniejszają obciążenie skryptami, ale opóźniają aktualizacje kolizji rur. Wyższe wartości szybciej opróżniają kolejki i mogą wydłużyć czas obliczeń na tick. Obowiązuje natychmiast na wszystkich powierzchniach, bez ponownego uruchomienia gry. Początkowe wyszukiwanie obiektów w świecie i usuwanie pomocniczych obiektów kolizji odbywają się synchronicznie i nie podlegają temu limitowi. Ustawienie jest nieaktywne poza trybem rur ESIR, po wyłączeniu przejść między obiektami fabryki lub gdy pierwszeństwo ma Squeak Through 2.
ei-factory-passage-enabled=Umożliwia przechodzenie między obsługiwanymi obiektami fabryki ustawionymi obok siebie. Wyłączenie cofa wszystkie zmiany przechodzenia wprowadzone przez ESIR, zachowując wybór kategorii.
ei-factory-passage-production=Umożliwia przechodzenie między sąsiadującymi maszynami produkcyjnymi, wiertnicami, laboratoriami i podobnymi obiektami.
ei-factory-passage-power=Umożliwia przechodzenie między sąsiadującymi generatorami, kotłami, reaktorami, akumulatorami, panelami słonecznymi i urządzeniami elektrycznymi.
ei-factory-passage-logistics=Umożliwia przechodzenie między sąsiadującymi magazynami, podajnikami, urządzeniami sieci sterowniczej, nadajnikami, radarami, roboportami i przystankami kolejowymi.
ei-factory-passage-turrets=Umożliwia przechodzenie między sąsiadującymi wieżyczkami zbudowanymi przez gracza.
ei-factory-passage-pipe-mode=Waniliowy: zachowuje pierwotne kolizje rur.\nSqueak Through: pozwala przechodzić między sąsiadującymi odcinkami rur, również przez połączenia. Środki rur pozostają nieprzechodnie.\nESIR: pozwala przechodzić przez niepołączone szczeliny, ale połączenia naziemne pozostają nieprzechodnie. Nowa blokada połączenia pojawia się dopiero po opuszczeniu jej miejsca przez postacie. Odcinki podziemne i rury cieplne, przez które można już przechodzić, pozostają przechodnie.

