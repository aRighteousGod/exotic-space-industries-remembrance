[ei-factory-passage-guide]
walking-heading=Przechodzenie między maszynami
walking=Inżynier też potrzebuje miejsca. Przejścia zwężają kolizje obsługiwanych budynków produkcyjnych, energetycznych, logistycznych i wieżyczek, aby można było przechodzić między sąsiadami. Środki pozostają nieprzenikalne. Mury, bramy, przeszkody terenowe, pojazdy, wrogowie, obiekty poza siatką i niewidoczne obiekty pomocnicze zachowują swoje kolizje.
modes-heading=Wybór trybu rur
modes=Vanilla zachowuje kolizje dostarczone przez grę i inne mody. Squeak Through pozwala przechodzić przez sąsiadujące złącza bez dodatkowego moda. ESIR blokuje rzeczywiste połączenia nadziemne, pozostawiając niepołączone szczeliny otwarte. Odcinki podziemne nie otrzymują barier. Zwykłe rury łączą się także bokami: stykające się rzędy tworzą połączoną siatkę, a nie alejkę.
controls-heading=Gdzie znaleźć ustawienia
controls=Kategorie i tryb rur są ustawieniami startowymi i wymagają restartu. Tempo pracy zmienisz w Ustawienia modów → Mapa albo Administracja → Opcje → Wydajność. Oba miejsca zmieniają te same wartości dla całego zapisu. Główny budżet (domyślnie __3__) obejmuje aktualizacje końców, ponowne próby zajętych złączy i obserwację okien. Wstępne wyszukiwanie oraz natychmiastowe usuwanie obiektów pomocniczych pozostają synchroniczne.
recipes-heading=Zmiany receptur
recipes=Budowa, obrót, wklejenie ustawień i inne obsługiwane zdarzenia zlecają lokalne aktualizacje. Otwarte natywne okno maszyny umożliwia szybkie sprawdzanie receptury. Automaty montażowe z natywnym wyborem receptury przez obwód i zamkniętym oknem korzystają ze skanera w tle. Zamknięte maszyny ustawiane ręcznie nie są okresowo sprawdzane. Inne mody zmieniające receptury lub wybór obwodowy bez zdarzeń muszą wywołać istniejący mechanizm odświeżania.
scanner-heading=Dostrajanie skanera
scanner=Skaner jest domy?lnie wy??czony. Poni?sze limity obowi?zuj? po jego w??czeniu. Budżet obwodów wynosi domyślnie __1__ próbę na takt, dodatkowo do głównego budżetu. Po udanym sprawdzeniu lub ukończonej aktualizacji każda maszyna czeka __2__ taktów; okna i zdarzenia omijają ten odstęp. Przy normalnej prędkości daje to najwyżej __4__ próby na sekundę w całym zapisie. Stabilna grupa 600 maszyn wymaga więc około __5__ sekund na pełny obieg. To przykład, nie gwarancja czasu reakcji: zaległe aktualizacje mogą dodać opóźnienie. Zwiększ wartość, aby przyspieszyć aktualizacje, lub zmniejsz ją, by ograniczyć pracę. Budżety nie gwarantują czasu taktu.
troubleshooting-heading=Wyłączanie skanera i rozwiązywanie problemów
troubleshooting=Po wyłączeniu skanera zmiany obwodów zamkniętych maszyn mogą pozostać nieodzwierciedlone; okna i zdarzenia nadal działają. Sprawdź, czy przejścia są włączone i wybrano tryb ESIR. Squeak Through 2 ma pierwszeństwo. Jeśli złącze czeka na odejście postaci, odsuń się. Uprawniony administrator może użyć Diagnostyka → Przejścia fabryczne → Napraw albo /ei-admin-repair factory-passage, aby odbudować śledzenie bez wymiany maszyn.
current-heading=Bieżące ustawienia
current=Wybrany tryb: __1__\nEfektywny tryb: __2__\nPowód nieaktywności: __3__\nGłówny budżet: __4__ na takt\nSkaner obwodów: __5__\nDodatkowy budżet obwodów: __6__ na takt\nPodgląd odświeża się po ponownym otwarciu strony.
