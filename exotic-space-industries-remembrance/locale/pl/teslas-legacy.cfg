ei-waveform-harmonics-1-effect=Harmoniki falowe I: zharmonizowana semantyka trafienia i pierwszy wspólny bonus mostu.
ei-waveform-harmonics-2-effect=Harmoniki falowe II: nowoczesne rodziny łańcuchowych wyładowań odblokowują się dla cewek Legacy i zmostkowanej rodziny tesli.
ei-waveform-harmonics-3-effect=Harmoniki falowe III: pełny język dalszych łuków ze Space Age i mocniejsze łańcuchy zmostkowanej wieży.
ei-storm-lattice-1-effect=Krata burzowa I: podstawowa cewka zyskuje szerszą propagację łuku pola i lepsze przekazywanie celu.
ei-storm-lattice-2-effect=Krata burzowa II: podstawowa cewka utrzymuje gęstsze sieci łuków pod większą presją.
ei-storm-lattice-3-effect=Krata burzowa III: podstawowa cewka staje się prawdziwą wieżą tłumienia końca gry.
ei-dielectric-rupture-1-effect=Przebicie dielektryczne I: zaawansowane wyładowania wtórne zachowują więcej ładunku po potwierdzonym zabiciu.
ei-dielectric-rupture-2-effect=Przebicie dielektryczne II: zaawansowane wyładowania wtórne sięgają dalej i pewniej podpalają.
ei-dielectric-rupture-3-effect=Przebicie dielektryczne III: zaawansowane cewki zamieniają potwierdzone zabicia w krótkie burze egzekucyjne.
ei-bridge-coupling-1-effect=Sprzężenie mostu I: późne obrażenia mostu rosną, ale waniliowa rodzina tesli nie zapada się w doktrynę TL.
ei-bridge-coupling-2-effect=Sprzężenie mostu II: replika fulgoriańskiej wieży dziedziczy cięższy późny zysk z mostu.
ei-reactance-overdrive-1-effect=Przeciążenie reaktancji I: czołg Tesli poszerza obwiednię niestabilności i wyrzuca więcej łuków nasycenia.
ei-reactance-overdrive-2-effect=Przeciążenie reaktancji II: czołg Tesli utrzymuje dłuższe przeciążenie i cięższe wyładowania burzowego frontu.
ei-reactance-overdrive-3-effect=Przeciążenie reaktancji III: czołg Tesli osiąga ostateczną brutalność ery fuzyjnej z podwójną cewką.
ei-exotic-waveform-convergence-effect=Egzotyczna konwergencja falowa: cewki Legacy odblokowują egzotyczne serie odgałęzień, burz egzekucyjnych i burzowego frontu, a replika fulgoriańska zyskuje wieżowy egzotyczny rozkwit poimpulsowy.

