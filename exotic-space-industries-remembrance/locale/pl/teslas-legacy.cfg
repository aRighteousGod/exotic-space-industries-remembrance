[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=Opcjonalna lżejsza ścieżka. Używa właściwej dla TL siatki doktryny jako głównej ścieżki kontynuacji, trzyma pomocniki mostu osobno i wycofuje oryginalną rekursję pomocniczą, żeby poprawić UPS.
ei-tl-behavior-mode-legacy-fidelity=Domyślne. Dokładne zachowanie oryginalnego Tesla's Legacy. Przywraca starą rekursję pomocniczą, trwałość pomocników, czyszczenie timerem, pochodzenie od obrażeń, pośmiertne wyładowania po zabiciu i przepływ zmienności czołgu bez oglądania się na koszt UPS.
tl-advanced-attack-anim-charge-up=Przy tej animacji jasna energia wspina się w górę rdzenia zaawansowanej cewki Tesli. Wieża strzela, gdy energia dotrze do szczytu cewki. Czasami może to powodować opóźnienie w zmianie celu, gdy wieża A zabije przeciwnika, zanim wieża B skończy przygotowanie.
tl-advanced-attack-anim-simple=Przy tej animacji prąd zaczyna przeskakiwać między cewkami, gdy w pobliżu pojawią się wrogowie. Cewka strzela natychmiast.

