[technology-description]
tl-basic-tesla-coils-technology=Cewka Tesli to rezonansowy transformator elektryczny zmodyfikowany tak, by razić pobliskich wrogów wyładowaniami wysokiego prądu. Zadaje umiarkowane obrażenia bezpośrednie, ale może wpływać na kilka celów naraz.
tl-advanced-tesla-coils-technology=Znacznie ulepszona wersja cewki Tesli. Ma większy zasięg, dużo wyższe obrażenia i cięższe opancerzenie poprawiające przeżywalność.
tl-tesla-tank-technology=Śmiercionośny wariant czołgu wyposażony w dwie średnie zaawansowane cewki Tesli. Przenośne cewki Tesli dostarczają impuls energii potrzebny do jednoczesnego odpalenia obu dział.
ei-tesla-weapons=Technologia łukowa odtworzona metodą odwrotnej inżynierii z przedupadkowych fulgorańskich skarbców badawczych. Oryginalne zasady nadal są zrozumiane tylko częściowo, ale inżynierom udało się zrekonstruować działającą imitację zdolną do kierowania ustabilizowanymi łukami elektrycznymi w stronę wrogich celów. Moc, sprawność i wzorce wyładowań pozostają słabsze od prawdziwych fulgorańskich projektów, lecz wciąż znacznie przewyższają konwencjonalną broń elektromagnetyczną. Dalsze ulepszanie będzie ograniczone, dopóki autentyczne fulgorańskie schematy nie zostaną odszyfrowane.
tl-tesla-ammo-upgrade-technology=Postęp w technologii przenośnej cewki Tesli ujawnił słabości konstrukcyjne podstawowej cewki. Usunięcie tych wad daje sprawniejsze cewki Tesli i szerszą poprawę ich ogólnych możliwości.
tl-tesla-coil-damage-technology=Skuteczne obrażenia łuku błyskawicy generowanego przez cewkę Tesli można zwiększyć, instalując silniejsze kondensatory i wprowadzając lekką oscylację częstotliwości prądu.
tl-tesla-coil-shooting-speed=Ostatnie ulepszenia wydajności baterii można przenieść na projekty cewek Tesli, dzięki czemu szybciej osiągają pojemność krytyczną i skutecznie zwiększają szybkostrzelność.
tl-flames-explosion-technology=Przez wyładowania cewki Tesli przepływa tyle energii, że potrafią podpalić samo powietrze. Krótkotrwała reakcja łańcuchowa przybiera postać gwałtownej ognistej eksplozji.\n\nKażdy poziom „Erupcji” zwiększa obszar działania eksplozji.\n\nObrażenia: 60% obrażeń wieży.
tl-flames-count-technology=Gdy sucha ziemia i cząstki pyłu zapalają się od bardzo wysokiego natężenia prądu, wynikiem jest zaskakująco gwałtowna reakcja spalania. Płomienie trwają tylko kilka sekund, ale wytwarzają niebezpieczne ilości ciepła i zwęglają wszystko dookoła.\n\nKażdy poziom „Błyskawicznego ognia” zwiększa liczbę generowanych płomieni i ich obrażenia na sekundę.
tl-flames-probability-technology=Ekstremalne poziomy skupionej energii potrafią zapalić roślinność na ziemi, cząstki pyłu, a nawet samo powietrze.\n\nKażdy poziom „Spalania” zwiększa szansę podpalenia celu cewki Tesli i jego najbliższego otoczenia.
tl-single-zap-count-technology=Gdy stworzenie zostaje trafione przez zaawansowaną cewkę Tesli, może pochłonąć ogromną ilość energii statycznej. Takie przeciążenie może gwałtownie zniszczyć nosiciela. Jeśli po jego śmierci część ładunku wciąż pozostaje, wystrzeliwuje on w stronę pobliskiego oporu. Zjawisko to nazywa się wyładowaniem wtórnym.\n\nKażdy poziom „Wyładowania” zwiększa liczbę wyładowań wtórnych uwalnianych, gdy wieża zabije wroga.
tl-single-zap-damage-technology=Gdy po zniszczeniu celu pozostaje ładunek elektryczny, przekształca się on w wyładowanie wtórne. Niesie ono tylko część początkowego ładunku, ale pozostałą energię można wzmocnić poprzez precyzyjne dostrojenie ogólnego poziomu rezonansu cewki Tesli.\n\nKażdy poziom „Ciężkiego pioruna” zwiększa obrażenia zadawane przez wyładowania wtórne.
tl-single-zap-probability-technology=Zaawansowane cewki Tesli przewodzą niewiarygodne ilości energii elektrycznej. Jeśli cel nie jest w stanie utrzymać takiego prądu, przelewa się on przez zjonizowane cząsteczki powietrza jako osobne łuki błyskawicy, rażąc pobliskie obiekty.\n\nKażdy poziom „Nadładowania” zwiększa prawdopodobieństwo powstania dodatkowych łuków błyskawicy za każdym razem, gdy zaawansowana cewka Tesli zabije wroga.
tl-multi-zap-range-technology=Wyższe natężenia prądu w cewkach zwiększają liczbę zjonizowanych cząstek w otaczającym polu statycznym. Dzięki temu ładunek łatwiej przechodzi przez powietrze i sięga dalszych celów.\n\nKażdy poziom „Jonizacji” zwiększa efektywny zasięg propagacji ładunku.
tl-multi-zap-damage-technology=Precyzyjne dostrojenie długości fali emitowanej skupionej energii pozwala tworzyć stabilniejsze i bardziej niszczące łuki błyskawicy, gdy ładunek propaguje się w polu statycznym.\n\nKażdy poziom „Pioruna” zwiększa obrażenia propagujących się ładunków.
tl-multi-zap-probability-technology=Ciągłe używanie cewki Tesli nasyca jej otoczenie zjonizowanymi cząstkami. To właśnie one pozwalają prowadzonemu ładunkowi minąć pierwotny cel i przeskoczyć na pobliskie obiekty.\n\nKażdy poziom „Pola statycznego” zwiększa szansę propagacji ładunku do każdego pobliskiego wroga.
tl-slowdown-duration-technology=Silniejsze prądy energii wywołują mocniejsze efekty, które dłużej utrzymują się w trafionym celu.\n\nKażdy poziom „Trwałości” zwiększa czas działania efektów „Elektroshoku”.
tl-slowdown-multiplier-technology=Określone poziomy energii połączone z wysokimi częstotliwościami mogą wywoływać skurcze mięśni, które poważnie utrudniają ruch.\n\nKażdy poziom „Ogłuszenia” zwiększa siłę „Elektroshoku” i jeszcze bardziej spowalnia ruch.
tl-slowdown-probability-technology=Bezpośredni kontakt z prądem elektrycznym może wywoływać skutki fizjologiczne i neurologiczne, takie jak skurcze mięśni czy paraliż.\n\nWyższe poziomy „Elektroshoku” sprawiają, że te skutki uboczne częściej pojawiają się przy każdym ataku.
tl-volatility-modulation-technology=Jonizacja jest powszechną techniką zwiększania skuteczności wojskowych systemów opartych na prądzie elektrycznym. Gdy podwójne cewki są jonizowane naprzemiennymi częstotliwościami, w profilu energetycznym pojawia się wzór synergiczny. Ten efekt, zwany bionizacją, znacznie poszerza obwiednię niestabilności danego prądu.\n\nKażdy poziom „Bionizacji” obniża możliwe minimalne obrażenia, jednocześnie mocno podnosząc możliwe maksimum.
tl-volatility-probability-technology=Niestabilna natura prądu podwójnej cewki zostaje zmaksymalizowana dzięki zintegrowanemu regulatorowi amplitudy. W praktyce generowane pioruny zyskują dość energii, by całkowicie zdezintegrować każde stworzenie mniejsze od średniej wielkości mieszkania.\n\nKażdy poziom „Waporyzacji” zwiększa szansę natychmiastowego zabicia celu. Cele mające więcej niż 5000 punktów życia zostają zamiast tego ciężko ranne.
ei-waveform-harmonics-1=Stroi pierwszy wspólny profil wyładowania między cewkami Legacy a zmostkowaną rodziną tesli. Główny wygląd TL jeszcze pozostaje dawny, ale linia zaczyna mówić jednym elektrycznym dialektem: lepszy odzew trafienia, czystsza semantyka mostu i pierwszy bezpośredni crossover do teslaguna, amunicji tesla i repliki fulgoriańskiej.
ei-waveform-harmonics-2=Rozciąga tę wspólną falę na nowoczesne rodziny łańcuchowych wyładowań wtórnych. Podstawowe cewki dostają zharmonizowaną propagację łuku pola, zaawansowane cewki przechodzą na nowocześniejsze rodziny wyładowań po zabiciu, a zmostkowana rodzina tesli może wreszcie używać prawdziwych łańcuchowych serii.
ei-waveform-harmonics-3=Domyka kręgosłup harmoniczny. Łuki wtórne przyjmują pełny język łańcuchów ze Space Age, zmostkowana wieża otrzymuje cięższą późną nagrodę po stronie wieży, a gałąź Legacy jest wreszcie gotowa na prawdziwą specjalizację doktrynalną zamiast samej drabinki statystyk.
ei-storm-lattice-1=Podstawowa cewka przestaje być „po prostu pierwszą wieżą tesli” i staje się pełnoprawną doktryną kontroli. Krata burzowa I poprawia przekazywanie celu i rozszerza sieć propagowanych łuków, aby roje pozostawały uwięzione w polu.
ei-storm-lattice-2=To już nie jest przypadkowy rozsiew łuków. Krata burzowa II utrzymuje rozgałęzioną sieć pod większą presją i pozwala podstawowej cewce przenosić ładunek przez szerszy, gęstszy front wroga.
ei-storm-lattice-3=To ostateczny stan kontrolnej ścieżki podstawowej cewki. Krata burzowa III wypycha rozgałęzioną wieżę łuku pola w stronę późnogrowego tłumienia tłumu: więcej przeskoków, większy zasięg i wyraźniejsza tożsamość „kurtyny burzowej”.
ei-dielectric-rupture-1=Zaawansowane cewki nie służą do tłumienia całego frontu. Służą do zabijania, a potem do wypuszczania pozostałego ładunku na kolejny cel. Przebicie dielektryczne I wzmacnia tę doktrynę, zachowując więcej użytecznej energii w pierwszym wyładowaniu wtórnym.
ei-dielectric-rupture-2=Przebicie dielektryczne II utrzymuje łańcuch wtórnych wyładowań przy życiu dłużej i sprawia, że wyładowanie chętniej podpala to, czego dotknie. Zaawansowana cewka pozostaje pylonem egzekucji, nie kopią podstawowej wieży.
ei-dielectric-rupture-3=Późna zaawansowana cewka staje się prawdziwą bronią łańcucha zabójstw. Przebicie dielektryczne III zwiększa zasięg, siłę zachowanych łuków i profil spalania, aby jedno potwierdzone zabicie mogło rozerwać zwartą falę ataku.
ei-bridge-coupling-1=Most do waniliowej rodziny tesli jest celowo powściągliwy. Sprzężenie mostu I podnosi późne obrażenia i dziedziczenie kontroli dla teslaguna, amunicji tesla i repliki fulgoriańskiej, nie zamieniając ich po prostu w przebrane wieże TL.
ei-bridge-coupling-2=Linia mostu kończy się umyślnym faworyzowaniem wieży. Sprzężenie mostu II pozwala replice fulgoriańskiej odziedziczyć gęstszy język późnych wyładowań wtórnych, podczas gdy ręczny sprzęt tesla pozostaje lżejszy.
ei-reactance-overdrive-1=Dwie zaawansowane cewki na kadłubie czołgu nigdy nie miały pozostać uprzejme. Przeciążenie reaktancji I poszerza obwiednię niestabilności i zwiększa liczbę łuków nasycenia, nie zmieniając pojazdu w kolejną stałą wieżę.
ei-reactance-overdrive-2=Obsługa cewek ery fuzyjnej pozwala czołgowi Tesli utrzymywać dłuższe okna przeciążenia. Przeciążenie reaktancji II jeszcze mocniej przesuwa go w stronę zachowania burzowego frontu: silniejsze wahania modulacji, więcej rozlewu i większa presja na krawędzi pasa rażenia.
ei-reactance-overdrive-3=To ostateczny wyspecjalizowany stan czołgu. Przeciążenie reaktancji III utrzymuje mechaniczną odrębność od wież, ale sprawia, że pojazd przypomina ruchomy front elektryczny, a nie platformę działową z ozdobnym piorunem.
ei-exotic-waveform-convergence=Na końcu doktryny wieże Legacy przestają tylko pożyczać nowoczesny język łańcuchów i wreszcie dostają własne współczesne promienie główne. Podstawowa cewka staje się rozgałęzioną wieżą łuku pola i zyskuje gwarantowaną boczną serię po każdym udanym trafieniu głównym. Zaawansowana cewka staje się skupionym pylonem włóczni nadładowania, a każde potwierdzone zabicie uruchamia dodatkowo gwarantowaną egzotyczną burzę egzekucyjną nałożoną na normalną logikę dopalających wyładowań. Czołg Tesli dołącza tylko częściowo: jego trafienia zyskują sąsiednią modernizację wyładowań, a dodatnie skoki niestabilności mogą uruchomić serię burzowego frontu bez spłaszczania pojazdu do roli kolejnej wieży. Replika fulgoriańska także dostaje wieżowy egzotyczny rozkwit poimpulsowy przy potwierdzonych zabiciach, podczas gdy ręczny sprzęt Tesli już nie.

[exotic-industries-informatron]
menu_teslas_legacy=Tesla's Legacy
title_teslas_legacy=Tesla's Legacy
teslas-legacy=Arsenał Tesla's Legacy
teslas-legacy-text=To, co dawniej przychodziło jako Tesla's Legacy, zostało teraz wchłonięte w rodzimą doktrynę elektrycznego uzbrojenia Remembrance. [item=tl-basic-tesla-coil]Podstawowa cewka Tesli, [item=tl-advanced-tesla-coil]zaawansowana cewka Tesli i [item=tl-tesla-tank]czołg Tesli zachowują swoje publiczne nazwy, korpusy TL i przemysłową tożsamość, lecz gałąź nie jest już obcą drabinką z boku. Nabiera rytmu progresji EI: najpierw surowa wieża pola, potem cięższy pylon egzekucyjny, a na końcu opancerzony front burzowy.\n\nLinia prowadzi się też dalej ku waniliowej rodzinie tesli. [item=teslagun]Teslagun, [item=tesla-ammo]amunicja tesla i [item=tesla-turret]replika fulgorańskiej cewki dziedziczą wspólny kręgosłup harmoniczny, ale nie spłaszczają się w przebrane wieże TL.
teslas-legacy-2=Tryb zachowania
teslas-legacy-text-2=Tryb działania przy starcie: [font=default-bold]__1__[/font]\n\n[font=default-bold]Wierność Legacy[/font] jest teraz ścieżką domyślną. To dokładny rdzeń oryginalnego Tesla's Legacy: dawna rekurencja pomocnicza, trwałe pomocniki, czyszczenie przez timer, dziedziczenie przez obrażenia, bezpośrednie pośmiertne wyładowania zaawansowanej cewki, ogniste skutki pojedynczych rozładowań i przepływ zmienności czołgu pozostają nienaruszone. [font=default-bold]Hybrydowy[/font] jest opcjonalną, lżejszą ścieżką. Zastępuje starą rekurencję TL głównym modelem kontynuacji opartym o własną siatkę pomocników TL, a potem pozwala późniejszym harmoniom i doktrynie wydobywać ponad nią bogatsze ukryte rodziny pomocników.\n\nDrabina doktryny jest wspólna, lecz działa inaczej. W hybrydzie siatka doktryny staje się zachowaniem głównym. W Wierności Legacy pierwotne zachowanie TL zawsze uruchamia się pierwsze, a nowoczesne możliwości nakładają się dopiero potem.
teslas-legacy-3=Harmoniki falowe
teslas-legacy-text-3=Harmoniki przebiegu fali są teraz wspólnym kręgosłupem modernizacji. Przed nimi cewki Legacy zachowują swój pierwotny wizualny język TL. Na harmonice I zaczynają mówić tym samym elektrycznym dialektem co zmostkowana rodzina tesli. Na harmonice II podstawowe i zaawansowane cewki przechodzą na nowoczesne rodziny dalszych łuków. Na harmonice III te łuki przyjmują pełny język łańcuchów nowej epoki, a zmostkowana wieża wreszcie otrzymuje gęsty profil późnych wyładowań, którego od dawna jej brakowało.\n\nTutaj kończy się stary brak zgrania. Wieże Legacy, replika fulgorańska i ręczna gałąź tesli dzielą teraz wspólną strefę przecięcia zamiast wzajemnie się ignorować.
teslas-legacy-4=Specjalizacja kwantowa
teslas-legacy-text-4=Po harmoniach doktryna rozdziela się wyraźnie. [font=default-bold]Krata burzowa[/font] należy do [item=tl-basic-tesla-coil]podstawowej cewki i czyni z niej wieżę kontroli roju: szersza propagacja, lepsze przekazywanie celu i trwalsze tłumienie. [font=default-bold]Przebicie dielektryczne[/font] należy do [item=tl-advanced-tesla-coil]zaawansowanej cewki i wyostrza wyładowania po zabiciu, zachowany ładunek oraz dziedziczenie zapłonu.\n\n[font=default-bold]Sprzężenie mostu[/font] to późna specjalizacja rodziny mostkowanej. Wzmacnia zwykłą rodzinę tesli, nie rozpuszczając jej tożsamości w ścieżkach wież TL. Replika fulgorańska dostaje cięższy zwrot po stronie wieży, a ręczne wyposażenie tesla pozostaje lżejsze.
teslas-legacy-5=Fuzyjne przeciążenie
teslas-legacy-text-5=[item=tl-tesla-tank]Czołg Tesli nie dzieli bezpośrednio kwantowych specjalizacji wież. Jego późna doktryna to [font=default-bold]przeciążenie reaktancji[/font], czołgowa ścieżka ery fuzyjnej skupiona na nasyceniu podwójną cewką, szerszych oknach zmienności i większym rozlewaniu się wzdłuż pasa rażenia. Pojazd pozostaje mechanicznie odrębny od wież: mniej stały pylon, bardziej burzowy front na gąsienicach.\n\nPozostaje też specjalistą od zmienności całej linii. Skoki krytyczne, wahania modulacji i waporyzacja nadal należą do czołgu w sposób, którego wieże nie naśladują.
teslas-legacy-6=Egzotyczna konwergencja
teslas-legacy-text-6=Ostatnim krokiem doktryny jest [font=default-bold]egzotyczna konwergencja falowa[/font]. Nie zastępuje ona wież TL kopiami z nowej epoki. [item=tl-basic-tesla-coil]Podstawowa cewka zachowuje swój improwizowany korpus i staje się nowoczesną [font=default-bold]wieżą rozgałęzionego łuku pola[/font], która po każdym udanym trafieniu głównym wypuszcza jedną gwarantowaną boczną serię. [item=tl-advanced-tesla-coil]Zaawansowana cewka zachowuje wysoki sylwetkowy pylon i staje się skupioną [font=default-bold]włócznią nadładowania[/font], a każde potwierdzone zabójstwo wyzwala dodatkowo gwarantowaną egzotyczną burzę egzekucyjną. Ich główne wiązki są wreszcie zmodernizowane, ale role bojowe pozostają rozdzielone.\n\nW [font=default-bold]Wierności Legacy[/font] te efekty szczytowe nakładają się na oryginalny substrat TL. W [font=default-bold]Hybrydowym[/font] wieńczą lżejszą siatkę doktrynalną. [item=tl-tesla-tank]Czołg Tesli dołącza tylko częściowo: skoki zmienności i waporyzacja mogą uruchamiać serię burzowego frontu, ale pojazd pozostaje opancerzonym, burzowym członkiem rodziny, a nie kolejną wieżą. [item=tesla-turret]Replika fulgorańska dostaje też własny, wieżowy, egzotyczny powyładowczy rozkwit przy potwierdzonych zabójstwach, podczas gdy [item=teslagun]teslagun i [item=tesla-ammo]amunicja tesla pozostają na lżejszej gałęzi mostu.
teslas-legacy-7=Komunikaty bojowe i domyślny unoszący się tekst
teslas-legacy-text-7=Komunikaty bojowe pozostają celowo selektywne. Teksty [font=default-bold]trafienia krytycznego[/font] i [font=default-bold]waporyzacji[/font] są włączone domyślnie, aby wyjątkowe zdarzenia nadal rzucały się w oczy. Zwykły tekst [font=default-bold]obrażeń[/font] jest domyślnie wyłączony, żeby każda potyczka nie rozpadała się w elektryczne konfetti.\n\nTo zbalansowanie ma teraz jeszcze większe znaczenie, bo doktryna ma więcej ruchomych części: skoki propagacji, łańcuchy po wyładowaniu, sprzężenie mostu, zmienność czołgu i końcową modernizację wiązki. Domyślne ustawienie zachowuje czytelność najbardziej dramatycznych chwil, nie zalewając pola bitwy szumem.
