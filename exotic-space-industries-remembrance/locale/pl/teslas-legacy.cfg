tl-tesla-tank=Wariant czołgu wyposażony w dwie średnie zaawansowane cewki Tesli.
ei-tesla-turret=Zrekonstruowana imitacja przedupadkowej fulgorańskiej broni łukowej. Choć geometria leżących u podstaw nadprzewodzących cewek jest zrozumiana tylko częściowo, ta replika wieży potrafi kierować kontrolowane wyładowania elektryczne ku pobliskim zagrożeniom. Jej moc i sprawność wciąż ustępują prawdziwym fulgorańskim konstrukcjom, ale dzięki zaawansowanym materiałom zapewnia niezawodne tłumienie obszarowe i wysoki potencjał ognia salwowego.

