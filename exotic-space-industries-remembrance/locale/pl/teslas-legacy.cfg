[mod-setting-description]
ei-tl-behavior-mode=Wybiera, czy Tesla's Legacy korzysta z lżejszego trybu hybrydowego, czy z bardziej UPS-łakomej ścieżki rekursji trybu Wierność Legacy.
tl-advanced-attack-anim=Zmienia animację używaną wtedy, gdy zaawansowana cewka Tesli przygotowuje się do ataku.
tl-critical-multiplier=Gdy wystąpi trafienie krytyczne, pierwotna wartość obrażeń trafienia zostaje pomnożona przez ten współczynnik.
tl-critical-chance=Procentowa szansa na wystąpienie trafienia krytycznego podczas ataków tesla.
tl-flying-text-critical=Włącza pływający komunikat o udanym trafieniu krytycznym.
tl-flying-text-vaporize=Włącza pływający komunikat o udanym natychmiastowym zabiciu z technologii „Waporyzacja”.
tl-flying-text-damage=Włącza pływający komunikat dla modulowanych obrażeń czołgu Tesli z technologii „Bionizacja”.

