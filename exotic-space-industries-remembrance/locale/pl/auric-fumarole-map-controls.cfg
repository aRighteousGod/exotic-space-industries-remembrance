[autoplace-control-descriptions]
ei-auric-fumarole=Częstotliwość wpływa na szanse erupcji i liczbę prób ponownego pojawienia się fumaroli. Rozmiar określa docelową liczbę aktywnych fumaroli, a nie ich wymiary. Bogactwo skaluje zasoby: przy 100% każda nowa fumarola zawiera 40 000–80 000 jednostek. Wyłączenie blokuje wszystkie nowe erupcje. Istniejące złoża zachowują pozostałe zasoby. Fumarole nie są widoczne w podglądzie generowania mapy. Pojawiają się wyłącznie podczas rozgrywki, gdy skrypt jest aktywny.

[exotic-industries-informatron]
auric-fumarole-defaults=Poniższe wartości dotyczą ustawień mapy na poziomie 100%. Docelową populację ograniczają dostępny teren i odstępy między fumarolami.
