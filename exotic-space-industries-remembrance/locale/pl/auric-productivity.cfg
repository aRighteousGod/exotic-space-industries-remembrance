ei-productivity-auric-precipitation=Wydajność aurycznego wytrącania

[technology-description]
ei-productivity-auric-precipitation=Każdy poziom zwiększa produktywność płukania złotonośnego żużla o 10 punktów procentowych. Dodatkowe cykle dają tylko złoto, bez dodatkowego żużla ani brudnej wody. Można używać modułów produktywności; wszystkie premie do produktywności mają wspólny limit +300%. Badania można prowadzić bez końca, ale po osiągnięciu limitu uzysk już nie wzrasta.
