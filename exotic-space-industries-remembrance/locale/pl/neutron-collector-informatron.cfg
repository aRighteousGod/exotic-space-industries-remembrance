menu_neutron_collector=Kolektor neutronow
title_neutron_collector=Kolektor neutronow
neutron-collector=Kolektor neutronow
neutron-collector-text=[color=orange]Kolektor neutronów[/color] [item=ei-neutron-collector] to maszyna ładująca z epoki kwantowej. Wychwytuje wolne neutrony z pobliskich źródeł rozszczepienia, słabych wycieków z aktywnych reaktorów fuzyjnych z gęstą plazmą Epoki kosmicznej na Aquilo oraz z silniejszych, regulowanych reaktorów termojądrowych ESIR. Wykorzystuje ten strumień do przemiany [item=ei-neutron-container] w [item=ei-charged-neutron-container].\n\nNie wytwarza neutronów. Zbiera to, czego pobliskie reaktory nie potrafią zatrzymać. Kolektor wiąże się tylko z jednym źródłem naraz i wybiera najsilniejszy aktywny uzysk w zasięgu zamiast uśredniać wszystkie maszyny wokół.
neutron-collector-2=Powiazanie, odleglosc i czuwanie
neutron-collector-text-2=Wydajność kolektora zależy od typu źródła, jego aktywności i geometrii układu. Reaktory z gęstą plazmą Epoki kosmicznej na Aquilo dają tylko słaby wyciek, gdy pracują; reaktory termojądrowe ESIR pozostają silniejszymi źródłami i można je stroić kontrolą temperatury oraz wtrysku. Raportowana wydajność pozostaje ograniczona do 0-300%, a większa odległość oznacza dłuższy czas ładowania.\n\nJeśli w pobliżu nie ma poprawnego źródła, strumień neutronów jest poniżej progu ładowania, powiązane źródło przechodzi w uśpienie, wyjście jest zablokowane albo warunek obwodu wyłącza assembler, kolektor wraca do receptury czuwania, dzięki czemu maszynę nadal można otworzyć, a diagnostyka pozostaje widoczna.
neutron-collector-3=Telemetria obwodu
neutron-collector-text-3=Gdy kolektor jest podlaczony do sieci, jego ukryty interfejs obwodow wysyla piec wlasnych sygnalow na siec kolektora: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] i [virtual-signal=ei-neutron-scan-agent].\n\nWydajnosc obejmuje zakres 0-300. Odleglosc jest podawana w dziesiatych czesciach pola. Agent kolektora to 1 aktywny, 2 bezczynny, 3 zablokowany. Agent zrodla to 1 aktywne, 2 uspione, 3 nieobecne. Agent skanu to 1 stabilny, 2 do przeliczenia, 3 oczekuje na przepiecie. Te sygnaly odswiezaja sie w zaplanowanym przebiegu telemetrii kolektora, a nie co tick.
