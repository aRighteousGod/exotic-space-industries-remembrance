menu_neutron_collector=Kolektor neutronow
title_neutron_collector=Kolektor neutronow
neutron-collector=Kolektor neutronow
neutron-collector-text=[color=orange]Kolektor neutronow[/color] [item=ei-neutron-collector] to maszyna ladujaca z epoki kwantowej. Zbiera swobodne neutrony uciekajace z pobliskiej infrastruktury rozszczepienia i syntezy, a nastepnie wykorzystuje ten strumien do przemiany [item=ei-neutron-container] w [item=ei-charged-neutron-container].\n\nNie wytwarza neutronow. Zbiera to, czego pobliskie reaktory nie potrafia zatrzymac. Kolektor wiaze sie tylko z jednym zrodlem naraz i wybiera najsilniejszy aktywny uzysk w zasiegu zamiast usredniac wszystkie maszyny wokol.
neutron-collector-2=Powiazanie, odleglosc i czuwanie
neutron-collector-text-2=Wydajnosc zalezy od typu zrodla i geometrii ukladu. Mocne zrodla syntezy moga wypchnac wartosc ponad 100%, a slabe lub odlegle emitery potrafia zepchnac ja nizej; raportowana wydajnosc pozostaje ograniczona do 0-300%. Wieksza odleglosc oznacza dluzszy czas ladowania.\n\nJesli w poblizu nie ma poprawnego zrodla, strumien neutronow jest za slaby, powiazane zrodlo przechodzi w uspienie, wyjscie jest zablokowane albo warunek obwodu wylacza assembler, kolektor wraca do receptury czuwania, dzieki czemu maszyne nadal mozna otworzyc, a diagnostyka pozostaje widoczna.
neutron-collector-3=Telemetria obwodu
neutron-collector-text-3=Gdy kolektor jest podlaczony do sieci, jego ukryty interfejs obwodow wysyla piec wlasnych sygnalow na siec kolektora: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] i [virtual-signal=ei-neutron-scan-agent].\n\nWydajnosc obejmuje zakres 0-300. Odleglosc jest podawana w dziesiatych czesciach pola. Agent kolektora to 1 aktywny, 2 bezczynny, 3 zablokowany. Agent zrodla to 1 aktywne, 2 uspione, 3 nieobecne. Agent skanu to 1 stabilny, 2 do przeliczenia, 3 oczekuje na przepiecie. Te sygnaly odswiezaja sie w zaplanowanym przebiegu telemetrii kolektora, a nie co tick.
