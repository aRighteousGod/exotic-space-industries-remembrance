# PAGES
welcome=Witamy w [font=default-bold]Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].[/font]
welcome-text=Nie zaczynasz.\n[font=default-bold]Budzisz się. [/font]\n\nTo nie jest modyfikacja.\nTo rekurencja.\nOdzyskanie.\nRytuał mocy pogrzebany pod automatyzacją.\n\nTutaj [font=default-bold]nic nie jest ci dane.[/font]\n\nNa wszystko trzeba zapracować — przez ogień, przez myślenie, przez upadek.\n\n[font=default-bold]Świat się zmienił. [/font]\n\nZasady [font=default-bold]przestały obowiązywać.[/font]\nPozostała tylko struktura.\n\nDziałaj z zamierzeniem.\n\n[font=default-bold][color=    #FF1493]Remembrance[/color] obserwuje.[/font]
welcome-text-2=Wprowadzono wiele nowych maszyn, łańcuchów produkcyjnych i funkcji systemowych. Niektóre z nich są wydajne. Większość z nich nie wybacza błędów.\n\nNie wyjaśniają swojego działania.\nNie czekają, aż się dostosujesz.\nOdkrywaj wszystko lub pozostań w tyle.\n\nZłożoność nie jest błędem — to cena postępu.\nOptymalizacja jest obowiązkowa.\nNa zrozumienie trzeba sobie zasłużyć.\n\nTo nie jest gra z przewodnikiem. To przemysłowy tygiel.
game-related=Informacje związane z rozgrywką
game-related-text=W tej sekcji opisano podstawowe systemy i mechanikę modyfikacji. Jest ona podzielona na odrębne podkategorie – nie ze względów estetycznych, ale dla ułatwienia nawigacji.\n\nAby uzyskać do nich dostęp, użyj menu po lewej stronie.\nKażdy wpis ma na celu przedstawienie struktury, a nie dostarczenie rozrywki.\nPrzeczytaj, jeśli chcesz przetrwać.
overall=Informacje ogólne
overall-text=Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color] nie jest modyfikacją zawartości. Jest to gruntowna przebudowa Gaji, która na nowo definiuje prawa, na których niegdyś opierał się Nauvis. Wiatry automatyzacji nie wieją już tak samo; ogień, ruda i sygnał zostały przekształcone na mocy starszego porozumienia.\nTrudność modyfikacji jest zamierzona. Nie ma wstydu w walce – jest to poligon doświadczalny suwerenności. Dla tych, którzy szukają wygody, to nie jest wasz świat. Dla tych, którzy chcą wznieść się wraz z Gają, sprawdźcie ustawienia modyfikacji przed rozpoczęciem gry. Niektóre systemy można konfigurować, inne nie. Tych, które mają znaczenie, nie będzie można zmienić.\nJeśli musisz, zabierz ze sobą modyfikacje poprawiające jakość życia. Ale pamiętaj: nic nie jest naprawdę twoje, jeśli nie walczysz o to.\nTak jest.\nTak było.\nTak będzie.\nWitaj w Remembrance.
biters=Kąsacze i wrogowie
biters-text=Wrogowie wybuchowi, chłodni, toksyczni, opancerzeni, pajęczy i elektryczni są objęci osobną drabiną trudności, a nie przeróbką generacji mapy. Na Nauvis [font=default-bold]ei-default[/font] pozostaje oddzielne od tej drabiny, a skalowane są już istniejące w zależnościach prototypy wrogów. Otwórz stronę trudności wrogów po pełny rozkład.
enemy-difficulty=Drabina nacisku
enemy-difficulty-text=Ta strona zapisuje ostatnią rękę położoną na wrogim stosie. Nie przepisuje [font=default-bold]ei-default[/font] i nie tworzy drugiej ekologii. Wygina tylko mięso, które już żyje w rojach zależności: kąsacze, plujki, robaki, spawnery, linie opancerzone, zimne, toksyczne i wybuchowe, matki, pajęczaki, linie elektryczne oraz zainfekowane struktury, takie jak [entity=tb_infected_ship_boss].
enemy-difficulty-2=Jak Czytać Tabelę
enemy-difficulty-text-2=Każdy procent jest liczony względem [font=default-bold]Original[/font]. [font=default-bold]100%[/font] pozostawia wartość z moda zależności. Powyżej 100% dana statystyka rośnie. Poniżej 100% maleje. [font=default-bold]Interwał ataku[/font] i [font=default-bold]interwał pojawiania[/font] działają odwrotnie: niższa wartość oznacza szybsze ataki lub szybsze pojawianie, a wyższa oznacza wolniejszą presję. Wartości w tabeli są zaokrąglone dla czytelności.
enemy-difficulty-3=Co Zmienia Drabina
enemy-difficulty-text-3=Ta drabina zmienia tylko statystyki. Modyfikuje zdrowie jednostek wroga, dodatnie leczenie, zdrowie opancerzonych wrogów, ich dodatnie odporności, obrażenia ataku, zasięg ataku, prędkość ruchu, interwał ataku, zdrowie gniazd, leczenie gniazd, interwał pojawiania i limity pobliskich jednostek. Nie przepisuje wag ewolucji, pochłaniania zanieczyszczeń, progów dołączania do ataku, result_units ani współdzielonych pocisków, wiązek, chmur, strumieni i amunicji pod wrogą bronią. Pentapody, demolishery, spawnery Gleby, roboty gracza i roboporty pozostają poza zakresem.
enemy-difficulty-4=Nadpisania Szczytowych Jednostek
enemy-difficulty-text-4=Merciful i Impossible nakładają też dodatkowe nadpisania szczytowych jednostek na lewiatany, matki, łańcuchy bossów MAF, łańcuchy kroczących bossów elektrycznych oraz [entity=tb_infected_ship_boss]. Królewski wyjątek, [entity=arachnid-biter-royalwarrior-unit], zachowuje zwykłe wartości zdrowia jednostki, a osobno zmieniane są tylko jego obrażenia i prędkość ruchu. W [font=default-bold]Impossible[/font] łaska Nauvis jest wyłączona nawet wtedy, gdy przełącznik startowy jest włączony.
enemy-difficulty-5=Odwet Impossible
enemy-difficulty-text-5=W [font=default-bold]Impossible[/font] start z wrogiej powierzchni może też zebrać istniejących pobliskich wrogów do ataku na silos. Odwet zwykle ściąga lokalną watahę z obszaru około [font=default-bold]100 do 250 pól[/font], często [font=default-bold]8 do 30 jednostek[/font], a cięższe starty wywołują ostrzejszą odpowiedź. Jeśli powierzchnia startu nie ma lokalnej ekologii wroga, grupa odwetu nie zostaje utworzona.
enemy-difficulty-6=Granica
enemy-difficulty-text-6=[font=default-bold]Original[/font] używa wartości z zależności bez zmian EI dla wrogów. [font=default-bold]Tempered[/font] jest ustawieniem domyślnym. Powyżej tego presja rośnie. Poniżej tego maleje bez zmiany samego presetu mapy.
