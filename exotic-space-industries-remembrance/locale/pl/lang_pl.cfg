ages-and-tech=Epoki technologiczne
ages-and-tech-text=Exotic Industries nie wycenia badań jak płaskiej, waniliowej drabiny. Mod buduje koszt z [font=default-bold]ceny początkowej[/font], [font=default-bold]kształtu krzywej[/font] i nazwanego [font=default-bold]pułapu[/font], a potem rozkłada tę presję na całą listę technologii. [font=default-bold]linear[/font] pozostaje równy, [font=default-bold]quadratic[/font] zaczyna łagodniej i mocniej dociska później, [font=default-bold]exponential[/font] jest miękki na początku i ostro skacze na końcu, a [font=default-bold]age-ramp[/font] przerzuca największy ciężar na późniejsze epoki.\n\nBramki epok nadal decydują o tym, kiedy gałęzie stają się legalne, ale skalowanie decyduje, jak mocno karany jest wąski rush. Nadal używa się biblioteki ważenia technologii, więc technologie o obniżonej wadze liczą się wolniej.
tech=Skalowanie kosztów technologii
tech-text=Exotic Industries nie wycenia badań jak płaskiej, waniliowej drabiny. Mod buduje koszt z [font=default-bold]ceny początkowej[/font], [font=default-bold]kształtu krzywej[/font] i nazwanego [font=default-bold]pułapu[/font], a potem rozkłada tę presję na całą listę technologii. [font=default-bold]linear[/font] pozostaje równy, [font=default-bold]quadratic[/font] zaczyna łagodniej i mocniej dociska później, [font=default-bold]exponential[/font] jest miękki na początku i ostro skacze na końcu, a [font=default-bold]age-ramp[/font] przerzuca największy ciężar na późniejsze epoki.\n\nBramki epok nadal decydują o tym, kiedy gałęzie stają się legalne, ale skalowanie decyduje, jak mocno karany jest wąski rush. Nadal używa się biblioteki ważenia technologii, więc technologie o obniżonej wadze liczą się wolniej.
tech-2=Co kontrolują ustawienia startowe
tech-text-2=[font=default-bold]Cena początkowa[/font] nadal wyznacza koszt jednego pakietu naukowego blisko początku. [font=default-bold]Pułap[/font] nadal wybiera docelowy zakres na końcu, od Sunday stroll do Very Expensive. [font=default-bold]Kształt krzywej[/font] obejmuje teraz także age-ramp, który kieruje większą część kosztu do późniejszych epok, a [font=default-bold]dodatkowy mnożnik[/font] nadal nakłada się po obliczeniu krzywej.\n\nJeśli wybrany pułap inaczej zderzyłby się z limitem [font=default-bold]x1000[/font] Factorio, ESIR automatycznie podnosi ukryty efektywny początkowy koszt bazowy, aby wyższy pułap nadal był osiągalny.\n\nJeśli chcesz inaczej zbalansować EI, dalej używaj tych wewnętrznych ustawień zamiast vanilla mnożników badań. Mod oczekuje, że to on zarządza tą częścią postępu, a vanilla mnożniki nie opisują tego samego kształtu.
tech-3=Praktyczne limity i zmiany w trakcie gry
tech-text-3=Nazwany [font=default-bold]pułap[/font] sam w sobie nie jest absolutną gwarancją. Factorio nadal ogranicza wewnętrzny mnożnik ceny badań do [font=default-bold]x1000[/font], więc rzeczywisty pułap w grze nadal jest związany z twoją [font=default-bold]ceną początkową[/font]. ESIR teraz automatycznie podnosi ukryty efektywny początkowy koszt bazowy, gdy trzeba, żeby wyższy pułap dało się nadal wyrazić.\n\n[font=default-bold]Dodatkowy mnożnik[/font] pozostaje najbezpieczniejszą wartością do zmiany w już istniejącym zapisie. Zmiana [font=default-bold]ceny początkowej[/font] lub [font=default-bold]kształtu krzywej[/font] po rozpoczęciu gry może nadal dać niepożądane lub nieprzewidywalne wyniki.
tech-output=Postęp w obecnej epoce
tech-output-text=Następna epoka oczekująca na aktywację to [font=default-bold]__3__[/font]. Obecnie ujawniono [font=default-bold]__1__ / __2__[/font] procent wiedzy niezbędnej do przekroczenia progu.\n\n[font=default-bold]Postępuj naprzód lub pozostań związany z przeszłością.[/font]
world-gen-related=Informacje związane ze światem
world-gen-related-text=Ta sekcja opisuje systemy generowania świata wprowadzone przez mod. Dla przejrzystości struktury podzielono ją na podkategorie tematyczne.\n\nDostęp do nich można uzyskać za pomocą menu po lewej stronie.\nNie są to zmiany kosmetyczne.\nOkreślają one teren, zachowanie zasobów i logikę przestrzenną na poziomie podstawowym.\n\n[font=default-bold]Zrozum tę warstwę lub zostaniesz przaz nią ukształtowany.[/font]
crystal-accumulator-resonance=Rezonans akumulatora kryształowego
crystal-accumulator-resonance-text=Akumulatory kryształowe nie są zwykłymi bateriami. To obce powłoki rezonansowe zasiane w generowanych skupiskach reliktów i należy je czytać przez [font=default-bold]obciążenie[/font] oraz [font=default-bold]koherencję[/font], a nie przez prosty stan włącz/wyłącz.\n\nW obecnej drabinie żywych powłok profil niestabilny może utrzymywać [font=default-bold]4 MW powłoki niskiego obciążenia[/font], [font=default-bold]7,5 MW powłoki bazowej[/font] albo [font=default-bold]10 MW powłoki przeciążonej[/font]. Gaia rozwiązuje tę samą geometrię do [font=default-bold]15 MW powłoki Gai[/font]. Wyłączone skorupy wypadają z tej drabiny całkowicie, dopóki nie zostaną naprawione.
crystal-accumulator-resonance-2=Profil Nauvis
crystal-accumulator-resonance-text-2=Nauvis jest jawnym profilem odniesienia dla niestabilnej powłoki. Gdy znajdujesz lub stawiasz tam [item=ei-crystal-accumulator], czytaj go jako bazowy przypadek rezonansu: wydajny, obcy i nigdy w pełni uspokojony.\n\nPowłoka może przechodzić między niskim, bazowym i przeciążonym stopniem, ale pozostaje tą samą klasą niestabilną. Nauvis nie jest lekarstwem. To rana wzorcowa.
crystal-accumulator-resonance-3=Inne powierzchnie i orbita
crystal-accumulator-resonance-text-3=Poza Nauvis traktuj planety inne niż Gaia oraz platformy orbitalne jako przestrzeń obcego profilu. Niestabilna powłoka nadal może tam pracować, ale nie zyskuje stabilności tylko dlatego, że opuściła miejsce odkrycia.\n\nGaia jest wyjątkiem. Tam ta sama obudowa rozwiązuje się w [item=ei-crystal-accumulator-gaia]stabilny akumulator kryształowy, podwajając moc bazową z [font=default-bold]7,5 MW do 15 MW[/font] i podnosząc całą drabinę powłok.
crystal-accumulator-resonance-4=Jakość to nie koherencja
crystal-accumulator-resonance-text-4=Nie myl [font=default-bold]jakości[/font] z [font=default-bold]profilem rezonansu[/font]. Jakość to zwykła warstwa przedmiotu; powłoka niskiego obciążenia, powłoka bazowa, powłoka przeciążona, powłoka Gai i wyłączona skorupa to stany powłoki opisane na tej stronie.\n\nJeśli kryształowy przedmiot ma jakość, nie zastępuje to odczytu obciążenia i koherencji. Ta legenda mówi o tym, jak śpiewa krata, a nie jak dobry był rzut jakości.
crystal-accumulator-resonance-5=Wydobycie i naprawa
crystal-accumulator-resonance-text-5=Akumulatory kryształowe są najpierw reliktami, a dopiero potem wyposażeniem. Wydobycie niestabilnej powłoki należy czytać jako gwałtowne zerwanie koherencji: bezpieczne oczekiwanie to rozbite ciało, a nie czysta relokacja. Powłoki wyłączone [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] trwają, dopóki nie przeciągniesz po nich [item=ei-crystal-accumulator-repair]zestawu naprawczego.\n\nAlt-zaznaczenie narzędziem naprawczym pozwala sprawdzić akumulatory i skorupy bez zużywania zestawu. Zwykłe przeciągnięcie wykonuje naprawę. Jeśli nastąpi na Gai, powierzchnia natychmiast rozwiąże ją do wariantu stabilnego.
crystal-accumulator-resonance-6=Legenda interfejsu
crystal-accumulator-resonance-text-6=[font=default-bold]Powłoka niskiego obciążenia[/font]: koherencja jest stłumiona, a moc spada poniżej bazowego stopnia.\n[font=default-bold]Powłoka bazowa[/font]: niestabilna obudowa utrzymuje swoje domyślne pasmo 7,5 MW.\n[font=default-bold]Powłoka przeciążona[/font]: moc jest powyżej stopnia bazowego, a krata pracuje pod napięciem.\n[font=default-bold]Powłoka Gai[/font]: Gaia rozwiązała tę samą obudowę do stabilnego stopnia 15 MW.\n[font=default-bold]Wyłączona skorupa[/font]: bezwładne ciało artefaktu czekające na naprawę.\n\nZagęszczenie sąsiedztwa czyta chór powłok jako [font=default-bold]Luźna -> Tłoczna -> Naprężona -> Chaotyczny chór[/font]. Czytaj drabinę właśnie w tej kolejności, a kryształ przestanie wyglądać na losowy.
crystal-accumulator-resonance-text-7=Alt-zaznaczaj [item=ei-crystal-accumulator-repair], aby sprawdzać akumulatory i skorupy bez zużywania zestawu. Przeciągaj narzędzie normalnie tylko wtedy, gdy naprawdę chcesz naprawiać.\n\nLinia telemetrii pokazuje [font=default-bold]wyjście powierzchni + naprężenie[/font] albo [font=default-bold]tylko naprężenie[/font]. Kryształy o tej samej powłoce i jakości na jednej powierzchni współdzielą ten uśredniony składnik wyjścia; to lokalne naprężenie nadal odróżnia wyczerpaną powłokę od jej sąsiadki.

resources=Nowy system zasobów
resources-text=Exotic Industries wdraża zrestrukturyzowany system zasobów. Tradycyjne złoża rudy nie są już jedyną metodą pozyskiwania zasobów — zasoby są teraz podzielone na odrębne kategorie, z których każda podlega własnej logice, przepływowi produkcji i zachowaniom przestrzennym.\nWydobycie nie jest już trywialne.\n[font=default-bold]Pozyskiwanie wymaga adaptacji.[/font]\nZrozum kategorię lub nie produkuj nic.
stone=Kamień
stone-text=Kamień jest najobficiej występującym surowcem w systemie. Można go wydobywać w tradycyjny sposób z powierzchniowych złóż, ale Exotic Industries poszerza ścieżki jego pozyskiwania:\n\n[color=orange]Zbieracze powierzchniowe[/color] [item=ei-burner-surface-harvester] umożliwiają głębokie wydobycie z dowolnego terenu.\n\n[font=default-bold]Ręczne zbieranie pozostaje możliwe, choć nieefektywne.[/font]\nKamień jest wszędzie.\nWydajność jest opcjonalna. Uzysk nie.
surface-patches=Złoża powierzchniowe
surface-patches-text=Powierzchnia Nauvis nie jest jednorodna. Wokół strefy lądowania skorupa wciąż trzyma się jako chroniona rezerwa przemysłowa: [item=ei-poor-iron-chunk]żelazo, [item=ei-poor-copper-chunk]miedź, [item=coal]węgiel, [item=stone]kamień i pobliska [fluid=crude-oil]ropa pod ciśnieniem pozostają dość silne, by zbudować pierwszy przemysł.\n\nPoza tym matecznikiem powierzchnia zaczyna się rozpadać. [item=ei-poor-iron-chunk]Żelazo, [item=ei-poor-copper-chunk]miedź, a nawet [item=ei-poor-uranium-chunk]uran przetrwały głównie jako płytkie resztki, pasy pęknięć i wyczerpane pola blizn. Są realne, ale nie tworzą trwałej gospodarki metalowej.\n\nWęgiel, kamień i ropa pozostają roboczą skórą Nauvis. Użyj rezerwy, aby postawić ciepło, taśmy i chemię. Potem czytaj teren właściwie, albo skorupa cię okłamie.
veins=Głębokie żyły rud
veins-text=Żyły rudy są na początku niedostępne. Wymagają [color=orange]głębokich wiertnic[/color] [item=ei-deep-drill], systemu wydobywczego środka gry zbudowanego pod pionowy uzysk.\n\nŻyły te nie pojawiają się już jako ogólne rzuty rzadkości. Metale strukturalne podążają przez Nauvis za [font=default-bold]pasami metalicznymi[/font] i [font=default-bold]basenami sedymentacyjnymi[/font]: [item=ei-iron-chunk]żelazo i [item=ei-copper-chunk]miedź preferują tereny grzbietowe, podczas gdy [item=ei-coal-chunk]węgiel i [item=ei-sulfur-chunk]siarka gromadzą się w niższych basenach.\n\n[font=default-bold]Fronty hydrotermalne[/font] niosą [item=ei-lead-chunk]ołów i [item=ei-gold-chunk]złoto poza chroniony region startowy. [font=default-bold]Zewnętrzne bliznowiska[/font] kryją [item=ei-uranium-chunk]uran, a tylko najrzadsze kieszenie anomalii wewnątrz tych spękanych stref odsłaniają [item=ei-neodym-chunk]neodym.\n\nMateriały krytyczne, w tym uran, ołów, złoto, neodym i immersyt, występują wyłącznie w tych głębokich warstwach.\nNie są opcjonalne.\nSą strukturalne.\n\n[font=default-bold]Wydobycie powierzchniowe nie doprowadzi cię do końca gry.[/font] Wierć, czytaj teren albo pozostań w stagnacji.
chunk-grades=Biedne bryły i bogate bryły
chunk-grades-text=Nie każda bryła jest taka sama. [item=ei-poor-iron-chunk]Biedne żelazo i [item=ei-poor-copper-chunk]biedna miedź to płytkie, zanieczyszczone resztki pozostawione w rozbitej górnej skorupie. Mają uruchomić przemysł, nie utrzymać go na stałe. Ich niska jakość od razu wychodzi w piecu: [font=default-bold]3 biedne bryły -> 1 płyta[/font] i zostawiają znacznie więcej żużla.\n\n[item=ei-iron-chunk]Bryły żelaza i [item=ei-copper-chunk]bryły miedzi z głębokich żył to właściwe złoże. Nawet bez dalszej obróbki [font=default-bold]3 dobre bryły -> 2 płyty[/font] przy dużo mniejszym obciążeniu żużlem. [item=ei-poor-uranium-chunk]Biedny uran działa tak samo: powierzchnia daje tylko ślad, a prawdziwy [item=ei-uranium-chunk]uran leży głęboko.
chunk-refining=Oczyszczacz i czysta ruda
chunk-refining-text=[item=ei-purifier]Oczyszczacz to pierwsza maszyna, która naprawdę podnosi jakość brył zamiast tylko je przyjmować. Płucze [item=ei-iron-chunk]bryły żelaza i [item=ei-copper-chunk]bryły miedzi [fluid=water]wodą, zamienia je w [item=ei-pure-iron]czyste żelazo lub [item=ei-pure-copper]czystą miedź i oddaje [fluid=ei-dirty-water]brudną wodę, z którą trzeba coś zrobić.\n\nTen krok się opłaca. [font=default-bold]3 biedne bryły -> 1 płyta[/font], [font=default-bold]3 dobre bryły -> 2 płyty[/font], ale [font=default-bold]1 czysta ruda -> 2 płyty[/font] przy zaledwie około [font=default-bold]1% szansy na żużel[/font]. Głębokie złoża uruchamiają porządną gospodarkę metalową, a oczyszczanie czyni ją zwartą, czystą i przemysłową.
chunk-refining-2=Piec łukowy i grzałka plazmowa
chunk-refining-text-2=[item=ei-arc-furnace]Piec łukowy zmienia obróbkę brył w prawdziwą metalurgię, przetapiając bryły, czystą rudę, płyty i części w [fluid=ei-molten-iron]stopione żelazo oraz [fluid=ei-molten-copper]stopioną miedź dla łańcuchów odlewniczych. Może przerabiać biedne bryły, jeśli musi, ale liczby pokazują, czemu nie warto na tym poprzestać: [font=default-bold]3 biedne bryły dają tylko 15 stopionego metalu[/font], podczas gdy [font=default-bold]1 czysta ruda daje 40[/font] i prawie nie robi żużla.\n\n[item=ei-plasma-heater]Grzałka plazmowa kontynuuje tę ścieżkę w Erze Kwantowej. Nadal obsługuje receptury pieca łukowego, a przy okazji otwiera obróbkę gazów i plazmy w ekstremalnych temperaturach. Oczyszczacz poprawia wsad, piec łukowy poprawia metalurgię, a grzałka plazmowa przenosi cały ten łańcuch do późnej gry.
mining-scars=Blizny górnicze
mining-scars-text=Wyczerpanie złoża nie pozostawia już terenu nietkniętego. Exotic Industries może bliznować pobliską ziemię po zakończeniu wydobycia, ale tylko w przypadku [item=ei-burner-quarry], [item=ei-steam-quarry], [item=ei-electric-quarry] i [item=big-mining-drill].\n\nKażde zdarzenie wyczerpania może spowodować pozostawienie małej plamy blizny w losowym przesunięciu w pobliżu wyczerpanego złoża. Efektem są obrażenia terenu, a nie dodatkowy impuls zasobów.
mining-scars-2=Degradacja planet
mining-scars-text-2=Blizny degradują płytki wzdłuż łańcuchów specyficznych dla planet: trawa Nauvis zapada się w ziemię i piasek, skała Fulgora zamienia się w piasek, pył i wydmy, Gleba gnije, Vulcanus zwęglenia, a Aquilo zagęszcza śnieg i lód. Płytki wody i ukryte płytki są ignorowane, a pasujące elementy dekoracyjne są usuwane.\n\nTraktuj blizny jak mapę pamiętającą, co z niej zabrałeś.
asteroid-variants=Zróżnicowane asteroidy
asteroid-variants-text=Exotic Industries dodaje sześć dodatkowych rodzin asteroid obok zwykłych kosmicznych śmieci: [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk] i [item=ei-scrap-asteroid-chunk]. Są one wplecione w trasy planetarne, kruszone w [entity=crusher], a wszystkie dwanaście podstawowych i zaawansowanych receptur asteroid EI korzystają z [font=default-bold]Produktywności asteroidów[/font].\n\nKruszarka została też rozbudowana o porty płynów i większy magazyn wyników, więc te mieszane wyjścia się mieszczą.
chemical-asteroid=Asteroidy chemiczne
chemical-asteroid-text=Odblokowane przez odkrycie planety [font=default-bold]Aquilo[/font]. Podstawowe i zaawansowane kruszenie pozyskuje [fluid=ammonia], [item=ei-fluorite] i [fluid=fluorine] z odłamka, a zaawansowana receptura może dodatkowo wylosować [fluid=lithium-brine]. Ich rzadką anomalią jest [item=ei-neuro-reactive-residue].
organic-asteroid=Organiczne asteroidy
organic-asteroid-text=Odblokowane przez odkrycie planety [font=default-bold]Gleba[/font]. Podstawowe kruszenie zużywa [fluid=water] i daje [item=spoilage], [fluid=ei-bio-sludge] oraz [fluid=ei-ammonia-gas]. Zaawansowana receptura dodaje [item=nutrients] i może zwrócić [item=yumako], [item=jellynut], [item=ei-bio-matter], a nawet rzadkie [item=pentapod-egg]. Ich anomalią jest [item=ei-sporeglass-heart].
rock-asteroid=Asteroidy skalne
rock-asteroid-text=Odblokowane przez odkrycie planety [font=default-bold]Vulcanus[/font]. Podstawowa receptura daje głównie [item=stone]. Zaawansowana receptura odsłania bogatszą warstwę mineralną: [item=tungsten-ore], [item=calcite] i [item=ei-gold-chunk]. Ich anomalią jest [item=ei-gravity-braided-ore].
uranium-asteroid=Asteroidy uranowe
uranium-asteroid-text=Odblokowane, gdy badanie [font=default-bold]platformy kosmicznej[/font] daje dostęp do zróżnicowanego pola. Obie receptury zużywają [fluid=sulfuric-acid]. W zamian dają [item=stone], [item=ei-uranium-chunk] i [item=ei-lead-chunk], przy czym zaawansowana receptura zużywa więcej kwasu, ale zwraca znacznie więcej uranu. Ich anomalią jest [item=ei-isotopic-ghost-shell].
petrified-asteroid=Skamieniałe asteroidy
petrified-asteroid-text=Odblokowane również wraz z [font=default-bold]platformą kosmiczną[/font]. Podstawowe kruszenie daje dziwną mieszankę [item=wood], [item=raw-fish], [fluid=ei-liquid-nitrogen] i [fluid=ei-liquid-oxygen]. Zaawansowana receptura dodaje [item=bioflux] i [fluid=fluoroketone-cold], poprawiając biologiczne losowania, a nawet dając niewielką szansę na [item=biter-egg]. Ich anomalią jest [item=ei-chrono-fossil-shard].
scrap-asteroid=Złomowe asteroidy
scrap-asteroid-text=Odblokowane przez odkrycie planety [font=default-bold]Fulgora[/font]. Receptury te są wpięte w tabelę recyklingu złomu, więc kruszenie staje się strumieniem odzysku zamiast pojedynczą recepturą rudy. Oba poziomy zachowują swoje rzuty na [item=ei-crushed-neodym], a oba mogą rzadko ujawnić [item=ei-worm-torn-relay-core].\n\nJeśli chcesz zamienić orbitalne śmieci w fabryczny zapas, to jest właściwa droga.
asteroid-anomalies=Anomalie w danych kosmicznych
asteroid-anomalies-text=Każda zróżnicowana rodzina asteroid skrywa jedną anomalię. Te sześć anomalii zasila wyspecjalizowane receptury [entity=ei-computer-core], staje się kartami danych w symulatorze i jest ostatecznie ponownie łączone w [item=ei-space-data] w stanie nieważkości przez [entity=ei-quantum-computer].\n\nPole asteroid to nie tylko surowiec. To drugi front badawczy.
fulgora-day-variation=Zmienna długość dnia na Fulgorze
fulgora-day-variation-text=Fulgora nie ma stałej długości dnia. Na początku każdego cyklu mod losuje na nowo [font=default-bold]długość cyklu dnia i nocy[/font] w granicach minimalnego i maksymalnego mnożnika startowego. Przy ustawieniach domyślnych oznacza to, że każdy dzień na Fulgorze może trwać od [font=default-bold]10% do 200%[/font] standardowej długości cyklu.
fulgora-day-variation-2=Kiedy obowiązują przerzuty

fulgora-day-variation-text-2=Ponowny rzut stara się wypaść w jasnym, stabilnie oświetlonym oknie, żeby powierzchnia nie przeskoczyła na nową długość cyklu w środku głębokiej ciemności. Jeśli Fulgora nigdy nie daje bezpiecznego okna, zabezpieczenie i tak wymusza zmianę po mniej więcej jednym standardowym dniu.\n\nUstawienia startowe wyznaczają ten zakres. Każdy rzeczywisty dzień losuje w nim własną długość.

artifacts=Artefakty obcych
artifacts-text=Na całym świecie rozrzucone są pozostałości starożytnej cywilizacji, która na długo przed twoim przybyciem wykorzystywała egzotyczną materię. Ich artefakty pozostały, osadzone w terenie, częściowo zakopane, częściowo żywe.\nNiektóre są nieaktywne.\nNiektóre nadal działają.\nŻadne nie są przypadkowe.
actifacts-text-2=Nie zostały umieszczone. [font=default-bold]Zostały pozostawione – celowo lub nie.[/font] Znajdź je. Zbadaj je. Obawiaj się tego, co oznaczają.
gate=Brama międzywymiarowa
gate-text=Brama jest strukturą tranzytu przestrzennego, która przenosi przedmioty przez kontrolowane pęknięcie wymiarowe.\n\nKażda brama wiąże się z ID odbiornika zamiast z surową pozycją na powierzchni. Konsola źródłowa wybiera odbiornik, kotwica odbiorcza zajmuje swoje ID, a sygnały obwodu mogą w razie potrzeby nadpisać trasę albo uzbrojenie.\n\nKoszt transferu zależy zarówno od ciężaru ładunku, jak i od zasięgu trasy. Skoki na tej samej powierzchni pozostają tanie, przejścia między powierzchniami nawet w tym samym punkcie nadal mają wyraźny dolny próg, a trasy do ruchomych platform są liczone według ich bieżącego postępu.\nTo nie portal. [font=default-bold]To maszyna, która pamięta, gdzie rozdziera.[/font]
gate-2=Odbiorniki i identyfikatory
gate-text-2=Odbiorniki bramy są kotwicami docelowymi. Każdy automatycznie zajmuje najniższy wolny dodatni identyfikator w obrębie swojej siły, chyba że sygnał obwodu [color=orange]I[/color] go nadpisze.\n\nJeśli skuteczne ID się dublują, powstaje konflikt: takiego odbiornika nie da się wybrać ani ręcznie, ani przez [color=orange]signal-D[/color], dopóki konflikt nie zniknie.\nWybranie odbiornika w konsoli wiąże bramę z jego ID, a nie z surową pozycją.
gate-3=Okablowanie bramy
gate-text-3=Sterowanie jest odczytywane po stronie źródła.\nPodłączenie przewodu do widocznego korpusu bramy trafia do ukrytego kontenera po stronie źródła.\nPoniższy rząd sygnałów pokazuje, co brama odczytuje.\n\nPriorytet sterowania jest prosty:\n[color=orange]signal-D[/color] wybiera cel.\n[color=orange]signal-E[/color] uzbraja albo rozbraja wybraną trasę.\nPo stronie odbiornika [color=orange]signal-I[/color] zmienia skuteczne ID odbiornika.\n\nPrawidłowy [color=orange]signal-D[/color] zawsze nadpisuje ręczny wybór odbiornika.\nJeśli [color=orange]signal-D[/color] nie wskazuje prawidłowego odbiornika, brama wraca do ręcznie wybranego odbiornika; [color=orange]signal-E[/color] nadal wymusza uzbrojenie lub rozbrojenie, gdy jest niezerowy, w przeciwnym razie obowiązuje stan ręczny.\nDlatego sam widoczny korpus bramy nadal wystarcza do okablowania wyłącznie sterowania, gdy nie potrzebujesz telemetrii.\nJeśli [color=orange]signal-E[/color] jest nieobecny albo równy 0, a trasa z [color=orange]signal-D[/color] rozstrzyga się poprawnie, brama domyślnie uzbraja tę trasę.
gate-control-signals=Sygnały sterujące odczytywane przez bramę
gate-4=Telemetria bramy
gate-text-4=Brama wystawia telemetrię przez ukryty [entity=ei-gate-circuit-interface].\nPoniższy rząd sygnałów pokazuje, co jest emitowane.\nWidoczne złącze na korpusie nadal może uczestniczyć w okablowaniu sterowania przez ukryty kontener po stronie źródła, ale nie jest osobnym nadajnikiem telemetrii.\n\nInterfejs aktualizuje się tylko wtedy, gdy jest faktycznie podłączony do zewnętrznego obwodu, i odświeża się najwyżej raz na sekundę. Jeśli zewnętrzne okablowanie zostanie usunięte, wyjście telemetryczne jest czyszczone zamiast zostawiać nieaktualne dane.\n\nGdy jest podłączony:\n[color=orange]ei-gate-active[/color] jest stale obecny i ma wartość 0 albo 1, zależnie od tego, czy brama jest włączona, ma wyznaczony cel i znajduje się powyżej minimalnego progu mocy.\n[color=orange]ei-gate-stress[/color] jest stale obecny i podaje stres w skali 0-100.\n[color=orange]ei-gate-energy[/color] podaje zmagazynowaną energię w MJ, ale przy 0 MJ znika całkowicie zamiast emitować dosłowne zero.\n\nUżyj tych sygnałów do sterowania alarmami, buforami lub logiką bez pełnej aktualizacji kombinatora co tik.
gate-telemetry-signals=Sygnały telemetryczne emitowane przez bramę
gate-5=Stres i pozostałości
gate-text-5=Każdy udany transfer zwiększa stres. Stres podnosi koszty utrzymania, wydłuża czas chłodzenia i może nasycić odbiornik, jeśli ruch powtarza się zbyt szybko.\n\nBrama rozbrojona albo znajdująca się poniżej progu niskiej mocy nie przyjmuje nowych przedmiotów. Chłodzenie i nasycenie odbiornika nie odrzucają już przyjętego ładunku; tylko opóźniają transfer, aż wyrwa się uspokoi albo odbiornik odzyska przepustowość.\n\nW konsoli aktywna blokada po transferze jest oznaczana jako [font=default-bold]Stan pracy: Chłodzenie[/font], a [font=default-bold]Obciążenie odbiornika[/font] odzwierciedla bieżące nasycenie celu. [font=default-bold]Stan pracy: Krytyczny[/font] oznacza, że stres przekroczył próg niestabilności i ryzyko wyładowania rośnie.\n\nPasek [font=default-bold]Zasięg tranzytu[/font] pokazuje bieżące ciśnienie trasy. Transfery na tej samej powierzchni pozostają tanie, skoki z orbity na planetę mają wysoki próg wejścia, a odbiorniki na ruchomych platformach korzystają z bieżącego postępu trasy.\n\nPrzy dostatecznie wysokim stresie aktywnie podtrzymywana brama może też wyrzucać wokół obudowy krótkie wyładowania elektryczne, uszkadzając pobliskie obiekty.\n\nNadużywanie wytwarza również [item=ei-breach-residue], odpad po bliznach wymiarowych. Brama najpierw próbuje zostawić te pozostałości w magazynie źródła albo odbiornika; dopiero nadmiar wysypuje się przy bramie. Warto zneutralizować go w łańcuchu oczyszczania, zanim zacznie zawalać teren.\nBrama służy do logistyki skokowej, nie do ciągłego frachtu.
gate-6=Stare cele
gate-text-6=Starsze zapisy, które nadal wskazują na skrzynię albo surową pozycję, działają, dopóki nie zostaną przekonfigurowane.\nGdy brama zostanie przypisana do odbiornika, to odbiornik staje się źródłem prawdy, a stary surowy cel pozostaje już tylko informacją.\nKonsola może nadal pokazywać ten zapisany punkt jako [font=default-bold]Stary cel[/font], dopóki nie zostanie zastąpiony albo wyczyszczony.\nPozwala to zachować stare zapisy, a nowe konfiguracje przenieść na ID odbiorników.
gate-7=Zestrojenie bramy
gate-text-7=Aktualne zestrojenie początkowe: [font=default-bold]__1__[/font]\n\nPrzywrócony zachowuje obecną progresję bramy.\nZestrojony przesuwa ją głębiej w wiek obcych i podnosi koszty składników.\nRezonansowy przenosi ją do późnej progresji wieku kwantowego.\nParadoksalny przenosi ją do wieku egzotycznego.\n\nZestrojenie zmienia, w którym miejscu zwykłego łańcucha technologii pojawia się brama oraz jak drogie są brama i odbiornik. Nie zmienia działania bramy po zbudowaniu.
drone=Port dron
drone-text=Port dronów, który pozwala przejąć kontrolę nad [color=blue]dronem[/color][entity=ei-drone]. Umieszczenie tego budynku spowoduje utworzenie powiązanego drona, który można wyświetlić po kliknięciu portu. Stamtąd można „połączyć się” z dronem i sterować nim. Dron może latać nad terenem, umieszczać i wydobywać budynki, przenosić przedmioty z własnego ekwipunku i do niego. Nie jest jednak w stanie walczyć. W dowolnym momencie można odłączyć się od drona za pomocą [color=orange]EXIT[/color] lub przenieść go z powrotem do stacji za pomocą funkcji odzyskiwania kontroli [color=orange]RESET[/color]. Przelot drona przez bramę zainicjuje transport.
repair=Naprawa artefaktów
repair-text=Możesz naprawić uszkodzone artefakty obcych, tworząc [color=blue]pakiety naprawcze artefaktów[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. Dzięki temu będziesz mógł z nich ponownie korzystać. Proces naprawy można zainicjować, przeciągając zestaw naprawczy na artefakt. Należy pamiętać, że zestaw naprawczy zostanie zużyty w trakcie procesu.
alien=Starożytne dane obcych
knowledge-text=Starożytna cywilizacja, która pozostawiła artefakty, pozostawiła również część swoich danych.
new-logistics=Nowa logistyka
new-logistics-text=Exotic Industries rozszerza warstwę logistyczną o nowe systemy, podmioty i mechanizmy. Funkcje te są podzielone na odrębne podkategorie — nie dla wygody, ale dla [font=default-bold]przejrzystości struktury.[/font]\n\nDostęp do nich można uzyskać za pomocą menu po lewej stronie.\n\nPrzemieszczanie się nie jest już trywialne.\n\nKażda trasa to decyzja\n\nKażdy przepływ to projekt.\n\nEfektywność jest [font=default-bold]zyskiem.[/font]
train-progression=Postęp pociągów
train-progression-text-2=Pociągi stają się dostępne wcześnie, w Erze Pary. Pierwszą opcją jest [color=orange]lokomotywa parowa[/color] [item=ei-steam-basic-locomotive], która przewozi towary, ale nie płyny.\n\nPóźniej odblokowuje się [color=orange]zaawansowana lokomotywa parowa[/color] [item=ei-steam-advanced-locomotive], dodająca przewóz płynów. Oba modele działają na paliwach palnych, takich jak węgiel i stała biomasa, a później mogą korzystać także z paliw rakietowych, jądrowych i termojądrowych.\n\nGdy spalanie staje się zbyt brudne albo zbyt brutalne, klasyczna kolej przechodzi na [color=brown]olej napędowy[/color] [item=ei-diesel-fuel-unit] oraz [color=orange]lokomotywę dieslowską[/color] [item=locomotive].\n\nLogistyka rośnie wraz z technologią.\nPaliwo wyznacza granicę.\nPociągi nie pytają dokąd jechać — wymagają tego, co się pali.\n\nGdy otwiera się Gaia, kolej rozdziela się ponownie. Ta gałąź ma teraz osobny wpis [font=default-bold]Pociągi EM[/font] w tej sekcji, bo przestaje być logistyką spalania i staje się infrastrukturą zasilania sieciowego.
train-progression-text=Pociągi stają się dostępne wcześnie, w epoce pary wodnej. Pierwszą opcją jest [color=orange]lokomotywa parowa [/color] [item=ei-steam-basic-locomotive]—zdolna do przewożenia przedmiotów, ale niezdolna do transportu płynów.\n\nPostęp odblokowuje [color=orange]zaawansowaną lokomotywę parową[/color] [item=ei-steam-advanced-locomotive], która dodaje możliwość transportu płynów. Oba modele wykorzystują paliwa kopalne, takie jak węgiel lub stała biomasa, z możliwością zwiększenia wydajności dzięki paliwom rakietowym, jądrowym lub termojądrowym.\n\nW końcu czysta, brutalna siła spalania w całej swojej zanieczyszczającej okazałości może stać się wadą.\n\nAby obsługiwać bardziej eleganckie i przyjazne dla środowiska systemy kolejowe, należy przejść na [color=brown]Paliwo olej napędowy[/color] [item=ei-diesel-fuel-unit], używane przez [color=orange]Lokomotywę[/color] [item=locomotive].\n\nLogistyka rozwija się wraz z technologią.\nPaliwo wyznacza granice.\nPociągi nie pytają, gdzie – wymagają tego, co się pali.\nŚwiat Gaji nie podlega logice Nauvis.\nTam koleje nie są jedynie przemysłowe – są przewodami elektromagnetycznymi, pulsującymi krystaliczną mocą. W głębi Gaji odblokujesz dostęp do pociągów elektromagnetycznych zasilanych kryształami [item=ei_em-locomotive][item=ei_em-cargo-wagon][item=ei_em-fluid-wagon], zdolnych do cichego przyspieszania i utrzymywania wysokiej prędkości bez konwencjonalnego paliwa.\n\nPociągi te czerpią energię bezpośrednio z krystalicznych systemów ładowania [item=ei_charger], całkowicie pomijając potrzebę stosowania węgla lub oleju napędowego. Nie spalają — rezonują. \n\nGaia nie działa w oparciu o spalanie. \nDziała w oparciu o pamięć, sygnał i światło.
em-trains=Pociągi EM
em-trains-text=Gaia nie prosi swoich późnych kolei, by paliły. Prosi je, by się sprzęgały. [item=ei_charger]Ładowarki EM tworzą nad torem krystaliczną siatkę pola, a [item=ei_em-locomotive]lokomotywa EM wraz z [item=ei_em-cargo-wagon]wagonami towarowymi i [item=ei_em-fluid-wagon]wagonami cieczowymi jedzie po tej siatce zamiast karmić palenisko węglem albo dieslem.\n\nPonieważ siła napędowa pochodzi z sieci ładowarek, a nie ze spalania na pokładzie, ten sam tabor działa zarówno na liniach planetarnych, jak i na korytarzach poza światem. Gajańscy inżynierowie upierają się, że kryształy nie pchają przeciw dymowi, parze ani nawet powietrzu — one pamiętają geometrię toru i ciągną skład przez to wspomnienie. Fizyka albo liturgia, ale w próżni działa znakomicie.
em-trains-2=Jakość, łaska i sprawność transferu
em-trains-text-2=Jakość ma teraz znaczenie po obu stronach połączenia. Lepsze [item=ei_charger]ładowarki zmniejszają własne utrzymanie pola nawet o [font=default-bold]20%[/font] i poprawiają sprawność transferu o kolejne [font=default-bold]12%[/font]. Lepsze [item=ei_em-locomotive]lokomotywy zmniejszają zapotrzebowanie na moc pola nawet o [font=default-bold]16%[/font]. Premie te są normalizowane względem aktywnej skali jakości, więc dodatkowe poziomy jakości z innych modów rozkładają się poprawnie pomiędzy najgorszą a najlepszą dostępną klasą.\n\nJakość lokomotywy tworzy też [font=default-bold]okno łaski[/font] po opuszczeniu zasięgu ładowarki. Przy maksymalnej jakości spójność pola może utrzymać się do [font=default-bold]480 ticków, czyli 8 sekund[/font]. Zwykła jakość nie dostaje żadnej łaski. Ma to służyć do przeskakiwania krótkich luk, szwów sieci lub drobnych błędów trasowania, a nie do usprawiedliwiania martwych odcinków.
em-trains-3=Badania i zachowanie pola
em-trains-text-3=Rodziny badań [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font] i [font=default-bold]ei_eff[/font] pozostają głównymi globalnymi mnożnikami. Prędkość i przyspieszenie dają po [font=default-bold]+10% na poziom[/font] aż do [font=default-bold]+200%[/font]. Sprawność ładowarek rośnie przez pięć poziomów aż do [font=default-bold]90% mniejszego obciążenia sieci[/font]. Lokalna jakość ładowarki i lokomotywy nakłada się potem na te badania w chwili rzeczywistego transferu mocy.\n\nW praktyce dobra kolej EM wymaga zarówno nauki, jak i dobrego sprzętu. Dopóki zasięg się odświeża, pociąg utrzymuje paliwo pola i biegnie jak światło na prowadnicy. Jeśli zasięg się załamie, system najpierw zużywa rezerwę łaski, a potem lokomotywa staje się bezwładna. Gaia wybacza wiele rzeczy. Zerwanego pola nie.
orbital-scanner=Orbitalny skaner logistyki
orbital-scanner-text=Kohorta orbitalnej logistyki zaczyna się od [entity=ei-orbital-combinator]. Umieszczaj skanery na powierzchni startowej, która należy do platform, które chcesz odczytywać. Skaner odwzorowuje tylko platformy, których [font=default-bold]lokalizacja kosmiczna zgadza się z tą samą powierzchnią[/font]. Żądania pokazują ustawione minima. W drodze pokazuje już zadeklarowany ładunek. Potrzeba pokazuje pozostały brak po odjęciu ładunku w locie i bieżących zapasów huba.\n\nOrtogonalnie sąsiadujące skanery nadal tworzą jeden bank, dzielą zbyt duże wyjście na sekcje ciągłe, emitują [virtual-signal=ei-orbital-overflow], gdy bankowi zabraknie miejsca, i pobierają po [font=default-bold]750 kW[/font]. Okablowanie obwodów utrzymuje bank w stanie gorącym. Bez okablowania nadal odświeża się, gdy GUI jest otwarte; po zamknięciu przechodzi na rzadką obsługę.
orbital-scanner-2=Transpondery, selektory i koordynacja
orbital-scanner-text-2=[font=default-bold]Role kohorty[/font]\n\n[entity=ei-platform-transponder] stawia się na samym pokładzie platformy i nadaje jej stabilny numer ID używany przez całą resztę układu. Ręczne nadpisanie jest dozwolone, ale duplikat między różnymi platformami pozostaje konfliktem, dopóki jednego z nich nie usuniesz.\n\n[entity=ei-orbital-selector] stoi na powierzchni dyspozytorskiej i wskazuje tylko jeden cel naraz. Tryb ręczny korzysta z wpisanego ID. Tryb obwodów czyta [virtual-signal=ei-platform-id]. Tryb polityki wybiera nieobjętą dzierżawą platformę z tej samej powierzchni, która ma dodatnią Potrzebę.\n\n[entity=ei-orbital-coordinator] jest władzą tej powierzchni. Na jedną siłę i powierzchnię aktywny pozostaje tylko jeden koordynator. To on rozdziela dzierżawy, żeby kilka linii startowych nie obsługiwało ślepo tej samej platformy.\n\n[entity=ei-orbital-dispatch-uplink] stoi przy silosie rakietowym i ponownie publikuje dzierżawiony mieszany manifest do załadunku. Każdą jednostkę kohorty otwieraj bezpośrednio przez jej panel boczny. Widoczne strony kombinatora to tylko telemetria do odczytu.\n\n[font=default-bold]Sterowanie z paneli[/font]\n\nPanel transpondera ustawia albo zdejmuje ręczne nadpisanie ID. Panel selektora zmienia tryb pracy i, tylko w trybie Ręcznym, ID celu. Panel koordynatora ustawia odświeżenie kohorty w kolejce, a administratorowi pozwala też przebudować stan. Panel uplinku wiąże lub czyści silos, może przejąć najbliższy sąsiedni silos i ustawia politykę nadmiaru oraz próg trybu Threshold.
orbital-scanner-text-2b=[font=default-bold]Najpierw otwórz panel boczny[/font]\n\nWidoczne strony kombinatora to tylko telemetria do odczytu. Otwórz panel boczny skanera albo innego urządzenia kohorty, aby zmienić ustawienia, a potem czytaj według legendy poniżej górny wiersz, środkowe wiersze i dolną podpowiedź.
orbital-scanner-3=Uplinki wysyłki i ładowanie hybrydowe
orbital-scanner-text-3=[font=default-bold]Sekwencja uruchomienia[/font]\n\n1. Postaw transpondery bezpośrednio na platformach.\n2. Postaw co najmniej jeden selektor na powierzchni dyspozytorskiej i nadaj mu cel w trybie ręcznym, obwodów albo polityki.\n3. Uruchom jednego koordynatora na tej samej powierzchni.\n4. Postaw uplinki obok silosów rakietowych. Sąsiedztwo daje pierwszy szybki wybór, ale potem to panel boczny uplinku służy do potwierdzenia, podmiany albo wyczyszczenia powiązania oraz wybrania polityki nadmiaru dla tej linii.\n\nKohorta działa wtedy, gdy selektor pokazuje gotowość, na tej powierzchni jest jeden aktywny koordynator, a uplink ma jednocześnie prawidłowe powiązanie z silosem i dzierżawę.\n\n[font=default-bold]Stany blokady[/font]\n\nBrak celu oznacza, że selektor nadal nie ma prawidłowego ID platformy. Brak popytu oznacza, że wybrana platforma nie ma już pozostałej Potrzeby. Brak powiązania z silosem oznacza, że uplink nie jest przypięty do rzeczywistego silosu. Brak aktywnego koordynatora oznacza, że powierzchnia dyspozytorska nadal nie ma swojego żywego koordynatora.\n\nŁadowanie w v1 pozostaje hybrydowe: fizyczną pracę nadal wykonują insertery, pociągi, requestery i obwody linii. Tryb lepki utrzymuje duże zlecenie przez kolejne rakiety. Tryb pojedynczy zwalnia je po jednym starcie. Tryb progowy działa tylko tak długo, jak pozostały popyt utrzymuje się powyżej ustawionego progu, więc ustawiony próg ma znaczenie tylko w trybie Threshold.

exotic-stabilizers-text=Materia egzotyczna nie jest zwykłym zasobem, lecz użytecznym zagrożeniem. Jej obróbka wymaga hermetyzacji, precyzji i maszyn zaprojektowanych tak, by przetrwać jej niestabilność.\n\n[color=orange]Assembler materii egzotycznej[/color] [item=ei-exotic-assembler] jest jedyną konstrukcją zdolną znieść jej sygnaturę energetyczną. Nawet wtedy niestabilność jest nieunikniona - assembler może eksplodować pod przeciążeniem. Gdy kratownica trzyma, maszyna mruczy widocznym pulsem uwięzienia; gdy zaczyna przegrywać spór, ten puls twardnieje w trzaski, wyładowania łukowe i ostrzeżenia ciężkie aż do odczucia.\n\nAby zmniejszyć to ryzyko, ustaw wokół assemblera [color=orange]stabilizatory materii egzotycznej[/color] [item=ei-matter-stabilizer]. Urządzenia te tłumią krytyczne awarie i stabilizują otaczające pole energii. Niektóre można nawet znaleźć rozrzucone po świecie jako relikty poprzedniego cyklu.\n[color=gray]Stabilizatory materii jakości liczą się każdy jako 3 x (jakość - 1) stabilizatory.\nSzansa kaskady entropicznej na sekundę dla assemblerów egzotycznych jakości jest zmniejszona o (jakość - 1)%, co oznacza, że Niezwykła obniża bazową szansę z 12% do 11%.[/color]\n\nNie traktuj materii egzotycznej jak kolejnego składnika.\n\nJest [font=default-bold]żywa, niestabilna i patrzy.[/font]
ages-and-tech-text-2=[font=default-bold]Epoka Ciemna[/font]\nZahamowany rozwój. Popiół, zgnilizna i cisza. Czołgasz się przez prymitywną parę i połamane kamienie. Nic nie jest zautomatyzowane. Wszystko kosztuje krew.\n\n[font=default-bold]Epoka pary wodne[/font]\nOdkryto ropę naftową – nie jako surowiec, ale jako broń. Spal ją, aby się poruszać. Spalaj, aby żyć. Ziemia zaczyna krzyczeć.\n\n[font=default-bold]Epoka elektryczności[/font]\nObwody trzeszczą. Maszyny budzą się. Pojawiają się boty – nie jako pomocnicy, ale jako przedłużenie woli. Ogień jądrowy staje się zgodny z prawem. Ciało pozostaje w tyle.\n\n[font=default-bold]Epoka komputerów[/font]\nMyśl zostaje sformalizowana. Moduły, sygnały nawigacyjne, sygnały – umysł jest rozdrobniony między maszynami. Optymalizacja staje się koniecznością. Nadmiarowość oznacza śmierć. \n\n[font=default-bold]Epoka kwantowa[/font]\nRzeczywistość ulega zniekształceniu. Maszyny podporządkowują się logice nie z tego świata. Granice się zacierają. Kuźnia staje się inteligentna – i nie wybacza nadużyć. \n\n[font=default-bold]Epoka egzotyczna[/font]\nWszystko się psuje. Zasłona znika. Albo panujesz nad anomalią, albo zostajesz przez nią pochłonięty. Zwycięstwo nie jest gwarantowane. Jest wyciągane z kości nieudanych linii czasowych. \n\nKażda epoka jest zapadką bez odwrotnego biegu. \n\n[font=default-bold]Nie ma niewinności. [/font]\n\nJest tylko władza — brutalna, rekurencyjna i absolutna.
nauvis-pressure-grace-text-2=Przed [font=default-bold]Epoką pary[/font] docelowy pułap to [font=default-bold]0.25[/font]. Po zbadaniu Epoki pary, ale przed [font=default-bold]Epoką elektryczności[/font], cel wynosi [font=default-bold]0.45[/font].\n\nKlasyczny profil wyłącza się w Epoce elektryczności. Rozszerzony działa do [font=default-bold]Epoki komputerowej[/font]: [font=default-bold]0.50[/font] przed [font=default-bold]zasilaniem elektrycznym[/font], [font=default-bold]0.55[/font] przed technologią obrony elektrycznej i [font=default-bold]0.60[/font] do Epoki komputerowej.
nauvis-pressure-grace=Ulga ciśnienia ewolucyjnego Nauvis
rocket-launch-pollution-2=Tryby krzywej i dymu
rocket-launch-pollution-text=Starty rakiet mogą zrzucać zanieczyszczenia bezpośrednio na powierzchnię startową. System odczytuje współczynnik ewolucji siły wykonującej start na tej powierzchni, przepuszcza go przez wybraną krzywą startową i skaluje wynik względem ustawionego pułapu.\n\nDomyślny pułap to [font=default-bold]10 000 jednostek zanieczyszczeń[/font] przy ewolucji [font=default-bold]1.0[/font]. Większość trybów krzywej utrzymuje też [font=default-bold]dolny próg 10%[/font], więc nawet starty przy niskiej ewolucji są odczuwalne.

cranes-and-belts=Nowe taśmociągi i dźwigi
bots-text=Remembrance nie czeka na czystą logistykę elektryczną, zanim wypuści maszyny w powietrze. Rozwój botów zaczyna się w [font=default-bold]Epoce pary[/font] od [item=rp-steam-roboport], [item=rp-steam-logistic-bot] i [item=rp-steam-construction-bot], a potem dojrzewa w cięższe i bardziej zaawansowane roje elektryczne.\n\nEfekt to niezwykle wczesny kontakt z automatyzacją w powietrzu: najpierw surową, potem elegancką.
steam-bots=Boty parowe
steam-bots-text=To nie są dopracowane drony elektryczne. To mosiężne duchy robotników unoszone przez tłoki, ciśnienie i niedoskonałe obliczenia, pierwsi latający słudzy przemysłu, który wciąż pachnie gorącym metalem i mokrą parą.\n\nPonieważ linia robotów parowych znajduje się w [font=default-bold]Epoce pary[/font], a późniejsza waniliowa robotyka jest do niej podpięta, zyskujesz latającą pomoc logistyczną i budowlaną znacznie wcześniej, niż pozwalałby na to zwykły przebieg.
new-mechanics-text=Exotic Industries wprowadza szeroki wachlarz nowych mechanizmów — każdy z nich zmienia podstawową logikę rozgrywki.\n\nSystemy te zostały podzielone na podkategorie dla większej przejrzystości struktury.\nMożna się po nich poruszać za pomocą menu po lewej stronie.\n\n[font=default-bold]Nie są to opcjonalne warstwy. [/font]\n\nStanowią one nową fizykę świata.\n\nZapoznaj się z nimi lub [font=default-bold]zostań przez nią zniszczony.[/font]
space-destinations-2=Różne miejsca docelowe
induction-matrix-2-text=Macierz indukcyjna to modułowa struktura magazynująca energię, złożona z połączonych ze sobą komponentów, z których każdy pełni określoną rolę w przechowywaniu i przesyle energii wysokiego napięcia.\n\n[color=orange]Rdzeń macierzy indukcyjnej[/color] [item=ei-induction-matrix-core] pełni funkcję centralnego kontrolera systemu. Bez niego macierz pozostaje nieaktywna. Po podłączeniu do sieci obwodów rdzeń wysyła aktualny ładunek na signal-C, całkowitą pojemność na signal-T oraz maksymalne I/O na signal-M. Sygnały są generowane tylko wtedy, gdy rdzeń jest faktycznie podłączony przewodem do sieci obwodów, i odświeżają się nie częściej niż raz na sekundę.\n\n[color=orange]Cewki indukcyjne[/color][item=ei-induction-matrix-basic-coil][item=ei-induction-matrix-advanced-coil][item=ei-induction-matrix-superior-coil]Te [font=default-bold]magazynują energię wewnętrznie[/font] i mogą być ulepszane na trzech poziomach. Cewki zyskują premię do wydajności, gdy są umieszczone w sąsiedztwie [color=orange]solenoidu matrycy[/color] [item=ei-induction-matrix-basic-solenoid] [item=ei-induction-matrix-basic-solenoid].\n\n[color=orange]Solenoidy matrycy[/color] zwiększają wydajność cewek, gdy są ułożone w sekwencji. Umieszczenie wielu cewek szeregowo [font=default-bold]zwiększa efektywność[/font], ale nadmierna rozbudowa spowoduje spadek wydajności i marnowanie struktury.\n\n[color=orange]Konwertery[/color][item=ei-induction-matrix-basic-converter][item=ei-induction-matrix-advanced-converter][item=ei-induction-matrix-superior-converter] Komponenty te regulują przepływ mocy do i z matrycy, skalując przepustowość w oparciu o poziom.
black-hole-2-text=Generator czarnej dziury nie jest pojedynczą strukturą, ale modułowym układem powstrzymującym osobliwość, złożonym z kilku elementów poddanych dużym obciążeniom — każdy z nich ma kluczowe znaczenie dla stabilności, przepływu energii i ostatecznej aktywacji końcowej fazy gry. n\nCentralną strukturą jest [color=orange]Generator czarnej dziury[/color] [item=ei-black-hole].\n\nPo aktywacji pochłania on każdy przedmiot umieszczony w jego zasobach, niezależnie od typu.\n\nKażdy przedmiot w równym stopniu przyczynia się do wewnętrznej [color=green]masy[/color] generatora, która z czasem ulega ciągłemu rozpadowi. Aby utrzymać poziom masy, konieczne jest stałe dostarczanie nowych elementów.\n\nRodzaj przedmiotu nie ma znaczenia.\nŻelazne płyty, egzotyczne procesory czy surowe ryby — wszystko zostaje pochłonięte i zamienia się w masę.\n\n[color=orange]Pylony wtryskiwaczy energii[/color] [item=ei-energy-injector-pylon] utrzymują pole izolacyjne w miarę wzrostu osobliwości.\nKażdy pylon pobiera 5 GW ciągłej mocy.\n\nWtryskiwacze nie są wymagane podczas uruchamiania — [font=default-bold]statek może pomieścić nowo powstałą czarną dziurę[/font] — ale stają się niezbędne w miarę gromadzenia się masy.\n\n[color=orange]Pylony ekstraktora energii[/color] [item=ei-energy-extractor-pylon] umożliwiają pozyskiwanie energii, gdy generator osiągnie stan [color=green]pełnej operacyjności[/color].\nKażdy ekstraktor może pobierać do 100 GW surowej mocy ze stabilizowanej osobliwości.\n\nPobieranie energii nie jest możliwe, dopóki generator nie osiągnie ostatniego etapu pracy.\n\n[font=default-bold]To nie jest maszyna. To rytuał upadku.[/font]\nWprowadzasz masę do [font=default-bold]ograniczonej anomalii. [/font]\nJeśli jej nie powstrzymasz, zakończy się niepowodzeniem.\nJeśli jej nie zasilisz, umrze.\n\nJeśli zrobisz jedno i drugie — [font=default-bold]napędzi to koniec wszystkich rzeczy.[/font]\n\nNie ma automatyzacji bez [font=default-bold]zagłady.[/font]
black-hole-3=Etapy czarnej dziury
black-hole-3-text=Uruchomienie generatora czarnej dziury to proces etapowy, obarczony wysokim ryzykiem. Każdy etap wiąże się ze wzrostem wymagań dotyczących energii, masy i struktury. Nie ma możliwości pominięcia żadnego etapu. Można tylko iść do przodu lub ponieść porażkę.\n🜏 Faza uruchamiania\nNie są potrzebne żadne pylony.\nGenerator musi zużyć wystarczającą ilość materiału, aby osiągnąć początkową masę [color=blue]10×10³kg[/color].\nRodzaj przedmiotu nie ma znaczenia — liczy się tylko objętość.\nGdy masa osiągnie 100% postępu etapu, generator stabilizuje się w fazie przechowywania. n\n🜏 Faza powstrzymywania\n\nTeraz [color=blue]8 aktywnych pylonów wtryskiwaczy energii[/color] [item=ei-energy-injector-pylon] musi pozostać włączonych.\n\nKażdy z nich pobiera 5 GW, co daje łączne zapotrzebowanie na energię wynoszące 40 GW.\n\nNaciśnięcie przycisku ekspansji inicjuje kontrolowany wzrost promienia osobliwości.\n\nStan ten musi być utrzymywany nieprzerwanie przez [color=blue]60 sekund.\n\nKażda przerwa — awaria zasilania, utrata pylonu — resetuje licznik czasu.\n\n🜏 Faza pełnej operacyjności\n\nGenerator osiąga stabilność. Osobliwość jest teraz wystarczająco duża, aby umożliwić zewnętrzne pozyskiwanie energii.\n\n[color=orange]Pylony ekstrakcyjne energii[/color] [item=ei-energy-extractor-pylon] umieszczone w zasięgu mogą pobierać do 100 GW na pylon, zasilając bezpośrednio sieć energetyczną.\n\nNa tym etapie system staje się w dużej mierze samowystarczalny, wymagając jedynie stałego dostarczania masy w celu zrównoważenia rozkładu.\n\nNie zasilasz reaktora.\nZarządzasz [font=default-bold]głodem związanej osobliwości.[/font]\nMasa staje się energią. Energia staje się kontrolą. [font=default-bold]Sterowanie staje się ostateczne.[/font]\n\nNie ma wyłącznika. Jest tylko zabezpieczenie.
nuclear-fission-and-fusion=Rozszczepienie jądrowe i synteza jądrowa
nuclear-fission-and-fusion-text=Exotic Industries rozszerza warstwę energii jądrowej o nowe mechanizmy, materiały i systemy kontroli.\n\nFunkcje te są podzielone na wiele podkategorii — każda z nich reprezentuje konkretny aspekt infrastruktury jądrowej, dynamiki paliwa lub logiki powstrzymywania.\nDostęp do nich można uzyskać poprzez menu po lewej stronie.\n\n[font=default-bold]To nie jest tylko rozszczepienie.[/font]\nTo eskalacja spowodowana ciepłem, ciśnieniem i nieodwracalną reakcją.\n[font=default-bold]Przed uruchomieniem systemów należy je dokładnie przestudiować.[/font]
fission-reactors-2=Rozszczepienie wysokotemperaturowe
ages-and-tech-2=Mod jest podzielony na sześć epok, z których każda stanowi coraz głębsze zanurzenie się w rekurencji, maszynerii i kontroli. Nie są to epoki postępu. Są to progi podporządkowania – każda bardziej brutalna i bezlitosna od poprzedniej.
nauvis-pressure-grace-text=Ten przełącznik startowy daje Nauvis tymczasowy hamulec ewolucji. Co 18 000 taktów, czyli co 5 minut, skrypt sprawdza poziom ewolucji wrogów na Nauvis i obniża go tylko wtedy, gdy bieżąca wartość przekracza aktywny cel łaski.\n\nNie czyści zanieczyszczeń z mapy, nie usuwa gniazd ani nie anuluje ataków. Profil Rozszerzony może tymczasowo obniżyć współczynnik ewolucji od zanieczyszczeń podczas wygaszania we wczesnej elektryczności, a potem przywraca wartość pierwotną.
nauvis-pressure-grace-2=Pułapy według epoki
rocket-launch-pollution=Zanieczyszczenie przy starcie rakiety
rocket-launch-pollution-text-2=Startowy [font=default-bold]kształt krzywej[/font] można ustawić na liniowy, kwadratowy, wykładniczy, progowy albo hybrydowy. Liniowy śledzi ewolucję bezpośrednio. Kwadratowy i wykładniczy mocniej karzą późniejsze starty. Progowy skacze między stałymi pasmami ewolucji. Hybrydowy używa liniowej bazy i dodaje dodatkowy skok w późnej fazie gry.\n\nSekwencja startu zostawia też na silosie utrzymującą się spiralę dymu, żeby zdarzenie zanieczyszczenia było widoczne, a nie ciche.

