[mod-setting-description]
ei-rocket-launch-pollution-cap=Ilość zanieczyszczeń emitowanych przy starcie rakiety przy współczynniku ewolucji 1.0.
ei-rocket-launch-pollution-mode=linear -> przewidywalny, równomierny wzrost wraz z ewolucją\nquadratic -> łagodniejszy początek, mocniejszy wzrost w późnej fazie gry\nexponential -> bardzo łagodny początek, ostry skok pod koniec\nthreshold -> skokowe wzrosty na progach ewolucji\nhybrid -> liniowa baza + dodatkowy skok w późnej fazie gry
ei-rocket-launch-pollution-visual-style=Hybrydowy zaczyna od osłabionego dymu przy wyrzutni, który wygasa, gdy zaczyna się wznoszący pióropusz. Tylko wznoszący się pióropusz zachowuje dym lecący w górę i pomija dym przy wyrzutni. Filmowy utrzymuje pełny wydech przy wyrzutni, aż przejmie go pióropusz. Tylko wydech wyrzutni zachowuje dym przy ziemi bez pionowego pióropusza.
ei-enable-preliminary-k2so-patch=Domyslnie utrzymuje rozwijana warstwe kompatybilnosci Krastorio2 Spaced Out w stanie uspienia. Wlacz te opcje tylko wtedy, gdy chcesz swiadomie przetestowac obecny zestaw wstepnych poprawek.
ei-gate-difficulty=Dostosowuje zestrojenie i progresję bramy. Przywrócony zachowuje obecną progresję bramy. Zestrojony przesuwa ją na późny etap wieku obcych. Rezonansowy przesuwa ją na późny etap wieku kwantowego. Paradoksalny przesuwa ją do wieku egzotycznego. Przeznaczone do nowych zapisów albo do zmiany przed zbadaniem bramy.
ei-nauvis-pressure-grace=Tymczasowo spowalnia nadmiarową ewolucję wrogów na Nauvis. Wybrany profil decyduje, czy łaska kończy się w Epoce elektryczności, czy wygasa przez jej wczesny etap. Impossible wyłącza ją nawet przy włączonym przełączniku.
ei-nauvis-pressure-grace-profile=Klasyczny zachowuje dawne odcięcie w Epoce elektryczności. Rozszerzony, domyślny, działa dalej ze słabszymi pułapami wczesnej elektryczności i tymczasowo obniża współczynnik ewolucji od zanieczyszczeń, po czym przywraca pierwotną wartość.
ei-enemy-difficulty=Wybiera drabinę statystyk wrogów używaną przez Exotic Industries: Remembrance. Gentle do Nightmare zmieniają tylko statystyki walki i spawnowania wrogów. Original zostawia wszystko na 1.0. Merciful i Impossible dodają też kilka wyjątków dla apexów. Impossible wyłącza też łaskę Nauvis i zamienia zanieczyszczenie z lądowania rakiety w odwet na już wrogich powierzchniach.
ei-gate-notifications=Wyświetla powiadomienia czatu związane z bramą, takie jak aktualizacje celu i ostrzeżenia o niskiej mocy.
ei-black-hole-notifications=Wyświetla powiadomienia czatu związane z czarną dziurą, takie jak ostrzeżenia o awarii utrzymania pola.
ei-matter-machine-notifications=Wyświetla powiadomienia czatu związane z maszynami materii, takie jak ostrzeżenia o konserwacji, niestabilności lub braku zasilania.
ei-insulated-pipe-notifications=Wyświetla powiadomienia czatu związane z izolowanymi rurami, takie jak ostrzeżenia o odgazowaniu, rozerwaniu lub skażeniu.
ei-check-for-recipe-icons-improvement-mod=Przy wczytywaniu lub odrodzeniu sprawdza obecność [color=red]zdecydowanie zalecanego[/color] modułu Recipe Icons Improvement for Exotic Space Industries Remembrance autorstwa [color=orange]NaK1119[/color]. Ułatwia odczyt receptur, przedmiotów i płynów, porządkuje ich sygnały oraz pomaga uniknąć trudnych do rozróżnienia ikon. Można wyłączyć w ustawieniach startowych.
ei-tech-scaling-maxCost=Maksymalny [color=red]indywidualny[/color] koszt pakietu naukowego na technologię.\n[color=pink]Niedzielny spacer[/color] — 207\n[color=white]Spacer po parku[/color] — 415\n[color=#D2B48C]Prawie za darmo[/color] — 831\n[color=gray]Bardzo tani[/color] — 1662\n[color=white]Domyślny[/color] — 2500\n[color=cyan]Bardziej tani[/color] — 3325\n[color=blue]Tani[/color] — 6750\n[color=yellow]W rozsądnej cenie[/color] — 12500\n[color=orange]Mniej kosztowne[/color] — 25000\n[color=red]Kosztowne[/color] — 50000\n[color=purple]Bardzo kosztowne[/color] — 100000\nFactorio nadal ogranicza wewnętrzny mnożnik skalowania do [color=red]x1000[/color], więc ESIR automatycznie podnosi ukryty efektywny początkowy koszt bazowy, gdy trzeba, aby wybrany pułap pozostał osiągalny.
ei-tech-scaling-curveForm=POCHODNA FORMUŁY — Skalowanie kosztów technologii\nKonfiguracja:\nPunkt początkowy A = (0, C) → C = cena początkowa\nPunkt końcowy B = (N, X) → X = maksymalny koszt\nN = całkowita liczba technologii, n = aktualny indeks technologii\nFunkcje kosztu:\nLiniowa: koszt(n) = (X − C) / N · n + C\nKwadratowa: koszt(n) = (X − C) / N² · n² + C\nWykładnicza: koszt(n) = exp(n/N · ln(X + 1 − C)) + C − 1\nFormy mnożnika ceny technologii (cost(n) / C):\nLiniowa: f_lin = (X − C) / (N·C) · n + 1\nKwadratowa: f_qua = (X − C) / (N²·C) · n² + 1\nWykładniczy: f_exp = (exp(n/N · ln(X + 1 − C)) − 1) / C + 1\nKoszt zintegrowany (całkowita liczba pakietów naukowych):\nLiniowy: Area_lin = N/2 · (X + C)\nKwadratowy: Area_qua = N/3 · (X + 2C)\nWykładniczy: Area_exp = N · (C − 1 + (X + 1 − C) / ln(X + 1 − C))\nPrzybliżenie dla dużych wartości X:\nArea_exp ≈ N·X / 9\nArea_qua ≈ N·X / 3\nArea_lin ≈ N·X / 2\nWzględna trudność:\nWykładnicza < Kwadratowa < Liniowa — wykładnicza rośnie łagodnie na początku, liniowa jest równa przez całą drogę, a kwadratowa stoi pośrodku.\nAge-ramp: tryb z podziałem na epoki, który trzyma ciemną i parową epokę łagodnymi, zaczyna dociskać w elektryczności i najmocniej obciąża komputerową, kwantową i egzotyczną. Nadal używa istniejącej biblioteki ważenia technologii, więc technologie o obniżonej wadze liczą się wolniej.\n[color=red]Zmiana tego ustawienia w trakcie gry może przynieść niepożądane skutki.[/color]
ei-tech-scaling-startPrice=Zmienna C z wzoru. ESIR może w tle podnieść ukryty efektywny początkowy koszt bazowy, gdy wybrany pułap inaczej zderzyłby się z limitem x1000 Factorio.\nZmiana po rozpoczęciu zapisu może nadal dać nieoczekiwane skutki.
ei-tech-scaling-additionalMultiplier=Dodatkowy końcowy mnożnik po obliczeniu krzywej i pułapu.\nTo najbezpieczniejsza wartość do zmiany w trakcie gry.
ei-item-glow-overlay-fidelity=Steruje świetlnymi warstwami obrazów przedmiotów. Wszystkie zachowuje obecny wygląd; Płaska zostawia grafikę poświaty bez renderowania jej jako światła; Wyłączone całkowicie usuwa nakładki poświaty.

ei-science-pack-yield-dark=Ustawia wydajność wytwarzania pakietu naukowego [color=red]Epoki Ciemnej[/color].
ei-science-pack-yield-steam=Ustawia wydajność wytwarzania pakietu naukowego [color=gray]Epoki Parowej[/color].
ei-science-pack-yield-electricity=Ustawia wydajność wytwarzania pakietu naukowego [color=blue]Epoki Elektrycznej[/color].
ei-science-pack-yield-computer=Ustawia wydajność wytwarzania pakietu naukowego [color=yellow]Epoki Komputerowej[/color].
ei-science-pack-yield-simulation=Ustawia wydajność wytwarzania pakietu naukowego [color=green]Epoki Symulacji[/color].
ei-science-pack-yield-alien=Ustawia wydajność wytwarzania pakietu naukowego [color=pink]Epoki Obcych[/color].
ei-science-pack-yield-quantum=Ustawia wydajność wytwarzania pakietu naukowego [color=purple]Epoki Kwantowej[/color].
ei-science-pack-yield-fusion-quantum=Ustawia wydajność wytwarzania pakietu naukowego [color=cyan]Epoki Fuzji Kwantowej[/color].
ei-science-pack-yield-exotic=Ustawia wydajność wytwarzania pakietu naukowego [color=#00912E]Epoki Egzotycznej[/color].
ei-science-pack-yield-black-hole=Ustawia wydajność wytwarzania pakietu naukowego [color=black]Epoki Egzotycznych czarnych dziur[/color].
ei-em_updater_que=Narysuj wizualny wskaźnik między lub nad pociągami EM i ładowarkami, gdy następuje transfer energii.
ei-em_updater_que_width=Dostosuj promień wyświetlanych pierścieni.
ei-em_updater_que_transparency=Dostosuj przezroczystość wyświetlanych pierścieni. Zakres 1->100 (nieprzezroczyste).
ei-em_updater_que_timetolive=Dostosuj czas trwania, po którym pierścień znika.
ei-em_train_glow=Włącz/wyłącz efekt świecenia pociągu EM podczas transferu energii elektrycznej.
ei-em_train_glow_timetolive=Tiki do momentu zaniku świecenia pociągu. Możliwość kumulacji. Zwiększ wydajność, zmniejszając tę liczbę. 60 tików to 1 sekunda.
ei-em_charger_glow=Włącza/wyłącza efekt świecenia podczas transferu energii elektrycznej przez ładowarkę EM.
ei-em_charger_glow_timetolive=Ilość taktów do zaniku świecenia ładowarki. Możliwość kumulacji. Obniżenie tej wartości zwiększa wydajność. 60 taktów to 1 sekunda.
ei-max_updates_per_tick=Liczba aktualizacji na typ obiektu wykonywanych na takt.
ei-ticks_per_full_update=Dostosuj liczbę tików, w ciągu których aktualizowane są wszystkie jednostki EI.
ei-beacon-overload=Zamierzone zachowanie. Ustawia limit liczby nadajników, które mogą wpływać na poszczególne budynki, np. w ramach eksploracji kosmosu.
ei-solar-icon-scaling=Skalowanie wszystkich 3 poziomów paneli słonecznych zarówno pod względem powierzchni, jak i wydajności energetycznej.\nSkalowanie poniżej 75% zwiększy [color=cyan]elastyczność[/color] rozmieszczenia.\nSkalowanie powyżej 75% sprawia, że [color=yellow]łatwiej[/color] jest osiągnąć określoną wydajność energetyczną przy takim samym zużyciu zasobów.
ei-nauvis-main-tracks-override=Pozwala Remembrance zastąpić główne utwory Vanilla Nauvis.
ei-nauvis-interlude-tracks-override=Pozwala Remembrance zastąpić utwory interludium Vanilla Nauvis.
