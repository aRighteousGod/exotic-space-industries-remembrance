rocket-ammo-schema=Schemat amunicji rakietowej
rocket-ammo-schema-text=Amunicja rakietowa sklada sie warstwami: [item=ei-rocket-airframe]szkielet, [item=ei-rocket-motor-basic]silnik, [item=ei-rocket-warhead-impact]glowica, a potem gotowy pocisk. Szkielet trzyma calosc, silnik wyznacza zasieg, a glowica wybiera rodzine obrazen. Linia artyleryjska dziala wedlug tej samej logiki, tylko ciezej i mniej wybacza.
rocket-ammo-schema-2=Galezie ladunkow
rocket-ammo-schema-text-2=Linia podstawowa jest teraz ustawiona pod koszt: pociski uderzeniowe i wybuchowe bija znacznie mocniej, ladunki zrace korzystaja z tego samego pakietu chemii miedzy wyrzutnia reczna a linia artyleryjska, daja mocne uderzenie kwasem i zostawiaja trwala chmure, ktora zjada struktury, a ladunki cryo zachowuja ten sam czas kontroli w obu liniach, dalej uderzajac wyraznie ciezej. Linia atomowa rozdziela sie jasno: U-235 konczy jako ESIR [item=ei-atomic-bomb-u235] i niesie bardziej zwarty opad, a pluton dalej wyswietla sie jako plutonowa rakieta atomowa, zachowuje vanilla eksplozje atomowa i zostawia po przelomie szersze skazenie radiologiczne.
rocket-ammo-schema-3=Rodziny efektow
rocket-ammo-schema-text-3=Kazda rodzina dostaje wlasny wybuch, dym i naklejke, zeby efekt byl czytelny w ruchu, a nie zlewal sie w jeden ogolny blysk.
rocket-ammo-schema-4=Atomowa linia artyleryjska
rocket-ammo-schema-text-4=Stala wyrzutnia artyleryjska moze ladowac atomowe rakiety U-235 i plutonowe luzem albo w skrzyni. Salwy skrzyniowe sa w praktyce samobojcze: sciezka materialu rozszczepialnego pozostaje rozdzielona dla produkcji i odblokowan, U-235 dostaje ciasniejszy rdzen detonacji ESIR i czystszy slad opadu, pluton korzysta z vanilla eksplozji atomowej, ale zostawia po niej szersze skazenie radiologiczne, a zbyt bliski strzal dalej moze rozerwac razem z celem sama pozycje ogniowa.
