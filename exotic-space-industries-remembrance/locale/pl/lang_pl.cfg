default=[color=red]*WYBIERZ DOWOLNĄ OPCJĘ — Z WYJĄTKIEM TEJ*[/color]
ei-default=Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color]

[map-gen-preset-description]
default=*ZMIEŃ MNIE* Domyślne ustawienia generowania mapy. [color=red]To ustawienie nie jest zalecane[/color] do gry w Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].
ei-default=Zalecany sposób gry w Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]. Twoja podróż rozpoczyna się na Nauvis, gdzie znajdują się wszystkie podstawowe zasoby i wczesna infrastruktura.\nTo kolebka — naznaczona bliznami, znajoma i ograniczona.\nMateriały do gry końcowej i zaawansowane systemy czekają na innych powierzchniach, odblokowywanych później w miarę postępów.\nOpuścisz świat, który znasz.\n[font=default-bold]Nie wrócisz taki sam.[/font]


[exotic-industries-informatron]

spidertron=Zmiany Spidertron
spidertron-text=W porównaniu z wersją podstawową [font=default-bold] Spidertron staje się dostępny wcześniej[/font] – w erze komputerów. Jednak w przeciwieństwie do swojego odpowiednika Nauvis, nie jest już samowystarczalnym cudem. Wymaga paliwa.\n\nNa początku wystarczą paliwa stałe – węgiel, biomasa i podobne materiały pozwolą mu działać. Jednak w miarę postępów paliwa jądrowe i termojądrowe zapewniają znaczne bonusy do prędkości, przyspieszenia i zasięgu działania.\n\nTo nie jest tylko pojazd. Jest to [font=default-bold]platforma do eskalacji.[/font]\n\nModyfikacje, takie jak [color=green]Spidertron Patrols[/color] i [color=green]Constructron-Continued[/color], obejmują specjalną integrację, dostosowując swoje systemy do zmodyfikowanej struktury Spidertron w Exotic Industries.\n\nPająk chodzi wcześniej. Ale chodzi z determinacją, ciężarem i wymaganiami. \n\nNależy go dobrze nakarmić — albo [font=default-bold]zostanie w tyle.[/font]
cranes-and-belts-text=Exotic Industries wprowadza nowy poziom infrastruktury logistycznej: [color=orange]Neo taśmociągi logistyczne[/color] [item=ei-neo-belt]. Wykonany z zaawansowanych technologicznie materiałów, oferuje ekstremalną przepustowość wynoszącą [font=default-bold]90 przedmiotów na sekundę[/font] — przekraczającą wszystkie standardowe limity transportowe. Taśmy te zostały zaprojektowane z myślą o końcowych etapach gry i fabrykach o skali rekurencyjnej. \n\nPonadto mod dodaje [color=orange]dźwigi[/color] [item=ei-big-inserter-normal] — ogromne podajniki o dużej pojemności, przeznaczone do transportu masowego. n\nWykorzystaj je do:\n\nSzybkiego rozładunku pociągów\n\nŁączenia dużych struktur magazynowych (np. skrzyń ↔ magazynów)\n\nUtrzymania przepływu tam, gdzie standardowe podajniki nie radzą sobie pod presją\n\n[font=default-bold]Szybkość nie jest już luksusem.\nJest podstawą.\nLogistyka musi być skalowana wraz z mocą lub ulegnie załamaniu.[/font]
loaders=Ładowarki
loaders-text=Ładowarki EI tworzą gałąź logistyki bezpośredniego podawania: [item=ei-steam-loader]parowa ładowarka, [item=ei-loader]ładowarka, [item=ei-fast-loader]szybka ładowarka, [item=ei-express-loader]ekspresowa ładowarka, [item=ei-turbo-loader]turbo ładowarka i [item=ei-neo-loader]Neo ładowarka. Parowa ładowarka otwiera linię po Logistyce i wymaga działającej pary; standardowa ładowarka elektryczna przesuwa łańcuch do Automatyzacji. Każdy kolejny poziom podbija przepustowość i płaci najpierw ciśnieniem, potem prądem.\n\nNie przerzucają przedmiotów przez powietrze. Łączą przepływ taśmy bezpośrednio z maszynami, pojemnikami, wagonami i interfejsami przy torach.\n\nJeśli wąskim gardłem jest ruch podajnika, ładowarki są odpowiedzią.
loaders-2=Stackowanie
loaders-text-2=[item=ei-steam-loader]Parowa, [item=ei-loader]standardowa i [item=ei-fast-loader]szybka ładowarka przenoszą tylko przedmioty nieułożone w stos. [item=ei-express-loader]Ekspresowa ładowarka może przenosić stosy do [font=default-bold]2[/font] sztuk i pozwala regulować ich rozmiar. [item=ei-turbo-loader]Turbo ładowarka również działa ze stosami do [font=default-bold]2[/font]. [item=ei-neo-loader]Neo ładowarka korzysta z pełnego limitu stosów na taśmie i też pozwala go obniżyć, gdy precyzja jest ważniejsza niż brutalna przepustowość.\n\nTo znaczy, że wyższe poziomy nie tylko jadą na szybszej taśmie. Wpychają gęstsze porcje przez ten sam kafel.
loaders-3=Filtrowanie
loaders-text-3=[item=ei-steam-loader]Parowa, [item=ei-loader]standardowa, [item=ei-fast-loader]szybka i [item=ei-express-loader]ekspresowa ładowarka używają [font=default-bold]jednego wspólnego filtra[/font] dla obu pasów taśmy. [item=ei-turbo-loader]Turbo i [item=ei-neo-loader]Neo dostają [font=default-bold]dwa filtry pasów[/font], po jednym dla każdej strony taśmy.\n\nDzięki temu jedna ładowarka decyduje nie tylko o tym, co przepuszcza, ale też na który pas to trafi.
loaders-4=Przyciąganie i ustawianie
loaders-text-4=Ładowarki EI [font=default-bold]same dopasowują się do poprawnego połączenia[/font] podczas stawiania i ponownie sprawdzają to wiązanie, gdy zmieniają się sąsiednie taśmy. Sprawdzają rzeczywiste połączenia z taśmami, pojemnikami, wagonami i interfejsami przy torach, zamiast ślepo ufać pierwszemu obrotowi kursora.\n\nPostawiona przy wagonie, skrzyni, maszynie albo interfejsie kolejowym ładowarka może się obrócić lub odwrócić kierunek pracy, żeby połączenie naprawdę się zapięło.
loaders-5=Zasilanie
loaders-text-5=[item=ei-steam-loader]Parowa ładowarka wymaga [font=default-bold]działającej pary[/font] przez wejście płynu. Linia elektryczna zaczyna się od [item=ei-loader]ładowarki: każdy przeniesiony przedmiot zużywa energię z wewnętrznego bufora, a każdy wyższy poziom zwiększa zarówno pojemność bufora, jak i koszt na przedmiot. Wyższe poziomy są mocniejsze, nie tańsze.\n\nElektryczna ładowarka może przetrwać krótki spadek zasilania na własnym zapasie, ale nie utrzyma długo pełnej przepustowości bez działającej sieci.
bots=Więcej botów
steam-bots-2=Krew w kotle i awaria
steam-bots-text-2=Haczyk tkwi w wytrzymałości. Boty parowe nie mają niewyczerpanego zapasu energii elektrycznej; latają na zgromadzonym ciśnieniu i muszą wrócić do robotaportu, zanim ono się wyczerpie. Jeśli w locie skończy im się para, [font=default-bold]spadną z nieba[/font], zamiast z gracją czekać na ratunek.\n\nParowe robotaporty wcześnie zawracają je po uzupełnienie ciśnienia, ale długie zadania, zatłoczone porty i nadmiernie rozciągnięte sieci wciąż mogą zamienić tę wczesną wygodę w katastrofę.
bots-2=Późniejsze linie botów
bots-text-2=Gdy fabryka osiągnie pełną robotykę elektryczną, EI rozszerza rój o ciężkie roboty transportowe do przewozu masowego, ciężkie roboty budowlane do gwałtownych zrywów budowy oraz późniejsze zaawansowane warianty o większej prędkości, zasięgu, wytrzymałości i specjalizacji zadaniowej. [font=default-bold][color=orange]Zaawansowany robotaport[/color][/font] wspiera tę późniejszą sieć szybszym ładowaniem, większą liczbą miejsc dla botów i szerszym promieniem pracy.\n\nTo nie jest tylko sieć dronów. [font=default-bold]To zmechanizowany protokół roju.[/font]
new-mechanics=Nowa mechanika rozgrywki
beacon-overhaul=Przegląd nadajników
beacon-overhaul-text=Exotic Industries nakłada surowe ograniczenia na zasięg nadajników: na maszynę mogą oddziaływać maksymalnie 4 nadajniki. [font=default-bold]Era nieskończonego nakładania się nadajników dobiegła końca.[/font]\n\nPonadto nadajniki wymagają teraz płynu chłodzącego do działania. Bez niego przegrzewają się i wyłączają. Sama moc nie wystarczy — logistyka musi wspierać stabilność termodynamiczną.\n\nAby to zrekompensować, nadajniki zostały ulepszone pod względem konstrukcyjnym:\n\nZwiększona pojemność modułów\nWprowadzenie ulepszonego nadajnika\nLiczy się jako 2 nadajniki w stosunku do limitu\nPomieści jeszcze więcej modułów\nWymaga większej infrastruktury\n\n[font=default-bold]Wzmocnienie nie jest już trywialne. [/font]\nJest to dyscyplina mechaniczna.\nBuduj z precyzją — albo [font=default-bold]popadniesz w nieefektywność.[/font]
specialised-pipes=Specjalistyczne rury i kable danych
specialised-pipes-text=Remembrance traktuje nośniki płynów jak sprzęt do hermetyzacji, a nie wymienną instalację.\n\n[color=orange]Rury izolowane[/color] utrzymują stabilność płynów kriogenicznych, termicznych i chemicznie wrogich. [color=orange]Kable danych[/color] przenoszą [color=blue]substraty symulacyjne[/color] [fluid=ei-computing-power] i nie są uniwersalnymi liniami płynowymi: podaj im zwykłą chemię, a przewód ulegnie zwarciu.\n\nWybierając nośnik, wybierasz też to, jaki rodzaj awarii linia może przetrwać.
specialised-pipes-2=Klasy awarii
specialised-pipes-text-2=Nieizolowane rury, odcinki podziemne, linie wyniesione i zbiorniki nie zawodzą w ten sam sposób. [fluid=ei-liquid-nitrogen]Ciekły azot i [fluid=ei-liquid-oxygen]ciekły tlen odparowują z powrotem do gazu w zwykłej instalacji. [fluid=ei-heated-helium-3]Podgrzane płyny procesowe i lawa powodują gorącą awarię z rozerwaniem. Fluoroketony i elektrolit rozrywają linie chemicznym wyładowaniem.\n\nZbiorniki mogą wywołać cięższe rozerwanie niż zwykły odcinek, a linie wyniesione utrzymują ciaśniejszy zasięg i unikają rozległego skażenia powierzchni.
specialised-pipes-3=Reżim hermetyzacji
specialised-pipes-text-3=Izolowane rury nadal ignorują zwykły wymóg ogrzewania instalacji. Prototypy rury izolowanej, jej podziemnej wersji i zbiornika zużywają [font=default-bold]0 energii grzewczej[/font], więc nie potrzebują zewnętrznego ciepła, aby nie zamarzać na Aquilo ani na żadnej innej zimnej powierzchni.\n\nUżywaj ich, gdy płyny muszą pozostać dokładnie w stanie, w jakim zostały przygotowane: zimne ciecze pozostają zimne, reaktywne mieszaniny pozostają zamknięte, a wyspecjalizowane linie przetrwają tam, gdzie zwykła instalacja by odpowietrzała, zwierała lub pękała.
specialised-pipes-4=Sygnatury i monitoring
specialised-pipes-text-4=Następstwa rozerwania zależą teraz zarówno od nośnika, jak i od zanieczyszczenia. W segmentach mieszanych awaria podąża za tym zanieczyszczeniem, które naprawdę zagraża obecnym nośnikom, nawet jeśli ten płyn nie stanowi największej części mieszaniny. Awaria danych iskrzy i powoduje zwarcia, awaria kriogeniczna wyrzuca szron, awaria termiczna przypala, a awaria chemiczna pluje mgłą lub korozyjnym wyciekiem. Kable danych pozostają bez ognia nawet wtedy, gdy zanieczyszczenie jest termiczne lub chemiczne, a rury wyniesione utrzymują skutki lokalnie. Powtarzające się awarie na tym samym segmencie są ograniczane, aby jedna zła linia nie zasypała ekranu duplikatami skutków ubocznych.\n\nJeśli musisz audytować działającą fabrykę, `/ei_runtime_status` pokazuje teraz `fluid(t/u/d/s/cursor/mode)` dla śledzonych / pilnych / segmentów do ponownego sprawdzenia / skanu / kursora obsługi / następnego trybu obsługi, `fluidfx(qh/ql|sh/sl)` dla zakolejkowanych ciężkich / lekkich | stłumionych ciężkich / lekkich oraz `rupture(mode/a/p/d|ob/oi)` dla trybu wierności / aktywnych zadań / oczekujących pierścieni / zaplanowanych kubełków opóźnień | przeterminowanych kubełków / przeterminowanych elementów.
ei-runtime-status-enabled=Włączono telemetrię runtime ESIR.
ei-runtime-status-disabled=Wyłączono telemetrię runtime ESIR.
ei-runtime-status-usage=Użycie: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off] (uruchom bez argumentów, aby wyświetlić podsumowanie runtime na żywo).
ei-runtime-status-command-help=Domyślnie wyświetla podsumowanie runtime ESIR na żywo. Użyj snapshot, auric, auric-detail, telemetry-on lub telemetry-off w ramach tej samej komendy.
