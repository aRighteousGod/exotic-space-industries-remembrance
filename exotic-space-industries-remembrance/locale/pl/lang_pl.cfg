recipe-icons-improvement-missing=[color=yellow]⚠ [Brak sygnału modułu towarzyszącego][/color] Nie wykryto Recipe Icons Improvement for Exotic Space Industries Remembrance autorstwa [color=orange]NaK1119[/color]. Niektóre ikony mogą być trudniejsze do odczytania, a sygnały receptur w sieci obwodów mogą nie działać zgodnie z zamierzeniem. Ten alert można wyłączyć w ustawieniach startowych.
new_age=Akumulacja jest wystarczająca. Przekroczono próg.\n[font=default-bold]Coś się budzi.[/font] Rozpoczyna się nowa era.\nTo nigdy nie spało — tylko czekało, aż otworzysz drzwi.\nZrobiłeś to.\nNowa epoka odblokowana.\nŚwiat nie wróci do poprzedniego stanu.\nTy też nie.

