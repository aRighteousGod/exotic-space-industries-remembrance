ei-gate-active=Wysyła 1, gdy brama jest włączona, ma wyznaczony cel i znajduje się powyżej minimalnego progu mocy.
ei-gate-energy=Wysyła energię zmagazynowaną w bramie w MJ.
ei-gate-stress=Wysyła bieżący stres bramy w skali 0-100.
ei-orbital-overflow=Pokazuje liczbę filtrów żądań, które zostały pominięte, bo bank sąsiednich skanerów nie miał już miejsca.
ei-platform-id=Pokazuje lokalny dla siły numeryczny ID platformy wybrany przez transponder, selektor lub uplink.
ei-orbital-ready=Pokazuje gotowość albo dostępne zadanie wewnątrz orbitalnej kohorty logistycznej.
ei-orbital-blocked=Pokazuje zablokowane linie, zadania lub stan kohorty.
ei-orbital-invalid=Pokazuje nieważne ID, nieważne cele albo nieważny stan wysyłki.
ei-orbital-lease=Pokazuje aktywną dzierżawę kohorty albo oznacza, że encja trzyma żywą dzierżawę.

