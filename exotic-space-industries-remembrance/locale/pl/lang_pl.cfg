railgun-cooling=Chłodzenie railguna
railgun-cooling-text=Zespół railguna jest chłodzony przy samym dziale, a nie przez przemianę amunicji w osobny pocisk zasilany chłodziwem. Zimny fluoroketon jest zużywany przy wieżyczce, gorący fluoroketon trzeba odzyskać, a broń sama się blokuje, gdy pętla chłodzenia przestaje nadążać.\n\nTo zamierzone. Działo pracuje na gorąco, lufa zostawia krótki żar po strzale, a to właśnie linia chłodziwa umożliwia ciągły ogień.
railgun-cooling-2=Pętla chłodzenia i awaryjny przepis
railgun-cooling-text-2=Normalna praca zużywa zimny fluoroketon przy wieżyczce. Gdy tej pętli zabraknie, railgun dostaje dług cieplny, wyłącza się i przechodzi w odzyskiwanie zamiast udawać, że strzał nic nie kosztował.\n\nDostępny jest też zapasowy przepis z lodem, który daje kolejną drogę do produkcji zimnego fluoroketonu, gdy ciekły azot nie jest jedyną odpowiedzią. Nadmiar ciepła trafia do pary.
railgun-cooling-3=Zachowanie na powierzchniach
railgun-cooling-text-3=Różne powierzchnie chłodzą w różnym tempie. Platformy kosmiczne oddają ciepło bardzo powoli, a światy z atmosferą szybciej je rozpraszają. Aquilo odzyskuje się najszybciej przy pasywnym chłodzeniu, Vulcanus pozostaje gorący najdłużej, a powierzchnie cienkie lub słabo zanieczyszczone mieszczą się między nimi. Ten sam railgun zachowuje się więc inaczej zależnie od miejsca montażu.
railgun-cooling-4=Odzysk i stan
railgun-cooling-text-4=Sprawne railguny nie siedzą w stałej kolejce. Tylko przegrzane lub zablokowane działa trafiają do odzysku i pozostają wyłączone, dopóki dług cieplny nie zniknie, a gorąca linia wyjściowa nie będzie mogła przyjąć zużytego fluoroketonu ponownie.\n\nDlatego stan jest czytelny: zielony oznacza gotowość, żółty oznacza odzyskiwanie lub blokadę wyjścia, czerwony oznacza brak sprzętu chłodzącego albo twarde przegrzanie.
