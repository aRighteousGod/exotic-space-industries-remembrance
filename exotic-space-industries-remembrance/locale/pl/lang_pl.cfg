gate-gui-control-runtime-label=Stan pracy: __1__
gate-gui-control-runtime-label-tooltip=Stabilny oznacza brak aktywnej blokady chłodzenia. Chłodzenie oznacza, że brama odlicza bieżące chłodzenie i transfer na tej trasie jest wstrzymany. Krytyczny oznacza, że stres jest tak wysoki, iż rośnie niestabilność i ryzyko wyładowania.
