gate-gui-control-source-label=Źródło sterowania: __1__
gate-gui-control-source-label-tooltip=Tryb ręczny używa wybranego w konsoli odbiornika i stanu. Tryb obwodowy przejmuje sterowanie tylko wtedy, gdy signal-D rozpoznaje ważny identyfikator odbiornika. Wtedy signal-D wybiera cel, a signal-E tylko uzbraja albo rozbraja trasę; gdy signal-E nie ma albo ma 0, poprawnie rozpoznana trasa uzbraja się domyślnie. Jeśli signal-D nie da się rozpoznać, brama wraca do ręcznego odbiornika, a signal-E nadal nadpisuje stan, gdy jest niezerowy.
