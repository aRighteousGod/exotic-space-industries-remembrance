turrets=Stanowiska obronne
turrets-text=Remembrance mocno poszerza statyczną obronę. Arsenał biegnie teraz od improwizowanych dział bliskiego zasięgu, przez parową artylerię i żrące strumienie chemiczne, aż po napędzane elektrycznie burze pocisków i reliktowe platformy energetyczne. Te stanowiska nie są prostym bocznym ulepszeniem [item=gun-turret]wieżyczki karabinowej: każda z nich wymaga innej logistyki, innej strefy rażenia i innego zaplecza.\n\nWiększość dodatków balistycznych nadal skaluje się z badaniami obrażeń od pocisków fizycznych. Wieże strumieniowe rosną wraz z gałęzią obrażeń od ognia. Późne platformy reliktowe potrzebują za to ogromnej energii, rzadkich części i przemyślanego rozmieszczenia.
turrets-2=Strzelby i działa
turrets-text-2=[item=ei-shotgun-turret]Wieżyczka strzelbowa pojawia się już w Mrocznym Wieku po wieżyczkach karabinowych i Militariach. To odpowiedź na walkę przy murze: zasięg 15, wolne tempo ognia, brak skomplikowanych wymagań energetycznych i brutalna kara dla wszystkiego, co faktycznie dojdzie do obwodu. W Erze Elektryczności przechodzi w [item=ei-auto-shotgun-turret]bojową wieżyczkę strzelbową, która podwaja szybkostrzelność, sięga na 18, obraca się znacznie szybciej i dodaje stały pobór prądu oraz koszt energii na strzał, aby utrzymać zasłonę śrutu nad wąskimi przejściami.\n\n[item=ei-cannon-turret-mk1]Wieżyczka armatnia to parowy etap oblężniczy. Strzela [item=cannon-shell]pociskami armatnimi na 25 pól, ma martwą strefę 8 pól, powolny obrót i bardzo ciężkie pojedyncze trafienie. Później dwie MK1 i cięższe podzespoły stają się [item=ei-cannon-turret]dwulufową wieżyczką armatnią: twardszą, szybszą, wspomaganą elektrycznie i pracującą na 30 pól z martwą strefą 10, żeby usuwać ciężkie cele zanim dotrą do ściany.
turrets-3=Kwas i ogień
turrets-text-3=[item=ei-acidthrower-turret]Acidthrower to żrący kuzyn wieżyczki miotacza ognia. Sięga na 38 pól przy minimalnym zasięgu 9 i przyjmuje [fluid=sulfuric-acid]kwas siarkowy, [fluid=ei-nitric-acid]kwas azotowy, [fluid=ei-hydrofluoric-acid]kwas fluorowodorowy, a nawet słabą [fluid=ei-acidic-water]kwaśną wodę, przy czym każdy płyn ma własny mnożnik obrażeń. To odpowiedź dla fabryk, które wolą uzbroić chemię niż spalać ropę.\n\nVanillowe [item=flamethrower-turret]wieżyczki miotacza ognia też zostały przerobione. EI przenosi je do Ery Pary, rozszerza ich pas walki do 38/9, każe im wcześniej się przygotowywać i mocno zwiększa apetyt na płyn. Jakość paliwa ma teraz znaczenie: surowa ropa nadal działa, ale ciężki olej, lekki olej, gaz naftowy i [fluid=ei-kerosene]nafta biją coraz mocniej, a gorsze destylaty zostają słabszym paliwem awaryjnym.
turrets-4=Miniguny i lasery
turrets-text-4=[item=ei-gatling-turret]Wieżyczka minigunowa to elektryczny wąż ogniowy na amunicję. Łączy zamontowany [item=ei-minigun]minigun z napędem elektrycznym, dając zasięg 32, minimalny dystans 4, świetne ponowne wybieranie celów i bardzo brutalną szybkostrzelność ciągłą. Cena jest dokładnie taka, jak wygląda: niekończące się zużycie [item=firearm-magazine]magazynków plus stałe zasilanie.\n\nVanillowe [item=laser-turret]wieżyczki laserowe nadal istnieją, ale EI zamienia je w bardziej świadomą inwestycję Ery Elektryczności. Ich zasięg i długość wiązki rosną do 30, technologia wyraźnie wymaga [item=battery]baterii i [item=advanced-circuit]zaawansowanych układów, a receptura zostaje przebudowana wokół [item=ei-steel-beam]stalowych belek, [item=steel-plate]stali, [item=battery]baterii, [item=advanced-circuit]zaawansowanych układów i [item=ei-energy-crystal]kryształów energii. To czystsza wieżyczka logistycznie, ale już nie tania uniwersalna odpowiedź.
turrets-5=Platformy reliktowe
turrets-text-5=[item=ei-plasma-turret]Wieżyczka plazmowa to forteczna armata Ery Kwantowej. Jest ogromna fizycznie, wysysa poważną część sieci i buduje się ją z części matrycy indukcyjnej oraz kilku [item=laser-turret]wieżyczek laserowych. W zamian wyrzuca wolno rozpędzające się pociski plazmowe na 200 pól, trzyma 40-polową strefę bezpieczeństwa wokół siebie i kończy każde trafienie ogromnym wybuchem niszczącym formacje, fortyfikacje i teren.\n\n[item=zeus-wrath-zeus-turret]Poseidon Installation stoi jeszcze wyżej w drabinie reliktów dzięki [technology=zeus-wrath-zeus-wrath]. EI przebudowuje ją na broń strategiczną: 350 zasięgu, 70 minimalnego dystansu, 1 GJ na strzał, olbrzymi magazyn energii i wewnętrzny oraz zewnętrzny pierścień wybuchu plazmowego. To nie jest wieżyczka obwodowa, tylko stała odpowiedź na cele, które mają po prostu przestać istnieć.
