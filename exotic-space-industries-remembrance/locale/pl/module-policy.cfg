[mod-setting-description]
ei-beacon-quality-modules=Wybiera rodziny nadajników ESIR, które przyjmują moduły z premią do jakości. Chłodzone azotem: __ENTITY__ei-copper-beacon__ i __ENTITY__ei-iron-beacon__. Obcych: __ENTITY__ei-alien-beacon__ i __ENTITY__ei-warp-beacon__. Wymaga moda Quality.\nPo zaostrzeniu ograniczeń zamontowane moduły, które stały się niedozwolone, zostaną zwrócone na ziemię obok nadajnika.
ei-beacon-productivity-modules=Wybiera rodziny nadajników ESIR, które przyjmują moduły z premią do produktywności. Chłodzone azotem: __ENTITY__ei-copper-beacon__ i __ENTITY__ei-iron-beacon__. Obcych: __ENTITY__ei-alien-beacon__ i __ENTITY__ei-warp-beacon__. Działa również przy wyłączonym modzie Quality.\nPo zaostrzeniu ograniczeń zamontowane moduły, które stały się niedozwolone, zostaną zwrócone na ziemię obok nadajnika.
ei-quality-module-effects=ESIR stosuje własne premie i kary modułów jakości. Tryb zbliżony do podstawowej gry pomija zmiany ich efektów wprowadzane przez ESIR. Oba tryby zachowują receptury i postęp badań ESIR. Ustawienie nie działa przy wyłączonym modzie Quality.

