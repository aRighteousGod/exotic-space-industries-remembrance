[sweeping-radar]
description=Ulepszany radar kierunkowy. Początkowy maksymalny promień: __1__ chunków. Limit sprzętu: __2__ obserwacji/s. Czerwony przewód: sterowanie. Zielony: odczyty. Otwórz konfigurację. Rzeczywistą częstotliwość ograniczają zasilanie i wspólna moc obliczeniowa. Badania i jakość zwiększają zasięg, wydajność i sprawność energetyczną.
