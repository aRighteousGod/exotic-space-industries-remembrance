controls-help=CZERWONY: wejścia; ZIELONY: wyjścia. Zaznaczone sterowanie używa wybranego sygnału, także zera. Zastosuj zapisuje ustawienia. 0° to północ, kąty rosną zgodnie z zegarem. Zasięg biegnie od początku do końca zgodnie z zegarem; równe końce oznaczają pełny obrót.
