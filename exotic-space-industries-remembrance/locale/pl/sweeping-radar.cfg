informatron-body=Czerwony przewód steruje zaznaczonymi polami, zielony przekazuje odczyty. Zero jest rzeczywistą wartością. Wszystkie pięć trybów i trzy zasady raportowania są dostępne od razu. Badania zwiększają zasięg, wydajność i sprawność; jakość zwiększa również te parametry i zdrowie.\n\nObserwacja odkrywa jeden chunk i sprawdza żywe wrogie cele wojskowe. Pozycje i wiek dotyczą ostatniej obserwacji. Pusty poprawny odczyt różni się od braku danych. Limit zapytania to 128 kandydatów, zbioru roboczego 2048 kontaktów. Niepełne odczyty podają dolne granice.\n\nObserwacja nie generuje terenu. Rozpoznanie zgłasza najwyżej jedno żądanie na 30 ticków dla całej floty. Niewykonalne żądanie wygasa po 60 sekundach i oznacza niepełne pokrycie. Zmiana geometrii usuwa niedokończoną pracę i odczyty. Pauza, zamrożenie i błędne wejścia unieważniają odczyt. Po pojedynczym przebiegu wynik może pozostać dostępny. Energia anulowanej pracy nie jest zwracana.\n\nCała flota dzieli limit 120 rozpoczętych obserwacji/s, przed innymi ograniczeniami. Prędkość jest żądaniem. Panel pokazuje średnie tempo od postawienia, czas idealny i czas ostatniego przebiegu. Wiązka odpowiada ukończonej pracy, a nie animacji anteny.\n\nJeden bufor zasila czuwanie i obserwacje. Kopie i naprawione bufory zaczynają puste. Ulepszenia zachowują ustawienia i przenoszą istniejącą energię do limitu nowego bufora. Zwykły radar pozostaje dostępny.\n\nPodstawowe parametry elektryczne: radar skanujący — czuwanie 1 MW, 8 MJ na obserwację, limit wejściowy 64 MW, bufor 16 MJ; radar z anteną fazowaną — czuwanie 2 MW, 5 MJ na obserwację, limit wejściowy 128 MW, bufor 10 MJ. Jakość zwiększa promień maksymalnie o 4 chunki i wydajność skanowania o 50%, a koszt energetyczny obserwacji zmniejsza maksymalnie o 20%. Premie łączą się z badaniami i nie przekraczają poziomu legendarnego. Jakość nie zmienia poboru podczas czuwania ani wspólnych limitów przetwarzania. Czuwanie pobiera energię także podczas pauzy i oczekiwania na impuls. Limity wejściowe określają maksymalne tempo ładowania; rzeczywiste zużycie zależy od czasu czuwania i przyjętych obserwacji.
