tip-mode=1 pełny obrót, 2 sektor, 3 pierścień, 4 pojedynczy przebieg, 5 stały azymut. Każdy tryb zachowuje ręczną geometrię.
tip-radius=Dodatnie wartości są ograniczane przez badania i jakość. Chunk ma 32 pola.
tip-near=Mniejszy od promienia zewnętrznego. Używany przez pierścień, pojedynczy przebieg i stały azymut.
tip-start=Początek obszaru zgodnego z zegarem, niezależnie od kierunku ruchu.
tip-stop=Koniec obszaru. Można przejść przez północ. Równe wartości oznaczają 360°.
tip-bearing=Pas o szerokości 32 pól.
tip-speed=0 wstrzymuje. 100 żąda limitu sprzętu, badań i jakości; wspólna wydajność może obniżyć tempo.
tip-direction=1 zgodnie z zegarem, -1 przeciwnie, 0 tam i z powrotem w sektorze. Stały azymut akceptuje 0.
tip-policy=Obserwacja obejmuje tylko wygenerowane i odkryte chunki. Rozpoznanie pozwala generować teren.
tip-contacts=Ostatnie odrębne kontakty, atomowo publikowany pełny przebieg albo ostatnia obserwacja.
tip-expiry=1–300 sekund od rzeczywistej obserwacji, nie publikacji.
tip-run=Dodatni sygnał uruchamia; zero lub ujemny wstrzymuje. Energia anulowanej pracy nie jest zwracana.
tip-trigger=Zbocze narastające uruchamia jeden przebieg. Podczas pracy sygnały są ignorowane. Utrzymaj sygnał do potwierdzenia Skanowanie, potem wyzeruj. Przycisk uruchamia ręcznie.
