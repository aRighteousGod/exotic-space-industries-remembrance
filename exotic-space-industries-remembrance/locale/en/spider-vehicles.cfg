[mod-setting-description]
ei-spider-range-aware-cycling=When weapon cycling is enabled on a vehicle, automatically select weapons with targets inside their firing range and use sustained firing turns. Performs periodic local target searches. Disabled: use native cycling without scripted target searches; mixed weapon ranges can prevent native cycling.

