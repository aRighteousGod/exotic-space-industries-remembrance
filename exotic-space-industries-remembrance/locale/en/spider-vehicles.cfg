ei-scout-spidertron=Scout spidertron
assault_spidertron=Assault spidertron

[entity-description]
ei-scout-spidertron=Three-legged logistics and scouting vehicle. No mounted weapons; its equipment grid accepts personal lasers and other armor equipment. Benefits from shared spider chassis research.
assault_spidertron=Simulation-age combat walker with a cannon, machine gun, and flamethrower. Research adds an artillery mount, weapon improvements, and reactive smoke. Benefits from shared spider chassis research.

[item-name]
ei-stored-spidertron=__1__ (__2__×__3__ equipment grid)
ei-assault-smoke-charge=Assault spidertron smoke charge

[item-description]
ei-assault-smoke-charge=Keep in the assault spidertron's trunk. Reactive smoke research lets the vehicle consume one charge after a heavy hit or while below half health, slowing nearby hostile units for six seconds. Cooldown: 30 seconds.

[technology-name]
ei-spider-vehicles=Spider vehicles
ei-assault-spidertron=Assault spidertron
ei-assault-smokescreen=Reactive spidertron smoke

[technology-description]
ei-spider-vehicles=Three-legged scout spidertrons with logistics, remote control, and armor equipment grids. Opens shared chassis research for scout, assault, and rocket spidertrons.
ei-assault-spidertron=Simulation-age assault spidertrons armed with one cannon, one machine gun, and one flamethrower. Opens their weapon and smokescreen research.
ei-assault-smokescreen=Assault spidertrons consume a trunk smoke charge after a hostile hit removes at least 5% of maximum hull, or leaves them below 50% health. The stationary cloud slows up to 64 hostile mobile units within eight tiles by 35% for six seconds. Cooldown: 30 seconds. Deals no damage and grants no invisibility.

