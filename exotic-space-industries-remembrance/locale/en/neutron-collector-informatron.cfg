[exotic-industries-informatron]
menu_neutron_collector=Neutron collector
title_neutron_collector=Neutron collector
neutron-collector=Neutron collector
neutron-collector-text=The [color=orange]Neutron Collector[/color] [item=ei-neutron-collector] is a quantum-age charge machine. It captures free neutrons leaking from nearby fission and fusion infrastructure and uses that flux to convert [item=ei-neutron-container] into [item=ei-charged-neutron-container].\n\nIt does not create neutrons. It harvests what nearby reactors fail to keep for themselves. The collector binds to one source at a time and favors the strongest live yield in range rather than averaging every machine around it.
neutron-collector-2=Binding, distance, and standby
neutron-collector-text-2=Collector efficiency is shaped by source type and geometry. Strong fusion sources can push the live value above 100%, while weak or distant emitters can drag it below; the runtime clamps the reported efficiency to 0-300%. Greater distance means longer charge time.\n\nIf no viable source is nearby, the neutron flux is too weak, the bound source goes dormant, the output is blocked, or a circuit condition disables the assembler, the collector falls back to its standby recipe so the machine stays openable and its diagnostics remain visible.
neutron-collector-3=Circuit telemetry
neutron-collector-text-3=When the collector is wired, its hidden circuit interface publishes five custom signals onto the collector's network: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent], and [virtual-signal=ei-neutron-scan-agent].\n\nEfficiency reports 0-300. Distance is emitted in tenths of a tile. Collector agent is 1 active, 2 idle, 3 blocked. Source agent is 1 live, 2 dormant, 3 absent. Scan agent is 1 stable, 2 dirty, 3 rebind pending. These signals refresh on the collector's scheduled telemetry pass rather than every tick.
