[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=UPS-first: fewer beam slices, shorter witnesses, stricter fire and scorch throttles.
ei-severance-array-visual-fidelity-standard=This is the intended everyday profile: visible sweeps, witnessed impacts, and conservative runtime budgets.
ei-severance-array-visual-fidelity-cinematic=Richer spectacle: more beam slices, more witnesses, longer glow and scorch persistence.
ei-severance-array-visual-fidelity-maximal=This is the capped spectacle profile: screenshot-grade beams and witnesses with emergency limits still in place.
ei-severance-array-visual-fidelity-unbounded=Removes hard visual caps and drains ready Severance work aggressively. Intended for spectacle, not safety.

[item-description]
ei-severance-array=A 4x4 quantum weapon platform that spends a vast stored charge to carve a moving laser wound through enemy formations.

[entity-description]
ei-severance-array=A 4x4 quantum weapon platform. Witnessed impacts wait for the visible cut; under heavy load, invisible fallback damage preserves the killing edge while the spectacle thins.

[exotic-industries-informatron]
menu_severance_array=Severance Array
title_severance_array=Severance Array
turrets-text-6=[item=ei-severance-array]Severance Array is the quantum-age blade protocol between the Plasma Turret and strategic relic weapons. It stores a colossal charge, then drags one visible beam from its previous aim point to the next. When the endpoint witness is rendered, damage and fire arrive just after the cut; when the battlefield overloads, invisible fallback damage preserves the alpha strike while spectacle is shed.
severance-array=Severance Array
severance-array-text=The [item=ei-severance-array]Severance Array is a compact quantum-age execution engine. It occupies a 4x4 foundation, consumes a vast electric pulse, and answers a target by opening a bright wound across the battlefield instead of tracking every victim as an individual projectile.
severance-array-2=Aim Trace Protocol
severance-array-text-2=Each shot retargets one live visual trace for that array. When budget allows, the beam endpoint becomes the witness: fire, scorch, sticker, splash, and direct damage arrive after the visible cut reaches the target.
severance-array-3=Load Shedding
severance-array-text-3=When too many arrays fire at once, the runtime divides the available visual slices between them. The battlefield may show fewer streaks, but direct fallback preserves damage without spending extra time on fire and scorch witnesses.
