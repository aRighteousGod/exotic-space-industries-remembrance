[mod-setting-description]
ei-severance-array-visual-fidelity=Controls only the Severance Array's visible beam witnesses, glow/fire/scorch lifetimes, sound density, and runtime visual budget. Damage, range, power, health, and recipe cost are unchanged. Maximal is a capped screenshot/stress preset; Unbounded removes hard visual caps and can devastate UPS.

