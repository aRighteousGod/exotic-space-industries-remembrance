[ei-factory-passage-guide]
walking-heading=Walking between machines
walking=Leave room for the engineer. Passage narrows supported production, power, logistics and turret bodies so you can walk between adjoining buildings. Their centres stay solid. Defensive walls and gates, terrain obstacles, vehicles, enemies, off-grid entities and invisible support helpers keep their intended collision.
modes-heading=Choosing a pipe mode
modes=Vanilla preserves the collision supplied by the game and other mods. Squeak Through lets you cross adjoining joints and needs no companion mod. ESIR keeps actual connected above-ground joints solid while leaving unconnected gaps open. Underground spans gain no barrier. Ordinary pipes connect sideways: touching rows form a connected grid, not a separate walking lane.
controls-heading=Finding the controls
controls=Startup controls select categories and pipe mode and require a restart. For live pacing, open Mod settings → Map, or Administration → Options → Performance. Both screens edit the same save-wide values. The main budget (default __3__) covers endpoint updates, occupied-joint retries and GUI checks. Initial discovery and immediate helper cleanup remain synchronous.
recipes-heading=Recipe changes
recipes=Construction, rotation, pasted settings and other supported events queue local updates. An open native machine GUI gets responsive recipe checks. Unattended assemblers using native circuit recipe selection use the background scanner. Closed manual machines have no recurring checks. Other mods that silently change recipes or circuit selection must call the existing factory-passage refresh hook.
scanner-heading=Tuning the scanner
scanner=Scanning is off by default. The following rates apply when enabled. The circuit budget defaults to __1__ attempt per tick, in addition to the main budget. Each machine has a __2__-tick cooldown after a successful check or completed update; GUI and event updates bypass it. At normal speed, the default permits at most __4__ attempts per second across the save. A stable group of 600 eligible machines therefore takes roughly __5__ seconds per pass. This is an illustration, not a response-time promise: reconciliation backlog can add delay. Raise the budget for faster updates, or lower it to limit queued work. Neither budget guarantees a tick duration.
troubleshooting-heading=Disabling scanning and troubleshooting
troubleshooting=With scanning off, unattended circuit changes can remain stale; GUI and event updates still work. Check that Factory passage is enabled and pipe mode is ESIR. Squeak Through 2 takes precedence over ESIR collision control. If a joint is waiting for character clearance, step away so it can activate safely. An authorized administrator can use Diagnostics → Factory passage → Repair, or /ei-admin-repair factory-passage, to rebuild tracking without replacing your machines.
