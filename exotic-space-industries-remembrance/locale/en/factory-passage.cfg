[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=Off by default. Observe unattended assemblers that use native circuit recipe selection. Disable this to stop background scans; circuit changes may then leave pipe joints stale until an event or explicit refresh updates them. Open machine GUIs and event-driven updates remain operational. Applies next service tick, without rebuilding. Inactive outside ESIR pipe mode, when Factory passage is disabled, or when Squeak Through 2 takes precedence.
ei-factory-passage-circuit-scan-budget=Additional circuit scan attempts per tick across the save (1–1,024; default 1), separate from the factory passage update budget. Each machine waits at least 60 ticks after a successful recipe check or completed reconciliation before another background scan. Lower values reduce queued script work but delay collision updates; higher values drain work faster with potentially larger tick costs. Neither budget guarantees milliseconds. Changes apply without restarting; the value is retained when scanning is off.
ei-factory-passage-update-budget=Maximum queued work items per tick (1–1,024; default 256). Lower values reduce script work but delay pipe collision updates; higher values drain queues faster and can increase tick cost. Applies immediately to all surfaces without a restart. Initial world discovery and helper cleanup are synchronous and are not limited by this setting. Inactive outside ESIR pipe mode, with Factory passage disabled, or when Squeak Through 2 takes precedence.
ei-factory-passage-enabled=Enable passage between supported adjoining factory entities. Turning this off disables all ESIR passage changes while retaining the category selections.
ei-factory-passage-production=Allow passage between adjoining production machines, mining drills, labs, agricultural towers, asteroid collectors and rocket silos.
ei-factory-passage-power=Allow passage between adjoining generators, boilers, reactors, accumulators, solar panels and electrical infrastructure.
ei-factory-passage-logistics=Allow passage between adjoining storage, inserters, circuit devices, beacons, radars, roboports and train stops.
ei-factory-passage-turrets=Allow passage between adjoining player-built turrets, including their operating variants.
ei-factory-passage-pipe-mode=Vanilla: preserve the original pipe collision behavior.\nSqueak Through: allow passage between adjoining pipe pieces, including connected joints; pipe centres remain solid.\nESIR: allow passage through unconnected gaps while keeping connected above-ground joints solid. A new joint barrier waits until characters leave its space. Underground spans and already-walkable heat pipes remain passable.

