ei-water-turret=Uses water and 100 kW of electricity to slow enemies by 25% for 2 seconds without damage, or automatically extinguish nearby fires. Range: 24. Firefighting uses 15 water per pulse. Configure priorities in the turret GUI.
ei-extinguisher=Manually removes fire and acid pools in a small area. Uses extinguisher canisters.
ei-extinguisher-ammo=Canister for the handheld fire extinguisher. Capacity: 100.

