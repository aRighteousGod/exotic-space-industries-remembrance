menu_auric_inoculation_vat=Auric inoculation vats
title_auric_inoculation_vat=Auric inoculation vats
auric-inoculation-vat=Auric inoculation vats
auric-inoculation-vat-text=Gleba's [entity=ei-auric-inoculation-vat] does not latch onto existing [entity=ei-auric-cyst-node] growth. It claims a contiguous wetland basin around itself and turns that living marsh body into a batch process that later blooms fresh nodes.\n\n[font=default-bold]Placement and basin claims:[/font] These vats are for Gleba. Set them where the claim field can touch enough marsh tiles to form a real basin. A valid basin needs 24-160 connected wetland tiles; a larger contiguous marsh must be cut down or split, and the basin cannot be shared with another vat. Overlapping footprints create claim conflicts, while a vat without a valid basin has nothing stable to inoculate.
auric-inoculation-vat-2=Cycle inputs and band scaling
auric-inoculation-vat-text-2=The vat runs through [font=default-bold]seed -> flood -> ferment (optionally enriched with bioflux) -> drain -> bloom -> rest[/font], not as a passive marsh drainer. Seed consumes [item=spoilage] and [fluid=ei-bio-oil], flood consumes [fluid=ei-dirty-water], and ferment consumes [item=jelly] and [item=yumako-mash]. During the enrichment window, feeding [item=bioflux] switches that ferment craft to enriched ferment before the vat drains and blooms.\n\nBasin size sets the active band: b1 at 24-39 claimed tiles, b2 at 40-55, b3 at 56-71, b4 at 72-87, b5 at 88-103, b6 at 104-127, and b7 at 128-160. Those same bands cap living cyst nodes in the claimed basin at 6, 8, 12, 16, 20, 24, and 28. Higher bands can hold more bloom output, but they also demand more water handling and more stable reagent support across the cycle.\n\nOrdinary blooms produce 2, 2, 4, 4, 6, 8, and 10 nodes across b1-b7; bioflux enrichment adds 2 more. Each node yields 2 cysts. Remaining basin capacity and available placement space can reduce a harvest.
auric-inoculation-vat-3=Vigor, contamination, and bloom failure
auric-inoculation-vat-text-3=Every cycle balances [font=default-bold]vigor[/font] against [font=default-bold]contamination[/font]. Healthy basin footprints, fed phases, and manageable band pressure keep vigor ahead. Starvation, blocked drains, claim conflicts, and overworked marsh tiles drive contamination upward and push the vat into strained states.\n\nWhen contamination reaches failure thresholds, bloom stability collapses. The vat starts degrading basin tiles into worse wetland states and drops back toward rest instead of holding a clean bloom. If the console keeps drifting from stable to strained, either tighten the basin footprint or feed the cycle harder before the marsh dies under the machine.
auric-inoculation-vat-4=Cyst washing, dirty-water recapture, and telemetry
auric-inoculation-vat-text-4=A successful vat later blooms fresh [entity=ei-auric-cyst-node]. Mine those nodes for [item=ei-auric-cyst], then run [recipe=ei-auric-cyst-washing] to strip the cysts into useful output while returning a [fluid=ei-dirty-water] fraction to Gleba's wider water loop. The vat's own drain phase outputs [fluid=ei-dirty-water] and sometimes [fluid=ei-acidic-water]; those output ports must clear before the next phase begins. A blocked drain holds the vat in place and raises contamination until the pipework can breathe.\n\nCircuit telemetry keeps the marsh legible. The vat can export [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims], and [virtual-signal=ei-auric-vat-bloom]. Use them to compare basin footprints, alarm on conflicts or failure states, and decide when the washing line and drain handling need to grow with the next marsh band.\n\n[technology=ei-productivity-auric-cyst-washing] adds +10% washing productivity per level. Productivity modules stack with research, up to a shared +300% cap (4 times the base gold output). Only gold receives bonus output; spoilage and dirty water remain unchanged per input batch. Research continues beyond the cap without increasing yield, and modules reach the cap sooner.
