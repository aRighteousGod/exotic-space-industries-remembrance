guide-summary=The Simple report separates the local day from the seasonal calendar. Its day strip shows the surface's current native light boundaries and complete rotation duration; its season strip follows ESIR's annual calendar. Countdown estimates use current settings. Fulgora keeps its independent day controller, and held time or permanent daylight suppresses ordinary forecasts. Landscape banners are decorative. Activity cards count successful recorded changes, which can include several changes to the same patch. They show the latest known activity for each category; older totals may have no saved time. Observation age and coverage describe limited field readings, not the health of the entire world.
