record-help=Counts record successful ESIR changes, not separate patches or a complete terrain survey. The same patch can change more than once. Older saves retain their totals but may have no activity times. A wildfire count records ignitions, not forest loss.
ground-help=Recovery can retrace recorded terrain changes when conditions allow. A covering or an external replacement can make the saved sequence unusable; removing it does not recreate the record. Infrastructure, cultivated land and special sites retain their protections.
ground-conditions=Soil damage needs pollution of at least __1__ for __2__; recovery needs readings of at most __3__ for __4__. Reliable observations and separate opportunities are still required.
pollution-unavailable=This world's pollution cannot be used to judge industrial contamination. Gleba's spores are not industrial pollution.
mining-recovery-on=Mining recovery is enabled. Recorded scars can recover when the required clean conditions and protection checks are met.
mining-recovery-off=Mining recovery is disabled. Recorded mining scars remain until this option is enabled or the terrain is replaced.
woodland-help=These are recorded changes to approved wild trees. Cultivated plants and protected flora are excluded. Naturally grey trees do not by themselves prove pollution damage.
woodland-unavailable=This world has no approved native woodland for these effects.
other-help=Effects still require suitable local terrain and protection checks. Shoreline conversion is limited to approved Nauvis freshwater/coastal pairs. Paving corrosion has its own explicit eligibility rules.
