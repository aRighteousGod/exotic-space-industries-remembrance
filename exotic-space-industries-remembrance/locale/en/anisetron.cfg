ei-anisetron-visual-fidelity-lean=Thin
ei-anisetron-visual-fidelity-standard=Remembered
ei-anisetron-visual-fidelity-cinematic=Radiant
ei-anisetron-visual-fidelity-maximal=Revelatory
ei-anisetron-visual-fidelity-unbounded=Unbound

[string-mod-setting-description]
ei-anisetron-visual-fidelity-off=The cathedral seals its afterimage. Motion trails and weapon embellishments fall silent; both cutting signals remain visible.
ei-anisetron-visual-fidelity-lean=Eight thin filaments follow the lower crystals, with restrained weapon resonance. Roots hidden by the hull stay concealed.
ei-anisetron-visual-fidelity-standard=Green threads remember the procession; chromatic halos and brief contact flashes answer its targets.
ei-anisetron-visual-fidelity-cinematic=The procession renews its eight threads more often beneath a more radiant weapon envelope.
ei-anisetron-visual-fidelity-maximal=Dense resonance gathers beneath the crystals and around each cutting signal.
ei-anisetron-visual-fidelity-unbounded=The visual governor is removed. Every registered cathedral may write its passage, with finite-lived filaments and unchanged weapon damage.

[exotic-industries-informatron]
menu_gaian_hierophant=Gaian Hierophant
title_gaian_hierophant=Gaian Hierophant
gaian-hierophant-intro=A sanctuary turns devotion into a cutting signal. The Gaian Hierophant is a slow floating cathedral with two crystal beams, built on a native Spidertron command core.
gaian-hierophant-controls=Controls and supplies
gaian-hierophant-controls-text=Use normal Spidertron driving, remote selection and autopilot. Equipment, cargo, trash slots and vehicle logistics work through the native interfaces. Manual and automatic fire start the same paid burst; the vessel can move while firing. Hover stabilisation limits stacked slowing effects, but damage and direct stuns still apply.
gaian-hierophant-weapons=Two crystals, two target locks
gaian-hierophant-weapons-text=At normal ammunition quality, the crown deals __1__ laser damage every __2__ ticks, has a base range of __3__ tiles and covers __4__ degrees. The facade deals __5__ laser damage every __2__ ticks within __6__ tiles and a __7__-degree frontal arc. Each beam holds an eligible target and turns smoothly to a replacement when that target is lost. Damage waits for acquisition; crossing a unit visually does not make it a target. Vehicle quality extends the crown's range; facade range stays fixed.
gaian-hierophant-charge=One charge, one firing period
gaian-hierophant-charge-text=One [item=ei-anisetron-crystal-charge] prepays both beams for __1__ seconds. Their combined base output is up to __2__ laser damage per second while both channels connect, before research, upgrades and resistances. Searching and turning use that same firing period; unused damage is not saved or moved between beams. Resupply through vehicle ammunition logistics. Paid fire continues when ammunition runs out or manual fire is released. Removing the vessel cancels remaining contacts; committed collapses and echoes still finish.
gaian-hierophant-upgrades=Lance inheritance
gaian-hierophant-upgrades-text=Ammunition quality and [technology=laser-weapons-damage-6] and later improve both beams. Only the crown inherits [technology=ei-singularity-lance-axial-rupture], [technology=ei-singularity-lance-wound-memory], [technology=ei-singularity-lance-terminal-collapse] and [technology=ei-singularity-lance-black-hole-testament]: additional incisions, accumulating wound damage, delayed collapse and an empowered pulse every __1__ scheduled crown pulses. These upgrades are not construction prerequisites. A charge fixes its damage, ranges, quality and researched upgrades when paid; new research affects later charges.
gaian-hierophant-construction=Assembly on Gaia
gaian-hierophant-construction-text=Research [technology=ei-anisetron] after the Slipwake Saucer, Singularity Lance and Laser weapons damage 5. Assemble on Gaia using an empty [item=ei-gaian-saucer] chassis, one [item=ei-singularity-lance] and the remaining recipe materials. Remove equipment and empty the chassis first: this ordinary recipe creates a fresh vessel and does not transfer its configuration. Crystal charges can be manufactured on any surface.
gaian-hierophant-visuals=Visual resonance
gaian-hierophant-visuals-text=Selected startup preset: __1__. It controls the green motion filaments, beam halos and contact flashes. Both core beams and essential upgrade cues remain visible, including with decoration off. Fidelity changes neither damage, targeting, range, charge payment, firing duration nor movement. Higher presets admit more decorative work; Unbound removes those caps and can cost more UPS.
