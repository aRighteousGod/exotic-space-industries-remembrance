ei-anisetron=ANISETRON — Processional Cathedral
ei-anisetron-beam=Crystal incision
ei-anisetron-crown-beam=Crown procession

[entity-description]
ei-anisetron=A sanctuary that turns its devotion into a cutting signal. Its crown inherits the Singularity Lance's reach and four researched ruptures; the facade crystal holds a nearby frontal enemy. Both incisions turn smoothly when their targets are lost; damage resumes on acquisition. Hover stabilisation limits compounded slowing; damage and direct stuns still apply. Native Spidertron controls govern its procession, equipment and logistics.\nAssemble on Gaia from an empty Gaian saucer chassis and a Singularity Lance.

[item-name]
ei-anisetron=ANISETRON — Processional Cathedral
ei-anisetron-beam-gun=Crystal aperture
ei-anisetron-crystal-charge=Crystal charge

[item-description]
ei-anisetron-crystal-charge=A sealed lattice becomes two chromatic incisions. One charge prepays the crown's surrounding coverage and the facade's frontal lock for their shared firing period, including time spent acquiring new targets. The burst continues after ammunition is exhausted or manual fire is released. Removing the cathedral cancels remaining contacts; committed collapses and echoes finish. Ammunition quality and Laser weapons damage 6 and later improve both beams. Singularity Lance upgrades improve only the crown. Damage, upgrades and ranges are fixed when each charge is paid.

[ammo-category-name]
ei-anisetron-crystal=Cathedral crystal beam

[technology-name]
ei-anisetron=ANISETRON — Processional Cathedral

[technology-description]
ei-anisetron=Enshrine a Singularity Lance within the hovering chapel. Its crown inherits the Lance's four researched ruptures; its facade keeps a close defensive oath. Assemble the cathedral on Gaia; manufacture crystal charges wherever its supply line reaches.

