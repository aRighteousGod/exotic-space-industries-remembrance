[mod-setting-name]
ei-anisetron-visual-fidelity=ANISETRON visual resonance

[mod-setting-description]
ei-anisetron-visual-fidelity=Sets the cathedral's eight green motion filaments, beam halos and contact flashes. Both core beams, essential rupture cues and all 128 body directions remain visible at every tier. Damage, range, crystal-charge payment, firing duration and movement remain unchanged.

[string-mod-setting]
ei-anisetron-visual-fidelity-off=Dormant
ei-anisetron-visual-fidelity-lean=Thin
ei-anisetron-visual-fidelity-standard=Remembered
ei-anisetron-visual-fidelity-cinematic=Radiant
ei-anisetron-visual-fidelity-maximal=Revelatory
ei-anisetron-visual-fidelity-unbounded=Unbound

[string-mod-setting-description]
ei-anisetron-visual-fidelity-off=The cathedral seals its afterimage. Motion trails and weapon embellishments fall silent; both cutting signals remain visible.
ei-anisetron-visual-fidelity-lean=Eight thin filaments follow the lower crystals, with restrained weapon resonance. Roots hidden by the hull stay concealed.
ei-anisetron-visual-fidelity-standard=Green threads remember the procession; chromatic halos and brief contact flashes answer its targets.
ei-anisetron-visual-fidelity-cinematic=The procession renews its eight threads more often beneath a more radiant weapon envelope.
ei-anisetron-visual-fidelity-maximal=Dense resonance gathers beneath the crystals and around each cutting signal.
ei-anisetron-visual-fidelity-unbounded=The visual governor is removed. Every registered cathedral may write its passage, with finite-lived filaments and unchanged weapon damage.
