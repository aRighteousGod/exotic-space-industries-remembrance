[mod-setting-name]
ei-anisetron-visual-fidelity=Gaian Hierophant visual resonance

[mod-setting-description]
ei-anisetron-visual-fidelity=Sets the cathedral's eight green motion filaments, beam halos and contact flashes. Both core beams, essential rupture cues and all 128 body directions remain visible at every tier. Damage, range, crystal-charge payment, firing duration and movement remain unchanged.

[string-mod-setting]
