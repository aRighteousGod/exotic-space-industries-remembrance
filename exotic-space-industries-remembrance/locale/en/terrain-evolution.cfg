[string-mod-setting-description]
ei-terrain-intensity-restrained=Restrained uses a 0.5 multiplier, Standard 1, and Severe 2. Custom uses the configured custom multiplier. Processing budgets remain separate.
ei-terrain-intensity-standard=Restrained uses a 0.5 multiplier, Standard 1, and Severe 2. Custom uses the configured custom multiplier. Processing budgets remain separate.
ei-terrain-intensity-severe=Restrained uses a 0.5 multiplier, Standard 1, and Severe 2. Custom uses the configured custom multiplier. Processing budgets remain separate.
ei-terrain-intensity-custom=Restrained uses a 0.5 multiplier, Standard 1, and Severe 2. Custom uses the configured custom multiplier. Processing budgets remain separate.
ei-terrain-performance-ultra-low=Service interval (ticks): 16. Entity searches: up to 1 every 128 ticks. Per-service caps: recovery checks 1, tile writes 1. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-low=Service interval (ticks): 16. Entity searches: up to 1 every 64 ticks. Per-service caps: recovery checks 2, tile writes 2. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-lean=Service interval (ticks): 16. Entity searches: up to 1 every 32 ticks. Per-service caps: recovery checks 4, tile writes 4. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-balanced=Service interval (ticks): 8. Entity searches: up to 1 every 16 ticks. Per-service caps: recovery checks 4, tile writes 4. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-detailed=Service interval (ticks): 4. Entity searches: up to 1 every 8 ticks. Per-service caps: recovery checks 8, tile writes 4. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-high-fidelity=Service interval (ticks): 2. Entity searches: up to 1 every 4 ticks. Per-service caps: recovery checks 8, tile writes 4. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-ultra-high-fidelity=Service interval (ticks): 1. Entity searches: up to 2 every 2 ticks. Per-service caps: recovery checks 16, tile writes 8. Shared across all surfaces; actual work depends on eligibility.
ei-terrain-performance-custom=Uses the individual service interval, entity search interval, work limits and storage caps. Small batches with a longer search interval reduce peak work and slow coverage. Changing presets preserves committed recovery history.
ei-terrain-wildfire-off=Disables ecology-started fires. Thermal scars and unrelated combat fires remain controlled separately.
ei-terrain-wildfire-contained=Owned nonspreading flames live for at most 10 seconds. Ignitions are bounded; unrelated fires are never adopted.
ei-terrain-wildfire-spreading=Uses native spreading fire. Initial ignitions are bounded, but subsequent engine propagation is outside ESIR's script budget and can cost substantial UPS.

