[mod-setting-description]
ei-terrain-evolution-enabled=Enables ESIR's planetary terrain ecology: pollution-driven terrain changes and recovery, event-triggered mining scars, wild-tree stress/regrowth, and seasonal daylight. Configure individual features, planet switches and UPS budgets in Mod settings → Map. Optional hazards are off by default; Fulgora keeps its independent day controller. Disabling stops new changes without resetting terrain and restores daylight only while ESIR still owns it.
ei-terrain-active=Runs ecology and seasonal daylight on enabled, supported surfaces. Disabling stops new work without undoing terrain changes; owned daylight is restored only if no other controller has changed it.
ei-terrain-intensity=Restrained uses a 0.5 rate multiplier, Standard 1, and Severe 2. Custom uses the configured multiplier. Intensity is separate from processing budgets and never enables disabled hazards.
ei-terrain-performance=Small batches run frequently. Ultra Low and Low favor minimum work; Lean is the conservative default. Balanced, Detailed, High Fidelity and Ultra High Fidelity progressively increase coverage and UPS cost. Custom uses individual limits. All budgets are global; intensity and hazards remain separate.
ei-terrain-custom-rate-multiplier=Restrained uses a 0.5 multiplier, Standard 1, and Severe 2. Custom uses the configured custom multiplier. Processing budgets remain separate.
ei-terrain-degradation=Gradually degrades eligible natural terrain along its planet's tile chains after sustained pollution. Defaults: pollution at least 100 for five minutes. Gleba spores do not count as toxic pollution.
ei-terrain-recovery=Restores only recorded ESIR terrain changes along their exact original path. Defaults: pollution at most 25 for ten minutes, with a recovery interval four times the degradation interval. External replacement cancels recovery ownership.
ei-terrain-mining-scars=Triggered by finite resource depletion within eligible quarry or big mining drill coverage. Nearby scars are queued under shared work limits; bursts may skip extra scars. Permanent by default. The event does not identify the causing drill.
ei-terrain-tree-stress=Greys approved native wild trees after sustained pollution and reverses ESIR-owned greying after clean conditions. Cultivated plants and protected flora are excluded.
ei-terrain-tree-regrowth=Slowly grows approved local trees near existing trees after sustained clean conditions. Local density and terrain protections apply; Gaia uses its biome-specific tree selection.
ei-terrain-thermal-scars=Fire-killed trees can leave small terrain scars when the fire source qualifies. This effect does not ignite fires.
ei-terrain-seasonal-daylight=Enabled by default. Seasonally changes daylight duration and native solar production without changing total day length. Fulgora is always excluded; frozen daylight and external controllers take precedence.
ei-terrain-mining-recovery=Off by default. Records future mining scars for recovery; earlier permanent scars cannot be reconstructed. Mining damage supersedes older ecological recovery paths.
ei-terrain-aging=Off by default. Replaces eligible living Nauvis trees with native deadwood. Other planets have no approved deadwood replacement and remain excluded. This does not start fires.
ei-terrain-rot=Off by default. Gradually removes eligible native deadwood. Protected trees and sites are excluded.
ei-terrain-flood=Off by default. Converts approved Nauvis sandy shoreline tiles into water beside existing freshwater. Other planetary liquids and protected areas are excluded.
ei-terrain-drought=Off by default. Converts approved Nauvis shoreline water into sand beside existing sandy shore. Other planetary liquids and protected areas are excluded.
ei-terrain-cliffs=Off by default. Occasionally removes eligible ordinary cliffs. Special planetary cliffs and protected areas are excluded.
ei-terrain-blood=Off by default. Enemy unit or nest deaths can reverse one recorded terrain-damage step nearby. Mining scars still require mining recovery to be enabled.
ei-terrain-paving=Off by default. Requires blood effects: enemy deaths may strip eligible stone or concrete paving to its underlying tile. Infrastructure and other protections still apply.
ei-terrain-seasonal-ecology=Off by default. Seasonally varies soil degradation, tree activity/regrowth and hazard attempt rates. Works independently of seasonal daylight ownership; it does not enable disabled hazards.
ei-terrain-wildfire=Off by default. Pollution can trigger bounded ignitions. Contained flames cannot spread and live for at most 10 seconds; native spreading can exceed ESIR's script budget. Unrelated combat fires remain independent.
ei-terrain-planet-nauvis=Enables Nauvis ecology and seasonal daylight: grass, dirt, desert and sand degradation chains, native wild trees, and optional shoreline changes. Individual feature switches and protections still apply.
ei-terrain-planet-gaia=Enables Gaia ecology and seasonal daylight: meadow/wetland variants degrade to exposed Gaia rock, recover their recorded original variants, and regrow biome-appropriate trees. Authored sites remain protected.
ei-terrain-planet-vulcanus=Enables Vulcanus ecology and seasonal daylight using volcanic ash, soil and crack chains. Lava is protected; fumaroles retain their independent effects.
ei-terrain-planet-gleba=Enables Gleba ecology and seasonal daylight using biome-specific terrain and native wild trees. Spores do not cause toxic-pollution damage; cultivated plants/soils and Auric basins remain protected.
ei-terrain-planet-fulgora=Enables Fulgora terrain ecology: rock, sand, dust and dune transitions. Oil oceans remain protected. Seasonal daylight never controls Fulgora; its independent day controller remains authoritative.
ei-terrain-planet-aquilo=Enables Aquilo ecology and seasonal daylight through approved snow-compaction and ice transitions. Ammonia oceans, foundations and infrastructure remain protected.
ei-terrain-pollution-high=The upper threshold starts polluted exposure; the lower threshold starts clean exposure and must remain below the upper threshold. Uses local native pollution levels without changing pollution directly.
ei-terrain-pollution-low=The upper threshold starts polluted exposure; the lower threshold starts clean exposure and must remain below the upper threshold. Uses local native pollution levels without changing pollution directly.
ei-terrain-mining-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-wildfire-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-flood-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-drought-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-cliff-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-blood-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-paving-probability=Chance per eligible attempt, from 0 (never) to 1 (always). The corresponding feature must be enabled; protection checks still apply.
ei-terrain-axial-tilt=Assumed axial tilt used to calculate seasonal daylight contrast; default 23.5 degrees. Larger values usually produce stronger seasons. Full daylight and full night each retain a 2% minimum; Fulgora is excluded.
ei-terrain-latitude=Assumed latitude for seasonal daylight; default 45 degrees. Higher absolute latitudes increase seasonal contrast; the sign swaps summer and winter. This does not move players or change planetary rotation.
ei-terrain-season-strength=Strength of seasonal variation in ecological rates. Applies only while seasonal ecology is enabled.
ei-terrain-dirty-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-clean-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-soil-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-recovery-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-mining-radius=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-mining-patch-radius=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-tree-growth-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-tree-density-limit=Maximum tree count within the configured neighborhood before natural regrowth is suppressed.
ei-terrain-tree-neighborhood=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-tree-stress-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-tree-aging-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-tree-rot-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-hazard-seconds=Delay or interval in simulation seconds. Suitable conditions and available processing capacity are still required.
ei-terrain-wildfire-radius=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-hazard-radius=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-calendar-days=Reference year in captured Nauvis days; default 360. Each planet's year scales with its loaded starmap distance. Changing this preserves the current seasonal phase and never changes planetary rotation.
ei-terrain-protection-buffer=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-max-depth=Maximum number of degradation steps allowed from the recorded original terrain.
ei-terrain-seed-distance=Distance or radius in tiles. Protection checks can reject an otherwise eligible position.
ei-terrain-interval=Custom preset: ticks between global service opportunities. Larger values reduce processing frequency and slow coverage; delayed work never causes a catch-up burst.
ei-terrain-search-interval=Custom preset: minimum ticks between entity-search allowances, shared by all surfaces. Separate from the service interval; shorter values allow more searches and can increase UPS cost. Unused allowances do not accumulate.
ei-terrain-cold-chunks=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-active-chunks=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-candidates=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-histories=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-writes=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-recovery-reserved=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-searches=Custom preset: maximum entity searches on a service where the entity search interval is due. Shared across all surfaces; unused searches do not carry over.
ei-terrain-result-limit=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-events=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-mining-queries=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-mining-candidates=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-admissions=Used by the Custom processing preset. This is a finite global work limit shared by all surfaces, not a separate allowance for each planet. Higher values can increase CPU load.
ei-terrain-active-cap=Maximum amount of stored ecological state. Higher limits use more memory. Processing limits still apply.
ei-terrain-pending-cap=Maximum amount of stored ecological state. Higher limits use more memory. Processing limits still apply.
ei-terrain-tile-history-cap=Maximum amount of stored ecological state. Higher limits use more memory. Processing limits still apply.
ei-terrain-tree-history-cap=Maximum amount of stored ecological state. Higher limits use more memory. Processing limits still apply.

