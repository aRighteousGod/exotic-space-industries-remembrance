[ei-terrain]
overview=Terrain evolution combines pollution-driven soil change, recorded recovery, mining scars and natural tree responses. Optional fire, shoreline, cliff, blood and pavement effects have separate controls. Nauvis, Gaia and the supported Space Age planets keep their own terrain families. Inspired by TerrainEvolution and TerrainEvolution2.
protections=Ordinary soil changes respect player coverings, infrastructure, resource deposits and unsupported terrain. Recovery follows changes recorded by ESIR instead of repainting every biome as grass. Hazard options remain subject to protection checks; disabling a feature stops new work without undoing previous terrain changes.
calendar=The abstract seasonal calendar uses the loaded starmap’s distance and orientation. It changes neither planet positions nor total day duration. Seasonal daylight and seasonal ecology are separate options. Fulgora retains its independent clock. ESIR yields daylight control to recognized external controllers or detected external changes.
performance=Small batches run frequently. Ultra Low and Low favor minimum work; Lean is the conservative default. Balanced, Detailed, High Fidelity and Ultra High Fidelity progressively increase coverage and UPS cost. Custom uses individual limits. All budgets are global; intensity and hazards remain separate.
effective=State: __1__; processing: __2__; intensity: __3__
mining-note=Finite deposits exhausted within eligible drill coverage can leave mining scars; the depletion event does not identify the drill that caused it. Scars are permanent by default. Configure their switch, patch shape and optional future recovery in the ecology settings.
unsupported=This surface or feature is not supported.
