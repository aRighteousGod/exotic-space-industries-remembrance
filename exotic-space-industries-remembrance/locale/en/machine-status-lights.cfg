[mod-setting-name]
ei-production-machine-lights=Production building status lights

[mod-setting-description]
ei-production-machine-lights=Controls lighting on 28 ESIR production buildings. Multicolor status adds 23 matching lenses and tiny glows on the existing indicators of 20 buildings: green while working, yellow for full output, orange for low power, red for other powered stops, and no added lens or glow without energy. The eight buildings without indicators receive no status light. In this mode Bottleneck Lite skips only the 20 buildings with lamps; its colors do not change ESIR's palette. Original white restores the 25 former plain working lights. Off removes added lenses and status glows. Original white and Off leave Bottleneck Lite unchanged. Arc furnace, Plasma heater and Caster retain all existing effects in every mode. Arc furnace process glow is controlled separately by its flicker setting.

[string-mod-setting]
ei-production-machine-lights-off=Off
ei-production-machine-lights-status=Multicolor status
ei-production-machine-lights-original=Original white

[string-mod-setting-description]
ei-production-machine-lights-off=No added status lens or emitted status light. Original sprite indicators and process effects remain. Bottleneck Lite is unchanged.
ei-production-machine-lights-status=Matching lenses and glows: green while working, yellow for full output, orange for low power, red for other powered stops, and none without energy. Bottleneck Lite skips these 20 buildings. ESIR colors are independent of its color settings.
ei-production-machine-lights-original=Restores the original broad white working lights. Arc furnace, Plasma heater and Caster retain their original effects without added status lenses or glows. Bottleneck Lite is unchanged.
