[technology-description]
ei_em-trains=EM Trains are a new transport paradigm based on a crystal grid infrastructure. [item=ei_charger] [color=orange]Chargers[/color] establish a field mesh that synchronizes EM rolling stock and delivers motive power through the rail path. This architecture supports both surface and space-capable corridors, with the potential for significant speed and acceleration bonuses through research. Without coherent field coverage, propulsion fails.

[item-description]
ei_charger=EM Charger. Active field node that creates and maintains the network envelope used by EM transport. It is the operational nexus for both planetary and space-travel segments. Loss of the field disables EM propulsion. Higher-quality field nodes waste less energy and maintain a cleaner lattice.
ei_em-locomotive=EM Locomotive. Field-driven mover that acts as a client of the [item=ei_charger][color=orange]charger[/color] network. Motion is received from the field mesh; in absence of coverage the unit is inert. Higher-quality couplers can briefly preserve field coherence after leaving the mesh.
ei_em-cargo-wagon=EM Cargo Wagon. Passive field-coupled transport module designed to move within charger-enabled paths, including orbital supply lines.
ei_em-fluid-wagon=EM Fluid Wagon. Passive field-coupled fluid transport module, maintaining integrity as part of the charger field stream on ground and off-world routes.

