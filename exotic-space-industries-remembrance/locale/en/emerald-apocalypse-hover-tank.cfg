[string-mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=The underhull seals its circles and moves without visible hover shimmer.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Four emitter circles answer the ground briefly, with only a disciplined prismatic edge.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=The emitters write steady emerald rings beneath the hull as motion becomes pressure.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=The rings brighten, layer, and shear into mint-green prism fragments around each hover foot.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Each emitter opens a dense luminous seal under the relic, almost devotional in its violence.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=The governor is broken; every hover foot may force the ground to remember the tank's passage.

