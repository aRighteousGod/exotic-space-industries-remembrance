[mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Sets how fiercely the Emerald Apocalypse hover tank lets its underhull emitters shimmer. The oath touches only the prismatic ground rings below the relic; armor, cannon, fuel, charge, and movement remain unchanged.

