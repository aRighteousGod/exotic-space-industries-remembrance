tip-radius=Positive requests are clamped to the maximum allowed by research and quality. One chunk is 32 tiles.
tip-near=Must be less than outer radius. Used by perimeter, pulse and fixed bearing.
tip-start=Start of the clockwise coverage interval, independent of traversal direction.
tip-stop=Stop of the clockwise coverage interval. Crossing north is supported. Equal endpoints mean 360°.
tip-bearing=Fixed bearing mode samples a 32-tile-wide strip.
tip-speed=0 pauses. 100 requests the hardware/research/quality ceiling; shared capacity may reduce achieved speed.
tip-direction=1 clockwise, -1 counterclockwise, 0 oscillating for sector mode. Fixed bearing accepts 0.
tip-policy=Watch only visits generated, already-charted chunks. Survey permits bounded new generation.
tip-contacts=Recent retains distinct last sightings; completed pass publishes atomically; current beam retains one observation batch.
tip-expiry=Recent contacts expire 1–300 seconds after their actual observation, not publication.
tip-run=Positive red signal runs; zero or negative pauses. Pausing cancels unfinished paid work without refund.
tip-trigger=Rising edge starts one pulse. Busy triggers are ignored. Hold the input until Scanning acknowledges it; return to zero before triggering again. The Pulse button triggers manually.
