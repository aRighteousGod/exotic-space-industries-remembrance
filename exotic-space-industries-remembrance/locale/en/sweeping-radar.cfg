informatron-body=Red wire controls each enabled override; green wire publishes reports. A zero signal is a real value. All five operating modes and all reporting policies are available immediately. Research improves range, scan capacity and energy efficiency. Quality improves these capabilities and health.\n\nOne observation charts one covered chunk and samples hostile, living military targets. Positions and ages describe the last observation, not live tracking. Empty valid reports differ from unavailable data. Incomplete reports are lower bounds: each query retains at most 128 candidates and each working report at most 2,048 contacts.\n\nWatch never requests terrain generation. Survey submits at most one new terrain request every 30 ticks globally. Requests that cannot complete expire after 60 seconds and mark incomplete coverage. Geometry changes discard unfinished work and reports. Manual pause, freezing and invalid settings suppress report validity; an armed pulse may retain its completed report. Cancelled paid work is not refunded.\n\nEvery radar shares bounded processing capacity. The initial fleet ceiling is 120 observation starts/s before geometry, contacts, power and generation limits. The hardware speed setting is a request. The panel shows achieved lifetime-average throughput, the ideal pass estimate and the last measured pass. Green scan heading follows completed observations; the animated dish trails completed scan work.\n\nStandby draw and paid observations use one hidden electrical buffer. Copies and repaired buffers start empty; upgrades preserve settings and transfer only existing energy up to the new buffer limit. The ordinary radar remains available.\n\nBase electrical values: Sweeping radar — 1 MW standby, 8 MJ per observation, 64 MW input limit, 16 MJ buffer; Phased-array radar — 2 MW standby, 5 MJ per observation, 128 MW input limit, 10 MJ buffer. Quality adds up to 4 chunks of radius and 50% scan capacity, and reduces observation energy by up to 20%. These bonuses combine with research and cap at Legendary level. Quality does not change standby or shared processing limits. Standby continues while paused or armed. Input limits are charging ceilings; actual energy use is standby consumption plus accepted observations.
