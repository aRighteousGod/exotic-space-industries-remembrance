description=Upgradeable directional radar. Base maximum radius: __1__ chunks. Base scan capacity: __2__ observations/s. Red wire: controls. Green wire: reports. Open to configure. Shared processing and available electricity limit actual refresh speed. Research and quality improve range, scan capacity and energy efficiency.
