[mod-setting-description]
ei-pyric-radiance=Illuminate thermal fires, flame streams, ordinary explosions, muzzle flashes and physical projectiles. Preserves fuel colors and authored special effects. Changes presentation only: fire spread, maps, night vision, flashlights and day length retain their existing behavior. Disabling retains your selected doctrine.
ei-pyric-radiance-preset=Choose the balance of firelight, explosion light, tracer light and muzzle flashes. Multipliers change light radius; zero leaves that family's existing presentation alone. Frequent impact lights and an additional nuclear light flash are reserved for richer doctrines; the existing nuclear camera effect stays intact. Authored exotic and energy effects retain their own presentation.\n
ei-ballistic-divergence=Bullets travel, miss and strike intervening targets. Covers existing bullet magazines, shotgun pellets and bullet-firing robots. Own-force players and structures do not intercept these projectiles; other allied forces and neutral terrain can be hit. Existing splash and burning effects retain their own rules. Piercing and uranium bullet magazines continue through killed targets with a native budget of 25 times their base physical damage; surviving targets stop them. Exotic rounds retain complete single-impact payloads. No new ammunition or research. Disabling retains your selected doctrine.
ei-ballistic-divergence-preset=Choose projectile flight, bullet scatter, magazine capacity and shotgun range variation. Flight changes travel distance, not weapon acquisition range. Bullet scatter multiplies angular deviation 0.16 and range deviation 0.40; zero removes added bullet scatter. Magazine capacity rounds upward; shotgun shell capacity and robot ammunition are unchanged. Terrain protection sets minimum physical resistance of 2/65% for trees and 4/75% for rocks, affecting all physical damage.\n

