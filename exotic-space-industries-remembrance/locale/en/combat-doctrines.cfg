ei-pyric-radiance-preset-ember=Small light additions and few moving lights.
ei-pyric-radiance-preset-veiled=Restrained illumination across ordinary combat effects.
ei-pyric-radiance-preset-furnace-vigil=Burning ground and forests dominate; no added moving lights.
ei-pyric-radiance-preset-iron-benediction=Emphasizes firing positions with stronger muzzle flashes.
ei-pyric-radiance-preset-signal-threads=Emphasizes projectile paths with stronger tracer lighting.
ei-pyric-radiance-preset-tempered=Moderate default illumination; no extra impact or nuclear lights.
ei-pyric-radiance-preset-night-liturgy=Broad, warm combat illumination with additional impact lights.
ei-pyric-radiance-preset-siege-hymn=Strong muzzle flashes and visible incoming fire.
ei-pyric-radiance-preset-cataclysm=Large explosion lights and pronounced nuclear flashes.
ei-pyric-radiance-preset-apotheosis=Maximum atmosphere and light density.
ei-ballistic-divergence-preset-needle-oath=Straight bullets with no added scatter; existing magazine capacity and shotgun variation.
ei-ballistic-divergence-preset-measured-volleys=Small bullet deviations with protected terrain and existing magazine capacity.
ei-ballistic-divergence-preset-breach-doctrine=More bullet scatter and larger magazines; terrain remains vulnerable.
ei-ballistic-divergence-preset-tempered=Moderate scatter and travel; preserves the current bullet ammunition economy.
ei-ballistic-divergence-preset-distant-thunder=Longer projectile travel with restrained bullet scatter.
ei-ballistic-divergence-preset-fortress-oath=Larger magazines, moderate scatter and protected terrain.
ei-ballistic-divergence-preset-wildfire-doctrine=Wide bullet and shotgun variation, larger magazines and protected terrain.
ei-ballistic-divergence-preset-crossfire=Long projectile travel and broad bullet scatter; terrain remains vulnerable.
ei-ballistic-divergence-preset-saturation=Long travel, wide scatter, doubled bullet capacity and protected terrain.
ei-ballistic-divergence-preset-terminal-barrage=Maximum travel, scatter and bullet capacity; terrain remains vulnerable.

