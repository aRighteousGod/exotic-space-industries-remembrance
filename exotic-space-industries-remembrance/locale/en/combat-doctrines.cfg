[exotic-industries-informatron]
pyric-radiance=Pyric Radiance
pyric-radiance-text=The furnace lends its witness to the night. Thermal flames keep their fuel colors; ordinary shots and explosions illuminate their passage. Choose a doctrine in startup settings to favor embers, firing positions, tracer paths or broad siege light. Maps, fire spread, night vision, flashlights and the day cycle retain their existing behavior. Authored exotic bursts and energy effects keep their own visual identity.
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=The shot bears an oath, not a certainty. Existing bullets become physical trajectories; enemies and neutral obstacles can intercept them. Your own force does not intercept these projectiles, while separate allied forces remain valid hits. Existing splash and burning effects retain their own rules. Piercing and uranium bullet magazines carry a native continuation budget of 25 times base physical damage: killed targets can be crossed, while surviving targets stop the shot. Exotic rounds deliver their complete payload once. Doctrine flight extends projectile travel, not weapon targeting range. Selected doctrines increase bullet capacity or protect terrain; recipes, technologies, shotgun capacity and robot damage remain unchanged.
