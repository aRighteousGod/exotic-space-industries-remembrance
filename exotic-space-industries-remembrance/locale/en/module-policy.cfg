[mod-setting-name]
ei-beacon-quality-modules=Quality modules in beacons
ei-beacon-productivity-modules=Productivity modules in beacons
ei-quality-module-effects=Quality module effects

[mod-setting-description]
ei-beacon-quality-modules=Choose which ESIR beacon families accept modules with a quality bonus. Nitrogen covers __ENTITY__ei-copper-beacon__ and __ENTITY__ei-iron-beacon__; Alien covers __ENTITY__ei-alien-beacon__ and __ENTITY__ei-warp-beacon__. Requires the Quality mod.\nWhen permissions are tightened, newly forbidden installed modules are returned to the ground beside their beacon.
ei-beacon-productivity-modules=Choose which ESIR beacon families accept modules with a productivity bonus. Nitrogen covers __ENTITY__ei-copper-beacon__ and __ENTITY__ei-iron-beacon__; Alien covers __ENTITY__ei-alien-beacon__ and __ENTITY__ei-warp-beacon__. Also applies when Quality is disabled.\nWhen permissions are tightened, newly forbidden installed modules are returned to the ground beside their beacon.
ei-quality-module-effects=ESIR applies its quality-module bonuses and penalties. Vanilla-like skips ESIR's changes to their effects. Both modes retain ESIR recipes and research progression. Has no effect when Quality is disabled.

[string-mod-setting]
ei-beacon-quality-modules-neither=Neither family
ei-beacon-quality-modules-nitrogen=Nitrogen beacons only
ei-beacon-quality-modules-alien=Alien and Warp beacons only
ei-beacon-quality-modules-both=Both families (default)
ei-beacon-productivity-modules-neither=Neither family
ei-beacon-productivity-modules-nitrogen=Nitrogen beacons only
ei-beacon-productivity-modules-alien=Alien and Warp beacons only
ei-beacon-productivity-modules-both=Both families (default)
ei-quality-module-effects-esir=ESIR (default)
ei-quality-module-effects-vanilla=Vanilla-like

[beacon-module-policy]
summary=Quality modules: __1__. Productivity modules: __2__.
allowed=allowed
blocked=blocked
quality-unavailable=Quality disabled
