[ei-ecology-guide]
intro-heading=Read the ground around your factory
intro=Your factory leaves more than buildings behind. Pollution can wear down natural ground and grey nearby trees; mining can leave bare patches. Cleaner conditions give some of that ground and woodland a chance to recover. Terrain Evolution also adds local hazards and a seasonal calendar, with rules suited to Nauvis, Gaia, Vulcanus, Gleba, Fulgora and Aquilo. Space platforms, unknown planets and unrelated utility surfaces are outside its coverage.\n\nStart with Ground for soil, recovery, mining and blood effects. Woodlands explains trees and fire; Shorelines covers water and cliffs. Seasons describes the calendar and each world's differences. Controls helps you choose settings, read reports and investigate effects that seem slow to appear. The system draws inspiration from TerrainEvolution and TerrainEvolution2, using ESIR's own processing limits and protection rules.
defaults-heading=The starting conditions
defaults=A new configuration enables the ecology system and all its individual features. That includes recovery for new mining scars, tree aging, deadwood decay, shoreline changes, cliff weathering, blood effects, paving corrosion, seasonal activity and seasonal daylight. You can switch features off individually to suit the kind of landscape you want.\n\n[font=default-bold]Default settings:[/font] Ecological intensity is Restrained and processing is Lean. Wildfire uses Contained fire; Spreading is a separate choice. Existing saves keep their saved settings and explicit surface overrides. These defaults do not reset your choices.\n\n[font=default-bold]Practical limits:[/font] An enabled feature still needs suitable ground or vegetation, the right conditions and time for the system to reach it. Where a chance is involved, a check may produce no change. Switching something on is permission for it to happen, not a promise that it will happen everywhere at once.
observation-heading=Clean or polluted needs a reliable reading
observation=The system checks pollution in a rotating selection of map areas, called chunks, and uses each reading for nearby decisions. It needs repeated readings before treating conditions as steadily clean or polluted. An area that has not been checked recently is unknown; it is not automatically healthy.\n\n[font=default-bold]Default settings:[/font] Dirty conditions mean at least 100 pollution for five observed minutes. Clean conditions mean at most 25 for ten observed minutes. Strictly between 25 and 100, both observation periods reset. A gap longer than 20 simulation seconds also breaks the evidence of continuous conditions.\n\n[font=default-bold]Practical limits:[/font] Missing readings and a different kind of pollution cannot stand in for clean air. Larger explored maps take longer to cover. The observation period is a requirement for an effect, not a countdown promising that each tile will change when it ends.
protection-heading=Leave room for the factory and special places
protection=Ordinary ecological changes leave paving, landfill, foundations and covered ground alone. Machines and other infrastructure, ghosts, live deposits, cultivated plants and their soils, Auric claims, special placed sites and unsupported terrain are protected too. Ordinary supported wild trees and small natural decorations do not, by themselves, make a place industrial.\n\n[font=default-bold]Practical limits:[/font] Protection can extend beyond an obstacle. Shoreline changes and effects on natural objects keep at least an eight-tile margin even if the general buffer is smaller. The system checks protection again just before making a change, so a newly placed machine can stop work that was already waiting.\n\nPaving corrosion has its own narrow exception for eligible, unoccupied paths and concrete. Shoreline changes are limited to specific ground and water pairs. Spreading fire can travel beyond the initially checked ignition site. Switching a feature off stops new activity; changes already made generally remain until a supported recovery process repairs them.
soil-heading=Pollution wears down natural ground
soil=With sustained industrial pollution, natural ground can change a step at a time. On Nauvis, grass can give way to dirt, desert and sand. Other worlds use their own volcanic, wetland, rock or snow terrain. Reducing pollution can prevent further damage once the conditions no longer qualify.\n\n[font=default-bold]Default settings:[/font] Under Restrained, the baseline interval for a soil check is two minutes, from a base setting of 60 seconds. Seasonal activity and processing delays affect when an area is reached. The five-minute dirty observation requirement still applies.\n\n[font=default-bold]Practical limits:[/font] Each check considers a small area, rather than repainting an entire chunk. Maximum degradation depth limits how many recorded steps a patch can take. Ground already at the end of its supported sequence has no further step; each planet keeps its own terrain types.
recovery-heading=Cleaner conditions let recorded damage recover
recovery=Cleaner conditions give damaged ground a chance to recover. ESIR remembers the terrain changes it made and follows them backward, one step at a time, toward the exact original ground. If grass became dirt and later sand, recovery retraces the saved steps rather than choosing any convenient grass tile.\n\n[font=default-bold]Default settings:[/font] Restrained gives recovery an eight-minute interval, from a base setting of 240 seconds. That base interval is four times the base soil interval. The area also needs ten minutes of clean observations; these requirements can run alongside one another. Intensity changes the recovery interval, while seasonal activity does not. Neither interval guarantees an immediate result.\n\n[font=default-bold]Practical limits:[/font] Recovery needs a reliable record of ESIR's damage. Building over the ground or having another system replace it can make that record unusable; removing the covering later does not recreate it. Recovery cannot reconstruct older unrecorded ground or coastlines, rebuild cliffs, or bring destroyed trees back to life.
depletion-heading=An exhausted deposit can leave a scar
depletion=When a finite deposit runs out, exposed ground nearby can be disturbed. The exhausted position must lie within the mining area of a Burner quarry, Steam quarry, Electric quarry or Big mining drill that supports that resource category. Quality changes to the drill's mining area count. Ordinary drills and infinite deposits do not qualify.\n\n[font=default-bold]Default settings:[/font] A patch is chosen within a 56-tile disturbance radius and has a three-tile radius of its own. Each eligible position in that patch has a 70% chance of changing. Live ore and protected ground remain untouched.\n\n[font=default-bold]Practical limits:[/font] The trigger is the deposit running out; the depletion event does not tell ESIR which drill exhausted it. Coverage by a qualifying drill is what matters. Patches are worked through gradually. A scar can therefore appear after the drill has stopped. Heavy depletion bursts can combine nearby requests or prevent more from being accepted, but an accepted request is not discarded simply because it has waited a long time.
working-heading=Working quarries can disturb nearby ground
working=An eligible quarry or Big mining drill can also leave scars while it is still extracting a finite deposit. It must be active, show Working status and have a valid finite mining target on the same surface. This is separate from the scar triggered when a deposit runs out. Idle drills do not create working scars.\n\n[font=default-bold]Default settings:[/font] Restrained gives a ten-minute baseline between opportunities, from the base setting of 300 seconds. Each opportunity has a 10% chance of requesting a mining patch. That patch then uses its separate 70% chance at each eligible position. Seasons and processing delays can alter when checks occur.\n\n[font=default-bold]Practical limits:[/font] Live ore remains protected, so a scar may form on exposed ground nearby. ESIR keeps a limited list of the same four eligible drill families and updates it as drills are created or removed; idle drills can remain listed. A late check makes one current attempt rather than replaying missed chances. Disabling ecology on the surface pauses checks and the application of waiting scars.
mining-recovery-heading=What a mining scar can recover to
mining-recovery=Mining recovery works toward the ground that was there just before the scar formed. If pollution had already turned grass into dirt, recovery from mining can return that patch toward dirt. The mining record replaces the older ecological recovery path, so it cannot recover the earlier grass from that record. Further recorded mining damage can still be retraced.\n\n[font=default-bold]Default settings:[/font] Mining recovery is on for newly recorded scars. Both general terrain recovery and mining recovery must be enabled, and the ground must meet the clean-observation requirements while its recovery record remains valid.\n\n[font=default-bold]Practical limits:[/font] Damage made while mining recovery is disabled is permanent. Enabling recovery later cannot reconstruct those unrecorded scars. Disabling ecology on a surface pauses accepted mining work; reenabling it resumes that work within the ordinary processing limits, without a rush of missed attempts.
blood-heading=Alien blood can help damaged ground recover
blood=When an enemy creature or nest dies, its blood effect can help nearby ground take one step back along its recorded damage. This is a direct restoration effect: it can act without waiting for the normal clean-observation period. It still needs a valid ESIR damage record, the relevant switches and the usual terrain protections. Mining damage also needs mining recovery enabled.\n\n[font=default-bold]Default settings:[/font] An eligible death has a 10% chance of having a small local patch accepted for processing. Changes to that patch are handled later as processing capacity becomes available.\n\n[font=default-bold]Practical limits:[/font] A corpse does not guarantee restored ground, and no permanent healing field is left behind. The effect cannot invent the former terrain where there is no record. It is separate from combat's visible death effects, and busy conditions can limit how many new patches are accepted.
paving-heading=Blood can also corrode exposed paving
paving=With both blood effects and paving corrosion enabled, an enemy-death patch can strip eligible stone paths or concrete back to the tile stored underneath. A valid terrain-restoration step takes priority; paving is considered when that restoration is unavailable. Keep this option off if you want eligible exposed paving to remain intact.\n\n[font=default-bold]Default settings:[/font] Corrosion has a 1% roll after the blood-event acceptance roll. This is a chance within an accepted patch, not a 1% chance for every enemy killed anywhere.\n\n[font=default-bold]Practical limits:[/font] Occupied or otherwise protected paving and foundations are excluded, and the tile underneath must still be known and valid. This is the specific exception to ordinary paving protection. Removed paving is not refunded or rebuilt by recovery. Turning blood effects off also stops new corrosion attempts, even if the paving switch stays on.
stress-heading=Pollution can turn wild trees grey
stress=Supported wild trees can lose colour after sustained dirty conditions. They remain alive and in place; greying is different from burning or becoming deadwood. ESIR remembers the original colour stage and the stress it applied, allowing that stress to be reversed later. Cultivated plants, special flora, protected sites and unsupported species are left alone.\n\n[font=default-bold]Default settings:[/font] Restrained gives stress checks a ten-minute baseline, from a base interval of five minutes. Intensity, seasonal activity, observation coverage and limited tree searches affect when a particular tree is reached. The dirty-observation requirement still applies.\n\n[font=default-bold]Practical limits:[/font] A tree that is already fully grey cannot take another greying step. If another system changes a recorded tree's colour stage, ESIR can give up that record rather than overwrite the new appearance.
greening-heading=A stressed tree can regain its colour
greening=Keep pollution low for long enough and a tree stressed by ESIR can gradually return to its original appearance. A naturally grey tree keeps its natural colour. Recovery needs the same living tree, the expected recorded colour stage and sustained clean observations.\n\n[font=default-bold]Practical limits:[/font] Cutting down, replacing or destroying the tree ends that recovery opportunity. Restoring its colour belongs to the tree-stress feature, which keeps its own records. It is separate from ground recovery, regrowth, aging and decay. Healthy-looking ground does not promise that its former trees will return, and one recovering tree does not prove that every nearby patch is ready to recover.
regrowth-heading=Woodland spreads from surviving trees
regrowth=After sustained clean conditions, a suitable wild tree can seed a new supported tree nearby. Leaving some native woodland gives regrowth a starting point. The new tree must fit the ground and pass the protection checks; on Gaia, its species is chosen to suit the local biome. Cultivated crops are never used as regrowth species.\n\n[font=default-bold]Default settings:[/font] Restrained gives a twenty-minute baseline for growth opportunities, from a base interval of ten minutes, before seasonal variation and processing delays. A new position can be up to eight tiles away along either map axis. Growth is suppressed when the four-tile neighborhood already holds 16 supported natural trees. Across all surfaces, successful new trees are at least ten seconds apart.\n\n[font=default-bold]Practical limits:[/font] This is slow local woodland spread. An isolated clearing without a suitable surviving seed tree may stay empty. Clean readings, enough space and an available processing turn must all come together; an interval is not a promise that every tree will produce another.
aging-heading=Living trees can become deadwood
aging=Tree aging can remove a supported living Nauvis tree and replace it with native deadwood. It works independently of pollution stress, so even a green tree can be selected. Turn aging off if you want living trees to remain until something else removes them.\n\n[font=default-bold]Default settings:[/font] Aging is on. Under Restrained its baseline interval is two hours, from a base setting of one hour, with seasonal activity affecting the timing. These are checks of a searched area, not a fixed lifespan assigned to each new tree.\n\n[font=default-bold]Practical limits:[/font] Nauvis is currently the only world with a supported deadwood replacement. Protection checks still apply. Losing the living tree is permanent; colour recovery cannot bring it back. Aging itself does not start a fire.
rot-heading=Deadwood can gradually disappear
rot=Deadwood decay removes supported dead trees over time. It can clear old woodland remains, but it does not replace them with living trees. Regrowth is the separate process that may eventually establish new woodland nearby. Aging and decay can be switched independently.\n\n[font=default-bold]Default settings:[/font] Under Restrained, decay has a one-hour baseline interval, from a base setting of thirty minutes. Intensity, seasonal activity and processing coverage affect when an area is reached.\n\n[font=default-bold]Practical limits:[/font] Removed deadwood is not recorded for restoration. Unsupported species, protected sites and cultivated flora are excluded. Decay keeps its own timing, so a late visit does not suddenly replay every check missed while the area was unobserved.
thermal-heading=A tree lost to fire can leave damaged ground
thermal=A tree killed by qualifying fire damage can leave a small scar around its former position. The ground changes according to that planet's terrain rules and can be recorded for later recovery. Cleaner conditions may repair the ground while the tree itself remains gone.\n\n[font=default-bold]Practical limits:[/font] The death must have a qualifying fire source, and normal ground protections still apply. Combat fires and spontaneous wildfires can both supply such deaths. Thermal scars react to the death; they do not light another flame. A protected machine site can therefore remain unchanged even when a nearby tree burns.
wildfire-heading=Choose between contained and spreading fire
wildfire=Industrial pollution can occasionally ignite a fire near supported wild trees. The area needs pollution at or above the upper threshold, suitable nearby fuel and an unprotected ignition position. A reading below that threshold stops new wildfire requests there; an accepted ignition may still be waiting. This feature does not wait for the soil's five-minute dirty-observation period.\n\n[font=default-bold]Default settings:[/font] Contained is selected. Under Restrained, the hazard baseline is twenty minutes, from a base interval of ten minutes. A qualifying wildfire opportunity has a 1% chance to attempt ignition; seasons, shared hazard turns and coverage can delay it further. That chance is not per tree per second. Initial ignitions across all surfaces are limited to one per ten seconds and 16 retained fire records.\n\n[font=default-bold]Practical limits:[/font] Contained creates a nonspreading ground flame lasting at most ten seconds. Spreading starts a normal Factorio tree fire; later flames can travel beyond the initially checked area and use engine time outside ecology's scripted limits. Disabling ecology removes its contained flames, but leaves unrelated combat fires and later spreading flames alone. A wildfire alert confirms that ignition was created, not that a forest burned.
flood-heading=Water can advance over a sandy shore
flood=On Nauvis, flooding can turn supported sandy shoreline into water beside existing supported freshwater. Expect small local shoreline changes. Lava, oil and ammonia oceans are outside this effect, as is arbitrary ground far from a suitable shore.\n\n[font=default-bold]Default settings:[/font] Each flood opportunity has a 2% chance. Timing follows the hazard interval, intensity, seasonal activity and processing coverage. Rain, low pollution and visible weather are not requirements.\n\n[font=default-bold]Practical limits:[/font] A suitable shore directly north, south, east or west qualifies the initial request. Before changing a tile, the system checks that its ground-to-water conversion is supported and that protections still allow it. Recorded flooding can recover while its damage record remains valid; turning flooding off alone does not immediately drain the water. This is local shoreline movement, not a global sea-level simulation.
drought-heading=Water can retreat from a sandy shore
drought=On Nauvis, drought can turn supported freshwater into sand beside a suitable sandy shore. It can leave a little more exposed ground along a coast. Other planetary liquids are excluded, and water away from the required shoreline relationship does not qualify.\n\n[font=default-bold]Default settings:[/font] Each drought opportunity has a 2% chance. Its timing follows the hazard interval, intensity, seasonal activity and processing coverage, without a separate high-pollution or weather requirement.\n\n[font=default-bold]Practical limits:[/font] Infrastructure, live resources and special sites remain protected. A waiting change can become ineligible before it is applied. Flooding and drought have independent switches; enabling both allows opposing local changes over time. Neither models temperature or rainfall, and the shore is not forced into an immediate back-and-forth cycle.
cliff-heading=Weathering can remove ordinary cliffs
cliff=Cliff weathering can remove a supported ordinary cliff after checking nearby protections. That changes the natural barrier permanently. Disable the feature if you want cliffs to stay until you remove them yourself.\n\n[font=default-bold]Default settings:[/font] A cliff-weathering opportunity has a 1% chance. It does not need pollution exposure, rainfall, combat damage or a measured cliff age.\n\n[font=default-bold]Practical limits:[/font] Special planetary cliff families are not substituted for the supported ordinary cliff. Nearby infrastructure or protected sites can prevent removal even after a cliff has been found. Ground recovery cannot rebuild a removed cliff.
calendar-heading=A calendar for each world
calendar=Each supported world has a seasonal calendar. Worlds farther from the star generally have longer years, using their starmap distances. The calendar is a way to organise seasonal changes; it does not move planets or change travel routes. Rising, high, falling and low season name its four parts, rather than promising particular weather.\n\n[font=default-bold]Default settings:[/font] The reference year is 360 Nauvis days, using the effective Nauvis day length saved when the calendar starts. A world's year uses that reference multiplied by its distance relative to Nauvis, raised to the power 1.5. Its starmap orientation sets the starting point in the year. Later changes to Nauvis's day controller do not continually redefine the reference.\n\n[font=default-bold]Using the calendar:[/font] The administrator's calendar panel shows reference days, equivalent local days and simulation duration. Changing year length keeps the same position in the season. Administrators can also adjust that position for a preview.
daylight-heading=The daylight share changes, not the whole day
daylight=Seasonal daylight makes daylight last longer or shorter within a planet's existing day. Think of moving sunrise and sunset while leaving the time from one full rotation to the next unchanged. That changes how long solar panels receive daylight. Twilight keeps its existing duration.\n\n[font=default-bold]Default settings:[/font] Nauvis, Gaia, Vulcanus, Gleba and Aquilo are eligible. The assumed axial tilt is 23.5 degrees and latitude is 45 degrees. Even at extreme settings, at least 2% of the cycle remains full daylight and 2% remains full night.\n\n[font=default-bold]Practical limits:[/font] Frozen or permanent daylight pauses seasonal adjustments. ESIR also yields to Diurnal Dynamics or another controller that changes the same dawn and dusk settings. On disable, it restores the original settings only if its last adjustment is still intact. Fulgora's independent day controller keeps full authority; seasonal daylight never adjusts or restores its boundaries.
modulation-heading=Seasons can change the pace of ecology
modulation=Seasonal activity makes soil changes, tree effects, hazards and working-drill scar opportunities more or less frequent through the year. It can run even when seasonal daylight is off or another system controls the light, including on Fulgora. Changing the pace does not change the chance of success at each opportunity.\n\n[font=default-bold]Default settings:[/font] Strength is 25%. The rate rises smoothly to 125% of the chosen intensity's baseline near high season and falls to 75% near low season. Higher rates shorten intervals; lower rates lengthen them.\n\n[font=default-bold]Practical limits:[/font] Seasons do not enable disabled hazards, change dirty or clean observation requirements, or alter the ordinary ground-recovery interval. A growth opportunity still needs clean readings, a suitable seed tree, space and processing capacity. The calendar does not move planets or repaint the world for the season. A winter-coloured launcher is an indicator, not a promise of snow.
nauvis-heading=Nauvis: soil, sand and woodland
nauvis=Nauvis ground can pass through grass, dirt, desert and sand, with recovery returning recorded patches toward their exact original terrain. Supported native trees can show stress, recover colour and regrow. Nauvis is also the first supported world for freshwater shoreline changes and the only one with a living-tree-to-deadwood aging replacement.\n\n[font=default-bold]Practical limits:[/font] Paved factory areas, live resources, infrastructure and special sites remain protected. Eligible paving corrosion is the explicit exception for exposed paving.
gaia-heading=Gaia: keep the local landscape's character
gaia=Gaia's meadows and wetlands can wear down toward exposed Gaia rock. Recovery follows the saved terrain variants back, and regrowth chooses trees suited to the local biome. Special sites placed by ESIR have protected areas so ordinary ecological work leaves them intact.\n\n[font=default-bold]Practical limits:[/font] On older saves, surviving site markers help identify where protection belongs. Areas still being checked, or areas whose old protection records overflowed, can remain closed to ecological changes. If distinguishing markers have disappeared, the system cannot reconstruct the exact old site boundary from nothing.
vulcanus-heading=Vulcanus: changes in ash and volcanic soil
vulcanus=Vulcanus uses its own ash, volcanic soil and cracked-ground changes. Lava stays protected, and tree effects use only supported native species. Fumaroles keep their separate population, reserves and terrain lifecycle.\n\n[font=default-bold]Practical limits:[/font] Ecology does not take over fumarole effects, introduce ordinary Earth-like woodland or turn volcanic liquids into freshwater.
gleba-heading=Gleba: spores need different treatment
gleba=Gleba keeps its own biome-specific ground changes and supported wild-tree habitats, including wetland placement rules. Cultivated plants and their special soils, Auric flora and claimed basins remain protected. Its spores are a different kind of pollution and do not count as toxic industrial contamination.\n\n[font=default-bold]Practical limits:[/font] A spore-only reading is neither a dirty industrial reading nor proof of clean industrial conditions. Spores alone therefore cannot qualify pollution ground damage, ordinary recovery, tree stress or colour recovery, natural regrowth, or pollution wildfire. Eligible mining, fire-death scars, blood effects, independent hazards and the calendar can still operate. Enabling a switch does not make spores a usable industrial reading.
fulgora-heading=Fulgora: its day remains its own
fulgora=Fulgora's supported ground can move through rock, sand, dust and dunes while oil oceans stay protected. Its ecological calendar can change the pace of eligible effects and colour the mechanical-tree launcher. There is no supported native woodland family to grow ordinary trees here.\n\n[font=default-bold]Practical limits:[/font] The independent Fulgora day-cycle system continues to govern daylight. Seasonal daylight never reads, changes or restores Fulgora's dawn and dusk boundaries, including when global ecology or calendar settings change.
aquilo-heading=Aquilo: snow and ice around a protected factory
aquilo=Aquilo uses its own snow-compaction and ice changes, with recorded recovery retracing those steps. Ammonia oceans, foundations and infrastructure remain protected. Seasonal daylight can vary the light share of the day while leaving the planet's rotation unchanged.\n\n[font=default-bold]Practical limits:[/font] There is no supported native woodland family to populate Aquilo with ordinary trees. Ecology does not provide a general freezing, thawing or ocean-conversion simulation.
settings-heading=Choose global settings and local exceptions
settings=The startup integration switch makes ecology available. Use Mod settings → Map for feature switches, pollution thresholds, intervals, chances, planet enablement and processing limits. Administrators can use Terrain & Ecology to override supported settings on an existing surface. Reset-to-inherited removes that local exception. Selecting a planet or reading its report does not create its surface.\n\n[font=default-bold]Practical limits:[/font] The final behavior combines global settings, planetary rules and explicit surface overrides. Master disablement, unsupported terrain, protection and mod-compatibility suspensions still take priority. Upgrades preserve saved settings. Turning recovery off pauses it; it does not instantly restore the ground. Turning another effect off does not refund destroyed trees, cliffs or paving. Turning startup integration off restores seasonal daylight only where ESIR's last adjustment is still intact.
presets-heading=Intensity sets the pace; processing sets the coverage
presets=Choose intensity for how often ecological opportunities should arise, and processing for how much ground the system can check and how quickly it can handle waiting work. Increasing processing can help a busy or widely explored map receive attention sooner. It does not increase the configured chance of success at each check.\n\n[font=default-bold]Default settings:[/font] Restrained uses a 0.5 rate multiplier, Standard 1 and Severe 2; Custom uses your chosen multiplier. A stronger intensity does not turn disabled features on. Processing defaults to Lean. The seven named choices are Ultra Low, Low, Lean, Balanced, Detailed, High Fidelity and Ultra High Fidelity, plus Custom. Lean runs a small batch every 16 ticks, allowing one entity search per 32 ticks.\n\n[font=default-bold]Practical limits:[/font] Processing and storage limits are shared across all surfaces, and Custom remains finite. Lowering a storage limit keeps existing records but blocks new ones until there is room. When recovery storage is full, ESIR refuses new reversible damage instead of forgetting an older patch's recovery path. Larger presets can cost more processing time; none guarantees a particular UPS for every factory.
reports-heading=Read the report for the world you are viewing
reports=The top-left copper mechanical tree opens the Ecology report for the surface you are viewing, including remote view. Its foliage follows the calendar: lime for rising season, emerald for high, amber-red for falling and cyan for low. Hover over it for the season name. Without a usable calendar, it stays emerald and reports that seasonal information is unavailable.\n\n[font=default-bold]Using the report:[/font] Simple describes observed ground, woodland, mining disturbance and seasonal conditions in field-report language. Advanced adds the effective surface settings, readings, waiting work, protection rejections and maintenance status, while distinguishing these from shared global limits and counters. No observation means unknown, not healthy.\n\nThe report refreshes previously collected facts while open. Closing it stops those report updates. The launcher's separate colour check can continue without searching the terrain.
alerts-heading=Choose the changes you want to hear about
alerts=Ecology notifications appear in Factorio's normal alerts window, with icons and positions you can visit. Choose them in the Ecology window's Alerts tab or Mod settings → Per player; both edit the same personal preferences. An alert means an effect actually happened, not simply that a check was planned.\n\n[font=default-bold]Default settings:[/font] Alerts are on for wildfire, flooding, drought, cliff weathering and paving corrosion. Other categories, including pollution damage, recovery, mining and tree effects, start off and can be selected individually. All actual surfaces are selected; current-surface-only is a separate optional filter. Routine daylight adjustments do not raise alerts.\n\n[font=default-bold]Practical limits:[/font] Your force must currently be able to see the incident's chunk; having explored it earlier is not enough. Administrators can bypass that visibility requirement, but category and surface filters still apply and the override is removed on demotion. Nearby incidents are combined, up to four ecology alerts are retained per player, and an incident is eligible for notification for 60 seconds. Offline incidents are not saved up for later delivery. Expiring an alert never deletes recovery records or waiting mining work.
maintenance-heading=What the rebuild window is telling you
maintenance=The ESIR rebuild window shows finite preparation and repair work: converting old save data, making an initial discovery pass, checking changed configuration and repairing stored information. A job can wait while its surfaces are disabled or otherwise unable to proceed. If the total amount of work is unknown, the window shows completed work without inventing a percentage.\n\n[font=default-bold]Practical limits:[/font] An initial discovery pass fixes its list of surfaces when it starts. Each surface traversal ends when it runs out of chunks or reaches 100,000 chunk visits. Reaching that ceiling means coverage was not verified, not that every part of the map was checked.\n\nEveryday observations, recovery, working-drill checks and accepted mining scars continue independently and appear in Advanced. They do not keep the rebuild window open forever. Old saves are prepared gradually; reopening or reenabling ecology does not replay all the chances missed while it was inactive.
troubleshooting-heading=When the landscape seems unchanged
troubleshooting=Start with Advanced for the surface you are viewing. Check that ecology is effectively enabled there and supports that world. Then check for suitable ground or trees, usable pollution readings where required, enough continuous observation, and protection around the chosen spot. Finally, look for waiting work or a full storage limit. A quiet area may simply need more time, especially with a low chance and a long interval.\n\n[font=default-bold]Checks that help:[/font] Ground at the end of its change sequence cannot degrade further. Regrowth needs a surviving seed tree of a supported species. Mining needs either real finite-deposit exhaustion within eligible drill coverage, or a qualifying drill actually showing Working for periodic scars. Fire needs industrial pollution, supported nearby fuel and the intended Contained or Spreading mode. A successful-attempt counter alone does not prove that ignition was created. Recovery needs the original ESIR record, and mining recovery needs both recovery switches.\n\n[font=default-bold]Practical limits:[/font] TerrainEvolution or TerrainEvolution2 suspends overlapping ecology; ESIR yields seasonal daylight to Diurnal Dynamics. More explored ground and more active surfaces take longer to cover within the same global processing allowance. An unknown reading or a delayed check is not evidence that the land is healthy or the feature is broken.
