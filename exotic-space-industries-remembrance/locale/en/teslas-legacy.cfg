[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=Optional lighter path. The doctrine lattice carries the discharge logic directly, preserving battlefield role while easing UPS load.
ei-tl-behavior-mode-legacy-fidelity=Default. Preserves the original Tesla's Legacy behavior, including legacy recursion, persistent helpers, kill-born aftershocks, and the full tank volatility flow regardless of UPS cost.
tl-advanced-attack-anim-charge-up=A bright charge climbs through the Advanced Tesla coil's core, and the turret fires when that charge reaches the crown. This can occasionally delay retargeting if one turret kills the target before another finishes charging.
tl-advanced-attack-anim-simple=Current lashes between the coils as soon as enemies draw near. The coil fires immediately.

