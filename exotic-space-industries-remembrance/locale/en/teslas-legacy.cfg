[technology-description]
tl-basic-tesla-coils-technology=A Tesla coil is an electrical resonant transformer modified to deliver high-current electrical discharges to nearby enemies. It has relatively low damage output, but it can affect multiple targets at once.
tl-advanced-tesla-coils-technology=A significantly improved version of the Tesla coil. Its reach is larger and its damage output is extremely high. It has extensive steel plating for increased survivability.
tl-tesla-tank-technology=A deadly tank variant equipped with 2 medium-sized Advanced Tesla coils. Single-use Portable Tesla coils provide the energy surge needed to trigger the firing mechanism. The installed coils fire simultaneously, but instead of interfering they synergize, producing lightning arcs that bypass most matter and damage everything in their path.
ei-tesla-weapons=Reverse-engineered arc technology recovered from pre-Collapse Fulgoran research vaults. While the original principles remain only partially understood, engineers have reconstructed a functional imitation capable of projecting stabilized electrical arcs toward hostile targets. Output, efficiency, and discharge patterns are considered inferior to true Fulgoran designs, but remain significantly more advanced than conventional electromagnetic weapons. Further refinement is limited until authentic Fulgoran schematics are deciphered.

tl-tesla-ammo-upgrade-technology=Advances in Portable Tesla coil technology revealed design deficiencies in the base Tesla coil structure. Eliminating those weaknesses yields more efficient Tesla coils with broader overall capability improvements.
tl-tesla-coil-damage-technology=The effective damage of a Tesla coil's lightning arc can be increased by installing stronger capacitors and introducing a slight oscillation in the current frequency.
tl-tesla-coil-shooting-speed=Recent improvements in battery efficiency can be applied to Tesla coil designs so they reach critical capacity faster, effectively improving their rate of fire.

tl-flames-explosion-technology=So much energy is channeled through Tesla coil bolts that they can ignite the very air. The short-lived chain reaction takes the form of a violent fiery blast.\n\nEach level of 'Eruption' increases the explosion's area of effect.\n\nDamage: 60% of turret damage.
tl-flames-count-technology=When dry ground and dust particles ignite due to high levels of electric current, the result is a surprisingly violent burning reaction. The flames last only a few seconds, but they generate dangerous levels of heat and burn everything to a crisp.\n\nEach level of 'Flash Fire' increases the number of flames generated and their damage per second.
tl-flames-probability-technology=Extreme levels of concentrated energy can ignite vegetation on the ground, dust particles, or even the air itself.\n\nEach level of 'Combustion' increases the chance of igniting the Tesla coil's target and its immediate surroundings.

tl-single-zap-count-technology=When a creature is struck by the Advanced Tesla coil it can absorb a large amount of static energy. That overload can destroy the host violently. If part of the charge remains after the host is destroyed, it lashes out toward nearby resistance. This phenomenon is called a discharge bolt.\n\nEach level of 'Discharge' increases the number of discharge bolts released when an enemy is killed by the turret.
tl-single-zap-damage-technology=When electric charge remains after the destruction of a target, it becomes a discharge bolt. That bolt carries only part of the initial charge, but the remaining energy can be amplified by fine-tuning the overall resonance level of the Tesla coil.\n\nEach level of 'Heavy Lightning' increases the damage done by discharge bolts.
tl-single-zap-probability-technology=Advanced Tesla coils conduct an unbelievable amount of electric energy. If the target cannot contain that current, it overflows through ionized air molecules as individual lightning arcs that shock nearby entities.\n\nEach level of 'Overcharge' increases the probability of extra lightning arcs forming whenever the Advanced Tesla coil kills an enemy.

tl-multi-zap-range-technology=Higher currents in the coils increase the number of ionized particles in the surrounding static field. This makes it easier for the charge to pass through air and reach more distant targets.\n\nEach level of 'Ionization' increases the effective range of charge propagation.
tl-multi-zap-damage-technology=Fine-tuning the wavelength of the emitted concentrated energy allows more stable and more damaging lightning arcs to form when the charge propagates in the static field.\n\nEach level of 'Lightning' increases the damage of propagating charges.
tl-multi-zap-probability-technology=Constant use of the Tesla coil fills its surroundings with ionized particles. These particles allow the channeled charge to travel past its original target and jump to nearby objects.\n\nEach level of 'Static Field' increases the chance of charges propagating to each nearby enemy.

tl-slowdown-duration-technology=Higher energy currents deliver stronger effects that linger in the target entity for longer.\n\nEach level of 'Persistence' increases the duration of 'Electroshock' effects.
tl-slowdown-multiplier-technology=Specific energy levels combined with high frequencies can cause muscle spasms that seriously hinder movement.\n\nEach level of 'Stun' increases the strength of 'Electroshock' and slows movement further.
tl-slowdown-probability-technology=Direct contact with electric currents can cause physiological and neurological side effects such as muscle spasms and paralysis.\n\nHigher levels of 'Electroshock' make those side effects more likely to manifest with each attack.

tl-volatility-modulation-technology=Ionization is a common technique for increasing the effectiveness of electric-current-based military systems. When the twin coils are ionized using alternating frequencies, a synergistic pattern emerges in the energy profile. This effect, called bionization, greatly expands the volatility envelope of the affected current.\n\nEach level of 'Bionization' lowers the potential minimum damage while greatly increasing the potential maximum damage.
tl-volatility-probability-technology=The volatile nature of the twin-coil current is maximized with an integrated amplitude adjuster. In practice, the generated lightning bolts gain enough energy to completely disintegrate all creatures smaller than a medium-sized apartment.\n\nEach level of 'Vaporization' increases the chance of instantly killing the target. Targets with more than 5000 health are seriously injured instead of killed.

ei-waveform-harmonics-1=Tunes the first shared discharge profile between Legacy coils and the bridged tesla family. The primary TL look remains legacy for now, but the line starts speaking one electrical dialect: better impact feedback, cleaner bridge semantics, and the first direct crossover into teslagun, tesla ammo, and the Replica Fulgoran coil.
ei-waveform-harmonics-2=Extends that shared waveform into modern chained follow-up families. Basic coils gain harmonized field-arc propagation, advanced coils begin using modernized aftershock families, and the bridged tesla family can now throw proper chained bursts instead of living entirely outside the Legacy ladder.
ei-waveform-harmonics-3=Finishes the harmonics spine. Follow-up arcs adopt full Space Age chain language, the bridged turret receives the heavier late turret-side chain payoff, and the Legacy branch is finally ready for true doctrine specialization instead of only raw stat ladders.
ei-storm-lattice-1=The basic coil stops being "just the first tesla tower" and becomes a real control doctrine. Storm lattice I improves target handoff and broadens the propagated arc web so swarms stay trapped in the field instead of leaking through the edges.
ei-storm-lattice-2=The lattice is no longer a lucky scatter of arcs. Storm lattice II holds the branching network together under heavier pressure and lets the basic coil keep passing charge across a wider, denser enemy front.
ei-storm-lattice-3=This is the end state of the basic-coil control lane. Storm lattice III pushes the branching field-arc tower into late-game crowd suppression: more jumps, longer reach, and a more deliberate "storm curtain" identity that still remains lighter and broader than the advanced coil.
ei-dielectric-rupture-1=Advanced coils are not meant to suppress a whole front. They are meant to kill, then let the remaining charge hunt for the next victim. Dielectric rupture I sharpens that doctrine by preserving more useful energy in the first aftershock.
ei-dielectric-rupture-2=Dielectric rupture II keeps the aftershock chain alive for longer and makes the discharge more willing to ignite what it touches. The advanced coil remains the execution pylon, not a copy of the basic tower, but it now carries its violence farther down the line.
ei-dielectric-rupture-3=The late advanced coil becomes a true kill-chain weapon. Dielectric rupture III pushes heavier reach, stronger retained arcs, and a harsher combustion profile so each confirmed kill can unravel a tightly packed attack wave.
ei-bridge-coupling-1=The bridge into the vanilla tesla family is deliberately restrained. Bridge coupling I raises late damage and control inheritance for teslagun, tesla ammo, and the Replica Fulgoran coil without simply turning them into disguised TL towers.
ei-bridge-coupling-2=The bridge line ends with turret favoritism on purpose. Bridge coupling II lets the Replica Fulgoran coil inherit the denser late aftershock language while handheld tesla gear stays lighter and more portable.
ei-reactance-overdrive-1=Twin advanced coils mounted to a tank hull were never going to stay polite. Reactance overdrive I widens the volatility envelope and increases the number of saturation arcs the tank can sustain without changing it into another fixed tower.
ei-reactance-overdrive-2=Fusion-era coil handling lets the tesla tank ride longer overdraw windows. Reactance overdrive II leans further into stormfront behavior: stronger modulation swings, more spill, and more pressure at the edge of the blast lane.
ei-reactance-overdrive-3=This is the tank's final specialized state. Reactance overdrive III keeps the vehicle mechanically distinct from the towers, but makes it feel like a mobile electrical front rather than a gun platform with decorative lightning.
ei-exotic-waveform-convergence=At the end of the doctrine, the Legacy towers stop borrowing modern chain language and finally earn modern primary beams of their own. The basic coil becomes a branching field-arc tower and gains a guaranteed side-branch burst on clean hits. The advanced coil becomes a focused overcharge-lance pylon and turns each kill confirmation into a guaranteed exotic execution storm layered on top of its normal aftershock logic. The tesla tank joins only partially: its impacts gain adjacent discharge modernization, and positive volatility spikes can kick off a stormfront burst without flattening the vehicle into another tower. The Replica Fulgoran coil also receives a turret-only exotic aftershock bloom on confirmed kills, while handheld bridge gear does not.

[exotic-industries-informatron]
menu_teslas_legacy=Tesla's Legacy
title_teslas_legacy=Tesla's Legacy

teslas-legacy=Tesla's Legacy arsenals
teslas-legacy-text=What once stood apart as Tesla's Legacy has been bound into Remembrance's electric arsenal. The [item=tl-basic-tesla-coil]basic tesla coil, [item=tl-advanced-tesla-coil]advanced tesla coil, and [item=tl-tesla-tank]tesla tank keep their public names, TL silhouettes, and industrial identity, but the branch is no longer a foreign ladder hung off the side. It now marches as one doctrine: first the rough field tower, then the heavier execution pylon, then the armored stormfront.\n\nThe line also reaches into the vanilla tesla family. [item=teslagun]Teslagun, [item=tesla-ammo]tesla ammo, and the [item=tesla-turret]Replica Fulgoran coil inherit the same harmonic spine without being crushed into disguised TL towers.
teslas-legacy-2=Behavior mode
teslas-legacy-text-2=Current startup behavior mode: [font=default-bold]__1__[/font]\n\n[font=default-bold]Legacy fidelity[/font] is the default path. It keeps the original Legacy machine intact: the old recursion, persistent support discharges, kill-born aftershocks, combustion side effects, and the Tesla tank's volatility flow all remain in command. [font=default-bold]Hybrid[/font] is the lighter path. It routes the same doctrine through a leaner lattice, then lets later harmonics and doctrine research add richer follow-up discharges on top.\n\nThe doctrine ladder is shared, but the order of force changes. In Hybrid, the newer lattice leads. In Legacy fidelity, the original TL behavior strikes first and the modern additions follow after it.
teslas-legacy-3=Waveform harmonics
teslas-legacy-text-3=Waveform harmonics is now the shared spine of modernization. Before it, the Legacy coils keep their original TL beam language. At Harmonics I, they begin speaking the same electrical dialect as the bridged tesla family. At Harmonics II, the basic and advanced coils move into modern follow-up arc families. At Harmonics III, those arcs take on a full chained language, and the bridged turret finally receives the dense aftershock profile it was missing.\n\nThat is where the old mismatch ends. Legacy towers, the Replica Fulgoran coil, and the portable tesla branch now share a real line of overlap instead of behaving like unrelated machines.
teslas-legacy-4=Quantum specialization
teslas-legacy-text-4=After harmonics, the doctrine splits cleanly. [font=default-bold]Storm lattice[/font] belongs to the [item=tl-basic-tesla-coil]basic coil and turns it into a swarm-control tower: wider propagation, cleaner target handoff, and steadier suppression. [font=default-bold]Dielectric rupture[/font] belongs to the [item=tl-advanced-tesla-coil]advanced coil and sharpens kill-confirm aftershocks, retained charge, and combustion inheritance.\n\n[font=default-bold]Bridge coupling[/font] is the late specialization of the bridged branch. It strengthens the vanilla tesla family without dissolving its identity into TL tower doctrine. The Replica Fulgoran coil receives the heaviest turret-side reward, while handheld tesla gear stays lighter.
teslas-legacy-5=Fusion overdrive
teslas-legacy-text-5=The [item=tl-tesla-tank]tesla tank does not share the towers' specializations directly. Its late doctrine is [font=default-bold]reactance overdrive[/font], a fusion-era tank path built around twin-coil saturation, broader volatility windows, and heavier spill across the blast lane. The vehicle remains mechanically distinct from the towers: less a fixed pylon, more a stormfront on tracks.\n\nIt also remains the volatility specialist of the whole line. Critical peaks, modulation swings, and vaporization belong to the tank in a way the towers do not imitate.
teslas-legacy-6=Exotic convergence
teslas-legacy-text-6=The final doctrine step is [font=default-bold]exotic waveform convergence[/font]. It does not replace the TL towers with copies from another age. The [item=tl-basic-tesla-coil]basic coil keeps its improvised body and becomes a modern [font=default-bold]branching field-arc tower[/font] that releases a guaranteed side burst on every clean primary hit. The [item=tl-advanced-tesla-coil]advanced coil keeps its high pylon frame and becomes a focused [font=default-bold]overcharge lance[/font], with each confirmed kill releasing a guaranteed exotic execution storm. Their primary beams are modernized at last, but their battlefield roles remain separate.\n\nIn [font=default-bold]Legacy fidelity[/font], these capstone effects layer over the original TL substrate. In [font=default-bold]Hybrid[/font], they crown the lighter doctrine lattice. The [item=tl-tesla-tank]tesla tank joins only in part: volatility spikes and vaporization can trigger a stormfront burst, but the vehicle remains the armored storm-member of the family rather than collapsing into another tower. The [item=tesla-turret]Replica Fulgoran coil also gains its own turret-only exotic aftershock bloom on confirmed kills, while [item=teslagun]teslagun and [item=tesla-ammo]tesla ammo remain on the lighter bridge path.
teslas-legacy-7=Combat readouts and default floating text
teslas-legacy-text-7=Combat readouts remain intentionally selective. [font=default-bold]Critical hit[/font] and [font=default-bold]vaporization[/font] text are enabled by default so exceptional moments still cut through the noise. Routine [font=default-bold]damage[/font] text is disabled by default so every skirmish does not dissolve into electrical confetti.\n\nThat balance matters even more now that the doctrine carries more moving parts: propagation jumps, aftershock chains, bridge coupling, tank volatility, and final beam modernization. The default setup keeps the dramatic moments visible without drowning the battlefield in noise.
