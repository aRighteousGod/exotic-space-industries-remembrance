menu_auric_fumarole=Auric precipitation fumaroles
title_auric_fumarole=Auric precipitation fumaroles
auric-fumarole=Auric precipitation fumarole
auric-fumarole-text=Vulcanus remembers where the wound may reopen; the rules below are literal, not symbolic.\n\n[font=default-bold]Where they can appear:[/font] Auric fumaroles are Vulcanus-only. They can spawn only on volcanic non-lava ground. Chunks within 3 chunks of the surface origin have zero chance. Past that dead zone, chance ramps smoothly and reaches full weight by 32 chunks from origin.\n\n[font=default-bold]First appearance:[/font] Fresh generated outer chunks only make a light immediate seed attempt, scaled by distance, instead of dropping a full field at once. If that light seed fails, the chunk enters the dormant registry instead of being forgotten. Rescan and old-save backfill rebuild dormant eligibility for generated Vulcanus chunks; they do not force another immediate spawn wave.\n\n[font=default-bold]Yield and life:[/font] Each fumarole spawns with 4000-8000 yield. If nobody taps it, it self-seals after a deterministic 35-65 minute window. Once tapped, it stays until depleted. Closed or depleted sites cool down for about 60 minutes plus a small deterministic jitter, then can return through the dormant system.
auric-fumarole-2=Spawn discipline and rescan
auric-fumarole-text-2=[font=default-bold]Dormant schedule:[/font] Every 30 seconds the script rechecks up to 6 dormant chunks globally. Ordinary dormant chunks still roll the 0.25% base eruption chance, then apply distance weighting, sulfuric modulation, local suppression, and a generated-area band fill modifier.\n\n[font=default-bold]Band regulation:[/font] Generated eligible Vulcanus chunks are tracked in distance bands: 3-6, 6-16, 16-24, 24-32, and 32+ chunks from origin. Underfilled bands receive stronger dormant recovery pressure, overfull bands cool off, and recovery attempts aim at the weakest bands first so one explored region does not monopolize future vents.\n\n[font=default-bold]Local suppression and fallback:[/font] Nearby active auric fumaroles within 6 chunks reduce dormant chance by proximity instead of shutting it off at a hard count. Close vents suppress more strongly than outer-ring vents, and multiple nearby vents stack their pressure. If Vulcanus stays below 2 active auric fumaroles for 5 minutes, the old keepalive path still forces up to 2 catastrophe-recovery attempts per pulse.\n\n[font=default-bold]Placement and rescan:[/font] A fumarole does not have to land at the exact chunk center; placement can vary inside the chunk and tries up to 24 candidate positions. Auric fumaroles keep 64 tiles away from other auric fumaroles. Sulfuric-acid geysers only block very close overlap, roughly the nearest 16 tiles; they are not a blanket 32-tile exclusion zone. The /ei-auric-fumarole-rescan command works on Vulcanus only and rebuilds pending dormant eligibility from generated Vulcanus chunks instead of creating another immediate flood.


