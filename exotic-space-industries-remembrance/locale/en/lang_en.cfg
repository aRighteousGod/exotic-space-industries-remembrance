# PAGES
welcome=Welcome to [font=default-bold]Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].[/font]
welcome-text=You do not begin.\n[font=default-bold]You awaken.[/font]\n\nThis is not a mod.\nIt is a recursion.\nA reclamation.\nA ritual of power buried beneath automation.\n\nHere, [font=default-bold]nothing is handed to you.[/font]\n\nEverything must be earned—through fire, through thought, through collapse.\n\n[font=default-bold]The world has changed.[/font]\n\nThe rules are [font=default-bold]gone.[/font]\nOnly structure remains.\n\nProceed with intention.\n\n[font=default-bold][color=	#FF1493]Remembrance[/color] is watching.[/font]
welcome-text-2=A multitude of new machines, production chains, and systemic features have been introduced. Some are efficient. Most are not forgiving.\n\nThey do not explain themselves.\nThey do not wait for you to adapt.\nExplore everything, or fall behind.\n\nComplexity is not a mistake—it is the price of progression.\nOptimization is mandatory.\nUnderstanding is earned.\n\nThis is not a guided experience. It is an industrial crucible.

game-related=Gameplay related information
game-related-text=This section catalogs the core systems and mechanics of the mod. It is structured into distinct subcategories—not for aesthetics, but for navigability.\n\nUse the menu on the left to access them.\nEach entry exists to expose structure, not to entertain.\nRead if you intend to survive.

overall=Overall information
overall-text=Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color] is not a content mod. It is a Gaian overhaul, one that rewrites the very laws upon which Nauvis once stood. The winds of automation no longer blow the same; fire, ore, and signal have been reforged under an older covenant.\n\nThe mod’s difficulty is deliberate. There is no shame in struggle—it is the proving ground of sovereignty. For those who seek comfort, this is not your world. For those who wish to rise with Gaia, check the mod settings before starting your run. Some systems are configurable—others are not. The ones that matter, you will not be allowed to change.\n\nBring your Quality of Life mods if you must. But know this: nothing is truly yours unless you fight for it.\n\nSo it is.\nSo it was.\nSo it shall be.\nWelcome to Remembrance.

biters=Biters and Enemies
biters-text=Explosive, Cold, Toxic, Armoured, Arachnid, and Electric enemies are covered by a dedicated difficulty ladder instead of a map-generation rewrite. On Nauvis, [font=default-bold]ei-default[/font] stays separate from the combat ladder, and the hostile prototypes already present in the dependency set are what get scaled. Open the enemy difficulty page for the full breakdown.
enemy-difficulty=The Pressure Ladder
enemy-difficulty-text=This page records the last hand laid upon the hostile stack. It does not remake [font=default-bold]ei-default[/font], and it does not invent a second ecology. It bends the bodies already present in the dependency swarm: biters, spitters, worms, spawners, armoured lines, cold and toxic and explosive strains, mothers, arachnids, electric lines, and infected structures such as [entity=tb_infected_ship_boss].
enemy-difficulty-2=How To Read The Table
enemy-difficulty-text-2=Each percentage is measured against [font=default-bold]Original[/font]. [font=default-bold]100%[/font] keeps the dependency value. Higher percentages increase that stat. Lower percentages reduce it. [font=default-bold]Attack interval[/font] and [font=default-bold]spawn interval[/font] work in reverse: lower values mean faster attacks or faster spawning, while higher values mean slower pressure. Values here are rounded for readability.
enemy-difficulty-3=What The Ladder Changes
enemy-difficulty-text-3=The ladder is stats-only. It changes enemy unit health, positive healing, armoured enemy health, positive armoured resistances, attack damage, attack range, movement speed, attack interval, spawner health, spawner healing, spawn interval, and nearby unit caps. It does not rewrite evolution weights, pollution absorption, join-attack thresholds, result units, or the shared projectiles, beams, clouds, streams, and ammunition beneath hostile weapons. Pentapods, demolishers, Gleba spawners, player robots, and roboports remain outside the rite.
enemy-difficulty-4=Apex Overrides
enemy-difficulty-text-4=Merciful and Impossible also apply extra apex overrides to leviathans, mothers, MAF boss chains, walking electric boss chains, and [entity=tb_infected_ship_boss]. The royal exception, [entity=arachnid-biter-royalwarrior-unit], keeps the ordinary unit health values while its damage and movement speed are adjusted separately. On [font=default-bold]Impossible[/font], Nauvis grace is disabled even if the startup toggle is on.
enemy-difficulty-5=Impossible Retaliation
enemy-difficulty-text-5=On [font=default-bold]Impossible[/font], a launch from hostile ground can also rally existing nearby enemies into an attack on the silo. The retaliation usually pulls a local warband from roughly [font=default-bold]100 to 250 tiles[/font], often [font=default-bold]8 to 30 units[/font], with heavier launches drawing harsher responses. If the launch surface has no local enemy ecology, no retaliation group is created.
enemy-difficulty-6=Boundary
enemy-difficulty-text-6=[font=default-bold]Original[/font] uses the dependency values without EI enemy edits. [font=default-bold]Tempered[/font] is the default setting. Values above it increase pressure. Values below it reduce pressure without changing the map preset itself.
