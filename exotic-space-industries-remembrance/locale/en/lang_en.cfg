space-destinations=Space destinations
space-destinations-text=The [color=orange]rocket silo[/color] [item=rocket-silo] can be used to send its cargo to different destinations. When it first gets unlocked in the computer age you will only be able to send satellites into [color=green]nauvis orbit[/color]. Depending on the type of sent satellite or rocket cargo you can then receive data or other useful launch products.

space-destinations-2=Different destinations
space-destinations-2-text=As you progress, various destinations in and away from your native solar system will become available. Depending on the distance to the selected destination you will need more or less rocket fuel. Additionally some destinations need to be uncovered first, either by sending a specialised [color=orange]exploration satellite[/color] [item=ei-exploration-satellite] or by chance when sending a rocket with normal cargo. Some new destinations might be located in deep space, [color=purple]out of the solar system[/color]. Note that even when sending exploration satellites uncovering new destinations always depends on chance.  

induction-matrix=Induction matrix
induction-matrix-text=The [color=orange]induction matrix[/color] is a compound machine that can be used to store large amounts of energy. It can be used to store overhead power just like normal accumulators and then release it later on. Different tiers of matrix size can be unlocked by researching the corresponding technologies.

induction-matrix-2=Induction matrix components
induction-matrix-2-text=The Induction Matrix is a modular energy storage structure composed of interlinked components, each with a defined role in the containment and transfer of high-voltage energy.\n\nThe [color=orange]Induction Matrix Core[/color] [item=ei-induction-matrix-core] serves as the central controller of the system. Without it, the matrix is inert. When connected to the circuit network, the core outputs current charge on signal-C, total capacity on signal-T, and max IO on signal-M. These signals are only produced while the core is actually wired, and they refresh no more than once per second.\n\n[color=orange]Induction Coils[/color] [item=ei-induction-matrix-basic-coil] [item=ei-induction-matrix-advanced-coil] [item=ei-induction-matrix-superior-coil] These [font=default-bold]store energy internally[/font] and can be upgraded across three tiers. Coils gain an efficiency bonus when placed adjacent to a [color=orange]Matrix Solenoid[/color] [item=ei-induction-matrix-basic-solenoid].\n\n[color=orange]Matrix Solenoids[/color] enhance coil efficiency when arranged in sequence. Placing multiple solenoids in series [font=default-bold]increases effectivity[/font], but overbuilding will result in diminishing returns and wasted structure.\n\n[color=orange]Converters[/color] [item=ei-induction-matrix-basic-converter] [item=ei-induction-matrix-advanced-converter] [item=ei-induction-matrix-superior-converter] These components regulate power flow into and out of the matrix, scaling the throughput based on tier.

exotic-stabilizers=Exotic matter machines
exotic-stabilizers-text=Exotic Matter is not a resource - it is a threat made useful. Processing it requires containment, precision, and machinery engineered to survive its volatility.\n\nThe [color=orange]Exotic Matter Assembler[/color] [item=ei-exotic-assembler] is the only structure capable of handling its energy signature. Even then, instability is inevitable - the assembler may detonate under stress. When the lattice is holding, the machine hums with a visible containment pulse; when it begins to lose the argument, that pulse hardens into crackle, arcing discharge, and warnings heavy enough to feel.\n\nTo reduce this risk, place [color=orange]Exotic Matter Stabilizers[/color] [item=ei-matter-stabilizer] around the assembler. These devices suppress critical failure events and stabilize the surrounding energy field. Some may even be found scattered throughout the world - relics of a previous cycle.\n[color=gray]Quality Matter stabilizers count as 3 x (Quality - 1) stabilizers each.\nQuality Exotic assemblers per second chance of entropic cascade is reduced by (Quality - 1)%, meaning Uncommon reduces the base chance of 12% to 11%.[/color]\n\nDo not treat exotic matter as just another ingredient.\n\nIt is [font=default-bold]alive, volatile, and watching.[/font]
black-hole=Black hole generator
black-hole-text=The [color=orange]Black Hole Generator[/color] is the final machine—a gravitational singularity harnessed into industrial function. It consumes matter. It defies entropy. It ends the game.\n\nReaching a [color=green]fully operational[/color] state with this device signifies total system mastery. This is your victory condition. Not through conquest, but through control of the fabric beneath physics.\n\nTo bring the Black Hole Generator online, you will require:\nMassive quantities of refined building materials\nA continuous feed of consumable matter\nAn immense and stable power infrastructure\n\nYou are strongly advised to construct a hardened [color=orange]Fusion Reactor[/color] grid and supplement it with tiered [color=orange]Induction Matrices[/color] capable of absorbing and releasing power at industrial-scale throughput.\n\nThis is not a generator. [font=default-bold]It is an ending woven from collapse.[/font]\n\nBuild wisely. [font=default-bold]Feed it relentlessly.[/font] There are no second chances.

black-hole-2=Reactor components
black-hole-2-text=The Black Hole Generator is not a single structure, but a modular singularity containment array, composed of several high-stress components—each critical to stability, energy flow, and eventual endgame activation.\n\nThe central structure is the [color=orange]Black Hole Generator[/color] [item=ei-black-hole].\n\nOnce activated, it consumes any item placed into its inventory, regardless of type.\n\nEach item contributes equally to the generator’s internal [color=green]mass count[/color], which continuously decays over time. Constant input is required to sustain mass levels.\n\nItem type is irrelevant.\nIron plates, exotic processors, or raw fish—all are devoured, all become mass.\n\n[color=orange]Energy Injector Pylons[/color] [item=ei-energy-injector-pylon] maintain the containment field as the singularity grows.\nEach pylon draws 5 GW of continuous power.\n\nInjectors are not required during startup—[font=default-bold]the vessel can contain the newborn black hole[/font]—but become essential as mass accumulates.\n\n[color=orange]Energy Extractor Pylons[/color] [item=ei-energy-extractor-pylon] allow for power extraction once the generator reaches its [color=green]fully operational[/color] state.\nEach extractor can draw up to 100 GW of raw power from the stabilized singularity.\n\nExtraction is not possible until the final stage of the generator has been reached.\n\n[font=default-bold]This is not a machine. It is a ritual of collapse.[/font]\nYou are feeding mass into a [font=default-bold]bound anomaly.[/font]\nIf you do not contain it, it will fail.\nIf you do not feed it, it will die.\n\nIf you do both—[font=default-bold]it will power the end of all things.[/font]\n\nThere is no automation without [font=default-bold]annihilation.[/font]

black-hole-3=Black hole stages
black-hole-3-text=Bringing the Black Hole Generator online is a staged, high-risk process. Each phase escalates the energy, mass, and structural requirements. There is no skipping steps. Only forward, or failure.\n\n🜏 Startup Phase\n\nNo pylons are needed.\n\nThe generator must consume enough material to reach an initial [color=blue]10×10³kg[/color] mass count.\n\nItem type does not matter—only volume.\n\nOnce mass reaches 100% stage progress, the generator stabilizes into the Containment Phase.\n\n🜏 Containment Phase\n\nNow, [color=blue]8 active Energy Injector Pylons[/color] [item=ei-energy-injector-pylon] must remain online.\n\nEach draws 5 GW, for a total power demand of 40 GW.\n\nPressing the Expansion Button initiates a controlled growth of the singularity radius.\n\nThis state must be maintained continuously for [color=blue]60 seconds.[/color]\n\nAny interruption—power failure, pylon loss—resets the timer.\n\n🜏 Fully Operational Phase\n\nThe generator achieves stability. The singularity is now large enough to support external energy extraction.\n\n[color=orange]Energy Extractor Pylons[/color] [item=ei-energy-extractor-pylon] placed within range can draw up to 100 GW per pylon, directly feeding your energy grid.\n\nAt this stage, the system becomes largely self-sufficient, requiring only a constant mass input to offset decay.\n\nYou are not fueling a reactor.\nYou are managing the [font=default-bold]hunger of a bound singularity.[/font]\nMass becomes power. Power becomes control. [font=default-bold]Control becomes final.[/font]\n\nThere is no off switch. Only containment.
nuclear-fission-and-fusion=Nuclear fission and fusion
nuclear-fission-and-fusion-text=Exotic Industries expands the nuclear power layer with new mechanics, materials, and systems of control.\n\nThese features are divided into multiple subcategories—each representing a specific aspect of nuclear infrastructure, fuel dynamics, or containment logic.\nYou can access them through the menu on the left.\n\n[font=default-bold]This is not just fission.[/font]\nThis is escalation by heat, pressure, and irreversible reaction.\n[font=default-bold]Study the systems before you ignite them.[/font]

fission-reactors=Nuclear fission changes
fission-reactors-text=Nuclear fission in Exotic Industries has been rebalanced and hardened into a more demanding, more rewarding system.\n\nThe standard [color=orange]Nuclear Reactor[/color] [item=nuclear-reactor] no longer benefits from the vanilla neighbor bonus.\n\nInstead, it delivers [font=default-bold]increased raw output per reactor[/font]—power through density, not adjacency.\n\n[font=default-bold]Uranium is more scarce.[/font] Extraction is slower, and yield is lower. Efficient nuclear infrastructure must account for long-term fuel pressure.\n\nBurnt fuel cells are no longer waste.\n\nA closed-loop recycling system allows for the recovery of fissile byproducts, which can be refined into secondary fuel cells with improved efficiency.\n\nHowever, all processes generate [color=brown]Nuclear Waste[/color] [item=ei-nuclear-waste], a persistent byproduct that must be safely contained, processed, or isolated.\n\nIt cannot be ignored.\n\nNeglect becomes contamination.\n\nNuclear power is no longer a shortcut to infinite energy.\n\nIt is a high-stakes economy of [font=default-bold]heat, decay, and reclamation.[/font]\n\nUse it well—or [font=default-bold]drown in the cost.[/font]

fission-reactors-2=High temperature fission
fission-reactors-2-text=The [color=orange]High Temperature Nuclear Reactor[/color] [item=ei-high-temperature-reactor] is an advanced fission system designed for maximum thermal output. It surpasses standard nuclear infrastructure in both efficiency and scale—[font=default-bold]but only when properly maintained.[/font]\n\nOnce brought up to its critical operating temperature and supplied with:\n\nA steady flow of [font=default-bold]liquid lead coolant[/font], and\n\nAt least one viable fuel rod,\n\n…it will [font=default-bold]superheat[/font] the molten liquid lead coolant, exceeding the throughput of conventional heat exchangers and requiring a custom built unit.\n\nUnlike traditional reactors, it can also utilize the otherwise non-fissile [color=brown]Thorium[/color] [item=ei-thorium-232-fuel] fuel—transforming a waste product into an energy source through sheer intensity of design.\n\nThis is not a beginner’s reactor.\n\nIt does not tolerate gaps in supply.\n\nIt does not scale down.\n\nIt is a pressure engine for post-human industry—[font=default-bold]brutal, efficient, and unforgiving.[/font]



ages-and-tech-2=The six ages
ages-and-tech-text-2=The mod is divided into six ages, each a deeper descent into recursion, machinery, and control. These are not eras of progress. They are thresholds of subjugation—each more violent and unforgiving than the last.\n\n[font=default-bold]The Dark Age[/font]\nA stunted birth. Ash, rot, and silence. You crawl through primitive steam and broken stone. Nothing is automated. Everything costs blood.\n\n[font=default-bold]The Age of Steam[/font]\nOil is discovered—not as a resource, but as a weapon. Burn it to move. Burn it to live. The land begins to scream.\n\n[font=default-bold]The Age of Electricity[/font]\nCircuits crackle. Machines awaken. Bots appear—not as helpers, but as extensions of will. Nuclear fire becomes lawful. The flesh falls behind.\n\n[font=default-bold]The Computer Age[/font]\nThought is formalized. Modules, beacons, signals—the mind is fragmented across machines. Optimization becomes a necessity. Redundancy is death.\n\n[font=default-bold]The Quantum Age[/font]\nReality bends. Machines obey logic not of this world. Boundaries dissolve. The forge becomes intelligent—and it does not forgive misuse.\n\n[font=default-bold]The Exotic Age[/font]\nEverything breaks. The veil is gone. You either command the anomaly or are devoured by it. Victory is not guaranteed. It is extracted from the bones of failed timelines.\n\nEach age is a ratchet with no reverse.\n\n[font=default-bold]There is no innocence.[/font]\n\nOnly power—brutal, recursive, and absolute.
nauvis-pressure-grace=Nauvis evolution pressure grace
nauvis-pressure-grace-text=This startup toggle gives Nauvis a temporary evolution brake. Every 18,000 ticks, or 5 minutes, the script checks the enemy force's evolution on Nauvis and lowers it only if the current value sits above the active grace target.\n\nIt does not clean map pollution, delete nests, or cancel attacks. The Extended profile can temporarily lower the pollution evolution factor during the early Electricity taper, then restores the original value when the grace ends.
nauvis-pressure-grace-2=Age caps
nauvis-pressure-grace-text-2=Before [font=default-bold]Steam Age[/font], the target ceiling is [font=default-bold]0.25[/font]. After Steam Age research but before [font=default-bold]Age of Electricity[/font], the target is [font=default-bold]0.45[/font].\n\nClassic turns off at Electricity Age. Extended stays active until [font=default-bold]Computer Age[/font]: [font=default-bold]0.50[/font] before [font=default-bold]Electricity power[/font], [font=default-bold]0.55[/font] before an electric defense technology, and [font=default-bold]0.60[/font] until Computer Age.
rocket-launch-pollution=Rocket launch pollution
rocket-launch-pollution-text=Rocket launches can dump pollution directly onto the launch surface. The system samples the launching force's evolution factor on that surface, feeds it through the selected startup curve, and scales the result against the configured ceiling.\n\nBy default the ceiling is [font=default-bold]10,000 pollution[/font] at evolution [font=default-bold]1.0[/font]. Most curve modes also keep a [font=default-bold]10% floor[/font], so low-evolution launches are still felt.
rocket-launch-pollution-2=Curve modes and smoke
rocket-launch-pollution-text-2=The startup [font=default-bold]curve form[/font] can be set to linear, quadratic, exponential, threshold, or hybrid. Linear tracks evolution directly. Quadratic and exponential push more punishment into later launches. Threshold jumps across fixed evolution bands. Hybrid uses a linear base and adds an extra late-game spike.\n\nThe launch visual style controls how the sky records the debt: Hybrid starts with a short pad-exhaust bloom that tapers out as the rising plume begins, Ascending plume only keeps the vertical smoke, Cinematic runs full pad exhaust until the plume takes over, and Pad exhaust only keeps the ground smoke without the vertical plume.
rocket-ammo-schema=Rocket ordnance schema
rocket-ammo-schema-text=Rocket ordnance is built in layers: [item=ei-rocket-airframe]airframe, [item=ei-rocket-motor-basic]motor, [item=ei-rocket-warhead-impact]warhead, then the final round. The airframe keeps the shell intact, the motor sets the reach, and the warhead decides the damage family. The artillery branch follows the same logic, only heavier and less forgiving.
rocket-ammo-schema-2=Payload branches
rocket-ammo-schema-text-2=The baseline families now hit hard enough to justify their cost. Impact and explosive rounds both strike heavier. Corrosive payloads share one chemistry package between the handheld launcher and the artillery line: a brutal acid hit first, then a lingering corrosive cloud that keeps eating structure. Cryo payloads keep the same control duration across both branches, but they land with more weight. The atomic line is now split cleanly: U-235 resolves into ESIR's own [item=ei-atomic-bomb-u235] and carries the tighter fallout package, while plutonium remains the plutonium atomic rocket, keeps the vanilla atomic explosion, and throws broader radiological contamination behind the breach.
rocket-ammo-schema-3=FX families
rocket-ammo-schema-text-3=Each family now keeps its own explosion, smoke, and sticker set so the blast reads clearly in motion instead of collapsing into one generic white flash.
rocket-ammo-schema-4=Artillery atomic line
rocket-ammo-schema-text-4=The fixed-arc artillery launcher can now also load U-235 and plutonium atomic rockets as loose rounds or full crates. Crated salvos are essentially sacrificial use: fissile production and unlock routing stay split, U-235 uses the tighter ESIR-centered detonation and the cleaner fallout footprint, plutonium keeps the vanilla atomic explosion but throws wider radiological contamination, and a launch fired too close can still tear open the firing position along with the target.
turrets=Defensive emplacements
turrets-text=Remembrance greatly broadens static defense. The roster now runs from improvised close-range guns to steam artillery, corrosive stream weapons, electricity-driven bullet hoses, and relic-grade energy platforms. These emplacements are not simple sidegrades to the [item=gun-turret]gun turret: each one asks for different logistics, different kill zones, and different upgrade support.\n\nMost ballistic additions still scale with physical projectile damage research. Stream turrets grow with the flame-damage line. The late relic platforms instead ask for extreme power, rare components, and careful spacing.
turrets-2=Shotguns and cannons
turrets-text-2=[item=ei-shotgun-turret]Shotgun turret arrives in the Dark Age after gun turrets and Military. It is a close-range wall-breaker answer: 15 range, slow fire, no fancy power demands, and brutal punishment for anything that actually reaches your perimeter. In the Electricity Age it upgrades into the [item=ei-auto-shotgun-turret]combat shotgun turret, which doubles the firing cadence, reaches 18, turns far faster, and adds electric drain plus per-shot power use to keep a constant buckshot curtain over choke points.\n\nThe [item=ei-cannon-turret-mk1]cannon turret is the Steam Age siege step. It fires [item=cannon-shell]cannon shells to 25 range with an 8-tile dead zone, slow traverse, and heavy single-shot impact. Later, two MK1s and heavier components become the [item=ei-cannon-turret]twin-bore cannon turret: tougher, faster firing, electrically assisted, and working at 30 range with a 10-tile dead zone so heavy targets can be deleted before they reach the wall.
turrets-3=Acid and flame
turrets-text-3=[item=ei-acidthrower-turret]Acidthrower is the corrosive cousin of the flamethrower turret. It reaches 38 with a 9-tile minimum range and accepts [fluid=sulfuric-acid]sulfuric acid, [fluid=ei-nitric-acid]nitric acid, [fluid=ei-hydrofluoric-acid]hydrofluoric acid, and even weak [fluid=ei-acidic-water]acidic water, each with its own damage modifier. It is the stream-turret answer for factories that would rather weaponize chemistry than burn oil.\n\nVanilla [item=flamethrower-turret]flamethrowers are also reworked. EI moves them into the Steam Age, extends them to the same 38/9 engagement band, makes them prepare earlier, and raises their fluid appetite dramatically. Fuel quality now matters: crude oil still works, but heavy oil, light oil, petroleum gas, and [fluid=ei-kerosene]kerosene all hit progressively harder, while rough distillates are weaker emergency feedstocks.
turrets-4=Miniguns and lasers
turrets-text-4=[item=ei-gatling-turret]Minigun turret is the electricity-age bullet hose. It combines a mounted [item=ei-minigun]minigun with electric drive systems, giving 32 range, a 4-tile minimum range, excellent retargeting, and a ferocious sustained rate of fire. The price is exactly what it looks like: endless [item=firearm-magazine]magazine consumption plus constant power support.\n\nVanilla [item=laser-turret]laser turrets remain available, but EI retunes them into a more deliberate electricity-age investment. Their range and beam length are pushed to 30, their tech explicitly wants [item=battery]batteries and [item=advanced-circuit]advanced circuits, and their recipe is rebuilt around [item=ei-steel-beam]steel beams, [item=steel-plate]steel plate, [item=battery]batteries, [item=advanced-circuit]advanced circuits, and [item=ei-energy-crystal]energy crystals. They become a cleaner logistics turret, but no longer a cheap universal answer.
turrets-5=Relic platforms
turrets-text-5=[item=ei-plasma-turret]Plasma turret is the quantum-age fortress gun. It is physically huge, drains a serious grid, and is built from induction-matrix parts plus multiple [item=laser-turret]laser turrets. In return it throws slow-starting plasma bolts out to 200 range, keeps a 40-tile safety radius around itself, and ends each hit in a massive splash that wrecks formations, fortifications, and terrain alike.\n\n[item=zeus-wrath-zeus-turret]Poseidon Installation sits even higher on the relic ladder through [technology=zeus-wrath-zeus-wrath]. EI rebuilds it into a strategic weapon: 350 range, 70 minimum range, 1 GJ per shot, enormous energy storage, and inner plus outer plasma blast rings. It is not a perimeter turret so much as a fixed answer to targets you have decided should stop existing.

