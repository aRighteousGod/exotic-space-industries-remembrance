[recipe-description]
ei-bio-oil-synthesis=Pentapod eggs are dumped into the jelly alive—then the real horror starts: they feed. The jelly thins as it’s consumed, tugged into the eggs in slow, hungry pulses, until the vat turns into a trembling slurry. As the brood metabolizes, it sweats out a yellow-blue, iridescent oil—a slick byproduct that rises to the surface in shimmering sheets. Skim the Broodslime oil off fast, before the eggs drink it back.
ei-bio-oil-refining=Processing Broodslime oil into medium and heavy distillates.
ei-water-bio-oil-refining=Processing water and Broodslime oil into medium and heavy distillates.
ei-steam-bio-oil-refining=Processing steam and Broodslime oil into into medium, heavy, and lubricant distillates.
ei-plastic-from-bio-oil=Creating plastic bar from petroleum and Broodslime oil
ei-sulfur-from-bio-oil=Creating Sulfur from petroleum and Broodslime oil
ei-carbon-fiber-from-bio-oil=A harsher, higher-yield carbon fiber run: Broodslime oil and nitric acid are driven through yumako mash to strip organics and expose its nanotube scaffold. Carbon is added as seed grit, while bioflux forces the slurry into rapid polymerization—spitting out a thicker, tighter carbon-fiber weave. The process leaves behind acidic water and dirty runoff, with occasional ash precipitating out as the mash burns down under the acid.
ei-breach-residue-neutralization=Neutralize gate residue into dirty water.
ei-lube-destilate-steam-finishing=Steam-finishes lubricant distillate into stable lubricant, venting light coal-gas fractions as a byproduct.
ei-lube-destilation=Hydrothermally degrades lubricant into heavy oil and carbon residue.

