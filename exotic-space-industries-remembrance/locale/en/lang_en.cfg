[mod-setting-description]
ei-fulgora-day-length-variation-max-multiplier=Maximum multiplier for Fulgora day length variation. The day length will be multiplied by a random value between the minimum and maximum multipliers at the start of each day. A higher maximum multiplier will result in a longer possible day length, while a lower maximum multiplier will result in a shorter possible day length.
ei-fulgora-day-length-variation-min-multiplier=Minimum multiplier for Fulgora day length variation. The day length will be multiplied by a random value between the minimum and maximum multipliers at the start of each day. A higher minimum multiplier will result in a longer possible day length, while a lower minimum multiplier will result in a shorter possible day length.
ei-rocket-launch-pollution-cap=Pollution emitted by a rocket launch at 1.0 evolution factor.
ei-rocket-launch-pollution-mode=linear -> predictable, steady increase with evolution\nquadratic -> softer early game, stronger late game ramp\nexponential -> very gentle early, sharp late spike\nthreshold -> staged jumps at evo breakpoints\nhybrid -> linear baseline + extra late-game bonus
ei-check-for-recipe-icons-improvement-mod=Check for [color=red]HIGHLY RECOMMENDED[/color] Recipe Icons Improvement for Exotic Space Industries Remembrance by [color=orange]NaK1119[/color] on load/respawn.\nSorts recipes/items/fluids and modifies these icons to make them easier to see and find.\nFeatures:\nOverhauls groupings and orders of all recipes, items, and fluids.\nModifies various icons of recipes, items, and fluids for better visibility.\nHide recipes, entities, and so on that seem unnecessary to include in the Factoriopedia and/or Signal GUI.\nCan disable each feature from the start-up settings in the game.\nFor the saved game\nYou can apply this mod to and remove it from any save files. However, if you set recipes by item/fluid signals (except recipe signals), their recipes may be changed by applying/removing this mod.\nLIMITATION:\nNOT supporting Krastorio 2 Space Out.
ei-tech-scaling-maxCost=Max [color=red]individual[/color] science pack costs per technology.\n[color=pink]Sunday stroll[/color] — 207\n[color=white]Walk in the park[/color] — 415\n[color=#D2B48C]Almost free[/color] — 831\n[color=gray]Very Cheap[/color] — 1662\n[color=white]Default[/color] — 2500\n[color=cyan]More Cheap[/color] — 3325\n[color=blue]Cheap[/color] — 6750\n[color=yellow]Fairly priced[/color] — 12500\n[color=orange]Less Expensive[/color] — 25000\n[color=red]Expensive[/color] — 50000\n[color=purple]Very Expensive[/color] — 100000\nFactorio ultimately limits the internal scaling multiplier to [color=red]x1000[/color] so the functional ceiling will be implicitly affected by starting technology cost, IE start price of 10 x Maximum internal factorio multiplier of 1000 = 10,000, so to achieve IE Expensive cost of 50,000, the start price needs to be 50.
ei-tech-scaling-curveForm=FORMULA DERIVATION — Technology Cost Scaling\nSetup:\nStart point A = (0, C) → C = start price\nEnd point B = (N, X) → X = max cost\nN = total tech count, n = current tech index\nCost functions:\nLinear: cost(n) = (X − C) / N · n + C\nQuadratic: cost(n) = (X − C) / N² · n² + C\nExponential: cost(n) = exp(n/N · ln(X + 1 − C)) + C − 1\nTechnology price multiplier forms (cost(n) / C):\nLinear: f_lin = (X − C) / (N·C) · n + 1\nQuadratic: f_qua = (X − C) / (N²·C) · n² + 1\nExponential: f_exp = (exp(n/N · ln(X + 1 − C)) − 1) / C + 1\nIntegrated cost (total science packs):\nLinear: Area_lin = N/2 · (X + C)\nQuadratic: Area_qua = N/3 · (X + 2C)\nExponential: Area_exp = N · (C − 1 + (X + 1 − C) / ln(X + 1 − C))\nLarge X approximation:\nArea_exp ≈ N·X / 9\nArea_qua ≈ N·X / 3\nArea_lin ≈ N·X / 2\nRelative difficulty:\nExponential < Quadratic < Linear — exponential ramps gently early, punishes late; linear spikes early, eases late; quadratic is intermediate.\n[color=red]Changing this setting mid-game may have undesirable results.[/color]
ei-tech-scaling-startPrice=Formula derivation variable C, while it can be changed after game start there may be unexpected results.
ei-tech-scaling-additionalMultiplier=Additional final multiplier against curve form.\nCan be safely changed at [color=red]ANY[/color] time.
ei-science-pack-yield-dark=Sets the resulting yield of crafting the [color=red]Dark[/color] age science pack.
ei-science-pack-yield-steam=Sets the resulting yield of crafting the [color=gray]Steam[/color] age science pack.
ei-science-pack-yield-electricity=Sets the resulting yield of crafting the [color=blue]Electricity[/color] age science pack.
ei-science-pack-yield-computer=Sets the resulting yield of crafting the [color=yellow]Computer[/color] age science pack.
ei-science-pack-yield-simulation=Sets the resulting yield of crafting the [color=green]Simulation[/color] age science pack.
ei-science-pack-yield-alien=Sets the resulting yield of crafting the [color=pink]Alien[/color] age science pack.
ei-science-pack-yield-quantum=Sets the resulting yield of crafting the [color=purple]Quantum[/color] age science pack.
ei-science-pack-yield-fusion-quantum=Sets the resulting yield of crafting the [color=cyan]Fusion-Quantum[/color] age science pack.
ei-science-pack-yield-exotic=Sets the resulting yield of crafting the [color=#00912E]Exotic[/color] age science pack.
ei-science-pack-yield-black-hole=Sets the resulting yield of crafting the [color=black]Black-hole exotic[/color] age science pack.
ei-em_updater_que=Draw a visual indicator between or over EM trains & chargers when energy transfer occurs.
ei-em_updater_que_width=Adjust radius of displayed rings.
ei-em_updater_que_transparency=Adjust transparency of displayed rings. Range 1->100 (Opaque).
ei-em_updater_que_timetolive=Adjust duration until a ring disappears.
ei-em_train_glow=Toggle EM train electricity transfer glow effect.
ei-em_train_glow_timetolive=Ticks until train glow fades. Can stack. Increase performance by lowering this number. 60 ticks is 1 second.
ei-em_charger_glow=Toggle EM charger electricity transfer glow effect.
ei-em_charger_glow_timetolive=Ticks until charger glow fades. Can stack. Increase performance by lowering this number. 60 ticks is 1 second.
ei-max_updates_per_tick=Amount of updates per entity type executed on tick.
ei-ticks_per_full_update=Adjust the # of ticks over which all EI entities are updated.
ei-beacon-overload=Intended behavior. Sets a ceiling on the number of beacons that can affect any individual building ala Space Exploration.
ei-barrel-capacity=The capacity is meant to be high because barrels now only stack to 1.
ei-solar-icon-scaling=Scales all 3 tiers of solar panels both in terms of footprint and energy output.\nScaling below 75% will increase [color=cyan]flexibility[/color] with placement.\nScaling above 75% makes it [color=yellow]easier[/color] to achieve a given energy output with the same resource inputs.
ei-nauvis-main-tracks-override=Allows the Remembrance replacement soundtrack to override the Vanilla Nauvis main tracks.
ei-nauvis-interlude-tracks-override=Allows the Remembrance replacement soundtrack to override the Vanilla Nauvis interlude tracks.
ei-nauvis-pressure-grace=Temporarily slows excess enemy evolution on Nauvis before the Age of Electricity. Checks once every 5 minutes and only pulls evolution down toward the early-age targets; it does not reduce pollution, remove nests, or prevent failure. Impossible disables this grace even if the toggle is on.
ei-enemy-difficulty=Selects the enemy-stat ladder used by Exotic Industries: Remembrance. Gentle through Nightmare only change enemy combat and spawning stats. Original leaves everything at 1.0. Merciful and Impossible also apply a few special-case apex overrides. Impossible also disables Nauvis grace and turns rocket-launch pollution into retaliation on already hostile surfaces.
ei-gate-difficulty=Adjusts gate attunement and progression. Recovered keeps the current gate. Attuned shifts it to late alien age. Resonant shifts it to late quantum age. Paradox shifts it to exotic age. Intended for new saves or before researching the gate.
ei-gate-notifications=Show gate chat notifications such as destination updates and low-power warnings.
ei-black-hole-notifications=Show black hole chat notifications such as containment failure warnings.
ei-matter-machine-notifications=Show matter machine chat notifications such as entropic cascade warnings.
ei-insulated-pipe-notifications=Show insulated pipe chat notifications when incompatible fluids destroy a pipe segment.

