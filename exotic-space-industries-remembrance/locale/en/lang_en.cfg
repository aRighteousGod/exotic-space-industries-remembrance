turrets=Defensive emplacements
turrets-text=Remembrance greatly broadens static defense. The roster now runs from improvised close-range guns to steam artillery, corrosive stream weapons, electricity-driven bullet hoses, and relic-grade energy platforms. These emplacements are not simple sidegrades to the [item=gun-turret]gun turret: each one asks for different logistics, different kill zones, and different upgrade support.\n\nMost ballistic additions still scale with physical projectile damage research. Stream turrets grow with the flame-damage line. The late relic platforms instead ask for extreme power, rare components, and careful spacing.
turrets-2=Shotguns and cannons
turrets-text-2=[item=ei-shotgun-turret]Shotgun turret arrives in the Dark Age after gun turrets and Military. It is a close-range wall-breaker answer: 15 range, slow fire, no fancy power demands, and brutal punishment for anything that actually reaches your perimeter. In the Electricity Age it upgrades into the [item=ei-auto-shotgun-turret]combat shotgun turret, which doubles the firing cadence, reaches 18, turns far faster, and adds electric drain plus per-shot power use to keep a constant buckshot curtain over choke points.\n\nThe [item=ei-cannon-turret-mk1]cannon turret is the Steam Age siege step. It fires [item=cannon-shell]cannon shells to 25 range with an 8-tile dead zone, slow traverse, and heavy single-shot impact. Later, two MK1s and heavier components become the [item=ei-cannon-turret]twin-bore cannon turret: tougher, faster firing, electrically assisted, and working at 30 range with a 10-tile dead zone so heavy targets can be deleted before they reach the wall.
turrets-3=Acid and flame
turrets-text-3=[item=ei-acidthrower-turret]Acidthrower is the corrosive cousin of the flamethrower turret. It reaches 38 with a 9-tile minimum range and accepts [fluid=sulfuric-acid]sulfuric acid, [fluid=ei-nitric-acid]nitric acid, [fluid=ei-hydrofluoric-acid]hydrofluoric acid, and even weak [fluid=ei-acidic-water]acidic water, each with its own damage modifier. It is the stream-turret answer for factories that would rather weaponize chemistry than burn oil.\n\nVanilla [item=flamethrower-turret]flamethrowers are also reworked. EI moves them into the Steam Age, extends them to the same 38/9 engagement band, makes them prepare earlier, and raises their fluid appetite dramatically. Fuel quality now matters: crude oil still works, but heavy oil, light oil, petroleum gas, and [fluid=ei-kerosene]kerosene all hit progressively harder, while rough distillates are weaker emergency feedstocks.
turrets-4=Miniguns and lasers
turrets-text-4=[item=ei-gatling-turret]Minigun turret is the electricity-age bullet hose. It combines a mounted [item=ei-minigun]minigun with electric drive systems, giving 32 range, a 4-tile minimum range, excellent retargeting, and a ferocious sustained rate of fire. The price is exactly what it looks like: endless [item=firearm-magazine]magazine consumption plus constant power support.\n\nVanilla [item=laser-turret]laser turrets remain available, but EI retunes them into a more deliberate electricity-age investment. Their range and beam length are pushed to 30, their tech explicitly wants [item=battery]batteries and [item=advanced-circuit]advanced circuits, and their recipe is rebuilt around [item=ei-steel-beam]steel beams, [item=steel-plate]steel plate, [item=battery]batteries, [item=advanced-circuit]advanced circuits, and [item=ei-energy-crystal]energy crystals. They become a cleaner logistics turret, but no longer a cheap universal answer.
turrets-5=Relic platforms
turrets-text-5=[item=ei-plasma-turret]Plasma turret is the quantum-age fortress gun. It is physically huge, drains a serious grid, and is built from induction-matrix parts plus multiple [item=laser-turret]laser turrets. In return it throws slow-starting plasma bolts out to 200 range, keeps a 40-tile safety radius around itself, and ends each hit in a massive splash that wrecks formations, fortifications, and terrain alike.\n\n[item=zeus-wrath-zeus-turret]Poseidon Installation sits even higher on the relic ladder through [technology=zeus-wrath-zeus-wrath]. EI rebuilds it into a strategic weapon: 350 range, 70 minimum range, 1 GJ per shot, enormous energy storage, and inner plus outer plasma blast rings. It is not a perimeter turret so much as a fixed answer to targets you have decided should stop existing.

tech=Technology cost scaling
tech-text=Exotic Industries does not price research as a flat vanilla ladder. The mod builds research cost from a [font=default-bold]start price[/font], a [font=default-bold]curve form[/font], and a named [font=default-bold]ceiling[/font], then spreads that pressure across the full technology list. Age gates still decide when entire branches become legal, but scaling decides how sharply later techs punish narrow rushing.\n\nLinear hurts harder early and eases later. Quadratic sits in the middle. Exponential ramps gently at first, then pushes much more pain into the deep tree. If this is your first run, [font=default-bold]linear[/font] remains the safest baseline because it exposes the structure clearly.
tech-2=What the startup settings control
tech-text-2=[font=default-bold]Start price[/font] is the individual science pack cost near the beginning of the curve. [font=default-bold]Ceiling[/font] chooses the intended per-pack band near the far end, from Sunday stroll through Very Expensive. [font=default-bold]Curve form[/font] decides where that pain is felt on the way up, while [font=default-bold]additional multiplier[/font] scales the final result after the curve is evaluated.\n\nIf you want to rebalance EI, use these internal settings instead of vanilla research multipliers. The mod expects to own this part of progression, and vanilla multipliers do not describe the same shape.
tech-3=Practical limits and live changes
tech-text-3=The named ceiling is not an absolute guarantee. Factorio caps the internal research-price multiplier at [font=default-bold]x1000[/font], so the real in-game ceiling is implicitly limited by your chosen [font=default-bold]start price[/font]. A start price of [font=default-bold]10[/font] can only reach about [font=default-bold]10,000[/font] per pack, even if you select a higher ceiling. Reaching [font=default-bold]50,000[/font] per pack therefore requires a start price around [font=default-bold]50[/font].\n\n[font=default-bold]Additional multiplier[/font] is the safest value to change mid-save. Changing [font=default-bold]start price[/font] or [font=default-bold]curve form[/font] after a run has begun may cause undesirable or unexpected results.

tech-output=Current Age progress
tech-output-text=The next Age awaiting activation is [font=default-bold]__3__[/font]. At current [font=default-bold]__1__ / __2__[/font] percent of the necessary knowledge has been unveiled to progress through the threshold.\n\n[font=default-bold]Advance, or remain bound to the past.[/font]


world-gen-related=World related information
world-gen-related-text=This section outlines the world-generation systems introduced by the mod. It is divided into focused subcategories for structural clarity.\n\nAccess them via the menu on the left.\nThese are not cosmetic changes.\nThey define terrain, resource behavior, and spatial logic at the foundational level.\n\n[font=default-bold]Understand the layer, or be shaped by it.[/font]


resources=New resource system
resources-text=Exotic Industries implements a restructured resource system. Traditional ore patches are no longer the sole method of acquisition—resources are now divided into distinct categories, each governed by its own logic, production flow, and spatial behavior.\nExtraction is no longer trivial.\n[font=default-bold]Acquisition requires adaptation.[/font]\nUnderstand the category, or produce nothing.

stone=Stone
stone-text=Stone is the most abundant resource in the system. It can be extracted conventionally from surface patches, but Exotic Industries expands its acquisition pathways:\n\n[color=orange]Surface harvesters[/color] [item=ei-burner-surface-harvester] allow for deep extraction from any terrain.\n\n[font=default-bold]Manual collection remains possible, though inefficient.[/font]\nStone is everywhere.\nEfficiency is optional. Output is not.

surface-patches=Surface patches
surface-patches-text=The surface of Nauvis is not uniform. Around the landing zone, the crust is still held together as a protected industrial reserve: [item=ei-poor-iron-chunk]iron, [item=ei-poor-copper-chunk]copper, [item=coal]coal, [item=stone]stone, and nearby [fluid=crude-oil]pressure remain strong enough to found first industry.\n\nBeyond that cradle, the surface breaks apart. [item=ei-poor-iron-chunk]Iron, [item=ei-poor-copper-chunk]copper, and even [item=ei-poor-uranium-chunk]uranium survive mostly as shallow remnants, fracture belts, and exhausted scar fields. They are real, but they are not a durable metal economy.\n\nCoal, stone, and oil remain the working skin of Nauvis. Use the reserve to establish heat, belts, and chemistry. Then read the land correctly, or the crust will lie to you.

veins=Deep ore veins
veins-text=Ore veins are inaccessible at the start. They require [color=orange]Deep Drills[/color] [item=ei-deep-drill], a mid-game extraction system built for vertical yield.\n\nThese veins no longer spawn as generic rarity rolls. Structural metals follow [font=default-bold]metal belts[/font] and [font=default-bold]sedimentary basins[/font] across Nauvis: [item=ei-iron-chunk]iron and [item=ei-copper-chunk]copper favor ridge-country, while [item=ei-coal-chunk]coal and [item=ei-sulfur-chunk]sulfur pool in lower basin terrain.\n\n[font=default-bold]Hydrothermal frontiers[/font] carry [item=ei-lead-chunk]lead and [item=ei-gold-chunk]gold beyond the protected starting region. [font=default-bold]Outer scarlands[/font] hold [item=ei-uranium-chunk]uranium, and only the rarest anomaly pockets inside those broken zones expose [item=ei-neodym-chunk]neodymium.\n\nCritical materials—including uranium, lead, gold, neodymium, and immersite—exist only in these deep layers.\nThey are not optional.\nThey are structural.\n\n[font=default-bold]Surface mining will not carry you to endgame.[/font] Drill, read the land, or stagnate.

chunk-grades=Poor chunks and rich chunks
chunk-grades-text=Not all chunks are equal. [item=ei-poor-iron-chunk]Poor iron and [item=ei-poor-copper-chunk]poor copper are shallow, contaminated scraps left in the broken upper crust. They are meant to start an industry, not sustain one. Their low grade shows immediately at the furnace: [font=default-bold]3 poor chunks -> 1 plate[/font], and they throw off far more slag.\n\n[item=ei-iron-chunk]Iron chunks and [item=ei-copper-chunk]copper chunks from deep veins are the real ore body. Even before any further processing, [font=default-bold]3 proper chunks -> 2 plates[/font] with a much lower slag burden. [item=ei-poor-uranium-chunk]Poor uranium follows the same rule: the surface only hints at it, but real [item=ei-uranium-chunk]uranium belongs to the deep layers.
chunk-refining=Purifier and pure ore
chunk-refining-text=The [item=ei-purifier]Purifier is the first machine that truly upgrades chunk quality instead of merely accepting it. It washes [item=ei-iron-chunk]iron chunks and [item=ei-copper-chunk]copper chunks with [fluid=water]water, converts them into [item=ei-pure-iron]pure iron or [item=ei-pure-copper]pure copper, and returns [fluid=ei-dirty-water]dirty water that you must deal with.\n\nThat extra step pays for itself. [font=default-bold]3 poor chunks -> 1 plate[/font], [font=default-bold]3 proper chunks -> 2 plates[/font], but [font=default-bold]1 pure ore -> 2 plates[/font] with only about a [font=default-bold]1% slag chance[/font]. Deep chunks begin a real metal economy; purification makes it dense, clean, and industrial.
chunk-refining-2=Arc furnace and plasma heater
chunk-refining-text-2=The [item=ei-arc-furnace]Arc furnace turns chunk processing into full metallurgy by melting chunks, pure ore, plates, and parts into [fluid=ei-molten-iron]molten iron and [fluid=ei-molten-copper]molten copper for casting chains. It can consume poor chunks if it must, but the numbers explain why you should not stop there: [font=default-bold]3 poor chunks only become 15 molten metal[/font], while [font=default-bold]1 pure ore becomes 40[/font] with almost no slag.\n\nThe [item=ei-plasma-heater]Plasma heater continues that path in the Quantum Age. It can still run the arc-furnace metal recipes while also unlocking extreme-temperature gas and plasma processing. The purifier improves the feedstock, the arc furnace improves the metallurgy, and the plasma heater carries that same chain into the late game.
mining-scars=Mining scars
mining-scars-text=Depleting a deposit no longer leaves the terrain untouched. Exotic Industries can scar nearby ground when extraction finishes, but only for [item=ei-burner-quarry], [item=ei-steam-quarry], [item=ei-electric-quarry], and the [item=big-mining-drill].\n\nEach depletion event can seed a small scar patch at a random offset near the exhausted deposit. The effect is terrain damage, not a bonus resource pulse.
mining-scars-2=Planetary degradation
mining-scars-text-2=Scars degrade tiles along planet-specific chains: Nauvis grass collapses into dirt and sand, Fulgora rock sloughs into sand, dust, and dunes, Gleba rots, Vulcanus chars, and Aquilo compacts snow and ice. Water tiles and hidden tiles are ignored, and matching decoratives are stripped away.\n\nTreat the scars as the map remembering what you took from it.

asteroid-variants=Differentiated asteroids
asteroid-variants-text=Exotic Industries adds six extra asteroid families on top of vanilla space debris: [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk], and [item=ei-scrap-asteroid-chunk]. They are layered into planetary routes, crushed in the [entity=crusher], and all twelve basic and advanced EI asteroid recipes benefit from [font=default-bold]asteroid productivity[/font].\n\nThe crusher is also expanded with fluid ports and a larger result inventory so these mixed outputs fit.
chemical-asteroid=Chemical asteroids
chemical-asteroid-text=Unlocked through [font=default-bold]planet discovery: Aquilo[/font]. Basic and advanced crushing pull [fluid=ammonia], [item=ei-fluorite], and [fluid=fluorine] from the chunk, while the advanced recipe can additionally roll [fluid=lithium-brine]. Their rare anomaly is [item=ei-neuro-reactive-residue].
organic-asteroid=Organic asteroids
organic-asteroid-text=Unlocked through [font=default-bold]planet discovery: Gleba[/font]. Basic crushing consumes [fluid=water] and yields [item=spoilage], [fluid=ei-bio-sludge], and [fluid=ei-ammonia-gas]. The advanced pass adds [item=nutrients] and can return [item=yumako], [item=jellynut], [item=ei-bio-matter], and even a rare [item=pentapod-egg]. Their anomaly is [item=ei-sporeglass-heart].
rock-asteroid=Rock asteroids
rock-asteroid-text=Unlocked through [font=default-bold]planet discovery: Vulcanus[/font]. The basic recipe is mostly [item=stone]. The advanced recipe opens the richer mineral layer: [item=tungsten-ore], [item=calcite], and [item=ei-gold-chunk]. Their anomaly is [item=ei-gravity-braided-ore].
uranium-asteroid=Uranium asteroids
uranium-asteroid-text=Unlocked as soon as [font=default-bold]space platform[/font] research gives access to the differentiated field. Both recipes consume [fluid=sulfuric-acid]. In return they yield [item=stone], [item=ei-uranium-chunk], and [item=ei-lead-chunk], with the advanced recipe spending more acid for a much stronger uranium return. Their anomaly is [item=ei-isotopic-ghost-shell].
petrified-asteroid=Petrified asteroids
petrified-asteroid-text=Also unlocked with [font=default-bold]space platform[/font]. Basic crushing gives a strange mix of [item=wood], [item=raw-fish], [fluid=ei-liquid-nitrogen], and [fluid=ei-liquid-oxygen]. The advanced pass adds [item=bioflux] and [fluid=fluoroketone-cold], improving biological rolls and even allowing a small chance at [item=biter-egg]. Their anomaly is [item=ei-chrono-fossil-shard].
scrap-asteroid=Scrap asteroids
scrap-asteroid-text=Unlocked through [font=default-bold]planet discovery: Fulgora[/font]. These recipes are wired into the scrap recycling table, so crushing them becomes a salvage stream rather than a single-output ore recipe. Both tiers keep their [item=ei-crushed-neodym] rolls, and both can rarely expose [item=ei-worm-torn-relay-core].\n\nIf you want orbital junk turned into factory stock, this is the route.
asteroid-anomalies=Anomalies into space data
asteroid-anomalies-text=Each differentiated asteroid family hides one anomaly. Those six anomaly items feed specialized [entity=ei-computer-core] recipes, become data cards in the simulator, and are finally recombined into [item=ei-space-data] in zero gravity through the [entity=ei-quantum-computer].\n\nThe asteroid field is not just raw material. It is a second research frontier.

fulgora-day-variation=Fulgora day length variator
fulgora-day-variation-text=Fulgora does not keep a fixed day length. At the start of each cycle the mod rerolls [font=default-bold]the day-night cycle length[/font] using the startup minimum and maximum multipliers. At default settings that means every Fulgora day can land anywhere between [font=default-bold]10% and 200%[/font] of the standard cycle length.
fulgora-day-variation-2=When rerolls apply
fulgora-day-variation-text-2=The reroll tries to happen during a bright, stable-light window so the surface does not snap into a new cycle length during heavy darkness. If Fulgora never offers a safe window, a failsafe forces the change after roughly one standard day anyway.\n\nThe startup settings define the envelope. Each actual day picks its own random length inside it.

artifacts=Alien artifacts
artifacts-text=Scattered across the world are remnants of an ancient civilization—one that harnessed exotic matter long before your arrival. Their artifacts remain, embedded in the terrain, partially buried, partially alive.\n\nSome are inert.\nSome still function.\nNone are accidental.
actifacts-text-2=They were not placed. [font=default-bold]They were left behind—deliberately or otherwise.[/font] Find them. Study them. Fear what they imply.

gate=Cross dimensional gate
gate-text=The Gate is a spatial transit structure that moves items through a controlled dimensional breach.\n\nEach gate binds to receiver IDs instead of raw surface positions. The source console selects a receiver, the receiver anchor claims an ID, and circuit control can override both when needed.\n\nTransit cost now depends on both burden and span. Local same-surface hops are cheap. Interplanetary transfers are not.\nThis is not a portal. [font=default-bold]It is a machine that remembers where it tears.[/font]
gate-2=Receivers and IDs
gate-text-2=Gate receivers are the destination anchors. Each one claims the lowest free positive ID for its force unless circuit signal [color=orange]I[/color] overrides it.\n\nDuplicate effective IDs conflict and cannot be used until the conflict is resolved.\nSelecting a receiver in the gate console binds the gate to that receiver ID instead of a raw position.
gate-3=Gate wiring
gate-text-3=The gate listens on the hidden source-side container.\nIf that connector is awkward to target, the hidden [entity=ei-gate-circuit-interface] near the lower center of the gate can also be wired directly.\n[color=orange]signal-D[/color] selects the receiver ID.\n[color=orange]signal-E[/color] enables the gate when above 0.\n[color=orange]signal-I[/color] on a receiver can override its automatic ID.\nIf [color=orange]signal-D[/color] resolves to one valid receiver, circuit control overrides the manual selection.\nIf [color=orange]signal-D[/color] is missing, invalid, or conflicted, the gate falls back to the manual receiver and manual enabled state.
gate-4=Gate telemetry
gate-text-4=The gate outputs from the hidden [entity=ei-gate-circuit-interface].\nThat invisible interface can be used as a dedicated wire target when you want direct access to gate telemetry.\nThe interface only updates while it is actually wired to an external circuit, and it refreshes at most once per second.\n[color=orange]ei-gate-active[/color] is 1 when the gate is armed.\n[color=orange]ei-gate-energy[/color] reports stored energy in MJ.\n[color=orange]ei-gate-stress[/color] reports stress on a 0-100 scale.\nUse these signals to drive alarms, buffers, or control logic.
gate-5=Stress and residue
gate-text-5=Each successful transfer adds stress. Stress raises upkeep, lengthens cooldown, and can saturate a receiver if traffic is repeated too quickly.\n\nThe console's Transit Span bar shows the current route pressure. Same-surface transfers stay cheap, orbit-to-planet hops pay a large floor, and moving platform receivers use live route progress.\n\nOveruse also produces [item=ei-breach-residue], a waste product of dimensional scarring. It should be neutralized through the purifier chain before it becomes clutter.\nThe gate is for burst logistics, not for continuous freight.
gate-6=Legacy gates
gate-text-6=Legacy saves that still point at a chest or raw position continue to work until they are reconfigured.\nOnce a gate is assigned to a receiver, that receiver becomes the source of truth and the old raw destination remains informational only.\nThis preserves old saves while moving new setups to receiver IDs.

drone=Drone port
drone-text=A drone port that allows to take over and control a [color=blue]drone[/color][entity=ei-drone]. Placing this building will create an associated drone that can be shown, when clicking the port. From there one can "uplink" to the drone and steer it. The drone can fly over terrain, place and mine buildings, move items from and into its own inventory. However it is unable to fight. At any time you can decouple from the drone using [color=orange]EXIT[/color] or port it back to its station with its retrivial control [color=orange]RESET[/color]. Flying a drone through the gate will initiate transport.

repair=Artifact repair
repair-text=You can repair broken alien artifacts, by making [color=blue]artifact repair packs[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. This will allow you to use them again. The repair process can be initiated by dragging the repair kit over the artifact. Note that the repair kit will be consumed in the process.

alien=Ancient Alien data
knowledge-text=The ancient civilization that left behind the artifacts also left behind some of their data. 

new-logistics=New logistics
new-logistics-text=Exotic Industries expands the logistics layer with new systems, entities, and mechanics. These features are organized into distinct subcategories—not for convenience, but for [font=default-bold]structural clarity.[/font]\n\nAccess them through the menu on the left.\n\nMovement is no longer trivial.\n\nEvery route is a decision\n\nEvery flow is a design.\n\nEfficiency is [font=default-bold]earned.[/font]

train-progression=Train progression
train-progression-text-2=Trains become available early, during the Steam Age. Your first option is the [color=orange]Steam Locomotive[/color] [item=ei-steam-basic-locomotive]—capable of hauling items, but incapable of transporting fluids.\n\nProgress unlocks the [color=orange]Advanced Steam Locomotive[/color] [item=ei-steam-advanced-locomotive], which adds fluid transport capacity. Both models rely on burnable fuels such as coal or solid biomass, with the capacity for enhanced performance via Rocket, Nuclear, or Fusion fuels.\n\nEventually, pure brute force combustion in all its polluting glory may become a drawback. To operate cleaner and faster conventional rail, you transition into [color=brown]Diesel Fuel[/color] [item=ei-diesel-fuel-unit] and the [color=orange]Diesel Locomotive[/color] [item=locomotive].\n\nLogistics escalate with technology.\nFuel defines the frontier.\nTrains do not ask where—they demand what burns.\n\nWhen Gaia opens, rail diverges again into crystalline field logistics. That branch now has its own [font=default-bold]EM trains[/font] entry in this section, because it stops behaving like combustion rail and starts behaving like networked power infrastructure.
train-progression-text=Trains become available early, during the Steam Age. Your first option is the [color=orange]Steam Locomotive[/color] [item=ei-steam-basic-locomotive]—capable of hauling items, but incapable of transporting fluids.\n\nProgress unlocks the [color=orange]Advanced Steam Locomotive[/color] [item=ei-steam-advanced-locomotive], which adds fluid transport capacity. Both models rely on burnable fuels such as coal or solid biomass, with the capacity for enhanced performance via Rocket, Nuclear, or Fusion fuels.\n\nEventually, pure brute force combustion in all its polluting glory may become a drawback. To operate cleaner and faster conventional rail, you transition into [color=brown]Diesel Fuel[/color] [item=ei-diesel-fuel-unit] and the [color=orange]Diesel Locomotive[/color] [item=locomotive].\n\nLogistics escalate with technology.\nFuel defines the frontier.\nTrains do not ask where—they demand what burns.\n\nWhen Gaia opens, rail diverges again into crystalline field logistics. That branch now has its own [font=default-bold]EM trains[/font] entry in this section, because it stops behaving like combustion rail and starts behaving like networked power infrastructure.

em-trains=EM trains
em-trains-text=Gaia does not ask its late railways to burn. It asks them to couple. [item=ei_charger]EM chargers establish a crystalline field mesh over the rail path, and the [item=ei_em-locomotive]EM locomotive with its [item=ei_em-cargo-wagon]cargo and [item=ei_em-fluid-wagon]fluid wagons rides that mesh instead of feeding coal or diesel into a firebox.\n\nBecause motive force comes from the charger lattice rather than onboard combustion, the same rolling stock is usable on planetary lines and off-world corridors alike. Gaian engineers insist the crystals are not pushing against smoke, steam, or even air; they are remembering the rail's geometry and pulling the consist through that memory. Whether that is physics or liturgy, it survives the vacuum just fine.
em-trains-2=Quality, grace, and transfer efficiency
em-trains-text-2=Quality now matters on both sides of the link. Higher-quality [item=ei_charger]chargers reduce their own field upkeep by up to [font=default-bold]20%[/font] and improve transfer efficiency by another [font=default-bold]12%[/font]. Higher-quality [item=ei_em-locomotive]locomotives reduce the field power they demand by up to [font=default-bold]16%[/font]. These bonuses are normalized across the active quality ladder, so modded quality tiers scale cleanly between the lowest and highest available grades instead of assuming vanilla's exact steps.\n\nLocomotive quality also creates a [font=default-bold]grace window[/font] after leaving charger coverage. At maximum quality, field coherence can be preserved for up to [font=default-bold]480 ticks, or 8 seconds[/font]. Normal quality gets no grace at all. This is meant to bridge short gaps, rail seams, or brief routing mistakes—not to excuse building dead sections into the network.
em-trains-3=Research and field behavior
em-trains-text-3=The research families [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font], and [font=default-bold]ei_eff[/font] remain the main global multipliers. Speed and acceleration each add [font=default-bold]+10% per level[/font] up to [font=default-bold]+200%[/font]. Charger efficiency climbs through five tiers to as much as [font=default-bold]90% less network power burden[/font]. Local charger quality and local locomotive quality then stack on top of that global research when power is actually transferred.\n\nIn practice, good EM rail is built from both science and hardware. If coverage refreshes, the train keeps its field fuel topped up and runs like light on a wire. If coverage collapses, the system first spends any grace reserve and then the locomotive turns inert. Gaia forgives many things. A broken field is not one of them.

orbital-scanner=Platform request scanner
orbital-scanner-text=The [entity=ei-orbital-combinator] mirrors request minima from space platforms whose [font=default-bold]space location matches the scanner's current surface.[/font]\n\nIt is a read-only telemetry source: the scanner does not issue logistics orders, route rockets, or override platform behavior. It simply republishes what those platforms are already asking for so you can wire that information into stations, alarms, malls, and import planning.\n\nPlatforms are listed in deterministic order, and request signals keep their [font=default-bold]quality[/font] identity instead of collapsing every tier into one item count.
orbital-scanner-2=Banks, continuation pages, and overflow
orbital-scanner-text-2=Orthogonally adjacent scanners on the same force and surface form one shared bank.\n\nThat bank spreads platform sections across all adjacent members, letting large orbital traffic summaries scale past a single constant combinator's slot ceiling. If one platform needs more room than a single section page can hold, the scanner will continue it as [font=default-bold]Platform Name [2/N][/font], [font=default-bold][3/N][/font], and so on.\n\nIf the full adjacent bank still runs out of room, the anchor scanner emits [virtual-signal=ei-orbital-overflow]. Its value is the number of request filters that were omitted after the bank was filled.
orbital-scanner-3=Practical use
orbital-scanner-text-3=Use the scanner where orbital demand matters most:\n\nAt launch infrastructure to decide which payloads should be staged next.\nAt train depots to summon imports only when a surface-visible platform request appears.\nAt malls and buffer silos to raise alarms when orbit begins asking for rare parts, science, or ammunition.\n\nThe scanner is most useful when treated as a [font=default-bold]planning bus[/font]. It tells the factory what orbit currently wants; your circuit logic decides what to do with that information.
spidertron=Spidertron changes
spidertron-text=Compared to vanilla, the [font=default-bold]Spidertron becomes available earlier[/font]—in the Simulation Age. However, unlike its Nauvis counterpart, it is no longer a self-contained miracle. It requires fuel.\n\nAt first, burnable solids will suffice—coal, biomass, and similar materials will keep it crawling. But as you advance, nuclear and fusion fuels unlock significant bonuses to speed, acceleration, and operational range.\n\nThis is not just a vehicle. It is a [font=default-bold]platform for escalation.[/font]\n\nMods such as [color=green]Spidertron Patrols[/color] and [color=green]Constructron-Continued[/color] include special integration, adapting their systems to align with the modified Spidertron framework in Exotic Industries.\n\nThe Spider walks earlier. But it walks with purpose, weight, and demand.\n\nFeed it well—or [font=default-bold]fall behind.[/font]

cranes-and-belts=New belts and inserter cranes
cranes-and-belts-text=Exotic Industries introduces a new tier of logistics infrastructure: the [color=orange]Neo Logistic Belt[/color] [item=ei-neo-belt]. Constructed from high-tech materials, it offers an extreme throughput of [font=default-bold]90 items per second[/font]—exceeding all vanilla transport limits. These belts are engineered for endgame volumes and recursive-scale factories.\n\nIn addition, the mod adds [color=orange]Cranes[/color] [item=ei-big-inserter-normal]—massive, high-capacity inserters designed for bulk transfer.\n\nUse them to:\n\nRapidly unload trains\n\nBridge large inventory structures (e.g., chests ↔ warehouses)\n\nMaintain flow where standard inserters fail under pressure\n\n[font=default-bold]Speed is no longer a luxury.\nIt is the baseline.\nLogistics must scale with power, or break under it.[/font]

loaders=Loaders
loaders-text=EI loaders form the direct-feed branch of the logistics line: [item=ei-loader]Loader, [item=ei-fast-loader]Fast loader, [item=ei-express-loader]Express loader, [item=ei-turbo-loader]Turbo loader, and [item=ei-neo-loader]Neo loader. Each step climbs the belt ladder, pushes harder throughput, and trades that violence for a heavier electrical appetite.\n\nThey do not throw items through the air. They bind belt flow straight into machines, containers, wagons, and rail-side interfaces.\n\nIf inserter swing time is the weakness, loaders are the answer.
loaders-2=Stacking
loaders-text-2=[item=ei-express-loader]Express loaders can move stacks up to [font=default-bold]2[/font], and that stack size can be adjusted. [item=ei-turbo-loader]Turbo loaders also stack up to [font=default-bold]2[/font]. [item=ei-neo-loader]Neo loaders inherit the game's full belt stack limit and can likewise be tuned downward when precision matters more than brute force.\n\nThat means upper loader tiers do not merely ride faster belts. They force denser bursts through the same tile footprint.
loaders-3=Filtering
loaders-text-3=[item=ei-express-loader]Express loaders gain [font=default-bold]one shared filter[/font] across the whole loader. [item=ei-turbo-loader]Turbo and [item=ei-neo-loader]Neo loaders gain [font=default-bold]two lane filters[/font] with separate control for each side of the belt.\n\nAt that point one loader body can decide not only what passes, but which lane receives it.
loaders-4=Snapping and placement
loaders-text-4=EI loaders automatically [font=default-bold]snap toward a valid connection[/font] when placed, and they reconsider that binding when nearby belts change. They test real links to belts, containers, wagons, and rail-side placements instead of trusting the first cursor rotation blindly.\n\nIn practice, a loader placed against a wagon, chest, machine, or rail-side interface may rotate or flip its flow direction so the connection actually locks. The machine follows the true bind, not the first guess.
loaders-5=Electric appetite
loaders-text-5=All EI loaders require [font=default-bold]electric power[/font]. Every moved item draws from an internal energy buffer, and each tier raises both the buffer and the per-item demand. Higher tiers are stronger, not cheaper.\n\nA loader can survive a brief brownout on stored charge, but it cannot hold peak throughput for long without a live grid behind it. If power starves, throughput fails before the machinery does.
bots=More bots
bots-text=Remembrance does not wait for clean electric logistics before putting machines in the air. Bot progression begins in the [font=default-bold]Steam Age[/font] with [item=rp-steam-roboport], [item=rp-steam-logistic-bot], and [item=rp-steam-construction-bot], then matures later into heavier and more advanced electric swarms.\n\nThe result is an unusually early relationship with aerial automation: crude first, elegant later.
steam-bots=Steam bots
steam-bots-text=These are not polished electric drones. They are brass-bodied worker spirits held aloft by pistons, pressure, and rough calculation, the first airborne servants of an industry that still smells of hot metal and wet steam.\n\nBecause the steam roboport line sits in the [font=default-bold]Steam Age[/font] and later vanilla robotics are patched behind it, you gain flying logistic and construction help far earlier than a normal run would allow.
steam-bots-2=Boiler-blood and failure
steam-bots-text-2=The bargain is endurance. Steam bots do not carry a bottomless electrical reserve; they fly on stored pressure and must return to a roboport before it runs dry. If their steam runs out in transit, they [font=default-bold]fall out of the sky[/font] instead of gracefully waiting for rescue.\n\nSteam roboports push them to seek recharge early, but long jobs, congested ports, and overextended networks can still turn early convenience into wreckage.
bots-2=Later bot lines
bots-text-2=Once the factory reaches full electric robotics, EI expands the swarm with heavy cargo bots for bulk hauling, heavy construction bots for aggressive build bursts, and later advanced variants with higher speed, range, durability, and task focus. The [font=default-bold][color=orange]Advanced Roboport[/color][/font] supports that later network with faster charging, more bot slots, and a wider working radius.\n\nThis is not just a drone network. [font=default-bold]It is a mechanized swarm protocol.[/font]


new-mechanics=New gameplay mechanics
new-mechanics-text=Exotic Industries introduces a wide array of new mechanics—each one altering the foundational logic of gameplay.\n\nThese systems are divided into focused subcategories for structural clarity.\nYou can navigate them using the menu on the left.\n\n[font=default-bold]These are not optional layers.[/font]\n\nThey are the new physics of the world.\n\nStudy them, or [font=default-bold]be dismantled by them.[/font]


beacon-overhaul=Beacon overhaul
beacon-overhaul-text=Exotic Industries imposes strict limits on beacon influence: a machine can be affected by a maximum of 4 beacons. [font=default-bold]The era of infinite stacking is over.[/font]\n\nIn addition, beacons beyond the first now require cooling fluid [fluid=ei-liquid-nitrogen] to operate. Without it, they overheat and shut down. Electricity is no longer the source of functionality—logistics must support thermodynamic stability.\n\nTo compensate, beacons have been structurally upgraded:\n\nIncreased module capacity\nIntroduction of an Improved Beacon\nCounts as 2 beacons toward the cap\nHolds even more modules\nDemands more infrastructure\n\n[font=default-bold]Amplification is no longer trivial.[/font]\nIt is a mechanical discipline.\nBuild with precision—or [font=default-bold]fall into inefficiency.[/font]

specialised-pipes=Specialised pipes and data cables
specialised-pipes-text=Exotic Industries introduces specialized infrastructure systems to handle extreme conditions and advanced signal routing.\n\n[color=orange]Insulated Pipes[/color] are required to transport volatile fluids such as [fluid=ei-liquid-oxygen], [fluid=ei-liquid-nitrogen], and [fluid=ei-heated-helium-3]. These fluids must remain in their liquid state—[font=default-bold]standard pipes will cause phase shifts,[/font] rendering them unstable or unusable.\n\n[color=orange]Data Cables[/color] enable the flow of high-density computational signals between machines. They are essential for operating advanced systems like the [color=orange]Computer Core[/color] [item=ei-computer-core] and [color=orange]Quantum Computer[/color] [item=ei-quantum-computer].\n\nHeat, phase, and data are now physical constraints.\n\nYou don’t just build systems—[font=default-bold]you maintain containment.[/font]\n\nFailure to route properly means failure to function.
specialised-pipes-2=Insulated containment
specialised-pipes-text-2=Uninsulated pipes, pipe-to-ground segments, and tanks are not safe for every fluid. [fluid=ei-liquid-nitrogen]Liquid nitrogen and [fluid=ei-liquid-oxygen]liquid oxygen will not stay liquid in ordinary plumbing; they boil off back into [fluid=ei-nitrogen-gas]nitrogen gas and [fluid=ei-oxygen-gas]oxygen gas instead.\n\nOther fluids, including [fluid=ei-heated-helium-3]heated process lines, lava, fluoroketones, and electrolyte, can outright [font=default-bold]burst and destroy[/font] non-insulated pipes or tanks. If the chemistry is hostile, insulation is not optional.
specialised-pipes-3=Cryogenic stability
specialised-pipes-text-3=Insulated pipes also ignore the usual pipe-heating requirement. The insulated pipe, underground, and tank prototypes all use [font=default-bold]0 heating energy[/font], so they do not need external heat to avoid freezing on Aquilo or any other cold surface.\n\nUse them when you need fluids to stay exactly as prepared: cold liquids remain cold, reactive mixtures stay contained, and the line survives where ordinary plumbing would fail.

space-destinations=Space destinations
space-destinations-text=The [color=orange]rocket silo[/color] [item=rocket-silo] can be used to send its cargo to different destinations. When it first gets unlocked in the computer age you will only be able to send satellites into [color=green]nauvis orbit[/color]. Depending on the type of sent satellite or rocket cargo you can then receive data or other useful launch products.

space-destinations-2=Different destinations
space-destinations-2-text=As you progress, various destinations in and away from your native solar system will become available. Depending on the distance to the selected destination you will need more or less rocket fuel. Additionally some destinations need to be uncovered first, either by sending a specialised [color=orange]exploration satellite[/color] [item=ei-exploration-satellite] or by chance when sending a rocket with normal cargo. Some new destinations might be located in deep space, [color=purple]out of the solar system[/color]. Note that even when sending exploration satellites uncovering new destinations always depends on chance.  

induction-matrix=Induction matrix
induction-matrix-text=The [color=orange]induction matrix[/color] is a compound machine that can be used to store large amounts of energy. It can be used to store overhead power just like normal accumulators and then release it later on. Different tiers of matrix size can be unlocked by researching the corresponding technologies.

induction-matrix-2=Induction matrix components
induction-matrix-2-text=The Induction Matrix is a modular energy storage structure composed of interlinked components, each with a defined role in the containment and transfer of high-voltage energy.\n\nThe [color=orange]Induction Matrix Core[/color] [item=ei-induction-matrix-core] serves as the central controller of the system. Without it, the matrix is inert. When connected to the circuit network, the core outputs current charge on signal-C, total capacity on signal-T, and max IO on signal-M. These signals are only produced while the core is actually wired, and they refresh no more than once per second.\n\n[color=orange]Induction Coils[/color] [item=ei-induction-matrix-basic-coil] [item=ei-induction-matrix-advanced-coil] [item=ei-induction-matrix-superior-coil] These [font=default-bold]store energy internally[/font] and can be upgraded across three tiers. Coils gain an efficiency bonus when placed adjacent to a [color=orange]Matrix Solenoid[/color] [item=ei-induction-matrix-basic-solenoid].\n\n[color=orange]Matrix Solenoids[/color] enhance coil efficiency when arranged in sequence. Placing multiple solenoids in series [font=default-bold]increases effectivity[/font], but overbuilding will result in diminishing returns and wasted structure.\n\n[color=orange]Converters[/color] [item=ei-induction-matrix-basic-converter] [item=ei-induction-matrix-advanced-converter] [item=ei-induction-matrix-superior-converter] These components regulate power flow into and out of the matrix, scaling the throughput based on tier.

exotic-stabilizers=Exotic matter machines
exotic-stabilizers-text=Exotic Matter is not a resource - it is a threat made useful. Processing it requires containment, precision, and machinery engineered to survive its volatility.\n\nThe [color=orange]Exotic Matter Assembler[/color] [item=ei-exotic-assembler] is the only structure capable of handling its energy signature. Even then, instability is inevitable - the assembler may detonate under stress. When the lattice is holding, the machine hums with a visible containment pulse; when it begins to lose the argument, that pulse hardens into crackle, arcing discharge, and warnings heavy enough to feel.\n\nTo reduce this risk, place [color=orange]Exotic Matter Stabilizers[/color] [item=ei-matter-stabilizer] around the assembler. These devices suppress critical failure events and stabilize the surrounding energy field. Some may even be found scattered throughout the world - relics of a previous cycle.\n[color=gray]Quality Matter stabilizers count as 3 x (Quality - 1) stabilizers each.\nQuality Exotic assemblers per second chance of entropic cascade is reduced by (Quality - 1)%, meaning Uncommon reduces the base chance of 12% to 11%.[/color]\n\nDo not treat exotic matter as just another ingredient.\n\nIt is [font=default-bold]alive, volatile, and watching.[/font]
black-hole=Black hole generator
black-hole-text=The [color=orange]Black Hole Generator[/color] is the final machine—a gravitational singularity harnessed into industrial function. It consumes matter. It defies entropy. It ends the game.\n\nReaching a [color=green]fully operational[/color] state with this device signifies total system mastery. This is your victory condition. Not through conquest, but through control of the fabric beneath physics.\n\nTo bring the Black Hole Generator online, you will require:\nMassive quantities of refined building materials\nA continuous feed of consumable matter\nAn immense and stable power infrastructure\n\nYou are strongly advised to construct a hardened [color=orange]Fusion Reactor[/color] grid and supplement it with tiered [color=orange]Induction Matrices[/color] capable of absorbing and releasing power at industrial-scale throughput.\n\nThis is not a generator. [font=default-bold]It is an ending woven from collapse.[/font]\n\nBuild wisely. [font=default-bold]Feed it relentlessly.[/font] There are no second chances.

black-hole-2=Reactor components
black-hole-2-text=The Black Hole Generator is not a single structure, but a modular singularity containment array, composed of several high-stress components—each critical to stability, energy flow, and eventual endgame activation.\n\nThe central structure is the [color=orange]Black Hole Generator[/color] [item=ei-black-hole].\n\nOnce activated, it consumes any item placed into its inventory, regardless of type.\n\nEach item contributes equally to the generator’s internal [color=green]mass count[/color], which continuously decays over time. Constant input is required to sustain mass levels.\n\nItem type is irrelevant.\nIron plates, exotic processors, or raw fish—all are devoured, all become mass.\n\n[color=orange]Energy Injector Pylons[/color] [item=ei-energy-injector-pylon] maintain the containment field as the singularity grows.\nEach pylon draws 5 GW of continuous power.\n\nInjectors are not required during startup—[font=default-bold]the vessel can contain the newborn black hole[/font]—but become essential as mass accumulates.\n\n[color=orange]Energy Extractor Pylons[/color] [item=ei-energy-extractor-pylon] allow for power extraction once the generator reaches its [color=green]fully operational[/color] state.\nEach extractor can draw up to 100 GW of raw power from the stabilized singularity.\n\nExtraction is not possible until the final stage of the generator has been reached.\n\n[font=default-bold]This is not a machine. It is a ritual of collapse.[/font]\nYou are feeding mass into a [font=default-bold]bound anomaly.[/font]\nIf you do not contain it, it will fail.\nIf you do not feed it, it will die.\n\nIf you do both—[font=default-bold]it will power the end of all things.[/font]\n\nThere is no automation without [font=default-bold]annihilation.[/font]

black-hole-3=Black hole stages
black-hole-3-text=Bringing the Black Hole Generator online is a staged, high-risk process. Each phase escalates the energy, mass, and structural requirements. There is no skipping steps. Only forward, or failure.\n\n🜏 Startup Phase\n\nNo pylons are needed.\n\nThe generator must consume enough material to reach an initial [color=blue]10×10³kg[/color] mass count.\n\nItem type does not matter—only volume.\n\nOnce mass reaches 100% stage progress, the generator stabilizes into the Containment Phase.\n\n🜏 Containment Phase\n\nNow, [color=blue]8 active Energy Injector Pylons[/color] [item=ei-energy-injector-pylon] must remain online.\n\nEach draws 5 GW, for a total power demand of 40 GW.\n\nPressing the Expansion Button initiates a controlled growth of the singularity radius.\n\nThis state must be maintained continuously for [color=blue]60 seconds.[/color]\n\nAny interruption—power failure, pylon loss—resets the timer.\n\n🜏 Fully Operational Phase\n\nThe generator achieves stability. The singularity is now large enough to support external energy extraction.\n\n[color=orange]Energy Extractor Pylons[/color] [item=ei-energy-extractor-pylon] placed within range can draw up to 100 GW per pylon, directly feeding your energy grid.\n\nAt this stage, the system becomes largely self-sufficient, requiring only a constant mass input to offset decay.\n\nYou are not fueling a reactor.\nYou are managing the [font=default-bold]hunger of a bound singularity.[/font]\nMass becomes power. Power becomes control. [font=default-bold]Control becomes final.[/font]\n\nThere is no off switch. Only containment.
nuclear-fission-and-fusion=Nuclear fission and fusion
nuclear-fission-and-fusion-text=Exotic Industries expands the nuclear power layer with new mechanics, materials, and systems of control.\n\nThese features are divided into multiple subcategories—each representing a specific aspect of nuclear infrastructure, fuel dynamics, or containment logic.\nYou can access them through the menu on the left.\n\n[font=default-bold]This is not just fission.[/font]\nThis is escalation by heat, pressure, and irreversible reaction.\n[font=default-bold]Study the systems before you ignite them.[/font]

fission-reactors=Nuclear fission changes
fission-reactors-text=Nuclear fission in Exotic Industries has been rebalanced and hardened into a more demanding, more rewarding system.\n\nThe standard [color=orange]Nuclear Reactor[/color] [item=nuclear-reactor] no longer benefits from the vanilla neighbor bonus.\n\nInstead, it delivers [font=default-bold]increased raw output per reactor[/font]—power through density, not adjacency.\n\n[font=default-bold]Uranium is more scarce.[/font] Extraction is slower, and yield is lower. Efficient nuclear infrastructure must account for long-term fuel pressure.\n\nBurnt fuel cells are no longer waste.\n\nA closed-loop recycling system allows for the recovery of fissile byproducts, which can be refined into secondary fuel cells with improved efficiency.\n\nHowever, all processes generate [color=brown]Nuclear Waste[/color] [item=ei-nuclear-waste], a persistent byproduct that must be safely contained, processed, or isolated.\n\nIt cannot be ignored.\n\nNeglect becomes contamination.\n\nNuclear power is no longer a shortcut to infinite energy.\n\nIt is a high-stakes economy of [font=default-bold]heat, decay, and reclamation.[/font]\n\nUse it well—or [font=default-bold]drown in the cost.[/font]

fission-reactors-2=High temperature fission
fission-reactors-2-text=The [color=orange]High Temperature Nuclear Reactor[/color] [item=ei-high-temperature-reactor] is an advanced fission system designed for maximum thermal output. It surpasses standard nuclear infrastructure in both efficiency and scale—[font=default-bold]but only when properly maintained.[/font]\n\nOnce brought up to its critical operating temperature and supplied with:\n\nA steady flow of [font=default-bold]liquid lead coolant[/font], and\n\nAt least one viable fuel rod,\n\n…it will [font=default-bold]superheat[/font] the molten liquid lead coolant, exceeding the throughput of conventional heat exchangers and requiring a custom built unit.\n\nUnlike traditional reactors, it can also utilize the otherwise non-fissile [color=brown]Thorium[/color] [item=ei-thorium-232-fuel] fuel—transforming a waste product into an energy source through sheer intensity of design.\n\nThis is not a beginner’s reactor.\n\nIt does not tolerate gaps in supply.\n\nIt does not scale down.\n\nIt is a pressure engine for post-human industry—[font=default-bold]brutal, efficient, and unforgiving.[/font]

fusion-power=Fusion power
fusion-power-text=The [color=orange]Fusion Reactor[/color] [item=ei-fusion-reactor] is a late-tier power system capable of generating immense energy through the controlled fusion of light atomic fuels.\n\nIt operates on a [font=default-bold]closed-loop lead coolant cycle,[/font] utilizing [fluid=ei-cold-coolant] and [fluid=ei-hot-coolant] to manage internal temperatures. Without sufficient cooling, reactor integrity fails—this is not optional.\n\nConstruction is resource-intensive and requires rare components. Once active, the reactor [font=default-bold]demands[/font] a continuous supply of fusion fuel.\n\nEarly fuels include:\n\n[color=blue]Lithium 6[/color] [fluid=ei-lithium-6]\n\n[color=blue]Protium[/color] [fluid=ei-protium]\n\nAs the infrastructure scales, more advanced isotopes become viable:\n\n[color=blue]Deuterium[/color] [fluid=ei-deuterium]\n\n[color=blue]Tritium[/color] [fluid=ei-tritium]\n\n[color=blue]Helium-3[/color] [fluid=ei-helium-3] — yielding extreme output at extreme cost.\n\n[font=default-bold]Fusion is not clean. It is not free.[/font]\n\nIt is a machine that eats the lightest elements to power the heaviest burdens.\n\nFuel it endlessly, or it dies.\n\nCool it constantly, or [font=default-bold]you[/font] do.

fusion-power-2=Neutrons and you
fusion-power-2-text=To acquire advanced fusion fuels, [color=green]neutrons[/color] must be harvested and weaponized as a resource.\n\nThese free particles are generated through controlled [color=green][font=default-bold]nuclear fission[/font][/color] and [color=green][font=default-bold]fusion neutron sources[/font][/color], then captured using specialized [color=orange]Neutron Collectors[/color] [item=ei-neutron-collector].\n\nNeutron yield depends on:\n\nThe intensity of the nearby source, and\n\nThe proximity of the collector to the emission zone.\n\nGreater distance means reduced capture rate. Optimal layouts demand tight containment and precise reactor geometry.\n\nNeutrons are not a byproduct. They are a currency.\n\nThey enable the refinement of [color=blue]deuterium[/color] [fluid=ei-deuterium], [color=blue]tritium[/color] [fluid=ei-tritium], and [color=blue]helium-3[/color] [fluid=ei-helium-3]—the fuels of high-stage fusion.\n\n[font=default-bold]Do not waste them.\nThey are born from reaction and harvested through geometry.\nBuild accordingly—or starve your star.[/font]

