[entity-description]
ei-sawblade-turret=A close-range electric saw turret. The black crown stays still while the grey blade ring rotates below it, turning the perimeter into a steel oath. Requires [color=cyan]electricity[/color] to function.
ei-emerald-apocalypse-hover-tank=A relic hover fortress suspended on emerald emitters. The barrel gathers pressure before firing; the charge leaves as plasma, recoil, and a green absence where certainty used to stand.
dw-deer-turret=A fixed-cone artillery rack with a long memory for bad angles. Keep the target past the dead zone and let the chassis make its argument.
ei-gatling-turret=A rotary hymn to attrition. It doesn’t shoot so much as declare: nothing crosses here. The barrels spin, the air turns to brass weather, and the ground learns a new language made of impacts. It will hold the line—at the cost of feeding it constantly.\nThis is not a weapon you “supply.”\nThis is a weapon you tithe to.\nRequires [color=cyan]electricity[/color] to function.
ei-auto-shotgun-turret=A compact, motor-driven twin-barrel turret built for ugly distances. It chews through shotgun shells at high cadence, flooding corridors and choke points with buckshot patterns that turn rushes into scrap. Fast target switching, aggressive tracking, and brute recoil compensation require [color=cyan]electricity[/color] to function, but the result is a relentless hailstorm of destruction that punishes any who dare approach.
ei-steampunk-lamp=Emits a [color=orange]warm[/color], flickering light by burning [color=green]kerosene[/color][fluid=ei-kerosene].\nConsumes fuel continuously.
ei-shotgun-turret=When distance fails, this is what answers.\nA close-range deterrent that does not warn, does not miss, and does not hesitate.\nAnything that reaches it has already made a mistake.
ei-copper-beacon=The first successful implementation of signal-phase synchronization under partial cryogenic constraint. The Subzero Phase Array Beacon represents a monumental step in localized field projection, leveraging liquid nitrogen to reduce entropy noise within production matrices.\nThis technology stabilizes elementary signal coherence across short-range manufacturing nodes, enabling synchronized productivity cycles without the chaotic phase interference typical in heat-laden environments. While limited in amplification capacity, it marks a critical foundation for true low-temperature signal engineering.\n[color=gray]“Freeze the noise. Stabilize the intent.”[/color]
ei-iron-beacon=Beyond mere subzero regulation, this advancement brings beacon arrays to the theoretical lower limit of thermal energy—approaching the irreversible edge of time-independent matter. The Absolute Zero Phase Array operates near the quantum lattice lock point, where matter exists solely to transmit intent.\nUtilizing reinforced thermal cores and dual-stage nitrogen cycling systems, these beacons can override ambient entropy fields, enabling productivity throughput with unparalleled purity. This is not a refinement. This is a severance—from heat, from interference, from compromise.\n[color=gray]“At absolute zero, even doubt cannot oscillate.”[/color]
ei-burner-quarry=An extreme-capacity extraction complex — optimized for maximum throughput and yield at the expense of local pollution. Consumes vast energy reserves and scars the terrain with an expansive excavation footprint. Operates at a [color=gray]54% resource yield gain[/color], stripping ore deposits with ruthless speed and maximal recovery.
ei-steam-quarry=An extreme-capacity extraction complex — optimized for maximum throughput and yield at the expense of local pollution. Consumes vast energy reserves and scars the terrain with an expansive excavation footprint. Operates at a [color=gray]54% resource yield gain[/color], stripping ore deposits with ruthless speed and maximal recovery.
ei-electric-quarry=An extreme-capacity extraction complex — optimized for maximum throughput and yield at the expense of local pollution. Consumes vast energy reserves and scars the terrain with an expansive excavation footprint. Operates at a [color=gray]54% resource yield gain[/color], stripping ore deposits with ruthless speed and maximal recovery.
ei-cannon-turret-mk1=Simple drilled barrel, raw firepower stripped of refinement.
ei-cannon-turret=Two barrels, one chassis. Twice the throughput, twice the noise.\n[color=gray]Rapid-fire mechanism and advanced targeting solution require[/color] [color=cyan]electricity[/color] [color=gray]to function.[/color]
ei-acidthrower-turret=Why waste precious oil on fire when you can melt your enemies straight to the bones? A grotesque cousin of the flamethrower, this contraption pressurizes [color=green]acid[/color] until it screams from the nozzle. The result: a mist so caustic it doesn’t burn—it erases. Structures corrode, carapaces dissolve, and what remains is best shoveled up quickly before it eats through the shovel too.
offshore-pump=An electric offshore pump. The old free draw is gone; the water answers only to a powered grid.
ei-burner-offshore-pump=An offshore pump driven by burnable fuel. It pushes full water throughput, but the shore remembers the smoke.
ei-steam-offshore-pump=A steam-fed offshore pump. Feed it live steam from the side and it will draw water at full pressure.
ei-burner-inserter=This inserter burns fuel to move items. Can pull [color=orange]burnable fuel[/color] from machines it extracts from.
ei-camp-fire=Barely a beacon, more a stubborn candle that refuses to die. This camp-fire contraption offers light not through brilliance, but through sheer audacity—burning whatever you feed it, then asking politely for more.
ei-bio-reactor=A living reactor powered by conscious tissue.\nNot corpses—still-thinking biomass.\nNeural lattices grown like tumors, stretched across bone scaffolds, kept alive just enough to dream in cycles.\nIt doesn’t burn fuel—it burns identity.\nPain is converted to voltage. Memory to entropy.\nEvery scream is a feedback surge. Every prayer, a voltage spike.\nThe hungrier it gets, the more lucid the minds inside become.\n[color=gray]Requires[/color] [color=purple]0.1/s Bio matter[/color][item=ei-bio-matter] [color=gray]to function.[/color]
ei-warp-beacon=[color=purple]Unaffected by beacon overload.[/color]\n[color=gray]Requires 60[item=ei-bio-matter]/s to function.[/color]
ei-alien-beacon=[color=purple]Unaffected by beacon overload.[/color]\n[color=gray]Requires 30[item=ei-bio-matter]/s to function.[/color]
ei-exotic-assembler=Where conventional fabricators arrange atoms by rote, the Exotic Assembler bends matter into configurations that should not exist. By channeling the same quantum-plasma principles that power heavy weaponry, it forges relic-tier components: alloys beyond metallurgy, circuits laced with vacuum resonance, artifacts whose very geometries hum with forbidden symmetry.\nThe Assembler’s core reaction chamber is [color=red]violently unstable[/color], each quantum collapse threatening to bloom into a detonation rivaling its own creations. Only by surrounding it with [color=purple]Matter Stabilizers[/color]—a lattice of gravitational dampers and entropic siphons—can its volatility be barely constrained. [color=gray]Volatility chance per second is 12% - (Quality - 1)% which can be mitigated by surrounding Matter stabilizers.[/color]
ei-plasma-turret=A relic-grade weapon platform engineered to harness the volatile elegance of contained starfire. Instead of crude projectiles, the turret channels plasma through quantum-stabilized coils, condensing raw stellar energy into a dense orb of violet brilliance.
ei-high-temperature-reactor=Beyond the threshold of conventional energy, the High-Temperature Reactor stands as a crucible of raw power and relentless flux. Drawing its infernal breath from an external nuclear reactor, it channels external heat with surgical precision into its molten heart. Within this blazing forge, an inserted fissile fuel rod ignites a symphony of atomic dance, multiplying thermal output into torrents of superheated lead coolant.
ei-beacon=Once the pinnacle of synchronized field projection, this beacon model now staggers beneath the weight of its own legacy. Its emission lattice is coarse, its phase harmonics outmoded—yet it endures, still pulsing signal into a world that no longer listens.\nConstructed in an era when throughput was god and resonance was brute-forced, it now functions more as artifact than instrument. Its core struggles to maintain coherence, barely skimming regulatory thresholds before collapse.\nStill, it counts. It *remembers*. And in the tally of overload, its burden is tallied all the same.\n[color=gray]“Ghosts of efficiency haunt even the rusted scaffold.”[/color]\nCounts as [color=orange]1[/color] beacon toward overloads.
ei-mechanical-inserter=Moves with the grace of a wind-up god. No wires. Just will.\nSprung from simple genius—rotates forever if you don't question the math.
ei-mechanical-long-inserter=Long arm of thermodynamic denial. It's not magic—it’s balance.\nCarries across distances with polite defiance of entropy.
zeus-wrath-zeus-turret_alt=Anchored to no land and sworn to no god, the Poseidon Installation channels the forgotten charge beneath all oceans. It calls down skyfire from orbit—judgment rendered through the air, not by it. Once placed, it does not guard—it [font=default-bold]warns[/font] the world: a storm is watching.
ei-cargo-bot=Monumental. Stoic. Carries the spine of the factory.\nMoves like it was never meant to stop.
ei-construction-bot=Precise. Kinetic. Hits the build site before the signal decays.\nIt doesn’t build—it pierces reality with structure.
ei-advanced-logistic-bot=Silent. Far-reaching. Faster than thought.\nIt crosses distances you didn’t know existed—and returns with payload.
ei-advanced-construction-bot=Not a builder—a memory engine.\nDesigns are not constructed. They are remembered into existence.
nuclear-reactor=Uses uranium fuel rods or fuel cells to generate heat. The heat output does NOT increase when built next to other reactors.
ei-crystal-accumulator=The crystal radiates energy. It remains unstable under sustained use, and mining it usually leaves a broken shell behind. Selecting or opening it reveals a resonance readout.
ei-crystal-accumulator-gaia=The crystal radiates energy. Gaia has resolved it into a stable shell. Selecting or opening it reveals a resonance readout.
ei-auric-fumarole=A Vulcanus vent that carries gold already dissolved in superheated vapor and brine. A carbide precipitation core wakes the throat, chokes the grit, and leaves auric slag behind before the seam seals again.

[fluid-description]
ei-auric-vapor=Superheated vapor carrying dissolved gold and mineral trace. Once filtered through a carbide precipitation core, it yields heat-rich steam and the auric slag the crust was hiding in the first place.
ei-computing-power-chemical=Data gathered from simulations destabilized by the residue’s interaction with observer perception. It’s not just chaos—it’s subjective contradiction encoded in semiotic waveforms. Useful in modeling minds that no longer require material anchors.
ei-computing-power-organic=The data is scraped from dying biospheres, real or fabricated, collapsing under the weight of recursive life-death loops. Every cycle produces entropy-mirroring outputs useful for extreme planetary modeling and post-biological terraformation logic.
ei-computing-power-stone=The simulator extracts value by suffering the ore’s refusal to behave. Results include simulations of warped density, reversed inertial flow, and impossible object trajectories—crucial for FTL barrier modeling and pre-big-bang physics prototypes.
ei-computing-power-uranium=When simulated, the ghost-shell injects death-phase cosmology into the environment—producing data from disintegrating star cores, failed entropy inversions, and timelines where the universe folds in on itself prematurely.
ei-computing-power-petrified=Extracted from paradoxes under strain. The fossil’s presence forces simulations to fold over past iterations, producing recursive error vectors. The output is a high-fidelity composite of all failed futures—and their collapse signatures. Useful for forecasting collapse or engineering stable paradoxes.
ei-computing-power-scrap=Contains false transmissions from unreachable futures, alternate timelines, or fully dead civilizations. The simulation can’t parse them without breaking. The errors themselves become raw data—quantifiable in chaotic bit-collapse. Essential for weaponizing information theory.

