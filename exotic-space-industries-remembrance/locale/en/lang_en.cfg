menu_auric_fumarole=Auric precipitation fumaroles
title_auric_fumarole=Auric precipitation fumaroles
auric-fumarole=Auric precipitation fumarole
auric-fumarole-text=Vulcanus remembers where the wound may reopen; the rules below are literal, not symbolic.\n\n[font=default-bold]Where they can appear:[/font] Auric fumaroles are Vulcanus-only. They can spawn only in outer danger chunks, only on volcanic non-lava ground, and only when the center is at least 64 tiles from another auric fumarole and 32 tiles from a sulfuric-acid geyser.\n\n[font=default-bold]First appearance:[/font] When an eligible danger chunk is generated or backfilled, it gets a 12% immediate eruption attempt. If that attempt does not produce a fumarole, the chunk enters the dormant registry.\n\n[font=default-bold]Yield and life:[/font] Each fumarole spawns with 4000-8000 yield. If nobody taps it, it self-seals after 45 minutes. Once tapped, it stays until depleted. After sealing or depletion, the chunk cools for about 60 minutes plus a small deterministic jitter, then becomes dormant-eligible again.
auric-fumarole-2=Spawn discipline and rescan
auric-fumarole-text-2=[font=default-bold]Dormant schedule:[/font] Every 30 seconds the script rechecks up to 6 dormant chunks globally. A serviced chunk rolls a 0.25% eruption chance.\n\n[font=default-bold]Local suppression:[/font] One nearby active auric fumarole within 6 chunks cuts that dormant chance to 35% of normal. Two or more nearby active fumaroles suppress the dormant eruption entirely until the area cools.\n\n[font=default-bold]Keepalive rule:[/font] If Vulcanus spends 10 minutes with no active auric fumaroles at all, the scheduler begins forcing up to 2 dormant keepalive attempts per pulse until one vent returns.\n\n[font=default-bold]Blocked centers and rescan:[/font] Backfill and dormant spawns almost always refuse occupied centers; only a 2% breach roll will destroy colliding player structures and punch through. The /ei-auric-fumarole-rescan command works on Vulcanus only and re-registers generated Vulcanus chunks for dormant and backfill review.


