[map-gen-preset-description]
default=*CHANGE ME* Default map generation preset. [color=red]This preset is not recommended[/color] for playing Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].
ei-default=The recommended way to play Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]. Your journey begins on Nauvis, where all core resources and early infrastructure are located.\nThis is the cradle—scarred, familiar, and limited.\nEnemy escalation on Nauvis is tempered in the opening ages: the starting buffer is broader, early evolution is slower, and the grace ends at the Age of Electricity.\nEndgame materials and advanced systems await on a separate surface, unlocked later through progression.\nYou will leave the world you know.\n[font=default-bold]You will not return the same.[/font]


