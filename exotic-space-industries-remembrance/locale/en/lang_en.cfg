ages-and-tech=Ages of technology
ages-and-tech-text=Exotic Industries does not price research as a flat vanilla ladder. The mod builds research cost from a [font=default-bold]start price[/font], a [font=default-bold]curve form[/font], and a named [font=default-bold]ceiling[/font], then spreads that pressure across the full technology list. [font=default-bold]linear[/font] stays even, [font=default-bold]quadratic[/font] eases in and bites harder later, [font=default-bold]exponential[/font] stays soft early and spikes late, and [font=default-bold]age-ramp[/font] pushes most of the weight into the later ages.\n\nAge gates still decide when whole branches become legal, but scaling decides how sharply narrow rushing is punished. It still respects the tech-weighting library, so discounted technologies count less.
tech=Technology cost scaling
tech-text=Exotic Industries does not price research as a flat vanilla ladder. The mod builds research cost from a [font=default-bold]start price[/font], a [font=default-bold]curve form[/font], and a named [font=default-bold]ceiling[/font], then spreads that pressure across the full technology list. [font=default-bold]linear[/font] stays even, [font=default-bold]quadratic[/font] eases in and bites harder later, [font=default-bold]exponential[/font] stays soft early and spikes late, and [font=default-bold]age-ramp[/font] pushes most of the weight into the later ages.\n\nAge gates still decide when whole branches become legal, but scaling decides how sharply narrow rushing is punished. It still respects the tech-weighting library, so discounted technologies count less.
tech-2=What the startup settings control
tech-text-2=[font=default-bold]Start price[/font] is the individual science pack cost near the beginning of the curve. [font=default-bold]Ceiling[/font] chooses the intended per-pack band near the far end, from Sunday stroll through Very Expensive. [font=default-bold]Curve form[/font] now also includes [font=default-bold]age-ramp[/font], which shifts more of the cost into the later ages, while [font=default-bold]additional multiplier[/font] still scales the final result after the curve is evaluated.\n\nIf the chosen ceiling would otherwise run into Factorio's [font=default-bold]x1000[/font] multiplier cap, ESIR now automatically raises the hidden effective base start price so the higher ceiling remains reachable.\n\nIf you want to rebalance EI, use these internal settings instead of vanilla research multipliers. The mod expects to own this part of progression, and vanilla multipliers do not describe the same shape.
tech-3=Practical limits and live changes
tech-text-3=The named ceiling is not an absolute guarantee on its own. Factorio caps the internal research-price multiplier at [font=default-bold]x1000[/font], so the real in-game ceiling is still tied to your chosen [font=default-bold]start price[/font]. ESIR now automatically raises the hidden effective base start price when needed so a higher ceiling can still be represented.\n\n[font=default-bold]Additional multiplier[/font] is still the safest value to change mid-save. Changing [font=default-bold]start price[/font] or [font=default-bold]curve form[/font] after a run has begun can still cause undesirable or unexpected results.
tech-output=Current Age progress
tech-output-text=The next Age awaiting activation is [font=default-bold]__3__[/font]. At current [font=default-bold]__1__ / __2__[/font] percent of the necessary knowledge has been unveiled to progress through the threshold.\n\n[font=default-bold]Advance, or remain bound to the past.[/font]


world-gen-related=World related information
world-gen-related-text=This section outlines the world-generation systems introduced by the mod. It is divided into focused subcategories for structural clarity.\n\nAccess them via the menu on the left.\nThese are not cosmetic changes.\nThey define terrain, resource behavior, and spatial logic at the foundational level.\n\n[font=default-bold]Understand the layer, or be shaped by it.[/font]


crystal-accumulator-resonance=Crystal accumulator resonance
crystal-accumulator-resonance-text=Crystal accumulators are not ordinary batteries. They are alien resonance shells seeded into generated relic clusters, and the useful way to read them is through [font=default-bold]load[/font] and [font=default-bold]coherence[/font], not a simple on/off toggle.\n\nIn the live runtime, [font=default-bold]load[/font] is a resonance proxy: it blends averaged surface output for the current shell and quality with the local strain inside that specific crystal. Read it as lattice pressure, not as a literal per-entity watt meter.\n\nIn the current live shell ladder, the unstable profile can sit at a [font=default-bold]4 MW low shell[/font], a [font=default-bold]7.5 MW base shell[/font], or a [font=default-bold]10 MW surged shell[/font]. Gaia resolves the same geometry into a [font=default-bold]15 MW Gaia shell[/font]. Offline husks sit outside that ladder entirely until repaired.
crystal-accumulator-resonance-2=Nauvis profile
crystal-accumulator-resonance-text-2=Nauvis is the explicit grounded profile for the unstable shell. When you discover or place [item=ei-crystal-accumulator] there, read it as the baseline resonance case: productive, alien, and never quite settled.\n\nThe shell may drift between low, base, and surged rungs, but it remains the same unstable class. Nauvis is not the cure. It is the reference wound.
crystal-accumulator-resonance-3=Other surfaces and orbit
crystal-accumulator-resonance-text-3=Outside Nauvis, treat non-Gaia planets and orbital platforms as foreign-profile space. The unstable shell can still operate there, but it does not gain stability simply by leaving its point of discovery.\n\nGaia is the exception. There the same chassis resolves into [item=ei-crystal-accumulator-gaia]the stable crystal accumulator, doubling base output from [font=default-bold]7.5 MW to 15 MW[/font] and lifting the whole shell ladder with it.
crystal-accumulator-resonance-4=Quality is not coherence
crystal-accumulator-resonance-text-4=Do not confuse [font=default-bold]quality[/font] with [font=default-bold]resonance profile[/font]. Quality is the usual item layer; low shell, base shell, surged shell, Gaia shell, and offline husk are shell states this page is documenting.\n\nIf a crystal item carries quality, that does not replace the load/coherence read. The page legend is about how the lattice is singing, not how finely the item rolled.
crystal-accumulator-resonance-5=Mining and repair
crystal-accumulator-resonance-text-5=Crystal accumulators are relics first and equipment second. Mining an unstable shell should be read as a violent break in coherence: the safe expectation is a broken body, not a clean relocation. The off-state shells [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] persist until a [item=ei-crystal-accumulator-repair]repair kit is dragged across them.\n\nAlt-selecting with the repair tool inspects crystal accumulators and husks without spending the kit. Dragging it normally performs the repair. If that restoration happens on Gaia, the surface resolves it immediately into the stable variant.
crystal-accumulator-resonance-6=UI legend
crystal-accumulator-resonance-text-6=[font=default-bold]Low shell[/font]: coherence is damped and output sits below the base rung.\n[font=default-bold]Base shell[/font]: the unstable chassis is holding its default 7.5 MW band.\n[font=default-bold]Surged shell[/font]: output is above base and the lattice is under strain.\n[font=default-bold]Gaia shell[/font]: Gaia has resolved the same chassis into the stable 15 MW rung.\n[font=default-bold]Offline husk[/font]: inert artifact body awaiting repair.\n\nCrowding reads the nearby shell chorus as [font=default-bold]Clear -> Crowded -> Strained -> Chaotic[/font]. Read the ladder in that order and the crystal stops looking random.
crystal-accumulator-resonance-text-7=Alt-select with [item=ei-crystal-accumulator-repair] to inspect crystal accumulators and husks without spending the kit. Drag the tool normally only when you actually want to repair.\n\nThe telemetry line reads either [font=default-bold]Surface output + strain[/font] or [font=default-bold]Strain fallback[/font]. Crystals with the same shell and quality on the same surface share that averaged surface-output term; local strain is what still separates a depleted shell from its sibling.

resources=New resource system
resources-text=Exotic Industries implements a restructured resource system. Traditional ore patches are no longer the sole method of acquisition—resources are now divided into distinct categories, each governed by its own logic, production flow, and spatial behavior.\nExtraction is no longer trivial.\n[font=default-bold]Acquisition requires adaptation.[/font]\nUnderstand the category, or produce nothing.

stone=Stone
stone-text=Stone is the most abundant resource in the system. It can be extracted conventionally from surface patches, but Exotic Industries expands its acquisition pathways:\n\n[color=orange]Surface harvesters[/color] [item=ei-burner-surface-harvester] allow for deep extraction from any terrain.\n\n[font=default-bold]Manual collection remains possible, though inefficient.[/font]\nStone is everywhere.\nEfficiency is optional. Output is not.

surface-patches=Surface patches
surface-patches-text=The surface of Nauvis is not uniform. Around the landing zone, the crust is still held together as a protected industrial reserve: [item=ei-poor-iron-chunk]iron, [item=ei-poor-copper-chunk]copper, [item=coal]coal, [item=stone]stone, and nearby [fluid=crude-oil]pressure remain strong enough to found first industry.\n\nBeyond that cradle, the surface breaks apart. [item=ei-poor-iron-chunk]Iron, [item=ei-poor-copper-chunk]copper, and even [item=ei-poor-uranium-chunk]uranium survive mostly as shallow remnants, fracture belts, and exhausted scar fields. They are real, but they are not a durable metal economy.\n\nCoal, stone, and oil remain the working skin of Nauvis. Use the reserve to establish heat, belts, and chemistry. Then read the land correctly, or the crust will lie to you.

veins=Deep ore veins
veins-text=Ore veins are inaccessible at the start. They require [color=orange]Deep Drills[/color] [item=ei-deep-drill], a mid-game extraction system built for vertical yield.\n\nThese veins no longer spawn as generic rarity rolls. Structural metals follow [font=default-bold]metal belts[/font] and [font=default-bold]sedimentary basins[/font] across Nauvis: [item=ei-iron-chunk]iron and [item=ei-copper-chunk]copper favor ridge-country, while [item=ei-coal-chunk]coal and [item=ei-sulfur-chunk]sulfur pool in lower basin terrain.\n\n[font=default-bold]Hydrothermal frontiers[/font] carry [item=ei-lead-chunk]lead and [item=ei-gold-chunk]gold beyond the protected starting region. [font=default-bold]Outer scarlands[/font] hold [item=ei-uranium-chunk]uranium, and only the rarest anomaly pockets inside those broken zones expose [item=ei-neodym-chunk]neodymium.\n\nCritical materials—including uranium, lead, gold, neodymium, and immersite—exist only in these deep layers.\nThey are not optional.\nThey are structural.\n\n[font=default-bold]Surface mining will not carry you to endgame.[/font] Drill, read the land, or stagnate.

chunk-grades=Poor chunks and rich chunks
chunk-grades-text=Not all chunks are equal. [item=ei-poor-iron-chunk]Poor iron and [item=ei-poor-copper-chunk]poor copper are shallow, contaminated scraps left in the broken upper crust. They are meant to start an industry, not sustain one. Their low grade shows immediately at the furnace: [font=default-bold]3 poor chunks -> 1 plate[/font], and they throw off far more slag.\n\n[item=ei-iron-chunk]Iron chunks and [item=ei-copper-chunk]copper chunks from deep veins are the real ore body. Even before any further processing, [font=default-bold]3 proper chunks -> 2 plates[/font] with a much lower slag burden. [item=ei-poor-uranium-chunk]Poor uranium follows the same rule: the surface only hints at it, but real [item=ei-uranium-chunk]uranium belongs to the deep layers.
chunk-refining=Purifier and pure ore
chunk-refining-text=The [item=ei-purifier]Purifier is the first machine that truly upgrades chunk quality instead of merely accepting it. It washes [item=ei-iron-chunk]iron chunks and [item=ei-copper-chunk]copper chunks with [fluid=water]water, converts them into [item=ei-pure-iron]pure iron or [item=ei-pure-copper]pure copper, and returns [fluid=ei-dirty-water]dirty water that you must deal with.\n\nThat extra step pays for itself. [font=default-bold]3 poor chunks -> 1 plate[/font], [font=default-bold]3 proper chunks -> 2 plates[/font], but [font=default-bold]1 pure ore -> 2 plates[/font] with only about a [font=default-bold]1% slag chance[/font]. Deep chunks begin a real metal economy; purification makes it dense, clean, and industrial.
chunk-refining-2=Arc furnace and plasma heater
chunk-refining-text-2=The [item=ei-arc-furnace]Arc furnace turns chunk processing into full metallurgy by melting chunks, pure ore, plates, and parts into [fluid=ei-molten-iron]molten iron and [fluid=ei-molten-copper]molten copper for casting chains. It can consume poor chunks if it must, but the numbers explain why you should not stop there: [font=default-bold]3 poor chunks only become 15 molten metal[/font], while [font=default-bold]1 pure ore becomes 40[/font] with almost no slag.\n\nThe [item=ei-plasma-heater]Plasma heater continues that path in the Quantum Age. It can still run the arc-furnace metal recipes while also unlocking extreme-temperature gas and plasma processing. The purifier improves the feedstock, the arc furnace improves the metallurgy, and the plasma heater carries that same chain into the late game.
mining-scars=Mining scars
mining-scars-text=Depleting a deposit no longer leaves the terrain untouched. Exotic Industries can scar nearby ground when extraction finishes, but only for [item=ei-burner-quarry], [item=ei-steam-quarry], [item=ei-electric-quarry], and the [item=big-mining-drill].\n\nEach depletion event can seed a small scar patch at a random offset near the exhausted deposit. The effect is terrain damage, not a bonus resource pulse.
mining-scars-2=Planetary degradation
mining-scars-text-2=Scars degrade tiles along planet-specific chains: Nauvis grass collapses into dirt and sand, Fulgora rock sloughs into sand, dust, and dunes, Gleba rots, Vulcanus chars, and Aquilo compacts snow and ice. Water tiles and hidden tiles are ignored, and matching decoratives are stripped away.\n\nTreat the scars as the map remembering what you took from it.

asteroid-variants=Differentiated asteroids
asteroid-variants-text=Exotic Industries adds six extra asteroid families on top of vanilla space debris: [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk], and [item=ei-scrap-asteroid-chunk]. They are layered into planetary routes, crushed in the [entity=crusher], and all twelve basic and advanced EI asteroid recipes benefit from [font=default-bold]asteroid productivity[/font].\n\nThe crusher is also expanded with fluid ports and a larger result inventory so these mixed outputs fit.
chemical-asteroid=Chemical asteroids
chemical-asteroid-text=Unlocked through [font=default-bold]planet discovery: Aquilo[/font]. Basic and advanced crushing pull [fluid=ammonia], [item=ei-fluorite], and [fluid=fluorine] from the chunk, while the advanced recipe can additionally roll [fluid=lithium-brine]. Their rare anomaly is [item=ei-neuro-reactive-residue].
organic-asteroid=Organic asteroids
organic-asteroid-text=Unlocked through [font=default-bold]planet discovery: Gleba[/font]. Basic crushing consumes [fluid=water] and yields [item=spoilage], [fluid=ei-bio-sludge], and [fluid=ei-ammonia-gas]. The advanced pass adds [item=nutrients] and can return [item=yumako], [item=jellynut], [item=ei-bio-matter], and even a rare [item=pentapod-egg]. Their anomaly is [item=ei-sporeglass-heart].
rock-asteroid=Rock asteroids
rock-asteroid-text=Unlocked through [font=default-bold]planet discovery: Vulcanus[/font]. The basic recipe is mostly [item=stone]. The advanced recipe opens the richer mineral layer: [item=tungsten-ore], [item=calcite], and [item=ei-gold-chunk]. Their anomaly is [item=ei-gravity-braided-ore].
uranium-asteroid=Uranium asteroids
uranium-asteroid-text=Unlocked as soon as [font=default-bold]space platform[/font] research gives access to the differentiated field. Both recipes consume [fluid=sulfuric-acid]. In return they yield [item=stone], [item=ei-uranium-chunk], and [item=ei-lead-chunk], with the advanced recipe spending more acid for a much stronger uranium return. Their anomaly is [item=ei-isotopic-ghost-shell].
petrified-asteroid=Petrified asteroids
petrified-asteroid-text=Also unlocked with [font=default-bold]space platform[/font]. Basic crushing gives a strange mix of [item=wood], [item=raw-fish], [fluid=ei-liquid-nitrogen], and [fluid=ei-liquid-oxygen]. The advanced pass adds [item=bioflux] and [fluid=fluoroketone-cold], improving biological rolls and even allowing a small chance at [item=biter-egg]. Their anomaly is [item=ei-chrono-fossil-shard].
scrap-asteroid=Scrap asteroids
scrap-asteroid-text=Unlocked through [font=default-bold]planet discovery: Fulgora[/font]. These recipes are wired into the scrap recycling table, so crushing them becomes a salvage stream rather than a single-output ore recipe. Both tiers keep their [item=ei-crushed-neodym] rolls, and both can rarely expose [item=ei-worm-torn-relay-core].\n\nIf you want orbital junk turned into factory stock, this is the route.
asteroid-anomalies=Anomalies into space data
asteroid-anomalies-text=Each differentiated asteroid family hides one anomaly. Those six anomaly items feed specialized [entity=ei-computer-core] recipes, become data cards in the simulator, and are finally recombined into [item=ei-space-data] in zero gravity through the [entity=ei-quantum-computer].\n\nThe asteroid field is not just raw material. It is a second research frontier.

fulgora-day-variation=Fulgora day length variator
fulgora-day-variation-text=Fulgora does not keep a fixed day length. At the start of each cycle the mod rerolls [font=default-bold]the day-night cycle length[/font] using the startup minimum and maximum multipliers. At default settings that means every Fulgora day can land anywhere between [font=default-bold]10% and 200%[/font] of the standard cycle length.
fulgora-day-variation-2=When rerolls apply
fulgora-day-variation-text-2=The reroll tries to happen during a bright, stable-light window so the surface does not snap into a new cycle length during heavy darkness. If Fulgora never offers a safe window, a failsafe forces the change after roughly one standard day anyway.\n\nThe startup settings define the envelope. Each actual day picks its own random length inside it.

artifacts=Alien artifacts
artifacts-text=Scattered across the world are remnants of an ancient civilization—one that harnessed exotic matter long before your arrival. Their artifacts remain, embedded in the terrain, partially buried, partially alive.\n\nSome are inert.\nSome still function.\nNone are accidental.
actifacts-text-2=They were not placed. [font=default-bold]They were left behind—deliberately or otherwise.[/font] Find them. Study them. Fear what they imply.

gate=Cross dimensional gate
gate-text=The Gate is a spatial transit structure that moves items through a controlled dimensional breach.\n\nEach gate binds to receiver IDs instead of raw surface positions. The source console selects a receiver, the receiver anchor claims an ID, and circuit signals can override route selection or arming when needed.\n\nTransit cost now depends on both burden and span. Same-surface hops stay cheap, same-location cross-surface transfers still pay a meaningful floor, and moving-platform routes are priced from live route progress.\nThis is not a portal. [font=default-bold]It is a machine that remembers where it tears.[/font]
gate-2=Receivers and IDs
gate-text-2=Gate receivers are the destination anchors. Each one claims the lowest free positive ID for its force unless circuit signal [color=orange]I[/color] overrides it.\n\nDuplicate effective IDs conflict and cannot be used by either manual selection or [color=orange]signal-D[/color] until the conflict is resolved.\nSelecting a receiver in the gate console binds the gate to that receiver ID instead of a raw position.
gate-3=Gate wiring
gate-text-3=Control input is read from the source side.\nWiring the visible gate body reaches the hidden source-side container for control input.\nThe signal row below shows what the gate reads.\n\nControl priority is simple:\n[color=orange]signal-D[/color] chooses the destination.\n[color=orange]signal-E[/color] arms or disarms that chosen route.\nReceiver-side [color=orange]signal-I[/color] changes a receiver's effective ID.\n\nA valid [color=orange]signal-D[/color] always overrides manual receiver selection.\nIf [color=orange]signal-D[/color] does not resolve to a valid receiver, the gate falls back to the console's manual receiver; [color=orange]signal-E[/color] still overrides armed or disarmed when it is nonzero, otherwise the manual state applies.\nThe visible gate body is therefore still enough for control-only wiring when you do not need telemetry.\nIf [color=orange]signal-E[/color] is absent or zero while a clean [color=orange]signal-D[/color] route resolves, the gate arms that route by default.
gate-control-signals=Control signals read by the gate
gate-4=Gate telemetry
gate-text-4=The gate exports telemetry from the hidden [entity=ei-gate-circuit-interface].\nThe telemetry row below shows what it exports.\nThe visible body connector can still participate in control wiring through the hidden source-side container, but it is not a separate telemetry emitter.\n\nThe interface only updates while it is actually wired to an external circuit, and it refreshes at most once per second. If external wiring is removed, the telemetry output is cleared instead of lingering as stale data.\n\nWhen wired:\n[color=orange]ei-gate-active[/color] stays present and reads 0 or 1 depending on whether the gate is enabled, resolved, and above the low-power floor.\n[color=orange]ei-gate-stress[/color] stays present and reports stress on a 0-100 scale.\n[color=orange]ei-gate-energy[/color] reports stored energy in MJ, but drops out entirely at 0 MJ instead of emitting a literal zero.\n\nUse these signals to drive alarms, buffers, or control logic without paying a full combinator update every tick.
gate-telemetry-signals=Telemetry signals emitted by the gate
gate-5=Stress and residue
gate-text-5=Each successful transfer adds stress. Stress raises upkeep, lengthens cooldown, and can saturate a receiver if traffic is repeated too quickly.\n\nA gate that is disarmed or below the low-power floor refuses new insertion. Cooling and receiver saturation do not reject already accepted cargo; they only delay transfer until the breach settles or the receiver recovers.\n\nThe console marks active post-transfer lockout as [font=default-bold]Runtime: Cooling[/font], while [font=default-bold]Receiver strain[/font] mirrors the destination's current saturation. [font=default-bold]Runtime: Critical[/font] means stress has crossed the instability threshold and discharge risk is elevated.\n\nThe console's Transit Span bar shows the current route pressure. Same-surface transfers stay cheap, orbit-to-planet hops pay a large floor, and moving platform receivers use live route progress.\n\nAt sufficiently high stress, an actively holding gate can also lash outward with short electrical tendrils around the housing, damaging nearby entities.\n\nOveruse also produces [item=ei-breach-residue], a waste product of dimensional scarring. The gate first tries to leave that residue in the source or receiver inventories; only the excess spills out at the gate. It should be neutralized through the purifier chain before it becomes clutter.\nThe gate is for burst logistics, not for continuous freight.
gate-6=Legacy gates
gate-text-6=Legacy saves that still point at a chest or raw position continue to work until they are reconfigured.\nOnce a gate is assigned to a receiver, that receiver becomes the source of truth and the old raw destination remains informational only.\nThe console may still show that stored point as [font=default-bold]Legacy destination[/font] until it is replaced or cleared.\nThis preserves old saves while moving new setups to receiver IDs.
gate-7=Gate attunement
gate-text-7=Current startup attunement: [font=default-bold]__1__[/font]\n\nRecovered keeps the current gate progression.\nAttuned moves it deeper into alien age with steeper ingredients.\nResonant shifts it to late quantum progression.\nParadox shifts it to exotic age.\n\nAttunement changes where gate progression lands in the normal technology chain and how expensive the gate and receiver are to build. It does not change the gate's runtime behavior once constructed.

drone=Drone port
drone-text=A drone port that allows to take over and control a [color=blue]drone[/color][entity=ei-drone]. Placing this building will create an associated drone that can be shown, when clicking the port. From there one can "uplink" to the drone and steer it. The drone can fly over terrain, place and mine buildings, move items from and into its own inventory. However it is unable to fight. At any time you can decouple from the drone using [color=orange]EXIT[/color] or port it back to its station with its retrivial control [color=orange]RESET[/color]. Flying a drone through the gate will initiate transport.

repair=Artifact repair
repair-text=You can repair broken alien artifacts by making [color=blue]artifact repair packs[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. This allows you to use them again. Drag the repair kit over the artifact to repair it; the kit is consumed when the repair succeeds. Crystal accumulator kits can also be alt-selected to inspect crystals and husks without spending the kit.

alien=Ancient Alien data
knowledge-text=The ancient civilization that left behind the artifacts also left behind some of their data. 

new-logistics=New logistics
new-logistics-text=Exotic Industries expands the logistics layer with new systems, entities, and mechanics. These features are organized into distinct subcategories—not for convenience, but for [font=default-bold]structural clarity.[/font]\n\nAccess them through the menu on the left.\n\nMovement is no longer trivial.\n\nEvery route is a decision\n\nEvery flow is a design.\n\nEfficiency is [font=default-bold]earned.[/font]

train-progression=Train progression
train-progression-text-2=Trains become available early, during the Steam Age. Your first option is the [color=orange]Steam Locomotive[/color] [item=ei-steam-basic-locomotive]—capable of hauling items, but incapable of transporting fluids.\n\nProgress unlocks the [color=orange]Advanced Steam Locomotive[/color] [item=ei-steam-advanced-locomotive], which adds fluid transport capacity. Both models rely on burnable fuels such as coal or solid biomass, with the capacity for enhanced performance via Rocket, Nuclear, or Fusion fuels.\n\nEventually, pure brute force combustion in all its polluting glory may become a drawback. To operate cleaner and faster conventional rail, you transition into [color=brown]Diesel Fuel[/color] [item=ei-diesel-fuel-unit] and the [color=orange]Diesel Locomotive[/color] [item=locomotive].\n\nLogistics escalate with technology.\nFuel defines the frontier.\nTrains do not ask where—they demand what burns.\n\nWhen Gaia opens, rail diverges again into crystalline field logistics. That branch now has its own [font=default-bold]EM trains[/font] entry in this section, because it stops behaving like combustion rail and starts behaving like networked power infrastructure.
train-progression-text=Trains become available early, during the Steam Age. Your first option is the [color=orange]Steam Locomotive[/color] [item=ei-steam-basic-locomotive]—capable of hauling items, but incapable of transporting fluids.\n\nProgress unlocks the [color=orange]Advanced Steam Locomotive[/color] [item=ei-steam-advanced-locomotive], which adds fluid transport capacity. Both models rely on burnable fuels such as coal or solid biomass, with the capacity for enhanced performance via Rocket, Nuclear, or Fusion fuels.\n\nEventually, pure brute force combustion in all its polluting glory may become a drawback. To operate cleaner and faster conventional rail, you transition into [color=brown]Diesel Fuel[/color] [item=ei-diesel-fuel-unit] and the [color=orange]Diesel Locomotive[/color] [item=locomotive].\n\nLogistics escalate with technology.\nFuel defines the frontier.\nTrains do not ask where—they demand what burns.\n\nWhen Gaia opens, rail diverges again into crystalline field logistics. That branch now has its own [font=default-bold]EM trains[/font] entry in this section, because it stops behaving like combustion rail and starts behaving like networked power infrastructure.

em-trains=EM trains
em-trains-text=Gaia does not ask its late railways to burn. It asks them to couple. [item=ei_charger]EM chargers establish a crystalline field mesh over the rail path, and the [item=ei_em-locomotive]EM locomotive with its [item=ei_em-cargo-wagon]cargo and [item=ei_em-fluid-wagon]fluid wagons rides that mesh instead of feeding coal or diesel into a firebox.\n\nBecause motive force comes from the charger lattice rather than onboard combustion, the same rolling stock is usable on planetary lines and off-world corridors alike. Gaian engineers insist the crystals are not pushing against smoke, steam, or even air; they are remembering the rail's geometry and pulling the consist through that memory. Whether that is physics or liturgy, it survives the vacuum just fine.
em-trains-2=Quality, grace, and transfer efficiency
em-trains-text-2=Quality now matters on both sides of the link. Higher-quality [item=ei_charger]chargers reduce their own field upkeep by up to [font=default-bold]20%[/font] and improve transfer efficiency by another [font=default-bold]12%[/font]. Higher-quality [item=ei_em-locomotive]locomotives reduce the field power they demand by up to [font=default-bold]16%[/font]. These bonuses are normalized across the active quality ladder, so modded quality tiers scale cleanly between the lowest and highest available grades instead of assuming vanilla's exact steps.\n\nLocomotive quality also creates a [font=default-bold]grace window[/font] after leaving charger coverage. At maximum quality, field coherence can be preserved for up to [font=default-bold]480 ticks, or 8 seconds[/font]. Normal quality gets no grace at all. This is meant to bridge short gaps, rail seams, or brief routing mistakes—not to excuse building dead sections into the network.
em-trains-3=Research and field behavior
em-trains-text-3=The research families [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font], and [font=default-bold]ei_eff[/font] remain the main global multipliers. Speed and acceleration each add [font=default-bold]+10% per level[/font] up to [font=default-bold]+200%[/font]. Charger efficiency climbs through five tiers to as much as [font=default-bold]90% less network power burden[/font]. Local charger quality and local locomotive quality then stack on top of that global research when power is actually transferred.\n\nIn practice, good EM rail is built from both science and hardware. If coverage refreshes, the train keeps its field fuel topped up and runs like light on a wire. If coverage collapses, the system first spends any grace reserve and then the locomotive turns inert. Gaia forgives many things. A broken field is not one of them.

orbital-scanner=Orbital Logistics Scanner
orbital-scanner-text=The orbital logistics cohort starts with the [entity=ei-orbital-combinator]. Place scanners on the launch surface that owns the platforms you want to read. The scanner only mirrors platforms whose [font=default-bold]space location matches that same surface[/font]. Requests shows configured minima. On The Way shows cargo already committed. Need shows the remaining shortfall after in-flight cargo and current hub stock are subtracted.\n\nOrthogonally adjacent scanners still form one bank, split oversized output into continuation sections, emit [virtual-signal=ei-orbital-overflow] when the bank runs out of room, and draw [font=default-bold]750 kW[/font] each. Circuit wiring keeps the bank hot. If the bank is unwired, it still updates while the GUI is open; once the panel is closed, it falls back to sparse maintenance.
orbital-scanner-2=Transponders, selectors, and coordination
orbital-scanner-text-2=[font=default-bold]Cohort roles[/font]\n\n[entity=ei-platform-transponder] lives on the platform deck and assigns the stable numeric platform ID used by every downstream tool. Manual overrides are allowed, but duplicate IDs across different platforms stay in conflict until one is cleared.\n\n[entity=ei-orbital-selector] lives on the dispatch surface and nominates one target at a time. Manual mode uses a typed platform ID. Circuit mode reads [virtual-signal=ei-platform-id]. Policy mode nominates an unleased same-surface platform with positive Need.\n\n[entity=ei-orbital-coordinator] is the surface authority. Only one coordinator stays active per force and surface. It arbitrates leases so several launch lanes do not blindly serve the same platform.\n\n[entity=ei-orbital-dispatch-uplink] lives beside the rocket silo and republishes the leased mixed manifest for the factory to load. Open each cohort entity directly to use its side panel. The visible combinator pages are read-only telemetry, not the configuration surface.\n\n[font=default-bold]Panel controls[/font]\n\nThe transponder panel sets or clears a manual platform ID override. The selector panel changes selector mode and, in Manual mode, the target ID. The coordinator panel queues a cohort refresh and, for admins, a runtime rebuild. The uplink panel binds or clears a silo, can grab the nearest adjacent silo, and sets the oversize policy plus Threshold floor.
orbital-scanner-text-2b=[font=default-bold]Open the side panel first[/font]\n\nThe visible combinator pages are read-only telemetry. Open the side panel on the scanner or another cohort device to change settings, then use the legend below to read the top line, the middle lines, and the next-action hint.
orbital-scanner-3=Dispatch uplinks and hybrid loading
orbital-scanner-text-3=[font=default-bold]Startup sequence[/font]\n\n1. Place transponders on the platforms themselves.\n2. Place at least one selector on the dispatch surface, then give it a target with Manual, Circuit, or Policy mode.\n3. Bring one coordinator online on that same dispatch surface.\n4. Place uplinks beside rocket silos. Adjacency gives the first quick pick; use the uplink side panel to confirm, replace, or clear the binding, then choose the oversize policy that should hold the lane.\n\nThe cohort is live when a selector shows ready, the surface has one active coordinator, and an uplink has both a valid silo binding and a lease.\n\n[font=default-bold]Blocked states[/font]\n\nNo target means the selector still lacks a valid platform ID. No demand means the chosen platform currently has no remaining Need. Missing silo binding means the uplink is not locked to a real rocket silo. No active coordinator means the dispatch surface still lacks its single live coordinator.\n\nLoading stays hybrid in v1: inserters, trains, requesters, and lane circuits do the physical work. Sticky keeps oversized work leased across repeated rockets. Single Shot releases after one launch. Threshold continues only while remaining demand stays above the chosen floor, so the floor setting only matters in Threshold mode.
spidertron=Spidertron changes
spidertron-text=Compared to vanilla, the [font=default-bold]Spidertron becomes available earlier[/font]—in the Simulation Age. However, unlike its Nauvis counterpart, it is no longer a self-contained miracle. It requires fuel.\n\nAt first, burnable solids will suffice—coal, biomass, and similar materials will keep it crawling. But as you advance, nuclear and fusion fuels unlock significant bonuses to speed, acceleration, and operational range.\n\nThis is not just a vehicle. It is a [font=default-bold]platform for escalation.[/font]\n\nMods such as [color=green]Spidertron Patrols[/color] and [color=green]Constructron-Continued[/color] include special integration, adapting their systems to align with the modified Spidertron framework in Exotic Industries.\n\nThe Spider walks earlier. But it walks with purpose, weight, and demand.\n\nFeed it well—or [font=default-bold]fall behind.[/font]

cranes-and-belts=New belts and inserter cranes
cranes-and-belts-text=Exotic Industries introduces a new tier of logistics infrastructure: the [color=orange]Neo Logistic Belt[/color] [item=ei-neo-belt]. Constructed from high-tech materials, it offers an extreme throughput of [font=default-bold]90 items per second[/font]—exceeding all vanilla transport limits. These belts are engineered for endgame volumes and recursive-scale factories.\n\nIn addition, the mod adds [color=orange]Cranes[/color] [item=ei-big-inserter-normal]—massive, high-capacity inserters designed for bulk transfer.\n\nUse them to:\n\nRapidly unload trains\n\nBridge large inventory structures (e.g., chests ↔ warehouses)\n\nMaintain flow where standard inserters fail under pressure\n\n[font=default-bold]Speed is no longer a luxury.\nIt is the baseline.\nLogistics must scale with power, or break under it.[/font]

loaders=Loaders
loaders-text=EI loaders form the direct-feed branch of the logistics line: [item=ei-steam-loader]Steam loader, [item=ei-loader]Loader, [item=ei-fast-loader]Fast loader, [item=ei-express-loader]Express loader, [item=ei-turbo-loader]Turbo loader, and [item=ei-neo-loader]Neo loader. The Steam loader opens from Logistics on live steam; the standard electric Loader moves the chain into Automation. Every later step climbs the belt ladder, pushes harder throughput, and trades pressure first, then electricity, for a stronger bite.\n\nThey do not throw items through the air. They bind belt flow straight into machines, containers, wagons, and rail-side interfaces.\n\nIf inserter swing time is the weakness, loaders are the answer.
loaders-2=Stacking
loaders-text-2=[item=ei-steam-loader]Steam, [item=ei-loader]standard, and [item=ei-fast-loader]Fast loaders move unstacked items only. [item=ei-express-loader]Express loaders can move stacks up to [font=default-bold]2[/font], and that stack size can be adjusted. [item=ei-turbo-loader]Turbo loaders also stack up to [font=default-bold]2[/font]. [item=ei-neo-loader]Neo loaders inherit the game's full belt stack limit and can likewise be tuned downward when precision matters more than brute force.\n\nThat means upper loader tiers do not merely ride faster belts. They force denser bursts through the same tile footprint.
loaders-3=Filtering
loaders-text-3=[item=ei-steam-loader]Steam, [item=ei-loader]standard, [item=ei-fast-loader]Fast, and [item=ei-express-loader]Express loaders use [font=default-bold]one shared filter[/font] across both belt lanes. [item=ei-turbo-loader]Turbo and [item=ei-neo-loader]Neo loaders gain [font=default-bold]two lane filters[/font] with separate control for each side of the belt.\n\nAt that point one loader body can decide not only what passes, but which lane receives it.
loaders-4=Snapping and placement
loaders-text-4=EI loaders automatically [font=default-bold]snap toward a valid connection[/font] when placed, and they reconsider that binding when nearby belts change. They test real links to belts, containers, wagons, and rail-side placements instead of trusting the first cursor rotation blindly.\n\nIn practice, a loader placed against a wagon, chest, machine, or rail-side interface may rotate or flip its flow direction so the connection actually locks. The machine follows the true bind, not the first guess.
loaders-5=Power appetite
loaders-text-5=[item=ei-steam-loader]Steam loaders require [font=default-bold]live steam[/font] through their fluid input. The electric line begins with [item=ei-loader]Loader: every moved item draws from an internal energy buffer, and each later tier raises both the buffer and the per-item demand. Higher tiers are stronger, not cheaper.\n\nAn electric loader can survive a brief brownout on stored charge, but it cannot hold peak throughput for long without a live grid behind it. If power starves, throughput fails before the machinery does.
bots=More bots
bots-text=Remembrance does not wait for clean electric logistics before putting machines in the air. Bot progression begins in the [font=default-bold]Steam Age[/font] with [item=rp-steam-roboport], [item=rp-steam-logistic-bot], and [item=rp-steam-construction-bot], then matures later into heavier and more advanced electric swarms.\n\nThe result is an unusually early relationship with aerial automation: crude first, elegant later.
steam-bots=Steam bots
steam-bots-text=These are not polished electric drones. They are brass-bodied worker spirits held aloft by pistons, pressure, and rough calculation, the first airborne servants of an industry that still smells of hot metal and wet steam.\n\nBecause the steam roboport line sits in the [font=default-bold]Steam Age[/font] and later vanilla robotics are patched behind it, you gain flying logistic and construction help far earlier than a normal run would allow.
steam-bots-2=Boiler-blood and failure
steam-bots-text-2=The bargain is endurance. Steam bots do not carry a bottomless electrical reserve; they fly on stored pressure and must return to a roboport before it runs dry. If their steam runs out in transit, they [font=default-bold]fall out of the sky[/font] instead of gracefully waiting for rescue.\n\nSteam roboports push them to seek recharge early, but long jobs, congested ports, and overextended networks can still turn early convenience into wreckage.
bots-2=Later bot lines
bots-text-2=Once the factory reaches full electric robotics, EI expands the swarm with heavy cargo bots for bulk hauling, heavy construction bots for aggressive build bursts, and later advanced variants with higher speed, range, durability, and task focus. The [font=default-bold][color=orange]Advanced Roboport[/color][/font] supports that later network with faster charging, more bot slots, and a wider working radius.\n\nThis is not just a drone network. [font=default-bold]It is a mechanized swarm protocol.[/font]


new-mechanics=New gameplay mechanics
new-mechanics-text=Exotic Industries introduces a wide array of new mechanics—each one altering the foundational logic of gameplay.\n\nThese systems are divided into focused subcategories for structural clarity.\nYou can navigate them using the menu on the left.\n\n[font=default-bold]These are not optional layers.[/font]\n\nThey are the new physics of the world.\n\nStudy them, or [font=default-bold]be dismantled by them.[/font]


beacon-overhaul=Beacon overhaul
beacon-overhaul-text=Exotic Industries imposes strict limits on beacon influence: a machine can be affected by a maximum of 4 beacons. [font=default-bold]The era of infinite stacking is over.[/font]\n\nIn addition, beacons beyond the first now require cooling fluid [fluid=ei-liquid-nitrogen] to operate. Without it, they overheat and shut down. Electricity is no longer the source of functionality—logistics must support thermodynamic stability.\n\nTo compensate, beacons have been structurally upgraded:\n\nIncreased module capacity\nIntroduction of an Improved Beacon\nCounts as 2 beacons toward the cap\nHolds even more modules\nDemands more infrastructure\n\n[font=default-bold]Amplification is no longer trivial.[/font]\nIt is a mechanical discipline.\nBuild with precision—or [font=default-bold]fall into inefficiency.[/font]

specialised-pipes=Specialised pipes and data cables
specialised-pipes-text=Remembrance treats fluid carriers as containment hardware, not interchangeable plumbing.\n\n[color=orange]Insulated pipes[/color] keep cryogenic, thermal, and chemically hostile fluids stable. [color=orange]Data cables[/color] carry [color=blue]simulation substrates[/color] [fluid=ei-computing-power] and are not general-purpose fluid lines: feed them ordinary chemistry and the conduit shorts out.\n\nWhen you choose a carrier, you are choosing what kind of failure the line is allowed to survive.
specialised-pipes-2=Failure classes
specialised-pipes-text-2=Uninsulated pipes, underground segments, elevated lines, and tanks do not all fail the same way. [fluid=ei-liquid-nitrogen]Liquid nitrogen and [fluid=ei-liquid-oxygen]liquid oxygen boil off back into gas in ordinary plumbing. [fluid=ei-heated-helium-3]Heated process fluids and lava rupture hot. Fluoroketones and electrolyte break lines with chemical discharge.\n\nTanks can throw a heavier rupture than a simple line segment, while elevated pipes keep their footprint tighter and avoid broad deck contamination.
specialised-pipes-3=Containment discipline
specialised-pipes-text-3=Insulated pipes still ignore the usual pipe-heating requirement. The insulated pipe, underground, and tank prototypes all use [font=default-bold]0 heating energy[/font], so they do not need external heat to avoid freezing on Aquilo or any other cold surface.\n\nUse them when fluids must stay exactly as prepared: cold liquids remain cold, reactive mixtures stay contained, and specialist lines survive where ordinary plumbing would vent, short, or burst.
specialised-pipes-4=Signatures and monitoring
specialised-pipes-text-4=Rupture aftermath now depends on both the carrier and the contaminant. In mixed segments, the breach follows the contaminant that actually threatens the carriers present, even when that fluid is not the largest share. Data failures arc and short, cryogenic failures vent frost, thermal failures scorch hot, and chemical failures spit mist or corrosive discharge. Data cables stay fireless even when the contaminant is thermal or chemical, while elevated pipes keep the blast local. Repeated same-segment failures are throttled so one bad line does not flood the screen with duplicate aftermath.\n\nIf you need to audit a live factory, `/ei_runtime_status` now reports `fluid(t/u/d/s/cursor/mode)` for tracked / urgent / dirty / scan / service cursor / next service mode, `fluidfx(qh/ql|sh/sl)` for queued heavy / queued light | suppressed heavy / suppressed light, and `rupture(mode/a/p/d|ob/oi)` for fidelity mode / active jobs / pending rings / scheduled delay buckets | overdue buckets / overdue items.
ei-runtime-status-enabled=ESIR runtime telemetry enabled.
ei-runtime-status-disabled=ESIR runtime telemetry disabled.
ei-runtime-status-usage=Usage: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off] (run without arguments to print the live runtime summary).
ei-runtime-status-command-help=Prints the live ESIR runtime summary by default. Use snapshot, auric, auric-detail, telemetry-on, or telemetry-off through the same command surface.
