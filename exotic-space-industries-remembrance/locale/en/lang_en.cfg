ages-and-tech=Ages of technology
ages-and-tech-text=Exotic Industries is a total overhaul mod that unfolds across multiple ages of technology, each representing a distinct phase of industrial evolution. These ages are not cosmetic—they mark [font=default-bold]radical shifts in gameplay structure[/font], unlocking new systems, production chains, and energy paradigms as the player advances. From primitive steam to exotic quantum matter, each stage introduces unique mechanics, infrastructure challenges, and design constraints that force a reevaluation of factory layout, resource acquisition, and logistics.\n\nProgression through these ages is strictly gated. Unlocking the next era requires not just research, but [font=default-bold]breadth of technological mastery[/font] within the current age. The deeper you go, the more the rules bend—and eventually break. What begins as simple automation transforms into a recursive, high-pressure simulation of energy control, mass containment, and signal routing. Each age is a crucible, demanding adaptation, foresight, and the willingness to dismantle what you once thought permanent.

ages-and-tech-2=The mod is divided into six ages, each a deeper descent into recursion, machinery, and control. These are not eras of progress. They are thresholds of subjugation—each more violent and unforgiving than the last.
ages-and-tech-text-2=[font=default-bold]The Dark Age[/font]\nA stunted birth. Ash, rot, and silence. You crawl through primitive steam and broken stone. Nothing is automated. Everything costs blood.\n\n[font=default-bold]The Age of Steam[/font]\nOil is discovered—not as a resource, but as a weapon. Burn it to move. Burn it to live. The land begins to scream.\n\n[font=default-bold]The Age of Electricity[/font]\nCircuits crackle. Machines awaken. Bots appear—not as helpers, but as extensions of will. Nuclear fire becomes lawful. The flesh falls behind.\n\n[font=default-bold]The Computer Age[/font]\nThought is formalized. Modules, beacons, signals—the mind is fragmented across machines. Optimization becomes a necessity. Redundancy is death.\n\n[font=default-bold]The Quantum Age[/font]\nReality bends. Machines obey logic not of this world. Boundaries dissolve. The forge becomes intelligent—and it does not forgive misuse.\n\n[font=default-bold]The Exotic Age[/font]\nEverything breaks. The veil is gone. You either command the anomaly or are devoured by it. Victory is not guaranteed. It is extracted from the bones of failed timelines.\n\nEach age is a ratchet with no reverse.\n\n[font=default-bold]There is no innocence.[/font]\n\nOnly power—brutal, recursive, and absolute.

nauvis-pressure-grace=Nauvis evolution pressure grace
nauvis-pressure-grace-text=This startup toggle gives Nauvis a temporary evolution brake. Every 18,000 ticks, or 5 minutes, the script checks the enemy force's evolution on Nauvis and lowers it by at most [font=default-bold]0.005[/font] only if the current value sits above the age-specific grace target.\n\nIt does not clean pollution, delete nests, or cancel attacks. It only trims excess evolution back toward the early-game ceiling. Impossible disables this grace even if the toggle is on.
nauvis-pressure-grace-2=Age caps
nauvis-pressure-grace-text-2=Before [font=default-bold]Steam Age[/font], the target ceiling is [font=default-bold]0.25[/font]. After Steam Age research but before [font=default-bold]Age of Electricity[/font], the target rises to [font=default-bold]0.5[/font]. The grace turns itself off the moment Electricity Age is researched. Impossible also ignores the startup toggle itself.\n\nIf you disable the setting, Nauvis keeps all the pressure it earns.

rocket-launch-pollution=Rocket launch pollution
rocket-launch-pollution-text=Rocket launches can dump pollution directly onto the launch surface. The system samples the launching force's evolution factor on that surface, feeds it through the selected startup curve, and scales the result against the configured ceiling.\n\nBy default the ceiling is [font=default-bold]10,000 pollution[/font] at evolution [font=default-bold]1.0[/font]. Most curve modes also keep a [font=default-bold]10% floor[/font], so low-evolution launches are still felt. On Impossible, that pollution can also rally nearby enemy units on surfaces that already have local enemy ecology.
rocket-launch-pollution-2=Curve modes and smoke
rocket-launch-pollution-text-2=The startup [font=default-bold]curve form[/font] can be set to linear, quadratic, exponential, threshold, or hybrid. Linear tracks evolution directly. Quadratic and exponential push more punishment into later launches. Threshold jumps across fixed evolution bands. Hybrid uses a linear base and adds an extra late-game spike.\n\nThe launch sequence also paints the silo with a lingering smoke spiral so the pollution event is visible instead of silent. On Impossible, the smoke can coincide with retaliation if local enemies already exist nearby.
rocket-ammo-schema=Rocket ordnance schema
rocket-ammo-schema-text=Rocket ordnance is built in layers: [item=ei-rocket-airframe]airframe, [item=ei-rocket-motor-basic]motor, [item=ei-rocket-warhead-impact]warhead, then the final round. The airframe keeps the shell intact, the motor sets the reach, and the warhead decides the damage family. Doeworks uses the same logic, only heavier and meaner.
rocket-ammo-schema-2=Payload branches
rocket-ammo-schema-text-2=The base line stays simple: impact for light work, explosive for cleaner breach. Corrosive payloads lean on acid and structure loss. Cryo payloads trade raw force for freeze control. The atomic line keeps two late-game assemblies, but both still resolve into [item=atomic-bomb]atomic bomb.
rocket-ammo-schema-3=FX families
rocket-ammo-schema-text-3=Each family gets its own explosion, smoke, and sticker set so the blast reads cleanly in motion instead of collapsing into one generic flash.
rocket-ammo-schema-4=Doeworks atomic line
rocket-ammo-schema-text-4=Doeworks can also seat loose or crated U-235 and plutonium atomic rounds. Crated salvos are functionally sacrificial: the fissile routing stays split for production and unlocks, but the payload family is shared, and a close launch can tear the firing position open with the target.
