setting-gate-low-power=Show a native map alert while an enabled gate has less than 100 GJ. Requires Gate notifications and Alerts for this gate. Applies only to you.
setting-black-hole-containment=Show containment failures in your force for 60 seconds. Requires Black hole notifications. Applies only to you.
setting-matter-cascade=Show matter containment cascades in your force for 60 seconds. Requires Matter machine notifications. Applies only to you.
setting-gaia-degradation=Show structures destroyed by Gaia degradation in your force for 60 seconds. Applies only to you.
setting-fluid-phase-shift=Show fluid boiloff in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
setting-fluid-data=Show data-fluid failures in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
setting-fluid-cryo=Show cryogenic fluid failures in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
setting-fluid-thermal=Show thermal fluid failures in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
setting-fluid-chemical=Show chemical fluid failures in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
setting-fluid-rupture=Show other fluid ruptures in your force for 60 seconds. Requires Fluid safety notifications. Applies only to you.
group-gate-description=Category-wide switch for your gate notifications, including destination messages. The low-power alert also requires its individual setting and the gate's Alerts for this gate switch.
group-black-hole-description=Category-wide switch for your black-hole notifications. Native containment alerts also require the individual containment-failure setting.
group-matter-description=Category-wide switch for your matter-machine notifications. Native containment alerts also require the individual containment-cascade setting.
group-fluid-description=Category-wide switch for your fluid-safety notifications. Each of the six native fluid alerts also requires its individual setting.
gate-toggle=Alerts for this gate
gate-toggle-tooltip=Send operational alerts for this gate to your force. Each player's notification settings still apply.
