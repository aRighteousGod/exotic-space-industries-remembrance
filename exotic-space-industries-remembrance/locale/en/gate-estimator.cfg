[gate-estimator]
route-snapshot=Fixed route snapshot
power-draw=Power draw
title=Gate estimator
close=Close
help-launch=Open a detached what-if calculator. It never changes gate settings or cargo.
snapshot=Load gate snapshot
help-snapshot=Copy this gate's energy, stress, cooldown, quality and route. Keep the selected cargo and supply assumptions.
reset=Reset assumptions
help-reset=Start ready with full energy, no stress or cooldown, 1 item/s and 1 GW available. This does not reset the real gate.
item=Item
help-item=Select any available item. No items are consumed. Cargo quality does not change the gate toll.
batch=Stack size / maximum deposit
help-batch=Quantity used for the single-transfer quote and maximum deposit per simulated tick. Native transfers send available stacks without waiting for this quantity; deposits may merge.
stress=Stress
help-stress=Initial sender stress, 0–100. Stress decays by 1/s and increases upkeep and cooldown, not the immediate transfer toll.
quality=Sender quality
help-quality=Visible sender quality discounts transfer energy and upkeep by 1 / (1 + 0.2 × quality level). Cargo and receiver quality do not change this discount.
from=Sending planet
to=Receiving planet
help-route=Both planets selected: lock distance to their starmap separation. Identical planets mean the same surface. Clear a planet for manual distance. No planet surface is generated.
local=Same surface
orbital=Same location, different surfaces
distance=Interplanetary distance
unknown=Unresolved cross-surface
help-distance=Starmap distance, not tiles or space-route length. Same surface costs ×0.15; same location on different surfaces ×2.5; unresolved cross-surface ×3.
rate=Offered input rate
help-rate=Constant offered supply. Blocked items wait upstream; actual delivered throughput may be lower. Fractions accumulate into whole items.
per-second=Items/second
per-minute=Items/minute
power=Available power
help-power=Assumed constant charging supply, not measured electrical-network power. Charging is capped by the gate's native input limit and remaining buffer space.
initial-state=Initial operating state
help-initial-state=Editable snapshot values. Simulated cargo and upstream queues start empty. The real gate is unaffected.
energy=Stored energy (GJ)
help-energy=Initial stored joules. A gate needs at least 100 GJ to operate and enough energy to pay the entire next stack.
cooldown=Cooldown (s)
help-cooldown=Initial cooldown remaining in simulation seconds. Automated input and transfers stop during cooldown. Reopening waits for the next gate service.
saturation=Receiver saturation
help-saturation=Initial saturation, 0–100. At 100, transfers pause but input can buffer. Recovery is 1.5/s; output and residue are assumed cleared automatically.
calculation=Calculation
projections=Projections
burden=Burden
help-burden=Gate mass-table weight multiplied by item count. Unlisted items use weight 1. This is the gate's burden, not rocket weight.
distance-factor=Distance multiplier
help-distance-factor=Interplanetary multiplier = 2.5 + 5.5 × (distance / maximum starmap separation)^0.6, clamped to the installed starmap. Span ratio = (multiplier − 0.15) / 7.85.
quality-factor=Quality multiplier
help-quality-factor=Only sender quality discounts energy. Modded quality levels use the same formula.
toll=Transfer energy
help-toll=The superlinear burden curve makes larger transfers cost more per item. Floor once after multiplying burden energy, distance and sender quality.
per-item=Transfer energy per item
help-per-item=This transfer's toll divided by its item count. Excludes upkeep; it is not a constant price for every batch size.
stress-result=Stress added / resulting stress
help-stress-result=At most 35 stress is added per transfer. Resulting stress is capped at 100. At 75 or above, the console reports Critical when not cooling.
cooldown-result=Cooldown after transfer
help-cooldown-result=Uses resulting stress. Ticks are floored separately before conversion to seconds. The next transfer can be later because of service, power or receiver recovery.
saturation-result=Saturation added / resulting saturation
help-saturation-result=Physical burden adds at most 20 receiver saturation; the result is capped at 100. Sender quality does not reduce this penalty.
upkeep-result=Upkeep after / before transfer
help-upkeep-result=Armed upkeep is 30 MW, plus 1.5 MW per stress and 30 MW during cooldown, all discounted by sender quality. Dormant or underpowered gates have no scripted upkeep.
hardware=Buffer: __1__ GJ · Charging limit: __2__ MW · Service: __3__ s
help-hardware=Native hardware limits and a fixed service interval derived from the current gate population and dispatcher budget. Later registry changes can alter actual service timing.
fallback=This item is absent from the gate mass table; weight 1 is used.
assumptions=One enabled sender, one item, one receiver. Output and residue are cleared; no competing senders. Time is simulation time.
help-assumptions=Models saturation, upkeep, stack merging, cooldown and affordability. Excludes spoilage, damage, circuit changes, inserter motion, network competition and changing platform routes.
run=Run projection
help-run=Calculate the edited scenario and pinned baseline. Work is bounded and cancellable. Editing marks prior graphs out of date.
minutes=__1__ min
help-horizon=Projection duration in game-time minutes. The baseline uses the same horizon for comparison.
pin=Pin baseline
clear-baseline=Clear baseline
help-pin=Keep one independent scenario and initial state for comparison. Solid lines are current; dashed lines are baseline. Run again after changing the baseline.
baseline=Baseline
pinned=Baseline pinned
no-baseline=No baseline
legend=Cyan: first series · Orange: second series · Solid: current · Dashed: baseline
help-chart=Energy: stored GJ, red threshold 100 GJ. Stress: sender / receiver, red threshold 75. Cooldown: remaining / transfer interval. Throughput: delivered / offered. Queue: upstream / inside gate. Power: transfer / upkeep. Vertical ranges preserve extrema.
throughput=Throughput
queue=Queued cargo
axis=0–__1__ __2__ · Time 0–__3__ s
unit-1=GJ
unit-2=%
unit-3=s
unit-4=items/s
unit-5=items
unit-6=MW
sample=__1__–__2__ s: __3__
help-sample=Move the time cursor. Values show the end value [minimum–maximum] within the selected time bin. Throughput and power are interval averages.
summary=Delivered: __1__ · Average: __2__ items/s\nUpstream: __3__ · In gate: __4__\nTransfer: __5__ GJ · Upkeep: __6__ GJ · Mean draw: __7__ MW\nMinimum energy: __8__ GJ · Peak stress: __9__\nWaits — cooldown: __10__ s; power: __11__ s; receiver: __12__ s\nResidue generated: __13__
help-summary=Waiting reasons can overlap and must not be added together. Energy totals include only energy consumed. Residue is counted then cleared. Queued items are not discarded.
difference=Current − baseline: __1__ delivered items; __2__ GJ consumed
help-status=Quotes update immediately. Projections represent the last Run until marked out of date. No projection changes a real gate.
running=Calculating…
stale=Projection out of date — press Run
ready=Projection ready
invalid=Enter a finite value within the control's range.
missing-prototype=An item, quality or planet is unavailable. Select a replacement.
too-expensive=This quoted stack costs more than the gate can store. Native transfers do not split stacks to fit available energy.
