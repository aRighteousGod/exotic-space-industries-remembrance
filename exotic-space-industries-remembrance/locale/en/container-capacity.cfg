[mod-setting-name]
ei-container-capacity-profile=Container capacity profile

[mod-setting-description]
ei-container-capacity-profile=Sets the inventory capacity of player storage chests, including other mods. Normal-quality slots; columns: Wooden / Iron / Steel / Small / Medium / Warehouse.\n__1__\n\nOrdinary, filtered, and logistic variants share their size tier. Existing quality bonuses remain unchanged. Functional machine inventories are excluded. Lowering this setting can shrink existing inventories and may lose items.

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=Normal-quality slots: Wooden __1__ / Iron __2__ / Steel __3__ / Small __4__ / Medium __5__ / Warehouse __6__.

