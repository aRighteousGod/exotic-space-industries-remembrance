[mod-setting-name]
ei-admin-tools-enabled=Enable administration tools
ei-admin-new-planets-peaceful=New planets start peaceful
ei-admin-restrict-new-players=Restrict new players to their own last-used entities

[mod-setting-description]
ei-admin-tools-enabled=Enable the admin-only console, commands and creation tools. Disabled by default. Turning this off restores toolkit-owned player modes, jail sentences and game speed; completed world edits remain.
ei-admin-new-planets-peaceful=While administration tools are enabled, newly created planetary surfaces start peaceful. Existing planets are unchanged. Explicit saved policies take precedence.
ei-admin-restrict-new-players=While administration tools are enabled, restrict newly created players from interacting with player-built entities whose last user is someone else. Natural resources, trees and rocks remain usable. Existing players are unchanged.

