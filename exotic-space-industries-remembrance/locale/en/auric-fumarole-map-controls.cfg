[autoplace-control-descriptions]
ei-auric-fumarole=Frequency scales eruption chances and recovery attempts. Size scales the target number of active vents, not their physical size. Richness scales reserves: 100% gives 40,000–80,000 per new vent. Disabling stops all new eruptions. Existing deposits keep their remaining reserves. Fumaroles do not appear in the map generation preview. They appear only during gameplay, when the runtime script is active.

[exotic-industries-informatron]
auric-fumarole-defaults=The values below describe 100% map settings. Population targets remain subject to available ground and spacing.
