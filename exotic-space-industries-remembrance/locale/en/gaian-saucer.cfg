[item-description]
ei-gaian-saucer=A fast Gaian hover shell with a sealed cargo hold, an equipment lattice, and no visible legs. It moves as a remembered step and leaves color-fracture in its wake.

[entity-description]
ei-gaian-saucer=A fast Gaian hover frame built around a Spidertron command core.\nIt skims by making the ground remember false feet. When the wake-vow is strong, its passage blooms into a chromatic slipwake behind the machine.

[recipe-description]
ei-gaian-saucer=Rehouses a Spidertron command core inside a Gaian hover shell, stripping the launchers and leaving the engine to remember motion without limbs.

[technology-description]
ei-gaian-saucer=Unlocks the Slipwake Saucer: a Gaian hover vessel whose cargo hold, equipment lattice, and chromatic wake make motion feel like an oath remembered by the ground.

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=Slipwake Saucer wake resonance

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=Sets how fiercely the Slipwake Saucer is allowed to remember its passage. The oath touches only the chromatic wake; the vessel's hold, lattice, drive, shell, and making remain unchanged.

[string-mod-setting]
ei-gaian-saucer-wake-visual-fidelity-off=Dormant
ei-gaian-saucer-wake-visual-fidelity-lean=Thin
ei-gaian-saucer-wake-visual-fidelity-standard=Remembered
ei-gaian-saucer-wake-visual-fidelity-cinematic=Radiant
ei-gaian-saucer-wake-visual-fidelity-maximal=Revelatory
ei-gaian-saucer-wake-visual-fidelity-unbounded=Unbound

[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=The vessel seals its afterimage and travels without visible remembrance.
ei-gaian-saucer-wake-visual-fidelity-lean=Only a thin chromatic refusal follows the hull, brief and disciplined.
ei-gaian-saucer-wake-visual-fidelity-standard=The wake is allowed to speak clearly, then fade before it becomes doctrine.
ei-gaian-saucer-wake-visual-fidelity-cinematic=The wake widens, lingers, and bends with the saucer's turning oath.
ei-gaian-saucer-wake-visual-fidelity-maximal=The shell leaves a dense, luminous wound of motion wherever it passes.
ei-gaian-saucer-wake-visual-fidelity-unbounded=The governor is removed; the saucer may write every shimmer the world can bear.

[exotic-industries-informatron]
menu_gaian_saucer=Slipwake Saucer
title_gaian_saucer=Slipwake Saucer
gaian-saucer=Slipwake Saucer
gaian-saucer-text=The [item=ei-gaian-saucer] Slipwake Saucer is a Gaian hover vessel: a Spidertron command core entombed in a shell that refuses legs. Its cargo hold, equipment lattice, and void-fed drive make it a pilgrim's tool for crossing hostile thresholds.
gaian-saucer-2=Wake resonance
gaian-saucer-text-2=The current wake-vow is [font=default-bold]__1__[/font]. It changes only the chromatic memory cast behind the hull: how brightly the slipwake blooms, how long the turn-scar holds, and how much of the passage the world is asked to remember. The vessel itself remains unchanged.
