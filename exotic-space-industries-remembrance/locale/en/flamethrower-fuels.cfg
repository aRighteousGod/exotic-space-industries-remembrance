[item-name]
ei-flamethrower-fuel=Flamethrower ammo (__1__)
[item-description]
ei-flamethrower-fuel=Fire damage: __1__% of crude-oil ammunition. Ground fire starts at __2__ seconds and can reach __3__ seconds with continued fueling. Attached-fire duration is unchanged. Vehicle flamethrowers retain their native fire behavior.
[entity-description]
ei-flamethrower-fuel=Fuel effects: __1__. Ground fire starts at __2__ seconds and can reach __3__ seconds with continued fueling.
[mod-setting-name]
ei-flamethrower-fuel-adaptation=Fuel-specific flamethrower turret effects
[mod-setting-description]
ei-flamethrower-fuel-adaptation=Automatically adapts turret flames, smoke and ground-fire lifetime to the fuel being burned. Disabled: turrets use shared effects and normal fire lifetime; all fuel damage bonuses and ammunition variants remain available. Runs every 16 ticks. Fuel checks and replacement attempts are each capped at the full Maximum script updates per tick value. Disabling restores existing turrets gradually within this budget. Default: enabled. When disabled, flame overlap cleanup is also skipped, so different fuel effects can overlap.
