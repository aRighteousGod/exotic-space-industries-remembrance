axial=An incision __1__ tile wide continues up to __2__ tiles behind the aim point, within effective range. Up to __3__ additional hostile military targets take __4__ laser damage each.
wound=Consecutive positive primary hits grant the next hit +__1__% damage, up to +__2__%. The first hit has no bonus. Retargeting or a gap of __3__ seconds resets the wound. Zero damage neither adds stacks nor refreshes expiry. Secondary damage is unaffected.
collapse=Replaces ordinary splash with one collapse at the original aim point after __1__ seconds: __2__ laser damage, radius __3__, up to __4__ additional hostile military targets.
testament=Every __1__th paid shot: primary damage ×__2__, including Wound Memory; Axial cap __3__; Collapse __4__ laser damage, radius __5__, cap __6__. The shot is counted even if its target is gone or protected.
