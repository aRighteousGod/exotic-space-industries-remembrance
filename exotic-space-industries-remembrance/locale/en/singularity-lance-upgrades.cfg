[lance-upgrades]
axial=A central incision __1__ tiles wide continues up to __2__ tiles behind the contact point, hitting up to __3__ additional hostile military targets for __4__ laser damage each. Two branches fork at ±__5__°, each __6__ tile wide and up to __7__ tiles long; together they hit up to __8__ additional targets for __9__ laser damage each. All rays stay within effective range; each enemy takes at most one incision hit, with the central ray taking precedence.
wound=The first primary hit has no bonus; the second gains +__1__% damage. Each consecutive positive hit against the same target raises the next hit by __1__ percentage points, up to +__2__%. Retargeting or a gap of __3__ seconds resets the sequence. Zero damage neither advances the sequence nor refreshes expiry. Secondary damage is unaffected.
collapse=Replaces ordinary splash with one collapse at the contact point __1__ seconds after beam contact: __5__ laser damage inside radius __6__, otherwise __2__ within radius __3__. Hits up to __4__ additional hostile military targets, plus the original primary if still in the blast. Each victim receives core or outer damage, never both.
testament=Every __1__th paid shot: primary damage ×__2__, including Wound Memory; central incision cap __3__, shared branch cap __7__. First collapse: __8__ laser damage inside radius __9__, otherwise __4__ within radius __5__; up to __6__ additional targets plus the eligible primary. One echo at __10__ seconds after beam contact: __11__ laser damage, radius __12__, up to __13__ additional targets plus the eligible primary. The shot is counted even if its target is gone or protected.
research-row=__1__ (research unlock)
protection-title=Target protection
protection=The original primary is excluded from ordinary splash and all incision rays, but can receive each collapse while inside its blast, without using a secondary-target slot. Same-force, neutral, friendly and cease-fire forces are protected in either direction. An enemy can receive one incision hit and one hit from each collapse.
status=Base direct DPS: __1__
contact-title=Beam contact
contact=Beam contact occurs __1__–__3__ ticks after firing (__4__ s maximum), depending on the turn angle and queued shots. Nominal turn rate: __2__° per tick. The beam follows its chosen target until contact. Primary damage and researched incision damage resolve then. Research-unlocked collapse delays begin at contact, and their blasts remain at that position.
status-wound= • Wound primary __1__–__2__
status-testament= • Every __1__th shot ×__2__
baseline=Baseline
force-values=Your force • damage multiplier ×__1__ • primary __2__ laser • sustained direct DPS __3__ before Wound/Testament • base range __4__ tiles, increased by quality. Values below include this force's damage research.
base-area=Ordinary splash: __1__ laser damage, radius __2__, up to __3__ additional targets. Replaced by Terminal Collapse.
rules=Each paid shot and each collapse remain separate damage packets. Central-ray eligibility takes precedence over branches; overlapping rays never duplicate incision damage. Each collapse applies core or outer damage, never both. Blast eligibility and core membership use the target center; targets exactly on the boundary are included. Both collapses stay at the contact point even if the enemy moves or the lance is removed; moving out of the blast can avoid them. Their values are fixed when fired. Wound expires after inactivity; its mark follows the target. Testament counts paid shots, not victims. Black Hole research unlocks the final step; operating a black hole is unnecessary. Quality and native target bounds determine direct reach. Core cues remain visible at every fidelity; decoration never changes damage.
