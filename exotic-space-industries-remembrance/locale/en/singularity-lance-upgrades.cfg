rules=Each paid shot remains a separate damage packet. Collapse stays at the original aim point even if the enemy moves or the lance is removed. Its values are fixed when fired. Wound expires after inactivity; its mark follows the target. Testament counts paid shots, not victims. Black Hole research unlocks the final step; operating a black hole is unnecessary. Quality and native target bounds determine direct reach. Core cues remain visible at every fidelity; decoration never changes damage.
