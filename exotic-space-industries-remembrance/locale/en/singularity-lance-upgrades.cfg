legend-1=Visual: a white-gold central incision with cyan banks and two narrower prismatic branches forking at the contact point. Flowing ribbons and tapered tails show each ray's actual endpoint.
legend-2=Visual: flowing color follows a split fracture at 1–2 stacks, branches at 3–4, and a broken halo at 5. The mark follows the target and expires with the wound.
legend-3=Visual: prismatic comet tails spiral inward around a contracting outer ring and a visible core boundary at the fixed contact point. A stronger central flash marks the damage tick.
legend-4=Visual: a dark beam seam between broad prismatic banks; a larger dark collapse core and bright accretion ring, followed by a second contraction and terminal cross for the echo.
static-values=Listed damage is baseline before the lance's damage research. Wound depends on the primary-hit sequence and Testament on the paid-shot count; no single area DPS value applies.
