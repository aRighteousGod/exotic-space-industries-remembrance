[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Shortest rupture. Four rings, tight effect caps, no secondary family accent, and no massive explosions.
ei-flammable-rupture-fidelity-standard=Default. Six rings, moderate caps, one meaningful secondary accent, and restrained massive explosions.
ei-flammable-rupture-fidelity-cinematic=Eight rings, broader smoke and fire budgets, richer family accents, and a slower ceremonial outward bloom.
ei-flammable-rupture-fidelity-unbounded=Removes the hard visual caps and lets ready rings drain aggressively in the same tick. Intended for spectacle, not safety.

