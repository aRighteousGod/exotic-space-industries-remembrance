[mod-setting-description]
ei-flammable-rupture-fidelity=Controls how combustible-fluid ruptures stage their visuals and hazard propagation. Lean keeps the blast terse. Standard is the default. Cinematic stretches the spectacle over more rings. Unbounded removes hard effect caps and can severely hurt UPS when large tanks rupture.

