flammable-ruptures=Combustible fluid rupture
flammable-ruptures-text=Storage tanks, pipe bodies, underground fluid links, wagons, and fluid-bearing machines can rupture when they die with enough combustible fluid still trapped inside. The runtime reads the final loaded fluid prototypes, so oil products, gas lines, and exotic fuel-bearing mixtures each have their own aftermath language.\n\nThe trigger respects the killing damage type. Fire, impact, explosions, plasma, and other energetic deaths are far more likely to ignite a rupture than cold or poison.
flammable-ruptures-2=Fidelity mode
flammable-ruptures-text-2=Current startup mode: [font=default-bold]__1__[/font]\n\n[font=default-bold]Lean[/font] keeps the sequence short and tightly budgeted. [font=default-bold]Standard[/font] is the default and the intended public path. [font=default-bold]Cinematic[/font] preserves a larger staged bloom over more ticks. [font=default-bold]Unbounded[/font] removes the hard caps and tells the scheduler to spend ready rings aggressively in the same tick when it can.
flammable-ruptures-3=Propagation and risk
flammable-ruptures-text-3=Pollution is applied immediately on death, but the rest of the rupture marches outward in rings. Explosions, smoke, fire placement, scorchmarks, and damage to nearby victims are precomputed once and then released over successive ticks so a cluster of giant tanks doesn't try to materialize its whole apocalypse in one frame.\n\nUnderground pair explosions can chain. Unbounded is intentionally dangerous to performance—but the price is yours to pay.
