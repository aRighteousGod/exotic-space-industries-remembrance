[mod-setting-name]
ei-beacon-diminishing-returns=Beacon diminishing returns

[mod-setting-description]
ei-beacon-overload=Enabled: machines shut down above the beacon overload limit; Copper counts as 1 and Iron as 2, while Alien and Warp beacons are exempt. Disabled: all four ESIR beacon tiers use the selected diminishing-return profile instead.
ei-beacon-diminishing-returns=Used only when Beacon overload is disabled. Each covering beacon reduces every ESIR beacon's transmitted module effects, including consumption and pollution effects. All beacon types count together, once each; adding weak beacons can dilute stronger ones. One beacon retains full strength. Module slots, quality, cooling and fuel requirements are unchanged.\nPer-beacon strength at 1 / 4 / 8 / 16 covering beacons:\n__1__\nVanilla curve copies the curve only, retaining ESIR tier strengths and total counting. Curves contain 4096 entries; above that count the final multiplier repeats.

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Gentle
ei-beacon-diminishing-returns-vanilla=Vanilla curve
ei-beacon-diminishing-returns-strict=Strict (default)
ei-beacon-diminishing-returns-harsh=Harsh
ei-beacon-diminishing-returns-severe=Severe
ei-beacon-diminishing-returns-saturating=Saturating

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=Beacon overload enabled: maximum weighted count 4 per machine. Copper counts as 1, Iron as 2; Alien and Warp are exempt. The diminishing-return preset is inactive.
overload-disabled=Beacon overload disabled. Active profile: __1__. Copper, Iron, Alien and Warp all use diminishing returns. Each covering beacon counts once, regardless of tier; weaker additions can reduce the combined bonus.
