[mod-setting-name]
ei-thrower-performance-profile=Flame and acid turret performance

[mod-setting-description]
ei-thrower-performance-profile=Reduces stream particles, firing frequency, smoke, and burn/corrosion damage applications for flame and acid turrets only. Larger impacts preserve nominal sustained damage; larger fluid draws preserve consumption per second. Ground-fire damage, growth, and fuel-specific lifetimes remain unchanged. Original preserves existing behavior. 8× and 16× produce coarse bursts: moving-target coverage, fire buildup, and damage against flat resistance differ. These factors describe reduced processing frequency, not guaranteed UPS gains. Handheld and vehicle weapons are unaffected.\nBaseline values below are before quality, research, or other mods. Columns: weapon cooldown / particle interval / particles per second / impact and fluid multiplier / burn interval / corrosion interval. Intervals are in ticks (60 ticks = 1 second).

[string-mod-setting]
ei-thrower-performance-profile-original=Original
ei-thrower-performance-profile-2x=2× reduction
ei-thrower-performance-profile-4x=4× reduction
ei-thrower-performance-profile-8x=8× reduction
ei-thrower-performance-profile-16x=16× reduction

[string-mod-setting-description]
ei-thrower-performance-profile-original=Existing behavior: cooldown 4 ticks; one particle every 2 ticks; 30 particles/s; normal impact and fluid draw; burn interval 10 ticks; corrosion interval 1 tick.
ei-thrower-performance-profile-2x=Cooldown 8 ticks; one particle every 4 ticks; 15 particles/s; 2× impact damage and fluid per firing action; burn interval 20 ticks; corrosion interval 2 ticks.
ei-thrower-performance-profile-4x=Cooldown 16 ticks; one particle every 8 ticks; 7.5 particles/s; 4× impact damage and fluid per firing action; burn interval 30 ticks; corrosion interval 4 ticks.
ei-thrower-performance-profile-8x=Cooldown 32 ticks; one particle every 16 ticks; 3.75 particles/s; 8× impact damage and fluid per firing action; burn interval 30 ticks; corrosion interval 8 ticks. Coarse bursts affect coverage and flat resistance.
ei-thrower-performance-profile-16x=Cooldown 64 ticks; one particle every 32 ticks; 1.875 particles/s; 16× impact damage and fluid per firing action; burn interval 30 ticks; corrosion interval 16 ticks. Very coarse bursts affect coverage and flat resistance.

