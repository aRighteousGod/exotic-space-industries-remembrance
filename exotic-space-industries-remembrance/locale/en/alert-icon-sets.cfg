[mod-setting-name]
ei-alert-icon-set=Alert icon set
ei-alert-icon-set-default=Default alert icon set

[mod-setting-description]
ei-alert-icon-set=Choose the icons for your ESIR alerts and Ecology preferences. "Use startup default" copies the current startup choice into this personal setting. Your saved choice remains when the startup default changes.
ei-alert-icon-set-default=Initial icon set for players without a saved personal choice. Existing personal choices are preserved. Default: Rendered objects.

[string-mod-setting]
ei-alert-icon-set-vanilla=Vanilla-style alerts
ei-alert-icon-set-default-vanilla=Vanilla-style alerts
ei-alert-icon-set-startup-default=Use startup default
ei-alert-icon-set-original=Original icons
ei-alert-icon-set-svg=Cast-metal sigils
ei-alert-icon-set-rendered=Rendered objects
ei-alert-icon-set-default-original=Original icons
ei-alert-icon-set-default-svg=Cast-metal sigils
ei-alert-icon-set-default-rendered=Rendered objects
