[planet-enemies]
ordinary=Biters, spitters and worms
ordinary-description=Frequency and size of ordinary biter and spitter nests. Off suppresses new ordinary nests, worms and creatures on Nauvis. Explosive, cold, arachnid and toxic families have separate controls. Armoured snappers follow this control when Armoured Biters' separate nests option is disabled. Existing creatures remain.
arachnid=Arachnid enemies
arachnid-description=Frequency and size of arachnid nests on Nauvis, preserving their native terrain preference. Off suppresses new arachnid nests, creatures and bosses. Existing creatures remain; combat strength is controlled separately by Enemy difficulty.
toxic=Toxic enemies
toxic-description=Frequency and size of toxic nests on Nauvis. Off suppresses new toxic nests, worms, creatures, bosses and infected hostile structures. Existing creatures remain; combat strength is controlled separately by Enemy difficulty.
armoured=Armoured enemies
armoured-description=Frequency and size of separate armoured nests on Nauvis. This control only works when Armoured Biters' separate nests startup option is enabled. In that mode, Off suppresses new armoured nests and snappers. With separate nests disabled, vanilla nests can produce snappers and the ordinary enemy-base control governs them; this slider has no effect. Existing creatures remain.
explosive=Explosive enemies
explosive-description=Frequency and size of explosive enemy nests. Disabling this family also suppresses its worms, units and scripted offspring on this planet. Combat strength is controlled separately by Enemy difficulty.
cold=Cold enemies
cold-description=Frequency and size of cold enemy nests. Disabling this family also suppresses its worms, units and scripted offspring on this planet. Combat strength is controlled separately by Enemy difficulty.
electric=Electric enemies
electric-description=Frequency and size of electric enemy nests. Disabling this family suppresses both flying and walking enemies, including Fulgora vault guardians, on this planet. Positive slider values do not change guardian strength.
pentapod=Pentapods
pentapod-description=Frequency and size of pentapod egg rafts. When disabled, inactive egg rafts remain at normal density so eggs can still be collected. Defenders, roaming pentapods and egg hatchlings are suppressed on Gleba. Eggs transported elsewhere follow that destination's settings.
demolisher=Demolisher territories
demolisher-description=Frequency controls occupied territory density; size controls territory area. Below 100% frequency, some territories remain empty. High density is limited by minimum territory size. Disabling prevents new occupied territories and demolishers while leaving explosive enemies independently configurable. Creature size, combat strength and the safe starting area are unchanged.
