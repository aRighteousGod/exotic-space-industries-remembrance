[item-description]
ei-singularity-lance=An alien oath-engine built around a floating crystal heart. Its chromatic ray does not burn so much as divide the target from the memory of being whole.

[entity-description]
ei-singularity-lance=A raised crystal altar for focused alien violence. The prism hangs above the machine, gathers impossible color, and releases it as a singularity lance through the chosen line.

[exotic-industries-informatron]
menu_singularity_lance=Singularity Lance
title_singularity_lance=Singularity Lance
turrets-text-6=[item=ei-singularity-lance]Singularity Lance is an alien blade protocol built around a suspended prism and a pyramid altar. It hoards crystal charge until the chosen line becomes an incision. The beam is not a projectile; it is a verdict dragged through space, leaving fire, scorch, and silence to discover the target a breath later.
singularity-lance=Singularity Lance
singularity-lance-text=The [item=ei-singularity-lance]Singularity Lance is a compact alien-age execution engine. A levitated crystal hangs over its pyramid cap, drinks a vast electric pulse, and answers a target by opening a bright wound across the battlefield instead of tracking every victim as an individual projectile.
singularity-lance-2=Chromatic Trace
singularity-lance-text-2=Each shot wakes one living trace for that lance. The endpoint becomes a witness: fire, scorch, marker, splash, and laser wound answer the visible cut after the prism names the target.
singularity-lance-3=Witness Triage
singularity-lance-text-3=When too many lances speak at once, the prism chooses which cuts deserve memory. Some streaks become faint or vanish, but the wound still arrives; absence of spectacle is not mercy.
singularity-lance-4=Witness Vow
singularity-lance-text-4=Current witness-vow: __1__. The vow governs how much of the chromatic cut is allowed to remain visible: beam, glow, fire, scorch, sound, and afterimage. It does not rewrite the lance's hunger or body; it only decides how loudly the wound is remembered.\n\nFor the living number, read the placed lance's status; there it speaks the current force-tuned sustained DPS.
