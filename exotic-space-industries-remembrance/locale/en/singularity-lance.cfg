[mod-setting-description]
ei-singularity-lance-visual-fidelity=Sets how fiercely the Singularity Lance remembers each cut. The vow touches only the beam witnesses, glow, fire, scorch, and sound; the blade's hunger, reach, body, and making remain fixed. Revelatory asks for restraint around revelation. Unbound breaks the governor and lets the prism write every wound the world can bear.

