ei-singularity-lance-visual-fidelity-lean=Thin Witness
ei-singularity-lance-visual-fidelity-standard=Steady Witness
ei-singularity-lance-visual-fidelity-cinematic=Radiant Witness
ei-singularity-lance-visual-fidelity-maximal=Revelatory Witness
ei-singularity-lance-visual-fidelity-unbounded=Unbound Witness

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Only the necessary trace survives the cut: a brief beam, a short witness, and disciplined flame and scorch.
ei-singularity-lance-visual-fidelity-standard=The ray is remembered clearly, then released before the wound becomes doctrine.
ei-singularity-lance-visual-fidelity-cinematic=More of the cut is permitted to linger: brighter slices, richer witnesses, and longer glow over the scar.
ei-singularity-lance-visual-fidelity-maximal=The prism is granted a restrained revelation: dense beams and lasting witnesses with the governor still awake.
ei-singularity-lance-visual-fidelity-unbounded=The governor is broken. The lance may write every shimmer it can force through the world.

