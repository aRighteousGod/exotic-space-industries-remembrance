[mod-setting-description]
ei-singularity-lance-visual-fidelity=Sets how fiercely the Singularity Lance remembers each cut. Every preset preserves the incision, wound sigil, collapse warning and Testament silhouette. Higher presets add glow, longer beam afterimages, cosmetic scars and sound. Decoration remains bounded under load; damage, energy use and range are unchanged.

[string-mod-setting]
ei-singularity-lance-visual-fidelity-lean=Thin Witness
ei-singularity-lance-visual-fidelity-standard=Steady Witness
ei-singularity-lance-visual-fidelity-cinematic=Radiant Witness
ei-singularity-lance-visual-fidelity-maximal=Revelatory Witness
ei-singularity-lance-visual-fidelity-unbounded=Unbound Witness

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Only the necessary trace survives: brief beams and every researched upgrade's defining shape, without decorative glow or scars.
ei-singularity-lance-visual-fidelity-standard=The ray is remembered clearly, then released before the wound becomes doctrine.
ei-singularity-lance-visual-fidelity-cinematic=The beam lingers longer, with glow and a larger allowance for cosmetic scars and sound.
ei-singularity-lance-visual-fidelity-maximal=The prism holds its beam longer still. Core warnings keep their exact timing; decoration remains bounded.
ei-singularity-lance-visual-fidelity-unbounded=The longest beam afterimage. The old name remains, but decorative limits still protect the world's cadence.

