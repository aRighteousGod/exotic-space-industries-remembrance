[item-description]
ei-singularity-lance=An alien oath-engine built around a floating crystal heart. Its chromatic ray does not burn so much as divide the target from the memory of being whole.

[entity-description]
ei-singularity-lance=A raised crystal altar for focused alien violence. The prism hangs above the machine, gathers impossible color, and releases it as a singularity lance through the chosen line.

[exotic-industries-informatron]
menu_singularity_lance=Singularity Lance
title_singularity_lance=Singularity Lance
turrets-text-6=[item=ei-singularity-lance]Singularity Lance is an alien blade protocol built around a suspended prism and a pyramid altar. It hoards crystal charge until the chosen line becomes an incision. The beam is a verdict written through space; the wound arrives with the shot, and the witness follows.
singularity-lance=Singularity Lance
singularity-lance-text=The [item=ei-singularity-lance]Singularity Lance is a compact alien-age execution engine. A levitated crystal hangs over its pyramid cap, drinks a vast electric pulse, and answers a target by opening a bright wound across the battlefield instead of tracking every victim as an individual projectile.
singularity-lance-2=Chromatic Trace
singularity-lance-text-2=Each paid shot follows its chosen target until beam contact. Direct and incision damage arrive with the beam. With Terminal Collapse researched, the fixed contact point contracts before releasing its separate core-and-shell strike. Black-Hole Testament leaves one delayed echo at that same point.
singularity-lance-3=Witness Triage
singularity-lance-text-3=Many lances may speak at once. Their defining incision, wound mark and collapse warning remain; excess scorch and ornament yield first. Damage is independent of spectacle.
singularity-lance-4=Witness Vow
singularity-lance-text-4=Current witness-vow: __1__. Every preset retains the animated core shapes and flowing colors of researched upgrades. Higher fidelity permits more glow, crown pulses, scars and sound. Read the placed lance's status for your force's current sustained direct DPS; Wound and Testament add conditional power.
