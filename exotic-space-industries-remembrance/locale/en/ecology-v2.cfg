[mod-setting-description]
ei-ecology-alert-enabled=Receive selected successful ecology events in Factorio's native alerts window. Master switch for personal notifications only.
ei-ecology-alert-surfaces=Use all or a JSON array of exact surface names. [] means none. Maximum 128 names and 4096 bytes. The Ecology GUI edits this same preference. Missing names match nothing.
ei-ecology-alert-current-surface-only=Restrict selected notifications to the surface currently viewed, including remote view. Disabled by default.
ei-ecology-alert-allow-unrevealed=Administrators only: bypass current chunk visibility. Category and surface filters still apply. Disabled by default. Ordinary recipients require current visibility, not merely explored terrain.
ei-terrain-periodic-mining-scars=Eligible working quarries and big mining drills can disturb exposed natural ground around finite deposits. Live deposits, infrastructure and other protected areas remain safe. Depletion-triggered scars remain event-driven and separate.
ei-terrain-periodic-mining-seconds=Base interval before intensity and seasonal modulation. Default 300 seconds becomes 600 with Restrained intensity before seasonal modulation. Late inspections receive one opportunity, with no catch-up rolls.
ei-terrain-periodic-mining-probability=Chance at each eligible periodic opportunity. Default 10%. This does not change the separate 70% chance for each tile within a chosen patch.
ei-ecology-alert-wildfire=Notify after a successful ecology effect: Wildfire ignition. Notifications do not enable the effect. Visibility and personal surface filters apply. Wildfire means an ignition was created, not that a forest burned.
ei-ecology-alert-flood=Notify after a successful ecology effect: Flooding. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-drought=Notify after a successful ecology effect: Shoreline drying. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-cliff=Notify after a successful ecology effect: Cliff weathering. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-paving=Notify after a successful ecology effect: Paving corrosion. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-pollution=Notify after a successful ecology effect: Pollution damage. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-restoration=Notify after a successful ecology effect: Terrain restoration. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-depletion-scars=Notify after a successful ecology effect: Depletion scars. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-working-scars=Notify after a successful ecology effect: Working-drill scars. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-mining-restoration=Notify after a successful ecology effect: Mining restoration. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-tree-stress=Notify after a successful ecology effect: Tree stress. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-tree-recovery=Notify after a successful ecology effect: Tree recovery. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-regrowth=Notify after a successful ecology effect: Wild regrowth. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-aging=Notify after a successful ecology effect: Tree aging. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-rot=Notify after a successful ecology effect: Deadwood decay. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-thermal=Notify after a successful ecology effect: Thermal scars. Notifications do not enable the effect. Visibility and personal surface filters apply.
ei-ecology-alert-blood=Notify after a successful ecology effect: Alien-blood healing. Notifications do not enable the effect. Visibility and personal surface filters apply.

[ei-terrain]
controls=Open Ecology from the top-left mechanical-tree button. Its leaf colors follow the viewed world's season; hovering shows the season name. Simple gives a field report; Advanced shows effective settings, recorded outcomes and finite processing limits; Alerts mirrors Mod settings → Per player. Alerts use the vanilla window and normally require currently visible chunks. Administrator gameplay controls remain in Terrain & Ecology.
v2-coverage=Observations cover a finite rotating set of chunks. Unsurveyed terrain is unknown; missing or stale readings cannot establish sustained clean or polluted conditions. Recovery restores only ESIR-recorded damage. Finite migration, bootstrap and maintenance appear in the ESIR rebuild window; ongoing ecology stays in Advanced. A 100,000-visit bootstrap ceiling does not verify the whole map.
mining-v2-note=Working drills have a separate periodic scar option, enabled by default: 10% per 300 base seconds, or 600 under Restrained before seasonal modulation. Accepted scar requests do not expire with age. Disabling a surface pauses them. Mining recovery is enabled for newly recorded scars by default.
status-unsupported=Unsupported surface
status-independent=Independent Fulgora controller

