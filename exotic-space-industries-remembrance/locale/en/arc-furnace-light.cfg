[mod-setting-name]
ei-arc-furnace-light-flicker-preset=Arc furnace light flicker

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=Controls only the Arc furnace's active working lights. Original preserves the restless arc. Reduced and Soft calm the flicker. Static keeps a steady glow. Off removes the active working lights while preserving the furnace animation and idle red capacitor glow.

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=Off
ei-arc-furnace-light-flicker-preset-static=Static glow
ei-arc-furnace-light-flicker-preset-soft=Soft pulse
ei-arc-furnace-light-flicker-preset-reduced=Reduced flicker
ei-arc-furnace-light-flicker-preset-original=Original flicker

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=Removes the active working lights. The furnace animation and idle red capacitor glow remain.
ei-arc-furnace-light-flicker-preset-static=Keeps the active glow steady, with flicker disabled.
ei-arc-furnace-light-flicker-preset-soft=Keeps a dim, slow pulse for a calmer furnace floor.
ei-arc-furnace-light-flicker-preset-reduced=Keeps the layered arc colors with slower, narrower flicker.
ei-arc-furnace-light-flicker-preset-original=Preserves the current restless arc furnace lighting.
