[exotic-industries-informatron]
orbital-native-title=Native shipping first
orbital-native-shipping=Ordinary rocket shipping and platform-to-platform transfers use Factorio's native requests and provisioning. They require no cohort devices. Set requests, request sources, minimum delivery amounts and provisioning in the native windows. Native automatic handles loading, mixed cargo, target selection and launch timing. The native target is displayed in the side panel; it is not an ESIR target selector.\n\nNew uplinks default to Native automatic without changing the silo on placement. Select Native automatic to enable its requests explicitly. Existing uplinks keep Cohort controlled. Change owner only with an empty payload, no incoming cargo and no launch underway.
orbital-native-cohort=For fixed targets or factory/circuit loading, place [entity=ei-platform-transponder] on each participating platform, then a selector, powered coordinator and bound uplink at the launch location. New selectors use Policy; Manual selects a platform by name, and Circuit reads [virtual-signal=ei-platform-id]. Choose Cohort controlled on the uplink.\n\nTarget retention preserves the existing choices: Sticky holds until demand is met; Single Shot releases after one launch; Threshold holds while remaining demand exceeds its floor. IDs, binding repairs, lease controls and the floor are under Advanced. Settings paste, clones and blueprints copy configuration, never live leases. Automatic IDs are allocated for copies; explicit duplicate IDs are reported as conflicts. A copied uplink binds automatically only to one unambiguous adjacent silo.
orbital-native-sources=Requests and Need can filter Planet, Platforms or All sources. Requests marked All are eligible for both shipping paths. Rocket manifests exclude platform-only requests. On the Way remains combined incoming cargo. Need is calculated separately for each platform before summing: max(0, requests − stock − incoming). Stock on another platform cannot satisfy that platform's shortfall.\n\nNative requests and provisioning remain authoritative for platform transfers. ESIR does not alter request sections or reserve/refill policies. Cohort launches hold mixed payloads containing an unrequested item or quality; excess quantities of eligible items are allowed. The panel identifies cargo to remove. Enabling native requests externally suspends competing cohort dispatch.
orbital-native-radar-title=Native radar telemetry
orbital-native-radar-one=[font=default-bold]One platform, one channel[/font]\n1. On the hub, enable the desired stock/status outputs on red. If using Set requests, select green as its input and keep the networks separate.\n2. Connect the hub's red output and a constant combinator emitting a chosen link-presence signal (for example L=1) to a powered radar. Select Universe and a SignalID channel dedicated to this platform.\n3. At the receiving factory, use a powered radar of the same force on the same Universe channel. Connect its red wire to the consuming circuit. Keep it separate from request inputs.\n\nThe configured channel identifies the platform and continues broadcasting as it moves. Reserve the presence signal for this link. Presence=1 with no item signals means empty stock; no presence means the transmitter/link may be unavailable. Power both ends. Radar telemetry has native circuit/entity costs even though this path requires no scanner polling.
orbital-native-radar-shared=[font=default-bold]Shared stock channel[/font]\nConnect several hubs' stock outputs to radars of the same force on one Universe channel. Their signals add together. Give each transmitter the same presence signal so its count indicates how many transmitters are currently connected. Name this network “Aggregate inventory”. It cannot retain individual platform identity or represent exact Need or guaranteed available supply.\n\nRadars transmit circuit signals; hubs do not output configured requests or committed incoming cargo. Use the exact scanner for Requests / On the Way / Need. Never feed aggregate radio totals into cohort dispatch as per-platform demand. ESIR does not build relays, choose channels or change your wiring.
