[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=Shortest rupture. Four rings, tight effect caps, no secondary family accent, and no massive explosions.
ei-flammable-rupture-fidelity-runtime-standard=Default. Six rings, moderate caps, one meaningful secondary accent, and restrained massive explosions.
ei-flammable-rupture-fidelity-runtime-cinematic=Eight rings, broader smoke and fire budgets, richer family accents, and a slower ceremonial outward bloom.
ei-flammable-rupture-fidelity-runtime-unbounded=Removes the hard visual caps and lets ready rings drain aggressively in the same tick. Intended for spectacle, not safety.
ei-gaian-saucer-wake-visual-fidelity-runtime-off=The vessel seals its afterimage and travels without visible remembrance.
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=Only a thin chromatic refusal follows the hull, brief and disciplined.
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=The wake is allowed to speak clearly, then fade before it becomes doctrine.
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=The wake widens, lingers, and bends with the saucer's turning oath.
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=The shell leaves a dense, luminous wound of motion wherever it passes.
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=The governor is removed; the saucer may write every shimmer the world can bear.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=The underhull seals its circles and moves without visible hover shimmer.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=Four emitter circles answer the ground briefly, with only a disciplined prismatic edge.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=The emitters write steady emerald rings beneath the hull as motion becomes pressure.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=The rings brighten, layer, and shear into mint-green prism fragments around each hover foot.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=Each emitter opens a dense luminous seal under the relic, almost devotional in its violence.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=The governor is broken; every hover foot may force the ground to remember the tank's passage.
