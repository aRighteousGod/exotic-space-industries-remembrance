[item-description]
ei-steam-loader=Steam-driven direct-feed loader with one shared filter across both belt lanes. Moves unstacked items only and requires live steam.
ei-loader=Direct-feed loader with one shared filter across both belt lanes. Moves unstacked items only.
ei-fast-loader=Fast direct-feed loader with one shared filter across both belt lanes. Moves unstacked items only.
ei-express-loader=Direct-feed loader with one shared filter across both belt lanes. Supports adjustable belt stacking up to 2.
ei-turbo-loader=Direct-feed loader with two per-lane filters, one for each belt lane. Supports adjustable belt stacking up to 2.
ei-neo-loader=Direct-feed loader with two per-lane filters, one for each belt lane. Supports adjustable belt stacking up to the current global belt stack limit.

