[item-description]
ei-fueler=An autonomous [color=orange]fueling tower[/color]. In vehicle mode it can service trains, cars, tanks, spidertrons, ammo turrets, artillery turrets, and artillery wagons. In equipment mode it fuels [color=blue]burner equipment in vehicle and player equipment grids, including burner-backed reactor equipment[/color]. It also removes [color=red]burnt fuel results[/color]. Higher quality lets one tower service more targets in the same update pass, but does not increase range; normal container quality rules still increase inventory capacity. More info in the Informatron ingame wiki.

