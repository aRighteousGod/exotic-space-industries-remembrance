welcome=Exotic Industries: Fuelwarden tower
welcome-text=The Fuelwarden tower is an automated support structure that watches for nearby targets and pushes fuel from its own inventory into them.\n\nIt can service vehicles, trains, spidertrons, ammo turrets, artillery, and equipment grids, and it can also pull spent fuel or burnt results back into itself if there is space.\n\nUse the GUI to choose whether the tower works on vehicle fuel consumers or equipment grid fuel consumers.\n\n[font=default-bold]It does not ask. It supplies.\nIt does not wait. It empties and fills.\n\nSet it once, then let it work.[/font]

welcome-text-2=Fuelwarden towers can keep up with moving targets, including trains in motion. Quality does not change range, but higher-quality towers can service more targets during the same update pass, so they handle busy depots better.\n\nThe tower's inventory still benefits from Factorio's normal quality container rules, so better quality also means more storage for fuel and ammo.\n\n[font=default-bold]These towers are efficient, but not omniscient.\nThe better the tower, the more work it can finish at once.[/font]
