[entity-name]
ei-fueler=Fuelwarden tower

[item-description]
ei-fueler=An autonomous [color=orange]fueling tower[/color]. It can service trains, cars, tanks, spidertrons, [color=blue]equipment grids[/color], and turret ammo slots, and it also removes [color=red]burnt fuel results[/color]. Higher quality improves how many targets it can service per update, while normal container quality rules still increase inventory capacity. More info in the Informatron ingame wiki.

