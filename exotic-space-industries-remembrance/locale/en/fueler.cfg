[mod-setting-description]
ei_fueler_max_updates_per_tick=Deprecated by the entity updates per tick setting.
ei-fueler_range=A higher range allows the tower to find targets that are further away. However, performance will decrease as towers need to scan larger areas.

[technology-name]
ei-fueler=Fuelwarden tower

[technology-description]
ei-fueler=The Fuelwarden tower can refuel vehicles, spidertrons, trains, ammo turrets, artillery, and vehicle/player equipment grids in its range. It transfers items from its inventory to nearby fuel inventories, and can only work on one target mode at a time. Use the GUI on the tower to choose between refueling vehicle fuel consumers or equipment grid fuel consumers. The tower will also pull every used up fuel and store it in its own inventory if possible.

