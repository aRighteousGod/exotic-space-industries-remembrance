welcome=Exotic Industries: Fuelwarden tower
welcome-text=The Fuelwarden tower is an automated support structure that watches for nearby eligible targets and pushes fuel from its own inventory into them.\n\nIn vehicle mode it services trains, cars, tanks, spidertrons, ammo turrets, artillery turrets, and artillery wagons. In equipment mode it fuels burner equipment in vehicle and player equipment grids, including burner-backed reactor equipment. If there is space, it can also pull spent fuel or burnt results back into itself.\n\nUse the GUI to choose both the target type and the fuel destination mode. If a tower looks idle, the most common cause is a mismatch there: a locomotive-target tower in equipment mode will not feed vehicle fuel inventories, and equipment mode only touches burner-backed equipment inside grids.\n\n[font=default-bold]It does not ask. It serves the circuit it has been given.\nIt does not wander beyond its range or its chosen mode.\n\nSet it once, then let it work.[/font]

welcome-text-2=Fuelwarden towers can keep up with moving targets, including trains in motion. Quality does not change range or cooldowns, but higher-quality towers can service more targets during the same update pass, so they handle busy depots better.\n\nIf a migration, mod interaction, or damaged runtime leaves the system out of sync, admins can rebuild the runtime state with /rescan_fuelers. The tower's inventory still benefits from Factorio's normal quality container rules, so better quality also means more storage for fuel and ammo.\n\n[font=default-bold]These towers are efficient, but not omniscient.\nThe better the tower, the more work it can finish at once.[/font]

welcome-text-3=Burner-backed reactor equipment is included in equipment mode.
