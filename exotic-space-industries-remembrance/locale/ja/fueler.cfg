[mod-setting-description]
ei_fueler_max_updates_per_tick=エンティティのティックごとの更新設定により非推奨になりました。
ei-fueler_range=より高い射程距離により、タワーはより遠くの目標を見つけることができます。ただし、タワーがより広いエリアをスキャンする必要があるため、パフォーマンスは低下します。

[technology-name]
ei-fueler=フュエルワーデン・タワー

[technology-description]
ei-fueler=Fuelwarden タワーは、範囲内の車両、スパイダートロン、列車、弾薬砲塔、大砲、車両/プレイヤー機器グリッドに燃料を補給できます。アイテムをそのインベントリから近くの燃料インベントリに転送し、一度に 1 つのターゲット モードのみで動作します。タワーの GUI を使用して、給油車両燃料コンシューマまたは機器グリッド燃料コンシューマのいずれかを選択します。また、タワーは使用済みの燃料をすべて回収し、可能であれば独自の在庫に保管します。

[exotic-industries-fueler]
fueler-gui-title=コンソール
fueler-gui-control-title=コントロール
fueler-gui-control-description=[font=default-bold]ターゲット タイプ[/font] [img=info]
fueler-gui-control-description-tooltip=タワーから燃料を補給されるターゲットのタイプを選択してください。他の改造列車は機関車タイプでサポートされています。他の改造車や戦車も車種に応じてサポートされています。どのタイプのスパイダートロンでも同様です。
fueler-gui-equipment-description=[font=default-bold]燃料供給先[/font] [img=info]
fueler-gui-equipment-description-tooltip=このタワーは車両またはその機器グリッドに燃料を補給する必要がありますか?

vehicle=車両のみ
equipment=機器グリッドのみ

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=フュエルワーデン・タワー
title_exotic-industries-fueler-informatron=フュエルワーデン・タワー

welcome=エキゾチック産業: 燃料監視塔
welcome-text=Fuelwarden タワーは、近くの目標を監視し、自身の在庫から燃料を押し込む自動支援構造です。\n\n車両、列車、スパイダートロン、弾薬砲塔、大砲、設備グリッドにサービスを提供でき、スペースがあれば使用済み燃料や燃えた燃料を自身に引き戻すこともできます。\n\nタワーが車両燃料消費者と設備グリッド燃料のどちらで動作するかを選択するには、GUI を使用してください。 \n\n[font=default-bold]質問はしません。それは供給します。\nそれは待ちません。空になったり、充填されたりします。\n\n一度設定してから、動作させてください。[/font]

welcome-text-2=フュエルワーデンの塔は、走行中の列車を含む移動目標に追いつくことができます。品質によって範囲は変わりませんが、高品質のタワーは同じ更新パスでより多くのターゲットにサービスを提供できるため、混雑したデポの処理が向上します。\n\nタワーのインベントリは Factorio の通常の品質コンテナ ルールの恩恵を受けているため、品質が向上すると燃料と弾薬の保管場所が増えることになります。\n\n[font=default-bold]これらのタワーは効率的ですが、全能ではありません。\nタワーが優れているほど、一度に完了できる作業が多くなります。[/font]
