[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=補給タワー
title_exotic-industries-fueler-informatron=補給タワー
welcome=Exotic Industries：補給タワー
welcome-text=補給タワーは、近くにある対象を監視し、インベントリから燃料を自動的に供給する全自動支援設備です。\n\n車両モードでは、列車／自動車／戦車／スパイダートロン／タレット／列車砲へ補給を行います。装備モードでは、車両やプレイヤーの装備グリッド内にある装備へ燃料を補給します。使用済み燃料を回収する機能も備わっていますが、インベントリに空きが無ければ機能しません。\n\n補給タワーの設定画面で動作モードを設定できます。補給タワーが意図したように動作しない場合、最も多い原因は設定の不一致です。例えば「機関車」を対象にした補給タワーが「装備モード」になっていると、機関車の燃料は補給されません。また「装備スロット」モードは、装備グリッド内の原子炉のような熱エネルギー装備にしか効果がありません。\n\n[font=default-bold]問答無用。与えられた回路に従って愚直に奉仕する。\n設定された範囲とモードを超えて余計な動作をすることはない。\n\n設定すれば設定した通りに働き続ける。[/font]
welcome-text-2=補給タワーは、走行中の列車を含めて移動する対象にも対応しています。高品質にしでも効果範囲や動作速度は変化しませんが、1回あたりで処理できる対象数が増加するため、高稼働な車両基地でも効率的に管理できます。\n\nデータの移行／他のMODとの不整合／データ破損等によりシステムが同期ズレを起こした場合は、管理者コマンド "/rescan_fuelers" を使用して再構築できます。補給タワーのインベントリは、チェストとしてfactorio共通の基準で品質の影響を受けるため、品質が上がると保管容量が増加します。
welcome-text-3=携帯原子炉系統も、「装備モード」の補給対象に含まれます。
[mod-setting-name]
ei_fueler_max_updates_per_tick=補給タワーの1tickあたりの最大更新数
ei-fueler_range=補給タワーの有効範囲
[mod-setting-description]
ei_fueler_max_updates_per_tick=非推奨
ei-fueler_range=範囲を広くすると、補給タワーの効果が遠くまで届くようになります。ただし各補給タワーの検索範囲が広くなるため、パフォーマンスが低下します。
