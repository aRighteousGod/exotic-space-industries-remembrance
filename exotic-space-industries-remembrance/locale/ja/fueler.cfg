[entity-name]
ei-fueler=補給タワー
[item-description]
ei-fueler=自律型の[color=orange]燃料供給設備[/color]。車両モードでは、列車／自動車／戦車／スパイダートロン／タレット／列車砲へ補給を行います。装備モードでは、車両やプレイヤーの装備グリッド内にある[color=blue]装備(原子炉を含む)[/color]へ燃料を補給します。また、[color=red]使用済燃料廃棄物[/color]を回収する機能もあります。品質が高くなると、より多くの対象を一度に同時に処理できるようになりますが、効果範囲は変化しません。通常のコンテナと同様にインベントリ容量は増加します。詳細はゲーム内のInformatron Wikiを参照してください。
[technology-name]
ei-fueler=補給タワー
[technology-description]
ei-fueler=補給タワーには二種類のモードがあります。車両モードでは、列車／自動車／戦車／スパイダートロン／タレット／列車砲へ補給を行います。装備モードでは、車両やプレイヤーの装備グリッド内にある装備へ燃料を補給します。補給タワーの設定画面で動作モードを設定できます。使用済み燃料を回収する機能も備わっていますが、インベントリに空きが無ければ機能しません。
