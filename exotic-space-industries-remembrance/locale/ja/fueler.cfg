[entity-name]
ei-fueler=フュエルワーデン・タワー

[item-description]
ei-fueler=自律型[color=orange]給油塔[/color]。列車、自動車、戦車、スパイダートロン、[color=blue]装備グリッド[/color]、砲塔の弾薬スロットにサービスを提供でき、[color=red]燃焼した燃料結果[/color]も除去します。品質が高くなると、更新ごとにサービスできるターゲットの数が向上しますが、通常のコンテナー品質ルールでもインベントリ容量は増加します。詳細については、Informattron のゲーム内 Wiki をご覧ください。

