[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=エメラルド・アポカリプス浮遊戦車
title_emerald_apocalypse_hover_tank=エメラルド・アポカリプス浮遊戦車
emerald-apocalypse-hover-tank=エメラルド・アポカリプス浮遊戦車
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank]はエキゾチック時代末期の浮遊要塞だ。優雅さには重すぎ、落下には献身しすぎている。エミッターの輪が船体を世界の上に縛り、固定砲が向きを判決へ変える。
emerald-apocalypse-hover-tank-2=水晶充填弾
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge]は[item=ei-emerald-apocalypse-cannon]のために運ばれる、封じられた一つの破断だ。発射時、戦車は怒りを撒き散らさない。緑の戒律を一つ開き、戦場に返答させる。
emerald-apocalypse-hover-tank-3=軌道片教義
emerald-apocalypse-hover-tank-text-3=軌道片はタレット装備ではなく、スクリプト制御の教義です。軌道片マニホールドは輪を3個から6個の有効軌道片へ引き上げます。再装填典礼は各軌道片の間隔を1.17秒から0.92、0.75、最後に0.58秒へ短縮します。標的判決は単純な近さではなく、巣、タレット、耐久力、損傷、距離を読む脅威スコアで標的を選びます。判決開口はビームを広げ、各命中が近くの標的やビーム通路上の標的へ上限付きダメージを流します。
emerald-apocalypse-hover-tank-4=軌道片コンソール
emerald-apocalypse-hover-tank-text-4=戦車のインベントリを開くと、車両ウィンドウの横に小型の軌道片パネルが現れます。配置済みの各戦車は、0から研究済み上限までの軌道片を維持できます。分散照準は近くの最良の脅威へ判決を分け、Focus はすべての有効軌道片を現在の同じ目標へ向けます。表示DPSには、有効軌道片数、レーザー兵器ダメージ7+の繰り返し研究、配置済み戦車の品質が反映されます。

emerald-apocalypse-hover-tank-5=船体教義
emerald-apocalypse-hover-tank-text-5=船体教義は有限です。充填教義は予備充填を9.48秒から8.5、7.58、最後に6.67秒へ短縮し、各段階にはそれぞれ短い充填音が割り当てられます。慣性誓約は発射後の封印を15秒から13.17、11.33秒へ下げます。庇護契約はシールドの痛みに近くの敵へ答えさせます。方位竜骨は横滑りを残したまま浮遊車体を改善します。崩壊命令は52タイルの終端波を広げずに硬化します。
emerald-apocalypse-hover-tank-6=開封制御
emerald-apocalypse-hover-tank-text-6=アポカリプス再帰は車両別トグルを開きます。充填弾回収、竜骨航跡、分岐傷跡、分裂航跡、衝撃開封は標準で有効です。これは穏やかな教義ではありません。誓約を狭く保ちたい車両では個別に無効化してください。
