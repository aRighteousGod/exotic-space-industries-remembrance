ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=四つのエミッター円が短く地面に応え、抑制されたプリズムの縁だけを残す。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=移動が圧力へ変わるにつれ、エミッターは船体の下に安定したエメラルドの輪を書く。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=輪は明るく重なり、各浮遊脚の周りでミントグリーンのプリズム片へ裂ける。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=各エミッターが遺物の下に濃密な発光印章を開く。その暴力はほとんど祈りに近い。
