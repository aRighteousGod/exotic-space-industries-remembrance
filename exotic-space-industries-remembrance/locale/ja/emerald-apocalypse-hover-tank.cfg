emerald-apocalypse-hover-tank=ナインボール・セラフ
emerald-apocalypse-hover-tank-2=クリスタル充填弾
emerald-apocalypse-hover-tank-3=イクシードオービットドクトリン
emerald-apocalypse-hover-tank-4=イクシードオービットコンソール
emerald-apocalypse-hover-tank-5=車体ドクトリン
emerald-apocalypse-hover-tank-6=車体機能の封印と解除
emerald-apocalypse-hover-tank-text=[item=ei-emerald-apocalypse-hover-tank]はエキゾチック時代の終盤に生み出されたホバー要塞である。優雅さには程遠く、巨大で重厚で圧倒的な破壊力を誇る。発光するリングが車体を浮遊させ、固定式の主砲がその旋回を裁きへと変える。
emerald-apocalypse-hover-tank-text-2=[item=ei-emerald-apocalypse-charge]は、[item=ei-emerald-apocalypse-cannon]専用に用いられる「封印された破滅」である。怒り狂って発射するものではなく、ただ一筋のエメラルドの掟を開き、世界そのものに応答させる。
emerald-apocalypse-hover-tank-text-3=イクシードオービットはタレット装備ではなく、自動制御された審判である。同時稼働するイクシードオービットは最大3機(初期)、「エメラルドの多様性」研究により最大6機まで増加する。「祈祷」研究は1機あたりのリロード時間を1.17→0.92→0.75→0.58秒と短縮する。「照準理論」研究は、単に一番近い獲物を選ぶのではなく、巣／タレット／耐久力／ダメージ／距離を考慮した脅威スコアを算出し、適切な対象を優先して攻撃するようになる。「審判」研究はビームを拡張し、着弾時に拡散ダメージを発生させる。
emerald-apocalypse-hover-tank-text-4=戦車のインベントリを開くとイクシードオービットコンソールが表示される。戦車1台ごとに、設定値の下限は0、研究によって増加した最大数までのイクシードオービットを制御できる。「分散照準」は近くの対象へ均等に攻撃する。「集中照準」は最も優先度の高いターゲットに対して、全イクシードオービットが集中攻撃を行う。表示されているDPSには、イクシードオービットの数、「レーザー兵器のダメージ」の無限研究、該当の戦車の品質の影響を受ける。
emerald-apocalypse-hover-tank-text-5=車体ドクトリンは有限の研究である。「教義」は主砲チャージ時間を、9.48→8.50→7.58→6.67秒へ短縮する。「誓約」は主砲発射後のクールダウンを、15.0→13.17→11.33秒へ短縮する。「契約」はシールドへのダメージを近くの敵へ反射する。「竜骨」は重くクセの強いホバー挙動を改善する。「勅令」は着弾点衝撃波の範囲(52タイル)を広げることなく威力のみを強化する。
emerald-apocalypse-hover-tank-text-6=「再帰」は車両別のON/OFF設定を可能にする。クリスタル充填弾の回収／航跡痕／拡散ビーム／衝撃波は、デフォルトでONになっており、極めて過激な設定になっている。挙動を制限したい車両では、個別に無効化する必要がある。
