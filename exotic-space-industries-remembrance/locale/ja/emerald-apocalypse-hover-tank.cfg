[item-description]
ei-emerald-apocalypse-hover-tank=固定式の水晶砲と、地面を拒む心臓を抱えた遺物の浮遊要塞。圧力そのもののように進み、確信があった場所にエメラルドの沈黙を残す。
ei-emerald-apocalypse-cannon=船体に固定された水晶ビーム砲。追尾はしない。戦車が向いた先だけを裁く。
ei-emerald-apocalypse-charge=エメラルド・アポカリプス砲のために封じられた水晶の破断。一つの誓約、一つの放電、世界に刻まれる緑の傷。

[entity-description]
ei-emerald-apocalypse-hover-tank=エメラルドのエミッターで吊られた遺物の浮遊要塞。砲身は発射前に圧力を集め、充填弾はプラズマと反動、そして確信の跡に残る緑の空白となって放たれる。

[technology-description]
ei-emerald-apocalypse-hover-tank=エメラルド・アポカリプス浮遊戦車を目覚めさせる。固定式の水晶砲を持つ浮遊攻城機は、前進を教義へ、教義を破滅へ変える。
ei-emerald-shard-manifold-1=エメラルド・アポカリプスの軌道片教義を、有効軌道片4個まで引き上げる。
ei-emerald-shard-manifold-2=軌道片マニホールドに第二の補強を編み込み、教義を有効軌道片5個まで引き上げる。
ei-emerald-shard-manifold-3=マニホールドの誓約を完成させ、6個の有効軌道片を同時に戦車へ応えさせる。
ei-emerald-reload-litany-1=軌道片の再装填教義を、1個あたり0.92秒に短縮する。
ei-emerald-reload-litany-2=軌道片の輪が0.75秒ごとに戻るまで、典礼を反復する。
ei-emerald-reload-litany-3=再装填の律動を0.58秒で封じる。待機は短く、判決は多く。
ei-emerald-target-verdict=軌道片が小さな脅威に判決を浪費せず、巣、タレット、近い敵、すでに損傷した標的を優先できるようにする。
ei-emerald-verdict-aperture-1=軌道片の一撃の周囲に最初のエメラルド開口を開き、上限付きの副次ダメージを加える。
ei-emerald-verdict-aperture-2=軌道片の着弾開口を、より広い範囲の判決へ拡張する。
ei-emerald-verdict-aperture-3=軌道片の判決を、密集した敵を罰するほど広いエメラルドの傷へ変える。

ei-emerald-charge-catechism-1=砲身の祈りを速め、終末の予備充填を8.5秒に短縮します。
ei-emerald-charge-catechism-2=エメラルドの音節をさらに圧縮し、7.58秒に短縮します。
ei-emerald-charge-catechism-3=最も苛烈な韻律で教義を封じ、発射前6.67秒にします。
ei-emerald-inertial-oath-1=反動後の船体復帰を早め、発射後冷却を13.17秒にします。
ei-emerald-inertial-oath-2=反動の誓約を硬化させ、発射後冷却を11.33秒にします。
ei-emerald-aegis-covenant-1=シールドの痛みを、敵だけを打つエメラルドの反撃花に変えます。
ei-emerald-aegis-covenant-2=庇護契約を深め、膜が傷ついた時の反撃をより遠く強くします。
ei-emerald-vector-keel-1=重い横滑りを残したまま、浮遊竜骨の操作性を高めます。
ei-emerald-vector-keel-2=後退、制動、漂流制御をさらに洗練します。
ei-emerald-collapse-mandate-1=終端崩壊の圧力を上げますが、傷跡は境界内に留めます。
ei-emerald-collapse-mandate-2=同じ52タイルの裁きに、より多くのプラズマを流します。
ei-emerald-collapse-mandate-3=命令を完了します。終端は bounded のまま、裁定だけが苛烈になります。
ei-emerald-apocalypse-recursion=充填回収、航跡、分岐傷跡、分裂光線、過剰衝撃の危険な車両別制御を開きます。

