[exotic-industries-informatron]
flammable-ruptures=可燃性流体の燃焼
flammable-ruptures-2=画面演出モード
flammable-ruptures-3=汚染残留と延焼
flammable-ruptures-4=宇宙プラットフォーム上の延焼
flammable-ruptures-text=タンク／パイプ／地下パイプ／タンク貨車、またその他の流体を保持する施設は、内部に可燃性流体が残った状態で破壊されると、爆発するおそれがあります。液体／気体／異星由来の燃料混合物など、流体によっては二次被害が発生する場合があります。\n\n爆発するかどうかは、破壊されたときのダメージ属性の影響を受けます。火炎／物理的衝撃／爆発／プラズマなどのエネルギーによる破壊は、冷気や毒に比べて爆発を引き起こす可能性がはるかに高くなります。
flammable-ruptures-text-2=現在の起動モード: [font=default-bold]__1__[/font]\n\n[font=default-bold]ライト[/font]は最もコンパクトな演出です。[font=default-bold]スタンダード[/font]はデフォルト設定です。[font=default-bold]シネマティック[/font]はより豪華な演出になります。[font=default-bold]無制限[/font]は上限なしに、最大限の演出を描写します。
flammable-ruptures-text-3=汚染は爆発した瞬間に発生しますが、それ以外の効果は波状（リング状）に外側へ拡大していきます。爆発、煙、火災の発生、焦げ跡、周囲へのダメージは、一度あらかじめ計算された後に連続するtickに渡って解放されるため、例えば密集した巨大タンクが破壊された場合でも、1フレームで崩壊の全てを描画することはありません。\n\n地下パイプのペアによる誘爆も同じ仕組みになっています。「無制限」設定はパフォーマンスに対して意図的に危険な設計となっていますが、その代償を支払う価値があるかはあなた次第です。
flammable-ruptures-text-4=宇宙プラットフォーム上での爆発は、周囲へのダメージや接続されたパイプへの誘爆は発生しますが、プラットフォーム全体が炎に包まれることはありません。排出される煙はよりコンパクトになり、炎は爆発源と直接引火した部分にのみ発生します。プラットフォームへのダメージも、無制限に飛び散るのではなく、爆発した部分ピンポイントに発生します。
menu_flammable_ruptures=可燃性流体の燃焼
title_flammable_ruptures=可燃性流体の燃焼
[mod-setting-name]
ei-flammable-rupture-fidelity=爆発グラフィック設定
[mod-setting-description]
ei-flammable-rupture-fidelity=可燃性流体の爆発時の視覚効果を制御します。「ライト」は爆発を簡潔に抑えます。「スタンダード」がデフォルトです。「シネマティック」はより多くのリング（波状）に渡って演出を広げます。「無制限」は視覚効果の上限を撤廃します。
[string-mod-setting]
ei-flammable-rupture-fidelity-cinematic=シネマティック
ei-flammable-rupture-fidelity-lean=ライト
ei-flammable-rupture-fidelity-standard=スタンダード
ei-flammable-rupture-fidelity-unbounded=無制限
[string-mod-setting-description]
ei-flammable-rupture-fidelity-cinematic=8段階の波状演出、より広範な煙と火炎の割り当て、より豊かなアクセント演出、そして外側へゆっくり広がる厳かな爆発。
ei-flammable-rupture-fidelity-lean=最もコンパクトな演出。4段階の波状演出、強いエフェクト制限、副次的なアクセント演出なし、大規模爆発なし。
ei-flammable-rupture-fidelity-standard=デフォルト。6段階の波状演出、適度な制限、意味のある副次アクセント1種、抑えめな爆発。
ei-flammable-rupture-fidelity-unbounded=視覚効果の上限を削除し、演出を最大限に描写します。安定ではなく演出の豪快さを重視した設定です。巨大なタンクが破裂した際などに、UPSを著しく低下させるおそれがあります。
