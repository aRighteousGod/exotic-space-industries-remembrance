[mod-setting-name]
ei-flammable-rupture-fidelity=可燃性破裂の演出密度

[mod-setting-description]
ei-flammable-rupture-fidelity=可燃性流体の破裂で、どれだけ濃く視覚効果と危険の伝播を描くかを決めます。軽量は短く控えめ、標準が既定、シネマティックはより長く演出し、無制限は効果上限を外すため大型タンク破裂時にUPSを大きく傷つけることがあります。

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=軽量
ei-flammable-rupture-fidelity-standard=標準
ei-flammable-rupture-fidelity-cinematic=シネマティック
ei-flammable-rupture-fidelity-unbounded=無制限

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=最短の破裂。4リング、厳しい上限、二次アクセントなし、massive-explosionなし。
ei-flammable-rupture-fidelity-standard=既定設定。6リング、適度な上限、意味のある二次アクセント1つ、控えめな massive-explosion。
ei-flammable-rupture-fidelity-cinematic=8リング。煙と炎の予算が広がり、家系アクセントも増え、外側へゆっくり咲きます。
ei-flammable-rupture-fidelity-unbounded=視覚上限を外し、準備できたリングを同じtick内で積極的に消化します。安全より見栄え優先です。

[exotic-industries-informatron]
menu_flammable_ruptures=可燃性破裂
title_flammable_ruptures=可燃性破裂
flammable-ruptures=可燃性流体の破裂
flammable-ruptures-text=貯蔵タンク、配管本体、地下配管、貨車、流体を抱えた機械は、内部に十分な可燃性流体を残したまま破壊されると破裂することがあります。ランタイムは手書きの固定リストではなく、最終的に読み込まれた流体プロトタイプを読むため、石油系、ガス系、異質燃料系の混合物はそれぞれ別の後始末の表情を保ちます。\n\n発火判定は致死ダメージ種別も見ます。炎上、衝撃、爆発、プラズマのような高エネルギー死は、冷気や毒よりずっと破裂を起こしやすくなります。
flammable-ruptures-2=演出モード
flammable-ruptures-text-2=現在の起動モード: [font=default-bold]__1__[/font]\n\n[font=default-bold]軽量[/font]は短く厳しく抑えます。[font=default-bold]標準[/font]は既定で、公開向けの本道です。[font=default-bold]シネマティック[/font]はより多くのtickで大きな広がりを残します。[font=default-bold]無制限[/font]は上限を外し、準備できたリングを同じtick内で積極的に吐き出します。
flammable-ruptures-3=伝播と代償
flammable-ruptures-text-3=汚染は死亡時に即座に適用されますが、破裂の残りは今やリングごとに外へ進みます。爆発、煙、炎の配置、焦げ跡、周囲へのダメージは一度だけ事前計算され、その後複数tickに分けて放たれるため、巨大タンクの群れが一枚のフレームで終末全部を生成しようとはしません。\n\n地下配管の対向先への追撃も同じキューを通ります。無制限は意図的に性能へ危険です。満タンの silo-2 が4基同時に裂ければ美しくはありますが、代価はあなたが払います。
