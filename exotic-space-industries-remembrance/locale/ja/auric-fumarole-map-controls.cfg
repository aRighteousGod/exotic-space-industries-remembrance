[autoplace-control-descriptions]
ei-auric-fumarole=「頻度」は噴出孔の出現確率と再出現の試行回数を調整します。「サイズ」は稼働中の噴出孔の目標数を調整し、見た目の大きさは変わりません。「豊富さ」は埋蔵量を調整し、100%では新しい噴出孔1か所につき40,000～80,000になります。無効にすると新たな噴出孔は出現しません。既存の噴出孔の残量は変わりません。噴出孔はマップ生成のプレビューには表示されません。ゲームプレイ中にスクリプトが動作している場合にのみ出現します。

[exotic-industries-informatron]
auric-fumarole-defaults=以下の数値はマップ設定がすべて100%の場合です。噴出孔の数は、配置可能な地形と間隔によって制限されます。
