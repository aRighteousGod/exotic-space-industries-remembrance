[exotic-industries-informatron]
orbital-native-title=標準の配送機能から始める
orbital-native-shipping=通常のロケット配送とプラットフォーム間輸送は、Factorio標準の要求・供給機能で動作します。コホート装置は不要です。供給元、最小配送量、供給の有効・無効は標準画面で設定してください。標準の自動配送が積み込み、混載、配送先の選択、打ち上げを管理します。サイドパネルには実際の配送先を表示します。\n\n新しいアップリンクは標準の自動配送を選択した状態になりますが、設置だけではサイロの設定を変えません。ボタンを押すと自動要求が有効になります。既存のアップリンクはコホート制御を維持します。切り替えには、積載貨物・輸送中の貨物・進行中の打ち上げがないことが必要です。
orbital-native-cohort=配送先を固定する場合や工場・回路で積み込む場合は、各プラットフォームに[entity=ei-platform-transponder]を、打ち上げ場所にセレクター、通電したコーディネーター、サイロに割り当てたアップリンクを設置し、コホート制御を選択してください。新しいセレクターはポリシーモードです。手動では名前で配送先を選び、回路では[virtual-signal=ei-platform-id]を読み取ります。\n\n配送先の保持方法は従来どおりです。継続は需要を満たすまで、単発は1回の打ち上げまで、閾値は残りの需要が設定値を上回る間、配送先を保持します。ID、割り当ての修復、リース操作、閾値は詳細設定にあります。設定の貼り付け・複製・建設計画は設定だけをコピーし、稼働中のリースはコピーしません。自動IDは新規採番し、手動IDの重複は警告します。コピーしたアップリンクは、隣接する割り当て可能なサイロが1つだけの場合に自動接続します。
orbital-native-sources=要求と需要は、惑星・プラットフォーム・すべての供給元で絞り込めます。「すべて」は両方から供給可能です。ロケット配送にはプラットフォーム限定の要求を含めません。「輸送中」は全供給元の合計です。需要は各プラットフォームで max(0, 要求 − 在庫 − 輸送中) を計算してから合計します。別のプラットフォームの在庫では不足を埋めません。\n\nプラットフォーム間輸送は標準の要求・供給設定に従います。ESIRは要求セクションや備蓄・補充設定を変更しません。要求されていない品目や品質が混ざった貨物はコホートの打ち上げを停止します。要求対象の品目なら数量超過は許可します。取り出すべき貨物はパネルに表示されます。標準の要求を外部から有効にするとコホート配送を停止します。
orbital-native-radar-title=標準レーダーで信号を送る
orbital-native-radar-one=[font=default-bold]1プラットフォームに1チャンネル[/font]\n1. ハブの在庫・状態出力を赤線に設定します。「要求を設定」を使う場合は入力を緑線にし、ネットワークを分離します。\n2. 赤線の出力と、接続確認用の信号（例：L=1）を出す定数回路を、通電したレーダーへ接続します。宇宙モードを選び、このプラットフォーム専用の信号チャンネルを設定します。\n3. 受信側も同じ勢力・同じ宇宙チャンネルのレーダーを使い、電力を供給します。赤線を受信回路につなぎ、要求入力から分離します。\n\n移動中も設定したチャンネルで送信し続けます。接続確認=1でアイテム信号がなければ在庫は空です。接続確認がなければ送信側や回線が停止している可能性があります。両端に電力が必要です。スキャナーの読み取り処理は不要ですが、標準の回路・レーダー処理の負荷は残ります。
orbital-native-radar-shared=[font=default-bold]在庫の共通チャンネル[/font]\n同じ勢力の複数のハブを、同じ宇宙チャンネルのレーダーへ接続すると、信号が合計されます。各送信側で同じ接続確認信号を出せば、接続中の送信機数を確認できます。このネットワークは「合計在庫」と呼んでください。各プラットフォームの区別は失われ、正確な需要や配送可能な供給量を示すものではありません。\n\nレーダーが送るのは回路信号です。ハブには設定済み要求や配送確定済みの貨物を出力する機能はありません。要求・輸送中・需要には正確なスキャナーを使用してください。無線の合計値を、個々のプラットフォームの需要としてコホートへ入力しないでください。ESIRは中継器の設置、チャンネルの割り当て、配線の変更を行いません。
