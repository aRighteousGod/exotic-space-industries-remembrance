[ei-ecology-guide]
intro-heading=工場の周りの地面を見てみる
intro=工場が残すものは建物だけではありません。汚染は自然の地面を傷め、近くの木を灰色に変えます。採掘の周囲には、むき出しの地面が残ることもあります。環境がきれいになれば、その一部の地面や森林は回復できます。「地形・生態系の変化」には局所的な自然災害と季節のカレンダーもあり、ナウヴィス、ガイア、ヴルカヌス、グレバ、フルゴラ、アクィロそれぞれに合ったルールを使います。宇宙プラットフォーム、未対応の惑星、惑星と関係のない補助サーフェスは対象外です。\n\nまず「土壌」で地面、回復、採掘、血液の影響を確認してください。「森林」は木と火災、「岸辺」は水と崖を扱います。「季節」ではカレンダーと惑星ごとの違いを説明します。「設定」は、設定選び、報告の読み方、変化がなかなか現れないときの確認に役立ちます。TerrainEvolutionとTerrainEvolution2から着想を得ていますが、処理上限と保護にはESIR独自のルールを使います。
defaults-heading=新しい設定で有効になるもの
defaults=新しい設定では、生態系と個別の機能がすべて有効になります。新しい掘削痕の回復、樹木の自然老化、枯れ木の分解、岸辺の変化、崖の風化、血液による土壌変化、舗装の腐食、季節による生態系変化、季節による昼の長さの変化も含みます。望む景観に合わせて、それぞれ個別に無効にできます。\n\n[font=default-bold]初期設定：[/font]生態系変化の強さは「控えめ」、処理負荷は「軽量」です。森林火災は「延焼なし」で、「延焼あり」は別に選びます。既存のセーブでは、保存した設定と明示的なサーフェス上書きを維持します。初期値が選択済みの設定をリセットすることはありません。\n\n[font=default-bold]知っておきたいこと：[/font]有効な機能にも、適した地面や植物、必要な環境条件、システムがその場所を処理する時間が必要です。確率判定がある場合、確認しても変化しないことがあります。有効化は変化を許可する設定であり、すべての場所をすぐに変える指示ではありません。
observation-heading=清浄か汚染かは、繰り返し観測して判断する
observation=システムはチャンクと呼ばれる地図の区画を順に選んで汚染を測定し、その値を周辺の判断に使います。清浄や汚染が続いていると判断するには、繰り返しの観測が必要です。最近調べていない土地は「不明」であり、自動的に健全とは扱いません。\n\n[font=default-bold]初期設定：[/font]汚染状態は汚染度100以上を五分間観測すること、清浄状態は25以下を十分間観測することです。25より大きく100より小さい場合、両方の観測期間を最初から数え直します。シミュレーション時間で20秒を超える観測の空白も、状態が続いているという判断を中断します。\n\n[font=default-bold]知っておきたいこと：[/font]測定がないことや、別の種類の汚染物質は、空気が清浄である証拠にはなりません。探索済みの地図が広いほど、観測が行き渡るまで時間がかかります。観測期間は変化に必要な条件であり、終了時に各タイルが必ず変わるタイマーではありません。
protection-heading=工場や特別な場所は守る
protection=通常の生態系変化は、舗装、埋立地、土台、覆われた地面を変更しません。機械などの設備、ゴースト、残っている鉱床、栽培植物とその土壌、金質の管理区域、特別に配置された場所、対象外の地形も保護します。対象となる普通の野生樹木や小さな自然の装飾物があるだけでは、そこを工業用地とは見なしません。\n\n[font=default-bold]知っておきたいこと：[/font]保護は障害物の外側にも及ぶ場合があります。岸辺の変化と自然物への作用では、一般の保護余白が小さくても、少なくとも八タイルの間隔を空けます。変更の直前にも保護を確認するため、新しく建てた機械が、すでに待機していた変化を止めることもあります。\n\n舗装の腐食には、対象となる空いた道やコンクリートだけを変える例外があります。岸辺は特定の地面と水の組み合わせに限って変化します。「延焼あり」の火災は、確認済みの着火地点の外まで広がる場合があります。機能を無効にすると新たな活動は止まりますが、起きた変化は通常、対応する回復処理で直るまで残ります。
soil-heading=汚染は自然の地面を少しずつ傷める
soil=工業汚染が続くと、自然の地面は段階的に変わります。ナウヴィスなら草地から土、砂漠、砂へと進む場合があります。他の惑星では、固有の火山地形、湿地、岩盤、雪を使います。汚染を減らし、発生条件を満たさなくなれば、それ以上の損傷を防げます。\n\n[font=default-bold]初期設定：[/font]「控えめ」での土壌確認の基準間隔は二分で、元の設定値は60秒です。季節による活動の変化と処理待ちによって、その場所に確認が回ってくる時期は変わります。汚染状態を五分間観測する条件も必要です。\n\n[font=default-bold]知っておきたいこと：[/font]一回に調べるのは小さな範囲で、チャンク全体を塗り替えません。最大劣化段階数は、一つの場所に記録できる変化の段数を制限します。対応する変化の終端に達した地面には次の段階がありません。各惑星は固有の地形を保ちます。
recovery-heading=環境がきれいになると、記録した損傷を戻せる
recovery=環境がきれいになると、傷んだ地面は回復できるようになります。ESIRは自分が加えた地形変化を覚えておき、一段階ずつ逆にたどって、正確な元の地面へ戻します。草地が土になり、その後に砂になったなら、適当な草地を選ぶのではなく、保存した変化を戻っていきます。\n\n[font=default-bold]初期設定：[/font]「控えめ」の回復間隔は八分で、元の設定値は240秒です。この基本間隔は土壌変化の基本間隔の四倍です。清浄な状態の十分間の観測も必要ですが、二つの条件は並行して進められます。変化の強さは回復間隔を変えますが、季節による活動の変化は変えません。どちらの間隔も、経過した瞬間の回復を保証しません。\n\n[font=default-bold]知っておきたいこと：[/font]回復にはESIRが加えた損傷の確かな記録が必要です。地面を覆って建築したり、他のシステムが地面を置き換えたりすると、記録が使えなくなる場合があります。後から覆いを取り除いても、その記録は戻りません。古い未記録の地面や海岸線、除去された崖、破壊された木は復元できません。
depletion-heading=鉱床が尽きると掘削痕が残ることがある
depletion=有限の鉱床が尽きると、近くの露出した地面が乱される場合があります。枯渇位置が、その資源カテゴリを採掘できる火力クァーリー、蒸気クァーリー、電動クァーリー、大型掘削機の範囲内にあることが必要です。品質による採掘範囲の変化も考慮します。通常の掘削機と無限資源は対象外です。\n\n[font=default-bold]初期設定：[/font]影響半径56タイルの中で、半径三タイルの小さな区域を選びます。その区域内の対象となる位置ごとに70%の確率で変化します。残っている鉱石と保護された地面は変更しません。\n\n[font=default-bold]知っておきたいこと：[/font]きっかけは鉱床の枯渇ですが、枯渇イベントはどの掘削機が掘り尽くしたかをESIRに伝えません。対象機種の採掘範囲内にあるかどうかが判断基準です。区域は少しずつ処理するため、掘削機が止まった後に掘削痕が現れることもあります。大量の枯渇が続くと、近くの依頼をまとめたり、新たな受付ができなくなったりします。ただし、受け付けた依頼を待ち時間だけを理由に捨てることはありません。
working-heading=稼働中のクァーリーも周囲の地面を変える
working=対象のクァーリーや大型掘削機は、有限資源を採掘している途中にも掘削痕を残せます。活動中で状態表示が「稼働中」、同じサーフェス上に有効な有限の採掘対象があることが必要です。鉱床枯渇時の掘削痕とは別の仕組みです。待機中の掘削機は稼働由来の掘削痕を作りません。\n\n[font=default-bold]初期設定：[/font]「控えめ」では判定機会の基準間隔が十分で、元の設定値は300秒です。各機会に10%の確率で掘削痕の区域を依頼します。その区域では、対象となる位置ごとに別途70%の確率を使います。季節と処理待ちにより、実際の確認時期は変わります。\n\n[font=default-bold]知っておきたいこと：[/font]残存鉱石は保護されるので、掘削痕は近くの露出した地面にできる場合があります。ESIRは同じ四系統の対象掘削機を上限付きの一覧で管理し、建設と撤去に合わせて更新します。待機中の掘削機も一覧には残せます。確認が遅れても現在の判定を一度行うだけで、逃した機会をまとめて再実行しません。サーフェスの生態系を無効にすると、確認と待機中の掘削痕の適用を休止します。
mining-recovery-heading=掘削痕はどの地面まで回復するのか
mining-recovery=掘削痕の回復は、掘削痕ができる直前の地面へ戻します。汚染ですでに草地が土になっていたなら、採掘からの回復が戻す先はその土です。採掘の記録は以前の生態系の回復経路を置き換えるため、その記録からさらに前の草地へは戻れません。その後に記録した採掘の損傷は、引き続き逆にたどれます。\n\n[font=default-bold]初期設定：[/font]新たに記録する掘削痕の回復は有効です。「土壌の回復」と「掘削痕の回復」の両方を有効にする必要があります。有効な回復記録が残っていることと、清浄状態の観測条件も必要です。\n\n[font=default-bold]知っておきたいこと：[/font]掘削痕の回復が無効な間にできた損傷は恒久的です。後から有効にしても、その未記録の掘削痕は復元できません。サーフェスの生態系を無効にすると、受け付け済みの採掘処理は休止します。再有効化後は通常の処理上限内で再開し、逃した試行を一度に実行しません。
blood-heading=異星生物の血液が地面の回復を助ける
blood=敵の生物や巣が死亡すると、血液の影響で近くの地面が、記録した損傷を一段階戻せる場合があります。これは直接の回復効果で、通常の清浄状態の観測期間を待たずに働きます。有効なESIRの損傷記録、関係する機能の有効化、通常の地形保護は必要です。採掘の損傷には「掘削痕の回復」も必要です。\n\n[font=default-bold]初期設定：[/font]対象の死亡ごとに10%の確率で、近くの小さな区域を処理対象として受け付けます。その区域の変更は、処理に余裕ができた後に行います。\n\n[font=default-bold]知っておきたいこと：[/font]死体があれば必ず回復するわけではなく、恒久的な回復地帯も残りません。記録のない場所で元の地形を作り出すことはできません。戦闘中の見た目の死亡演出とは別の効果です。処理が混み合うと、新しく受け付けられる区域数が制限される場合があります。
paving-heading=血液は露出した舗装を腐食させることもある
paving=「血液による土壌変化」と「舗装の腐食」が両方有効なら、敵の死亡地点の区域で、対象となる石の道やコンクリートを取り除き、保存された下地タイルを露出させる場合があります。有効な土壌回復の一段階があるときはそちらを優先し、回復できないときに舗装を調べます。対象となる露出した舗装を残したい場合は、この機能を無効にしてください。\n\n[font=default-bold]初期設定：[/font]血液効果を受け付ける判定の後、腐食を1%の確率で試します。受け付けた区域内の確率であり、どこで倒した敵にも一律1%ではありません。\n\n[font=default-bold]知っておきたいこと：[/font]設備があるなどの保護対象の舗装と土台は除外します。下地も既知で有効なタイルでなければなりません。通常の舗装保護に対する特別な例外です。除去した舗装は返却せず、回復処理でも敷き直しません。舗装の設定が有効でも、血液効果を無効にすると新しい腐食の試行は止まります。
stress-heading=汚染は野生の木を灰色に変えることがある
stress=汚染状態が続くと、対象の野生樹木は色を失うことがあります。木はその場で生きており、灰色化は焼失や枯れ木への変化とは違います。ESIRは元の色の段階と自分が加えた衰弱を記録し、後からその衰弱を戻せるようにします。栽培植物、特殊な植物、保護された場所、対象外の樹種には作用しません。\n\n[font=default-bold]初期設定：[/font]「控えめ」での衰弱確認の基準間隔は十分で、元の設定値は五分です。変化の強さ、季節による活動、観測範囲、樹木検索の上限によって、個々の木に確認が回る時期は変わります。汚染状態の観測条件も必要です。\n\n[font=default-bold]知っておきたいこと：[/font]完全に灰色になった木を、さらに灰色にはできません。他のシステムが記録済みの木の色の段階を変えた場合、ESIRは新しい姿を上書きせず、その記録を手放すことがあります。
greening-heading=衰弱した木は元の色を取り戻せる
greening=汚染を十分長く低く保つと、ESIRによって衰弱した木は徐々に元の姿へ戻れます。生まれつき灰色の木は、その自然な色を保ちます。同じ木が生きて残り、記録どおりの色の段階にあり、清浄状態の継続観測ができている必要があります。\n\n[font=default-bold]知っておきたいこと：[/font]伐採、置き換え、破壊でその木の回復はできなくなります。色の回復は、独自の記録を持つ樹木の衰弱機能に属します。土壌回復、自然再生、老化、分解とは別です。地面が健全に見えても以前の木が戻るとは限らず、一本の回復だけで周囲すべての地面が回復条件を満たしたとも言えません。
regrowth-heading=残った木を起点に森林がゆっくり広がる
regrowth=清浄な状態が続くと、適した野生樹木から近くに新しい対象樹木を生やせます。在来の森林を少し残しておけば、自然再生の起点になります。新しい木には、適した地面と保護条件の確認が必要です。ガイアでは現地のバイオームに合う樹種を選びます。栽培作物を自然再生の樹種には使いません。\n\n[font=default-bold]初期設定：[/font]「控えめ」の成長機会の基準間隔は二十分で、元の設定値は十分です。そこに季節変動と処理待ちが加わります。新しい位置は、地図の各軸方向に最大八タイル離れた範囲から選べます。各方向四タイルの範囲に対象の自然樹木がすでに16本あれば、成長を抑えます。新しい木の生成成功の間には、全サーフェスを通じて最低十秒を空けます。\n\n[font=default-bold]知っておきたいこと：[/font]これは周辺へゆっくり森林を広げる仕組みです。適した種子供給樹木が残っていない孤立した伐採地は、空いたままになることもあります。清浄な観測、十分な空間、処理の順番がそろう必要があります。設定間隔は、すべての木が次の木を必ず生やす約束ではありません。
aging-heading=老化は生きた木を枯れ木に置き換える
aging=樹木の自然老化は、対象となるナウヴィスの生木を取り除き、在来の枯れ木に置き換えることがあります。汚染による衰弱とは独立して働くため、緑の木も選ばれます。他の原因で除去されるまで生木を残したい場合は、老化を無効にしてください。\n\n[font=default-bold]初期設定：[/font]老化は有効です。「控えめ」の基準間隔は二時間で、元の設定値は一時間です。季節による活動の変化も時期に影響します。これは調べた区域での確認であり、新しい木の一本一本に決まった寿命を割り当てる仕組みではありません。\n\n[font=default-bold]知っておきたいこと：[/font]現在、対応する枯れ木への置き換えがあるのはナウヴィスだけです。保護確認は引き続き適用します。生木の喪失は恒久的で、色の回復では生き返りません。老化自体は火災を起こしません。
rot-heading=枯れ木は少しずつ姿を消す
rot=枯れ木の分解は、時間をかけて対象の枯れ木を取り除きます。古い森林の残骸を片付けますが、生木には置き換えません。後に近くに森林が育つとすれば、それは別の自然再生機能によるものです。老化と分解は個別に切り替えられます。\n\n[font=default-bold]初期設定：[/font]「控えめ」の分解の基準間隔は一時間で、元の設定値は三十分です。変化の強さ、季節による活動、処理の行き渡り方によって、その区域に確認が回る時期は変わります。\n\n[font=default-bold]知っておきたいこと：[/font]除去した枯れ木は復元用に記録しません。対象外の樹種、保護された場所、栽培植物は除外します。分解は独自の時刻で確認するため、久しぶりの観測で、それまでに逃した確認をまとめて実行することはありません。
thermal-heading=火災で失った木の跡には地面の損傷が残る
thermal=対象となる火炎ダメージで木が死亡すると、元の位置の周りに小さな焼け跡が残る場合があります。地面はその惑星の地形ルールに従って変わり、後の回復に向けて記録できます。木自体は失われたままでも、清浄な条件がそろえば地面を回復できます。\n\n[font=default-bold]知っておきたいこと：[/font]死亡の原因が対象となる火源であることが必要で、通常の地面の保護も適用します。戦闘火災と自然発生の森林火災のどちらも対象の死亡を起こせます。焼け跡は死亡への反応であり、別の炎を着ける効果ではありません。近くの木が燃えても、保護された機械の場所は変わらず残る場合があります。
wildfire-heading=延焼しない火災と広がる火災を選ぶ
wildfire=工業汚染によって、対象の野生樹木の近くでときどき火災が起こります。上限しきい値以上の汚染、近くの適した燃える植物、保護されていない着火位置が必要です。測定値がしきい値を下回ると、その場所で新しい森林火災の依頼を受け付けなくなります。ただし、すでに受け付けた着火の試行が処理を待っている場合があります。この機能には、土壌が使う五分間の汚染観測期間は不要です。\n\n[font=default-bold]初期設定：[/font]「延焼なし」が選ばれています。「控えめ」での災害の基準間隔は二十分で、元の設定値は十分です。条件を満たす森林火災の機会に1%の確率で着火を試みます。季節、他の災害との順番、処理範囲によってさらに遅れる場合があります。木一本ごとに毎秒試す確率ではありません。最初の着火は全サーフェスを通じて十秒に一回までで、保持する火災記録は16件までです。\n\n[font=default-bold]知っておきたいこと：[/font]「延焼なし」は、最大十秒の寿命を持つ広がらない地面の炎を作ります。「延焼あり」はFactorio標準の樹木火災を始めます。その後の炎は最初に確認した区域の外へ広がり、生態系のスクリプト上限とは別にエンジンの処理時間を使う場合があります。生態系を無効にすると、自分の「延焼なし」の炎を除去しますが、無関係な戦闘火災や、その後に延焼した炎は消しません。森林火災のアラートが確認するのは着火であり、森林の焼失ではありません。
flood-heading=水は砂の岸辺へ少しずつ進める
flood=ナウヴィスの浸水は、対象の淡水の隣にある対応した砂の岸辺を水に変えられます。起こるのは、小さな範囲の岸辺の変化です。溶岩、油、アンモニアの海や、適した岸から離れた任意の地面には作用しません。\n\n[font=default-bold]初期設定：[/font]浸水の各機会の確率は2%です。時期は災害の間隔、変化の強さ、季節による活動、処理範囲によって変わります。雨、低い汚染、見た目の天候は必要条件ではありません。\n\n[font=default-bold]知っておきたいこと：[/font]真北、真南、真東、真西のいずれかに適した岸辺があると、最初の依頼の条件を満たします。タイルを変更する前には、その地面から水への変換が対応しているか、保護が引き続き許すかを確認します。記録した浸水は損傷記録が有効な間なら回復できますが、浸水を無効にしただけではすぐに排水されません。局所的な岸辺の移動であり、海面全体のシミュレーションではありません。
drought-heading=水が引いて砂の岸辺が現れることもある
drought=ナウヴィスの干ばつは、適した砂の岸辺の隣にある対象の淡水を砂に変えられます。海岸沿いに、少し広い地面が現れる場合があります。他の惑星の液体は除外し、必要な岸辺との関係を持たない水も対象外です。\n\n[font=default-bold]初期設定：[/font]干ばつの各機会の確率は2%です。時期は災害の間隔、変化の強さ、季節による活動、処理範囲で決まり、別途の高汚染や天候条件はありません。\n\n[font=default-bold]知っておきたいこと：[/font]設備、残っている資源、特別な場所は保護します。待機中の変化が、実行前に条件を満たさなくなることもあります。浸水と干ばつは別々に切り替えられ、両方を有効にすると時間をかけて逆向きの局所変化が起こりえます。気温や降水量をモデル化するものではなく、岸辺を直ちに行き来させるものでもありません。
cliff-heading=風化は普通の崖を取り除くことがある
cliff=崖の風化は、周囲の保護を確認した後、対象となる普通の崖を取り除く場合があります。自然の障壁が恒久的に変わります。自分で除去するまで崖を残したい場合は、この機能を無効にしてください。\n\n[font=default-bold]初期設定：[/font]崖の風化の機会には1%の確率を使います。汚染の継続、降雨、戦闘ダメージ、崖の年齢の測定は必要ありません。\n\n[font=default-bold]知っておきたいこと：[/font]惑星固有の特殊な崖を、対象の普通の崖の代わりには使いません。崖が見つかっても、近くの設備や保護された場所が除去を防ぐことがあります。土壌の回復で失った崖を作り直すことはできません。
calendar-heading=それぞれの惑星に季節のカレンダーがある
calendar=対応する各惑星には季節のカレンダーがあります。一般に星から遠い惑星ほど年が長くなり、星図上の距離を計算に使います。カレンダーは季節変化を整理する仕組みであり、惑星や移動経路を動かしません。「上昇期」「最盛期」「下降期」「休止期」は四つの区分の呼び名で、特定の天候を約束するものではありません。\n\n[font=default-bold]初期設定：[/font]基準年はナウヴィスの360日で、カレンダー開始時に保存した実際の一日の長さを使います。各惑星の年は、この基準に、ナウヴィスと比較した距離の比の1.5乗を掛けます。星図上の方向が年の開始位置を決めます。後からナウヴィスの昼夜制御が変わっても、そのたびに基準を決め直しません。\n\n[font=default-bold]カレンダーの使い方：[/font]管理者のカレンダーパネルには、基準日数、現地の日数への換算、シミュレーション上の長さを表示します。年の長さを変えても季節内の位置を保ちます。管理者はプレビューのためにその位置を調整することもできます。
daylight-heading=変わるのは昼の割合で、一日全体の長さではない
daylight=季節による昼の長さの変化は、その惑星の既存の一日の中で、明るい時間を長くしたり短くしたりします。自転一回分の時間は変えずに、日の出と日没を動かすと考えてください。ソーラーパネルが昼光を受ける時間も変わります。薄明の長さは元のままです。\n\n[font=default-bold]初期設定：[/font]対象はナウヴィス、ガイア、ヴルカヌス、グレバ、アクィロです。想定する地軸の傾きは23.5度、緯度は45度です。極端な設定でも、一日の少なくとも2%は完全な昼、2%は完全な夜として残します。\n\n[font=default-bold]知っておきたいこと：[/font]時刻が固定されている場合や常に昼の場合は、季節の調整を休止します。同じ夜明け・夕暮れの設定を変えるDiurnal Dynamicsや他の制御にも、ESIRは譲ります。無効化時に元の設定へ戻すのは、ESIRの最後の調整がそのまま残っている場合だけです。フルゴラの独立した昼夜制御は、引き続きすべての権限を持ちます。季節による昼の長さは、その境界を調整も復元もしません。
modulation-heading=季節は生態系の変化の速さを変えられる
modulation=季節による活動の変化は、土壌変化、樹木への作用、災害、稼働中の掘削機による掘削痕の機会を、一年の中で増減させます。季節の昼光が無効でも、他の仕組みが明るさを管理していても動作でき、フルゴラでも使えます。速さが変わっても、各機会の成功確率は変わりません。\n\n[font=default-bold]初期設定：[/font]強さは25%です。選んだ変化の強さの基準に対し、最盛期付近で速度が滑らかに125%まで上がり、休止期付近では75%まで下がります。速度が上がると間隔は短くなり、下がると長くなります。\n\n[font=default-bold]知っておきたいこと：[/font]季節は無効な災害を有効にせず、汚染・清浄の観測条件や通常の土壌回復間隔も変えません。成長には依然として清浄な測定、適した種子供給樹木、空間、処理の余裕が必要です。カレンダーは惑星を移動させず、季節に合わせて地面を塗り替えもしません。ボタンが冬らしい色でも、それは季節の表示であり、雪が降る約束ではありません。
nauvis-heading=ナウヴィス：土、砂、森林の変化
nauvis=ナウヴィスの地面は草地、土、砂漠、砂の間を進み、回復は記録した場所を正確な元の地形へ戻します。対象の在来樹木は衰弱し、色を取り戻し、自然再生できます。ナウヴィスは淡水の岸辺変化に最初に対応した惑星であり、老化した生木を枯れ木に置き換えられる唯一の惑星でもあります。\n\n[font=default-bold]知っておきたいこと：[/font]舗装された工場、残っている資源、設備、特別な場所は保護します。対象となる舗装の腐食だけが、露出した舗装に対する明示的な例外です。
gaia-heading=ガイア：その土地らしさを保つ
gaia=ガイアの草原や湿地は、ガイア固有の岩盤が露出するまで傷むことがあります。回復は保存した地形の種類を逆にたどり、自然再生ではそのバイオームに合う樹木を選びます。ESIRが配置した特別な場所には保護範囲があり、通常の生態系変化はそこを残します。\n\n[font=default-bold]知っておきたいこと：[/font]古いセーブでは、残っている場所の目印を手がかりに保護範囲を調べます。調査中の区域や、以前の保護記録が上限を超えていた区域は、生態系変化を止めたままになる場合があります。特徴的な目印が消えていれば、正確な昔の境界を何もないところから再構成することはできません。
vulcanus-heading=ヴルカヌス：灰と火山性の地面が変わる
vulcanus=ヴルカヌスでは、固有の灰、火山性土壌、ひび割れた地面の変化を使います。溶岩は保護し、樹木への作用は対象の在来種に限ります。噴気孔は、独立した個体数、埋蔵量、地形変化の仕組みを維持します。\n\n[font=default-bold]知っておきたいこと：[/font]生態系は噴気孔の効果を引き継がず、普通の地球風の森林を持ち込まず、火山の液体を淡水に変えることもありません。
gleba-heading=グレバ：胞子は工業汚染と分けて考える
gleba=グレバは、湿地の配置条件を含め、固有バイオームの地面の変化と対象の野生樹木の生息環境を使います。栽培植物とその特殊な土壌、金質植物、管理下の水盆は保護します。胞子は別の種類の汚染物質であり、有害な工業汚染には数えません。\n\n[font=default-bold]知っておきたいこと：[/font]胞子だけの測定値は、工業汚染がある証拠にも、工業的に清浄な証拠にもなりません。そのため、胞子だけでは汚染による土壌損傷、通常の回復、樹木の衰弱と色の回復、自然再生、汚染による森林火災の条件を満たせません。条件に合う採掘、火災で失った木の焼け跡、血液効果、独立した災害、カレンダーは動作できます。設定を有効にしても、胞子を工業汚染の測定値として使えるようにはなりません。
fulgora-heading=フルゴラ：昼夜は独立した仕組みに任せる
fulgora=フルゴラの対象地形は岩、砂、塵、砂丘の間で変わり、油の海は保護します。生態系のカレンダーは、対象効果の速さや機械樹のボタンの色を変えられます。ここに普通の木を育てるための、対応する在来の森林系統はありません。\n\n[font=default-bold]知っておきたいこと：[/font]昼光はフルゴラ独立の昼夜システムが引き続き管理します。季節による昼の長さは、フルゴラの夜明けと夕暮れの境界を読み取りも、変更も、復元もしません。全体の生態系やカレンダーの設定を変更しても同じです。
aquilo-heading=アクィロ：工場を守りながら雪と氷が変わる
aquilo=アクィロは固有の雪の圧密と氷の変化を使い、記録した回復はその段階を逆にたどります。アンモニアの海、土台、設備は保護します。季節による昼の長さは、惑星の自転を変えずに、一日の明るい割合を変えられます。\n\n[font=default-bold]知っておきたいこと：[/font]アクィロを普通の木で覆うための、対応する在来の森林系統はありません。生態系は、一般的な凍結、融解、海の変換をシミュレーションするものではありません。
settings-heading=全体の設定と土地ごとの例外を選ぶ
settings=スタートアップの統合設定で生態系を利用可能にします。「MOD設定 → マップ」で、機能の切り替え、汚染しきい値、間隔、確率、対象惑星、処理上限を選んでください。管理者は「地形と生態系」で、既存サーフェスの対応設定を上書きできます。継承値へ戻す操作で、その土地だけの例外を外します。惑星を選んだり報告を読んだりしても、そのサーフェスを生成しません。\n\n[font=default-bold]知っておきたいこと：[/font]最終的な動作は、全体設定、惑星のルール、明示したサーフェス上書きを組み合わせて決まります。全体の無効化、対象外の地形、保護が引き続き優先します。更新しても保存済みの設定を保ちます。回復を無効にすると回復を休止するだけで、地面を直ちに元へ戻しません。他の効果を無効にしても、破壊された木、崖、舗装は返りません。スタートアップの統合を無効にしたとき、季節の昼光を復元するのは、ESIRの最後の調整がそのまま残る場所だけです。
presets-heading=変化の強さは速さを、処理負荷は行き渡り方を決める
presets=変化の強さは生態系の機会がどれくらいの頻度で来るかを、処理負荷は調べられる地面の量と待機作業を進める速さを決めます。処理量を増やせば、忙しい地図や広く探索した地図でも、早めに確認が行き渡りやすくなります。各確認の設定済み成功確率が上がるわけではありません。\n\n[font=default-bold]初期設定：[/font]速度倍率は「控えめ」が0.5、「標準」が1、「強い」が2で、「カスタム」は選んだ倍率です。強さを上げても無効な機能は有効になりません。処理負荷の初期値は「軽量」です。七つのプリセットは「超低負荷」「低負荷」「軽量」「均衡」「詳細」「高精度」「超高精度」で、さらに「カスタム」があります。「軽量」は16ティックごとに少量を処理し、32ティックごとに一回のエンティティ検索を許可します。\n\n[font=default-bold]知っておきたいこと：[/font]処理量と保存量の上限は全サーフェスで共有し、「カスタム」にも有限の上限があります。保存上限を下げても既存の記録は残り、空きができるまで新規記録を止めます。回復用の保存領域が満杯なら、ESIRは古い回復経路を忘れる代わりに、新しい回復可能な損傷を断ります。大きいプリセットは処理時間を多く使う場合があり、どの設定も、すべての工場で特定のUPSを保証しません。
reports-heading=今見ている世界の報告を読む
reports=左上の銅製の機械樹から、リモートビューを含む現在の閲覧先サーフェスの「生態系」報告を開けます。葉の色はカレンダーに従い、上昇期はライム、最盛期はエメラルド、下降期は琥珀色から赤、休止期はシアンです。カーソルを合わせると季節名が出ます。利用できるカレンダーがなければエメラルド色を保ち、季節情報が利用できないことを示します。\n\n[font=default-bold]報告の使い方：[/font]「簡易」は、観測した地面、森林、採掘の影響、季節を現地調査の言葉で説明します。「詳細」は、サーフェスの実効設定、測定値、待機作業、保護による除外、保守状況を加え、それらを全体で共有する上限や累計と区別します。観測がない場合は健全ではなく不明です。\n\n報告は、開いている間、すでに集めた情報を更新します。閉じると報告の更新は止まります。ボタンの色を調べる別の処理は、地形を検索せずに続けられます。
alerts-heading=知らせてほしい変化を選ぶ
alerts=生態系の通知は、Factorioの通常のアラート欄にアイコンと移動できる位置付きで表示します。「生態系」ウィンドウの「アラート」タブか「MOD設定 → プレイヤーごと」で選んでください。どちらも同じ個人設定を変更します。アラートは効果が実際に起きたことを示し、確認の予定だけでは通知しません。\n\n[font=default-bold]初期設定：[/font]森林火災、浸水、干ばつ、崖の風化、舗装の腐食は通知が有効です。汚染による損傷、回復、採掘、樹木への作用など、その他の分類は最初は無効で、個別に選べます。実在するすべてのサーフェスを選択し、現在のサーフェスだけに絞る条件は別の任意設定です。通常の昼光調整はアラートを出しません。\n\n[font=default-bold]知っておきたいこと：[/font]出来事のチャンクが、現在、自勢力から見えている必要があります。以前探索しただけでは足りません。管理者はこの可視条件を省略できますが、分類とサーフェスの条件は残り、管理者権限を失うと例外も解除します。近くの出来事はまとめ、プレイヤーごとに最大四件の生態系アラートを保持します。出来事を通知できる期間は60秒です。オフライン中の出来事を後で届けるために保存しません。通知の期限が切れても、回復記録や待機中の採掘処理は削除しません。
maintenance-heading=再構築ウィンドウが伝えていること
maintenance=ESIRの再構築ウィンドウは、終わりのある準備や修復を表示します。古いセーブのデータ変換、最初の発見巡回、変更された設定の確認、保存情報の修理などです。対象サーフェスが無効、または別の理由で進められないときは待機できます。総作業量が不明なら、割合を推測せずに完了した量を表示します。\n\n[font=default-bold]知っておきたいこと：[/font]最初の発見巡回は、開始時に対象サーフェスの一覧を固定します。各サーフェスの巡回は、チャンクを最後まで調べるか、100,000回のチャンク訪問に達すると終わります。上限到達は網羅性が未確認という意味であり、地図全体の確認完了ではありません。\n\n日常の観測、回復、稼働掘削機の確認、受け付け済みの掘削痕は独立して続き、「詳細」に表示します。それらのために再構築ウィンドウが開き続けることはありません。古いセーブは徐々に準備します。生態系を開き直したり再有効化したりしても、休止中に逃した判定をすべて再実行しません。
troubleshooting-heading=景色が変わらないときに確かめること
troubleshooting=まず、今見ているサーフェスの「詳細」を開きます。その場所で生態系が実際に有効で、惑星が対応しているかを確認してください。次に、適した地面や木、必要な場合の工業汚染の測定値、十分な連続観測、対象地点の周囲の保護を確認します。最後に、待機作業や保存上限への到達を見ます。確率が低く間隔が長い場合など、静かな場所は単にもう少し時間が必要なこともあります。\n\n[font=default-bold]役立つ確認：[/font]変化の終端にある地面は、それ以上劣化しません。自然再生には対象樹種の種子供給樹木が残っている必要があります。採掘には、対象掘削機の範囲内で実際に有限鉱床が尽きること、または定期的な掘削痕なら対象掘削機が本当に「稼働中」であることが必要です。火災には工業汚染、近くの対象の燃える植物、意図した「延焼なし」または「延焼あり」の設定が必要です。試行成功の件数だけでは着火を証明しません。回復には元のESIR記録が必要で、掘削痕の回復には両方の回復設定が必要です。\n\n[font=default-bold]知っておきたいこと：[/font]ESIRはTerrainEvolutionおよびTerrainEvolution2と併用できません。ESIRは季節の昼光をDiurnal Dynamicsに譲ります。同じ全体処理枠では、探索した地面や有効なサーフェスが増えるほど、確認が行き渡るまで時間がかかります。不明な測定値や遅れている確認は、土地が健全である証拠にも、機能が壊れている証拠にもなりません。
