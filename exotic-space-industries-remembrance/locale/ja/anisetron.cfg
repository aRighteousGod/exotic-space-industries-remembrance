[exotic-industries-informatron]
menu_gaian_hierophant=ガイアの秘儀司祭
title_gaian_hierophant=ガイアの秘儀司祭
gaian-hierophant-intro=聖堂は祈りを切断の信号へ変える。ガイアの秘儀司祭は、スパイダートロンの標準制御コアを中心に構築された、２本のクリスタルビームを持つ浮遊聖堂です。重々しく、ゆっくりと進みます。
gaian-hierophant-controls=操作と補給
gaian-hierophant-controls-text=通常のスパイダートロンと同じ運転、リモコンによる選択、自動操縦を利用できます。装備、貨物、廃棄スロット、車両物流も標準機能で扱います。手動射撃と自動射撃は、どちらも弾薬を消費して同じ継続射撃を開始します。射撃中も移動できます。浮上安定化機構が重なった減速効果を抑えますが、ダメージと直接的なスタンは受けます。
gaian-hierophant-weapons=２つのクリスタル、２つの目標
gaian-hierophant-weapons-text=弾薬の品質がノーマルの場合、頂部ビームは__2__ティックごとに__1__のレーザーダメージを与え、基本射程__3__タイル、射界__4__度を持ちます。正面ビームは__2__ティックごとに__5__のレーザーダメージを与え、射程__6__タイル、前方__7__度の射界で攻撃します。各ビームは攻撃可能な目標を保持し、その目標を失うと次の目標へ滑らかに向きを変えます。ダメージを与えるのは捕捉が完了してからです。ビームが見た目上ユニットを横切っても、そのユニットが攻撃対象になるわけではありません。機体の品質によって頂部ビームの射程が延びます。正面ビームの射程は変わりません。
gaian-hierophant-charge=１個のチャージで１回の継続射撃
gaian-hierophant-charge-text=[item=ei-anisetron-crystal-charge]を１個消費すると、両方のビームが__1__秒間の射撃に必要なエネルギーを得ます。両方のビームが目標を捉えている間、研究、強化、耐性を適用する前の合計基本ダメージは最大__2__レーザーダメージ／秒です。目標の探索と旋回にも同じ射撃時間を使います。使われなかったダメージを蓄積したり、もう一方のビームへ回したりはしません。車両の弾薬物流で補給できます。弾薬が尽きても、手動射撃を解除しても、開始済みの継続射撃は続きます。機体を取り除くと残りの攻撃は中止されますが、確定済みの崩壊と残響は最後まで発動します。
gaian-hierophant-upgrades=ランスの継承
gaian-hierophant-upgrades-text=弾薬の品質と[technology=laser-weapons-damage-6]以降の研究は、両方のビームを強化します。[technology=ei-singularity-lance-axial-rupture]、[technology=ei-singularity-lance-wound-memory]、[technology=ei-singularity-lance-terminal-collapse]、[technology=ei-singularity-lance-black-hole-testament]を継承するのは頂部ビームだけです。追加の切断線、蓄積する傷のダメージ、遅れて発動する崩壊が加わり、頂部ビームの攻撃予定__1__回ごとに強化パルスが発動します。これらの強化研究は建造の前提条件ではありません。チャージを消費した時点で、その射撃のダメージ、射程、品質、研究済みの強化が固定されます。新たな研究は次のチャージから反映されます。
gaian-hierophant-construction=ガイアでの組立
gaian-hierophant-construction-text=ワルキューレ、シンギュラリティ・ランス、レーザー兵器ダメージ５の研究後に[technology=ei-anisetron]を研究します。ガイアで、空の[item=ei-gaian-saucer]シャーシ、[item=ei-singularity-lance]１基、その他のレシピ材料を使って組み立てます。先に装備を外し、シャーシを空にしてください。通常のレシピで新しい機体を作るため、元の機体の設定は引き継ぎません。クリスタルチャージはどの地表でも製造できます。
gaian-hierophant-visuals=視覚演出
gaian-hierophant-visuals-text=選択中の起動時プリセット：__1__。移動時の緑色の細い軌跡、ビームの光輪、命中時の閃光を設定します。装飾をオフにしても、両方の主要ビームと強化を示す重要な形状は表示されます。演出設定はダメージ、目標選択、射程、チャージの消費、射撃時間、移動に影響しません。上位のプリセットほど多くの装飾を表示します。「無制限」は装飾数の上限を取り除くため、UPS負荷が増える場合があります。
