guide-summary=「簡易」報告は、現地の一日と季節のカレンダーを分けて表示します。昼夜の帯はサーフェスの現在の昼夜境界と自転一回分の長さを示し、季節の帯はESIRの年単位のカレンダーに従います。残り時間の見積もりには現在の設定を使います。フルゴラは独立した昼夜制御を維持し、時刻停止や常に昼の状態では通常の予測を行いません。景観画像は装飾です。変化のカードは実際に成功した記録済みの変更を数え、同じ場所への複数回の変更も含みます。分類ごとに最後に分かった変化の時刻を示しますが、古い合計件数には保存された時刻がない場合があります。観測からの経過と調査範囲が表すのは限られた現地測定であり、世界全体の健全性ではありません。
