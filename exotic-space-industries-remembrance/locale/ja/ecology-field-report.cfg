permanent=常に昼です。日暮れは予測しません。
permanent-held=常に昼で、昼夜の進行も停止しています。
variable=現地の昼夜周期は可変です。季節とは独立して長さが変わる場合があります。
clock-help=所要時間はシミュレーション時間です。帯は完全な昼の始まりから並び、印が観測時点の周期内の位置を示します。予測には現在の昼夜境界と周期の長さを使いますが、別の制御がそれらを変更する場合があります。太陽光発電量の予測ではありません。
no-cycle=ここでは惑星の昼夜周期を利用できません。
invalid-cycle=現在の周期を確実に読み取れません。次の移り変わりは予測しません。
seasons=__1__ · この季節の__2__%が経過\n一年の進み具合：__3__%\n次の季節まで__4__\n一年の長さ：__5__\n現在の昼夜周期なら、現地の__6__日分に相当します。
calendar-help=季節のカレンダーと現地の一日は、別々の時計です。暦の一年は基準日数で__1__日です。現地の日数への換算には現在の周期の長さを使い、過去の自転回数を数えているわけではありません。
no-calendar=季節のカレンダーは利用できません。
daylight-active=季節による昼の長さの変化が動作しています。
daylight-disabled=ここでは季節による昼の長さの変化は無効です。
daylight-paused=季節による昼の長さの変化は休止中です。
daylight-external=昼光は別の制御が管理しています。
daylight-independent=フルゴラの昼光は、季節のカレンダーとは独立しています。
daylight-pending=季節による昼の長さの変化は、次の確認を待っています。
status-observed=最近の現地観測あり
status-outdated=現地観測から時間が経過
status-unknown=まだ観測されていません
status-disabled=ここでは生態系が無効です
status-suspended=生態系の変化は休止中です
status-unsupported=ここでは生態系を利用できません
effect=__1__：記録 __2__件 · __3__
last=最後の変化は__1__前
no-time=変化の時刻は不明
no-activity=変化の記録なし
feature-off=無効
feature-unavailable=ここでは対象外
record-help=件数はESIRが実際に加えた変化の数で、別々の場所の数や地形全体の調査結果ではありません。同じ場所が何度も変わる場合があります。古いセーブでは合計件数は残っていても、変化の時刻がない場合があります。森林火災の件数は着火の記録であり、森林を失った量ではありません。
ground-help=条件がそろえば、回復は記録した地形変化を逆にたどれます。地面を覆ったり、外部から置き換えたりすると、保存した順序が使えなくなる場合があります。後から取り除いても記録は戻りません。設備、栽培地、特別な場所の保護は維持します。
ground-conditions=土壌の損傷には汚染度__1__以上が__2__続くこと、回復には__3__以下の測定値が__4__続くことが必要です。確かな継続観測と、それぞれの処理機会も必要です。
pollution-unavailable=この世界の汚染物質では、工業汚染を判断できません。グレバの胞子は工業汚染には数えません。
mining-recovery-on=掘削痕の回復は有効です。必要な清浄条件と保護確認を満たすと、記録した掘削痕を回復できます。
mining-recovery-off=掘削痕の回復は無効です。この設定を有効にするか地形を置き換えるまで、記録した掘削痕は残ります。
woodland-help=対象となる野生樹木に加えた変化の記録です。栽培植物と保護された植物は除外します。生まれつき灰色の木だけでは、汚染による損傷の証拠にはなりません。
woodland-unavailable=この世界には、これらの作用の対象となる在来の森林系統がありません。
other-help=適した現地の地形と保護確認は引き続き必要です。岸辺の変換は、ナウヴィスの対応する淡水と沿岸地形の組み合わせに限ります。舗装の腐食には、専用の対象条件があります。
survey=最後の現地測定：__1__前。__2__\n観測したのは訪れた区域だけです。未観測の地面が健全かどうかは分かりません。
survey-none=確かな現地測定はまだありません。観測は訪れた区域だけを対象とし、未観測の地面が健全かどうかは分かりません。
coverage-discovering=最初の調査はまだ進行中です。
coverage-observed=最初の調査巡回は終了しました。土地全体の健全性を調べ終えたわけではありません。
coverage-limited=調査範囲はまだ限られています。
coverage-unknown=調査範囲はまだ確認できていません。
