[item-description]
ei-water-turret=水と100 kWの電力で、ダメージを与えずに敵の移動速度を2秒間25%低下させるか、周囲の火災を自動消火します。射程：24。消火1回につき水15を消費します。優先順位はタレットの画面で設定できます。
ei-extinguisher=狭い範囲の炎や酸だまりを手動で除去します。消火器用ボンベが必要です。
ei-extinguisher-ammo=携帯消火器用のボンベ。容量：100。

