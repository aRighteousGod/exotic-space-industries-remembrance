[mod-setting-name]
ei-beacon-quality-modules=ビーコンでの品質モジュール使用
ei-beacon-productivity-modules=ビーコンでの生産性モジュール使用
ei-quality-module-effects=品質モジュールの性能

[mod-setting-description]
ei-beacon-quality-modules=品質ボーナスのあるモジュールを使用できるESIRビーコンを選びます。液体窒素冷却式は__ENTITY__ei-copper-beacon__と__ENTITY__ei-iron-beacon__、エイリアン系は__ENTITY__ei-alien-beacon__と__ENTITY__ei-warp-beacon__です。Quality MODが必要です。\n使用制限を厳しくすると、新たに使用不可となった装着済みモジュールはビーコンのそばの地面に返されます。
ei-beacon-productivity-modules=生産性ボーナスのあるモジュールを使用できるESIRビーコンを選びます。液体窒素冷却式は__ENTITY__ei-copper-beacon__と__ENTITY__ei-iron-beacon__、エイリアン系は__ENTITY__ei-alien-beacon__と__ENTITY__ei-warp-beacon__です。Quality MODが無効でも適用されます。\n使用制限を厳しくすると、新たに使用不可となった装着済みモジュールはビーコンのそばの地面に返されます。
ei-quality-module-effects=ESIRでは、品質モジュールにESIR独自のボーナスとペナルティを適用します。バニラ準拠では、ESIRによる性能変更を適用しません。どちらもレシピと研究の進行はESIRのままです。Quality MODが無効の場合、この設定は効果がありません。

[string-mod-setting]
ei-beacon-quality-modules-neither=どちらも不可
ei-beacon-quality-modules-nitrogen=液体窒素冷却式のみ
ei-beacon-quality-modules-alien=エイリアン・ワープビーコンのみ
ei-beacon-quality-modules-both=両方（デフォルト）
ei-beacon-productivity-modules-neither=どちらも不可
ei-beacon-productivity-modules-nitrogen=液体窒素冷却式のみ
ei-beacon-productivity-modules-alien=エイリアン・ワープビーコンのみ
ei-beacon-productivity-modules-both=両方（デフォルト）
ei-quality-module-effects-esir=ESIR（デフォルト）
ei-quality-module-effects-vanilla=バニラ準拠

