[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-cinematic=航跡は広く長く残り、旋回にあわせて曲がる
ei-gaian-saucer-wake-visual-fidelity-lean=短く制御された薄い色彩の残り香のみが船体に追従する
ei-gaian-saucer-wake-visual-fidelity-maximal=ホバーフレームが通過したすべての場所に、高密度で光り輝く航跡を残す
ei-gaian-saucer-wake-visual-fidelity-off=残像を封印し、可視的な航跡は存在しない
ei-gaian-saucer-wake-visual-fidelity-standard=航跡をはっきりと描き、そして緩やかに消えていく
ei-gaian-saucer-wake-visual-fidelity-unbounded=無制限。世界が耐えうる限りのすべての航跡を刻む
