[entity-name]
ei-gaian-saucer=ワルキューレ
ei-gaian-saucer-leg=ワルキューレ浮上アンカー
[entity-description]
ei-gaian-saucer=スパイダートロンのコアを流用して構築された、ガイア由来の高速ホバーフレーム。\n水面や地表をかすめるように移動します。航跡の誓いが強まると、機体の背後に広がる軌跡が色彩豊かなスリップウェイクとなって開花します。
[item-name]
ei-gaian-saucer=ワルキューレ
[item-description]
ei-gaian-saucer=インベントリスロットと装備グリッドを備え、目に見える脚を持たないガイア由来の高速ホバーフレーム。大地に足跡の記憶だけを残して滑るように移動し、その軌跡に色彩の屈折を残します。
[technology-name]
ei-gaian-saucer=ワルキューレ
[technology-description]
ei-gaian-saucer=インベントリと装備グリッドを備えたガイア製ホバークラフト ワルキューレ をアンロックする。
[recipe-name]
ei-gaian-saucer=ワルキューレ組立
[recipe-description]
ei-gaian-saucer=スパイダートロンの制御コアをガイアのホバーユニットへ移植する。武装は失うが、移動経路を記憶できるようになる。
[exotic-industries-informatron]
gaian-saucer=ワルキューレ
gaian-saucer-2=航跡の共鳴
gaian-saucer-text=[item=ei-gaian-saucer] ワルキューレは、ガイアのホバークラフトである。脚のないフレームの中に、スパイダートロンのコマンドコアが組み込まれている。インベントリスロット／装備グリッド／虚空からエネルギーを得る機関を備え、過酷な世界を渡る巡礼者のための脚となる。
gaian-saucer-text-2=現在の航跡の設定： [font=default-bold]__1__[/font]。この設定は船体の背後に落ちる航跡（描画の派手さ、どれぐらい残るか等）のみを変更します。機体の性能自体は変更されません。
menu_gaian_saucer=ワルキューレ
title_gaian_saucer=ワルキューレ
[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=ワルキューレの航跡
[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=ワルキューレが通過した軌跡の演出を設定する。この設定は航跡のグラフィックにのみ影響し、船体の容量、装備格子、駆動部、外殻、および製造コストは変更されません。
