gaian-saucer-text=[item=ei-gaian-saucer] スリップウェイク・ソーサーはガイアの浮上艇だ。脚を拒む殻の中に、Spidertronの指揮中枢が埋葬されている。貨物室、装備格子、真空に養われる駆動が、敵意ある閾を渡る巡礼者の器とする。
gaian-saucer-2=航跡の共鳴
gaian-saucer-text-2=現在の航跡の誓約は [font=default-bold]__1__[/font]。それが変えるのは、船体の背後に投げられる色収差の記憶だけである。スリップウェイクがどれほど明るく開くか、旋回の傷がどれほど残るか、世界にどれほど通過を覚えさせるか。艇そのものは変わらない。
