[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=機体は残像を封じ、見える記憶を残さず世界を渡る。
ei-gaian-saucer-wake-visual-fidelity-lean=薄い色収差の拒絶だけが船体を追い、短く律されて消える。
ei-gaian-saucer-wake-visual-fidelity-standard=航跡ははっきり語り、教義になる前に薄れていく。
ei-gaian-saucer-wake-visual-fidelity-cinematic=航跡は広がり、長く残り、旋回の誓約に合わせて曲がる。
ei-gaian-saucer-wake-visual-fidelity-maximal=船殻は通った場所すべてに濃く輝く運動の傷を残す。
ei-gaian-saucer-wake-visual-fidelity-unbounded=統べる枷を外す。世界が耐えうる限り、ソーサーはすべての揺らめきを書き込む。

