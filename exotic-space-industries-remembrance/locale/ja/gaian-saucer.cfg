[item-description]
ei-gaian-saucer=高速のガイア浮上殻。封じられた貨物室、装備格子、見えない脚を備える。記憶された一歩として進み、背後に色収差の裂け目を残す。

[entity-description]
ei-gaian-saucer=Spidertronの指揮中枢を抱いた高速のガイア浮上フレーム。\n地面に偽の足を思い出させて滑る。航跡の誓約が強いほど、その通過は機体の背後で色収差のスリップウェイクとして開花する。

[recipe-description]
ei-gaian-saucer=Spidertronの指揮中枢をガイアの浮上殻へ納め、ランチャーを剥ぎ取り、四肢なき運動だけをエンジンに記憶させる。

[technology-description]
ei-gaian-saucer=スリップウェイク・ソーサーを解禁する。貨物室、装備格子、色収差航跡を備え、移動そのものを地面が覚える誓約へ変えるガイア浮上艇。

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=スリップウェイク・ソーサー航跡の共鳴

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=スリップウェイク・ソーサーが自らの通過をどれほど強く記憶へ刻むかを定める。この誓約が触れるのは色収差航跡だけであり、船体、貨物室、装備格子、推進、耐久、製造は変わらない。

[string-mod-setting]
ei-gaian-saucer-wake-visual-fidelity-off=休眠
ei-gaian-saucer-wake-visual-fidelity-lean=薄明
ei-gaian-saucer-wake-visual-fidelity-standard=記憶
