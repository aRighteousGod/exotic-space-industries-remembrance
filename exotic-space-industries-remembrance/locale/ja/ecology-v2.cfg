[mod-setting-description]
ei-ecology-alert-enabled=適用された生態系変化を通常のアラート欄で通知。個人通知の一括切り替え。
ei-ecology-alert-surfaces=all、または正確な名前のJSON配列を指定。[] は対象なし。上限128件・4096バイト。生態系画面も同じ設定を変更します。存在しない名前は通知対象になりません。
ei-ecology-alert-current-surface-only=選択した通知を、現在表示中のサーフェスに限定。遠隔ビューも対象。初期設定は無効。
ei-ecology-alert-allow-unrevealed=管理者専用：チャンクの現在の視界制限を無視。種類とサーフェスのフィルタは有効。初期設定は無効。通常は探索済みというだけでは通知されません。
ei-terrain-periodic-mining-scars=対象の採石場と大型掘削機が有限鉱床を採掘中、周辺の露出した自然地形に採掘跡を残します。残存鉱床、設備、保護区域は維持。鉱床枯渇時の採掘跡は引き続き別のイベントで発生。
ei-terrain-periodic-mining-seconds=強度と季節の補正前の間隔。初期値300秒は「控えめ」で600秒となり、その後に季節補正を適用。処理が遅れても過去の抽選は繰り返しません。
ei-terrain-periodic-mining-probability=条件を満たす周期ごとの発生確率。初期値10%。選ばれた範囲内の各タイルに適用する別設定の70%は変更しません。
ei-ecology-alert-wildfire=適用に成功した生態系変化を通知：山火事の着火。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。山火事の通知は着火の確認であり、森林が焼失したことを意味しません。
ei-ecology-alert-flood=適用に成功した生態系変化を通知：浸水。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-drought=適用に成功した生態系変化を通知：岸辺の乾燥。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-cliff=適用に成功した生態系変化を通知：崖の風化。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-paving=適用に成功した生態系変化を通知：舗装の腐食。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-pollution=適用に成功した生態系変化を通知：汚染による土壌劣化。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-restoration=適用に成功した生態系変化を通知：土壌の回復。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-depletion-scars=適用に成功した生態系変化を通知：鉱床枯渇による採掘跡。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-working-scars=適用に成功した生態系変化を通知：稼働中の掘削機による採掘跡。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-mining-restoration=適用に成功した生態系変化を通知：採掘跡の回復。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-tree-stress=適用に成功した生態系変化を通知：樹木の衰弱。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
ei-ecology-alert-tree-recovery=適用に成功した生態系変化を通知：樹木の回復。効果自体の有効化とは別の設定。視界とサーフェスの条件も適用。
