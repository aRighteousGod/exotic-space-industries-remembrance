[ei-terrain]
controls=左上の機械の木のボタンで簡易・詳細・アラートを切り替え。葉の色は表示中の惑星の季節に合わせて変わり、カーソルを合わせると季節名を表示。簡易は現地調査、詳細は有効な設定、適用結果、処理上限を表示。アラートはMOD設定のプレイヤー別設定と共通で、通常のアラート欄を使用。原則として現在見えるチャンクのみが対象です。管理者の変更操作は従来の「地形・生態系」画面にあります。
v2-coverage=観測対象は上限のある範囲を順に交代。未調査の土地は不明として扱い、欠測や古い観測から汚染・清浄状態の継続を推定しません。回復できるのはESIRが記録した地形変化だけです。有限の移行・初期化・保守はESIR再構築画面に表示し、通常の生態系処理は詳細画面に表示。初回巡回の10万チャンク上限は全域調査の保証ではありません。
mining-v2-note=稼働中の掘削機には別の定期採掘跡設定があり、初期設定は有効。基準300秒ごとに10%で、「控えめ」では季節補正前に600秒。受理済みの処理は時間だけでは失効せず、サーフェスを無効にすると一時停止します。新しく記録した採掘跡の回復は初期設定で有効。
status-unsupported=未対応のサーフェス
status-independent=フルゴラ独自の制御

