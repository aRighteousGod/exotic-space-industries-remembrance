[ei-factory-passage-guide]
walking-heading=機械の間を歩く
walking=エンジニアの通り道も確保しましょう。対応する生産・電力・物流設備とタレットの当たり判定を狭め、隣接する設備の間を歩けるようにします。設備の中心は通り抜けられません。防壁やゲート、自然の障害物、車両、敵、グリッドに沿わない設備、見えない補助エンティティの当たり判定は維持します。
modes-heading=パイプの通行モードを選ぶ
modes=バニラはゲームと他のMODが設定した当たり判定を維持します。Squeak Throughでは隣接する接続部分も通行でき、追加MODは不要です。ESIRでは実際につながる地上の接続部分を通り抜けられなくし、未接続の隙間を通行できます。地下区間に障壁は追加しません。通常のパイプは横にもつながるため、接する2列は通路ではなく接続された格子になります。
controls-heading=設定の場所
controls=カテゴリとパイプモードは起動時設定で、変更後に再起動が必要です。動作中の処理量はMOD設定 → マップ、または管理 → オプション → 処理負荷で調整します。どちらもセーブ全体の同じ値を変更します。通常の更新上限（初期値__3__）は接続端の更新、占有中の接続の再確認、開いた画面の確認に適用します。初回の検索と即時の補助エンティティ削除は一括処理のままです。
recipes-heading=レシピの変更
recipes=建設、回転、設定の貼り付けなどの対応イベントで周辺を更新します。標準の設備画面を開いている間は、レシピをこまめに確認します。画面を開かずに標準の回路でレシピを選ぶ組立機は、背景で走査します。画面を閉じた手動設定の機械は定期確認しません。他のMODがイベントなしでレシピや回路選択を変更する場合は、既存の更新フックを呼ぶ必要があります。
scanner-heading=回路走査の調整
scanner=??????????????????????????????????????回路走査は通常の更新上限に加えて、初期値で1 tickあたり__1__回試行します。確認または更新が完了した機械は__2__ tick待ちますが、画面やイベントからの更新はこの待機を適用しません。通常速度ではセーブ全体で毎秒最大__4__回です。対象600台が安定している場合、1巡は約__5__秒になります。これは目安であり、応答時間の保証ではありません。更新待ちがあればさらに遅れます。値を上げると更新が早まり、下げると処理量を抑えられます。どちらの上限もtickの処理時間を保証しません。
troubleshooting-heading=走査の停止と問題の確認
troubleshooting=走査を無効にすると、画面を開いていない機械の回路変更が未反映になる場合があります。画面とイベントによる更新は続きます。設備間の通行が有効で、パイプモードがESIRか確認してください。Squeak Through 2がある場合はそちらを優先します。キャラクターの退避待ちなら、その接続から離れてください。権限のある管理者は診断 → 設備間の通行 → 修復、または /ei-admin-repair factory-passage で、機械を置き換えずに追跡情報を再構築できます。
current-heading=現在の設定
current=選択モード：__1__\n実効モード：__2__\n停止理由：__3__\n通常の更新上限：__4__/tick\n回路走査：__5__\n追加の回路走査上限：__6__/tick\nこの表示はページを開き直すと更新します。
