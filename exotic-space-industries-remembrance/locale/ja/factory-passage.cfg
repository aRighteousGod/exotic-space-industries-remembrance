[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=???????????画面を開いていない組立機のうち、標準の回路によるレシピ選択を使うものを確認します。無効にすると、回路による変更がイベントや明示的な更新まで当たり判定に反映されない場合があります。開いている設備画面の確認とイベントによる更新は続きます。次の処理tickから適用され、再構築は行いません。ESIRモード以外、設備間の通行が無効、またはSqueak Through 2が優先される場合は動作しません。
ei-factory-passage-circuit-scan-budget=セーブ全体で1 tickあたりに行う追加の回路走査回数（1～1,024、初期値：1）です。通常の更新上限とは別枠です。レシピの確認または接続の更新が完了した機械は、次の背景走査まで60 tick以上待ちます。小さい値はスクリプト処理を抑えますが、当たり判定の更新が遅れます。大きい値は待機処理を早く消化しますが、tickの負荷が増える場合があります。処理時間をミリ秒単位で保証する設定ではありません。再起動は不要で、走査が無効でも値は保存されます。
ei-factory-passage-update-budget=1 tickあたりに処理する待機中の作業数の上限です（1～1,024、初期値：256）。値を小さくするとスクリプトの処理量が減りますが、パイプの当たり判定の更新が遅くなります。値を大きくすると待機中の作業を早く処理できますが、1 tickあたりの処理時間が増える場合があります。再起動は不要で、すべてのサーフェスに即座に適用されます。初回のワールド内の設備の検索と補助エンティティの削除は一括で行うため、この上限の対象外です。パイプの通行モードがESIR以外の場合、設備間の通行が無効な場合、またはSqueak Through 2が優先される場合は使用しません。
ei-factory-passage-enabled=対応する設備を隣接して設置したとき、その間を通行できるようにします。無効にするとESIRによる通行判定の変更をすべて解除します。カテゴリ別の選択は保持されます。
ei-factory-passage-production=隣接する生産機械、掘削機、研究所などの間を通行できるようにします。
ei-factory-passage-power=隣接する発電機、ボイラー、原子炉、蓄電池、ソーラーパネルなどの電力設備の間を通行できるようにします。
ei-factory-passage-logistics=隣接する保管設備、インサータ、回路装置、ビーコン、レーダー、ロボットステーション、駅の間を通行できるようにします。
ei-factory-passage-turrets=プレイヤーが隣接して設置したタレットの間を通行できるようにします。
ei-factory-passage-pipe-mode=バニラ：パイプの元の当たり判定を維持します。\nSqueak Through：隣接するパイプの間を、接続部分も含めて通行できます。パイプの中心は通り抜けられません。\nESIR：接続されていない隙間は通行できますが、地上の接続部分は通り抜けられません。新しい接続部分にキャラクターがいる場合は、そこから離れるまで通行を妨げる判定を追加しません。地下区間と、元から通行できるヒートパイプは引き続き通行できます。

