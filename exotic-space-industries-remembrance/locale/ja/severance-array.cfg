[technology-description]
ei-severance-array=量子時代のレーザータレットを解禁する。単一の光の誓約を変化する照準に沿って引きずる。

[mod-setting-name]
ei-severance-array-visual-fidelity=断絶アレイの視覚忠実度

[mod-setting-description]
ei-severance-array-visual-fidelity=断絶アレイの可視ビーム証跡、発光・炎・焦げ跡の寿命、音の密度、実行時の視覚予算だけを変更します。ダメージ、射程、電力、耐久力、レシピコストは変わりません。最大は上限付きの撮影・負荷試験用プリセットです。無制限は視覚上限を外すため、UPSを壊滅的に落とす可能性があります。

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=軽量
ei-severance-array-visual-fidelity-standard=標準
ei-severance-array-visual-fidelity-cinematic=シネマティック
ei-severance-array-visual-fidelity-maximal=最大
ei-severance-array-visual-fidelity-unbounded=無制限

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=UPS優先。ビーム断片を減らし、証跡を短くし、炎と焦げ跡の生成を強く絞ります。
ei-severance-array-visual-fidelity-standard=普段のプレイ向けの基準プロファイルです。可視の掃射、証跡付きの着弾、控えめな実行時予算を使います。
ei-severance-array-visual-fidelity-cinematic=演出重視。ビーム断片と証跡を増やし、発光と焦げ跡を長く残します。
ei-severance-array-visual-fidelity-maximal=上限付きの大演出プロファイルです。撮影向けのビームと証跡を出しつつ、緊急用の上限は残します。
ei-severance-array-visual-fidelity-unbounded=視覚上限を外し、準備できた断絶処理を積極的に消化します。安全より見栄え優先です。

[item-description]
ei-severance-array=4x4の量子兵器プラットフォーム。蓄積した莫大な電荷を消費し、敵の隊列へ動くレーザーの傷を刻む。

[entity-description]
ei-severance-array=4x4の量子兵器プラットフォーム。ネイティブのレーザー着弾が殺傷の刃を担い、高負荷時には可視の照準軌跡だけが薄くなる。

[exotic-industries-informatron]
menu_severance_array=断絶アレイ
title_severance_array=断絶アレイ
turrets-text-6=[item=ei-severance-array]断絶アレイは、プラズマタレットと戦略級遺物兵器の間に置かれる量子時代の刃のプロトコルである。巨大な電荷を蓄え、ネイティブのレーザー着弾が極端な初撃ダメージを担いながら、ひとつの可視ビームを直前の照準点から次の照準点へ引きずる。軌跡は視覚予算で制御され、多数のアレイが同時に発射すると、一部のビーム断片は抑制されてダメージを安定させる。
severance-array=断絶アレイ
severance-array-text=[item=ei-severance-array]断絶アレイは、量子時代の小型処刑エンジンである。4x4の基礎を占有し、膨大な電気パルスを消費し、個々の標的を弾丸として追跡するのではなく戦場に明るい傷を開く。
severance-array-2=照準軌跡プロトコル
severance-array-text-2=各射撃は、対象に通常のタレットダメージを与え、そのアレイにひとつの生きた可視軌跡を再指定する。ビーム断片は切断の装飾的な証人であり、真のダメージ源ではない。
severance-array-3=負荷低減
severance-array-text-3=同時に発射するアレイが多すぎる場合、ランタイムは利用可能な可視断片をそれらに分配する。戦場に見える光跡は減るかもしれないが、ダメージは演出より先にネイティブのタレット経路に残る。
