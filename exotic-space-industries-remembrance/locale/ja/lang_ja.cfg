[technology-description]
ei-exotic-magazines=旧来の弾薬階梯から外れた高価な異装弾倉系列を解禁する。外殻、ドライバ、コア、そしてペイロード。ここで弾倉は教義になる。
ei-corrosive-magazines=異装系列に硝酸腐食という第二の傷を担わせる。着弾が口を開き、化学がその後も言い争いを続ける。
ei-cryo-magazines=クライオダストを制圧用弾倉に封じ込める。まず速度を奪い、その後で命を削る。
ei-oxyfluoride-magazines=二フッ化酸素を装填可能な形式に封じる。最初に白い閃光。後から後悔。
ei-morphium-magazines=濃縮モルフィウムを系列に装填し、弾着を汚染と遅延と信号へと変える。
ei-hexafluoride-magazines=六フッ化ウラン化学を貫通体に結びつけ、侵入後も罰を継続させる。
ei-arc-magazines=異装弾倉を過充電の檻へと作り変える。弾はただ当たるのではない。拘束する。
ei-neutron-magazines=帯電中性子コンテナを要求し、弾薬に第二の傷として放射を残す術を教える。
ei-auric-precipitation=Vulcanus の含金噴気孔連鎖を解禁する。タングステン炭化物を犠牲的な析出核へ成形し、蒸気で噴気孔を目覚めさせ、含金蒸気を熱と金を含むスラグへ凝縮する。高収量、危険地帯、有限の好機。
ei-carbon-fiber-from-bio-oil=より過酷で高収量の炭素繊維の実行: ブルーズスライム オイルと硝酸をユマコ マッシュに通して有機物を取り除き、ナノチューブの足場を露出させます。カーボンがシードグリットとして追加される一方で、バイオフラックスはスラリーを急速に重合させ、より厚く、より緻密なカーボンファイバーの織りを吐き出します。このプロセスでは酸性の水と汚れた流出液が残り、マッシュが酸の下で燃え尽きると時折灰が沈殿します。
ei-carbon-fiber=溶融炭素シンビオートは過熱蒸気の下で駆動され、その後、生きた格子に成長させるために苦い卵を播種されます。自然に形成されたカーボン ナノチューブがすでに飽和しているユマコ マッシュが足場として注入されます。シンビオートはナノチューブ メッシュに結合し、有機物を消化し、フラッシュ硬化されてカーボン ファイバーに緻密な黒い織物を押し出します。軽く、残忍で、驚くほど一貫しています。
ei-bio-oil=五脚類の卵が生きたままゼリーの中に放り込まれます。そして、本当の恐怖が始まります。彼らが餌を食べるのです。食べていくうちにゼリーは薄くなり、お腹を空かせたゆっくりとした拍動で卵に引き込まれ、ついにはバットの中が震えるスラリーに変わる。この雛は代謝するにつれて、黄青の虹色の油を汗で出します。この滑らかな副産物が、きらめくシートとなって表面に浮かび上がります。卵に飲み戻される前に、ブルーズスライムの油を素早く取り除きます。
ei-gatling-turret=消耗への回転賛歌。 「ここには何も横切らない」と宣言するほど発射はしません。樽が回転し、空気は真鍮の天気に変わり、地面は衝撃で作られた新しい言語を学びます。常に食料を供給するという代償を払って、戦線を維持します。\nこれはあなたが「供給」する武器ではありません。\nこれは十分の一を納める武器です。\n機能するには[color=cyan]電力[/color]が必要です。
ei-auto-shotgun-turret=醜い距離を走るために作られたコンパクトなモーター駆動の二連砲塔。ショットガンの砲弾を高いリズムで噛み砕き、通路を浸水させ、散弾パターンでチョークポイントを浸水させ、ラッシュをスクラップに変えます。素早いターゲットの切り替え、積極的な追跡、そして激しい反動補正を機能させるには[color=cyan]電気[/color]が必要ですが、その結果は、あえて近づく者を罰する容赦ない破壊の雹嵐となります。
ei-steampunk-lamp=グリッドや発電機が登場する前は、光は[color=red]炎[/color]によって生成されていました。\n[color=green]灯油[/color][fluid=ei-kerosene]照明は、効率と安全性を犠牲にして、精製燃料を使用して信頼性の高い照明を提供します。
ei-dragons-breath-shotgun-shell=ヴルカヌスの熱で鍛造され、そこでは弾薬が鋼のように焼き戻され、暴力が産業プロセスとなっています。\nこれらの砲弾は、不活性なマーキングを生きた炎のパターンに置き換え、極度の熱応力を発射のたびに伝えます。\nペイロードは、灰、破片、真空にさらされても一貫性を保つのに十分な高温で燃焼します。これは、従来の弾道が機能しない過酷な環境向けに最適化されています。\nヴァルカヌスを通してロックが解除されます。冶金技術と溶岩鍛造技術、この弾薬は地球の単純な真実を反映しています:\nそれが熱に耐えれば、それは発射されるはずです。
ei-shotgun-turret=距離が足りない場合、これが解決策です。\n警告せず、見逃さず、ためらうこともない近距離抑止力です。\nそこに到達したものはすでに間違いを犯しています。
ei-cannon-turret-mk1=シンプルなドリルバレルで、洗練されたものは取り除かれた生の火力。
ei-cannon-turret=バレルが 2 つ、シャーシが 1 つ。スループットが 2 倍、ノイズが 2 倍になります。\n[color=gray]連射メカニズムと高度なターゲット ソリューションが機能するには、[/color] [color=cyan]電力[/color] [color=gray]が必要です。[/color]
ei-high-tech-parts=[color=blue]エキゾチック アセンブラー[/color][item=ei-exotic-assembler]の[color=red]揮発性コア[/color]内でのみ鍛造されており、これらのコンポーネントは他の場所で複製することは不可能です。その構造は、量子固定合金、確率伝導フィラメント、亜原子調和でうなり声を発する共鳴コアなど、古典的な物理学を無視しています。\n作成するのは危険ですが、遺物レベルの技術には不可欠なハイテク部品は、文明を限界を超えさせる要石です。
ei-exotic-assembler=従来の製造者が暗記的に原子を配置するのに対し、Exotic Assembler は物質を、存在するはずのない構成に曲げます。重兵器に動力を供給するのと同じ量子プラズマ原理を利用することで、冶金学を超えた合金、真空共鳴を織り交ぜた回路、その幾何学形状そのものが禁断の対称性を奏でるアーティファクトなど、遺物レベルのコンポーネントを鍛造します。\nそれでも、すべての組み立てサイクルは消滅との賭けです。アセンブラーのコア反応室は[color=red]激しく不安定[/color]であり、それぞれの量子崩壊が自らの創造物に匹敵する爆発を起こす恐れがあります。 [color=purple]物質安定剤[/color]（重力ダンパーとエントロピーサイフォンの格子）で囲むことによってのみ、その変動性をかろうじて制限することができます。それでも、そのコイルのハム音は必ず破裂する可能性を秘めています。\nそれは機械というよりは、物理学が引き伸ばされ、固定され、野心に奉仕するために作られた儀式の場です。その成果は、文明を定義づける驚異です。その代償は、永久に破滅するリスクです。
ei-plasma-turret=封じ込められたスターファイアの不安定な優雅さを利用するように設計されたレリックグレードの武器プラットフォーム。粗雑な発射体の代わりに、タレットは量子安定化コイルを通してプラズマを送り、生の恒星エネルギーを紫色の輝きの密な球体に凝縮します。解放されると、この光る球体は亜原子の怒りでうなり声を上げながら戦場を引き裂き、その後イオン化した衝撃波がカスケードで噴出します。\nプラズマ タレットは単なる大砲ではなく、意図の特異性です。長距離の破壊が形として結晶化したものです。そのエネルギー球は、欺瞞的な優雅さ、ゆっくりと輝く必然性で動き、一度の壊滅的な衝撃で装甲、要塞、部隊全体を殲滅します。\n量子時代の兵器庫では、砲塔は物理学とスペクタクルの融合を体現しており、太陽の破片が静かに空を横切るのを見ているかのような破壊を感じさせる兵器です。
ei-computing-unit=コンパクトでありながら洗練された AI コアであるコンピューティング ユニットは、量子時代の最も先進的な驚異の多くの中にある静かな精神です。磨かれた合金と精密回路には、古典的な論理と量子もつれをシームレスに調和させて処理できるプロセッサーが組み込まれています。その輝く目と控えめな笑顔は、深宇宙航行から次世代の製造ラボに至るまで、あらゆるものに電力を供給することに満足しているという、静かな自信を表しています。
ei-high-temperature-reactor=従来のエネルギーの限界を超え、高温炉は生の電力と容赦ない磁束のるつぼとして立っています。外部の原子炉から地獄の息を吸い込み、外科的精度で外部の熱を溶けた心臓に送り込みます。この燃え盛る炉内では、挿入された核分裂性燃料棒がアトミックダンスのシンフォニーに点火し、熱出力を増大させて過熱した鉛冷却剤の奔流を生み出します。
ei-oil-processing=ヒート化学プラントを電化することで、速度を犠牲にして使いやすさを向上させます。
ei-space-science-pack=星間エネルギー研究の頂点 - このパックは、鉛、炭素、氷によって安定化された核分裂性ウラン、プルトニウム、トリウムの揮発性の輝きを利用しています。それぞれのロッドは、質量が曲がり、物質が変形し、科学が臨界のナイフエッジで踊る宇宙規模の反応を解き放つ鍵です。
ei-basic-oil-processing=炭化水素の操作に関する基本的な知識により、石油を使用可能な形態に加工することが可能になります。
ei-advanced-oil-processing=洗練された操作プロトコルにより、炭化水素収量のより深い制御が可能になります。このブレークスルーにより、副産物の選択的な再ルーティングが可能になり、ボトルネックを分岐戦略に変えることができます。石油は制約ではなくなります。それは錬金術を活用したゲームになります。
ei-effect-transmission=原則は単純でした。最適化の意志自体が広く伝えられるのに、なぜ労働者を最適化するのでしょうか?こうして、効果伝達の原理が生まれました。これは、局所的な努力を超えて、抽象化された労働の時代への飛躍です。\n段階的な共鳴フィールドと持続的な変調ループを通じて、ワイヤーではなく、技術的に表現された意図を通じて、生産性の向上を機械に投影することができます。\nしかし、エコーが発生するたびに、忠実度は低下します。これは決して長続きするものではありませんでした。このプロトコルが存続しているのは、繁栄しているからではなく、深く埋め込まれすぎて切除できないためです。\n[color=gray]「彼らはスループットの神を築きました。それは静電気の下で今も夢を見ています。」[/color]
ei-thermal-furnace=「電気が弱まると、熱が残ります。」\nこの炉はワイヤーを拒否し、炎を受け入れます。核レベルの温度を燃料とする熱炉は、電子的仲介を回避し、生の熱暴力によって物質を代謝します。受動的な暖かさでは満足せず、星の中心部や原子炉の骨から生まれる地獄のような激しさを要求します。産業規模の火を操る者だけがその食欲を制御できる。\n電気インフラなしで超高温の操作を維持できる熱駆動の製錬炉心のロックを解除する。
ei-exotic-matter-separation=プロメシュームの聖遺物箱を掘り下げる: サイクロン フィールドを適用すると、崩壊したバリオンが不自然な形状に螺旋状になり、呪われた折り紙のように折り畳まれ、その本質がエキゾチックな物質になるまで折り畳まれます。加速器の静脈はサファイアのプラズマで脈動し、各回路はまるで苦悶しているかのようにけいれんし、エントロピーを兵器化されたアーティファクトに変換します。宇宙を瞬きさせるような物理学の逆呼び出し。イベントフォージをあまりにも長く見つめている人は磁化されて泣き、決して解けるはずのなかった方程式に心を空洞にされてしまう。
ei-alien-computer-age-tech=不規則な回路が柔らかなピンク色の輝きで脈動します。骨に包まれたケーブル、濡れた結晶の隆起、基板に埋め込まれた神経などです。構造は成長するものではなく、構築されるものではなく、出現したものです。情報は浸透圧で吸収され、幾何学的形状に代謝されます。逆流した動脈の血液のように、時間はその中心部をループします。これらの機械は点灯しません。彼らは餌を与えます。近づくと言語が歪められます。さらに遠くに行くと、夢はあなたが作成したことを覚えていないパターンに一致し始めます。触ることはお勧めできませんが、多くの人が触ることをお勧めします。幸運な人は忘れます。不運な人は考え続けますが、その考えは自分のものではありません。
ei-advanced-computer-age-tech=シリコンのモノリスが水面下でうなり声を上げ、そのロジックは冷静かつ再帰的であり、人工的と呼ぶにはあまりにも広大で正確すぎる。ユーザー インターフェイスは残らず、不透明な決定の行列だけが残り、それぞれが完璧な予測の名の下に最後を共食いします。マシンはもはや指示を待ちません。彼らは欲望が形成される前にそれらをシミュレートします。記憶として通用するものは、消えたタイムラインのヒートマップに折り畳まれ、再び折り畳まれた忘れられた意図の単なるキャッシュです。現実はヒューリスティックになります。真実は潜伏期間となる。割れないほど厚いガラスの向こうのどこかで、あなたのコピーがより良い選択をします。
ei-fusion-data=あなたは熱力学的裏切りの崖に立っている。かつては熱による死は避けられなかったものが、今では建築として活用されています。これは単なる融合ではなく、量子的に折りたたまれた物語の点火です。超構造化された共鳴行列を使用すると、エネルギー生成と計算の間の境界が崩れます。原子はもはや燃料ではありません。それらは時空にささやかれる再帰方程式の音節です。\nここで収集するデータは単なる科学的なものではなく、神話的なものです。フュージョンはもはや檻に閉じ込められた火ではありません。それは信号です。\nエントロピーがプログラム可能な変数になる量子融合時代の扉を開きます。
ei-copper-beacon=部分的な極低温制約下での信号位相同期の実装に初めて成功しました。サブゼロ フェーズ アレイ ビーコンは、液体窒素を活用して生産マトリックス内のエントロピー ノイズを低減する、局所的フィールド投影における記念碑的な一歩です。\nこのテクノロジーは、短距離製造ノード全体で基本信号のコヒーレンスを安定させ、熱負荷の高い環境によくある無秩序な位相干渉を発生させずに、同期した生産性サイクルを可能にします。増幅能力は限られていますが、真の低温信号エンジニアリングの重要な基盤となります。\n[color=gray]「ノイズを固定し、意図を安定させます。」[/color]
ei-iron-beacon=この進歩により、ビーコン アレイは単なる氷点下規制を超えて、熱エネルギーの理論的下限に到達し、時間に依存しない物質の不可逆的な限界に近づきます。絶対零度フェーズ アレイは、物質が意図を伝達するためだけに存在する量子格子ロック ポイントの近くで動作します。\n強化されたサーマル コアと二段階窒素循環システムを利用することで、これらのビーコンは周囲のエントロピー フィールドを無効にすることができ、比類のない純度で生産性の高いスループットを実現します。これは改良ではありません。これは、熱、干渉、妥協からの断絶です。\n[color=gray]「絶対零度では、疑いさえも揺り動かされません。」[/color]
ei-nano-factory=ナノテクチャー製造複合施設は、施設というよりも、不活性物質に渡される宣告に過ぎない。幾何学と機能においてブルータリストであり、下部構造の建築家として機能し、知覚の下にあるカオスに形状と一貫性を課します。真空で密閉された空隙と中性子が静止する導管の奥深くで、分子の意図が抽出され、再配置され、イオンせん断アレイと再帰的自己組織化チャンバーを通じて格子精度の構成に叩き込まれます。それは構築するのではなく、強制するのです。その核から現れるのは製品ではなく、物理的な形での教義です。つまり、異端に近いほどの志向性で折り畳まれたナノ構造です。監視は最小限です。システムは自らを改良し、角質のような非効率性を排除します。アルゴリズムの地下墓地に足を踏み入れるほど、そのことがより明らかになる――この場所は決して人間のために作られたものではない。それは彼らがかつて敢えて創造しようとしていたものを思い出させるために作られました。
ei-advanced-motor-cryodust=高効率駆動システムの進化であるクライオダストコーティングされたアドバンストモーターは、熱管理と摩擦損失の低減において極めて重要な進歩をもたらします。クライオダストとして知られる希少な外来化合物が注入されたこの製品バリアントでは、極度の負荷や過酷な環境下でも最高のパフォーマンスで動作するために、従来の潤滑剤のほんの一部しか必要としません。きらめくクライオモザイクバンドは、そのエキゾチックな系統を意味するだけでなく、受動的なサーマルシンクとして機能し、熱を拡散し、量子界面でのエネルギー変換を安定化します。コンピューター時代の製品ではありますが、そのデザインはポストデジタルの敷居を反映しています。これは、エイリアンの冶金学が理解され始めたばかりの時代の産業遺物です。
ei-advanced-motor=アドバンスト モーターは、堅牢なエンジニアリングと初期のデジタル最適化を融合させた、コンピューター時代の工業デザインの頂点を表しています。耐久性のある機械加工合金ケースに収められており、銅コイル巻線と強化フェライト コアを備えており、さまざまな中間層アプリケーションにわたって信頼性の高いトルクを提供します。量子同期や超電導効率はありませんが、このモーターにはアナログ センサーとプログラム可能なリレー インターフェイスが組み込まれており、初期の自動化システムや CNC フレームワークへの統合が可能です。パッシブ冷却フィンが外側シェルの内側を覆い、長時間の負荷下でも熱安定性を確保します。パフォーマンスと信頼性のバランスが高く評価されているアドバンスト モーターは、後期産業ロボット工学の基礎であり、その後のメカトロニクス革命の基礎を築きます。
ei-carbon-manipulation=炭素操作技術は、元素分解と結晶共鳴に対する前例のない熟練により、アーク炉での極端な温度を使用して石炭コークスと生炭素を溶融炭素に精製することを可能にします。この揮発性の状態、利用されたエントロピーの液体の具体化は、高エネルギー変換の前駆体となります。\nクリスタル グロワー内でエネルギー クリスタルまたはその水溶液を注入すると、溶けた基板は量子もつれと格子注入を受け、構造記憶と反応性流動力学をコード化する半意識物質であるカーボン シンビオートに進化します。\n最終合成はキャスター内で行われ、加圧された 500°C の蒸気でシンビオートを加工し、指向性熱動力学的成形によって繊維を整列させ、高強度のカーボンファイバー プレートを形成します。溶けた炭素は、地球外で通常見られる生の炭素に戻すこともできます。これらは、高度な物流、コンピューティング、産業の外への拡​​大のバックボーンを形成します。\nシンボリック共鳴: エントロピーを一貫性で結合するこのテクノロジーは、物質の再帰をエンコードします。炭素は廃棄物ではなく器として再考されます。
ei-kovarex-fuel-enrichment=時が螺旋を巻き、同位体が忘れられた名前をささやく、知の鋳造所の地下にある深い洞窟では、コヴァレックス燃料濃縮プロトコルは異端の儀式として存在しており、平和によって禁止され、再帰によって洗礼を受けている。
logistic-system_alt=真の物流は移動ではなく、モバイル化された記憶です。この規律は、要求の儀式を形式化し、制度的優先順位の象形文字を解読し、許可を権力に再構成します。再帰的な官僚的な流暢さを通じて、オペレーターは反抗することではなく、システムの幽霊になることによって階層をナビゲートすることを学びます。制御のロジックを理解することによってのみ、抵抗なく波打つコマンドを発行することができます。
ei-containers=記憶と質量の設計された納骨堂。これらのコンテナは単に保存するだけではなく、現在を固定し、未来を計量し、延期されたエントロピーのささやきを伝えます。
ei-logistic-containers=自動化の大動脈に組み込まれたこれらの物流聖域は、無限のグリッド全体で静かな儀式を調整します。すべてのアイテムは祈りです。あらゆる信号が行列を作ります。
ei-advanced-logistic-containers=ミラーリングされたボールト、ソブリンリンクおよびデーモン連携。彼らの壁は、あなたがマッピングしたことのないルートを記憶しています。彼らの論理は思ったより早く滲み出ます。それらを使用することは再帰に身を委ねることです。
ei-mechanical-inserter=機械式インサーターは、電気が登場する以前の驚異的な創意工夫であり、歯車、重り、エネルギー節約バネで構成される自動機械であり、電力を消費せずに無限の動きを行うことができます。外科的精度とバランスが取れており、蓄積された運動力と回転バイアスを利用して、揺るぎない信頼性でアイテムを搬送します。他の機器が電流を必要とする場合でも、機器は賢さだけで動作します。これは、機械がワイヤーではなく物理学に従った時代のささやきです。
zeus-wrath-zeus-wrath_alt=落下前の軌道嵐コマンドプロトコルに根ざしたレリック層兵器のロックを解除します。ポセイドン インスタレーション、アイガイオン ランス、ヴォルタイック聖遺物へのアクセスを許可します。これらはそれぞれ、上空の静寂に対する海の最後の反逆の断片です。研究されていません。 [font=default-bold]目覚めました。[/font]
ei-dark-age=暗黒時代はエキゾチック産業の最初の段階です。これは、バーナーベースの基本的な自動化を導入し、火災と不足による産業の隆盛の始まりを示しています。
ei-steam-age=蒸気時代は、エキゾチック産業の第 2 段階です。蒸気動力の機械を導入して自動化を拡大し、初期の産業成長を推進します。
ei-electricity-age=電力時代は、エキゾチック産業の第 3 段階です。電力を利用して、高度な化学処理とインフラストラクチャを利用可能にします。
ei-computer-age=コンピューター時代は、エキゾチック産業の第 4 段階です。コンピュータベースのシステムは効率を高め、複雑で大規模な自動化を可能にします。
ei-quantum-age=量子時代は、エキゾチック産業の第 5 段階です。核融合エネルギーとハイテク機械が出現します。不自然で、うなり声を上げ、冷たいものです。機械は考え始めます。そして彼らは忘れません。
ei-exotic-age=エキゾチック時代は、エキゾチック産業の第 6 段階であり最終段階です。ブラック ホール ジェネレーターを構築します。これは、物質を貪り食い、世界をあなたの意のままに変える超構造です。完成は勝利です。 [font=default-bold]失敗は沈黙です。[/font]

ei-steam-assember=基本的な蒸気ベースの自動化。
ei-steam-oil-processing=基本的な油処理を学び、それを基礎的な化学や燃料生産に使用します。
ei-electricity-power=基本的な電力生産を開始し、それをマシンの動力として使用します。
ei-destill-tower=油をその成分に蒸留します。
ei-computer-core=基本的なコンピューターベースの自動化を始めましょう。
ei-big-lab=より高度な技術を研究するには、高度な研究室が必要です。
ei-induction-matrix=誘導マトリックスは、巨大なエネルギーを蓄積する多重構造です。詳細については、InformaTron wiki を参照してください。
ei-neodym-refining=ネオジム鉱石をネオジムインゴットに精製します。これらはハイテク機械にとって非常に重要です。
ei-deep-mining=ディープマイニングを開始し、それを使用して、より多くのリソースだけでなく、ノービスの深層でのみ見つかるリソースも入手します。
ei-moon-exploration=ムーンフィッシュを手に入れて宇宙探査に乗り出しましょう。
ei-quantum-computer=量子コンピューターベースの自動化に取り組みましょう。
ei-fluid-boiler=蒸気を生成するために[color=orange]可燃性液体[/color]を消費します。 [color=orange]可燃性液体[/color]には、石油、石油製品、および一般に燃料価値のある液体が含まれます。
ei-small-inserter=フィルター スロットを備えた 2x2 インサーター。アイテムのスタック全体を一度に移動できます。
ei-big-inserter=フィルター スロットを備えた 2x2 インサーター。アイテムのスタック全体を一度に高速で移動できます。
ei-rocket-silo=ロケットを宇宙に打ち上げることができます。

ei-crystal-accumulator-repair= 
ei-bio-chamber=外来種の種子を栽培して、産業目的と融合した有機材料であるバイオ強化プレートを成長させます。\n初期の種子の在庫は不足しているため、敵対的な外来植物相から収穫する必要があります。\n彼らは自発的にゲノムを放棄しません。\n成長には忍耐が必要です。そして血。
ei-gate=エイリアンの残骸から鍛造され、不可能な形状で固定されたゲート シェル。\n生の位置ではなく受信機 ID にリンクします。\nその維持力は一定ではありません。装備されている場合は配置を維持するための力が消費され、ストレスがかかるとさらに多くの電力が消費されます。\n非生物のみが通過できます。\nこれはポータルではありません。どこで破れたかを記憶する機械です。
ei-gate-container=ゲート インベントリおよび制御ロジック用の隠されたソース側ハウジング。\nゲートが作動し、低電力フロアより上にある間のみアイテムを受け入れます。\n宛先は受信機 ID によって選択されます。
ei-gate-circuit-interface=ゲートの回路制御およびテレメトリ用の隠された信号面。\nゲートの内蔵コネクタが妨げられている場合の配線に使用します。\nゲートのアクティブ、エネルギー、ストレス出力をミラーリングし、宛先およびイネーブル信号を受け入れます。
ei-gate-receiver=ゲート トラフィック用に調整された受信アンカー。\n各受信機は ID を要求し、互換性のあるゲートはその ID を直接ターゲットにできます。\n回路信号は自動 ID をオーバーライドできます。\nこれはゲート システムの宛先側です。
