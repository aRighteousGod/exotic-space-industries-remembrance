[recipe-description]
ei-bio-oil-refining=培養スライムオイルから中質油と重質油を合成する。
ei-bio-oil-synthesis=ペンタポッドの卵が生きたままゼリーの中に投入され――真の恐怖が始まります: 彼らは捕食します。ゼリーが消費されるにつれて薄くなり、ゆっくりとした飢えた脈動で卵に引き寄せられ、槽は揺れるスラリーへと変わります。群れが代謝するにつれて、黄色と青の虹色に輝くオイルを汗のように出します――ギラつく副産物が、煌めくシートとなって表面に浮かんできます。卵が飲み戻す前に、培養スライムオイルを素早くすくい取ってください。
ei-breach-residue-neutralization=ゲートの残留物を中和して汚水にする
ei-carbon-fiber-from-bio-oil=より高品質で高効率な炭素繊維を生成工程：培養スライムオイルと硝酸にユマコのマッシュを浸し、有機物を除去して繊維質だけを取り出す。炭素とバイオ溶剤を添加し、その作用でスラリーを急速に重合させることで、高密度の炭素繊維が生成される。この過程では、流体では酸性溶液や汚れた廃液、固形物では灰といった廃棄物が生じる。
ei-lube-destilate-steam-finishing=潤滑油留出物を蒸気処理して安定した潤滑油を生成します。副産物として石炭ガスを排出します。
ei-lube-destilation=潤滑油を熱水分解して重油と炭素残留物を生成します。
ei-plastic-from-bio-oil=石油ガスと培養スライムオイルからプラスチック棒を作成する。
ei-steam-bio-oil-refining=培養スライムオイルと蒸気から中質油、重油、潤滑油を合成する。
ei-sulfur-from-bio-oil=石油ガスと培養スライムオイルから硫黄を作成する。
ei-water-bio-oil-refining=培養スライムオイルと水から中質油と重質油を合成する。
