ei-solar-icon-scaling=進行度とエネルギー出力の両方の観点から、ソーラーパネルの全3tierをスケーリングする。\n75%未満へのスケーリングは配置の[color=cyan]柔軟性[/color]を高める。\n75%超へのスケーリングは、同じ資源入力で指定されたエネルギー出力を達成するのが[color=yellow]容易[/color]になる。
ei-tech-scaling-additionalMultiplier=曲線と上限が解決された後に適用される追加の最終倍率。\nプレイ中のセーブデータで変更しても壊れる心配は極めて小さい。
ei-tech-scaling-curveForm=研究コスト算出式\n設定:\n開始点 A = (0, C) → C = 初期価格\n終了点 B = (N, X) → X = 最大コスト\nN = 総技術数, n = 現在の技術インデックス\nコスト関数:\n一次関数: cost(n) = (X - C) / N ・ n + C\n二次関数: cost(n) = (X - C) / N^2 ・ n^2 + C\n指数関数: cost(n) = exp(n/N ・ ln(X + 1 - C)) + C - 1\n技術価格倍率形式 (cost(n) / C):\n一次関数: f_lin = (X - C) / (N・C) ・ n + 1\n二次関数: f_qua = (X - C) / (N^2・C) ・ n^2 + 1\n指数関数: f_exp = (exp(n/N ・ ln(X + 1 - C)) - 1) / C + 1\n統合コスト (総テクノロジーパック数):\n一次関数: Area_lin = N/2 ・ (X + C)\n二次関数: Area_qua = N/3 ・ (X + 2C)\n指数関数: Area_exp = N ・ (C - 1 + (X + 1 - C) / ln(X + 1 - C))\n大数値 X 近似:\nArea_exp ≒ N・X / 9\nArea_qua ≒ N・X / 3\nArea_lin ≒ N・X / 2\n相対難易度:\n指数関数＞二次関数＞一次関数 - 指数関数は序盤穏やかで終盤重く、一次関数は始終一定、二次関数はその中間。\nage-ramp（時代傾斜）: 暗黒と蒸気を穏やかに保ち、電気から熱を帯び始め、コンピュータ、量子、エキゾチックに最も重く作用する終盤重視・時代区分のスケーリング。技術の重み付けライブラリを使用するため、割引された技術のカウントは少なくなります。\n[color=red]ゲーム中盤でこの設定を変更すると、望ましくない結果が生じる可能性があります。[/color]
ei-tech-scaling-maxCost=研究ごとの最大[color=red]個別[/color]テクノロジーパックコスト。\n[color=pink]Sunday stroll[/color] - 207\n[color=white]Walk in the park[/color] - 415\n[color=#D2B48C]Almost free[/color] - 831\n[color=gray]Very Cheap[/color] - 1662\n[color=white]Default[/color] - 2500\n[color=cyan]More Cheap[/color] - 3325\n[color=blue]Cheap[/color] - 6750\n[color=yellow]Fairly priced[/color] - 12500\n[color=orange]Less Expensive[/color] - 25000\n[color=red]Expensive[/color] - 50000\n[color=purple]Very Expensive[/color] - 100000\nFactorioは内部の研究価格倍率を[color=red]x1000[/color]に制限しているため、ESIRは選択された上限に達できるように必要に応じて隠された有効ベース初期価格を自動的に引き上げます。[cite: 5]
ei-tech-scaling-startPrice=曲線の公式変数 C。選択された上限がFactorioの x1000 キャップに達してしまう場合、ESIRは裏で隠された有効ベース初期価格を引き上げる場合があります。\nセーブが開始された後にこれを変更すると、依然として予期しない結果が生じる可能性があります。[cite: 5]
ei-ticks_per_full_update=すべてのESIRエンティティが更新されるtick数を指定
