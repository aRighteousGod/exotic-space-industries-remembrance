ei-default=エキゾチック[color=#08457E]宇宙[/color]産業: [color=#FF1493]追憶[/color]の推奨プレイ方法。あなたの旅は、すべてのコアリソースと初期のインフラストラクチャが配置されているノービスから始まります。\nこれは揺りかごです。傷つき、馴染みがあり、制限されています。\nノービスでの敵の激化は、初期の時代には緩和されます。開始バッファはより広く、初期の進化は遅く、猶予は電気の時代で終わります。\nエンドゲームのマテリアルと高度なシステムは、別の面で待っており、後で進行することでロックが解除されます。\nあなたは、自分の世界を離れることになります。知っています。\n[font=default-bold]同じものは返されません。[/font]


