train-progression=鉄道の進歩
train-progression-text=列車は蒸気時代において早い段階で利用可能になります。最初の選択肢は [color=orange]蒸気機関車[/color] [item=ei-steam-basic-locomotive] で、これは固体を輸送できますが、流体を輸送することはできません。\n\n研究の進行により [color=orange]先進蒸気機関車[/color] [item=ei-steam-advanced-locomotive] が解禁され、流体輸送能力が追加されます。両方ともは石炭や固形バイオマスなどの可燃性燃料に依存しており、ロケット、核、または核融合燃料を用いることで性能を強化できます。\n\n最終的には、汚染を伴う内燃機関は欠点となる可能性があります。よりクリーンで高速な従来の鉄道を運用するためには、[color=brown]ディーゼル燃料[/color] [item=ei-diesel-fuel-unit] と [color=orange]ディーゼル機関車[/color] [item=locomotive] へ移行することをおすすめします。\n\n物流は技術とともに段階的に発展します。\n燃料がフロンティアを定義します。\n列車はどこへ行くかを聞きません――何を燃やすかを要求します。\n\nガイアに到達すると、鉄道は再び分岐し、[font=default-bold]リニア列車[/font]が登場します。ここに至って鉄道は、ネットワーク化されたインフラともいうべきパワーを得ることになります。
train-progression-text-2=列車は蒸気時代において早い段階で利用可能になります。最初の選択肢は [color=orange]蒸気機関車[/color] [item=ei-steam-basic-locomotive] で、これは固体を輸送できますが、流体を輸送することはできません。\n\n研究の進行により [color=orange]先進蒸気機関車[/color] [item=ei-steam-advanced-locomotive] が解禁され、流体輸送能力が追加されます。両方ともは石炭や固形バイオマスなどの可燃性燃料に依存しており、ロケット、核、または核融合燃料を用いることで性能を強化できます。\n\n最終的には、汚染を伴う内燃機関は欠点となる可能性があります。よりクリーンで高速な従来の鉄道を運用するためには、[color=brown]ディーゼル燃料[/color] [item=ei-diesel-fuel-unit] と [color=orange]ディーゼル機関車[/color] [item=locomotive] へ移行することをおすすめします。\n\n物流は技術とともに段階的に発展します。\n燃料がフロンティアを定義します。\n列車はどこへ行くかを聞きません――何を燃やすかを要求します。\n\nガイアに到達すると、鉄道は再び分岐し、[font=default-bold]リニア列車[/font]が登場します。ここに至って鉄道は、ネットワーク化されたインフラともいうべきパワーを得ることになります。
turrets=様々な固定タレット
turrets-2=散弾とカノンタレット
turrets-4=ミニガンとレーザー
turrets-5=遺物プラットフォーム
turrets-text=ESIRではタレットが大幅に拡張されます。そのグループには、即興の近距離砲から蒸気式長距離砲、腐食性流体兵器、電気駆動レールガン、超古代文明の技術を使用した光線兵器まで含まれます。これらのタレットは [item=gun-turret] ガンタレットの単純な上位互換ではありません。それぞれが異なる物流、異なるキルゾーン、および異なるアップグレードサポートを要求します。\n\nほとんどの弾道追加品は、引き続き実弾射撃ダメージ研究でスケーリングします。流体タレットは火炎ダメージラインで成長します。後期のアーティファクト級は巨大な電力、稀少な素材を要求し、１発の破壊力も発射間隔も重くなります。
turrets-text-2=[item=ei-shotgun-turret] ショットガンタレットはガンタレットおよびミリタリーの後に暗黒時代で登場します。防壁に直接触れて破壊する者への、これが回答です。射程15、連射は遅いが、小難しい電力要求はありません。工場に到達したあらゆる存在への残酷な処罰。電気時代では [item=ei-auto-shotgun-turret] コンバットショットガンタレットへとアップグレードされます。発射速度を倍増させ、射程18に達し、旋回がはるかに速くなり、散弾のカーテンをまき散らします。代わりに待機電力と1射ごと電力が必要になります。\n\n[item=ei-cannon-turret-mk1] カノンタレットは蒸気時代の攻城ステップです。[item=cannon-shell] 砲弾を射程25へ発射し、単発の破壊力はピカイチですが、旋回は遅い上に射角には死角があります。後に、2つのMK1とより重いコンポーネントが [item=ei-cannon-turret] 二連装タレットとなります。耐久力は高く、連射速度も向上、電動アシストを受け、射程30で機能します。死角は改善されますが、完全に解消される訳ではありません。
turrets-text-3=[item=ei-acidthrower-turret] アシッドスロワーは火炎放射タレットの派生です。射程38（最小射程9マス）に達し、[fluid=sulfuric-acid] 硫酸、[fluid=ei-nitric-acid] 硝酸、[fluid=ei-hydrofluoric-acid] フッ化水素酸、[fluid=ei-acidic-water] 酸性溶液が使用可能で、それぞれが独自の攻撃力補正を持ちます。石油を燃やすよりも化学を兵器化したい工場のための流体タレットです。\n\nバニラの [item=flamethrower-turret] 火炎放射タレットも再作成されました。ExoticIndustriesでは蒸気時代に移動し、同じ38/9の攻撃範囲へと拡張し、挙動も機敏になりますが、可燃流体の消費量も多くなります。可燃流体の品質が重要になりました。原油は引き続き機能しますが、重油／軽油／石油ガス／[fluid=ei-kerosene]灯油は純度が高いほど強力に打撃を与え、不純物が多いものはより弱くなります。
turrets-text-4=[item=ei-gatling-turret] ミニガンタレットは電気時代の弾丸シャワーです。マウントされた [item=ei-minigun] ミニガンと電動駆動システムを組み合わせ、射程32、4マスの最小射程、優れた再照準、および猛烈な連射速度を提供します。欠点は見た通りです。際限なく消費される[item=firearm-magazine]マガジンと少なくない消費電力。\n\nバニラの [item=laser-turret] レーザータレットは引き続き利用可能ですが、ExoticIndustriesはそれらをより意図的な電気時代の投資へと再調整します。射程は30へと押し上げられ、その技術は明確に [item=battery] 電池と [item=advanced-circuit] 発展回路を要求し、そのレシピは [item=ei-steel-beam] 鋼鉄の梁、[item=steel-plate] 鋼鉄インゴット、[item=battery] 電池、[item=advanced-circuit] 発展回路、および [item=ei-energy-crystal] E2クリスタルを中心に再構築されます。よりクリーンなタレットとなりますが、もはや安価な万能の回答ではありません。
turrets-text-5=[item=ei-plasma-turret] プラズマタレットは量子時代の要塞砲です。物理的に非常に大きく、膨大な電力を消費し、誘導マトリクス部品と複数の [item=laser-turret] レーザータレットから構築されます。引き換えに、ゆっくりと始動するプラズマボルトを射程200へ投げつけ、自らの周囲に40マスの安全半径を保持し、各ヒットを陣地、要塞、地形を一様に破壊する大規模な拡散衝撃波で締めくくります。\n\n[item=zeus-wrath-zeus-turret] ポセイドン要塞は [technology=zeus-wrath-zeus-wrath] で開放され、遺物級のさらに上に位置します。ExoticIndustriesはそれを戦略兵器として再構築します。射程350、最小射程70、1ショットあたり1 GJ、巨大なエネルギー蓄積、および内側と外側のプラズマ爆風リング。もはやタレットと呼ぶのも憚られ、存在自体が許されない目標への、これが回答です。
uranium-asteroid=ウランアステロイド
uranium-asteroid-text=[font=default-bold]スペースプラットフォーム[/font]研究とともに解禁されます。両方のレシピが [fluid=sulfuric-acid]硫酸を消費します。引き換えに [item=stone]石材、[item=ei-uranium-chunk]ウランの塊、および [item=ei-lead-chunk]鉛の塊を産出し、高度レシピはより多くの硫酸を費やしてはるかに強力なウランの産出をもたらします。微量の [item=ei-isotopic-ghost-shell]同位体ゴーストシェルを含みます。
veins=深部鉱床
veins-text=深部鉱床は初期段階ではアクセス不可能です。垂直方向の産出量を考慮して構築された中盤の抽出システムである [color=orange]深部ドリル[/color] [item=ei-deep-drill] を必要とします。\n\nこの鉱脈は一般的なロールとしてはスポーンしません。構造金属はナウヴィス全体の[font=default-bold]金属帯[/font]および[font=default-bold]堆積盆地[/font]に従います。 [item=ei-iron-chunk]鉄および [item=ei-copper-chunk]銅は尾根地域に多く、[item=ei-coal-chunk]石炭および [item=ei-sulfur-chunk]硫黄は低い盆地地形に偏ります。 \n\n[font=default-bold]熱水フロンティア[/font]は保護された初期地域を超えて [item=ei-lead-chunk]鉛および [item=ei-gold-chunk]金を運びます。 [font=default-bold]外縁の傷痕地帯[/font]には [item=ei-uranium-chunk]ウランが埋蔵され、それらの破損地帯の内部にある最も稀少な異常ポケットのみが [item=ei-neodym-chunk]ネオジムを露出させます。 \n\nウラン、鉛、金、ネオジム、およびイマーサイトを含む重要な材料は、これらの深層にのみ存在します。 \nそれらは選択的ではありません。\n構造的なものなのです。\n\n[font=default-bold]地表採掘があなたを終盤へ導くことはありません。[/font]掘削し、土地を読み解け。さもなくば停滞せよ。
welcome-text=[font=default-bold]目覚めよ。[/font]\n\nこれはMODではない。\n回帰である。\n奪還である。\n自動化の下に埋もれた権力の儀式である。\n\nここでは、[font=default-bold]何一つとしてあなたに与えられない。[/font]\n\nすべては勝ち取られねばならない――火を通じて、思考を通じて、崩壊を通じて。\n\n[font=default-bold]世界は変わった。[/font]\n\nルールは[font=default-bold]消え去った。[/font]\n構造のみが残る。\n\n意図をもって進め。\n\n[font=default-bold][color=#FF1493]Remembrance[/color]は注視している。[/font]
welcome-text-2=多数の新しい機械、生産チェーン、およびシステム的機能が導入されました。一部は効率的です。ほとんどは容赦がありません。\n\n彼らは自らを説明しません。\nあなたが適応するのを待ちません。\nすべてを探求するか、置き去りにされるか。\n\n複雑さは間違いではありません――それは進行の代償です。\n最適化は必須です。\n理解は勝ち取るものです。\n\nこれはガイド付きの体験ではありません。産業の坩堝なのです。
world-gen-related=この世界について
world-gen-related-text=このセクションでは、MODによって導入された世界生成システムの概要を説明します。構造的明確さのために集中的なサブカテゴリーに分割されています。\n\n左側のメニューを使用してアクセスしてください。\nこれらは見た目だけの変更ではありません。\n根本的なレベルで地形、資源の挙動、および空間ロジックを定義します。\n\n[font=default-bold]層を理解せよ。さもなくばそれによって形作られよ。[/font]
