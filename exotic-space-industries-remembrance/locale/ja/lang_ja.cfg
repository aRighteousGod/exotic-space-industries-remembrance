default=*CHANGE ME* デフォルトのMAPプリセット。Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]には[color=red]非推奨[/color]。
ei-default=Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]の推奨プリセット。あなたの旅は、すべての主要リソースと初期のインフラが配置されているナウヴィスから始まります。\nこれは揺りかごです。傷つき、馴染みがあり、そして制限されています。\n初期の安全地帯はより広く、敵の進化は遅くなっており、この猶予は電気時代で終わります。\nエンドゲームのマテリアルと高度なシステムは、別の面で待っており、後で進行することでロックが解除されます。\nあなたは、自分の世界を離れることになります。知っています。\n[font=default-bold]同じものは返されません。[/font]
