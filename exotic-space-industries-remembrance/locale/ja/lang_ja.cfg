enemy-difficulty-text=このページには敵ユニットに加えられた最新の調整が記録されています。[font=default-bold]ei-default[/font] を再作成することはなく、新たな生態系を発明することもありません。バイター／スピッター／ワーム／巣／スナッパー／氷・毒・爆発系統／マザー／サンド／電気系統／[entity=tb_infected_ship_boss] などの感染構造物まで含め、前提MOD群にすでに存在する個体をそのまま調整します。
enemy-difficulty-text-2=各パーセンテージは[font=default-bold]オリジナル[/font]に対する割合を意味します。[font=default-bold]100%[/font]は前提MODの基準値を維持します。数値が高いほど敵のステータスが増加し、低いほど低下します。[font=default-bold]攻撃間隔[/font]と[font=default-bold]リスポーン間隔[/font]は逆方向に機能し、数値が低いほど攻撃や生成が速くなり、高いほど圧力が緩和されます。表示されている値は読みやすさのため四捨五入されています。
enemy-difficulty-text-3=この難易度テーブルはステータスの変化を意味します。敵ユニットの耐久値／回復速度／耐性／攻撃力／攻撃範囲／移動速度／攻撃速度。また、巣の耐久値／回復量／スポーン間隔／周辺の敵ユニット数上限を変更します。進化速度／汚染の吸収／襲撃の閾値／生成ユニットの種類／敵兵器の基礎となる共通の発射体、ビーム、毒雲、流体、弾薬を書き換えることはありません。ペンタポッド、グレバの巣、デモリッシャー、プレイヤーのロボット、およびロボポートは適用外です。
enemy-difficulty-text-4=Merciful と Impossible では、リヴァイアサン、マザー、MAFボス、歩行型電撃ボス、[entity=tb_infected_ship_boss] に追加の補正が入ります。例外の [entity=arachnid-biter-royalwarrior-unit] は通常のユニット体力を保ったまま、ダメージと移動速度だけを別個に補正します。[font=default-bold]Impossible[/font] では、MOD設定でONにしていてもナウヴィスの初期緩和が無効になります。
enemy-difficulty-text-5=[font=default-bold]Impossible[/font] では、ロケット打ち上げをきっかけにサイロが襲撃されることがあります。近隣で既存の敵だけが集まった集団となり、目安としておよそ [font=default-bold]100 から 250 タイル[/font]、多くは [font=default-bold]8 から 30 体[/font] の局地的な群れになります。打ち上げが重いほど反撃も強くなります。地表に敵対する生態系がなければ、襲撃の心配はありません。
enemy-difficulty-text-6=[font=default-bold]Original[/font] は ESIRによる追加調整を行わず、依存MODの値をそのまま使います。[font=default-bold]Tempered[/font] はデフォルト設定です。これより上は圧力が強くなり、これより下はマッププリセットを変えずに圧力を下げます。
