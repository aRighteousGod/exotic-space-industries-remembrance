[recipe-description]
ei-bio-oil-synthesis=五脚類の卵が生きたままゼリーの中に放り込まれます。そして、本当の恐怖が始まります。彼らが餌を食べるのです。食べていくうちにゼリーは薄くなり、お腹を空かせたゆっくりとした拍動で卵に引き込まれ、ついにはバットの中が震えるスラリーに変わる。この雛は代謝するにつれて、黄青の虹色の油を汗で出します。この滑らかな副産物が、きらめくシートとなって表面に浮かび上がります。卵に飲み戻される前に、ブルーズスライムの油を素早く取り除きます。
ei-bio-oil-refining=ブルーズスライムオイルを中程度および重質の留分に加工します。
ei-water-bio-oil-refining=水とブルーズスライムオイルを中程度および重質の留分に処理します。
ei-steam-bio-oil-refining=蒸気とブルーズスライムオイルを中留分、重質留分、潤滑油留分に処理します。
ei-plastic-from-bio-oil=石油とブルーズスライムオイルからプラスチック棒を作成する
ei-sulfur-from-bio-oil=石油とブルースライムオイルから硫黄を作成する
ei-carbon-fiber-from-bio-oil=より過酷で高収量の炭素繊維の実行: ブルーズスライム オイルと硝酸をユマコ マッシュに通して有機物を取り除き、ナノチューブの足場を露出させます。カーボンがシードグリットとして追加される一方で、バイオフラックスはスラリーを急速に重合させ、より厚く、より緻密なカーボンファイバーの織りを吐き出します。このプロセスでは酸性の水と汚れた流出液が残り、マッシュが酸の下で燃え尽きると時折灰が沈殿します。
ei-breach-residue-neutralization=ゲート残留物を中和して汚水にします。
ei-lube-destilate-steam-finishing=潤滑油留出物を蒸気仕上げして安定した潤滑油にし、軽質石炭ガス留分を副生成物として排出します。
ei-lube-destilation=潤滑油を熱水分解して重油と炭素残留物を生成します。

