railgun-cooling=レールガン冷却
railgun-cooling-text=レールガンは弾薬を別の冷却弾に変換しているのではなく、砲そのものを冷却する。冷たいフルオロケトンは砲座で消費され、熱いフルオロケトンは回収しなければならない。冷却が追いつかなくなると、武器は自ら動作を止める。\n\n意図された挙動だ。砲は熱を持ち、砲身には短い残光が残り、連射を支えるのは冷却系そのものになる。
railgun-cooling-2=冷却ループと代替レシピ
railgun-cooling-text-2=通常運転では、砲座で冷たいフルオロケトンを使う。ループが不足すると、レールガンは熱負債を抱え、発射をなかったことにはせず、停止して回復に入る。\n\n氷を使う代替の冷却レシピもあり、液体窒素だけが答えではない場面でも冷たいフルオロケトンを作れる。余剰熱は蒸気として逃がす。
railgun-cooling-3=地表ごとの挙動
railgun-cooling-text-3=地表によって冷え方は異なる。宇宙プラットフォームは熱をゆっくりしか逃がせず、大気のある世界ではより速く冷える。Aquilo は自然放熱が最速で、Vulcanus は長く熱を保ち、薄い空気か汚染の少ない地表はその中間になる。同じレールガンでも、据え付け場所で性格が変わる。
railgun-cooling-4=回復と状態
railgun-cooling-text-4=健全なレールガンは常時キューに居座らない。過熱した砲、または出力が詰まった砲だけが回復対象になり、熱負債が消えて熱い出力先が再び受け付けるまで停止したままだ。\n\nだから状態表示は意味を持つ。緑は準備完了、黄は回復中または出力詰まり、赤は冷却ハードウェア欠損か深刻な過熱を示す。
