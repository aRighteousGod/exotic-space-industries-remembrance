rocket-ammo-schema=ロケット弾薬の構成図
rocket-ammo-schema-text=ロケット弾薬は層で組む。[item=ei-rocket-airframe]エアフレーム、[item=ei-rocket-motor-basic]モーター、[item=ei-rocket-warhead-impact]弾頭、最後に完成弾。エアフレームが骨格を保ち、モーターが射程を決め、弾頭が破壊の型を選ぶ。砲兵系統も同じ理屈だが、より重く、より容赦がない。
rocket-ammo-schema-2=弾頭分岐
rocket-ammo-schema-text-2=基礎線はコストに見合う強さへ寄せてある。直撃弾と爆発弾はどちらも大幅に強化され、腐食系は手持ちランチャーと砲兵系統で同じ化学パッケージを共有し、強い酸撃に加えて構造を削る持続雲を残す。クライオ系は両系統で同じ制圧持続時間を保ったまま、なお重い一撃になった。核系は明確に分岐し、U-235 は ESIR 独自の [item=ei-atomic-bomb-u235] に収束してより締まった残留放射を伴い、プルトニウムは表示上はプルトニウム原子ロケットのまま、vanilla の原子爆発を保ちながら、より広い放射性汚染を後に残す。
rocket-ammo-schema-3=演出系統
rocket-ammo-schema-text-3=各系統に専用の爆発、煙、ステッカーを与え、ただの白い閃光に潰れないようにしている。
rocket-ammo-schema-4=砲兵核弾系統
rocket-ammo-schema-text-4=固定扇形の砲架には、U-235 とプルトニウムの原子ロケットを単装でもクレートでも装填できる。クレート斉射は実質的に自爆運用だ。核分裂材の生産経路と解禁は分かれたまま、U-235 はより締まった ESIR 中心爆発とより清潔なフォールアウトを使い、プルトニウムは vanilla の原子爆発を保ったまま、より広い放射性汚染を撒く。近すぎる距離で撃てば破断は砲そのものまで巻き込む。
