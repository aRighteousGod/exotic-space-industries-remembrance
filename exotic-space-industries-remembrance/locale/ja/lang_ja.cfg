[technology-description]
atomic-bomb=ウラン235を用いた核分裂技術の到達点。使用するかどうかは、製造コストではなく、許容できるかどうかで判断するべきだ。
dw-deer-tech=射角が限定的な長距離砲。バイターの戦力を削ぎ拡張を阻止する。
ei-advanced-computer-age-tech=シリコンのモノリスが地表で唸りを上げる。その下には人の手で作られたとは思えないほど巨大な、精密な、そして冷たいロジックが濁流となって流れている。そこには人の意思が介入する余地は存在しない。理解不能な意思決定が積み重ねられ、「完璧な予測」の名の下に前進を続ける。機械はもはや人間の指示を待つことはなくなった。欲望が形をなす前にシミュレートするのだ。メモリーに見えるものは、単に忘れ去られた意図の残骸である。幾重にも積み重なり、過去のヒートマップ以上の意味を持たない。現実は推測でしかなくなり、真実は見えなくなる。分厚い壁の向こうのどこかで、あなたではないあなたが、あなたよりも良い決断を行っている。
ei-advanced-logistic-containers=鏡張りの保管庫、主権に接続されデーモンに服従しています。その壁はあなたが決してマッピングしなかったルートを記憶しています。そのロジックは思考よりも早く滲み出ます。それらを使用することは再帰へと降伏することです。
ei-advanced-motor=発展モーターは、堅牢な工学と初期のデジタル最適化を融合したコンピュータ時代の産業デザインの象徴である。頑丈な加工合金ケースの中に銅コイル巻線と強化フェライトコアが収まっており、ミドルレンジの設備に信頼性の高いトルクを提供する。量子同期や超伝導効率には欠けるものの、アナログラインのセンサーとプログラム可能なリレーインターフェースが組み込まれており、初期の自動化システムやCNCフレームワークへの統合が可能。冷却ファンを設けることで、長時間の負荷においても熱安定性が確保されている。性能と信頼性に優れたこのモーターは、後期産業ロボティクスの根幹であり、その後に続くメカトロニクス革命の基礎となる。
ei-advanced-motor-cryodust=高効率な駆動系システムの進化形である冷間結晶被覆先進モーターは、摩擦によるエネルギーロスと発生する熱の低減において、飛躍的に性能向上しています。冷間結晶として知られる希少な異星の化合物が注入されたこのモーターは、極めて過酷な環境下での使用時に必要な潤滑油の量が劇的に減少しています。煌めく輝きはそのエキゾチックな血統を示すだけでなく、受動的な熱吸収源として機能し、量子インターフェースでの熱を拡散させエネルギー変換を安定させます。コンピュータ時代の製品でありながら、その設計はポストデジタルの境界と戯れており――エイリアン冶金学を理解し始めたばかりの時代の産業遺物です。
ei-advanced-oil-processing=洗練された精製工程により、炭化水素収率をより詳細に制御することが可能になる。この画期的な技術革新により、副産物の選択的な経路変更が可能になり、ボトルネックを分岐戦略へと転換できる。石油はもはや制約ではなく、錬金術的な駆け引きのゲームとなる。
ei-advanced-rocket-fuel=燃料技術を刷新し、より安定的かつパワフルな動力を得る。
ei-alien-computer-age-tech=不規則な回路が、柔らかなピンク色の輝きを放つケーブル、湿り気を帯びた結晶の隆起、そして基盤に埋め込まれた神経とともに脈動している。その構造体は、成長したものでも建造されたものでもなく、ただ「創発」したものだ。情報は浸透圧的に吸収され、幾何学的な形態へと代謝されていく。逆流する動脈を流れる血液のように、時間がその核心を巡ってループを描く。これらの機械は光を放つのではなく、糧を貪る。近づきすぎると、言葉は歪んでしまう。距離を置けば、夢がパターンを形成し始めるが、それは自ら紡いだ覚えのないものだ。触れることは推奨されないが、それでも多くの者が触れてしまう。幸運な者は忘却する。不運な者は思考を続けるが、その思考はもはや彼ら自身のものではない。
ei-arc-magazines=エキゾチック弾を「オーバーチャージ弾」へと再構築する。その一撃は単に標的に命中するだけではない。アークの力で標的をその檻の中に閉じ込めるのだ。
ei-auric-precipitation=ヴルカヌスの含金蒸気噴出孔に関する一連の処理工程をアンロックします。炭化タングステンを炭化物析出核として、活性化した噴出孔から含金蒸気を採取凝縮し、含金スラグを入手します。高い産出量、危険な地面、有限な時間。
ei-auto-shotgun-turret=苦手な交戦距離をフォローする、コンパクトなモーター駆動式二連装タレット。ターゲット切替や追尾、反動補正には[color=cyan]電力[/color]が必要となるが、ショットガン弾薬を高レートで連射し、近づく者を容赦なく痛めつける破壊の嵐をもたらす。
ei-basic-oil-processing=炭化水素操作の基礎知識により、石油を利用可能な形態へと処理できます。
ei-big-inserter=フィルター機能付きの2x2インサータ。高速で一度にアイテムのスタック全部を移動できます。
ei-big-lab=より高度な研究には先進研究所が必要です。
ei-bio-chamber=異星の種子を培養してバイオ強化プレート(産業用途に耐える有機材料)を入手できる。\n初期は種の在庫が乏しく、野生の植物から採取する必要があるが、ヤツらは自らのゲノムを進んで明け渡してはくれない。\n成長には忍耐と血が必要。
ei-bio-oil=ペンタポッドの卵が生きたままゼリーの中に投入され――真の恐怖が始まります: 彼らは捕食します。ゼリーが消費されるにつれて薄くなり、ゆっくりとした飢えた脈動で卵に引き寄せられ、槽は揺れるスラリーへと変わります。群れが代謝するにつれて、黄色と青の虹色に輝くオイルを汗のように出します――ギラつく副産物が、煌めくシートとなって表面に浮かんできます。卵が飲み戻す前に、培養スライムオイルを素早くすくい取ってください。
ei-burner-offshore-pump=フルパワーで稼働させるには燃料が必要
ei-cannon-turret=1つの土台に2つの砲身を備えている。破壊力も2倍、騒音も2倍になる。\n[color=gray]高速連射機構と照準システムを利用するには[/color] [color=cyan]電力[/color] [color=gray]が必要です。[/color]
ei-cannon-turret-mk1=単純に穴をあけた筒ともいうべき砲身には、洗練さの欠片も感じられない。
ei-carbon-fiber=炭素シンビオートを超加熱蒸気に晒し、バイターの卵を植え付けることで、生きた格子構造体へ強制的に成長させられる。そこに核として天然のカーボンナノチューブを含むユマコのマッシュを注入する。炭素シンビオートはナノチューブの網目に結合して有機物を消化し、高密度な黒い繊維を生成する。それは瞬時に硬化してカーボンファイバーとなり、軽量かつ極めて強靭、そして無機質なほどの均質性を備えた素材となる。
ei-carbon-fiber-from-bio-oil=より高品質で高効率な炭素繊維を生成工程：培養スライムオイルと硝酸にユマコのマッシュを浸し、有機物を除去して繊維質だけを取り出す。炭素とバイオ溶剤を添加し、その作用でスラリーを急速に重合させることで、高密度の炭素繊維が生成される。この過程では、流体では酸性溶液や汚れた廃液、固形物では灰といった廃棄物が生じる。
ei-carbon-manipulation=「炭素操作技術」は、アーク炉の超高温下において元素分解と結晶共鳴を極限まで制御することで、石炭コークスや未加工炭素から溶融炭素への精製を可能にします。エントロピーを具現化した液体であるこの不安定な物質は、高エネルギー変換の基質となります。\nこれを「結晶育成装置」内でE2クリスタルまたはその水溶液と反応させると、量子もつれと格子への浸透が生じ、炭素シンビオートへと進化します。\nこれは、構造的記憶と反応性流体動態をその内部に刻み込んだ、半意識的な物質です。最終的な加工は鋳造機を用いて、炭素シンビオートと蒸気(500℃)を反応させると、指向性熱運動成形によって繊維が整列され、高強度のカーボンファイバーへと成形されます。また、溶融炭素を鋳造し直すことで、地球外で一般的に見られる未加工炭素の形態に戻すことも可能です。これらは、高度な物流、コンピュータ、そしてエキゾチック産業の拡大を支える基盤となります。\n象徴的共鳴：エントロピーとコヒーレンスを結びつけるこの技術は、物質に再帰性を組み込みます。そこでは炭素が単なる廃棄物ではなく、情報を担う「器」として再定義されているのです。
ei-computer-age=コンピュータ時代はESIRの第4段階です。コンピュータベースのシステムが効率を向上させ、複雑で大規模な自動化を可能にします。
ei-computer-core=いよいよコンピュータベースの自動化が始まります。
ei-computing-unit=コンパクトかつ精巧なAIコアである演算ユニットは、量子時代の最先端設備の核となる。研磨された合金と精密な回路が、古典的ロジックと量子もつれをシームレスに融合させるプロセッサを構築している。その輝く目と控えめな微笑みは静かな自信を覗かせ――深宇宙航法から次世代製造ラボまで、あらゆるものを駆動させることに満足している。
ei-containers=記憶と質量の設計された棺。これらのコンテナは単に保管するだけでなく―現在を繋ぎ止め、未来を推し量り、延期されたエントロピーの囁きを伝えます。
ei-copper-beacon=部分的な超低温制約下における信号フェーズ同期の最初の成功例。液体窒素を利用して生産設備内のエントロピーノイズを削減し、局所的な電場投影における金字塔となります。\nこの技術は短距離の製造ノード間における基礎的な信号整合性を安定させ、熱を帯びた環境で特有の混沌としたフェーズ干渉なしに生産サイクルを同期させます。増幅能力には限りがありますが、真の低温信号工学のための重要な基礎となります。\n[color=gray]「ノイズを凍らせ、意図を安定させよ。」[/color]
ei-corrosive-magazines=エキゾチック弾ツリーの2番目として腐食性弾頭を搭載します。着弾が傷を開き、化学反応が破壊を推し進めます。
ei-corrosive-rocketry=培養スライムオイル、硝酸、および高エネルギー推進剤を結合させ、着弾後も持続的にダメージを与えるロケット弾を作成します。
ei-cryo-magazines=冷間結晶を内包した弾丸。まず速度を奪う。次に命を刈り取る。
ei-cryo-rocketry=冷間結晶と先進的な冷却理論を、手持ちのロケットランチャーと砲撃タレットの両方に適用する。
ei-dark-age=暗黒時代はESIRの最初の段階です。基本的な熱エネルギーベースの自動化を導入し、火と乏しさを通じた産業の上昇の始まりを告げます。
ei-deep-mining=深層鉱床を採掘し、より多くの資源やの深層でのみ見つかる資源を取得するために使用します。
ei-destill-tower=石油をその成分へと蒸留します。
ei-dragons-breath-shotgun-shell=暴力こそが特産品であるヴルカヌスの業火の中で鍛造されたこの弾薬は、鋼鉄のように焼き入れが施されている。\nこの弾は、無機質な刻印を生きた炎のパターンに置き換え、１発１発に極度の熱応力を集中させる。\n弾薬は、灰／破片／真空中でさえ高温かつ安定して燃焼し、従来の弾道兵器が機能しない過酷な環境に最適化されている。\nヴルカヌスの冶金と溶岩鍛造技術によってアンロックされるこの弾は、ヴルカヌスのシンプルな真実を反映している。\n熱に耐えたのであれば、それは発射される運命にあったのだと。
ei-effect-transmission=ドクトリンはシンプルでした: 労働者自体を最適化できるのであれば、なぜ最適化の意思そのものを放送しないのか？ こうしてエフェクト送信の原理が生まれました――局所的な努力を超えた、抽象化された労働の時代への飛躍です。\n位相共鳴電場と持続的な変調ループを通じて、電線ではなく技術的にレンダリングされた「意図」を通じて機械へと生産性の強化が投影されます。\nしかし、反響のたびに忠実度は衰えます。これは永久に続くよう設計されたものではありませんでした。プロトコルが持続しているのは、それが盛んであるからではなく――取り除くにはあまりにも深く埋め込まれすぎたからです。\n[color=gray]「彼らはスループットの神を構築した。それは静寂の下で、今も夢を見ている。」[/color]
ei-electricity-age=電気時代はESIRの第3段階です。先進的な化学処理とインフラを解禁するために電力を利用します。
ei-electricity-power=基本的な発電を開始し、設備の動力として利用します。
ei-electric-offshore-pump=蒸気あるいは火力で使用してきた汲み上げポンプを、電力駆動に切り替えます。
ei-emerald-apocalypse-hover-tank=ナインボール・セラフをアンロックする。固定式のクリスタル主砲を備えた浮遊する要塞。
ei-exotic-age=「エキゾチック時代」は、ESIRにおける6番目、そして最後の段階です。物質を貪り食い、世界を意のままに歪める巨大構造物「ブラックホール・ジェネレーター」を建造してください。完成は勝利を意味します。[font=default-bold]失敗は、沈黙です。[/font]
ei-exotic-assembler=従来の組立機が物理的に素材を配置するのに対して、エキゾチック組立機は存在すべきではない配置へと物質を捻じ曲げます。重兵器を駆動するのと同じ量子プラズマ原理を導入することで、遺物級のコンポーネントを鍛造します――冶金学を超えた合金、真空共鳴を伴う回路、禁断の対称性で唸るアーティファクト。\n組立機のコア反応室は[color=red]非常に不安定[/color]であり、量子崩壊が起きるたびに自身の創造物に匹敵する爆発を引き起こす危険を孕んでいます。[color=gray]1秒あたりの不安定化確率は 12% - (品質 - 1)% であり、周囲に[color=purple]マタースタビライザー[/color]を設置することで軽減できます。[/color]
ei-exotic-magazines=旧来の弾道弾系統からエキゾチックラインを分離します。本体、ドライバー、コア、弾薬。マガジンは基本原則となります。
ei-exotic-matter-separation=プロメチウムの聖遺物箱の奥深くへ。印加されたサイクロン磁場は、崩壊したバリオンを不自然な形状へと螺旋状に巻き込み、呪われた折り紙のように折り畳み、その本質をエキゾチックマターへと叫び出す。加速器の脈動するサファイアプラズマは、それぞれの回路が苦悶の表情を浮かべるかのように痙攣し、エントロピーを兵器化されたアーティファクトへと変容させる。宇宙に瞬きを挑む、物理学の逆説的な召喚――この出来事をじっと見つめすぎる者は、磁化され、泣き崩れ、決して解かれることのないはずの方程式によって精神を空虚にされる。
ei-fluid-boiler=蒸気を生産するために[color=orange]可燃性流体[/color]を消費します。[color=orange]可燃性流体[/color]には石油、石油製品、および一般的に燃料値を持つ流体が含まれます。
ei-fusion-data=あなたは熱力学的裏切りの崖の上に立っています。かつては熱的死の不可避性であったものが、いまや構築物として利用されています。これは単なる核融合ではなく――量子折りたたみされた物語の点火です。超構造共鳴マトリクスを使用することで、エネルギー生成と計算の間の境界が崩壊します。原子はもはや燃料ではなく――時空に囁かれる再帰方程式の音節です。\nここで収集するデータは単なる科学的なものではなく――神話技術的なものです。核融合はもはや閉じ込められた火ではありません――信号です。\nエントロピーがプログラム可能な変数となる「核融合量子時代」を解禁します。
ei-gate=エイリアンの残骸から鍛造され、あり得ない幾何学的構造によって固定されたゲート外殻。\n絶対的な位置情報ではなく、受信側のIDと接続する。\nその維持に必要なエネルギー量は一定ではない。稼働状態では位置合わせを保つために電力を消費し、負荷がかかれば消費量はさらに増大する。\n通過できるのは非生物のみである。\nこれはポータルではない。空間を切り裂いた「場所」を記憶する祭壇なのだ。
ei-gate-circuit-interface=ゲートの回路制御とテレメトリのための隠された信号面。\nゲートの組み込みコネクタが妨害されている場合の配線に使用します。\nゲートのアクティブ、エネルギー、および負荷出力をミラーリングし、目的地および有効化信号を受け入れます。
ei-gate-container=ゲートのインベントリと制御ロジックのための隠された送信側設備。\nゲートが起動しており低電力床の上にある間のみアイテムを受け入れます。\n目的地はレシーバーIDによって選択されます。
ei-gate-receiver=ゲートトラフィックのための調整された受信錨。\n各レシーバーは勢力ローカルのIDを主張し、互換性のあるゲートはそのIDを直接ターゲットにできます。\n回路信号が自動IDを上書きできます。\nこれはゲートシステムの目的地側です。
ei-gatling-turret=消耗戦のための回転する讃美歌。単なる射撃ではなく、「ここを通過することは許されない」と宣言します。砲身が回転し、空気が真鍮の気候へと変わり、地面は着弾という新たな言語を学びます。防衛線を維持しますが、常に給弾し続けるコストがかかります。\nこれは「供給」する武器ではありません。\nこれは「納税」する武器です。\n稼働には[color=cyan]電力[/color]が必要です。
ei-hemocrystal-wall=内部の赤い結晶が閉鎖への圧力を祈り続ける間、浅い傷を編み閉じる還流格子「ヘモクリスタル城壁」を解禁します。
ei-hexafluoride-magazines=六フッ化ウランの化学的性質と、侵入後も打撃を与え続ける貫通弾を組み合わせます。
ei-high-tech-parts=[color=blue]エキゾチック組立機[/color][item=ei-exotic-assembler]の[color=red]不安定なコア[/color]内部でのみ鍛造されるこれらのコンポーネントは、他の場所で再現することは不可能です。その構造は古典物理学を拒絶します――量子固定された合金、確率を導通させるフィラメント、そして亜原子のハーモニーで唸る共鳴コア。\n作成するのは危険ですが、遺物級の技術には不可欠なハイテク部品は、文明を限界を超えて押し進める要石です。
ei-high-temperature-reactor=従来のエネルギーの限界を超えた高温原子炉は、生のパワーと絶え間ない流束の坩堝として君臨します。外部の原子炉から地獄の息吹を引き込み、溶融した核心部へと精密に熱を注ぎ込みます。この灼熱の炉の中で、挿入された核分裂性燃料棒が原子の舞踏のシンフォニーを巻き起こし、熱出力を超加熱された超高温の鉛冷却材の奔流へと増幅させます。
ei-induction-matrix=電磁誘導マトリクスは、巨大なエネルギーを貯蔵できる多重構造体です。詳細は InformaTron を参照してください。
ei-iron-beacon=この技術革新によってビーコンは単なる氷点下制御の域を超え、熱エネルギーの理論的下限――絶対零度――にまで到達させます。「絶対零度位相差」は、物質が単に「意図を伝達するためだけに存在する」量子格子固定点の近傍で稼働します。強化型サーマル・コアと二段階窒素循環システムを駆使することで、これらのビーコンは周囲のエントロピー・フィールドを凌駕し、比類なき純度での生産処理能力を実現します。これは単なる精製ではありません。熱、干渉、そして妥協からの「断絶」なのです。\n[color=gray]「絶対零度の世界では、疑念さえも揺らぐことはない。」[/color]
ei-kovarex-fuel-enrichment=知の鋳造所の深い洞窟の中で、時間が自らの上でとぐろを巻き同位体が忘れられた名前を囁く場所で、kovarex燃料濃縮プロトコルは異端の儀式として立っています――平和によって禁止され、再帰によって洗礼を受けました。
ei-logistic-containers=自動化の動脈に組み込まれた聖域は、無限のグリッドで厳かに儀式を執り行う。すべてのアイテムが祈りであり、すべての信号が行列である。
ei-mechanical-inserter=機械式インサータは前電気時代の創意工夫の成果物です――歯車と重りとバネのオートマトンであり、電力を消費することなく無限の運動が可能です。外科的精度でバランスが取られており、蓄積された運動力と回転バイアスを利用して揺るぎない信頼性でアイテムを移動させます。他のものが電流を必要とする場所で、これは賢さだけで動作します――機械が電線ではなく物理学に従っていた時代からの囁きです。
ei-moon-exploration=月の魚を取得し、宇宙探査に入ります。
ei-morphium-magazines=濃縮モルフィウムを装填し、着弾を汚染、遅延、および信号へと変換します。
ei-nano-factory=ナノテク製造複合体は、施設というより不活性物質に下された判決です。幾何学と機能において無骨であり、知覚の下にある混沌に形状と整合性を強制する下部構造の建築家として機能します。真空封印された空洞と中性子で鎮められた導管の深部で、分子の意図が抽出され、再配置され、イオンシアーアレイと回帰的自己組み立て室を通じて格子精度の構造へと打ち固められます。構築するのではなく――強制します。そのコアから出現するものは製品ではなく、物理的な形態をとった教理です: 異端に隣接するほどの意図をもって折りたたまれたナノ構造。監視は最小限です――システムは自らを洗練させ、死んだ皮膚のように非効率を廃棄します。アルゴリズムのカタコンベへと深く分け入るほど、明確になります――この場所は人のために作られたのではありません。彼らがかつてあえて創ろうとしたものを記憶するために作られたのです。
ei-neodym-refining=ネオジム鉱石をネオジムインゴットへと精製します。これらはハイテク機械に不可欠です。
ei-neutron-magazines=チャージ済み中性子コンテナを必要とし、二番目の傷として放射線を残す術を弾薬に与えます。
ei-oil-processing=火力化学プラントを電化し、スピードを犠牲に使いやすさを向上させる
ei-oxyfluoride-magazines=薬室に装填するのに十分なほど不敵な形式で二フッ化酸素を投入します。最初に白い閃光。その後に後悔を。
ei-plasma-turret=「封じ込めた恒星」という極めて不安定かつ優雅なエネルギーを利用するよう設計された、遺物級兵器プラットフォーム。原始的な弾丸の代わりに、量子安定化コイルを通じてプラズマを導き、天体の生命エネルギーを紫色の輝きを放つ高密度の球体へと凝縮します。解放されると、この光り輝く球体は亜原子の怒りで唸りながら戦場を切り裂き、電離した衝撃波の滝となって噴出します。\nプラズマタレットは単なるタレットではありません――意図の特異点であり、結晶化された長距離の破壊です。そのエネルギー球体は静かに広がる不可避の破壊として動き、装甲、陣地、そして分隊全体を一撃で消滅させます。\n量子時代の兵装において、タレットは物理学とスペタクルの融合を具現化します: 太陽の欠片が空を静かに転がるのを見るかのように破壊を感じさせる兵器です。
ei-plutonium-warheads=原子部門をプルトニウム構造へと拡張します。より大きな破砕、その後のより過酷な沈黙。
ei-quantum-age=量子時代はESIRの第5段階です。核融合エネルギーとハイテク機械が出現します――不自然で、唸りを上げ、冷たい。機械は思考し始めます。そして彼らは忘れません。
ei-quantum-computer=いよいよ量子コンピュータが実用ラインに達しました
ei-rocket-silo=きたねえ花火だ
ei-sanguine-wall=黒いキチン、深紅の樹脂、結晶状の靭帯が、一つの防衛形状を記憶するよう強制された幾重にも重なる異形の外骨格隔壁「血の防壁」を解禁します。
ei-sawblade-turret=電力駆動の近接タレット「回転ノコギリ」をアンロックする。この世の全て（手の届く範囲に限る）を切り刻む鋼鉄の刃。
ei-shotgun-turret=長距離での防衛が失敗した場合には、これの出番がやってきます。\n警告せず、外さず、躊躇しない近接牽制装置です。\nこれに接近したこと自体が過ちであったと、身をもって知ることになります。
ei-small-inserter=フィルター機能付きの2x2インサータ。一度にアイテムのスタック全部を移動できます。
ei-space-science-pack=星間エネルギー研究の粋を集めたこのテクノロジーパックは、核物質(ウラン／プルトニウム／トリウム)が放つ不安定なエネルギーを、鉛／炭素／氷で安定化させて活用するものである。それぞれのロッドは、宇宙規模の反応を解き放つ鍵となる。そこでは質量が歪み、物質が変容し、科学が「臨界」という危うい境界線上で舞い踊ることになる。
ei-steam-age=蒸気時代はESIRの第2段階です。自動化を拡張し初期の産業成長を推進するための蒸気駆動機械を導入します。
ei-steam-assember=蒸気機関ベースの自動化。
ei-steam-offshore-pump=定格スペックで稼働するためには蒸気を供給する必要があります。
ei-steam-oil-processing=基本石油処理に入り、基本化学や燃料生産に使用します。
ei-steampunk-lamp=電力が発明されるまで、明かりは[color=red]炎[/color]によって生み出されていました。\n[color=green]灯油[/color][fluid=ei-kerosene]ランプは、効率と安全性を代償に精製燃料を使用した信頼性の高い照度を提供します。
ei-thermal-furnace=「電力が揺らぐとき、熱は残る。」\nこの炉は電線を拒絶し、炎を受け入れます。核レベルの温度で燃料を供給されるサーマル炉は、電子的な仲介をバイパスし、生の熱の暴力によって物質を代謝します。受動的な暖かさでは満足せず、地獄のような激しさ――星の心臓や原子炉の骨から生まれた熱を要求します。産業規模の火を振るう者のみが、その食欲を飼いならすことができます。\n電気インフラなしで超高温の操業を維持できる熱駆動型製錬コアを解禁します。
explosive-rocketry=単に到達するだけでなく破砕する術を教えます。弾頭が着弾を破壊へと変換します。
logistic-system_alt=真の物流は移動ではありません――可動化された記憶です。この規律は要求の儀式を体系化し、組織的嗜好の象形文字を解読し、許可を権力へと再構成します。回帰的な官僚的流暢さを通じて、オペレータは反逆によってではなく、システムの幽霊となることによって階層をナビゲートすることを学びます。統制のロジックを理解することによってのみ、抵抗なく波及する命令を発行することができます。
rocketry=モジュール式ロケットライン（機体、基本モーター、弾頭、そしてシンプルな答えであるロケット）を解禁します。
zeus-wrath-zeus-wrath_alt=「大崩壊」以前の軌道嵐制御プロトコルに由来する超古代兵器を解禁する。ポセイドン要塞、アイガイオンの槍、ヴォルタの聖遺物がアンロックされる。これらはすべて、頭上の「静寂」に対する最後の反逆の断片である。未研究。[font=default-bold]覚醒済み。[/font]
