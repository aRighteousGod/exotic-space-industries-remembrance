[item-description]
atomic-bomb=プルトニウム原子ロケット。外側は互換用の殻、内側は完全破口の教義。破口が最初の一文で、残留放射がその続きを書く。
ei-atomic-bomb-u235=U-235 原子ロケット。核心はより締まり、残留放射もより狭く正確だが、慈悲はない。
ei-atomic-bomb-plutonium=プルトニウム原子ロケット。より広く、より汚い残留放射を引きずる。
dw-deer-ammo-atomic-u235=U-235 原子砲兵ロケット。より締まった原子核を砲架向けに組み、残留放射もクレーターの近くに留まる。
dw-deer-ammo-atomic-plutonium=プルトニウム原子砲兵ロケット。至近で聞く覚悟のある砲座に向けた全面破口の言語で、より広い残留放射を置いていく。
ei-nuclear-locomotive=X1「ゴリアテ」原子力機関車。走る小型炉であり、戦争犯罪めいた礼儀作法を持つ。船体が開けば、緑の臨界閃光は告知にすぎず、残留放射が続きを書く。
ei-exotic-magazine-body=教義の前段にある外殻。鋼材、セラミック、そして高価な暴力を運ぶだけのぎりぎりの規律。
ei-exotic-magazine-driver=異装系列の点火、パルス同期、解放制御。弾倉に正しい死に方を教える部位。
ei-exotic-magazine-core=異装系列の共通心臓部。外殻、ドライバ、爆発規律が一つの薬室に封じられている。
ei-magazine-payload-compound=結晶化エネルギーと爆薬を調律した混成回答。一発で、裁定は複数下る。
ei-magazine-payload-corrosive=硝酸の傷をペイロードに封じたもの。弾は止まっても、議論は広がり続ける。
ei-magazine-payload-cryo=規律の下に拘束されたクライオダスト。痛みの本体は運動と確信を奪うことにある。
ei-magazine-payload-oxyfluoride=白熱する自己着火化学の封入体。明るすぎる。不安定すぎる。それこそが目的。
ei-magazine-payload-morphium=濃縮モルフィウムを弾道ペイロードへと説得したもの。毒ではなく汚染として侵入する。
ei-magazine-payload-hexafluoride=まず穿ち、その後で破滅と交渉するためのフッ素化薬室。
ei-magazine-payload-arc=ペイロードへ折りたたまれた過充電。短く、苛烈で、見間違えようがない。
ei-magazine-payload-neutron=帯電中性子コンテナを教義へ圧縮したもの。仕上げのために見えない何かを後に残す。
ei-compound-ammo=異装系列最初の異端。破砕、放電、不安定化を一つの高価な弾倉に詰め込んだ。
ei-corrosive-ammo=酸を積んだ異装弾倉。初撃は導入にすぎず、判決は腐食が下す。
ei-cryo-ammo=低温制圧弾。まだ距離を詰められる相手に生存は大した意味を持たない。
ei-oxyfluoride-ammo=白く燃える弾倉。あらゆる着弾を化学的な許可へ変える。
ei-morphium-ammo=緩慢な汚染弾。肉体を傷つけ、残りの計算は恐怖にやらせる。
ei-hexafluoride-ammo=フッ素化貫通弾。侵入はきれいでも、その後の説明は難しい。
ei-arc-ammo=過充電弾倉。ただ打つのではない。標的を痙攣に縫い止める。
ei-neutron-ammo=この系列で最も高価な病。衝撃は過ぎ、後に光輪だけが残る。
ei-orbital-combinator=同じ表面にいる宇宙プラットフォームの物流を、Requests / On The Way / Need の3つの読み取り専用モードで写し取ります。\n直交に隣接するスキャナーは1つの共有バンクを形成し、大きなプラットフォーム出力を継続セクションへ分割し、バンクが足りなくなると [virtual-signal=ei-orbital-overflow] を出力します。\n配線、鮮度、使い方は Informatron の New logistics を参照してください。
ei-platform-transponder=各プラットフォームに、勢力ローカルで安定した数値 ID を与えます。セレクター、コーディネーター、アップリンクは名前ではなくこの ID で対象を決めます。\nプラットフォーム上に設置してください。手動上書きは可能ですが、ID が衝突すると解決するまで無効として扱われます。\nトランスポンダーを直接開くと、手動のプラットフォーム ID 上書きを設定または解除できます。
ei-orbital-selector=1つのプラットフォームに焦点を当て、その Need マニフェストを再公開します。\n手動モードは指定 ID に固定し、回路モードは [virtual-signal=ei-platform-id] を読み、ポリシーモードは同じ表面の需要から自動で候補を選びます。\nセレクターを直接開いてモードと対象を設定してください。新しいセレクターは設定されるまで待機したままです。
ei-orbital-coordinator=軌道物流コホートの表面司令核です。\n勢力ごと・表面ごとに有効なのは1台だけです。セレクターの仕事を仲裁し、ディスパッチのリースを配り、複数レーンが同じプラットフォームへ無秩序に殺到するのを防ぎます。\nコーディネーターを直接開くと、アクティブか待機中かを確認し、コホート更新を要求できます。
ei-orbital-dispatch-uplink=ロケットサイロを軌道物流コホートへ接続します。\n1台につき1つの混載マニフェスト仕事を保持し、ハイブリッド積み込み用の対象マニフェストを再公開し、Sticky / Single Shot / Threshold で大口需要の扱いを決めます。\n有効なサイロ接続、アクティブなコーディネーター、正の Need を持つセレクター仕事が揃うまで、アップリンクはブロック状態のままです。\nアップリンクを直接開いてサイロ接続を確認・変更・解除できます。

ei-carbide-precipitation-core=含金析出を安定させるために使うタングステン炭化物由来の種核。意図的に使い捨てであり、蒸気が噴気孔を起こし、核が絞りを支え、精製機が蒸気の吐き出したものを回収する。
ei-calcite-bed=高温の鉱物流が新しい石質の接触面を必要とする工程で使う、消耗前提の方解石充填床。反応面を広げ、化学を安定させ、使い潰したら交換する前提で作られている。
ei-auric-slag=含金蒸気から析出した金含有スラグ。まだ熱と鉱物粒、微量金属を抱えており、酸洗浄と水で埋もれた金を分離させる。
ei-precipitation-core=含金凝縮を安定させるために使うタングステン炭化物由来の種核。意図的に使い捨てであり、蒸気が噴気孔を起こし、核が絞りを支え、炉が蒸気の吐き出したものを留める。
ei-breach-residue=ゲートの繰り返しの使用によって残された次元汚染のかさぶた。\nこれは破損の痕跡であり、有用な原料ではないため、広がる前に中和する必要があります。
ei-gatling-turret=消耗への回転賛歌。 「ここには何も横切らない」と宣言するほど発射はしません。樽が回転し、空気は真鍮の天気に変わり、地面は衝撃で作られた新しい言語を学びます。常に食料を供給するという代償を払って、戦線を維持します。\nこれはあなたが「供給」する武器ではありません。\nこれは十分の一を納める武器です。\n機能するには[color=cyan]電力[/color]が必要です。
ei-auto-shotgun-turret=醜い距離を走るために作られたコンパクトなモーター駆動の二連砲塔。ショットガンの砲弾を高いリズムで噛み砕き、通路を浸水させ、散弾パターンでチョークポイントを浸水させ、ラッシュをスクラップに変えます。素早いターゲットの切り替え、積極的な追跡、そして激しい反動補正を機能させるには[color=cyan]電気[/color]が必要ですが、その結果は、あえて近づく者を罰する容赦ない破壊の雹嵐となります。
ei-steampunk-lamp=[color=green]灯油[/color][fluid=ei-kerosene]を動力とする単純な燃焼灯。\n電気を使わずに[color=orange]暖かい[/color]のちらつき照明を提供しますが、継続的な燃料消費は発生します。
ei-dragons-breath-shotgun-shell=ヴルカヌスの熱で鍛造され、そこでは弾薬が鋼のように焼き戻され、暴力が産業プロセスとなっています。\nこれらの砲弾は、不活性なマーキングを生きた炎のパターンに置き換え、極度の熱応力を発射のたびに伝えます。\nペイロードは、灰、破片、真空にさらされても一貫性を保つのに十分な高温で燃焼します。これは、従来の弾道が機能しない過酷な環境向けに最適化されています。\nヴァルカヌスを通してロックが解除されます。冶金技術と溶岩鍛造技術、この弾薬は地球の単純な真実を反映しています:\nそれが熱に耐えれば、それは発射されるはずです。
ei-shotgun-turret=距離が足りない場合、これが解決策です。\n警告せず、見逃さず、ためらうこともない近距離抑止力です。\nそこに到達したものはすでに間違いを犯しています。
ei-tough-wall=スチール製の梁で支えられたセラミックとコンクリートのハイブリッド。重く、鈍く、無慈悲な - それは純粋な密度だけで耐えます。
ei-plated-wall=合成ポリマーを層状にした鉛結合鉄筋コンクリート。前任者よりも丈夫で密度が高く、脆さが少ない — エントロピーそのものに対抗して設計された正真正銘の城壁です。
ei-cannon-turret-mk1=シンプルなドリルバレルで、洗練されたものは取り除かれた生の火力。
ei-cannon-turret=バレルが 2 つ、シャーシが 1 つ。スループットが 2 倍、ノイズが 2 倍になります。\n[color=gray]連射メカニズムと高度なターゲット ソリューションが機能するには、[/color] [color=cyan]電力[/color] [color=gray]が必要です。[/color]
ei-acidthrower-turret=敵を骨まで溶かすことができるのに、貴重な油を火で無駄にする必要はありません。火炎放射器のグロテスクないとこであるこの装置は、ノズルから悲鳴を上げるまで[color=green]酸[/color]を加圧します。その結果、非常に腐食性の高い霧が発生し、燃えることはなく、消えてしまいます。構造物は腐食し、甲羅は溶解します。残ったものは、シャベルを食い荒らされる前に、すぐにかき集めるのが最善です。
ei-camp-fire=かろうじて灯台、むしろ死ぬことを拒否する頑固なろうそくです。このキャンプファイヤーの仕掛けは、明るさではなく、まったくの大胆さによって光を提供します。与えたものは何でも燃やし、その後は礼儀正しくさらに要求します。
ei-warp-beacon=[color=purple]ビーコンの過負荷の影響を受けません。[/color]\n[color=gray]機能するには 60[item=ei-bio-matter]/秒が必要です。[/color]
ei-alien-beacon=[color=purple]ビーコンの過負荷の影響を受けません。[/color]\n[color=gray]機能するには 30[item=ei-bio-matter]/秒が必要です。[/color]
ei-high-tech-parts=[color=blue]エキゾチック アセンブラー[/color]の[color=red]揮発性コア[/color]内でのみ鍛造されており、これらのコンポーネントは他の場所で複製することは不可能です。その構造は、量子固定合金、確率伝導フィラメント、亜原子調和でうなり声を発する共鳴コアなど、古典的な物理学を無視しています。\n作成するのは危険ですが、遺物レベルの技術には不可欠なハイテク部品は、文明を限界を超えさせる要石です。
ei-computing-unit=コンパクトでありながら洗練された AI コアであるコンピューティング ユニットは、量子時代の最も先進的な驚異の多くの中にある静かな精神です。磨かれた合金と精密回路には、古典的な論理と量子もつれをシームレスに調和させて処理できるプロセッサーが組み込まれています。その輝く目と控えめな笑顔は、深宇宙航行から次世代の製造ラボに至るまで、あらゆるものに電力を供給することに満足しているという、静かな自信を表しています。
ei-burner-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-steam-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-electric-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-space-science-pack=星間エネルギー研究の頂点 - このパックは、鉛、炭素、氷によって安定化された核分裂性ウラン、プルトニウム、トリウムの揮発性の輝きを利用しています。それぞれのロッドは、質量が曲がり、物質が変形し、科学が臨界のナイフエッジで踊る宇宙規模の反応を解き放つ鍵です。
ei-nuclear-fuel=ウラン 235 ベースの燃料電池。原子炉としては非効率ですが、車両としては優れています。
ei-depleted-uranium-fuel-cell=劣化ウラン 235 ベースの燃料電池
ei-beacon=かつては同期フィールド投影の頂点であったこのビーコン モデルは、現在ではそのレガシーの重みでよろめきつつあります。その放射格子は粗く、位相高調波は時代遅れですが、それでも耐え、もはや耳を傾けない世界に信号を脈動させ続けています。\nスループットが神であり、共鳴が力ずくで行われていた時代に構築され、現在は楽器というよりも人工物として機能しています。その中核は一貫性を維持するのに苦労し、崩壊する前に規制の基準をかろうじてすり抜けています。\nそれでも、重要です。それは*思い出します*。そして、過負荷の集計では、その負荷も同様に集計されます。\n[color=gray]「効率の幽霊は錆びた足場にも付きまといます。」[/color]\n過負荷に対するビーコンは [color=orange]1[/color] としてカウントされます。
ei-neuro-reactive-residue=見る人によって色が変わる粘性のある半透明のスライム。絶滅した化学的知性体の凝縮された分泌物であると考えられている。予測不可能なカオス エージェントをシミュレーション モデルに注入します。新たな複雑性と異種化学生命体に関するデータを生成します。
ei-sporeglass-heart=心拍のリズムに反応するスパイク状の結晶性の種子。絶滅した外来種の神経叢を模倣した休眠中の RNA パターンが含まれています。シミュレーションすると、ブラック ホールの特異点に崩壊する偽のエコシステムが作成されます。全体として統合するのに十分なデータが得られます。
ei-gravity-braided-ore=フラクタルの結び目へとねじれた鉱物クラスター。明らかに、時間が非線形に移動する微重力ポケット内で形成されました。それを測定しようとするツールを粉砕します。非ユークリッド密度フィールドをシミュレーションに注入します。重力レンズとトポロジカルフラックスに関連するデータが得られます。
ei-isotopic-ghost-shell=崩壊した核分裂物質の中空のカプセルは、依然として冷たいニュートリノを放出します。交互スキャンではその質量は負になります。逆エントロピーの試みが失敗した可能性があります。熱と死の閾値でシミュレートされた宇宙を不安定化します。シミュレーションでのデータ崩壊イベントを引き起こします。
ei-chrono-fossil-shard=タキオニック痕跡が染み込んだ、おそらく人工的に作られた骨構造の化石化した残骸。硬い真空の中で呼吸音を発します。異なるタイムフレーム間でシミュレーションを強制的にループさせます。過去の崩壊カスケードから高解像度データを抽出するのに最適です。
ei-worm-torn-relay-core=壊れて腐食した遺棄されたFTL通信ブイの塊。既知のシステムでは解析できないジッタリングの疑似コードが刻まれている。放射線を浴びると叫び声を上げているかのように不規則に脈動する。半安定のワームホール エコーが含まれています。シミュレーターを再帰エラー ループに放り込み、データ収集に役立ちます。
ei-mechanical-inserter=ゼンマイ神の恵みで動く。ワイヤーはありません。 \n単純な天才から生まれました。数学に疑問を持たなければ、永遠に回転します。
ei-mechanical-long-inserter=熱力学的否定の長い腕。それは魔法ではありません。バランスです。\nエントロピーを丁寧に無視して、距離を越えて移動します。
zeus-wrath-zeus-turret_alt=陸に固定されず、神にも誓っていないポセイドン・インスタレーションは、すべての海の下に忘れ去られた電荷を導きます。それは軌道からスカイファイアを呼び下ろす――判断は空気によってではなく、空気を通して下される。一度配置されると、それは保護するのではなく、世界に[font=default-bold]警告[/font]します。嵐が見ているのです。
zeus-wrath-zeus-gun_alt=溺れた神の怒り――縮小され、集中され、武器に変えられた。それは見逃せません。 [font=default-bold]罰するのは[/font]だけです。
zeus-wrath-lightning-ammo_alt=これが保持しているものを人間の手で運ぶべきではありません。聖遺物箱は充電されていません。[font=default-bold]含まれています[/font]。意図を持ってのみ発砲してください。嵐が見守っています。
ei-cargo-bot=産業の熱気の中で鍛えられた装甲運搬車。\nエンジンが荷物に食い込みながら、厳しい機械的確実性で前に進みます。\n優雅さのために作られたのではなく、終わりのない配達の苦労のためにのみ作られています。
ei-construction-bot=迅速な展開のために構築された高速建設ドローン。\n耐久性よりも加速を優先します。\n計画よりも早く構築されます。\n追いつくように努めてください。
ei-advanced-logistic-bot=速度、航続距離、ペイロードが最適化されたエリート物流ドローン。\n異常な精度で広大な距離を移動します。\nより多くの物を運ぶことができます。待ち時間が少なくなります。立ち止まることなく従う。\nあなたを含め、あらゆるものを上回るパフォーマンスを発揮するように設計されています。
ei-advanced-construction-bot=大規模かつ高速展開向けに設計された次世代建設用ドローン。\n航続距離の延長、ペイロードの増加、容赦ない実行\n設置が完了する前に青写真を確認します。\nビジョンを即座に構造に反映するように設計されています。

ei-excavator=[color=blue]水[/color][fluid=water]と[color=brown]4.2/秒の掘削液[/color][fluid=ei-drill-fluid]を消費して、[color=orange]石[/color][item=stone]、[color=brown]汚れを生成する水[/color][fluid=ei-dirty-water]、および惑星特有の副産物。
ei-metalworks-1=[color=orange]インゴット[/color]を生産性 + 10% で迅速に処理し、汚染とエネルギー消費を増加させます。 [color=blue]速度[/color]または[color=gray]品質[/color]モジュールを1つ受け入れることができます。
ei-metalworks-2=[color=orange]インゴット[/color]を生産性 + 20% で迅速に処理し、汚染とエネルギー消費を増加させます。 2 つの [color=blue]速度[/color] または [color=gray]品質[/color] モジュールを受け入れることができます。
ei-metalworks-3=[color=orange]インゴット[/color]を生産性 + 30% で迅速に処理し、汚染とエネルギー消費を増加させます。 3 つの [color=blue]スピード[/color] または [color=gray]品質[/color] モジュールを受け入れることができます。
ei-metalworks-4=[color=orange]インゴット[/color]を生産性 +40% で迅速に処理し、汚染とエネルギー消費を増加させます。 4 つの [color=blue]速度[/color] または [color=gray]品質[/color] モジュールを受け入れることができます。
ei-fluid-heater=燃焼により熱を発生します:
ei-fluid-boiler=燃焼により蒸気を生成:
ei-tank-1=より良い保管: 鉄比と液体タンク。体力 1000、物理耐性 30%、[color=red]炎[/color]] 60%、衝撃耐性 60%。
ei-tank-3=優れた保管: 鉄比と液体タンク。体力 1500、物理耐性 40%、[color=red]火炎 [/color] 70%、耐衝撃性 70%。
ei-tank-2=卓越した貯蔵: 鉄製タンクと液体タンク。耐久力 2000、物理耐性 60%、[color=red]火炎[/color] 80%、衝撃耐性 78%。
ei-insulated-pipe=断熱パイプは凍結しないように加熱する必要がなく、[color=pink]電解質[/color]、[color=green]フルオロケトン[/color]、[color=red]非常に熱い(過熱プラズマ相ガス、溶岩)[/color]または[color=blue]冷たい液体（液体ガス）[/color]、さもなければパイプを損傷する可能性があります。
ei-insulated-underground-pipe=断熱パイプは凍結しないように加熱する必要がなく、[color=pink]電解質[/color]、[color=green]フルオロケトン[/color]、[color=red]非常に熱い(過熱プラズマ相ガス、溶岩)[/color]または[color=blue]冷たい液体（液体ガス）[/color]、さもなければパイプを損傷する可能性があります。
ei-insulated-tank=断熱タンクは凍結しないように加熱する必要がなく、[color=pink]電解質[/color]、[color=green]フルオロケトン[/color]、[color=red]非常に熱い(過熱プラズマ相ガス、溶岩)[/color]または[color=blue]冷たい液体（液体ガス）[/color]。タンクを損傷する可能性があります。
ei-cooler=気体を液相に冷却するために使用されるハイパークーラー。液体ガスの輸送には、[color=blue]断熱パイプ[/color] [item=ei-insulated-pipe]を使用してください。
ei-data-pipe=[color=blue]シミュレーション基板[/color] [fluid=ei-computing-power] を輸送できる専用データケーブル。
ei-stone-quarry=この採石ドリルはどこからでも[color=orange]石[/color] [item=stone]を採掘できます。
ei-electric-stone-quarry=この採石ドリルはどこからでも[color=orange]石[/color] [item=stone]を採掘できます。
ei-deep-drill=このドリルは鉱脈にアクセスできます。動作するには[color=orange]4.2/秒のドリル液[/color][fluid=ei-drill-fluid]が必要です。
ei-advanced-drill=このドリルは鉱脈にアクセスできます。動作するには[color=orange]2/秒のドリル液[/color] [fluid=ei-drill-fluid]が必要です。
ei-deep-pumpjack=アップグレードされたポンプジャック。 [color=blue]クライオフラックス[/color][fluid=ei-cryoflux]と[color=green]フィトガス[/color][fluid=ei-phythogas]の堆積物、そして含金噴気孔にもアクセスできます。
ei-exotic-assembler=このアセンブラは、[color=orange]エキゾチックなアイテム[/color]を作成するために使用できます。ただし、エキゾチック物質は非常に不安定であるようであるため、爆発の可能性を減らすために[color=blue]物質安定剤[/color]の近くに配置する必要があります。 [color=gray]活動中、封じ込めフィールドは脈動し、パチパチ音を立て、リスクが高まるにつれてより激しく弧を描きます。 1秒あたりの変動率は12% - (品質 - 1)%で、周囲の物質安定剤によって軽減できます。[/color]
ei-computer-core=基礎的なロジックるつぼ - [color=blue]シミュレーション基板[/color] [fluid=ei-computing-power]を生成するには、[color=255,255,255]電気[/color]と慎重にパターン化された[item=electronic-circuit]コンポーネントが必要です。この流体はエネルギーではありません。有機的認知には不安定すぎる異常から抽出された、蒸留された記号圧力です。 [color=orange]データ ケーブル[/color] [item=ei-data-pipe]を接続して、結果として生じるフローを [entity=ei-small-simulator] 環境にルーティングします。\nしかし、コンピューター コアは計算するだけではなく、異種化学物質の残留物から時空間化石に至るまで、難解な異常を取り込みます。これらの反抗的な遺物が消費されると、コアは分析ではなく犠牲的な分解によってそれらを解読し、マイクロ反復で自身を断片化し、おおよその理解を目指します。\nそれぞれの異常は、再帰的な乱流、重力の歪み、またはシミュレートされた崩壊の兆候をデータ ストリームに注入することで、それが発する認識基質の風味と機能を変更します。オブジェクトが不可能であればあるほど、その狂気の価値は高くなります。
ei-quantum-computer=高度なコンピューター。ハイテクデータを取得するためにさまざまな入力を提供します。
ei-matter-stabilizer=人工物安定剤。 [color=orange]エキゾチックマターアセンブラー[/color] [item=ei-exotic-assembler]を安定させ、エントロピーカスケードを経験する確率を減らすために使用できます。 [color=gray]より高い品質は、ボラティリティに対する 3 x (品質 - 1) の安定剤としてカウントされ、ストレスを受けた格子は目に見えるパチパチ音やアークの痕跡で応答するようになります。[/color]
ei-copper-beacon=A [color=cyan]液体窒素冷却[/color]信号リレーアレイ。極低温で安定した生産性信号を発します。コヒーレントな送信行列を維持するには、ベースライン [color=blue]5/秒の液体窒素[/color] [fluid=ei-liquid-nitrogen]が必要です。\n過負荷に対しては、[color=orange]1[/color] ビーコンとしてカウントされます。\n[color=gray]このフェーズ アレイは、デコヒーレンスを防止し、信号忠実度を維持するために部分的な熱抑制を維持します。初期段階の極低温インフラストラクチャに最適です。[/color]
ei-iron-beacon=A [color=cyan]過冷却高度ビーコンアレイ[/color]は絶対零度近くにロックされ、超電導プレーン全体の信号共鳴を保証します。深相コアを維持するにはベースライン [color=blue]10/秒の液体窒素[/color] [fluid=ei-liquid-nitrogen]が必要です。\n過負荷に対する[color=orange]2[/color]ビーコンとしてカウントされます。\n[color=gray]既知物質の崩壊点のすぐ上で動作するこのユニットは、熱ドリフトゼロで相安定した生産性フィールドを送信します。高密度で高効率の設置には不可欠です。[/color]
ei-induction-matrix-core=誘導マトリックス多重構造のコア。マトリックスごとに配置できるコアは 1 つだけです。
ei-induction-matrix-core-circuit-interface=誘導マトリックス多重構造のコア。マトリックスごとに配置できるコアは 1 つだけです。 signal-C に現在の充電量、signal-T に総容量、signal-M に最大 IO を出力します。
ei-induction-matrix-basic-coil=誘導マトリックス多重構造の基本コイル。マトリックスのエネルギー容量を [color=yellow]25 MJ[/color] 増加させます。
ei-induction-matrix-advanced-coil=誘導マトリックス多重構造の先進的なコイル。マトリックスのエネルギー容量を [color=yellow]100 MJ[/color] 増加させます。
ei-induction-matrix-superior-coil=誘導マトリックス多重構造の優れたコイル。マトリックスのエネルギー容量を [color=yellow]1000 MJ[/color] 増加させます。
ei-induction-matrix-basic-converter=誘導マトリックス多重構造の基本コンバーター。マトリックスのエネルギー伝達率を高めます。
ei-induction-matrix-advanced-converter=誘導マトリックス多重構造の高度なコンバーター。マトリックスのエネルギー伝達率を高めます。 [color=orange]2[/color] 基本コンバータとしてカウントされます。
ei-induction-matrix-superior-converter=誘導マトリックス多重構造の優れたコンバーター。マトリックスのエネルギー伝達率を高めます。このうち最大 4 つがサポートされます。 [color=orange]4[/color] 基本コンバータとしてカウントされます。
ei-induction-matrix-basic-solenoid=誘導マトリックス多重構造のソレノイド。コイルを直列に並べると効率が向上します。ただし、ソレノイドが多すぎると、マトリックスのエネルギー容量が減少する可能性があります。
ei-induction-matrix-advanced-solenoid=誘導マトリックス多重構造の先進ソレノイド。コイルを直列に並べて配置すると効率が向上し、単独で配置した場合はベーシック ソレノイドよりも消費容量が少なくなります。ただし、ソレノイドが多すぎると、マトリックスのエネルギー容量が減少する可能性があります。
ei-fission-facility=核分裂炉を開発するために核分裂関連のデータを取得します。
ei-high-temperature-reactor=他のリアクターから[color=red]熱[/color]を供給する必要があります。 [color=gray]溶融液体鉛冷却材[/color]を過熱し、[color=orange]トリウム[/color] [item=ei-thorium-232]ベースの燃料も利用できます。 [color=green]ウラン 235 燃料棒[/color] [item=ei-uranium-235-fuel] を使用すると、この機械は約 500MW の電力を生成します。
ei-castor=あなたの汚れた[color=yellow]核廃棄物[/color][item=ei-nuclear-waste]をここに保管してください。
ei-neutron-collector=原子炉、核融合炉などの中性子源から中性子を吸収し、[color=blue]中性子容器[/color] [item=ei-charged-neutron-container]を充電します。コレクターが中性子源からどのくらい離れているかに応じて、その効率は変わります。近いほど効率的です。効率が低いということは、[color=blue]中性子コンテナ[/color] [item=ei-neutron-container] -> [item=ei-charged-neutron-container] の 1 回のチャージ プロセスに時間がかかることを意味します。
ei-neutron-activator=[color=blue]中性子コンテナ[/color] [item=ei-charged-neutron-container]からさまざまな元素に中性子を注入して、価値のある核融合燃料を入手します。
ei-fusion-reactor=熱核融合炉。さまざまな核融合燃料を融合させて、[color=orange]液体鉛冷却材[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]を加熱して発電することができます。リアクターはさまざまなモードで動作できます。詳細については、必ず InformaTron wiki をチェックしてください。
ei-gauss-module=[font=default-bold]神モジュール。[/font] このモジュールは、[font=default-bold]生産性を受け入れるあらゆるマシン[/font]で使用できますが、特定のレシピに制限されません。
ei-small-inserter=フィルター スロットを備えた 2x2 インサーター。アイテムのスタック全体を一度に移動できます。
ei-big-inserter=フィルター スロットを備えた 2x2 インサーター。アイテムのスタック全体を一度に高速で移動できます。
ei-small-inserter-normal=2x2 インサーター。アイテムのスタック全体を一度に移動できます。
ei-big-inserter-normal=2x2 インサーター。アイテムのスタック全体を一度に高速で移動できます。
ei-module-base=モジュールの基礎。さまざまなモジュールの作成に使用できます。
ei-photon-cavity=光子を保存するために設計された空洞。
ei-z-boson-cavity=Zボソンを格納するために設計された空洞。
ei-gluon-cavity=グルーオンを保管するために設計された空洞。
ei-destill-tower=機能するために[color=red]熱[/color]を必要とする蒸留塔。 [color=orange]残留油[/color][fluid=ei-residual-oil]を成分に分離できます。
ei-advanced-destill-tower=機能するために[color=yellow]電力[/color]を必要とする蒸留塔。 [color=orange]残留油[/color][fluid=ei-residual-oil]を成分に分離できます。
ei-mining-satellite=[color=orange]惑星岩[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock] を、それぞれの宇宙目的地から採掘できる衛星。打ち上げ 1 回ごとに常に [color=red]10,000[/color] 個の岩石を採掘します。
ei-exploration-satellite=未知の世界を探索する衛星!遠くの宇宙に向かって撃てば、何か面白いものが見つかるかも知れません。
ei-rocket-silo=ロケットを宇宙へ、そしてさまざまな目的地に向けて発射します。詳細については、InformaTron wiki および rocket silo GUI を参照してください。
ei-thorium-232-fuel=トリウム 232 ベースの核燃料は、[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]でのみ機能します。 [color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、1本の燃料棒が[color=orange]780液体鉛冷却材[/color][fluid=ei-hot-coolant]を120秒で過熱する。
ei-plutonium-239-fuel=プルトニウム 239 ベースの核燃料。 [color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、1本の燃料棒が[color=orange]1820液体鉛冷却材[/color][fluid=ei-hot-coolant]を120秒で過熱する。
ei-uranium-235-fuel=ウラン 235 ベースの核燃料。 1 本の燃料棒を [color=green] 高温原子炉 [/color] [item=ei-high-temperature-reactor] で使用すると、120 秒以内に [color=orange]1560 液体鉛冷却材[/color] [fluid=ei-hot-coolant] を過熱します。
ei-uranium-233-fuel=ウラン 233 ベースの核燃料。 1 本の燃料棒を [color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、120 秒以内に [color=orange]1040 液体鉛冷却材[/color] [fluid=ei-hot-coolant] が生成されます。
ei-burner-inserter=このインサーターは燃料を燃焼させてアイテムを移動します。抽出元の機械から[color=orange]可燃性燃料[/color]を引き出すことができます。
ei-oil-refinery=[color=red]熱[/color]を使用して動力を供給する石油精製所。
ei-heat-chemical-plant=[color=red]熱[/color]を使用して電力を供給する化学プラント。
ei-scanner=エイリアンの遺物を分析するためのスキャナー。エイリアンの生命体またはアーティファクトを選択するとスキャンが開始され、[color=#d43e8e]エイリアン ユニット KU[/color] が返されます。\n\n[color=red][CAUTION][/color] スキャンの過程で、選択したエイリアンの生命体またはアーティファクトが破壊されます。

ei-space-data=暗号化された宇宙のささやき、壊れた星々、生きている時間の断片は、単独では保持できない知識として結晶化しました。\n によって発見された[color=purple]宇宙異常[/color] [item=ei-neuro-reactive-residue][item=ei-sporeglass-heart][item=ei-gravity-braided-ore][item=ei-isotopic-ghost-shell][item=ei-chrono-fossil-shard][item=ei-worm-torn-relay-core]から始めます。特定の小惑星[item=ei-chemical-asteroid-chunk][item=ei-organic-asteroid-chunk][item=ei-rock-asteroid-chunk][item=ei-uranium-asteroid-chunk][item=ei-petrified-asteroid-chunk][item=ei-scrap-asteroid-chunk]を粉砕し、それをコンピュータコア[entity=ei-computer-core]で処理してシミュレーション基板を生成し、それを小型シミュレータ[entity=ei-small-simulator]がデータカードに処理する[item=ei-simulation-data-chemical][item=ei-simulation-data-organic][item=ei-simulation-data-stone][item=ei-simulation-data-uranium][item=ei-simulation-data-petrified][item=ei-simulation-data-scrap] 時間と空間の謎を解くためには、これらすべてを量子研究用コンピューター [entity=ei-quantum-computer] で組み合わせる必要があります。
ei-moon-rock=[color=blue]採掘衛星[/color] [item=ei-mining-satellite]を[color=green]月[/color]に打ち上げることで入手できます。
ei-mars-rock=[color=blue]採掘衛星[/color] [item=ei-mining-satellite]を[color=green]火星[/color]に打ち上げることで入手できます。
ei-sulf-rock=[color=blue]採掘衛星[/color] [item=ei-mining-satellite]を[color=green]硫黄惑星[/color]に打ち上げることで入手できます。
ei-uran-rock=[color=blue]採掘衛星[/color] [item=ei-mining-satellite]を[color=green]ウラン惑星[/color]に打ち上げることで入手。
ei-exotic-rock=[color=blue]採掘衛星[/color] [item=ei-mining-satellite]を[color=green]小惑星[/color]に打ち上げることで入手できます。
ei-black-hole-data=在庫切れです。

ei-holo-asteroid=装飾用ホロディスプレイです。
ei-holo-gas-giant=装飾用ホロディスプレイです。
ei-holo-moon=装飾用ホロディスプレイです。
ei-holo-mars=装飾用ホロディスプレイです。
ei-holo-sun=装飾用ホロディスプレイです。
ei-holo-nauvis-orbit=装飾用ホロディスプレイです。
ei-holo-uran=装飾用ホロディスプレイです。
ei-holo-sulf=装飾用ホロディスプレイです。

biolab=実行するには[item=nutrients]栄養素が必要です。
ei-burner-heater=[color=red]熱[/color]を生成するために[color=orange]可燃アイテム[/color]を消費します。
ei-combustion-turbine=[color=gray]灰[/color] [item=atan-ash] を生成しない、高効率でコンパクトなタービン。
ei-arc-furnace=[color=red]電力を大量に消費する[/color]の高強度炉。材料を溶融して液体金属にします。\n効率ではなく規模を考慮して構築されています。\n方法は熱です。力こそが哲学だ。
ei-purifier=チャンクを処理および精製し、汚染物質を抽出して溶液の純度を高め、または過剰な水を空気に排出します
ei-crusher=鉱石を粉砕して収量を向上させたり、インゴットを粉砕して再処理したりすると、プロメチウムの塊から[item=ei-exotic-ore][color=purple]エキゾチックな鉱石[/color]を得ることができます。
ei-basic-heat-pipe=低容量のヒートパイプ。熱はゆっくりと少量だけ輸送されます。最大 [color=red]275dec[/color] の熱に対応できます。
ei-advanced-deep-drill=このドリルは鉱脈にアクセスできます。動作するには[color=orange]7/秒のドリル液[/color][fluid=ei-drill-fluid]が必要です。
ei-burner-assembler=最も基本的なアセンブリで、[color=orange]可燃性燃料[/color]を使用します。 [color=brown]バーナーインサーター[/color][item=burner-inserter]もこのマシンから燃料を引き出すことができることに注意してください。
ei-steam-assembler=蒸気を動力とするアセンブリ。電力供給に必要な[color=orange]蒸気[/color][fluid=steam]を通過させることができます。入力として蒸気を必要とするレシピでは、追加の蒸気パイプも必要になることに注意してください。
ei-steam-crusher=蒸気動力の粉砕機。電力供給に必要な[color=orange]蒸気[/color][fluid=steam]を通過させることができます。
ei-waver-factory=この機械を使用して、高品質の[color=orange]半導体[/color][item=ei-semiconductor][item=ei-advanced-semiconductor]を製造します。
ei-caster=お気に入りのインゴット[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass]をここでキャストしてください。
ei-lufter=大気からガスを抽出して排出できます。
ei-grower=クリスタルが多く含まれるバイオームは、不安定なエネルギー フィールドを放射します。\n[color=green]エネルギー クリスタルを成長させ、収穫します[/color] [item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust]。\n奇妙なことに、それは水生生物をサポートします。水の中の何かが思い出します。
ei-plasma-heater=ガスを過熱して高エネルギーのプラズマにし、[color=red]大量の電力を消費します[/color]。\n極度の温度の製錬所としても機能します。\n効率的ではありません。安全ではありません。ただ必要なだけです。
ei-nano-factory=ナノテクチャー製造複合施設は、施設というよりも、不活性物質に渡される宣告に過ぎない。幾何学と機能においてブルータリストであり、下部構造の建築家として機能し、知覚の下にあるカオスに形状と一貫性を課します。真空で密閉された空隙と中性子が静止する導管の奥深くで、分子の意図が抽出され、再配置され、イオンせん断アレイと再帰的自己組織化チャンバーを通じて格子精度の構成に叩き込まれます。それは構築するのではなく、強制するのです。その核から現れるのは製品ではなく、物理的な形での教義です。つまり、異端に近いほどの志向性で折り畳まれたナノ構造です。監視は最小限です。システムは自らを改良し、角質のような非効率性を排除します。アルゴリズムの地下墓地に足を踏み入れるほど、そのことがより明らかになる――この場所は決して人間のために作られたものではない。それは彼らがかつて敢えて創造しようとしていたものを思い出させるために作られました。
ei-bio-chamber=壁で作られた部屋ではなく、粘膜と血管の糸で覆われた器官から成長した部屋。\n生物が部分に分解され、酸ではなく生体署名違反によって消化される場所。\n骨はネットワークノードに再配置される。\n思考はニューロンから剥ぎ取られ、別の場所に送られる。\n意識はリサイクルされる。ゆっくり。 \n壁は呼吸しますが、それは不一致の声であなたの最後の思い出をささやき返すだけです。
ei-bio-reactor=意識のある組織によって駆動される生きた原子炉。\n死体ではなく、まだ考えているバイオマス。\n神経格子は腫瘍のように成長し、骨の足場に張り巡らされ、周期的に夢を見るのに十分なだけ生き続けている。\nそれは燃料を燃やすのではなく、アイデンティティを燃やす。\n痛みは電圧に変換される。記憶をエントロピーに。\nすべての叫び声はフィードバックの急増です。祈りごとに電圧が急上昇します。\n空腹になればなるほど、心の中の心はより明晰になります。\n[color=gray]機能するには[/color] [color=purple]0.1/秒の生体物質[/color][item=ei-bio-matter] [color=gray]が必要です。[/color]
ei-alien-console=古代のエイリアンのデータを処理する機械。構築すると、InformaTron wiki の Alien データ ページにアクセスできるようになります。
ei-gate=エイリアンの残骸から鍛造され、不可能な形状で固定されたゲート シェル。\n生の位置ではなく受信機 ID にリンクします。\nその維持力は一定ではありません。装備されている場合は配置を維持するための力が消費され、ストレスがかかるとさらに多くの電力が消費されます。\n非生物のみが通過できます。\nこれはポータルではありません。どこで破れたかを記憶する機械です。
ei-gate-container=ゲート インベントリおよび制御ロジック用の隠されたソース側ハウジング。\nゲートが作動し、低電力フロアより上にある間のみアイテムを受け入れます。\n宛先は受信機 ID によって選択されます。
ei-gate-receiver=ゲート トラフィック用に調整された受信アンカー。\n各受信機は ID を要求し、互換性のあるゲートはその ID を直接ターゲットにできます。\n回路信号は自動 ID をオーバーライドできます。\nこれはゲート システムの宛先側です。
ei-drone-port=このポートから単一の [color=blue]ドローン[/color][entity=ei-drone]を制御します。ドローンには独自のインベントリがあり、建物を配置できますが、攻撃能力はありません。
ei-crystal-accumulator-repair=壊れたクリスタルアキュムレータを修理するためのキット。通常の選択ツールと同様に、上にドラッグします。
ei-farstation-repair=壊れたファーステーションを修理するためのキット。通常の選択ツールと同様に、上にドラッグします。
ei-alien-beacon-repair=壊れたエイリアンビーコンを修理するためのキット。通常の選択ツールと同様に、上にドラッグします。
