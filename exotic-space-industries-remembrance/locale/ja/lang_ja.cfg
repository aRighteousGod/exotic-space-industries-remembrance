mining-scars=採掘跡
mining-scars-2=惑星の劣化
mining-scars-text=鉱床を掘り尽くしたときに、地形がそのまま残るわけではなくなりました。採掘完了時に周辺の地面に「傷跡」が残ることがありますが、これは [item=ei-burner-quarry]、[item=ei-steam-quarry]、[item=ei-electric-quarry]、[item=big-mining-drill] を使用した場合に限られます。\n\n鉱床が枯渇するたびに、その近くのランダムな位置に小さな「傷跡」が発生する可能性があります。これは地形へのダメージであり、ボーナス資源の獲得ではありません。
mining-scars-text-2=地面に残った「傷跡」は、惑星ごとの環境に影響を受けて変化していきます。ナウヴィスの草地やフルゴラの岩盤は砂漠化、グレバの地形は腐敗、ヴルカヌスでは焦土と化し、アクィロでは雪や氷が押し固められます。\n\nあなたがその土地から何を奪ったのか、惑星は決して忘れません。
nauvis-pressure-grace=ナウヴィスの進化速度緩和
nauvis-pressure-grace-text=この設定は一時的に、ナウヴィスの進化進行度に上限閾値を設けます。18,000tick(5分)ごとにナウヴィス上の敵勢力の進化をチェックし、現在の値が上限閾値を上回っている場合は閾値まで降下させます。\n\nマップの汚染を減衰したり、巣を削除したり、襲撃をキャンセルしたりすることはありません。Extended設定は、電気時代の初期に入ったときに汚染進化係数を一時的に下げ、緩和が終了したときに元の値を復元できます。
nauvis-pressure-grace-text-2=[font=default-bold]蒸気時代[/font] の前は、上限閾値は [font=default-bold]0.25[/font] です。蒸気時代の研究後かつ [font=default-bold]電気時代[/font] の前は、閾値は [font=default-bold]0.45[/font] です。\n\nClassic設定の場合はここで終わりです。Extendedは更に [font=default-bold]コンピュータ時代[/font] まで機能します。[font=default-bold]電力発電[/font] の前は [font=default-bold]0.50[/font]、電気防衛技術の前は [font=default-bold]0.55[/font]、そしてコンピュータ時代までは [font=default-bold]0.60[/font] です。
new-logistics-text=Exotic Industriesは、新しいシステム／設備／メカニクスを追加し、物流に関する技術ツリーを拡張します。更に詳細な説明は、[font=default-bold]構造的明確さ[/font]のためにサブカテゴリーごとに整理されています。\n\n左側のメニューからアクセスしてください。\n\n移動はもはや単純ではありません。\n\nすべてのルートが決断です。\n\nすべてのフローが設計です。\n\n効率は[font=default-bold]勝ち取るもの[/font]です。
new-mechanics-text=ExoticIndustriesは幅広い分野で新しいメカニクスを追加し、それぞれがゲームプレイの基礎ロジックを変更します。\n\nこれらのシステムは構造的明確さのために集中的なサブカテゴリーへと分割されています。\n左側のメニューを使用してアクセスできます。\n\n[font=default-bold]これらは選択的な層ではありません。[/font]\n\n世界の新しい物理法則なのです。\n\nそれらを研究せよ。さもなくば[font=default-bold]それらによって解体されよ。[/font]
nuclear-fission-and-fusion-text=ExoticIndustriesは、新しいメカニクス／素材／制御システムによって原子力に関する技術ツリーを拡張します。\n\nこれらの機能は複数のサブカテゴリーに分割されています――それぞれが核インフラ、燃料ダイナミクス、または閉じ込めロジックの特定のアスペクトを表します。\n左側のメニューからアクセスできます。\n\n[font=default-bold]これは単なる核分裂ではありません。[/font]\n熱、圧力、および不可逆反応によるエスカレーションなのです。\n[font=default-bold]点火する前にシステムを研究せよ。[/font]
orbital-scanner-2=トランスポンダ、セレクター、コーディネーター
orbital-scanner-3=出荷アップリンクと積み込み
orbital-scanner-text=「軌道物流」コホートは、[entity=ei-orbital-combinator]から始まります。対象プラットフォームの地上側に、スキャナーを設置してください。スキャナーは、[font=default-bold]設置した惑星の衛星軌道にある[/font]プラットフォームの情報を反映します。「要求」には設定された最小在庫数量が反映されます。「輸送中」には既に輸送が確定した貨物量が反映されます。「需要」には輸送中の貨物と現在の在庫を差し引いた不足分が表示されます。\n\n隣接するスキャナーは一つの「バンク」を形成します。バンクは、出力が大きすぎる場合に情報を複数のセクションに分割して出力し、容量が不足すると[virtual-signal=ei-orbital-overflow]信号を発信します。各スキャナーは[font=default-bold]750 kW[/font]の電力を消費します。回路配線を行うと、バンクの情報をリアルタイムに取得することができます。配線されていない場合は、コンソールを開いている間は更新が行われますが、閉じている間は低頻度のメンテナンスモードになります。
orbital-scanner-text-2=[font=default-bold]コホートの役割[/font]\n\n[entity=ei-platform-transponder] はプラットフォーム上に設置し、軌道物流関連の設備で使用されるプラットフォームIDを割り当てます。手動で上書きすることも可能ですが、異なるプラットフォーム間でIDが重複／競合した場合は、解消されるまで両方とも使用不能になります。\n\n[entity=ei-orbital-selector] は地上に設置し、１回にひとつの対象IDを指定します。手動モードは、予め指定されたプラットフォームIDを使用します。回路モードは [virtual-signal=ei-platform-id] によって指定された値を使用します。ポリシーモードは必要数量が正の値で、未リース、かつ同じサーフェスのプラットフォームを指定します。\n\n[entity=ei-orbital-coordinator] はサーフェスの管理者です。コーディネーターはサーフェスごとに1個のみ有効です。複数の発進レーンが同じプラットフォームに過剰に出荷することが無いようにリース＆解除の制御を行います。\n\n[entity=ei-orbital-dispatch-uplink] はロケットサイロの隣に設置し、ロケットに積み込むためのマニフェストを発行＆リースします。各コホートエンティティを直接開いて、コンソールを開けますが、回路画面に表示される内容は読み取り専用の情報であり、設定画面ではありません。\n\n[font=default-bold]パネル制御[/font]\n\nトランスポンダパネルはプラットフォームIDを手動設定またはクリアします。セレクターパネルではセレクターモードを変更、手動モードではターゲットIDを変更します。コーディネーターパネルはコホートの更新を指示したり、管理者向けにはランタイムの再構築を行います。アップリンクパネルはサイロをバインドまたはクリアし、最も近い隣接サイロを取得でき、オーバーサイズポリシーと閾値下限を設定します。
orbital-scanner-text-2b=[font=default-bold]まずはサイドパネルを開いてください[/font]\n\n表示される回路ページは読み取り専用の情報です。コホートデバイスのサイドパネルを開いて設定を変更し、下の凡例を使用して最上行、中間行、および次のアクションのヒントを読み取ってください。
orbital-scanner-text-3=[font=default-bold]スタートアップ手順[/font]\n\n1. プラットフォーム側にトランスポンダを配置します。\n2. 地表側に1つ以上のセレクターを設置し、手動モード／回路モード／ポリシーモードのいずれかで対象プラットフォームIDを指定します。\n3. 同じ地表に、1つのコーディネーターを設置しオンラインにします。\n4. ロケットサイロの隣にアップリンクを配置します。隣接させると、初期設定画面が表示されます。アップリンクのサイドパネルを使用してバインドを確認、置換、またはクリアし、レーンを維持すべきオーバーサイズポリシーを選択します。\n\nセレクターが準備完了状態、地表にコーディネーターがありアクティブ状態、アップリンクのバインドとリースがが有効、全ての条件を満たすとコホートはアクティブになります。\n\n[font=default-bold]停止状態[/font]\n\n「対象未選択」は、セレクターに有効なプラットフォームIDが設定されていないことを意味します。「需要なし」は、選択されたプラットフォームで現在需要が満たされていることを意味します。「サイロバインドなし」は、アップリンクが実際のロケットサイロにロックされていないことを意味します。「コーディネーターなし」は、地上側にアクティブなコーディネーターが存在しないことを意味します。\n\n積み込みはv1ではハイブリッドのままです: インサータ、列車、リクエスト、およびレーン回路が物理的な作業を行います。「継続」は物量を考慮せず、常に最大量で繰り返しリースし続けます。「単発」は1回の発射後に解放します。「閾値」は残りの需要が閾値下限を下回る間のみ継続するため、下限設定は「閾値」モードでのみ重要となります。
organic-asteroid=有機アステロイド
organic-asteroid-text=[font=default-bold]惑星発見：グレバ[/font]と共にアンロックされます。有機アステロイド破砕は [fluid=water]水を消費し、[item=spoilage]腐敗物、[fluid=ei-bio-sludge]バイオスラッジ、および [fluid=ei-ammonia-gas]アンモニアを産出します。高度レシピは追加で [item=nutrients]栄養素、[item=yumako]ユマコ、[item=jellynut]ゼリーナット、[item=ei-bio-matter]バイオマター、[item=pentapod-egg]ペンタポッドの卵を取り出します。また、微量の [item=ei-sporeglass-heart]胞子ガラスの心臓を含みます。
overall=概要
overall-text=Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color] は単なるコンテンツMODではありません。これは世界の構造そのものを書き換えるガイア的刷新です。自動化の風はもはや同じようには吹きません。火、鉱石、そして信号は古い誓約の下で再構築されました。\n\nMODの難易度は意図的なものです。苦闘に恥はありません――それこそが主権の証明の場なのです。安らぎを求める者にとって、ここはあなたの世界ではありません。ガイアとともに立ち上がりたいと願う者は、ゲームを開始する前にMOD設定を確認してください。設定可能なシステムもあれば、不可能なシステムもあります。重要なものは、変更を許されません。\n\n必要であればQoL（快適性向上）MODを持ち込んでください。しかし、これだけは知っておいてください: 自ら戦って勝ち取らない限り、真にあなたのものとなるものは何一つありません。\n\nそうであるように。\nそうであったように。\nそうあるように。\nRemembranceへようこそ。
petrified-asteroid=化石アステロイド
petrified-asteroid-text=[font=default-bold]スペースプラットフォーム[/font]と共にアンロックされます。化石アステロイド破砕は [item=wood]原木、[item=raw-fish]生魚、[fluid=ei-liquid-nitrogen]液体窒素、および [fluid=ei-liquid-oxygen]液体酸素の奇妙な混合物を抽出します。高度レシピは追加で [item=bioflux]バイオ融材と [fluid=fluoroketone-cold]フルオロケトン (低温)、[item=biter-egg]バイターの卵を抽出します。微量の [item=ei-chrono-fossil-shard]クロノ化石の破片を含みます。
phase-shift-pipe-1=[img=utility/warning_icon]極低温の液体[fluid=__1__]が、__3__の[color=black]__2__[/color]で[color=blue]沸騰蒸発しました[/color]。
phase-shift-pipe-2=[img=utility/warning_icon]極低温の液体が、__3__の[color=black]__2__[/color]で[color=blue]沸騰蒸発しました[/color]。
pipe-breach-chemical=化学的破損
pipe-breach-cryo=凍結破損
pipe-breach-generic=パイプ破損
pipe-breach-phase-shift=極低温液体気化
pipe-breach-thermal=高温破損
railgun-cooling-2=冷却機構と代替レシピ
railgun-cooling-3=サーフェスごとの挙動
railgun-cooling-4=状態表示と復旧
railgun-cooling-text=レールガンは、弾薬に冷却機能をもたせるのではなく、砲身そのものを冷却します。タレットにフルオロケトン (低温)を循環させ、フルオロケトン (高温)を回収する必要があります。冷却速度が追いつかない場合は自動的に稼働停止します。\n\nこれは意図的な設計です。砲は熱く稼働し、砲身は短時間の残熱光を保持し、冷却機構こそが持続射撃を可能にするキモとなります。
railgun-cooling-text-2=通常運転では、フルオロケトン (低温)を使用します。フルオロケトン (低温)の供給が足りないと、レールガンは加熱状態となり、自らを無効化し、自然冷却を開始します。\n\n冷却手段には氷ベースの代替機能も用意されており、液体窒素が用意できない場合にフルオロケトン (低温)を作る別の方法を提供します。氷ルートは世界が無料の冷気でできているかのように装う代わりに、少しの蒸気が必要になります。
railgun-cooling-text-3=異なるサーフェスでは冷却の機序も異なります。宇宙プラットフォームではゆっくりと冷却し、大気のある場所ではより早く放熱できます。アクィロは自然放熱での回復が最も早く、ヴルカヌスは遅く、希薄または低汚染のサーフェスはその中間に位置します。したがって、同じレールガンであっても設置された場所によって大きく使い勝手が異なります。
railgun-cooling-text-4=正常なレールガンは、復旧対象にはなりません。過熱または停止したもののみが回復状態に入り、蓄熱負荷がクリアされ、フルオロケトン (高温)が排出されフルオロケトン (低温)を再び受け入れられるようになるまで、無効化されたままになります。\n\nこれによりステータスが有意義になります: 緑は準備完了、黄は回復中またはフルオロケトン (高温)排出待ち、赤は冷却ハードウェアの欠損または深刻な過熱です。
repair=エイリアンの遺物の修復
repair-text=[color=blue]アーティファクト修理キット[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair] を使用して、壊れたエイリアンの遺物を修理できます。修理する際は修理キットをアーティファクトの上にドラッグして修理します。修理済のエイリアンの遺物は再び使用できるようになります。クリスタル蓄電池だけは、Alt選択してキットを消費せずにクリスタルとシェルを点検することもできます。
resources=新しい資源システム
resources-text=ExoticIndustriesは資源システムを再構築します。鉱床が唯一の獲得手段ではなくなりました。資源は固有のロジック、生産フロー、および空間挙動によって支配される明確なカテゴリーへと分割されます。\n抽出はもはや単純ではありません。\n[font=default-bold]獲得には適応が必要です。[/font]\nカテゴリーを理解せよ。さもなくば何も生産できない。
rock-asteroid=岩石アステロイド
rock-asteroid-text=[font=default-bold]惑星発見：ヴルカヌス[/font]を通じてアンロックされます。岩石アステロイド破砕は大部分が [item=stone]石材です。高度レシピは豊かな鉱物を入手できます。 [item=tungsten-ore]タングステン鉱石、[item=calcite]方解石、[item=ei-gold-chunk]金の塊。微量の [item=ei-gravity-braided-ore]重力編組鉱石を含みます。
rocket-ammo-schema=ロケット兵装理論
rocket-ammo-schema-2=弾薬の種類
rocket-ammo-schema-3=グラフィック系統
rocket-ammo-schema-4=長距離砲用の核弾頭
rocket-ammo-schema-text=ロケット兵装は独自の研究ツリー構造になっています。[item=ei-rocket-airframe] 本体、[item=ei-rocket-motor-basic] モーター、[item=ei-rocket-warhead-impact] 弾頭、完成品としてのロケット弾。本体が外殻を損なわずに保ち、モーターが射程を設定し、弾頭で攻撃属性を決定します。長距離砲も同じ理論に従いますが、より重厚で容赦がありません。
rocket-ammo-schema-text-2=ロケット弾は、そのコストをかける価値が十分なように強化されました。衝撃弾および榴弾はどちらもより重厚にダメージを与えます。腐食弾薬は、手持ちランチャーと長距離砲ラインの間で1つの化学パッケージを共有します。最初に残虐な酸のヒット、次に構造を食い破り続ける持続的な腐食性の雲。極低温弾薬は両方の部門で同じ制御持続時間を維持しますが、より重い重量で着弾します。核ラインは現在、明確に分割されています。ウラン235はESIR独自の [item=ei-atomic-bomb-u235] へと集約され、より緊密な放射能汚染をもたらし、プルトニウムはプルトニウム原子ロケットのままとどまり、バニラの原子爆発を維持し、破砕の背後に広範な放射性汚染を投げつけます。
rocket-ammo-schema-text-3=各系統で独自のエフェクト、煙、グラフィックを有しているため、汎用的な白い閃光で塗りつぶされることはなく、外見だけで明確に判別できます。
rocket-ammo-schema-text-4=長距離砲タレットは、U-235およびプルトニウム原子ロケットをバラまたは完全なコンテナとして装填できるようになりました。コンテナ詰めの斉射は実質的に犠牲的な使用です。核分裂物質の生産と解禁ルーティングは分離されたままであり、U-235はより緊密なESIR中心の爆発とよりクリーンなフォールアウトフットプリントを使用し、プルトニウムはバニラの原子爆発を維持しながらより広い放射性汚染を投げつけ、近すぎる射撃はターゲットとともに射撃位置を切り開く可能性があります。
rocket-launch-pollution=ロケット打ち上げによる汚染
rocket-launch-pollution-2=汚染変動スタイルと排煙グラフィック
rocket-launch-pollution-text=ロケットを打ち上げた際に、直接汚染を排出することがあります。そのサーフェスでの進化係数とMOD設定で選択された変動スタイル、予め設定された上限に基づいて結果を算出します。\n\nデフォルトでは、上限は進化度 [font=default-bold]1.0[/font] で [font=default-bold]10,000汚染[/font] です。ほとんどの曲線モードは [font=default-bold]10%の下限値[/font] も保持するため、低進化度の打ち上げでも実感できます。
rocket-launch-pollution-text-2=MOD設定の [font=default-bold]変動スタイル[/font] は、一次関数／二次関数／指数関数／閾値／ハイブリッドに設定できます。一次関数は進化を直接追跡します。二次関数および指数関数は後期になるほどより大きなペナルティが発生します。閾値は固定された進化帯を越えて跳躍します。ハイブリッドは一次関数ベースを使用し、追加の終盤スパイクを加えます。\n\n打ち上げのグラフィック設定は、空が負債をどのように記録するかを制御します: ハイブリッドは上昇する噴煙が始まるにつれて減少する短いパッド排気のブルームから始まり、上昇する噴煙のみは垂直の煙を維持し、シネマティックは噴煙が引き継ぐまで完全なパッド排気を実行し、パッド排気のみは垂直の噴煙なしで地上煙を維持します。
scrap-asteroid=廃材アステロイド
scrap-asteroid-text=[font=default-bold]惑星発見：フルゴラ[/font]を通じてアンロックされます。廃材アステロイド破砕は廃材リサイクルのテーブルと同期されているため、この破砕は単一のレシピではなく回収ストリームになります。両方のティアーが [item=ei-crushed-neodym]破砕ネオジムの判定を保持し、どちらも稀に [item=ei-worm-torn-relay-core]ワームに引き裂かれた中継コアを露出させることができます。\n\n軌道のゴミを工場の在庫に変えたい場合、これがそのルートです。
space-destinations=宇宙の目的地
space-destinations-2=他の目的地
space-destinations-2-text=ゲームが進行すると、恒星系内外の様々な目的地が利用可能になります。選択された目的地への距離に応じて、然るべき量のロケット燃料が必要になります。さらに、専門化された [color=orange]探査衛星[/color] [item=ei-exploration-satellite] を送るか、通常の貨物を積んだロケットを送る際、確率によって発見される目的地もあります。いくつかの新しい目的地は、[color=purple]恒星系の外[/color] の深宇宙に位置している場合があります。探査衛星を送る場合でも、新しい目的地の発見は常に確率に依存することに注意してください。
space-destinations-text=[color=orange]ロケットサイロ[/color] [item=rocket-silo] は、さまざまな目的地へ貨物を送るために使用できます。コンピュータ時代で最初に解禁されたときは、[color=green]ナウヴィス衛星軌道[/color] へ衛星を送ることしかできません。送信された衛星またはロケット貨物のタイプに応じて、データやその他の有用な打ち上げ製品を受け取ることができます。
specialised-pipes=専用パイプとデータケーブル
specialised-pipes-2=破損のパターン
specialised-pipes-3=断熱パイプの性質
specialised-pipes-4=事故の兆候と監視
specialised-pipes-text=ESIRでは、流体搬送系を交換可能な配管としてではなく、封じ込めハードウェアとして扱います。\n\n[color=orange]断熱パイプ[/color] は極低温／高温／化学的に危険な流体を安定に保ちます。[color=orange]データケーブル[/color] は [color=blue]シミュレーション基質[/color] [fluid=ei-computing-power] を運び、一般用途の流体ラインではありません。通常の化学物質を入れると、データケーブルがショートします。\n\nパイプを選択するということは、どの種類の破損に耐える必要があるかを考える、という意味になります。
specialised-pipes-text-2=非断熱パイプ、地下埋設部、高架パイプ、そしてタンクでは、それぞれ破損の態様が異なります。通常の配管内では、液体窒素や液体酸素は気化して霧散してしまいます。加熱された流体や溶岩では高温に耐えられず破裂します。また、フルオロケトンや電解液の場合は、化学変化によってパイプが破損し、内容物が流出します。タンクの破損はパイプ１個の破損よりも大規模なものとなり得ますが、高架配管であれば設置面積を抑えられ、広範囲にわたる漏洩事故を防ぐことができます。
specialised-pipes-text-3=断熱パイプは、通常のパイプのように加熱を必要としません。断熱パイプ／断熱地下パイプ／断熱タンクはいずれも[font=default-bold]熱エネルギーが一切減衰しない[/font]ため、アクィロやその他の極寒の地でも、凍結防止のための外部熱源は必要ありません。\n\n流体の状態を維持する必要がある場合（冷たい液体を冷たいまま保つ、反応性の混合物を安全に封じ込めるなど）や、通常の配管では漏洩・ショート・破裂などを起こしてしまうような過酷な環境下での運用に、これらをご活用ください。
specialised-pipes-text-4=パイプ破損時の被害は、流体と汚染物質の双方によって決まります。混合流体が流れる区間では、たとえ少量でも、実際に影響を及ぼす汚染物質の種類に応じて破損時の挙動が変化します。データケーブルの事故ではアーク放電や短絡が発生し、極低温流体の場合は霜が噴出し、高温流体の場合は焦げが生じ、化学物質の漏洩事故ではミストや腐食性物質が飛散します。汚染物質が熱流体や化学物質であっても、データケーブルが発火することはありません。また、配管を高所に配置することで、爆発や噴出の影響範囲を限定的に抑えることができます。同一区間で事故が繰り返し発生する場合、メッセージが画面を埋め尽くさないよう、通知頻度が抑制されます。\n\n稼働中の工場を監視・診断する場合、`/ei_runtime_status` コマンドで以下の情報を確認できます：`fluid(t/u/d/s/cursor/mode)` は追跡対象 / 緊急 / 汚染 / スキャン / サービスカーソル / 次回サービスモードの流体情報を、`fluidfx(qh/ql|sh/sl)` は待機中の重質・軽質流体（および抑制された重質・軽質流体）の情報を、`rupture(mode/a/p/d|ob/oi)` は忠実度モード / アクティブなジョブ / 保留中のリング / 予定遅延バケット（および期限超過バケット / 期限超過アイテム）の情報をそれぞれ出力します。
spidertron=スパイダートロンの変更点
spidertron-text=バニラと比較して、[font=default-bold]スパイダートロンはより早期（シミュレーション時代）に利用可能[/font]になります。しかし、ナウヴィスの対体と同等品とは異なり、もはや自己完結した奇跡ではありません。燃料を必要とします。\n\n最初は、石炭、バイオマス、および類似の材料などの可燃性固形で十分機能します。しかし進歩するにつれて、核燃料や核融合燃料が速度、加速度、および運用範囲への大幅なボーナスを解禁します。\n\nこれは単なる車両ではありません。[font=default-bold]段階的エスカレーションのためのプラットフォーム[/font]なのです。\n\n[color=green]Spidertron Patrols[/color] や [color=green]Constructron-Continued[/color] などのMODには特別な統合が含まれており、Exotic Industriesの変更されたスパイダートロンフレームワークに合わせてシステムを適応させています。\n\nスパイダーはより早く歩き始めます。しかし、目的、重量、および要求を伴って歩くのです。\n\n十分に給餌せよ。さもなくば[font=default-bold]取り残されよ。[/font]
steam-bots=蒸気式ロボット
steam-bots-text=洗練された電動ドローンではありません。真鍮製のボディを持ち、ピストンと圧力と、あまり精度の高くない計算によって空中を漂う「労働の精霊」――それこそが、熱い金属と湿った蒸気の匂いが漂うこの産業における、最初の空飛ぶ従者たちです。\n\n蒸気式ロボポートの技術ツリーは[font=default-bold]蒸気時代[/font]に位置し、バニラのロボット技術はその後に続く形で登場するため、バニラよりもはるかに早い段階で、物流や建設ロボットを利用できるようになります。
steam-bots-text-2=尤も大きな弱点は持続力です。蒸気ロボットはバッテリーを積んでおらず、蓄えた蒸気の圧力で飛行するため、それが尽きる前にロボポートへ戻る必要があります。移動中に蒸気がなくなった場合、救助を静かに待つようなことはできず、[font=default-bold]その場に墜落[/font]します。\n\n蒸気ロボポートは早めに再充填を促す仕組みになっていますが、長距離の運搬やポートの混雑といった状況下では、その「早めの対応」がかえって死骸の山を築くこともあり得るでしょう。
stone-text=石はシステム内で最も豊富な資源です。地表の鉱脈から従来の方法で抽出することもできますが、ExoticIndustriesはその獲得経路を拡張します:\n\n[color=orange]ハーベスター[/color] [item=ei-burner-surface-harvester] により、あらゆる地形からの採掘が可能になります。\n\n[font=default-bold]効率は悪いものの、手動収集も依然として可能です。[/font]\n石材は至る所に存在します。\n効率は選択可能です。産出はそうではありません。
surface-patches=地表の鉱物
surface-patches-text=ナウヴィスの地表は均一ではありません。ゲーム開始地点の周囲は、セーフエリアとして維持されています。[item=ei-poor-iron-chunk]低純度の鉄鉱石塊／[item=ei-poor-copper-chunk]低純度の銅鉱石塊／[item=coal]石炭／[item=stone]石／[fluid=crude-oil]原油は、初期の産業を確立するのに十分な埋蔵量があります。\n\nその揺りかごを越えると、状況は大きく変わります。[item=ei-poor-iron-chunk]低純度の鉄鉱石塊／[item=ei-poor-copper-chunk]低純度の銅鉱石塊、さらには [item=ei-poor-uranium-chunk]低純度のウラン鉱石塊でさえ、大部分が浅い切れ端、枯渇した残骸としてわずかに存在するのみです。確実に存在はしますが、持続可能なほどの埋蔵量はありません。\n\n石炭、石、石油はナウヴィスの実用的な資源であり続けます。保護区を使用して火力技術、ベルト、化学を確立してください。その上で土地を正しく読み解いてください。さもなくば地殻はあなたに嘘をつくでしょう。
tech=研究コスト倍率
tech-2=MOD設定の影響範囲
tech-3=実用上の限界と途中変更
tech-output=現在の時代進行状況
tech-output-text=次にアクティベーションされる時代は[font=default-bold]__3__[/font]です。現在、アンロック閾値に必要な研究の[font=default-bold]__1__ / __2__[/font]が明らかになっています。\n\n[font=default-bold]前進せよ。さもなくば過去に縛られたままでいよ。[/font]
tech-text=ExoticIndustriesでは、研究コストはバニラのような平坦な設定になっていません。MOD設定で指定された[font=default-bold]初期コスト[/font]／[font=default-bold]曲線形式[/font]／[font=default-bold]上限[/font]から研究コストを算出し、その倍率を技術ツリー全体に分散させます。[font=default-bold]一次関数[/font]は一定の伸び幅、[font=default-bold]二次関数[/font]は序盤を和らげて終盤に重く作用し、[font=default-bold]指数関数[/font]は序盤を軽く保って終盤にスパイクし、[font=default-bold]時代傾斜[/font]は重量の大部分を後期の時代へと押し込みます。\n\n時代によるゲート制限は依然として全ブランチが解禁されるタイミングを決定しますが、スケーリングは特定の直線的な特攻研究がどれほど厳しく罰せられるかを決定します。技術の重み付けライブラリを尊重するため、割引された技術のカウントは少なくなります。
tech-text-2=[font=default-bold]初期コスト[/font]は、曲線の開始付近における個別のSPコストです。[font=default-bold]上限[/font]は、Sunday strollからVery Expensiveまでの遠い端付近で意図されたパックごとの帯を選択します。[font=default-bold]曲線形式[/font]には[font=default-bold]age-ramp（時代傾斜）[/font]も含まれるようになり、これはコストの多くを後期の時代へとシフトさせ、[font=default-bold]追加倍率[/font]は曲線が評価された後の最終結果をスケーリングします。\n\n選択された上限がFactorioの[font=default-bold]x1000[/font]倍率キャップに達してしまう場合、ESIRは裏で隠された有効ベース初期価格を自動的に引き上げ、より高い上限に達することができるようにします。\n\nExoticIndustriesのバランスを再調整したい場合は、バニラの研究倍率ではなく、これらの内部設定を使用してください。MODはこの進行部分を自ら所有することを前提としており、バニラの倍率は同じ形状を記述しません。
tech-text-3=指定された上限は絶対的な保証ではありません。Factorioは内部の研究価格倍率を[font=default-bold]x1000[/font]に制限しているため、ゲーム内の本当の上限は選択された[font=default-bold]初期コスト[/font]に強く縛られています。ESIRは必要に応じて隠された初期コストを自動的に引き上げ、より高い上限が表現できるようにします。\n\n[font=default-bold]追加倍率[/font]は、進行中のセーブデータで変更するのに最も安全な値です。セーブデータが開始された後に[font=default-bold]初期価格[/font]または[font=default-bold]曲線形式[/font]を変更すると、依然として望ましくないまたは予期しない結果が生じる可能性があります。
