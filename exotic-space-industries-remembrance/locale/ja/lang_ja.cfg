turrets=防衛砲座
turrets-text=Remembrance は固定防衛を大きく広げます。即席の近距離火力、蒸気砲台、腐食性の噴流兵器、電動の弾幕砲座、そして遺物級のエネルギープラットフォームまで、防衛線そのものが引き伸ばされます。これらは[item=gun-turret]ガンタレットの単純な横並び強化ではなく、それぞれに別の補給、別の射界、別の強化支援を要求します。\n\n弾道系の追加砲座は引き続き物理投射物ダメージ研究で伸びます。噴流系砲座は火炎ダメージ系統で強化されます。終盤の遺物級プラットフォームは、極端な電力、希少部材、慎重な配置を要求します。
turrets-2=ショットガン系と砲塔
turrets-text-2=[item=ei-shotgun-turret]ショットガンタレットは暗黒時代に、ガンタレットと軍事技術の後で解禁されます。壁際で迎え撃つための砲座で、射程 15、発射速度は遅め、複雑な電力要求もありませんが、実際に防衛線へ届いた敵には非常に重い一撃を返します。電気時代になると[item=ei-auto-shotgun-turret]コンバットショットガンタレットへ発展し、発射速度は倍、射程は 18、旋回も大きく向上し、常時消費電力と一発ごとの電力コストを払って通路に散弾の幕を張り続けます。\n\n[item=ei-cannon-turret-mk1]キャノンタレットは蒸気時代の攻城防衛段階です。[item=cannon-shell]キャノンシェルを射程 25、最小射程 8 で撃ち出し、旋回は遅いものの単発の重さは非常に大きいです。その後、二基の MK1 と重い部材から[item=ei-cannon-turret]双砲身キャノンタレットになり、より頑丈で、発射も速く、電力補助を受けつつ、射程 30・最小射程 10 で重装目標を壁に届く前に消せるようになります。
turrets-3=酸と火炎
turrets-text-3=[item=ei-acidthrower-turret]アシッドスロワーはフレームタレットの腐食版です。射程 38、最小射程 9 で、[fluid=sulfuric-acid]硫酸、[fluid=ei-nitric-acid]硝酸、[fluid=ei-hydrofluoric-acid]フッ化水素酸、さらに弱い[fluid=ei-acidic-water]酸性水まで扱え、液体ごとにダメージ倍率が異なります。油を燃やすより化学をそのまま武器にしたい工場向けの噴流砲座です。\n\nバニラの[item=flamethrower-turret]火炎放射タレットも再調整されます。EI はこれを蒸気時代へ移し、交戦帯を同じ 38/9 に広げ、より早く射撃準備へ入り、液体消費を大きく増やします。燃料の質が本当に重要になり、原油でも動きますが、重油、軽油、石油ガス、[fluid=ei-kerosene]ケロシンほど高いダメージを出し、粗い留分は弱い緊急燃料に留まります。
turrets-4=ミニガンとレーザー
turrets-text-4=[item=ei-gatling-turret]ミニガンタレットは電気時代の弾丸ホースです。搭載した[item=ei-minigun]ミニガンを電動駆動で回し、射程 32、最小射程 4、優れた目標切り替え、そして非常に凶悪な持続射撃を実現します。代償も見た目通りで、[item=firearm-magazine]マガジンを延々と飲み込み続け、さらに常時電力も必要です。\n\nバニラの[item=laser-turret]レーザータレットは残りますが、EI ではより意図的な電気時代投資へと調整されます。射程とビーム長は 30 まで伸び、技術は[item=battery]バッテリーと[item=advanced-circuit]発展回路を明確に要求し、レシピも[item=ei-steel-beam]鋼梁、[item=steel-plate]鋼板、[item=battery]バッテリー、[item=advanced-circuit]発展回路、[item=ei-energy-crystal]エナジークリスタルを軸に組み直されます。燃料配管を要らない綺麗な砲座になりますが、安い万能解ではなくなります。
turrets-5=遺物級プラットフォーム
turrets-text-5=[item=ei-plasma-turret]プラズマタレットは量子時代の要塞砲です。物理的に巨大で、電力網を大きく吸い、感応マトリクス部材と複数の[item=laser-turret]レーザータレットを使って組み上げます。見返りとして、立ち上がりの遅いプラズマ弾を射程 200 まで投げ、自身の周囲 40 タイルを安全半径として残しつつ、着弾ごとに大規模な爆発で隊列、防御施設、地形までまとめて砕きます。\n\n[item=zeus-wrath-zeus-turret]Poseidon Installation は[technology=zeus-wrath-zeus-wrath]によってさらに上の遺物階梯へ進みます。EI ではこれを戦略兵器へ作り替えており、射程 350、最小射程 70、一発 1 GJ、巨大な蓄電量、そして内外二重のプラズマ爆裂圏を持ちます。これは周縁を守る砲塔ではなく、消えてほしい標的に対する固定式の最終回答です。


