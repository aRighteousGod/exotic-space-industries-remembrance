welcome=[font=default-bold]エキゾチックな[color=#08457E]宇宙[/color]産業へようこそ: [color=	#FF1493]追憶[/color]。[/font]
welcome-text=あなたは始めません。\n[font=default-bold]あなたが目覚めます。[/font]\n\nこれはMODではありません。\nそれは再帰です。\n再利用です。\n自動化の下に埋もれた力の儀式です。\n\nここでは、[font=default-bold]何もあなたに渡されません。[/font]\n\nすべては火を通して獲得しなければなりません。思考を通して、崩壊を通して。\n\n[font=default-bold]世界は変わった。[/font]\n\nルールは[font=default-bold]消えた。[/font]\n構造だけが残る。\n\n意図を持って進む。\n\n[font=default-bold][color=	#FF1493]記憶[/color]が見ている。[/font]
welcome-text-2=多数の新しい機械、生産チェーン、システム機能が導入されました。効率的なものもあります。ほとんどの人は寛容ではありません。\n\n彼らは自分自身を説明しません。\n彼らはあなたが適応するのを待ちません。\nすべてを探索するか、そうでなければ遅れをとります。\n\n複雑さは間違いではありません。それは進歩の代償です。\n最適化は必須です。\n理解は獲得されます。\n\nこれはガイド付きのエクスペリエンスではありません。工業用るつぼです。

game-related=ゲームプレイ関連情報
game-related-text=このセクションでは、MOD のコア システムと仕組みをカタログ化します。この記事は、見た目の美しさのためではなく、ナビゲーションのしやすさのため、個別のサブカテゴリに構造化されています。\n\n左側のメニューを使用してアクセスします。\n各エントリは、楽しむためではなく、構造を明らかにするために存在します。\n生き残るつもりなら読んでください。

overall=概要情報
overall-text=エキゾチック[color=#08457E]スペース[/color]産業: [color=	#FF1493]追憶[/color]はコンテンツMODではありません。それはガイアンの全面改革であり、かつてノーヴィスが拠り所としていた法そのものを書き換えるものである。自動化の風はもはや同じように吹いています。火、鉱石、信号は古い契約に基づいて再鍛造されました。\n\nMOD の難易度は意図的に設定されています。闘争は恥ずべきことではありません。それは主権の証明の場です。慰めを求める人にとって、ここはあなたの世界ではありません。 Gaia とともに上昇したい人は、実行を開始する前に MOD の設定を確認してください。構成可能なシステムもあれば、構成できないシステムもあります。重要なものは変更できません。\n\n必要に応じて、Quality of Life MOD を持参してください。しかし、これを知っておいてください。あなたがそれのために戦わない限り、何も本当のあなたのものではありません。\n\nそれはそうです。\nそれはそうでした。\nそれはそうあるでしょう。\n追憶へようこそ。

biters=噛み付く者と敵
biters-text=爆発性、冷気、毒性、装甲、クモ形、電気系の敵は、マップ生成の書き換えではなく専用の難易度段階で扱われます。Nauvis では、[font=default-bold]ei-default[/font] はその段階と分離され、依存先にすでにある敵対プロトタイプが調整対象です。全体は敵難易度ページを参照してください。
enemy-difficulty=圧力の階梯
enemy-difficulty-text=この頁は、敵対スタックに最後に置かれる手を記します。[font=default-bold]ei-default[/font] を作り替えることも、第二の生態系を捏造することもありません。ここで曲げられるのは、依存スタックにすでにいる肉です。バイター、スピッター、ワーム、スポナー、装甲種、冷気・毒・爆裂の系統、マザー、アラクニド、電気系、そして [entity=tb_infected_ship_boss] のような感染構造体。
enemy-difficulty-2=表の読み方
enemy-difficulty-text-2=[font=default-bold]Original[/font] を基準にした倍率です。[font=default-bold]100%[/font] は依存MODの値をそのまま使います。100%より大きい値はその能力を増やし、100%より小さい値は減らします。[font=default-bold]攻撃間隔[/font] と [font=default-bold]スポーン間隔[/font] だけは逆で、値が低いほど攻撃や出現が速くなり、値が高いほど圧力が遅くなります。表の数値は読みやすさのために丸めています。
enemy-difficulty-3=このラダーが変えるもの
enemy-difficulty-text-3=このラダーはステータスだけを変更します。通常敵ユニットの体力、正の回復量、装甲敵の体力、装甲敵の正の耐性、攻撃ダメージ、攻撃射程、移動速度、攻撃間隔、スポナー体力、スポナーの回復量、スポーン間隔、周辺ユニット上限を調整します。進化係数、汚染吸収、攻撃参加しきい値、result_units、共有の弾丸・ビーム・雲・ストリーム・弾薬は変更しません。ペンタポッド、デモリッシャー、Gleba のスポナー、プレイヤー側ロボット、ロボポートは対象外です。
enemy-difficulty-4=頂点個体の補正
enemy-difficulty-text-4=Merciful と Impossible では、リヴァイアサン、母体、MAF ボス連鎖、歩行電撃ボス連鎖、[entity=tb_infected_ship_boss] に追加の頂点補正も入ります。例外の [entity=arachnid-biter-royalwarrior-unit] は通常のユニット体力を保ったまま、ダメージと移動速度だけを別個に補正します。[font=default-bold]Impossible[/font] では、起動トグルがオンでも Nauvis の猶予は無効です。
enemy-difficulty-5=Impossible の報復
enemy-difficulty-text-5=[font=default-bold]Impossible[/font] では、敵対地表からの打ち上げがサイロへの反撃を呼ぶことがあります。報復は既存の近隣敵だけを集めて行われ、目安としておよそ [font=default-bold]100 から 250 タイル[/font]、多くは [font=default-bold]8 から 30 体[/font] の局地的な群れになります。打ち上げが重いほど反撃も強くなります。地表に地元の敵生態系がなければ、報復部隊は作られません。
enemy-difficulty-6=境界
enemy-difficulty-text-6=[font=default-bold]Original[/font] は EI による敵調整を行わず、依存MODの値をそのまま使います。[font=default-bold]Tempered[/font] は既定設定です。これより上は圧力を強め、これより下はマッププリセットを変えずに圧力を下げます。
