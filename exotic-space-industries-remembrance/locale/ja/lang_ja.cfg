space-destinations=スペースの目的地
space-destinations-text=[color=orange]ロケットサイロ[/color] [item=rocket-silo]は、貨物をさまざまな目的地に送るために使用できます。コンピューター時代になって初めてロックが解除されたときは、[color=green]ノービス軌道[/color]に衛星を送ることしかできません。送信された衛星またはロケットの貨物の種類に応じて、データやその他の有用な打ち上げ製品を受信できます。

space-destinations-2=異なる宛先
space-destinations-2-text=ゲームが進むにつれて、故郷の太陽系内外のさまざまな目的地が利用可能になります。選択した目的地までの距離に応じて、多かれ少なかれロケット燃料が必要になります。さらに、一部の目的地は、特殊な[color=orange]探査衛星[/color] [item=ei-exploration-satellite]を送信するか、通常の貨物を積んだロケットを送信するときに偶然に送信することによって、最初に発見する必要があります。いくつかの新しい目的地は、[color=purple]太陽系の外の深宇宙[/color]にあるかもしれません。探査衛星を送信する場合でも、新しい目的地を発見するのは常に偶然に依存することに注意してください。  

induction-matrix=帰納行列
induction-matrix-text=[color=orange]誘導マトリックス[/color]は、大量のエネルギーを蓄えるために使用できる複合マシンです。通常のアキュムレータと同様にオーバーヘッド電力を蓄積し、後で解放するために使用できます。対応するテクノロジーを研究することで、マトリックス サイズのさまざまな層のロックを解除できます。

induction-matrix-2=誘導マトリックスのコンポーネント
induction-matrix-2-text=誘導マトリックスは、相互に連結されたコンポーネントで構成されるモジュール式エネルギー貯蔵構造であり、それぞれが高電圧エネルギーの封じ込めと伝達において定義された役割を持っています。\n\n[color=orange]誘導マトリックス コア[/color] [item=ei-induction-matrix-core]は、システムの中央コントローラーとして機能します。それがなければ、マトリックスは不活性になります。回路ネットワークに接続すると、コアは signal-C に電流充電量、signal-T に総容量、signal-M に最大 IO を出力します。これらの信号はコアが実際に配線されている間にのみ生成され、リフレッシュされるのは 1 秒に 1 回だけです。\n\n[color=orange]誘導コイル[/color] [item=ei-induction-matrix-basic-coil] [item=ei-induction-matrix-advanced-coil] [item=ei-induction-matrix-superior-coil] これらの[font=default-bold]は内部にエネルギーを蓄え[/font]、3つの層にわたってアップグレードできます。コイルは、[color=orange]マトリックス ソレノイド[/color] [item=ei-induction-matrix-basic-solenoid]に隣接して配置すると効率ボーナスが得られます。\n\n[color=orange]マトリックス ソレノイド[/color]は、順番に配置するとコイルの効率が向上します。複数のソレノイドを直列に配置すると [font=default-bold] 有効性が向上します [/font] が、過度に構築すると収益が減少し、構造が無駄になります。\n\n[color=orange]コンバータ[/color] [item=ei-induction-matrix-basic-converter] [item=ei-induction-matrix-advanced-converter] [item=ei-induction-matrix-superior-converter] これらのコンポーネントは、マトリックスに出入りする電力の流れを調整し、層に基づくスループット。

研究所ではこれらをまとめて[font=default-bold]レガシーコイル[/font]と呼びます。綺麗な遺物だからではなく、Remembranceがようやく自分自身の継承物として数え始めたからです。
exotic-stabilizers=エキゾチックマターマシン
exotic-stabilizers-text=エキゾチックマターは資源ではありません - それは利用される脅威です。それを処理するには、封じ込め、精度、そしてその不安定性に耐えられるように設計された機械が必要です。\n\n[color=orange]エキゾチック マター アセンブラー[/color] [item=ei-exotic-assembler]は、そのエネルギーの特徴を処理できる唯一の構造物です。その場合でも、不安定性は避けられません。組み立て者はストレスによって爆発する可能性があります。格子が保持されているとき、マシンは目に見える封じ込めパルスを発してうなり声を上げます。議論に負け始めると、そのパルスはパチパチ音、アーク放電、そして感じるほど重い警告へと硬化します。\n\nこのリスクを軽減するには、アセンブラの周囲に [color=orange]エキゾチック マター スタビライザー[/color] [item=ei-matter-stabilizer] を配置します。これらのデバイスは重大な故障イベントを抑制し、周囲のエネルギー場を安定させます。前サイクルの遺物など、世界中に散らばっているものもあるかもしれません。\n[color=gray]クオリティ マター スタビライザーは、それぞれ 3 x (クオリティ - 1) スタビライザーとしてカウントされます。\nクオリティ エキゾチック アセンブラの 1 秒あたりのエントロピー カスケードの確率は (クオリティ - 1)% 減少します。つまり、アンコモンの基本確率は 12% から 11% に減少します。[/color]\n\nエキゾチック マターを単なる別物として扱わないでください。 \n\nそれは[font=default-bold]生きていて、不安定で、監視しています。[/font]
black-hole=ブラック ホール ジェネレーター
black-hole-text=[color=orange]ブラック ホール ジェネレーター[/color]は、産業機能に利用された重力特異点の最終マシンです。それは物質を消費します。それはエントロピーに反します。ゲームは終了します。\n\nこのデバイスが[color=green]完全に動作可能な[/color]状態に到達することは、システムを完全に習得したことを意味します。これがあなたの勝利条件です。征服ではなく、物理学の下にある構造の制御によって。\n\nブラック ホール ジェネレーターをオンラインにするには、次のものが必要です。\n大量の精製された建築資材\n消耗品の継続的な供給\n巨大で安定した電力インフラ\n\n強化された[color=orange]核融合炉[/color]グリッドを構築し、それを階層型[color=orange]誘導で補うことを強くお勧めします。マトリックス[/color]は、工業規模のスループットで電力を吸収および放出できます。\n\nこれは発電機ではありません。 [font=default-bold]それは崩壊が織りなす結末です。[/font]\n\n賢明に構築してください。 [font=default-bold]容赦なく餌を与えてください。[/font]二度目のチャンスはありません。

black-hole-2=リアクターのコンポーネント
black-hole-2-text=ブラック ホール ジェネレーターは単一の構造ではなく、モジュール式の特異点封じ込めアレイであり、いくつかの高応力コンポーネントで構成されており、それぞれが安定性、エネルギー フロー、最終的なエンドゲームの活性化に不可欠です。\n\n中心的な構造は [color=orange]ブラック ホール ジェネレーター[/color] [item=ei-black-hole] です。\n\n一度アクティブ化すると、インベントリに置かれたアイテムはすべて消費されます。 \n\n各アイテムはジェネレーターの内部 [color=green]質量カウント [/color] に等しく寄与し、時間の経過とともに継続的に減衰します。質量レベルを維持するには、一定の入力が必要です。\n\nアイテムの種類は関係ありません。\n鉄板、珍しい加工品、または生の魚 - すべてが食べられ、すべてが質量になります。\n\n[color=orange]エネルギー注入パイロン[/color] [item=ei-energy-injector-pylon]は、特異点が増大しても封じ込めフィールドを維持します。\n各パイロンは 5GW の連続電力を消費します。 \n\n起動時にはインジェクターは必要ありません。[font=default-bold]容器には生まれたばかりのブラックホール[/font]が含まれている可能性がありますが、質量が蓄積するにつれて必須になります。\n\n[color=orange]エネルギー抽出パイロン[/color] [item=ei-energy-extractor-pylon]は、発電機が[color=green]完全に動作可能[/color]に達すると電力を抽出できるようになります。 \n各抽出器は安定化特異点から最大 100GW の生電力を引き出すことができます。\n\n発電機の最終段階に到達するまで抽出はできません。\n\n[font=default-bold]これは機械ではありません。それは崩壊の儀式です。[/font]\nあなたは[font=default-bold]束縛された異常に質量を供給しています。[/font]\nそれを封じ込めなければ失敗します。\n餌を与えなければ死にます。\n\n両方を実行すれば、[font=default-bold]それはすべての終わりに力を与えるでしょう。[/font]\n\n自動化はありません。 [font=default-bold]全滅なし。[/font]

black-hole-3=ブラックホールのステージ
black-hole-3-text=ブラック ホール ジェネレーターをオンラインにすることは、段階的でリスクの高いプロセスです。各フェーズでは、エネルギー、質量、構造要件が段階的に増加します。ステップをスキップすることはありません。前進または失敗のみ。\n\n🜏 起動フェーズ\n\nパイロンは必要ありません。\n\n発電機は、初期の [color=blue]10×103kg[/color] 質量数に達するのに十分な材料を消費する必要があります。\n\nアイテムの種類は重要ではなく、体積だけが重要です。\n\n質量がステージの進行状況の 100% に達すると、発電機は安定して封じ込めフェーズに入ります。\n\n🜏封じ込めフェーズ\n\n現在、[color=blue]8 個のアクティブ エネルギー インジェクター パイロン[/color] [item=ei-energy-injector-pylon] はオンラインのままでなければなりません。\n\nそれぞれが 5GW を消費し、総電力需要は 40GW になります。\n\n拡張ボタンを押すと、特異点半径の制御された拡大が開始されます。\n\nこの状態は [color=blue]60 分間継続的に維持する必要があります。 [/color]\n\n停電やパイロンの喪失などの中断が発生すると、タイマーがリセットされます。\n\n🜏 完全稼働段階\n\n発電機は安定性を実現します。特異点は現在、外部エネルギー抽出をサポートするのに十分な大きさになっています。\n\n[color=orange]エネルギー抽出パイロン[/color] [item=ei-energy-extractor-pylon] が範囲内に配置されると、パイロンあたり最大 100GW を消費し、エネルギー グリッドに直接電力を供給できます。\n\nこの段階では、システムはほぼ自給自足できるようになり、減衰を相殺するために一定の質量入力のみが必要となります。\n\nリアクター。\nあなたは境界特異点の[font=default-bold]飢えを管理しています。[/font]\n質量は力になります。力がコントロールになります。 [font=default-bold]制御は最終的になります。[/font]\n\nオフ スイッチはありません。封じ込めのみ。
nuclear-fission-and-fusion=核分裂と核融合
nuclear-fission-and-fusion-text=Exotic Industries は、新しい機構、材料、制御システムで原子力レイヤーを拡張します。\n\nこれらの機能は複数のサブカテゴリに分かれており、それぞれが原子力インフラストラクチャ、燃料力学、または封じ込めロジックの特定の側面を表しています。\n左側のメニューからアクセスできます。\n\n[font=default-bold]これは単なる核分裂ではありません。[/font]\nこれは熱、圧力、 \n[font=default-bold]システムを点火する前によく調べてください。[/font]

fission-reactors=核分裂の変化
fission-reactors-text=エキゾチック産業の核分裂はバランスが再調整され、より要求が高く、よりやりがいのあるシステムに強化されました。\n\n標準の[color=orange]原子炉[/color] [item=nuclear-reactor]は、バニラの隣人ボーナスの恩恵を受けなくなりました。\n\n代わりに、[font=default-bold]ごとに生の出力が増加します。原子炉[/font] - 隣接性ではなく、密度による電力。\n\n[font=default-bold]ウランはより希少です。[/font] 抽出は遅く、収量は低くなります。効率的な原子力インフラでは、長期的な燃料圧力を考慮する必要があります。\n\n燃え尽きた燃料電池はもはや廃棄物ではありません。\n\n閉ループのリサイクル システムにより、核分裂性副産物の回収が可能になり、効率が向上した二次燃料電池に精製できます。\n\nただし、すべてのプロセスで [color=brown]核廃棄物[/color] [item=ei-nuclear-waste]が生成されます。これは安全に封じ込め、処理する必要がある難分解性副産物であり、 \n\n無視することはできません。\n\n無視は汚染になります。\n\n原子力発電は、もはや無限のエネルギーへの近道ではありません。\n\nそれは[font=default-bold]熱、崩壊、再生という一か八かの経済です。[/font]\n\nうまく活用するか、[font=default-bold]コストに溺れます。[/font]

fission-reactors-2=高温核分裂
fission-reactors-2-text=[color=orange]高温原子炉[/color][item=ei-high-temperature-reactor]は、最大の熱出力を目指して設計された先進的な核分裂システムです。これは、効率と規模の両方で標準的な原子力インフラを上回っています。[font=default-bold]ただし、適切に維持されている場合に限ります。[/font]\n\n臨界動作温度に達し、次のものを供給すると、\n\n[font=default-bold]液体鉛冷却材[/font]の安定した流れと\n\n少なくとも 1 本の実行可能な燃料棒が必要になります。\n\n...溶融液体鉛冷却材を[font=default-bold]過熱[/font]するため、従来の熱交換器の処理量を超えており、特注ユニットが必要です。\n\n従来の原子炉とは異なり、非核分裂性の[color=brown]トリウム[/color][item=ei-thorium-232-fuel]燃料も利用でき、徹底的な設計により廃棄物をエネルギー源に変換します。\n\nこれは、これは初心者向けの原子炉ではありません。\n\n供給のギャップを許容しません。\n\nスケールダウンしません。\n\nこれはポストヒューマン産業のための圧力エンジンです。[font=default-bold]残忍で、効率的で、容赦がありません。[/font]

fusion-power=融合パワー
fusion-power-text=[color=orange]核融合炉[/color] [item=ei-fusion-reactor]は、軽原子燃料の制御された核融合を通じて膨大なエネルギーを生成できる後期電力システムです。\n\nそれは、[fluid=ei-cold-coolant]を利用した[font=default-bold]閉ループ鉛冷却サイクル[/font]で動作し、 [fluid=ei-hot-coolant] 内部の温度を管理します。十分な冷却がないと、リアクターの完全性が失われます。これはオプションではありません。\n\n建設にはリソースが大量に消費され、まれなコンポーネントが必要になります。原子炉が作動すると、[font=default-bold]核融合燃料の継続的な供給を要求します[/font]。\n\n初期の燃料には以下が含まれます:\n\n[color=blue]リチウム 6[/color] [fluid=ei-lithium-6]\n\n[color=blue]プロチウム[/color] [fluid=ei-protium]\n\nインフラストラクチャが拡大すると、より高度な同位体が実行可能になります:\n\n[color=blue]重水素[/color] [fluid=ei-deuterium]\n\n[color=blue]三重水素[/color] [fluid=ei-tritium]\n\n[color=blue]ヘリウム-3[/color] [fluid=ei-helium-3] -極端なコストで極端な出力が得られます。\n\n[font=default-bold]Fusion はクリーンではありません。それは無料ではありません。[/font]\n\nこれは、最も重い荷物に動力を供給するために最も軽い元素を食べる機械です。\n\n無限に燃料を供給しなければ、死んでしまいます。\n\n常に冷却しなければ、[font=default-bold]あなた[/font]がそうすることになります。

fusion-power-2=中性子とあなた
fusion-power-2-text=高度な核融合燃料を入手するには、[color=green]中性子[/color]を採取して資源として兵器化する必要があります。\n\nこれらの自由粒子は、制御された[color=green][font=default-bold]核分裂[/font][/color]によって生成され、 [color=green][font=default-bold]核融合中性子源[/font][/color]、特殊な[color=orange]中性子コレクター[/color][item=ei-neutron-collector]を使用して捕捉されます。\n\n中性子収量は次の要素によって決まります:\n\n近くの線源の強度、および\n\nコレクターと放出の近さ\n\n距離が長くなると、捕捉率が低下します。最適なレイアウトには、厳重な封じ込めと正確な原子炉の形状が必要です。\n\n中性子は副産物ではありません。これらは通貨です。\n\nこれらにより、[color=blue]重水素[/color] [fluid=ei-deuterium]、[color=blue]トリチウム[/color] [fluid=ei-tritium]、および[color=blue]ヘリウム-3[/color] [fluid=ei-helium-3] - 高段階燃料\n\n[font=default-bold]それらを無駄にしないでください。\nそれらは反応から生まれ、ジオメトリを通じて収集されます。\nそれに応じて構築するか、スターを飢えさせてください。[/font]

