[entity-description]
ei-auric-fumarole=過熱蒸気と鹹水にすでに金を溶かし込んだまま噴き出す Vulcanus の噴気孔。タングステン炭化物の析出核が喉を目覚めさせ、砂滓を締め上げ、継ぎ目が再び閉じる前に含金凝縮物を析出させる。
ei-gatling-turret=消耗への回転賛歌。 「ここには何も横切らない」と宣言するほど発射はしません。樽が回転し、空気は真鍮の天気に変わり、地面は衝撃で作られた新しい言語を学びます。常に食料を供給するという代償を払って、戦線を維持します。\nこれはあなたが「供給」する武器ではありません。\nこれは十分の一を納める武器です。\n機能するには[color=cyan]電力[/color]が必要です。
ei-auto-shotgun-turret=醜い距離を走るために作られたコンパクトなモーター駆動の二連砲塔。ショットガンの砲弾を高いリズムで噛み砕き、通路を浸水させ、散弾パターンでチョークポイントを浸水させ、ラッシュをスクラップに変えます。素早いターゲットの切り替え、積極的な追跡、そして激しい反動補正を機能させるには[color=cyan]電気[/color]が必要ですが、その結果は、あえて近づく者を罰する容赦ない破壊の雹嵐となります。
ei-steampunk-lamp=[color=green]灯油[/color][fluid=ei-kerosene]を燃焼させることで、[color=orange]暖かい[/color]、点滅する光を発します。\n燃料を継続的に消費します。
ei-shotgun-turret=距離が足りない場合、これが解決策です。\n警告せず、見逃さず、ためらうこともない近距離抑止力です。\nそこに到達したものはすでに間違いを犯しています。
ei-copper-beacon=部分的な極低温制約下での信号位相同期の実装に初めて成功しました。サブゼロ フェーズ アレイ ビーコンは、液体窒素を活用して生産マトリックス内のエントロピー ノイズを低減する、局所的フィールド投影における記念碑的な一歩です。\nこのテクノロジーは、短距離製造ノード全体で基本信号のコヒーレンスを安定させ、熱負荷の高い環境によくある無秩序な位相干渉を発生させずに、同期した生産性サイクルを可能にします。増幅能力は限られていますが、真の低温信号エンジニアリングの重要な基盤となります。\n[color=gray]「ノイズを固定し、意図を安定させます。」[/color]
ei-iron-beacon=この進歩により、ビーコン アレイは単なる氷点下規制を超えて、熱エネルギーの理論的下限に到達し、時間に依存しない物質の不可逆的な限界に近づきます。絶対零度フェーズ アレイは、物質が意図を伝達するためだけに存在する量子格子ロック ポイントの近くで動作します。\n強化されたサーマル コアと二段階窒素循環システムを利用することで、これらのビーコンは周囲のエントロピー フィールドを無効にすることができ、比類のない純度で生産性の高いスループットを実現します。これは改良ではありません。これは、熱、干渉、妥協からの断絶です。\n[color=gray]「絶対零度では、疑いさえも揺り動かされません。」[/color]
ei-burner-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-steam-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-electric-quarry=非常に大容量の抽出複合体 — 局所的な汚染を犠牲にして最大のスループットと収量を実現するように最適化されています。膨大なエネルギー貯蔵量を消費し、広大な掘削跡で地形に傷を残します。 [color=gray]54% の資源収量増加[/color]で動作し、無慈悲なスピードと最大限の回復力で鉱床を剥ぎ取ります。
ei-cannon-turret-mk1=シンプルなドリルバレルで、洗練されたものは取り除かれた生の火力。
ei-cannon-turret=バレルが 2 つ、シャーシが 1 つ。スループットが 2 倍、ノイズが 2 倍になります。\n[color=gray]連射メカニズムと高度なターゲット ソリューションが機能するには、[/color] [color=cyan]電力[/color] [color=gray]が必要です。[/color]
ei-acidthrower-turret=敵を骨まで溶かすことができるのに、貴重な油を火で無駄にする必要はありません。火炎放射器のグロテスクないとこであるこの装置は、ノズルから悲鳴を上げるまで[color=green]酸[/color]を加圧します。その結果、非常に腐食性の高い霧が発生し、燃えることはなく、消えてしまいます。構造物は腐食し、甲羅は溶解します。残ったものは、シャベルを食い荒らされる前に、すぐにかき集めるのが最善です。
ei-burner-inserter=このインサーターは燃料を燃焼させてアイテムを移動します。抽出元の機械から[color=orange]可燃性燃料[/color]を引き出すことができます。
ei-camp-fire=かろうじて灯台、むしろ死ぬことを拒否する頑固なろうそくです。このキャンプファイヤーの仕掛けは、明るさではなく、まったくの大胆さによって光を提供します。与えたものは何でも燃やし、その後は礼儀正しくさらに要求します。
ei-bio-reactor=意識のある組織によって駆動される生きた原子炉。\n死体ではなく、まだ考えているバイオマス。\n神経格子は腫瘍のように成長し、骨の足場に張り巡らされ、周期的に夢を見るのに十分なだけ生き続けている。\nそれは燃料を燃やすのではなく、アイデンティティを燃やす。\n痛みは電圧に変換される。記憶をエントロピーに。\nすべての叫び声はフィードバックの急増です。祈りごとに電圧が急上昇します。\n空腹になればなるほど、心の中の心はより明晰になります。\n[color=gray]機能するには[/color] [color=purple]0.1/秒の生体物質[/color][item=ei-bio-matter] [color=gray]が必要です。[/color]
ei-warp-beacon=[color=purple]ビーコンの過負荷の影響を受けません。[/color]\n[color=gray]機能するには 60[item=ei-bio-matter]/秒が必要です。[/color]
ei-alien-beacon=[color=purple]ビーコンの過負荷の影響を受けません。[/color]\n[color=gray]機能するには 30[item=ei-bio-matter]/秒が必要です。[/color]
ei-exotic-assembler=従来の製造者が暗記的に原子を配置するのに対し、エキゾチック アセンブラーは物質を、存在するはずのない構成に曲げます。重兵器に動力を供給するのと同じ量子プラズマ原理を利用することで、冶金学を超えた合金、真空共振を伴う回路、幾何学形状自体が禁断の対称性を奏でるアーティファクトなど、遺物層のコンポーネントを鍛造します。\nアセンブラーのコア反応チャンバーは[color=red]激しく不安定で[/color]、それぞれの量子崩壊が爆発に至る恐れがあります。自社の作品に匹敵します。 [color=purple]物質安定剤[/color]（重力ダンパーとエントロピーサイフォンの格子）で囲むことによってのみ、その変動性をかろうじて制限することができます。 [color=gray]1秒あたりの変動確率は12% - (品質 - 1)%で、周囲の物質安定剤によって軽減できます。[/color]
ei-plasma-turret=封じ込められたスターファイアの不安定な優雅さを利用するように設計されたレリックグレードの武器プラットフォーム。粗雑な発射体の代わりに、タレットは量子安定化コイルを通してプラズマを送り、生の恒星エネルギーを紫色の輝きの密な球体に凝縮します。
ei-high-temperature-reactor=従来のエネルギーの限界を超え、高温炉は生の電力と容赦ない磁束のるつぼとして立っています。外部の原子炉から地獄の息を吸い込み、外科的精度で外部の熱を溶けた心臓に送り込みます。この燃え盛る炉内では、挿入された核分裂性燃料棒がアトミックダンスのシンフォニーに点火し、熱出力を増大させて過熱した鉛冷却剤の奔流を生み出します。
ei-beacon=かつては同期フィールド投影の頂点であったこのビーコン モデルは、現在ではそのレガシーの重みでよろめきつつあります。その放射格子は粗く、位相高調波は時代遅れですが、それでも耐え、もはや耳を傾けない世界に信号を脈動させ続けています。\nスループットが神であり、共鳴が力ずくで行われていた時代に構築され、現在は楽器というよりも人工物として機能しています。その中核は一貫性を維持するのに苦労し、崩壊する前に規制の基準をかろうじてすり抜けています。\nそれでも、重要です。それは*思い出します*。そして、過負荷の集計では、その負荷も同様に集計されます。\n[color=gray]「効率の幽霊は錆びた足場にも付きまといます。」[/color]\n過負荷に対するビーコンは [color=orange]1[/color] としてカウントされます。
ei-mechanical-inserter=ゼンマイ神の恵みで動く。ワイヤーはありません。 \n単純な天才から生まれました。数学に疑問を持たなければ、永遠に回転します。
ei-mechanical-long-inserter=熱力学的否定の長い腕。それは魔法ではありません。バランスです。\nエントロピーを丁寧に無視して、距離を越えて移動します。
zeus-wrath-zeus-turret_alt=陸に固定されず、神にも誓っていないポセイドン・インスタレーションは、すべての海の下に忘れ去られた電荷を導きます。それは軌道からスカイファイアを呼び下ろす――判断は空気によってではなく、空気を通して下される。一度配置されると、それは保護するのではなく、世界に[font=default-bold]警告[/font]します。嵐が見ているのです。
ei-cargo-bot=記念碑的。ストイック。工場の背骨を担っています。\n止まるつもりはなかったかのように動きます。
ei-construction-bot=正確です。キネティック。信号が減衰する前に構築サイトに到達します。\n構築ではなく、構造で現実を突き破ります。
ei-advanced-logistic-bot=沈黙。広範囲に及ぶ。思ったより速い。\n存在すら知らなかった距離を越え、ペイロードを積んで戻ってくる。
ei-advanced-construction-bot=ビルダーではなく、メモリ エンジンです。\nデザインは構築されません。それらは存在として記憶されます。
nuclear-reactor=ウラン燃料棒または燃料電池を使用して熱を生成します。他の原子炉の隣に建設しても熱出力は増加しません。
ei-crystal-accumulator=クリスタルはエネルギーを放射します。長時間不安定なようで、マイニングするとデバイスが壊れてしまいます。 
ei-crystal-accumulator-gaia=クリスタルはエネルギーを放射します。長期間安定して使えそうです。

[fluid-description]
ei-auric-vapor=溶存した金と鉱物痕跡を運ぶ過熱蒸気。炭化物析出核を通してろ過すると、高熱蒸気と含金スラグを得られる。
ei-auric-condensate=溶存した金と鉱物痕跡を運ぶ過熱蒸気。冷却・ろ過・制御を経ることで、高熱蒸気と地殻が最初から隠していた貴重な残滓を生み出す。
ei-computing-power-chemical=シミュレーションから収集されたデータは、残留物と観察者の知覚との相互作用によって不安定化しました。それは単なるカオスではなく、記号波形にエンコードされた主観的な矛盾です。物質的なアンカーを必要としない心のモデリングに役立ちます。
ei-computing-power-organic=データは、本物か捏造かにかかわらず、死につつある生物圏から収集され、再帰的な生と死のループの重みで崩壊します。すべてのサイクルで、極限惑星モデリングやポスト生物学的テラフォーメーション ロジックに役立つエントロピー ミラーリング出力が生成されます。
ei-computing-power-stone=シミュレーターは、鉱石の行動の拒否に耐えることによって価値を抽出します。結果には、FTL バリア モデリングやビッグバン以前の物理プロトタイプにとって重要な、歪んだ密度、逆転した慣性流、不可能な物体軌道のシミュレーションが含まれます。
ei-computing-power-uranium=シミュレーションすると、ゴーストシェルは死相の宇宙論を環境に注入し、崩壊する星核、失敗したエントロピー反転、宇宙が時期尚早に折り畳まれるタイムラインからデータを生成します。
ei-computing-power-petrified=緊張下のパラドックスから抽出。化石の存在により、シミュレーションが過去の反復に折り重なり、再帰的なエラーベクトルが生成されます。出力は、失敗したすべての先物とその崩壊の兆候を忠実に合成したものです。崩壊の予測や安定したパラドックスの設計に役立ちます。
ei-computing-power-scrap=到達不可能な未来、別のタイムライン、または完全に滅んだ文明からの誤った送信が含まれています。シミュレーションでは、壊れることなくそれらを解析することはできません。エラー自体は生データになり、カオス的なビット崩壊で定量化できます。情報理論を武器にするためには必須です。

