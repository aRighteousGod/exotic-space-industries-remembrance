ages-and-tech=テクノロジーの時代
ages-and-tech-text=Exotic Industries は研究費を vanilla のような単なる平坦な段差にしません。この mod は [font=default-bold]開始価格[/font]、[font=default-bold]曲線の形[/font]、そして名前付きの[font=default-bold]上限[/font]から研究費を作り、その圧力を技術ツリー全体に分散させます。[font=default-bold]linear[/font] は均一に伸び、[font=default-bold]quadratic[/font] は序盤をやわらげて終盤を強くし、[font=default-bold]exponential[/font] は序盤がかなり穏やかで後半に鋭く跳ね、[font=default-bold]age-ramp[/font] は後半の時代へ負荷を寄せます。\n\n時代の門は枝を開く役目を持ち続けますが、スケーリングは細い突貫をどれだけ厳しく罰するかを決めます。既存の技術重み付けライブラリもそのまま使うため、割引された技術は軽く扱われます。
tech-2=起動設定が実際に制御するもの
tech-text-2=[font=default-bold]開始価格[/font] は曲線の始点付近でのサイエンスパック単価です。[font=default-bold]上限[/font] は遠方側の各パックの目標帯を Sunday stroll から Very Expensive まで選びます。[font=default-bold]曲線の形[/font] には age-ramp も含まれ、より多くの費用を後半の時代へ送ります。[font=default-bold]追加乗数[/font] は曲線評価後に最終結果へ掛かります。\n\n選んだ上限が Factorio の [font=default-bold]x1000[/font] 上限に触れる場合でも、ESIR は必要に応じて隠し有効開始価格を自動で引き上げ、より高い上限を届く形のまま保ちます。\n\nEI を別バランスにしたいなら、vanilla の研究倍率ではなくこれらの内部設定を使ってください。この mod は進行のこの部分を自分で管理する想定で、vanilla の倍率は同じ形を表していません。
tech-3=実用上の上限と途中変更
tech-text-3=名前付きの[font=default-bold]上限[/font]は、それ単体では絶対保証ではありません。Factorio は内部の研究価格乗数を [font=default-bold]x1000[/font] で制限するため、実際のゲーム内上限は今でも [font=default-bold]開始価格[/font] に結び付いています。ESIR は必要に応じて隠し有効開始価格を自動で引き上げるので、より高い上限でも表現できるようになりました。\n\n[font=default-bold]追加乗数[/font] は既存セーブでもっとも安全に調整できる値です。ゲーム開始後に [font=default-bold]開始価格[/font] や [font=default-bold]曲線の形[/font] を変えると、望ましくない結果になる場合があります。
tech-output=現在の年齢の進行状況
tech-output-text=アクティベーションを待っている次の年齢は [font=default-bold]__3__[/font] です。現時点で、[font=default-bold]__1__ / __2__[/font] パーセントが、しきい値を通過するために必要な知識を明らかにしています。\n\n[font=default-bold]前進するか、過去に縛られたままになります。[/font]


world-gen-related=世界関連情報
world-gen-related-text=このセクションでは、MOD によって導入されたワールド生成システムの概要を説明します。構造を明確にするために、重点を置いたサブカテゴリーに分割されています。\n\n左側のメニューからアクセスしてください。\nこれらは表面的な変更ではありません。\nこれらは、基礎レベルで地形、リソースの動作、空間ロジックを定義します。\n\n[font=default-bold]レイヤーを理解するか、レイヤーによって形成されます。[/font]


resources=新しいリソース システム
resources-text=Exotic Industries は、再構築されたリソース システムを実装しています。従来の鉱石パッチはもはや唯一の入手方法ではありません。資源は個別のカテゴリに分割され、それぞれが独自のロジック、生産フロー、空間的動作によって管理されています。\n抽出はもはや簡単ではありません。\n[font=default-bold]入手には適応が必要です。[/font]\nカテゴリを理解しなければ、何も生産されません。

stone=石
stone-text=石は星系内で最も豊富な資源です。従来通り地表パッチから抽出できますが、エキゾチック インダストリーズはその取得経路を拡大しています。\n\n[color=orange]地表収穫機[/color] [item=ei-burner-surface-harvester]により、あらゆる地形からの深部抽出が可能です。\n\n[font=default-bold]非効率ではありますが、手作業での収集は引き続き可能です。[/font]\n石はどこにでもあります。\n効率はオプションです。出力はありません。

surface-patches=表面パッチ
surface-patches-text=Nauvis の表面は均一ではありません。着陸ゾーンの周囲では、地殻は保護された産業保護区として今も保たれています。[item=ei-poor-iron-chunk]鉄、[item=ei-poor-copper-chunk]銅、[item=coal]石炭、[item=stone]石、そして近くの[fluid=crude-oil]の圧力は第一次産業を見つけるのに十分な強さを保っています。\n\nその揺りかごを越えると、表面は崩壊します。 [item=ei-poor-iron-chunk]鉄、[item=ei-poor-copper-chunk]銅、さらには[item=ei-poor-uranium-chunk]ウランは、ほとんどが浅い残骸、断裂帯、消耗した傷跡フィールドとして残っています。それらは本物ですが、耐久性のある金属経済ではありません。\n\n石炭、石、石油は依然としてノーヴィスの作業領域です。予備を使用して、熱、ベルト、化学反応を確立します。それから土地を正しく読んでください、そうでなければ地殻はあなたに嘘をつきます。

veins=深い鉱脈
veins-text=鉱脈は最初はアクセスできません。これらには、垂直収量を目的として構築されたゲーム中盤の抽出システムである [color=orange]ディープ ドリル[/color] [item=ei-deep-drill] が必要です。\n\nこれらの鉱脈は、一般的なレアリティ ロールとして生成されなくなりました。構造金属はノーヴィス全域の[font=default-bold]金属帯[/font]と[font=default-bold]堆積盆地[/font]に続きます: [item=ei-iron-chunk]鉄と[item=ei-copper-chunk]銅は尾根地帯に有利ですが、[item=ei-coal-chunk]石炭と[item=ei-sulfur-chunk]硫黄は盆地下部にあります。地形。\n\n[font=default-bold]熱水フロンティア[/font]は、保護された開始領域を越えて[item=ei-lead-chunk]鉛と[item=ei-gold-chunk]金を運びます。 [font=default-bold]外側のスカーランド[/font]には[item=ei-uranium-chunk]ウランが存在し、これらの壊れたゾーン内の最も稀な異常ポケットのみが[item=ei-neodym-chunk]ネオジムを露出させています。\n\n重要な物質（ウラン、鉛、金、ネオジム、イマーサイトなど）は、これらの深層にのみ存在します。\nそれらはオプションではありません。\n構造。\n\n[font=default-bold]地表採掘では終盤までは進めません。[/font] 掘削するか、土地を読むか、停滞するかです。

chunk-grades=低品位チャンクと良質チャンク
chunk-grades-text=すべてのチャンクが同じ価値を持つわけではありません。[item=ei-poor-iron-chunk]低品位の鉄塊と[item=ei-poor-copper-chunk]低品位の銅塊は、砕けた表層地殻に残った浅く汚れた残り物です。産業の立ち上げには役立ちますが、長期の金属経済を支えるには向いていません。品位の低さは精錬結果にはっきり表れます。[font=default-bold]低品位チャンク 3 個 -> 板材 1 枚[/font]しか得られず、しかもスラグも多く出ます。\n\n深部鉱脈から得られる[item=ei-iron-chunk]鉄チャンクと[item=ei-copper-chunk]銅チャンクこそ、本物の鉱体です。追加処理なしでも、[font=default-bold]良質チャンク 3 個 -> 板材 2 枚[/font]になり、スラグ負担もずっと軽くなります。[item=ei-poor-uranium-chunk]低品位ウランも同じで、地表にあるのは手掛かりにすぎず、本当の[item=ei-uranium-chunk]ウランは深層にあります。
chunk-refining=浄化装置と純鉱
chunk-refining-text=[item=ei-purifier]浄化装置は、チャンクをただ受け入れるだけでなく、実際に品質を引き上げてくれる最初の機械です。[fluid=water]水で[item=ei-iron-chunk]鉄チャンクと[item=ei-copper-chunk]銅チャンクを洗浄し、[item=ei-pure-iron]純鉄または[item=ei-pure-copper]純銅に変え、その代わりに処理が必要な[fluid=ei-dirty-water]汚水を返します。\n\nこのひと手間には十分な価値があります。[font=default-bold]低品位チャンク 3 個 -> 板材 1 枚[/font]、[font=default-bold]良質チャンク 3 個 -> 板材 2 枚[/font]ですが、[font=default-bold]純鉱 1 個 -> 板材 2 枚[/font]で、しかも[font=default-bold]スラグ発生率はおよそ 1%[/font]まで下がります。深部チャンクが金属経済の土台を作り、浄化がそれを密度の高い、クリーンな工業生産へ押し上げます。
chunk-refining-2=アーク炉とプラズマヒーター
chunk-refining-text-2=[item=ei-arc-furnace]アーク炉は、チャンク処理を本格的な冶金工程へ変えます。チャンク、純鉱、板材、部品を[fluid=ei-molten-iron]溶融鉄や[fluid=ei-molten-copper]溶融銅に変え、鋳造ラインへ送り込めます。低品位チャンクでも動かせますが、数字を見るとそこで満足すべきではありません。[font=default-bold]低品位チャンク 3 個では溶融金属 15[/font]しか得られませんが、[font=default-bold]純鉱 1 個なら 40[/font]を生み、スラグもほとんど出ません。\n\n[item=ei-plasma-heater]プラズマヒーターは、この流れを量子時代まで引き継ぎます。アーク炉の金属レシピを引き続き扱えるうえ、超高温のガス処理とプラズマ工程も開きます。浄化装置が原料を改善し、アーク炉が冶金を押し上げ、プラズマヒーターがその流れ全体を後期まで運びます。
mining-scars=鉱山の傷跡
mining-scars-text=堆積物を使い果たしても、地形が手付かずのまま残されることはなくなりました。 Exotic Industries は、抽出終了時に近くの地面に傷を付けることができますが、これは [item=ei-burner-quarry]、[item=ei-steam-quarry]、[item=ei-electric-quarry]、および [item=big-mining-drill] に限ります。効果は地形ダメージであり、ボーナスのリソースパルスではありません。
mining-scars-2=惑星の劣化
mining-scars-text-2=傷跡は惑星固有の連鎖に沿ってタイルを劣化させます。Nauvis の草は土と砂に崩壊し、Fulgora の岩は砂、塵、砂丘に脱落し、Gleba は腐敗し、Vulcanus 炭化物になり、Aquilo は雪と氷を圧縮します。水タイルと隠されたタイルは無視され、一致する装飾は取り除かれます。\n\nT傷跡を、そこから何を取り出したかを記憶する地図として扱います。
asteroid-variants=分化した小惑星
asteroid-variants-text=Exotic Industries は、バニラの宇宙ゴミの上に 6 つの追加の小惑星ファミリー ([item=ei-chemical-asteroid-chunk]、[item=ei-organic-asteroid-chunk]、[item=ei-rock-asteroid-chunk]、[item=ei-uranium-asteroid-chunk]、[item=ei-petrified-asteroid-chunk]、および [item=ei-scrap-asteroid-chunk]) を追加します。それらは惑星ルートに階層化され、[entity=crusher] で粉砕され、12 の基本および高度な EI 小惑星レシピすべてが、[font=default-bold]小惑星生産性[/font].\n\nから恩恵を受けています。クラッシャーはまた、これらの混合出力に適合するように流体ポートとより大きな結果在庫で拡張されています。
chemical-asteroid=化学小惑星
chemical-asteroid-text=[font=default-bold]planet Discovery を通じてロック解除されました: Aquilo[/font]。基本および高度な粉砕では、チャンクから [fluid=ammonia]、[item=ei-fluorite]、および [fluid=fluorine] をプルしますが、高度なレシピでは、さらに [fluid=lithium-brine] をロールできます。彼らの稀な異常は [item=ei-neuro-reactive-residue] です。
organic-asteroid=有機小惑星
organic-asteroid-text=[font=default-bold]planet Discovery を通じてロック解除されました: Gleba[/font]。基本的な破砕では [fluid=water] が消費され、[item=spoilage]、[fluid=ei-bio-sludge]、および [fluid=ei-ammonia-gas] が生成されます。アドバンスト パスでは [item=nutrients] が追加され、[item=yumako]、[item=jellynut]、[item=ei-bio-matter]、さらには珍しい [item=pentapod-egg] を返すことができます。彼らの異常は [item=ei-sporeglass-heart] です。
rock-asteroid=岩石小惑星
rock-asteroid-text=[font=default-bold]planet Discovery を通じてロック解除されました: Vulcanus[/font]。基本レシピはほぼ[item=stone]です。高度なレシピでは、より豊富なミネラル層、[item=tungsten-ore]、[item=calcite]、および [item=ei-gold-chunk] が開きます。彼らの異常は[item=ei-gravity-braided-ore]です。
uranium-asteroid=ウラン小惑星
uranium-asteroid-text=[font=default-bold]宇宙プラットフォーム[/font]の研究により差別化されたフィールドへのアクセスが可能になるとすぐにロックが解除されます。どちらのレシピも [fluid=sulfuric-acid] を消費します。その見返りとして、それらは [item=stone]、[item=ei-uranium-chunk]、および [item=ei-lead-chunk] を生成します。高度なレシピでは、より強力なウランを得るためにより多くの酸を費やします。彼らの異常は [item=ei-isotopic-ghost-shell] です。
petrified-asteroid=石化した小惑星
petrified-asteroid-text=[font=default-bold]スペースプラットフォーム[/font]でもロック解除できます。基本的な粉砕では、[item=wood]、[item=raw-fish]、[fluid=ei-liquid-nitrogen]、および [fluid=ei-liquid-oxygen] が奇妙な組み合わせで生成されます。アドバンスパスでは [item=bioflux] と [fluid=fluoroketone-cold] が追加され、生物学的ロールが改善され、[item=biter-egg] での小さなチャンスも可能になります。彼らの異常は[item=ei-chrono-fossil-shard]です。
scrap-asteroid=小惑星をスクラップする
scrap-asteroid-text=[font=default-bold]planet Discovery を通じてロック解除されました: Fulgora[/font]。これらのレシピはスクラップリサイクルテーブルに組み込まれているため、それらの破砕は単一の鉱石のレシピではなく回収の流れになります。どちらの層も [item=ei-crushed-neodym] ロールを保持しており、両方とも [item=ei-worm-torn-relay-core].\n\n を公開することはめったにありません。軌道上のジャンクを工場在庫に変えたい場合は、これがルートです。
asteroid-anomalies=宇宙データへの異常
asteroid-anomalies-text=差別化された小惑星群には、それぞれ1つの異常物が隠されています。これら6種の異常アイテムは専用の[entity=ei-computer-core]レシピに使われ、シミュレーター内でデータカードとなり、最終的には[item=ei-space-data]へ再構成され、その処理は無重力下で[entity=ei-quantum-computer]によって行われます。\n\n小惑星帯は単なる原料源ではありません。そこは第二の研究フロンティアです。
fulgora-day-variation=Fulgora 日長バリエーター
fulgora-day-variation-text=Fulgora では、1日の長さは固定されません。各サイクルの開始時に、MOD は起動設定の最小倍率と最大倍率を使って[font=default-bold]昼夜サイクルの長さ[/font]を再抽選します。デフォルト設定では、Fulgora の各日が標準サイクル長の [font=default-bold]10% から 200% [/font] のどこかに収まることを意味します。
fulgora-day-variation-2=リセマラが適用される場合
fulgora-day-variation-text-2=リロールは明るく安定した光の窓の間に行われるように試行されるため、深い暗闇の中でサーフェスが新しいサイクル長にスナップすることはありません。 Fulgora が安全なウィンドウを提供しない場合は、フェールセーフによって、いずれにせよ、標準的な約 1 日後に変更が強制されます。\n\n 起動設定によってエンベロープが定義されます。実際の毎日は、その中で独自のランダムな長さを選択します。

artifacts=エイリアンの遺物
artifacts-text=古代文明の残骸が世界中に点在しており、あなた方が到着するずっと前にエキゾチックな物質を利用していた文明です。彼らのアーティファクトは、地形に埋め込まれ、部分的に埋もれ、部分的に生きたまま残ります。\n\n一部は不活性です。\n一部はまだ機能します。\nどれも偶然ではありません。
actifacts-text-2=それらは配置されませんでした。 [font=default-bold]彼らは意図的かどうかにかかわらず置き去りにされました。[/font]見つけてください。勉強してください。それらが暗示しているものを恐れてください。

gate=異次元ゲート
gate-text=ゲートは、制御された次元裂傷を通してアイテムを運ぶ空間転送構造です。\n\n各ゲートは、生の座標ではなくレシーバー ID に結び付けられます。送信側コンソールがレシーバーを選び、受信アンカーが ID を確保し、必要であれば回路制御がその両方を上書きします。\n\n転送コストはいまや負荷と移送距離の両方で決まります。同一サーフェス内の短い跳躍は安いままですが、惑星間転送はそうではありません。\nこれはポータルではありません。[font=default-bold]どこで裂けたかを記憶する機械です。[/font]
gate-2=レシーバーとID
gate-text-2=ゲートレシーバーは転送先のアンカーです。各レシーバーは、回路信号 [color=orange]I[/color] で上書きされない限り、その勢力で空いている最小の正の ID を自動的に取得します。\n\n有効 ID が重複すると競合が発生し、競合が解決するまで使用できません。\nゲートコンソールでレシーバーを選択すると、生の座標ではなく、そのレシーバー ID にゲートが結び付けられます。
gate-3=ゲート配線
gate-text-3=制御入力は送信側で読み取られます。\nゲート本体の見えている側に配線すれば、制御入力用の送信側隠しコンテナに届きます。\n[color=orange]signal-D[/color] はレシーバー ID を選択します。\n[color=orange]signal-E[/color] は 0 より大きいときにゲートを有効化します。\nレシーバー側の [color=orange]signal-I[/color] は自動 ID を上書きできます。\n[color=orange]signal-D[/color] が 1 つの有効なレシーバーに解決された場合、回路制御が手動選択を上書きします。\n[color=orange]signal-D[/color] が存在しない、無効である、または競合している場合、ゲートは手動レシーバーと手動の有効状態に戻ります。
gate-control-signals=Control signals read by the gate
gate-4=ゲートテレメトリー
gate-text-4=ゲートは、非表示の [entity=ei-gate-circuit-interface] から出力されます。\nこの非表示のインターフェイスは、ゲート テレメトリに直接アクセスしたい場合に専用のワイヤ ターゲットとして使用できます。\nインターフェイスは、実際に外部回路に接続されている間のみ更新され、最大で 1 秒に 1 回更新されます。\n[color=orange]ei-gate-active[/color] は、ゲートがオンのときは 1 です。 \n[color=orange]ei-gate-energy[/color] は、MJ に蓄積されたエネルギーを報告します。\n[color=orange]ei-gate-stress[/color] は、ストレスを 0 ～ 100 のスケールで報告します。\nこれらの信号を使用して、アラーム、バッファ、または制御ロジックを駆動します。
gate-telemetry-signals=Telemetry signals emitted by the gate
gate-5=応力と残留物
gate-text-5=転送が成功するたびにストレスが増大します。ストレスにより維持費が上昇し、クールダウンが長くなり、トラフィックがあまりにも早く繰り返されると受信機が飽和状態になる可能性があります。\n\nコンソールの [font=default-bold]Transit Span[/font] バーは、現在の経路圧を示します。同一サーフェス内の転送は安いままですが、軌道から惑星への跳躍には大きな下限コストがあり、移動中のプラットフォーム受信機は経路進行をリアルタイムで使います。\n\n使いすぎると、次元の傷跡の廃棄物である [item=ei-breach-residue] も生成されます。乱雑になる前に、浄化チェーンを通して中和する必要があります。\nゲートはバースト物流用であり、連続貨物用ではありません。
gate-6=レガシー ゲート
gate-text-6=まだチェストまたは生の位置を指しているレガシー セーブは、再設定されるまで機能し続けます。\nゲートがレシーバーに割り当てられると、そのレシーバーが信頼できるソースとなり、古い生の保存先は情報提供のみになります。\nこれにより、新しいセットアップをレシーバー ID に移動する間、古いセーブが保持されます。
gate-7=ゲート調律
gate-text-7=現在のスタートアップ調律: [font=default-bold]__1__[/font]\n\nRecovered は現在のゲート進行を維持します。\nAttuned はより重い素材要求とともに終盤のエイリアン時代へ移します。\nResonant は後半の量子時代の進行へ移します。\nParadox はエキゾチック時代へ移します。\n\n調律はゲートの解禁時期と製作コストを変えます。建設後のランタイム挙動は変えません。

drone=ドローンポート
drone-text=[color=blue]ドローン[/color][entity=ei-drone]を引き継いで制御できるドローンポート。この建物を配置すると、ポートをクリックすると表示できる関連するドローンが作成されます。そこからドローンに「アップリンク」して操縦することができます。ドローンは地形の上を飛行し、建物を配置して採掘し、アイテムを独自のインベントリとの間で移動できます。ただし戦闘不能。 [color=orange]EXIT[/color] を使用していつでもドローンから切り離したり、取得制御 [color=orange]RESET[/color] を使用してステーションに移植したりできます。ゲートを通過してドローンを飛行させると輸送が開始されます。

repair=アーティファクトの修復
repair-text=壊れたエイリアンのアーティファクトは、[color=blue]アーティファクト修復パック[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]を作成することで修復できます。これにより、再度使用できるようになります。修復プロセスは、修復キットをアーティファクト上にドラッグすることで開始できます。修理キットはその過程で消費されてしまうことに注意してください。

alien=古代エイリアンのデータ
knowledge-text=遺物を残した古代文明は、そのデータの一部も残しました。 

new-logistics=新しい物流
new-logistics-text=Exotic Industries は、新しいシステム、エンティティ、メカニズムで物流レイヤーを拡張します。これらの機能は、便宜のためではなく、[font=default-bold]構造を明確にするために別個のサブカテゴリに分類されています。[/font]\n\n左側のメニューからアクセスします。\n\n移動はもはや簡単ではありません。\n\nすべてのルートは決定です\n\nすべてのフローは設計です。\n\n効率は[font=default-bold]獲得されます。[/font]

train-progression=列車の進行状況
train-progression-text-2=列車は蒸気時代の早い段階で使えるようになります。最初の選択肢は[color=orange]蒸気機関車[/color] [item=ei-steam-basic-locomotive]で、貨物は引けますが流体は運べません。\n\nその後、[color=orange]改良型蒸気機関車[/color] [item=ei-steam-advanced-locomotive]が解禁され、流体輸送が加わります。どちらの形式も石炭や固体バイオマスのような可燃燃料を使い、後にはロケット、核、核融合燃料でも強化できます。\n\n燃焼があまりに汚く、あまりに乱暴になってくると、通常の鉄道は[color=brown]ディーゼル燃料[/color] [item=ei-diesel-fuel-unit]と[color=orange]ディーゼル機関車[/color] [item=locomotive]へ移っていきます。\n\n物流は技術とともに拡大します。\n燃料が前線を定義します。\n列車はどこへ行くかを問いません。何が燃えるかだけを要求します。\n\nそして Gaia が開くと、鉄道はもう一度枝分かれします。この分岐は今やこの節の中で独立した[font=default-bold]EM列車[/font]項目を持っています。燃焼鉄道ではなく、ネットワーク化された電力インフラとして振る舞うからです。
train-progression-text=蒸気時代の早期に列車が利用可能になります。最初の選択肢は、[color=orange]蒸気機関車[/color] [item=ei-steam-basic-locomotive]です。アイテムを運ぶことはできますが、液体を輸送することはできません。\n\n進行すると、[color=orange]最新型蒸気機関車[/color] [item=ei-steam-advanced-locomotive]]のロックが解除され、液体の輸送能力が追加されます。どちらのモデルも石炭や固体バイオマスなどの可燃性燃料に依存しており、ロケット、原子力、または核融合燃料によって性能を向上させることができます。\n\n最終的には、汚染をもたらす純粋な強引な燃焼が欠点になる可能性があります。\n\nよりエレガントで環境に優しい鉄道システムを運用するには、[color=brown]ディーゼル燃料[/color] [item=ei-diesel-fuel-unit]に移行する必要があります。 [color=orange]ディーゼル機関車[/color] [item=locomotive]。\n\n物流はテクノロジーとともにエスカレートします。\n燃料はフロンティアを定義します。\n列車はどこを問わない - 何が燃えるかを要求します。\n\nガイアの世界はノーヴィスの論理に従っていません。\n\nそこでは、鉄道は単なる産業ではありません。鉄道は電磁導管であり、パルスで脈動しています。クリスタルパワー。ガイアの深層では、従来の燃料を使わずに静かな加速と持続的な高速輸送が可能なクリスタル動力の電磁列車[item=ei_em-locomotive][item=ei_em-cargo-wagon][item=ei_em-fluid-wagon]へのアクセスが解放されます。\n\nこれらの列車はクリスタル充電システム[item=ei_charger]から直接電力を供給し、石炭やディーゼルの必要性を完全に回避します。それらは燃えません。共鳴します。\n\nガイアは燃焼で動作しません。\nガイアはメモリ、信号、光で動作します。

em-trains=EM列車
em-trains-text=Gaia は後期の鉄道に燃えることを求めません。結合することを求めます。[item=ei_charger]EMチャージャーは線路の上に結晶場のメッシュを張り、[item=ei_em-locomotive]EM機関車と[item=ei_em-cargo-wagon]貨物車両、[item=ei_em-fluid-wagon]流体車両は、そのメッシュの上を走ります。石炭やディーゼルを火室へ投げ込む必要はありません。\n\n駆動力は車上燃焼ではなくチャージャー格子から来るため、同じ車両は惑星上の路線でも、惑星外の回廊でも使えます。Gaia の技術者たちは、結晶は煙や蒸気、あるいは空気そのものを押しているのではなく、線路の幾何を「記憶」し、その記憶に沿って編成を引いているのだと主張します。物理学であれ祭儀であれ、真空でもきちんと動きます。
em-trains-2=品質、猶予、転送効率
em-trains-text-2=品質は今や接続の両側で意味を持ちます。高品質の[item=ei_charger]チャージャーは自前の場維持コストを最大[font=default-bold]20%[/font]下げ、さらに転送効率を[font=default-bold]12%[/font]改善します。高品質の[item=ei_em-locomotive]機関車は必要とする場出力を最大[font=default-bold]16%[/font]減らします。これらの補正は有効になっている品質段階に合わせて正規化されるので、他のMODが品質段階を増やしていても、最低品質から最高品質まで滑らかに配分され、原版の段数に固定されません。\n\n機関車の品質は、充電範囲から外れたあとにも[font=default-bold]猶予時間[/font]を作ります。最大品質では場のコヒーレンスを最大[font=default-bold]480ティック、つまり8秒[/font]維持できます。通常品質には猶予がありません。これは短い穴、ネットワークの継ぎ目、短時間の経路ミスをまたぐためのもので、死んだ区間を正当化するためのものではありません。
em-trains-3=研究と場のふるまい
em-trains-text-3=[font=default-bold]ei_acc[/font]、[font=default-bold]ei_spd[/font]、[font=default-bold]ei_eff[/font]の研究系統は、依然として主要な全体倍率です。速度と加速度はそれぞれ[font=default-bold]1レベルごとに+10%[/font]、最大で[font=default-bold]+200%[/font]まで伸びます。チャージャー効率は5段階で上がり、ネットワーク負担を最大[font=default-bold]90%減[/font]まで抑えます。その上で、実際に電力が渡される瞬間に、チャージャーのローカル品質と機関車のローカル品質がさらに上乗せされます。\n\n実際の良いEM鉄道は、科学とハードウェアの両方でできています。カバレッジが更新され続ける限り、列車は場燃料を満たしたまま、導かれた光のように走ります。カバレッジが崩れると、システムはまず猶予用の備えを使い、それが切れると機関車は不活性になります。Gaia は多くのことを許しますが、場の断絶は許しません。
orbital-scanner=軌道物流スキャナー
orbital-scanner-text=軌道物流コホートは [entity=ei-orbital-combinator] から始まります。これは引き続き、[font=default-bold]現在の表面と space location が一致する[/font]プラットフォームを読み取る専用テレメトリです。Requests は設定済み最小要求、On The Way はすでに向かっている貨物、Need は到着予定貨物とハブ在庫を差し引いた残不足を示します。\n\n直交に隣接するスキャナーは1つのバンクを形成し、継続ページと [virtual-signal=ei-orbital-overflow] を維持し、各台 [font=default-bold]750 kW[/font] を消費します。回路配線で更新は高頻度を保ち、未配線では GUI を閉じると疎な保守更新へ落ち着きます。
orbital-scanner-2=トランスポンダー、セレクター、調整
orbital-scanner-text-2=[font=default-bold]コホート各装置の役割[/font]\n\n[entity=ei-platform-transponder] はプラットフォームの甲板に置き、そのプラットフォームを識別する安定した数値 ID を与えます。手動上書きは可能ですが、別のプラットフォームと ID が重なったままでは競合が解消されません。\n\n[entity=ei-orbital-selector] はディスパッチ面に置き、対象を一度に一つだけ指名します。手動モードは入力した ID を使い、回路モードは [virtual-signal=ei-platform-id] を読み取り、政策モードは同じ表面にある未リースで需要が正のプラットフォームを選びます。\n\n[entity=ei-orbital-coordinator] はその表面の管制役です。勢力ごと・表面ごとに有効なのは1台だけで、複数の打ち上げレーンが同じプラットフォームへ殺到しないようリースを裁定します。\n\n[entity=ei-orbital-dispatch-uplink] はロケットサイロのそばに置き、工場が積み込むための混載マニフェストを再公開します。各コホート装置は直接開いてサイドパネルで設定してください。見えているコンビネータのページは読み取り専用のテレメトリです。\n\n[font=default-bold]サイドパネル操作[/font]\n\nトランスポンダーのパネルでは手動 ID 上書きを設定または解除します。セレクターのパネルでは動作モードを切り替え、手動モードのときだけ対象 ID を編集します。コーディネーターのパネルではコホート更新を予約し、管理者なら状態再構築も行えます。アップリンクのパネルではサイロ結線の設定や解除、最寄り隣接サイロの自動結線、さらに大口処理方針としきい値下限を調整します。
orbital-scanner-text-2b=[font=default-bold]まずサイドパネルを開く[/font]\n\n見えているコンビネータのページは読み取り専用のテレメトリです。設定を変えるときはスキャナーかほかのコホート装置のサイドパネルを開き、そのあと下の凡例を使って上の1行、中央の行、下のヒントを読んでください。
orbital-scanner-3=ディスパッチ・アップリンクとハイブリッド積み込み
orbital-scanner-text-3=[font=default-bold]コホート起動手順[/font]\n\n1. トランスポンダーを各プラットフォーム本体に置きます。\n2. ディスパッチ面に少なくとも1台のセレクターを置き、手動・回路・政策のいずれかで対象を与えます。\n3. 同じディスパッチ面でコーディネーターを1台オンラインにします。\n4. アップリンクをロケットサイロの隣に置きます。隣接配置は最初の素早い結線候補を与えるだけなので、その後はアップリンクのサイドパネルで結線を確認・差し替え・解除し、そのレーンの大口処理方針を決めてください。\n\nセレクターが稼働可能を示し、その表面に有効なコーディネーターが1台いて、アップリンクが有効なサイロ結線とリースを両方持っていれば、コホートは稼働中です。\n\n[font=default-bold]主な停止理由[/font]\n\n対象未設定は、セレクターにまだ有効なプラットフォーム ID が入っていない状態です。需要なしは、選ばれたプラットフォームにもう不足が残っていない状態です。サイロ未結線は、アップリンクが実在するサイロへ結び付いていない状態です。有効なコーディネーター不在は、そのディスパッチ面に生きているコーディネーターがいない状態です。\n\nv1 の積み込みはハイブリッドのままです。実際に物を運ぶのは inserter、列車、requester、回路レーンです。粘着は大口需要を複数ロケットにまたいで保持し、単発は1回の打ち上げで解放し、しきい値は残需要が設定した床を上回る間だけ継続します。しきい値下限が効くのは、しきい値モードのときだけです。

spidertron=スパイダートロンの変更点
spidertron-text=バニラと比較して、[font=default-bold]スパイダートロンはシミュレーション時代の早い時期に利用可能になります[/font]。しかし、ノービスの対応物とは異なり、それはもはや自己完結型の奇跡ではありません。燃料が必要です。\n\n最初は可燃性固体で十分です。石炭、バイオマス、および同様の材料を使用すると、動き続けることができます。しかし、前進するにつれて、核燃料と核融合燃料によって速度、加速度、航続距離に大きなボーナスが得られます。\n\nこれは単なる乗り物ではありません。これはエスカレーション用の [font=default-bold] プラットフォームです。[/font]\n\n[color=green]Spidertron Patrols[/color] や [color=green]Constructron-Continued[/color] などの MOD には特別な統合が含まれており、Exotic Industries の修正済み Spidertron フレームワークに合わせてシステムを適応させます。\n\nスパイダーは先に歩きます。しかし、この動物は目的、体重、要求を持って歩きます。\n\nしっかりと餌を与えましょう。さもなければ[font=default-bold]遅れをとってしまいます。[/font]

cranes-and-belts=新しいベルトとインサータークレーン
cranes-and-belts-text=エキゾチック インダストリーズは、新しい階層の物流インフラストラクチャ、[color=orange]ネオ ロジスティック ベルト[/color] [item=ei-neo-belt]を導入します。ハイテク素材で作られており、[font=default-bold] 1 秒あたり 90 アイテム[/font] という極めて高いスループットを提供します。これは通常の転送制限をすべて超えています。これらのベルトは、エンドゲームのボリュームと再帰的規模の工場向けに設計されています。\n\nさらに、MOD は [color=orange]クレーン[/color] [item=ei-big-inserter-normal] - バルク転送用に設計された大規模で大容量のインサーターを追加します。\n\nこれらを使用して次のことを行います。\n\n列車を迅速に降ろす\n\n大規模な在庫構造の橋渡し (例: チェスト ↔)倉庫)\n\n圧力がかかると標準のインサーターが機能しなくなる場合でもフローを維持します\n\n[font=default-bold]スピードはもはや贅沢ではありません。\nそれがベースラインです。\n物流はパワーに合わせて拡張するか、パワーを超えて突破する必要があります。[/font]

loaders=ローダー
loaders-text=[item=ei-loader]ローダーから[item=ei-fast-loader]高速、[item=ei-express-loader]エクスプレス、[item=ei-turbo-loader]ターボ、[item=ei-neo-loader]ネオまで、EI のローダーは物流の直結系統を成します。階層が上がるほど処理量は伸びますが、そのぶん電力要求も重くなります。\n\n彼らは物を空中へ投げません。ベルトの流れを、そのまま機械、コンテナ、貨車、線路際の接続先へ噛み合わせます。
loaders-2=積み重ね
loaders-text-2=[item=ei-express-loader]エクスプレスローダーは最大 [font=default-bold]2[/font] 段まで積み込み、スタックサイズも調整できます。[item=ei-turbo-loader]ターボローダーも最大 [font=default-bold]2[/font] 段です。[item=ei-neo-loader]ネオローダーはゲーム上のベルト最大スタック数まで扱え、必要ならそこから下げて調整することもできます。\n\n上位ローダーは、ただ速いベルトに追従するだけではありません。同じタイル幅で、より密な塊を押し込みます。
loaders-3=選別
loaders-text-3=[item=ei-express-loader]エクスプレスローダーは全体で [font=default-bold]共有 1 フィルタ[/font] を使います。[item=ei-turbo-loader]ターボローダーと[item=ei-neo-loader]ネオローダーは [font=default-bold]2 つのレーンフィルタ[/font] を持ち、左右を別々に制御できます。\n\nつまり高位機は、何を通すかだけでなく、どちらのレーンへ送るかまで決められます。
loaders-4=吸着と配置
loaders-text-4=ローダーは設置時に [font=default-bold]有効な接続へ自動で吸着[/font] し、隣接ベルトが変わった時にもその結び直しを再判定します。対象はベルト、コンテナ、貨車、線路際の有効接続です。\n\n貨車、チェスト、機械、線路際インターフェースに向けて置いた場合、実際に接続を成立させるために向きや入出力が切り替わることがあります。
loaders-5=電力
loaders-text-5=すべての EI ローダーは [font=default-bold]電力駆動[/font] です。品目を 1 つ動かすごとに内部バッファから電力を消費し、階層が上がるほどバッファ容量も 1 個あたりの消費も増えます。高位機は強くなりますが、安くはなりません。\n\n短時間の電力低下なら内部蓄電でしのげますが、送電なしで長く最大流量を維持することはできません。
bots=その他のボット
bots-text=Remembrance 機械を空中に設置する前に、クリーンな電力供給を待つ必要はありません。ボットの進歩は次から始まります [font=default-bold]蒸気時代[/font] と [item=rp-steam-roboport], [item=rp-steam-logistic-bot]、 そして [item=rp-steam-construction-bot]、その後、より重く、より高度な電気の群れに成熟します。\n\nその結果、航空オートメーションとの関係は、最初は粗雑で、後にエレガントになるという、異常に早い段階から生まれました。
steam-bots=スチームボット
steam-bots-text=これらは洗練された電動ドローンではありません。彼らは、ピストン、圧力、そして大まかな計算によって空中に保持された真鍮の体をした労働者の魂であり、今でも熱い金属と湿った蒸気の匂いがする業界の最初の空飛ぶ奉仕者です。\n\n蒸気ロボポートラインは [font=default-bold]蒸気時代[/font] その後、バニラのロボティクスがその背後にパッチされ、通常の走行よりもはるかに早く飛行兵站と建設の支援が得られます。
steam-bots-2=ボイラーの血液と故障
steam-bots-text-2=お買い得なのは忍耐力だ。スチームボットは底なしの電気を蓄えているわけではありません。蓄圧された圧力で飛行するため、空になる前にロボポートに戻らなければなりません。輸送中に蒸気がなくなると、 [font=default-bold]空から落ちてくる[/font] 優雅に救助を待つのではなく。\n\n蒸気ロボポートは、早期に充電を求めるよう促しますが、長時間の仕事、混雑した港、過度に拡張されたネットワークにより、初期の利便性が台無しになる可能性があります。
bots-2=後のボットライン
bots-text-2=工場が完全な電動ロボット化に達すると、 EI 大量輸送用の重量貨物ボット、積極的な構築バースト用の重量建設ボット、そしてより高速、範囲、耐久性、およびタスクの焦点を備えた後の高度なバリアントで群れを拡張します。の [font=default-bold][color=orange]Advanced Roboport[/color][/font] は、より高速な充電、より多くのボット スロット、より広い作業範囲を備えた新しいネットワークをサポートします。\n\nこれは単なるドローンネットワークではありません。 [font=default-bold]これは機械化された群れプロトコルです。[/font]


new-mechanics=新しいゲームプレイの仕組み
new-mechanics-text=エキゾチック インダストリーズでは、さまざまな新しいメカニズムが導入されており、それぞれがゲームプレイの基本ロジックを変更します。\n\nこれらのシステムは、構造を明確にするために重点を置いたサブカテゴリに分割されています。\n左側のメニューを使用して移動できます。\n\n[font=default-bold]これらはオプションのレイヤーではありません。[/font]\n\nこれらは世界の新しい物理学です。\n\nそれらを研究するか、 [font=default-bold]彼らによって解体されるでしょう。[/font]


beacon-overhaul=ビーコンのオーバーホール
beacon-overhaul-text=Exotic Industries はビーコンの影響に厳しい制限を課しています。マシンは最大 4 つのビーコンの影響を受ける可能性があります。 [font=default-bold]無限スタッキングの時代は終わりました。[/font]\n\nさらに、最初のビーコン以降のビーコンの動作には冷却液 [fluid=ei-liquid-nitrogen] が必要になりました。これがないと、過熱してシャットダウンしてしまいます。電気はもはや機能の源ではありません。物流は熱力学的安定性をサポートする必要があります。\n\nそれを補うために、ビーコンの構造がアップグレードされました:\n\nモジュール容量の増加\n改良型ビーコンの導入\nキャップに向かって 2 つのビーコンとしてカウント\nさらに多くのモジュールを保持\nより多くのインフラストラクチャが必要\n\n[font=default-bold]増幅はもう行われません些細なことです。[/font]\nこれは機械的な分野です。\n正確に構築するか、[font=default-bold]非効率に陥ります。[/font]

specialised-pipes=特殊なパイプとデータケーブル
specialised-pipes-text=Exotic Industries は流体搬送系を、互換可能な配管ではなく封じ込め用ハードウェアとして扱います。\n\n[color=orange]断熱パイプ[/color]は、[fluid=ei-liquid-oxygen]、[fluid=ei-liquid-nitrogen]、[fluid=ei-heated-helium-3]のような低温・高温・化学的に苛烈な流体を安定させます。[color=orange]データケーブル[/color]は[color=blue]シミュレーション基質[/color] [fluid=ei-computing-power]を運び、汎用の流体配管ではありません。普通の化学物質を流し込めば、導体はショートします。\n\n配管を選ぶということは、その線がどの失敗まで生き延びるかを選ぶということです。
specialised-pipes-2=失敗クラス
specialised-pipes-text-2=非断熱のパイプ、地下区間、高架ライン、タンクは、すべて同じ壊れ方をするわけではありません。[fluid=ei-liquid-nitrogen]液体窒素と[fluid=ei-liquid-oxygen]液体酸素は、通常の配管では気化してガスに戻ります。[fluid=ei-heated-helium-3]加熱プロセス流体と溶岩は高温で破裂し、フルオロケトンと電解液は化学放出を伴って配管を破ります。\n\nタンクの破損は単純な配管区画より重く、[font=default-bold]高架パイプは占有面積がより締まり、広い床面の汚染を避けます。[/font]
specialised-pipes-3=封じ込めの規律
specialised-pipes-text-3=断熱パイプも通常の配管加熱要件は無視します。断熱パイプ、地下断熱、断熱タンクの各プロトタイプはすべて [font=default-bold]加熱エネルギー 0[/font] を使用するため、Aquilo や他の寒冷地表でも凍結を避けるための外部加熱は不要です。\n\n流体を正確に調合したまま保ちたいときに使ってください。冷たい液体は冷たいまま、反応性混合物は封じ込められたまま、そして通常の配管なら換気・短絡・破裂する場所でも専門ラインは生き残ります。
specialised-pipes-4=兆候と監視
specialised-pipes-text-4=破損後の挙動は、搬送系と汚染物の両方に左右されます。混合区画では、その区画にいる搬送系を実際に脅かす汚染物が優先され、その流体が最大量でなくてもそちらの破損判定が使われます。データ系の失敗はアークして短絡し、低温系の失敗は霜を噴き出し、熱系の失敗は高温で焦がし、化学系の失敗は霧や腐食性の放出をまき散らします。データケーブルは汚染が熱系や化学系でも発火せず、高架管は被害を局所に抑えます。同じ区画での反復失敗は抑制されるため、1本の不良ラインが画面を重複した結果で埋めることはありません。\n\n稼働中の工場を監査する必要があるなら、`/ei_runtime_status` では `fluid(t/u/d/s/cursor/mode)` が追跡数・緊急数・要再監査区画数・走査数・サービスカーソル・次のサービスモード、`fluidfx(qh/ql|sh/sl)` が重/軽のキュー数 | 重/軽の抑制数、`rupture(mode/a/p/d|ob/oi)` が破裂演出の忠実度モード・アクティブジョブ数・保留リング数・予定済み遅延バケット数 | 期限超過バケット数・期限超過アイテム数を示します。
ei-runtime-status-enabled=ESIRランタイムテレメトリを有効化しました。
ei-runtime-status-disabled=ESIRランタイムテレメトリを無効化しました。
ei-runtime-status-usage=使い方: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off]（引数なしで実行するとライブのランタイム要約を表示します）。
ei-runtime-status-command-help=既定ではESIRのライブランタイム要約を表示します。同じコマンドから snapshot、auric、auric-detail、telemetry-on、telemetry-off を使ってください。
