[fluid-description]
ei-auric-vapor=溶解した金と微量鉱物を含む超加熱蒸気。炭化物析出核で濾過すると、高熱蒸気と金質スラグを得られる。
ei-computing-power-chemical=シミュレーションによって収集されたデータが、残留物と観測の作用によって不安定化したもの。単なるカオスではなく記号波形にエンコードされた主観的矛盾と表現できる。物質的な拠り所を必要としない精神のモデリングに有用。
ei-computing-power-organic=実在か仮想かを問わず、生死のループの果てに衰退しつつある生態系から収集されたデータ。その先に、極限の惑星モデリングやポスト生物学的テラフォーミング理論に役立つエントロピーが出力される。
ei-computing-power-petrified=ストレス下のパラドックスから抽出。化石を用いて過去の反復シミュレーションを行い、再帰的な誤差ベクトルを生成する。出力されるのは、失敗した未来のすべてとその崩壊の兆候を高精度で合成したものである。崩壊の予測や安定したパラドックスの構築に使用できる。
ei-computing-power-scrap=到達不能な未来、他の世界線、滅び去った文明からの信号が含まれており、解析しようとするとシミュレータが壊れる可能性が高い。エラーそのものをカオス崩壊として定量化し、生データとして使用するしかない。情報理論を武器化するために不可欠となる。
ei-computing-power-stone=理論に反する鉱物のシミュレーションによって生成される。歪んだ密度、逆転した慣性、非現実的な軌道の情報が含まれており、超光速のバリアやビッグバン以前の物理現象再現に用いる。
ei-computing-power-uranium=死にゆく宇宙のシミュレーションを行い生成される。崩壊する星のコア、エントロピー増加、宇宙の衰退に関する情報が含まれている。
