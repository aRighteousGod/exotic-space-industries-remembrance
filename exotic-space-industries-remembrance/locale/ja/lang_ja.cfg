induction-matrix=電磁誘導マトリクス
induction-matrix-2=電磁誘導マトリクスの詳細
induction-matrix-2-text=電磁誘導マトリクスは、エネルギーを貯蔵できる多重構造体です。複数のモジュールを組み合わせた形になっており、それぞれのモジュールがエネルギーの貯蔵や伝送といった特定の役割を担っています。\n\n[color=orange]電磁誘導コア[/color] [item=ei-induction-matrix-core]は、システム全体の中央制御装置です。これが無いとマトリクスは機能しません。回路ネットワークに接続すると、信号Cで現在の蓄電量、信号Tで最大容量、信号Mで最大入出力（IO）を取得できます。これらの信号はコアが実際に稼働している場合のみ出力され、更新頻度は秒間1回です。\n\n[color=orange]電磁誘導コイル[/color] [item=ei-induction-matrix-basic-coil] [item=ei-induction-matrix-advanced-coil] [item=ei-induction-matrix-superior-coil] これらは[font=default-bold]内部にエネルギーを蓄える[/font]ことができ、3段階のグレードが存在します。[color=orange]電磁誘導ソレノイド[/color] [item=ei-induction-matrix-basic-solenoid]に隣接して設置すると、効率ボーナスが得られます。\n\n[color=orange]電磁誘導ソレノイド[/color]は、直列に配置することでコイルの効率が向上します。複数のソレノイドを直列に配置すると[font=default-bold]効果が高まります[/font]が、多量に連結するほど効果の伸びは鈍化し、構造上の無駄が生じることになります。\n\n[color=orange]電磁誘導コンバータ[/color] [item=ei-induction-matrix-basic-converter] [item=ei-induction-matrix-advanced-converter] [item=ei-induction-matrix-superior-converter] これらは、マトリクスへの電力の入出力を制御し、ティアに応じてスループットを調整します。
induction-matrix-text=[color=orange]電磁誘導マトリクス[/color]は、大量のエネルギーを蓄積できる多重構造体です。通常の蓄電池と同様に、余剰電力を蓄え、不足時に放出することが可能です。後続の研究によって、更に大容量高出力の電磁誘導マトリクスをアンロックできます。
knowledge-text=超古代文明の遺跡には、データも一部残っていました。
loaders-2=スタック
loaders-3=フィルター
loaders-4=吸着と設置
loaders-text=[item=ei-steam-loader]蒸気ローダーから[item=ei-loader]ローダー、[item=ei-fast-loader]高速、[item=ei-express-loader]超高速、[item=ei-turbo-loader]ターボ、[item=ei-neo-loader]ネオまで、ローダーは物流の根幹を成します。蒸気ローダーは物流学で開放され、稼働には蒸気が必要です。自動化へ移ると標準ローダーが登場し、そこからは電力による物流が始まります。ティアが進むほど高いスループットを実現します。\n\nインサータの動作時間（スイング時間）がボトルネックとなっているなら、まさにローダーがその解決策となります。
loaders-text-2=[item=ei-steam-loader]蒸気、[item=ei-loader]ノーマル、[item=ei-fast-loader]高速ローダーは、スタックされていないアイテムのみを扱うことができます。[item=ei-express-loader]超高速ローダーは最大[font=default-bold]2[/font]個のスタックを搬送可能、そのスタックサイズも調整可能です。[item=ei-turbo-loader]ターボローダーも同様に最大[font=default-bold]2[/font]個までのスタックを使用可能です。[item=ei-neo-loader]ネオローダーは「搬送ベルト」のスタック上限に連動しており、物量よりも精度が求められるような場合には、ベルト同様に上限値を下げることも可能です。\n\nこのように、上位のローダーは単に速度が上がるだけではなく、設置面積あたりの密度まで上げることが可能になります。
loaders-text-3=[item=ei-steam-loader]蒸気、[item=ei-loader]ノーマル、[item=ei-fast-loader]高速、[item=ei-express-loader]超高速ローダーは、レーンの区別なく[font=default-bold]1[/font]フィルタのみ設定可能です。[item=ei-turbo-loader]ターボと[item=ei-neo-loader]ネオローダーは、レーンごとに[font=default-bold]2[/font]種類のフィルタを設定可能です。\n\n従って、上位機種は何を通すか通さないかの設定だけではなく、「どちらのレーンへ」まで制御することが可能です。
loaders-text-4=ローダーは設置時に [font=default-bold]有効な接続へ自動で吸着[/font] し、隣接ベルトが変わった時にもその結び直しを再判定します。対象はベルト、コンテナ、貨車、線路際の有効接続です。\n\n貨車、チェスト、機械、線路際インターフェースに向けて置いた場合、実際に接続を成立させるために向きや入出力が切り替わることがあります。
loaders-text-5=[item=ei-steam-loader]蒸気ローダーが稼働するためには、流体入力口から[font=default-bold]蒸気[/font]を投入する必要があります。電動ラインは[item=ei-loader]ローダーから始まります。電動ローダーは小さなバッテリーを内蔵しています。1品目を動かすごとにバッテリーから電力を消費し、上位機種になるほどバッテリー容量も消費電力も増加します。つまり上位機種は強くはなりますが、安くはならないのです。\n\n電動ローダーは、ごく短時間の電力低下ならバッテリーで凌ぐことが可能ですが、送電なしで流量を維持することは期待できません。
