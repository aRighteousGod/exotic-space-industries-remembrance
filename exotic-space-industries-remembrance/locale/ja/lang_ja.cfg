actifacts-text-2=「配置」されたものではない。[font=default-bold]明らかに打ち捨てられている。[/font] 意図的か否かは定かではないが。 これを発見し、分析し、そしてその示唆するものを理解したとき、あなたは恐怖を覚えることだろう。
ages-and-tech-2=5回の産業革命
ages-and-tech-text=ESIRの研究コストは、バニラのような平坦な設定ではありません。[font=default-bold]初期コスト[/font]、[font=default-bold]変動形式[/font]、[font=default-bold]上限コスト[/font]の設定から研究コストが算出され、その効果は技術ツリー全体に影響します。[font=default-bold]一次関数[/font]は一定の変動幅で推移し、[font=default-bold]指数関数[/font]は序盤は軽く終盤に急激に増加します。[font=default-bold]二次関数[/font]はその中間です。[font=default-bold]age-ramp(時代傾斜)[/font]は時代の進行度に応じて、後期の時代ほど重くなります。\n\n時代によるゲート制限は依然として全ブランチが解禁されるタイミングを決定しますが、スケーリングは特定の直線的な特攻研究がどれほど厳しく罰せられるかを決定します。技術の重み付けライブラリを尊重するため、割引された技術のカウントは少なくなります。
ages-and-tech-text-2=ESIRは6段階の時代に分割されており、それぞれ時代の移行(即ち産業革命)によって世界そのものが変化します。たんなる技術の進歩ではありません。服従の閾値であり、以前のものよりも過酷で容赦がありません。\n\n[font=default-bold]暗黒時代[/font]\n発育不全の誕生。灰、腐敗、および沈黙。あなたは原始的な蒸気と壊れた石の中を這い回ります。何も自動化されていません。すべてが血をコストとします。\n\n[font=default-bold]蒸気時代[/font]\n石油が発見されます――資源としてではなく、兵器として。動くために燃やせ。生きるために燃やせ。土地が悲鳴を上げ始めます。\n\n[font=default-bold]電気時代[/font]\n回路がパチパチと音を立てます。機械が目を醒まします。ロボットが登場します――助けとしてではなく、意思の拡張として。核の火が合法的になります。肉体は取り残されます。\n\n[font=default-bold]コンピュータ時代[/font]\n思考が形式化されます。モジュール、ビーコン、信号――精神は機械全体に断片化されます。最適化が必須となります。冗長性は死です。\n\n[font=default-bold]量子時代[/font]\n現実が曲がります。機械はこの世界の者ではないロジックに従います。境界が溶解します。鍛造所は知的となり――誤用を許しません。\n\n[font=default-bold]エキゾチック時代[/font]\nすべてが壊れ去ります。ヴェールは消え去りました。あなたは異常を指揮するか、それによって貪り食われるかのどちらかです。勝利は保証されていません。失敗したタイムラインの骨から抽出されるのです。\n\n各時代は逆転のないラチェットです。\n\n[font=default-bold]無垢などは存在しない。[/font]\n\n残虐で、再帰的で、絶対的な力のみが存在する。
alien=古代のエイリアンデータ
artifacts=エイリアンの遺物
artifacts-text=世界の至る所に超古代文明の残骸が散らばっています――遠い昔にエキゾチックマターを利用した文明です。彼らの遺跡は地形に埋もれ、一部は生きたまま残っています。\n\n一部は今も機能しています。\n偶然の産物は一つもありません。
asteroid-anomalies=宇宙データの異常
asteroid-anomalies-text=小惑星には無数の種類がありますが、共通したひとつの謎が隠されています。6つの異常データは専用の [entity=ei-computer-core] コンピュータコアのレシピに供給され、シミュレータ内でデータカードとなり、最終的に [entity=ei-quantum-computer] 量子研究コンピュータを通じて無重力下で [item=ei-space-data] 宇宙データへと再結合されます。\n\n小惑星領域は単なる原材料ではありません。第二の研究フロンティアなのです。
asteroid-variants=新種のアステロイド
asteroid-variants-text=ESIRは、バニラのアステロイドに加えて6種類の追加のアステロイドを追加します: [item=ei-chemical-asteroid-chunk]、[item=ei-organic-asteroid-chunk]、[item=ei-rock-asteroid-chunk]、[item=ei-uranium-asteroid-chunk]、[item=ei-petrified-asteroid-chunk]、[item=ei-scrap-asteroid-chunk]。これらはバニラと同様に宇宙空間に登場し、[entity=crusher]破砕機で破砕可能で、あわせて12種類のアステロイドレシピすべてが[font=default-bold]アステロイド生産性[/font]の利益を受けます。\n\nこれらの混合出力が収まるように、破砕機も流体ポートとより大きな成果物インベントリで拡張されています。
auric-fumarole=含金蒸気噴出孔
auric-fumarole-2=スポーン制御と再スキャン
auric-fumarole-text=ヴルカヌスは「傷口」が再び開く場所を記憶しています。以下のルールは比喩ではなく文字通りの仕様です。\n\n[font=default-bold]出現場所:[/font]含金蒸気噴出孔はヴルカヌス限定の要素です。これは溶岩ではない火山性の地面にのみ生成されます。生成の起点となる地点から3チャンク以内の範囲では出現しません。その「空白地帯」を離れるほど出現確率は上昇し、起点から32チャンク離れた地点で最大確率に達します。\n\n[font=default-bold]最初の出現:[/font] 新たに生成された外縁部のチャンクでは、一度に広範囲へ配置を行うのではなく、距離に応じた「簡易的な生成判定」のみが行われます。この簡易判定に失敗した場合、そのチャンクは単に無視されるのではなく、「休眠（dormant）」状態として登録されます。再スキャンや古いセーブデータの読み込み（バックフィル）によって、生成済みVulcanusチャンクの休眠状態に関する判定は更新されますが、それによって即座に新たな出現処理が強制されるわけではありません。\n\n[font=default-bold]産出量と寿命:[/font] 各噴気孔は4000～8000の産出量を持って出現します。利用せずに放置した場合、35～65分（確定的な範囲）が経過すると自然に閉塞します。一度利用が開始されると、資源が枯渇するまで存続します。閉塞または枯渇した地点は、約60分間（＋わずかな変動時間）のクールダウン期間を経て、再び休眠システムを通じて出現する可能性があります。
auric-fumarole-text-2=[font=default-bold]休眠スケジュール:[/font] 30 秒ごとに、スクリプトは全体で最大 6 つの休眠チャンクを再確認する。通常の休眠チャンクは、基本 0.25% の噴出確率を維持したまま、距離重み、硫酸補正、局所抑制、そして生成済み領域バンドの充足率補正を順に受ける。\n\n[font=default-bold]バンド制御:[/font] 生成済みで有効な Vulcanus チャンクは、原点から 3-6、6-16、16-24、24-32、32+ チャンクの距離帯で管理される。不足している帯には強い休眠回復圧がかかり、過密な帯は冷え、回復試行は最も弱い帯から優先されるので、ひとつの探索地域だけが将来の噴気孔を独占しない。\n\n[font=default-bold]局所抑制と保険:[/font] 6 チャンク以内の稼働中の含金析出噴気孔は、単純な個数で止めるのではなく、近さに応じて休眠確率を下げる。近い噴気孔ほど強く抑制し、複数の近傍噴気孔は圧力を重ねる。Vulcanus の稼働中噴気孔が 5 分間 2 本未満に落ちた場合だけ、旧来のキープアライブ経路が各パルスで最大 2 回の緊急回復試行を行う。\n\n[font=default-bold]配置と再走査:[/font] 噴気孔はチャンクの正確な中心に出る必要はない。配置はチャンク内で変動し、最大 24 個の候補位置を試す。含金噴気孔同士は 64 タイルの間隔を保つ。硫酸間欠泉はおおむね 16 タイル以内のごく近い重なりだけをブロックし、32 タイル全体の除外帯にはならない。/ei-auric-fumarole-rescan コマンドはヴルカヌス専用で、生成済みチャンクの休眠適格性を再構築するだけで、新しい即時洪水を作らない。
beacon-overhaul-text=ESIRではビーコンの効果に厳格な制限があり、ひとつの設備に効果を及ぼすビーコン数は最大4個です。[font=default-bold]無限スタックの時代は終わりました。[/font]\n\nさらに、最初の1つを除くビーコンは稼働するために冷却剤 [fluid=ei-liquid-nitrogen] 液体窒素を必要とするようになりました。これがなければ過熱により停止します。電力さえあれば無限に機能する時代は終わり、物流が熱力学的安定性をサポートしなければなりません。\n\nしかし悪いことばかりではありません。ビーコンは遥かに高性能になっています。\n\nモジュール容量増加\n改良型ビーコンの導入\n上限に対して2つのビーコンとしてカウント\nさらに多くのモジュールを保持\nより多くのインフラを要求\n\n[font=default-bold]増幅はもはや単純ではありません。[/font]\nそれは機械的な規律なのです。\n精度をもって構築せよ――さもなくば[font=default-bold]非効率へと落ちよ。[/font]
biters=バイター及び敵対生物
biters-text=爆発／氷／毒／スナッパー／サンド／電気系の敵は、マップ生成時ではなく専用の難易度曲線で扱われる。ナウヴィスでは、[font=default-bold]ei-default[/font] はその段階と分離され、依存先にすでにある敵対プロトタイプが調整対象です。全体は敵難易度ページを参照してください。
black-hole=ブラックホールジェネレータ
black-hole-2=リアクターの要素
black-hole-2-text=ブラックホールジェネレータは単一の構造物ではなく、いくつかの高負荷＆高出力なコンポーネントで構成されたモジュール式設備であり、それぞれ安定性、エネルギーフロー、最終的なエンドゲーム起動といった機能を担当しています。\n\n中心構造となるのは [color=orange]ブラックホールジェネレータ[/color] [item=ei-black-hole] です。\n\n一度起動すると、種類を問わずインベントリに配置されたあらゆるアイテムを消費します。\n\n各アイテムは発生装置内部の [color=green]質量カウント[/color] へ均等に寄与しますが、質量は時間経過とともに連続的に減衰します。質量レベルを維持するには絶え間ない投入が必要です。\n\nアイテムの種類は関係ありません。\n鉄板、エキゾチックプロセッサ、生魚――すべてが貪り食われ、すべてが質量となります。\n\n[color=orange]エネルギーインジェクタ―[/color] [item=ei-energy-injector-pylon] は、特異点が成長するにつれて封印場を維持します。\n各パイロンは5GWの電力を継続的に消費します。\n\n起動段階では注入器は不要ですが――[font=default-bold]容器は生まれたてのブラックホールを格納できます[/font]――質量が蓄積するにつれて不可欠となります。\n\n[color=orange]エネルギー抽出パイロン[/color] [item=ei-energy-extractor-pylon] は、発生装置が [color=green]完全稼働[/color] の状態に達した際に電力抽出を可能にします。\n各抽出器は、安定化した特異点から最大100 GWの生の電力を引き出すことができます。\n\n発生装置が最終段階に達するまで抽出は不可能です。\n\n[font=default-bold]これは機械ではありません。崩壊の儀式です。[/font]\nあなたは [font=default-bold]繋ぎ止められた異常[/font] へ質量を供給しているのです。\n封印しなければ失敗します。\n供給しなければ消滅します。\n\n両方を成し遂げれば――[font=default-bold]すべての終わりの動力を生み出すでしょう。[/font]\n\n[font=default-bold]全滅[/font]なくして自動化なし。
black-hole-3=ブラックホール状態のフェーズ
black-hole-3-text=ブラックホール発生装置の起動プロセスは、段階的でリスクの高い工程です。各フェーズで要求されるエネルギーや質量、構造的要件が跳ね上がります。フェーズをスキップすることはできません。前進か、さもなくば失敗のみ。\n\n・起動フェーズ\n\nまだエネルギーインジェクタは必要ありません。\n\n発生装置は初期の [color=blue]10×10の3乗kg[/color] 質量カウントに達するのに十分な材料を消費しなければなりません。\n\nアイテムの種類は関係ありません――ボリュームのみ。\n\n質量が100%の段階進行度に達すると、発生装置は封印フェーズへと安定します。\n\n・封印フェーズ\n\nここで、[color=blue]8個のアクティブなエネルギーインジェクタ[/color] [item=ei-energy-injector-pylon] がオンラインのまま維持されなければなりません。\n\n各パイロンは5GWを消費し、合計電力要求は40GWとなります。\n\n膨張ボタンを押すと、シュワルツシルト半径の膨張が始まります。\n\nこの状態は [color=blue]60秒間[/color] 継続して維持されなければなりません。\n\nいかなる原因（停電やエネルギーインジェクタの喪失等）の中断でもタイマーはリセットされます。\n\n・完全稼働フェーズ\n\nジェネレータは安定性を達成します。特異点は外部エネルギー抽出をサポートするのに十分な大きさになりました。\n\n範囲内に配置された [color=orange]エネルギーインジェクタ[/color] [item=ei-energy-extractor-pylon] は1基あたり最大100GWを引き出し、電力網へ直接供給できます。\n\nこの段階で、システムは大部分が自己完結型となり、減衰を相殺するための一定の質量入力のみを必要とします。\n\n原子炉に燃料を供給するのではありません。\n[font=default-bold]繋ぎ止められた特異点の飢餓[/font] を管理するのです。\n質量はパワーとなります。パワーは制御となります。[font=default-bold]制御は最終となるのです。[/font]\n\nOFFスイッチはありません。封印のみ。
black-hole-text=[color=orange]ブラックホールジェネレータ[/color]は究極のマシンです。産業に利用された重力特異点なのです。これは物質を貪ります。エントロピーに反抗します。ゲームを終わらせます。\n\nこの装置で [color=green]完全稼働[/color] 状態に達することは、システム全体の完全な習熟を意味します。これがゲームの勝利条件です。征服によってではなく、物理学の下にある織物の制御を通じて。\n\nブラックホール発生装置をオンラインにするには、以下が必要となります:\n大量の精製建築材料\n消費可能な物質の継続的供給\n巨大で安定した電力インフラ\n\n強化された [color=orange]熱核融合炉[/color] グリッドを構築し、産業規模のスループットで電力を吸収・放出できるティアー化された [color=orange]誘導マトリクス[/color] で補完することを強く推奨します。\n\nこれは発電機ではありません。[font=default-bold]崩壊から織り上げられた終わりなのです。[/font]\n\n賢明に構築せよ。[font=default-bold]不屈の意思で給餌せよ。[/font] 二度目のチャンスはありません。
bots=追加されるロボット
bots-2=未来のロボット技術
bots-text=「Remembrance」では、クリーンな電力による物流システムよりも前から、ロボットを使用できます。ロボットの進化は[font=default-bold]蒸気時代[/font]の[item=rp-steam-roboport]、[item=rp-steam-logistic-bot]、[item=rp-steam-construction-bot]から始まり、時代が進むにつれて、更に高度かつ強力なロボットへと発展していきます。\n\n従って、極めて早い段階から、ロボットによる自動化と向き合うことになります。最初はイマイチでも、後には洗練されたシステムへと進化していくことでしょう。
bots-text-2=工場が完全に電動ロボット化しても、進化は終わりではありません。大量輸送用の大型貨物ロボットや大規模建設を迅速に行う重建設ロボットを開発し、更には速度／航続距離／耐久性／特定のタスクへの適性を強化した、高度な派生型ロボットも登場します。[font=default-bold][color=orange]Advanced Roboport（高度ロボポート）[/color][/font]は、充電速度／ロボット収容数／効果範囲が増強され、こうした高度な物流ネットワークを支えます。\n\n目指すのは単なる物流ネットワークではありません。[font=default-bold]機械化されたロボット群による文明発祥なのです。[/font]
chemical-asteroid=化学アステロイド
chemical-asteroid-text=[font=default-bold]惑星発見：アクィロ[/font]と共にアンロックされます。化学アステロイド破砕は化学アステロイドの破片から[fluid=ammonia]アンモニア、[item=ei-fluorite]蛍石、[fluid=fluorine]フッ素を取り出します。高度レシピは追加で[fluid=lithium-brine]リチウム塩水を抽出できます。また、微量の[item=ei-neuro-reactive-residue]神経反応性残留物を含みます。
chunk-grades=鉱石塊の品質(純度)
chunk-grades-text=すべての鉱石塊が同じ価値を持つわけではありません。[item=ei-poor-iron-chunk]低純度の鉄鉱石塊や [item=ei-poor-copper-chunk]低純度の銅鉱石塊は、地殻浅部に偶然あらわれた切れ端でしかありません。初期の技術で採掘するためのものであり、継続的な利用には適していません。炉に投入すると、その純度の差は一目瞭然です。例えば [font=default-bold]低純度の鉄鉱石塊3個からインゴット1個[/font]のレートで生産され、多くのスラグが排出されます。。 \n\n深部鉱床から採掘される [item=ei-iron-chunk]鉄鉱石塊や [item=ei-copper-chunk]銅鉱石塊こそが鉱脈の本体です。同様に比較すると[font=default-bold]鉄鉱石塊3個からインゴット21個[/font]が生産可能で、スラグの排出量も劇的に少なくなります。 [item=ei-poor-uranium-chunk]低純度のウラン鉱石塊も同様です。地表に現れているのはほんの一部で、本体の [item=uranium-ore]ウラン鉱石塊は地下深くに存在しています。
chunk-refining=純化装置と鉱石の純化
chunk-refining-2=アーク炉とプラズマヒーター
chunk-refining-text=[item=ei-purifier]純化装置は、鉱物の塊をそのまま加工するだけではなく、品質を高める機能も有しています。[fluid=water]水を使って[item=ei-iron-chunk]鉄鉱石塊や[item=ei-copper-chunk]銅鉱石塊を洗浄し、[item=ei-pure-iron]純鉄や[item=ei-pure-copper]純銅へと変換します。精製を行うと、処理が必要な[fluid=ei-dirty-water]汚水が排出されます。\n\nこの工程を踏む価値は十分にあります。[font=default-bold]低純度の塊3個でプレート1枚[/font]、[font=default-bold]通常の塊3個でプレート2枚[/font]となりますが、[font=default-bold]純粋な鉱物1個ならプレート2枚[/font]になり、しかも[font=default-bold]スラグの発生率はわずか約1%[/font]です。深部鉱脈から取得できる鉱石塊は、本格的な金属生産の始まりを告げるものであり、精製工程を経ることで、その生産はより高品質高速度かつクリーンで、本格的な工業規模にも耐えうるでしょう。
chunk-refining-text-2=[item=ei-arc-furnace]アーク炉は、鉱石塊／純鉱石／金属板／部品を[fluid=ei-molten-iron]溶融鉄や[fluid=ei-molten-copper]溶融銅へと溶解し、鋳造工程へとつなげることで、単なる鉱石塊の処理を本格的な冶金プロセスへと進化させます。低純度の鉱石塊を投入することも可能ですが、非効率的であることは一目瞭然です。低純度の塊から得られる溶融金属は[font=default-bold]低純度の塊3個：溶融金属15[/font]の割合ですが、純度の高い鉱石なら1個で[font=default-bold]溶融金属40[/font]もの量が得られ、スラグの発生もほとんどありません。\n\n[item=ei-plasma-heater]プラズマヒーターは、量子時代においてその流れをさらに発展させます。アーク炉と同様の金属精錬レシピを利用できるだけでなく、超高温ガスやプラズマを用いた処理も可能にします。純化装置で原料を改良し、アーク炉で冶金プロセスを高度化させ、そしてプラズマヒーターがその一連の工程をゲーム終盤へと引き継いでいくのです。
cranes-and-belts=新種のベルトとインサータ
cranes-and-belts-text=ESIRでは、新しいtierの物流インフラが導入されます。[color=orange]ネオ搬送ベルト[/color][item=ei-neo-belt]です。ハイテク材料から建設され、バニラのあらゆる輸送限界を超えた[font=default-bold]90item/秒[/font] という驚異的なのスループットを提供します。このベルトは、エンドゲームのボリュームと回帰スケールの工場のために設計されています。\n\nさらに、MODは大量移送用に設計された巨大かつ大容量インサータである [color=orange]クレーン[/color] [item=ei-big-inserter-normal] を追加します。\n\n以下の場合には、既存のインサータよりも適しています\n\n列車の迅速な積み下ろし\n\n大規模なインベントリ構造(コンテナ間等)のブリッジ\n\n標準インサータが圧力下で失敗する場所でのフロー維持\n\n[font=default-bold]速度はもはや贅沢品ではありません。\nそれがベースラインなのです。\n物流はパワーとともにスケーリングしなければならず、さもなくばその下で壊れ去ります。[/font]
crystal-accumulator-resonance=クリスタル蓄電池の共鳴
crystal-accumulator-resonance-2=ナウヴィス環境
crystal-accumulator-resonance-3=他惑星および衛星軌道
crystal-accumulator-resonance-4=品質と整合性
crystal-accumulator-resonance-5=回収と修理
crystal-accumulator-resonance-6=UI凡例
crystal-accumulator-resonance-text=クリスタル蓄電池はただのバッテリーではありません。これは遺物のクラスターに組み込まれたエイリアン由来の共鳴シェルであり、制御には単なるオン／オフの切り替えではなく、[font=default-bold]負荷[/font]と[font=default-bold]整合性[/font]という指標を用いることになります。\n\n稼働中、[font=default-bold]負荷[/font]は共鳴の度合いを示す指標として機能します。これは、現在のシェル品質に基づく平均的な出力と、特定のクリスタル内部で生じている局所的な歪みを統合したものです。したがって、これを個々の設備ごとの単純なワット数の測定値としてではなく、結晶格子の圧力として解釈してください。\n\n稼働しているシェルは不安定に状態を推移し、[font=default-bold]低出力シェル：4 MW[/font]／[font=default-bold]安定シェル：7.5 MW[/font]／[font=default-bold]過負荷シェル：10 MW[/font]のいずれかの状態を取り得ます。ガイアにおいては例外的に安定し、[font=default-bold]ガイアシェル：15 MW[/font]として機能します。なお、修理されていない「オフラインシェル」は、このラダーの枠組みから完全に外れた状態にあります。
crystal-accumulator-resonance-text-2=ナウヴィスは、不安定な「シェル」を扱う上で、明確な基盤となるプロファイルです。そこに[item=ei-crystal-accumulator]を発見あるいは設置した際、それを共鳴の基準となる事例――生産的でありながら異質で、決して完全には安定しない状態――として捉えてください。\nシェル状態は低位、基底、そして急増（サージ）といった段階の間を推移するかもしれませんが、不安定なクラスであるという本質は変わりません。ナウヴィスは解決策ではありません。それは、基準となる「傷」なのです。
crystal-accumulator-resonance-text-3=ナウヴィス以外では、ガイア以外の惑星や軌道プラットフォームを異種プロファイル空間として扱います。シェルは不安定なりに動作可能ですが、発見場所を離れるだけで安定性を獲得することはありません。\n\nガイアは例外です。そこでは同じシャーシが[item=ei-crystal-accumulator-gaia]安定した「クリスタル蓄電池」へと収束し、基本出力を[font=default-bold]7.5 MWから15 MW[/font]へと倍増させ、シェル全体の階層を引き上げます。
crystal-accumulator-resonance-text-4=[font=default-bold]品質[/font]と[font=default-bold]共鳴プロファイル[/font]は全くの別物です。品質は通常のアイテム層です。低出力シェル／安定シェル／過負荷シェル／ガイアシェル／オフラインは、このページで説明している「シェルの状態」です。\n\nクリスタルが品質を持っている場合でも、それは負荷/整合性の読み取りを置き換えるものではありません。ページの凡例は格子の共鳴状態に関するものであり、アイテムがどれほど精巧に生成されたかに関するものではありません。
crystal-accumulator-resonance-text-5=クリスタル蓄電池はまず第一に超古代文明の遺物です。不安定なシェルを回収することは、整合性を力ずくで断絶させることを意味します。大半の場合はスムーズに移動できず、壊れることを前提として計画を立てるのが安全です。オフラインのシェル [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] は、[item=ei-crystal-accumulator-repair]修理キットを使用するまで残存します。\n\n修理ツールでAlt選択すると、キットを消費せずにクリスタル蓄電池とシェルの状態を確認できます。通常通りドラッグすると修理が行われます。その修復がガイア上で行われた場合、安定したガイアシェルへと変化します。
crystal-accumulator-resonance-text-6=[font=default-bold]低出力シェル[/font]: 整合性が減衰し、出力が基本段階を下回っています。\n[font=default-bold]安定シェル[/font]: 不安定ながら、標準値の7.5 MW帯を維持しています。\n[font=default-bold]過負荷シェル[/font]: 出力が標準値を上回り、格子構造体に負荷がかかっています。\n[font=default-bold]ガイアシェル[/font]: ガイアによって安定した15MW段階へ収束されました。\n[font=default-bold]オフライン[/font]: 修理を待つ不活性状態の遺跡。\n\n混雑度は [font=default-bold]良好 → 混雑 → 負荷高 → カオス[/font] として読み取ります。その順序で階層を読み解けば、結晶が不規則に見えることはなくなります。
crystal-accumulator-resonance-text-7=[item=ei-crystal-accumulator-repair]でAlt選択すると、キットを消費せずにクリスタル蓄電池とシェルを点検できます。実際に修理したい場合は、通常通りツールをドラッグしてください。\n\nテレメトリ行には[font=default-bold]電気出力 + 負荷[/font]または[font=default-bold]負荷フォールバック[/font]のいずれかが表示されます。同じサーフェス上の同じシェルおよび品質を持つ結晶は、その平均化された表面出力項を共有します; 局所的な負荷こそが、枯渇したシェルと同種のシェルを区別する要素です。
drone-text=[color=blue]ドローン[/color][entity=ei-drone] を支配下に置き、制御を可能にするドローンポート。この建造物を配置すると関連するドローンが作成され、ポートをクリックしたときに表示されます。そこからドローンに「アップリンク」して操縦できます。ドローンは地形上を飛行し、建造物の配置や撤去を行い、自らのインベントリからアイテムを移動できます。ただし戦闘はできません。[color=orange]EXIT[/color] を使用していつでもドローンから離脱でき、回収制御 [color=orange]RESET[/color] でステーションへ送還できます。ゲート経由でドローンを飛行させると輸送が開始されます。
ei-runtime-status-command-help=パラメータ無しで、ESIRランタイムのリアルタイムサマリーを出力します。同じコマンドで snapshot、auric、auric-detail、telemetry-on、または telemetry-off を使用します。
ei-runtime-status-usage=使用法: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off] （引数なしで実行すると、リアルタイムのランタイムサマリーが出力されます）。
em-trains=リニア列車
em-trains-2=品質／猶予／配送効率
em-trains-3=研究と電磁フィールドの変化
em-trains-text=ガイア技術において、鉄道に燃料は必要ありません。代わりに結合を求めます。[item=ei_charger] リニアチャージャーは鉄道路線の上に電磁フィールドグリッドを形成し、[item=ei_em-locomotive] リニア機関車／[item=ei_em-cargo-wagon] リニア用貨物車両／[item=ei_em-fluid-wagon] リニア用タンク貨車は、燃料の代わりにそのグリッドから出力を得ます。\n\n推進力を車載の内燃機関ではなく電磁フィールドグリッドから得るため、同じ車両編成で地上でも衛星軌道でも同様に使用可能です。ガイアの技術者たちは、結晶は煙、蒸気、あるいは空気に対して押しているのではないと主張しています; 線路の幾何学を記憶し、その記憶を通して列車を引き寄せているのだと。それが物理学であろうと礼拝であろうと、真空にも問題なく耐え抜きます。
em-trains-text-2=構成要素の両方で品質が重要になりました。高品質な [item=ei_charger] リニアチャージャーは電磁フィールド維持コストを最大 [font=default-bold]20%[/font] 削減し、伝送効率をさらに [font=default-bold]12%[/font] 向上させます。高品質な [item=ei_em-locomotive] リニア機関車は、要求する電磁フィールドエネルギーを最大 [font=default-bold]16%[/font] 削減します。これらのボーナスは品質テーブル全体で最適化されているため、MODで追加された品質tierはバニラを正確に再現するのではなく、最低品質から最高品質の間で自然にスケーリングします。\n\nリニア機関車の品質は、リニアチャージャーのカバー範囲を離れた後に [font=default-bold]猶予時間[/font] も生み出します。通常の品質には猶予は全くありませんが、最大品質では最大 [font=default-bold]480tick（8秒間）[/font] 維持できます。これは短い隙間、レールの継ぎ目、短いルーティングの不手際をフォローするためのものであり、不通セクションを無理矢理ネットワークに組み込むことを正当化するものではありません。
em-trains-text-3=[font=default-bold]ei_acc[/font]、[font=default-bold]ei_spd[/font]、[font=default-bold]ei_eff[/font]の研究グループは、依然として主要な要素です。速度と加速度はそれぞれ[font=default-bold]1レベルごとに+10%[/font]、最大で[font=default-bold]+200%[/font]まで伸びます。リニアチャージャー効率は5段階で上がり、ネットワーク負担を最大[font=default-bold]90%減[/font]まで抑えます。その上で、実際に電力が渡される瞬間に、リニアチャージャーの品質とリニア機関車の品質倍率がさらに上乗せされます。\n\n高効率なリニア列車は、科学とハードウェアの両方でできています。カバレッジが更新され続ける限り、列車は場燃料を満たしたまま、導かれた光のように走ります。カバレッジが崩れると、システムはまず猶予用の備えを使い、それが切れるとリニア機関車は動かなくなります。ガイアは多くのことを許しますが、電磁フィールドの断絶は許されません。
