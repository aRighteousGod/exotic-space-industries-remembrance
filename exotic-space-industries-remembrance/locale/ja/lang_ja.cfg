[mod-setting-description]
ei-enable-preliminary-k2so-patch=作業中の Krastorio2 Spaced Out 互換レイヤーを既定では休止状態のままにします。現在の暫定パッチ一式を明示的に試したい場合にのみ有効にしてください。
ei-fulgora-day-length-variation-max-multiplier=フルゴラの日長変化の最大乗数。 1 日の長さは、毎日の開始時に最小乗数と最大乗数の間のランダムな値で乗算されます。最大乗数が高いほど、可能な 1 日の長さは長くなります。一方、最大乗数が低いほど、可能な 1 日の長さは短くなります。
ei-fulgora-day-length-variation-min-multiplier=フルゴラの日長変化の最小乗数。 1 日の長さは、毎日の開始時に最小乗数と最大乗数の間のランダムな値で乗算されます。最小乗数が高いほど、可能な日の長さは長くなり、最小乗数が低いほど、可能な日の長さは短くなります。
ei-rocket-launch-pollution-cap=進化係数 1.0 のロケット打ち上げによって放出される汚染。
ei-rocket-launch-pollution-mode=線形 -> 予測可能、進化に伴う着実な増加\n二次関数 -> 初期のゲームはより柔らかく、ゲーム後半のランプはより強力\n指数関数 -> 初期は非常に穏やか、後期の鋭いスパイク\nしきい値 -> Evo ブレークポイントでの段階的なジャンプ\nハイブリッド -> 線形ベースライン + 追加のゲーム後半ボーナス
ei-check-for-recipe-icons-improvement-mod=[color=red]強く推奨される[/color]を確認してください。ロード/リスポーン時に[color=orange]NaK1119[/color]によるエキゾチック宇宙産業の記憶のためのレシピアイコンの改善。\nレシピ/アイテム/液体を並べ替え、これらのアイコンを見やすく変更します。 \n機能:\nすべてのレシピ、アイテム、流体のグループ化と順序を徹底的に見直します。\nレシピ、アイテム、流体のさまざまなアイコンを変更して視認性を高めます。\nFactoriopedia や Signal GUI に含める必要がないと思われるレシピ、エンティティなどを非表示にします。\nゲームの起動設定から各機能を無効にできます。\n保存されたゲームの場合\nこの MOD を任意の保存ファイルに適用したり、保存ファイルから削除したりできます。ただし、アイテム/流体信号 (レシピ信号を除く) によってレシピを設定した場合、この MOD を適用/削除することによってレシピが変更される可能性があります。\n制限事項:\nKrastorio 2 Space Out はサポートされていません。
ei-tech-scaling-maxCost=テクノロジーごとの[color=red]個別[/color]サイエンスパックコスト上限です。\n[color=pink]Sunday stroll[/color] — 207\n[color=white]Walk in the park[/color] — 415\n[color=#D2B48C]Almost free[/color] — 831\n[color=gray]Very Cheap[/color] — 1662\n[color=white]Default[/color] — 2500\n[color=cyan]More Cheap[/color] — 3325\n[color=blue]Cheap[/color] — 6750\n[color=yellow]Fairly priced[/color] — 12500\n[color=orange]Less Expensive[/color] — 25000\n[color=red]Expensive[/color] — 50000\n[color=purple]Very Expensive[/color] — 100000\nFactorio の内部研究価格乗数は [color=red]x1000[/color] で上限があるため、ESIR は必要に応じて隠し有効開始価格を引き上げ、選んだ上限を届く形に保ちます。
ei-tech-scaling-curveForm=式の導出 — テクノロジーのコスト スケーリング\n設定:\n開始点 A = (0, C) → C = 開始価格\n終了点 B = (N, X) → X = 最大コスト\nN = 総技術数、n = 現在の技術指数\nコスト関数:\n線形: コスト(n) = (X − C) / N · n + C\n二次: コスト(n) = (X − C) / N² · n² + C\n指数関数: cost(n) = exp(n/N · ln(X + 1 − C)) + C − 1\nテクノロジー価格乗数の形式 (cost(n) / C):\n線形: f_lin = (X − C) / (N·C) · n + 1\n二次関数: f_qua = (X − C) / (N²·C) · n² + 1\n指数関数: f_exp = (exp(n/N · ln(X + 1 − C)) − 1) / C + 1\n統合コスト (科学パックの合計):\n線形: Area_lin = N/2 · (X + C)\n二次関数: Area_qua = N/3 · (X + 2C)\n指数関数: Area_exp = N · (C − 1 + (X + 1 − C) / ln(X + 1 − C))\n大きな X 近似:\nArea_exp ≈ N·X / 9\nArea_qua ≈ N·X / 3\nArea_lin ≈ N·X / 2\n相対的難易度:\n指数関数 < 二次関数 < 線形 — 指数関数は序盤がとても穏やかで終盤に鋭く跳ね上がり、線形は最初から最後まで均一、二次関数はその中間です。\nAge-ramp: 時代ごとに負荷を分ける後半重視の方式です。暗黒と蒸気は穏やかで、電力で上がり始め、計算機・量子・エキゾチックが最も重くなります。既存の技術重み付けライブラリもそのまま使うので、割引された技術は軽く扱われます。\n[color=red]ゲーム中にこの設定を変更すると、望ましくない結果が生じる可能性があります。[/color]
ei-tech-scaling-startPrice=曲線の変数 C です。選んだ上限が Factorio の x1000 制限にぶつかる場合、ESIR は裏で隠し有効開始価格を自動的に引き上げます。\nセーブ開始後にこれを変えると、予期しない結果が出る可能性があります。
ei-tech-scaling-additionalMultiplier=曲線と上限の計算後に掛かる追加の最終倍率です。\n進行中のセーブで最も安全に触れる値です。
ei-science-pack-yield-dark=[color=red]ダーク[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-steam=[color=gray]Steam[/color] 年齢科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-electricity=[color=blue]電気[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-computer=[color=yellow]コンピューター[/color]時代科学パックの製作で得られる収量を設定します。
ei-science-pack-yield-simulation=[color=green]シミュレーション[/color]年齢科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-alien=[color=pink]エイリアン[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-quantum=[color=purple]量子[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-fusion-quantum=[color=cyan]Fusion-Quantum[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-exotic=[color=#00912E]エキゾチック[/color]時代科学パックの作成で得られる収量を設定します。
ei-science-pack-yield-black-hole=[color=black]ブラックホール エキゾチック[/color]時代科学パックの作成で得られる収量を設定します。
ei-em_updater_que=エネルギー伝達が発生したときに、EM 列車と充電器の間または上に視覚的なインジケーターを描画します。
ei-em_updater_que_width=表示されるリングの半径を調整します。
ei-em_updater_que_transparency=表示されたリングの透明度を調整します。範囲は 1 ～ > 100 (不透明)。
ei-em_updater_que_timetolive=リングが消えるまでの時間を調整します。
ei-em_train_glow=EM列車の電気伝達グロー効果を切り替えます。
ei-em_train_glow_timetolive=電車の輝きが消えるまで時を刻みます。積み重ねることができます。この数値を下げるとパフォーマンスが向上します。 60 ティックは 1 秒です。
ei-em_charger_glow=EM充電器の電気伝達グロー効果を切り替えます。
ei-em_charger_glow_timetolive=充電器の輝きが消えるまでカチカチ音を立てます。積み重ねることができます。この数値を下げるとパフォーマンスが向上します。 60 ティックは 1 秒です。
ei-max_updates_per_tick=ティック時に実行されるエンティティ タイプごとの更新の量。
ei-ticks_per_full_update=すべての EI エンティティが更新されるティック数を調整します。
ei-beacon-overload=意図された動作。宇宙探査において個々の建物に影響を与える可能性があるビーコンの数に上限を設定します。
ei-barrel-capacity=バレルは 1 までしかスタックできないため、容量は大きくなるはずです。
ei-solar-icon-scaling=ソーラー パネルの 3 層すべてを、設置面積とエネルギー出力の両方の観点から拡張します。\n75% 未満に拡張すると、配置の [color=cyan]柔軟性[/color] が向上します。\n75% を超えると、同じリソース入力で特定のエネルギー出力を達成することが[color=yellow]簡単になります[/color]。
ei-nauvis-main-tracks-override=追憶の代替サウンドトラックがバニラ ノーヴィスのメイン トラックをオーバーライドできるようにします。
ei-nauvis-interlude-tracks-override=Remembrance の置き換えサウンドトラックが Vanilla Nauvis の間奏トラックをオーバーライドできるようにします。
ei-nauvis-pressure-grace=電気の時代以前のノーヴィスにおける敵の過剰な進化を一時的に遅らせます。 5 分に 1 回チェックし、初期年齢のターゲットに向けて進化のみを引き下げます。汚染を軽減したり、巣を除去したり、失敗を防いだりすることはできません。
ei-enemy-difficulty=Exotic Industries: Remembrance が使う敵ステータスの段階を選びます。Gentle から Nightmare までは敵の戦闘・出現ステータスだけを変えます。Original はすべて 1.0 のままです。Merciful と Impossible は少数の apex 例外も適用します。Impossible は Nauvis の猶予も無効化し、敵対生態のある表面ではロケット発射汚染を近くの敵の反撃に変えます。
ei-gate-difficulty=ゲートの調律と進行段階を調整します。Recovered は現在のゲート段階を維持します。Attuned は終盤のエイリアン時代へ、Resonant は終盤の量子時代へ、Paradox はエキゾチック時代へ移します。新規セーブ、またはゲート研究前の変更を想定しています。
ei-gate-notifications=目的地の更新や電力不足警告など、ゲート関連のチャット通知を表示します。
ei-black-hole-notifications=閉じ込め失敗の警告など、ブラックホール関連のチャット通知を表示します。
ei-matter-machine-notifications=保守、不安定化、電力不足など、物質機械関連のチャット通知を表示します。
ei-insulated-pipe-notifications=沸騰、破裂、汚染の警告を含む断熱配管関連のチャット通知を表示します。

