[item-description]
atomic-bomb=プルトニウム核ロケット。外殻は適合性を保ち、内部には「完全破壊」のドクトリンを秘める。まず破壊がその声を上げ、放射能が残ってその言葉を締めくくる。
biolab=稼働するために[item=nutrients]が必要。
dw-deer-ammo-atomic-plutonium=プルトニウムの弾頭を搭載した長距離砲弾。至近距離で聞く覚悟で放つ全面的な「突破」の合図と、その結果生じる広範囲な汚染。
dw-deer-ammo-atomic-plutonium-crate=木箱に梱包したプルトニウム砲弾。慎重であることは必ずしも美徳ではない、と気づいた人達の輸送方法。
dw-deer-ammo-atomic-u235=ウラン235の弾頭を搭載した長距離砲弾。長距離砲の口径に適合させ、同時に放射能汚染の範囲を狭めるべくコンパクトに設計されている。
dw-deer-ammo-atomic-u235-crate=木箱に梱包したウラン235砲弾。この箱には人の業が詰まっている。
dw-deer-ammo-basic=弾頭に榴弾を用いた簡易的な長距離砲弾
dw-deer-ammo-basic-crate=コンパクトに梱包された簡易長距離砲弾の箱。使用時は必ず開封し１発ずつ装填してください。箱のまま発射した場合に生じたあらゆる損害（精神的、身体的、あるいは霊的なものを含む）について、doeWorksは一切の責任を負いません。
dw-deer-ammo-corrosive=腐食弾頭を、対象が恐怖を覚えるほど巨大にして搭載した。
dw-deer-ammo-corrosive-crate=コンテナ詰めされた腐食長距離砲弾。硝酸に触れないよう注意。
dw-deer-ammo-cryo=着弾地点に極寒をもたらします。
dw-deer-ammo-cryo-crate=コンテナ詰めされた極低温長距離砲弾。砲撃陣地用。
dw-deer-turret=精度が低くリロード時間が長い原始的な長距離砲。射程と威力は及第点。
ei-acidthrower-turret=敵の骨まで溶かせるというのに、なぜ貴重な石油を撒き散らさねばならんのだ？\n火炎放射器の親戚ともいえるこの仕掛けは、[color=green]酸[/color]に高圧をかけてノズルから噴射する。その結果、火炎の代わりに「消滅するほどの」非常に苛烈な酸の霧が生み出される。構造物は腐食し、外骨格は溶解する。あとにはスコップで集めるような塵だけが残るだろう。本当に集めようとしたらスコップも溶けてしまうだろうが。
ei-advanced-construction-bot=大規模かつ高速な建設のために設計された次世代の建築ロボ。\n航続距離、ペイロード、不屈の実行力、全てが強化されており、構想を瞬時に具現化するパワーを持っています。
ei-advanced-deep-drill=このドリルは深部鉱床にアクセスできます。稼働時には[color=orange]切削油[/color] [fluid=ei-drill-fluid]を消費(7.0／秒)します。
ei-advanced-destill-tower=[color=yellow]電力駆動[/color]の蒸留タワー。[color=orange]残油[/color] [fluid=ei-residual-oil]を成分ごとに分離する。
ei-advanced-drill=このドリルは深部鉱床にアクセスできます。稼働時には[color=orange]切削油[/color] [fluid=ei-drill-fluid]を消費(2.0／秒)します。
ei-advanced-logistic-bot=速度、範囲、ペイロード、全てが最適化された次世代の物流ロボ。\n極めて高精度で長大な距離を移動します。\nより多く。より効率的に。タイムロスは極めて少なく。\n工場長を凌駕するよう設計されました。
ei-alien-beacon=[color=purple]ビーコン過負荷の影響を受けません。[/color]\n[color=gray]稼働には 30[item=ei-bio-matter]/秒 が必要です。[/color]
ei-alien-beacon-repair=壊れたエイリアンビーコンを修理するためのキット。通常のリペアキットと同じく、上にドラッグ＆ドロップします。
ei-alien-console=古代のエイリアンデータを処理する機械。一度設置すると、InformaTronWikiのエイリアンデータページにアクセスできるようになります。
ei-alien-flowers-1=珍妙不可思議な異星の生命体。設置して[color=orange]破壊[/color]すると戦利品を取得できます。
ei-arc-ammo=限界を超えてチャージされた弾。対象に打撃を与えると同時に動きを封じる。
ei-arc-furnace=鉱物を溶かして液体金属へと変える高出力炉。\n規模のみを追求して設計されているため、[color=red]電力効率は絶望的に悪い[/color]。\nやはり熱、熱エネルギーは全てを解決する。
ei-atomic-bomb-plutonium=プルトニウムの核弾頭を搭載。より広範囲かつ強力な汚染をまき散らす。
ei-atomic-bomb-u235=ウラン235の核弾頭を搭載。放射能汚染は範囲も強度も比較的小さい。※慈悲深いとは言っていない。
ei-auric-slag=含金蒸気から析出した金を含むスラグ。砂礫や微量金属を含んでおり、酸洗浄と水によって金を精製する必要がある。
ei-auto-shotgun-turret=苦手な交戦距離をフォローする、コンパクトなモーター駆動式二連装タレット。ターゲット切替や追尾、反動補正には[color=cyan]電力[/color]が必要となるが、ショットガン弾薬を高レートで連射し、近づく者を容赦なく痛めつける破壊の嵐をもたらす。
ei-basic-heat-pipe=低容量のヒートパイプ。熱はゆっくりと少量だけ輸送される。最大 [color=red]275℃[/color] の熱に対応している。
ei-beacon=かつては同期型フィールド投影技術の頂点に君臨したこのビーコン・モデルも、今や自らの築き上げた遺産の重みに喘いでいる。その放射格子は粗く、位相高調波も時代遅れだが、それでもなお、耳を傾ける者のいなくなった世界に向けて信号を送り続けている。\nスループットが絶対視され、共鳴が力任せに制御されていた時代に建造されたこの装置は、今や実用性はなく過去の遺物と化している。常に整合性の維持に苦闘し、崩壊寸前のところで辛うじて規定の閾値を満たしている状態だ。\nそれでも、それは「数」としてカウントされる。それは「記憶」しているのだ。そして過負荷の集計において、その負荷もまた等しく計算に加えられる。\n[color=gray]「錆びついた足場にさえ、かつての効率性の亡霊が取り憑いている。」[/color]\n過負荷のカウントにおいて、[color=orange]1[/color]つのビーコンとして扱われます。
ei-big-inserter=フィルター機能付きの2x2インサータ。高速で一度にアイテムのスタック全部を移動できます。
ei-big-inserter-normal=2x2インサータ。高速で一度にアイテムのスタック全部を移動できます。
ei-bio-chamber=壁で築かれたのではなく、臓器から生み出され、粘膜と血管の網に覆われた空間。\nそこでは生命が解体され、消化され、「生体情報の塊」として扱われる。\n骨は組み替えられ、ネットワークの結節点となる。\n思考はニューロンから剥ぎ取られ、別の場所へと転送される。\n意識は再利用される。ゆっくりと。懇願するその最中にも。\n壁は呼吸するが、それは不揃いな声で、お前の最期の記憶を囁き返すためでしかない。
ei-bio-reactor=意識のある組織によって駆動される生きた原子炉。\n死体ではなく、まだ思考している生体物質である。\n瘍のように増殖し、骨の骨格に張り巡らされた神経の網目。周期的に夢を見るのに最低限必要なレベルで生かされ続けている。\n燃料を燃やすのではなく、アイデンティティを燃やすのだ。\n苦痛は電圧に、記憶はエントロピーへと変換される。\nあらゆる悲鳴はフィードバックの奔流となり、すべての祈りは電圧スパイクとなる。\n飢えるほど、内部の意識はより鮮明になってゆく。\n[color=gray]稼働には[/color] [color=purple]0.1/秒のバイオマター[/color][item=ei-bio-matter] [color=gray]が必要です。[/color]
ei-black-hole-data=在庫なし
ei-breach-residue=ゲートを繰り返し使用する過程で発生した次元汚染の傷跡。\n有効な使い道は存在しないので、広がる前に浄化装置を用いて中和する必要がある。
ei-burner-assembler=最も基本的な組立機で、[color=orange]可燃性燃料[/color]を消費する。[color=brown]火力インサータ[/color][item=burner-inserter]もこの機械から燃料を引き抜くことが出来る点に注意すること。
ei-burner-heater=[color=red]熱[/color]を生産するために[color=orange]燃料[/color]を消費します。
ei-burner-inserter=燃料を投入して稼働するインサータ。移動元の設備から[color=orange]燃料[/color]を引き出すことができます。
ei-burner-quarry=極めて高い容量を持つ採掘複合設備。局所的な汚染を代償に、最大のスループットと産出量を実現します。膨大なエネルギーを消費し、地表に広大な掘削痕を残します。[color=gray]54%の資源産出量ボーナス[/color]で動作し、冷酷な速度と最大の回収率で鉱床を剥ぎ取ります。
ei-calcite-bed=ミネラル分を含む高温の流体が反応するための触媒として使用される、消耗型の方解石充填層です。反応表面積を拡大し、化学的性質を安定させる役割を担うものであり、定期的な交換を前提としています。
ei-camp-fire=ビーコンと呼べないほどお粗末な、消える寸前の蝋燭。この設備は、与えられたものは何でも燃やし、丁寧に追加を要求し続けます。
ei-cannon-turret=1つの土台に2つの砲身を備えている。破壊力も2倍、騒音も2倍になる。\n[color=gray]高速連射機構と照準システムを利用するには[/color] [color=cyan]電力[/color] [color=gray]が必要です。[/color]
ei-cannon-turret-mk1=単純に穴をあけた筒ともいうべき砲身には、洗練さの欠片も感じられない。
ei-carbide-precipitation-core=金析出を安定させるために使用される、炭化タングステン由来の析出核。消耗品です。\n蒸気が噴孔を呼び覚まし、コアが絞りを保持し、浄化装置が蒸気が与えるものを保持します。
ei-cargo-bot=産業の熱の中で鍛えられた重装甲の運搬機。\nエンジンのトルクで負荷を跳ね除ける。\n二度と止まらないという確固たる信念を持っているようにさえ見える。
ei-caster=任意のインゴット[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass] を加工することができる。
ei-castor=[color=yellow]放射性廃棄物[/color][item=ei-nuclear-waste]を保管するためのもの。
ei-chrono-fossil-shard=骨構造の化石化した残骸――おそらく設計されたもの――タキオンの痕跡シグネチャを帯びています。硬い真空の中で呼吸の音を放ちます。シミュレーションに分岐するタイムライン全体でループすることを強制します。歴史的な崩壊カスケードから高解像度のデータを抽出するのに最適です。
ei-combustion-turbine=[color=gray]灰[/color] [item=atan-ash]を排出しない非常に効率的でコンパクトなタービン。
ei-compound-ammo=エキゾチック技術ツリーにおける最初の異端。1つの高価なマガジンの中の破砕、放電、および不安定化。
ei-computer-core=基礎的なロジックの蟲毒――[color=blue]シミュレーション基質[/color] [fluid=ei-computing-power]を生成するために[color=255,255,255]電力[/color]と慎重にパターン化された[item=electronic-circuit]コンポーネントを必要とします。この流体はエネルギーではなく――有機的な認知には不安定すぎる異常から抽出された蒸留された記号論的圧力です。[color=orange]データケーブル[/color] [item=ei-data-pipe]を接続して、生成された流れを[entity=ei-small-simulator]環境へとルーティングします。\nしかし、コンピュータコアは計算以上のことを行います――異種化学的残渣から時空の化石に至るまで、秘教的な異常を摂取します。これらの反抗的な遺物が消費されるにつれて、コアは分析ではなく犠牲的な解体を通じてそれらを解読し、理解を近似するためにマイクロイテレーションで自らを断片化します。\n各異常は、それが放出する認知基質の風味と機能を変化させ――データストリームへと回帰的な乱流、重力歪み、またはシミュレートされた崩壊シグネチャを注入します。物体が不可能なほど、その狂気はより価値のあるものになります。
ei-computing-unit=コンパクトかつ精巧なAIコアである演算ユニットは、量子時代の最先端設備の核となる。研磨された合金と精密な回路が、古典的ロジックと量子もつれをシームレスに融合させるプロセッサを構築している。その輝く目と控えめな微笑みは静かな自信を覗かせ――深宇宙航法から次世代製造ラボまで、あらゆるものを駆動させることに満足している。
ei-construction-bot=迅速な構築のために設計された高速建設ドローン。\n耐久性よりも加速度を優先します。\nあなたが計画するよりも早く構築します。\n何よりも速さが足りない。
ei-cooler=ガスを液相へと冷却するために使用されるハイパークーラー。液化ガスを輸送するには[color=blue]断熱パイプ[/color] [item=ei-insulated-pipe]を使用してください。
ei-copper-beacon=[color=cyan]液体窒素冷却式[/color]の信号リレービーコン。極低温で安定したモジュール信号を発信します。一貫した伝送マトリクスを維持するために、ベースラインとして[color=blue]5/秒の液体窒素[/color] [fluid=ei-liquid-nitrogen]を必要とします。\n過負荷に対して[color=orange]1[/color]個のビーコンとしてカウントされます。\n[color=gray]このフェーズアレイは、デコヒーレンスを防ぎ信号の忠実度を維持するために部分的な熱抑止を維持します。初期段階の超低温インフラに最適です。[/color]
ei-corrosive-ammo=弾頭に酸が搭載されたエキゾチック弾。最初の打撃は導入に過ぎず、腐食が判決を下します。
ei-corrosive-rocket=弾頭に硝酸を搭載したロケット弾。最初に物理的打撃を与えた後、残った酸の雲が廃墟を作り出す。
ei-crusher=鉱石を破砕することで産出量向上、あるいはインゴットを破砕することで加工工程の短縮が期待できる。またプロメチウムの塊から[item=ei-exotic-ore][color=purple]エキゾチック鉱[/color]を産出することができる。
ei-cryo-ammo=極低温制圧弾。敵が距離を詰められない状況では、生存性はさほど重要ではなくなる。
ei-cryo-rocket=極低温制圧弾。凍結、減速、逃走が唯一の正解となる瞬間。
ei-crystal-accumulator-repair=壊れクリスタル蓄電池を修理するためのキット。修理するには蓄電池の上にドラッグし、キットを消費せずキャンセルするにはAlt選択します。
ei-data-pipe=[color=blue]シミュレーション基質[/color] [fluid=ei-computing-power]を輸送するための専用データケーブル。
ei-deep-drill=このドリルは深部鉱床にアクセスできます。稼働時には[color=orange]切削油[/color] [fluid=ei-drill-fluid]を消費(4.2／秒)します。
ei-deep-pumpjack=アップグレードされたポンプジャック。[color=blue]冷間融材[/color][fluid=ei-cryoflux]、[color=green]フィトガス[/color][fluid=ei-phythogas]、含金蒸気噴出孔にも設置可能。
ei-depleted-uranium-fuel-cell=ウラン233ベースの核燃料セルの使用後残渣
ei-destill-tower=[color=red]熱駆動[/color]の蒸留タワー。[color=orange]残油[/color] [fluid=ei-residual-oil]を成分ごとに分離する。
ei-dragons-breath-shotgun-shell=暴力こそが特産品であるヴルカヌスの業火の中で鍛造されたこの弾薬は、鋼鉄のように焼き入れが施されている。\nこの弾は、無機質な刻印を生きた炎のパターンに置き換え、１発１発に極度の熱応力を集中させる。\n弾薬は、灰／破片／真空中でさえ高温かつ安定して燃焼し、従来の弾道兵器が機能しない過酷な環境に最適化されている。\nヴルカヌスの冶金と溶岩鍛造技術によってアンロックされるこの弾は、ヴルカヌスのシンプルな真実を反映している。\n熱に耐えたのであれば、それは発射される運命にあったのだと。
ei-drone-port=このポートから１機の[color=blue]ドローン[/color][entity=ei-drone]を制御します。ドローンは独自のインベントリを持ち、建物を配置できますが、攻撃能力はありません。
ei-electric-quarry=極めて高い容量を持つ採掘複合設備。局所的な汚染を代償に、最大のスループットと産出量を実現します。膨大なエネルギーを消費し、地表に広大な掘削痕を残します。[color=gray]54%の資源産出量ボーナス[/color]で動作し、冷酷な速度と最大の回収率で鉱床を剥ぎ取ります。
ei-electric-stone-quarry=どこからでも[color=orange]石[/color][item=stone]を採掘できる
ei-emerald-apocalypse-cannon=船体に固定された主砲。旋回はしない。戦車が向いている先を裁く。
ei-emerald-apocalypse-charge=KARASAWA-mk2で用いる、封印されたE2クリスタルの破片。制約。放電。そして傷跡。
ei-emerald-apocalypse-hover-tank=ナインボール・コアによって浮遊する古代の要塞。圧力、前進、教義、そして破滅の具現化。
ei-excavator=[color=blue]水[/color][fluid=water]と[color=brown]切削油[/color][fluid=ei-drill-fluid](4.2/秒)を消費して[color=orange]石材[/color][item=stone]、[color=brown]汚水[/color][fluid=ei-dirty-water]、および惑星固有の副産物を生産します。
ei-exotic-assembler=この組立機は[color=orange]エキゾチック系統[/color]のアイテムを製造できます。しかしエキゾチック物質は非常に不安定で、最悪の場合組立機が爆発する危険性があり、これを防ぐためには、[color=blue]マタースタビライザー[/color]を近くに配置する必要があります。[color=gray]稼働中、危険性が高まるにつれて閉じ込め場はより強く脈動し、パチパチと音を立て、アークを放ちます。1秒あたりの不安定化確率は 12% - (品質 - 1)% であり、周囲をマタースタビライザーで囲むことで軽減できます。[/color]
ei-exotic-magazine-body=ドクトリンの前段にある外殻。鋼鉄、セラミック、高価な暴力を運ぶ最低限の規律。
ei-exotic-magazine-core=この特殊なシリーズに共通するコア。ボディ、ドライバー、炸薬という要素が単一の薬莢内に一体化されている。
ei-exotic-magazine-driver=「エキゾチック」シリーズ向けの点火とパルスのタイミング、およびリリース制御。弾丸に「正しい殺し方」を教え込むためのもの。
ei-exotic-rock=[color=green]小惑星[/color]に[color=blue]マイニング衛星[/color] [item=ei-mining-satellite]を打ち上げることで入手できます。
ei-exploration-satellite=未知を探査する衛星！ 遥かな宇宙へと打ち上げれば、おもしれーものが見つかるかもしれません。
ei-farstation-repair=壊れた遠隔ステーションを修理するためのキット。通常の選択ツールのようにステーション上にドラッグします。
ei-fission-facility=原子炉を開発するための核分裂関連データを取得します。
ei-fluid-boiler=燃焼により蒸気を生成：
ei-fluid-heater=燃焼により熱を生成：
ei-fusion-reactor=ESIRにおける熱核融合炉。鉛冷却剤を循環させた中で軽原子燃料を加熱燃焼させ、熱／エネルギー／中性子束を出力します。フルオロケトンと核融合パワーセルからプラズマを出力して[entity=fusion-generator]で使用する、アクィロの高密度プラズマ核融合炉とは異なります。
ei-gaia-pump=ガイア用の汲み上げポンプ
ei-gate=エイリアンの残骸から鍛造され、あり得ない幾何学的構造によって固定されたゲート外殻。\n絶対的な位置情報ではなく、受信側のIDと接続する。\nその維持に必要なエネルギー量は一定ではない。稼働状態では位置合わせを保つために電力を消費し、負荷がかかれば消費量はさらに増大する。\n通過できるのは非生物のみである。\nこれはポータルではない。空間を切り裂いた「場所」を記憶する祭壇なのだ。
ei-gate-container=ゲートのインベントリと制御ロジックのための隠された送信側設備。\nゲートが起動しており低電力床の上にある間のみアイテムを受け入れます。\n目的地はレシーバーIDによって選択されます。
ei-gate-receiver=ゲートトラフィックのための調整された受信錨。\n各レシーバーはIDを主張し、互換性のあるゲートはそのIDを直接ターゲットにできます。\n回路信号が自動IDを上書きできます。\nこれはゲートシステムの目的地側です。
ei-gatling-turret=消耗戦のための回転する讃美歌。単なる射撃ではなく、「ここを通過することは許されない」と宣言します。砲身が回転し、空気が真鍮の気候へと変わり、地面は着弾という新たな言語を学びます。防衛線を維持しますが、常に給弾し続けるコストがかかります。\nこれは「供給」する武器ではありません。\nこれは「納税」する武器です。\n稼働には[color=cyan]電力[/color]が必要です。
ei-gauss-module=[font=default-bold]神のモジュール。[/font] このモジュールは特定の設備やレシピに制限されることはありません。[font=default-bold]あらゆる場面[/font]で使用可能です。
ei-gluon-cavity=グルーオンを集めるために設計された共振器
ei-gravity-braided-ore=フラクタル状の結び目へとねじられた鉱物クラスター。時間が非線形に移動した微小重力ポケットの内部で形成されたと考えられます。それを測定しようとする工具を押し潰します。シミュレーションに非ユークリッド密度場を注ぎ込みます。重力レンズとトポロジカル流束に関連するデータを生み出します。
ei-grower=不安定なエネルギーを放射する結晶が散りばめられたバイオーム。\n[color=green]E2クリスタル[/color] [item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust]を育成＆収穫します。\n不思議なことに、水生生命もサポートします。水の中の何かが覚えています。
ei-heat-chemical-plant=[color=red]熱エネルギー[/color]で稼働する化学プラント。
ei-hemocrystal-wall=生きたヘモクリスタル格子に折りたたまれた還流装甲板。壁は自らの赤い圧力の下で浅い傷を編み閉じ、すべての打撃を閉鎖の別の誓いへと変えます。
ei-hexafluoride-ammo=フッ化物を用いた貫通弾。綺麗に突き刺さるが、突き抜けた後には筆舌に耐えない傷跡を残す。
ei-high-tech-parts=[color=blue]エキゾチック組立機[/color]の[color=red]不安定なコア[/color]内部でのみ製造が可能で、他の場所や設備で再現することは不可能です。その構造は古典物理学を拒絶します――量子固定された合金、確率を導通させるフィラメント、および原子のハーモニーで唸る共鳴コア。\n作成するのは危険ですが、遺物級の技術には不可欠なハイテク部品は、文明を限界を超えて押し進める要石です。
ei-high-temperature-reactor=他の原子炉から[color=red]熱エネルギー[/color]を供給する必要があります。[color=gray]液体鉛冷却材[/color]を循環させて冷却し続ける必要があり、[color=orange]トリウム[/color] [item=ei-thorium-232]ベースの燃料も利用できます。[color=green]核燃料棒(ウラン235)[/color] [item=ei-uranium-235-fuel]を使用する場合、この機械は約500MWのパワーを発生させます。
ei-holo-asteroid=装飾用ホログラム
ei-holo-gas-giant=装飾用ホログラム
ei-holo-mars=装飾用ホログラム
ei-holo-moon=装飾用ホログラム
ei-holo-nauvis-orbit=装飾用ホログラム
ei-holo-sulf=装飾用ホログラム
ei-holo-sun=装飾用ホログラム
ei-holo-uran=装飾用ホログラム
ei-induction-matrix-advanced-coil=電磁誘導マトリクスの改良されたコイル。マトリクスのエネルギー容量を[color=yellow]100 MJ[/color]増加させる。
ei-induction-matrix-advanced-converter=電磁誘導マトリクスの改良されたコンバータ。マトリクスのエネルギー伝送速度を増加させる。出力は基本コンバータ[color=orange]2[/color]個分。
ei-induction-matrix-advanced-solenoid=電磁誘導マトリクスの改良されたソレノイド。直列に繋げるとコイルの効率を向上させることが可能で、基本ソレノイドよりも容量減少のデメリットが発生しづらい。
ei-induction-matrix-basic-coil=電磁誘導マトリクスのベーシックなコイル。マトリクスのエネルギー容量を[color=yellow]25 MJ[/color]増加させる。
ei-induction-matrix-basic-converter=電磁誘導マトリクスの基本的なコンバータ。マトリクスのエネルギー伝送速度を増加させる。
ei-induction-matrix-basic-solenoid=電磁誘導マトリクスのソレノイド。直列に繋げるとコイルの効率を向上させることができる。ただしソレノイドが多すぎると、マトリクス全体のエネルギー容量が減少する可能性がある。
ei-induction-matrix-core=電磁誘導マトリクス構造のコア。マトリクスごとに１個のみ設置可能。
ei-induction-matrix-core-circuit-interface=電磁誘導マトリクスのコア。マトリクスごとに1個だけ設置できる。信号Cで現在のチャージ量／信号Tで最大容量／信号Mで最大IOを取得できる。
ei-induction-matrix-superior-coil=電磁誘導マトリクス用の強化型コイル。マトリクスのエネルギー容量を[color=yellow]1000 MJ[/color]増加させる。
ei-induction-matrix-superior-converter=電磁誘導マトリクス用の強化型コンバータ。マトリクスのエネルギー伝送速度を増加させる。出力は基本コンバータ[color=orange]4[/color]個分。
ei-insulated-pipe=断熱パイプは凍結を防ぐために加熱する必要がありません。また、通常のパイプを損傷させるような[color=pink]電解質[/color]／[color=green]フルオロケトン[/color]／[color=red]高温の流体(溶岩等)[/color]／[color=blue]低温の流体(液化ガス等)[/color]にも使用可能です。
ei-insulated-tank=断熱タンクは凍結を防ぐために加熱する必要がありません。また、通常のタンクを損傷させるような[color=pink]電解質[/color]／[color=green]フルオロケトン[/color]／[color=red]高温の流体(溶岩等)[/color]／[color=blue]低温の流体(液化ガス等)[/color]にも使用可能です。
ei-insulated-underground-pipe=断熱パイプは凍結を防ぐために加熱する必要がありません。また、通常のパイプを損傷させるような[color=pink]電解質[/color]／[color=green]フルオロケトン[/color]／[color=red]高温の流体(溶岩等)[/color]／[color=blue]低温の流体(液化ガス等)[/color]にも使用可能です。
ei-iron-beacon=超導電面全体で完全な信号共鳴を保証するために、絶対零度付近に固定された[color=cyan]ビーコン[/color]。その深いフェーズコアを維持するために、稼働時には[color=blue]10/秒の液体窒素[/color] [fluid=ei-liquid-nitrogen]が必要になる。\n過負荷に対しては[color=orange]2[/color]個のビーコンとしてカウントされる。\n[color=gray]並の物質では崩壊するほどの温度で動作するこのユニットは、熱ドリフトゼロでフェーズ安定した生産性電場を伝送する。高密度で高効率な配置には不可欠な設備。[/color]
ei-isotopic-ghost-shell=崩壊した核分裂物質からなる中空のカプセルであり、依然として「冷たい」ニュートリノを放出している。スキャンを行うたびに、その質量は負の値を示すので、エントロピーの逆転を試みて失敗した産物の可能性がある。熱的死の閾値にある宇宙をシミュレートし、それをわざと不安定化させデータ崩壊事象を誘発する。
ei-lufter=大気から特定の気体を抽出したり排出したりできる。
ei-magazine-payload-arc=弾薬の形に整形された過充電エネルギー。簡潔、残忍、正確。
ei-magazine-payload-compound=クリスタルのエネルギーと爆発物を調合したもの。一発の弾丸で複数の裁定が下る。
ei-magazine-payload-corrosive=硝酸を弾薬に封じたもの。弾丸が止まった後も争いは続く。
ei-magazine-payload-cryo=封印された冷間結晶。その真価は運動と戦意を奪うことにある。
ei-magazine-payload-hexafluoride=最初に穴を穿ち、その後に破滅と交渉する。
ei-magazine-payload-morphium=濃縮モルフィウムを搭載した弾薬。毒ではなく汚染として侵入する。
ei-magazine-payload-neutron=チャージ済み中性子コンテナを圧縮。仕事を終わらせた後に「目に見えないもの」を残す。
ei-magazine-payload-oxyfluoride=自然発火する白熱した化学物質を封じたもの。明るすぎる。不安定すぎる。それこそが目的。
ei-mars-rock=[color=green]火星[/color]に[color=blue]マイニング衛星[/color] [item=ei-mining-satellite]を打ち上げることで入手できます。
ei-matter-stabilizer=人工のマター安定器。[color=orange]エキゾチック組立機[/color] [item=ei-exotic-assembler]を安定させ、エントロピーカスケードに陥る確率を減らすために使用できます。[color=gray]高品質のマター安定器は、不安定性に対してそれぞれ 3 x (品質 - 1) 個の安定器としてカウントされ、負荷がかかった格子は目に見えるパチパチ音とアーク信号で応答します。[/color]
ei-mechanical-inserter=機械仕掛けの神の力によって動きます。動力は必要ありません。ただ「意思」のみ。\nシンプルな天才の発想から生まれました――数学を疑わなければ永遠に回転します。
ei-mechanical-long-inserter=熱力学的否定の長い腕。魔法ではなく――バランスです。\nエントロピーへの礼儀正しい反抗をもって、長距離を運搬します。
ei-metalworks-1=[color=orange]インゴット[/color]加工に特化した設備(生産性+10%)。汚染とエネルギー消費は増加します。生産性モジュールもしくは生産速度モジュール用のモジュールスロットが1個付いています。
ei-metalworks-2=[color=orange]インゴット[/color]加工に特化した設備(生産性+20%)。汚染とエネルギー消費は増加します。生産性モジュールもしくは生産速度モジュール用のモジュールスロットが2個付いています。
ei-metalworks-3=[color=orange]インゴット[/color]加工に特化した設備(生産性+30%)。汚染とエネルギー消費は増加します。生産性モジュールもしくは生産速度モジュール用のモジュールスロットが3個付いています。
ei-metalworks-4=[color=orange]インゴット[/color]加工に特化した設備(生産性+40%)。汚染とエネルギー消費は増加します。生産性モジュールもしくは生産速度モジュール用のモジュールスロットが4個付いています。
ei-mining-satellite=天体から[color=orange]惑星の岩[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock]を採掘できる衛星。1回打ち上げるごとに[color=red]10,000[/color]個の岩を採掘します。
ei-module-base=モジュールのベースとなるパーツ。さまざまなモジュールの作成に必要です。
ei-moon-rock=[color=green]月[/color]に[color=blue]マイニング衛星[/color] [item=ei-mining-satellite]を打ち上げることで入手できます。
ei-morphium-ammo=緩慢な汚染弾。物理的に侵入した後は、残りの計算は恐怖にやらせる。
ei-nano-factory=ナノテク製造複合体は、施設というより不活性物質に下された判決です。幾何学と機能において無骨であり、知覚の下にある混沌に形状と整合性を強制する下部構造の建築家として機能します。真空封印された空洞と中性子で鎮められた導管の深部で、分子の意図が抽出され、再配置され、イオンシアーアレイと回帰的自己組み立て室を通じて格子精度の構造へと打ち固められます。構築するのではなく――強制します。そのコアから出現するものは製品ではなく、物理的な形態をとった教理です: 異端に隣接するほどの意図をもって折りたたまれたナノ構造。監視は最小限です――システムは自らを洗練させ、死んだ皮膚のように非効率を廃棄します。アルゴリズムのカタコンベへと深く分け入るほど、明確になります――この場所は人のために作られたのではありません。彼らがかつてあえて創ろうとしたものを記憶するために作られたのです。
ei-neuro-reactive-residue=観測者によって色を変える半透明なスライム。絶滅した化学知性体の凝縮された分泌物デアルと考えられています。シミュレーションモデルに予測不可能なカオスエージェントを注入します。創発的複雑性と異種化学生命体に関するデータを生成します。
ei-neutron-activator=[color=blue]中性子コンテナ[/color] [item=ei-charged-neutron-container]からの中性子をさまざまな元素に注入し、実用レベルの核融合燃料を入手する。
ei-neutron-ammo=技術ツリーの中で最も高価な弾。衝撃は過ぎ去り光だけが残る。
ei-neutron-collector=近くの核分裂源（アクィロの高密度プラズマ核融合設備、ESIR熱核融合炉）から遊離した中性子を回収して[color=blue]中性子コンテナ[/color] [item=ei-neutron-container]へ収め、[item=ei-charged-neutron-container]の形にします。中性子源の種類／活性度／距離によって効率が変化し、中性子源の出力が弱かったり遠かったりする場合には、チャージに長い時間がかかります。
ei-nuclear-fuel=ウラン235ベースの燃料セル。原子炉で使うには非効率的ですが、車両用としては非常に優れています。
ei-nuclear-locomotive=X1「ゴリアテ」原子力機関車。戦争犯罪の作法をわきまえた走る原子炉。外殻が開けば、緑のバーストは単なる予兆に過ぎず、放射線が続きを描く。
ei-oil-refinery=[color=red]熱エネルギー[/color]を動力源に稼働する原油精製所
ei-orbital-combinator=同じサーフェスのプラットフォーム物流を、3種類の読み取り専用モード（要求／輸送中／需要）で反映します。\n直交して隣接するスキャナーは一つの共有バンクを形成し、大きなプラットフォーム出力を継続セクションへと分割し、バンク容量が不足すると[virtual-signal=ei-orbital-overflow]を出力します。\n配線、鮮度、および使用上の注意については、New logisticsのInformatron項目を参照してください。
ei-orbital-coordinator=軌道物流コホートのための管理制御コンソール。\nサーフェスごとに1つのコーディネーターのみがアクティブになります。一つの対象に、複数のアップリンクが発送しないよう、セレクター間を取り持ってリース割り当て／開放を行います。\nコーディネーターを直接開いて、アクティブまたは待機状態を点検し、コホートの更新を要求します。
ei-orbital-dispatch-uplink=ロケットサイロを軌道物流コホートへバインドします。\nアップリンクは一度に1つのリースされた混合マニフェストジョブを保持し、ハイブリッド読み込みのためにターゲットマニフェストを再発行し、継続／単発／閾値の設定に従って大きすぎる作業を保持または解放できます。\n有効なサイロバインディング、アクティブなコーディネーター、需要を持つセレクタージョブを得るまではブロックされたままになります。\nアップリンクを直接開いて、そのサイロバインディングを確認、置換、またはクリアします。
ei-orbital-selector=特定のプラットフォームに焦点を合わせ、その現在の「需要」マニフェストを再発行します。\n手動モードは選択されたプラットフォームIDにロックされ、回路モードは[virtual-signal=ei-platform-id]を読み取り、ポリシーモードは同じ表面上のライブの軌道要求から自動的にターゲットを指名します。\nセレクターを直接開いて、そのモードとターゲットを選択します。新しいセレクターは設定されるまで待機状態のままです。
ei-oxyfluoride-ammo=各着弾を化学的許可へと変える、白く燃え上がるマガジン。
ei-photon-cavity=光子を集めるために設計された共振器
ei-plasma-heater=[color=red]莫大な量の電力[/color]を消費し、ガスを超高温に加熱して高エネルギーのプラズマに変化させます。\n極高温の製錬所としても機能します。\n効率的ではありません。安全ではありません。ただ機能を有するというだけです。
ei-plated-wall=合成ポリマーで積層された鉛結合の強化コンクリート。前身よりもタフで、高密度で、脆くない――エントロピー自体に対して設計された真の防壁。
ei-platform-transponder=プラットフォームに、不変かつユニークな数値IDを割り当てます。このIDを使えば、名称の影響を受けることなく、セレクター／コーディネーター／アップリンクからそのプラットフォームを指定できるようになります。\nIDはプラットフォーム本体に設定してください。手動での上書き設定も可能ですが、IDの重複に注意してください。重複したIDは使用できません。\nトランスポンダを直接操作し、プラットフォームIDを書き換えるか、自動採番に変更してください。
ei-plutonium-239-fuel=プルトニウム239ベースの核燃料。[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、燃料棒1本あたりの燃焼時間は120秒間で、[color=orange]1820の液体鉛冷却材[/color] [fluid=ei-hot-coolant]を生産します。
ei-purifier=鉱石塊を精製処理し、不純物を取り除いて純度を高めます。
ei-quantum-computer=非常に高度なコンピュータ。ハイテクデータを取得するためにさまざまな入力を提供します。
ei-rocket-airframe=ドクトリンの前提となる外骨格。
ei-rocket-motor-basic=長射程のためのベース推進力。照準を合わせるのに十分な安定性。重要なほどに残忍。
ei-rocket-motor-high-energy=より強い推進力を提供する。外殻は悲鳴を上げ、標的は運命を理解します。
ei-rocket-silo=宇宙へ、あるいは様々な目的地に向けてロケットを打ち上げます。詳細はInformaTron wikiおよびロケットサイロGUIで確認できます。
ei-rocket-warhead-atomic-plutonium=より重い決意を込めたプルトニウム。一度口にすれば名状しがたい。
ei-rocket-warhead-atomic-u235=鉛とセラミックで覆われたウラン235。緊密な核分裂の傷。
ei-rocket-warhead-corrosive=儀式的な規律によって保持された酸。着弾によってのみ解放される。
ei-rocket-warhead-cryo=封印された冷間結晶。その真価は運動と戦意を奪うことにある。
ei-rocket-warhead-explosive=ドクトリンへと整形された爆風。物質に消滅を強制し、空間を手中におさめる。
ei-rocket-warhead-impact=質量と運動エネルギーによる打撃。爆発や凍結といった軟弱な概念は存在しない。
ei-rocket-warhead-siege=鋼鉄で鋳造された陣地破壊ドクトリン。防壁で隠してあるならまとめて破壊すればよいのだ。
ei-sanguine-wall=プラスチックとコンクリートの複合防壁の上に幾重にも重なる異形の外骨格。黒い肋骨がラインを固定し、深紅の樹脂が継ぎ目で硬化します。治癒はしませんが、破砕がどこから始まったかを記憶しています。
ei-scanner=エイリアンの遺物を分析するためのスキャナ。エイリアン生命体または遺物を選択するとスキャンが開始され、[color=#d43e8e]エイリアン単位 KU[/color]が返されます。\n\n[color=red][注意][/color] スキャンすると、プロセスの中で選択されたエイリアン生命体／遺物は破壊されます。
ei-shotgun-turret=長距離での防衛が失敗した場合には、これの出番がやってきます。\n警告せず、外さず、躊躇しない近接牽制装置です。\nこれに接近したこと自体が過ちであったと、身をもって知ることになります。
ei-small-inserter=フィルター機能付きの2x2インサータ。一度にアイテムのスタック全部を移動できます。
ei-small-inserter-normal=2x2インサータ。一度にアイテムのスタック全部を移動できます。
ei-space-data=電子データ化された宇宙の囁き、滅びた星々と生きた時間の断片、一つの世界だけでは保持できない知識へと結晶化されました。\n特定の小惑星[item=ei-chemical-asteroid-chunk][item=ei-organic-asteroid-chunk][item=ei-rock-asteroid-chunk][item=ei-uranium-asteroid-chunk][item=ei-petrified-asteroid-chunk][item=ei-scrap-asteroid-chunk]を破砕することによって見つかる[color=purple]宇宙の異常[/color] [item=ei-neuro-reactive-residue][item=ei-sporeglass-heart][item=ei-gravity-braided-ore][item=ei-isotopic-ghost-shell][item=ei-chrono-fossil-shard][item=ei-worm-torn-relay-core]から始め、次にコンピュータコア[entity=ei-computer-core]を通じてそれらを処理してシミュレーション基質を生産し、それを小型シミュレータ[entity=ei-small-simulator]がデータカード[item=ei-simulation-data-chemical][item=ei-simulation-data-organic][item=ei-simulation-data-stone][item=ei-simulation-data-uranium][item=ei-simulation-data-petrified][item=ei-simulation-data-scrap]へと処理します。時間と空間の謎を解き明かすには、これらすべてを量子研究コンピュータ[entity=ei-quantum-computer]内で結合する必要があります。
ei-space-science-pack=星間エネルギー研究の粋を集めたこのテクノロジーパックは、核物質(ウラン／プルトニウム／トリウム)が放つ不安定なエネルギーを、鉛／炭素／氷で安定化させて活用するものである。それぞれのロッドは、宇宙規模の反応を解き放つ鍵となる。そこでは質量が歪み、物質が変容し、科学が「臨界」という危うい境界線上で舞い踊ることになる。
ei-sporeglass-heart=心拍のリズムに反応するスパイク状の結晶質の種。絶滅した異星の神経植物を模倣する休眠中のRNAパターンを含みます。シミュレーションされると、ブラックホールの特異点へと崩壊する偽の生態系を作り出します。全体として統合するのに十分なデータをもたらします。
ei-steam-assembler=蒸気駆動の組立機。動力源に必要な[color=orange]蒸気[/color][fluid=steam]を入れる口が付いている。レシピの材料に蒸気を用いる場合は、動力源とは別の蒸気パイプが必要になる。
ei-steam-crusher=蒸気駆動の破砕機。動力源に必要な[color=orange]蒸気[/color][fluid=steam]を入れる口が付いている。
ei-steampunk-lamp=[color=green]灯油[/color][fluid=ei-kerosene]によって供給されるシンプルな燃焼灯。\n連続的な燃料消費を代償に、電気なしで[color=orange]温かみのある[/color]ゆらめく照明を提供します。
ei-steam-quarry=極めて高い容量を持つ採掘複合設備。局所的な汚染を代償に、最大のスループットと産出量を実現します。膨大なエネルギーを消費し、地表に広大な掘削痕を残します。[color=gray]54%の資源産出量ボーナス[/color]で動作し、冷酷な速度と最大の回収率で鉱床を剥ぎ取ります。
ei-stone-quarry=どこからでも[color=orange]石[/color][item=stone]を採掘できる
ei-sulf-rock=[color=green]硫黄惑星[/color]に[color=blue]マイニング衛星[/color] [item=ei-mining-satellite]を打ち上げることで入手できます。
ei-tank-1=優れた流体貯蔵タンク。耐久値：1000／実弾耐性：30%／[color=red]火炎[/color]耐性：60%／衝撃耐性／60%。
ei-tank-2=圧倒的な流体貯蔵タンク。耐久値：2000／実弾耐性：60%／[color=red]火炎[/color]耐性：80%／衝撃耐性／78%。
ei-tank-3=最高級の流体貯蔵タンク。耐久値：1500／実弾耐性：40%／[color=red]火炎[/color]耐性：70%／衝撃耐性／70%。
ei-thorium-232-fuel=トリウム232ベースの核燃料。[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]でのみ使用可能です。[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、燃料棒1本あたりの燃焼時間は120秒間で、[color=orange]780の液体鉛冷却材[/color] [fluid=ei-hot-coolant]を生産します。
ei-tough-wall=鋼鉄の梁で裏打ちされた、セラミックとコンクリートの複合防壁。重く、鈍く、容赦ない――純粋な密度のみによって耐え抜きます。
ei-uranium-233-fuel=ウラン233ベースの核燃料。[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、燃料棒1本あたりの燃焼時間は120秒間で、[color=orange]1040の液体鉛冷却材[/color] [fluid=ei-hot-coolant]を生産します。
ei-uranium-235-fuel=ウラン235ベースの核燃料。[color=green]高温原子炉[/color] [item=ei-high-temperature-reactor]で使用すると、燃料棒1本あたりの燃焼時間は120秒間で、[color=orange]1560の液体鉛冷却材[/color] [fluid=ei-hot-coolant]を生産します。
ei-uranium-shotgun-shell=ウラン238貫通弾をこれでもかとショットシェルに詰め込んだもの。緑色に輝く高密度のペレットを発射します。炎もなく、雲もなく、近距離の放射線圧力と硬い物理的衝撃のみ。
ei-uran-rock=[color=green]ウラン惑星[/color]に[color=blue]マイニング衛星[/color] [item=ei-mining-satellite]を打ち上げることで入手できます。
ei-warp-beacon=[color=purple]ビーコン過負荷の影響を受けません。[/color]\n[color=gray]稼働には 60[item=ei-bio-matter]/秒 が必要です。[/color]
ei-waver-factory=高品質な[color=orange]半導体[/color][item=ei-semiconductor][item=ei-advanced-semiconductor]を製造します。
ei-worm-torn-relay-core=FTL通信アンテナが放置され、腐食し崩壊しつつある姿。既知のシステムでは解析できない疑似コードが刻まれています。放射線にさらされると、まるで悲鳴を上げようとするかのように不規則に脈動します。不安定なワームホールのエコーを含みます。シミュレーターを再帰的なエラーループへと放り込み、データ収穫に役立ちます。
ei-z-boson-cavity=Zボゾンを集めるために設計された共振器
explosive-rocket=純水な暴力。防壁、敵集団、そして信念を開くために設計されました。
rocket=技術ツリーの最初のゴール。エアフレーム、基本モーター、弾頭。ここはまだ通過点にすぎない。
zeus-wrath-lightning-ammo_alt=人間の手で運ぶべきものではない。この聖遺物は充電されているのではない――[font=default-bold]封印されているのだ[/font]。覚悟を持って発射せよ。嵐が注視している。
zeus-wrath-zeus-gun_alt=水底に沈んだ神の怒り――収縮され、収束され、兵器となった。狙いを外すことはない。ただ[font=default-bold]処罰する[/font]のみ。
zeus-wrath-zeus-turret_alt=いかなる陸地にも繋ぎ止められず、いかなる神にも誓いを立てないポセイドン要塞は、あらゆる海洋の下にある忘れられた電荷を導く。軌道から天空の炎を呼び降ろす――大気によってではなく、大気を通して下される審判。一度配置されれば防衛するのではない――世界へ[font=default-bold]警告する[/font]のだ。嵐が注視していると。
