menu_auric_fumarole=含金析出噴気孔
title_auric_fumarole=含金析出噴気孔
auric-fumarole=含金析出噴気孔
auric-fumarole-text=Vulcanus は傷がどこで再び開くかを覚えている。以下の規則は比喩ではなく、文字通りの仕様だ。\n\n[font=default-bold]出現条件:[/font] 含金析出噴気孔は Vulcanus 専用。火山性だが溶岩ではない地面にのみ出現する。表面原点から 3 チャンク以内のチャンクでは出現確率は 0。そこを越えると確率は滑らかに上がり、原点から 32 チャンクで最大重みになる。\n\n[font=default-bold]初回出現:[/font] 外縁で新しく生成されたチャンクは、距離で重み付けされた軽い初回シード試行だけを行い、最初から一面を噴気孔で埋めることはしない。その軽い試行に失敗したチャンクは忘れられず、休眠登録へ入る。再走査や旧セーブのバックフィルは、生成済み Vulcanus チャンクの休眠適格性を組み直すだけで、新しい即時噴出の波を強制しない。\n\n[font=default-bold]採掘量と寿命:[/font] 各噴気孔は 4000-8000 の採掘量で出現する。誰も回収しなければ 35-65 分の決定論的な範囲で自己封止する。一度回収されれば、枯渇するまで残る。封止または枯渇した場所は、およそ 60 分と小さな決定論的ゆらぎだけ冷え、その後休眠システムから戻ることがある。
auric-fumarole-2=出現制御と再走査
auric-fumarole-text-2=[font=default-bold]休眠スケジュール:[/font] 30 秒ごとに、スクリプトは全体で最大 6 つの休眠チャンクを再確認する。通常の休眠チャンクは、基本 0.25% の噴出確率を維持したまま、距離重み、硫酸補正、局所抑制、そして生成済み領域バンドの充足率補正を順に受ける。\n\n[font=default-bold]バンド制御:[/font] 生成済みで有効な Vulcanus チャンクは、原点から 3-6、6-16、16-24、24-32、32+ チャンクの距離帯で管理される。不足している帯には強い休眠回復圧がかかり、過密な帯は冷え、回復試行は最も弱い帯から優先されるので、ひとつの探索地域だけが将来の噴気孔を独占しない。\n\n[font=default-bold]局所抑制と保険:[/font] 6 チャンク以内の稼働中の含金析出噴気孔は、単純な個数で止めるのではなく、近さに応じて休眠確率を下げる。近い噴気孔ほど強く抑制し、複数の近傍噴気孔は圧力を重ねる。Vulcanus の稼働中噴気孔が 5 分間 2 本未満に落ちた場合だけ、旧来のキープアライブ経路が各パルスで最大 2 回の緊急回復試行を行う。\n\n[font=default-bold]配置と再走査:[/font] 噴気孔はチャンクの正確な中心に出る必要はない。配置はチャンク内で変動し、最大 24 個の候補位置を試す。含金噴気孔同士は 64 タイルの間隔を保つ。硫酸間欠泉はおおむね 16 タイル以内のごく近い重なりだけをブロックし、32 タイル全体の除外帯にはならない。/ei-auric-fumarole-rescan コマンドは Vulcanus 専用で、生成済みチャンクの休眠適格性を再構築するだけで、新しい即時洪水を作らない。
