exotic-stabilizers=エキゾチックマター設備
exotic-stabilizers-text=エキゾチックマターは資源ではありません――「脅威」を利用する概念です。利用するには、封じ込め、精度、およびその不安定性を耐え抜くように設計された機械が必要になります。\n\n[color=orange]エキゾチック組立機[/color] [item=ei-exotic-assembler] は、そのエネルギーシグネチャを処理できる唯一の構造物です。この設備をもってしても、完全な安定性は得られません。組立機は負荷の下で爆発する危険性があります。格子構造体が維持されている限り、設備は封じ込められたパルスで稼働します。崩壊し始めると、そのパルスがパチパチと音をたてはじめ、アーク放電が始まり、具体的な被害が実現します。\n\nこのリスクを低減するためには、組立機の周囲に [color=orange]マタースタビライザー[/color] [item=ei-matter-stabilizer] を配置する必要があります。スタビライザーは周囲のエネルギー電場を安定させ、致命的な事故を防ぎます。古代文明の遺跡として、世界の至る所で発見できる場合もあります\n[color=gray]高品質のマタースタビライザーは、それぞれ 3×(品質－1) 個のスタビライザーとしてカウントされます。\n高品質のエキゾチック組立機の1秒あたりのエントロピーカスケード確率は (品質－1)% 減少します。たとえばUncommonは基本確率12%を11%に低減させます。[/color]\n\nエキゾチック物質を単なる素材として扱ってはなりません。\n\nそれは[font=default-bold]生きており、不安定であり、こちらを見ています。[/font]
fission-reactors=核分裂に関する変更点
fission-reactors-2-text=[color=orange]高温原子炉[/color] [item=ei-high-temperature-reactor] は、熱出力最大化を目指して設計された高度な核分裂システムです。効率とスケールの両方で標準的な原子力インフラを凌駕します――[font=default-bold]ただし、適切に維持管理されている場合に限ります。[/font]\n\n臨界動作温度まで引き上げられ、以下が供給されると:\n\n[font=default-bold]液体鉛冷却材[/font] の安定したフロー、および\n\n少なくとも1本の使用可能な燃料棒、\n\n…溶融液体鉛冷却材を [font=default-bold]超加熱[/font] し、従来の熱交換器のスループットを超え、専用設計のユニットを必要とします。\n\n従来の原子炉とは異なり、本来非核分裂性である [color=brown]トリウム[/color] [item=ei-thorium-232-fuel] 燃料も利用でき――設計の圧倒的な強さによって廃棄物をエネルギー源へと変貌させます。\n\nこれは初心者向けの原子炉ではありません。\n\n供給の滞りを許容しません。\n\nスケールダウンはできません。\n\nポストヒューマン産業のための圧力エンジンであり――[font=default-bold]残虐で、効率的で、容赦がありません。[/font]
fission-reactors-text=ExoticIndustriesにおける「核分裂」は、より高コストかつ高パフォーマンスなシステムへバランス調整されました。\n\n標準的な [color=orange]原子炉[/color] [item=nuclear-reactor] は、バニラの隣接ボーナスの利益を受けなくなりました。\n\n代わりに、[font=default-bold]原子炉単体の出力が増加[/font] しています隣接ではなく高密度によるパワーです。\n\n[font=default-bold]ウランはバニラより稀少になりました。[/font]産出量は少なく、抽出処理は遅くなります。効率的な原子力インフラは、長期的な燃料効率を考慮する必要があります。\n\n使用済み燃料セルはもはや廃棄物ではありません。\n\n自己完結したループのリサイクルシステムによって副産物の回収が可能となり、そこから改善された効率を持つ二次燃料セルへと精製できます。\n\nただし同時に [color=brown]核廃棄物[/color] [item=ei-nuclear-waste] が発生し、この廃棄物処理においては、すべてのプロセスが安全に閉じ込められ、または隔離する必要があります。\n\n無視することはできません。\n\n放置した場合は取り返しのつかない汚染に繋がります。\n\n原子力はもはや無限エネルギーへの近道ではありません。\n\nそれは [font=default-bold]熱、減衰、および回収[/font] のハイリスクな経済なのです。\n\n上手く活用せよ――さもなくば[font=default-bold]コストに溺れよ。[/font]
fulgora-day-variation=フルゴラ自転周期
fulgora-day-variation-2=再抽籤のタイミング
fulgora-day-variation-text=フルゴラの昼夜の長さは一定ではありません。毎サイクルの開始時に、MODは起動時の最小・最大倍率を使用して[font=default-bold]昼夜サイクルの長さ[/font]を再抽籤します。デフォルト設定では、フルゴラの各日は標準サイクル長の[font=default-bold]10%から200%[/font]の間のどこかに収まることを意味します。
fulgora-day-variation-text-2=再抽籤(昼夜時間の切り替え)は、明るく光量が安定している時間帯に行われます。これによって、真夜中から突然真昼になるといった現象を防ぎます。もしフルゴラで極端に長い夜時間が設定された場合でも、フェイルセーフ機能が働き、標準的な1日程度の時間が経過した時点で強制的に切り替えが行われます。\n\n開始時の設定によって、周期の変動範囲（エンベロープ）が定義されます。実際の各日においては、その範囲内でランダムに周期の長さが決定されます。
game-related=ゲームプレイについて
game-related-text=このセクションでは、MODの核となるシステムとゲーム性を分類しています。ナビゲーションのしやすさのためにカテゴリーごとに構造化されています。\n\n左側のメニューを使用してアクセスしてください。\n各項目は構造を露出させるために存在し、娯楽のためではありません。\n生き残るつもりがあるなら読んでください。
gate-2=レシーバとID
gate-3=ゲート回路配線
gate-4=ゲートの状態
gate-5=負荷と残留物
gate-6=旧ゲート
gate-7=バランス調整：ゲート
gate-control-signals=ゲートに入力する制御信号
gate-telemetry-signals=ゲートが出力する情報信号
gate-text=ゲートは、次元の亀裂を制御してアイテムを移動させる、空間輸送設備です。\n\nゲートは座標を直接指定するのではなく、レシーバIDと紐付けされます。レシーバアンカーでIDを採番、送信元コンソールでレシーバを選択します。必要なら、回路信号でルート選択や起動を動的に指定できます。\n\n輸送コストは重量と径路(距離)の両方に基づいて算出されます。同一サーフェス間の跳躍は最も低コストです。異なるサーフェスで同一座標の移動も比較的安価で、移動するプラットフォームへのルートは、リアルタイムの距離からコストが算出されます。\nこれはポータルではありません。[font=default-bold]次元の亀裂を記録する装置です。[/font]
gate-text-2=ゲートレシーバは目的地のアンカーです。 [color=orange]信号I[/color] で上書きしなければ、IDを昇順に採番します。\n\nIDが重複した場合は競合が発生し、その競合が解決されない限り、手動選択でも [color=orange]信号D[/color] でも使用できません。\nゲートコンソールでレシーバを選択すると、座標ではなくレシーバIDとゲートが紐付けされます。
gate-text-3=制御信号入力は送信元側で使用されます。\n可視状態のゲート本体を配線すると、制御入力用の隠された送信元側コンテナへと到達します。\n下の信号行はゲートが何を読み取るかを示しています。\n\n制御信号の優先順位は以下の通りです。\n[color=orange]信号D[/color] で目的地を指定します。\n[color=orange]信号E[/color] がその選択されたルートを起動または停止します。\n受信側の [color=orange]信号I[/color] はレシーバIDを指定します。\n\n有効な [color=orange]信号D[/color] は常に手動のレシーバー選択を上書きします。\n[color=orange]信号D[/color] が有効なレシーバIDでない場合、ゲートはデフォルト値として、コンソールの手動レシーバ設定を使用します。[color=orange]信号E[/color] がゼロでない場合は依然として起動または停止を上書きし、それ以外の場合は手動設定内容が適用されます。\n従って、出力情報が必要でない場合は、最低限必要な機能は全てゲート本体に備わっています。\n[color=orange]信号D[/color] ルートが有効で、[color=orange]信号E[/color] が欠落しているかゼロの場合、ゲートはデフォルトでそのルートを起動します。
gate-text-4=ゲートは隠しコネクタ [entity=ei-gate-circuit-interface] から状態を表す信号を出力します。\n本体の方のコネクタは、送信元コンテナを通じて制御配線に組み込むことは可能ですが、本来は情報発信用のコネクタではありません。\n回路情報は実際に配線されている間のみ更新され、最大で1秒に1回更新されます。外部配線が削除された場合、出力された情報は、古くなったデータとして残るのではなくクリアされます。\n\nどのような情報が出力されるか、下記に示します。\n[color=orange]ゲート有効[/color] ：ゲートが有効化されているか／制御値が適切か／低電力閾値を超えているか、に応じて0または1を出力します。\n[color=orange]負荷蓄積度[/color] ：0～100の範囲で負荷レベルを出力します。\n[color=orange]蓄積エネルギー[/color] ：蓄積されたエネルギーをMJ単位で出力します。枯渇した場合は、ゼロを出力するのではなく、信号自体が消失します。\n\nこれらの信号を上手に使うことで、アラーム／バッファ／制御ロジックを駆動するときに、回路のTick更新をフル稼働させずに済みます。
gate-text-5=転送を行うたびに、負荷が蓄積されていきます。負荷が溜まると維持コストが増加し、クールダウンが長くなり、トラフィックが急増したときにレシーバのキャパシティを飽和させることがあります。\n\nゲートが停止中または低電力閾値未満の場合は、新しい転送を受付しません。それに対して、クールダウン中またはレシーバが飽和している場合は、すでに受け入れられた転送を拒否することはありません。クールタイムが開けるかレシーバが復旧するまで、転送を遅延させることになります。\n\nコンソールの表示で、 [font=default-bold]クールダウン[/font] は転送後のロックタイム中を意味します。[font=default-bold]レシーバーのひずみ[/font] は転送先の現在の飽和度を反映します。[font=default-bold]危険[/font] は、負荷が閾値を越えていて、感電リスクが高まっていることを意味します。\n\nコンソールの転送径路バーは、現在のルートの重みを示します。同一サーフェス間の転送は低コスト、衛星軌道から惑星への跳躍はそこそこのコスト、移動プラットフォームレシーバはリアルタイムの距離を使用します。\n\n極めて高負荷になった場合は、ゲートから放電現象が発生し、周囲の設備にダメージが生じることがあります。\n\n過剰使用は次元の傷痕の廃棄物である [item=ei-breach-residue] 亀裂の残留物も発生させます。残留物は、送信側か受信側のインベントリに排出され、入りきらなかった分は溢れ出します。散らかる前に浄化装置チェーンを通じて中和する必要があります。\nゲートはバースト的な物流のためのものであり、連続的な輸送のためのものではありません。
gate-text-6=直接チェストや座標を指している旧仕様のセーブデータは、再設定されるまで引き続き機能します。\n一度ゲートがレシーバーへと割り当てられると、そのレシーバーが真実のソースとなり、古い生の目的地は情報提供のみとなります。\nコンソールは、置換またはクリアされるまで、その保存されたポイントを [font=default-bold]レガシーの目的地[/font] として表示し続ける場合があります。\nこれにより、新しいセットアップをレシーバーIDへと移行しつつ、古いセーブデータを保存します。
gate-text-7=現在の起動時アチューンメント: [font=default-bold]__1__[/font]\n\nRecoveredは現在のゲート進行度を維持します。\nAttunedはより厳しい材料とともにエイリアン時代へより深くシフトさせます。\nResonantは量子時代の後期進行へとシフトさせます。\nParadoxはエキゾチック時代へとシフトさせます。\n\nアチューンメントは、ゲート進行度が通常の技術チェーンのどこに着地するか、およびゲートとレシーバーの構築コストを決定します。一度構築されたゲートのランタイム動作を変更することはありません。
