[mod-setting-description]
ei-barrel-capacity=ドラム缶のスタック数が１なので容量は大きくなるはず
ei-beacon-overload=宇宙探査において個々の設備に影響を与えるビーコンの数に上限を設定します。
ei-black-hole-notifications=閉じ込め失敗の警告など、ブラックホール関連のチャット通知を表示します。
ei-check-for-recipe-icons-improvement-mod=ロード時およびリスポーン時に、NaK1119氏による[color=red]導入推奨[/color]のMOD「Recipe Icons Improvement for Exotic Space Industries Remembrance」有無をチェックする。\nレシピ、アイテム、流体をソートし、視認性と探しやすいデザインへアイコンを変更。\n機能:\nすべてのレシピ、アイテム、流体のグループ化と並び順を刷新。\n視認性向上のためレシピ、アイテム、流体の各種アイコンを変更。\nFactoriopediaや信号GUIに表示する必要がないと思われるレシピやエンティティなどを非表示化。\nゲーム内の起動設定から各機能を無効化可能。\nセーブデータへの適用について:\nこのMODは任意のセーブファイルに対して追加・削除が可能です。ただし、アイテム/流体信号（レシピ信号を除く）によってレシピを設定している場合、このMODの適用や削除によってそれらのレシピが変更される可能性があります。\n制限事項:\nKrastorio 2 Space Outには非対応です。
ei-em_charger_glow=リニアチャージャーのグローエフェクトを切替
ei-em_charger_glow_timetolive=リニアチャージャーのグローエフェクトが消えるまでの時間をtickで指定
ei-em_train_glow=リニア列車のグローエフェクトを切替
ei-em_train_glow_timetolive=リニア列車のグローエフェクトが消えるまでの時間をtickで指定
ei-em_updater_que=リニア列車とリニアチャージャーの間でエネルギー伝達が発生しているときに、エフェクトを表示
ei-em_updater_que_timetolive=リニア列車の充電演出が消えるまでの時間をtickで指定
ei-em_updater_que_transparency=リニア列車充電演出の透過度を指定(1：透明～100：不透明)
ei-em_updater_que_width=リニア列車充電演出サイズを指定(リング半径)
ei-enable-preliminary-k2so-patch=進行中のKrastorio2 Spaced Out互換性レイヤーをデフォルトで休眠状態に保ちます。現在の暫定パッチセットを明示的にテストしたい場合のみこれを有効にしてください。
ei-enemy-difficulty=ESIRで使用される敵ステータスを設定します。GentleからNightmareまでは敵の戦闘およびスポーンステータスのみを変更します。Originalはすべてを1.0のままにします。MercifulおよびImpossibleはいくつかの特殊な頂点オーバーライドも適用します。Impossibleはさらにナウヴィスの緩和機能を無効化し、ロケット打ち上げ汚染をすでに敵対的な地表での報復行動へと変換します。
ei-fulgora-day-length-variation-max-multiplier=フルゴラの昼の長さ変動の最大倍率。昼の長さは、毎日の開始時に最小倍率と最大倍率の間のランダムな値で乗算されます。最大倍率を高くすると、可能な昼の長さが長くなり、小さくすると短くなります。
ei-fulgora-day-length-variation-min-multiplier=フルゴラの昼の長さ変動の最小倍率。昼の長さは、毎日の開始時に最小倍率と最大倍率の間のランダムな値で乗算されます。最小倍率を高くすると、可能な昼の長さが長くなり、小さくすると短くなります。
ei-gate-difficulty=ゲートの調律と解放される進行レベルを調整します。Recoveredは現在のゲートを維持します。Attunedはエイリアン時代、Resonantは量子時代、Paradoxはエキゾチック時代へシフトさせます。新しいセーブデータもしくはゲート研究以前での変更を意図しています。
ei-gate-notifications=目的地更新や低電力警告などのゲートチャット通知を表示します。
ei-insulated-pipe-notifications=破裂や破損、蒸発、汚染等のイベント通知を表示します。
ei-item-glow-overlay-fidelity=アイテム画像内の発光レイヤーを調整します。Allは現在のビジュアルを保持、Flatは光としてレンダリングせずに発光アートを保持、Offは発光オーバーレイを完全に削除します。
ei-matter-machine-notifications=エントロピーカスケード警告などの通知を表示します。
ei-max_updates_per_tick=1tickあたりに実行されるエンティティタイプごとの更新量
ei-nauvis-interlude-tracks-override=バニラのノーヴィス幕間曲をESIRオリジナルのサウンドトラックで上書きする。
ei-nauvis-main-tracks-override=バニラのノーヴィスメイン曲をESIRオリジナルのサウンドトラックで上書きする。
ei-nauvis-pressure-grace=ナウヴィスのバイターの進化を一時的に抑制する。この効果は電気時代で終了するか、あるいは段階的に弱まるか、選択したプロファイルによって制御される。「Impossible」を選択した場合は強制的にOFFになる。
ei-nauvis-pressure-grace-profile=Classicは電気時代で終了します。Extendedは電気時代から始まり、段階的に緩和係数を下げていきます。
ei-rocket-launch-pollution-cap=ロケット打ち上げによって排出される汚染の値を指定(進化係数1.0の値を入力)
ei-rocket-launch-pollution-mode=一次関数：進化に伴う予測可能で安定した増加\n二次関数：序盤は柔らかく、終盤に向けて強く増加\n指数関数：序盤は非常に穏やかで、終盤に急激なスパイク\n　　閾値：進化度のブレークポイントで段階的な跳躍\nハイブリッド：一次関数に加えて終盤ボーナス追加
ei-rocket-launch-pollution-visual-style=ハイブリッド：上昇中の噴煙が始まるにつれてパッド側は減少する\n上昇時のみ：上昇中のロケットのみ描画する\nシネマティック：上昇中と地上ともに描画する\nサイロのみ：上昇中の噴煙は描画せず、地上のみ描画する
