[mod-setting-name]
ei-production-machine-lights=生産施設の状態表示灯

[mod-setting-description]
ei-production-machine-lights=ESIRの生産施設28種が対象です。20種の既存表示灯に合わせて計23個の着色レンズと小さな光を追加し、表示灯のない8種には追加しません。多色モードではBottleneck Liteはこの20種のみを対象から外します。ESIRの色はBottleneck Liteの色設定とは連動しません。作動エフェクトは全モードで維持されます。アーク炉の作動光は、点滅アニメーションの設定で個別に調整できます。 レンズと光を同じ色で表示します。稼働中は緑、搬出先が満杯なら黄、電力不足ならオレンジ、エネルギーがある状態でそれ以外の理由により停止している場合は赤になります。エネルギーがない場合は追加部分が見えなくなります。 従来の白い作動光25個を復元します。アーク炉、プラズマヒーター、鋳造機は元のエフェクトを維持し、状態表示用のレンズや発光は追加されません。Bottleneck Liteの表示は変わりません。 状態表示用のレンズや発光を追加しません。施設に描かれた表示灯と作動エフェクトは維持されます。Bottleneck Liteの表示は変わりません。

[string-mod-setting]
ei-production-machine-lights-off=オフ
ei-production-machine-lights-status=多色の状態表示灯
ei-production-machine-lights-original=元の白色光

