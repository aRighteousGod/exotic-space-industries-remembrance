ei-waveform-harmonics-1-effect=波形調和 I: 着弾意味論の調和と最初の共有ブリッジ補正。
ei-waveform-harmonics-2-effect=波形調和 II: Legacy コイルとブリッジ先テスラ系に現代的な連鎖追撃ファミリーが解禁。
ei-waveform-harmonics-3-effect=波形調和 III: Space Age の追撃言語が完成し、ブリッジ砲塔側の連鎖がさらに強化される。
ei-storm-lattice-1-effect=嵐格子 I: 基本コイルの場アーク伝播と目標受け渡しを強化。
ei-storm-lattice-2-effect=嵐格子 II: より重い群れ圧力の下でも広いアーク格子を維持。
ei-storm-lattice-3-effect=嵐格子 III: 基本コイルが終盤の本格的な制圧塔になる。
ei-dielectric-rupture-1-effect=誘電破砕 I: 発展コイルの後続放電が撃破後により多くの電荷を保持。
ei-dielectric-rupture-2-effect=誘電破砕 II: 後続放電の到達距離と着火信頼性が向上。
ei-dielectric-rupture-3-effect=誘電破砕 III: 発展コイルが撃破確認を短い処刑嵐へ変える。
ei-bridge-coupling-1-effect=ブリッジ結合 I: バニラのテスラ系を TL 教義へ潰さずに終盤火力を上げる。
ei-bridge-coupling-2-effect=ブリッジ結合 II: 複製フルゴラ塔がより重い終盤ブリッジ報酬を継承する。
ei-reactance-overdrive-1-effect=リアクタンス過駆動 I: テスラタンクの揮発幅が広がり、飽和アークも増える。
ei-reactance-overdrive-2-effect=リアクタンス過駆動 II: テスラタンクが長い過負荷と重い嵐前線放電を維持する。
ei-reactance-overdrive-3-effect=リアクタンス過駆動 III: テスラタンクが融合時代の双コイル暴力に到達する。
ei-exotic-waveform-convergence-effect=異質波形収束: Legacy コイルは分岐・処刑嵐・嵐前線の異質バーストを解禁し、複製フルゴラ塔は砲塔専用の異質アフターショックを得る。

