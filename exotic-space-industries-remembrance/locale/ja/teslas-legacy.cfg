[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=軽量路線。TL 専用の教義格子を主たる継続路として用い、橋渡し補助は分離したまま、元の補助再帰を退かせて UPS を節約する。
ei-tl-behavior-mode-legacy-fidelity=既定値。オリジナルの Tesla's Legacy 挙動をそのまま再現する。旧補助再帰、補助の持続、タイマー清掃、被ダメージ由来、撃破後残響、戦車の揮発流れまで、UPS を問わず復元する。
tl-advanced-attack-anim-charge-up=このアニメーションでは、明るいエネルギーが高度テスラコイルの芯を上っていき、頂点に達した瞬間に発射する。A 塔が目標を倒したあと、B 塔がまだ充電中だと、再照準がわずかに遅れることがある。
tl-advanced-attack-anim-simple=このアニメーションでは、敵が近づくとすぐコイル間で電流が走り、その場で即射する。

