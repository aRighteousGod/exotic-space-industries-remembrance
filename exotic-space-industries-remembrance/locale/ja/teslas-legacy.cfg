teslas-legacy-text=元々は独立した技術ツリーだった「テスラの遺産」は、ESIRの電気兵装に統合されました。[item=tl-basic-tesla-coil]基本テスラコイル、[item=tl-advanced-tesla-coil]発展テスラコイル、[item=tl-tesla-tank]テスラタンクは、名称や外見と工業的アイデンティティを保持していますが、外部から浮いた存在ではなくなりました。初期の粗削りな電磁タレット、強力かつ高精度なタレット、そして重装甲車両という単一のドクトリンとして運用されます。\n\nまた、このラインはバニラのテスラファミリーにも及びます。[item=teslagun]テスラガン、[item=tesla-ammo]テスラ弾薬、[item=tesla-turret]フルゴラ複製タレットは、本MODの類似品の下位互換とはならず、同じ技術体系に馴染むように調整されています。
teslas-legacy-text-2=現在の動作モード: [font=default-bold]__1__[/font]\n\n[font=default-bold]レガシー[/font]はデフォルト設定です。この設定ではオリジナルの挙動がそのまま維持されます。すなわち、旧来の再帰、持続的な支援放電、発生時の衝撃波、内燃機関のエフェクト、テスラタンクの変動フローといった要素が、引き続き主導的な役割を果たします。[font=default-bold]ハイブリッド[/font]は、より軽量な方式です。このモードでは、同じドクトリンをより簡素化された嵐の電場格子経由で処理し、その先に、後続のハーモニクスやドクトリン研究による強化された追撃放電を付加します。\n\n段階構成は共通ですが、戦力のアンロック順序が異なります。ハイブリッドでは、新しい嵐の電場格子による処理が先行します。一方レガシーでは、オリジナルの「テスラの遺産」の挙動が最初に発動し、現代的な追加要素がそれに続きます。
teslas-legacy-text-3=高周波ハーモニクスは近代化に向けた共通の基盤です。これ以前は、レガシーコイルはオリジナルの「テスラの遺産」システムを維持します。高周波ハーモニクスⅠで、テスラシリーズと同じ仕様が適用されます。高周波ハーモニクスⅡで、基本コイルと発展コイルに、最新のアーク連鎖系が解禁されます。高周波ハーモニクスⅢで、タレットは完全なアーク連鎖システムを採用し、高密度の連鎖性能を獲得します。\n\nテスラタワー、フルゴラ製アークタワー、携帯テスラコイルは、統一されたドクトリンに従って洗練され、ここにテスラシリーズは完成します。
teslas-legacy-text-4=ハーモニクスの後、理論はいくつかに分岐していきます。[font=default-bold]嵐の電場格子[/font]は、[item=tl-basic-tesla-coil]基本コイルに特化した研究理論です。クラウドコントロール性能（伝播範囲拡大／高速かつ効率的なターゲット切替／安定した制圧）を向上させます。[font=default-bold]誘電連鎖[/font]は[item=tl-advanced-tesla-coil]上級コイルを洗練します。ターゲットに蓄積される電荷、撃破時の伝播、燃焼持続時間を向上させます。\n\n[font=default-bold]ブリッジ結合[/font]はブリッジ部門の終盤特化です。バニラのテスラシリーズの特性を（本MODに埋もれさせることなく）強化します。フルゴラ製アークタワーが最も大きく恩恵を受けます。一方で手持ちのテスラ装備は軽量なまま維持されます。
teslas-legacy-text-5=[item=tl-tesla-tank]テスラタンクは、タレットの研究を直接共有する訳ではありません。核融合時代のテスラタンク専用の特化理論として[font=default-bold]リアクターオーバードライブ[/font]があり、二連装コイル、広角変調ウィンドウ、射撃レーン全体の拡散範囲拡大などが含まれています。車両は、地面に固定されたタレット群とは別に、履帯に載せた前線爆撃機として、構造的に別の特化研究ツリーが存在します。\n\nまた、この戦車はライン全体における「変調」のスペシャリストであり続けます。クリティカルピーク、変調の揺れ、および即死効果は、タレット群が模倣しない形でこの戦車に宿ります。
teslas-legacy-text-6=理論の最終段階は[font=default-bold]エキゾチック波形収束[/font]です。これは、タレットを別時代の複製に置きえるものではありません。[item=tl-basic-tesla-coil]基本コイルは低コストな本体は維持したまま、クリーンヒットごとに確定でサイドバーストを放つ現代的な[font=default-bold]分岐アーク連鎖タレット[/font]へと進化します。[item=tl-advanced-tesla-coil]発展コイルは高いフレームを維持し、敵を確実に仕留めるたびに処刑の嵐を確実に発生させる、集束型の[font=default-bold]過負荷ランス[/font]となります。タレットはそれぞれ最終型となりますが、戦場における役割分担自体は変化しません。\n\n[font=default-bold]レガシー[/font]モードでは、これらの最終段階の効果が元のTL基盤に重ね合わされます。[font=default-bold]ハイブリッド[/font]モードでは、より軽量なドクトリン・ラティスの頂点として機能します。[item=tl-tesla-tank]テスラタンクは部分的に影響を受けます。揮発性スパイクや気化現象によってストームフロント・バーストを誘発することは可能ですが、この車両は別のタワーへと変貌するのではなく、あくまで装甲を備えた「嵐」の一員としての役割を保ちます。[item=tesla-turret]フルゴラ製アークタワーも同様に、敵を確実に仕留めた際に専用の派生爆発を発生させる能力を獲得しますが、[item=teslagun]テスラガンと[item=tesla-ammo]テスラ弾薬は、コンパクトな派生経路を構成するにとどまります。
teslas-legacy-text-7=戦闘時の画面表示は意図的に絞られています。[font=default-bold]クリティカルヒット[/font]と[font=default-bold]蒸発（即死）[/font]のテキストはデフォルトで有効化されているため、特別な瞬間が騒音にかき消されることなく表示されます。[font=default-bold]通常ダメージ[/font]テキストはデフォルトで無効化されており、毎回の小競り合いが電気の紙吹雪の中に消えてしまわないよう配慮されています。\n\n伝播跳躍、アーク連鎖、ブリッジ結合、タンクの変調、そして最終的なビーム近代化など、ドクトリンがより多くの要素を持つようになった現在、このバランスはより重要となります。デフォルトの設定は、戦場をテキストで埋め尽くすことなく、劇的な瞬間を鮮明に映し出します。
