[technology-description]
tl-basic-tesla-coils-technology=テスラコイルは、高電流の放電を近くの敵へ叩き込むよう改造された共振変圧器です。単発火力は控えめですが、同時に複数の標的へ干渉できます。
tl-advanced-tesla-coils-technology=テスラコイルを大きく発展させた型です。射程が伸び、火力は大幅に高まり、重い装甲で生存性も向上しています。
tl-tesla-tank-technology=中型の発展テスラコイルを二基積んだ致死的な戦車派生型です。携行テスラコイルが二門同時射撃に必要な突入エネルギーを供給します。
ei-tesla-weapons=崩壊前のフルゴラ研究保管庫から回収された、逆解析によるアーク技術です。元の原理はいまだ部分的にしか理解されていませんが、技術者たちは敵対目標へ安定化した電気アークを投射できる実用的な模造品を再構築しました。出力、効率、放電パターンは真のフルゴラ設計に及びませんが、従来の電磁兵器よりはるかに高度です。本物のフルゴラ設計図が解読されるまでは、これ以上の洗練には限界があります。
tl-tesla-ammo-upgrade-technology=携行テスラコイル技術の進歩により、基礎テスラコイル構造の設計上の弱点が明らかになりました。そこを取り除くことで、より効率的なテスラコイルと、全体性能の広い底上げが得られます。
tl-tesla-coil-damage-technology=テスラコイルの雷撃アークによる実効ダメージは、より強力なコンデンサを組み込み、電流周波数へわずかな揺らぎを加えることで高められます。
tl-tesla-coil-shooting-speed=近年の電池効率の改善はテスラコイル設計にも応用でき、臨界容量へより早く到達できるようになるため、結果として連射速度が向上します。
tl-flames-explosion-technology=テスラコイルの放電には莫大なエネルギーが流れ込むため、ついには空気そのものへ着火することさえあります。短命な連鎖反応は、激しい火炎爆発という形を取ります。\n\n「噴燃」の各段階で爆発の効果範囲が広がります。\n\nダメージ: 砲塔ダメージの60%。
tl-flames-count-technology=乾いた地表や塵の粒子が極端な電流で発火すると、驚くほど激しい燃焼反応になります。炎は数秒しか続きませんが、危険な熱量を生み出し、触れるものを焼き尽くします。\n\n「閃火」の各段階で生成される炎の本数と毎秒ダメージが増えます。
tl-flames-probability-technology=極端に濃縮されたエネルギーは、地上の植物、塵の粒子、さらには空気そのものにまで着火しえます。\n\n「燃焼」の各段階で、テスラコイルの標的とその周辺へ着火する確率が上がります。
tl-single-zap-count-technology=発展テスラコイルに撃たれた生物は、大量の静電エネルギーを吸い込むことがあります。この過負荷は宿主を激しく破壊します。もし宿主が壊れたあとにも電荷が残れば、それは近くの抵抗へ向かって鞭のように跳ねます。この現象が補充放電です。\n\n「補充放電」の各段階で、砲塔が敵を倒したときに放たれる補充放電の本数が増えます。
tl-single-zap-damage-technology=標的の破壊後にも電荷が残ると、それは補充放電になります。その放電が運ぶのは元の電荷の一部だけですが、テスラコイル全体の共鳴水準を細かく調整することで、残留エネルギーをさらに増幅できます。\n\n「重雷」の各段階で、補充放電のダメージが増えます。
tl-single-zap-probability-technology=発展テスラコイルは信じがたい量の電気エネルギーを導きます。標的がその電流を抱えきれない場合、電流は電離した空気分子を通じて個別の雷撃アークとして溢れ出し、近くの存在を感電させます。\n\n「過充」の各段階で、発展テスラコイルが敵を倒したときに追加の雷撃アークが発生する確率が上がります。
tl-multi-zap-range-technology=コイル内の電流が強まるほど、周囲の静電場にはより多くの電離粒子が満ちます。これにより電荷は空気中をより通りやすくなり、離れた標的へも届きやすくなります。\n\n「電離」の各段階で、電荷伝播の実効距離が伸びます。
tl-multi-zap-damage-technology=放射される集中エネルギーの波長を精密に調整すると、静電場で電荷が伝播する際に、より安定し、より破壊的な雷撃アークを形成できます。\n\n「雷撃」の各段階で、伝播電荷のダメージが増えます。
tl-multi-zap-probability-technology=テスラコイルを使い続けると、その周囲は電離粒子で満たされます。これらの粒子により、導かれた電荷は本来の標的を越えて近くの対象へ飛び移れるようになります。\n\n「静電場」の各段階で、電荷が近くの敵それぞれへ伝播する確率が上がります。
tl-slowdown-duration-technology=より高いエネルギー電流は、標的の体内により長く残る強い効果を与えます。\n\n「持続」の各段階で、「電撃痺れ」の持続時間が伸びます。
tl-slowdown-multiplier-technology=特定のエネルギー水準と高周波の組み合わせは、深刻な筋痙攣を引き起こし、移動能力を大きく妨げます。\n\n「スタン」の各段階で、「電撃痺れ」の強さが増し、さらに移動が鈍ります。
tl-slowdown-probability-technology=電流との直接接触は、筋痙攣や麻痺のような生理的・神経的な副作用を引き起こすことがあります。\n\n「電撃痺れ」の段階が上がるほど、こうした副作用は各攻撃ごとに発現しやすくなります。
tl-volatility-modulation-technology=電離は、電流を用いる軍用システムの有効性を高める一般的な技法です。二つのコイルを交互の周波数で電離させると、エネルギープロファイルに相乗的な模様が現れます。この効果は生体電離と呼ばれ、対象電流の揮発包絡を大きく広げます。\n\n「生体電離」の各段階で、下限ダメージはさらに下がる一方、上限ダメージは大きく押し上げられます。
tl-volatility-probability-technology=双コイル電流の揮発性は、統合振幅調整器によって最大化されます。実戦では、生成された雷撃は中規模アパートより小さな生物を完全に消し飛ばせるだけのエネルギーを得ます。\n\n「蒸発」の各段階で、標的を即死させる確率が上がります。体力が5000を超える標的は死亡ではなく重傷になります。
ei-waveform-harmonics-1=Legacy コイルとブリッジ先テスラ系の最初の共有放電プロファイルを整えます。主ビームの見た目はまだ TL のままですが、着弾感触、ブリッジの意味論、テスラガンやテスラ弾薬、複製フルゴラ塔への最初の横断補正がここで始まります。
ei-waveform-harmonics-2=共有波形を現代的な連鎖追撃ファミリーへ押し広げます。基本コイルは調和した場アーク伝播を得て、発展コイルは近代化された後続放電ファミリーへ移行し、ブリッジされたテスラ系もようやく本格的な連鎖バーストを扱えるようになります。
ei-waveform-harmonics-3=調和の背骨を完成させます。追撃アークは Space Age の完全な連鎖言語を採用し、ブリッジ砲塔はより重い終盤連鎖報酬を受け取り、Legacy 枝は単なる数値研究ではなく本格的な教義分化へ入ります。
ei-storm-lattice-1=基本コイルは「最初のテスラ塔」ではなく、本物の制圧教義になります。嵐格子 I は目標の受け渡しを滑らかにし、伝播アーク網を広げて群れを場の中へ縛り付けます。
ei-storm-lattice-2=もはやただの偶然の散り方ではありません。嵐格子 II はより重い圧力の下でも分岐ネットワークを保ち、基本コイルが広く密な敵前線へ電荷を渡し続けられるようにします。
ei-storm-lattice-3=基本コイル制圧路線の完成形です。嵐格子 III は跳躍数、到達距離、嵐の幕のような役割を押し上げ、終盤の群制圧塔へ仕上げます。
ei-dielectric-rupture-1=発展コイルは戦線全体を抑えるためのものではありません。敵を殺し、残った電荷に次の獲物を探させるためのものです。誘電破砕 I は最初の後続放電に残る有効電荷を増やします。
ei-dielectric-rupture-2=誘電破砕 II は後続放電の連鎖寿命を延ばし、触れた相手をより確実に燃やします。発展コイルはあくまで処刑用の支柱であり、基本塔の複製にはなりません。
ei-dielectric-rupture-3=終盤の発展コイルは真の撃破連鎖兵器になります。誘電破砕 III は保持アーク、到達距離、燃焼継承を押し上げ、一度の撃破確認から密集波を崩せるようにします。
ei-bridge-coupling-1=バニラのテスラ系への橋は意図的に節度を残しています。ブリッジ結合 I は teslagun、テスラ弾薬、複製フルゴラ塔の終盤火力と制御継承を上げつつ、TL 塔そのものには変えません。
ei-bridge-coupling-2=ブリッジ系の終点は意図的に砲塔寄りです。ブリッジ結合 II により、複製フルゴラ塔はより濃い後続放電言語を継承し、携行テスラ装備は軽快さを保ちます。
ei-reactance-overdrive-1=戦車車体に二基の発展コイルを積んで礼儀正しく済むはずがありません。リアクタンス過駆動 I は揮発幅を広げ、飽和アークを増やしつつ、それでも別の固定塔にはしません。
ei-reactance-overdrive-2=融合時代のコイル制御により、テスラタンクは長い過負荷窓に乗れるようになります。リアクタンス過駆動 II は変調振れ幅、漏れ、爆路端の圧力をさらに増します。
ei-reactance-overdrive-3=これがタンクの最終特化形です。リアクタンス過駆動 III は塔との機械的な差別化を保ちつつ、単なる稲妻付き砲台ではなく移動する電気前線として感じさせます。
ei-exotic-waveform-convergence=教義の最後で、Legacy 塔は現代的な連鎖言語を借りる段階を終え、自前の現代主ビームを得ます。基本コイルは分岐場アーク塔になり、主撃がきれいに通るたびに確定の側枝バーストを得ます。発展コイルは集中した過充電ランス支柱になり、撃破確認のたびに通常の後続放電へ重ねて確定の異質処刑嵐を放ちます。テスラタンクは部分的にだけ合流し、着弾の放電表現が近代化され、正の揮発スパイクが車体を別の塔へ収束させることなく嵐前線バーストを起こせるようになります。複製フルゴラ塔もまた撃破確認時に砲塔専用の異質アフターショックを得ますが、携行テスラ装備まではそこへ届きません。

[exotic-industries-informatron]
menu_teslas_legacy=Tesla's Legacy
title_teslas_legacy=Tesla's Legacy
teslas-legacy=Tesla's Legacy兵装
teslas-legacy-text=かつて Tesla's Legacy と呼ばれた系統は、いまや Remembrance の電撃兵器群に編み込まれている。[item=tl-basic-tesla-coil]基礎テスラコイル、[item=tl-advanced-tesla-coil]高度テスラコイル、[item=tl-tesla-tank]テスラ戦車は、公称名と TL の外形を保ったまま、粗い電界塔から重い処刑支柱、装甲された雷前線へと連なる。\n\nこの系統はバニラ側のテスラ兵装にも橋を架ける。[item=teslagun]テスラガン、[item=tesla-ammo]テスラ弾薬、[item=tesla-turret]複製フルゴラ塔は、同じ電気の背骨を共有しながら、それぞれの役割を失わない。
teslas-legacy-2=挙動モード
teslas-legacy-text-2=現在の起動時挙動: [font=default-bold]__1__[/font]\n\n[font=default-bold]遺産忠実[/font]では、元の TL 挙動をそのまま継承する。旧補助再帰、持続補助、タイマー清掃、被弾由来の継承、上位コイルの撃破後残響、単発ザップの燃焼副作用、戦車の揮発流れまで、すべてが優先される。[font=default-bold]ハイブリッド[/font]は軽量路線だ。旧 TL 再帰を主軸にせず、代わりに TL 専用の補助格子を据え、その上に後続の調和技術と教義技術を重ねる。\n\n教義段階そのものは共通だが、適用順が異なる。ハイブリッドでは教義格子が主挙動になる。遺産忠実では元の TL 挙動が先に発火し、その上に現代的な追加要素が積まれる。
teslas-legacy-3=波形調和
teslas-legacy-text-3=波形調和は共通の近代化基盤だ。調和前の Legacy 線は元の TL 光束語法を保つ。調和 I で橋渡し側テスラ系と同じ電気語を話し始め、調和 II で基本・高度コイルは現代的な後続放電系へ移る。調和 III では後続アークがさらに深い連鎖言語を取り込み、橋渡し砲塔もようやく濃い後続放電を得る。\n\nここで、昔の「噛み合わなさ」は終わる。Legacy 塔、複製フルゴラ塔、手持ちテスラ系は、沈黙したまま並ぶのではなく、意図された接続線を持つ。
teslas-legacy-4=量子特化
teslas-legacy-text-4=調和の先で、教義は二分される。[font=default-bold]嵐格子[/font]は[item=tl-basic-tesla-coil]基礎コイルのものだ。より広い伝播、より滑らかな目標受け渡し、より持続的な群衆制圧へ押し上げる。[font=default-bold]誘電破砕[/font]は[item=tl-advanced-tesla-coil]高度コイルのものだ。撃破後の後続放電、残留電荷、燃焼継承を鋭くする。\n\n[font=default-bold]橋渡し結合[/font]は橋渡し系の後期専科だ。原版テスラ系を強化するが、TL 塔に押し込めはしない。複製フルゴラ塔はより重い砲塔収益を得て、手持ちテスラ装備は軽快さを保つ。
teslas-legacy-5=融合過駆動
teslas-legacy-text-5=戦車[item=tl-tesla-tank]は塔系の専科をそのまま共有しない。その後期教義は[font=default-bold]反応過駆動[/font]だ。双コイルの飽和、より広い揮発窓、走行帯に沿ってこぼれる電弧を重ねる、融合時代の戦車路線である。塔とは別の機械であり、固定支柱ではなく履帯上の雷前線として振る舞う。\n\n同時に、この系列の揮発専門家でもある。暴撃の山、調制の揺れ、蒸発は、依然として戦車の担当だ。
teslas-legacy-6=異質収束
teslas-legacy-text-6=最終段階は[font=default-bold]異質波形収束[/font]だ。TL 塔を新世代の複製品に置き換えるのではない。[item=tl-basic-tesla-coil]基礎コイルは仮組みの胴体を残したまま、現代的な[font=default-bold]分岐場弧塔[/font]へ成長し、主命中のたびに確定側方爆発を放つ。[item=tl-advanced-tesla-coil]高度コイルは高い支柱体を残したまま、集束した[font=default-bold]過充電長槍塔[/font]となり、撃破確認ごとに確定の異質処刑嵐をさらに放つ。\n\n[font=default-bold]遺産忠実[/font]では、これらの終局効果は元の TL 基盤の上に重なる。[font=default-bold]ハイブリッド[/font]では、より軽い教義格子の頂点に置かれる。[item=tl-tesla-tank]テスラ戦車は部分参加に留まる。揮発峰と蒸発は雷前線爆発を呼び得るが、車体は依然として装甲された系列成員のままだ。[item=tesla-turret]複製フルゴラ塔も、撃破確認時に砲塔専用の異質残響を得るが、[item=teslagun]テスラガンと[item=tesla-ammo]テスラ弾薬はより軽い橋渡し路線に留まる。
teslas-legacy-7=戦闘表示と既定の浮遊テキスト
teslas-legacy-text-7=戦闘表示は意図的に選別されている。[font=default-bold]クリティカル[/font]と[font=default-bold]蒸発[/font]の浮遊文字は既定で有効だ。例外的な瞬間は、確実に見えるべきだからだ。通常の[font=default-bold]ダメージ[/font]表示は既定で無効だ。毎回の撃ち合いを電光の紙吹雪にしないためである。\n\n教義の可動部分は今や多い。伝播跳躍、後続放電連鎖、橋渡し結合、戦車の揮発、最終光束近代化。既定設定は、劇的な瞬間だけを残し、戦場全体を騒音で埋めない。
