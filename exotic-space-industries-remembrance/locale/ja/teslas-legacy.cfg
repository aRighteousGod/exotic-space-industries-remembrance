[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=軽量路線。ドクトリン格子が放電ロジックを直接制御し、UPS負荷を軽減しながら戦場での役割を維持します。
ei-tl-behavior-mode-legacy-fidelity=デフォルト。レガシーの再帰処理、持続的なヘルパー放電、撃破による余震、およびUPSコストを無視したタンクの変調フローなど、オリジナルのTesla's Legacyの挙動を完全に維持します。
tl-advanced-attack-anim-charge-up=アドバンスドテスラコイルのコアを通じて眩しいチャージが昇っていき、頂点に達すると発射されます。これにより、他のタレットが先に標的を倒した場合、再照準が少し遅れることがあります。
tl-advanced-attack-anim-simple=敵が近づくとすぐにコイル間に電流が走ります。コイルは即座に発射されます。
