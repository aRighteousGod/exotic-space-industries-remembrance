[modifier-description]
ei-bridge-coupling-1-effect=ブリッジ結合Ⅰ：バニラのテスラシリーズを、「テスラの遺産」シリーズの下位互換にならないよう、終盤のブリッジダメージを引き上げます。
ei-bridge-coupling-2-effect=ブリッジ結合Ⅱ：フルゴラ製アークタワーが、より強力な終盤のブリッジ効果を継承します。
ei-dielectric-rupture-1-effect=誘電連鎖Ⅰ：ターゲット撃破後により多くの電荷を維持するようになります。
ei-dielectric-rupture-2-effect=誘電連鎖Ⅱ：ターゲット撃破後の伝播が、遠くまで届くようになり、より確実に対象を着火させます。
ei-dielectric-rupture-3-effect=誘電連鎖Ⅲ：上級コイルが敵の撃破確認を短い処刑の嵐へと変貌させます。
ei-exotic-waveform-convergence-effect=エキゾチック波形収束：レガシーコイルがアーク分岐、処刑の嵐、前線バーストを獲得し、フルゴラ製アークタワーにはタレット限定のエキゾチック余震開花が追加されます。
ei-legacy-tesla-family-damage-bonus=ダメージ増加： __1__
ei-legacy-tesla-family-shooting-speed-bonus=連射速度増加： __1__
ei-legacy-tesla-turret-damage-bonus=ダメージ増加： __1__
ei-legacy-tesla-turret-shooting-speed-bonus=連射速度増加： __1__
ei-reactance-overdrive-1-effect=リアクターオーバードライブⅠ：テスラタンクの変調範囲が拡大し、より多くの飽和放電を放つようになります。
ei-reactance-overdrive-2-effect=リアクターオーバードライブⅡ：テスラタンクがより長い過充電状態を維持し、激しい前線放電を繰り出します。
ei-reactance-overdrive-3-effect=リアクターオーバードライブⅢ：テスラタンクが核融合時代の最終形態である二連装コイルの残虐性に達します。
ei-storm-lattice-1-effect=嵐の電場格子Ⅰ：基本コイルのアーク伝播範囲が拡大し、ターゲットの切替がよりスムーズになります。
ei-storm-lattice-2-effect=嵐の電場格子Ⅱ：基本コイルが、より激しい敵の群れに対しても広大な放電格子を維持できるようになります。
ei-storm-lattice-3-effect=嵐の電場格子Ⅲ：基本コイルが真の終盤用制圧タレットへと進化します。
ei-waveform-harmonics-1-effect=高周波ハーモニクスⅠ：着弾仕様が調和され、最初の共通ブリッジボーナスが適用されます。
ei-waveform-harmonics-2-effect=高周波ハーモニクスⅡ：レガシーコイルとテスラシリーズに、近代的な連鎖追撃系が解禁されます。
ei-waveform-harmonics-3-effect=高周波ハーモニクスⅢ：Space Age完全対応の連鎖システムと、より強力な連鎖性能を獲得します。
