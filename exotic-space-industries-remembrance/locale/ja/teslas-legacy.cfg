[technology-description]
ei-bridge-coupling-1=バニラのテスラ技術は意図的に抑制されています。ブリッジ結合Ⅰ は、テスラガン／テスラ弾薬／およびフルゴラ複製コイルの終盤ダメージと制御継承を引き上げますが、それらを単なる偽装TLタレットに変えてしまうことはありません。
ei-bridge-coupling-2=ブリッジ結合Ⅱ により、フルゴラ製アークタワーは高密度の終盤余震システムを継承しますが、手持ちのテスラ装備はより軽量で持ち運びやすいまま維持されます。
ei-dielectric-rupture-1=発展コイルは前線全体を制圧するためのものではありません。確実に抹殺し、残った電荷に次の犠牲者を追わせるためのものです。誘電連鎖Ⅰは、エネルギーを多く残すことで、その設計思想を効率的に実現します。
ei-dielectric-rupture-2=誘電連鎖Ⅱは連鎖をより長く維持し、一度の放電で効率的に目標を破壊します。発展コイルは基本タレットのコピーではなく確実な処刑タワーであり、その暴力がより遠くまで届くようになります。
ei-dielectric-rupture-3=終盤の発展コイルは真の連続殺傷兵器となります。誘電連鎖Ⅲは、射程を長く、アーク連鎖を多く、そして過激な燃焼の状態異常を付与し、一度の発射で密集した敵対ユニットをまとめて崩壊させます。
ei-exotic-waveform-convergence=ドクトリンの終着点において、レガシーのタレット群は他時代の連鎖システムの借用をやめ、ついに自身独自の現代的メインビームを獲得します。基本コイルは「分岐電磁弧タレット」となり、クリーンヒット時にサイド分岐バーストを確定発生させます。上級コイルは集中型の「過充電ランス柱」となり、撃破確認のたびに通常の余震ロジックの上に確定エキゾチック処刑ストームを重ねて発生させます。テスラタンクは一部のみ参加し、着弾時に隣接放電の近代化を獲得し、正の変調スパイクが車両の個性を損なうことなく前線バーストを引き起こせるようになります。フルゴラ複製コイルも撃破確認時にタレット限定のエキゾチック余震開花を獲得しますが、手持ちのブリッジ装備は獲得しません。
ei-reactance-overdrive-1=戦車に二連装コイルを搭載するなどという過激な発想。リアクターオーバードライブⅠは変調範囲を拡大し、固定せず戦車に搭載するという制限の中で、維持できる飽和アークの量を増加させる。
ei-reactance-overdrive-2=核融合時代のコイル制御技術により、テスラタンクはより長い過充電ウィンドウを維持できます。リアクターオーバードライブⅡは前線追従機能をさらに強化し、変調の振幅が大きくなり、スピルが増加し、爆風レーンの端へのより強い圧力を生み出します。
ei-reactance-overdrive-3=これがテスラタンクの最終型である。リアクターオーバードライブⅢは、車両としての機動力を維持したまま、全体的な性能を高めている。もはや砲撃プラットフォームというより「履帯を持った走る前線電磁場」のように感じられる。
ei-storm-lattice-1=基本コイルは単なる「最初のテスラタレット」ではなく、真の制御ドクトリンとなる。嵐の電場格子Ⅰはターゲットの切り替えロジックを改善し、伝播するアーク網を広げることで、より効率的に、敵の群れを纏めて捉えられるようになる。
ei-storm-lattice-2=ラティスはもはやアーク散乱によって自然に形成されるものではなく、設計し制御するものとなった。嵐の電場格子Ⅱは、激しい圧力下で散乱する電磁場を一つに繋ぎ止め、より広く高密度な敵の前線全体を捉えられるようになる。
ei-storm-lattice-3=基本コイル制御ラインの完成形。嵐の電場格子Ⅲは、分散するアークタレットを終盤の群衆制御兵器へと昇華させる。より多くの連鎖、より長い射程、そして上級コイルよりも軽量かつ広範な戦略兵器としてのアイデンティティを獲得する。
ei-tesla-weapons=フルゴラ滅亡前の研究所から発掘されたアーク技術。理論を完全に解明できた訳ではないが、実用に耐えうるレプリカを作成できるようになる。出力や効率は、フルゴラ人の設計した「本物」には適わないが、それでも従来の電磁兵器よりは遥かに優れている。これ以上の洗練には、本物のフルゴラ人を連れてくる必要がある。
ei-waveform-harmonics-1=レガシーコイルとブリッジ接続されたテスラファミリーの間の最初の共通放電プロファイルを調整します。主要なTLの見た目は現在のところレガシーのままですが、着弾フィードバックの向上、より明確なブリッジ仕様、そしてテスラガン、テスラ弾薬、フルゴラ複製コイルへの最初の直接的なクロスオーバーをもたらします。
ei-waveform-harmonics-2=この共通波形を最新の連鎖追撃系へと拡張します。基本コイルは調和されたアーク伝播を獲得し、上級コイルは近代化された余震系を使い始め、ブリッジ接続されたテスラファミリーはTLラダーの完全に外側に位置するのではなく、適切な連鎖バーストを放てるようになります。
ei-waveform-harmonics-3=高調波の主軸を完成させます。追撃アークは完全なSpace Age連鎖システムを採用し、ブリッジタレット側には終盤向けの強力な連鎖効果が与えられ、レガシー部門は単なるステータス強化ではない真のドクトリン特化への準備が整います。
tl-advanced-tesla-coils-technology=テスラコイルの著しい改良型。射程が拡大し、出力が非常に高くなっています。また、耐久性を高めるために頑丈な鋼鉄装甲が施されています。
tl-basic-tesla-coils-technology=テスラコイルは、膨大な放電をターゲットに叩き込むアーク変圧器である。単発の火力こそ控えめだが、同時に複数の標的にダメージを与える。
tl-flames-count-technology=高レベルの電流によって粉塵が発火すると、極めて激しい燃焼反応が発生します。炎は数秒しか持続しませんが、危険なレベルの熱を発生させ、すべてを黒焦げにします。\n\n研究レベルごとに、発生する炎の数と秒間ダメージが増加します。
tl-flames-explosion-technology=テスラコイルの電撃で膨大なエネルギーが放出されると、空気そのものを発火させることができます。この反応は激しい炎の爆風となって現れます。\n\n研究レベルごとに爆発の範囲が広がります。\n\n攻撃力：タレット攻撃力の60%。
tl-flames-probability-technology=極限まで濃縮されたエネルギーは、地面の植物、粉塵、あるいは空気そのものに着火することがあります。\n\n研究レベルごとに着火させる確率が上がります。
tl-multi-zap-damage-technology=放出されるエネルギーの波長を調整することで、伝播する電荷を安定させ、より高いダメージを与える電撃アークが形成されます。\n\n研究レベルごとに、伝播する電荷のダメージが増加します。
tl-multi-zap-probability-technology=テスラコイルを常時使用すると、その周囲が電離粒子で満たされます。これによって誘導された電荷が元のターゲットからを超えて近くの物体へ伝播するようになります。\n\n研究レベルごとに、近くのターゲットへ連鎖する確率が上がります。
tl-multi-zap-range-technology=コイル内の電流を高くすると、周囲の静電気場における電離粒子の数が増加します。これによって空気中に電荷の足場が発生し、より遠くのターゲットに到達するようになります。\n\n研究レベルごとに、連鎖の有効射程が伸びます。
tl-single-zap-count-technology=発展テスラコイルの攻撃を受けた生物は、大量の静電気エネルギーを吸収します。その負荷によって死に至る場合もあります。静電気エネルギーを吸収した対象が破壊された場合、そのエネルギーが外へと弾け飛びます。この現象を放電ボルトと呼びます。\n\n研究レベルごとに、タレットによって敵が撃破された際に放出される放電ボルトの数が増加します。
tl-single-zap-damage-technology=ターゲット破壊後に残った電荷は放電ボルトとなります。放電ボルトになるのは初期エネルギーのごく一部ですが、テスラコイル全体の共振レベルを微調整することで、残る割合を増幅できます。\n\n研究レベルごとに、放電ボルトのダメージが増加します。
tl-single-zap-probability-technology=発展テスラコイルは信じられないほどの量の電気エネルギーを照射します。ターゲットがその電流を保持しきれずに溢れた電撃アークは、近くのターゲットにエレクトロショックを与えます。\n\n研究レベルごとに、発展テスラコイルが敵を撃破した際に、追加の電撃アークが発生する確率が上がります。
tl-slowdown-duration-technology=強力な電流は強い効果をもたらし、ターゲットの内部に長く留まります。\n\n研究レベルごとに、「エレクトロショック」効果の持続時間が延長されます。
tl-slowdown-multiplier-technology=特定のエネルギーレベルを高周波数と組み合わせることで、移動を著しく妨げる筋肉麻痺を引き起こすことができます。\n\n研究レベルごとに、「エレクトロショック」の移動速度低下効果が強くなります。
tl-slowdown-probability-technology=強力な電流と直接接触すると、筋肉の痙攣や麻痺などの肉体的あるいは神経学的な副作用を引き起こす可能性があります。\n\n研究レベルごとに、この副作用が発生する確率が高くなります。
tl-tesla-ammo-upgrade-technology=携帯テスラコイル技術の進歩により、テスラコイルの基礎構造に設計上の欠点が判明しました。この欠点を解消することで、テスラコイル全体を、より高効率かつ高性能に拡張します。
tl-tesla-coil-damage-technology=より強力なコンデンサを取り付け、電流周波数にわずかな振動を導入することにより、テスラコイルの電撃アークの有効ダメージを増加させることができます。
tl-tesla-coil-shooting-speed=バッテリー効率の最新の改善をテスラコイル設計に適用することで、より早く限界容量に到達させ、連射速度を大幅に向上させます。
tl-tesla-tank-technology=中型の発展テスラコイルを2基搭載した戦車。発射機構に必要なエネルギー源には携帯テスラコイルを用いる。搭載されたコイルは同時に発射され、干渉することなく相乗効果を生み出し、ほとんどの物質を貫通して経路上のすべてを破壊する稲妻を放つ。
tl-volatility-modulation-technology=イオン化は、電撃系統兵装の効率を高めるための一般的な手法です。交差周波数を使用して連装コイルをイオン化すると、エネルギープロファイルに相乗パターンが生じます。電離と呼ばれるこの効果は、影響下にある電流の変動範囲を大幅に拡大します。\n\n研究レベルごとに、最小ダメージの確率低減＆最大ダメージの確率上昇。
tl-volatility-probability-technology=連装コイル電流の不安定な性質は、統合された振幅調整器によって最大化されます。実際には、発生した稲妻は中型建造物よりも小さい生物を蒸発させるのに十分なエネルギーが発生します。\n\n研究レベルごとに、ターゲットを即死させる確率が増加します。耐久値が5000を超えるターゲットには、即死せず大ダメージが発生します。
