[mod-setting-name]
ei-arc-furnace-light-flicker-preset=アーク炉ライトのちらつき

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=アーク炉の稼働中ライトだけを調整します。オリジナルは現在の荒々しいアーク光を保ちます。ちらつき軽減とソフトな脈動は揺らぎを穏やかにします。静的な発光は一定の光を保ちます。オフは稼働中ライトを消し、炉のアニメーションと待機中の赤いコンデンサー発光は残します。

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=オフ
ei-arc-furnace-light-flicker-preset-static=静的な発光
ei-arc-furnace-light-flicker-preset-soft=ソフトな脈動
ei-arc-furnace-light-flicker-preset-reduced=ちらつき軽減
ei-arc-furnace-light-flicker-preset-original=オリジナル

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=稼働中ライトを消します。炉のアニメーションと待機中の赤いコンデンサー発光は残ります。
ei-arc-furnace-light-flicker-preset-static=ちらつきを無効にし、稼働中の発光を一定に保ちます。
ei-arc-furnace-light-flicker-preset-soft=暗くゆっくりした脈動を残し、炉列の光を穏やかにします。
ei-arc-furnace-light-flicker-preset-reduced=重なったアーク色を残しつつ、ちらつきを遅く狭くします。
ei-arc-furnace-light-flicker-preset-original=現在の荒々しいアーク炉ライトをそのまま保ちます。
