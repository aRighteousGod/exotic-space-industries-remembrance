[mod-setting-name]
ei-alert-icon-set=アラートのアイコン
ei-alert-icon-set-default=アラートの初期アイコン

[mod-setting-description]
ei-alert-icon-set=ESIRのアラートと生態系画面に表示するアイコンを選択。「起動時の設定を適用」で、現在の起動時設定を個人設定にコピーします。起動時設定を変更しても、保存済みの個人設定は維持されます。
ei-alert-icon-set-default=個人設定が保存されていないプレイヤーの初期アイコン。保存済みの個人設定は維持されます。初期設定：立体オブジェクト。

[string-mod-setting]
ei-alert-icon-set-vanilla=Factorio標準風
ei-alert-icon-set-default-vanilla=Factorio標準風
ei-alert-icon-set-startup-default=起動時の設定を適用
ei-alert-icon-set-original=従来のアイコン
ei-alert-icon-set-svg=鋳金の紋章
ei-alert-icon-set-rendered=立体オブジェクト
ei-alert-icon-set-default-original=従来のアイコン
ei-alert-icon-set-default-svg=鋳金の紋章
ei-alert-icon-set-default-rendered=立体オブジェクト
