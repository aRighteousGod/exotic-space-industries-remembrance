[string-mod-setting-description]
ei-pyric-radiance-preset-ember=小さな光を少量加えます。移動する光は控えめです。
ei-pyric-radiance-preset-veiled=通常の戦闘エフェクトを控えめに照らします。
ei-pyric-radiance-preset-furnace-vigil=地面や森林の炎を強調します。移動する光は追加しません。
ei-pyric-radiance-preset-iron-benediction=発砲時の閃光を強め、射撃位置を目立たせます。
ei-pyric-radiance-preset-signal-threads=弾道の照明を強め、飛んでいく弾丸を目立たせます。
ei-pyric-radiance-preset-tempered=標準の控えめな照明です。命中時や核爆発の追加照明はありません。
ei-pyric-radiance-preset-night-liturgy=戦闘を広く暖かい光で照らし、命中時の照明を加えます。
ei-pyric-radiance-preset-siege-hymn=発砲時の閃光を強め、飛来する弾丸を見やすくします。
ei-pyric-radiance-preset-cataclysm=爆発の光を大きくし、核爆発の閃光を強調します。
ei-pyric-radiance-preset-apotheosis=雰囲気と光の密度を最大限に高めます。
ei-ballistic-divergence-preset-needle-oath=弾丸は直進し、ばらつきや追加飛距離はありません。マガジン弾数とショットガン本来の散弾の広がりは従来どおりです。
ei-ballistic-divergence-preset-measured-volleys=弾丸のばらつきは小さく、地形を保護します。マガジン弾数は従来どおりです。
ei-ballistic-divergence-preset-breach-doctrine=弾丸のばらつきとマガジン弾数を増やします。地形へのダメージは軽減しません。
ei-ballistic-divergence-preset-tempered=ばらつきと追加飛距離は適度な設定です。現在の弾薬コストを維持します。
ei-ballistic-divergence-preset-distant-thunder=追加飛距離を伸ばしつつ、弾丸のばらつきは抑えます。
ei-ballistic-divergence-preset-fortress-oath=マガジン弾数を増やし、適度なばらつきと地形保護を適用します。
ei-ballistic-divergence-preset-wildfire-doctrine=弾丸のばらつきと散弾の飛距離のばらつきの指定倍率を大きくし、マガジン弾数を増やして地形を保護します。
ei-ballistic-divergence-preset-crossfire=追加飛距離と弾丸のばらつきを大きくします。地形へのダメージは軽減しません。
ei-ballistic-divergence-preset-saturation=長い追加飛距離と大きなばらつきに加え、弾丸用マガジンの弾数を2倍にし、地形を保護します。
ei-ballistic-divergence-preset-terminal-barrage=追加飛距離、ばらつき、マガジン弾数を最大にします。地形へのダメージは軽減しません。

