pyric-radiance=Pyric Radiance
pyric-radiance-text=炉の証が、夜を照らす。炎は燃料ごとの色を保ち、通常の射撃や爆発はその軌跡を照らします。起動時設定で、熾火、射撃位置、弾道、広い戦場の照明から重視する演出を選べます。マップ、延焼、暗視装置、懐中電灯、昼夜の周期は従来どおりです。エキゾチック弾薬の爆発やエネルギー兵器のエフェクトは、独自の見た目を維持します。
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=弾丸は誓いを帯びても、命中は約束しない。既存の弾丸が物理的な弾道を描き、敵や中立の障害物に衝突します。自勢力には衝突しませんが、別の友好勢力には命中します。既存の範囲ダメージや燃焼エフェクトは、それぞれのルールを維持します。貫通弾薬と劣化ウラン弾薬には、基礎物理ダメージの25倍を上限とする貫通能力があり、倒した対象は通過できますが、生き残った対象で弾丸が止まります。エキゾチック弾薬の着弾効果は、すべて1回だけ適用します。対応する有効な武器は、弾薬の射程補正、品質、銃口位置の余裕を含めた発射体の飛距離の上限を共有します。設定では、この基準を超える追加飛距離を制限し、弾丸と散弾の飛距離のばらつきを上限内に収めます。武器の照準範囲とショットガン本来の散弾の広がりは変わりません。外れた弾は、ゲーム本来の飛距離制限で消滅します。新しい上限は新たに発射した弾に適用し、すでに飛んでいる弾は保存された飛距離と着弾効果を維持します。一部の設定はマガジン弾数を増やしたり、地形を保護したりしますが、レシピ、研究、ショットガン弾薬の弾数、ロボットのダメージは変更しません。
