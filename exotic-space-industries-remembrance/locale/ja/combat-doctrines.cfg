[mod-setting-description]
ei-pyric-radiance=燃焼する炎、火炎の噴流、通常の爆発、発砲時の閃光、物理的な発射体に照明を加えます。燃料ごとの色と独自の特殊エフェクトは維持します。変更するのは演出のみで、延焼、マップ、暗視装置、懐中電灯、昼の長さは従来どおりです。無効にしても、選択した設定は保存されます。
ei-pyric-radiance-preset=炎、爆発、弾道、発砲時の閃光の照明バランスを選びます。倍率は光の半径に適用し、0の場合はその種類の演出を従来どおりに保ちます。命中時の追加照明と核爆発の追加閃光は、演出の多い設定でのみ有効です。既存の核爆発のカメラ効果は変更しません。エキゾチック弾薬やエネルギー兵器の独自エフェクトは、それぞれの演出を維持します。\n
ei-ballistic-divergence=弾丸が実際に飛び、狙いを外したり、射線上の別の対象に命中したりします。既存の弾丸用マガジン、ショットガンの散弾、弾丸を撃つロボットが対象です。自勢力のプレイヤーや建造物には衝突しませんが、別の友好勢力や中立の障害物には命中します。既存の範囲ダメージや燃焼エフェクトは、それぞれのルールを維持します。貫通弾薬と劣化ウラン弾薬は、基礎物理ダメージの25倍を貫通の上限値として、倒した対象を通過します。生き残った対象には弾丸が止められます。エキゾチック弾薬は、すべての着弾効果を1回の命中で与えます。弾薬や研究は追加しません。無効にしても、選択した設定は保存されます。
ei-ballistic-divergence-preset=発射体の最大追加飛距離、弾丸のばらつき、マガジン弾数、散弾の飛距離のばらつきの指定倍率を選びます。飛距離の基準は、対応する有効な武器の最大射程に、弾薬の射程補正、品質、銃口位置の余裕を加えた距離です。この基準を超える追加飛距離は最大16タイルで、武器が照準を合わせる射程は変わりません。弾丸のばらつきの倍率は、角度偏差0.16と飛距離の偏差の指定値0.40に適用します。0では追加のばらつきがなくなります。弾丸と散弾の飛距離のばらつきは、選択した追加飛距離の上限内に制限します。ショットガン本来の散弾の広がりは維持します。弾丸用マガジンの弾数は端数を切り上げます。ショットガン弾薬の弾数とロボットの弾薬は変更しません。地形保護は物理耐性の最低値を設定します。樹木は固定軽減2・割合軽減65%、岩は固定軽減4・割合軽減75%となり、すべての物理ダメージに影響します。\n

