tip-mode=1 全周、2 扇形、3 外周、4 単発、5 方位固定。モードごとに手動の範囲設定を保持する。
tip-radius=正の値は研究と品質による上限までに制限される。1チャンクは32タイル。
tip-near=外側半径より小さくする。外周、単発、方位固定で使用する。
tip-start=時計回りの範囲の開始点。走査方向とは独立している。
tip-stop=時計回りの範囲の終了点。北をまたぐ範囲も指定できる。同じ角度なら360°。
tip-bearing=幅32タイルの帯を繰り返し観測する。
tip-speed=0で停止。100で機体、研究、品質による上限を要求する。全体の処理上限により実際の速度は低下する。
tip-direction=1 時計回り、-1 反時計回り、0 扇形で往復。方位固定でも0を指定できる。
tip-policy=監視は生成済みかつ地図に表示済みのチャンクのみ。探索は新しい地形を生成できる。
tip-contacts=直近の重複しない検出結果、最後に完了したスキャン全体、または最後の観測1回の結果を保持する。
tip-expiry=実際に観測した時刻から1～300秒。公開した時刻からではない。
tip-run=正の信号で動作、0以下で停止。中止した作業に支払った電力は戻らない。
tip-trigger=立ち上がりで1回スキャンする。動作中の追加トリガーは無視する。「スキャン中」の出力まで信号を保持し、次の入力前に0に戻す。ボタンで手動実行できる。
