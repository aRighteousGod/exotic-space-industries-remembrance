description=研究で強化できる指向性レーダー。基本最大半径：__1__チャンク。機体の基本上限：毎秒__2__回の観測。赤線で操作し、緑線で結果を出力する。開くと設定できる。実際の速度は電力と全体の処理上限により変わる。研究と品質により範囲、速度、電力効率が向上する。
