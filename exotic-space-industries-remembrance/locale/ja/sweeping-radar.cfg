informatron-body=赤線は有効にした設定項目の入力、緑線は検出結果の出力。0も有効な入力値として扱う。5つの動作モードと3つの結果保持方式は最初から利用できる。研究は範囲、速度、電力効率を強化し、品質はこれらの性能と耐久力を高める。\n\n1回の観測で1チャンクを地図に表示し、生存している敵対勢力の軍事目標を調べる。位置と経過時間は最後の観測時点のもので、対象を追跡し続けるわけではない。有効な検出数0と、結果が利用できない状態は区別される。検索1回につき候補128体、作業中の記録は最大2,048件。打ち切られた結果の検出数は下限値となる。\n\n監視は地形を生成しない。探索による生成要求は全レーダーで30ティックに1回まで。完了しない要求は60秒で打ち切り、不完全な範囲として扱う。範囲を変更すると未完了の作業と結果を破棄する。停止、凍結、無効な設定では結果の有効性を停止する。単発スキャン後の待機中は結果を保持できる。中止した作業の電力は返却されない。\n\n観測開始の上限は全レーダー合計で毎秒120回。さらに電力、地形生成、検出処理による制限がある。設定速度は要求値であり、画面には設置後の平均実測速度、理想所要時間、前回の実測時間を表示する。ビームは完了した観測に合わせて動き、アンテナの絵は正確な方位を示さない。\n\n待機電力と観測電力は同じ補助蓄電設備から消費する。コピーと修復後の設備は空の状態で開始する。アップグレード時は設定と残存電力を引き継ぐが、新しい容量を超えた電力は引き継がない。通常のレーダーも引き続き利用できる。\n\n基本の電力仕様：走査レーダーは待機1 MW、観測1回8 MJ、入力上限64 MW、蓄電容量16 MJ。フェーズドアレイレーダーは待機2 MW、観測1回5 MJ、入力上限128 MW、蓄電容量10 MJ。品質による強化は半径が最大＋4チャンク、観測速度が最大＋50%、観測電力が最大20%減少し、研究の効果と組み合わされる。品質の効果はレジェンダリーを上限とする。品質によって待機電力や全体の処理上限は変わらない。停止中や単発スキャンの待機中も待機電力を消費する。入力上限は充電時の上限であり、実際の消費電力は経過した待機時間と受け付けた観測回数によって決まる。
