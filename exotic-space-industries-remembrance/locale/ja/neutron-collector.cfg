[virtual-signal-description]
ei-neutron-efficiency=現在の収集効率を0から300で出力します。
ei-neutron-distance=結び付いた源までの距離を0.1タイル単位で出力します。
ei-neutron-collector-agent=収集機エージェント状態を出力します: 1 稼働, 2 待機, 3 阻害。
ei-neutron-source-agent=源エージェント状態を出力します: 1 稼働, 2 休止, 3 不在。
ei-neutron-scan-agent=走査エージェント状態を出力します: 1 安定, 2 汚染, 3 再結合待機。

