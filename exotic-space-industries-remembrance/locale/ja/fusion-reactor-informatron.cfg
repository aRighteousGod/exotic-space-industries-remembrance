[exotic-industries-informatron]
menu_fusion_power=核融合発電の段階
title_fusion_power=核融合発電の段階
fusion-power=核融合発電の段階
fusion-power-text=Space Age の Aquilo [color=orange]核融合炉[/color] [item=fusion-reactor] は、高密度プラズマ核融合炉です。小型で熱出力を重視し、ほとんど閉じ込められています。弱い二次中性子漏出はありますが、それは残滓であり、本格的な増殖源ではありません。\n\nESIR の[color=orange]熱核融合炉[/color] [item=ei-fusion-reactor] は、さらに後段の重い機械です。制御されたプラズマ容器の中で加熱された軽元素燃料を燃やし、中性子生成を意図した出力として扱います。\n\n閉じた鉛冷却材ループで動作します。[fluid=ei-cold-coolant]が炉心へ入り、[fluid=ei-hot-coolant]が熱を抱えて出ていきます。建設費は重く、運転はさらに飢えています。稼働した炉は、加熱された核融合燃料を絶えず要求します。\n\nESIR の初期燃料は[fluid=ei-heated-protium]と[fluid=ei-heated-lithium-6]です。より強い燃料系列は[fluid=ei-heated-deuterium]、[fluid=ei-heated-tritium]、[fluid=ei-heated-helium-3]へ進みます。
fusion-power-2=中性子源
fusion-power-2-text=高密度プラズマ核融合炉 [item=fusion-reactor] が供給できるのは、弱い二次中性子漏出だけです。線源として検出されることはありますが、高度な燃料作業に必要な強い中性子束へ調整することはできません。\n\nESIR の熱核融合炉 [item=ei-fusion-reactor] は、強力で調整可能な中性子源として作られています。低温は中性子漏出を増やし、中温は妥協点を保ち、高温は出力を優先して中性子束を抑えます。\n\n近くの[color=orange]中性子コレクター[/color] [item=ei-neutron-collector]は、範囲内で最も強く利用可能な線源に結び付きます。炉の種類、モード、距離、稼働状態が、有効な中性子束を決めます。\n\n中性子は飾りではありません。高度な核融合燃料の通貨です。近くに建て、意図して調整し、明るい星が必ずしも寛大な星ではないことを忘れないでください。
menu_fusion_reactor_controls=熱核融合炉の制御
title_fusion_reactor_controls=熱核融合炉の制御
fusion-reactor-controls=手動制御
fusion-reactor-controls-text=ESIR の熱核融合炉コンソールには、燃料1、燃料2、温度、注入率の4つの手動制御が残ります。これらは見た目だけの設定ではありません。組み合わせによって、燃料消費、冷却材流量、推定出力、調整可能な中性子束を決めるロック済みの隠しレシピが選ばれます。
fusion-reactor-controls-2=燃料ペアとロックされたレシピ
fusion-reactor-controls-text-2=点火できるのは有効な燃料ペアだけです。選んだ第二燃料が第一燃料と反応できない場合、炉は不可能な状態に残らず、順序付きテーブル内の最初の有効な第二燃料へ戻ります。
fusion-reactor-controls-3=温度と注入
fusion-reactor-controls-text-3=温度と注入は別々のレバーです。低温は中性子漏出を最も強めますが低出力です。中温は妥協点です。高温は中性子源を抑えて電力へ寄せます。低注入は燃料を節約し、中注入は安定し、高注入は大きな燃料コストで強く燃えます。
menu_fusion_reactor_circuit_interface=融合回路インターフェース
title_fusion_reactor_circuit_interface=融合回路インターフェース
fusion-reactor-circuit-interface=隠しコンビネータ・インターフェース
fusion-reactor-circuit-interface-text=炉の回路面は、他のESIRシステムで使われる不可視コンビネータ方式に従います。隠しインターフェースは見える炉のコネクタへ内部配線され、テレメトリを出力し、炉がCircuitモードの時だけ制御信号を受け付けます。
fusion-reactor-circuit-interface-2=読み書き信号の契約
fusion-reactor-circuit-interface-text-2=Manualモードは書き込み信号を無視しますが、配線されていれば状態を出力します。Circuitモードは [virtual-signal=ei-fusion-set-fuel-1]、[virtual-signal=ei-fusion-set-fuel-2]、[virtual-signal=ei-fusion-set-temperature]、[virtual-signal=ei-fusion-set-injection] を読みます。燃料値は1プロチウム、2重水素、3三重水素、4ヘリウム3、5リチウム6です。温度と注入は1低、2中、3高です。欠落または0の項目は手動フォールバックを使います。読み取り用の状態信号は別名なので、信号の反響で自分自身を命令しません。
menu_fusion_reactor_agents=核融合炉エージェント
title_fusion_reactor_agents=核融合炉エージェント
fusion-reactor-agents=エージェント状態
fusion-reactor-agents-text=エージェントは回路と診断のための短い状態値です。制御エージェントはManualかCircuitかを示します。燃料エージェントは選択ペアが有効か補正済みかを示します。熱エージェントは低・中・高の閉じ込め姿勢を示します。冷却エージェントは選択レシピの冷却要求が有効かを示します。回路エージェントは未配線、読み取り可能、指令中の状態を示します。
fusion-reactor-agents-2=信号値
fusion-reactor-agents-text-2=数値規約は単純です。制御エージェントは1手動、2回路。燃料エージェントは1有効、2補正済み。熱エージェントは1低、2中、3高。冷却材エージェントは1有効な需要、3無効または空。回路エージェントは1未配線、2読み取り可能、3指令中です。
menu_fusion_reactor_options=核融合炉オプション
title_fusion_reactor_options=核融合炉オプション
fusion-reactor-options=オプションとフォールバック
fusion-reactor-options-text=オプションは、同じ4つの手動制御に重ねる便利な命令です。初期化は重水素-三重水素、中温、中注入へ戻します。コレクター更新は近くの中性子コレクターに炉を再評価させます。
fusion-reactor-options-2=プリセットと上書き
fusion-reactor-options-text-2=出力、束、均衡のプリセットは、細かな制御を隠さずに妥当な手動値を選びます。Circuitモードでは、回路項目が欠落、0、または無効な時に、その手動値がフォールバックとして残ります。
menu_fusion_neutron_collectors=核融合源と中性子コレクター
title_fusion_neutron_collectors=核融合源と中性子コレクター
fusion-neutron-collectors=コレクターの線源優先度
fusion-neutron-collectors-text=中性子コレクターは2つの核融合段階をどちらも線源として見ますが、線源強度が重要です。Aquilo の高密度プラズマ核融合炉 [item=fusion-reactor] は弱い二次漏出しか出しません。ESIR の熱核融合炉 [item=ei-fusion-reactor] は、稼働して調整されていれば強い中性子束を届けられます。熱核融合炉のレシピ変更は範囲内コレクターが見る中性子倍率を変えるため、炉モードが変わるとコレクターのキューが更新されます。
fusion-neutron-collectors-2=配置圧
fusion-neutron-collectors-text-2=コレクターは幾何を報酬にします。近い低温の熱核融合炉 [item=ei-fusion-reactor] は強い中性子束で燃料生産を支えます。高温の発電構成はより多くの熱を作りながら、コレクターを飢えさせることがあります。近くの高密度プラズマ炉 [item=fusion-reactor] は背景漏出にすぎません。工場は、その星を発電機にするのか、増殖源にするのか、精密に分けた誓約にするのかを決めなければなりません。

