fusion-neutron-collectors=中性子源の優先度
fusion-neutron-collectors-2=レイアウトの制限
fusion-neutron-collectors-text=中性子コレクターはどの核融合段階でも使用できますが、中性子源の強度は大きく異なります。アクィロの高密度プラズマ核融合炉[item=fusion-reactor]は微弱な二次漏洩しか期待できませんが、ESIRの熱核融合炉[item=ei-fusion-reactor]は稼働・調整時に強力な中性子束を提供できます。熱核融合炉のレシピを変更すると範囲内のコレクターが認識する中性子乗数が変化するため、原子炉のモードが変更されるとコレクターの処理キューが更新されます。
fusion-neutron-collectors-text-2=コレクターは最適な配置によって真価を発揮します。近距離にある低温動作中の熱核融合炉[item=ei-fusion-reactor]は強力な中性子を放ち高効率に稼働しますが、高温動作を前提とした電力構成では、中性子コレクターの稼働効率は著しく低下します。近くにある高密度プラズマ炉[item=fusion-reactor]は背景の環境放射に過ぎません。工場の設計時に、この星の電力源を原子炉にするか、増殖炉にするか、あるいは緻密に組み合わせるか、決めて置く必要があります。
fusion-power=核融合出力tier
fusion-power-2-text=高密度プラズマ核融合炉[item=fusion-reactor]は、微弱な二次中性子漏洩しか提供できません。中性子源として認識されることはあっても、高度な燃料加工が要求する強い中性子束に調整することは不可能です。\n\nESIRの熱核融合炉[item=ei-fusion-reactor]は、強力かつ調整可能な中性子源として設計されています。低温では中性子の漏洩（放出）が優先され、中温ではバランスが保たれ、高温ではパワー出力を優先して中性子束が抑制されます。\n\n近くの[color=orange]中性子コレクター[/color][item=ei-neutron-collector]は、範囲内にある最も強力な利用可能ソースに結合します。原子炉の種類、モード、距離、および稼働状態によって、到達する有効な中性子束の量が決定されます。\n\n中性子は単なる飾りではなく、高度な核融合燃料のための資源（通貨）です。近くに建設し、計画的に調整を行い、より明るく輝く星が必ずしもより寛大であるとは限らないことを心に留めておいてください。
fusion-power-text=Space Ageの惑星アクィロにある[color=orange]核融合炉[/color][item=fusion-reactor]は、高密度プラズマを利用した核融合炉です。小型で熱出力に特化し、大部分が密閉されています。微小な二次中性子の漏洩はありますが、それらは残留物に過ぎず、本格的な増殖源にはなりません。\n\nESIRの[color=orange]熱核融合炉[/color][item=ei-fusion-reactor]は、より後期に登場する大型の建造物です。制御されたプラズマ容器内で加熱された軽原子燃料を燃焼させ、意図的な産物として中性子を供給します。\n\nこの原子炉は密閉された鉛冷却材ループで動作します。[fluid=ei-cold-coolant]が容器に入り、[fluid=ei-hot-coolant]が熱を帯びて排出されます。建設コストが高く、運用における消費量も甚大です。一度稼働すれば、容赦なく加熱された核融合燃料を要求します。\n\n初期のESIRプロセスは[fluid=ei-heated-protium]と[fluid=ei-heated-lithium-6]から始まります。より強力な燃料チェーンは、[fluid=ei-heated-deuterium]、[fluid=ei-heated-tritium]、および[fluid=ei-heated-helium-3]によって解放されます。
fusion-reactor-agents-2=信号の値
fusion-reactor-agents-text=エージェントは回路制御に用いるために用意された、状態を表す値です。制御エージェントは手動か回路制御の状態を表現します。燃料エージェントは選択されたペアが有効か補正されたかを報告します。熱エージェントは封じ込め圧力の低／中／高を表現します。冷却材エージェントは、選択されたレシピが有効な冷却材要求を満たしているかを報告します。回路エージェントは未配線／読み取り可能／命令中の状態を報告します。
fusion-reactor-agents-text-2=制御エージェント：1手動／2回路。燃料エージェント：1有効／2補正済み。熱エージェント：1低／2中／3高。冷却材エージェント：1有効な需要／3無効または空。回路エージェント：1未配線／2読み取り可能／3指令中。
fusion-reactor-circuit-interface=隠されたインターフェース
fusion-reactor-circuit-interface-2=信号の入出力仕様
fusion-reactor-circuit-interface-text=原子炉の回路構造は、他のESIRシステムと同じ回路パターンに従います。内部の隠しインターフェースが可視状態の原子炉コネクタに配線されており、信号を出力し、あるいは回路モード時には入力にも使用できます。
fusion-reactor-circuit-interface-text-2=手動モードでは入力信号は無視されますが、出力信号は使用できます。回路モードでは、[virtual-signal=ei-fusion-set-fuel-1]、[virtual-signal=ei-fusion-set-fuel-2]、[virtual-signal=ei-fusion-set-temperature]、[virtual-signal=ei-fusion-set-injection]を読み取ります。燃料の値は 1:プロチウム、2:重水素、3:三重水素、4:ヘリウム3、5:リチウム6 です。温度および注入率は 1:低、2:中、3:高 を使用します。未設定または0の場合は手動設定値へ自動的に互換されます。情報出力には独立した信号が使用されるため、信号が重複して無限ループに陥る心配はありません。
fusion-reactor-controls-2=燃料の組み合わせとレシピのロック
fusion-reactor-controls-3=温度と注入率
fusion-reactor-controls-text=ESIR熱核融合炉のコンソールには、燃料1／燃料2／温度／注入率の4つの手動制御項目があります。4項目の組み合わせにより内部的にレシピが変化し、投入燃料の使用量、冷却材の処理能力、推定電力、調整可能な中性子束が定まります。
fusion-reactor-controls-text-2=燃料の組み合わせが有効な場合のみ着火可能です。燃料の組み合わせが反応できないペアだった場合、コンソールの自動補正機能によって、定義テーブル順で最初に適合する有効な燃料に自動修正されます。
fusion-reactor-controls-text-3=温度と注入率は独立した操作項目です。低温稼働時は、中性子出力は最も強力ですが、電力出力は低くなります。高温は逆に、中性子源を抑圧し、電力出力を重視したスタイルです。低注入率は燃料を節約し、中注入率は安定、高注入率は燃料コストを大幅に引き上げる代わりに強力に燃焼します。
fusion-reactor-options-2=プリセットと上書き
fusion-reactor-options-text=オプションは、4つの手動制御の上に用意された便利なプリセットコマンドです。「デフォルトに戻す」を実行すると、中温・中注入率の重水素-三重水素設定に戻ります。「コレクターを更新」は、近くの中性子コレクターに原子炉の再評価を指示します。
fusion-reactor-options-text-2=「電力重視」、「中性子束重視」、「バランス」の各プリセットを選択すると、詳細な手動設定なしに適切な値を自動設定できます。回路モードでは、回路の入力項目が未設定、0、または無効な場合に、これらの手動設定値が互換設定値として使用されます。
