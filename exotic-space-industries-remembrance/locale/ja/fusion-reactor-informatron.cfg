[virtual-signal-description]
ei-fusion-set-fuel-1=燃料1の回路入力。値: 1プロチウム、2重水素、3三重水素、4ヘリウム3、5リチウム6。
ei-fusion-set-fuel-2=燃料2の回路入力。値: 1プロチウム、2重水素、3三重水素、4ヘリウム3、5リチウム6。
ei-fusion-set-temperature=温度の回路入力。値: 1低、2中、3高。
ei-fusion-set-injection=注入率の回路入力。値: 1低、2中、3高。
ei-fusion-state-fuel-1=有効な燃料1インデックスを出力します。
ei-fusion-state-fuel-2=有効な燃料2インデックスを出力します。
ei-fusion-state-temperature=有効な温度インデックスを出力します。
ei-fusion-state-injection=有効な注入インデックスを出力します。
ei-fusion-power=推定反応炉出力をMWで出力します。
ei-fusion-neutron-flux=中性子束を100倍して出力します。
ei-fusion-efficiency=効率パーセントを出力します。
ei-fusion-coolant-rate=毎秒の高温冷却材量を100倍して出力します。
ei-fusion-control-agent=1手動または2回路を出力します。
ei-fusion-fuel-agent=1有効または2補正済みを出力します。
ei-fusion-thermal-agent=1低、2中、3高を出力します。
ei-fusion-coolant-agent=1有効な冷却材需要または3無効を出力します。
ei-fusion-circuit-agent=1未配線、2読み取り可能、3指令中を出力します。
