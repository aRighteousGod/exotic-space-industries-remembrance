[mod-setting-name]
ei-beacon-diminishing-returns=ビーコン効果の減衰

[mod-setting-description]
ei-beacon-overload=有効時は、過負荷の上限を超えると設備が停止します。極低温位相差ビーコンは1個、絶対零度位相差ビーコンは2個として数え、エイリアンビーコンとワープビーコンは対象外です。無効時は、ESIRの4種類すべてに選択した減衰設定を適用します。
ei-beacon-diminishing-returns=ビーコン過負荷が無効のときだけ適用されます。同じ設備に届くビーコンが増えるほど、ESIRのビーコンが伝えるモジュール効果が減衰します。消費電力や汚染への効果も対象です。種類を問わず1個ずつ数えるため、弱いビーコンを追加すると合計効果が下がる場合があります。1個だけなら効果は減衰しません。モジュール容量、品質、冷却剤、燃料の要件は変わりません。\n設備に届くビーコンが1／4／8／16個のときの、1個あたりの効果：\n__1__\nVanilla curveは減衰曲線のみを再現し、ESIRの各ビーコンの性能と全種類を合算する方式を維持します。減衰表は4096個分で、それを超えると最後の倍率が使われます。

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Gentle
ei-beacon-diminishing-returns-vanilla=Vanilla curve
ei-beacon-diminishing-returns-strict=Strict（デフォルト）
ei-beacon-diminishing-returns-harsh=Harsh
ei-beacon-diminishing-returns-severe=Severe
ei-beacon-diminishing-returns-saturating=Saturating

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=ビーコン過負荷：有効。設備ごとの上限は4個分です。極低温位相差ビーコンは1個分、絶対零度位相差ビーコンは2個分として数え、エイリアンビーコンとワープビーコンは対象外です。効果の減衰設定は適用されません。
overload-disabled=ビーコン過負荷：無効。減衰設定：__1__。ESIRの4種類すべてが効果の減衰を受けます。設備に届くビーコンは種類を問わず1個ずつ数え、弱いビーコンを追加すると合計効果が下がる場合があります。
