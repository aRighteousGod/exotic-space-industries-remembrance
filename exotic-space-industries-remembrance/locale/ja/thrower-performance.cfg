[mod-setting-name]
ei-thrower-performance-profile=火炎・酸放射タレットの処理負荷

[mod-setting-description]
ei-thrower-performance-profile=火炎・酸放射タレットの噴流粒子、射撃、煙、燃焼・腐食ダメージの発生頻度を減らします。1回の命中ダメージと流体消費量を増やし、継続射撃時の理論上の秒間ダメージと流体消費量を維持します。地面の炎のダメージ、成長、燃料ごとの持続時間は変更しません。「従来どおり」では既存の動作を維持します。8倍・16倍では射撃間隔が大きく開くため、移動する敵への命中範囲、炎の成長、固定値の耐性による影響が変わります。倍率は処理頻度の削減率であり、UPSの向上率を保証するものではありません。携帯武器と車両武器には適用しません。\n以下は品質・研究・他のModによる変更前の値です。列：射撃間隔／粒子の発生間隔／毎秒の粒子数／命中ダメージ・流体消費の倍率／燃焼ダメージの間隔／腐食ダメージの間隔。間隔の単位はティック（60ティック＝1秒）です。

[string-mod-setting]
ei-thrower-performance-profile-original=従来どおり
ei-thrower-performance-profile-2x=頻度を1/2に削減
ei-thrower-performance-profile-4x=頻度を1/4に削減
ei-thrower-performance-profile-8x=頻度を1/8に削減
ei-thrower-performance-profile-16x=頻度を1/16に削減

[string-mod-setting-description]
ei-thrower-performance-profile-original=従来の動作：射撃間隔4ティック、粒子間隔2ティック、毎秒30粒子。命中ダメージと流体消費量は通常どおり。燃焼間隔10ティック、腐食間隔1ティック。
ei-thrower-performance-profile-2x=射撃間隔8ティック、粒子間隔4ティック、毎秒15粒子。命中ダメージと1射ごとの流体消費量は2倍。燃焼間隔20ティック、腐食間隔2ティック。
ei-thrower-performance-profile-4x=射撃間隔16ティック、粒子間隔8ティック、毎秒7.5粒子。命中ダメージと1射ごとの流体消費量は4倍。燃焼間隔30ティック、腐食間隔4ティック。
ei-thrower-performance-profile-8x=射撃間隔32ティック、粒子間隔16ティック、毎秒3.75粒子。命中ダメージと1射ごとの流体消費量は8倍。燃焼間隔30ティック、腐食間隔8ティック。射撃がまばらになり、命中範囲や固定値の耐性の影響が変わります。
ei-thrower-performance-profile-16x=射撃間隔64ティック、粒子間隔32ティック、毎秒1.875粒子。命中ダメージと1射ごとの流体消費量は16倍。燃焼間隔30ティック、腐食間隔16ティック。射撃が非常にまばらになり、命中範囲や固定値の耐性の影響が変わります。

