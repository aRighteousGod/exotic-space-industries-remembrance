[technology-name]
ei_em-trains=リニア列車
[technology-description]
ei_em-trains=リニア列車は、インフラにE2クリスタルを用いた新たな物流方式です。[item=ei_charger] [color=orange]リニアチャージャー[/color]は、リニア列車を同期させ、レールから直に推進力を供給する電磁フィールドネットワークを形成します。このシステムは惑星上と宇宙空間のどちらにも構築可能であり、研究を進めることで、速度や加速性能の大幅な向上が見込めます。電磁フィールド範囲を十分に確保できない場合、推進力を失う可能性があります。
