[entity-description]
ei_charger=リニア列車ネットワークを形成するノード。惑星上あるいは宇宙プラットフォームの両方において、リニア列車ネットワークの中核となる。電磁フィールドが消失するとトラクションを失う。高品質になるとエネルギー効率が向上し、よりクリーンなネットワークを維持できるようになる。
ei_em-cargo-wagon=リニアチャージャーが有効な経路内を移動するように設計された、磁場結合型輸送モジュール。
ei_em-fluid-wagon=リニアチャージャーが有効な経路内を移動するように設計された、磁場結合型輸送モジュール。
ei_em-locomotive=[item=ei_charger][color=orange]電磁フィールド[/color]ネットワークのクライアントとして動作する磁場駆動型の機関車。電磁フィールドメッシュから推進力を受け取るため、その範囲外では推進力を失い動けなくなります。高品質なリニア機関車は、範囲を離れた際に一時的に整合性を維持できます。
