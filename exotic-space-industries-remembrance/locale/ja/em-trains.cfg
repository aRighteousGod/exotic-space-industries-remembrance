[technology-name]
ei_em-trains=EM列車

[technology-description]
ei_em-trains=EM 列車は、クリスタル グリッド インフラストラクチャに基づく新しい輸送パラダイムです。 [item=ei_charger] [color=orange]充電器[/color] は、EM 車両を同期させ、鉄道経路を通じて動力を供給するフィールド メッシュを確立します。このアーキテクチャは、地上および宇宙対応回廊の両方をサポートしており、研究を通じて速度と加速の大幅なボーナスが得られる可能性があります。一貫したフィールド範囲がなければ、推進は失敗します。

[item-description]
ei_charger=EM充電器。 EM トランスポートで使用されるネットワーク エンベロープを作成および維持するアクティブ フィールド ノード。それは、惑星と宇宙旅行の両方のセグメントの運用上のつながりです。フィールドを失うと EM 推進が無効になります。高品質のフィールド ノードは、エネルギーの無駄が少なく、よりクリーンな格子を維持します。
ei_em-locomotive=EM機関車。 [item=ei_charger][color=orange]充電器[/color] ネットワークのクライアントとして機能するフィールド駆動型ムーバー。モーションはフィールドメッシュから受信されます。カバー範囲がない場合、ユニットは不活性になります。高品質のカプラーは、メッシュを離れた後も場のコヒーレンスを一時的に維持できます。
ei_em-cargo-wagon=EMカーゴワゴン。軌道供給ラインを含む充電器対応経路内を移動するように設計された受動的なフィールド結合型輸送モジュール。
ei_em-fluid-wagon=EM液ワゴン。パッシブフィールド結合流体輸送モジュールは、地上ルートおよびオフワールドルート上の充電フィールドストリームの一部として完全性を維持します。

