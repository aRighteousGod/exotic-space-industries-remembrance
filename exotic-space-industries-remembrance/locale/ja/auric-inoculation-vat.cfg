[recipe-description]
ei-auric-inoculation-vat=近くの湿地盆地を占有し、Glebaで接種サイクルを回し、のちに沼地からアウリック嚢胞節点を開花させるアウリック接種槽を建造します。
ei-auric-cyst-washing=収穫したアウリック嚢胞を過熱蒸気で焼き洗いし、開いた外殻を硫酸で侵食します。金を含む核は塊へ割れ、使い果たされた組織は腐敗物と汚水として剥がれ落ちます。

[technology-name]
ei-auric-marsh-inoculation=アウリック湿地接種

[technology-description]
ei-auric-marsh-inoculation=Glebaのアウリック接種槽、嚢胞処理、洗浄工程を解放します。有効な湿地盆地を占有し、サイクル試薬を供給し、汚染が開花崩壊を招く前に抑え込んでください。

