[recipe-description]
ei-auric-cyst-washing=収穫した金質嚢胞を蒸し焼きにした後、外側の殻を硫酸で洗い流す。金を含む核を砕いて取り出し、腐敗物と汚水の残渣が残る。
ei-auric-inoculation-vat=金質培養槽を作成する。グレバの湿地エリアに設置すると周辺の湿地を制御し、金質嚢胞を開花させる。
