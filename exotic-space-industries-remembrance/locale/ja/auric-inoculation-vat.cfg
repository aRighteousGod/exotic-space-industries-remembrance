ei-auric-vat-contamination=槽の現在の汚染圧を0から100で出力します。
ei-auric-vat-band=占有した湿地タイル数に基づく、現在の盆地バンド指数を1から7で出力します。
ei-auric-vat-claims=現在その槽が占有している湿地盆地タイル数を出力します。
ei-auric-vat-bloom=ブルーム状態を出力します: 1 安定、2 緊張、3 破綻。

