[mod-setting-name]
ei-container-capacity-profile=コンテナ容量プリセット

[mod-setting-description]
ei-container-capacity-profile=他のMODも含め、保管用チェストの容量を設定します。通常品質でのスロット数です。列の順序：木製 / 鉄製 / 鋼鉄製 / 小型 / 中型 / 倉庫。\n__1__\n\n通常型・フィルター型・物流型は、同じサイズなら同じ容量になります。既存の品質ボーナスは維持されます。機械の機能に使われるインベントリは対象外です。設定を下げると既存のインベントリが縮小し、アイテムが失われる場合があります。

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=通常品質のスロット数：木製 __1__ / 鉄製 __2__ / 鋼鉄製 __3__ / 小型 __4__ / 中型 __5__ / 倉庫 __6__。

[string-mod-setting]
ei-container-capacity-profile-restrained=制限（デフォルト）
ei-container-capacity-profile-standard=標準
ei-container-capacity-profile-expanded=拡張
ei-container-capacity-profile-generous=大容量
ei-container-capacity-profile-industrial=産業用
ei-container-capacity-profile-massive=巨大
ei-container-capacity-profile-vast=広大
ei-container-capacity-profile-extreme=最大

[string-mod-setting-description]
ei-container-capacity-profile-restrained=通常品質のスロット数：木製 8 / 鉄製 16 / 鋼鉄製 16 / 小型 24 / 中型 32 / 倉庫 64。
ei-container-capacity-profile-standard=通常品質のスロット数：木製 8 / 鉄製 16 / 鋼鉄製 24 / 小型 32 / 中型 64 / 倉庫 128。
ei-container-capacity-profile-expanded=通常品質のスロット数：木製 16 / 鉄製 24 / 鋼鉄製 32 / 小型 48 / 中型 96 / 倉庫 192。
ei-container-capacity-profile-generous=通常品質のスロット数：木製 16 / 鉄製 32 / 鋼鉄製 48 / 小型 64 / 中型 128 / 倉庫 256。
ei-container-capacity-profile-industrial=通常品質のスロット数：木製 24 / 鉄製 48 / 鋼鉄製 64 / 小型 96 / 中型 192 / 倉庫 384。
ei-container-capacity-profile-massive=通常品質のスロット数：木製 32 / 鉄製 64 / 鋼鉄製 96 / 小型 128 / 中型 256 / 倉庫 512。
ei-container-capacity-profile-vast=通常品質のスロット数：木製 48 / 鉄製 96 / 鋼鉄製 128 / 小型 192 / 中型 384 / 倉庫 768。
ei-container-capacity-profile-extreme=通常品質のスロット数：木製 64 / 鉄製 128 / 鋼鉄製 192 / 小型 256 / 中型 512 / 倉庫 1024。
