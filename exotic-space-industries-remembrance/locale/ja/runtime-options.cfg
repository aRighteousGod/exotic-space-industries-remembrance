[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=最もコンパクトな演出。4段階の波状演出、強いエフェクト制限、副次的なアクセント演出なし、大規模爆発なし。
ei-flammable-rupture-fidelity-runtime-standard=デフォルト。6段階の波状演出、適度な制限、意味のある副次アクセント1種、抑えめな爆発。
ei-flammable-rupture-fidelity-runtime-cinematic=8段階の波状演出、より広範な煙と火炎の割り当て、より豊かなアクセント演出、そして外側へゆっくり広がる厳かな爆発。
ei-flammable-rupture-fidelity-runtime-unbounded=視覚効果の上限を削除し、演出を最大限に描写します。安定ではなく演出の豪快さを重視した設定です。巨大なタンクが破裂した際などに、UPSを著しく低下させるおそれがあります。
ei-gaian-saucer-wake-visual-fidelity-runtime-off=残像を封印し、可視的な航跡は存在しない
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=短く制御された薄い色彩の残り香のみが船体に追従する
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=航跡をはっきりと描き、そして緩やかに消えていく
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=航跡は広く長く残り、旋回にあわせて曲がる
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=ホバーフレームが通過したすべての場所に、高密度で光り輝く航跡を残す
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=無制限。世界が耐えうる限りのすべての航跡を刻む
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=下部は円を閉ざし、目に見える浮遊のきらめきなしで動く。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=四つのエミッター円が短く地面に応え、抑制されたプリズムの縁だけを残す。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=移動が圧力へ変わるにつれ、エミッターは船体の下に安定したエメラルドの輪を書く。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=輪は明るく重なり、各浮遊脚の周りでミントグリーンのプリズム片へ裂ける。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=各エミッターが遺物の下に濃密な発光印章を開く。その暴力はほとんど祈りに近い。
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=リミッターは破壊されました。すべてのホバー足が、戦車が通過した記憶を刻みつけるように地面を強制刻印します。
