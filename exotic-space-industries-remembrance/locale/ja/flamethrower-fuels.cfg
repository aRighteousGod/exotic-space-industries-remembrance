[item-name]
ei-flamethrower-fuel=火炎放射器用弾薬（__1__）
[item-description]
ei-flamethrower-fuel=火炎ダメージ：原油弾薬の__1__%。地面の炎は最初__2__秒間持続し、燃料を当て続けると最大__3__秒まで延長されます。敵に付着した炎の持続時間は変わりません。車両の火炎放射器は従来の燃焼挙動を維持します。
[entity-description]
ei-flamethrower-fuel=燃料の演出：__1__。地面の炎は最初__2__秒間持続し、燃料を当て続けると最大__3__秒まで延長されます。
[mod-setting-name]
ei-flamethrower-fuel-adaptation=火炎放射タレットの燃料別エフェクト
[mod-setting-description]
ei-flamethrower-fuel-adaptation=使用中の燃料に合わせて、タレットの炎・煙・地面の炎の持続時間を自動で変更します。無効時は共通のエフェクトと通常の持続時間を使用しますが、燃料ごとのダメージ補正と弾薬の種類は維持されます。更新は16 tickごとに行います。燃料確認とタレットの置換試行には、それぞれ「1 tickあたりのスクリプト更新数」の設定値をそのまま上限として使います。無効にすると、この上限内で既存のタレットを順次元に戻します。初期値：有効。
