[item-description]
ei-surveyor-carbine=ガラス照準器を備えた蒸気時代のカービン。発射は遅いが、圧力補正された銃身は通常の自動火器より遠くまで届く。
ei-surveyor-rifle=電動安定化されたサーベイヤー機構。射撃は慎重なままだが、照準像はより澄んでいる。
ei-surveyor-cannon=シミュレーション時代の対物サーベイヤー。自動射撃の大口径規律は、モデル化された着弾とカーボン繊維の反動構造に支えられている。
ei-adaptive-surveyor=量子時代のモジュラー狙撃システム。優れたデータが、引き金が動き終わる前に薬室、銃身、風、標的を予測する。
ei-inferno-grenade=目標地点で爆発性の燃える破片へ裂けるよう作り替えたクラスターグレネード。各破片は着弾時に爆発し、その後それぞれの火の輪を撒く。
ei-incinerator-capsule=高速のデストロイヤー派生機「インシネレーター」を5機放つ。追従し、焼き、炎の慈悲を拒む。
ei-prediction-snare-mine=敵性移動を予測し、周囲の生体へ運動を乱す偽信号を流し込む設置型シミュレーション罠。
ei-breach-solver-charge=巣、ワーム、硬化目標を割るため、狭い過剰爆発へシミュレーションデータを費やす小型解析爆薬。

