[item-description]
ei-adaptive-surveyor=量子時代のモジュール式狙撃システム。トリガーを引いた瞬間－－否－－火蓋が落ちきる前に、薬室、砲身、風、標的を先読みして補正します。
ei-breach-solver-charge=シミュレーションデータを研究し、高威力かつピンポイントの爆風で巣／ワーム／その他の強固な目標を撃破するコンパクトな爆薬。
ei-incinerator-capsule=デストロイヤーをベースに開発されたこのロボットはプレイヤーに追従し、敵性ユニットを無慈悲に焼き尽くす。
ei-inferno-grenade=破裂した際に火炎を撒き散らすよう再設計されたクラスター手榴弾。破片着弾時に更に爆発し、炎の環を形成します。
ei-prediction-snare-mine=敵性ユニットの移動を予測し、生物の運動機能を乱す信号を大量に浴びせる。
ei-surveyor-cannon=シミュレーション時代の対物サベイヤーキャノン。精密な着弾計算とカーボンファイバー製の反動吸収構造により、50口径の自動射撃制御を実現します。
ei-surveyor-carbine=照準器を備えた蒸気時代のカービン銃。連射速度は遅いものの、圧力補正された銃身により、通常の自動兵器よりもはるかに長い射程を誇ります。
ei-surveyor-rifle=安定化された電気時代のサベイヤーフレーム。精密な射撃精度を維持しつつ、照準視界をよりクリアに進化させました。
