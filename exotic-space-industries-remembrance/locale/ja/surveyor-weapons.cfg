[technology-description]
ei-surveyor-carbine=古い機関銃の骨格に、ガラス、圧力、鉄の補正機構を加える。速くなるのではない。遠くへ届く。
ei-surveyor-rifle=電動復帰機構と改良光学系でサーベイヤー形式を安定化し、遠射の教義を電気時代へ進める。
ei-surveyor-cannon=シミュレーションデータとカーボン繊維プレートで補強し、サーベイヤー系列を自動対物兵器へ変える。撃ち続けるが、各弾はなお照準器の支配下にある。
ei-adaptive-surveyor=優れたデータ、奇妙なメッキ、適応薬室の教義で、サーベイヤー系列を量子長距離処刑システムへ変える。
military-5=シミュレート殺傷ドクトリンを体系化する。予測罠、ブリーチ爆薬、インフェルノ弾薬、火炎ロボット拡張を一つの公認指揮枠組みに収める。
ei-inferno-grenade=クラスターグレネードをシミュレート火炎による区域封鎖弾へ改造することを認可する。外殻が裂け、破片が降り、着弾ごとに新たな火の輪を書く。
ei-incinerator=デストロイヤー由来のインシネレーターを認可する。五機の高速護衛機が追従し、焼き、炎の慈悲を拒む。
