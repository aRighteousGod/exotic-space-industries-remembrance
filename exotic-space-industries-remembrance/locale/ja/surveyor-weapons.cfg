[technology-description]
ei-adaptive-surveyor=高度なデータ処理、未知の装甲プレート、そして推進力理論を駆使した結果、サベイヤーシリーズは量子時代の長距離処刑システムへ到達した。
ei-incinerator=5機編成でプレイヤーに追従し、容赦なく敵を焼き尽くす高速護衛ロボット。デストロイヤーから派生する。
ei-inferno-grenade=手持ちの小型火炎弾として再設計されたクラスター手榴弾をアンロックする。手榴弾が破裂すると破片が飛び散り、更にその破片が新たな炎の環を刻みます。
ei-surveyor-cannon=シミュレーションデータとカーボンファイバープレートで補強し、サベイヤーシリーズを強力な対物兵器へと進化させます。連射した場合でも正確に照準に収まります。
ei-surveyor-carbine=古いサブマシンガンのフレームに、スコープ／圧力制御／補正機構を追加します。これにより連射力だけではなく圧倒的な射程を実現しました。
ei-surveyor-rifle=電動の反動制御と光学照準によりサベイヤー型を安定させ、長距離射撃ドクトリンを電気時代へと拡張します。
military-5=予測トラップ／解析爆薬／グレネード／火炎ロボットの投入など、殺戮シミュレーションドクトリンを正規の運用フレームワークとして体系化します。
