[mod-setting-name]
ei-spider-range-aware-cycling=スパイダートロンの射程に応じた武器切り替え

[mod-setting-description]
ei-spider-range-aware-cycling=車両の武器切り替えが有効な場合、射程内に目標がある武器を選び、一定時間の連続射撃を順番に行います。周囲の目標を定期的に検索します。無効時はスクリプトによる検索を行わず、標準の武器切り替えを使用します。射程の違いにより切り替えが止まる場合があります。

