[entity-name]
ei-scout-spidertron=偵察用スパイダートロン
assault_spidertron=強襲用スパイダートロン
[entity-description]
ei-scout-spidertron=偵察と物流に使う三脚歩行車両。固定武装はありませんが、装備グリッドには個人用レーザーなどのアーマー用装備を搭載できます。共通のシャーシ研究が適用されます。
assault_spidertron=砲・機関銃・火炎放射器を備えたシミュレーション時代の戦闘車両。研究により長距離砲、武装の改良、自動煙幕を追加できます。共通のシャーシ研究が適用されます。
[item-name]
ei-stored-spidertron=__1__（装備グリッド __2__×__3__）
ei-assault-smoke-charge=強襲用スパイダートロンの煙幕弾
[item-description]
ei-assault-smoke-charge=強襲用スパイダートロンのトランクに入れて使用します。研究後、大きな被弾時や被弾後の耐久力が半分未満になったときに1個を消費し、周囲の敵を6秒間減速させます。再使用まで30秒。
[technology-name]
ei-spider-vehicles=スパイダー車両
ei-assault-spidertron=強襲用スパイダートロン
ei-assault-smokescreen=スパイダートロンの自動煙幕
[technology-description]
ei-spider-vehicles=物流機能、遠隔操作、装備グリッドを備えた三脚式の偵察用スパイダートロン。偵察型・強襲型・ロケット型に共通するシャーシ研究を解禁します。
ei-assault-spidertron=砲1門、機関銃1丁、火炎放射器1基を搭載するシミュレーション時代の強襲用スパイダートロン。武装と煙幕の研究を解禁します。
ei-assault-smokescreen=敵の一撃で最大耐久力の5%以上を失うか、被弾後の耐久力が50%未満になると、トランクの煙幕弾を1個消費します。移動しない煙幕が半径8タイル以内の敵移動ユニットを最大64体まで6秒間、35%減速させます。再使用まで30秒。ダメージや透明化の効果はありません。
