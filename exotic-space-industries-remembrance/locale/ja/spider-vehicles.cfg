weapon-description=自陣営の該当する全スパイダートロンの武装を改良します。__1__：射撃間隔 __2__ tick、射程 __3__ タイル、最小射程 __4__ タイル。既存の弾薬と通常の弾薬研究を使用します。実際の連射速度は武器の切り替えと弾薬の補正にも左右されます。
