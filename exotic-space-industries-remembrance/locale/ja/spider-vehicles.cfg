chassis-hull-description=共通改良：偵察型の最大耐久力が__1__、強襲型とロケット型が__2__になります。残り耐久力の割合を維持します。
chassis-cargo-description=共通改良：トランクが偵察型は__1__スロット、強襲型とロケット型は__2__スロットになります。
chassis-fuel-description=共通改良：燃料と使用済み燃料のインベントリが、それぞれ偵察型は__1__スロット、他の2種類は__2__スロットになります。
chassis-efficiency-description=3種類すべての車両の燃焼効率が__1__になります。燃料1個から移動に利用できるエネルギーが増えます。
chassis-armor-description=3種類すべての車両で、物理・爆発耐性が各車両の基本値から__1__ポイント上昇します。上限は90%です。固定値のダメージ軽減は変わりません。
chassis-grid-description=装備グリッドを拡張します：偵察型 __1__、強襲型 __2__、ロケット型 __3__。既存装備は保持されます。回収した車両は拡張グリッドを安全に復元できる保管用の種類になります。
