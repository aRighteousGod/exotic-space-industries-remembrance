title_terrain_evolution=地形・生態系の変化

[ei-terrain]
overview=地形・生態系変化は、汚染による土壌劣化、記録に基づく回復、掘削痕、樹木の反応をまとめて管理します。火災、海岸線、崖、血液、舗装への影響は個別に設定できます。ナウヴィス、ガイア、対応する各惑星では、それぞれの地形系統を維持します。TerrainEvolutionとTerrainEvolution2の着想を取り入れています。
protections=通常の土壌変化では、プレイヤーが敷いた床、建造物、資源鉱床、未対応の地形を保護します。回復はESIRが記録した変化をたどるため、すべての地形を草地に変えることはありません。災害にも保護条件が適用されます。機能を無効にしても、過去の地形変化は元に戻りません。
calendar=季節を表す簡易暦は、読み込まれた星図の距離と向きを使います。惑星の位置や昼夜周期全体の長さは変更しません。昼の長さの変化と生態系への季節の影響は別々に設定できます。フルゴラの独立した時計は維持されます。対応する外部MODや外部からの変更を検出した場合、ESIRは昼夜の制御を譲ります。
performance=少量ずつ頻繁に処理します。「超低負荷」「低負荷」は処理量を最小限に抑えます。初期設定の「軽量」も負荷を抑えた設定です。「均衡」「詳細」「高精度」「超高精度」の順に、処理が行き渡る速さとUPSへの負荷が増えます。「カスタム」は個別の上限を使います。処理枠は全地表で共有し、変化の強さや災害の有効・無効は別々に設定します。
effective=状態：__1__／処理：__2__／強度：__3__
mining-note=対象の掘削機の採掘範囲内で有限の鉱床が枯渇すると、採掘跡が残ることがあります。枯渇イベントから原因となった掘削機は特定できません。採掘跡は初期設定では永続します。有効・無効、範囲、今後の採掘跡の復元は生態系設定で変更できます。
unsupported=この地表または機能には対応していません。
invalid-value=値または設定の組み合わせが無効です。
updated=生態系設定を更新しました。
status-enabled=有効
status-disabled=無効
status-active=動作中
status-active-clamped=動作中（季節の変動幅を制限）
status-external-control=外部が制御中
status-frozen=時刻が固定されています
status-pending=待機中
status-released=制御を解放済み
status-excluded=対象外
status-invalid-input=入力が無効
status-invalid-baseline=昼夜の基準値が無効
status-invalid-geometry=季節の計算条件が無効
status-incompatible-baseline=昼夜の基準値に非対応
status-diurnal-dynamics=Diurnal Dynamics
status-TerrainEvolution2=Terrain Evolution 2
status-TerrainEvolution=TerrainEvolution

