[string-mod-setting-description]
ei-terrain-intensity-restrained=「控えめ」は0.5倍、「標準」は1倍、「強い」は2倍です。「カスタム」は指定した倍率を使います。処理量の上限は別の設定です。
ei-terrain-intensity-standard=「控えめ」は0.5倍、「標準」は1倍、「強い」は2倍です。「カスタム」は指定した倍率を使います。処理量の上限は別の設定です。
ei-terrain-intensity-severe=「控えめ」は0.5倍、「標準」は1倍、「強い」は2倍です。「カスタム」は指定した倍率を使います。処理量の上限は別の設定です。
ei-terrain-intensity-custom=「控えめ」は0.5倍、「標準」は1倍、「強い」は2倍です。「カスタム」は指定した倍率を使います。処理量の上限は別の設定です。
ei-terrain-performance-ultra-low=処理間隔：16ティック。エンティティ検索：128ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大1件、タイルの変更は最大1枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-low=処理間隔：16ティック。エンティティ検索：64ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大2件、タイルの変更は最大2枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-lean=処理間隔：16ティック。エンティティ検索：32ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大4件、タイルの変更は最大4枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-balanced=処理間隔：8ティック。エンティティ検索：16ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大4件、タイルの変更は最大4枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-detailed=処理間隔：4ティック。エンティティ検索：8ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大8件、タイルの変更は最大4枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-high-fidelity=処理間隔：2ティック。エンティティ検索：4ティックごとに最大1回。処理1回あたり、回復履歴の確認は最大8件、タイルの変更は最大4枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-ultra-high-fidelity=処理間隔：1ティック。エンティティ検索：2ティックごとに最大2回。処理1回あたり、回復履歴の確認は最大16件、タイルの変更は最大8枚です。上限は全地表で共有し、実際の処理量は条件によって変わります。
ei-terrain-performance-custom=処理間隔、検索間隔、処理量と保存件数の上限を個別に指定します。1回の処理量を小さくし、検索間隔を長くすると、瞬間的な負荷を抑えられますが、処理が行き渡るまで時間がかかります。プリセットを変更しても、記録済みの回復履歴は保持されます。
ei-terrain-wildfire-off=生態系変化による着火を無効にします。熱による焼け跡と、無関係な戦闘由来の火災はそれぞれ別に制御します。
ei-terrain-wildfire-contained=延焼しない炎を生成します。寿命は最大10秒で、着火回数にも上限があります。他の火災は管理対象になりません。
ei-terrain-wildfire-spreading=Factorio標準の延焼を使用します。最初の着火回数には上限がありますが、その後の延焼はESIRのスクリプト処理上限の対象外で、UPSが大きく低下する場合があります。

