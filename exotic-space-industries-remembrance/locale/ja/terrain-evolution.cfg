[mod-setting-description]
ei-terrain-evolution-enabled=ESIRの惑星ごとの地形・生態系変化を有効にします。汚染による地形の劣化と回復、資源枯渇イベントによる掘削痕、野生樹木の衰弱と再生、季節による昼の長さの変化が対象です。個別の機能、対象惑星、UPSを考慮した処理上限は「MOD設定 → マップ」で設定できます。任意の災害機能は初期状態では無効です。フルゴラでは独立した昼夜制御を維持します。無効にすると地形を元に戻さず新たな変化を停止し、昼夜設定はESIRが管理を維持している場合に限り元に戻します。
ei-terrain-active=有効にした対応地表で、生態系変化と季節による昼の長さの変化を実行します。無効にすると地形の変化を元に戻さず新たな処理を停止します。昼夜設定は、他の制御によって変更されていない場合に限り元に戻します。
ei-terrain-intensity=変化速度の倍率は「控えめ」で0.5倍、「標準」で1倍、「強い」で2倍です。「カスタム」は指定した倍率を使います。処理量の上限とは別の設定で、無効な災害機能を有効にすることはありません。
ei-terrain-performance=少量ずつ頻繁に処理します。「超低負荷」「低負荷」は処理量を最小限に抑えます。初期設定の「軽量」も負荷を抑えた設定です。「均衡」「詳細」「高精度」「超高精度」の順に、処理が行き渡る速さとUPSへの負荷が増えます。「カスタム」は個別の上限を使います。処理枠は全地表で共有し、変化の強さや災害の有効・無効は別々に設定します。
ei-terrain-custom-rate-multiplier=「控えめ」は0.5倍、「標準」は1倍、「強い」は2倍です。「カスタム」は指定した倍率を使います。処理量の上限は別の設定です。
ei-terrain-degradation=汚染が続くと、対象となる自然地形を惑星ごとのタイル変化経路に沿って徐々に劣化させます。初期設定では汚染度100以上が5分間続くと対象になります。グレバの胞子は有害な汚染として扱いません。
ei-terrain-recovery=記録が残っているESIRによる地形変化だけを、元の変化経路を正確に逆にたどって回復させます。初期設定では汚染度25以下が10分間続く必要があり、回復間隔は劣化間隔の4倍です。外部からタイルが置き換えられると、その場所はESIRの回復対象から外れます。
ei-terrain-mining-scars=対象のクァーリーまたは大型掘削機の採掘範囲内で、有限資源が枯渇したイベントをきっかけに発生します。周辺の掘削痕は処理待ちに登録し、共通の処理上限内で順次生成します。枯渇が集中した場合は余分な掘削痕を省略することがあります。初期設定では回復しません。枯渇イベントからは、どの掘削機が採掘したかは特定できません。
ei-terrain-tree-stress=汚染が続くと、対象となる在来の野生樹木を灰色に変えます。清浄な状態が続くと、ESIRが変えた色を元に戻します。栽培植物と保護対象の植物は除外します。
ei-terrain-tree-regrowth=清浄な状態が続くと、既存の樹木の近くに対象となる在来樹木をゆっくり再生させます。周辺の樹木密度と地形の保護条件を適用します。ガイアではバイオームに合った樹木を選びます。
ei-terrain-thermal-scars=対象となる火元の炎で樹木が焼け落ちると、地形に小さな焼け跡が残ることがあります。この機能自体は着火しません。
ei-terrain-seasonal-daylight=初期状態で有効です。1日の総時間を変えず、季節に応じて昼の長さとFactorio標準の太陽光発電量を変化させます。フルゴラは常に対象外です。昼夜の固定設定や外部の制御を優先します。
ei-terrain-mining-recovery=初期状態では無効です。有効にした後の掘削痕を記録し、回復対象にします。それ以前の恒久的な掘削痕は復元できません。採掘による地形の損傷は、それまでの生態系変化の回復経路を上書きします。
ei-terrain-aging=初期状態では無効です。対象となるナウヴィスの生きた樹木を、ナウヴィス本来の枯れ木に置き換えます。他の惑星には対応する枯れ木がないため対象外です。この機能は着火しません。
ei-terrain-rot=初期状態では無効です。対象となる在来の枯れ木を徐々に取り除きます。保護対象の樹木や場所は除外します。
ei-terrain-flood=初期状態では無効です。ナウヴィスで、既存の淡水に接する対象の砂浜タイルを水に変えます。他の惑星の液体や保護対象の場所は除外します。
ei-terrain-drought=初期状態では無効です。ナウヴィスで、既存の砂浜に接する対象の沿岸の水タイルを砂に変えます。他の惑星の液体や保護対象の場所は除外します。
ei-terrain-cliffs=初期状態では無効です。対象となる通常の崖をまれに取り除きます。惑星固有の特殊な崖や保護対象の場所は除外します。
ei-terrain-blood=初期状態では無効です。敵ユニットが倒されたり巣が破壊されたりすると、周辺の記録済みの地形損傷を1段階戻すことがあります。掘削痕には「掘削痕の回復」も有効になっている必要があります。
ei-terrain-paving=初期状態では無効です。血液による土壌変化が有効な場合、敵の死亡時に対象の石やコンクリートの舗装を剥がし、下のタイルを露出させることがあります。建造物などの保護条件は引き続き適用します。
ei-terrain-seasonal-ecology=初期状態では無効です。季節に応じて土壌の劣化、樹木の活動・再生、災害の発生判定頻度を変化させます。季節による昼の長さをESIRが管理しているかどうかとは独立して動作します。無効な災害機能を有効にすることはありません。
ei-terrain-wildfire=初期状態では無効です。汚染によって、処理上限内で着火することがあります。「延焼なし」の炎は広がらず、最大10秒で消えます。「延焼あり」ではFactorio標準の延焼がESIRのスクリプト処理上限を超えて続く場合があります。無関係な戦闘由来の火災は独立して扱います。
ei-terrain-planet-nauvis=ナウヴィスの生態系変化と季節による昼の長さの変化を有効にします。草地・土・砂漠・砂の劣化経路、在来の野生樹木、任意の海岸線変化に対応します。個別機能の設定と保護条件は引き続き適用します。
ei-terrain-planet-gaia=ガイアの生態系変化と季節による昼の長さの変化を有効にします。草原や湿地の各種タイルがガイアの露出した岩盤まで劣化し、記録した元の種類へ回復します。樹木はバイオームに合った種類が再生します。あらかじめ作り込まれた場所は引き続き保護します。
ei-terrain-planet-vulcanus=ヴルカヌスの生態系変化と季節による昼の長さの変化を有効にします。火山灰・土壌・亀裂の変化経路を使用します。溶岩は保護し、噴出孔の独立した効果は維持します。
ei-terrain-planet-gleba=グレバの生態系変化と季節による昼の長さの変化を有効にします。バイオーム固有の地形と在来の野生樹木を使用します。胞子は有害な汚染による損傷を引き起こしません。栽培植物・栽培用の土壌・金質培養槽が管理する湿地は引き続き保護します。
ei-terrain-planet-fulgora=フルゴラの地形・生態系変化を有効にします。岩・砂・塵・砂丘の間の変化に対応し、油の海は引き続き保護します。季節による昼の長さの制御はフルゴラには一切適用せず、独立した昼夜制御を優先します。
ei-terrain-planet-aquilo=アクィロの生態系変化と季節による昼の長さの変化を有効にします。対象となる雪の圧密と氷の変化経路を使用します。アンモニアの海・土台・建造物は引き続き保護します。
ei-terrain-pollution-high=上側のしきい値を超えると汚染の継続時間を、下側を下回ると清浄な状態の継続時間を計測します。下側は上側より低くしてください。地表の汚染量を参照するだけで、汚染そのものは変更しません。
ei-terrain-pollution-low=上側のしきい値を超えると汚染の継続時間を、下側を下回ると清浄な状態の継続時間を計測します。下側は上側より低くしてください。地表の汚染量を参照するだけで、汚染そのものは変更しません。
ei-terrain-mining-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-wildfire-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-flood-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-drought-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-cliff-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-blood-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-paving-probability=条件を満たす判定1回あたりの確率です。0で発生せず、1で必ず発生します。対応する機能が有効で、保護条件にも抵触しない必要があります。
ei-terrain-axial-tilt=季節による昼の長さの差を計算するために仮定する地軸の傾きです。初期値は23.5度です。通常は値を大きくするほど季節差が強まります。完全に明るい時間と完全に暗い時間を、それぞれ1日の2%以上確保します。フルゴラは対象外です。
ei-terrain-latitude=季節による昼の長さの計算に使う仮想的な緯度です。初期値は45度です。絶対値が大きいほど季節差が強まり、符号を変えると夏と冬が入れ替わります。プレイヤーの位置や惑星の自転は変えません。
ei-terrain-season-strength=季節によって生態系変化の速度が変わる強さです。季節による生態系変化が有効な場合だけ適用されます。
ei-terrain-dirty-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-clean-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-soil-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-recovery-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-mining-radius=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-mining-patch-radius=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-tree-growth-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-tree-density-limit=指定した周辺範囲内の樹木数がこの上限に達すると、自然再生を見送ります。
ei-terrain-tree-neighborhood=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-tree-stress-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-tree-aging-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-tree-rot-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-hazard-seconds=シミュレーション上の秒数で指定する待ち時間または間隔です。実行には必要な条件と処理枠の空きが必要です。
ei-terrain-wildfire-radius=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-hazard-radius=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-calendar-days=記録したナウヴィスの1日を単位とする基準年の長さです。初期値は360日です。各惑星の年の長さは、読み込まれた星図上の距離に応じて調整します。設定を変えても現在の季節の進行位置は維持し、惑星の自転は変更しません。
ei-terrain-protection-buffer=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-max-depth=記録された元の地形から進められる劣化段階数の上限です。
ei-terrain-seed-distance=タイル単位の距離または半径です。対象となる場所でも、保護条件によって変更を見送る場合があります。
ei-terrain-interval=「カスタム」用の設定です。全地表共通の処理を行う機会の間隔をtick単位で指定します。値を大きくすると処理頻度が下がり、処理が行き渡るまで時間がかかります。遅れを取り戻すために処理が集中することはありません。
ei-terrain-search-interval=「カスタム」用の設定です。全地表で共有するエンティティ検索枠を補充する最短間隔をティック単位で指定します。処理間隔とは別の設定で、短くすると検索回数が増え、UPSへの負荷も高くなる場合があります。使わなかった検索枠は繰り越しません。
ei-terrain-cold-chunks=処理負荷を「カスタム」にした場合に使用します。惑星ごとの枠ではなく、全地表で共有する処理上限です。値を増やすとCPU負荷が高くなる場合があります。
ei-terrain-active-chunks=処理負荷を「カスタム」にした場合に使用します。惑星ごとの枠ではなく、全地表で共有する処理上限です。値を増やすとCPU負荷が高くなる場合があります。
