[recipe-description]
ei-irradiated-water-purification=冷却水に混じった放射性汚染を抜き取り、汚れた水と濃縮核廃棄物にまとめる。
ei-sulfuric-uranium-235-reprocessing=ウラン238をウラン235側へ押し上げる初期の硫酸系再処理。廃棄物負荷は重い。
ei-fluoride-uranium-235-reprocessing=より多くの物質を回収しつつ、ウラン238をウラン235側へ押し上げる、より清浄なフッ化物系再処理。

[technology-name]
ei-sulfuric-uranium-reprocessing=硫酸ウラン再処理
ei-fluoride-uranium-reprocessing=フッ化ウラン再処理

[technology-description]
ei-sulfuric-uranium-reprocessing=初期の硫酸系ウラン再処理と、放射化冷却水を浄化するための工程を解禁する。
ei-fluoride-uranium-reprocessing=より清浄で効率の高いフッ化物系ウラン再処理を解禁する。
