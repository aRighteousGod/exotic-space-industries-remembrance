menu_neutron_collector=中性子コレクター
title_neutron_collector=中性子コレクター
neutron-collector=中性子コレクター
neutron-collector-text=[color=orange]中性子コレクター[/color] [item=ei-neutron-collector] は量子時代の充填装置です。近くの核分裂源、Aquilo の稼働中のスペースエイジ高密度プラズマ核融合炉から漏れる弱い中性子、そしてより強く調整できる ESIR 熱核融合炉の中性子束から自由中性子を捕集し、[item=ei-neutron-container] を [item=ei-charged-neutron-container] に変換します。\n\nこれは中性子を生成する機械ではありません。周囲の炉が抱えきれずに逃がしたフラックスを刈り取る機械です。コレクターは常に 1 つのソースだけに結び付き、範囲内の全設備を平均するのではなく、その時点で最も強い生きた収率を優先します。
neutron-collector-2=結び付き、距離、待機
neutron-collector-text-2=効率はソースの種類、稼働状態、配置で決まります。Aquilo のスペースエイジ高密度プラズマ核融合炉は稼働中だけ弱い漏出源になり、ESIR 熱核融合炉は温度と注入設定でより強く調整できる線源のままです。表示される効率は 0〜300% に収まり、距離が伸びるほど充填時間も長くなります。\n\n有効なソースがない、中性子束が充填しきい値に届かない、結び付いたソースが休眠する、出力が詰まる、あるいは回路条件で装置が停止する場合、コレクターは待機レシピに戻ります。そうすることで機械を開けたままにでき、診断表示も消えません。
neutron-collector-3=回路テレメトリ
neutron-collector-text-3=コレクターが配線されている間、隠し回路インターフェースはコレクターのネットワークへ 5 種類の専用信号を出力します: [virtual-signal=ei-neutron-efficiency]、[virtual-signal=ei-neutron-distance]、[virtual-signal=ei-neutron-collector-agent]、[virtual-signal=ei-neutron-source-agent]、[virtual-signal=ei-neutron-scan-agent]。\n\n効率は 0〜300、距離は 0.1 タイル単位です。コレクターエージェントは 1 稼働、2 待機、3 停止。ソースエージェントは 1 稼働、2 休眠、3 不在。スキャンエージェントは 1 安定、2 再計算待ち、3 再バインド待ちです。これらの信号は毎 tick ではなく、コレクターの定期テレメトリ更新で反映されます。
