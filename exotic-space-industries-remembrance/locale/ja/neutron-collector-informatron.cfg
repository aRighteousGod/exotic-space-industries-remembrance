neutron-collector-text=[color=orange]中性子コレクター[/color] [item=ei-neutron-collector] は量子時代の電荷充填装置です。近くの中性子源、例えば核分裂動力設備／アクィロのプラズマ核融合炉／ESIR熱核融合炉などの中性子束から遊離中性子を捕集し、[item=ei-neutron-container] を [item=ei-charged-neutron-container] に変換します。\n\n中性子を生成する設備ではないことに注意してください。周囲の設備が取りこぼしたものを回収する装置です。中性子コレクターは常に１つの設備のみに接続します。範囲内の全設備から満遍なく回収するのではなく、その時点で最も強い出力を優先的に利用します。
neutron-collector-text-2=コレクターの効率は、中性子源の種類／活性度／位置関係によって変動します。アクィロの高密度プラズマ核融合炉は、稼働中のみ機能し、出力も微弱です。ESIRの熱核融合炉は強力な中性子源であり、温度と注入率の制御によって出力を調整可能です。効率の限界は0～300%の範囲で、距離が離れるほど充填時間も長くなります。\n\n利用可能な中性子源が近くにない、中性子束充填が閾値に満たない、接続された中性子源が稼働していない、出力が詰まっている、回路条件によって停止している、などの場合には、コレクターは待機状態になり、ステータスの出力のみ続けます。
neutron-collector-text-3=コレクターにワイヤーを接続すると、５種類の信号を出力します：[virtual-signal=ei-neutron-efficiency]／[virtual-signal=ei-neutron-distance]／[virtual-signal=ei-neutron-collector-agent]／[virtual-signal=ei-neutron-source-agent]／[virtual-signal=ei-neutron-scan-agent]\n\n効率の値は0～300%の範囲で出力されます。距離は0.1タイル単位で出力されます。コレクターエージェントは [virtual-signal-description=ei-neutron-collector-agent] です。中性子エージェントは [virtual-signal-description=ei-neutron-source-agent] です。スキャンエージェントは [virtual-signal-description=ei-neutron-scan-agent] です。これらの信号は毎tickではなく、コレクターの定時テレメトリ処理のタイミングで更新されます。
