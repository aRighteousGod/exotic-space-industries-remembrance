ei-singularity-lance-wound-memory=傷の記憶
ei-singularity-lance-terminal-collapse=終端崩壊
ei-singularity-lance-black-hole-testament=ブラックホールの遺言

[lance-upgrades]
axial=幅__1__タイルの切断線が、照準点の後方へ最大__2__タイル伸びます。有効射程内にある追加の敵軍事目標を最大__3__体まで貫き、それぞれに__4__のレーザーダメージを与えます。
wound=同じ目標への直撃で実際にダメージを与えるたび、次の直撃が+__1__%強化されます。上限は+__2__%。初撃には補正がありません。目標の変更、または__3__秒以上の間隔でリセットされます。ダメージがゼロの場合、蓄積数も有効時間も更新されません。副次ダメージには適用されません。
collapse=通常の周辺ダメージを置き換えます。発射から__1__秒後、元の照準点で崩壊が発生。半径__3__タイル内の追加の敵軍事目標、最大__4__体に__2__のレーザーダメージを与えます。
testament=電力を消費した射撃の__1__発ごとに発動。傷の記憶を含む直撃ダメージが__2__倍、軸線破断は最大__3__体、崩壊は__4__レーザーダメージ・半径__5__・最大__6__体に強化されます。目標が消滅した場合や保護対象になった場合も射撃回数に数えます。
research-row=__1__（研究で解放）
protection-title=目標の保護
protection=最初の直撃目標は、すべての副次ダメージから除外されます。同じ勢力、中立、友好、停戦中の勢力には効果がありません。友好・停戦は双方の関係を確認します。それ以外の敵は、貫通と範囲攻撃の両方を受けることがあります。
status=持続直撃DPS：__1__ • __2__
baseline=基本性能
force-values=自勢力の現在値 • ダメージ倍率×__1__ • 直撃__2__レーザーダメージ • 傷の記憶・遺言を除く持続直撃DPS __3__ • 基本射程__4__タイル（品質で増加）。以下の数値には自勢力のダメージ研究が反映されています。
base-area=通常の周辺ダメージ：__1__レーザーダメージ、半径__2__、追加目標は最大__3__体。終端崩壊の研究後は崩壊に置き換わります。
rules=電力を消費した各射撃のダメージは個別に処理されます。崩壊は敵が移動しても、ランスが撤去されても元の照準点に残り、威力は発射時に確定します。傷は射撃の中断で消え、紋様は目標に追従します。遺言が数えるのは射撃回数であり、命中数や撃破数ではありません。最終段階にはブラックホールの研究が必要ですが、稼働は不要です。直撃の射程には品質と目標の当たり判定が反映されます。重要な視覚効果はすべての描画設定で表示され、装飾の量はダメージに影響しません。
research-state=__1__ — __2__
active=有効
locked=未解放
prerequisites=直接の前提研究：
science=必要なサイエンスパック：
legend-1=視覚効果：白金色の切断線と、その両側のシアンの亀裂。鮮やかな色の帯が流れ、光の尾を引きながら実際の貫通終点まで伸びます。
legend-2=視覚効果：1～2段階は裂け目、3～4段階は枝分かれした亀裂、5段階は欠けた環。色が紋様に沿って流れます。紋様は目標に追従し、傷の失効とともに消えます。
legend-3=視覚効果：元の照準点で環が内側へ収縮し、色鮮やかな光の尾が渦を巻いて吸い込まれます。ダメージ発生時に閃光を放ちます。
legend-4=視覚効果：暗い芯と幅広く色鮮やかな縁を持つ光線。暗い円盤を囲む明るい環に光の尾が流れ込み、最後に十字の閃光が現れます。
static-values=表示ダメージはランスのダメージ研究適用前の基本値です。傷の記憶と遺言には発動条件があるため、範囲攻撃のDPSは一定ではありません。
