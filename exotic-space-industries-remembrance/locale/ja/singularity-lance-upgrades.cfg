[lance-upgrades]
axial=幅__1__タイルの中央の切断線が、照準点の後方へ最大__2__タイル伸び、追加の敵軍事目標を最大__3__体まで貫き、それぞれに__4__のレーザーダメージを与えます。照準点から±__5__°に枝分かれする2本の光線は、それぞれ幅__6__タイル・長さ最大__7__タイル。2本合わせて最大__8__体の追加目標に、それぞれ__9__のレーザーダメージを与えます。すべて有効射程内に収まり、同じ敵への貫通ダメージは1射につき1回。中央の切断線が優先されます。
wound=初撃から直撃ダメージが+__1__%になります。同じ目標への直撃で実際にダメージを与えるたび、次の直撃の補正がさらに__1__ポイント増え、最大+__2__%になります。目標の変更、または__3__秒以上の間隔でリセットされます。ダメージがゼロの場合、蓄積数も有効時間も更新されません。副次ダメージには適用されません。
collapse=通常の周辺ダメージを置き換えます。発射から__1__秒後、元の照準点で崩壊が発生。半径__6__タイル以内では__5__、その外側から半径__3__タイルまでは__2__のレーザーダメージを与えます。追加の敵軍事目標は最大__4__体。最初の直撃目標も範囲内にいれば、別枠でダメージを受けます。中心部と外周部のダメージは重複しません。
testament=電力を消費した射撃の__1__発ごとに発動。傷の記憶を含む直撃ダメージが__2__倍、中央の切断線は最大__3__体、分岐光線は2本合わせて最大__7__体になります。最初の崩壊は半径__9__以内で__8__、その外側から半径__5__までは__4__のレーザーダメージ。追加目標は最大__6__体で、最初の直撃目標が範囲内にいれば別枠で命中します。発射から__10__秒後、同じ地点で1回だけ再崩壊。__11__のレーザーダメージ・半径__12__・追加目標は最大__13__体で、直撃目標も同じ条件で命中します。目標が消滅した場合や保護対象になった場合も射撃回数に数えます。
research-row=__1__（研究で解放）
protection-title=目標の保護
protection=最初の直撃目標は通常の周辺ダメージとすべての貫通光線から除外されますが、各崩壊の範囲内にいれば追加目標数の枠を使わずにダメージを受けます。同じ勢力、中立、友好、停戦中の勢力には効果がありません。友好・停戦は双方の関係を確認します。同じ敵は貫通を1回、各崩壊をそれぞれ1回受けることがあります。
status=基準直撃DPS：__1__ • __2__
status-wound= • 傷の記憶による直撃 __1__～__2__
status-testament= • __1__発ごとに×__2__
baseline=基本性能
force-values=自勢力の現在値 • ダメージ倍率×__1__ • 直撃__2__レーザーダメージ • 傷の記憶・遺言を除く持続直撃DPS __3__ • 基本射程__4__タイル（品質で増加）。以下の数値には自勢力のダメージ研究が反映されています。
base-area=通常の周辺ダメージ：__1__レーザーダメージ、半径__2__、追加目標は最大__3__体。終端崩壊の研究後は崩壊に置き換わります。
rules=電力を消費した各射撃と各崩壊のダメージは個別に処理されます。中央の切断線が分岐光線より優先され、重なる光線から貫通ダメージを重複して受けることはありません。各崩壊の中心部と外周部のダメージも重複しません。崩壊の命中範囲と中心部の判定には目標の中心を使い、境界上も範囲に含みます。崩壊と再崩壊は敵が移動しても、ランスが撤去されても元の照準点に残り、範囲外へ移動すれば回避できます。威力は発射時に確定します。傷は射撃の中断で消え、紋様は目標に追従します。遺言が数えるのは射撃回数であり、命中数や撃破数ではありません。最終段階にはブラックホールの研究が必要ですが、稼働は不要です。直撃の射程には品質と目標の当たり判定が反映されます。重要な視覚効果はすべての描画設定で表示され、装飾の量はダメージに影響しません。
research-state=__1__ — __2__
active=有効
locked=未解放
prerequisites=直接の前提研究：
science=必要なサイエンスパック：
legend-1=視覚効果：白金色の中央の切断線と、その両側のシアンの亀裂。照準点から細い光線が2本に枝分かれします。鮮やかな色の帯と光の尾が、それぞれの光線の実際の終点まで伸びます。
legend-2=視覚効果：1～2段階は裂け目、3～4段階は枝分かれした亀裂、5段階は欠けた環。色が紋様に沿って流れます。紋様は目標に追従し、傷の失効とともに消えます。
legend-3=視覚効果：元の照準点で外周の環と中心部の境界が見え、色鮮やかな光の尾が渦を巻いて内側へ吸い込まれます。ダメージ発生時には中心部が強い閃光を放ちます。
legend-4=視覚効果：暗い芯と幅広く色鮮やかな縁を持つ光線。大きな暗い崩壊の中心部を明るい環が囲み、続く再崩壊では再び収縮して十字の閃光を放ちます。
static-values=表示ダメージはランスのダメージ研究適用前の基本値です。傷の記憶は連続した直撃の回数、遺言は電力を消費した射撃回数に応じて変化するため、範囲攻撃のDPSは一定ではありません。
