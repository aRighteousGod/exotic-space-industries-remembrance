[item-description]
ei-loader=共有 1 フィルタを持つローダー。非スタック品のみ搬送します。
ei-fast-loader=共有 1 フィルタを持つ高速ローダー。非スタック品のみ搬送します。
ei-express-loader=共有 1 フィルタを持つローダー。積み重ねは最大 [font=default-bold]2[/font] まで調整できます。
ei-turbo-loader=左右それぞれに 1 つずつ、計 2 つのレーンフィルタを持つローダー。積み重ねは最大 [font=default-bold]2[/font] まで調整できます。
ei-neo-loader=左右それぞれに 1 つずつ、計 2 つのレーンフィルタを持つローダー。積み重ねは現在のベルト最大スタック数まで調整できます。

