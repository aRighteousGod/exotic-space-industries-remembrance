[gate-estimator]
route-snapshot=取得時の固定経路
power-draw=消費電力
title=ゲート計算機
close=閉じる
help-launch=独立した試算ウィンドウを開く。実際のゲート設定や貨物は変更しない。
snapshot=ゲートの状態を読み込む
help-snapshot=電力量、負荷、クールダウン、品質、経路を取得する。選択したアイテムと供給条件は維持する。
reset=仮定をリセット
help-reset=満充電、負荷とクールダウンなし、毎秒1個、供給電力1 GWで開始する。実際のゲートは変更しない。
item=アイテム
help-item=利用可能なアイテムを選択する。アイテムは消費しない。貨物の品質は転送コストに影響しない。
batch=スタック数／最大投入数
help-batch=単発転送の試算数量と、シミュレーションの1 tick当たりの最大投入数。ゲートはこの数量まで待たずに既存のスタックを転送する。投入したアイテムはスタックに統合される。
stress=負荷
help-stress=開始時の送信側負荷（0～100）。毎秒1減少する。維持電力とクールダウンは増えるが、直接の転送コストは増えない。
quality=送信側の品質
help-quality=外観側ゲートの品質により、転送・維持エネルギーに1 / (1 + 0.2 × 品質レベル)を掛ける。貨物と受信側の品質は影響しない。
from=送信元の惑星
to=送信先の惑星
help-route=両惑星を選択すると星図上の距離に固定する。同じ惑星は同じサーフェスとして扱う。片方を解除すると手動設定できる。サーフェスは生成しない。
local=同じサーフェス
orbital=同じ天体・別サーフェス
distance=惑星間距離
unknown=未解決のサーフェス間経路
help-distance=タイル数や宇宙航路の長さではなく星図上の距離。同じサーフェスは×0.15、同じ天体の別サーフェスは×2.5、未解決の場合は×3。
rate=供給アイテム数
help-rate=一定の供給速度。投入できないアイテムは上流で待機するため、実際の転送量は少なくなる場合がある。端数は蓄積して整数個にする。
per-second=個／秒
per-minute=個／分
power=利用可能な電力
help-power=電力網の測定値ではなく、一定の供給電力という仮定。充電上限と蓄電容量の空きによって受電量が制限される。
initial-state=開始時の動作状態
help-initial-state=読み込んだ状態を編集できる。シミュレーション内の貨物と待機列は空で開始する。実際のゲートには影響しない。
energy=蓄電量（GJ）
help-energy=開始時の蓄電量。動作には100 GJ以上と、次のスタック全体を転送できる電力量が必要。
cooldown=クールダウン（秒）
help-cooldown=開始時の残りクールダウン（ゲーム内秒）。自動投入と転送は停止する。終了後も次のゲート処理まで投入は再開しない。
saturation=受信側の飽和度
help-saturation=開始値0～100。100で転送は停止するが、投入は継続できる。毎秒1.5回復する。受信貨物と残留物は自動で除去されるものとする。
calculation=計算
projections=推移予測
burden=転送重量
help-burden=ゲート専用の重量表の値×個数。未登録アイテムは重量1。ロケットの重量とは異なる。
distance-factor=距離倍率
help-distance-factor=惑星間：2.5 + 5.5 × (距離 / 星図上の最大距離)^0.6。導入済みの星図範囲内に制限する。距離比率 = (倍率 − 0.15) / 7.85。
quality-factor=品質倍率
help-quality-factor=送信側の品質だけがエネルギーを軽減する。MODで追加された品質にも同じ式を使う。
toll=転送エネルギー
help-toll=重量に対して超線形に増加するため、大きなスタックほど1個当たりの消費が増える。重量、距離、品質をすべて掛けてから一度だけ切り捨てる。
per-item=1個当たりの転送エネルギー
help-per-item=この転送の消費を個数で割った値。維持エネルギーは含まない。スタック数によって変化する。
stress-result=追加負荷／転送後の負荷
help-stress-result=1回の転送で最大35加算、合計上限100。75以上ではクールダウン中以外に危険状態を表示する。
cooldown-result=転送後のクールダウン
help-cooldown-result=転送後の負荷から計算する。tick単位の各項を個別に切り捨てて秒に換算する。次の転送は処理周期、電力、受信側の回復によってさらに遅れる場合がある。
saturation-result=追加飽和度／転送後の飽和度
help-saturation-result=転送重量に応じて最大20加算、合計上限100。送信側の品質では軽減されない。
upkeep-result=転送後／転送前の維持電力
help-upkeep-result=動作可能時は30 MW＋負荷1当たり1.5 MW＋クールダウン中30 MWに品質倍率を掛ける。停止中や電力不足時にはスクリプトによる維持消費はない。
hardware=容量：__1__ GJ・充電上限：__2__ MW・処理周期：__3__ 秒
help-hardware=実機の上限値と、現在のゲート数・処理予算から求めた固定周期。ゲート数が変わると実際の処理周期も変わる場合がある。
fallback=重量表にないアイテムのため、重量1として計算する。
assumptions=有効な送信側1基、アイテム1種、受信側1基。受信貨物と残留物は除去し、ほかの送信側はない。時間はゲーム内時間。
help-assumptions=飽和、維持消費、スタック統合、クールダウン、支払い可否を計算する。腐敗、損傷、回路変更、インサータの動作、電力競合、移動中の経路変更は含まない。
run=予測を実行
help-run=現在の条件と比較基準を計算する。処理量を制限し、途中で取り消せる。条件変更後は旧グラフを更新待ちとして表示する。
minutes=__1__ 分
help-horizon=ゲーム内時間での予測期間。比較基準にも同じ期間を使用する。
pin=比較基準を保存
clear-baseline=比較基準を解除
help-pin=独立した条件と開始状態を1件保存する。実線は現在、破線は比較基準。変更後は予測を再実行する。
baseline=比較基準
pinned=比較基準を保存済み
no-baseline=比較基準なし
legend=水色：第1系列・橙色：第2系列・実線：現在・破線：比較基準
help-chart=電力量：GJ、赤線100 GJ。負荷：送信側／受信側、赤線75。クールダウン：残り／転送間隔。転送量：実績／供給。待機数：上流／ゲート内。電力：転送／維持。縦線は区間内の最大・最小値。
throughput=転送量
queue=待機貨物
axis=0～__1__ __2__・時間0～__3__ 秒
unit-1=GJ
unit-2=%
unit-3=秒
unit-4=個／秒
unit-5=個
unit-6=MW
sample=__1__～__2__ 秒：__3__
help-sample=時間カーソルを移動する。区間末の値［最小～最大］を表示する。転送量と電力は区間平均。
summary=転送数：__1__・平均：__2__ 個／秒\n上流：__3__・ゲート内：__4__\n転送：__5__ GJ・維持：__6__ GJ・平均電力：__7__ MW\n最小蓄電量：__8__ GJ・最大負荷：__9__\n待機 — クールダウン：__10__ 秒、電力：__11__ 秒、受信側：__12__ 秒\n残留物生成数：__13__
help-summary=待機原因は重複するため合算しない。エネルギーは実際の消費量のみ。残留物は計数後に除去する。待機アイテムは失われない。
difference=現在 − 比較基準：転送数__1__個、消費__2__ GJ
help-status=単発計算は即座に更新する。グラフは最後の実行結果で、条件変更時は更新待ちと表示する。実際のゲートは変更しない。
running=計算中…
stale=予測は更新待ち — 再実行してください
ready=予測完了
invalid=入力範囲内の有限数を入力してください。
missing-prototype=アイテム、品質、惑星が利用できません。選び直してください。
too-expensive=このスタックの消費はゲートの蓄電容量を超えます。利用可能な電力量に合わせてスタックを分割することはありません。
