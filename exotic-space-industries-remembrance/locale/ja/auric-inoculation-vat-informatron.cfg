auric-inoculation-vat=金質培養槽
auric-inoculation-vat-2=各工程と規模拡大
auric-inoculation-vat-3=活力／汚染度／開花失敗
auric-inoculation-vat-4=嚢胞の洗浄／廃棄物の回収／回路信号
auric-inoculation-vat-text=グレバの[entity=ei-auric-inoculation-vat]は、既存の[entity=ei-auric-cyst-node]の生育場所にそのまま設置するものではありません。設備の周囲にある湿地エリアを占有し、そのエリア全体をバッチ処理プロセスとして制御し、新しいノードを開花させます。\n\n[font=default-bold]配置と湿原区画の占有:[/font] この培養槽はグレバ専用です。十分に広い湿原エリア（24～160マス）に接し、区画を形成できる場所に設置する必要があります。大きすぎる湿地エリアは、埋め立て等で分割／縮小する必要があります。また、占有エリアが他の培養槽と重複すると競合が発生します。有効な区画がない場合は安定した培養を行えません。
auric-inoculation-vat-text-2=この槽は単純な湿原排水施設ではありません。[font=default-bold]播種 → 注水 → 発酵（任意でバイオ溶剤による濃縮） → 排水 → 開花 → 休眠[/font]という工程を実行します。播種には[item=spoilage]と[fluid=ei-bio-oil]、注水には[fluid=ei-dirty-water]、発酵には[item=jelly]と[item=yumako-mash]を消費します。濃縮ウィンドウで[item=bioflux]を投入すると、発酵のレシピが「濃縮発酵」へと切り替わります。\n\n占有した湿地エリアのサイズによって規模区分が設定されます。占有タイル数に対してそれぞれ b1 (24-39)／b2 (40-55)／b3 (56-71)／b4 (72-87)／b5 (88-103)／b6 (104-127)／b7 (128-160) の7段階に区分されます。この区分により、占有エリア内に存在できる嚢胞ノード数の上限がそれぞれ 3, 4, 6, 8, 10, 12, 14 個に決定されます。区分が高いほど多くの成果物を得られますが、要求される原料や生じる廃棄物も増加します。
auric-inoculation-vat-text-3=各工程は、[font=default-bold]活力[/font]と[font=default-bold]汚染度[/font]のバランスの上に成り立っています。適切な湿地エリアの広さを維持し、各工程で十分な素材を供給し、規模区分に応じた圧力を適切に管理することで、活力を高く維持できます。一方で、原料不足／排水詰まり／占有の競合／湿原タイルの過剰拡大などの要素があると汚染度が上昇し、培養槽は「高負荷」状態になります。\n\n汚染度を解消できず閾値に達すると、開花が不安定になります。湿地エリアは少しずつ劣化し、正常なプロセスを維持できなくなり、最終的には「休眠」状態まで戻ります。コンソールの表示が「安定」を維持できず「高負荷」状態が続く場合は、占有エリアを縮小するか、原料供給を強化する必要があります。
auric-inoculation-vat-text-4=プロセスに成功すると、新しい[entity=ei-auric-cyst-node]が開花します。このノードを採掘して[item=ei-auric-cyst]を入手し、[recipe=ei-auric-cyst-washing]を実行して有用な成果物に精製しつつ、一部の[fluid=ei-dirty-water]をグレバの自然環境へと戻します。培養槽自体の排水フェーズでは[fluid=ei-dirty-water]（および時には酸性溶液）が排出されるため、次の工程に移る前に排出ポートを空にする必要があります。排水が詰まると培養槽の動作が停止し、詰まりが解消されるまで汚染度が上昇し続けます。\n\n回路信号で出力される情報を活用し、培養槽の状態を把握して下さい。培養槽からは[virtual-signal=ei-auric-vat-vigor]、[virtual-signal=ei-auric-vat-contamination]、[virtual-signal=ei-auric-vat-band]、[virtual-signal=ei-auric-vat-claims]、[virtual-signal=ei-auric-vat-bloom]を出力可能です。これらを使用して湿原区画の比較、競合や失敗状態のアラーム設定、そして湿地エリアの規模区分拡張に合わせて洗浄ラインや排水処理を強化するタイミングの判断に役立ててください。
