menu_auric_inoculation_vat=アウリック接種槽
title_auric_inoculation_vat=アウリック接種槽
auric-inoculation-vat=アウリック接種槽
auric-inoculation-vat-text=Glebaの[entity=ei-auric-inoculation-vat]は、既存の[entity=ei-auric-cyst-node]に直接つながる装置ではありません。周囲の連続した湿地盆地を占有し、その生きた沼地の圧を、のちに新しい節点を開花させるバッチ工程へ変えます。\n\n[font=default-bold]設置と盆地占有:[/font] この槽はGleba向けです。占有範囲が本当に十分な湿地タイルへ届く場所に置いてください。有効な盆地には連結した湿地タイルが24-160枚必要です。160枚を超える連続湿地は切り詰めるか分割する必要があり、同じ盆地を別の槽と共有することはできません。重なった足跡は競合になります。有効な盆地がなければ、安定した接種対象はありません。
auric-inoculation-vat-2=サイクル投入材とバンド倍率
auric-inoculation-vat-text-2=この槽は[font=default-bold]種付け -> 冠水 -> 発酵（biofluxで任意強化） -> 排出 -> 開花 -> 休止[/font]の順で進み、受動的な沼地吸い上げ装置ではありません。種付けでは[item=spoilage]と[fluid=ei-bio-oil]を使い、冠水では[fluid=ei-dirty-water]を使い、発酵では[item=jelly]と[item=yumako-mash]を使います。強化受付の間に[item=bioflux]を投入すると、その発酵は排出と開花の前に強化発酵へ切り替わります。\n\n盆地サイズで現在のバンドが決まります。b1は占有タイル24-39枚、b2は40-55枚、b3は56-71枚、b4は72-87枚、b5は88-103枚、b6は104-127枚、b7は128-160枚です。高いバンドほど多くの嚢胞節点を開花させますが、そのぶん水処理と試薬の安定供給も重くなります。
auric-inoculation-vat-3=活力、汚染、ブルーム破綻
auric-inoculation-vat-text-3=各サイクルでは[font=default-bold]活力[/font]と[font=default-bold]汚染[/font]がせめぎ合います。健全な盆地、十分に満たされた工程、無理のないバンド圧力は活力を前に出します。飢餓、排出閉塞、占有競合、酷使された湿地タイルは汚染を押し上げ、槽を緊張状態へ追い込みます。\n\n汚染が失敗閾値に達すると、開花安定性は崩れます。盆地タイルはより死んだ湿地へ劣化し、槽はきれいな開花を保てず休止へ後退します。コンソールが安定から緊張へ滑り続けるなら、盆地の足跡を絞るか、工程投入を厚くしてからでないと沼地が機械の下で死んでいきます。
auric-inoculation-vat-4=嚢胞洗浄、汚水回収、テレメトリ
auric-inoculation-vat-text-4=健全な槽はのちに新しい[entity=ei-auric-cyst-node]を開花させます。それを採掘して[item=ei-auric-cyst]を得て、[recipe=ei-auric-cyst-washing]で有用な産物にほどきつつ[fluid=ei-dirty-water]の一部をGleba全体の水循環へ戻してください。洗浄機、汚水回収、保管容量はまとめて計画してください。高い盆地バンドほど回収作業も収量も増えます。\n\n回路テレメトリは沼地を読みやすくします。槽は[virtual-signal=ei-auric-vat-vigor]、[virtual-signal=ei-auric-vat-contamination]、[virtual-signal=ei-auric-vat-band]、[virtual-signal=ei-auric-vat-claims]、[virtual-signal=ei-auric-vat-bloom]を出力できます。盆地の足跡を比べ、競合や失敗状態に警報を出し、洗浄ラインを次の湿地バンドに合わせて広げる判断に使ってください。
