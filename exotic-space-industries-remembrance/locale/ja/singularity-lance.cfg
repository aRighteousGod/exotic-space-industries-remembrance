singularity-lance=シンギュラリティ・ランス
singularity-lance-2=色彩の軌跡
singularity-lance-3=着弾跡の表示
singularity-lance-4=表示の設定
singularity-lance-text=[item=ei-singularity-lance]シンギュラリティ・ランスは、エイリアン時代のコンパクトな処刑装置です。ピラミッドの上に浮遊するE2クリスタルが莫大なエネルギーを蓄積し、個々の弾丸として追尾するのではなく、範囲全体に色鮮やかな傷痕を開きます。
singularity-lance-text-2=１射ごとに生きた証跡を目覚めさせる。光線の終端は証人となり、プリズムが標的の名を呼んだあと、炎、焦げ跡、標識、飛散、レーザーの傷が可視の切断に応える。
singularity-lance-text-3=多数のシンギュラリティ・ランスが同時に発射された場合に、どの切断が記憶に値するかを選ぶ。いくつかの光跡は薄れ、あるいは消える。それでも傷は届く。演出の不在は慈悲ではない。
singularity-lance-text-4=現在の演出設定： __1__。この設定は、色彩豊かな一閃のうちどれだけ（ビーム、発光、炎、焦げ痕、効果音、残像）を可視化して残すかを制御します。ランスの威力や本体性能を書き換えるわけではなく、傷痕をどれほど強く記憶するかを決定するのみです。\n\n詳細な数値については、設置されたランスのステータスを確認してください。そこには現在の出力に応じた持続DPSが表示されます。
title_singularity_lance=シンギュラリティ・ランス
turrets-text-6=[item=ei-singularity-lance]シンギュラリティ・ランスは、ピラミッドとその上に浮遊するプリズムを中心に組まれた異星の刃のプロトコルである。指定された射線が更地になるまで結晶エネルギーを放出する。ビームは弾丸ではない。空間に引きずられた宣告であり、炎と焦げ跡、そして静寂をもたらす。
[mod-setting-name]
ei-singularity-lance-visual-fidelity=シンギュラリティ・ランス演出
[mod-setting-description]
ei-singularity-lance-visual-fidelity=シンギュラリティ・ランスの演出を設定する。ビームの色／光／着弾点の痕跡／音が変化する。性能やコストは変動しない。
[string-mod-setting]
ei-singularity-lance-visual-fidelity-cinematic=光輝
ei-singularity-lance-visual-fidelity-lean=薄光
ei-singularity-lance-visual-fidelity-maximal=啓示
ei-singularity-lance-visual-fidelity-standard=安定
ei-singularity-lance-visual-fidelity-unbounded=無制限
[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-cinematic=演出が長く残る。ビームは長く、着弾跡も長く残る。
ei-singularity-lance-visual-fidelity-lean=最小限の演出のみ残る。短いビーム、簡潔な火災と焦げ痕のみが表示される。
ei-singularity-lance-visual-fidelity-maximal=上限を維持したままに控えめな演出を許可する。高密度のビームと持続する目撃痕を残す。
ei-singularity-lance-visual-fidelity-standard=光線ははっきりと演出され、着弾跡は緩やかに消える。
ei-singularity-lance-visual-fidelity-unbounded=上限なしで全ての演出を描画する。
