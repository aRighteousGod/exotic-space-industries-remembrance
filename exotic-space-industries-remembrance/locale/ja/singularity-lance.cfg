[item-description]
ei-singularity-lance=浮遊する結晶心臓を中心に組まれたエイリアンの誓約機関。そのクロマティック光線は標的を焼くのではなく、完全であった記憶から切り離す。

[entity-description]
ei-singularity-lance=集中した異星の暴力を捧げる、立ち上がった結晶祭壇。機械の上に吊られたプリズムがありえない色を集め、選ばれた線へ特異点ランスとして解き放つ。

[exotic-industries-informatron]
menu_singularity_lance=特異点ランス
title_singularity_lance=特異点ランス
turrets-text-6=[item=ei-singularity-lance]特異点ランスは、吊られたプリズムとピラミッド祭壇を中心に組まれた異星の刃のプロトコルである。選ばれた線が切開になるまで、結晶電荷を蓄える。ビームは弾丸ではない。空間に引きずられた宣告であり、炎、焦げ跡、沈黙を一拍遅れて標的へ届かせる。
singularity-lance=特異点ランス
singularity-lance-text=[item=ei-singularity-lance]特異点ランスは、エイリアン時代の小型処刑エンジンである。浮遊結晶がピラミッド状の冠の上に吊られ、膨大な電気パルスを飲み込み、個々の標的を弾丸として追跡するのではなく、戦場に明るい傷を開く。
singularity-lance-2=クロマティック証跡
singularity-lance-text-2=各射撃は、そのランスにひとつの生きた証跡を目覚めさせる。光線の終端は証人となり、プリズムが標的の名を呼んだあと、炎、焦げ跡、標識、飛散、レーザーの傷が可視の切断に応える。
singularity-lance-3=証跡の選別
singularity-lance-text-3=あまりに多くのランスが同時に語る時、プリズムはどの切断が記憶に値するかを選ぶ。いくつかの光跡は薄れ、あるいは消える。それでも傷は届く。演出の不在は慈悲ではない。
singularity-lance-4=証跡の誓約
singularity-lance-text-4=現在の証跡の誓約：__1__。この誓約は、クロマティックな切断のうち何が見えるまま残るかを支配する。ビーム、発光、炎、焦げ跡、音、残像。ランスの飢えや器を書き換えるものではない。ただ傷がどれほど強く記憶されるかを決める。\n\n現在値が必要なら、設置済みランスの状態を読む。そこに現在の勢力補正後の持続DPSが告げられる。
