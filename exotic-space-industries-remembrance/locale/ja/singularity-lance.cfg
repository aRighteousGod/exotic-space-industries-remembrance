[exotic-industries-informatron]
menu_singularity_lance=シンギュラリティ・ランス
singularity-lance=シンギュラリティ・ランス
singularity-lance-2=色彩の軌跡
singularity-lance-3=着弾跡の表示
singularity-lance-4=表示の設定
singularity-lance-text=[item=ei-singularity-lance]シンギュラリティ・ランスは、エイリアン時代のコンパクトな処刑装置です。ピラミッドの上に浮遊するE2クリスタルが莫大なエネルギーを蓄積し、個々の弾丸として追尾するのではなく、範囲全体に色鮮やかな傷痕を開きます。
singularity-lance-text-2=１射ごとに生きた証跡を目覚めさせる。直撃と貫通の傷は発射と同時に届き、可視の切断はその証人となる。終端崩壊の研究後は、元の照準点で環が半秒間収縮し、別の範囲攻撃を放つ。
singularity-lance-text-3=多数のシンギュラリティ・ランスが同時に発射されても、切断線、傷の紋様、崩壊の予兆は残る。過剰な焦げ跡や装飾から先に抑えられる。傷は演出に依存しない。演出の不在は慈悲ではない。
singularity-lance-text-4=現在の演出設定： __1__。どの設定でも、研究した強化を示す主要な形状は表示されます。高い設定では発光、焦げ痕、効果音が加わります。\n\n設置されたランスのステータスには、自勢力の研究を反映した持続直撃DPSが表示されます。傷の記憶と遺言の加算には、それぞれ発動条件があります。
title_singularity_lance=シンギュラリティ・ランス
turrets-text-6=[item=ei-singularity-lance]シンギュラリティ・ランスは、ピラミッドとその上に浮遊するプリズムを中心に組まれた異星の刃のプロトコルである。指定された射線が更地になるまで結晶エネルギーを放出する。ビームは弾丸ではない。空間に引きずられた宣告であり、炎と焦げ跡、そして静寂をもたらす。
[mod-setting-name]
ei-singularity-lance-visual-fidelity=シンギュラリティ・ランス演出
[mod-setting-description]
ei-singularity-lance-visual-fidelity=シンギュラリティ・ランスの演出を設定する。どの設定でも、切断線・傷の紋様・崩壊の予兆・最終放射の輪郭を表示する。上位設定では光、ビームの残像、着弾跡、音を追加する。負荷に応じて装飾を制限するが、性能やコストは変動しない。
[string-mod-setting]
ei-singularity-lance-visual-fidelity-cinematic=光輝
ei-singularity-lance-visual-fidelity-lean=薄光
ei-singularity-lance-visual-fidelity-maximal=啓示
ei-singularity-lance-visual-fidelity-standard=安定
ei-singularity-lance-visual-fidelity-unbounded=無制限
[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-cinematic=ビームの残像が長く残る。光、着弾跡、音の演出を増やす。
ei-singularity-lance-visual-fidelity-lean=短いビームと、研究済みの強化を示す形状を表示する。装飾の光や焦げ痕は追加しない。
ei-singularity-lance-visual-fidelity-maximal=ビームの残像がさらに長く残る。崩壊の予兆のタイミングと装飾の上限は維持する。
ei-singularity-lance-visual-fidelity-standard=光線ははっきりと演出され、着弾跡は緩やかに消える。
ei-singularity-lance-visual-fidelity-unbounded=ビームの残像が最も長く残る。従来の設定名は維持するが、装飾には負荷を抑える上限を設ける。
