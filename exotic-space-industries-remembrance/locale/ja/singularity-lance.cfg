[mod-setting-description]
ei-singularity-lance-visual-fidelity=特異点ランスがひとつひとつの切断をどれほど強く記憶へ刻むかを定める。この誓約が触れるのはビーム証跡、発光、炎、焦げ跡、音だけであり、刃の飢え、届く距離、器、製造は変わらない。啓示の証跡は抑制された啓示を求める。解かれた証跡は制御を砕き、世界が耐えられる限りすべての傷を書かせる。

[string-mod-setting]
ei-singularity-lance-visual-fidelity-lean=細い証跡
ei-singularity-lance-visual-fidelity-standard=安定した証跡
ei-singularity-lance-visual-fidelity-cinematic=輝く証跡
ei-singularity-lance-visual-fidelity-maximal=啓示の証跡
ei-singularity-lance-visual-fidelity-unbounded=解かれた証跡

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=必要な痕跡だけが切断を越えて残る。短いビーム、短い証跡、律された炎と焦げ跡。
ei-singularity-lance-visual-fidelity-standard=光線は明確に記憶され、傷が教義になる前に解放される。
ei-singularity-lance-visual-fidelity-cinematic=切断の多くが残ることを許される。より明るい断片、豊かな証跡、傷痕に長く残る発光。
ei-singularity-lance-visual-fidelity-maximal=プリズムに抑制された啓示を許す。濃いビームと長く残る証跡、制御はいまだ目覚めている。
ei-singularity-lance-visual-fidelity-unbounded=制御は砕かれた。ランスは世界に押し通せる限り、すべてのきらめきを書き記す。

