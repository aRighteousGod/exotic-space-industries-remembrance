[mod-setting-name]
ei-beacon-diminishing-returns=Rendements décroissants des diffuseurs

[mod-setting-description]
ei-beacon-overload=Activé : les machines s'arrêtent au-delà du seuil de surcharge. Le diffuseur en cuivre compte pour 1 et celui en fer pour 2 ; les diffuseurs aliens et de distorsion sont exemptés. Désactivé : les quatre modèles ESIR utilisent le profil de rendements décroissants choisi.
ei-beacon-diminishing-returns=S'applique uniquement lorsque la surcharge des diffuseurs est désactivée. Chaque diffuseur couvrant une machine réduit tous les effets de modules transmis par les diffuseurs ESIR, y compris la consommation et la pollution. Tous les modèles sont comptés ensemble, chacun pour un ; ajouter un diffuseur faible peut réduire le bonus des plus puissants. Un seul diffuseur conserve toute sa puissance. Capacité en modules, qualité, refroidissement et combustible restent inchangés.\nPuissance par diffuseur avec 1 / 4 / 8 / 16 diffuseurs :\n__1__\nLa courbe vanilla conserve les caractéristiques ESIR et le comptage total. Les courbes comportent 4096 valeurs ; au-delà, la dernière se répète.

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Doux
ei-beacon-diminishing-returns-vanilla=Courbe vanilla
ei-beacon-diminishing-returns-strict=Strict (par défaut)
ei-beacon-diminishing-returns-harsh=Dur
ei-beacon-diminishing-returns-severe=Sévère
ei-beacon-diminishing-returns-saturating=Saturant

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=Surcharge activée : limite pondérée de 4 par machine. Cuivre : 1 ; fer : 2 ; alien et distorsion : exemptés. Le profil de rendements décroissants est inactif.
overload-disabled=Surcharge désactivée. Profil actif : __1__. Les quatre modèles ESIR ont des rendements décroissants. Chaque diffuseur compte pour un, quel que soit son modèle ; les plus faibles peuvent réduire le bonus total.
