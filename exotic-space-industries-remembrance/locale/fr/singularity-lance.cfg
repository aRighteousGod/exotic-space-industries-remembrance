ei-singularity-lance-visual-fidelity-lean=Témoin mince
ei-singularity-lance-visual-fidelity-standard=Témoin stable
ei-singularity-lance-visual-fidelity-cinematic=Témoin radiant
ei-singularity-lance-visual-fidelity-maximal=Témoin révélateur
ei-singularity-lance-visual-fidelity-unbounded=Témoin délié

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Faisceau bref et formes distinctives de toutes les améliorations recherchées, sans lueur ni cicatrices décoratives.
ei-singularity-lance-visual-fidelity-standard=Le rayon est clairement retenu, puis relâché avant que la plaie ne devienne doctrine.
ei-singularity-lance-visual-fidelity-cinematic=Le faisceau persiste davantage, avec lueur et plus de cicatrices et de sons décoratifs.
ei-singularity-lance-visual-fidelity-maximal=Rémanence du faisceau encore prolongée. Les avertissements gardent leur timing exact ; la décoration reste limitée.
ei-singularity-lance-visual-fidelity-unbounded=La plus longue rémanence du faisceau. Le nom historique demeure, mais les limites décoratives préservent la cadence du monde.

