[item-description]
ei-singularity-lance=Moteur-serment alien bâti autour d'un coeur de cristal flottant. Son rayon chromatique ne brûle pas seulement la cible ; il la sépare du souvenir d'être entière.

[entity-description]
ei-singularity-lance=Autel cristallin dressé pour une violence alien focalisée. Le prisme suspendu rassemble une couleur impossible et la libère en lance de singularité sur la ligne choisie.

[exotic-industries-informatron]
menu_singularity_lance=Lance de singularité
title_singularity_lance=Lance de singularité
turrets-text-6=[item=ei-singularity-lance]La Lance de singularité est un protocole-lame alien bâti autour d'un prisme suspendu et d'un autel pyramidal. Elle amasse la charge cristalline jusqu'à ce que la ligne choisie devienne incision. Le rayon n'est pas un projectile ; c'est un verdict tiré dans l'espace, laissant feu, brûlure et silence découvrir la cible un souffle plus tard.
singularity-lance=Lance de singularité
singularity-lance-text=La [item=ei-singularity-lance]Lance de singularité est un moteur d'exécution compact de l'âge alien. Un cristal en lévitation flotte au-dessus de son capuchon pyramidal, boit une immense impulsion électrique et répond à la cible en ouvrant une blessure lumineuse sur le champ de bataille plutôt qu'en suivant chaque victime comme un projectile distinct.
singularity-lance-2=Trace chromatique
singularity-lance-text-2=Chaque tir éveille une trace vivante pour cette lance. L'extrémité devient témoin : feu, brûlure, marqueur, éclaboussure et plaie laser répondent à la coupure visible après que le prisme a nommé la cible.
singularity-lance-3=Triage des témoins
singularity-lance-text-3=Quand trop de lances parlent à la fois, le prisme choisit quelles coupures méritent mémoire. Certains traits pâlissent ou disparaissent, mais la plaie arrive tout de même ; l'absence de spectacle n'est pas une miséricorde.
singularity-lance-4=Vœu du témoin
singularity-lance-text-4=Vœu du témoin actuel : __1__. Le vœu gouverne ce qui peut rester visible de la coupure chromatique : faisceau, lueur, feu, brûlure, son et rémanence. Il ne réécrit ni la faim ni le corps de la lance ; il décide seulement à quel volume la plaie est mémorisée.\n\nPour la valeur vivante, consultez l'état de la lance placée ; c'est là qu'elle énonce le DPS soutenu actuel, ajusté par la force.
