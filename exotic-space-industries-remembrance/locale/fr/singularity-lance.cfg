[mod-setting-description]
ei-singularity-lance-visual-fidelity=Détermine avec quelle ardeur la Lance de singularité se souvient de chaque coupure. Le vœu ne touche que les témoins du faisceau, la lueur, le feu, la brûlure et le son ; la faim, la portée, le corps et la fabrication de la lame demeurent fixes. Révélateur demande la révélation sous bride. Délivré brise le gouverneur et laisse le prisme écrire toutes les plaies que le monde peut porter.

[string-mod-setting]
ei-singularity-lance-visual-fidelity-lean=Témoin mince
ei-singularity-lance-visual-fidelity-standard=Témoin stable
ei-singularity-lance-visual-fidelity-cinematic=Témoin radiant
ei-singularity-lance-visual-fidelity-maximal=Témoin révélateur
ei-singularity-lance-visual-fidelity-unbounded=Témoin délié

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Seule la trace nécessaire survit à la coupure : faisceau bref, témoin court, feu et brûlure disciplinés.
ei-singularity-lance-visual-fidelity-standard=Le rayon est clairement retenu, puis relâché avant que la plaie ne devienne doctrine.
ei-singularity-lance-visual-fidelity-cinematic=Une plus grande part de la coupure est autorisée à demeurer : tranches plus vives, témoins plus riches et lueur plus longue sur la cicatrice.
ei-singularity-lance-visual-fidelity-maximal=Le prisme reçoit une révélation tenue en laisse : faisceaux denses et témoins persistants, le gouverneur encore éveillé.
ei-singularity-lance-visual-fidelity-unbounded=Le gouverneur est brisé. La lance peut écrire chaque miroitement qu'elle force à travers le monde.

