[mod-setting-description]
ei-singularity-lance-visual-fidelity=Règle le souvenir lumineux de chaque coupure. Tous les préréglages conservent l'incision, le sceau de blessure, l'avertissement d'effondrement et la silhouette du Testament. Les niveaux supérieurs ajoutent lueur, rémanence du faisceau, cicatrices et sons. La décoration reste limitée sous charge ; dégâts, énergie et portée ne changent pas.

