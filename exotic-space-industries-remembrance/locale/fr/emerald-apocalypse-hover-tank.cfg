[equipment-description]
ei-emerald-fusion-core-equipment=Un cœur d'émeraude scellé pour la coque Apocalypse. Il ne ronronne pas; il récite la pression.
ei-emerald-aegis-shield-equipment=Une membrane prismatique accordée au serment du char antigrav. La force entrante s'y brise comme si elle se souvenait d'une mauvaise géométrie.

[mod-setting-name]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Résonance des émetteurs antigrav Apocalypse d'émeraude

[mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity=Règle l'intensité avec laquelle les émetteurs ventraux du char Apocalypse d'émeraude miroitent. Le serment ne touche que les anneaux prismatiques sous la relique; le reste demeure intact.

[string-mod-setting]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=Dormant
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Antigrav mince
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=Antigrav stable
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=Antigrav radiant
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Antigrav révélateur
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=Antigrav sans entraves

[string-mod-setting-description]
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=Le ventre scelle ses cercles et se déplace sans miroitement visible.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Quatre cercles d'émetteurs répondent brièvement au sol, avec un bord prismatique discipliné.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=Les émetteurs écrivent des anneaux d'émeraude réguliers sous la coque tandis que le mouvement devient pression.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=Les anneaux s'intensifient, se superposent et se cisaillent en fragments prismatiques vert menthe autour de chaque pied antigrav.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Chaque émetteur ouvre un sceau lumineux dense sous la relique, presque dévotionnel dans sa violence.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=Le gouverneur est brisé; chaque pied antigrav peut forcer le sol à se souvenir du passage du char.

