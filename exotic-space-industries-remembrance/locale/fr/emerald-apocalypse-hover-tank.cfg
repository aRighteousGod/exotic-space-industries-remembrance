[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=Char antigrav Apocalypse d'émeraude
title_emerald_apocalypse_hover_tank=Char antigrav Apocalypse d'émeraude
emerald-apocalypse-hover-tank=Char antigrav Apocalypse d'émeraude
emerald-apocalypse-hover-tank-text=Le [item=ei-emerald-apocalypse-hover-tank] est une forteresse antigrav de la fin de l'âge exotique: trop lourde pour la grâce, trop dévouée pour tomber. Ses anneaux d'émetteurs tiennent la coque au-dessus du monde pendant que le canon fixe transforme l'orientation en sentence.
emerald-apocalypse-hover-tank-2=Charge de cristal
emerald-apocalypse-hover-tank-text-2=La [item=ei-emerald-apocalypse-charge] est une rupture scellée portée pour le [item=ei-emerald-apocalypse-cannon]. Quand elle part, le char ne disperse pas sa colère. Il ouvre un commandement vert et laisse le champ de bataille répondre.
emerald-apocalypse-hover-tank-3=Doctrine des éclats orbitaux
emerald-apocalypse-hover-tank-text-3=Les éclats orbitaux sont une doctrine scriptée, pas un équipement de tourelle. Le collecteur d'éclats fait passer l'anneau de trois à six éclats actifs. La litanie de recharge réduit la cadence par éclat de 1.17 s à 0.92, 0.75, puis 0.58 s. Le verdict de ciblage remplace la simple proximité par un score de menace qui favorise nids, tourelles, points de vie, blessures et distance. L'ouverture du verdict élargit le rayon et laisse chaque impact déverser des dégâts plafonnés sur les cibles proches ou alignées dans son couloir.
emerald-apocalypse-hover-tank-4=Console des éclats
emerald-apocalypse-hover-tank-text-4=Quand l'inventaire du char s'ouvre, un panneau compact des éclats orbitaux paraît à côté de la fenêtre du véhicule. Chaque char peut commander de 0 à son maximum recherché d'éclats. Le ciblage réparti laisse les éclats distribuer leurs verdicts entre les meilleures menaces proches; Focus ordonne à tous les éclats actifs de frapper la même cible actuelle. Le DPS affiché tient compte du nombre d'éclats actifs, des niveaux répétables de dégâts des armes laser 7+ et de la qualité du char posé.

emerald-apocalypse-hover-tank-5=Doctrine de coque
emerald-apocalypse-hover-tank-text-5=La doctrine de coque est finie. Le catéchisme de charge raccourcit la montée de 9.48 s à 8.5, 7.58, puis 6.67 s, chaque palier répondant par son propre son de charge raccourci. Le serment inertiel abaisse le scellement après tir de 15 s à 13.17 puis 11.33 s. Le pacte d'égide fait répondre le bouclier aux hostiles proches. La quille vectorielle améliore le châssis antigrav sans lui retirer sa dérive. Le mandat d'effondrement durcit l'onde terminale de 52 tuiles sans l'élargir.
emerald-apocalypse-hover-tank-6=Contrôles descellés
emerald-apocalypse-hover-tank-text-6=La récursion apocalyptique ouvre des bascules par char. Elles sont actives par défaut: récupération de charge, sillage de quille, cicatrices ramifiées, sillage divisé et impact descellé. Ce ne sont pas des doctrines douces. Désactivez-les sur un char précis quand le serment doit rester étroit.
