[item-description]
ei-emerald-apocalypse-hover-tank=Une forteresse antigrav relique, sertie d'un canon de cristal fixe et d'un cœur qui refuse le sol. Elle avance comme une pression, puis laisse un silence d'émeraude là où la certitude se tenait.
ei-emerald-apocalypse-cannon=Un canon à rayon cristallin fixé à la coque. Il ne suit pas sa cible. Il juge ce que le char regarde.
ei-emerald-apocalypse-charge=Une rupture cristalline scellée pour le canon Apocalypse d'émeraude. Un serment, une décharge, une blessure verte dans le monde.

[entity-description]
ei-emerald-apocalypse-hover-tank=Une forteresse antigrav relique suspendue sur des émetteurs d'émeraude. Le canon rassemble la pression avant de tirer; la charge part en plasma, recul, et absence verte là où la certitude se tenait.

[technology-description]
ei-emerald-apocalypse-hover-tank=Éveille le char antigrav Apocalypse d'émeraude: un engin de siège flottant dont le canon de cristal fixe change l'élan en doctrine, puis la doctrine en ruine.
ei-emerald-shard-manifold-1=Porte la doctrine des éclats orbitaux de l'Apocalypse d'émeraude à quatre éclats actifs.
ei-emerald-shard-manifold-2=Tresse un second renfort dans le collecteur d'éclats et porte la doctrine à cinq éclats actifs.
ei-emerald-shard-manifold-3=Scelle le serment du collecteur et permet à six éclats actifs de répondre au char en même temps.
ei-emerald-reload-litany-1=Réduit la doctrine de recharge des éclats orbitaux à 0.92 s par éclat.
ei-emerald-reload-litany-2=Répète la litanie jusqu'à ce que l'anneau d'éclats se reforme toutes les 0.75 s.
ei-emerald-reload-litany-3=Scelle la cadence de recharge à 0.58 s : moins d'attente, plus de jugement.
ei-emerald-target-verdict=Permet aux éclats orbitaux de préférer les nids, tourelles, ennemis proches et cibles déjà blessées au lieu de gaspiller leur verdict sur de moindres menaces.
ei-emerald-verdict-aperture-1=Ouvre la première ouverture d'émeraude autour des frappes d'éclats, avec des dégâts secondaires plafonnés.
ei-emerald-verdict-aperture-2=Étend les ouvertures d'impact des éclats en une sentence de zone plus large.
ei-emerald-verdict-aperture-3=Laisse les verdicts des éclats devenir une plaie d'émeraude assez large pour punir les ennemis groupés.

ei-emerald-charge-catechism-1=Apprend au canon à prier plus vite: la montée apocalyptique tombe à 8.5 s.
ei-emerald-charge-catechism-2=Comprime encore les syllabes d'émeraude, jusqu'à 7.58 s.
ei-emerald-charge-catechism-3=Scelle le catéchisme à sa cadence la plus féroce: 6.67 s avant la décharge.
ei-emerald-inertial-oath-1=Permet à la coque de reprendre plus tôt après le recul, avec 13.17 s de récupération.
ei-emerald-inertial-oath-2=Durcit le serment de recul jusqu'à 11.33 s.
ei-emerald-aegis-covenant-1=Change la douleur du bouclier en floraison de plasma contre les hostiles.
ei-emerald-aegis-covenant-2=Approfondit le pacte d'égide: plus loin, plus fort, quand la membrane souffre.
ei-emerald-vector-keel-1=Accorde la quille antigrav pour plus d'autorité sans effacer la lourde dérive.
ei-emerald-vector-keel-2=Raffine encore marche arrière, freinage et contrôle de dérive.
ei-emerald-collapse-mandate-1=Augmente la pression de l'effondrement terminal sans élargir la cicatrice.
ei-emerald-collapse-mandate-2=Charge l'onde de choc de plus de plasma dans la même sentence de 52 tuiles.
ei-emerald-collapse-mandate-3=Achève le mandat: l'impact reste borné, mais le verdict devient brutal.
ei-emerald-apocalypse-recursion=Descelle les contrôles dangereux par char: récupération, sillages, cicatrices et impact excessif.

