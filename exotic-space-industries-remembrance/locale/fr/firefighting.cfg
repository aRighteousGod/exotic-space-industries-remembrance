[item-description]
ei-water-turret=Consomme de l’eau et 100 kW pour ralentir les ennemis de 25 % pendant 2 secondes, sans dégâts, ou éteindre automatiquement les feux proches. Portée : 24. Chaque jet d’extinction consomme 15 unités d’eau. Priorités réglables dans l’interface de la tourelle.
ei-extinguisher=Éteint manuellement les feux et dissipe les flaques d’acide dans une petite zone. Utilise des cartouches d’extincteur.
ei-extinguisher-ammo=Cartouche pour l’extincteur portatif. Capacité : 100.

