[mod-setting-description]
ei-water-turret-fire-check-seconds=Intervalle entre les recherches de nouveaux feux : 1 à 30 secondes, 2 par défaut. Ne modifie ni la cadence de tir ni les contrôles électriques. Les recherches sont réparties et limitées ; les grandes installations peuvent prendre plus de temps.

