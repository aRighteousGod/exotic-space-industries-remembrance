[exotic-industries-informatron]
menu_fusion_power=Énergie de fusion
title_fusion_power=Énergie de fusion
fusion-power=Énergie de fusion
fusion-power-text=Le [color=orange]réacteur de fusion[/color] [item=ei-fusion-reactor] est un système énergétique de fin de progression qui consume des combustibles atomiques légers dans une cuve à plasma contrôlée.\n\nIl fonctionne avec une boucle fermée de liquide de refroidissement au plomb : [fluid=ei-cold-coolant] entre dans la cuve, [fluid=ei-hot-coolant] en ressort chargé de chaleur. Le réacteur coûte cher à construire et plus cher encore à nourrir. Une fois actif, il exige des combustibles de fusion chauffés sans relâche.\n\nLes premiers essais utilisent [fluid=ei-heated-protium] et [fluid=ei-heated-lithium-6]. Les chaînes plus puissantes passent ensuite par [fluid=ei-heated-deuterium], [fluid=ei-heated-tritium] et [fluid=ei-heated-helium-3].\n\nLa fusion n'est ni propre ni gratuite. C'est une étoile tenue en laisse par des conduites, des aimants et une volonté de fer.
fusion-power-2=Les neutrons et vous
fusion-power-2-text=La fusion peut aussi servir de source de neutrons. Une basse température de réacteur favorise la fuite neutronique, une température moyenne garde un compromis, et une haute température étouffe le flux neutronique tout en favorisant la puissance.\n\nLes [color=orange]collecteurs de neutrons[/color] [item=ei-neutron-collector] proches se lient à la source utilisable la plus forte à portée. Le mode du réacteur, la distance et l'activité déterminent le flux exploitable.\n\nLes neutrons ne sont pas un décor. C'est une monnaie pour les combustibles de fusion avancés. Construisez près, réglez avec soin, et ne confondez pas une étoile plus vive avec une étoile plus généreuse.
menu_fusion_reactor_controls=Commandes du réacteur de fusion
title_fusion_reactor_controls=Commandes du réacteur de fusion
fusion-reactor-controls=Contrôle manuel
fusion-reactor-controls-text=La console du réacteur garde quatre réglages manuels visibles : combustible 1, combustible 2, température et taux d'injection. Ces choix sélectionnent une recette cachée verrouillée qui définit la consommation, le débit de refroidissement, la puissance estimée et le flux neutronique.
fusion-reactor-controls-2=Paires de combustibles et recettes verrouillées
fusion-reactor-controls-text-2=Seules les paires de combustibles valides peuvent s'allumer. Si le second combustible choisi ne réagit pas avec le premier, la console revient au premier combustible valide de la table ordonnée du réacteur au lieu de laisser la cuve dans un état impossible.
fusion-reactor-controls-3=Température et injection
fusion-reactor-controls-text-3=La température et l'injection sont deux leviers séparés. La basse température produit beaucoup de neutrons et peu de puissance. La moyenne sert de compromis. La haute température supprime les neutrons et privilégie la puissance. Une injection basse économise le combustible, la moyenne reste stable, la haute brûle plus fort à un coût sévère.
menu_fusion_reactor_circuit_interface=Interface circuit de fusion
title_fusion_reactor_circuit_interface=Interface circuit de fusion
fusion-reactor-circuit-interface=Interface combinatoire cachée
fusion-reactor-circuit-interface-text=L'interface circuit reprend le modèle de combinator invisible utilisé par d'autres systèmes ESIR. Une interface cachée est câblée en interne au connecteur visible du réacteur, publie la télémétrie et accepte des signaux de contrôle quand le réacteur est en mode Circuit.
fusion-reactor-circuit-interface-2=Contrat de signaux lecture/écriture
fusion-reactor-circuit-interface-text-2=Le mode Manuel ignore les signaux d'écriture mais publie tout de même son état quand il est câblé. Le mode Circuit lit [virtual-signal=ei-fusion-set-fuel-1], [virtual-signal=ei-fusion-set-fuel-2], [virtual-signal=ei-fusion-set-temperature] et [virtual-signal=ei-fusion-set-injection]. Les combustibles valent 1 protium, 2 deutérium, 3 tritium, 4 hélium-3, 5 lithium-6. Température et injection utilisent 1 bas, 2 moyen, 3 haut. Les champs absents ou nuls utilisent le repli manuel. Les retours d'état utilisent des signaux distincts, afin de ne pas commander le réacteur par écho.
menu_fusion_reactor_agents=Agents du réacteur de fusion
title_fusion_reactor_agents=Agents du réacteur de fusion
fusion-reactor-agents=États des agents
fusion-reactor-agents-text=Les agents sont des états compacts pour les circuits et le diagnostic. L'agent de contrôle indique l'autorité Manuel ou Circuit. L'agent combustible indique si la paire est valide ou corrigée. L'agent thermique indique la posture basse, moyenne ou haute. L'agent refroidissement indique si la recette demande un débit valide. L'agent circuit indique l'état non câblé, lisible ou commandant.
fusion-reactor-agents-2=Valeurs des signaux
fusion-reactor-agents-text-2=La convention numérique reste simple. L'agent de contrôle vaut 1 manuel, 2 circuit. L'agent combustible vaut 1 valide, 2 corrigé. L'agent thermique vaut 1 bas, 2 moyen, 3 haut. L'agent refroidissement vaut 1 demande valide, 3 invalide ou sec. L'agent circuit vaut 1 non câblé, 2 lisible, 3 commandant.
menu_fusion_reactor_options=Options du réacteur de fusion
title_fusion_reactor_options=Options du réacteur de fusion
fusion-reactor-options=Options et repli
fusion-reactor-options-text=Les options sont des commandes de confort appliquées aux mêmes quatre réglages manuels. Réinitialiser revient à deutérium-tritium, température moyenne et injection moyenne. Actualiser les collecteurs force les collecteurs de neutrons proches à réévaluer le réacteur.
fusion-reactor-options-2=Préréglages et remplacement
fusion-reactor-options-text-2=Les préréglages Puissance, Flux et Équilibré choisissent des valeurs manuelles raisonnables sans cacher les réglages fins. En mode Circuit, ces valeurs manuelles restent le repli quand un champ de circuit est absent, nul ou invalide.
menu_fusion_neutron_collectors=Fusion et collecteurs de neutrons
title_fusion_neutron_collectors=Fusion et collecteurs de neutrons
fusion-neutron-collectors=Relation avec les collecteurs de neutrons
fusion-neutron-collectors-text=Le réacteur de fusion et le collecteur de neutrons sont liés par la force de source, l'activité et la distance. Changer la recette du réacteur change le multiplicateur neutronique vu par les collecteurs à portée, qui sont donc rafraîchis quand le mode du réacteur change.
fusion-neutron-collectors-2=Pression de disposition
fusion-neutron-collectors-text-2=Les collecteurs récompensent la géométrie. Un réacteur proche à basse température peut nourrir la production de combustible avec un fort flux ; un réacteur de puissance à haute température peut affamer les collecteurs tout en produisant plus de chaleur. L'usine doit décider si son étoile est génératrice, surgénératrice, ou serment divisé avec précision.

