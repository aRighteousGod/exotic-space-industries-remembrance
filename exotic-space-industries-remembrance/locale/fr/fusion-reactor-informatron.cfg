[virtual-signal-description]
ei-fusion-set-fuel-1=Entrée circuit pour le combustible 1. Valeurs : 1 protium, 2 deutérium, 3 tritium, 4 hélium-3, 5 lithium-6.
ei-fusion-set-fuel-2=Entrée circuit pour le combustible 2. Valeurs : 1 protium, 2 deutérium, 3 tritium, 4 hélium-3, 5 lithium-6.
ei-fusion-set-temperature=Entrée circuit pour la température. Valeurs : 1 bas, 2 moyen, 3 haut.
ei-fusion-set-injection=Entrée circuit pour le taux d'injection. Valeurs : 1 bas, 2 moyen, 3 haut.
ei-fusion-state-fuel-1=Sort l'indice effectif du combustible 1.
ei-fusion-state-fuel-2=Sort l'indice effectif du combustible 2.
ei-fusion-state-temperature=Sort l'indice effectif de température.
ei-fusion-state-injection=Sort l'indice effectif d'injection.
ei-fusion-power=Sort la puissance estimée du réacteur en MW.
ei-fusion-neutron-flux=Sort le flux neutronique multiplié par 100.
ei-fusion-efficiency=Sort le pourcentage d'efficacité.
ei-fusion-coolant-rate=Sort le caloporteur chaud par seconde multiplié par 100.
ei-fusion-control-agent=Sort 1 manuel ou 2 circuit.
ei-fusion-fuel-agent=Sort 1 valide ou 2 corrigé.
ei-fusion-thermal-agent=Sort 1 bas, 2 moyen ou 3 haut.
ei-fusion-coolant-agent=Sort 1 demande valide de caloporteur ou 3 invalide.
ei-fusion-circuit-agent=Sort 1 non câblé, 2 lisible ou 3 commandant.
