[entity-description]
ei-auric-inoculation-vat=Revendique un bassin humide voisin sur Gleba, exécute des cycles d'inoculation par étapes et fait éclore des nodules kystiques auriques tant que la contamination reste tenue.
ei-auric-cyst-node=Un nodule de floraison aurique né du marais, créé par un cycle de cuve réussi.

