[recipe-description]
ei-auric-inoculation-vat=Construit une cuve d'inoculation aurique qui revendique un bassin humide voisin, exécute les cycles d'inoculation sur Gleba et fait ensuite éclore des nodules kystiques auriques hors du marais.
ei-auric-cyst-washing=Lave les kystes auriques récoltés, récupère la sortie utile et renvoie une part d'eau sale dans la boucle glébienne.

[technology-name]
ei-auric-marsh-inoculation=Inoculation des marais auriques

[technology-description]
ei-auric-marsh-inoculation=Débloque les cuves d'inoculation auriques de Gleba, la manutention des kystes et leur chaîne de lavage. Revendiquez un bassin de marais valide, alimentez les réactifs du cycle et empêchez la contamination de faire s'effondrer la floraison.

