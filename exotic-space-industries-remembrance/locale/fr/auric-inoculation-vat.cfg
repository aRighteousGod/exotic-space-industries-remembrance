[virtual-signal-description]
ei-auric-vat-vigor=Sort la vigueur actuelle du cycle de la cuve sur une échelle de 0 à 100.
ei-auric-vat-contamination=Sort la pression de contamination actuelle de la cuve sur une échelle de 0 à 100.
ei-auric-vat-band=Sort l'indice de bande actuel du bassin, de 1 à 7, selon le nombre de tuiles humides revendiquées.
ei-auric-vat-claims=Sort le nombre de tuiles de bassin humide actuellement revendiquées par la cuve.
ei-auric-vat-bloom=Sort l'état de floraison : 1 stable, 2 sous contrainte, 3 en échec.

