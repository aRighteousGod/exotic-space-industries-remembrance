ei-auric-inoculation-vat=Un contrôleur de bassin glébien qui inocule un bassin humide voisin et le pousse à travers des cycles de floraison aurique.
ei-auric-cyst=Matière kystique minéralisée récoltée sur une floraison aurique stable.

