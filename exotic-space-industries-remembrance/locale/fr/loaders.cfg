[item-description]
ei-steam-loader=Chargeur à vapeur à alimentation directe avec un filtre partagé pour les deux voies de la ceinture. Ne déplace que des objets non empilés et demande de la vapeur active.
ei-loader=Chargeur à alimentation directe avec un filtre partagé pour les deux voies de la ceinture. Ne déplace que des objets non empilés.
ei-fast-loader=Chargeur rapide à alimentation directe avec un filtre partagé pour les deux voies de la ceinture. Ne déplace que des objets non empilés.
ei-express-loader=Chargeur à alimentation directe avec un filtre partagé pour les deux voies de la ceinture. Empilement réglable jusqu'à [font=default-bold]2[/font].
ei-turbo-loader=Chargeur à alimentation directe avec deux filtres de voie, un pour chaque côté de la ceinture. Empilement réglable jusqu'à [font=default-bold]2[/font].
ei-neo-loader=Chargeur à alimentation directe avec deux filtres de voie, un pour chaque côté de la ceinture. Empilement réglable jusqu'à la limite globale d'empilement des convoyeurs.

