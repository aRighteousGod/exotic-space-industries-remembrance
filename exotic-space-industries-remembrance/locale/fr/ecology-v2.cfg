[mod-setting-description]
ei-ecology-alert-enabled=Recevoir les effets écologiques réussis sélectionnés dans les alertes natives. Interrupteur principal des notifications personnelles.
ei-ecology-alert-surfaces=Utilisez all ou un tableau JSON de noms exacts. [] signifie aucun. Maximum : 128 noms et 4096 octets. La fenêtre Écologie modifie ce même réglage. Les noms absents ne correspondent à rien.
ei-ecology-alert-current-surface-only=Limiter les notifications sélectionnées à la surface actuellement affichée, y compris en vue distante. Désactivé par défaut.
ei-ecology-alert-allow-unrevealed=Administrateurs uniquement : ignorer la visibilité actuelle du secteur. Les filtres de catégorie et de surface restent actifs. Désactivé par défaut. Un secteur simplement exploré ne suffit pas normalement.
ei-terrain-periodic-mining-scars=Les carrières admissibles et les grandes foreuses en activité peuvent altérer le sol naturel exposé autour des gisements finis. Gisements actifs, installations et zones protégées restent préservés. Les cicatrices d’épuisement restent liées aux événements.
ei-terrain-periodic-mining-seconds=Intervalle avant modulation par l’intensité et la saison. Les 300 secondes par défaut deviennent 600 en intensité Restreinte, avant modulation saisonnière. Une inspection tardive ne rattrape pas les occasions manquées.
ei-terrain-periodic-mining-probability=Probabilité à chaque occasion périodique admissible. Valeur par défaut : 10 %. La probabilité distincte de 70 % par tuile du motif sélectionné ne change pas.
ei-ecology-alert-wildfire=Notifier après un effet écologique réussi : Départ de feu. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent. Un départ de feu confirme l’allumage, pas la destruction d’une forêt.
ei-ecology-alert-flood=Notifier après un effet écologique réussi : Inondation. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-drought=Notifier après un effet écologique réussi : Assèchement du rivage. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-cliff=Notifier après un effet écologique réussi : Érosion des falaises. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-paving=Notifier après un effet écologique réussi : Corrosion du revêtement. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-pollution=Notifier après un effet écologique réussi : Dégradation par pollution. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-restoration=Notifier après un effet écologique réussi : Restauration du terrain. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-depletion-scars=Notifier après un effet écologique réussi : Cicatrices d’épuisement. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-working-scars=Notifier après un effet écologique réussi : Cicatrices de foreuses actives. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-mining-restoration=Notifier après un effet écologique réussi : Restauration minière. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-tree-stress=Notifier après un effet écologique réussi : Stress des arbres. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-tree-recovery=Notifier après un effet écologique réussi : Récupération des arbres. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-regrowth=Notifier après un effet écologique réussi : Repousse sauvage. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-aging=Notifier après un effet écologique réussi : Vieillissement des arbres. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-rot=Notifier après un effet écologique réussi : Décomposition du bois mort. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-thermal=Notifier après un effet écologique réussi : Cicatrices thermiques. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.
ei-ecology-alert-blood=Notifier après un effet écologique réussi : Restauration par sang alien. Ce choix n’active pas l’effet. Les filtres personnels et la visibilité s’appliquent.

[ei-terrain]
controls=Le bouton en forme d’arbre mécanique en haut à gauche ouvre Simple, Avancé et Alertes. La couleur de ses feuilles suit la saison du monde affiché ; le survol indique son nom. Simple présente les relevés ; Avancé détaille réglages effectifs, résultats et limites. Alertes partage les préférences des réglages de mod par joueur et utilise la fenêtre native, normalement dans les secteurs actuellement visibles. Les réglages administrateur restent dans Terrain & Écologie.
v2-coverage=Les observations parcourent un ensemble limité de secteurs. Les zones non étudiées restent inconnues ; les relevés absents ou anciens ne prouvent pas une exposition continue. Seuls les dégâts enregistrés par ESIR sont restaurés. Migration, initialisation et maintenance finies apparaissent dans la fenêtre de reconstruction ; l’écologie continue reste dans Avancé. La limite initiale de 100 000 visites ne certifie pas toute la carte.
mining-v2-note=Les foreuses actives ont une option périodique distincte, activée par défaut : 10 % toutes les 300 secondes de base, ou 600 en intensité Restreinte avant modulation saisonnière. Les demandes acceptées n’expirent pas avec l’âge et se mettent en pause sur une surface désactivée. La restauration des nouvelles cicatrices enregistrées est activée par défaut.
status-unsupported=Surface non prise en charge
status-independent=Contrôleur indépendant de Fulgora

