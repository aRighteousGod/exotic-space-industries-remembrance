guide-summary=Le rapport Simple distingue le jour local du calendrier saisonnier. Sa bande journalière montre les limites actuelles des phases d’éclairage de la surface et la durée d’une rotation complète ; sa bande saisonnière suit le calendrier annuel d’ESIR. Les estimations de temps restant utilisent les réglages actuels. Fulgora conserve son contrôleur du jour indépendant, et une heure figée ou un jour permanent supprime les prévisions habituelles. Les bannières de paysages sont décoratives. Les cartes d’activité comptent les changements réussis enregistrés, dont plusieurs peuvent concerner la même parcelle. Elles indiquent la dernière activité connue de chaque catégorie ; les anciens totaux peuvent ne pas avoir de date mémorisée. L’âge des observations et leur couverture décrivent des relevés de terrain limités, pas la santé du monde entier.
