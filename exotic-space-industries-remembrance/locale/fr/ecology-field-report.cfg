feature-unavailable=ne s’applique pas ici
record-help=Les compteurs enregistrent les changements réussis d’ESIR, pas des parcelles distinctes ni un relevé complet du terrain. Une même parcelle peut changer plusieurs fois. Les anciennes sauvegardes conservent leurs totaux, mais peuvent ne pas avoir de date d’activité. Le compteur des feux enregistre les allumages, pas les pertes de forêt.
ground-help=La restauration peut remonter les changements de terrain enregistrés lorsque les conditions le permettent. Un revêtement ou un remplacement par un autre système peut rendre la succession sauvegardée inutilisable ; le retirer ne recrée pas l’enregistrement. Les infrastructures, les terres cultivées et les sites particuliers conservent leurs protections.
ground-conditions=Les dégâts au sol exigent au moins __1__ de pollution pendant __2__ ; la restauration exige des mesures d’au plus __3__ pendant __4__. Des observations fiables et des occasions distinctes restent nécessaires.
pollution-unavailable=La pollution de ce monde ne permet pas d’évaluer la contamination industrielle. Les spores de Gleba ne sont pas de la pollution industrielle.
mining-recovery-on=La restauration minière est activée. Les cicatrices enregistrées peuvent se restaurer si les conditions de propreté requises et les vérifications de protection sont satisfaites.
mining-recovery-off=La restauration minière est désactivée. Les cicatrices minières enregistrées restent en place jusqu’à l’activation de cette option ou au remplacement du terrain.
woodland-help=Ces changements enregistrés concernent les arbres sauvages pris en charge. Les plantes cultivées et la flore protégée sont exclues. Des arbres naturellement gris ne prouvent pas à eux seuls des dégâts de pollution.
woodland-unavailable=Ce monde n’a pas de forêt indigène prise en charge pour ces effets.
other-help=Les effets exigent toujours un terrain local adapté et des vérifications de protection. Les changements des rives se limitent aux associations d’eau douce et de sol côtier autorisées sur Nauvis. La corrosion du revêtement possède ses propres conditions explicites.
survey=Dernier relevé local : il y a __1__. __2__\nLes observations ne couvrent que les zones visitées. Un terrain non observé n’est pas reconnu comme sain.
survey-none=Aucun relevé local fiable n’est encore disponible. Les observations ne couvrent que les zones visitées ; un terrain non observé n’est pas reconnu comme sain.
coverage-discovering=L’étude initiale du terrain est encore en cours.
coverage-observed=Le passage initial est terminé ; ce n’est pas un bilan de santé complet.
coverage-limited=La couverture de l’étude reste limitée.
coverage-unknown=La couverture de l’étude n’a pas été établie.
