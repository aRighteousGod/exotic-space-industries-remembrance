clock-help=Les durées sont exprimées en temps de simulation. La bande commence au début du plein jour ; le repère indique la position observée dans le cycle. Les prévisions utilisent les limites et la durée actuelles du cycle, qu’un autre contrôleur peut modifier. Il ne s’agit pas d’une prévision de production solaire.
