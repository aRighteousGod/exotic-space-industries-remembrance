seasons=__1__ · __2__ % de cette saison écoulés\nAvancement de l’année : __3__ %\nProchaine saison dans __4__\nDurée de l’année : __5__\nÉquivaut à __6__ jours locaux à la durée actuelle du cycle.
calendar-help=Le calendrier saisonnier et le jour local sont deux horloges distinctes. Une année du calendrier équivaut à __1__ jours de référence. L’équivalent en jours locaux utilise la durée actuelle du cycle, sans compter les rotations déjà écoulées.
