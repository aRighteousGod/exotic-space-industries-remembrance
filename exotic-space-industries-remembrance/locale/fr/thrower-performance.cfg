[mod-setting-name]
ei-thrower-performance-profile=Performances des tourelles lance-flammes et lance-acide

[mod-setting-description]
ei-thrower-performance-profile=Réduit les particules, la cadence de tir, la fumée et la fréquence des dégâts de brûlure ou de corrosion des tourelles uniquement. Des impacts plus puissants conservent les dégâts soutenus nominaux ; une consommation accrue par tir conserve le débit de fluide par seconde. Les dégâts, la croissance et la durée des feux au sol propres à chaque combustible restent inchangés. Le profil Original conserve le comportement actuel. Les profils 8× et 16× produisent des salves espacées : couverture des cibles mobiles, montée en puissance du feu et effets des résistances fixes peuvent différer. Ces facteurs ne garantissent pas un gain d'UPS équivalent. Les armes portatives et de véhicules ne sont pas concernées.\nValeurs de base avant qualité, recherches ou autres mods. Colonnes : délai entre tirs / intervalle des particules / particules par seconde / multiplicateur des impacts et du fluide / intervalle de brûlure / intervalle de corrosion. Intervalles en ticks (60 ticks = 1 seconde).

[string-mod-setting]
ei-thrower-performance-profile-original=Original
ei-thrower-performance-profile-2x=Réduction ×2
ei-thrower-performance-profile-4x=Réduction ×4
ei-thrower-performance-profile-8x=Réduction ×8
ei-thrower-performance-profile-16x=Réduction ×16

[string-mod-setting-description]
ei-thrower-performance-profile-original=Comportement actuel : tir tous les 4 ticks ; particule tous les 2 ticks ; 30 particules/s ; impacts et fluide normaux ; brûlure tous les 10 ticks ; corrosion à chaque tick.
ei-thrower-performance-profile-2x=Tir tous les 8 ticks ; particule tous les 4 ticks ; 15 particules/s ; dégâts d'impact et fluide par tir ×2 ; brûlure tous les 20 ticks ; corrosion tous les 2 ticks.
ei-thrower-performance-profile-4x=Tir tous les 16 ticks ; particule tous les 8 ticks ; 7,5 particules/s ; dégâts d'impact et fluide par tir ×4 ; brûlure tous les 30 ticks ; corrosion tous les 4 ticks.
ei-thrower-performance-profile-8x=Tir tous les 32 ticks ; particule tous les 16 ticks ; 3,75 particules/s ; dégâts d'impact et fluide par tir ×8 ; brûlure tous les 30 ticks ; corrosion tous les 8 ticks. Salves espacées : couverture et résistances fixes affectées.
ei-thrower-performance-profile-16x=Tir tous les 64 ticks ; particule tous les 32 ticks ; 1,875 particule/s ; dégâts d'impact et fluide par tir ×16 ; brûlure tous les 30 ticks ; corrosion tous les 16 ticks. Salves très espacées : couverture et résistances fixes affectées.

