[technology-description]
ei-surveyor-carbine=Ajoute verre, pression et correction mécanique à l'ancien châssis de mitrailleuse. Le résultat n'est pas plus rapide. Il porte plus loin.
ei-surveyor-rifle=Stabilise le modèle d'arpenteur avec une récupération électrique et de meilleures optiques, prolongeant la doctrine du tir lointain dans l'ère électrique.
ei-surveyor-cannon=Transforme la lignée d'arpenteur en arme antimateriel automatique, renforcée par les données de simulation et les plaques en fibre de carbone. L'arme continue de tirer, mais chaque coup appartient encore à la lunette.
ei-adaptive-surveyor=Utilise les données supérieures, le placage irrégulier et l'adaptation de chambre pour convertir la lignée d'arpenteur en système quantique d'exécution longue portée.
military-5=Formalise la doctrine de mise à mort simulée : pièges prédictifs, charges de brèche, munitions infernales et robots incendiaires sous un même cadre de commandement autorisé.
ei-inferno-grenade=Autorise des grenades à fragmentation reconstruites en charges de déni de zone au feu simulé : l'enveloppe se rompt, les éclats tombent, et chaque impact écrit un autre cercle de feu.
ei-incinerator=Autorise les Incinérateurs dérivés des destructeurs: cinq escortes rapides qui suivent, brûlent et refusent la clémence du feu.
