[item-description]
ei-surveyor-carbine=Une carabine de l'ère de la vapeur à lunette de verre. Elle tire lentement, mais son canon corrigé par pression porte plus loin que les armes automatiques ordinaires.
ei-surveyor-rifle=Une monture d'arpenteur stabilisée électriquement. Le tir reste mesuré; l'image de visée devient plus nette.
ei-surveyor-cannon=Un arpenteur antimateriel de l'âge de simulation. Sa discipline automatique de gros calibre s'appuie sur des impacts modélisés et une structure de recul en fibre de carbone.
ei-adaptive-surveyor=Un système de précision modulaire de l'âge quantique. Les données supérieures prévoient chambre, canon, vent et cible avant que la détente ait fini de bouger.
ei-inferno-grenade=Une grenade à fragmentation reconstruite pour éclater sur la cible en éclats brûlants explosifs. Chaque éclat détonne à l'impact, puis sème son propre cercle de feu.
ei-incinerator-capsule=Libère cinq Incinérateurs rapides dérivés des destructeurs. Ils suivent, brûlent et refusent la clémence du feu.
ei-prediction-snare-mine=Un piège de simulation déployé qui prédit les déplacements hostiles, puis inonde la biologie proche de faux signaux moteurs.
ei-breach-solver-charge=Une charge compacte qui dépense des données de simulation dans une explosion étroite et excessive pour ouvrir nids, vers et cibles renforcées.

