[autoplace-control-descriptions]
ei-auric-fumarole=La fréquence règle les chances d'éruption et les tentatives de réapparition. La taille règle le nombre cible de fumerolles actives, pas leurs dimensions. La richesse règle les réserves : à 100 %, chaque nouvelle fumerolle contient 40 000 à 80 000 unités. Désactiver empêche toute nouvelle éruption. Les gisements existants conservent leurs réserves restantes. Les fumerolles n'apparaissent pas dans l'aperçu de génération de la carte. Elles apparaissent uniquement pendant la partie, lorsque le script est actif.

[exotic-industries-informatron]
auric-fumarole-defaults=Les valeurs ci-dessous correspondent aux réglages de carte à 100 %. La population cible reste limitée par le terrain disponible et l'espacement.
