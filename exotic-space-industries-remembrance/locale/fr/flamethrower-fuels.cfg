[item-name]
ei-flamethrower-fuel=Munition de lance-flammes (__1__)
[item-description]
ei-flamethrower-fuel=Dégâts de feu : __1__ % de ceux des munitions au pétrole brut. Le feu au sol dure initialement __2__ secondes et peut atteindre __3__ secondes s’il est alimenté en continu. La durée des flammes sur les cibles reste inchangée. Les lance-flammes des véhicules conservent leur comportement habituel.
[entity-description]
ei-flamethrower-fuel=Effets du combustible : __1__. Le feu au sol dure initialement __2__ secondes et peut atteindre __3__ secondes s’il est alimenté en continu.
[mod-setting-name]
ei-flamethrower-fuel-adaptation=Effets des tourelles lance-flammes selon le combustible
[mod-setting-description]
ei-flamethrower-fuel-adaptation=Adapte automatiquement les flammes, la fumée et la durée du feu au sol au combustible utilisé. Si désactivé, les tourelles utilisent des effets communs et la durée normale du feu ; tous les bonus de dégâts et toutes les variantes de munitions restent disponibles. La mise à jour a lieu tous les 16 ticks. Les vérifications du combustible et les tentatives de remplacement sont chacune limitées à la valeur complète du nombre maximal de mises à jour de scripts par tick. La désactivation restaure progressivement les tourelles existantes dans cette limite. Activé par défaut.
