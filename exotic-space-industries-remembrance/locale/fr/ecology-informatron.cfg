[ei-ecology-guide]
intro-heading=Lire le terrain autour de votre usine
intro=Votre usine ne laisse pas que des bâtiments derrière elle. La pollution peut dégrader les sols naturels et griser les arbres voisins ; l’extraction peut laisser des plaques de terrain dénudées. Des conditions plus propres donnent à une partie de ces sols et de ces bois une chance de se rétablir. L’évolution du terrain ajoute aussi des phénomènes dangereux locaux et un calendrier saisonnier, avec des règles adaptées à Nauvis, Gaia, Vulcanus, Gleba, Fulgora et Aquilo. Les plateformes spatiales, les planètes inconnues et les surfaces utilitaires sans planète associée restent en dehors de son champ d’action.\n\nCommencez par Sols pour comprendre la dégradation, la restauration, l’extraction et les effets du sang. Forêts explique les arbres et les incendies ; Rives traite de l’eau et des falaises. Saisons présente le calendrier et les particularités de chaque monde. Réglages vous aide à choisir vos options, à lire les rapports et à comprendre les effets qui tardent à apparaître. Le système s’inspire de TerrainEvolution et TerrainEvolution2, avec les limites de traitement et les règles de protection propres à ESIR.
defaults-heading=Les conditions de départ
defaults=Une nouvelle configuration active le système écologique et toutes ses fonctions. Cela comprend la restauration des nouvelles traces d’extraction, le vieillissement des arbres, la décomposition du bois mort, les changements des rives, l’érosion des falaises, les effets du sang, la corrosion des revêtements, l’activité saisonnière et la durée du jour saisonnière. Vous pouvez désactiver chaque fonction séparément selon le paysage que vous souhaitez conserver.\n\n[font=default-bold]Réglages par défaut :[/font] L’intensité est Modérée et le traitement Économe. Les feux de forêt utilisent le mode Localisés ; Propagation est un choix distinct. Les sauvegardes existantes conservent leurs réglages et les remplacements définis par surface. Ces valeurs initiales ne réinitialisent pas vos choix.\n\n[font=default-bold]Limites pratiques :[/font] Une fonction activée a toujours besoin d’un sol ou d’une végétation adaptés, des bonnes conditions et du temps nécessaire pour examiner la zone. Lorsqu’une probabilité intervient, une vérification peut ne rien changer. Activer une fonction lui permet d’agir sans garantir un effet partout et immédiatement.
observation-heading=Des mesures fiables pour distinguer sol propre et pollution
observation=Le système mesure la pollution dans une sélection tournante de secteurs de carte, appelés chunks, puis utilise chaque mesure pour les décisions proches. Il lui faut plusieurs mesures successives pour considérer les conditions comme durablement propres ou polluées. Une zone qui n’a pas été vérifiée récemment reste inconnue ; elle n’est pas automatiquement saine.\n\n[font=default-bold]Réglages par défaut :[/font] Des conditions polluées exigent au moins 100 de pollution pendant cinq minutes observées. Des conditions propres exigent au plus 25 pendant dix minutes observées. Strictement entre 25 et 100, les deux périodes d’observation repartent à zéro. Un intervalle de plus de 20 secondes de simulation entre les mesures rompt aussi la continuité établie.\n\n[font=default-bold]Limites pratiques :[/font] Une mesure manquante ou un autre type de pollution ne prouve pas que l’air est propre. Une carte largement explorée demande davantage de temps pour être couverte. La durée d’observation est une condition à remplir, pas un compte à rebours garantissant un changement de chaque case à son terme.
protection-heading=Préserver l’usine et les lieux particuliers
protection=Les changements écologiques ordinaires laissent les revêtements, les remblais, les fondations et les sols recouverts en place. Machines et autres infrastructures, fantômes, gisements encore présents, plantes et sols cultivés, zones revendiquées par les installations Auric, sites particuliers placés dans le monde et terrains non pris en charge sont également protégés. Les arbres sauvages pris en charge et les petits décors naturels ne rendent pas, à eux seuls, une zone industrielle.\n\n[font=default-bold]Limites pratiques :[/font] La protection peut dépasser l’obstacle lui-même. Les changements des rives et les effets sur les objets naturels gardent une marge d’au moins huit cases, même si la marge générale est plus petite. La protection est vérifiée à nouveau juste avant un changement : une machine récemment posée peut donc arrêter un travail déjà en attente.\n\nLa corrosion prévoit une exception étroite pour les chemins et bétons admissibles et inoccupés. Les changements des rives ne concernent que certaines associations de sol et d’eau. Le feu en mode Propagation peut dépasser le site d’allumage initialement vérifié. Désactiver une fonction arrête sa nouvelle activité ; les changements déjà réalisés restent généralement en place jusqu’à ce qu’un processus de restauration pris en charge les répare.
soil-heading=La pollution use les sols naturels
soil=Sous une pollution industrielle persistante, le sol naturel peut changer par étapes. Sur Nauvis, l’herbe peut laisser place à la terre, au désert puis au sable. Les autres mondes suivent leurs propres terrains volcaniques, humides, rocheux ou enneigés. Réduire la pollution peut arrêter les dégâts supplémentaires dès que les conditions ne les permettent plus.\n\n[font=default-bold]Réglages par défaut :[/font] Avec l’intensité Modérée, l’intervalle de référence entre les vérifications du sol est de deux minutes, pour un réglage de base de 60 secondes. L’activité saisonnière et les délais de traitement influencent le moment où une zone est examinée. Les cinq minutes d’observation polluée restent nécessaires.\n\n[font=default-bold]Limites pratiques :[/font] Chaque vérification porte sur une petite zone, sans repeindre tout un chunk. Le nombre maximal d’étapes de dégradation limite la progression enregistrée d’une parcelle. Un sol arrivé au bout de sa succession autorisée ne peut plus avancer ; chaque planète conserve ses propres types de terrain.
recovery-heading=Un air plus propre permet de réparer les dégâts enregistrés
recovery=Des conditions plus propres donnent au terrain endommagé une chance de se rétablir. ESIR mémorise les changements qu’il a faits et les remonte, une étape à la fois, vers le sol initial exact. Si l’herbe est devenue terre puis sable, la restauration reprend les étapes sauvegardées au lieu de choisir une case d’herbe quelconque.\n\n[font=default-bold]Réglages par défaut :[/font] L’intensité Modérée donne un intervalle de restauration de huit minutes, pour un réglage de base de 240 secondes. Cet intervalle de base vaut quatre fois celui de la dégradation. Il faut aussi dix minutes de mesures confirmant une faible pollution ; ces deux exigences peuvent progresser en parallèle. L’intensité modifie l’intervalle de restauration, mais pas l’activité saisonnière. Aucun de ces délais ne garantit un résultat immédiat.\n\n[font=default-bold]Limites pratiques :[/font] La restauration exige un enregistrement fiable des dégâts d’ESIR. Construire sur le sol ou le faire remplacer par un autre système peut rendre cet enregistrement inutilisable ; retirer ensuite le revêtement ne le recrée pas. La restauration ne peut pas reconstituer d’anciens sols ou littoraux non enregistrés, reconstruire des falaises ni rendre la vie aux arbres détruits.
depletion-heading=Un gisement épuisé peut laisser une trace
depletion=Lorsqu’un gisement fini s’épuise, le terrain exposé voisin peut être perturbé. La position épuisée doit se trouver dans la zone d’extraction d’une carrière thermique, à vapeur, électrique ou d’une grande foreuse capable d’extraire cette catégorie de ressource. Les changements de zone dus à la qualité comptent. Les foreuses ordinaires et les gisements infinis ne sont pas admissibles.\n\n[font=default-bold]Réglages par défaut :[/font] Une parcelle est choisie dans un rayon de perturbation de 56 cases ; son propre rayon est de trois cases. Chaque position admissible de cette parcelle a 70 % de chances de changer. Le minerai encore présent et le terrain protégé restent intacts.\n\n[font=default-bold]Limites pratiques :[/font] C’est l’épuisement du gisement qui déclenche la demande ; l’événement ne dit pas à ESIR quelle foreuse en est responsable. C’est la couverture par une foreuse admissible qui compte. Les parcelles sont traitées progressivement : une trace peut donc apparaître après l’arrêt de la machine. De nombreux épuisements rapprochés peuvent regrouper les demandes voisines ou empêcher d’en accepter davantage, mais une demande acceptée n’est pas supprimée simplement parce qu’elle attend depuis longtemps.
working-heading=Les carrières en activité peuvent perturber leurs abords
working=Une carrière admissible ou une grande foreuse peut aussi laisser des traces pendant qu’elle exploite encore un gisement fini. Elle doit être active, afficher l’état En fonctionnement et avoir une cible d’extraction finie valide sur la même surface. Ce mécanisme est distinct de la trace déclenchée par l’épuisement d’un gisement. Une foreuse à l’arrêt ne crée pas de trace de travail.\n\n[font=default-bold]Réglages par défaut :[/font] L’intensité Modérée donne un intervalle de référence de dix minutes entre les occasions, pour un réglage de base de 300 secondes. Chaque occasion a 10 % de chances de demander une trace minière. Cette parcelle applique ensuite sa probabilité distincte de 70 % à chaque position admissible. Les saisons et les délais de traitement peuvent modifier le moment des vérifications.\n\n[font=default-bold]Limites pratiques :[/font] Le minerai encore présent reste protégé ; la trace peut donc se former sur le sol exposé voisin. ESIR garde une liste limitée des quatre mêmes familles de foreuses et la met à jour lors des créations et suppressions ; les machines à l’arrêt peuvent y rester. Une vérification tardive fait une tentative actuelle sans rejouer les occasions manquées. Désactiver l’écologie sur la surface suspend les vérifications et l’application des traces en attente.
mining-recovery-heading=Jusqu’où une trace minière peut se réparer
mining-recovery=La restauration minière revient vers le sol présent juste avant la formation de la trace. Si la pollution avait déjà transformé l’herbe en terre, la restauration après extraction peut ramener cette parcelle vers la terre. L’enregistrement minier remplace l’ancien chemin de restauration écologique : il ne permet donc plus de retrouver l’herbe antérieure. D’autres étapes minières enregistrées peuvent toujours être remontées.\n\n[font=default-bold]Réglages par défaut :[/font] La restauration minière est activée pour les nouvelles traces enregistrées. La restauration générale du terrain et celle des traces d’extraction doivent toutes deux être activées. Le sol doit satisfaire les observations requises de faible pollution, avec un enregistrement de restauration toujours valide.\n\n[font=default-bold]Limites pratiques :[/font] Les dégâts faits lorsque la restauration minière est désactivée sont permanents. L’activer ensuite ne permet pas de reconstituer ces traces non enregistrées. Désactiver l’écologie d’une surface met les travaux miniers acceptés en pause ; la réactiver les fait reprendre dans les limites habituelles, sans rafale de tentatives manquées.
blood-heading=Le sang alien peut aider un sol abîmé à se rétablir
blood=Lorsqu’une créature ennemie ou un nid meurt, son effet de sang peut faire reculer d’une étape les dégâts enregistrés sur le sol voisin. C’est une restauration directe : elle peut agir sans attendre la période normale d’observation propre. Elle exige toujours un enregistrement ESIR valide, les fonctions correspondantes activées et les protections habituelles du terrain. Les dégâts miniers exigent aussi la restauration minière.\n\n[font=default-bold]Réglages par défaut :[/font] Une mort admissible a 10 % de chances de faire accepter une petite parcelle locale à traiter. Les changements y sont réalisés plus tard, lorsque la capacité de traitement le permet.\n\n[font=default-bold]Limites pratiques :[/font] Un cadavre ne garantit pas un sol restauré et ne laisse aucun champ de guérison permanent. L’effet ne peut pas inventer l’ancien terrain en l’absence d’enregistrement. Il est distinct des effets visuels de mort au combat, et une forte activité peut limiter les nouvelles parcelles acceptées.
paving-heading=Le sang peut aussi corroder les revêtements exposés
paving=Avec les effets du sang et la corrosion activés, une parcelle liée à une mort ennemie peut enlever un chemin en pierre ou un béton admissible pour révéler le terrain mémorisé dessous. Une restauration valide du terrain passe en premier ; le revêtement est envisagé lorsque cette restauration n’est pas possible. Laissez cette option désactivée si vous voulez conserver les revêtements exposés admissibles.\n\n[font=default-bold]Réglages par défaut :[/font] La corrosion a un tirage de 1 % après l’acceptation de l’effet du sang. C’est une chance dans une parcelle acceptée, pas une probabilité de 1 % pour chaque ennemi tué n’importe où.\n\n[font=default-bold]Limites pratiques :[/font] Les revêtements occupés ou autrement protégés et les fondations sont exclus. Le terrain dessous doit toujours être connu et valide. C’est l’exception précise à la protection ordinaire des revêtements. Les éléments retirés ne sont ni remboursés ni reconstruits par la restauration. Désactiver les effets du sang arrête aussi les nouvelles tentatives de corrosion, même si leur propre interrupteur reste activé.
stress-heading=La pollution peut griser les arbres sauvages
stress=Les arbres sauvages pris en charge peuvent perdre leur couleur après des conditions polluées persistantes. Ils restent vivants et en place ; griser n’est pas brûler ni devenir du bois mort. ESIR mémorise leur état de couleur initial et le stress appliqué pour pouvoir l’annuler plus tard. Les plantes cultivées, la flore particulière, les sites protégés et les espèces non prises en charge sont laissés tranquilles.\n\n[font=default-bold]Réglages par défaut :[/font] L’intensité Modérée donne un intervalle de référence de dix minutes entre les vérifications de stress, pour un intervalle de base de cinq minutes. L’intensité, l’activité saisonnière, la couverture des observations et les recherches limitées d’arbres déterminent quand un arbre sera examiné. L’observation polluée requise reste nécessaire.\n\n[font=default-bold]Limites pratiques :[/font] Un arbre déjà entièrement gris ne peut pas franchir une étape de gris supplémentaire. Si un autre système change la couleur d’un arbre enregistré, ESIR peut abandonner cet enregistrement plutôt que d’écraser sa nouvelle apparence.
greening-heading=Un arbre stressé peut retrouver sa couleur
greening=Gardez la pollution basse assez longtemps et un arbre stressé par ESIR pourra retrouver progressivement son apparence d’origine. Un arbre naturellement gris conserve sa couleur naturelle. Il faut le même arbre vivant, l’état de couleur attendu dans l’enregistrement et des mesures continues confirmant une faible pollution.\n\n[font=default-bold]Limites pratiques :[/font] Abattre, remplacer ou détruire l’arbre met fin à cette possibilité. La récupération de sa couleur appartient à la fonction de stress des arbres, qui possède ses propres enregistrements. Elle est distincte de la restauration du sol, de la repousse, du vieillissement et de la décomposition. Un sol d’apparence saine ne promet pas le retour de ses anciens arbres ; un arbre qui récupère ne prouve pas non plus que toutes les parcelles voisines sont prêtes à se rétablir.
regrowth-heading=La forêt s’étend à partir des arbres survivants
regrowth=Après des conditions propres prolongées, un arbre sauvage adapté peut donner naissance à un nouvel arbre pris en charge dans le voisinage. Conserver une partie de la forêt indigène donne un point de départ à la repousse. Le nouvel arbre doit convenir au terrain et passer les vérifications de protection ; sur Gaia, son espèce est choisie selon le biome local. Les cultures ne servent jamais d’espèces de repousse.\n\n[font=default-bold]Réglages par défaut :[/font] L’intensité Modérée donne un intervalle de référence de vingt minutes entre les occasions de croissance, pour dix minutes de base, avant les variations saisonnières et les délais de traitement. Une nouvelle position peut être éloignée de huit cases au plus selon chacun des axes de la carte. La croissance est empêchée si le voisinage de quatre cases contient déjà 16 arbres naturels pris en charge. Toutes surfaces confondues, au moins dix secondes séparent deux nouveaux arbres effectivement créés.\n\n[font=default-bold]Limites pratiques :[/font] C’est une extension locale et lente de la forêt. Une clairière isolée sans arbre survivant adapté pour fournir les graines peut rester vide. Des mesures propres, assez d’espace et un tour de traitement disponible doivent coïncider ; un intervalle ne garantit pas que chaque arbre en produira un autre.
aging-heading=Les arbres vivants peuvent devenir du bois mort
aging=Le vieillissement peut retirer un arbre vivant de Nauvis pris en charge et le remplacer par du bois mort indigène. Il agit indépendamment du stress dû à la pollution : même un arbre vert peut être choisi. Désactivez-le si vous voulez conserver les arbres vivants jusqu’à ce qu’une autre cause les retire.\n\n[font=default-bold]Réglages par défaut :[/font] Le vieillissement est activé. Avec l’intensité Modérée, son intervalle de référence est de deux heures, pour une heure de base, avec une variation liée à l’activité saisonnière. Ce sont des vérifications dans une zone examinée, pas une durée de vie fixe attribuée à chaque nouvel arbre.\n\n[font=default-bold]Limites pratiques :[/font] Nauvis est actuellement le seul monde disposant d’un remplacement pris en charge en bois mort. Les protections s’appliquent toujours. La perte de l’arbre vivant est permanente ; récupérer sa couleur ne peut pas le ramener. Le vieillissement lui-même n’allume aucun feu.
rot-heading=Le bois mort peut disparaître progressivement
rot=La décomposition retire au fil du temps les arbres morts pris en charge. Elle peut débarrasser les anciens restes forestiers, mais ne les remplace pas par des arbres vivants. La repousse est le processus distinct qui pourra éventuellement rétablir un bois voisin. Le vieillissement et la décomposition peuvent être activés séparément.\n\n[font=default-bold]Réglages par défaut :[/font] Avec l’intensité Modérée, la décomposition a un intervalle de référence d’une heure, pour trente minutes de base. L’intensité, l’activité saisonnière et la couverture du traitement influencent le moment où une zone est examinée.\n\n[font=default-bold]Limites pratiques :[/font] Le bois mort retiré n’est pas enregistré pour être restauré. Les espèces non prises en charge, les sites protégés et la flore cultivée sont exclus. La décomposition suit son propre rythme : une visite tardive ne rejoue pas d’un coup toutes les vérifications manquées pendant l’absence d’observation.
thermal-heading=Un arbre perdu dans le feu peut laisser un sol abîmé
thermal=Un arbre tué par des dégâts de feu admissibles peut laisser une petite trace autour de son ancienne position. Le sol suit les règles de terrain de sa planète et peut être enregistré pour une restauration ultérieure. Des conditions plus propres peuvent réparer le sol, tandis que l’arbre reste perdu.\n\n[font=default-bold]Limites pratiques :[/font] La mort doit avoir une source de feu admissible et les protections normales du sol s’appliquent toujours. Les feux de combat et les incendies spontanés peuvent tous deux produire ces morts. Les traces thermiques réagissent à la mort ; elles n’allument pas une autre flamme. Un emplacement de machine protégé peut donc rester intact même si un arbre voisin brûle.
wildfire-heading=Choisir des feux localisés ou à propagation
wildfire=La pollution industrielle peut parfois déclencher un feu près d’arbres sauvages pris en charge. La zone doit atteindre au moins le seuil supérieur de pollution, contenir un combustible adapté à proximité et offrir un point d’allumage non protégé. Une mesure sous ce seuil arrête les nouvelles demandes d’allumage dans la zone ; un allumage déjà accepté peut encore être en attente. Cette fonction n’attend pas les cinq minutes d’observation polluée exigées pour le sol.\n\n[font=default-bold]Réglages par défaut :[/font] Le mode Localisés est choisi. Avec l’intensité Modérée, l’intervalle de référence des dangers est de vingt minutes, pour dix minutes de base. Une occasion de feu admissible a 1 % de chances de tenter un allumage ; les saisons, les tours partagés entre dangers et la couverture peuvent encore la retarder. Cette chance ne s’applique pas à chaque arbre chaque seconde. Les allumages initiaux, toutes surfaces confondues, sont limités à un par dix secondes et à 16 enregistrements de feu conservés.\n\n[font=default-bold]Limites pratiques :[/font] Localisés crée une flamme au sol sans propagation, durant au plus dix secondes. Propagation démarre un feu d’arbre ordinaire de Factorio ; les flammes suivantes peuvent dépasser la zone vérifiée et consommer du temps moteur hors des limites du script écologique. Désactiver l’écologie retire ses flammes localisées, mais laisse tranquilles les feux de combat indépendants et les flammes issues de la propagation. Une alerte confirme la création d’un allumage, pas qu’une forêt a brûlé.
flood-heading=L’eau peut avancer sur une rive sableuse
flood=Sur Nauvis, une inondation peut transformer une rive sableuse prise en charge en eau, à côté d’une eau douce existante elle aussi prise en charge. Attendez-vous à de petits changements locaux du rivage. La lave et les océans de pétrole ou d’ammoniac sont exclus, tout comme un terrain quelconque loin d’une rive adaptée.\n\n[font=default-bold]Réglages par défaut :[/font] Chaque occasion d’inondation a une probabilité de 2 %. Son rythme suit l’intervalle des dangers, l’intensité, l’activité saisonnière et la couverture du traitement. Il n’exige ni pluie, ni faible pollution, ni météo visible.\n\n[font=default-bold]Limites pratiques :[/font] Un voisinage de rive adapté directement au nord, au sud, à l’est ou à l’ouest permet la demande initiale. Avant de changer une case, le système vérifie que sa conversion de sol en eau est prise en charge et reste autorisée par les protections. Une inondation enregistrée peut être restaurée tant que son enregistrement reste valide ; désactiver les inondations ne retire pas immédiatement l’eau. C’est un déplacement local du rivage, pas une simulation globale du niveau marin.
drought-heading=L’eau peut reculer le long d’une rive sableuse
drought=Sur Nauvis, la sécheresse peut transformer une eau douce prise en charge en sable, à côté d’une rive sableuse adaptée. Elle peut ainsi laisser davantage de sol exposé le long de la côte. Les autres liquides planétaires sont exclus, et une eau qui n’a pas le voisinage de rive requis n’est pas admissible.\n\n[font=default-bold]Réglages par défaut :[/font] Chaque occasion de sécheresse a une probabilité de 2 %. Son rythme suit l’intervalle des dangers, l’intensité, l’activité saisonnière et la couverture du traitement, sans exiger séparément une forte pollution ou un phénomène météo.\n\n[font=default-bold]Limites pratiques :[/font] Les infrastructures, les ressources encore présentes et les sites particuliers restent protégés. Un changement en attente peut cesser d’être admissible avant son application. Inondation et sécheresse ont des interrupteurs indépendants ; activer les deux permet des changements locaux opposés au fil du temps. Aucun ne modélise la température ou les précipitations, et le rivage n’est pas forcé à avancer puis reculer immédiatement.
cliff-heading=L’érosion peut retirer des falaises ordinaires
cliff=L’érosion peut retirer une falaise ordinaire prise en charge après vérification des protections voisines. Cette barrière naturelle change alors définitivement. Désactivez la fonction si vous voulez conserver les falaises jusqu’à leur suppression manuelle.\n\n[font=default-bold]Réglages par défaut :[/font] Une occasion d’érosion de falaise a une probabilité de 1 %. Elle n’exige ni exposition à la pollution, ni pluie, ni dégâts de combat, ni âge mesuré de la falaise.\n\n[font=default-bold]Limites pratiques :[/font] Les familles de falaises planétaires particulières ne remplacent pas la falaise ordinaire prise en charge. Des infrastructures ou sites protégés voisins peuvent empêcher son retrait, même après sa découverte. La restauration du sol ne peut pas reconstruire une falaise supprimée.
calendar-heading=Un calendrier pour chaque monde
calendar=Chaque monde pris en charge possède un calendrier saisonnier. Les mondes plus éloignés de l’étoile ont généralement des années plus longues, d’après leur distance sur la carte stellaire. Le calendrier organise les variations saisonnières ; il ne déplace pas les planètes et ne change pas les trajets. Saison montante, Haute saison, Saison descendante et Basse saison désignent ses quatre parties, sans promettre de météo particulière.\n\n[font=default-bold]Réglages par défaut :[/font] L’année de référence vaut 360 jours de Nauvis, avec la durée effective du jour de Nauvis mémorisée au démarrage du calendrier. L’année d’un monde utilise cette référence multipliée par le rapport de sa distance à celle de Nauvis, élevé à la puissance 1,5. Son orientation sur la carte stellaire fixe le point de départ dans l’année. Les changements ultérieurs du contrôleur du jour de Nauvis ne redéfinissent pas continuellement cette référence.\n\n[font=default-bold]Utiliser le calendrier :[/font] Le panneau de calendrier de l’administrateur affiche les jours de référence, leur équivalent en jours locaux et la durée de simulation. Changer la durée de l’année conserve la position actuelle dans la saison. Les administrateurs peuvent aussi ajuster cette position pour obtenir un aperçu.
daylight-heading=La part de lumière change, pas la durée totale du jour
daylight=La durée du jour saisonnière allonge ou raccourcit la période éclairée à l’intérieur de la journée existante d’une planète. Imaginez déplacer le lever et le coucher du soleil sans changer le temps nécessaire à une rotation complète. Cela modifie la durée pendant laquelle les panneaux solaires reçoivent la lumière du jour. Les transitions de crépuscule conservent leur durée.\n\n[font=default-bold]Réglages par défaut :[/font] Nauvis, Gaia, Vulcanus, Gleba et Aquilo sont admissibles. L’inclinaison supposée de l’axe est de 23,5 degrés et la latitude de 45 degrés. Même aux réglages extrêmes, au moins 2 % du cycle restent en plein jour et 2 % en pleine nuit.\n\n[font=default-bold]Limites pratiques :[/font] Une heure figée ou un jour permanent suspend les ajustements saisonniers. ESIR cède aussi la place à Diurnal Dynamics ou à un autre contrôleur qui change les mêmes réglages d’aube et de crépuscule. À la désactivation, il rétablit les réglages initiaux seulement si son dernier ajustement est toujours intact. Le contrôleur indépendant de Fulgora conserve toute autorité ; la durée du jour saisonnière ne modifie ni ne restaure jamais ses limites.
modulation-heading=Les saisons peuvent changer le rythme de l’écologie
modulation=L’activité saisonnière rend les occasions de changement du sol, d’effets sur les arbres, de dangers et de traces de foreuses actives plus ou moins fréquentes au fil de l’année. Elle peut agir même si la durée du jour saisonnière est désactivée ou si un autre système contrôle l’éclairage, y compris sur Fulgora. Modifier le rythme ne change pas la probabilité de réussite de chaque occasion.\n\n[font=default-bold]Réglages par défaut :[/font] L’amplitude est de 25 %. Le rythme monte progressivement jusqu’à 125 % de la référence de l’intensité choisie près de la Haute saison, puis descend jusqu’à 75 % près de la Basse saison. Un rythme plus élevé raccourcit les intervalles ; un rythme plus faible les allonge.\n\n[font=default-bold]Limites pratiques :[/font] Les saisons n’activent pas les dangers désactivés, ne changent pas les observations requises de faible ou de forte pollution et ne modifient pas l’intervalle ordinaire de restauration du sol. Une occasion de croissance exige toujours des mesures propres, un arbre semencier adapté, de l’espace et du temps de traitement disponible. Le calendrier ne déplace pas les planètes et ne repeint pas le monde selon la saison. Un bouton aux couleurs d’hiver est un indicateur, pas une promesse de neige.
nauvis-heading=Nauvis : sol, sable et forêt
nauvis=Le sol de Nauvis peut passer par l’herbe, la terre, le désert et le sable ; la restauration ramène les parcelles enregistrées vers leur terrain initial exact. Les arbres indigènes pris en charge peuvent montrer du stress, retrouver leur couleur et se multiplier. Nauvis est aussi le premier monde pris en charge pour les changements de rives d’eau douce, et le seul où le vieillissement remplace un arbre vivant par du bois mort.\n\n[font=default-bold]Limites pratiques :[/font] Les zones d’usine revêtues, les ressources encore présentes, les infrastructures et les sites particuliers restent protégés. La corrosion admissible constitue l’exception explicite pour les revêtements exposés.
gaia-heading=Gaia : conserver le caractère du paysage local
gaia=Les prairies et marais de Gaia peuvent se dégrader jusqu’à exposer la roche de Gaia. La restauration remonte les variantes de terrain enregistrées, et la repousse choisit des arbres adaptés au biome local. Les sites particuliers placés par ESIR disposent de zones protégées pour que le travail écologique ordinaire les laisse intacts.\n\n[font=default-bold]Limites pratiques :[/font] Sur les anciennes sauvegardes, les marqueurs de site survivants aident à déterminer les zones à protéger. Les zones encore en cours de vérification, ou celles dont les anciens enregistrements de protection étaient saturés, peuvent rester fermées aux changements écologiques. Si leurs marqueurs distinctifs ont disparu, le système ne peut pas reconstituer de toutes pièces les limites exactes d’un ancien site.
vulcanus-heading=Vulcanus : cendres et sols volcaniques en évolution
vulcanus=Vulcanus utilise ses propres changements de cendres, de sols volcaniques et de terrains fissurés. La lave reste protégée et les effets sur les arbres n’utilisent que les espèces indigènes prises en charge. Les fumaroles conservent leurs cycles distincts de population, de réserves et de terrain.\n\n[font=default-bold]Limites pratiques :[/font] L’écologie ne prend pas le contrôle des effets des fumaroles, n’introduit pas de forêt terrestre ordinaire et ne transforme pas les liquides volcaniques en eau douce.
gleba-heading=Gleba : les spores demandent un traitement différent
gleba=Gleba conserve les changements de sol de ses propres biomes et les habitats d’arbres sauvages pris en charge, y compris leurs règles de placement en zone humide. Les plantes cultivées et leurs sols particuliers, la flore Auric et les bassins revendiqués restent protégés. Les spores sont un autre type de pollution ; elles ne comptent pas comme contamination industrielle toxique.\n\n[font=default-bold]Limites pratiques :[/font] Une mesure de spores seules n’est ni une mesure industrielle polluée ni la preuve de conditions industrielles propres. Les spores seules ne permettent donc pas la dégradation du sol par pollution, la restauration ordinaire, le stress des arbres ou le retour de leur couleur, la repousse naturelle ou les feux dus à la pollution. L’extraction admissible, les traces de morts par le feu, les effets du sang, les dangers indépendants et le calendrier peuvent encore agir. Activer une fonction ne rend pas les spores utilisables comme mesure industrielle.
fulgora-heading=Fulgora : son jour reste sous son propre contrôle
fulgora=Les sols pris en charge de Fulgora peuvent passer par la roche, le sable, la poussière et les dunes, tandis que ses océans de pétrole restent protégés. Son calendrier écologique peut changer le rythme des effets admissibles et la couleur du bouton d’arbre mécanique. Aucune famille forestière indigène prise en charge ne permet d’y faire pousser des arbres ordinaires.\n\n[font=default-bold]Limites pratiques :[/font] Le système indépendant du cycle du jour de Fulgora continue de gouverner l’éclairage. La durée du jour saisonnière ne lit, ne modifie et ne restaure jamais ses limites d’aube et de crépuscule, même lorsque les réglages globaux d’écologie ou de calendrier changent.
aquilo-heading=Aquilo : neige et glace autour d’une usine protégée
aquilo=Aquilo utilise ses propres changements de neige compactée et de glace, dont la restauration retrace les étapes enregistrées. Les océans d’ammoniac, les fondations et les infrastructures restent protégés. La durée du jour saisonnière peut faire varier la part éclairée de la journée sans changer la rotation de la planète.\n\n[font=default-bold]Limites pratiques :[/font] Aucune famille forestière indigène prise en charge ne permet de peupler Aquilo d’arbres ordinaires. L’écologie ne fournit pas de simulation générale du gel, du dégel ou de la transformation des océans.
settings-heading=Choisir des réglages globaux et des exceptions locales
settings=L’interrupteur d’intégration au démarrage rend l’écologie disponible. Utilisez Paramètres des mods → Carte pour les fonctions, les seuils de pollution, les intervalles, les probabilités, l’activation des planètes et les limites de traitement. Les administrateurs peuvent utiliser Terrain et écologie pour remplacer les réglages pris en charge sur une surface existante. Rétablir l’héritage retire cette exception locale. Choisir une planète ou lire son rapport ne crée pas sa surface.\n\n[font=default-bold]Limites pratiques :[/font] Le comportement final combine les réglages globaux, les règles planétaires et les remplacements explicites par surface. La désactivation générale, les terrains non pris en charge et les protections restent prioritaires. Les mises à jour préservent les réglages enregistrés. Désactiver la restauration la suspend sans réparer instantanément le sol. Désactiver un autre effet ne rembourse pas les arbres, falaises ou revêtements détruits. Désactiver l’intégration au démarrage rétablit l’éclairage saisonnier uniquement là où le dernier ajustement d’ESIR est toujours intact.
presets-heading=L’intensité règle le rythme ; le traitement règle la couverture
presets=Choisissez l’intensité pour la fréquence des occasions écologiques, et le traitement pour la quantité de terrain examinée et la rapidité de prise en charge du travail en attente. Augmenter le traitement peut donner plus vite de l’attention à une carte très active ou largement explorée. Cela n’augmente pas la probabilité configurée de réussite à chaque vérification.\n\n[font=default-bold]Réglages par défaut :[/font] Modérée utilise un multiplicateur de rythme de 0,5, Normale de 1 et Forte de 2 ; Personnalisée utilise votre multiplicateur. Une intensité supérieure n’active pas les fonctions désactivées. Le traitement est Économe par défaut. Les sept choix nommés sont Très faible, Faible, Économe, Équilibré, Détaillé, Haute fidélité et Très haute fidélité, auxquels s’ajoute Personnalisé. Économe traite un petit lot tous les 16 ticks et autorise une recherche d’entités tous les 32 ticks.\n\n[font=default-bold]Limites pratiques :[/font] Les limites de traitement et de stockage sont partagées entre toutes les surfaces ; Personnalisé conserve aussi des plafonds. Réduire un plafond de stockage préserve les enregistrements existants, mais en bloque de nouveaux jusqu’à ce qu’une place se libère. Lorsque le stockage de restauration est plein, ESIR refuse de nouveaux dégâts réversibles au lieu d’oublier le chemin de restauration d’une ancienne parcelle. Les profils plus élevés peuvent coûter davantage de temps de calcul ; aucun ne garantit des UPS déterminés pour toute usine.
reports-heading=Lire le rapport du monde que vous regardez
reports=L’arbre mécanique en cuivre, en haut à gauche, ouvre le rapport Écologie de la surface que vous regardez, y compris en vue à distance. Son feuillage suit le calendrier : vert citron en Saison montante, émeraude en Haute saison, rouge ambré en Saison descendante et cyan en Basse saison. Survolez-le pour connaître la saison. Sans calendrier utilisable, il reste émeraude et indique que l’information saisonnière n’est pas disponible.\n\n[font=default-bold]Utiliser le rapport :[/font] Simple décrit les sols observés, les bois, les perturbations minières et les conditions saisonnières dans le langage d’un rapport de terrain. Avancé ajoute les réglages effectifs de la surface, les mesures, les travaux en attente, les refus liés aux protections et l’état de maintenance, en les distinguant des limites et compteurs globaux partagés. Sans observation, l’état est inconnu, pas sain.\n\nLe rapport actualise les faits déjà recueillis tant qu’il est ouvert. Le fermer arrête ces mises à jour. La vérification distincte de la couleur du bouton peut continuer sans rechercher quoi que ce soit sur le terrain.
alerts-heading=Choisir les changements dont vous voulez être informé
alerts=Les notifications écologiques apparaissent dans la fenêtre habituelle d’alertes de Factorio, avec des icônes et des positions que vous pouvez consulter. Choisissez-les dans l’onglet Alertes de la fenêtre Écologie ou dans Paramètres des mods → Par joueur ; les deux modifient les mêmes préférences personnelles. Une alerte signifie qu’un effet a réellement eu lieu, pas seulement qu’une vérification était prévue.\n\n[font=default-bold]Réglages par défaut :[/font] Les alertes sont activées pour les feux de forêt, les inondations, les sécheresses, l’érosion des falaises et la corrosion des revêtements. Les autres catégories, dont les dégâts de pollution, la restauration, l’extraction et les effets sur les arbres, sont initialement désactivées et se choisissent séparément. Toutes les surfaces existantes sont sélectionnées ; le filtre limité à la surface actuelle est une option distincte. Les ajustements ordinaires de l’éclairage ne déclenchent pas d’alerte.\n\n[font=default-bold]Limites pratiques :[/font] Votre force doit actuellement voir le chunk de l’incident ; l’avoir exploré auparavant ne suffit pas. Les administrateurs peuvent contourner cette exigence de visibilité, mais les filtres de catégorie et de surface s’appliquent toujours, et cette dérogation est retirée à la perte des droits. Les incidents voisins sont regroupés, jusqu’à quatre alertes écologiques sont conservées par joueur, et un incident peut être notifié pendant 60 secondes. Les incidents survenus hors connexion ne sont pas accumulés pour plus tard. L’expiration d’une alerte ne supprime jamais les enregistrements de restauration ni le travail minier en attente.
maintenance-heading=Ce que vous indique la fenêtre de reconstruction
maintenance=La fenêtre de reconstruction ESIR montre les préparations et réparations qui ont une fin : conversion des données d’anciennes sauvegardes, premier passage de découverte, vérification des changements de configuration et réparation des informations mémorisées. Une tâche peut attendre lorsque ses surfaces sont désactivées ou empêchées de continuer. Si la quantité totale est inconnue, la fenêtre montre le travail terminé sans inventer de pourcentage.\n\n[font=default-bold]Limites pratiques :[/font] Un premier passage de découverte fixe sa liste de surfaces au départ. Chaque parcours de surface se termine lorsqu’il n’y a plus de chunks à visiter ou après 100 000 visites de chunks. Atteindre ce plafond signifie que la couverture n’a pas été vérifiée, pas que toute la carte a été examinée.\n\nLes observations courantes, la restauration, les vérifications des foreuses actives et les traces minières acceptées continuent indépendamment et apparaissent dans Avancé. Elles ne gardent pas la fenêtre de reconstruction ouverte indéfiniment. Les anciennes sauvegardes sont préparées progressivement ; rouvrir ou réactiver l’écologie ne rejoue pas toutes les occasions manquées pendant son inactivité.
troubleshooting-heading=Quand le paysage semble ne pas changer
troubleshooting=Commencez par Avancé pour la surface que vous regardez. Vérifiez que l’écologie y est effectivement activée et que ce monde est pris en charge. Cherchez ensuite des sols ou arbres adaptés, des mesures de pollution utilisables si elles sont requises, une observation continue assez longue et les protections autour de l’endroit choisi. Enfin, vérifiez le travail en attente et les plafonds de stockage atteints. Une zone calme peut simplement demander davantage de temps, surtout avec une faible probabilité et un long intervalle.\n\n[font=default-bold]Vérifications utiles :[/font] Un sol au bout de sa succession de changements ne peut plus se dégrader. La repousse exige un arbre semencier survivant d’une espèce prise en charge. L’extraction exige soit l’épuisement réel d’un gisement fini sous la couverture d’une foreuse admissible, soit une machine admissible réellement En fonctionnement pour les traces périodiques. Le feu exige de la pollution industrielle, du combustible pris en charge à proximité et le mode Localisés ou Propagation voulu. Un compteur de tentatives réussies ne prouve pas à lui seul la création d’un allumage. La restauration exige l’enregistrement ESIR d’origine, et la restauration minière exige les deux interrupteurs de restauration.\n\n[font=default-bold]Limites pratiques :[/font] ESIR est incompatible avec TerrainEvolution et TerrainEvolution2 ; ESIR cède la durée du jour saisonnière à Diurnal Dynamics. Davantage de terrain exploré et de surfaces actives demandent plus de temps à couvrir avec le même budget global de traitement. Une mesure inconnue ou une vérification retardée ne prouve ni que le terrain est sain ni que la fonction est en panne.
