[mod-setting-name]
ei-alert-icon-set=Jeu d’icônes des alertes
ei-alert-icon-set-default=Icônes des alertes par défaut

[mod-setting-description]
ei-alert-icon-set=Choisissez les icônes de vos alertes ESIR et des préférences écologiques. « Utiliser le choix au démarrage » copie le choix actuel au démarrage dans ce réglage personnel. Votre choix enregistré est conservé si la valeur au démarrage change.
ei-alert-icon-set-default=Jeu d’icônes initial pour les joueurs sans choix personnel enregistré. Les choix personnels existants sont conservés. Par défaut : Objets rendus.

