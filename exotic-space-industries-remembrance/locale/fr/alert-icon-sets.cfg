ei-alert-icon-set-original=Icônes d’origine
ei-alert-icon-set-svg=Sigils en métal coulé
ei-alert-icon-set-rendered=Objets rendus
ei-alert-icon-set-default-original=Icônes d’origine
ei-alert-icon-set-default-svg=Sigils en métal coulé
ei-alert-icon-set-default-rendered=Objets rendus
