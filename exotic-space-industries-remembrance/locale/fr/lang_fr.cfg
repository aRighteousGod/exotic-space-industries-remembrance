rocket-ammo-schema=Schéma des munitions de fusée
rocket-ammo-schema-text=Les munitions de fusee se construisent par couches : [item=ei-rocket-airframe]cellule, [item=ei-rocket-motor-basic]moteur, [item=ei-rocket-warhead-impact]ogive, puis l'obus fini. La cellule tient la coque, le moteur fixe la portee, et l'ogive choisit la famille de degats. La ligne d'artillerie suit la meme logique, seulement plus lourde et moins indulgente.
rocket-ammo-schema-2=Branches de charge
rocket-ammo-schema-text-2=La ligne de base est desormais calibree sur le cout : les charges impact et explosives frappent bien plus fort, les charges corrosives partagent le meme paquet chimique entre le lance-roquettes a main et la ligne d'artillerie, portent un coup d'acide brutal puis laissent un nuage persistant qui ronge les structures, et les charges cryo gardent la meme duree de controle sur les deux lignes tout en frappant avec plus de poids. La ligne atomique se separe nettement : l'U-235 mene a la [item=ei-atomic-bomb-u235] ESIR et garde les retombees les plus serrees, tandis que le plutonium reste la fusee atomique au plutonium, conserve l'explosion atomique vanilla, et laisse une contamination radiologique plus large derriere la breche.
rocket-ammo-schema-3=Familles d'effets
rocket-ammo-schema-text-3=Chaque famille reçoit sa propre explosion, sa propre fumée et sa propre vignette afin que le blast reste lisible en mouvement au lieu de se fondre dans un flash générique.
rocket-ammo-schema-4=Ligne atomique d'artillerie
rocket-ammo-schema-text-4=L'affut d'artillerie a cone fixe peut aussi charger des roquettes atomiques U-235 et plutonium, en version unitaire ou en caisse. Les salves en caisse sont pratiquement sacrificielles : la filiere fissile reste separee pour la production et les verrous technologiques, l'U-235 prend un coeur d'impact ESIR plus serre et des retombees plus propres, le plutonium utilise l'explosion atomique vanilla mais projette une contamination radiologique plus large, et un tir trop proche peut toujours ouvrir la position de tir avec la cible.
