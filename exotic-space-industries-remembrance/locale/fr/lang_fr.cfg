ages-and-tech=Ères technologiques
ages-and-tech-text=Exotic Industries est un mod qui couvre plusieurs ères technologiques. Chaque ère possède ses propres caractéristiques et mécanismes. 
ages-and-tech-2=Ère des ténèbres, de la vapeur, de l'électricité, de l'informatique, quantique et exotique
ages-and-tech-text-2=Il s'agit des six ères du mod. L'ère des ténèbres est très courte et vous guide vers votre première usine fonctionnant à la vapeur. Le pétrole est disponible très tôt et peut être utilisé comme source de carburant ou pour se défendre contre les biters. La construction des premiers appareils électroniques marque le début de l'ère de l'électricité. Diverses sources d'énergie deviennent disponibles. Les robots et la fission nucléaire sont introduits à cette ère. L'ère de l'informatique introduit les diffuseurs et les modules. Les machines de haute technologie seront disponibles à l'ère quantique. Enfin, l'ère exotique vous permettra de remporter la partie.
nauvis-pressure-grace=Grâce à la pression d'évolution Nauvis
nauvis-pressure-grace-text=Cette bascule de démarrage donne à Nauvis un frein temporaire à l'évolution. Toutes les 18 000 ticks, soit 5 minutes, le script vérifie l'évolution de la force ennemie sur Nauvis et la réduit d'au plus [font=default-bold]0,005[/font] uniquement si la valeur actuelle se situe au-dessus de l'objectif de grâce spécifique à l'âge.\n\nIl ne nettoie pas la pollution, ne supprime pas les nids et n'annule pas les attaques. Cela ne fait que réduire l'évolution excessive vers le plafond du début de partie. Impossible désactive cette grâce même si l'option est activée.
nauvis-pressure-grace-2=Limites d'âge
nauvis-pressure-grace-text-2=Avant [font=default-bold]Steam Age[/font], le plafond cible est [font=default-bold]0,25[/font]. Après les recherches sur Steam Age mais avant [font=default-bold]Age of Electricity[/font], l'objectif s'élève à [font=default-bold]0.5[/font]. La grâce s'éteint dès que l'on recherche l'ère de l'électricité. Impossible ignore aussi le basculement de démarrage.\n\nSi vous désactivez le paramètre, Nauvis conserve toute la pression qu'il gagne.
rocket-launch-pollution=Pollution due aux lancements de fusées
rocket-launch-pollution-text=Les lancements de fusées peuvent déverser de la pollution directement sur la surface de lancement. Le système échantillonne le facteur d'évolution de la force de lancement sur cette surface, l'alimente via la courbe de démarrage sélectionnée et met le résultat à l'échelle par rapport au plafond configuré.\n\nPar défaut, le plafond est [font=default-bold]10 000 pollution[/font] à l'évolution [font=default-bold]1.0[/font]. La plupart des modes de courbe conservent également un plancher [font=default-bold]10%[/font], donc les lancements à faible évolution se font toujours sentir. En Impossible, cette pollution peut aussi rallier les unités ennemies proches sur les surfaces déjà hostiles.
rocket-launch-pollution-2=Modes de courbe et fumée
rocket-launch-pollution-text-2=La forme de courbe de démarrage [font=default-bold][/font] peut être définie sur linéaire, quadratique, exponentielle, à seuil ou hybride. Linéaire suit directement l’évolution. Les attaques quadratiques et exponentielles entraînent davantage de sanctions lors des lancements ultérieurs. Le seuil saute à travers les bandes d’évolution fixes. Hybrid utilise une base linéaire et ajoute un pic supplémentaire en fin de partie.\n\nLa séquence de lancement peint également le silo avec une spirale de fumée persistante afin que l'événement de pollution soit visible au lieu d'être silencieux. En Impossible, la fumée peut s'accompagner d'une riposte si des ennemis locaux existent déjà.

tech=Échelle des coûts technologiques
tech-text=Exotic Industries ne chiffre pas la recherche comme une simple échelle plate à la vanilla. Le mod construit le coût des recherches à partir d'un [font=default-bold]prix de départ[/font], d'une [font=default-bold]forme de courbe[/font] et d'un [font=default-bold]plafond[/font] nommé, puis répartit cette pression sur l'ensemble de l'arbre technologique. Les paliers d'âge décident toujours quand des branches entières deviennent légales, mais cette échelle détermine à quel point les technologies tardives punissent un rush trop étroit.\n\nLa courbe linear fait plus mal tôt puis s'adoucit. quadratic se place au milieu. exponential commence doucement puis reporte une part bien plus lourde de la douleur dans les profondeurs de l'arbre. Pour une première partie, [font=default-bold]linear[/font] reste la base la plus sûre, car elle rend la structure très lisible.
tech-2=Ce que contrôlent les paramètres de démarrage
tech-text-2=[font=default-bold]Le prix de départ[/font] est le coût d'un pack de science près du début de la courbe. [font=default-bold]Le plafond[/font] choisit la fourchette visée par pack vers l'extrémité lointaine, de Sunday stroll à Very Expensive. [font=default-bold]La forme de courbe[/font] décide à quel moment cette douleur se fait sentir, tandis que [font=default-bold]le multiplicateur supplémentaire[/font] applique un facteur final une fois la courbe évaluée.\n\nSi vous voulez rééquilibrer EI, utilisez ces paramètres internes plutôt que les multiplicateurs de recherche vanilla. Le mod s'attend à piloter cette partie de la progression, et les multiplicateurs vanilla ne décrivent pas la même forme.
tech-3=Limites pratiques et changements en cours de partie
tech-text-3=Le plafond nommé n'est pas une garantie absolue. Factorio limite le multiplicateur interne du prix de recherche à [font=default-bold]x1000[/font], donc le plafond réel en jeu reste implicitement limité par votre [font=default-bold]prix de départ[/font]. Un prix de départ de [font=default-bold]10[/font] ne peut monter qu'à environ [font=default-bold]10,000[/font] par pack, même si vous choisissez un plafond plus élevé. Atteindre [font=default-bold]50,000[/font] par pack demande donc un prix de départ autour de [font=default-bold]50[/font].\n\nLe [font=default-bold]multiplicateur supplémentaire[/font] est la valeur la plus sûre à modifier en cours de sauvegarde. Changer le [font=default-bold]prix de départ[/font] ou la [font=default-bold]forme de courbe[/font] une fois la partie lancée peut produire des résultats indésirables ou imprévus.
tech-output=Progression dans l'ère actuelle
tech-output-text=L'ère suivante auquel vous devez accéder est l'[font=default-bold]__3__[/font]. Vous avez actuellement [font=default-bold]__1__ / __2__[/font] % des technologies nécessaires recherchées, afin de débloquer l'ère suivante.
world-gen-related=Informations sur le monde
world-gen-related-text=Cette section présente les systèmes de génération du monde introduits par le mod. Elle est divisée en sous-catégories ciblées pour une lecture structurelle.\n\nAccédez-y via le menu de gauche.\nCe ne sont pas des changements cosmétiques.\nIls définissent le terrain, le comportement des ressources et la logique spatiale au niveau fondamental.\n\n[font=default-bold]Comprenez cette couche, ou laissez-la vous façonner.[/font]
resources=Nouveau système de ressources
resources-text=Exotic Industries met en place un système de ressources restructuré. Les gisements traditionnels ne sont plus le seul mode d'acquisition : les ressources sont désormais réparties en catégories distinctes, chacune gouvernée par sa propre logique, son propre flux de production et son propre comportement spatial.\nL'extraction n'est plus triviale.\n[font=default-bold]L'acquisition exige une adaptation.[/font]\nComprenez la catégorie, ou ne produisez rien.
stone=Pierre
stone-text=La pierre est la ressource la plus abondante du système. Elle peut être extraite de façon classique à partir des gisements de surface, mais Exotic Industries élargit ses voies d'acquisition :\n\n[color=orange]Les moissonneuses de surface[/color] [item=ei-burner-surface-harvester] permettent une extraction en profondeur sur n'importe quel terrain.\n\n[font=default-bold]La collecte manuelle reste possible, bien qu'inefficace.[/font]\nLa pierre est partout.\nL'efficacité est optionnelle. La production ne l'est pas.
surface-patches=Gisements de surface
surface-patches-text=La surface de Nauvis n'est pas uniforme. Autour de la zone d'atterrissage, la croûte tient encore comme une réserve industrielle protégée : le [item=ei-poor-iron-chunk]fer, le [item=ei-poor-copper-chunk]cuivre, le [item=coal]charbon, la [item=stone]pierre et la [fluid=crude-oil]pression pétrolière voisine restent assez solides pour fonder la première industrie.\n\nAu-delà de ce berceau, la surface se disloque. Le [item=ei-poor-iron-chunk]fer, le [item=ei-poor-copper-chunk]cuivre et même l'[item=ei-poor-uranium-chunk]uranium ne subsistent plus que sous forme de vestiges superficiels, de ceintures de fracture et de champs de cicatrices épuisés. Ils existent, mais ils ne constituent pas une économie métallique durable.\n\nLe charbon, la pierre et le pétrole restent la peau active de Nauvis. Utilisez la réserve pour établir la chaleur, les convoyeurs et la chimie. Puis lisez correctement le terrain, ou la croûte vous mentira.
veins=Veines profondes de minerai
veins-text=Les veines de minerai sont inaccessibles au début. Elles nécessitent des [color=orange]foreuses profondes[/color] [item=ei-deep-drill], un système d'extraction de milieu de partie conçu pour le rendement vertical.\n\nCes veines n'apparaissent plus comme de simples tirages de rareté. Les métaux structurels suivent des [font=default-bold]ceintures métalliques[/font] et des [font=default-bold]bassins sédimentaires[/font] à travers Nauvis : le [item=ei-iron-chunk]fer et le [item=ei-copper-chunk]cuivre favorisent les terrains de crête, tandis que le [item=ei-coal-chunk]charbon et le [item=ei-sulfur-chunk]soufre s'accumulent dans les bassins plus bas.\n\nLes [font=default-bold]frontières hydrothermales[/font] portent le [item=ei-lead-chunk]plomb et l'[item=ei-gold-chunk]or au-delà de la région de départ protégée. Les [font=default-bold]terres de cicatrices extérieures[/font] abritent l'[item=ei-uranium-chunk]uranium, et seules les plus rares poches d'anomalie au sein de ces zones brisées exposent le [item=ei-neodym-chunk]néodyme.\n\nLes matériaux critiques, dont l'uranium, le plomb, l'or, le néodyme et l'immersite, n'existent que dans ces couches profondes.\nIls ne sont pas optionnels.\nIls sont structurels.\n\n[font=default-bold]L'extraction de surface ne vous portera pas jusqu'à la fin du jeu.[/font] Forez, lisez le terrain, ou stagnez.
chunk-grades=Minerais pauvres et minerais riches
chunk-grades-text=Tous les morceaux ne se valent pas. Le [item=ei-poor-iron-chunk]fer pauvre et le [item=ei-poor-copper-chunk]cuivre pauvre sont des restes superficiels contaminés laissés dans la croûte brisée. Ils servent à démarrer une industrie, pas à la soutenir durablement. Leur faible teneur se voit immédiatement au four : [font=default-bold]3 morceaux pauvres -> 1 plaque[/font], et ils produisent bien plus de laitier.\n\nLes [item=ei-iron-chunk]morceaux de fer et [item=ei-copper-chunk]morceaux de cuivre issus des veines profondes sont le vrai corps du gisement. Même sans raffinage supplémentaire, [font=default-bold]3 bons morceaux -> 2 plaques[/font] avec bien moins de laitier. L'[item=ei-poor-uranium-chunk]uranium pauvre suit la même logique : la surface en montre des traces, mais le vrai [item=ei-uranium-chunk]uranium vit en profondeur.
chunk-refining=Purificateur et minerai pur
chunk-refining-text=Le [item=ei-purifier]purificateur est la première machine qui améliore réellement la qualité d'un minerai au lieu de simplement l'accepter. Il lave les [item=ei-iron-chunk]morceaux de fer et [item=ei-copper-chunk]morceaux de cuivre avec de l'[fluid=water]eau, produit du [item=ei-pure-iron]fer pur ou du [item=ei-pure-copper]cuivre pur, et renvoie de l'[fluid=ei-dirty-water]eau sale qu'il faut ensuite gérer.\n\nL'étape en vaut la peine. [font=default-bold]3 morceaux pauvres -> 1 plaque[/font], [font=default-bold]3 bons morceaux -> 2 plaques[/font], mais [font=default-bold]1 minerai pur -> 2 plaques[/font] avec à peine [font=default-bold]1% de chance de laitier[/font]. Les gisements profonds lancent l'économie métallique ; la purification la rend dense, propre et industrielle.
chunk-refining-2=Four à arc et chauffe-plasma
chunk-refining-text-2=Le [item=ei-arc-furnace]four à arc transforme le traitement des chunks en véritable métallurgie en faisant fondre morceaux, minerais purs, plaques et pièces en [fluid=ei-molten-iron]fer en fusion et [fluid=ei-molten-copper]cuivre en fusion pour les chaînes de coulée. Il peut avaler des morceaux pauvres si nécessaire, mais les chiffres montrent pourquoi il ne faut pas s'y arrêter : [font=default-bold]3 morceaux pauvres ne donnent que 15 de métal en fusion[/font], alors que [font=default-bold]1 minerai pur en donne 40[/font] avec presque pas de laitier.\n\nLe [item=ei-plasma-heater]chauffe-plasma poursuit cette voie à l'Âge quantique. Il peut encore exécuter les recettes du four à arc tout en ouvrant le traitement des gaz et plasmas à température extrême. Le purificateur améliore l'entrée, le four à arc améliore la métallurgie, et le chauffe-plasma prolonge toute cette chaîne jusque dans le très tardif.
mining-scars=Cicatrices minières
mining-scars-text=L'épuisement d'un gisement ne laisse plus le terrain intact. Exotic Industries peut marquer le sol à proximité une fois l'extraction terminée, mais uniquement pour [item=ei-burner-quarry], [item=ei-steam-quarry], [item=ei-electric-quarry] et [item=big-mining-drill].\n\nEChaque événement d'épuisement peut engendrer une petite cicatrice avec un décalage aléatoire à proximité du gisement épuisé. L'effet est des dégâts de terrain, pas une impulsion de ressource bonus.
mining-scars-2=Dégradation planétaire
mining-scars-text-2=Les cicatrices dégradent les tuiles le long de chaînes spécifiques à la planète : l'herbe Nauvis s'effondre en terre et en sable, la roche Fulgora se transforme en sable, poussière et dunes, Gleba pourrit, Vulcanus se carbonise et Aquilo compacte la neige et la glace. Les tuiles d'eau et les tuiles cachées sont ignorées et les décorations correspondantes sont supprimées.\n\nTraitez les cicatrices comme une carte en vous rappelant ce que vous en avez retiré.
asteroid-variants=Astéroïdes différenciés
asteroid-variants-text=Exotic Industries ajoute six familles d'astéroïdes supplémentaires aux débris spatiaux vanille : [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk] et [item=ei-scrap-asteroid-chunk]. Ils sont superposés en routes planétaires, broyés dans le [entity=crusher], et les douze recettes d'astéroïdes EI de base et avancées bénéficient de la productivité des astéroïdes [font=default-bold][/font].\n\nLe concasseur est également étendu avec des ports fluides et un inventaire de résultats plus large afin que ces sorties mixtes s'adaptent.
chemical-asteroid=Astéroïdes chimiques
chemical-asteroid-text=Débloqué grâce à la découverte de la planète [font=default-bold] : Aquilo[/font]. Le concassage de base et avancé extrait les [fluid=ammonia], [item=ei-fluorite] et [fluid=fluorine] du morceau, tandis que la recette avancée peut également faire rouler [fluid=lithium-brine]. Leur anomalie rare est [item=ei-neuro-reactive-residue].
organic-asteroid=Astéroïdes organiques
organic-asteroid-text=Débloqué grâce à la découverte de la planète [font=default-bold] : Gleba[/font]. Le concassage de base consomme [fluid=water] et donne [item=spoilage], [fluid=ei-bio-sludge] et [fluid=ei-ammonia-gas]. Le pass avancé ajoute [item=nutrients] et peut renvoyer [item=yumako], [item=jellynut], [item=ei-bio-matter] et même un rare [item=pentapod-egg]. Leur anomalie est [item=ei-sporeglass-heart].
rock-asteroid=Astéroïdes rocheux
rock-asteroid-text=Débloqué grâce à la découverte de la planète [font=default-bold] : Vulcanus[/font]. La recette de base est principalement du [item=stone]. La recette avancée ouvre la couche minérale la plus riche : [item=tungsten-ore], [item=calcite] et [item=ei-gold-chunk]. Leur anomalie est [item=ei-gravity-braided-ore].
uranium-asteroid=Astéroïdes d'uranium
uranium-asteroid-text=Débloqué dès que la plateforme spatiale [font=default-bold]La recherche [/font] donne accès au domaine différencié. Les deux recettes consomment du [fluid=sulfuric-acid]. En retour, ils produisent des [item=stone], des [item=ei-uranium-chunk] et des [item=ei-lead-chunk], la recette avancée dépensant plus d'acide pour un retour d'uranium beaucoup plus important. Leur anomalie est [item=ei-isotopic-ghost-shell].
petrified-asteroid=Astéroïdes pétrifiés
petrified-asteroid-text=Également débloqué avec la plateforme spatiale [font=default-bold][/font]. L'écrasement de base donne un étrange mélange de [item=wood], [item=raw-fish], [fluid=ei-liquid-nitrogen] et [fluid=ei-liquid-oxygen]. Le pass avancé ajoute [item=bioflux] et [fluid=fluoroketone-cold], améliorant les jets biologiques et permettant même une petite chance à [item=biter-egg]. Leur anomalie est [item=ei-chrono-fossil-shard].
scrap-asteroid=Mettre au rebut des astéroïdes
scrap-asteroid-text=Débloqué grâce à la découverte de la planète [font=default-bold] : Fulgora[/font]. Ces recettes sont intégrées à la table de recyclage des déchets, leur broyage devient donc un flux de récupération plutôt qu'une recette de minerai à production unique. Les deux niveaux conservent leurs rouleaux [item=ei-crushed-neodym], et les deux peuvent rarement exposer [item=ei-worm-torn-relay-core].\n\nSi vous voulez que les déchets orbitaux soient transformés en stock d'usine, c'est la voie à suivre.
asteroid-anomalies=Anomalies dans les données spatiales
asteroid-anomalies-text=Chaque famille d’astéroïdes différenciée cache une anomalie. Ces six éléments d'anomalie alimentent des recettes spécialisées [entity=ei-computer-core], deviennent des cartes de données dans le simulateur et sont finalement recombinés en [item=ei-space-data] en apesanteur via le [entity=ei-quantum-computer].\n\nLe champ d'astéroïdes n'est pas seulement une matière première. Il s'agit d'une deuxième frontière de recherche.
fulgora-day-variation=Variateur de longueur de jour Fulgora
fulgora-day-variation-text=Fulgora ne conserve pas une durée de jour fixe. Au début de chaque cycle, le mod relance [font=default-bold]la durée du cycle jour-nuit[/font] en utilisant les multiplicateurs minimum et maximum de démarrage. Avec les paramètres par défaut, cela signifie que chaque jour de Fulgora peut tomber n'importe où entre [font=default-bold]10 % et 200 %[/font] de la durée du cycle standard.
fulgora-day-variation-2=Quand les relances s'appliquent
fulgora-day-variation-text-2=La relance tente de se produire pendant une fenêtre de lumière brillante et stable afin que la surface ne se déclenche pas dans une nouvelle durée de cycle pendant une forte obscurité. Si Fulgora n'offre jamais de fenêtre de sécurité, une sécurité intégrée force de toute façon le changement après environ une journée standard. \n\nLes paramètres de démarrage définissent l'enveloppe. Chaque jour réel choisit sa propre durée aléatoire à l’intérieur.

artifacts=Artéfacts aliens
artifacts-text=Certains artefacts ont été laissés par une ancienne civilisation qui était capable d'exploiter le pouvoir de la matière exotique. Ces artefacts sont disséminés dans le monde entier. Certains d'entre eux sont peut-être encore en état de marche.
actifacts-text-2=Mais attention, il se peut que pour une raison ou une autre, personne n'y ait touché...
gate=Porte inter-dimensionnelle
gate-text=La porte est une structure de transit spatial qui déplace des objets à travers une brèche dimensionnelle contrôlée.\n\nChaque porte se lie à des ID de récepteur plutôt qu'à des positions de surface brutes. La console source sélectionne un récepteur, l'ancre de destination revendique un ID, et le contrôle par circuit peut remplacer les deux si nécessaire.\n\nLe coût du transit dépend désormais à la fois de la charge et de la portée. Les sauts locaux sur une même surface restent bon marché. Les transferts interplanétaires ne le sont pas.\nCe n'est pas un portail. [font=default-bold]C'est une machine qui se souvient de l'endroit où elle déchire.[/font]
gate-2=Récepteurs et identifiants
gate-text-2=Les récepteurs de porte sont les ancres de destination. Chacun revendique l'ID positif libre le plus bas pour sa force à moins que le signal du circuit [color=orange]I[/color] ne l'emporte.\n\nLes ID effectifs en double sont en conflit et ne peuvent pas être utilisés jusqu'à ce que le conflit soit résolu.\nLa sélection d'un récepteur dans la console de porte lie la porte à cet ID de récepteur au lieu d'une position brute.
gate-3=Câblage du portail
gate-text-3=La porte écoute sur le conteneur côté source caché.\nSi ce connecteur est difficile à cibler, le [entity=ei-gate-circuit-interface] caché près du centre inférieur de la porte peut également être câblé directement.\n[color=orange]signal-D[/color] sélectionne l'ID du récepteur.\n[color=orange]signal-E[/color] active la porte lorsqu'elle est au-dessus de 0.\n[color=orange]signal-I[/color] sur un récepteur peut ignorer son identification automatique.\nSi [color=orange]signal-D[/color] se résout en un récepteur valide, le contrôle du circuit annule la sélection manuelle.\nSi [color=orange]signal-D[/color] est manquant, invalide ou en conflit, la porte revient au récepteur manuel et à l'état activé manuellement.
gate-4=Télémétrie du portail
gate-text-4=La porte sort du [entity=ei-gate-circuit-interface].\nCette interface invisible peut être utilisée comme cible de fil dédiée lorsque vous souhaitez accéder directement à la télémétrie de la porte.\nL'interface se met à jour uniquement lorsqu'elle est réellement câblée à un circuit externe, et elle s'actualise au maximum une fois par seconde.\n[color=orange]ei-gate-active[/color] est 1 lorsque la porte est armé.\n[color=orange]ei-gate-energy[/color] signale l'énergie stockée dans MJ.\n[color=orange]ei-gate-stress[/color] signale le stress sur une échelle de 0 à 100.\nUtilisez ces signaux pour piloter des alarmes, des tampons ou une logique de contrôle.
gate-5=Stress et résidus
gate-text-5=Chaque transfert réussi ajoute du stress. Le stress augmente l'entretien, allonge le temps de recharge et peut saturer un récepteur si le trafic est répété trop rapidement.\n\nLa barre [font=default-bold]Transit Span[/font] de la console montre la pression actuelle de l'itinéraire. Les transferts sur la même surface restent bon marché, les sauts orbite-planète paient un lourd plancher, et les récepteurs de plateformes mobiles utilisent la progression d'itinéraire en direct.\n\nUne utilisation excessive produit également du [item=ei-breach-residue], un déchet de cicatrices dimensionnelles. Il doit être neutralisé via la chaîne du purificateur avant qu'il ne devienne un encombrement.\nLa porte est destinée à la logistique en rafale, pas au fret continu.
gate-6=Portes héritées
gate-text-6=Les anciennes sauvegardes qui pointent toujours vers un coffre ou une position brute continuent de fonctionner jusqu'à ce qu'elles soient reconfigurées.\nUne fois qu'une porte est attribuée à un récepteur, ce récepteur devient la source de vérité et l'ancienne destination brute reste uniquement à titre informatif.\nCela préserve les anciennes sauvegardes tout en déplaçant les nouvelles configurations vers les ID du récepteur.
drone=Station pour drone
drone-text=Un port de drone qui permet de prendre en charge et de contrôler un [color=blue]drone[/color][entity=ei-drone]. En plaçant ce bâtiment, on crée un drone associé que l'on peut voir en cliquant sur la station. De là, il est possible de se connecter au drone et de le diriger. Le drone peut survoler le terrain, placer et récupérer des bâtiments, déplacer des objets depuis et vers son propre inventaire. Cependant, il est incapable de se battre. À tout moment, vous pouvez vous déconnecter du drone en utilisant [color=orange]SORTIR[/color] ou le ramener à sa station à l'aide de sa commande de réinitialisation [color=orange]RÉINITIALISATION[/color]. Faire voler un drone à travers la porte déclenchera la téléportation.
repair=Réparation des artefacts
repair-text=Vous pouvez réparer les artefacts extraterrestres cassés, en fabriquant des [color=blue]packs de réparation d'artefacts[/color][item=ei_crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. Cela vous permettra de les utiliser à nouveau. Le processus de réparation peut être lancé en faisant glisser le kit de réparation sur l'artefact. Notez que le kit de réparation sera consommé au cours du processus.
alien=Anciennes données extraterrestres
knowledge-text=L'ancienne civilisation qui a laissé les artefacts a également laissé une partie de ses données.
new-logistics=Nouvelle logistique
new-logistics-text=Exotic Industries introduit également de nouvelles fonctionnalités logistiques. Ces fonctionnalités sont divisées en plusieurs sous-catégories. Vous pouvez les trouver dans le menu de gauche.
train-progression=Progression des trains
train-progression-text-2=Les trains arrivent tôt, dès l'ère de la vapeur. Votre premier choix est la [color=orange]locomotive à vapeur[/color] [item=ei-steam-basic-locomotive], capable de tracter des marchandises mais pas des fluides.\n\nLa progression débloque ensuite la [color=orange]locomotive à vapeur avancée[/color] [item=ei-steam-advanced-locomotive], qui ajoute la traction des fluides. Ces deux modèles reposent sur des combustibles brûlables comme le charbon ou la biomasse solide, et peuvent encore être dopés plus tard par des carburants fusée, nucléaires ou à fusion.\n\nQuand la combustion devient trop sale ou trop brutale, la ligne classique évolue vers le [color=brown]carburant diesel[/color] [item=ei-diesel-fuel-unit] et la [color=orange]locomotive diesel[/color] [item=locomotive].\n\nLa logistique monte avec la technologie.\nLe carburant définit la frontière.\nLes trains ne demandent pas où aller : ils exigent ce qui brûle.\n\nQuand Gaia s'ouvre, le rail bifurque encore. Cette branche a maintenant sa propre entrée [font=default-bold]Trains EM[/font] dans cette section, car elle cesse d'être une logistique à combustion pour devenir une infrastructure d'énergie en réseau.
train-progression-text=Les trains sont disponibles dès le début de l'ère de la vapeur. Au début, vous ne pouvez construire qu'une [color=orange]locomotive à vapeur basique[/color] [item=ei-steam-basic-locomotive], permettant le transport d'objets mais pas de fluides. Avec la [color=orange]locomotive à vapeur améliorée[/color] [item=ei-steam-advanced-locomotive] vous pouvez également transporter des fluides. Ces deux trains sont alimentés par du combustible inflammable, tel que le charbon. Cependant, plus tard, le [color=brown]carburant diesel[/color] [item=ei-diesel-fuel-unit] est nécessaire pour alimenter les meilleures [color=orange] locomotives diesel[/color] [item=locomotive].
em-trains=Trains EM
em-trains-text=Gaia ne demande pas à ses derniers chemins de fer de brûler. Elle leur demande de s'accorder. Les [item=ei_charger]chargeurs EM déploient une maille cristalline au-dessus du rail, et la [item=ei_em-locomotive]locomotive EM avec ses [item=ei_em-cargo-wagon]wagons cargo et [item=ei_em-fluid-wagon]wagons fluides circule sur cette maille au lieu d'alimenter un foyer au charbon ou au diesel.\n\nComme la force motrice vient du réseau de chargeurs plutôt que d'une combustion embarquée, le même matériel roule aussi bien sur les lignes planétaires que sur les corridors hors-monde. Les ingénieurs gaïens jurent que les cristaux ne poussent ni contre la fumée, ni contre la vapeur, ni même contre l'air : ils se souviennent de la géométrie du rail et tirent le train à travers ce souvenir. Physique ou liturgie, le système supporte très bien le vide.
em-trains-2=Qualité, grâce et efficacité de transfert
em-trains-text-2=La qualité compte désormais aux deux extrémités du lien. Des [item=ei_charger]chargeurs de meilleure qualité réduisent leur propre entretien de champ jusqu'à [font=default-bold]20 %[/font] et améliorent encore l'efficacité de transfert de [font=default-bold]12 %[/font]. Des [item=ei_em-locomotive]locomotives de meilleure qualité réduisent la puissance de champ qu'elles exigent jusqu'à [font=default-bold]16 %[/font]. Ces bonus sont normalisés sur l'échelle de qualité active, de sorte que des niveaux de qualité ajoutés par d'autres mods se répartissent proprement entre le pire et le meilleur grade disponibles.\n\nLa qualité de la locomotive crée aussi une [font=default-bold]fenêtre de grâce[/font] après la sortie de couverture. Au maximum, la cohérence du champ peut tenir jusqu'à [font=default-bold]480 ticks, soit 8 secondes[/font]. La qualité normale n'obtient aucune grâce. Cela sert à franchir de petits trous, des coutures de réseau ou de brèves erreurs d'aiguillage, pas à justifier des sections mortes.
em-trains-3=Recherche et comportement du champ
em-trains-text-3=Les familles de recherche [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font] et [font=default-bold]ei_eff[/font] restent les multiplicateurs globaux principaux. La vitesse et l'accélération gagnent chacune [font=default-bold]+10 % par niveau[/font] jusqu'à [font=default-bold]+200 %[/font]. L'efficacité des chargeurs monte sur cinq niveaux jusqu'à [font=default-bold]90 % de charge réseau en moins[/font]. La qualité locale du chargeur et celle de la locomotive s'ajoutent ensuite à ces recherches au moment du transfert réel.\n\nEn pratique, un bon rail EM se construit avec de la science et du bon matériel. Tant que la couverture se rafraîchit, le train garde son carburant de champ rempli et file comme de la lumière guidée. Si la couverture s'effondre, le système tente d'abord d'utiliser la réserve de grâce, puis la locomotive devient inerte. Gaia pardonne beaucoup de choses. Un champ rompu n'en fait pas partie.
orbital-scanner=Scanner de requêtes de plateforme
orbital-scanner-text=Les miroirs [entity=ei-orbital-combinator] demandent des minimums aux plates-formes spatiales dont l'emplacement spatial [font=default-bold] correspond à la surface actuelle du scanner.[/font]\n\nIl s'agit d'une source de télémétrie en lecture seule : le scanner n'émet pas d'ordres logistiques, n'achemine pas les fusées et n'ignore pas le comportement de la plate-forme. Il republie simplement ce que ces plates-formes demandent déjà afin que vous puissiez connecter ces informations aux stations, aux alarmes, aux centres commerciaux et à la planification des importations.\n\nLes plates-formes sont répertoriées par ordre déterministe et les signaux de demande conservent leur identité de [font=default-bold]qualité[/font] au lieu de regrouper chaque niveau en un seul nombre d'éléments.
orbital-scanner-2=Banques, pages de suite et débordement
orbital-scanner-text-2=Les scanners orthogonalement adjacents sur la même force et la même surface forment une banque partagée.\n\nCette banque répartit les sections de plate-forme sur tous les membres adjacents, permettant ainsi aux grands résumés du trafic orbital de dépasser le plafond d'emplacement d'un seul combinateur constant. Si une plate-forme a besoin de plus d'espace qu'une seule page de section ne peut en contenir, le scanner la poursuivra sous le nom de [font=default-bold]Nom de la plate-forme [2/N][/font], [font=default-bold][3/N][/font], et ainsi de suite.\n\nSi la banque adjacente complète manque toujours de place, le scanner d'ancrage émet [virtual-signal=ei-orbital-overflow]. Sa valeur correspond au nombre de filtres de requêtes qui ont été omis après le remplissage de la banque.
orbital-scanner-3=Utilisation pratique
orbital-scanner-text-3=Utilisez le scanner là où la demande orbitale est la plus importante :\n\nAu niveau de l'infrastructure de lancement pour décider quelles charges utiles doivent être ensuite déployées.\nDans les dépôts de train pour appeler des importations uniquement lorsqu'une demande de plate-forme visible en surface apparaît.\nDans les centres commerciaux et les silos tampons pour déclencher des alarmes lorsque l'orbite commence à demander des pièces rares, des sciences ou des munitions.\n\nLe scanner est plus utile lorsqu'il est traité comme un [font=default-bold]planification. bus[/font]. Il indique à l'usine quelle orbite veut actuellement ; la logique de votre circuit décide quoi faire avec ces informations.
spidertron=Changements pour le Spidertron
spidertron-text=Par rapport au jeu classique, le spidertron est disponible dès le début de l'ère informatique. Cependant, il faut du carburant pour alimenter le véhicule. Les carburants thermiques sont un bon choix au début, mais plus tard, les carburants nucléaires ou basés sur la fusion apportent de bons bonus de vitesse et d'accélération au spidertron. De plus, des mods comme [color=green]Spidertron Patrols[/color] et [color=green]Constructron-Continued[/color] ont bénéficié d'une intégration spéciale suite aux changements apportés au spidertron.
cranes-and-belts=Nouveaux convoyeurs et grues
cranes-and-belts-text=Exotic Industries introduit un nouveau niveau de convoyeurs, appelé le [color=orange]convoyeur Néo[/color] [item=ei-neo-belt] fabriqué à partir de matériaux de haute technologie avec un débit de 90 objets/s. De plus, le mod ajoute de nouveaux bras de grande taille appelés [color=orange]grues [/color] [item=ei-big-inserter]. Elles peuvent être utilisées pour décharger des trains à grande vitesse ou pour transférer des objets entre des coffres/entrepôts. 
loaders=Chargeurs
loaders-text=Les chargeurs EI forment la branche à alimentation directe de la logistique : [item=ei-loader]chargeur, [item=ei-fast-loader]chargeur rapide, [item=ei-express-loader]chargeur express, [item=ei-turbo-loader]chargeur turbo et [item=ei-neo-loader]chargeur Néo. Chaque palier pousse plus d'objets, mais exige aussi davantage d'énergie.\n\nIls ne jettent pas les objets dans l'air. Ils lient directement le flux des convoyeurs aux machines, conteneurs, wagons et interfaces au bord du rail.
loaders-2=Empilement
loaders-text-2=Le chargeur Express peut empiler jusqu'à [font=default-bold]2[/font], avec une taille de pile ajustable. Le chargeur Turbo monte lui aussi jusqu'à [font=default-bold]2[/font]. Le chargeur Néo utilise le maximum d'empilement autorisé par la ceinture et permet aussi de le réduire si une cadence plus fine est préférable.\n\nLes tiers supérieurs ne se contentent donc pas d'aller plus vite : ils poussent des salves plus denses sur la même case.
loaders-3=Filtrage
loaders-text-3=Le chargeur Express utilise [font=default-bold]un filtre partagé[/font] pour toute l'entité. Les chargeurs Turbo et Néo disposent de [font=default-bold]deux filtres de voie[/font], un pour chaque côté de la ceinture.\n\nIls peuvent donc décider non seulement de ce qui passe, mais aussi sur quelle voie cela passe.
loaders-4=Accrochage et placement
loaders-text-4=Les chargeurs EI [font=default-bold]s'alignent automatiquement sur une connexion valide[/font] lors de la pose et réévaluent cet alignement quand les convoyeurs voisins changent. Ils testent de vraies liaisons vers les ceintures, conteneurs, wagons et points au bord du rail.\n\nPlacés contre un wagon, un coffre, une machine ou une interface ferroviaire, ils peuvent tourner ou inverser leur sens pour verrouiller la bonne connexion.
loaders-5=Alimentation électrique
loaders-text-5=Tous les chargeurs EI demandent [font=default-bold]de l'électricité[/font]. Chaque objet déplacé consomme l'énergie du tampon interne, et chaque palier augmente à la fois ce tampon et le coût par objet. Les tiers supérieurs sont plus puissants, pas plus économes.\n\nUn chargeur peut survivre brièvement sur sa réserve, mais il ne tient pas longtemps à plein débit sans réseau alimenté.
bots=Plus de robots
bots-text=Remembrance n'attend pas une logistique électrique propre pour mettre des machines en l'air. La progression du bot commence dans le [font=default-bold]L'ère de la vapeur[/font] avec [item=rp-steam-roboport], [item=rp-steam-logistic-bot], et [item=rp-steam-construction-bot], puis mûrit plus tard en essaims électriques plus lourds et plus avancés.\n\nLe résultat est une relation inhabituellement précoce avec l’automatisation aérienne : brute d’abord, élégante ensuite.
steam-bots=Les robots Steam
steam-bots-text=Ce ne sont pas des drones électriques polis. Ce sont des esprits ouvriers au corps en laiton, maintenus en l'air par des pistons, la pression et des calculs approximatifs, les premiers serviteurs aériens d'une industrie qui sent encore le métal chaud et la vapeur humide.\n\nParce que la ligne de robots à vapeur se trouve dans le [font=default-bold]L'ère de la vapeur[/font] et plus tard, la robotique vanille est corrigée derrière, vous bénéficiez d'une aide à la logistique de vol et à la construction bien plus tôt qu'une exécution normale ne le permettrait.
steam-bots-2=Sang chaud et échec
steam-bots-text-2=Le marché est l'endurance. Les robots Steam ne disposent pas d’une réserve électrique sans fond ; ils volent avec une pression stockée et doivent retourner à un roboport avant qu'il ne soit à sec. Si leur vapeur s'épuise pendant le transport, ils [font=default-bold]tomber du ciel[/font] au lieu d'attendre gracieusement les secours.\n\nLes robots Steam les poussent à chercher à se recharger tôt, mais les longs travaux, les ports encombrés et les réseaux trop étendus peuvent encore transformer la commodité précoce en épave.
bots-2=Lignes de robot ultérieures
bots-text-2=Une fois que l'usine aura atteint la robotique entièrement électrique, EI étend l'essaim avec des robots cargo lourds pour le transport en vrac, des robots de construction lourds pour des rafales de construction agressives, et des variantes avancées ultérieures avec une vitesse, une portée, une durabilité et une concentration sur les tâches plus élevées. Le [font=default-bold][color=orange]Advanced Roboport[/color][/font] prend en charge ce réseau ultérieur avec une charge plus rapide, plus d’emplacements de robots et un rayon de travail plus large.\n\nIl ne s’agit pas seulement d’un réseau de drones. [font=default-bold]Il s’agit d’un protocole d’essaim mécanisé.[/font]
new-mechanics=Nouveaux mécanismes de jeu
new-mechanics-text=Exotic Industries introduit un grand nombre de nouveaux mécanismes. Ces mécanismes sont divisés en plusieurs sous-catégories. Vous pouvez les trouver dans le menu de gauche.
beacon-overhaul=Surcharge des diffuseurs
beacon-overhaul-text=Exotic Industries limite le nombre de diffuseurs de modules pouvant affecter simultanément une machine à 4 diffuseurs au maximum. De plus, les diffuseurs ont désormais besoin de liquide de refroidissement pour fonctionner. Cependant, ils peuvent contenir plus de modules et un diffuseurs amélioré a été ajouté, qui compte pour 2 diffuseurs dans la limite, mais peut contenir encore plus de modules.
specialised-pipes=Tuyaux et câbles de données spécialisés
specialised-pipes-text=Exotic Industries introduit des tuyaux et des câbles de données spécialisés. Les [color=orange]tuyaux isolés[/color] sont utilisés pour transporter des fluides très froids [fluid=ei-liquid-oxygen][fluid=ei-liquid-nitrogen] ou très chauds [fluid=ei-heated-helium-3] afin de les maintenir dans leur phase liquide, car dans des tuyaux normaux, ces fluides se transforment en leur version gazeuse. Les [color=orange]câbles de données[/color] sont utilisés pour transporter les données entre les machines. Ils sont nécessaires pour faire fonctionner les nouveaux [color=orange]ordinateurs[/color] [item=ei-computer-core] et [color=orange]ordinateurs quantiques[/color] [item=ei-quantum-computer].
specialised-pipes-2=Confinement isolé
specialised-pipes-text-2=Les tuyaux, conduites souterraines et réservoirs non isolés ne sont pas sûrs pour tous les fluides. [fluid=ei-liquid-nitrogen]L'azote liquide et [fluid=ei-liquid-oxygen]l'oxygène liquide ne restent pas liquides dans une plomberie ordinaire : ils repassent à l'état gazeux et redeviennent [fluid=ei-nitrogen-gas]du gaz d'azote et [fluid=ei-oxygen-gas]du gaz d'oxygène.\n\nD'autres fluides, notamment les lignes de procédé [fluid=ei-heated-helium-3]chauffées, la lave, les fluorokétones et l'électrolyte, peuvent carrément [font=default-bold]faire éclater et détruire[/font] un tuyau ou un réservoir non isolé. Si la chimie est hostile, l'isolation n'est pas facultative.
specialised-pipes-3=Cryogénie et gel
specialised-pipes-text-3=Les tuyaux isolés échappent aussi au besoin habituel de chauffage des canalisations. Les prototypes du tuyau isolé, de sa version souterraine et du réservoir utilisent tous [font=default-bold]0 énergie de chauffage[/font] : ils n'ont donc pas besoin de chaleur externe pour éviter le gel sur Aquilo ou sur toute autre surface froide.\n\nUtilisez-les quand le fluide doit rester exactement tel qu'il a été préparé : les liquides cryogéniques restent liquides, les mélanges réactifs restent confinés, et la ligne survit là où une plomberie ordinaire céderait.
space-destinations=Destinations spatiales
space-destinations-text=Le [color=orange]silo à fusée[/color] [item=rocket-silo] peut être utilisé pour envoyer sa cargaison vers différentes destinations. Lorsqu'il sera débloqué pour la première fois à l'ère de l'informatique, vous ne pourrez envoyer que des satellites sur l'[color=green]orbite de Nauvis[/color]. Selon le type de satellite ou de fusée envoyé, vous pouvez recevoir des données ou d'autres produits de lancement utiles.
space-destinations-2=Différentes destinations
space-destinations-2-text=Au fur et à mesure de votre progression, de plus en plus de destinations différentes à l'intérieur et à l'extérieur de votre système solaire d'origine deviendront disponibles. Selon la distance qui vous sépare de la destination choisie, vous aurez besoin de plus ou moins de carburant pour fusée. De plus, certaines destinations doivent être découvertes en premier, soit en envoyant un [color=orange]satellite d'exploration[/color] spécialisé [item=ei-exploration-satellite] soit par hasard en envoyant une fusée avec une cargaison normale. Certaines nouvelles destinations peuvent être situées dans l'espace lointain, [color=purple]hors du système solaire[/color]. Notez que même en envoyant des satellites d'exploration, la découverte de nouvelles destinations dépend toujours du hasard.
induction-matrix=Matrice d'induction
induction-matrix-text=La [color=orange]matrice d'induction[/color] est une machine complexe qui peut être utilisée pour stocker de grandes quantités d'énergie. Elle peut être utilisée pour stocker de l'énergie excédentaire, tout comme les accumulateurs normaux, et la restituer plus tard. Différents niveaux de taille de matrice peuvent être débloqués en effectuant des recherches sur les technologies correspondantes.
induction-matrix-2=Composants de matrice d'induction
induction-matrix-2-text=La matrice d'induction est composée de plusieurs éléments. Le [color=orange]noyau de la matrice d'induction[/color] [item=ei-induction-matrix-core] est le composant principal de la matrice. Lorsqu'il est connecté au réseau de circuits, le noyau émet la charge actuelle sur signal-C, la capacité totale sur signal-T et l'E/S maximale sur signal-M. Ces signaux ne sont produits que lorsque le noyau est réellement câblé et ils sont actualisés au plus une fois par seconde. Les [color=orange]bobines d'induction[/color] [item=ei-induction-matrix-basic-coil][item=ei-induction-matrix-advanced-coil][item=ei-induction-matrix-superior-coil] stockent l'énergie. Ils peuvent être améliorés et recevoir un bonus lorsqu'ils sont placés à proximité d'un [color=orange]solénoïde de matrice[/color] [item=ei-induction-matrix-basic-solenoid]. Ces solénoïdes sont plus efficaces lorsqu'ils sont placés en série, mais ne les surcharge pas. Les [color=orange]convertisseurs[/color] [item=ei-induction-matrix-basic-converter][item=ei-induction-matrix-advanced-converter][item=ei-induction-matrix-superior-converter] augmentent le volume d'énergie qui peut être transféré dans et hors de la matrice.

exotic-stabilizers=Stabilisateurs de matière exotique

black-hole=Générateur de trous noirs
black-hole-text=Le puissant [color=orange]générateur de trous noirs[/color] est une machine capable d'exploiter l'énergie de la matière elle-même. Construire cette machine et la rendre [color=green]pleinement opérationnelle[/color] permet de remporter la partie. Pour faire fonctionner ce réacteur, vous aurez besoin d'une bonne quantité de matériaux de construction, d'un approvisionnement régulier en matières consommables et de beaucoup d'énergie. Il faut donc envisager de disposer au préalable d'une bonne infrastructure de [color=orange]réacteurs à fusion[/color] ou de [color=orange]matrices à induction[/color] haut de gamme.
black-hole-2=Composants du réacteur
black-hole-2-text=La structure du générateur est composée de plusieurs éléments. Le [color=orange]générateur de trou noir[/color] [item=ei-black-hole] est le principal objet nécessaire. Une fois activé, il consomme tous les objets de son inventaire et les ajoute à sa [color=green]masse interne[/color]. La masse à l'intérieur du trou noir disparaît avec le temps. Ici, le type d'objet n'a pas d'importance, chaque objet produit le même ajout de masse. Les [color=orange]pylônes d'injection d'énergie[/color] [item=ei-energy-injector-pylon] permettent de maintenir actif le champ de confinement du trou noir. Chaque pylône consomme 5GW d'énergie pour être actif, mais les pylônes ne sont pas nécessaires lors de la phase de démarrage, car le trou noir est encore petit et peut être contenu par la cuve du réacteur elle-même. Les [color=orange]pylônes extracteurs d'énergie[/color] [item=ei-energy-extractor-pylon] peuvent extraire jusqu'à 100 GW par pylône du générateur. Ce n'est que dans la phase pleinement opérationnelle du trou noir que cela est possible.
black-hole-3=Étapes du trou noir
black-hole-3-text=La mise en service du réacteur nécessite différentes étapes. Dans l'état de démarrage, aucun pylône n'est nécessaire, seule une masse initiale de [color=blue]10x10³ kg[/color] doit être atteinte. Après avoir atteint une progression de 100 %, le générateur passe à l'étape suivante. Pour continuer à progresser, [color=blue]8 pylônes d'injection[/color] [item=ei-energy-injector-pylon] doivent être actifs à tout moment. L'appui sur le bouton d'expansion déclenche une augmentation du rayon du trou noir. Le réacteur doit fonctionner pendant plus de [color=blue]60s[/color] dans cet état pour atteindre sa phase pleinement opérationnelle. À partir de là, des [color=orange]pylônes d'extraction d'énergie[/color] [item=ei-energy-extractor-pylon] à portée peuvent extraire l'énergie de la machine et la fournir à votre réseau. Comme la production d'énergie est massive, le générateur devrait maintenant être pratiquement autosuffisant, n'ayant besoin que d'un apport constant de masse. 
nuclear-fission-and-fusion=Fission et fusion nucléaires
nuclear-fission-and-fusion-text=Exotic Industries introduit de nouvelles fonctionnalités pour l'énergie nucléaire. Ces fonctionnalités sont divisées en plusieurs sous-catégories. Vous pouvez les trouver dans le menu de gauche.
fission-reactors=Changements concernant la fission nucléaire
fission-reactors-text=L'énergie de fission nucléaire est différente dans ce mod. Le [color=orange]réacteur nucléaire[/color] [item=nuclear-reactor] ne reçoit plus de bonus de voisinage et a une production d'énergie plus importante. L'uranium est plus difficile à obtenir. Le recyclage des piles à combustible usagées permet de réutiliser les produits de fission dans de nouvelles piles à combustible pour augmenter l'efficacité. Les [color=brown]déchets nucléaires[/color] [item=ei-nuclear-waste] doivent être traités.
fission-reactors-2=Fission haute température
fission-reactors-2-text=Le [color=orange]réacteur nucléaire haute température[/color] [item=ei-high-temperature-reactor] est un nouveau réacteur à fission qui peut être utilisé pour produire encore plus d'énergie. Lorsqu'il est chauffé à sa température de fonctionnement et alimenté par de très grandes quantités d'eau et une barre de combustible, il produit de grandes quantités de vapeur plus efficacement que les échangeurs de chaleur. Il peut même utiliser le combustible [color=brown]thorium[/color] [item=ei-thorium-232-fuel], autrement non fissible.
fusion-power=Énergie de fusion
fusion-power-text=Le [color=orange]réacteur de fusion[/color] [item=ei-fusion-reactor] est une nouvelle machine qui peut être utilisée pour produire de grandes quantités d'énergie en fusionnant des atomes légers. Il est refroidi par un cycle de [color=orange]de refroidissement au plomb[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]. Cependant, ce réacteur est assez coûteux à construire et nécessite un apport constant de combustible. Au début, les meilleurs combustibles sont le [color=blue]lithium[/color] et le [color=blue]protium[/color]. Plus tard, on pourra également utiliser du [color=blue]deutérium[/color] et du [color=blue]tritium[/color] comme combustible, voire de l'[color=blue]hélium 3[/color].
fusion-power-2=Les neutrons et vous
fusion-power-2-text=Pour obtenir des combustibles de fusion améliorés, il est possible d'utiliser des [color=green]neutrons[/color]. Ils sont produits par des sources de neutrons de [color=green]fission[/color] et de [color=green]fusion[/color] nucléaires et doivent être capturés à l'aide de [color=orange]collecteurs de neutrons[/color] [item=ei-neutron-collector]. Selon l'intensité de la source de neutrons et la distance par rapport au collecteur, vous obtiendrez plus ou moins de neutrons

alien-text=L'ancienne civilisation qui a laissé les artefacts a également laissé une partie de ses données.
