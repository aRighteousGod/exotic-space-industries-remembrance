turrets=Emplacements défensifs
turrets-text=Remembrance élargit fortement la défense statique. L'arsenal va désormais des armes improvisées de très courte portée à l'artillerie à vapeur, aux armes à jet corrosif, aux grêles de balles entraînées électriquement et aux plateformes énergétiques de rang relique. Ces emplacements ne sont pas de simples variantes de la [item=gun-turret]tourelle mitrailleuse : chacun demande une logistique, une zone de tir et un soutien différents.\n\nLa plupart des ajouts balistiques continuent de progresser avec les recherches de dégâts de projectiles physiques. Les tourelles à jet suivent la branche de dégâts des flammes. Les plateformes reliques tardives exigent surtout une puissance extrême, des composants rares et un placement réfléchi.
turrets-2=Fusils à pompe et canons
turrets-text-2=[item=ei-shotgun-turret]La tourelle à pompe arrive à l'âge sombre après les tourelles mitrailleuses et Militaire. C'est une réponse de proximité pour tout ce qui perce le mur : portée 15, cadence lente, aucune demande électrique sophistiquée, et un châtiment brutal pour tout ce qui atteint réellement votre périmètre. À l'âge de l'électricité, elle évolue en [item=ei-auto-shotgun-turret]tourelle à pompe de combat, qui double la cadence, monte à 18 de portée, pivote bien plus vite et ajoute une consommation électrique permanente ainsi qu'un coût énergétique par tir pour maintenir un rideau de chevrotine sur les goulets d'étranglement.\n\nLa [item=ei-cannon-turret-mk1]tourelle canon est l'étape de siège de l'âge de la vapeur. Elle tire des [item=cannon-shell]obus à 25 de portée avec une zone morte de 8 cases, une rotation lente et un énorme impact par tir. Plus tard, deux MK1 et des composants plus lourds deviennent la [item=ei-cannon-turret]tourelle canon à double tube : plus robuste, plus rapide, assistée électriquement, et active à 30 de portée avec une zone morte de 10 cases afin d'effacer les cibles lourdes avant qu'elles n'atteignent le mur.
turrets-3=Acide et flammes
turrets-text-3=[item=ei-acidthrower-turret]L'acidthrower est le cousin corrosif de la tourelle lance-flammes. Il atteint 38 avec une portée minimale de 9 et accepte [fluid=sulfuric-acid]l'acide sulfurique, [fluid=ei-nitric-acid]l'acide nitrique, [fluid=ei-hydrofluoric-acid]l'acide fluorhydrique, et même la faible [fluid=ei-acidic-water]eau acide, chaque fluide ayant son propre multiplicateur de dégâts. C'est la réponse à jet pour les usines qui préfèrent armer la chimie plutôt que brûler du pétrole.\n\nLes [item=flamethrower-turret]tourelles lance-flammes vanille sont elles aussi retravaillées. EI les déplace à l'âge de la vapeur, les étend à la même bande d'engagement 38/9, les fait préparer plus tôt et augmente fortement leur consommation de fluide. La qualité du carburant compte désormais : le pétrole brut fonctionne toujours, mais huiles lourdes et légères, gaz de pétrole et [fluid=ei-kerosene]kérosène frappent de plus en plus fort, tandis que les distillats grossiers restent des alimentations de secours.
turrets-4=Miniguns et lasers
turrets-text-4=[item=ei-gatling-turret]La tourelle minigun est le tuyau à balles de l'âge de l'électricité. Elle combine un [item=ei-minigun]minigun monté à des entraînements électriques, ce qui lui donne 32 de portée, une portée minimale de 4, une excellente reacquisition de cibles et une cadence soutenue féroce. Le prix est exactement celui qu'on imagine : une consommation sans fin de [item=firearm-magazine]chargeurs, plus un soutien électrique permanent.\n\nLes [item=laser-turret]tourelles laser vanille restent disponibles, mais EI les transforme en investissement plus délibéré de l'âge de l'électricité. Leur portée et leur longueur de faisceau sont poussées à 30, leur technologie demande explicitement des [item=battery]batteries et des [item=advanced-circuit]circuits avancés, et leur recette est reconstruite autour de [item=ei-steel-beam]poutres d'acier, [item=steel-plate]plaques d'acier, [item=battery]batteries, [item=advanced-circuit]circuits avancés et [item=ei-energy-crystal]cristaux d'énergie. Elles deviennent une option plus propre côté logistique, mais ne sont plus une réponse universelle bon marché.
turrets-5=Plateformes reliques
turrets-text-5=[item=ei-plasma-turret]La tourelle plasma est le canon-forteresse de l'âge quantique. Elle est physiquement énorme, vide un réseau sérieux, et se construit avec des pièces de matrice d'induction ainsi que plusieurs [item=laser-turret]tourelles laser. En échange, elle lance des projectiles plasma à démarrage lent jusqu'à 200 de portée, garde un rayon de sécurité de 40 cases autour d'elle, et termine chaque impact par une énorme explosion qui ravage formations, fortifications et terrain.\n\nLa [item=zeus-wrath-zeus-turret]Poseidon Installation se place encore plus haut dans l'échelle des reliques via [technology=zeus-wrath-zeus-wrath]. EI la reconstruit en arme stratégique : 350 de portée, 70 de portée minimale, 1 GJ par tir, un stockage énergétique énorme, et des anneaux d'explosion plasma intérieurs et extérieurs. Ce n'est plus une tourelle de périmètre, c'est une réponse fixe aux cibles dont vous avez décidé qu'elles devaient cesser d'exister.
