# PAGES
welcome=Bienvenue sur Exotic Industries !
welcome-text=Voici la page d'information. Vous y trouverez des informations sur le mod, ses fonctionnalités et ses mécanismes. De plus, de nouvelles découvertes peuvent entraîner l'apparition de nouveaux chapitres, alors n'hésitez pas à le consulter de temps en temps. Si vous avez des questions ou des problèmes, n'hésitez pas à les poser sur le serveur Discord du mod. Vous trouverez le lien vers le serveur dans la description du mod sur le Portail des mods.
welcome-text-2=De nombreuses nouvelles machines, chaînes de production et fonctionnalités uniques vous attendent dans ce mod, certaines faciles et d'autres plus difficiles. Ne manquez pas de les explorer ! 
game-related=Informations relatives au jeu
game-related-text=Cette section contient des informations sur les fonctionnalités et les mécanismes de jeu avec ce mod. Elle est divisée en plusieurs sous-catégories. Vous pouvez les trouver dans le menu à gauche.
overall=Informations générales
overall-text=Exotic Industries est un mod de refonte, qui influence/révise complètement presque tous les aspects de la version classique de Factorio. Naturellement, Exotic Industries n'a pas d'intégration native pour d'autres gros mods comme Krastorio 2 ou SE. Les mods recommandés, qui sont listés dans le modpack officiel, viennent avec une intégration native pour Exotic Industries. Pour une expérience optimale, il est recommandé d'utiliser ces mods avec les mods de qualité de vie de votre choix. N'oubliez pas de vérifier les paramètres du mod avant de commencer une nouvelle partie, car certains aspects importants du mod peuvent être réglés à l'aide de ces paramètres.
biters=Biters et ennemis
biters-text=Les ennemis explosifs, froids, toxiques, armurés, arachnides et électriques sont couverts par une échelle dédiée de difficulté, plutôt que par une réécriture de la génération. Sur Nauvis, [font=default-bold]ei-default[/font] reste séparé de cette échelle, et ce sont les prototypes hostiles déjà présents dans les dépendances qui sont ajustés. Ouvrez la page de difficulté ennemie pour le détail complet.
enemy-difficulty=L'Échelle de Pression
enemy-difficulty-text=Cette page consigne la dernière main posée sur la pile hostile. Elle ne refait pas [font=default-bold]ei-default[/font] et n'invente pas une seconde écologie. Elle courbe la chair déjà présente dans l'essaim de dépendances: biters, spitters, vers, spawners, lignées armurées, froides, toxiques et explosives, mères, arachnides, ennemis électriques, et structures infectées telles que [entity=tb_infected_ship_boss].
enemy-difficulty-2=Comment Lire Le Tableau
enemy-difficulty-text-2=Chaque pourcentage est mesuré par rapport à [font=default-bold]Original[/font]. [font=default-bold]100%[/font] conserve la valeur du mod de dépendance. Au-dessus de 100%, la statistique augmente. En dessous de 100%, elle diminue. [font=default-bold]L’intervalle d’attaque[/font] et [font=default-bold]l’intervalle d’apparition[/font] fonctionnent à l’inverse: plus la valeur est basse, plus les attaques ou apparitions sont rapides; plus elle est haute, plus la pression ralentit. Les valeurs sont arrondies pour rester lisibles.
enemy-difficulty-3=Ce Que L’Échelle Modifie
enemy-difficulty-text-3=L’échelle ne change que des statistiques. Elle modifie la santé des unités ennemies, les soins positifs, la santé des ennemis cuirassés, leurs résistances positives, les dégâts d’attaque, la portée d’attaque, la vitesse de déplacement, l’intervalle d’attaque, la santé des nids, les soins des nids, l’intervalle d’apparition et les limites d’unités proches. Elle ne réécrit pas les poids d’évolution, l’absorption de pollution, les seuils de ralliement, les result_units, ni les projectiles, rayons, nuages, flux et munitions partagés sous les armes hostiles. Les pentapodes, demolishers, nids de Gleba, robots du joueur et roboports restent hors de ce cadre.
enemy-difficulty-4=Overrides Apex
enemy-difficulty-text-4=Merciful et Impossible appliquent aussi des overrides apex supplémentaires aux léviathans, aux mères, aux chaînes de boss MAF, aux chaînes de boss électriques marcheurs et à [entity=tb_infected_ship_boss]. L’exception royale, [entity=arachnid-biter-royalwarrior-unit], conserve les valeurs normales de santé d’unité pendant que ses dégâts et sa vitesse de déplacement sont ajustés séparément. En [font=default-bold]Impossible[/font], la grâce de Nauvis est désactivée même si la bascule de démarrage est active.
enemy-difficulty-5=Riposte Impossible
enemy-difficulty-text-5=En [font=default-bold]Impossible[/font], un lancement depuis une zone hostile peut aussi rallier les ennemis déjà présents en une attaque contre le silo. La riposte tire généralement une bande locale depuis environ [font=default-bold]100 à 250 tuiles[/font], souvent [font=default-bold]8 à 30 unités[/font], avec des réponses plus dures pour les lancements les plus lourds. Si la surface de lancement n’a aucune écologie ennemie locale, aucun groupe de riposte n’est créé.
enemy-difficulty-6=Limite
enemy-difficulty-text-6=[font=default-bold]Original[/font] utilise les valeurs de dépendance sans modification EI des ennemis. [font=default-bold]Tempered[/font] est le réglage par défaut. Au-dessus, la pression augmente. Au-dessous, elle baisse sans changer le preset de carte lui-même.
