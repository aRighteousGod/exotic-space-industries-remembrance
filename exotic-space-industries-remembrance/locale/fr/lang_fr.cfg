[entity-description]
ei-auric-fumarole=Un évent de Vulcanus qui transporte déjà l'or dissous dans une vapeur et une saumure surchauffées. Un noyau de précipitation en carbure de tungstène réveille la gorge, retient les scories, et laisse tomber le condensat aurique avant que la fissure ne se referme.
ei-cargo-bot=Un robot logistique lent capable de transporter beaucoup d'objets.
ei-construction-bot=Robot de construction rapide.
ei-advanced-logistic-bot=Robot logistique très avancé. Rapide, à longue portée et capable de transporter plus d'objets.
ei-advanced-construction-bot=Robot logistique très avancé. Rapide, à longue portée et capable de transporter plus d'objets.
nuclear-reactor=Utilise des piles à combustible à l'uranium pour produire de la chaleur. La production de chaleur n'augmente PAS lorsque le réacteur est construit à côté d'autres réacteurs.
ei-crystal-accumulator=Le cristal rayonne de l'énergie. Il semble être instable pendant de longues périodes de temps, sa récupération entraînera un bris de l'appareil. 
ei-crystal-accumulator-gaia=Le cristal rayonne de l'énergie. Il semble stable pendant de longues périodes.
ei_charger=Charge les trains électromagnétiques à portée. Chaque charge consomme de l'énergie. Peut être amélioré grâce à des recherches. Consomme 10 MW d'énergie en veille. Nécessite 250 W par rail à portée.
ei_em-locomotive=Locomotive électromagnétique. Plus rapide et plus efficace que les locomotives ordinaires. Nécessite un chargeur en état de marche pour fonctionner.
ei_em-cargo-wagon=Wagon électromagnétique. Dispose de 60 emplacements d'objets.
ei_em-fluid-wagon=Wagon-citerne électromagnétique. Peut transporter 50k de fluide.

[fluid-description]
ei-auric-vapor=Vapeur surchauffée chargée d'or dissous et de traces minérales. Filtrée à travers un noyau de précipitation en carbure, elle rend de la vapeur très chaude et une scorie aurique riche en or.
ei-auric-condensate=Vapeur surchauffée chargée d'or dissous et de traces minérales. Une fois refroidie, filtrée et disciplinée, elle rend de la vapeur très chaude et le résidu précieux que la croûte cachait depuis le début.

