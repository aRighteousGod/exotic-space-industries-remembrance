rocket-ammo-schema=Schéma des munitions de fusée
rocket-ammo-schema-text=Les munitions de fusée se construisent par couches : [item=ei-rocket-airframe]cellule, [item=ei-rocket-motor-basic]moteur, [item=ei-rocket-warhead-impact]ogive, puis l'obus fini. La cellule tient la coque, le moteur fixe la portée, et l'ogive choisit la famille de dégâts. Doeworks suit la même logique, en plus lourd et plus brutal.
rocket-ammo-schema-2=Branches de charge
rocket-ammo-schema-text-2=La ligne de base reste simple : impact pour le travail léger, explosif pour une brèche plus propre. Les charges corrosives misent sur l'acide et la perte de structure. Les charges cryo troquent la force brute contre le contrôle par le gel. La ligne atomique garde deux montages de fin de partie, mais les deux mènent toujours à la [item=atomic-bomb]bombe atomique.
rocket-ammo-schema-3=Familles d'effets
rocket-ammo-schema-text-3=Chaque famille reçoit sa propre explosion, sa propre fumée et sa propre vignette afin que le blast reste lisible en mouvement au lieu de se fondre dans un flash générique.
rocket-ammo-schema-4=Ligne atomique Doeworks
rocket-ammo-schema-text-4=Doeworks peut aussi charger des obus atomiques U-235 ou au plutonium, en version unitaire ou en caisse. Les salves en caisse sont pratiquement sacrificielles : la filiere fissile reste separee pour la production et les verrous technologiques, mais la famille d'impact est commune, et un tir trop proche peut ouvrir la breche sous la tourelle elle-meme.
