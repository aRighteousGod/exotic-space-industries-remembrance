[technology-description]
ei-auric-precipitation=Débloque la chaîne des fumaroles aurique de Vulcanus. Le carbure de tungstène est façonné en noyau de précipitation sacrificiel, la vapeur réveille l'évent, et le condensat aurique est concentré en or utilisable. Rendement élevé, terrain dangereux, fenêtres finies.
ei-dark-age=La première ère du mod Exotic Industries. Introduction de la première automatisation basée sur les systèmes thermiques.
ei-steam-age=La deuxième ère du mod Exotic Industries. Utilisez des machines à vapeur pour automatiser votre base et progresser.
ei-electricity-age=La troisième ère du mod Exotic Industries. Exploitez la puissance de l'électricité et lancez-vous dans des procédés chimiques plus avancés.
ei-computer-age=La quatrième ère du mod Exotic Industries. Les systèmes informatiques vous permettront d'améliorer l'efficacité de votre usine et d'automatiser des tâches plus complexes.
ei-quantum-age=La cinquième ère du mod Exotic Industries. Fusion et machines de haute technologie vous attendent !
ei-exotic-age=La sixième et dernière ère du mod Exotic Industries. Gagnez la partie en terminant la construction d'une superstructure.
ei-steam-assember=Automatisation de base à partir de la vapeur.
ei-steam-oil-processing=Se lancer dans le raffinage du pétrole et l'utiliser pour la chimie de base ou la production de carburants.
ei-electricity-power=Produisez de l'électricité de base et utilisez-la pour alimenter vos machines.
ei-destill-tower=Décomposer le pétrole en ses composants par distillation.
ei-computer-core=S'initier à l'automatisation informatique de base.
ei-big-lab=Des laboratoires de pointe sont nécessaires pour mener des recherches sur des technologies plus avancées.
ei-induction-matrix=La matrice d'induction est une multistructure de stockage massif d'énergie. Pour plus d'informations, consultez l'InformaTron.
ei-neodym-refining=Le minerai de néodyme est transformé en lingots de néodyme. Celles-ci sont essentielles pour les machines de haute technologie.
ei-deep-mining=Exploitez les gisements en profondeur et utilisez-les pour obtenir plus de ressources ainsi que des ressources que l'on ne trouve que dans les couches profondes de Nauvis.
ei-moon-exploration=Obtenez des poissons de lune et lancez-vous dans l'exploration spatiale.
ei-quantum-computer=Se lancer dans l'automatisation basée sur l'ordinateur quantique.
ei-fluid-boiler=Consomme des [color=orange]fluides inflammables[/color] pour produire de la vapeur. Les [color=orange]fluides inflammables[/color] sont le pétrole, les produits pétroliers et, d'une manière générale, les fluides ayant une valeur de combustible.
ei-small-inserter=Un bras 2x2 avec des emplacements de filtre. Il peut déplacer des piles entières d'objets à la fois.
ei-big-inserter=Un bras 2x2 avec des emplacements de filtre. Il peut déplacer des piles entières d'objets à la fois et à grande vitesse.
ei-rocket-silo=Permet de lancer une fusée dans l'espace.
ei-crystal-accumulator-repair=
ei-bio-chamber=Cultivez des graines extraterrestres et utilisez-les pour produire des plaques bio-améliorées. Une première quantité de graines peut être trouvée en tuant des fleurs extraterrestres. \n\n
ei-gate=Voyagez vers de nouvelles contrées ! \n\n
ei-bio-energy-crystal= 
ei-bio-insulated-wire= 
ei-bio-high-energy-crystal= 
ei-bio-electronic-parts= 
ei-bio-hydrofluoric-acid= 
ei-bio-nitric-acid= 
