menu_auric_fumarole=Fumaroles aurifères
title_auric_fumarole=Fumaroles aurifères
auric-fumarole=Fumarole de précipitation aurique
auric-fumarole-text=Vulcanus se souvient de l'endroit où la plaie peut se rouvrir ; les règles ci-dessous sont littérales, non symboliques.\n\n[font=default-bold]Où elles peuvent apparaître :[/font] Les fumaroles auriques sont propres à Vulcanus. Elles ne peuvent apparaître que dans les chunks de danger extérieurs, uniquement sur les sols volcaniques non-lave, et seulement lorsque leur centre se trouve à au moins 64 tuiles d'une autre fumarole aurique et à 32 tuiles d'un geyser d'acide sulfurique.\n\n[font=default-bold]Première apparition :[/font] Quand un chunk de danger éligible est généré ou rempli a posteriori, il reçoit une tentative d'éruption immédiate de 12 %. Si cette tentative ne produit pas de fumarole, le chunk entre dans le registre dormant.\n\n[font=default-bold]Rendement et durée de vie :[/font] Chaque fumarole apparaît avec un rendement de 4000 à 8000. Si personne n'y puise, elle se referme d'elle-même au bout de 45 minutes. Une fois exploitée, elle reste en place jusqu'à épuisement. Après fermeture ou épuisement, le chunk refroidit pendant environ 60 minutes, avec une petite gigue déterministe, puis redevient éligible comme dormant.
auric-fumarole-2=Discipline d'apparition et rescannage
auric-fumarole-text-2=[font=default-bold]Calendrier dormant :[/font] Toutes les 30 secondes, le script revérifie jusqu'à 6 chunks dormants à l'échelle globale. Un chunk traité lance une chance d'éruption de 0,25 %.\n\n[font=default-bold]Suppression locale :[/font] Une fumarole aurique active à moins de 6 chunks réduit cette chance dormante à 35 % de la normale. Deux fumaroles actives ou plus à proximité suppriment entièrement l'éruption dormante jusqu'à ce que la zone se refroidisse.\n\n[font=default-bold]Règle de maintien en vie :[/font] Si Vulcanus passe 10 minutes sans aucune fumarole aurique active, le planificateur commence à forcer jusqu'à 2 tentatives de maintien dormant par impulsion, jusqu'à ce qu'un évent revienne.\n\n[font=default-bold]Centres bloqués et rescannage :[/font] Les apparitions de remplissage et les apparitions dormantes refusent presque toujours les centres occupés ; seule une chance de percée de 2 % détruira les structures du joueur qui se chevauchent et ouvrira le passage. La commande /ei-auric-fumarole-rescan fonctionne uniquement sur Vulcanus et réinscrit les chunks déjà générés pour une revue dormant/remplissage.
