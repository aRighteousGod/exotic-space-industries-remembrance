title_railgun_cooling=Refroidissement du railgun
railgun-cooling=Refroidissement du railgun
railgun-cooling-text=L'ensemble du railgun est refroidi au niveau de l'arme, pas par une conversion de munitions en projectile alimenté séparément par un fluide. Le fluorokétone froid est consommé au niveau de la tourelle, le fluorokétone chaud doit être récupéré, et l'arme se bloque si la boucle de refroidissement ne suit plus.\n\nC'est volontaire. L'arme chauffe, le canon garde une courte lueur résiduelle, et la ligne de fluide est ce qui rend le tir soutenu possible.
railgun-cooling-2=Boucle de refroidissement et recette de secours
railgun-cooling-text-2=Le fonctionnement normal utilise du fluorokétone froid à la tourelle. Quand cette boucle est à sec, le railgun accumule une dette thermique, se désactive et passe en récupération au lieu de faire comme si le tir était gratuit.\n\nUne recette de repli à base de glace est aussi disponible pour la chaîne de refroidissement, afin d'avoir une autre manière de produire du fluorokétone froid lorsque l'azote liquide n'est pas la seule option. La voie à la glace échange cela contre un peu de vapeur, pas contre du froid gratuit.
railgun-cooling-3=Comportement selon la surface
railgun-cooling-text-3=Les surfaces ne refroidissent pas toutes de la même façon. Les plateformes spatiales dissipent la chaleur lentement, tandis que les mondes atmosphériques la perdent plus vite. Aquilo récupère le plus vite par dissipation naturelle, Vulcanus reste chaud plus longtemps, et les surfaces minces ou pauvres en pollution se situent entre les deux. Le même railgun se comporte donc très différemment selon l'endroit où il est fixé.
railgun-cooling-4=Récupération et état
railgun-cooling-text-4=Les railguns sains ne restent pas dans une file de traitement permanente. Seuls les canons en surchauffe ou bloqués passent en récupération, et ils restent désactivés jusqu'à ce que la dette thermique soit effacée et que la sortie de fluide chaud puisse à nouveau absorber le fluorokétone usé.\n\nL'état est donc parlant : vert pour prêt, jaune pour récupération ou sortie bloquée, rouge pour matériel de refroidissement manquant ou surchauffe dure.
