menu_auric_fumarole=Fumaroles aurifères
title_auric_fumarole=Fumaroles aurifères
auric-fumarole=Fumarole de précipitation aurique
auric-fumarole-text=Vulcanus se souvient de l'endroit ou la plaie peut se rouvrir ; les regles ci-dessous sont litterales, non symboliques.\n\n[font=default-bold]Ou elles peuvent apparaitre :[/font] Les fumaroles auriques n'existent que sur Vulcanus. Elles ne peuvent apparaitre que sur un sol volcanique non-lave. Les chunks situes a moins de 3 chunks de l'origine de la surface ont zero chance. Au-dela de cette zone morte, la chance augmente progressivement et atteint son poids maximal a 32 chunks de l'origine.\n\n[font=default-bold]Premiere apparition :[/font] Les chunks externes fraichement generes ne font qu'une legere tentative de semis immediat, modulee par la distance, au lieu de deposer tout un champ d'un coup. Si ce semis leger echoue, le chunk entre dans le registre dormant au lieu d'etre oublie. La relecture et le backfill des anciennes sauvegardes reconstruisent l'eligibilite dormante des chunks Vulcanus generes ; ils ne forcent pas une nouvelle vague immediate.\n\n[font=default-bold]Rendement et duree de vie :[/font] Chaque fumarole apparait avec un rendement de 4000 a 8000. Si personne n'y puise, elle se referme d'elle-meme apres une fenetre deterministe de 35 a 65 minutes. Une fois exploitee, elle reste en place jusqu'a epuisement. Les sites fermes ou epuises refroidissent environ 60 minutes, avec une petite gigue deterministe, puis peuvent revenir par le systeme dormant.
auric-fumarole-2=Discipline d'apparition et rescannage
auric-fumarole-text-2=[font=default-bold]Calendrier dormant :[/font] Toutes les 30 secondes, le script reverifie jusqu'a 6 chunks dormants a l'echelle globale. Les chunks dormants ordinaires gardent la chance d'eruption de base de 0,25 %, puis appliquent le poids de distance, la modulation sulfurique, la suppression locale et un modificateur de remplissage par bande de zone generee.\n\n[font=default-bold]Regulation par bandes :[/font] Les chunks Vulcanus eligibles deja generes sont suivis par bandes de distance : 3-6, 6-16, 16-24, 24-32 et 32+ chunks depuis l'origine. Les bandes sous-remplies recoivent une pression de recuperation dormante plus forte, les bandes sur-remplies se refroidissent, et la recuperation vise d'abord les bandes les plus faibles pour qu'une seule region exploree ne monopolise pas les futurs events.\n\n[font=default-bold]Suppression locale et secours :[/font] Des fumaroles auriques actives proches, dans un rayon de 6 chunks, reduisent la chance dormante selon la proximite au lieu de l'arreter net par simple comptage. Les fumaroles proches suppressent plus fort que celles du bord de zone, et plusieurs fumaroles proches additionnent leur pression. Si Vulcanus reste sous 2 fumaroles auriques actives pendant 5 minutes, l'ancien chemin de maintien en vie force encore jusqu'a 2 tentatives de secours par impulsion.\n\n[font=default-bold]Placement et rescannage :[/font] Une fumarole n'a pas besoin d'atterrir au centre exact du chunk ; le placement peut varier dans le chunk et essaie jusqu'a 24 positions candidates. Les fumaroles auriques gardent 64 tuiles d'ecart entre elles. Les geysers d'acide sulfurique ne bloquent qu'un chevauchement tres proche, a environ 16 tuiles ; ils ne creent pas une zone d'exclusion generale de 32 tuiles. La commande /ei-auric-fumarole-rescan fonctionne uniquement sur Vulcanus et reconstruit l'eligibilite dormante des chunks Vulcanus generes au lieu de creer une nouvelle inondation immediate.
