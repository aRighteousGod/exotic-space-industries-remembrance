[mod-setting-description]
ei-em_updater_que=Dessiner un indicateur visuel entre ou au-dessus des trains et des chargeurs électromagnétiques lorsqu'un transfert d'énergie se produit.
ei-em_updater_que_width=Permet de régler le rayon des anneaux affichés
ei-em_updater_que_transparency=Permet de régler la transparence des anneaux affichés. Plage 1->100 (Opaque)
ei-em_updater_que_timetolive=Ajuster la durée jusqu'à ce qu'un anneau disparaisse
ei-em_train_glow=Activer l'effet de lueur du train électromagnétique lors du transfert d'électricité
ei-em_train_glow_timetolive=Nombre de ticks jusqu'à ce que la lueur du train s'éteigne. Peut s'empiler. Augmentez les performances en diminuant ce nombre. 60 ticks correspondent à 1 seconde.
ei-em_charger_glow=Activer l'effet de lueur du chargeur électromagnétique lors du transfert d'électricité
ei-em_charger_glow_timetolive=Nombre de ticks jusqu'à ce que la lueur du chargeur s'éteigne. Peut s'empiler. Augmentez les performances en diminuant ce nombre. 60 ticks correspondent à 1 seconde.
ei-max_updates_per_tick=Nombre de mises à jour par type d'entité exécutées par tick
ei_ticks_per_full_update=Ajuster le nombre de ticks pendant lesquels toutes les entités IE sont mises à jour.
ei-loader-prototype-complexity=Activer/désactiver les recettes complexes du chargeur, si elles sont activées, le chargeur express peut filtrer les gains et le chargeur Néo peut empiler.
ei-rocket-lift-capacity-buff=Multiplie la capacité de la fusée et de l'aire d'atterrissage par x. LANCEMENT DE FUSÉES VIA LA LOGIQUE RECOMMANDÉS
ei-beacon-overload=Comportement prévu. Fixe un plafond au nombre de diffuseurs pouvant affecter un bâtiment individuel, à l'instar de Space Exploration.
ei-ash=La combustion de carburants chimiques produit des cendres qui peuvent être retraitées, mais qui doivent être gérées.
ei-slag=Les fonderies autres que le chauffage au plasma produisent des scories qui peuvent être retraitées mais qui doivent être gérées.
ei_fueler_max_updates_per_tick=Nombre de mises à jour par tick. Les tours de ravitaillement sont mises à jour dans une boucle cyclique. Augmenter ce nombre signifie que plus de tours de ravitaillement seront mises à jour en moins de temps. Cependant, les performances diminueront. Si vous n'utilisez les tours que pour ravitailler des cibles stationnaires, le paramètre par défaut est suffisant.
ei-fueler_range=Une portée plus élevée permet de trouver des cibles plus éloignées. Cependant, les performances diminuent lorsque les tours doivent balayer des zones plus étendues.

ei-gate-difficulty=Ajuste l'accordage et la progression de la porte. Recovered conserve la porte actuelle. Attuned la repousse vers la fin de l'âge alien. Resonant la repousse vers la fin de l'âge quantique. Paradox la repousse vers l'âge exotique. Prévu pour les nouvelles parties ou avant de rechercher la porte.
ei-nauvis-pressure-grace=Avant l'âge de l'électricité, ralentit temporairement l'évolution ennemie excessive sur Nauvis. Une vérification a lieu toutes les 5 minutes et ne ramène l'évolution que vers les cibles des premiers âges; cela ne réduit pas la pollution, ne supprime pas les nids, et n'empêche pas l'échec. Impossible désactive cette grâce même si l'option est activée.
ei-enemy-difficulty=Choisit l'échelle de statistiques ennemies utilisée par Exotic Industries: Remembrance. Gentle jusqu'à Nightmare ne modifient que le combat et la reproduction des ennemis. Original laisse tout à 1.0. Merciful et Impossible appliquent aussi quelques exceptions apex. Impossible désactive aussi la grâce de Nauvis et transforme la pollution des lancements de fusées en riposte sur les surfaces déjà hostiles.
ei-gate-notifications=Afficher les notifications de chat de la porte, comme les mises à jour de destination et les avertissements de faible puissance.
ei-black-hole-notifications=Afficher les notifications de chat du trou noir, comme les avertissements de défaillance de confinement.
ei-matter-machine-notifications=Afficher les notifications de chat des machines à matière, comme les avertissements de maintenance, d'instabilité ou de manque d'alimentation.
ei-insulated-pipe-notifications=Afficher les notifications de chat des tuyaux isolés, comme les avertissements de dégazage ou d'éclatement.
