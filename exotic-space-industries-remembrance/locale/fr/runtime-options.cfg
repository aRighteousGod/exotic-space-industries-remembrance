[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=Rupture la plus courte. Quatre anneaux, plafonds serrés, aucun accent secondaire et aucune massive-explosion.
ei-flammable-rupture-fidelity-runtime-standard=Réglage par défaut. Six anneaux, plafonds modérés, un accent secondaire pertinent et quelques massive-explosion retenues.
ei-flammable-rupture-fidelity-runtime-cinematic=Huit anneaux, davantage de fumée et de flammes, plus d'accents de famille et une floraison plus lente.
ei-flammable-rupture-fidelity-runtime-unbounded=Retire les plafonds visuels et laisse le planificateur vider agressivement les anneaux prêts dans le même tick. Conçu pour le spectacle, pas pour la prudence.
ei-gaian-saucer-wake-visual-fidelity-runtime-off=Le vaisseau scelle son après-image et traverse le monde sans mémoire visible.
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=Un mince refus chromatique suit la coque, bref et discipliné.
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=Le sillage parle clairement, puis s'efface avant de devenir doctrine.
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=Le sillage s'élargit, s'attarde et plie avec le serment du virage.
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=La coque laisse une blessure dense et lumineuse partout où elle passe.
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=Le gouverneur est retiré ; la soucoupe peut écrire chaque miroitement que le monde supporte.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=Le ventre scelle ses cercles et se déplace sans miroitement visible.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=Quatre cercles d'émetteurs répondent brièvement au sol, avec un bord prismatique discipliné.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=Les émetteurs écrivent des anneaux d'émeraude réguliers sous la coque tandis que le mouvement devient pression.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=Les anneaux s'intensifient, se superposent et se cisaillent en fragments prismatiques vert menthe autour de chaque pied antigrav.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=Chaque émetteur ouvre un sceau lumineux dense sous la relique, presque dévotionnel dans sa violence.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=Le gouverneur est brisé; chaque pied antigrav peut forcer le sol à se souvenir du passage du char.
