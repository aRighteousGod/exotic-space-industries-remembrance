[mod-setting-name]
ei-arc-furnace-light-flicker-preset=Scintillement lumineux du four à arc

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=Ne modifie que les lumières actives du four à arc. Scintillement original garde l'arc nerveux actuel. Scintillement réduit et Pulsation douce apaisent l'effet. Lueur statique conserve une lumière stable. Désactivé retire les lumières actives tout en gardant l'animation du four et le halo rouge du condensateur au repos.

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=Désactivé
ei-arc-furnace-light-flicker-preset-static=Lueur statique
ei-arc-furnace-light-flicker-preset-soft=Pulsation douce
ei-arc-furnace-light-flicker-preset-reduced=Scintillement réduit
ei-arc-furnace-light-flicker-preset-original=Scintillement original

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=Retire les lumières actives. L'animation du four et le halo rouge du condensateur au repos restent visibles.
ei-arc-furnace-light-flicker-preset-static=Garde une lueur active stable, sans scintillement.
ei-arc-furnace-light-flicker-preset-soft=Garde une pulsation faible et lente pour calmer les ateliers de fours.
ei-arc-furnace-light-flicker-preset-reduced=Garde les couleurs superposées de l'arc avec un scintillement plus lent et plus resserré.
ei-arc-furnace-light-flicker-preset-original=Préserve l'éclairage nerveux actuel du four à arc.
