[technology-description]
tl-basic-tesla-coils-technology=Une bobine Tesla est un transformateur résonant modifié pour projeter des décharges électriques à fort courant sur les ennemis proches. Ses dégâts directs restent modestes, mais elle peut affecter plusieurs cibles à la fois.
tl-advanced-tesla-coils-technology=Une version nettement améliorée de la bobine Tesla. Sa portée est plus grande, sa puissance est beaucoup plus élevée et son blindage la rend nettement plus survivable.
tl-tesla-tank-technology=Une variante de char meurtrière équipée de deux bobines Tesla avancées de taille moyenne. Les bobines Tesla portatives fournissent la poussée d'énergie nécessaire pour déclencher le tir simultané des deux armes.
ei-tesla-weapons=Technologie d'arc rétroconçue récupérée dans les coffres de recherche fulgorans d'avant l'Effondrement. Bien que les principes d'origine ne soient encore compris qu'en partie, les ingénieurs ont reconstruit une imitation fonctionnelle capable de projeter des arcs électriques stabilisés vers des cibles hostiles. Sa puissance, son rendement et ses schémas de décharge restent inférieurs aux véritables conceptions fulgoranes, mais dépassent largement les armes électromagnétiques conventionnelles. Le perfectionnement supplémentaire restera limité tant que les schémas fulgorans authentiques n'auront pas été déchiffrés.
tl-tesla-ammo-upgrade-technology=Les progrès de la bobine Tesla portative ont révélé des faiblesses de conception dans la structure de base de la bobine Tesla. En supprimant ces failles, on obtient des bobines plus efficaces et une amélioration plus large de leurs capacités globales.
tl-tesla-coil-damage-technology=Les dégâts effectifs de l'arc de foudre d'une bobine Tesla peuvent être augmentés en installant des condensateurs plus puissants et en introduisant une légère oscillation dans la fréquence du courant.
tl-tesla-coil-shooting-speed=Les progrès récents de l'efficacité des batteries peuvent être appliqués aux conceptions de bobines Tesla afin qu'elles atteignent leur capacité critique plus rapidement et améliorent ainsi leur cadence de tir.
tl-flames-explosion-technology=Tant d'énergie traverse les décharges des bobines Tesla qu'elles peuvent enflammer l'air lui-même. La réaction en chaîne, brève, prend la forme d'une violente déflagration de feu.\n\nChaque niveau d'« Éruption » augmente la zone d'effet de l'explosion.\n\nDégâts : 60 % des dégâts de la tourelle.
tl-flames-count-technology=Quand un sol sec et des particules de poussière s'embrasent sous l'effet d'un courant électrique extrême, le résultat est une réaction de combustion étonnamment violente. Les flammes ne durent que quelques secondes, mais elles dégagent une chaleur dangereuse et réduisent tout en cendres.\n\nChaque niveau de « Feu éclair » augmente le nombre de flammes générées et leurs dégâts par seconde.
tl-flames-probability-technology=Des niveaux extrêmes d'énergie concentrée peuvent enflammer la végétation au sol, les particules de poussière ou même l'air lui-même.\n\nChaque niveau de « Combustion » augmente la probabilité d'enflammer la cible de la bobine Tesla et ses alentours immédiats.
tl-single-zap-count-technology=Quand une créature est frappée par la bobine Tesla avancée, elle peut absorber une grande quantité d'énergie statique. Cette surcharge peut détruire l'hôte avec violence. Si une partie de la charge reste après la destruction de l'hôte, elle jaillit vers la résistance la plus proche. Ce phénomène est appelé un éclair de décharge.\n\nChaque niveau de « Décharge » augmente le nombre d'éclairs de décharge libérés lorsqu'un ennemi est tué par la tourelle.
tl-single-zap-damage-technology=Quand une charge électrique subsiste après la destruction d'une cible, elle devient un éclair de décharge. Cet éclair ne transporte qu'une partie de la charge initiale, mais l'énergie restante peut être amplifiée en ajustant finement le niveau de résonance global de la bobine Tesla.\n\nChaque niveau de « Foudre lourde » augmente les dégâts infligés par les éclairs de décharge.
tl-single-zap-probability-technology=Les bobines Tesla avancées conduisent une quantité inimaginable d'énergie électrique. Si la cible ne peut pas contenir ce courant, il déborde à travers les molécules d'air ionisées sous forme d'arcs individuels qui électrocutent les entités proches.\n\nChaque niveau de « Surcharge » augmente la probabilité de voir apparaître des arcs supplémentaires chaque fois qu'une bobine Tesla avancée tue un ennemi.
tl-multi-zap-range-technology=Des courants plus élevés dans les bobines augmentent le nombre de particules ionisées dans le champ statique environnant. Il devient alors plus facile pour la charge de traverser l'air et d'atteindre des cibles plus lointaines.\n\nChaque niveau d'« Ionisation » augmente la portée effective de propagation de la charge.
tl-multi-zap-damage-technology=En ajustant avec précision la longueur d'onde de l'énergie concentrée émise, on peut former des arcs de foudre plus stables et plus destructeurs lorsque la charge se propage dans le champ statique.\n\nChaque niveau de « Foudre » augmente les dégâts des charges propagées.
tl-multi-zap-probability-technology=L'utilisation constante de la bobine Tesla remplit ses environs de particules ionisées. Ces particules permettent à la charge canalisée de dépasser sa cible initiale et de bondir vers des objets proches.\n\nChaque niveau de « Champ statique » augmente la probabilité que la charge se propage à chaque ennemi voisin.
tl-slowdown-duration-technology=Des courants d'énergie plus élevés produisent des effets plus puissants qui persistent plus longtemps dans l'entité touchée.\n\nChaque niveau de « Persistance » augmente la durée des effets d'« Électrochoc ».
tl-slowdown-multiplier-technology=Des niveaux d'énergie précis combinés à de hautes fréquences peuvent provoquer des spasmes musculaires qui entravent sérieusement le mouvement.\n\nChaque niveau d'« Étourdissement » augmente la force de l'« Électrochoc » et ralentit davantage la cible.
tl-slowdown-probability-technology=Le contact direct avec un courant électrique peut provoquer des effets physiologiques et neurologiques tels que spasmes musculaires et paralysie.\n\nDes niveaux plus élevés d'« Électrochoc » rendent ces effets plus probables à chaque attaque.
tl-volatility-modulation-technology=L'ionisation est une technique courante pour accroître l'efficacité des systèmes militaires fondés sur le courant électrique. Lorsque les deux bobines sont ionisées avec des fréquences alternées, un motif synergique apparaît dans le profil énergétique. Cet effet, appelé bionisation, élargit considérablement l'enveloppe de volatilité du courant concerné.\n\nChaque niveau de « Bionisation » abaisse le minimum de dégâts possible tout en augmentant fortement le maximum possible.
tl-volatility-probability-technology=La nature volatile du courant à double bobine est maximisée grâce à un ajusteur d'amplitude intégré. En pratique, les éclairs générés accumulent assez d'énergie pour désintégrer complètement toute créature plus petite qu'un appartement de taille moyenne.\n\nChaque niveau de « Vaporisation » augmente la probabilité de tuer instantanément la cible. Les cibles avec plus de 5000 points de vie sont grièvement blessées au lieu d'être tuées.
ei-waveform-harmonics-1=Accorde le premier profil de décharge partagé entre les bobines Legacy et la famille Tesla reliée. L'esthétique TL principale reste intacte pour l'instant, mais la ligne adopte déjà un même dialecte électrique : meilleur retour d'impact, sémantique de passerelle plus propre et premier crossover direct avec le teslagun, les munitions Tesla et la réplique fulgorienne.
ei-waveform-harmonics-2=Étend cette forme d'onde commune vers des familles modernes de suivis en chaîne. Les bobines de base gagnent une propagation harmonisée de champ d'arcs, les bobines avancées passent vers des familles de post-décharge modernisées, et la famille Tesla reliée peut enfin lancer de vraies salves chaînées.
ei-waveform-harmonics-3=Achève l'épine dorsale harmonique. Les arcs de poursuite adoptent le langage complet des chaînes de Space Age, la tourelle reliée reçoit sa récompense tardive la plus lourde, et la branche Legacy est enfin prête pour une doctrine spécialisée plutôt qu'une simple échelle de statistiques.
ei-storm-lattice-1=La bobine de base cesse d'être seulement "la première tour Tesla" et devient une véritable doctrine de contrôle. Le réseau de tempête I améliore le relais de cible et élargit la toile d'arcs propagés pour retenir les essaims dans le champ.
ei-storm-lattice-2=Le réseau n'est plus une simple dispersion chanceuse d'arcs. Le réseau de tempête II maintient ensemble la structure ramifiée sous une pression plus lourde et permet à la bobine de base de transmettre sa charge à travers un front ennemi plus dense.
ei-storm-lattice-3=État final de la voie de contrôle de la bobine de base. Le réseau de tempête III pousse la tour d'arcs ramifiés vers une vraie suppression de fin de partie : plus de sauts, plus de portée et une identité de rideau orageux assumée.
ei-dielectric-rupture-1=Les bobines avancées ne sont pas faites pour tenir toute une ligne de front. Elles sont faites pour tuer, puis laisser la charge restante chercher la cible suivante. La rupture diélectrique I renforce cette doctrine en conservant davantage d'énergie utile dans la première post-décharge.
ei-dielectric-rupture-2=La rupture diélectrique II prolonge la chaîne de post-décharges et rend la décharge plus prompte à enflammer ce qu'elle touche. La bobine avancée reste un pylône d'exécution, pas une copie de la tour de base, mais sa violence porte maintenant plus loin.
ei-dielectric-rupture-3=La bobine avancée tardive devient une véritable arme de chaîne d'exécution. La rupture diélectrique III pousse plus loin la portée, les arcs retenus et le profil de combustion pour qu'une mise à mort confirmée puisse défaire une vague compacte.
ei-bridge-coupling-1=Le pont vers la famille Tesla vanille reste volontairement mesuré. Le couplage de passerelle I augmente les dégâts tardifs et l'héritage de contrôle du teslagun, des munitions Tesla et de la réplique fulgorienne sans les transformer en fausses tours TL.
ei-bridge-coupling-2=La ligne de passerelle se termine volontairement en favorisant la tourelle. Le couplage de passerelle II permet à la réplique fulgorienne d'hériter d'un langage de post-décharge plus dense, tandis que l'équipement Tesla portatif reste plus léger.
ei-reactance-overdrive-1=Deux bobines avancées montées sur une coque de char n'allaient jamais rester sages. La suralimentation de réactance I élargit l'enveloppe de volatilité et augmente les arcs de saturation soutenus sans transformer le véhicule en tour fixe.
ei-reactance-overdrive-2=La gestion de bobines de l'ère fusion permet au char Tesla de maintenir des fenêtres de surcharge plus longues. La suralimentation de réactance II accentue encore son comportement de front orageux : modulation plus violente, plus de débordement et plus de pression sur la ligne de souffle.
ei-reactance-overdrive-3=État spécialisé final du char. La suralimentation de réactance III le garde mécaniquement distinct des tours, mais le fait ressentir comme un front électrique mobile plutôt qu'une simple plateforme d'armes avec des éclairs décoratifs.
ei-exotic-waveform-convergence=Au sommet de la doctrine, les tours Legacy cessent d'emprunter le langage moderne des chaînes et gagnent enfin leurs propres faisceaux principaux modernes. La bobine de base devient une tour d'arcs de champ ramifiés et obtient une rafale latérale garantie sur chaque tir principal réussi. La bobine avancée devient un pylône de lance surchargée focalisé et chaque mise à mort confirmée déclenche en plus une tempête d'exécution exotique garantie par-dessus sa logique normale d'après-coup. Le char Tesla ne rejoint cette convergence qu'en partie : ses impacts gagnent une modernisation de décharge adjacente, et des pics positifs de volatilité peuvent lancer une rafale de front orageux sans aplatir le véhicule en une autre tour. La réplique fulgorienne reçoit elle aussi une floraison d'après-coup exotique réservée à la tourelle lors des mises à mort confirmées, contrairement à l'équipement Tesla portatif.

