[entity-description]
tl-basic-tesla-coil=Une bobine Tesla est un transformateur résonant modifié pour projeter des décharges électriques à fort courant sur les ennemis proches.
tl-advanced-tesla-coil=Une version nettement améliorée de la bobine Tesla.
tl-tesla-tank=Une variante de char équipée de deux bobines Tesla avancées de taille moyenne.
ei-tesla-turret=Une imitation reconstruite de l'armement à arc fulgoran d'avant l'Effondrement. Même si la géométrie sous-jacente des bobines supraconductrices n'est comprise qu'en partie, cette tour réplique peut canaliser des décharges électriques contrôlées contre les menaces proches. Sa puissance et son rendement restent inférieurs aux conceptions fulgoranes authentiques, mais elle fournit une suppression de zone fiable et un fort potentiel de rafale grâce à des matériaux avancés.

