ei-waveform-harmonics-1-effect=Harmoniques de forme d'onde I : sémantique d'impact harmonisée et premier bonus de passerelle partagé.
ei-waveform-harmonics-2-effect=Harmoniques de forme d'onde II : les familles modernes d'arcs en chaîne se débloquent pour les bobines Legacy et la famille Tesla reliée.
ei-waveform-harmonics-3-effect=Harmoniques de forme d'onde III : langage de poursuite complet de Space Age et chaîne renforcée pour la tourelle reliée.
ei-storm-lattice-1-effect=Réseau de tempête I : la bobine de base gagne une propagation d'arcs plus large et un meilleur relais de cible.
ei-storm-lattice-2-effect=Réseau de tempête II : la bobine de base maintient des réseaux d'arcs plus denses sous une pression accrue.
ei-storm-lattice-3-effect=Réseau de tempête III : la bobine de base devient une véritable tour de suppression de fin de partie.
ei-dielectric-rupture-1-effect=Rupture diélectrique I : les post-décharges avancées conservent davantage de charge après une mise à mort confirmée.
ei-dielectric-rupture-2-effect=Rupture diélectrique II : les post-décharges avancées vont plus loin et enflamment plus sûrement.
ei-dielectric-rupture-3-effect=Rupture diélectrique III : les bobines avancées transforment les mises à mort confirmées en courtes tempêtes d'exécution.
ei-bridge-coupling-1-effect=Couplage de passerelle I : les dégâts de fin de ligne augmentent sans dissoudre la famille Tesla vanille dans la doctrine TL.
ei-bridge-coupling-2-effect=Couplage de passerelle II : la tour fulgorienne répliquée hérite du payoff de passerelle tardif le plus lourd.
ei-reactance-overdrive-1-effect=Suralimentation de réactance I : le char Tesla élargit son enveloppe de volatilité et projette davantage d'arcs de saturation.
ei-reactance-overdrive-2-effect=Suralimentation de réactance II : le char Tesla maintient une surcharge plus longue et un front orageux plus violent.
ei-reactance-overdrive-3-effect=Suralimentation de réactance III : le char Tesla atteint sa brutalité finale à double bobine de l'ère fusion.
ei-exotic-waveform-convergence-effect=Convergence exotique des formes d'onde : les bobines Legacy débloquent des rafales exotiques de branchement, d'exécution et de front orageux, tandis que la réplique fulgorienne gagne une floraison d'après-coup exotique réservée à la tourelle.

