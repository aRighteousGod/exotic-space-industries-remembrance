[string-mod-setting-description]
ei-tl-behavior-mode-hybrid=Voie allégée facultative. Utilise la trame doctrinale propre à TL comme chemin principal de continuation, garde les aides du pont séparées et abandonne la récursion auxiliaire d'origine pour un meilleur UPS.
ei-tl-behavior-mode-legacy-fidelity=Par défaut. Comportement exact de Tesla's Legacy d'origine. Restaure l'ancienne récursion auxiliaire, la persistance des aides, le nettoyage par minuteur, l'ascendance via dégâts, les post-décharges sur mise à mort et le flux de volatilité du tank, quel qu'en soit le coût UPS.
tl-advanced-attack-anim-charge-up=Avec cette animation, une énergie brillante grimpe dans le noyau de la bobine Tesla avancée. La tourelle tire lorsque cette énergie atteint le sommet de la bobine. Cela peut parfois provoquer un léger retard de retargeting si une tourelle A tue la cible avant qu'une tourelle B n'achève sa préparation.
tl-advanced-attack-anim-simple=Avec cette animation, le courant commence à jaillir entre les bobines dès que des ennemis approchent. La bobine tire immédiatement.

