title_teslas_legacy=Tesla's Legacy
teslas-legacy=Arsenaux de Tesla's Legacy
teslas-legacy-text=Ce qui portait autrefois le nom de Tesla's Legacy est désormais fondu dans la branche des armes électriques de Remembrance. [item=tl-basic-tesla-coil]La bobine Tesla de base, [item=tl-advanced-tesla-coil]la bobine Tesla avancée et [item=tl-tesla-tank]le char Tesla conservent leurs noms publics, leurs silhouettes TL et leur identité industrielle, mais la ligne n'est plus une échelle étrangère. Elle suit désormais le rythme d'une progression EI : d'abord une tour de champ brute, puis un pylône d'exécution plus lourd, puis un front orageux blindé.\n\nLa ligne se prolonge aussi vers la famille Tesla du jeu de base. [item=teslagun]Le Teslagun, [item=tesla-ammo]les munitions Tesla et [item=tesla-turret]la réplique fulgorane de la bobine héritent du même axe harmonique sans être réduits à de fausses tours TL.
teslas-legacy-2=Mode de comportement
teslas-legacy-text-2=Mode de comportement actif au démarrage : [font=default-bold]__1__[/font]\n\n[font=default-bold]Fidélité Legacy[/font] est la voie par défaut. Elle restitue le noyau exact de Tesla's Legacy : l'ancienne récursion auxiliaire, les aides persistantes, le nettoyage par minuteur, la propagation de l'ascendance par les dégâts, les post-décharges directes de la bobine avancée à la mise à mort, les effets incendiaires des décharges simples et le flux de volatilité du char demeurent inchangés. [font=default-bold]Hybride[/font] est la voie allégée facultative. Elle remplace l'ancienne récursion TL comme modèle principal de continuation par une trame d'aides propre à TL, puis laisse les harmoniques et la doctrine réveiller au-dessus d'elle des familles d'aides plus riches.\n\nLa hiérarchie doctrinale est commune, mais son application diffère. En hybride, la trame doctrinale devient le comportement principal. En fidélité Legacy, le comportement TL d'origine s'exprime toujours d'abord, puis les capacités modernes viennent s'y greffer.
teslas-legacy-3=Harmoniques de forme d'onde
teslas-legacy-text-3=Les harmoniques de forme d'onde forment désormais la colonne vertébrale commune de la modernisation. Avant elles, les bobines Legacy conservent leur langage visuel TL d'origine. À l'harmonique I, elles commencent à parler le même dialecte électrique que la famille Tesla reliée. À l'harmonique II, les bobines de base et avancées basculent vers des familles modernes d'arcs de poursuite. À l'harmonique III, ces arcs prennent pleinement le langage des chaînes modernes, et la tourelle reliée reçoit enfin le profil dense de post-décharges qui lui manquait.\n\nC'est là que cesse l'ancien désaccord. Les tours Legacy, la réplique fulgorane et la branche Tesla portative partagent désormais une vraie zone de recouvrement au lieu de se comporter comme des mécanismes étrangers les uns aux autres.
teslas-legacy-4=Spécialisation quantique
teslas-legacy-text-4=Après les harmoniques, la doctrine se sépare nettement. [font=default-bold]La grille de tempête[/font] appartient à [item=tl-basic-tesla-coil]la bobine de base et la transforme en tour de contrôle de meute : propagation plus large, meilleur relais de cible, suppression plus tenace. [font=default-bold]La rupture diélectrique[/font] appartient à [item=tl-advanced-tesla-coil]la bobine avancée et aiguise les post-décharges sur mise à mort, la charge retenue et la transmission de l'incendie.\n\n[font=default-bold]Le couplage de pont[/font] est la spécialisation tardive de la branche reliée. Il renforce la famille Tesla classique sans dissoudre son identité dans des voies de tours TL. La réplique fulgorane reçoit sa récompense la plus lourde côté tourelle, tandis que l'équipement Tesla portatif reste plus léger.
teslas-legacy-5=Suralimentation de fusion
teslas-legacy-text-5=[item=tl-tesla-tank]Le char Tesla ne partage pas directement les spécialisations quantiques des tours. Sa doctrine tardive est [font=default-bold]la suralimentation de réactance[/font], une voie de l'ère de fusion centrée sur la saturation à double bobine, des fenêtres de volatilité plus larges et davantage de débordement le long de la ligne de souffle. Le véhicule reste mécaniquement distinct des tours : moins un pylône fixe, davantage un front orageux sur chenilles.\n\nIl reste aussi le spécialiste de la volatilité de toute la ligne. Les pics critiques, les oscillations de modulation et la vaporisation restent l'apanage du char, là où les tours ne les portent pas.
teslas-legacy-6=Convergence exotique
teslas-legacy-text-6=La dernière étape doctrinale est [font=default-bold]la convergence exotique des formes d'onde[/font]. Elle ne remplace pas les tours TL par des copies venues d'ailleurs. [item=tl-basic-tesla-coil]La bobine de base conserve son corps improvisé et devient une [font=default-bold]tour d'arcs de champ ramifiés[/font] moderne, qui libère une rafale latérale garantie à chaque impact principal réussi. [item=tl-advanced-tesla-coil]La bobine avancée conserve sa silhouette de pylône haut et devient une [font=default-bold]lance de surcharge[/font] focalisée, dont chaque mise à mort confirmée déclenche aussi une tempête d'exécution exotique garantie. Leurs faisceaux principaux sont enfin modernisés, mais leurs rôles au combat restent séparés.\n\nEn [font=default-bold]Fidélité Legacy[/font], ces effets de sommet se superposent au substrat TL d'origine. En [font=default-bold]Hybride[/font], ils couronnent la trame doctrinale allégée. [item=tl-tesla-tank]Le char Tesla ne rejoint cette convergence qu'en partie : des pics de volatilité et des vaporisations peuvent déclencher une rafale de front orageux, mais le véhicule reste un membre blindé et orageux de la famille plutôt qu'une autre tour. [item=tesla-turret]La réplique fulgorane reçoit elle aussi sa propre post-décharge exotique réservée à la tourelle lors des mises à mort confirmées, tandis que [item=teslagun]le teslagun et [item=tesla-ammo]les munitions Tesla restent sur la branche de pont plus légère.
teslas-legacy-7=Retours de combat et texte flottant par défaut
teslas-legacy-text-7=Les retours de combat restent volontairement sélectifs. Les textes [font=default-bold]coup critique[/font] et [font=default-bold]vaporisation[/font] sont activés par défaut pour que les événements exceptionnels restent visibles. Le texte de [font=default-bold]dégâts[/font] ordinaires est désactivé par défaut afin que chaque affrontement ne se dissolve pas en confettis électriques.\n\nCet équilibre compte désormais encore plus, parce que la doctrine comporte davantage de pièces mobiles : sauts de propagation, chaînes de post-décharges, couplage de pont, volatilité du char et modernisation finale du faisceau. Le réglage par défaut garde lisibles les moments les plus dramatiques sans noyer le champ de bataille sous le bruit.
