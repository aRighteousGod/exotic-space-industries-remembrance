[mod-setting-description]
ei-tl-behavior-mode=Choisit si Tesla's Legacy utilise le runtime hybride plus léger ou le chemin de récursion Legacy plus gourmand en UPS.
tl-advanced-attack-anim=Change l'animation utilisée lorsque la bobine Tesla avancée se prépare à attaquer.
tl-critical-multiplier=Quand un coup critique se produit, la valeur de dégâts initiale du coup est multipliée par ce facteur.
tl-critical-chance=Probabilité, en pourcentage, qu'un coup critique se produise pendant les attaques Tesla.
tl-flying-text-critical=Active une notification en texte flottant lors d'un coup critique réussi.
tl-flying-text-vaporize=Active une notification en texte flottant lors d'une mise à mort instantanée réussie par la technologie de vaporisation.
tl-flying-text-damage=Active une notification en texte flottant pour les dégâts modulés du char Tesla issus de la bionisation.

