[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=Le vaisseau scelle son après-image et traverse le monde sans mémoire visible.
ei-gaian-saucer-wake-visual-fidelity-lean=Un mince refus chromatique suit la coque, bref et discipliné.
ei-gaian-saucer-wake-visual-fidelity-standard=Le sillage parle clairement, puis s'efface avant de devenir doctrine.
ei-gaian-saucer-wake-visual-fidelity-cinematic=Le sillage s'élargit, s'attarde et plie avec le serment du virage.
ei-gaian-saucer-wake-visual-fidelity-maximal=La coque laisse une blessure dense et lumineuse partout où elle passe.
ei-gaian-saucer-wake-visual-fidelity-unbounded=Le gouverneur est retiré ; la soucoupe peut écrire chaque miroitement que le monde supporte.

