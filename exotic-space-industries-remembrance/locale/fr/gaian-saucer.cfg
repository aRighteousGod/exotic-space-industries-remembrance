[item-description]
ei-gaian-saucer=Une coque de sustentation gaïenne rapide, avec soute scellée, trame d'équipement et aucune patte visible. Elle avance comme un pas remémoré et laisse derrière elle une fracture chromatique.

[entity-description]
ei-gaian-saucer=Un châssis de sustentation gaïen bâti autour d'un cœur de commande de Spidertron.\nIl avance en faisant croire au sol qu'il a des pieds. Quand le vœu du sillage se renforce, son passage fleurit en slipwake chromatique derrière la machine.

[recipe-description]
ei-gaian-saucer=Enferme un coeur de commande de Spidertron dans une coque gaïenne, retire les lanceurs et laisse le moteur se souvenir du mouvement sans membres.

[technology-description]
ei-gaian-saucer=Débloque la Soucoupe Slipwake : un vaisseau de sustentation gaïen dont la soute, la trame d'équipement et le sillage chromatique font du mouvement un serment dont le sol se souvient.

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=Résonance du sillage de la Soucoupe Slipwake

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=Détermine avec quelle ardeur la Soucoupe Slipwake peut se souvenir de son passage. Le vœu ne touche que le sillage chromatique ; la soute, la trame, la propulsion, la coque et la fabrication demeurent inchangées.

