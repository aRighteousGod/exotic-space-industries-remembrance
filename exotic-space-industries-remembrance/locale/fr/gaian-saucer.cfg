gaian-saucer=Soucoupe Slipwake
gaian-saucer-text=La [item=ei-gaian-saucer] Soucoupe Slipwake est un vaisseau de sustentation gaïen : un cœur de commande de Spidertron enseveli dans une coque qui refuse les pattes. Sa soute, sa trame d'équipement et sa propulsion nourrie par le vide en font l'outil du pèlerin face aux seuils hostiles.
gaian-saucer-2=Résonance du sillage
gaian-saucer-text-2=Le vœu du sillage actuel est [font=default-bold]__1__[/font]. Il ne change que la mémoire chromatique projetée derrière la coque : l'éclat du slipwake, la durée de la cicatrice de virage et la part du passage que le monde doit retenir. Le vaisseau lui-même demeure inchangé.
