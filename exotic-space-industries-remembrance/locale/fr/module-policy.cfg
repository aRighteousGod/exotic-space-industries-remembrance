[mod-setting-name]
ei-beacon-quality-modules=Modules de qualité dans les diffuseurs
ei-beacon-productivity-modules=Modules de productivité dans les diffuseurs
ei-quality-module-effects=Effets des modules de qualité

[mod-setting-description]
ei-beacon-quality-modules=Choisit les familles de diffuseurs ESIR qui acceptent les modules offrant un bonus de qualité. Azote : __ENTITY__ei-copper-beacon__ et __ENTITY__ei-iron-beacon__. Extraterrestres : __ENTITY__ei-alien-beacon__ et __ENTITY__ei-warp-beacon__. Nécessite le mod Quality.\nSi les autorisations sont restreintes, les modules déjà installés devenus interdits sont déposés au sol à côté du diffuseur.
ei-beacon-productivity-modules=Choisit les familles de diffuseurs ESIR qui acceptent les modules offrant un bonus de productivité. Azote : __ENTITY__ei-copper-beacon__ et __ENTITY__ei-iron-beacon__. Extraterrestres : __ENTITY__ei-alien-beacon__ et __ENTITY__ei-warp-beacon__. S'applique aussi lorsque Quality est désactivé.\nSi les autorisations sont restreintes, les modules déjà installés devenus interdits sont déposés au sol à côté du diffuseur.
ei-quality-module-effects=ESIR applique ses propres bonus et pénalités aux modules de qualité. Le mode proche du jeu de base n'applique pas les modifications d'ESIR à leurs effets. Les deux modes conservent les recettes et la progression des recherches d'ESIR. Sans effet lorsque Quality est désactivé.

