menu_auric_inoculation_vat=Cuves d'inoculation auriques
title_auric_inoculation_vat=Cuves d'inoculation auriques
auric-inoculation-vat=Cuves d'inoculation auriques
auric-inoculation-vat-text=La [entity=ei-auric-inoculation-vat] de Gleba ne se branche pas sur des [entity=ei-auric-cyst-node] déjà présentes. Elle revendique autour d'elle un bassin humide continu et convertit ce corps vivant du marais en un traitement par lot qui fera ensuite éclore de nouveaux nodules.\n\n[font=default-bold]Placement et revendication du bassin :[/font] Ces cuves sont faites pour Gleba. Posez-les là où leur champ de revendication touche assez de tuiles de marais pour former un vrai bassin. Un bassin valide exige 24 à 160 tuiles humides connectées ; un marais continu plus grand doit être retaillé ou séparé, et le bassin ne se partage pas avec une autre cuve. Des empreintes qui se chevauchent créent des conflits, et une cuve sans bassin valide n'a rien de stable à inoculer.
auric-inoculation-vat-2=Intrants de cycle et mise à l'échelle par bande
auric-inoculation-vat-text-2=La cuve suit [font=default-bold]ensemencement -> inondation -> fermentation (éventuellement enrichie au bioflux) -> vidange -> floraison -> repos[/font], et non un simple drainage passif du marais. L'ensemencement consomme [item=spoilage] et du [fluid=ei-bio-oil], l'inondation consomme de la [fluid=ei-dirty-water], et la fermentation consomme [item=jelly] et [item=yumako-mash]. Pendant la fenêtre d'enrichissement, fournir du [item=bioflux] transforme cette fermentation en fermentation enrichie avant la vidange et la floraison.\n\nLa taille du bassin détermine la bande active : b1 pour 24-39 tuiles revendiquées, b2 pour 40-55, b3 pour 56-71, b4 pour 72-87, b5 pour 88-103, b6 pour 104-127 et b7 pour 128-160. Les bandes hautes font éclore plus de nodules kystiques, mais elles exigent aussi plus de tenue sur l'eau et sur les réactifs pendant tout le cycle.
auric-inoculation-vat-3=Vigueur, contamination et échec de floraison
auric-inoculation-vat-text-3=Chaque cycle arbitre entre la [font=default-bold]vigueur[/font] et la [font=default-bold]contamination[/font]. Des bassins sains, des phases correctement nourries et une pression de bande maîtrisable maintiennent la vigueur devant. La famine, les vidanges bloquées, les conflits de revendication et les tuiles de marais surexploitées font monter la contamination et poussent la cuve vers l'état sous contrainte.\n\nQuand la contamination atteint les seuils d'échec, la stabilité de floraison s'effondre. La cuve commence à dégrader les tuiles du bassin vers des états humides plus morts et retombe vers le repos au lieu de tenir une floraison propre. Si la console glisse sans cesse de stable à sous contrainte, resserrez l'empreinte du bassin ou nourrissez mieux le cycle avant que le marais ne meure sous la machine.
auric-inoculation-vat-4=Lavage des kystes, recapture d'eau sale et télémétrie
auric-inoculation-vat-text-4=Une cuve saine fait ensuite éclore de nouveaux [entity=ei-auric-cyst-node]. Extrayez-en des [item=ei-auric-cyst], puis lancez [recipe=ei-auric-cyst-washing] pour dépouiller les kystes en sortie utile tout en renvoyant une fraction de [fluid=ei-dirty-water] vers la boucle d'eau plus large de Gleba. Pensez le laveur, la recapture d'eau sale et l'espace de stockage ensemble ; les grandes bandes de bassin demandent plus de récupération autant que plus de rendement.\n\nLa télémétrie circuit garde le marais lisible. La cuve peut exporter [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims] et [virtual-signal=ei-auric-vat-bloom]. Utilisez-les pour comparer des empreintes de bassin, déclencher des alertes sur les conflits ou les échecs et décider quand la ligne de lavage doit grandir avec la bande suivante.
