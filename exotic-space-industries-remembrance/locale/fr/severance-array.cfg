[technology-description]
ei-severance-array=Débloque une tourelle laser de l'âge quantique qui traîne un unique serment de lumière le long de sa visée changeante.

[mod-setting-name]
ei-severance-array-visual-fidelity=Fidélité visuelle de la Matrice de sectionnement

[mod-setting-description]
ei-severance-array-visual-fidelity=Ne contrôle que les témoins de faisceau visibles, la durée des lueurs, feux et marques, la densité sonore et le budget visuel d'exécution de la Matrice de sectionnement. Les dégâts, la portée, l'énergie, la santé et le coût de recette ne changent pas. Maximal est un préréglage plafonné pour captures et tests de charge ; Non borné retire les plafonds visuels et peut ravager les UPS.

[string-mod-setting]
ei-severance-array-visual-fidelity-lean=Léger
ei-severance-array-visual-fidelity-standard=Standard
ei-severance-array-visual-fidelity-cinematic=Cinématique
ei-severance-array-visual-fidelity-maximal=Maximal
ei-severance-array-visual-fidelity-unbounded=Non borné

[string-mod-setting-description]
ei-severance-array-visual-fidelity-lean=Priorité aux UPS : moins de tranches de faisceau, témoins plus courts, feux et marques davantage limités.
ei-severance-array-visual-fidelity-standard=C'est le profil quotidien prévu : balayages visibles, impacts témoins et budgets d'exécution prudents.
ei-severance-array-visual-fidelity-cinematic=Spectacle renforcé : plus de tranches, plus de témoins, lueurs et marques plus persistantes.
ei-severance-array-visual-fidelity-maximal=C'est le profil spectaculaire plafonné : faisceaux et témoins dignes d'une capture, avec limites d'urgence encore actives.
ei-severance-array-visual-fidelity-unbounded=Retire les plafonds visuels et vide agressivement le travail prêt de la Matrice. Conçu pour le spectacle, pas pour la prudence.

[item-description]
ei-severance-array=Une plateforme d'arme quantique 4x4 qui dépense une immense charge stockée pour graver une blessure laser mouvante dans les formations ennemies.

[entity-description]
ei-severance-array=Une plateforme d'arme quantique 4x4. Sa frappe laser native porte le tranchant mortel ; sous forte charge, seule la trace de visée visible s'amincit.

[exotic-industries-informatron]
menu_severance_array=Matrice de sectionnement
title_severance_array=Matrice de sectionnement
turrets-text-6=[item=ei-severance-array]La Matrice de sectionnement est le protocole-lame de l'âge quantique, entre la Tourelle à plasma et les armes reliques stratégiques. Elle stocke une charge colossale, puis traîne un faisceau visible de son ancien point de visée au suivant pendant que l'impact laser natif porte des dégâts initiaux extrêmes. La trace est soumise à un budget visuel : quand de nombreuses matrices tirent ensemble, certaines tranches de faisceau sont supprimées pour garder les dégâts stables.
severance-array=Matrice de sectionnement
severance-array-text=La [item=ei-severance-array]Matrice de sectionnement est un moteur d'exécution compact de l'âge quantique. Elle occupe une fondation 4x4, consomme une immense impulsion électrique et répond à une cible en ouvrant une blessure lumineuse sur le champ de bataille plutôt qu'en suivant chaque victime comme un projectile distinct.
severance-array-2=Protocole de trace de visée
severance-array-text-2=Chaque tir utilise les dégâts normaux de tourelle contre la cible et redirige une seule trace visible pour cette matrice. Les tranches de faisceau sont des témoins décoratifs de la coupure, pas la source de vérité.
severance-array-3=Délestage
severance-array-text-3=Quand trop de matrices tirent en même temps, le moteur divise les tranches visuelles disponibles entre elles. Le champ de bataille peut montrer moins de traits, mais les dégâts restent sur le chemin natif de la tourelle avant que du temps soit dépensé en spectacle.
