[mod-setting-name]
ei-container-capacity-profile=Profil de capacité des conteneurs

[mod-setting-description]
ei-container-capacity-profile=Définit la capacité des coffres de stockage, y compris ceux des autres mods. Emplacements de qualité normale ; colonnes : Bois / Fer / Acier / Petit / Moyen / Entrepôt.\n__1__\n\nLes variantes ordinaires, filtrées et logistiques ont la même capacité à taille égale. Les bonus de qualité existants sont conservés. Les inventaires fonctionnels des machines sont exclus. Réduire ce réglage peut diminuer les inventaires existants et entraîner une perte d’objets.

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=Emplacements de qualité normale : Bois __1__ / Fer __2__ / Acier __3__ / Petit __4__ / Moyen __5__ / Entrepôt __6__.

