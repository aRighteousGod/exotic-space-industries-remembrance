[gate-estimator]
route-snapshot=Trajet figé de la porte
power-draw=Puissance consommée
title=Estimateur de porte
close=Fermer
help-launch=Ouvre un calculateur indépendant. Il ne modifie ni les réglages ni la cargaison de la porte.
snapshot=Charger les valeurs de la porte
help-snapshot=Copie énergie, contrainte, recharge, qualité et trajet. Conserve l'objet et les hypothèses d'alimentation.
reset=Réinitialiser les hypothèses
help-reset=Départ prêt : énergie pleine, aucune contrainte ni recharge, 1 objet/s et 1 GW disponible. La porte réelle reste inchangée.
item=Objet
help-item=Choisir un objet disponible. Aucun objet n'est consommé. La qualité de la cargaison ne change pas le coût.
batch=Taille de pile / dépôt maximal
help-batch=Quantité du calcul unitaire et dépôt maximal par tick simulé. La porte envoie les piles disponibles sans attendre cette quantité ; les dépôts peuvent fusionner.
stress=Contrainte
help-stress=Contrainte initiale de 0 à 100. Diminue de 1/s. Augmente l'entretien et la recharge, pas le coût immédiat du transfert.
quality=Qualité de l'émetteur
help-quality=La qualité de l'émetteur visible multiplie les coûts par 1 / (1 + 0,2 × niveau de qualité). Les qualités de cargaison et de récepteur ne changent pas ce facteur.
from=Planète d'envoi
to=Planète de réception
help-route=Deux planètes sélectionnées verrouillent la distance sur leur séparation stellaire. La même planète signifie la même surface. Effacer une planète permet la saisie manuelle. Aucune surface n'est générée.
local=Même surface
orbital=Même lieu, surfaces différentes
distance=Distance interplanétaire
unknown=Trajet intersurface non résolu
help-distance=Distance stellaire, ni cases ni longueur de trajet spatial. Même surface ×0,15 ; même lieu sur surfaces différentes ×2,5 ; trajet non résolu ×3.
rate=Débit d'entrée proposé
help-rate=Offre constante. Les objets bloqués attendent en amont ; le débit livré peut être inférieur. Les fractions s'accumulent en objets entiers.
per-second=Objets/seconde
per-minute=Objets/minute
power=Puissance disponible
help-power=Alimentation constante supposée, pas une mesure du réseau. La limite de charge et la capacité libre bornent l'énergie reçue.
initial-state=État initial
help-initial-state=Valeurs initiales modifiables. Cargaison simulée et file d'attente commencent vides. La porte réelle reste inchangée.
energy=Énergie stockée (GJ)
help-energy=Énergie initiale. Il faut au moins 100 GJ pour fonctionner et assez d'énergie pour payer toute la prochaine pile.
cooldown=Recharge (s)
help-cooldown=Recharge initiale restante en secondes de simulation. Entrée automatique et transferts sont suspendus ; la réouverture attend la prochaine mise à jour de la porte.
saturation=Saturation du récepteur
help-saturation=Valeur initiale 0–100. À 100, les transferts s'arrêtent mais le stockage reste possible. Décroît de 1,5/s. Sortie et résidus sont supposés évacués.
calculation=Calcul
projections=Projections
burden=Charge transportée
help-burden=Poids de la table de la porte × quantité. Poids 1 pour un objet absent. Ce n'est pas le poids de fusée.
distance-factor=Facteur de distance
help-distance-factor=Interplanétaire : 2,5 + 5,5 × (distance / séparation stellaire maximale)^0,6, borné à la carte installée. Rapport de portée = (facteur − 0,15) / 7,85.
quality-factor=Facteur de qualité
help-quality-factor=Seule la qualité de l'émetteur réduit l'énergie. Les niveaux ajoutés par des mods suivent la même formule.
toll=Énergie de transfert
help-toll=La courbe surlinéaire rend les grandes piles plus coûteuses par objet. Arrondir vers le bas une seule fois après tous les facteurs.
per-item=Énergie de transfert par objet
help-per-item=Coût de ce transfert divisé par sa quantité, hors entretien. Ce prix dépend de la taille de pile.
stress-result=Contrainte ajoutée / résultante
help-stress-result=Au plus 35 points par transfert, avec un total limité à 100. À partir de 75, la console indique Critique hors recharge.
cooldown-result=Recharge après transfert
help-cooldown-result=Utilise la contrainte résultante. Les termes en ticks sont arrondis séparément avant conversion. Mise à jour, énergie ou récupération du récepteur peuvent retarder le transfert suivant.
saturation-result=Saturation ajoutée / résultante
help-saturation-result=La charge ajoute au plus 20 points, jusqu'à 100. La qualité de l'émetteur ne réduit pas cette pénalité.
upkeep-result=Entretien après / avant transfert
help-upkeep-result=Prêt : 30 MW + 1,5 MW par point de contrainte + 30 MW pendant la recharge, avec réduction de qualité. Aucun entretien scripté lorsque inactif ou sous-alimenté.
hardware=Capacité : __1__ GJ · Charge maximale : __2__ MW · Mise à jour : __3__ s
help-hardware=Limites natives et intervalle fixe calculé à partir du nombre de portes et du budget de mise à jour. Une modification du parc peut changer la cadence réelle.
fallback=Objet absent de la table de masse de la porte : poids 1 utilisé.
assumptions=Un émetteur actif, un objet, un récepteur. Sortie et résidus évacués ; aucun autre émetteur. Temps de simulation.
help-assumptions=Inclut saturation, entretien, fusion des piles, recharge et énergie disponible. Exclut péremption, dégâts, circuits changeants, mouvements des bras, concurrence électrique et trajets mobiles.
run=Lancer la projection
help-run=Calcule le scénario et la référence. Travail borné et annulable. Toute modification rend les anciens graphiques obsolètes.
minutes=__1__ min
help-horizon=Durée en minutes de simulation, identique pour la référence.
pin=Épingler la référence
clear-baseline=Effacer la référence
help-pin=Conserve un scénario indépendant et son état initial. Trait plein : actuel ; pointillés : référence. Relancer après modification.
baseline=Référence
pinned=Référence épinglée
no-baseline=Aucune référence
legend=Cyan : première série · Orange : seconde · Plein : actuel · Pointillés : référence
help-chart=Énergie : GJ, seuil rouge 100 GJ. Contrainte : émetteur / récepteur, seuil 75. Recharge : restante / intervalle. Débit : livré / proposé. File : amont / porte. Puissance : transfert / entretien. Les traits verticaux préservent les extrêmes.
throughput=Débit
queue=Cargaison en attente
axis=0–__1__ __2__ · Temps 0–__3__ s
unit-1=GJ
unit-2=%
unit-3=s
unit-4=objets/s
unit-5=objets
unit-6=MW
sample=__1__–__2__ s : __3__
help-sample=Déplacer le curseur temporel. Valeur finale [minimum–maximum] de l'intervalle. Débit et puissance sont des moyennes.
summary=Livrés : __1__ · Moyenne : __2__ objets/s\nEn amont : __3__ · Dans la porte : __4__\nTransfert : __5__ GJ · Entretien : __6__ GJ · Puissance moyenne : __7__ MW\nÉnergie minimale : __8__ GJ · Contrainte maximale : __9__\nAttentes — recharge : __10__ s ; énergie : __11__ s ; récepteur : __12__ s\nRésidus produits : __13__
help-summary=Les causes d'attente peuvent se chevaucher : ne pas les additionner. L'énergie indique la consommation réelle. Les résidus sont comptés puis évacués. Les objets en attente ne sont pas perdus.
difference=Actuel − référence : __1__ objets livrés ; __2__ GJ consommés
help-status=Le calcul est immédiat. Les projections restent celles du dernier lancement et sont signalées si obsolètes. Aucune porte réelle n'est modifiée.
running=Calcul…
stale=Projection obsolète — relancer
ready=Projection prête
invalid=Saisir un nombre fini dans les limites du champ.
missing-prototype=Objet, qualité ou planète indisponible. Choisir un remplacement.
too-expensive=Le coût de cette pile dépasse la capacité de la porte. Les transferts ne divisent pas les piles pour s'adapter à l'énergie disponible.
