[string-mod-setting-description]
ei-pyric-radiance-preset-ember=Quelques petites lumières et peu de lumières mobiles.
ei-pyric-radiance-preset-veiled=Éclairage discret des effets de combat ordinaires.
ei-pyric-radiance-preset-furnace-vigil=Les feux au sol et les forêts en flammes dominent ; aucune lumière mobile ajoutée.
ei-pyric-radiance-preset-iron-benediction=Souligne les positions de tir avec des éclairs à la bouche des armes plus puissants.
ei-pyric-radiance-preset-signal-threads=Souligne les trajectoires avec des lumières de traçantes plus puissantes.
ei-pyric-radiance-preset-tempered=Éclairage modéré par défaut ; aucune lumière supplémentaire d'impact ou d'explosion nucléaire.
ei-pyric-radiance-preset-night-liturgy=Éclairage de combat ample et chaleureux, avec des lumières d'impact supplémentaires.
ei-pyric-radiance-preset-siege-hymn=Éclairs à la bouche des armes puissants et tirs entrants bien visibles.
ei-pyric-radiance-preset-cataclysm=Grandes lumières d'explosion et flashes nucléaires marqués.
ei-pyric-radiance-preset-apotheosis=Atmosphère et densité lumineuse maximales.
ei-ballistic-divergence-preset-needle-oath=Balles rectilignes sans dispersion ajoutée ni distance supplémentaire ; capacité des chargeurs et cône de dispersion d'origine du fusil à pompe conservés.
ei-ballistic-divergence-preset-measured-volleys=Faible dispersion des balles, terrain protégé et capacité des chargeurs actuelle.
ei-ballistic-divergence-preset-breach-doctrine=Dispersion accrue et chargeurs plus grands ; le terrain reste vulnérable.
ei-ballistic-divergence-preset-tempered=Dispersion et distance supplémentaire modérées ; conserve l'économie actuelle des munitions à balles.
ei-ballistic-divergence-preset-distant-thunder=Distance supplémentaire accrue avec une dispersion limitée.
ei-ballistic-divergence-preset-fortress-oath=Chargeurs plus grands, dispersion modérée et terrain protégé.
ei-ballistic-divergence-preset-wildfire-doctrine=Forte dispersion des balles et forte variation des plombs demandée, chargeurs plus grands et terrain protégé.
ei-ballistic-divergence-preset-crossfire=Distance supplémentaire accrue et large dispersion ; le terrain reste vulnérable.
ei-ballistic-divergence-preset-saturation=Distance supplémentaire accrue, large dispersion, capacité des chargeurs doublée et terrain protégé.
ei-ballistic-divergence-preset-terminal-barrage=Distance supplémentaire, dispersion et capacité des chargeurs maximales ; le terrain reste vulnérable.

