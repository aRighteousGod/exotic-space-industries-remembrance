title_ballistic_divergence=Ballistic Divergence
pyric-radiance=Pyric Radiance
pyric-radiance-text=La fournaise témoigne dans la nuit. Les flammes conservent les couleurs de leurs combustibles ; tirs et explosions ordinaires éclairent leur passage. Choisissez une doctrine dans les paramètres de démarrage pour privilégier les braises, les positions de tir, les trajectoires des traçantes ou un vaste éclairage de siège. Les cartes, la propagation du feu, la vision nocturne, les lampes torches et le cycle jour-nuit conservent leur comportement actuel. Les décharges exotiques et les effets énergétiques gardent leur identité visuelle propre.
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=Le tir porte un serment, pas une certitude. Les balles existantes suivent des trajectoires physiques ; ennemis et obstacles neutres peuvent les intercepter. Votre faction ne les intercepte pas, mais les autres factions alliées peuvent être touchées. Les effets de zone et de brûlure existants conservent leurs propres règles. Les munitions perforantes et à uranium disposent d'un budget de pénétration natif égal à 25 fois leurs dégâts physiques de base : elles peuvent traverser les cibles tuées, mais sont arrêtées par celles qui survivent. Les munitions exotiques appliquent tous leurs effets une seule fois. Les armes compatibles actives partagent une limite de distance des projectiles qui tient compte des modificateurs de portée des munitions, de la qualité et de la marge de sortie du canon. Les doctrines autorisent une distance supplémentaire limitée au-delà de cette base et contraignent la variation de distance des balles et des plombs sans modifier la portée de ciblage ni le cône de dispersion d'origine du fusil à pompe. Les tirs manqués disparaissent à la limite de distance native du moteur. Les nouvelles limites s'appliquent aux nouveaux tirs ; les projectiles déjà en vol conservent leurs distances et leurs effets enregistrés. Certaines doctrines augmentent la capacité des chargeurs ou protègent le terrain ; recettes, technologies, capacité des cartouches de fusil à pompe et dégâts des robots restent inchangés.
