[mod-setting-description]
ei-pyric-radiance=Éclaire les feux, les jets de flammes, les explosions ordinaires, les éclairs à la bouche des armes et les projectiles physiques. Conserve les couleurs des combustibles et les effets spéciaux propres à chaque arme. Ne modifie que la présentation : propagation du feu, cartes, vision nocturne, lampes torches et durée du jour conservent leur comportement actuel. La désactivation conserve la doctrine sélectionnée.
ei-pyric-radiance-preset=Choisissez l'équilibre entre lumière des flammes, explosions, traçantes et éclairs à la bouche des armes. Les multiplicateurs modifient le rayon de la lumière ; zéro conserve la présentation actuelle de cette famille d'effets. Les lumières des impacts fréquents et un flash lumineux nucléaire supplémentaire sont réservés aux doctrines plus riches ; l'effet de caméra nucléaire existant reste intact. Les effets exotiques et énergétiques conservent leur présentation propre.\n
ei-ballistic-divergence=Les balles suivent une trajectoire, peuvent manquer leur cible et toucher ce qui se trouve sur leur passage. S'applique aux chargeurs existants, aux plombs de fusil à pompe et aux robots tirant des balles. Les joueurs et structures de votre faction n'interceptent pas ces projectiles ; les autres factions alliées et les obstacles naturels neutres peuvent être touchés. Les effets de zone et de brûlure existants conservent leurs propres règles. Les munitions perforantes et à uranium peuvent traverser les cibles tuées, avec un budget de pénétration natif égal à 25 fois leurs dégâts physiques de base ; les cibles qui survivent les arrêtent. Les munitions exotiques conservent tous leurs effets sur un seul impact. Aucun ajout de munitions ou de recherches. La désactivation conserve la doctrine sélectionnée.
ei-ballistic-divergence-preset=Choisissez la distance supplémentaire maximale, la dispersion des balles, la capacité des chargeurs et la variation de portée des plombs demandée. La distance nécessaire couvre la portée maximale des armes compatibles actives, avec les modificateurs de portée des munitions, la qualité et la marge de sortie du canon. La distance supplémentaire ne dépasse jamais 16 cases au-delà de cette base ; la portée d'acquisition des armes reste inchangée. Le multiplicateur de dispersion des balles s’applique à la déviation angulaire de 0.16 et à la variation de portée demandée de 0.40 ; zéro supprime la dispersion ajoutée. La variation de distance des balles et des plombs est limitée par la distance supplémentaire sélectionnée, tandis que le cône de dispersion d'origine du fusil à pompe est conservé. La capacité des chargeurs est arrondie à l'entier supérieur ; la capacité des cartouches de fusil à pompe et les munitions des robots restent inchangées. La protection du terrain impose une résistance physique minimale de 2 points et 65 % aux arbres, et de 4 points et 75 % aux rochers. Elle affecte tous les dégâts physiques.\n

