[exotic-industries-informatron]
orbital-native-title=Commencer par la logistique native
orbital-native-shipping=Les fusées ordinaires et les transferts entre plateformes utilisent les demandes et l'approvisionnement natifs de Factorio, sans appareil de cohorte. Réglez les sources, quantités minimales de livraison et l'approvisionnement dans les fenêtres natives. L'automatisme natif gère chargement, cargaisons mixtes, choix de cible et lancement. Le panneau latéral affiche sa cible réelle.\n\nLes nouveaux relais utilisent l'automatisme natif par défaut sans modifier le silo à la pose. Cliquez sur Automatisme natif pour activer explicitement ses demandes. Les relais existants restent contrôlés par la cohorte. Le changement exige une charge vide, aucune livraison en route et aucun lancement en cours.
orbital-native-cohort=Pour une cible fixe ou un chargement par usine/circuit, placez un [entity=ei-platform-transponder] sur chaque plateforme participante, puis un sélecteur, un coordinateur alimenté et un relais associé au silo sur le lieu de lancement. Les nouveaux sélecteurs utilisent le mode politique ; Manuel choisit un nom et Circuit lit [virtual-signal=ei-platform-id]. Choisissez Contrôle par cohorte sur le relais.\n\nLa rétention de cible conserve les règles existantes : maintien jusqu'à satisfaction, libération après un seul lancement, ou maintien au-dessus du seuil. IDs, réparations d'association, baux et seuil sont dans Avancé. Collage, clonage et plans copient les réglages, jamais les baux actifs. Les IDs automatiques sont réattribués ; les doublons manuels sont signalés. Un relais copié ne s'associe automatiquement qu'à un seul silo adjacent non ambigu.
orbital-native-sources=Demandes et Besoin peuvent filtrer Planète, Plateformes ou Toutes. Une demande Toutes autorise les deux voies. Les fusées excluent les demandes réservées aux plateformes. En route reste la somme des livraisons entrantes. Le besoin est calculé par plateforme avant addition : max(0, demandes − stock − livraisons entrantes). Le stock d'une autre plateforme ne comble pas ce déficit.\n\nLes règles natives restent responsables des transferts entre plateformes. ESIR ne modifie ni sections ni réserves/réapprovisionnement. Une cargaison contenant un type d'objet ou une qualité non demandé bloque le lancement de cohorte ; les quantités excédentaires de types admissibles restent autorisées. Le panneau indique quoi retirer. L'activation externe des demandes natives suspend la cohorte.
orbital-native-radar-title=Télémétrie radar native
orbital-native-radar-one=[font=default-bold]Une plateforme, un canal[/font]\n1. Activez les sorties stock/état du hub sur rouge. Pour Définir les demandes, utilisez l'entrée verte et séparez les réseaux.\n2. Reliez la sortie rouge et un combinateur constant émettant un signal de présence réservé (par exemple L=1) à un radar alimenté. Choisissez Univers et un canal SignalID réservé à cette plateforme.\n3. À destination, utilisez un radar alimenté de la même force sur le même canal Univers. Reliez sa sortie rouge au circuit consommateur, séparément des entrées de demande.\n\nLe canal identifie la plateforme même en voyage. Présence=1 sans objets indique un stock vide ; l'absence de présence peut indiquer une liaison perdue. Alimentez les deux extrémités. Circuits et radars natifs consomment toujours du temps de calcul, même sans interrogation du scanner.
orbital-native-radar-shared=[font=default-bold]Canal de stock partagé[/font]\nReliez plusieurs hubs à des radars de même force sur un canal Univers commun. Les signaux s'additionnent. Un même signal de présence par émetteur compte les émetteurs connectés. Nommez ce réseau « Stock agrégé ». Il perd l'identité individuelle des plateformes et ne représente ni Besoin exact ni offre disponible garantie.\n\nLes radars transmettent les signaux de circuit ; les hubs n'émettent ni demandes configurées ni cargaisons entrantes engagées. Utilisez le scanner exact pour Demandes / En route / Besoin. Ne fournissez jamais les totaux radio comme besoin individuel à la cohorte. ESIR ne crée pas de relais, ne choisit pas de canaux et ne modifie pas votre câblage.
