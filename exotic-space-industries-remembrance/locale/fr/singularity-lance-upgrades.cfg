[lance-upgrades]
axial=Une incision centrale large de __1__ cases se prolonge jusqu'à __2__ cases derrière le point visé et touche jusqu'à __3__ cibles militaires hostiles supplémentaires pour __4__ dégâts laser chacune. Deux branches partent à ±__5__°, chacune large de __6__ case et longue de __7__ cases au maximum ; ensemble, elles infligent __9__ dégâts laser à un maximum de __8__ cibles supplémentaires. Tous les rayons restent dans la portée effective ; chaque ennemi ne subit qu'un impact d'incision, avec priorité au rayon central.
wound=Les impacts principaux commencent avec +__1__ % de dégâts. Chaque impact consécutif infligeant des dégâts à la même cible augmente le bonus du suivant de __1__ points, jusqu'à +__2__ %. Changer de cible ou attendre __3__ secondes réinitialise la séquence. Un impact sans dégâts n'ajoute aucune charge et ne prolonge pas la durée. Les dégâts secondaires restent inchangés.
collapse=Remplace l'éclaboussure ordinaire par un effondrement au point visé initial après __1__ seconde : __5__ dégâts laser dans un rayon de __6__ cases, sinon __2__ jusqu'au rayon de __3__ cases. Touche au maximum __4__ cibles militaires hostiles supplémentaires, plus la cible principale si elle se trouve encore dans la zone. Les dégâts du cœur et de la périphérie ne se cumulent pas.
testament=Tous les __1__ tirs payés : dégâts principaux ×__2__, Mémoire de la plaie comprise ; limite centrale __3__, limite commune aux branches __7__. Premier effondrement : __8__ dégâts laser dans un rayon de __9__, sinon __4__ jusqu'au rayon de __5__ ; au maximum __6__ cibles supplémentaires, plus la cible principale si elle est éligible. Un seul écho, __10__ secondes après le tir : __11__ dégâts laser, rayon __12__, au maximum __13__ cibles supplémentaires, plus la cible principale si elle est éligible. Le tir compte même si sa cible a disparu ou est protégée.
research-row=__1__ (recherche requise)
protection-title=Protection des cibles
protection=La cible principale est exclue de l'éclaboussure ordinaire et de tous les rayons d'incision, mais chaque effondrement peut la toucher dans sa zone sans utiliser de place parmi les cibles supplémentaires. Les forces identiques, neutres, amies ou en cessez-le-feu sont protégées, dans les deux sens. Un ennemi peut subir un impact d'incision et un impact de chaque effondrement.
status=DPS directs de base : __1__ • __2__
status-wound= • Impact principal avec Mémoire : __1__–__2__
status-testament= • Tous les __1__ tirs ×__2__
baseline=Configuration de base
force-values=Votre force • multiplicateur de dégâts ×__1__ • impact principal : __2__ laser • DPS directs soutenus : __3__, avant Mémoire/Testament • portée de base : __4__ cases, augmentée par la qualité. Les valeurs ci-dessous incluent vos recherches de dégâts.
base-area=Éclaboussure ordinaire : __1__ dégâts laser, rayon __2__, jusqu'à __3__ cibles supplémentaires. Remplacée par l'Effondrement terminal.
rules=Chaque tir payé et chaque effondrement infligent des dégâts distincts. L'éligibilité au rayon central prime sur les branches ; les rayons qui se croisent ne multiplient jamais les dégâts d'incision. Un effondrement applique les dégâts du cœur ou de la périphérie, jamais les deux. Les zones d'impact et du cœur sont évaluées d'après le centre de la cible ; les cibles dont le centre est exactement sur la limite sont incluses. Les deux effondrements restent au point visé initial, même si la cible bouge ou si la lance est retirée ; sortir de la zone permet de les éviter. Leurs valeurs sont fixées au tir. La plaie expire après une interruption et sa marque suit la cible. Le Testament compte les tirs, pas les victimes. La recherche Trou noir suffit : aucun trou noir en fonctionnement n'est requis. La qualité et les limites de la cible déterminent la portée directe. Les signes essentiels restent visibles à toute fidélité ; les ornements ne changent jamais les dégâts.
research-state=__1__ — __2__
active=Actif
locked=Verrouillé
prerequisites=Prérequis directs :
science=Sciences requises :
legend-1=Signe : incision centrale blanc-or bordée de cyan, avec deux branches prismatiques plus fines partant du point visé. Des rubans mouvants et des traînées effilées indiquent l'extrémité réelle de chaque rayon.
legend-2=Signe : les couleurs parcourent une fracture simple à 1–2 charges, ramifiée à 3–4, puis un halo brisé à 5. La marque suit la cible et expire avec la plaie.
legend-3=Signe : des traînées prismatiques spiralent vers un anneau extérieur qui se contracte autour d'une limite centrale visible au point visé fixe. Un éclair central renforcé marque l'instant des dégâts.
legend-4=Signe : cœur de rayon sombre entre de larges bandes prismatiques ; cœur d'effondrement sombre agrandi et anneau d'accrétion lumineux, puis une seconde contraction et une croix terminale pour l'écho.
static-values=Les dégâts indiqués précèdent les recherches de dégâts de la lance. Mémoire dépend de la série d'impacts principaux et Testament du nombre de tirs payés ; aucun DPS de zone unique ne s'applique.
