ei-singularity-lance-axial-rupture=Rupture axiale
ei-singularity-lance-wound-memory=Mémoire de la plaie
ei-singularity-lance-terminal-collapse=Effondrement terminal
ei-singularity-lance-black-hole-testament=Testament du trou noir

[lance-upgrades]
axial=Une incision large de __1__ case se prolonge jusqu'à __2__ cases derrière le point visé, dans la portée effective. Jusqu'à __3__ cibles militaires hostiles supplémentaires subissent chacune __4__ dégâts laser.
wound=Chaque impact principal infligeant des dégâts augmente ceux du prochain impact consécutif de __1__ %, jusqu'à +__2__ %. Le premier impact ne reçoit aucun bonus. Changer de cible ou attendre __3__ secondes réinitialise la plaie. Un impact sans dégâts n'ajoute aucune charge et ne prolonge pas la durée. Les dégâts secondaires restent inchangés.
collapse=Remplace l'éclaboussure ordinaire par un effondrement au point visé initial, après __1__ seconde : __2__ dégâts laser, rayon de __3__ cases, jusqu'à __4__ cibles militaires hostiles supplémentaires.
testament=Tous les __1__ tirs payés : dégâts principaux ×__2__, Mémoire de la plaie comprise ; limite axiale de __3__ cibles ; effondrement de __4__ dégâts laser, rayon __5__, limite __6__. Le tir compte même si sa cible a disparu ou est protégée.
research-row=__1__ (recherche requise)
protection-title=Protection des cibles
protection=La cible principale est exclue de tous les dégâts secondaires. Les forces identiques, neutres, amies ou en cessez-le-feu sont protégées, dans les deux sens. Une autre cible peut subir à la fois l'incision et les dégâts de zone.
status=DPS directs soutenus : __1__ • __2__
baseline=Configuration de base
force-values=Votre force • multiplicateur de dégâts ×__1__ • impact principal : __2__ laser • DPS directs soutenus : __3__, avant Mémoire/Testament • portée de base : __4__ cases, augmentée par la qualité. Les valeurs ci-dessous incluent vos recherches de dégâts.
base-area=Éclaboussure ordinaire : __1__ dégâts laser, rayon __2__, jusqu'à __3__ cibles supplémentaires. Remplacée par l'Effondrement terminal.
rules=Chaque tir payé conserve ses dégâts distincts. L'effondrement reste au point visé initial, même si la cible bouge ou si la lance est retirée ; ses valeurs sont fixées au tir. La plaie expire après une interruption et sa marque suit la cible. Le Testament compte les tirs, pas les victimes. La recherche Trou noir suffit : aucun trou noir en fonctionnement n'est requis. La qualité et les limites de la cible déterminent la portée directe. Les signes essentiels restent visibles à toute fidélité ; les ornements ne changent jamais les dégâts.
research-state=__1__ — __2__
active=Actif
locked=Verrouillé
prerequisites=Prérequis directs :
science=Sciences requises :
legend-1=Signe : incision blanc-or bordée de deux fractures cyan, parcourue de rubans prismatiques et de traînées effilées jusqu'à son extrémité réelle.
legend-2=Signe : les couleurs parcourent une fracture simple à 1–2 charges, ramifiée à 3–4, puis un halo brisé à 5. La marque suit la cible et expire avec la plaie.
legend-3=Signe : des traînées prismatiques spiralent vers un anneau qui se contracte au point visé fixe, puis un éclair marque l'instant des dégâts.
legend-4=Signe : cœur de rayon sombre entre de larges bandes prismatiques ; disque noir entouré d'un anneau d'accrétion lumineux, traînées convergentes et croix terminale.
static-values=Les dégâts indiqués précèdent les recherches de dégâts de la lance. Mémoire et Testament sont conditionnels ; aucun DPS de zone unique ne s'applique.
