[mod-setting-name]
ei-flammable-rupture-fidelity=Fidélité des ruptures inflammables

[mod-setting-description]
ei-flammable-rupture-fidelity=Détermine la densité visuelle et la propagation des dangers lors de la rupture de fluides combustibles. Allégé reste sobre. Standard est le réglage par défaut. Cinématique étire davantage la séquence. Débridé retire les plafonds d'effets et peut frapper sévèrement l'UPS quand de grands réservoirs éclatent.

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=Allégé
ei-flammable-rupture-fidelity-standard=Standard
ei-flammable-rupture-fidelity-cinematic=Cinématique
ei-flammable-rupture-fidelity-unbounded=Débridé

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Rupture la plus courte. Quatre anneaux, plafonds serrés, aucun accent secondaire et aucune massive-explosion.
ei-flammable-rupture-fidelity-standard=Réglage par défaut. Six anneaux, plafonds modérés, un accent secondaire pertinent et quelques massive-explosion retenues.
ei-flammable-rupture-fidelity-cinematic=Huit anneaux, davantage de fumée et de flammes, plus d'accents de famille et une floraison plus lente.
ei-flammable-rupture-fidelity-unbounded=Retire les plafonds visuels et laisse le planificateur vider agressivement les anneaux prêts dans le même tick. Conçu pour le spectacle, pas pour la prudence.

[exotic-industries-informatron]
menu_flammable_ruptures=Ruptures inflammables
title_flammable_ruptures=Ruptures inflammables
flammable-ruptures=Rupture de fluide combustible
flammable-ruptures-text=Les réservoirs, conduites, liaisons souterraines, wagons et machines contenant du fluide peuvent éclater à leur destruction si assez de fluide combustible reste prisonnier à l'intérieur. Le runtime lit les prototypes finaux réellement chargés au lieu d'une simple liste fixe, si bien que les produits pétroliers, les lignes gazeuses et les mélanges exotiques conservent chacun leur propre langage d'après-coup.\n\nLe déclenchement respecte toujours le type de dégâts létaux. Le feu, l'impact, les explosions, le plasma et les morts très énergétiques allument bien plus facilement une rupture que le froid ou le poison.
flammable-ruptures-2=Mode de fidélité
flammable-ruptures-text-2=Mode actuel au démarrage : [font=default-bold]__1__[/font]\n\n[font=default-bold]Allégé[/font] garde une séquence courte et très bornée. [font=default-bold]Standard[/font] est la voie publique par défaut. [font=default-bold]Cinématique[/font] conserve une floraison plus ample sur davantage de ticks. [font=default-bold]Débridé[/font] retire les plafonds d'effets et demande au planificateur de dépenser agressivement les anneaux prêts dans le même tick.
flammable-ruptures-3=Propagation et risque
flammable-ruptures-text-3=La pollution est appliquée immédiatement à la mort, mais le reste de la rupture progresse désormais par anneaux. Explosions, fumée, pose des flammes, brûlures au sol et dégâts aux victimes proches sont calculés une fois puis relâchés sur plusieurs ticks, afin qu'un groupe de réservoirs géants ne tente plus d'accoucher de toute son apocalypse en une seule image.\n\nLes suivis de conduites souterraines passent par la même file d'attente. Débridé est volontairement dangereux pour les performances : quatre silo-2 pleins peuvent encore être magnifiques, mais le prix reste le vôtre.
