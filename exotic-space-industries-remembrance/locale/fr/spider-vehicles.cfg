chassis-hull-description=Amélioration commune : __1__ points de vie maximaux pour l'éclaireur ; __2__ pour les Spidertrons d'assaut et lance-roquettes. Conserve le pourcentage de vie restant.
chassis-cargo-description=Amélioration commune : __1__ emplacements de coffre pour l'éclaireur ; __2__ pour les Spidertrons d'assaut et lance-roquettes.
chassis-fuel-description=Amélioration commune : les inventaires de combustible et de combustible usé disposent chacun de __1__ emplacements pour l'éclaireur et de __2__ pour les deux autres véhicules.
chassis-efficiency-description=Les trois véhicules obtiennent un rendement de combustion de __1__. Chaque combustible fournit davantage d'énergie de déplacement utilisable.
chassis-armor-description=Les trois véhicules gagnent __1__ points de pourcentage de résistance physique et aux explosions par rapport à leur valeur de base, sans dépasser 90 %. Les réductions fixes restent inchangées.
chassis-grid-description=Grilles améliorées : éclaireur __1__ ; assaut __2__ ; lance-roquettes __3__. Les équipements sont conservés. Une variante stockée permet de reconstruire sans perte les véhicules récupérés avec une grille agrandie.
