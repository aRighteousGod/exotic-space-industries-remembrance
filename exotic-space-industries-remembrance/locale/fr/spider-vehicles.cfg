[entity-name]
ei-scout-spidertron=Spidertron éclaireur
assault_spidertron=Spidertron d'assaut
[entity-description]
ei-scout-spidertron=Véhicule à trois pattes destiné à la reconnaissance et à la logistique. Sans arme intégrée ; sa grille accepte les lasers personnels et les autres équipements d'armure. Bénéficie des recherches communes sur les châssis.
assault_spidertron=Véhicule de combat de l'âge de la simulation, équipé d'un canon, d'une mitrailleuse et d'un lance-flammes. Les recherches ajoutent l'artillerie, des améliorations d'armes et des fumigènes réactifs. Bénéficie des recherches communes sur les châssis.
[item-name]
ei-stored-spidertron=__1__ (grille d'équipement __2__×__3__)
ei-assault-smoke-charge=Charge fumigène pour Spidertron d'assaut
[item-description]
ei-assault-smoke-charge=À conserver dans le coffre du Spidertron d'assaut. Après recherche, un coup violent ou des dégâts laissant moins de la moitié des points de vie déclenchent une charge. Elle ralentit les unités hostiles proches pendant six secondes. Délai : 30 secondes.
[technology-name]
ei-spider-vehicles=Véhicules arachnéens
ei-assault-spidertron=Spidertron d'assaut
ei-assault-smokescreen=Fumigènes réactifs pour Spidertron
[technology-description]
ei-spider-vehicles=Spidertrons éclaireurs à trois pattes, avec logistique, télécommande et grille d'équipement. Donne accès aux améliorations de châssis communes aux éclaireurs, aux véhicules d'assaut et aux Spidertrons lance-roquettes.
ei-assault-spidertron=Spidertrons de l'âge de la simulation équipés d'un canon, d'une mitrailleuse et d'un lance-flammes. Donne accès à leurs améliorations d'armes et à leurs fumigènes.
ei-assault-smokescreen=Un Spidertron d'assaut consomme une charge de son coffre lorsqu'un coup hostile retire au moins 5 % de ses points de vie maximaux ou le laisse sous 50 %. Le nuage immobile ralentit de 35 % jusqu'à 64 unités hostiles mobiles dans un rayon de huit cases pendant six secondes. Délai : 30 secondes. Aucun dégât ni invisibilité.
