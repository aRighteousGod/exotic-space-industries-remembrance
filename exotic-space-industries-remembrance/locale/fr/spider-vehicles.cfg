ei-spider-range-aware-cycling=Lorsque le cycle des armes est activé sur le véhicule, sélectionne les armes pouvant atteindre une cible et leur accorde des séquences de tir soutenu. Recherche périodiquement des cibles à proximité. Désactivé : cycle natif sans recherche scriptée ; des portées différentes peuvent bloquer le cycle.

