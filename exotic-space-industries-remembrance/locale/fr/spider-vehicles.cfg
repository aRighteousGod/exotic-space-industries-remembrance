weapon-description=Améliore cette arme sur tous les Spidertrons concernés de votre force. __1__ : délai de tir de __2__ ticks ; portée de __3__ cases ; portée minimale de __4__ cases. Utilise les munitions existantes et leurs recherches habituelles. La cadence réelle dépend aussi du cycle des armes et des modificateurs de munitions.
