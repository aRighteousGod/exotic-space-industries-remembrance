[mod-setting-description]
ei-terrain-evolution-enabled=Active l’écologie du terrain des planètes d’ESIR : changements et restauration du terrain liés à la pollution, traces d’extraction déclenchées par des événements, stress et régénération des arbres sauvages, et durée du jour saisonnière. Configurez les fonctions individuelles, les planètes et les budgets de calcul pour les UPS dans Réglages des mods → Carte. Les dangers facultatifs sont désactivés par défaut ; Fulgora conserve son horloge indépendante. La désactivation arrête les nouveaux changements sans restaurer le terrain et ne rétablit l’éclairage initial que si ESIR en conserve le contrôle.
ei-terrain-active=Active l’écologie et la durée du jour saisonnière sur les surfaces prises en charge et activées. La désactivation arrête les nouvelles tâches sans annuler les changements du terrain ; l’éclairage initial n’est rétabli que si aucun autre contrôleur ne l’a modifié.
ei-terrain-intensity=Modérée applique un multiplicateur de rythme de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. L’intensité reste indépendante des budgets de calcul et n’active jamais les dangers désactivés.
ei-terrain-performance=De petits lots sont traités fréquemment. Très faible et Faible privilégient un minimum de calculs ; Économe est le réglage prudent par défaut. Équilibré, Détaillé, Haute fidélité et Très haute fidélité augmentent progressivement la couverture et le coût en UPS. Personnalisé utilise les limites individuelles. Tous les budgets sont globaux ; l’intensité et les dangers se règlent séparément.
ei-terrain-custom-rate-multiplier=Modérée applique un multiplicateur de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. Les budgets de calcul restent indépendants.
ei-terrain-degradation=Dégrade progressivement les terrains naturels admissibles selon les étapes propres à leur planète après une pollution prolongée. Par défaut : pollution d’au moins 100 pendant cinq minutes. Les spores de Gleba ne comptent pas comme pollution toxique.
ei-terrain-recovery=Restaure uniquement les changements du terrain enregistrés par ESIR, en parcourant exactement leurs étapes en sens inverse. Par défaut : pollution d’au plus 25 pendant dix minutes, avec un intervalle de restauration quatre fois plus long que celui de dégradation. Un remplacement externe retire à ESIR le contrôle de la restauration.
ei-terrain-mining-scars=Déclenché par l’événement d’épuisement d’une ressource finie dans la zone d’extraction d’une carrière admissible ou d’une grande foreuse. Les traces proches sont mises en file d’attente et traitées dans les limites de travail partagées ; une rafale d’événements peut faire ignorer des traces supplémentaires. Elles sont permanentes par défaut. L’événement n’identifie pas la foreuse responsable.
ei-terrain-tree-stress=Fait grisonner les arbres sauvages indigènes pris en charge après une pollution prolongée et annule le grisonnement contrôlé par ESIR lorsque les conditions redeviennent propres. Les plantes cultivées et la flore protégée sont exclues.
ei-terrain-tree-regrowth=Fait pousser lentement des arbres locaux pris en charge près des arbres existants lorsque le milieu reste suffisamment peu pollué. Les limites de densité locale et les protections du terrain s’appliquent ; Gaia choisit ses arbres selon le biome.
ei-terrain-thermal-scars=Les arbres tués par le feu peuvent laisser de petites traces de brûlure sur le terrain si la source du feu est admissible. Cet effet n’allume aucun incendie.
ei-terrain-seasonal-daylight=Activé par défaut. Fait varier selon les saisons la durée d’ensoleillement et la production solaire native, sans changer la durée totale du cycle journalier. Fulgora est toujours exclue ; l’heure figée et les contrôleurs externes sont prioritaires.
ei-terrain-mining-recovery=Désactivé par défaut. Enregistre les futures traces d’extraction pour permettre leur restauration ; les anciennes traces permanentes ne peuvent pas être reconstituées. Les dégâts miniers remplacent les anciens chemins de restauration écologique.
ei-terrain-aging=Désactivé par défaut. Remplace les arbres vivants admissibles de Nauvis par du bois mort indigène. Les autres planètes sont exclues faute de remplacement adapté. Cette option ne déclenche pas d’incendie.
ei-terrain-rot=Désactivé par défaut. Supprime progressivement le bois mort indigène admissible. Les arbres et les sites protégés sont exclus.
ei-terrain-flood=Désactivé par défaut. Transforme les cases sableuses admissibles des rives de Nauvis en eau, au bord de l’eau douce existante. Les autres liquides planétaires et les zones protégées sont exclus.
ei-terrain-drought=Désactivé par défaut. Transforme les cases d’eau admissibles des rives de Nauvis en sable, au bord d’une rive sableuse existante. Les autres liquides planétaires et les zones protégées sont exclus.
ei-terrain-cliffs=Désactivé par défaut. Supprime occasionnellement les falaises ordinaires admissibles. Les falaises propres à certaines planètes et les zones protégées sont exclues.
ei-terrain-blood=Désactivé par défaut. La mort d’une unité ennemie ou la destruction d’un nid peut annuler une étape de dégradation enregistrée sur un terrain proche. Les traces d’extraction nécessitent toujours l’activation de leur restauration.
ei-terrain-paving=Désactivé par défaut. Nécessite les effets du sang : la mort d’ennemis peut retirer les revêtements admissibles en pierre ou en béton pour révéler le terrain sous-jacent. Les protections des infrastructures et les autres protections restent actives.
ei-terrain-seasonal-ecology=Désactivé par défaut. Fait varier selon les saisons les rythmes de dégradation des sols, d’activité et de régénération des arbres, ainsi que les tentatives de phénomènes dangereux. Fonctionne indépendamment du contrôle de la durée du jour saisonnière et n’active pas les dangers désactivés.
ei-terrain-wildfire=Désactivé par défaut. La pollution peut déclencher des départs de feu en nombre limité. Les flammes localisées ne se propagent pas et durent au plus 10 secondes ; la propagation native peut dépasser le budget de calcul d’ESIR. Les incendies de combat indépendants restent inchangés.
ei-terrain-planet-nauvis=Active l’écologie et la durée du jour saisonnière sur Nauvis : étapes de dégradation de l’herbe, de la terre, du désert et du sable, arbres sauvages indigènes et changements facultatifs des rives. Les réglages de chaque fonction et les protections restent applicables.
ei-terrain-planet-gaia=Active l’écologie et la durée du jour saisonnière sur Gaia : les variantes de prairie et de zone humide se dégradent jusqu’à la roche nue de Gaia, retrouvent leurs variantes d’origine enregistrées et permettent la régénération d’arbres adaptés au biome. Les sites prédéfinis restent protégés.
ei-terrain-planet-vulcanus=Active l’écologie et la durée du jour saisonnière sur Vulcanus, avec les étapes de dégradation des cendres, des sols et des fissures volcaniques. La lave est protégée ; les fumaroles conservent leurs effets indépendants.
ei-terrain-planet-gleba=Active l’écologie et la durée du jour saisonnière sur Gleba, avec ses terrains propres à chaque biome et ses arbres sauvages indigènes. Les spores ne causent pas de dégâts de pollution toxique ; les plantes et sols cultivés ainsi que les bassins auriques restent protégés.
ei-terrain-planet-fulgora=Active l’écologie du terrain sur Fulgora : transitions entre roche, sable, poussière et dunes. Les océans de pétrole restent protégés. La durée du jour saisonnière ne contrôle jamais Fulgora ; son horloge indépendante conserve la priorité.
ei-terrain-planet-aquilo=Active l’écologie et la durée du jour saisonnière sur Aquilo, avec les transitions admissibles de tassement de la neige et de transformation de la glace. Les océans d’ammoniac, les fondations et les infrastructures restent protégés.
ei-terrain-pollution-high=Le seuil supérieur déclenche l’exposition à la pollution ; le seuil inférieur déclenche la période de dépollution et doit rester plus bas. Utilise la pollution locale native sans la modifier directement.
ei-terrain-pollution-low=Le seuil supérieur déclenche l’exposition à la pollution ; le seuil inférieur déclenche la période de dépollution et doit rester plus bas. Utilise la pollution locale native sans la modifier directement.
ei-terrain-mining-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-wildfire-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-flood-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-drought-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-cliff-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-blood-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-paving-probability=Probabilité par tentative admissible, de 0 (jamais) à 1 (toujours). La fonction correspondante doit être activée ; les protections restent applicables.
ei-terrain-axial-tilt=Inclinaison axiale supposée pour calculer le contraste saisonnier d’ensoleillement ; 23,5 degrés par défaut. Une valeur plus élevée accentue généralement les saisons. Le plein jour et la nuit complète conservent chacun un minimum de 2 % du cycle ; Fulgora est exclue.
ei-terrain-latitude=Latitude supposée pour la durée du jour saisonnière ; 45 degrés par défaut. Une latitude plus éloignée de l’équateur accentue le contraste saisonnier ; son signe inverse l’été et l’hiver. Ce réglage ne déplace pas les joueurs et ne modifie pas la rotation planétaire.
ei-terrain-season-strength=Intensité de la variation saisonnière des rythmes écologiques. S’applique uniquement lorsque l’écologie saisonnière est activée.
ei-terrain-dirty-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-clean-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-soil-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-recovery-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-mining-radius=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-mining-patch-radius=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-tree-growth-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-tree-density-limit=Nombre maximal d’arbres dans le voisinage configuré avant de suspendre la régénération naturelle.
ei-terrain-tree-neighborhood=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-tree-stress-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-tree-aging-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-tree-rot-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-hazard-seconds=Délai ou intervalle en secondes de simulation. Les conditions requises et une capacité de traitement disponible restent nécessaires.
ei-terrain-wildfire-radius=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-hazard-radius=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-calendar-days=Année de référence en jours de Nauvis, selon leur durée enregistrée ; 360 par défaut. La durée de l’année de chaque planète dépend de sa distance sur la carte stellaire chargée. Modifier ce réglage préserve la phase saisonnière actuelle et ne change jamais la rotation planétaire.
ei-terrain-protection-buffer=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-max-depth=Nombre maximal d’étapes de dégradation à partir du terrain d’origine enregistré.
ei-terrain-seed-distance=Distance ou rayon en cases. Les protections peuvent empêcher une modification à un emplacement pourtant admissible.
ei-terrain-interval=Préréglage Personnalisé : nombre de ticks entre deux occasions de traitement global. Des valeurs plus élevées réduisent la fréquence des calculs et ralentissent le traitement des zones ; les tâches reportées ne provoquent jamais de rafale de rattrapage.
ei-terrain-search-interval=Préréglage Personnalisé : intervalle minimal en ticks entre les quotas de recherche d’entités, partagés par toutes les surfaces. Ce réglage est indépendant de l’intervalle de traitement. Le réduire autorise davantage de recherches et peut augmenter le coût en UPS. Les quotas inutilisés ne s’accumulent pas.
ei-terrain-cold-chunks=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-active-chunks=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-candidates=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-histories=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-writes=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-recovery-reserved=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-searches=Préréglage Personnalisé : nombre maximal de recherches d’entités lors d’un traitement où l’intervalle de recherche est écoulé. Quota partagé par toutes les surfaces ; les recherches inutilisées ne sont pas reportées.
ei-terrain-result-limit=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-events=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-mining-queries=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-mining-candidates=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-admissions=Utilisé avec le préréglage de calcul Personnalisé. Limite globale et finie, partagée entre toutes les surfaces et non attribuée à chaque planète. Une valeur plus élevée peut augmenter la charge processeur.
ei-terrain-active-cap=Quantité maximale d’informations écologiques conservées. Des limites plus élevées consomment davantage de mémoire. Les limites de traitement restent applicables.
ei-terrain-pending-cap=Quantité maximale d’informations écologiques conservées. Des limites plus élevées consomment davantage de mémoire. Les limites de traitement restent applicables.
ei-terrain-tile-history-cap=Quantité maximale d’informations écologiques conservées. Des limites plus élevées consomment davantage de mémoire. Les limites de traitement restent applicables.
ei-terrain-tree-history-cap=Quantité maximale d’informations écologiques conservées. Des limites plus élevées consomment davantage de mémoire. Les limites de traitement restent applicables.

