[string-mod-setting-description]
ei-terrain-intensity-restrained=Modérée applique un multiplicateur de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. Les budgets de calcul restent indépendants.
ei-terrain-intensity-standard=Modérée applique un multiplicateur de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. Les budgets de calcul restent indépendants.
ei-terrain-intensity-severe=Modérée applique un multiplicateur de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. Les budgets de calcul restent indépendants.
ei-terrain-intensity-custom=Modérée applique un multiplicateur de 0,5, Normale de 1 et Forte de 2. Personnalisée utilise le multiplicateur choisi. Les budgets de calcul restent indépendants.
ei-terrain-performance-ultra-low=Intervalle de traitement (ticks) : 16. Recherches d’entités : jusqu’à 1 tous les 128 ticks. Plafonds par traitement : historiques de récupération vérifiés 1, tuiles modifiées 1. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-low=Intervalle de traitement (ticks) : 16. Recherches d’entités : jusqu’à 1 tous les 64 ticks. Plafonds par traitement : historiques de récupération vérifiés 2, tuiles modifiées 2. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-lean=Intervalle de traitement (ticks) : 16. Recherches d’entités : jusqu’à 1 tous les 32 ticks. Plafonds par traitement : historiques de récupération vérifiés 4, tuiles modifiées 4. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-balanced=Intervalle de traitement (ticks) : 8. Recherches d’entités : jusqu’à 1 tous les 16 ticks. Plafonds par traitement : historiques de récupération vérifiés 4, tuiles modifiées 4. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-detailed=Intervalle de traitement (ticks) : 4. Recherches d’entités : jusqu’à 1 tous les 8 ticks. Plafonds par traitement : historiques de récupération vérifiés 8, tuiles modifiées 4. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-high-fidelity=Intervalle de traitement (ticks) : 2. Recherches d’entités : jusqu’à 1 tous les 4 ticks. Plafonds par traitement : historiques de récupération vérifiés 8, tuiles modifiées 4. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-ultra-high-fidelity=Intervalle de traitement (ticks) : 1. Recherches d’entités : jusqu’à 2 tous les 2 ticks. Plafonds par traitement : historiques de récupération vérifiés 16, tuiles modifiées 8. Limites partagées par toutes les surfaces ; le travail réel dépend des conditions.
ei-terrain-performance-custom=Utilise les intervalles de traitement et de recherche, les limites de travail et les capacités de stockage individuelles. De petits lots et un intervalle de recherche plus long réduisent les pointes de charge et ralentissent la couverture. Changer de préréglage conserve l’historique de récupération.
ei-terrain-wildfire-off=Désactive les incendies déclenchés par l’écologie. Les traces de brûlure et les incendies de combat indépendants restent réglés séparément.
ei-terrain-wildfire-contained=Flammes sans propagation, d’une durée maximale de 10 secondes. Les allumages sont limités ; les autres incendies ne sont jamais pris en charge.
ei-terrain-wildfire-spreading=Utilise la propagation native du feu. Les allumages initiaux sont limités, mais la propagation du moteur échappe au budget de script d’ESIR et peut fortement réduire les UPS.

[exotic-industries-informatron]
menu_terrain_evolution=Évolution du terrain
title_terrain_evolution=Évolution du terrain

[ei-terrain]
overview=L’évolution du terrain associe pollution, dégradation des sols, restauration enregistrée, traces d’extraction et réactions naturelles des arbres. Les effets du feu, des côtes, des falaises, du sang et des revêtements se règlent séparément. Nauvis, Gaia et les planètes compatibles conservent leurs familles de terrains. Inspiré de TerrainEvolution et TerrainEvolution2.
protections=Les changements ordinaires respectent les revêtements posés, les infrastructures, les gisements et les terrains non pris en charge. La restauration suit les changements enregistrés par ESIR plutôt que de transformer tous les biomes en herbe. Les protections s’appliquent aussi aux dangers. Désactiver une fonction n’annule pas les changements antérieurs.
calendar=Le calendrier saisonnier abstrait utilise la distance et l’orientation de la carte stellaire chargée. Il ne déplace pas les planètes et ne change pas la durée totale du cycle journalier. Écologie et durée du jour saisonnières se règlent séparément. Fulgora conserve son horloge indépendante. ESIR cède le contrôle de l’éclairage aux contrôleurs externes reconnus ou détectés.
performance=De petits lots sont traités fréquemment. Très faible et Faible privilégient un minimum de calculs ; Économe est le réglage prudent par défaut. Équilibré, Détaillé, Haute fidélité et Très haute fidélité augmentent progressivement la couverture et le coût en UPS. Personnalisé utilise les limites individuelles. Tous les budgets sont globaux ; l’intensité et les dangers se règlent séparément.
effective=État : __1__ ; traitement : __2__ ; intensité : __3__
mining-note=L’épuisement d’un gisement fini dans la zone d’une foreuse admissible peut laisser une cicatrice ; l’événement n’identifie pas la foreuse responsable. Les cicatrices sont permanentes par défaut. Configurez leur activation, leur forme et la récupération des futures cicatrices dans les réglages écologiques.
unsupported=Cette surface ou cette fonction n’est pas prise en charge.
invalid-value=La valeur ou la combinaison de réglages est invalide.
updated=Paramètres écologiques mis à jour.
