[technology-name]
ei-productivity-auric-precipitation=Productivité de la précipitation aurique

[technology-description]
ei-productivity-auric-precipitation=Chaque niveau ajoute 10 points de pourcentage à la productivité du lavage des scories auriques. Les cycles supplémentaires ne produisent que de l'or, sans scories ni eau sale supplémentaires. Les modules de productivité sont autorisés ; l'ensemble des bonus de productivité est plafonné à +300%. La recherche peut se poursuivre indéfiniment, mais le rendement n'augmente plus une fois ce plafond atteint.
