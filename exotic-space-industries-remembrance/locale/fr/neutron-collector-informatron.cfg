[exotic-industries-informatron]
menu_neutron_collector=Collecteur de neutrons
title_neutron_collector=Collecteur de neutrons
neutron-collector=Collecteur de neutrons
neutron-collector-text=Le [color=orange]Collecteur de neutrons[/color] [item=ei-neutron-collector] est une machine de charge de l'ere quantique. Il capte les neutrons libres qui s'echappent des installations proches de fission et de fusion et utilise ce flux pour convertir [item=ei-neutron-container] en [item=ei-charged-neutron-container].\n\nIl ne cree pas de neutrons. Il recolte ce que les reacteurs voisins ne parviennent pas a retenir. Le collecteur se lie a une seule source a la fois et privilegie le meilleur rendement vivant a portee au lieu de moyenner chaque machine alentour.
neutron-collector-2=Liaison, distance et veille
neutron-collector-text-2=Le rendement depend du type de source et de la geometrie. Une source de fusion puissante peut pousser la valeur au-dela de 100 %, tandis qu'un emetteur faible ou lointain peut la faire chuter ; le rendement signale reste borne entre 0 et 300 %. Plus la distance augmente, plus le temps de charge s'allonge.\n\nS'il n'y a pas de source valable, si le flux est trop faible, si la source liee passe en sommeil, si la sortie est bloquee ou si le circuit desactive l'assembleuse, le collecteur revient a sa recette de veille afin que la machine reste ouvrable et que ses diagnostics restent visibles.
neutron-collector-3=Telemetrie circuit
neutron-collector-text-3=Lorsque le collecteur est cable, son interface cachee publie cinq signaux personnalises sur le reseau du collecteur : [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] et [virtual-signal=ei-neutron-scan-agent].\n\nLe rendement sort de 0 a 300. La distance est emise en dixiemes de case. L'agent collecteur vaut 1 actif, 2 en attente, 3 bloque. L'agent source vaut 1 active, 2 dormante, 3 absente. L'agent de scan vaut 1 stable, 2 a recalculer, 3 reliaison en attente. Ces signaux se rafraichissent sur la passe de telemetrie planifiee du collecteur, pas a chaque tick.
