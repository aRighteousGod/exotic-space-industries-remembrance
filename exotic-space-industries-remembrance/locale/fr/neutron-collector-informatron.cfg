menu_neutron_collector=Collecteur de neutrons
title_neutron_collector=Collecteur de neutrons
neutron-collector=Collecteur de neutrons
neutron-collector-text=Le [color=orange]Collecteur de neutrons[/color] [item=ei-neutron-collector] est une machine de charge de l'ère quantique. Il capte les neutrons libres des sources de fission proches, les faibles fuites des réacteurs actifs de l'Ère spatiale à fusion à plasma dense sur Aquilo, et le flux plus puissant et réglable des réacteurs ESIR à fusion thermonucléaire. Il utilise ce flux pour convertir [item=ei-neutron-container] en [item=ei-charged-neutron-container].\n\nIl ne crée pas de neutrons. Il récolte ce que les réacteurs voisins ne parviennent pas à retenir. Le collecteur se lie à une seule source à la fois et privilégie la source active la plus forte à portée au lieu de moyenner chaque machine alentour.
neutron-collector-2=Liaison, distance et veille
neutron-collector-text-2=Le rendement du collecteur dépend du type de source, de son activité et de la géométrie. Les réacteurs de l'Ère spatiale à fusion à plasma dense sur Aquilo ne fournissent qu'une faible fuite lorsqu'ils sont actifs ; les réacteurs thermonucléaires ESIR restent les sources les plus fortes et se règlent par leurs contrôles de température et d'injection. Le rendement signalé reste borné entre 0 et 300 %, et plus la distance augmente, plus le temps de charge s'allonge.\n\nS'il n'y a pas de source valable, si le flux est sous le seuil de charge, si la source liée passe en sommeil, si la sortie est bloquée ou si le circuit désactive l'assembleuse, le collecteur revient à sa recette de veille afin que la machine reste ouvrable et que ses diagnostics restent visibles.
neutron-collector-3=Telemetrie circuit
neutron-collector-text-3=Lorsque le collecteur est cable, son interface cachee publie cinq signaux personnalises sur le reseau du collecteur : [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] et [virtual-signal=ei-neutron-scan-agent].\n\nLe rendement sort de 0 a 300. La distance est emise en dixiemes de case. L'agent collecteur vaut 1 actif, 2 en attente, 3 bloque. L'agent source vaut 1 active, 2 dormante, 3 absente. L'agent de scan vaut 1 stable, 2 a recalculer, 3 reliaison en attente. Ces signaux se rafraichissent sur la passe de telemetrie planifiee du collecteur, pas a chaque tick.
