informatron-body=Le fil rouge commande les champs activés ; le fil vert transmet les relevés. Zéro est une valeur réelle. Les cinq modes et les trois relevés sont disponibles immédiatement. La recherche améliore portée, débit et rendement ; la qualité améliore également ces capacités et la santé.\n\nUne observation cartographie un chunk et relève les cibles militaires hostiles vivantes. Positions et âges correspondent à la dernière observation. Un relevé vide valide diffère d'une absence de données. Limites : 128 candidats par recherche et 2 048 contacts par collection. Les résultats tronqués indiquent des minimums.\n\nSurveillance ne génère pas de terrain. Exploration soumet au plus une demande tous les 30 ticks pour toute la flotte. Une demande impossible expire après 60 secondes et rend la couverture incomplète. Changer la géométrie annule le travail et les relevés. Pause, gel et entrées invalides suspendent leur validité. Une impulsion terminée peut conserver son relevé. Aucun remboursement du travail payé puis annulé.\n\nLa flotte partage au plus 120 débuts d'observation/s avant les autres limites. La vitesse est une demande. L'interface montre le débit moyen depuis la pose, le passage idéal et le dernier passage mesuré. Le faisceau suit le travail terminé, pas l'animation de l'antenne.\n\nLa réserve électrique unique paie la veille et les observations. Copies et réparations démarrent à vide. Une amélioration conserve les réglages et transfère l'énergie existante dans la limite de la nouvelle réserve. Le radar ordinaire reste disponible.\n\nValeurs électriques de base : radar à balayage — veille de 1 MW, 8 MJ par observation, entrée maximale de 64 MW, réserve de 16 MJ ; radar à réseau phasé — veille de 2 MW, 5 MJ par observation, entrée maximale de 128 MW, réserve de 10 MJ. La qualité ajoute jusqu'à 4 chunks de rayon et 50% de débit, et réduit jusqu'à 20% l'énergie par observation. Ces bonus se combinent avec la recherche et sont plafonnés au niveau légendaire. La qualité ne modifie ni la consommation de veille ni les limites de traitement partagées. La veille reste active en pause ou en attente d'une impulsion. Les limites d'entrée plafonnent la recharge ; la consommation réelle dépend du temps de veille et des observations acceptées.
