[exotic-industries-informatron]
menu_gaian_hierophant=Hiérophante gaïen
title_gaian_hierophant=Hiérophante gaïen
gaian-hierophant-intro=Un sanctuaire transforme sa dévotion en signal tranchant. Le Hiérophante gaïen est une lente cathédrale flottante dotée de deux rayons cristallins, bâtie autour d'un cœur de commande natif de Spidertron.
gaian-hierophant-controls=Commandes et ravitaillement
gaian-hierophant-controls-text=Utilisez la conduite, la sélection à distance et le pilotage automatique habituels du Spidertron. L'équipement, la soute, les emplacements de déchets et la logistique du véhicule passent par les interfaces natives du jeu. Le tir manuel et le tir automatique déclenchent la même salve prépayée ; le vaisseau peut se déplacer en tirant. La stabilisation de sustentation limite le cumul des ralentissements, mais les dégâts et les étourdissements directs s'appliquent toujours.
gaian-hierophant-weapons=Deux cristaux, deux verrouillages de cible
gaian-hierophant-weapons-text=Avec des munitions de qualité normale, la couronne inflige __1__ dégâts laser tous les __2__ ticks, a une portée de base de __3__ cases et couvre __4__ degrés. La façade inflige __5__ dégâts laser tous les __2__ ticks, à une portée de __6__ cases et dans un arc frontal de __7__ degrés. Chaque rayon conserve une cible valide et se tourne progressivement vers une autre lorsqu'il la perd. Les dégâts attendent l'acquisition de la cible ; une unité traversée visuellement par le rayon ne devient pas pour autant une cible. La qualité du véhicule augmente la portée de la couronne ; celle de la façade reste fixe.
gaian-hierophant-charge=Une charge, une période de tir
gaian-hierophant-charge-text=Une [item=ei-anisetron-crystal-charge] alimente les deux rayons pendant __1__ secondes. Leur puissance de base combinée atteint jusqu'à __2__ dégâts laser par seconde lorsque les deux rayons touchent leur cible, avant recherches, améliorations et résistances. La recherche de cibles et les changements de direction consomment cette même période de tir ; les dégâts inutilisés ne sont ni conservés ni transférés d'un rayon à l'autre. Réapprovisionnez le vaisseau par sa logistique de munitions. Le tir prépayé continue lorsque les munitions sont épuisées ou que la commande de tir manuel est relâchée. Retirer le vaisseau annule les contacts restants ; les effondrements et échos déjà engagés vont néanmoins à leur terme.
gaian-hierophant-upgrades=Héritage de la Lance
gaian-hierophant-upgrades-text=La qualité des munitions ainsi que [technology=laser-weapons-damage-6] et les recherches suivantes améliorent les deux rayons. Seule la couronne hérite de [technology=ei-singularity-lance-axial-rupture], [technology=ei-singularity-lance-wound-memory], [technology=ei-singularity-lance-terminal-collapse] et [technology=ei-singularity-lance-black-hole-testament] : incisions supplémentaires, dégâts de blessure croissants, effondrement différé et impulsion renforcée toutes les __1__ impulsions programmées de la couronne. Ces améliorations ne sont pas requises pour la construction. Au moment de son paiement, une charge fixe ses dégâts, ses portées, sa qualité et les améliorations recherchées ; les nouvelles recherches s'appliquent aux charges suivantes.
gaian-hierophant-construction=Assemblage sur Gaia
gaian-hierophant-construction-text=Recherchez [technology=ei-anisetron] après la Soucoupe Slipwake, la Lance de singularité et Dégâts des armes laser 5. Assemblez le vaisseau sur Gaia avec un châssis vide de [item=ei-gaian-saucer], une [item=ei-singularity-lance] et les autres matériaux de la recette. Retirez d'abord l'équipement et videz le châssis : cette recette ordinaire produit un vaisseau neuf sans transférer sa configuration. Les charges cristallines peuvent être fabriquées sur n'importe quelle surface.
gaian-hierophant-visuals=Résonance visuelle
gaian-hierophant-visuals-text=Préréglage de démarrage sélectionné : __1__. Il règle les filaments verts de mouvement, les halos des rayons et les éclats de contact. Les deux rayons principaux et les signes essentiels des améliorations restent visibles, même lorsque les ornements sont désactivés. Le niveau visuel ne change ni les dégâts, ni le ciblage, ni la portée, ni le paiement des charges, ni la durée de tir, ni le mouvement. Les niveaux supérieurs autorisent davantage d'ornements ; Délié supprime ces limites et peut réduire les UPS.
