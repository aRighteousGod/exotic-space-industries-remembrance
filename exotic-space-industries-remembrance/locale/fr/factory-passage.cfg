[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=D?sactiv? par d?faut. Observe les machines d’assemblage sans fenêtre ouverte qui utilisent la sélection native de recette par circuit. Si le scanner est désactivé, les jonctions peuvent rester obsolètes jusqu’à un événement ou un rafraîchissement explicite. Les fenêtres ouvertes et les mises à jour événementielles restent actives. Effet au prochain tick de traitement, sans reconstruction. Inactif hors du mode ESIR, si les passages sont désactivés ou si Squeak Through 2 est prioritaire.
ei-factory-passage-circuit-scan-budget=Tentatives de scan supplémentaires par tick pour toute la sauvegarde (1–1 024 ; défaut 1), indépendantes du budget principal. Chaque machine attend au moins 60 ticks après une vérification réussie ou une réconciliation terminée. Une valeur faible réduit le travail des scripts mais retarde les collisions ; une valeur élevée résorbe plus vite la file et peut coûter davantage par tick. Aucun budget ne garantit une durée en millisecondes. Modification sans redémarrage ; valeur conservée lorsque le scanner est arrêté.
ei-factory-passage-update-budget=Nombre maximal de tâches en attente traitées par tick (1–1 024 ; par défaut : 256). Une valeur faible réduit le travail des scripts, mais retarde la mise à jour des collisions des tuyaux. Une valeur élevée vide les files plus vite et peut augmenter le temps de calcul par tick. S’applique immédiatement à toutes les surfaces, sans redémarrage. Le recensement initial du monde et la suppression des objets de collision auxiliaires sont synchrones et ne sont pas limités par ce réglage. Sans effet si le mode des tuyaux n’est pas ESIR, si le passage entre les bâtiments est désactivé ou si Squeak Through 2 est prioritaire.
ei-factory-passage-enabled=Permet de passer entre les installations adjacentes prises en charge. Désactiver cette option annule toutes les modifications de passage d’ESIR, tout en conservant les catégories sélectionnées.
ei-factory-passage-production=Permet de passer entre les machines de production, foreuses, laboratoires et autres bâtiments similaires placés côte à côte.
ei-factory-passage-power=Permet de passer entre les générateurs, chaudières, réacteurs, accumulateurs, panneaux solaires et installations électriques placés côte à côte.
ei-factory-passage-logistics=Permet de passer entre les installations de stockage, bras, appareils de circuit logique, diffuseurs, radars, roboports et arrêts de train placés côte à côte.
ei-factory-passage-turrets=Permet de passer entre les tourelles adjacentes construites par le joueur.
ei-factory-passage-pipe-mode=Vanilla : conserve le comportement de collision initial des tuyaux.\nSqueak Through : permet de passer entre les éléments de tuyauterie adjacents, même au niveau des raccords connectés. Le centre des tuyaux reste infranchissable.\nESIR : permet de passer dans les espaces sans raccord, mais les raccords connectés en surface restent infranchissables. Un nouveau raccord ne bloque le passage qu’une fois son emplacement libéré par les personnages. Les sections souterraines et les conduites de chaleur déjà franchissables le restent.

