[ei-factory-passage-guide]
walking-heading=Circuler entre les machines
walking=Laissez une place à l’ingénieur. Les passages réduisent les collisions des bâtiments de production, d’énergie, de logistique et des tourelles compatibles pour passer entre voisins. Leur centre reste solide. Murs, portes, obstacles naturels, véhicules, ennemis, entités hors grille et auxiliaires invisibles conservent leur collision prévue.
modes-heading=Choisir un mode de tuyaux
modes=Vanilla conserve les collisions fournies par le jeu et les autres mods. Squeak Through permet de traverser les jonctions adjacentes sans mod supplémentaire. ESIR bloque les connexions réelles en surface et laisse les espaces non connectés ouverts. Aucun obstacle n’est ajouté aux portions souterraines. Les tuyaux ordinaires se raccordent latéralement : deux rangées qui se touchent forment une grille connectée, pas une allée.
controls-heading=Trouver les commandes
controls=Les catégories et le mode de tuyaux se choisissent au démarrage et nécessitent un redémarrage. Pour le rythme en cours de partie, ouvrez Paramètres des mods → Carte ou Administration → Options → Performances. Les deux modifient les mêmes valeurs pour toute la sauvegarde. Le budget principal (défaut __3__) couvre les extrémités, les nouvelles tentatives sur jonctions occupées et les fenêtres ouvertes. La découverte initiale et la suppression immédiate des auxiliaires restent synchrones.
recipes-heading=Changements de recette
recipes=La construction, la rotation, le collage de réglages et les autres événements pris en charge déclenchent des mises à jour locales. Une fenêtre native ouverte permet de suivre rapidement les recettes. Les assembleurs sans fenêtre ouverte utilisant la sélection native par circuit sont suivis en arrière-plan. Les machines fermées à recette manuelle ne sont pas vérifiées périodiquement. Un autre mod qui modifie silencieusement recettes ou sélection par circuit doit appeler le rafraîchissement existant.
scanner-heading=Régler le scanner
scanner=Le scanner est d?sactiv? par d?faut. Les valeurs suivantes s?appliquent lorsqu?il est activ?. Le budget de circuit vaut __1__ tentative par tick par défaut, en plus du budget principal. Chaque machine attend __2__ ticks après une vérification réussie ou une mise à jour terminée ; les fenêtres et événements ignorent ce délai. À vitesse normale, cela permet au plus __4__ tentatives par seconde dans la sauvegarde. Pour 600 machines admissibles stables, un passage prend donc environ __5__ secondes. C’est une estimation, pas une garantie : une file de réconciliation peut ajouter du délai. Augmentez la valeur pour accélérer les mises à jour, réduisez-la pour limiter le travail. Aucun budget ne garantit la durée d’un tick.
troubleshooting-heading=Arrêt du scanner et dépannage
troubleshooting=Scanner arrêté, les changements de circuit sans fenêtre ouverte peuvent rester obsolètes ; fenêtres et événements fonctionnent toujours. Vérifiez l’activation des passages et le mode ESIR. Squeak Through 2 est prioritaire. Si une jonction attend qu’un personnage s’écarte, libérez sa place. Un administrateur autorisé peut utiliser Diagnostics → Passages d’usine → Réparer ou /ei-admin-repair factory-passage pour reconstruire le suivi sans remplacer les machines.
current-heading=Réglages actuels
current=Mode configuré : __1__\nMode effectif : __2__\nMotif d’inactivité : __3__\nBudget principal : __4__ par tick\nScanner de circuits : __5__\nBudget supplémentaire : __6__ par tick\nCet aperçu se renouvelle à la réouverture de la page.
