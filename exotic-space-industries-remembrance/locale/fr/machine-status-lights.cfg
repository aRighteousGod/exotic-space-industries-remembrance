[mod-setting-name]
ei-production-machine-lights=Voyants d’état des bâtiments de production

[mod-setting-description]
ei-production-machine-lights=Concerne 28 bâtiments de production ESIR : 23 voyants sur les indicateurs existants de 20 bâtiments. Les huit bâtiments sans indicateur n’en reçoivent pas. En mode multicolore, Bottleneck Lite ignore uniquement ces 20 bâtiments ; ses réglages de couleur ne changent pas les couleurs ESIR. Les effets lumineux de production sont préservés dans tous les modes. La lueur de production du four à arc reste contrôlée séparément par son réglage de scintillement. Voyants et lueurs assortis : vert en fonctionnement, jaune lorsque la sortie est pleine, orange en cas de manque d’électricité et rouge pour les autres arrêts avec énergie disponible. Sans énergie, les ajouts sont invisibles. Rétablit les 25 éclairages blancs d’origine. Le four à arc, le chauffage au plasma et la fonderie conservent leurs effets d’origine sans voyant ni lueur supplémentaire. Bottleneck Lite reste inchangé. Aucun voyant ni éclairage d’état ajouté. Les indicateurs dessinés sur les bâtiments et les effets de production restent visibles. Bottleneck Lite reste inchangé.

[string-mod-setting]
ei-production-machine-lights-off=Désactivé
ei-production-machine-lights-status=Voyants multicolores
ei-production-machine-lights-original=Blanc d’origine

[string-mod-setting-description]
