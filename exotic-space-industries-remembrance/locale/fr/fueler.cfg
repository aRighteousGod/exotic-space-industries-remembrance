[technology-name]
ei-fueler=Tour de ravitaillement Fuelwarden

[technology-description]
ei-fueler=La tour de ravitaillement Fuelwarden fonctionne selon deux modes. Le mode véhicule ravitaille les trains, voitures, chars, spidertrons, tourelles à munitions, tourelles d'artillerie et wagons d'artillerie. Le mode équipement alimente les équipements consommateurs de carburant dans les grilles d'équipement des véhicules et des joueurs, y compris les équipements de réacteur alimentés au combustible. Utilisez l'interface graphique de la tour pour choisir le type de cible et déterminer si la tour alimente les inventaires de carburant des véhicules ou les équipements consommateurs de carburant dans les grilles. Si elle en a la place, la tour récupère aussi le combustible usé dans son propre inventaire.

