[item-description]
ei-fueler=Une [color=orange]tour de ravitaillement[/color] autonome. En mode véhicule, elle peut ravitailler les trains, voitures, chars, spidertrons, tourelles à munitions, tourelles d'artillerie et wagons d'artillerie. En mode équipement, elle alimente les [color=blue]équipements consommateurs de carburant dans les grilles d'équipement des véhicules et des joueurs, y compris les équipements de réacteur alimentés au combustible[/color]. Elle récupère aussi les [color=red]résidus de combustion[/color]. Une qualité supérieure permet à une même tour de traiter davantage de cibles à chaque passe de mise à jour, sans augmenter sa portée ; les règles normales de qualité des conteneurs augmentent toujours la capacité d'inventaire. Plus d'informations dans l'Informatron en jeu.

