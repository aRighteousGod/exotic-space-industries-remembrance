welcome=Exotic Industries : Tour de ravitaillement Fuelwarden
welcome-text=La tour Fuelwarden est une structure de soutien automatisée qui surveille les cibles admissibles à proximité et leur injecte du carburant depuis son propre inventaire.\n\nEn mode véhicule, elle ravitaille les trains, voitures, chars, spidertrons, tourelles à munitions, tourelles d'artillerie et wagons d'artillerie. En mode équipement, elle alimente les équipements consommateurs de carburant dans les grilles d'équipement des véhicules et des joueurs, y compris les équipements de réacteur alimentés au combustible. Si elle dispose de place, elle peut aussi récupérer le combustible usé ou les résidus de combustion.\n\nUtilisez l'interface pour choisir à la fois le type de cible et le mode de destination du carburant. Si une tour semble inactive, la cause la plus fréquente est un mauvais réglage à ce niveau : une tour ciblant les locomotives et réglée sur le mode équipement ne remplira pas les inventaires de carburant des véhicules, et le mode équipement n'agit que sur les équipements consommateurs de carburant présents dans les grilles.\n\n[font=default-bold]Elle ne demande pas. Elle sert le circuit qui lui a été assigné.\nElle ne s'écarte ni de sa portée ni du mode choisi.\n\nRéglez-la une fois, puis laissez-la travailler.[/font]

welcome-text-2=Les tours Fuelwarden peuvent suivre des cibles en mouvement, y compris des trains en mouvement. La qualité ne change ni la portée ni les temps de recharge, mais une tour de meilleure qualité peut traiter davantage de cibles pendant une même passe de mise à jour ; elle gère donc mieux les dépôts très sollicités.\n\nSi une migration, une interaction avec un autre mod ou un runtime endommagé désynchronise le système, les administrateurs peuvent reconstruire l'état runtime avec /rescan_fuelers. L'inventaire de la tour profite toujours des règles normales de qualité des conteneurs de Factorio ; une meilleure qualité signifie donc aussi plus de stockage pour le carburant et les munitions.\n\n[font=default-bold]Ces tours sont efficaces, pas omniscientes.\nPlus la tour est bonne, plus elle peut accomplir davantage de travail en une seule passe.[/font]

welcome-text-3=Le mode équipement inclut aussi les équipements de réacteur alimentés au combustible.
