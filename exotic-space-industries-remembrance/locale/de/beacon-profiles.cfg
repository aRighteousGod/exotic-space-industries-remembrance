[mod-setting-name]
ei-beacon-diminishing-returns=Abnehmende Wirkung von Effektverteilern

[mod-setting-description]
ei-beacon-overload=Aktiviert: Maschinen schalten oberhalb der Effektverteiler-Überlastungsgrenze ab; Kupfer zählt als 1, Eisen als 2, Alien- und Warp-Effektverteiler sind ausgenommen. Deaktiviert: Alle vier ESIR-Effektverteilerstufen verwenden stattdessen das gewählte Profil abnehmender Wirkung.
ei-beacon-diminishing-returns=Gilt nur bei deaktivierter Effektverteilerüberlastung. Jeder abdeckende Effektverteiler verringert die übertragenen Moduleffekte aller ESIR-Effektverteiler, einschließlich Verbrauch und Verschmutzung. Alle Typen zählen gemeinsam jeweils einmal; schwache zusätzliche Effektverteiler können stärkere abschwächen. Ein einzelner behält die volle Wirkung. Modulplätze, Qualität, Kühlung und Brennstoffbedarf bleiben unverändert.\nWirkung je Effektverteiler bei 1 / 4 / 8 / 16 abdeckenden Effektverteilern:\n__1__\n„Vanilla-Kurve“ übernimmt nur die Kurve, behält aber ESIR-Stärken und gemeinsame Zählung. Die Kurven haben 4096 Einträge; darüber gilt der letzte Faktor weiter.

[string-mod-setting]
ei-beacon-diminishing-returns-gentle=Sanft
ei-beacon-diminishing-returns-vanilla=Vanilla-Kurve
ei-beacon-diminishing-returns-strict=Streng (Standard)
ei-beacon-diminishing-returns-harsh=Hart
ei-beacon-diminishing-returns-severe=Sehr streng
ei-beacon-diminishing-returns-saturating=Sättigend

[beacon-profile]
row=__1__: __2__% / __3__% / __4__% / __5__%\n
overload-enabled=Effektverteilerüberlastung aktiv: höchstens 4 gewichtete Einheiten je Maschine. Kupfer zählt als 1, Eisen als 2; Alien und Warp sind ausgenommen. Das Profil abnehmender Wirkung ist inaktiv.
overload-disabled=Effektverteilerüberlastung deaktiviert. Aktives Profil: __1__. Kupfer, Eisen, Alien und Warp verwenden abnehmende Wirkung. Jeder abdeckende Effektverteiler zählt unabhängig von seiner Stufe einmal; schwächere Ergänzungen können den Gesamtbonus verringern.
