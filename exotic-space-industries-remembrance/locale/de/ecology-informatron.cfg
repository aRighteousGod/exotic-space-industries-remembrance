[ei-ecology-guide]
intro-heading=Lies den Boden um deine Fabrik
intro=Deine Fabrik hinterlässt mehr als Gebäude. Verschmutzung kann Naturboden abtragen und Bäume ergrauen lassen; Bergbau hinterlässt kahle Flecken. Saubere Bedingungen ermöglichen teilweise Erholung. Die Geländeentwicklung ergänzt örtliche Gefahren und einen Jahreszeitenkalender mit eigenen Regeln für Nauvis, Gaia, Vulcanus, Gleba, Fulgora und Aquilo. Weltraumplattformen, unbekannte Planeten und fremde Hilfsoberflächen sind ausgenommen.\n\n„Boden“ erklärt Bodenveränderung, Erholung, Bergbau und Bluteffekte. „Wälder“ behandelt Bäume und Feuer, „Ufer“ Wasser und Klippen. „Jahreszeiten“ erläutert Kalender und Planetenunterschiede. „Steuerung“ hilft bei Einstellungen, Berichten und scheinbar ausbleibenden Effekten. Inspiriert von TerrainEvolution und TerrainEvolution2, mit ESIR-eigenen Verarbeitungsgrenzen und Schutzregeln.
defaults-heading=Die Ausgangsbedingungen
defaults=Neue Konfigurationen aktivieren das Ökosystem und alle Einzelfunktionen: Erholung neuer Abbaunarben, Baumalterung, Totholzverfall, Uferveränderungen, Klippenverwitterung, Bluteffekte, Pflasterkorrosion, jahreszeitliche Aktivität und Tageslicht. Einzelne Funktionen lassen sich abschalten.\n\n[font=default-bold]Standardeinstellungen:[/font] Intensität „Zurückhaltend“, Verarbeitung „Sparsam“, Vegetationsbrand „Begrenzt“. Ausbreitendes Feuer muss gesondert gewählt werden. Bestehende Spielstände behalten gespeicherte Einstellungen und ausdrückliche Oberflächenvorgaben; diese Standards setzen nichts zurück.\n\n[font=default-bold]Praktische Grenzen:[/font] Aktivierte Funktionen brauchen geeignetes Gelände oder Vegetation, passende Bedingungen und Verarbeitungszeit. Zufallsprüfungen können ohne Änderung enden. Aktivierung erlaubt einen Effekt, garantiert aber keine sofortige flächendeckende Wirkung.
observation-heading=Sauber oder verschmutzt: verlässliche Messwerte sind nötig
observation=Das System misst Verschmutzung in wechselnden Kartenbereichen, den Chunks, und nutzt die Werte für nahe Entscheidungen. Erst wiederholte Messungen gelten als dauerhaft sauber oder verschmutzt. Lange ungeprüfte Gebiete sind unbekannt, nicht automatisch gesund.\n\n[font=default-bold]Standardeinstellungen:[/font] Verschmutzt bedeutet mindestens 100 Verschmutzung während fünf beobachteter Minuten. Sauber bedeutet höchstens 25 während zehn beobachteter Minuten. Zwischen 25 und 100 werden beide Beobachtungszeiten zurückgesetzt. Eine Messlücke von mehr als 20 Simulationssekunden unterbricht ebenfalls den Nachweis durchgehender Bedingungen.\n\n[font=default-bold]Praktische Grenzen:[/font] Fehlende Messungen oder andere Schadstoffarten ersetzen keine saubere Luft. Größere erkundete Karten brauchen länger für einen Durchlauf. Die Beobachtungszeit ist eine Voraussetzung, kein Countdown für die garantierte Veränderung jedes Feldes.
protection-heading=Platz für Fabrik und besondere Orte lassen
protection=Gewöhnliche Ökologieänderungen lassen Pflaster, Landaufschüttung, Fundamente und überbauten Boden unberührt. Geschützt sind außerdem Infrastruktur, Baugeister, aktive Vorkommen, Kulturpflanzen und deren Böden, aurische Beckenansprüche, besondere platzierte Orte und nicht unterstütztes Gelände. Gewöhnliche unterstützte Wildbäume und kleine Naturdekoration machen einen Ort allein nicht industriell.\n\n[font=default-bold]Praktische Grenzen:[/font] Der Schutz kann über Hindernisse hinausreichen. Uferänderungen und Eingriffe an Naturobjekten halten mindestens acht Felder Abstand, auch bei kleinerem allgemeinem Puffer. Unmittelbar vor einer Änderung wird erneut geprüft; neue Maschinen können bereits wartende Arbeit verhindern.\n\nPflasterkorrosion besitzt eine enge Ausnahme für geeignete freie Wege und Beton. Uferänderungen gelten nur für bestimmte Boden-Wasser-Paare. Ausbreitendes Feuer kann das anfangs geprüfte Zündgebiet verlassen. Abschalten verhindert neue Aktivität; bestehende Änderungen bleiben gewöhnlich bis zu einer unterstützten Erholung erhalten.
soil-heading=Verschmutzung verschlechtert natürlichen Boden
soil=Anhaltende Industrieverschmutzung verändert Naturboden schrittweise. Auf Nauvis kann Gras zu Erde, Wüste und Sand werden; andere Welten verwenden eigene Vulkan-, Sumpf-, Fels- oder Schneeböden. Sinkende Verschmutzung kann weitere Schäden verhindern, sobald die Bedingungen nicht mehr erfüllt sind.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt zwei Minuten Grundintervall für Bodenprüfungen aus einem Basiswert von 60 Sekunden. Jahreszeiten und Verarbeitungsverzögerungen beeinflussen den tatsächlichen Zeitpunkt. Die fünfminütige Beobachtung verschmutzter Bedingungen bleibt erforderlich.\n\n[font=default-bold]Praktische Grenzen:[/font] Jede Prüfung betrachtet einen kleinen Bereich statt eines ganzen Chunks. Die maximale Verschlechterungstiefe begrenzt aufgezeichnete Schritte. Am Ende der unterstützten Bodenfolge gibt es keinen weiteren Schritt; jeder Planet behält seine eigenen Bodentypen.
recovery-heading=Saubere Bedingungen lassen aufgezeichnete Schäden heilen
recovery=Saubere Bedingungen ermöglichen beschädigtem Boden Erholung. ESIR zeichnet eigene Geländeänderungen auf und verfolgt sie schrittweise bis zum ursprünglichen Boden zurück. Aus Gras gewordene Erde und später Sand werden entlang dieser gespeicherten Schritte zurückgeführt, nicht durch beliebiges Gras ersetzt.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt acht Minuten Erholungsintervall aus dem Basiswert von 240 Sekunden. Dieser Basiswert ist viermal so lang wie das Bodenintervall. Zusätzlich sind zehn Minuten sauberer Beobachtung nötig; beide Anforderungen können parallel ablaufen. Intensität ändert das Erholungsintervall, Jahreszeiten tun dies nicht. Kein Intervall garantiert sofortige Wirkung.\n\n[font=default-bold]Praktische Grenzen:[/font] Erholung benötigt gültige Aufzeichnungen eigener Schäden. Überbauung oder Änderungen anderer Systeme können diese unbrauchbar machen; späteres Freiräumen stellt sie nicht wieder her. Ältere, nicht aufgezeichnete Böden und Küsten, entfernte Klippen und zerstörte Bäume werden nicht rekonstruiert.
depletion-heading=Erschöpfte Vorkommen können Narben hinterlassen
depletion=Erschöpft sich ein endliches Vorkommen, kann naher freier Boden aufgewühlt werden. Die erschöpfte Position muss im qualitätsabhängigen Abbaubereich eines befeuerten, dampfbetriebenen oder elektrischen Steinbruchs oder großen Erzförderers liegen, der diese Ressourcenkategorie unterstützt. Gewöhnliche Erzförderer und unendliche Vorkommen sind ausgenommen.\n\n[font=default-bold]Standardeinstellungen:[/font] Innerhalb eines Störradius von 56 Feldern wird ein Fleck mit drei Feldern Radius gewählt. Jede geeignete Position darin hat eine Änderungschance von 70%. Aktives Erz und geschützter Boden bleiben unberührt.\n\n[font=default-bold]Praktische Grenzen:[/font] Auslöser ist die Erschöpfung des Vorkommens. Das Ereignis verrät nicht, welcher Erzförderer es erschöpft hat; entscheidend ist die Abdeckung durch einen geeigneten Förderer. Flecken werden schrittweise bearbeitet und können erst nach dessen Stillstand erscheinen. Viele gleichzeitige Erschöpfungen können nahe Anfragen zusammenfassen oder neue abweisen; angenommene Anfragen verfallen nicht allein durch lange Wartezeit.
working-heading=Aktive Steinbrüche können nahen Boden aufwühlen
working=Geeignete Steinbrüche und große Erzförderer können bereits während des Abbaus endlicher Vorkommen Narben erzeugen. Sie müssen aktiv sein, den Status „Arbeitet“ zeigen und ein gültiges endliches Abbauziel auf derselben Oberfläche besitzen. Dies ist unabhängig von Erschöpfungsnarben. Stillstehende Förderer erzeugen keine Arbeitsnarben.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt zehn Minuten zwischen Gelegenheiten aus dem Basiswert von 300 Sekunden. Jede Gelegenheit fordert mit 10% Wahrscheinlichkeit einen Abbauflächenfleck an; darin gilt separat eine Änderungschance von 70% je geeigneter Position. Jahreszeiten und Verarbeitung können Prüfzeitpunkte verschieben.\n\n[font=default-bold]Praktische Grenzen:[/font] Aktives Erz bleibt geschützt; Narben entstehen auf benachbartem freien Boden. ESIR führt eine begrenzte, bei Bau und Entfernung aktualisierte Liste derselben vier Fördererfamilien; stillstehende Förderer dürfen darin bleiben. Verspätete Prüfungen versuchen einmal den aktuellen Effekt und holen nichts nach. Deaktivierte Oberflächenökologie pausiert Prüfungen und wartende Narbenarbeit.
mining-recovery-heading=Wohin sich eine Abbaunarbe erholen kann
mining-recovery=Abbauerholung zielt auf den Boden unmittelbar vor der Narbenbildung. Hatte Verschmutzung Gras bereits in Erde verwandelt, kann die Abbaunarbe nur zur Erde zurückkehren. Der Bergbaudatensatz ersetzt den älteren ökologischen Erholungspfad; früheres Gras lässt sich daraus nicht rekonstruieren. Weitere aufgezeichnete Bergbauschäden bleiben rückverfolgbar.\n\n[font=default-bold]Standardeinstellungen:[/font] Erholung ist für neu aufgezeichnete Abbaunarben aktiv. Allgemeine Gelände- und Abbauerholung müssen beide aktiviert sein; saubere Beobachtungsbedingungen und ein gültiger Erholungsdatensatz sind erforderlich.\n\n[font=default-bold]Praktische Grenzen:[/font] Bei deaktivierter Abbauerholung entstandene Schäden bleiben dauerhaft. Späteres Aktivieren rekonstruiert diese Narben nicht. Deaktivierte Oberflächenökologie pausiert angenommene Abbauarbeit; nach Aktivierung läuft sie innerhalb normaler Verarbeitungsgrenzen weiter, ohne Nachholwelle.
blood-heading=Alienblut kann beschädigtem Boden bei der Erholung helfen
blood=Stirbt ein feindliches Wesen oder Nest, kann sein Blut nahen Boden um einen aufgezeichneten Schadensschritt zurückführen. Diese direkte Wiederherstellung benötigt keine normale saubere Beobachtungszeit, aber gültige ESIR-Schadensdaten, die passenden Schalter und übliche Schutzprüfungen. Bergbauschäden benötigen zusätzlich aktivierte Abbauerholung.\n\n[font=default-bold]Standardeinstellungen:[/font] Bei einem geeigneten Tod wird mit 10% Wahrscheinlichkeit ein kleiner örtlicher Fleck zur Verarbeitung angenommen. Änderungen folgen später, sobald Verarbeitungskapazität verfügbar ist.\n\n[font=default-bold]Praktische Grenzen:[/font] Eine Leiche garantiert keine Heilung und hinterlässt kein dauerhaftes Heilfeld. Ohne Aufzeichnung kann der frühere Boden nicht erfunden werden. Der Effekt ist unabhängig von sichtbaren Todeseffekten im Kampf; hohe Last kann die Annahme neuer Flecken begrenzen.
paving-heading=Blut kann auch freiliegendes Pflaster angreifen
paving=Bei aktivierten Blut- und Pflasterkorrosionseffekten kann ein Todesfleck geeignete Steinwege oder Beton bis zum darunter gespeicherten Boden abtragen. Ein gültiger Geländeerholungsschritt hat Vorrang; Pflaster wird geprüft, wenn diese Erholung nicht möglich ist. Deaktiviere dies, wenn geeignetes freies Pflaster erhalten bleiben soll.\n\n[font=default-bold]Standardeinstellungen:[/font] Nach Annahme des Blutereignisses erfolgt eine Korrosionsprüfung mit 1% Wahrscheinlichkeit. Das gilt innerhalb angenommener Flecken, nicht als pauschale 1%-Chance bei jedem getöteten Feind.\n\n[font=default-bold]Praktische Grenzen:[/font] Besetztes oder anderweitig geschütztes Pflaster und Fundamente sind ausgenommen; der Untergrund muss bekannt und gültig sein. Dies ist die gezielte Ausnahme vom normalen Pflasterschutz. Entferntes Pflaster wird weder erstattet noch durch Erholung neu gebaut. Abschalten der Bluteffekte verhindert auch neue Korrosionsversuche, selbst bei aktivem Pflasterschalter.
stress-heading=Verschmutzung kann wilde Bäume ergrauen lassen
stress=Unterstützte Wildbäume können bei anhaltender Verschmutzung Farbe verlieren. Sie bleiben lebendig und an Ort und Stelle; Ergrauen ist weder Verbrennen noch Totholzbildung. ESIR speichert ursprüngliche Farbstufe und eigene Belastung, um sie später rückgängig machen zu können. Kulturpflanzen, Sonderflora, geschützte Orte und nicht unterstützte Arten bleiben unberührt.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt zehn Minuten zwischen Belastungsprüfungen aus einem Basisintervall von fünf Minuten. Intensität, Jahreszeit, Beobachtungsabdeckung und begrenzte Baumsuchen bestimmen, wann ein Baum erreicht wird. Die Beobachtung verschmutzter Bedingungen bleibt erforderlich.\n\n[font=default-bold]Praktische Grenzen:[/font] Vollständig graue Bäume können nicht weiter ergrauen. Ändert ein anderes System die gespeicherte Farbstufe, kann ESIR den Datensatz aufgeben, statt das neue Aussehen zu überschreiben.
greening-heading=Ein belasteter Baum kann seine Farbe zurückgewinnen
greening=Bei lange genug geringer Verschmutzung kann ein durch ESIR belasteter Baum schrittweise sein ursprüngliches Aussehen zurückgewinnen. Natürlich graue Bäume behalten ihre Naturfarbe. Erholung benötigt denselben lebenden Baum, die erwartete gespeicherte Farbstufe und anhaltend saubere Beobachtungen.\n\n[font=default-bold]Praktische Grenzen:[/font] Fällen, Ersetzen oder Zerstören beendet diese Erholungsmöglichkeit. Farberholung gehört zur Baumbelastung und ihren eigenen Aufzeichnungen. Sie ist unabhängig von Bodenerholung, Nachwuchs, Alterung und Verfall. Gesunder Boden verspricht keine Rückkehr früherer Bäume; ein sich erholender Baum beweist nicht die Erholungsfähigkeit aller benachbarten Flächen.
regrowth-heading=Wald breitet sich von überlebenden Bäumen aus
regrowth=Nach anhaltend sauberen Bedingungen kann ein geeigneter Wildbaum einen neuen unterstützten Baum in der Nähe aussäen. Erhaltene heimische Waldreste bilden den Ausgangspunkt. Der neue Baum muss zum Boden passen und Schutzprüfungen bestehen; auf Gaia wird die Art nach dem örtlichen Biom gewählt. Kulturpflanzen werden nie als Nachwuchsarten verwendet.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt zwanzig Minuten zwischen Wachstumsgelegenheiten aus zehn Minuten Basisintervall, vor Jahreszeiteneffekten und Verarbeitungsverzögerungen. Neue Positionen dürfen entlang jeder Kartenachse bis zu acht Felder entfernt liegen. Bei bereits 16 unterstützten Naturbäumen im Vier-Felder-Umfeld unterbleibt Wachstum. Zwischen erfolgreichen Neupflanzungen liegen oberflächenübergreifend mindestens zehn Sekunden.\n\n[font=default-bold]Praktische Grenzen:[/font] Der Wald breitet sich langsam örtlich aus. Eine isolierte Lichtung ohne geeigneten Samenbaum kann leer bleiben. Saubere Messungen, Platz und verfügbare Verarbeitung müssen zusammenkommen; ein Intervall verspricht nicht jedem Baum einen Nachkommen.
aging-heading=Lebende Bäume können zu Totholz werden
aging=Baumalterung kann einen unterstützten lebenden Nauvis-Baum durch heimisches Totholz ersetzen. Sie wirkt unabhängig von Verschmutzungsstress und kann auch grüne Bäume treffen. Deaktiviere Alterung, wenn lebende Bäume bis zu einer anderen Einwirkung bleiben sollen.\n\n[font=default-bold]Standardeinstellungen:[/font] Alterung ist aktiv. „Zurückhaltend“ ergibt zwei Stunden Grundintervall aus einer Stunde Basiswert; jahreszeitliche Aktivität beeinflusst den Zeitpunkt. Dies sind Gebietsprüfungen, keine jedem Baum fest zugewiesene Lebensdauer.\n\n[font=default-bold]Praktische Grenzen:[/font] Nur Nauvis besitzt derzeit einen unterstützten Totholzersatz. Schutzprüfungen gelten weiterhin. Der lebende Baum geht dauerhaft verloren; Farberholung bringt ihn nicht zurück. Alterung entzündet kein Feuer.
rot-heading=Totholz kann allmählich verschwinden
rot=Totholzverfall entfernt unterstützte tote Bäume mit der Zeit. Er räumt Waldreste ab, ersetzt sie aber nicht durch lebende Bäume. Nachwuchs kann unabhängig davon später neuen Wald schaffen. Alterung und Verfall lassen sich getrennt schalten.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ ergibt eine Stunde Grundintervall aus dreißig Minuten Basiswert. Intensität, jahreszeitliche Aktivität und Verarbeitungsabdeckung bestimmen, wann ein Gebiet erreicht wird.\n\n[font=default-bold]Praktische Grenzen:[/font] Entferntes Totholz wird nicht zur Wiederherstellung aufgezeichnet. Nicht unterstützte Arten, geschützte Orte und Kulturpflanzen sind ausgenommen. Verfall besitzt eine eigene Zeitplanung; verspätete Besuche holen keine verpassten Prüfungen nach.
thermal-heading=Ein verbrannter Baum kann beschädigten Boden hinterlassen
thermal=Ein durch geeigneten Feuerschaden getöteter Baum kann eine kleine Narbe um seine frühere Position hinterlassen. Der Boden folgt den Regeln seines Planeten und kann für spätere Erholung aufgezeichnet werden. Saubere Bedingungen können den Boden heilen, während der Baum verloren bleibt.\n\n[font=default-bold]Praktische Grenzen:[/font] Der Tod benötigt eine geeignete Feuerquelle; normale Bodenschutzregeln gelten weiter. Kampfbrände und spontane Vegetationsbrände können beide auslösen. Thermische Narben reagieren auf den Tod, entzünden aber keine neue Flamme. Ein geschützter Maschinenstandort kann deshalb trotz brennenden Nachbarbaums unverändert bleiben.
wildfire-heading=Wähle begrenztes oder sich ausbreitendes Feuer
wildfire=Industrieverschmutzung kann gelegentlich nahe unterstützten Wildbäumen Feuer entzünden. Das Gebiet benötigt mindestens die obere Verschmutzungsschwelle, geeigneten Brennstoff und einen ungeschützten Zündpunkt. Niedrigere Messwerte verhindern neue Anfragen, doch bereits angenommene Zündungen können noch warten. Die fünfminütige Schmutzbeobachtung des Bodens ist hierfür nicht nötig.\n\n[font=default-bold]Standardeinstellungen:[/font] „Begrenzt“ ist ausgewählt. „Zurückhaltend“ ergibt zwanzig Minuten Gefahrenintervall aus zehn Minuten Basiswert. Geeignete Gelegenheiten versuchen mit 1% Wahrscheinlichkeit eine Zündung; Jahreszeiten, geteilte Gefahrenzyklen und Abdeckung können weiter verzögern. Dies ist keine Chance pro Baum und Sekunde. Neue Zündungen sind oberflächenübergreifend auf eine je zehn Sekunden und 16 gespeicherte Brände begrenzt.\n\n[font=default-bold]Praktische Grenzen:[/font] „Begrenzt“ erzeugt eine nicht ausbreitende Bodenflamme für höchstens zehn Sekunden. „Ausbreitend“ startet einen normalen Factorio-Baumbrand; Folgeflammen können das geprüfte Gebiet verlassen und außerhalb der Skriptbudgets Rechenzeit beanspruchen. Abschalten der Ökologie entfernt eigene begrenzte Flammen, lässt fremde Kampfbrände und Folgeflammen aber bestehen. Eine Brandmeldung bestätigt die Zündung, nicht einen verbrannten Wald.
flood-heading=Wasser kann ein sandiges Ufer überfluten
flood=Auf Nauvis kann Überschwemmung geeigneten sandigen Uferboden neben unterstütztem Süßwasser in Wasser verwandeln. Es entstehen kleine lokale Uferänderungen. Lava-, Öl- und Ammoniakmeere sowie beliebiger Boden fern geeigneter Ufer sind ausgenommen.\n\n[font=default-bold]Standardeinstellungen:[/font] Jede Überschwemmungsgelegenheit besitzt 2% Wahrscheinlichkeit. Zeitpunkt: Gefahrenintervall, Intensität, Jahreszeit und Verarbeitungsabdeckung. Regen, geringe Verschmutzung und sichtbares Wetter sind nicht erforderlich.\n\n[font=default-bold]Praktische Grenzen:[/font] Ein geeignetes Ufer direkt nördlich, südlich, östlich oder westlich erlaubt die Anfrage. Vor jeder Änderung werden zulässige Boden-Wasser-Umwandlung und Schutz erneut geprüft. Aufgezeichnete Überschwemmung kann bei gültigem Datensatz heilen; Abschalten allein entwässert nicht sofort. Dies ist örtliche Uferbewegung, keine globale Meeresspiegelsimulation.
drought-heading=Wasser kann von einem sandigen Ufer zurückweichen
drought=Auf Nauvis kann Dürre geeignetes Süßwasser neben sandigem Ufer in Sand verwandeln und etwas Boden freilegen. Andere Planetenflüssigkeiten und Wasser ohne die erforderliche Ufernachbarschaft sind ausgenommen.\n\n[font=default-bold]Standardeinstellungen:[/font] Jede Dürregelegenheit besitzt 2% Wahrscheinlichkeit. Der Zeitpunkt folgt Gefahrenintervall, Intensität, Jahreszeit und Verarbeitungsabdeckung; hohe Verschmutzung oder bestimmtes Wetter sind nicht zusätzlich nötig.\n\n[font=default-bold]Praktische Grenzen:[/font] Infrastruktur, aktive Ressourcen und besondere Orte bleiben geschützt. Wartende Änderungen können vor Ausführung unzulässig werden. Überschwemmung und Dürre sind getrennt schaltbar und erlauben gegensätzliche lokale Änderungen über die Zeit. Weder Temperatur noch Regen werden simuliert; ein sofortiger Wechsel zwischen Fluten und Trocknen wird nicht erzwungen.
cliff-heading=Verwitterung kann gewöhnliche Klippen abtragen
cliff=Klippenverwitterung kann unterstützte gewöhnliche Klippen nach Prüfung benachbarter Schutzbereiche dauerhaft entfernen. Deaktiviere sie, wenn Klippen bis zu deiner eigenen Entfernung bestehen bleiben sollen.\n\n[font=default-bold]Standardeinstellungen:[/font] Eine Verwitterungsgelegenheit besitzt 1% Wahrscheinlichkeit. Verschmutzungseinwirkung, Regen, Kampfschaden oder gemessenes Klippenalter sind nicht erforderlich.\n\n[font=default-bold]Praktische Grenzen:[/font] Besondere planetare Klippenfamilien ersetzen keine unterstützten gewöhnlichen Klippen. Nahe Infrastruktur oder geschützte Orte können die Entfernung auch nach dem Auffinden verhindern. Bodenerholung baut entfernte Klippen nicht wieder auf.
calendar-heading=Ein Kalender für jede Welt
calendar=Jede unterstützte Welt besitzt einen Jahreszeitenkalender. Weiter vom Stern entfernte Welten haben anhand ihrer Sternkartenentfernung gewöhnlich längere Jahre. Der Kalender ordnet Jahreszeiteneffekte; er bewegt keine Planeten und ändert keine Reiserouten. Ansteigende, hohe, fallende und niedrige Jahreszeit benennen vier Abschnitte, ohne bestimmtes Wetter zu versprechen.\n\n[font=default-bold]Standardeinstellungen:[/font] Das Referenzjahr umfasst 360 Nauvis-Tage anhand der beim Kalenderstart gespeicherten effektiven Tageslänge. Die planetare Jahreslänge ergibt sich aus dieser Referenz mal relativer Entfernung zu Nauvis hoch 1.5. Die Sternkartenausrichtung bestimmt die Anfangsphase. Spätere Änderungen der Nauvis-Tagessteuerung definieren die Referenz nicht laufend neu.\n\n[font=default-bold]Kalendernutzung:[/font] Das Administrationsfenster zeigt Referenztage, entsprechende lokale Tage und Simulationsdauer. Änderungen der Jahreslänge erhalten die Jahreszeitenposition. Administratoren können diese Position auch zur Vorschau verändern.
daylight-heading=Der Tageslichtanteil ändert sich, nicht die Tageslänge
daylight=Jahreszeitliches Tageslicht verlängert oder verkürzt den hellen Anteil eines bestehenden Planetentages. Sonnenauf- und -untergang verschieben sich, die volle Rotationsdauer bleibt gleich. Das verändert die Beleuchtungsdauer von Solarmodulen; die Dämmerungsdauer bleibt erhalten.\n\n[font=default-bold]Standardeinstellungen:[/font] Gilt für Nauvis, Gaia, Vulcanus, Gleba und Aquilo. Angenommene Achsenneigung: 23.5 Grad; Breitengrad: 45 Grad. Auch bei Extremwerten bleiben mindestens 2% voller Tag und 2% volle Nacht.\n\n[font=default-bold]Praktische Grenzen:[/font] Eingefrorenes oder dauerhaftes Tageslicht pausiert Jahreszeitenanpassungen. ESIR weicht Diurnal Dynamics oder anderen Steuerungen derselben Dämmerungswerte. Beim Abschalten werden Ursprungswerte nur wiederhergestellt, wenn die letzte eigene Anpassung noch unverändert ist. Fulgoras unabhängige Tagessteuerung bleibt allein zuständig; ihre Grenzen werden niemals angepasst oder zurückgesetzt.
modulation-heading=Jahreszeiten können das Tempo der Ökologie ändern
modulation=Jahreszeitliche Aktivität verändert die Häufigkeit von Bodenänderungen, Baumeffekten, Gefahren und Narbengelegenheiten aktiver Erzförderer. Sie funktioniert auch ohne jahreszeitliches Tageslicht oder bei fremder Lichtsteuerung, einschließlich Fulgora. Das Tempo verändert nicht die Erfolgschance je Gelegenheit.\n\n[font=default-bold]Standardeinstellungen:[/font] Stärke: 25%. Die Rate steigt zur hohen Jahreszeit gleichmäßig auf 125% der gewählten Grundintensität und sinkt zur niedrigen auf 75%. Höhere Raten verkürzen Intervalle, niedrigere verlängern sie.\n\n[font=default-bold]Praktische Grenzen:[/font] Jahreszeiten aktivieren keine abgeschalteten Gefahren, ändern keine sauberen oder verschmutzten Beobachtungsanforderungen und nicht das normale Bodenerholungsintervall. Wachstum braucht weiterhin saubere Messungen, Samenbaum, Platz und Verarbeitungskapazität. Der Kalender bewegt keine Planeten und färbt nicht die ganze Welt um. Ein winterfarbener Startknopf zeigt einen Zustand, verspricht aber keinen Schnee.
nauvis-heading=Nauvis: Boden, Sand und Wald
nauvis=Nauvis-Boden kann Gras, Erde, Wüste und Sand durchlaufen. Erholung führt aufgezeichnete Flecken zum exakten Ursprung zurück. Unterstützte heimische Bäume können Belastung zeigen, Farbe zurückgewinnen und nachwachsen. Nauvis unterstützt Süßwasseruferänderungen und als einzige Welt den Alterungsersatz lebender Bäume durch Totholz.\n\n[font=default-bold]Praktische Grenzen:[/font] Gepflasterte Fabrikflächen, aktive Ressourcen, Infrastruktur und besondere Orte bleiben geschützt. Geeignete Pflasterkorrosion ist die ausdrückliche Ausnahme für freiliegendes Pflaster.
gaia-heading=Gaia: den Charakter der Landschaft bewahren
gaia=Gaias Wiesen und Feuchtgebiete können sich bis zu freiem Gaia-Gestein verschlechtern. Erholung verfolgt gespeicherte Geländevarianten zurück; Nachwuchs wählt Bäume passend zum lokalen Biom. Von ESIR platzierte besondere Orte besitzen Schutzbereiche gegen gewöhnliche Ökologiearbeit.\n\n[font=default-bold]Praktische Grenzen:[/font] In älteren Spielständen helfen erhaltene Ortsmarkierungen bei der Schutzzuordnung. Noch geprüfte Gebiete oder Bereiche mit übergelaufenen alten Schutzaufzeichnungen können für Änderungen gesperrt bleiben. Ohne unterscheidbare Markierungen lassen sich exakte frühere Ortsgrenzen nicht rekonstruieren.
vulcanus-heading=Vulcanus: Veränderungen in Asche und Vulkanboden
vulcanus=Vulcanus verwendet eigene Veränderungen von Asche, Vulkanboden und rissigem Gelände. Lava bleibt geschützt; Baumeffekte betreffen nur unterstützte heimische Arten. Fumarolen behalten ihren getrennten Bevölkerungs-, Vorrats- und Geländezyklus.\n\n[font=default-bold]Praktische Grenzen:[/font] Ökologie übernimmt keine Fumaroleneffekte, führt keine gewöhnlichen irdischen Wälder ein und verwandelt Vulkanflüssigkeiten nicht in Süßwasser.
gleba-heading=Gleba: Sporen brauchen eine andere Behandlung
gleba=Gleba behält seine biomspezifischen Bodenänderungen und unterstützten Wildbaumhabitate einschließlich Feuchtgebietsregeln. Kulturpflanzen und ihre Spezialböden, aurische Flora und zugeordnete Becken bleiben geschützt. Sporen sind eine andere Schadstoffart und gelten nicht als giftige Industrieverschmutzung.\n\n[font=default-bold]Praktische Grenzen:[/font] Reine Sporenmessungen gelten weder als verschmutzte noch als nachweislich saubere Industriebedingungen. Sporen allein erlauben daher keine verschmutzungsbedingten Bodenschäden, normale Erholung, Baumbelastung oder Farberholung, natürlichen Nachwuchs oder Verschmutzungsbrände. Geeigneter Bergbau, Brandnarben, Bluteffekte, unabhängige Gefahren und Kalender bleiben möglich. Ein aktivierter Schalter macht Sporen nicht zu einem gültigen Industriemesswert.
fulgora-heading=Fulgora: sein Tag bleibt unabhängig
fulgora=Fulgoras unterstützter Boden kann Fels, Sand, Staub und Dünen durchlaufen; Ölmeere bleiben geschützt. Der Ökologiekalender kann zulässige Effekte beschleunigen oder verlangsamen und den mechanischen Baumknopf einfärben. Es gibt keine unterstützte heimische Waldfamilie für gewöhnlichen Baumnachwuchs.\n\n[font=default-bold]Praktische Grenzen:[/font] Die unabhängige Fulgora-Tagessteuerung beherrscht weiterhin das Tageslicht. Jahreszeitliches Tageslicht liest, verändert oder restauriert Fulgoras Dämmerungsgrenzen niemals, auch bei globalen Ökologie- oder Kalenderänderungen.
aquilo-heading=Aquilo: Schnee und Eis um eine geschützte Fabrik
aquilo=Aquilo besitzt eigene Schnee- und Eisänderungen mit aufgezeichneter Rückverfolgung zur Erholung. Ammoniakmeere, Fundamente und Infrastruktur bleiben geschützt. Jahreszeitliches Tageslicht kann den hellen Tagesanteil ändern, ohne die Rotation zu verändern.\n\n[font=default-bold]Praktische Grenzen:[/font] Keine unterstützte heimische Waldfamilie erlaubt gewöhnliche Bäume auf Aquilo. Ökologie simuliert kein allgemeines Gefrieren, Tauen oder Umwandeln von Meeren.
settings-heading=Globale Einstellungen und örtliche Ausnahmen wählen
settings=Der Integrationsschalter beim Spielstart stellt Ökologie bereit. Unter Mod-Einstellungen → Karte findest du Funktionen, Verschmutzungsschwellen, Intervalle, Chancen, Planetenaktivierung und Verarbeitungsgrenzen. Administratoren können unter „Gelände und Ökologie“ unterstützte Werte bestehender Oberflächen überschreiben. „Auf geerbte Werte zurücksetzen“ entfernt die örtliche Ausnahme. Planetenauswahl und Berichte erstellen keine Oberfläche.\n\n[font=default-bold]Praktische Grenzen:[/font] Globale Werte, Planetenregeln und örtliche Vorgaben wirken zusammen. Hauptabschaltung, ungeeignetes Gelände und Schutz haben Vorrang. Aktualisierungen erhalten gespeicherte Einstellungen. Abschalten der Erholung pausiert sie, stellt Boden aber nicht sofort wieder her. Andere abgeschaltete Effekte erstatten keine zerstörten Bäume, Klippen oder Pflaster. Abschalten der Startintegration restauriert Tageslicht nur dort, wo die letzte ESIR-Anpassung noch unverändert ist.
presets-heading=Intensität bestimmt das Tempo, Verarbeitung die Abdeckung
presets=Intensität regelt die Häufigkeit ökologischer Gelegenheiten. Verarbeitung bestimmt, wie viel Gelände geprüft und wie schnell wartende Arbeit erledigt wird. Mehr Verarbeitung hilft stark belasteten oder weit erkundeten Karten, erhöht aber keine konfigurierte Erfolgschance je Prüfung.\n\n[font=default-bold]Standardeinstellungen:[/font] „Zurückhaltend“ verwendet Faktor 0.5, „Standard“ 1, „Streng“ 2; „Benutzerdefiniert“ deinen Wert. Höhere Intensität aktiviert keine abgeschalteten Funktionen. Verarbeitung startet mit „Sparsam“. Es gibt „Extrem niedrig“, „Niedrig“, „Sparsam“, „Ausgewogen“, „Detailliert“, „Hohe Detailtreue“, „Sehr hohe Detailtreue“ und „Benutzerdefiniert“. „Sparsam“ verarbeitet alle 16 Ticks eine kleine Charge mit einer Entitätensuche je 32 Ticks.\n\n[font=default-bold]Praktische Grenzen:[/font] Verarbeitung und Speichergrenzen werden über alle Oberflächen geteilt; auch benutzerdefinierte Budgets bleiben endlich. Niedrigere Speichergrenzen erhalten bestehende Datensätze und blockieren neue bis Platz frei wird. Volle Erholungsspeicher verhindern neue reversible Schäden, statt alte Erholungspfade zu vergessen. Größere Budgets kosten mehr Rechenzeit; keines garantiert bestimmte UPS.
reports-heading=Den Bericht der betrachteten Welt lesen
reports=Der mechanische Kupferbaum oben links öffnet den Ökologiebericht der betrachteten Oberfläche, auch in Fernansicht. Seine Blätter folgen dem Kalender: limettengrün bei ansteigender, smaragdgrün bei hoher, bernsteinrot bei fallender und cyan bei niedriger Jahreszeit. Der Hinweistext nennt die Jahreszeit. Ohne nutzbaren Kalender bleibt er smaragdgrün und meldet fehlende Jahreszeitendaten.\n\n[font=default-bold]Berichtsnutzung:[/font] „Einfach“ beschreibt beobachteten Boden, Wald, Bergbaustörungen und Jahreszeiten als Feldbericht. „Erweitert“ ergänzt wirksame Oberflächeneinstellungen, Messungen, Warteschlangen, Schutzablehnungen und Wartungsstand und trennt sie von globalen Grenzen und Zählern. Unbeobachtet bedeutet unbekannt, nicht gesund.\n\nDer offene Bericht aktualisiert bereits gesammelte Fakten. Schließen beendet diese Berichtsaktualisierungen. Die getrennte Farbprüfung des Startknopfes darf ohne Geländesuche weiterlaufen.
alerts-heading=Gewünschte Änderungsmeldungen auswählen
alerts=Ökologiemeldungen erscheinen im normalen Factorio-Alarmfenster mit Symbolen und besuchbaren Positionen. Der Reiter „Meldungen“ und Mod-Einstellungen → Pro Spieler ändern dieselben persönlichen Vorlieben. Eine Meldung bestätigt einen tatsächlich eingetretenen Effekt, keine bloß geplante Prüfung.\n\n[font=default-bold]Standardeinstellungen:[/font] Meldungen für Vegetationsbrand, Überschwemmung, Dürre, Klippenverwitterung und Pflasterkorrosion sind aktiv. Verschmutzungsschäden, Erholung, Bergbau und Baumeffekte starten deaktiviert und sind einzeln wählbar. Alle tatsächlichen Oberflächen sind ausgewählt; „nur aktuelle Oberfläche“ ist ein zusätzlicher Filter. Normale Tageslichtanpassungen erzeugen keinen Alarm.\n\n[font=default-bold]Praktische Grenzen:[/font] Deine Partei muss den Ereignis-Chunk aktuell sehen; frühere Erkundung reicht nicht. Administratoren können diese Sichtbedingung umgehen, Kategorien und Oberflächenfilter gelten aber weiter; bei Entzug der Rechte entfällt die Ausnahme. Nahe Vorfälle werden zusammengefasst, höchstens vier Ökologiemeldungen pro Spieler gehalten. Ein Vorfall bleibt 60 Sekunden meldefähig. Offlinevorfälle werden nicht nachgeliefert. Abgelaufene Meldungen löschen weder Erholungsdaten noch wartende Abbauarbeit.
maintenance-heading=Was das Wiederaufbaufenster zeigt
maintenance=Das ESIR-Wiederaufbaufenster zeigt endliche Vorbereitung und Reparatur: alte Speicherdaten umwandeln, erste Erfassung, geänderte Konfiguration prüfen und Daten reparieren. Aufträge können warten, solange ihre Oberflächen deaktiviert oder anderweitig blockiert sind. Bei unbekanntem Gesamtumfang erscheint erledigte Arbeit ohne erfundenen Prozentsatz.\n\n[font=default-bold]Praktische Grenzen:[/font] Eine Ersterfassung fixiert ihre Oberflächenliste beim Start. Jeder Oberflächendurchlauf endet ohne weitere Chunks oder bei 100.000 Chunk-Besuchen. Das Erreichen der Grenze bedeutet ungeprüfte Gesamtabdeckung, nicht eine vollständig geprüfte Karte.\n\nLaufende Beobachtung, Erholung, Fördererprüfungen und angenommene Abbaunarben erscheinen unabhängig unter „Erweitert“ und halten das Wiederaufbaufenster nicht endlos offen. Alte Spielstände werden schrittweise vorbereitet; erneutes Öffnen oder Aktivieren holt keine verpassten Gelegenheiten nach.
troubleshooting-heading=Wenn sich die Landschaft scheinbar nicht verändert
troubleshooting=Prüfe unter „Erweitert“ die betrachtete Oberfläche: Ist ihre Ökologie wirksam aktiviert und die Welt unterstützt? Gibt es geeigneten Boden oder Bäume, erforderliche nutzbare Schadstoffmessungen, genügend durchgehende Beobachtung und keine Schutzbereiche? Prüfe anschließend wartende Arbeit und volle Speichergrenzen. Ruhige Gebiete brauchen bei niedrigen Chancen und langen Intervallen oft mehr Zeit.\n\n[font=default-bold]Hilfreiche Prüfungen:[/font] Boden am Ende seiner Änderungsfolge kann nicht weiter verfallen. Nachwuchs benötigt einen überlebenden unterstützten Samenbaum. Bergbaunarben brauchen echte endliche Erschöpfung im geeigneten Förderbereich oder einen zulässigen arbeitenden Förderer. Feuer braucht Industrieverschmutzung, geeigneten Brennstoff und den gewünschten begrenzten oder ausbreitenden Modus. Ein erfolgreicher Versuchszähler allein beweist keine Zündung. Erholung braucht ursprüngliche ESIR-Daten; Abbauerholung beide Erholungsschalter.\n\n[font=default-bold]Praktische Grenzen:[/font] ESIR ist mit TerrainEvolution und TerrainEvolution2 nicht kompatibel; ESIR überlässt Diurnal Dynamics das Jahreszeitentageslicht. Mehr erkundetes Gelände und aktive Oberflächen benötigen bei gleichem globalem Budget länger. Unbekannte Messungen oder verspätete Prüfungen beweisen weder gesunden Boden noch einen Defekt.
