menu_auric_inoculation_vat=Aurische Impfbottiche
title_auric_inoculation_vat=Aurische Impfbottiche
auric-inoculation-vat=Aurische Impfbottiche
auric-inoculation-vat-text=Glebas [entity=ei-auric-inoculation-vat] nutzt keine bereits vorhandenen [entity=ei-auric-cyst-node]. Er beansprucht ein zusammenhängendes Feuchtgebietsbecken und macht daraus einen Chargenprozess, der später neue Knoten hervorbringt.\n\n[font=default-bold]Platzierung und Beckenzuordnung:[/font] Diese Bottiche sind für Gleba bestimmt. Platziere sie so, dass ihr Zuordnungsbereich genügend Sumpffelder für ein Becken erreicht. Ein gültiges Becken benötigt 24-160 zusammenhängende Feuchtgebietsfelder; größere Sümpfe müssen verkleinert oder geteilt werden. Kein Becken darf mit einem anderen Bottich geteilt werden. Überlappende Bereiche erzeugen Zuordnungskonflikte; ohne gültiges Becken fehlt eine stabile Grundlage zur Beimpfung.
auric-inoculation-vat-2=Zykluszutaten und Größenstufen
auric-inoculation-vat-text-2=Der Bottich durchläuft [font=default-bold]Beimpfung -> Flutung -> Gärung (optional mit Bioflux angereichert) -> Entleerung -> Blüte -> Ruhe[/font]; er ist kein passiver Sumpfentwässerer. Die Beimpfung verbraucht [item=spoilage] und [fluid=ei-bio-oil], die Flutung [fluid=ei-dirty-water] und die Gärung [item=jelly] und [item=yumako-mash]. Während des Anreicherungsfensters schaltet zugeführtes [item=bioflux] den laufenden Gärvorgang auf angereicherte Gärung um, bevor der Bottich entleert wird und blüht.\n\nDie Beckengröße bestimmt die aktive Stufe: b1 bei 24-39 zugeordneten Feldern, b2 bei 40-55, b3 bei 56-71, b4 bei 72-87, b5 bei 88-103, b6 bei 104-127 und b7 bei 128-160. Dieselben Stufen begrenzen lebende Zystenknoten im Becken auf 3, 4, 6, 8, 10, 12 und 14. Höhere Stufen ermöglichen mehr Blüteertrag, verlangen aber mehr Wasserverarbeitung und eine stabilere Reagenzienversorgung über den gesamten Zyklus.
auric-inoculation-vat-3=Vitalität, Verunreinigung und Blütenversagen
auric-inoculation-vat-text-3=Jeder Zyklus wägt [font=default-bold]Vitalität[/font] gegen [font=default-bold]Verunreinigung[/font] ab. Gesunde Beckenflächen, versorgte Phasen und beherrschbarer Stufendruck erhalten die Vitalität. Versorgungsmangel, verstopfte Abläufe, Zuordnungskonflikte und überbeanspruchte Sumpffelder erhöhen die Verunreinigung und belasten den Bottich.\n\nErreicht die Verunreinigung die Versagensschwellen, bricht die Blütenstabilität zusammen. Der Bottich verschlechtert Beckenfelder und fällt in Richtung Ruhephase zurück. Wechselt die Konsole wiederholt von stabil zu belastet, verkleinere die Beckenfläche oder verbessere die Versorgung, bevor der Sumpf unter der Maschine stirbt.
auric-inoculation-vat-4=Zystenwäsche, Schmutzwasserrückgewinnung und Telemetrie
auric-inoculation-vat-text-4=Ein erfolgreicher Bottich erzeugt später neue [entity=ei-auric-cyst-node]. Baue sie für [item=ei-auric-cyst] ab und nutze [recipe=ei-auric-cyst-washing], um verwertbare Produkte zu gewinnen und einen Anteil [fluid=ei-dirty-water] in Glebas Wasserkreislauf zurückzuführen. Die Entleerungsphase des Bottichs liefert [fluid=ei-dirty-water] und gelegentlich [fluid=ei-acidic-water]; diese Ausgänge müssen vor der nächsten Phase frei werden. Ein blockierter Ablauf hält den Bottich fest und steigert die Verunreinigung, bis die Rohrleitung wieder aufnimmt.\n\nSchaltungstelemetrie macht den Sumpf lesbar. Der Bottich kann [virtual-signal=ei-auric-vat-vigor], [virtual-signal=ei-auric-vat-contamination], [virtual-signal=ei-auric-vat-band], [virtual-signal=ei-auric-vat-claims] und [virtual-signal=ei-auric-vat-bloom] ausgeben. Vergleiche damit Beckenflächen, löse bei Konflikten oder Versagen Alarm aus und erkenne, wann Wäsche und Ablauf mit der nächsten Beckenstufe wachsen müssen.
