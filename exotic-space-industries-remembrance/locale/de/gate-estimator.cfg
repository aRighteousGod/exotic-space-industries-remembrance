[gate-estimator]
route-snapshot=Feste Route aus Torwerten
power-draw=Leistungsaufnahme
title=Tor-Rechner
close=Schließen
help-launch=Öffnet einen unabhängigen Rechner. Einstellungen und Fracht des Tors bleiben unverändert.
snapshot=Torwerte übernehmen
help-snapshot=Übernimmt Energie, Belastung, Abklingzeit, Qualität und Route. Gewählte Fracht und Zufuhrraten bleiben erhalten.
reset=Annahmen zurücksetzen
help-reset=Startbereit: volle Energie, keine Belastung oder Abklingzeit, 1 Gegenstand/s und 1 GW Versorgung. Das echte Tor bleibt unverändert.
item=Gegenstand
help-item=Beliebigen verfügbaren Gegenstand auswählen. Es wird nichts verbraucht. Die Frachtqualität beeinflusst die Energiekosten nicht.
batch=Stapelgröße / maximale Einlage
help-batch=Menge für die Einzelberechnung und maximale Einlage je Simulationstick. Das Tor versendet vorhandene Stapel ohne auf diese Menge zu warten; Einlagen können sich vereinigen.
stress=Belastung
help-stress=Anfangsbelastung von 0–100. Sinkt um 1/s. Erhöht Unterhalt und Abklingzeit, nicht die unmittelbaren Transportkosten.
quality=Senderqualität
help-quality=Die Qualität des sichtbaren Senders multipliziert Transport- und Unterhaltsenergie mit 1 / (1 + 0,2 × Qualitätsstufe). Fracht- und Empfängerqualität ändern diesen Faktor nicht.
from=Senderplanet
to=Empfängerplanet
help-route=Zwei gewählte Planeten fixieren den Abstand auf ihre Sternkartenentfernung. Gleicher Planet bedeutet gleiche Oberfläche. Einen Planeten löschen, um den Abstand manuell zu wählen. Es werden keine Oberflächen erzeugt.
local=Gleiche Oberfläche
orbital=Gleicher Ort, andere Oberfläche
distance=Interplanetarer Abstand
unknown=Unaufgelöster Oberflächenwechsel
help-distance=Sternkartenentfernung, keine Felder oder Flugstrecke. Gleiche Oberfläche ×0,15; gleicher Ort mit anderer Oberfläche ×2,5; unaufgelöst ×3.
rate=Angebotene Zufuhr
help-rate=Konstante angebotene Zufuhr. Blockierte Gegenstände warten vor dem Tor. Die tatsächliche Lieferung kann niedriger sein. Bruchteile sammeln sich zu ganzen Gegenständen.
per-second=Gegenstände/Sekunde
per-minute=Gegenstände/Minute
power=Verfügbare Leistung
help-power=Angenommene konstante Versorgung, kein Messwert des Stromnetzes. Ladegrenze und freier Energiespeicher begrenzen die Aufnahme.
initial-state=Anfangszustand
help-initial-state=Bearbeitbare Torwerte. Simulierte Fracht und Warteschlange beginnen leer. Das echte Tor bleibt unverändert.
energy=Gespeicherte Energie (GJ)
help-energy=Anfangsenergie. Ein Tor benötigt mindestens 100 GJ zum Betrieb und genügend Energie für den gesamten nächsten Stapel.
cooldown=Abklingzeit (s)
help-cooldown=Verbleibende Anfangsabklingzeit in Spielsekunden. Automatische Einlage und Transport pausieren. Erst die nächste Toraktualisierung öffnet den Eingang wieder.
saturation=Empfängersättigung
help-saturation=Anfangswert 0–100. Bei 100 pausiert der Transport; Einlagen bleiben möglich. Erholt sich um 1,5/s. Ausgabe und Rückstände werden automatisch entfernt.
calculation=Berechnung
projections=Prognosen
burden=Transportlast
help-burden=Gewicht aus der Tor-Massetabelle × Anzahl. Nicht aufgeführte Gegenstände haben Gewicht 1. Dies ist kein Raketengewicht.
distance-factor=Abstandsfaktor
help-distance-factor=Interplanetar: 2,5 + 5,5 × (Abstand / größter Sternkartenabstand)^0,6. Auf die installierte Sternkarte begrenzt. Spannweitenanteil = (Faktor − 0,15) / 7,85.
quality-factor=Qualitätsfaktor
help-quality-factor=Nur Senderqualität senkt den Energiebedarf. Zusätzliche Qualitätsstufen verwenden dieselbe Formel.
toll=Transportenergie
help-toll=Die überproportionale Lastkurve macht große Stapel pro Gegenstand teurer. Erst das vollständige Produkt aus Lastenergie, Abstand und Qualität wird abgerundet.
per-item=Transportenergie je Gegenstand
help-per-item=Energie dieses Transports geteilt durch seine Anzahl, ohne Unterhalt. Der Preis hängt von der Stapelgröße ab.
stress-result=Zusätzliche / resultierende Belastung
help-stress-result=Je Transport höchstens 35 zusätzliche Belastung; Gesamtgrenze 100. Ab 75 zeigt die Konsole außerhalb der Abklingzeit Kritisch.
cooldown-result=Abklingzeit nach Transport
help-cooldown-result=Verwendet die resultierende Belastung. Tickanteile werden vor der Sekundenumrechnung getrennt abgerundet. Aktualisierung, Energie oder Empfänger können zusätzlich verzögern.
saturation-result=Zusätzliche / resultierende Sättigung
help-saturation-result=Transportlast fügt höchstens 20 Sättigung hinzu, bis maximal 100. Senderqualität verringert diese Belastung nicht.
upkeep-result=Unterhalt nach / vor Transport
help-upkeep-result=Betriebsbereit: 30 MW + 1,5 MW je Belastungspunkt + 30 MW während der Abklingzeit, multipliziert mit dem Qualitätsfaktor. Inaktive oder unterversorgte Tore zahlen keinen Skriptunterhalt.
hardware=Speicher: __1__ GJ · Ladegrenze: __2__ MW · Aktualisierung: __3__ s
help-hardware=Native Hardwaregrenzen und festes Aktualisierungsintervall aus Toranzahl und Aktualisierungsbudget. Änderungen am Torbestand können die tatsächliche Taktung verändern.
fallback=Dieser Gegenstand fehlt in der Tor-Massetabelle; Gewicht 1 wird verwendet.
assumptions=Ein aktiver Sender, ein Gegenstand, ein Empfänger. Ausgabe und Rückstände werden entfernt; keine weiteren Sender. Zeitangaben sind Spielzeit.
help-assumptions=Modelliert Sättigung, Unterhalt, Stapelvereinigung, Abklingzeit und Bezahlbarkeit. Ohne Verderb, Schäden, Schaltungsänderungen, Greiferbewegung, Netzkonkurrenz oder bewegte Plattformrouten.
run=Prognose starten
help-run=Berechnet Szenario und Vergleich. Begrenzte, abbrechbare Rechenarbeit. Änderungen markieren bestehende Diagramme als veraltet.
minutes=__1__ Min.
help-horizon=Dauer in Spielminuten. Der Vergleich verwendet dieselbe Zeitspanne.
pin=Vergleich merken
clear-baseline=Vergleich löschen
help-pin=Speichert ein unabhängiges Szenario samt Anfangszustand. Durchgezogen: aktuell; gestrichelt: Vergleich. Nach Änderungen erneut berechnen.
baseline=Vergleich
pinned=Vergleich gespeichert
no-baseline=Kein Vergleich
legend=Cyan: erste Reihe · Orange: zweite Reihe · Durchgezogen: aktuell · Gestrichelt: Vergleich
help-chart=Energie: GJ, rote Grenze 100 GJ. Belastung: Sender / Empfänger, rote Grenze 75. Abklingzeit: Restzeit / Transportintervall. Durchsatz: geliefert / angeboten. Warteschlange: vor / im Tor. Leistung: Transport / Unterhalt. Senkrechte Bereiche zeigen Extremwerte.
throughput=Durchsatz
queue=Wartende Fracht
axis=0–__1__ __2__ · Zeit 0–__3__ s
unit-1=GJ
unit-2=%
unit-3=s
unit-4=Gegenstände/s
unit-5=Gegenstände
unit-6=MW
sample=__1__–__2__ s: __3__
help-sample=Zeitcursor verschieben. Angezeigt werden Endwert [Minimum–Maximum] im Zeitabschnitt. Durchsatz und Leistung sind Intervallmittelwerte.
summary=Geliefert: __1__ · Mittel: __2__ Gegenstände/s\nDavor: __3__ · Im Tor: __4__\nTransport: __5__ GJ · Unterhalt: __6__ GJ · Mittlere Leistung: __7__ MW\nMinimale Energie: __8__ GJ · Maximale Belastung: __9__\nWartezeit — Abklingzeit: __10__ s; Energie: __11__ s; Empfänger: __12__ s\nErzeugte Rückstände: __13__
help-summary=Warteursachen können sich überlappen und dürfen nicht addiert werden. Energie zeigt nur tatsächlichen Verbrauch. Rückstände werden gezählt und entfernt. Wartende Gegenstände gehen nicht verloren.
difference=Aktuell − Vergleich: __1__ gelieferte Gegenstände; __2__ GJ Verbrauch
help-status=Einzelberechnungen ändern sich sofort. Diagramme zeigen den letzten Lauf, bis sie als veraltet markiert werden. Kein echter Torzustand wird verändert.
running=Berechnung läuft…
stale=Prognose veraltet — erneut starten
ready=Prognose bereit
invalid=Eine endliche Zahl innerhalb des erlaubten Bereichs eingeben.
missing-prototype=Gegenstand, Qualität oder Planet nicht verfügbar. Ersatz auswählen.
too-expensive=Dieser Stapel kostet mehr Energie als das Tor speichern kann. Das Tor teilt Stapel nicht passend zur verfügbaren Energie.
