[mod-setting-description]
ei-factory-passage-circuit-scanner-enabled=Standardm??ig ausgeschaltet. Prüft unbeaufsichtigte Montagemaschinen mit nativer Rezeptwahl per Schaltung. Bei deaktiviertem Scanner können Rohrverbindungen bis zum nächsten Ereignis oder expliziten Aktualisierungsaufruf veraltet bleiben. Geöffnete Maschinenfenster und ereignisgesteuerte Aktualisierungen bleiben aktiv. Wirkt beim nächsten Verarbeitungsschritt ohne Neuaufbau. Nur im ESIR-Rohrmodus aktiv; deaktivierte Fabrikdurchgänge oder Squeak Through 2 haben Vorrang.
ei-factory-passage-circuit-scan-budget=Zusätzliche Scanversuche pro Tick für den gesamten Spielstand (1–1.024; Standard 1), unabhängig vom allgemeinen Aktualisierungsbudget. Nach einer erfolgreichen Rezeptprüfung oder abgeschlossenen Aktualisierung wartet jede Maschine mindestens 60 Ticks auf den nächsten Hintergrundscan. Kleine Werte begrenzen die Skriptarbeit, verzögern aber Kollisionsänderungen; höhere Werte arbeiten Rückstände schneller ab und können mehr Tickzeit kosten. Keine Millisekundengarantie. Ohne Neustart änderbar; der Wert bleibt bei ausgeschaltetem Scanner gespeichert.
ei-factory-passage-update-budget=Maximale Anzahl eingereihter Aufgaben pro Tick (1–1.024; Standard: 256). Niedrigere Werte verringern die Skriptlast, verzögern aber Aktualisierungen der Rohrkollision. Höhere Werte arbeiten die Warteschlangen schneller ab und können die Rechenzeit pro Tick erhöhen. Gilt sofort für alle Oberflächen, ohne Neustart. Die anfängliche Welterfassung und das Entfernen von Kollisionshilfen erfolgen synchron und werden durch diese Einstellung nicht begrenzt. Außerhalb des Rohrmodus ESIR, bei deaktivierten Fabrikdurchgängen oder wenn Squeak Through 2 Vorrang hat, ist diese Einstellung inaktiv.
ei-factory-passage-enabled=Ermöglicht Durchgänge zwischen unterstützten, direkt aneinandergebauten Anlagen. Beim Ausschalten werden alle Durchgangsänderungen von ESIR deaktiviert; die Auswahl der Kategorien bleibt gespeichert.
ei-factory-passage-production=Ermöglicht Durchgänge zwischen benachbarten Produktionsmaschinen, Erzförderern, Laboren und ähnlichen Anlagen.
ei-factory-passage-power=Ermöglicht Durchgänge zwischen benachbarten Generatoren, Heizkesseln, Reaktoren, Akkumulatoren, Solarmodulen und elektrischen Anlagen.
ei-factory-passage-logistics=Ermöglicht Durchgänge zwischen benachbarten Lagern, Greifarmen, Schaltungsgeräten, Effektverteilern, Radaren, Roboterhangars und Zughaltestellen.
ei-factory-passage-turrets=Ermöglicht Durchgänge zwischen benachbarten, vom Spieler gebauten Geschütztürmen.
ei-factory-passage-pipe-mode=Vanilla: Behält das ursprüngliche Kollisionsverhalten der Rohre bei.\nSqueak Through: Ermöglicht das Durchgehen zwischen benachbarten Rohrstücken, auch an verbundenen Stellen. Die Rohrmitten bleiben undurchlässig.\nESIR: Ermöglicht das Durchgehen durch unverbundene Zwischenräume; verbundene oberirdische Rohrstücke bilden weiterhin eine Barriere. Eine neue Verbindungsbarriere wird erst aktiv, wenn keine Spielfigur mehr im Weg steht. Unterirdische Abschnitte und bereits passierbare Wärmerohre bleiben passierbar.

