[ei-factory-passage-guide]
walking-heading=Zwischen Maschinen hindurchgehen
walking=Auch der Ingenieur braucht Platz. Durchgänge verkleinern die Kollisionsflächen unterstützter Produktions-, Energie-, Logistik- und Geschützgebäude. Zwischen benachbarten Gebäuden bleibt Platz, ihre Mitte bleibt fest. Mauern, Tore, natürliche Hindernisse, Fahrzeuge, Gegner, nicht am Raster ausgerichtete Objekte und unsichtbare Hilfsobjekte behalten ihre vorgesehene Kollision.
modes-heading=Rohrmodus wählen
modes=Vanilla erhält die Kollision des Spiels und anderer Mods. Squeak Through erlaubt das Durchqueren verbundener Rohrstücke und benötigt keine Zusatzmod. ESIR sperrt tatsächliche oberirdische Verbindungen und lässt unverbundene Lücken offen. Unterirdische Strecken erhalten keine Sperre. Gewöhnliche Rohre verbinden sich seitlich: direkt aneinanderliegende Reihen bilden ein verbundenes Gitter, keinen Laufgang.
controls-heading=Die Einstellungen finden
controls=Start-Einstellungen für Kategorien und Rohrmodus erfordern einen Neustart. Die laufende Verarbeitung steuerst du unter Mod-Einstellungen → Karte oder Administration → Optionen → Leistung. Beide bearbeiten dieselben spielstandweiten Werte. Das Hauptbudget (Standard __3__) umfasst Endpunktaktualisierungen, erneute Prüfungen belegter Verbindungen und Fensterbeobachtung. Die erste Erfassung und sofortiges Entfernen von Hilfsobjekten bleiben synchron.
recipes-heading=Rezeptwechsel
recipes=Bau, Drehen, eingefügte Einstellungen und weitere unterstützte Ereignisse lösen lokale Aktualisierungen aus. Bei geöffnetem Maschinenfenster werden Rezepte zeitnah geprüft. Unbeaufsichtigte Montagemaschinen mit nativer Rezeptwahl per Schaltung nutzen den Hintergrundscanner. Geschlossene manuelle Maschinen werden nicht regelmäßig geprüft. Andere Mods müssen bei stillen Rezept- oder Schaltungsänderungen den vorhandenen Aktualisierungsaufruf verwenden.
scanner-heading=Den Scanner einstellen
scanner=Der Scanner ist standardm??ig ausgeschaltet. Die folgenden Werte gelten bei aktiviertem Scanner. Das zusätzliche Schaltungsbudget beträgt standardmäßig __1__ Versuch pro Tick. Nach erfolgreicher Prüfung oder abgeschlossener Aktualisierung gilt je Maschine eine Wartezeit von __2__ Ticks; Fenster- und Ereignisaktualisierungen umgehen sie. Bei normaler Geschwindigkeit sind höchstens __4__ Versuche pro Sekunde im gesamten Spielstand möglich. Für 600 geeignete Maschinen dauert ein Durchlauf damit ungefähr __5__ Sekunden. Das ist ein Rechenbeispiel, keine garantierte Reaktionszeit; Rückstände können weitere Verzögerung verursachen. Höhere Werte aktualisieren schneller, niedrigere begrenzen die Arbeit. Keines der Budgets garantiert eine Tickdauer.
troubleshooting-heading=Scanner ausschalten und Probleme beheben
troubleshooting=Ohne Scanner können unbeaufsichtigte Schaltungsänderungen veraltet bleiben; Fenster und Ereignisse funktionieren weiter. Prüfe, ob Fabrikdurchgänge eingeschaltet sind und ESIR als Rohrmodus gewählt ist. Squeak Through 2 hat Vorrang. Wartet eine Verbindung auf freie Fläche, tritt zur Seite. Berechtigte Administratoren können unter Diagnose → Fabrikdurchgänge → Reparieren oder mit /ei-admin-repair factory-passage die Erfassung neu aufbauen, ohne Maschinen zu ersetzen.
current-heading=Aktuelle Einstellungen
current=Gewählter Modus: __1__\nWirksamer Modus: __2__\nGrund für Inaktivität: __3__\nHauptbudget: __4__ pro Tick\nSchaltungsscanner: __5__\nZusätzliches Schaltungsbudget: __6__ pro Tick\nDiese Anzeige wird beim erneuten Öffnen aktualisiert.
