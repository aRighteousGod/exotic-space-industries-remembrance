ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-off=Der Unterrumpf versiegelt seine Kreise und bewegt sich ohne sichtbares Schwebeschimmern.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-lean=Vier Emitterkreise antworten dem Boden kurz mit einem zurückhaltenden prismatischen Rand.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-standard=Die Emitter zeichnen stetige Smaragdringe unter den Rumpf, während Bewegung zu Druck wird.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-cinematic=Die Ringe erhellen sich, überlagern sich und zerfallen um jeden Schwebefuß in mintgrüne Prismensplitter.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-maximal=Jeder Emitter öffnet ein dichtes leuchtendes Siegel unter der Reliquie, beinahe andächtig in seiner Gewalt.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-unbounded=Die Begrenzung zerbricht; jeder Schwebefuß darf dem Boden die Passage des Panzers einprägen.

