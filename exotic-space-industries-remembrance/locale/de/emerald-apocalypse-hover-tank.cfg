[exotic-industries-informatron]
menu_emerald_apocalypse_hover_tank=Schwebepanzer „Smaragdapokalypse“
title_emerald_apocalypse_hover_tank=Schwebepanzer „Smaragdapokalypse“
emerald-apocalypse-hover-tank=Schwebepanzer „Smaragdapokalypse“
emerald-apocalypse-hover-tank-text=Der [item=ei-emerald-apocalypse-hover-tank] ist eine schwebende Festung des späten Exotischen Zeitalters: zu schwer für Anmut, zu ergeben für den Fall. Emitterringe tragen den Rumpf über die Welt, während die starre Kanone Blickrichtung in Urteil verwandelt.
emerald-apocalypse-hover-tank-2=Kristallladung
emerald-apocalypse-hover-tank-text-2=Die [item=ei-emerald-apocalypse-charge] trägt einen einzelnen versiegelten Bruch für die [item=ei-emerald-apocalypse-cannon]. Beim Schuss verstreut der Panzer keine Wut. Er öffnet ein grünes Gebot und lässt das Schlachtfeld antworten.
emerald-apocalypse-hover-tank-3=Orbitalsplitterdoktrin
emerald-apocalypse-hover-tank-text-3=Orbitalsplitter sind eine Skriptdoktrin, keine Geschützturmausrüstung. Der Splitterverteiler erhöht den Ring von drei auf sechs aktive Splitter. Die Nachladelitanei verkürzt den Takt je Splitter von 1.17 auf 0.92, 0.75 und schließlich 0.58 Sekunden. Das Zielurteil ersetzt reine Nähe durch eine Bedrohungswertung aus Nestern, Geschütztürmen, Gesundheit, Wunden und Abstand. Die Urteilsöffnung verbreitert den Strahl und verteilt begrenzten Zusatzschaden auf nahe oder im Korridor liegende Ziele.
emerald-apocalypse-hover-tank-4=Splitterkonsole
emerald-apocalypse-hover-tank-text-4=Öffne das Panzerinventar für die Orbitalsplitterkonsole. Jeder platzierte Panzer kann 0 bis zur erforschten Maximalzahl aktivieren. „Aufteilen“ verteilt Urteile auf die besten nahen Bedrohungen; „Fokussieren“ schickt alle Splitter auf dasselbe aktuelle Ziel. Die DPS-Anzeige berücksichtigt aktive Anzahl, wiederholbare Forschung Laserwaffenschaden 7+ und Qualität des platzierten Panzers.

emerald-apocalypse-hover-tank-5=Rumpfdoktrin
emerald-apocalypse-hover-tank-text-5=Die Rumpfdoktrin ist endlich. Der Ladungskatechismus verkürzt die Aufladung von 9.48 auf 8.5, 7.58 und 6.67 Sekunden, jeweils mit kürzerer Ladehymne. Der Trägheitseid senkt die Schusssperre von 15 auf 13.17 und 11.33 Sekunden. Der Schutzbund beantwortet Schildschäden gegen nahe Feinde. Der Vektorkiel verbessert das Chassis ohne den Drift aufzuheben. Das Kollapsmandat verstärkt die Endpunktwelle von 52 Feldern, ohne sie grenzenlos wachsen zu lassen.
emerald-apocalypse-hover-tank-6=Entsiegelte Steuerung
emerald-apocalypse-hover-tank-text-6=Apokalypsenrekursion öffnet Schalter je Panzer. Ladungsrückgewinnung, Kielschweif, verzweigte Narben, geteilter Schweif und entsiegelter Einschlag sind standardmäßig aktiv. Diese Doktrinen sind nicht sanft. Deaktiviere sie an einzelnen Panzern, wenn der Eid eng bleiben soll.
