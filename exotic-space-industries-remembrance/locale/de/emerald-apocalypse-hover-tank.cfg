[technology-description]
ei-emerald-shard-manifold-1=Erhöht die Orbitalsplitterdoktrin der Smaragdapokalypse auf vier aktive Splitter.
ei-emerald-shard-manifold-2=Verflicht eine zweite Verstärkung im Splitterverteiler und erhöht die Doktrin auf fünf aktive Splitter.
ei-emerald-shard-manifold-3=Vollendet den Verteilereid: Sechs aktive Splitter dürfen dem Panzer gleichzeitig antworten.
ei-emerald-reload-litany-1=Verkürzt das Nachladeintervall der Orbitalsplitter auf 0.92 Sekunden je Splitter.
ei-emerald-reload-litany-2=Wiederholt die Litanei, bis sich der Splitterring alle 0.75 Sekunden erneuert.
ei-emerald-reload-litany-3=Versiegelt den Nachladetakt bei 0.58 Sekunden: weniger Warten, mehr Urteil.
ei-emerald-target-verdict=Orbitalsplitter können Nester, Geschütztürme, nahe Feinde und bereits verwundete Ziele bevorzugen, statt Urteile an geringere Bedrohungen zu verschwenden.
ei-emerald-verdict-aperture-1=Öffnet die erste breitere Smaragdöffnung um Splittertreffer und ergänzt begrenzten Sekundärschaden.
ei-emerald-verdict-aperture-2=Erweitert Splittereinschläge zu einem breiteren Flächenurteil.
ei-emerald-verdict-aperture-3=Splitterurteile werden zu Smaragdwunden, die eng stehende Feinde bestrafen.

ei-emerald-charge-catechism-1=Lehrt den Lauf schneller zu beten und verkürzt die Aufladung auf 8.5 Sekunden.
ei-emerald-charge-catechism-2=Verdichtet die Smaragdsilben erneut und verkürzt die Aufladung auf 7.58 Sekunden.
ei-emerald-charge-catechism-3=Versiegelt den Katechismus im schärfsten Takt: 6.67 Sekunden bis zur Entfesselung.
ei-emerald-inertial-oath-1=Der Rumpf erholt sich früher vom Rückstoß; die Abklingzeit nach dem Schuss sinkt auf 13.17 Sekunden.
ei-emerald-inertial-oath-2=Härtet den Rückstoßeid, bis die Schusssperre nach 11.33 Sekunden fällt.
ei-emerald-aegis-covenant-1=Verwandelt Schildschmerz in eine Smaragdvergeltungsblüte ausschließlich gegen Feinde.
ei-emerald-aegis-covenant-2=Vertieft den Schutzbund: Wird die Membran verletzt, trifft die Vergeltung weiter und härter.
ei-emerald-vector-keel-1=Stimmt den Schwebekiel auf stärkere Kontrolle ab, ohne das schwere Driften des Panzers aufzuheben.
ei-emerald-vector-keel-2=Verbessert Rückwärtsfahrt, Bremsen und Driftkontrolle erneut.
ei-emerald-collapse-mandate-1=Erhöht den Kollapsdruck am Endpunkt bei weiterhin begrenzter Narbe.
ei-emerald-collapse-mandate-2=Die Stoßwelle trägt mehr Plasma durch dasselbe Urteil von 52 Feldern.
ei-emerald-collapse-mandate-3=Vollendet das Mandat: Der Endpunkt bleibt begrenzt, das Urteil wird brutaler.
ei-emerald-apocalypse-recursion=Entsiegelt gefährliche Doktrinschalter je Panzer für Ladungsrückgewinnung, Schweifnarben, geteilte Strahlen und verstärkte Einschläge.

