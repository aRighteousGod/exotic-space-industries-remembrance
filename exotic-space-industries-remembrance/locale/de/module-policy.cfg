[mod-setting-description]
ei-beacon-quality-modules=Legt fest, welche ESIR-Effektverteiler Module mit Qualitätsbonus aufnehmen können. Stickstoffgekühlt: __ENTITY__ei-copper-beacon__ und __ENTITY__ei-iron-beacon__. Alien: __ENTITY__ei-alien-beacon__ und __ENTITY__ei-warp-beacon__. Benötigt die Mod Quality.\nBei einer Einschränkung werden bereits eingesetzte, nun gesperrte Module neben dem Effektverteiler auf den Boden gelegt.
ei-beacon-productivity-modules=Legt fest, welche ESIR-Effektverteiler Module mit Produktivitätsbonus aufnehmen können. Stickstoffgekühlt: __ENTITY__ei-copper-beacon__ und __ENTITY__ei-iron-beacon__. Alien: __ENTITY__ei-alien-beacon__ und __ENTITY__ei-warp-beacon__. Gilt auch bei deaktivierter Mod Quality.\nBei einer Einschränkung werden bereits eingesetzte, nun gesperrte Module neben dem Effektverteiler auf den Boden gelegt.
ei-quality-module-effects=ESIR verwendet die eigenen Boni und Nachteile für Qualitätsmodule. Vanilla-nah lässt die ESIR-Änderungen an deren Wirkung aus. Rezepte und Forschungsfortschritt bleiben in beiden Modi an ESIR angepasst. Ohne Quality hat diese Einstellung keine Wirkung.

