[technology-description]
ei_em-trains=EM-Züge basieren auf einer Kristallgitter-Infrastruktur. [item=ei_charger] [color=orange]Ladestationen[/color] errichten ein Feldnetz, das EM-Fahrzeuge synchronisiert und Antriebsenergie entlang der Schienen überträgt. Dies unterstützt Boden- und Weltraumstrecken; Forschung ermöglicht erhebliche Geschwindigkeits- und Beschleunigungsboni. Ohne kohärente Feldabdeckung fällt der Antrieb aus.

[item-description]
ei_charger=EM-Ladestation. Aktiver Feldknoten für Aufbau und Erhalt des EM-Transportnetzes auf Planeten und Weltraumabschnitten. Feldverlust legt den EM-Antrieb still. Höhere Knotenqualität verringert Energieverluste und stabilisiert das Gitter.
ei_em-locomotive=EM-Lokomotive. Feldgetriebener Antrieb als Empfänger des [item=ei_charger][color=orange]Ladestationsnetzes[/color]. Bewegung stammt aus dem Feldnetz; ohne Abdeckung bleibt sie stehen. Hochwertige Koppler erhalten nach Verlassen des Netzes kurzzeitig die Feldkohärenz.
ei_em-cargo-wagon=EM-Güterwaggon. Passiv feldgekoppeltes Transportmodul für ladestationsversorgte Strecken einschließlich orbitaler Versorgungslinien.
ei_em-fluid-wagon=EM-Tankwaggon. Passiv feldgekoppelter Flüssigkeitstransport als Bestandteil des Ladestationsfeldes auf Boden- und außerplanetaren Strecken.

[entity-description]
ei_charger=EM-Ladestation. Aktiver Feldknoten für Aufbau und Erhalt des EM-Transportnetzes auf Planeten und Weltraumabschnitten. Feldverlust legt den EM-Zugkraftantrieb still. Höhere Knotenqualität verringert Energieverluste und stabilisiert das Gitter.
ei_em-locomotive=EM-Lokomotive. Feldgetriebener Antrieb als Empfänger des [item=ei_charger][color=orange]Ladestationsnetzes[/color]. Bewegung stammt aus dem Feldnetz; ohne Abdeckung bleibt sie stehen. Hochwertige Koppler erhalten nach Verlassen des Netzes kurzzeitig die Feldkohärenz.
ei_em-cargo-wagon=EM-Güterwaggon. Passiv feldgekoppeltes Transportmodul für ladestationsversorgte Strecken einschließlich orbitaler Versorgungslinien.
ei_em-fluid-wagon=EM-Tankwaggon. Passiv feldgekoppelter Flüssigkeitstransport als Bestandteil des Ladestationsfeldes auf Boden- und außerplanetaren Strecken.

