ei-auric-vat-bloom=Blütezustand

[virtual-signal-description]
ei-auric-vat-vigor=Gibt die aktuelle Zyklusvitalität des Bottichs auf einer Skala von 0-100 aus.
ei-auric-vat-contamination=Gibt den aktuellen Verunreinigungsdruck des Bottichs auf einer Skala von 0-100 aus.
ei-auric-vat-band=Gibt die aktuelle Beckenstufe von 1 bis 7 anhand der zugeordneten Feuchtgebietsfelder aus.
ei-auric-vat-claims=Gibt die Anzahl der derzeit dem Bottich zugeordneten Feuchtgebietsfelder aus.
ei-auric-vat-bloom=Gibt den Blütezustand aus: 1 stabil, 2 belastet, 3 gescheitert.

