[recipe-description]
ei-auric-inoculation-vat=Errichte einen aurischen Impfbottich, der ein nahes Feuchtgebietsbecken beansprucht, auf Gleba Impfzyklen durchläuft und später aurische Zystenknoten hervorbringt.
ei-auric-cyst-washing=Brühe geerntete aurische Zysten mit überhitztem Dampf auf und ätze die geöffnete Hülle mit Schwefelsäure. Der goldhaltige Kern zerfällt in Brocken; verbrauchtes Gewebe wird als Verderbnis und Schmutzwasser abgeschieden.

[technology-name]
ei-productivity-auric-cyst-washing=Produktivität der aurischen Zystenwäsche
ei-auric-marsh-inoculation=Impfung aurischer Sümpfe

[technology-description]
ei-productivity-auric-cyst-washing=Jede Stufe erhöht die Produktivität der aurischen Zystenwäsche um 10 %. Produktivitätsmodule wirken ebenfalls. Nur Gold erhält einen Bonus; Verderbnis und Schmutzwasser nicht. Forschung und Module teilen sich eine Obergrenze von +300 %. Weitere Stufen bleiben erforschbar, erhöhen an der Grenze aber nicht den Ertrag.
ei-auric-marsh-inoculation=Schaltet Glebas aurische Impfbottiche, Beckenzyklen, Zystenblüten und Waschkette frei. Beanspruche ein gültiges Sumpfbecken, versorge den Zyklus mit Reagenzien und verhindere den Zusammenbruch der Blüte durch Verunreinigung.

