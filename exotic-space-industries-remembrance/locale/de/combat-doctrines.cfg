[string-mod-setting-description]
ei-pyric-radiance-preset-ember=Kleine Lichtergänzungen und wenige bewegte Lichter.
ei-pyric-radiance-preset-veiled=Zurückhaltende Beleuchtung gewöhnlicher Kampfeffekte.
ei-pyric-radiance-preset-furnace-vigil=Brennender Boden und Wälder dominieren; keine zusätzlichen bewegten Lichter.
ei-pyric-radiance-preset-iron-benediction=Betont Feuerstellungen durch stärkeres Mündungsfeuer.
ei-pyric-radiance-preset-signal-threads=Betont Geschossbahnen durch stärkere Leuchtspuren.
ei-pyric-radiance-preset-tempered=Mäßige Standardbeleuchtung; keine zusätzlichen Treffer- oder Nuklearlichter.
ei-pyric-radiance-preset-night-liturgy=Breite, warme Kampfbeleuchtung mit zusätzlichen Trefferlichtern.
ei-pyric-radiance-preset-siege-hymn=Starkes Mündungsfeuer und sichtbarer anfliegender Beschuss.
ei-pyric-radiance-preset-cataclysm=Große Explosionslichter und ausgeprägte nukleare Blitze.
ei-pyric-radiance-preset-apotheosis=Maximale Atmosphäre und Lichtdichte.
ei-ballistic-divergence-preset-needle-oath=Gerade Geschosse ohne zusätzliche Streuung oder Flugstrecke; bestehende Magazinkapazität und nativer Schrotkegel.
ei-ballistic-divergence-preset-measured-volleys=Geringe Geschossabweichung mit geschütztem Gelände und bestehender Magazinkapazität.
ei-ballistic-divergence-preset-breach-doctrine=Mehr Geschossstreuung und größere Magazine; Gelände bleibt verwundbar.
ei-ballistic-divergence-preset-tempered=Mäßige Streuung und Zusatzflugstrecke; erhält den bisherigen Munitionsverbrauch pro Magazin.
ei-ballistic-divergence-preset-distant-thunder=Mehr Zusatzflugstrecke bei zurückhaltender Geschossstreuung.
ei-ballistic-divergence-preset-fortress-oath=Größere Magazine, mäßige Streuung und geschütztes Gelände.
ei-ballistic-divergence-preset-wildfire-doctrine=Starke Geschossstreuung und angeforderte Schrotstreuung, größere Magazine und geschütztes Gelände.
ei-ballistic-divergence-preset-crossfire=Mehr Zusatzflugstrecke und breite Geschossstreuung; Gelände bleibt verwundbar.
ei-ballistic-divergence-preset-saturation=Mehr Zusatzflugstrecke, breite Streuung, doppelte Geschosskapazität und geschütztes Gelände.
ei-ballistic-divergence-preset-terminal-barrage=Maximale Zusatzflugstrecke, Streuung und Geschosskapazität; Gelände bleibt verwundbar.

