pyric-radiance=Pyric Radiance
pyric-radiance-text=Der Ofen bezeugt die Nacht. Thermische Flammen behalten ihre Brennstofffarben; gewöhnliche Schüsse und Explosionen beleuchten ihren Weg. Wähle in den Starteinstellungen eine Doktrin für Glut, Feuerstellungen, Leuchtspuren oder breites Belagerungslicht. Karten, Brandausbreitung, Nachtsicht, Taschenlampen und Tageszyklus behalten ihr Verhalten. Exotische und energetische Spezialeffekte bewahren ihre eigene optische Identität.
ballistic-divergence=Ballistic Divergence
ballistic-divergence-text=Der Schuss trägt einen Eid, keine Gewissheit. Bestehende Geschosse erhalten physische Flugbahnen; Feinde und neutrale Hindernisse können sie abfangen. Die eigene Partei fängt sie nicht ab, andere verbündete Parteien bleiben treffbar. Bestehende Flächen- und Brandeffekte behalten ihre Regeln. Panzerbrechende und Uranmagazine besitzen ein natives Durchdringungsbudget vom 25-Fachen des physischen Grundschadens: Getötete Ziele werden durchflogen, überlebende stoppen den Schuss. Exotische Geschosse setzen ihre vollständige Wirkung einmal frei. Kompatible aktive Waffen teilen eine Flugobergrenze einschließlich Munitionsreichweitenmodifikatoren, Qualität und Mündungszuschlag. Doktrinen erlauben begrenzten Zusatzflug und begrenzen die Distanzstreuung von Geschossen und Schrot, ohne Zielreichweiten oder nativen Schrotkegel zu ändern. Fehlschüsse enden am nativen Distanzlimit. Neue Limits gelten für neu abgefeuerte Geschosse; fliegende Geschosse behalten gespeicherte Reichweiten und Wirkungen. Bestimmte Doktrinen erhöhen die Magazinkapazität oder schützen Gelände; Rezepte, Technologien, Schrotkapazität und Roboterschaden bleiben unverändert.
