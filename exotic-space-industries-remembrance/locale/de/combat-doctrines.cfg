[mod-setting-description]
ei-pyric-radiance=Beleuchtet thermische Brände, Flammenstrahlen, gewöhnliche Explosionen, Mündungsfeuer und physische Projektile. Brennstofffarben und eigens gestaltete Spezialeffekte bleiben erhalten. Ändert nur die Darstellung: Brandausbreitung, Karten, Nachtsicht, Taschenlampen und Tageslänge behalten ihr Verhalten. Beim Deaktivieren bleibt die gewählte Doktrin gespeichert.
ei-pyric-radiance-preset=Wähle das Verhältnis von Feuer-, Explosions-, Leuchtspur- und Mündungslicht. Faktoren ändern den Lichtradius; null belässt die jeweilige Effektfamilie unverändert. Häufige Trefferlichter und ein zusätzlicher nuklearer Lichtblitz sind aufwendigen Doktrinen vorbehalten; der vorhandene nukleare Kameraeffekt bleibt erhalten. Exotische und energetische Spezialeffekte behalten ihre eigene Darstellung.\n
ei-ballistic-divergence=Geschosse fliegen, verfehlen und treffen Hindernisse. Gilt für vorhandene Geschossmagazine, Schrotkugeln und schießende Roboter. Spieler und Bauwerke der eigenen Partei fangen diese Projektile nicht ab; andere verbündete Parteien und neutrales Gelände können getroffen werden. Flächen- und Brandeffekte behalten ihre Regeln. Panzerbrechende und Uranmagazine durchdringen getötete Ziele mit einem nativen Schadensbudget vom 25-Fachen ihres physischen Grundschadens; überlebende Ziele stoppen sie. Exotische Geschosse behalten ihre vollständige einmalige Trefferwirkung. Keine neue Munition oder Forschung. Deaktivieren behält die Doktrinauswahl bei.
ei-ballistic-divergence-preset=Wähle zusätzliche Flugstrecke, Geschossstreuung, Magazinkapazität und angeforderte Schrot-Reichweitenstreuung. Die erforderliche Flugstrecke deckt die längste Reichweite kompatibler aktiver Waffen einschließlich Munitionsmodifikatoren, Qualität und Mündungszuschlag ab. Zusätzlicher Flug ist auf 16 Felder darüber begrenzt; Zielerfassungsreichweiten bleiben unverändert. Der Streufaktor skaliert die Winkelabweichung 0.16 und die angeforderte Reichweitenabweichung 0.40; null entfernt die zusätzliche Geschossstreuung. Die Distanzstreuung von Geschossen und Schrot wird durch das zusätzliche Fluglimit begrenzt; der native Schrotkegel bleibt erhalten. Magazinkapazität wird aufgerundet; Schrotpatronenkapazität und Robotermunition bleiben unverändert. Geländeschutz setzt minimale physische Resistenzen von 2/65% für Bäume und 4/75% für Felsen und wirkt auf sämtlichen physischen Schaden.\n

