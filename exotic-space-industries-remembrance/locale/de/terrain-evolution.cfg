[mod-setting-description]
ei-terrain-evolution-enabled=Aktiviert ESIRs planetare Geländeökologie: verschmutzungsbedingte Veränderungen und Erholung, ereignisgesteuerte Abbaunarben, Belastung und Nachwuchs wilder Bäume sowie jahreszeitliches Tageslicht. Einzelfunktionen, Planeten und UPS-Budgets stehen unter Mod-Einstellungen → Karte. Alle Funktionen sind standardmäßig aktiv, Vegetationsbrand ist begrenzt. Fulgora behält seine eigene Tagessteuerung. Deaktivieren stoppt neue Änderungen ohne Geländerücksetzung und stellt Tageslicht nur wieder her, solange ESIR es noch steuert.
ei-terrain-active=Führt Ökologie und jahreszeitliches Tageslicht auf aktivierten unterstützten Oberflächen aus. Deaktivieren stoppt neue Arbeit ohne Geländerücksetzung. Eigenes Tageslicht wird nur wiederhergestellt, wenn keine andere Steuerung es verändert hat.
ei-terrain-intensity=Zurückhaltend verwendet den Ratenfaktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten Multiplikator. Intensität bleibt von Verarbeitungsbudgets getrennt und aktiviert keine abgeschalteten Gefahren.
ei-terrain-performance=Kleine Gruppen werden häufig verarbeitet. Extrem niedrig und Niedrig minimieren Arbeit; Sparsam ist der vorsichtige Standard. Ausgewogen, Detailliert, Hohe Detailtreue und Höchste Detailtreue erhöhen schrittweise Abdeckung und UPS-Kosten. Benutzerdefiniert nutzt Einzelgrenzen. Alle Budgets gelten global; Intensität und Gefahren bleiben getrennt.
ei-terrain-custom-rate-multiplier=Zurückhaltend verwendet den Faktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten eigenen Multiplikator. Verarbeitungsbudgets bleiben getrennt.
ei-terrain-degradation=Verschlechtert geeignetes natürliches Gelände nach anhaltender Verschmutzung entlang planetenspezifischer Ketten. Standard: mindestens 100 Verschmutzung für fünf Minuten. Gleba-Sporen zählen nicht als giftige Verschmutzung.
ei-terrain-recovery=Stellt nur von ESIR aufgezeichnete Geländeänderungen entlang ihres genauen Ursprungswegs wieder her. Standard: höchstens 25 Verschmutzung für zehn Minuten; Erholungsintervall viermal so lang wie das Verfallsintervall. Externer Austausch beendet ESIRs Wiederherstellungszuständigkeit.
ei-terrain-mining-scars=Wird durch Erschöpfung endlicher Rohstoffe im Bereich geeigneter Steinbruch- oder großer Erzförderer ausgelöst. Nahe Narben werden unter gemeinsamen Arbeitsgrenzen eingereiht; bei Ereignisspitzen können zusätzliche Narben entfallen. Neue Narben werden standardmäßig zur Erholung erfasst. Das Ereignis nennt den verursachenden Bohrer nicht.
ei-terrain-tree-stress=Lässt zugelassene heimische Wildbäume nach anhaltender Verschmutzung ergrauen und nimmt ESIR-eigene Vergrauung bei sauberen Bedingungen zurück. Kulturpflanzen und geschützte Flora sind ausgenommen.
ei-terrain-tree-regrowth=Lässt bei anhaltend sauberen Bedingungen langsam zugelassene örtliche Bäume neben bestehenden wachsen. Dichte- und Geländeschutz gelten; Gaia nutzt biomspezifische Baumarten.
ei-terrain-thermal-scars=Durch Feuer getötete Bäume können bei geeigneter Brandquelle kleine Geländenarben hinterlassen. Dieser Effekt entzündet keine Feuer.
ei-terrain-seasonal-daylight=Standardmäßig aktiv. Verändert jahreszeitlich Tageslichtdauer und native Solarproduktion, ohne die Gesamttageslänge zu ändern. Fulgora bleibt ausgenommen; eingefrorenes Tageslicht und externe Steuerungen haben Vorrang.
ei-terrain-mining-recovery=Standardmäßig aktiv. Zeichnet künftige Abbaunarben zur Erholung auf; ältere dauerhafte Narben sind nicht rekonstruierbar. Abbauschaden ersetzt ältere ökologische Erholungspfade.
ei-terrain-aging=Standardmäßig aktiv. Ersetzt geeignete lebende Nauvis-Bäume durch heimisches Totholz. Andere Planeten haben keinen zugelassenen Totholzersatz und bleiben ausgenommen. Entzündet keine Feuer.
ei-terrain-rot=Standardmäßig aktiv. Entfernt geeignetes heimisches Totholz schrittweise. Geschützte Bäume und Orte sind ausgenommen.
ei-terrain-flood=Standardmäßig aktiv. Wandelt zugelassene sandige Nauvis-Uferfelder neben vorhandenem Süßwasser in Wasser um. Andere planetare Flüssigkeiten und Schutzgebiete sind ausgenommen.
ei-terrain-drought=Standardmäßig aktiv. Wandelt zugelassenes Nauvis-Uferwasser neben sandigem Ufer in Sand um. Andere planetare Flüssigkeiten und Schutzgebiete sind ausgenommen.
ei-terrain-cliffs=Standardmäßig aktiv. Entfernt gelegentlich geeignete gewöhnliche Klippen. Besondere planetare Klippen und Schutzgebiete sind ausgenommen.
ei-terrain-blood=Standardmäßig aktiv. Der Tod feindlicher Einheiten oder Nester kann einen aufgezeichneten Geländeschadensschritt in der Nähe umkehren. Abbaunarben benötigen weiterhin aktivierte Abbauerholung.
ei-terrain-paving=Standardmäßig aktiv. Benötigt Bluteffekte: Feindtode können geeignetes Stein- oder Betonpflaster bis zum darunterliegenden Feld abtragen. Infrastruktur- und sonstiger Schutz gelten weiterhin.
ei-terrain-seasonal-ecology=Standardmäßig aktiv. Variiert Bodenverfall, Baumaktivität, Nachwuchs und Gefahrenversuche jahreszeitlich. Unabhängig von der Tageslichtzuständigkeit; aktiviert keine abgeschalteten Gefahren.
ei-terrain-wildfire=Standardmäßig Begrenzt. Verschmutzung ab der oberen Schwelle (Standard 100) kann Feuer bei geeigneten heimischen Wildbäumen entzünden. Geschützte Bereiche sind vom Erstbrand ausgenommen. Begrenzt nutzt nicht ausbreitende Bodenflammen mit höchstens 10 Sekunden Dauer; Ausbreitend nutzt native Baumbrände. Erstzündungen sind begrenzt, spätere native Ausbreitung liegt außerhalb von ESIRs Skriptbudget. Unabhängige Kampfbrände bleiben getrennt.
ei-terrain-planet-nauvis=Aktiviert Nauvis-Ökologie und jahreszeitliches Tageslicht: Verfallsketten für Gras, Erde, Wüste und Sand, heimische Wildbäume und optionale Uferänderungen. Einzelschalter und Schutzregeln gelten weiterhin.
ei-terrain-planet-gaia=Aktiviert Gaia-Ökologie und jahreszeitliches Tageslicht: Wiesen- und Feuchtgebietsvarianten verfallen zu freiem Gaia-Fels, erholen sich zur aufgezeichneten Ursprungsvariante und bilden biomgerechten Baumnachwuchs. Gestaltete Sonderorte bleiben geschützt.
ei-terrain-planet-vulcanus=Aktiviert Vulcanus-Ökologie und jahreszeitliches Tageslicht über vulkanische Asche-, Boden- und Rissketten. Lava bleibt geschützt; Fumarolen behalten ihre unabhängigen Effekte.
ei-terrain-planet-gleba=Aktiviert Gleba-Ökologie und jahreszeitliches Tageslicht mit biomspezifischem Gelände und heimischen Wildbäumen. Sporen verursachen keinen giftigen Verschmutzungsschaden. Kulturpflanzen, Kulturböden und aurische Becken bleiben geschützt.
ei-terrain-planet-fulgora=Aktiviert Fulgoras Geländeökologie mit Übergängen zwischen Fels, Sand, Staub und Dünen. Ölmeere bleiben geschützt. Jahreszeitliches Tageslicht steuert Fulgora nie; seine eigene Tagessteuerung bleibt maßgeblich.
ei-terrain-planet-aquilo=Aktiviert Aquilo-Ökologie und jahreszeitliches Tageslicht über zugelassene Schnee- und Eisübergänge. Ammoniakmeere, Fundamente und Infrastruktur bleiben geschützt.
ei-terrain-pollution-high=Die obere Schwelle beginnt verschmutzte Belastung, die untere saubere Entlastung. Die untere muss unter der oberen liegen. Nutzt lokale native Verschmutzungswerte, ohne Verschmutzung direkt zu verändern.
ei-terrain-pollution-low=Die obere Schwelle beginnt verschmutzte Belastung, die untere saubere Entlastung. Die untere muss unter der oberen liegen. Nutzt lokale native Verschmutzungswerte, ohne Verschmutzung direkt zu verändern.
ei-terrain-mining-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-wildfire-probability=Chance je geeignetem Versuch in einem verschmutzten Chunk von 0 (nie) bis 1 (immer); Standard 0.01 (1%). Keine Chance pro Tick. Vegetationsbrand muss aktiv sein; Kandidatenbäume müssen Schutzprüfungen bestehen.
ei-terrain-flood-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-drought-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-cliff-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-blood-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-paving-probability=Chance je geeignetem Versuch von 0 (nie) bis 1 (immer). Die zugehörige Funktion muss aktiv sein; Schutzprüfungen gelten weiterhin.
ei-terrain-axial-tilt=Angenommene Achsneigung zur Berechnung des jahreszeitlichen Tageslichtkontrasts; Standard 23.5 Grad. Größere Werte verstärken meist die Jahreszeiten. Voller Tag und volle Nacht behalten jeweils mindestens 2%; Fulgora bleibt ausgenommen.
ei-terrain-latitude=Angenommener Breitengrad für jahreszeitliches Tageslicht; Standard 45 Grad. Höhere Beträge verstärken den Kontrast; das Vorzeichen vertauscht Sommer und Winter. Bewegt keine Spieler und ändert keine Planetenrotation.
ei-terrain-season-strength=Stärke jahreszeitlicher Schwankungen der Ökologieraten. Gilt nur bei aktivierter jahreszeitlicher Ökologie.
ei-terrain-dirty-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-clean-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-soil-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-recovery-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-mining-radius=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-mining-patch-radius=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-tree-growth-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-tree-density-limit=Maximale Baumzahl in der eingestellten Nachbarschaft, bevor natürlicher Nachwuchs unterdrückt wird.
ei-terrain-tree-neighborhood=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-tree-stress-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-tree-aging-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-tree-rot-seconds=Verzögerung oder Intervall in Simulationssekunden. Geeignete Bedingungen und freie Verarbeitungskapazität bleiben erforderlich.
ei-terrain-hazard-seconds=Grundintervall zwischen Gefahrengelegenheiten je Chunk in Simulationssekunden. Standard 600: bei zurückhaltender Intensität eine Grundlage von 20 Minuten, jahreszeitlich verändert. Aktivierte Gefahrenarten wechseln sich ab. Verarbeitungsgrenzen können weiter verzögern.
ei-terrain-wildfire-radius=Suchradius in Feldern für geeignete heimische Wildbäume um die geprüfte Position. Schutzprüfungen gelten weiterhin. Begrenzt keine native Brandausbreitung.
ei-terrain-hazard-radius=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-calendar-days=Referenzjahr in erfassten Nauvis-Tagen; Standard 360. Das Jahr jedes Planeten skaliert mit seiner geladenen Sternkartenentfernung. Änderungen erhalten die aktuelle Jahreszeitenphase und verändern nie die Planetenrotation.
ei-terrain-protection-buffer=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-max-depth=Maximale Zahl erlaubter Verfallsschritte ab dem aufgezeichneten Ursprungsgelände.
ei-terrain-seed-distance=Entfernung oder Radius in Feldern. Schutzprüfungen können ansonsten geeignete Positionen ausschließen.
ei-terrain-interval=Benutzerdefiniert: Ticks zwischen globalen Wartungsgelegenheiten. Höhere Werte senken die Verarbeitungshäufigkeit und verlangsamen die Abdeckung. Verzögerte Arbeit erzeugt keine Nachholspitze.
ei-terrain-search-interval=Benutzerdefiniert: Mindestticks zwischen gemeinsam genutzten Einheitensuchfreigaben. Getrennt vom Wartungsintervall. Kürzere Werte erlauben mehr Suchen und können UPS kosten. Ungenutzte Freigaben sammeln sich nicht an.
ei-terrain-cold-chunks=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-active-chunks=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-candidates=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-histories=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-writes=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-recovery-reserved=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-searches=Benutzerdefiniert: maximale Einheitensuchen in einem Wartungsdurchlauf mit fälligem Suchintervall. Gemeinsam für alle Oberflächen; ungenutzte Suchen werden nicht übertragen.
ei-terrain-result-limit=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-events=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-mining-queries=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-mining-candidates=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-admissions=Für die benutzerdefinierte Verarbeitung. Eine endliche globale Arbeitsgrenze für alle Oberflächen, kein eigenes Budget je Planet. Höhere Werte können die CPU stärker belasten.
ei-terrain-active-cap=Maximal gespeicherter ökologischer Zustand. Höhere Grenzen benötigen mehr Speicher. Verarbeitungsgrenzen gelten weiterhin.
ei-terrain-pending-cap=Maximal gespeicherter ökologischer Zustand. Höhere Grenzen benötigen mehr Speicher. Verarbeitungsgrenzen gelten weiterhin.
ei-terrain-tile-history-cap=Maximal gespeicherter ökologischer Zustand. Höhere Grenzen benötigen mehr Speicher. Verarbeitungsgrenzen gelten weiterhin.
ei-terrain-tree-history-cap=Maximal gespeicherter ökologischer Zustand. Höhere Grenzen benötigen mehr Speicher. Verarbeitungsgrenzen gelten weiterhin.

