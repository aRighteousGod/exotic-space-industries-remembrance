[string-mod-setting-description]
ei-terrain-intensity-restrained=Zurückhaltend verwendet den Faktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten eigenen Multiplikator. Verarbeitungsbudgets bleiben getrennt.
ei-terrain-intensity-standard=Zurückhaltend verwendet den Faktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten eigenen Multiplikator. Verarbeitungsbudgets bleiben getrennt.
ei-terrain-intensity-severe=Zurückhaltend verwendet den Faktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten eigenen Multiplikator. Verarbeitungsbudgets bleiben getrennt.
ei-terrain-intensity-custom=Zurückhaltend verwendet den Faktor 0.5, Standard 1 und Sehr streng 2. Benutzerdefiniert nutzt den eingestellten eigenen Multiplikator. Verarbeitungsbudgets bleiben getrennt.
ei-terrain-performance-ultra-low=Wartungsintervall: 16 Ticks. Einheitensuchen: bis zu 1 alle 128 Ticks. Je Durchlauf höchstens 1 Erholungsprüfung und 1 Feldänderung. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-low=Wartungsintervall: 16 Ticks. Einheitensuchen: bis zu 1 alle 64 Ticks. Je Durchlauf höchstens 2 Erholungsprüfungen und 2 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-lean=Wartungsintervall: 16 Ticks. Einheitensuchen: bis zu 1 alle 32 Ticks. Je Durchlauf höchstens 4 Erholungsprüfungen und 4 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-balanced=Wartungsintervall: 8 Ticks. Einheitensuchen: bis zu 1 alle 16 Ticks. Je Durchlauf höchstens 4 Erholungsprüfungen und 4 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-detailed=Wartungsintervall: 4 Ticks. Einheitensuchen: bis zu 1 alle 8 Ticks. Je Durchlauf höchstens 8 Erholungsprüfungen und 4 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-high-fidelity=Wartungsintervall: 2 Ticks. Einheitensuchen: bis zu 1 alle 4 Ticks. Je Durchlauf höchstens 8 Erholungsprüfungen und 4 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-ultra-high-fidelity=Wartungsintervall: 1 Tick. Einheitensuchen: bis zu 2 alle 2 Ticks. Je Durchlauf höchstens 16 Erholungsprüfungen und 8 Feldänderungen. Gemeinsam für alle Oberflächen; tatsächliche Arbeit hängt von der Eignung ab.
ei-terrain-performance-custom=Nutzt einzelne Wartungs- und Suchintervalle, Arbeits- und Speichergrenzen. Kleine Gruppen mit längerem Suchintervall reduzieren Spitzenlast und verlangsamen die Abdeckung. Voreinstellungswechsel erhalten die gespeicherte Erholungshistorie.
ei-terrain-wildfire-off=Deaktiviert ökologisch ausgelöste Feuer. Thermische Narben und unabhängige Kampfbrände werden getrennt gesteuert.
ei-terrain-wildfire-contained=Eigene, nicht ausbreitende Flammen leben höchstens 10 Sekunden. Zündungen sind begrenzt; fremde Feuer werden nie übernommen.
ei-terrain-wildfire-spreading=Nutzt native Brandausbreitung. Erstzündungen sind begrenzt, spätere Engine-Ausbreitung liegt aber außerhalb von ESIRs Skriptbudget und kann erhebliche UPS kosten.

[exotic-industries-informatron]
menu_terrain_evolution=Geländeentwicklung
title_terrain_evolution=Geländeentwicklung

[ei-terrain]
overview=Geländeentwicklung verbindet verschmutzungsbedingte Bodenänderung, aufgezeichnete Erholung, Abbaunarben und natürliche Baumreaktionen. Feuer-, Ufer-, Klippen-, Blut- und Pflastereffekte sind einzeln steuerbar. Nauvis, Gaia und unterstützte Space-Age-Planeten behalten ihre eigenen Geländefamilien. Inspiriert von TerrainEvolution und TerrainEvolution2. Alle Funktionen sind standardmäßig aktiv, Vegetationsbrand ist begrenzt; jede Funktion bleibt einzeln einstellbar.
protections=Gewöhnliche Bodenänderungen achten auf Spielerbeläge, Infrastruktur, Rohstofflagerstätten und nicht unterstütztes Gelände. Erholung folgt ESIRs Aufzeichnungen, statt jedes Biom zu Gras zu machen. Gefahren unterliegen weiterhin Schutzprüfungen. Deaktivieren stoppt neue Arbeit, ohne frühere Geländeänderungen rückgängig zu machen.
calendar=Der abstrakte Jahreszeitenkalender nutzt Entfernung und Ausrichtung der geladenen Sternkarte. Er ändert weder Planetenpositionen noch Gesamttagesdauer. Jahreszeitliches Tageslicht und jahreszeitliche Ökologie sind getrennte Optionen. Fulgora behält seine eigene Uhr. ESIR gibt die Tageslichtsteuerung bei erkannten externen Steuerungen oder Änderungen ab.
performance=Kleine Gruppen werden häufig verarbeitet. Extrem niedrig und Niedrig minimieren Arbeit; Sparsam ist der vorsichtige Standard. Ausgewogen, Detailliert, Hohe Detailtreue und Höchste Detailtreue erhöhen schrittweise Abdeckung und UPS-Kosten. Benutzerdefiniert nutzt Einzelgrenzen. Alle Budgets gelten global; Intensität und Gefahren bleiben getrennt.
effective=Zustand: __1__; Verarbeitung: __2__; Intensität: __3__
mining-note=Erschöpfte endliche Vorkommen im Bereich geeigneter Bohrer können Abbaunarben hinterlassen. Das Ereignis nennt den verursachenden Bohrer nicht. Neue Narben werden standardmäßig zur Erholung erfasst; ältere nicht aufgezeichnete Narben sind nicht rekonstruierbar. Schalter, Fleckform und künftige Erholung stehen in den Ökologieeinstellungen.
