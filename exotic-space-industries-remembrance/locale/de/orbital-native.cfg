[exotic-industries-informatron]
orbital-native-title=Zuerst die native Logistik
orbital-native-shipping=Normale Raketenlieferungen und Transfers zwischen Plattformen verwenden Factorios eigene Anforderungen und Bereitstellung. Kohortengeräte sind dafür nicht nötig. Quellen, Mindestliefermengen und Bereitstellung werden im nativen Fenster eingestellt. Die native Automatik übernimmt Beladung, Mischfracht, Zielwahl und Start. Das tatsächliche Ziel wird im Seitenfenster angezeigt.\n\nNeue Uplinks verwenden standardmäßig Native Automatik, ändern beim Platzieren aber keine Siloeinstellungen. Die Schaltfläche aktiviert automatische Anforderungen ausdrücklich. Bestehende Uplinks behalten die Kohortensteuerung. Ein Wechsel erfordert eine leere Nutzlast, keine eingehende Fracht und keinen laufenden Start.
orbital-native-cohort=Für feste Ziele oder fabrik-/schaltungsgesteuerte Beladung einen [entity=ei-platform-transponder] auf jeder beteiligten Plattform sowie Selektor, versorgten Koordinator und zugewiesenen Uplink am Startort platzieren. Neue Selektoren verwenden den Richtlinienmodus; manuelle Ziele werden nach Namen gewählt, der Schaltungsmodus liest [virtual-signal=ei-platform-id]. Am Uplink Kohortensteuerung wählen.\n\nZielbindung behält die bisherigen Regeln: dauerhaft bis zur Bedarfsdeckung, einmalig bis zum ersten Start oder bis zum Unterschreiten des Schwellenwerts. IDs, Reparaturen, Reservierungen und Schwellenwert stehen unter Erweitert. Kopieren, Klonen und Blaupausen übertragen Einstellungen, keine laufenden Reservierungen. Automatische IDs werden neu vergeben; doppelte manuelle IDs melden einen Konflikt. Kopierte Uplinks binden sich nur bei genau einem eindeutigen benachbarten Silo automatisch.
orbital-native-sources=Anforderungen und Restbedarf lassen sich nach Planet, Plattformen oder allen Quellen filtern. „Alle“ erlaubt beide Lieferwege. Raketen berücksichtigen keine reinen Plattformanforderungen. Unterwegs bleibt die gesamte eingehende Fracht. Der Restbedarf wird je Plattform berechnet und erst dann summiert: max(0, Anforderungen − Bestand − eingehende Fracht). Fremde Plattformbestände decken diesen Bedarf nicht.\n\nNative Anforderungen und Bereitstellung steuern Plattformtransfers. ESIR ändert keine Anforderungsabschnitte oder Reserve-/Nachfüllregeln. Mischfracht mit nicht angeforderten Gegenstands- oder Qualitätsarten hält Kohortenstarts an; Mehrmengen geeigneter Arten sind erlaubt. Das Fenster nennt die zu entfernende Fracht. Extern aktivierte native Anforderungen unterbrechen die Kohortensteuerung.
orbital-native-radar-title=Native Radar-Signale
orbital-native-radar-one=[font=default-bold]Eine Plattform, ein Kanal[/font]\n1. Bestands-/Statusausgabe der Zentrale auf Rot aktivieren. „Anforderungen setzen“ bei Bedarf auf Grün legen und Netze trennen.\n2. Den roten Ausgang und einen konstanten Kombinator mit einem reservierten Verbindungssignal (z. B. L=1) an ein versorgtes Radar anschließen. Universum und einen nur dieser Plattform zugeordneten Signalkanal wählen.\n3. Am Ziel ein versorgtes Radar derselben Fraktion auf demselben Universum-Kanal verwenden. Dessen roten Draht mit der Auswertung verbinden, getrennt von Anforderungseingängen.\n\nDer Kanal identifiziert die Plattform auch während ihrer Reise. Verbindung=1 ohne Gegenstandssignale bedeutet leeren Bestand; ein fehlendes Verbindungssignal kann auf eine unterbrochene Verbindung hinweisen. Beide Enden benötigen Strom. Native Schaltungen und Radare kosten weiterhin Rechenzeit, obwohl dieser Weg keine Scanner-Abfragen benötigt.
orbital-native-radar-shared=[font=default-bold]Gemeinsamer Bestandskanal[/font]\nMehrere Zentralen über Radare derselben Fraktion auf einem Universum-Kanal verbinden. Ihre Signale werden addiert. Dasselbe Verbindungssignal pro Sender zählt verbundene Sender. Dieses Netz als „Gesamtbestand“ bezeichnen. Es enthält keine individuelle Plattformzuordnung und liefert weder exakten Restbedarf noch garantiert verfügbare Liefermengen.\n\nRadare übertragen Schaltungssignale. Zentralen geben weder konfigurierte Anforderungen noch zugesagte eingehende Fracht aus. Dafür den exakten Scanner verwenden. Radiogesamtsummen niemals als plattformspezifischen Bedarf in die Kohorte einspeisen. ESIR baut keine Relais, wählt keine Kanäle und ändert keine Verkabelung.
