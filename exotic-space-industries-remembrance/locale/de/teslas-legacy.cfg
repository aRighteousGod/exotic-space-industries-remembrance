[technology-description]
tl-basic-tesla-coils-technology=Eine Teslaspule ist ein elektrischer Resonanztransformator für starke Stromentladungen gegen nahe Feinde. Ihr Schaden ist eher gering, trifft aber mehrere Ziele zugleich.
tl-advanced-tesla-coils-technology=Eine deutlich verbesserte Teslaspule mit größerer Reichweite und extrem hohem Schaden. Ausgedehnte Stahlpanzerung erhöht ihre Überlebensfähigkeit.
tl-tesla-tank-technology=Eine tödliche Panzervariante mit 2 mittelgroßen fortschrittlichen Teslaspulen. Tragbare Einweg-Teslaspulen liefern den nötigen Energieimpuls zum Auslösen. Beide Spulen feuern gleichzeitig und verstärken sich zu Lichtbögen, die die meiste Materie durchdringen und alles auf ihrem Weg beschädigen.
ei-tesla-weapons=Rekonstruierte Lichtbogentechnik aus fulgoranischen Forschungstresoren vor dem Kollaps. Obwohl die ursprünglichen Prinzipien nur teilweise verstanden sind, projiziert der funktionsfähige Nachbau stabilisierte Lichtbögen auf Feinde. Leistung, Effizienz und Entladungsmuster bleiben hinter echten fulgoranischen Entwürfen zurück, übertreffen aber gewöhnliche elektromagnetische Waffen deutlich. Weitere Verfeinerung verlangt authentische fulgoranische Baupläne.

tl-tesla-ammo-upgrade-technology=Fortschritte bei tragbaren Teslaspulen deckten Schwächen der Grundkonstruktion auf. Ihre Beseitigung macht Teslaspulen effizienter und verbessert ihre Fähigkeiten umfassend.
tl-tesla-coil-damage-technology=Stärkere Kondensatoren und leichte Schwingungen der Stromfrequenz erhöhen den wirksamen Schaden des Teslalichtbogens.
tl-tesla-coil-shooting-speed=Verbesserte Batterieeffizienz lässt Teslaspulen ihre kritische Kapazität schneller erreichen und erhöht so die Feuerrate.

tl-flames-explosion-technology=Teslageschosse bündeln genug Energie, um die Luft selbst zu entzünden. Die kurze Kettenreaktion erzeugt eine heftige Feuerexplosion.\n\nJede Stufe von „Eruption“ vergrößert den Wirkungsbereich.\n\nSchaden: 60% des Turmschadens.
tl-flames-count-technology=Entzünden starke Ströme trockenen Boden und Staub, entsteht eine überraschend heftige Verbrennung. Die Flammen leben nur wenige Sekunden, erzeugen aber gefährliche Hitze und verkohlen alles.\n\nJede Stufe von „Stichflamme“ erhöht Flammenzahl und Schaden pro Sekunde.
tl-flames-probability-technology=Extrem konzentrierte Energie kann Vegetation, Staub oder sogar Luft entzünden.\n\nJede Stufe von „Verbrennung“ erhöht die Chance, das Ziel der Teslaspule und seine unmittelbare Umgebung zu entzünden.

tl-single-zap-count-technology=Ein Treffer der fortschrittlichen Teslaspule kann große statische Ladung im Opfer speichern und es heftig zerstören. Verbleibende Ladung schlägt zu nahen Widerständen über: ein Entladungsblitz.\n\nJede Stufe von „Entladung“ erhöht die Zahl freigesetzter Entladungsblitze beim Töten eines Feindes durch den Turm.
tl-single-zap-damage-technology=Nach der Zielzerstörung verbleibende Ladung wird zum Entladungsblitz. Er trägt nur einen Teil der Anfangsladung, lässt sich aber durch Feinabstimmung der Spulenresonanz verstärken.\n\nJede Stufe von „Schwerer Blitz“ erhöht den Schaden der Entladungsblitze.
tl-single-zap-probability-technology=Fortschrittliche Teslaspulen führen ungeheure Energie. Kann das Ziel den Strom nicht halten, fließt er über ionisierte Luft als einzelne Lichtbögen zu nahen Einheiten.\n\nJede Stufe von „Überladung“ erhöht die Wahrscheinlichkeit zusätzlicher Lichtbögen, wenn die fortschrittliche Teslaspule einen Feind tötet.

tl-multi-zap-range-technology=Höhere Spulenströme erhöhen die Zahl ionisierter Teilchen im statischen Umfeld. Ladung kann dadurch leichter durch Luft zu ferneren Zielen gelangen.\n\nJede Stufe von „Ionisation“ erhöht die wirksame Übersprungreichweite.
tl-multi-zap-damage-technology=Feinabstimmung der ausgesandten Energiewellenlänge erzeugt stabilere, schädlichere Lichtbögen beim Ladungsübersprung im statischen Feld.\n\nJede Stufe von „Blitz“ erhöht den Schaden überspringender Ladungen.
tl-multi-zap-probability-technology=Ständiger Spulenbetrieb füllt die Umgebung mit ionisierten Teilchen. Sie lassen Ladung über das ursprüngliche Ziel hinaus auf nahe Objekte springen.\n\nJede Stufe von „Statisches Feld“ erhöht die Übersprungchance auf jeden nahen Feind.

tl-slowdown-duration-technology=Höhere Energieströme wirken stärker und bleiben länger im Ziel.\n\nJede Stufe von „Beständigkeit“ verlängert die Elektroschockwirkung.
tl-slowdown-multiplier-technology=Bestimmte Energieniveaus mit hohen Frequenzen verursachen Muskelkrämpfe, die Bewegung stark behindern.\n\nJede Stufe von „Betäubung“ verstärkt den Elektroschock und verlangsamt weiter.
tl-slowdown-probability-technology=Direkter Stromkontakt kann körperliche und neurologische Folgen wie Muskelkrämpfe und Lähmung auslösen.\n\nHöhere Elektroschockstufen erhöhen deren Wahrscheinlichkeit je Angriff.

tl-volatility-modulation-technology=Ionisation verbessert strombasierte Waffensysteme. Werden Doppelspulen mit wechselnden Frequenzen ionisiert, entsteht ein synergistisches Energiemuster. Diese Bionisation erweitert den Schwankungsbereich des Stroms stark.\n\nJede Stufe von „Bionisation“ senkt den möglichen Mindestschaden und erhöht den möglichen Höchstschaden erheblich.
tl-volatility-probability-technology=Ein integrierter Amplitudenregler maximiert die Instabilität des Doppelspulenstroms. Die Blitze erhalten genug Energie, um Kreaturen unterhalb der Größe einer mittelgroßen Wohnung vollständig aufzulösen.\n\nJede Stufe von „Verdampfung“ erhöht die Soforttötungschance. Ziele mit mehr als 5000 Trefferpunkten werden stattdessen schwer verletzt.

ei-waveform-harmonics-1=Stimmt das erste gemeinsame Entladungsprofil zwischen Legacy-Spulen und angebundener Tesla-Familie ab. Die primäre TL-Darstellung bleibt zunächst altbewährt, doch Trefferfeedback und Brückenverhalten werden vereinheitlicht. Erste direkte Verbindung zu Teslagewehr, Teslamunition und fulgoranischem Nachbau.
ei-waveform-harmonics-2=Erweitert die gemeinsame Wellenform um moderne verkettete Folgeeffekte. Grundspulen erhalten abgestimmte Feldlichtbögen, fortschrittliche Spulen modernisierte Nachschocks und die angebundene Tesla-Familie echte Kettensalven innerhalb der Legacy-Leiter.
ei-waveform-harmonics-3=Vollendet das harmonische Rückgrat. Folgeblitze übernehmen die volle Space-Age-Verkettung, der angebundene Turm erhält stärkere späte Ketteneffekte und der Legacy-Zweig ist bereit für echte Doktrinspezialisierung.
ei-storm-lattice-1=Die Grundspule wird zur eigenen Kontrolldoktrin. Sturmgitter I verbessert Zielübergaben und verbreitert das Lichtbogennetz, damit Schwärme im Feld bleiben, statt an den Rändern durchzubrechen.
ei-storm-lattice-2=Sturmgitter II hält das verzweigte Netz unter höherem Druck zusammen. Die Grundspule leitet Ladung über eine breitere, dichtere Feindfront weiter.
ei-storm-lattice-3=Die letzte Kontrollstufe der Grundspule. Sturmgitter III verstärkt die Schwarmunterdrückung im späten Spiel: mehr Sprünge, größere Reichweite und ein gezielter Sturmvorhang, weiterhin leichter und breiter als die fortschrittliche Spule.
ei-dielectric-rupture-1=Fortschrittliche Spulen töten und lassen Restladung das nächste Opfer jagen. Dielektrischer Durchbruch I schärft diese Doktrin, indem mehr nutzbare Energie im ersten Nachschock bleibt.
ei-dielectric-rupture-2=Dielektrischer Durchbruch II verlängert die Nachschockkette und erhöht die Zündbereitschaft der Entladung. Die fortschrittliche Spule bleibt der Hinrichtungspylon und trägt ihre Gewalt weiter durch die Reihe.
ei-dielectric-rupture-3=Die späte fortschrittliche Spule wird zur echten Tötungskettenwaffe. Dielektrischer Durchbruch III erhöht Reichweite, erhaltene Lichtbogenladung und Verbrennungsstärke, damit jede bestätigte Tötung dichte Angriffswellen zerlegen kann.
ei-bridge-coupling-1=Die Brücke zur ursprünglichen Tesla-Familie bleibt bewusst begrenzt. Brückenkopplung I erhöht späten Schaden und Kontrollvererbung für Teslagewehr, Teslamunition und fulgoranischen Nachbau, ohne sie zu verkleideten TL-Türmen zu machen.
ei-bridge-coupling-2=Die Brückenreihe bevorzugt am Ende gezielt Türme. Brückenkopplung II überträgt das dichtere späte Nachschockprofil auf den fulgoranischen Nachbau; tragbare Tesla-Ausrüstung bleibt leichter.
ei-reactance-overdrive-1=Zwei fortschrittliche Spulen auf einem Panzer konnten nie höflich bleiben. Reaktanzübersteuerung I erweitert den Instabilitätsbereich und erhöht die Zahl haltbarer Sättigungslichtbögen, ohne das Fahrzeug zum stationären Turm zu machen.
ei-reactance-overdrive-2=Spulentechnik des Fusionszeitalters erlaubt längere Überlastfenster. Reaktanzübersteuerung II verstärkt Sturmfrontverhalten: größere Modulationsschwankungen, mehr Überschläge und mehr Druck am Rand der Feuerbahn.
ei-reactance-overdrive-3=Die letzte spezialisierte Panzerstufe. Reaktanzübersteuerung III erhält die mechanische Eigenständigkeit und macht das Fahrzeug zu einer beweglichen elektrischen Front.
ei-exotic-waveform-convergence=Am Doktrinende erhalten Legacy-Türme eigene moderne Primärstrahlen. Die Grundspule wird zum verzweigten Feldlichtbogenturm mit garantiertem Seitenast bei sauberen Treffern. Die fortschrittliche Spule wird zur gebündelten Überladungslanze; jede bestätigte Tötung erzeugt zusätzlich zu normalen Nachschocks einen garantierten exotischen Hinrichtungssturm. Der Tesla-Panzer nimmt teilweise teil: modernisierte benachbarte Entladungen und Sturmfrontsalven bei positiven Instabilitätsspitzen. Der fulgoranische Nachbau erhält bei bestätigten Tötungen eine turmexklusive exotische Nachschockblüte; tragbare Brückenausrüstung nicht.

