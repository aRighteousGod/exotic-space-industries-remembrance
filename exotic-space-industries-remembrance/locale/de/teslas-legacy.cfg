ei-tl-behavior-mode-hybrid=Optionaler leichterer Pfad. Das Doktringitter trägt die Entladungslogik direkt und erhält die Kampfrolle bei geringerer UPS-Last.
ei-tl-behavior-mode-legacy-fidelity=Standard. Bewahrt das ursprüngliche Verhalten von Tesla's Legacy einschließlich alter Rekursion, dauerhafter Hilfseinheiten, tötungsbedingter Nachschocks und vollständiger Panzerinstabilität, unabhängig von UPS-Kosten.
tl-advanced-attack-anim-charge-up=Eine helle Ladung steigt im Kern der fortschrittlichen Teslaspule auf. Der Turm feuert, sobald sie die Krone erreicht. Tötet ein anderer Turm das Ziel vorher, kann sich die Neuausrichtung gelegentlich verzögern.
tl-advanced-attack-anim-simple=Strom peitscht zwischen den Spulen, sobald Feinde nahekommen. Die Spule feuert sofort.

