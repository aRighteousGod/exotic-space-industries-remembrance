teslas-legacy=Arsenale von Tesla's Legacy
teslas-legacy-text=Tesla's Legacy ist nun in Remembrances elektrisches Arsenal eingebunden. [item=tl-basic-tesla-coil]Teslaspule, [item=tl-advanced-tesla-coil]fortschrittliche Teslaspule und [item=tl-tesla-tank]Tesla-Panzer behalten Namen, Silhouetten und industrielle Identität. Gemeinsam folgen sie einer Doktrin: rauer Feldturm, schwerer Hinrichtungspylon, gepanzerte Sturmfront.\n\nDie Reihe greift auch auf die ursprüngliche Tesla-Familie über. [item=teslagun]Teslagewehr, [item=tesla-ammo]Teslamunition und [item=tesla-turret]fulgoranischer Nachbau teilen das harmonische Rückgrat, ohne zu TL-Türmen zu werden.
teslas-legacy-2=Verhaltensmodus
teslas-legacy-text-2=Aktueller Start-Verhaltensmodus: [font=default-bold]__1__[/font]\n\n[font=default-bold]Legacy-Originaltreue[/font] ist der Standard. Alte Rekursion, dauerhafte Unterstützungsentladungen, tötungsbedingte Nachschocks, Verbrennung und Panzerinstabilität bleiben maßgeblich. [font=default-bold]Hybrid[/font] führt dieselbe Doktrin über ein sparsameres Gitter; spätere Harmonik- und Doktrinforschung ergänzen reichere Folgeentladungen.\n\nDie Doktrinleiter ist gemeinsam, die Wirkungsreihenfolge anders. In Hybrid führt das neue Gitter. Bei Legacy-Originaltreue schlägt zuerst das ursprüngliche TL-Verhalten zu, dann folgen moderne Ergänzungen.
teslas-legacy-3=Wellenformharmonik
teslas-legacy-text-3=Wellenformharmonik ist das gemeinsame Rückgrat der Modernisierung. Zuvor behalten Legacy-Spulen ihre ursprünglichen TL-Strahlen. Harmonik I stimmt sie auf die angebundene Tesla-Familie ab. Harmonik II bringt moderne Folgeblitze für Grund- und fortschrittliche Spulen. Harmonik III vervollständigt die Verkettung und gibt dem angebundenen Turm sein dichtes Nachschockprofil.\n\nLegacy-Türme, fulgoranischer Nachbau und tragbarer Tesla-Zweig besitzen damit eine echte gemeinsame Entwicklung.
teslas-legacy-4=Quantenspezialisierung
teslas-legacy-text-4=Nach der Harmonik teilt sich die Doktrin. [font=default-bold]Sturmgitter[/font] gehört zur [item=tl-basic-tesla-coil]Grundspule: breitere Ausbreitung, sauberere Zielübergabe und stetigere Schwarmunterdrückung. [font=default-bold]Dielektrischer Durchbruch[/font] gehört zur [item=tl-advanced-tesla-coil]fortschrittlichen Spule und verstärkt Nachschocks nach Tötungen, Restladung und Verbrennung.\n\n[font=default-bold]Brückenkopplung[/font] spezialisiert den angebundenen Zweig. Die ursprüngliche Tesla-Familie wird stärker und behält ihre Identität. Der fulgoranische Nachbau erhält den größten Turmgewinn; tragbare Ausrüstung bleibt leichter.
teslas-legacy-5=Fusionsübersteuerung
teslas-legacy-text-5=Der [item=tl-tesla-tank]Tesla-Panzer teilt die Turmspezialisierungen nicht direkt. Seine späte Doktrin ist [font=default-bold]Reaktanzübersteuerung[/font]: Doppelspulensättigung, breitere Instabilitätsfenster und stärkere Überschläge im Fusionszeitalter. Er bleibt mechanisch eigenständig, eine Sturmfront auf Ketten.\n\nKritische Spitzen, Modulationsschwankungen und Verdampfung machen ihn zum Instabilitätsspezialisten der Reihe; die Türme ahmen das nicht nach.
teslas-legacy-6=Exotische Konvergenz
teslas-legacy-text-6=Die letzte Doktrinstufe ist [font=default-bold]exotische Wellenformkonvergenz[/font]. Die [item=tl-basic-tesla-coil]Grundspule behält ihren improvisierten Körper und wird zum modernen [font=default-bold]verzweigten Feldlichtbogenturm[/font] mit garantiertem Seitenausbruch bei jedem sauberen Primärtreffer. Die [item=tl-advanced-tesla-coil]fortschrittliche Spule behält ihren hohen Pylon und wird zur gebündelten [font=default-bold]Überladungslanze[/font]. Jede bestätigte Tötung erzeugt einen garantierten exotischen Hinrichtungssturm. Moderne Primärstrahlen erhalten getrennte Kampfrollen.\n\nBei [font=default-bold]Legacy-Originaltreue[/font] ergänzen diese Effekte das ursprüngliche TL-System; bei [font=default-bold]Hybrid[/font] krönen sie das sparsamere Gitter. Der [item=tl-tesla-tank]Tesla-Panzer nimmt teilweise teil: Instabilitätsspitzen und Verdampfung können Sturmfrontsalven auslösen, doch er bleibt die gepanzerte Sturmmaschine. Der [item=tesla-turret]fulgoranische Nachbau erhält eine eigene turmexklusive exotische Nachschockblüte bei bestätigten Tötungen. [item=teslagun]Teslagewehr und [item=tesla-ammo]Teslamunition bleiben auf dem leichteren Brückenpfad.
teslas-legacy-7=Kampfanzeigen und standardmäßiger Schwebetext
teslas-legacy-text-7=Kampfanzeigen bleiben gezielt. Texte für [font=default-bold]kritische Treffer[/font] und [font=default-bold]Verdampfung[/font] sind standardmäßig aktiv, damit Ausnahmemomente sichtbar bleiben. Gewöhnlicher [font=default-bold]Schadenstext[/font] ist standardmäßig aus, damit Kämpfe nicht in elektrischem Konfetti verschwinden.\n\nDas ist bei Übersprüngen, Nachschockketten, Brückenkopplung, Panzerinstabilität und modernen Strahlen besonders wichtig. Die Standardanzeige erhält dramatische Momente, ohne das Schlachtfeld zu überladen.
