ei-waveform-harmonics-1-effect=Wellenformharmonik I: abgestimmtes Trefferverhalten und erster gemeinsamer Brückenbonus.
ei-waveform-harmonics-2-effect=Wellenformharmonik II: moderne verkettete Folgeeffekte für Legacy-Spulen und die angebundene Tesla-Familie.
ei-waveform-harmonics-3-effect=Wellenformharmonik III: vollständige Space-Age-Folgeeffekte und stärkere Verkettung angebundener Türme.
ei-storm-lattice-1-effect=Sturmgitter I: Die Grundspule erhält breitere Feldlichtbogen-Ausbreitung und sauberere Zielübergabe.
ei-storm-lattice-2-effect=Sturmgitter II: Die Grundspule hält breitere Lichtbogengitter gegen stärkere Schwärme aufrecht.
ei-storm-lattice-3-effect=Sturmgitter III: Die Grundspule wird zum echten Unterdrückungsturm des späten Spiels.
ei-dielectric-rupture-1-effect=Dielektrischer Durchbruch I: Fortschrittliche Nachschocks behalten nach bestätigten Tötungen mehr Ladung.
ei-dielectric-rupture-2-effect=Dielektrischer Durchbruch II: Fortschrittliche Nachschocks reichen weiter und entzünden zuverlässiger.
ei-dielectric-rupture-3-effect=Dielektrischer Durchbruch III: Fortschrittliche Spulen verwandeln bestätigte Tötungen in kurze Hinrichtungsstürme.
ei-bridge-coupling-1-effect=Brückenkopplung I: Später Brückenschaden steigt, ohne die ursprüngliche Tesla-Familie der TL-Doktrin gleichzusetzen.
ei-bridge-coupling-2-effect=Brückenkopplung II: Der fulgoranische Nachbauturm erhält den stärkeren späten Brückenertrag.
ei-reactance-overdrive-1-effect=Reaktanzübersteuerung I: Der Tesla-Panzer erweitert seinen Instabilitätsbereich und schleudert mehr Sättigungslichtbögen.
ei-reactance-overdrive-2-effect=Reaktanzübersteuerung II: Der Tesla-Panzer hält Überlast länger und entlädt schwerere Sturmfronten.
ei-reactance-overdrive-3-effect=Reaktanzübersteuerung III: Der Tesla-Panzer erreicht seine endgültige Doppelspulenbrutalität des Fusionszeitalters.
ei-exotic-waveform-convergence-effect=Exotische Wellenformkonvergenz: Legacy-Spulen erhalten exotische Äste, Hinrichtungsstürme und Sturmfrontsalven. Der fulgoranische Nachbau erhält eine ausschließlich turmgebundene exotische Nachschockblüte.

