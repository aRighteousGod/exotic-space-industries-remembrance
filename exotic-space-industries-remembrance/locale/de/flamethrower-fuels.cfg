[item-name]
ei-flamethrower-fuel=Flammenwerfermunition (__1__)
[item-description]
ei-flamethrower-fuel=Feuerschaden: __1__% der Rohölmunition. Bodenfeuer beginnt bei __2__ Sekunden und erreicht bei weiterer Brennstoffzufuhr bis zu __3__ Sekunden. Die Dauer anhaftenden Feuers bleibt unverändert. Fahrzeugflammenwerfer behalten ihr natives Brandverhalten.
[entity-description]
ei-flamethrower-fuel=Brennstoffeffekte: __1__. Bodenfeuer beginnt bei __2__ Sekunden und erreicht bei weiterer Brennstoffzufuhr bis zu __3__ Sekunden.
[mod-setting-name]
ei-flamethrower-fuel-adaptation=Brennstoffabhängige Effekte von Flammenwerfer-Geschütztürmen
[mod-setting-description]
ei-flamethrower-fuel-adaptation=Passt Geschützturmflammen, Rauch und Bodenbranddauer automatisch an den Brennstoff an. Deaktiviert: gemeinsame Effekte und normale Branddauer; Schadensboni und Munitionsvarianten bleiben verfügbar. Läuft alle 16 Ticks. Brennstoffprüfungen und Ersetzungsversuche sind jeweils auf den vollen Wert „Maximale Skriptaktualisierungen pro Tick“ begrenzt. Abschalten stellt bestehende Geschütztürme schrittweise innerhalb dieses Budgets zurück. Standard: aktiviert. Bei Abschaltung entfällt auch die Bereinigung überlappender Flammen; verschiedene Brennstoffeffekte können sich überlagern.
