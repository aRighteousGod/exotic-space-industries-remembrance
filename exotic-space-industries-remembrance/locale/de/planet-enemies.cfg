[planet-enemies]
ordinary=Beißer, Speier und Würmer
ordinary-description=Häufigkeit und Größe gewöhnlicher Beißer- und Speiernester. Aus unterdrückt neue gewöhnliche Nester, Würmer und Kreaturen auf Nauvis. Explosive, kalte, arachnide und giftige Familien haben eigene Regler. Gepanzerte Schnapper folgen diesem Regler, wenn getrennte Nester in Armoured Biters deaktiviert sind. Bestehende Kreaturen bleiben erhalten.
arachnid=Arachnide Feinde
arachnid-description=Häufigkeit und Größe arachnider Nester auf Nauvis unter Erhalt ihrer natürlichen Geländepräferenz. Aus unterdrückt neue Nester, Kreaturen und Bosse dieser Familie. Bestehende Kreaturen bleiben; Kampfstärke wird getrennt über Feindschwierigkeit geregelt.
toxic=Giftige Feinde
toxic-description=Häufigkeit und Größe giftiger Nester auf Nauvis. Aus unterdrückt neue giftige Nester, Würmer, Kreaturen, Bosse und infizierte feindliche Gebäude. Bestehende Kreaturen bleiben; Kampfstärke wird getrennt über Feindschwierigkeit geregelt.
armoured=Gepanzerte Feinde
armoured-description=Häufigkeit und Größe getrennter gepanzerter Nester auf Nauvis. Wirkt nur bei aktivierter Startoption für getrennte Nester in Armoured Biters. Dann unterdrückt Aus neue gepanzerte Nester und Schnapper. Ohne getrennte Nester erzeugen gewöhnliche Nester Schnapper; der gewöhnliche Feindbasisregler ist zuständig, dieser Regler wirkungslos. Bestehende Kreaturen bleiben.
explosive=Explosive Feinde
explosive-description=Häufigkeit und Größe explosiver Feindnester. Deaktivieren unterdrückt auch Würmer, Einheiten und skriptgesteuerten Nachwuchs dieser Familie auf dem Planeten. Kampfstärke wird getrennt über Feindschwierigkeit geregelt.
cold=Kalte Feinde
cold-description=Häufigkeit und Größe kalter Feindnester. Deaktivieren unterdrückt auch Würmer, Einheiten und skriptgesteuerten Nachwuchs dieser Familie auf dem Planeten. Kampfstärke wird getrennt über Feindschwierigkeit geregelt.
electric=Elektrische Feinde
electric-description=Häufigkeit und Größe elektrischer Feindnester. Deaktivieren unterdrückt fliegende und laufende Feinde einschließlich Fulgoras Tresorwächter auf diesem Planeten. Positive Reglerwerte verändern die Wächterstärke nicht.
pentapod=Pentapoden
pentapod-description=Häufigkeit und Größe von Pentapoden-Eiflößen. Bei Deaktivierung bleiben inaktive Eiflöße in normaler Dichte erhalten, damit Eier sammelbar bleiben. Verteidiger, umherziehende Pentapoden und schlüpfender Nachwuchs werden auf Gleba unterdrückt. Anderswohin transportierte Eier folgen den Einstellungen ihres Zielorts.
demolisher=Zerstörerterritorien
demolisher-description=Häufigkeit bestimmt die Dichte besetzter Territorien, Größe deren Fläche. Unter 100% Häufigkeit bleiben manche Territorien leer. Hohe Dichte wird durch die Mindestterritoriumsgröße begrenzt. Deaktivieren verhindert neue besetzte Territorien und Zerstörer; explosive Feinde bleiben unabhängig einstellbar. Kreaturengröße, Kampfstärke und sicheres Startgebiet bleiben gleich.
