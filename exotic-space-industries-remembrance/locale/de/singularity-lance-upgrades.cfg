[lance-upgrades]
axial=Ein zentraler Schnitt von __1__ Feldern Breite reicht bis zu __2__ Felder hinter den Kontaktpunkt und trifft bis zu __3__ weitere feindliche Militärziele mit je __4__ Laserschaden. Zwei Äste zweigen bei ±__5__° ab, jeweils __6__ Feld breit und bis zu __7__ Felder lang. Gemeinsam treffen sie bis zu __8__ weitere Ziele mit je __9__ Laserschaden. Alle Strahlen bleiben innerhalb der wirksamen Reichweite. Jeder Feind erhält höchstens einen Schnitttreffer; der zentrale Strahl hat Vorrang.
wound=Der erste Primärtreffer erhält keinen Bonus, der zweite +__1__% Schaden. Jeder folgende positive Treffer auf dasselbe Ziel erhöht den nächsten um __1__ Prozentpunkte bis höchstens +__2__%. Zielwechsel oder eine Pause von __3__ Sekunden setzen die Folge zurück. Nullschaden erhöht weder die Folge noch erneuert er ihre Ablaufzeit. Sekundärschaden bleibt unberührt.
collapse=Ersetzt gewöhnlichen Flächenschaden durch einen Kollaps am Kontaktpunkt __1__ Sekunden nach Strahlkontakt: __5__ Laserschaden innerhalb von Radius __6__, sonst __2__ innerhalb von Radius __3__. Trifft bis zu __4__ weitere feindliche Militärziele sowie das ursprüngliche Primärziel, falls es noch im Bereich ist. Jedes Opfer erhält Kern- oder Außenschaden, niemals beides.
testament=Jeder __1__. bezahlte Schuss: Primärschaden ×__2__, einschließlich Wundgedächtnis; zentraler Schnitt höchstens __3__ Ziele, beide Äste gemeinsam __7__. Erster Kollaps: __8__ Laserschaden innerhalb von Radius __9__, sonst __4__ innerhalb von Radius __5__; bis zu __6__ weitere Ziele plus berechtigtes Primärziel. Ein Echo __10__ Sekunden nach Strahlkontakt: __11__ Laserschaden, Radius __12__, bis zu __13__ weitere Ziele plus berechtigtes Primärziel. Der Schuss zählt auch bei verschwundenem oder geschütztem Ziel.
research-row=__1__ (durch Forschung freigeschaltet)
protection-title=Zielschutz
protection=Das ursprüngliche Primärziel ist von gewöhnlichem Flächenschaden und allen Schnittstrahlen ausgenommen. Es kann aber jeden Kollaps im Explosionsbereich erhalten, ohne einen Sekundärzielplatz zu belegen. Eigene, neutrale, befreundete und Waffenstillstandsparteien sind in beiden Richtungen geschützt. Ein Feind kann einen Schnitttreffer und je einen Treffer pro Kollaps erhalten.
status=Direkter Grundschaden/s: __1__
contact-title=Strahlkontakt
contact=Strahlkontakt erfolgt __1__–__3__ Ticks nach dem Schuss (höchstens __4__ s), abhängig von Drehwinkel und wartenden Schüssen. Nominelle Drehrate: __2__° je Tick. Der Strahl folgt dem gewählten Ziel bis zum Kontakt. Dann wirken Primärschaden und erforschter Schnittschaden. Erforschbare Kollapsverzögerungen beginnen beim Kontakt; die Explosionen bleiben an dieser Position.
status-wound= • Wund-Primärschaden __1__–__2__
status-testament= • Jeder __1__. Schuss ×__2__
baseline=Grundwerte
force-values=Deine Partei • Schadensmultiplikator ×__1__ • Primärtreffer __2__ Laser • dauerhafter direkter Schaden/s __3__ vor Wunde/Testament • Grundreichweite __4__ Felder, durch Qualität erhöht. Folgende Werte enthalten die Schadensforschung dieser Partei.
base-area=Gewöhnlicher Flächenschaden: __1__ Laserschaden, Radius __2__, bis zu __3__ weitere Ziele. Wird durch Endgültigen Kollaps ersetzt.
rules=Jeder bezahlte Schuss und jeder Kollaps bleiben getrennte Schadenspakete. Der Zentralstrahl hat Vorrang vor den Ästen; Überlappung verdoppelt keinen Schnittschaden. Jeder Kollaps verursacht Kern- oder Außenschaden, niemals beides. Zielmitte und Kerngrenze entscheiden; Ziele genau auf der Grenze zählen mit. Beide Kollapse bleiben am Kontaktpunkt, auch bei Zielbewegung oder Entfernung der Lanze. Herausbewegen kann sie vermeiden. Ihre Werte werden beim Schuss festgelegt. Wunde verfällt bei Inaktivität, ihre Markierung folgt dem Ziel. Testament zählt bezahlte Schüsse, keine Opfer. Schwarzes-Loch-Forschung schaltet die letzte Stufe frei; ein laufendes schwarzes Loch ist unnötig. Qualität und native Zielgrenzen bestimmen direkte Reichweite. Kernhinweise bleiben bei jeder Effektstufe sichtbar; Dekoration verändert nie den Schaden.
research-state=__1__ — __2__
active=Aktiv
locked=Gesperrt
prerequisites=Direkte Voraussetzungen:
science=Benötigte Forschungspakete:
legend-1=Darstellung: weißgoldener Zentralschnitt mit cyanfarbenen Rändern und zwei schmaleren prismatischen Ästen am Kontaktpunkt. Fließende Bänder und auslaufende Schweife zeigen die tatsächlichen Strahlenden.
legend-2=Darstellung: fließende Farbe folgt einem gespaltenen Bruch bei 1–2 Stapeln, Verzweigungen bei 3–4 und einem gebrochenen Heiligenschein bei 5. Die Markierung folgt dem Ziel und verfällt mit der Wunde.
legend-3=Darstellung: Prismatische Kometenschweife spiralen um einen schrumpfenden Außenring und eine sichtbare Kerngrenze am festen Kontaktpunkt. Ein stärkerer Zentralblitz markiert den Schadenstick.
legend-4=Darstellung: dunkle Strahlnaht zwischen breiten prismatischen Rändern; größerer dunkler Kollapskern mit hellem Akkretionsring, danach eine zweite Kontraktion und ein Schlusskreuz für das Echo.
static-values=Der angegebene Schaden ist der Grundwert vor der Schadensforschung der Lanze. Wunde hängt von der Primärtrefferfolge ab, Testament von bezahlten Schüssen. Daher gibt es keinen einheitlichen Flächenschaden-pro-Sekunde-Wert.
