guide-summary=Der einfache Bericht trennt den lokalen Tag vom Jahreszeitenkalender. Der Tagesstreifen zeigt die aktuellen Lichtphasengrenzen der Oberfläche und die vollständige Rotationsdauer; der Jahreszeitenstreifen folgt ESIRs Jahreskalender. Geschätzte Restzeiten nutzen die aktuellen Einstellungen. Fulgora behält seine unabhängige Tagessteuerung; angehaltene Zeit oder dauerhaftes Tageslicht unterdrücken die üblichen Vorhersagen. Landschaftsbanner dienen der Dekoration. Die Aktivitätskarten zählen erfolgreiche aufgezeichnete Änderungen, auch mehrere Änderungen derselben Stelle. Sie zeigen die letzte bekannte Aktivität jeder Kategorie; ältere Summen können ohne gespeicherte Zeit vorliegen. Messalter und Erfassungsabdeckung beschreiben begrenzte Feldbeobachtungen, nicht den Zustand der gesamten Welt.
