record-help=Die Zähler erfassen erfolgreiche Änderungen durch ESIR, keine einzelnen Flächen und keine vollständige Geländeaufnahme. Dieselbe Stelle kann sich mehrfach ändern. Ältere Spielstände behalten ihre Summen, haben aber möglicherweise keine Aktivitätszeiten. Bei Vegetationsbränden werden Zündungen gezählt, nicht verlorene Waldflächen.
ground-help=Die Erholung kann aufgezeichnete Geländeänderungen zurückverfolgen, wenn die Bedingungen es erlauben. Ein Belag oder eine Änderung durch ein anderes System kann den gespeicherten Verlauf unbrauchbar machen; späteres Entfernen stellt den Verlauf nicht wieder her. Infrastruktur, bewirtschaftete Flächen und besondere Orte bleiben geschützt.
ground-conditions=Bodenschäden benötigen mindestens __1__ Verschmutzung für __2__; Erholung benötigt Messwerte von höchstens __3__ für __4__. Zuverlässige Beobachtungen und gesonderte Gelegenheiten sind weiterhin erforderlich.
pollution-unavailable=Die Verschmutzung dieser Welt lässt sich nicht zur Beurteilung industrieller Belastung nutzen. Glebas Sporen sind keine Industrieverschmutzung.
mining-recovery-on=Abbauerholung ist aktiviert. Aufgezeichnete Narben können sich erholen, wenn die erforderlichen sauberen Bedingungen und Schutzprüfungen erfüllt sind.
mining-recovery-off=Abbauerholung ist deaktiviert. Aufgezeichnete Abbaunarben bleiben, bis diese Option aktiviert oder das Gelände ersetzt wird.
woodland-help=Dies sind aufgezeichnete Änderungen an unterstützten Wildbäumen. Kulturpflanzen und geschützte Flora sind ausgenommen. Natürlich graue Bäume allein sind kein Beleg für Verschmutzungsschäden.
woodland-unavailable=Diese Welt hat keinen unterstützten einheimischen Wald für diese Effekte.
other-help=Effekte benötigen weiterhin geeignetes örtliches Gelände und Schutzprüfungen. Uferänderungen sind auf unterstützte Kombinationen aus Süßwasser und Küstenboden auf Nauvis begrenzt. Für Pflasterkorrosion gelten eigene ausdrückliche Voraussetzungen.
survey=Letzte lokale Messung: vor __1__. __2__\nBeobachtungen erfassen nur besuchte Bereiche. Unbeobachtetes Gelände ist nicht nachweislich gesund.
survey-none=Es gibt noch keine zuverlässige lokale Messung. Beobachtungen erfassen nur besuchte Bereiche; unbeobachtetes Gelände ist nicht nachweislich gesund.
coverage-discovering=Die Ersterfassung läuft noch.
coverage-observed=Der Ersterfassungsdurchlauf ist beendet; er ist keine vollständige Zustandsprüfung.
coverage-limited=Die Erfassungsabdeckung bleibt begrenzt.
coverage-unknown=Die Erfassungsabdeckung ist noch nicht festgestellt.
