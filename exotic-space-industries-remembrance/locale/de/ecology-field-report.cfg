clock-help=Die Zeitangaben beziehen sich auf die Simulation. Der Streifen beginnt mit dem vollen Tageslicht; die Markierung zeigt die beobachtete Position im Zyklus. Vorhersagen nutzen die aktuellen Phasengrenzen und die Zyklusdauer, die eine andere Steuerung ändern kann. Dies ist keine Vorhersage der Solarstromproduktion.
