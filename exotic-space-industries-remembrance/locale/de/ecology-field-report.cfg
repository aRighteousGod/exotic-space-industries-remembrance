invalid-cycle=Der aktuelle Zyklus lässt sich nicht zuverlässig ablesen. Es wird kein Übergang vorausgesagt.
seasons=__1__ · __2__% dieser Jahreszeit vergangen\nFortschritt im Jahr: __3__%\nNächste Jahreszeit in __4__\nJahreslänge: __5__\nEntspricht __6__ lokalen Tagen bei der aktuellen Zyklusdauer.
calendar-help=Der Jahreszeitenkalender und der lokale Tag sind getrennte Uhren. Ein Kalenderjahr entspricht __1__ Referenztagen. Die Umrechnung in lokale Tage nutzt die heutige Zyklusdauer und zählt nicht die vergangenen Umdrehungen.
