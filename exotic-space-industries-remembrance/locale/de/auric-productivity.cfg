ei-productivity-auric-precipitation=Produktivität der aurischen Fällung

[technology-description]
ei-productivity-auric-precipitation=Jede Stufe erhöht die Produktivität beim Waschen aurischer Schlacke um 10 Prozentpunkte. Zusätzliche Produktionszyklen liefern nur Gold, keine zusätzliche Schlacke und kein Schmutzwasser. Produktivitätsmodule sind zulässig; alle Produktivitätsboni teilen sich eine Obergrenze von +300%. Die Forschung kann unbegrenzt fortgesetzt werden, erhöht den Ertrag oberhalb dieser Grenze aber nicht mehr.
