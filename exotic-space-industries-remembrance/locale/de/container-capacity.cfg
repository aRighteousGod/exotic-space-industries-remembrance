[mod-setting-name]
ei-container-capacity-profile=Behälterkapazitätsprofil

[mod-setting-description]
ei-container-capacity-profile=Legt die Inventarkapazität von Spielerlagerkisten fest, auch aus anderen Mods. Plätze bei normaler Qualität; Spalten: Holz / Eisen / Stahl / Klein / Mittel / Lagerhaus.\n__1__\n\nNormale, gefilterte und logistische Varianten teilen ihre Größenstufe. Qualitätsboni bleiben unverändert. Funktionsinventare von Maschinen sind ausgenommen. Eine Verringerung kann bestehende Inventare verkleinern und Gegenstände verlieren lassen.

[container-capacity]
row=__1__: __2__ / __3__ / __4__ / __5__ / __6__ / __7__
option-template=Plätze bei normaler Qualität: Holz __1__ / Eisen __2__ / Stahl __3__ / Klein __4__ / Mittel __5__ / Lagerhaus __6__.

[string-mod-setting]
ei-container-capacity-profile-restrained=Zurückhaltend (Standard)
ei-container-capacity-profile-standard=Standard
ei-container-capacity-profile-expanded=Erweitert
ei-container-capacity-profile-generous=Großzügig
ei-container-capacity-profile-industrial=Industriell
ei-container-capacity-profile-massive=Massiv
ei-container-capacity-profile-vast=Weitläufig
ei-container-capacity-profile-extreme=Extrem

[string-mod-setting-description]
ei-container-capacity-profile-restrained=Plätze bei normaler Qualität: Holz 8 / Eisen 16 / Stahl 16 / Klein 24 / Mittel 32 / Lagerhaus 64.
ei-container-capacity-profile-standard=Plätze bei normaler Qualität: Holz 8 / Eisen 16 / Stahl 24 / Klein 32 / Mittel 64 / Lagerhaus 128.
ei-container-capacity-profile-expanded=Plätze bei normaler Qualität: Holz 16 / Eisen 24 / Stahl 32 / Klein 48 / Mittel 96 / Lagerhaus 192.
ei-container-capacity-profile-generous=Plätze bei normaler Qualität: Holz 16 / Eisen 32 / Stahl 48 / Klein 64 / Mittel 128 / Lagerhaus 256.
ei-container-capacity-profile-industrial=Plätze bei normaler Qualität: Holz 24 / Eisen 48 / Stahl 64 / Klein 96 / Mittel 192 / Lagerhaus 384.
ei-container-capacity-profile-massive=Plätze bei normaler Qualität: Holz 32 / Eisen 64 / Stahl 96 / Klein 128 / Mittel 256 / Lagerhaus 512.
ei-container-capacity-profile-vast=Plätze bei normaler Qualität: Holz 48 / Eisen 96 / Stahl 128 / Klein 192 / Mittel 384 / Lagerhaus 768.
ei-container-capacity-profile-extreme=Plätze bei normaler Qualität: Holz 64 / Eisen 128 / Stahl 192 / Klein 256 / Mittel 512 / Lagerhaus 1024.
