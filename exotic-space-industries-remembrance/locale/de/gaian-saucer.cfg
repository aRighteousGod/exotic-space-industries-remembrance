[item-description]
ei-gaian-saucer=Eine schnelle Gaia-Schwebehülle mit versiegeltem Frachtraum und Ausrüstungsgitter, ohne sichtbare Beine. Sie bewegt sich wie ein erinnerter Schritt und hinterlässt gebrochene Farben.

[entity-description]
ei-gaian-saucer=Ein schnelles Gaia-Schwebechassis mit Spidertron-Steuerkern.\nEs gleitet, indem es dem Boden falsche Füße einprägt. Ein starker Schweifeid lässt hinter der Maschine eine farbige Gleitschleppe aufblühen.

[recipe-description]
ei-gaian-saucer=Versetzt einen Spidertron-Steuerkern in eine Gaia-Schwebehülle, entfernt die Werfer und lässt das Triebwerk Bewegung ohne Gliedmaßen erinnern.

[technology-description]
ei-gaian-saucer=Schaltet die Gleitschweif-Untertasse frei: ein Gaia-Schwebefahrzeug mit Frachtraum, Ausrüstungsgitter und farbigem Schweif, dessen Bewegung der Boden als Eid erinnert.

[mod-setting-name]
ei-gaian-saucer-wake-visual-fidelity=Schweifresonanz der Gleitschweif-Untertasse

[mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity=Regelt, wie stark die Gleitschweif-Untertasse ihre Passage einprägen darf. Betrifft nur den Farbschweif; Frachtraum, Gitter, Antrieb, Hülle und Herstellung bleiben unverändert.

