gaian-saucer=Gleitschweif-Untertasse
gaian-saucer-text=Die [item=ei-gaian-saucer] Gleitschweif-Untertasse ist ein Gaia-Schwebefahrzeug: ein Spidertron-Steuerkern, bestattet in einer Hülle, die Beine verweigert. Frachtraum, Ausrüstungsgitter und leeregespeister Antrieb machen sie zum Pilgerwerkzeug für feindliche Schwellen.
gaian-saucer-2=Schweifresonanz
gaian-saucer-text-2=Aktueller Schweifeid: [font=default-bold]__1__[/font]. Er ändert nur die farbige Erinnerung hinter der Hülle: Leuchtkraft, Dauer der Wendespur und die Tiefe der eingeprägten Passage. Das Fahrzeug selbst bleibt unverändert.
