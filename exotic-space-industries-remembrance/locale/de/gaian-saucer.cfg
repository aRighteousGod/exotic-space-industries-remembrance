[string-mod-setting-description]
ei-gaian-saucer-wake-visual-fidelity-off=Das Fahrzeug versiegelt sein Nachbild und reist ohne sichtbare Erinnerung.
ei-gaian-saucer-wake-visual-fidelity-lean=Nur eine feine farbige Verweigerung folgt der Hülle, kurz und diszipliniert.
ei-gaian-saucer-wake-visual-fidelity-standard=Der Schweif darf klar sprechen und verblasst, bevor er zur Doktrin wird.
ei-gaian-saucer-wake-visual-fidelity-cinematic=Der Schweif wird breiter, verweilt und biegt sich mit dem Wendeeid der Untertasse.
ei-gaian-saucer-wake-visual-fidelity-maximal=Die Hülle hinterlässt überall eine dichte leuchtende Bewegungswunde.
ei-gaian-saucer-wake-visual-fidelity-unbounded=Die Begrenzung entfällt; die Untertasse darf jedes Schimmern zeichnen, das die Welt erträgt.

