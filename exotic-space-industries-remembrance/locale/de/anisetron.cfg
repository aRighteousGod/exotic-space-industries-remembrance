[string-mod-setting-description]
ei-anisetron-visual-fidelity-off=Die Kathedrale versiegelt ihr Nachbild. Bewegungsspuren und Waffenzier schweigen; beide schneidenden Signale bleiben sichtbar.
ei-anisetron-visual-fidelity-lean=Acht feine Fäden folgen den unteren Kristallen, begleitet von dezenter Waffenresonanz. Vom Rumpf verdeckte Ansätze bleiben verborgen.
ei-anisetron-visual-fidelity-standard=Grüne Fäden erinnern die Prozession; farbige Höfe und kurze Trefferblitze antworten ihren Zielen.
ei-anisetron-visual-fidelity-cinematic=Die Prozession erneuert ihre acht Fäden häufiger unter einer stärker strahlenden Waffenhülle.
ei-anisetron-visual-fidelity-maximal=Dichte Resonanz sammelt sich unter den Kristallen und um jedes schneidende Signal.
ei-anisetron-visual-fidelity-unbounded=Die optische Begrenzung entfällt. Jede registrierte Kathedrale darf ihre Spur zeichnen, mit kurzlebigen Fäden und unverändertem Waffenschaden.

[exotic-industries-informatron]
menu_gaian_hierophant=Hierophant von Gaia
title_gaian_hierophant=Hierophant von Gaia
gaian-hierophant-intro=Ein Heiligtum verwandelt Hingabe in ein schneidendes Signal. Der Hierophant von Gaia ist eine langsam schwebende Kathedrale mit zwei Kristallstrahlen und nativer Spidertron-Steuerung.
gaian-hierophant-controls=Steuerung und Versorgung
gaian-hierophant-controls-text=Nutze die normale Spidertron-Steuerung, Fernbedienung und den Autopiloten. Ausrüstung, Fracht, Müllplätze und Fahrzeuglogistik verwenden die nativen Oberflächen. Manuelles und automatisches Feuer starten denselben bezahlten Feuerstoß; das Fahrzeug kann währenddessen fahren. Die Schwebestabilisierung begrenzt gestapelte Verlangsamung, doch Schaden und direkte Betäubung wirken weiterhin.
gaian-hierophant-weapons=Zwei Kristalle, zwei Zielbindungen
gaian-hierophant-weapons-text=Bei normaler Munitionsqualität verursacht die Krone alle __2__ Ticks __1__ Laserschaden, besitzt __3__ Felder Grundreichweite und deckt __4__ Grad ab. Die Fassade verursacht alle __2__ Ticks __5__ Laserschaden innerhalb von __6__ Feldern und einem Frontsektor von __7__ Grad. Jeder Strahl hält ein zulässiges Ziel und schwenkt bei Zielverlust gleichmäßig zum nächsten. Schaden beginnt erst nach Erfassung; bloßes optisches Überstreichen erfasst keine Einheit. Fahrzeugqualität erhöht die Kronenreichweite; die Fassadenreichweite bleibt fest.
gaian-hierophant-charge=Eine Ladung, eine Feuerperiode
gaian-hierophant-charge-text=Ein [item=ei-anisetron-crystal-charge] bezahlt beide Strahlen für __1__ Sekunden. Bei gleichzeitigem Kontakt verursachen sie zusammen bis zu __2__ Laserschaden pro Sekunde vor Forschung, Verbesserungen und Resistenzen. Suche und Schwenken verbrauchen dieselbe Feuerzeit; ungenutzter Schaden wird weder gespeichert noch zwischen den Strahlen übertragen. Nachschub erfolgt über die Fahrzeugmunitionslogistik. Bezahltes Feuer läuft bei Munitionsmangel oder Loslassen des manuellen Feuers weiter. Entfernen des Fahrzeugs beendet verbleibende Treffer; bereits ausgelöste Kollapse und Echos laufen zu Ende.
gaian-hierophant-upgrades=Vererbung der Lanze
gaian-hierophant-upgrades-text=Munitionsqualität sowie [technology=laser-weapons-damage-6] und höhere Stufen verstärken beide Strahlen. Nur die Krone erbt [technology=ei-singularity-lance-axial-rupture], [technology=ei-singularity-lance-wound-memory], [technology=ei-singularity-lance-terminal-collapse] und [technology=ei-singularity-lance-black-hole-testament]: zusätzliche Schnitte, anwachsenden Wundschaden, verzögerten Kollaps und einen verstärkten Impuls alle __1__ geplanten Kronenimpulse. Diese Verbesserungen sind keine Bauvoraussetzungen. Beim Bezahlen einer Ladung werden Schaden, Reichweiten, Qualität und erforschte Verbesserungen festgelegt; neue Forschung wirkt erst auf spätere Ladungen.
gaian-hierophant-construction=Montage auf Gaia
gaian-hierophant-construction-text=Erforsche [technology=ei-anisetron] nach der Gaia-Untertasse, der Singularitätslanze und Laserwaffenschaden 5. Montiere auf Gaia ein leeres [item=ei-gaian-saucer]-Chassis, eine [item=ei-singularity-lance] und die übrigen Rezeptzutaten. Entferne vorher Ausrüstung und Ladung: Dieses normale Rezept erzeugt ein neues Fahrzeug und überträgt keine Konfiguration. Kristallladungen lassen sich auf jeder Oberfläche herstellen.
gaian-hierophant-visuals=Optische Resonanz
gaian-hierophant-visuals-text=Gewählte Startvoreinstellung: __1__. Sie regelt grüne Bewegungsspuren, Strahlenhöfe und Trefferblitze. Beide Kernstrahlen und wesentliche Verbesserungssignale bleiben auch ohne Dekoration sichtbar. Die Darstellungsqualität verändert weder Schaden, Zielerfassung, Reichweite, Ladungsverbrauch, Feuerdauer noch Bewegung. Höhere Stufen erlauben mehr Ziereffekte; „Entfesselt“ hebt diese Grenzen auf und kann mehr UPS kosten.
