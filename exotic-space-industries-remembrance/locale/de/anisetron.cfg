[mod-setting-name]
ei-anisetron-visual-fidelity=Optische Resonanz des Hierophanten von Gaia

[mod-setting-description]
ei-anisetron-visual-fidelity=Regelt die acht grünen Bewegungsspuren, Strahlenhöfe und Trefferblitze der Kathedrale. Beide Kernstrahlen, wesentliche Bruchsignale und alle 128 Körperrichtungen bleiben auf jeder Stufe sichtbar. Schaden, Reichweite, Kristallverbrauch, Feuerdauer und Bewegung bleiben unverändert.

