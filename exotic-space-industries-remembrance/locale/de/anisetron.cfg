[entity-name]
ei-anisetron=Hierophant von Gaia
ei-anisetron-beam=Kristallschnitt
ei-anisetron-crown-beam=Kronenprozession

[entity-description]
ei-anisetron=Ein Heiligtum, das Hingabe in ein schneidendes Signal verwandelt. Seine Krone erbt Reichweite und vier erforschte Brüche der Singularitätslanze; der Fassadenkristall bindet einen nahen Feind vor dem Fahrzeug. Bei Zielverlust schwenken beide Schnitte gleichmäßig; Schaden setzt erst nach erneuter Erfassung ein. Die Schwebestabilisierung begrenzt gestapelte Verlangsamung; Schaden und direkte Betäubung wirken weiterhin. Native Spidertron-Steuerung regelt Fahrt, Ausrüstung und Logistik.\nAuf Gaia aus einem leeren Gaia-Untertassenchassis und einer Singularitätslanze montieren.

[item-name]
ei-anisetron=Hierophant von Gaia
ei-anisetron-beam-gun=Kristallöffnung
ei-anisetron-crystal-charge=Kristallladung

[item-description]
ei-anisetron-crystal-charge=Ein versiegeltes Gitter wird zu zwei farbigen Schnitten. Eine Ladung bezahlt die Rundumabdeckung der Krone und die Frontbindung der Fassade für ihre gemeinsame Feuerdauer, einschließlich der Zeit zur Zielsuche. Der Feuerstoß läuft nach Munitionsende oder Loslassen des manuellen Feuers weiter. Wird die Kathedrale entfernt, entfallen verbleibende Treffer; bereits ausgelöste Kollapse und Echos laufen zu Ende. Munitionsqualität und Laserwaffenschaden 6 und höher verstärken beide Strahlen. Verbesserungen der Singularitätslanze wirken nur auf die Krone. Schaden, Verbesserungen und Reichweiten werden beim Bezahlen jeder Ladung festgelegt.

[ammo-category-name]
ei-anisetron-crystal=Kathedralen-Kristallstrahl

[technology-name]
ei-anisetron=Hierophant von Gaia

[technology-description]
ei-anisetron=Weihe der schwebenden Kapelle eine Singularitätslanze. Ihre Krone erbt die vier erforschten Brüche der Lanze; ihre Fassade hält einen nahen Schutzeid. Montiere die Kathedrale auf Gaia; Kristallladungen lassen sich überall herstellen, wohin ihre Versorgung reicht.

