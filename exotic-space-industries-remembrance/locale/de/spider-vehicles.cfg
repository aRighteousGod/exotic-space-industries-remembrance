[entity-description]
ei-scout-spidertron=Dreibeiniges Logistik- und Erkundungsfahrzeug. Ohne montierte Waffen; das Ausrüstungsraster nimmt persönliche Laser und andere Rüstungsausrüstung auf. Profitiert von gemeinsamer Spinnenfahrwerk-Forschung.
assault_spidertron=Kampfläufer des Simulationszeitalters mit Kanone, Maschinengewehr und Flammenwerfer. Forschung ergänzt Artilleriehalterung, Waffenverbesserungen und reaktiven Rauch. Profitiert von gemeinsamer Spinnenfahrwerk-Forschung.

[item-name]
