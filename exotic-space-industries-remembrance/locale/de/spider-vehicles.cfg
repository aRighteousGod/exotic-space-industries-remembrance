[mod-setting-description]
ei-spider-range-aware-cycling=Bei aktiviertem Fahrzeug-Waffenwechsel werden automatisch Waffen mit Zielen in Reichweite gewählt und für anhaltende Feuerphasen eingesetzt. Führt regelmäßige lokale Zielsuchen aus. Deaktiviert: nativer Wechsel ohne skriptgesteuerte Suche; unterschiedliche Waffenreichweiten können den nativen Wechsel verhindern.

