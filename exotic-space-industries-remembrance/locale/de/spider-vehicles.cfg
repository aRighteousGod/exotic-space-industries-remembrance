chassis-hull-description=Gemeinsame Aufwertung: maximale Spähergesundheit __1__; maximale Gesundheit von Angriffs- und Raketen-Spidertrons __2__. Der aktuelle Gesundheitsanteil bleibt erhalten.
chassis-cargo-description=Gemeinsame Aufwertung: Späherfrachtraum __1__ Plätze; Frachtraum von Angriffs- und Raketen-Spidertrons __2__ Plätze.
chassis-fuel-description=Gemeinsame Aufwertung: Brennstoff- und Reststoffinventare der Späher erhalten jeweils __1__ Plätze, die der Angriffs- und Raketenfahrzeuge jeweils __2__ Plätze.
chassis-efficiency-description=Alle drei Spinnenfahrzeuge erhalten Brennstoffwirkungsgrad __1__. Jeder Brennstoffgegenstand liefert mehr nutzbare Bewegungsenergie.
chassis-armor-description=Alle drei Spinnenfahrzeuge erhalten __1__ Prozentpunkte physischen und Explosionswiderstand über ihrem eigenen Grundwert, begrenzt auf 90%. Feste Schadensabzüge bleiben gleich.
chassis-grid-description=Gemeinsame Rasteraufwertung: Späher __1__; Angriffsfahrzeug __2__; Raketen-Spidertron __3__. Vorhandene Ausrüstung bleibt erhalten. Abgebaute Fahrzeuge speichern eine Variante, die das erweiterte Raster sicher wiederherstellen kann.
