ei-assault-smoke-charge=Rauchladung für den Sturm-Spidertron

[item-description]
ei-assault-smoke-charge=Im Frachtraum des Sturm-Spidertrons lagern. Reaktive Rauchforschung erlaubt den Verbrauch einer Ladung nach einem schweren Treffer oder unter halber Gesundheit. Verlangsamt nahe feindliche Einheiten für sechs Sekunden. Abklingzeit: 30 Sekunden.

[technology-name]
ei-spider-doeworks-mount=Spidertron-Rampe für gerichtete Explosivenergie: Montage
