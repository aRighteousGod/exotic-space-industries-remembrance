weapon-description=Verbessert diese Waffe auf allen passenden Spidertrons deiner Partei. __1__: Feuerabklingzeit __2__ Ticks; Reichweite __3__ Felder; Mindestreichweite __4__ Felder. Nutzt vorhandene Munition und normale Munitionsforschung. Die tatsächliche Feuerrate hängt auch von Waffenwechsel und Munitionsmodifikatoren ab.
