ei-assault-spidertron=Sturm-Spidertron
ei-assault-smokescreen=Reaktiver Spidertron-Rauch

[technology-description]
ei-spider-vehicles=Dreibeinige Aufklärungs-Spidertrons mit Logistik, Fernsteuerung und Rüstungsausrüstungsrastern. Erschließt gemeinsame Fahrwerkforschung für Aufklärungs-, Sturm- und Raketen-Spidertrons.
ei-assault-spidertron=Sturm-Spidertrons des Simulationszeitalters mit je einer Kanone, einem Maschinengewehr und einem Flammenwerfer. Erschließt Waffen- und Rauchschleierforschung.
ei-assault-smokescreen=Sturm-Spidertrons verbrauchen eine Rauchladung aus dem Frachtraum, wenn ein feindlicher Treffer mindestens 5% der maximalen Rumpfstärke entfernt oder sie unter 50% Gesundheit bringt. Die ortsfeste Wolke verlangsamt bis zu 64 mobile Feinde innerhalb von acht Feldern für sechs Sekunden um 35%. Abklingzeit: 30 Sekunden. Verursacht keinen Schaden und gewährt keine Unsichtbarkeit.

[spider-vehicles]
control-overkill=Übermäßigen Beschuss vermeiden
control-overkill-help=Standardmäßig aus. Beim skriptgesteuerten Waffenwechsel wird der erwartete Schaden fliegender Kanonen-, Raketen- und Artilleriegeschosse dieses Fahrzeugs bis 120% der verbleibenden Zielgesundheit vorgemerkt. Danach wird eine andere Waffe versucht oder automatisches Feuer kurz angehalten. Die native Zielwahl kann dasselbe Ziel behalten. Unsichere Munition feuert normal; Bewegung, Ausrüstungslaser und manuelles Feuer bleiben unberührt.
