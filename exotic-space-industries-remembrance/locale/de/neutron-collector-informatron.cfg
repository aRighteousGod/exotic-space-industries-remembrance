menu_neutron_collector=Neutronenkollektor
title_neutron_collector=Neutronenkollektor
neutron-collector=Neutronenkollektor
neutron-collector-text=Der [color=orange]Neutronensammler[/color] [item=ei-neutron-collector] ist eine Lademaschine des Quantenzeitalters. Er fängt freie Neutronen naher Spaltungsquellen, schwache Leckstrahlung aktiver Dichtplasma-Fusionsreaktoren auf Aquilo und den stärkeren regelbaren Fluss thermonuklearer ESIR-Reaktoren auf. Damit wandelt er [item=ei-neutron-container] in [item=ei-charged-neutron-container] um.\n\nEr erzeugt keine Neutronen, sondern erntet Verluste naher Reaktoren. Er bindet sich jeweils an eine Quelle und bevorzugt den stärksten aktiven Ertrag in Reichweite, statt alle Maschinen zu mitteln.
neutron-collector-2=Bindung, Entfernung und Bereitschaft
neutron-collector-text-2=Quelltyp, Aktivität und Geometrie bestimmen die Effizienz. Aquilos Dichtplasma-Fusionsreaktoren liefern nur im Betrieb schwache Leckstrahlung. Thermonukleare ESIR-Reaktoren sind stärker und lassen sich über Temperatur und Einspritzung regeln. Die angezeigte Effizienz ist auf 0-300% begrenzt; größere Entfernung verlängert die Ladezeit.\n\nFehlt eine geeignete Quelle, liegt der Fluss unter der Ladeschwelle, ruht die gebundene Quelle, ist der Ausgang blockiert oder deaktiviert eine Schaltung die Maschine, wechselt der Sammler zum Bereitschaftsrezept. So bleiben Oberfläche und Diagnose zugänglich.
neutron-collector-3=Schaltungs-Telemetrie
neutron-collector-text-3=Bei Verkabelung veröffentlicht die verborgene Schnittstelle fünf eigene Signale im Sammlernetz: [virtual-signal=ei-neutron-efficiency], [virtual-signal=ei-neutron-distance], [virtual-signal=ei-neutron-collector-agent], [virtual-signal=ei-neutron-source-agent] und [virtual-signal=ei-neutron-scan-agent].\n\nEffizienz meldet 0-300, Entfernung Zehntelfelder. Sammleragent: 1 aktiv, 2 untätig, 3 blockiert. Quellenagent: 1 aktiv, 2 ruhend, 3 fehlend. Suchagent: 1 stabil, 2 geändert, 3 Neubindung ausstehend. Aktualisiert wird im geplanten Telemetriedurchlauf statt in jedem Tick.
