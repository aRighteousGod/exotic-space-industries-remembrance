[exotic-industries-informatron]
menu_fusion_power=Stufen der Fusionsenergie
title_fusion_power=Stufen der Fusionsenergie
fusion-power=Stufen der Fusionsenergie
fusion-power-text=Der [color=orange]Fusionsreaktor[/color] [item=fusion-reactor] von Aquilo aus Space Age arbeitet mit Dichtplasma: kompakt, wärmeorientiert und weitgehend geschlossen. Schwache sekundäre Neutronenleckage ist ein Rückstand, keine ernsthafte Brutquelle.\n\nESIRs [color=orange]thermonuklearer Fusionsreaktor[/color] [item=ei-fusion-reactor] ist eine spätere, schwerere Maschine. Er verbrennt erhitzte leichte Atomkerne im kontrollierten Plasmagefäß und erzeugt gezielt Neutronen.\n\nSein geschlossener Bleikühlkreislauf nimmt [fluid=ei-cold-coolant] auf und gibt belastetes [fluid=ei-hot-coolant] ab. Bau und Betrieb sind teuer; ein aktiver Reaktor verlangt unerbittlich erhitzte Fusionsbrennstoffe.\n\nDer Einstieg nutzt [fluid=ei-heated-protium] und [fluid=ei-heated-lithium-6]. Stärkere Ketten verwenden [fluid=ei-heated-deuterium], [fluid=ei-heated-tritium] und [fluid=ei-heated-helium-3].
fusion-power-2=Neutronenquellen
fusion-power-2-text=Der Dichtplasmareaktor [item=fusion-reactor] liefert nur schwache sekundäre Neutronenleckage. Er kann als Quelle erkannt werden, lässt sich aber nicht auf den für fortschrittliche Brennstoffe nötigen starken Fluss einstellen.\n\nDer ESIR-Reaktor [item=ei-fusion-reactor] ist eine starke regelbare Quelle. Niedrige Temperatur begünstigt Neutronenaustritt, mittlere bildet einen Kompromiss, hohe unterdrückt den Fluss zugunsten der Leistung.\n\nNahe [color=orange]Neutronenkollektoren[/color] [item=ei-neutron-collector] binden sich an die stärkste nutzbare Quelle in Reichweite. Reaktortyp, Modus, Abstand und Aktivität bestimmen den nutzbaren Fluss.\n\nNeutronen sind keine Dekoration, sondern Währung für fortschrittliche Fusionsbrennstoffe. Baue nah, stimme bewusst ab und verwechsle einen helleren Stern nicht mit einem großzügigeren.
menu_fusion_reactor_controls=Steuerung des thermonuklearen Reaktors
title_fusion_reactor_controls=Steuerung des thermonuklearen Reaktors
fusion-reactor-controls=Manuelle Steuerung
fusion-reactor-controls-text=Die Reaktorkonsole bietet vier manuelle Werte: Brennstoff 1, Brennstoff 2, Temperatur und Einspritzrate. Zusammen wählen sie ein festes verborgenes Rezept für Brennstoffverbrauch, Kühlmitteldurchsatz, geschätzte Leistung und regelbaren Neutronenfluss.
fusion-reactor-controls-2=Brennstoffpaare und feste Rezepte
fusion-reactor-controls-text-2=Nur gültige Brennstoffpaare zünden. Kann der zweite gewählte Brennstoff nicht mit dem ersten reagieren, fällt die Konsole auf den ersten gültigen Brennstoff der geordneten Reaktortabelle zurück, statt einen unmöglichen Zustand zu halten.
fusion-reactor-controls-3=Temperatur und Einspritzung
fusion-reactor-controls-text-3=Temperatur und Einspritzung sind getrennte Stellgrößen. Niedrige Temperatur erzeugt stärksten Neutronenaustritt bei geringer Leistung, mittlere einen Kompromiss, hohe schwächt die Neutronenquelle zugunsten der Leistung. Niedrige Einspritzung spart Brennstoff, mittlere läuft stabil, hohe steigert die Verbrennung bei hohem Verbrauch.
menu_fusion_reactor_circuit_interface=Fusions-Schaltungsschnittstelle
title_fusion_reactor_circuit_interface=Fusions-Schaltungsschnittstelle
fusion-reactor-circuit-interface=Verborgene Kombinatorschnittstelle
fusion-reactor-circuit-interface-text=Die Schaltung verwendet das unsichtbare Kombinatormuster anderer ESIR-Systeme. Eine verborgene Schnittstelle ist intern mit dem sichtbaren Reaktoranschluss verdrahtet, gibt Telemetrie aus und nimmt im Schaltungsmodus Steuersignale an.
fusion-reactor-circuit-interface-2=Lese- und Schreibsignale
fusion-reactor-circuit-interface-text-2=Manueller Modus ignoriert Schreibsignale, gibt bei Verdrahtung aber Zustände aus. Schaltungsmodus liest [virtual-signal=ei-fusion-set-fuel-1], [virtual-signal=ei-fusion-set-fuel-2], [virtual-signal=ei-fusion-set-temperature] und [virtual-signal=ei-fusion-set-injection]. Brennstoffwerte: 1 Protium, 2 Deuterium, 3 Tritium, 4 Helium-3, 5 Lithium-6. Temperatur und Einspritzung: 1 niedrig, 2 mittel, 3 hoch. Fehlende oder Nullwerte verwenden die manuelle Vorgabe. Getrennte Zustands- und Telemetriesignale verhindern Selbststeuerung durch Signalechos.
menu_fusion_reactor_agents=Fusionsreaktormodule
title_fusion_reactor_agents=Fusionsreaktormodule
fusion-reactor-agents=Modulzustände
fusion-reactor-agents-text=Module liefern kompakte Statuswerte für Schaltungen und Diagnose. Steuerung meldet manuelle oder Schaltungshoheit; Brennstoff ein gültiges oder korrigiertes Paar; Wärme niedrigen, mittleren oder hohen Einschluss; Kühlmittel einen gültigen Bedarf des gewählten Rezepts; Schaltung unverdrahtet, lesbar oder steuernd.
fusion-reactor-agents-2=Signalwerte
fusion-reactor-agents-text-2=Die Zahlenkonvention ist einfach. Steuerung: 1 manuell, 2 Schaltung. Brennstoff: 1 gültig, 2 korrigiert. Wärme: 1 niedrig, 2 mittel, 3 hoch. Kühlmittel: 1 gültiger Bedarf, 3 ungültig oder trocken. Schaltung: 1 unverdrahtet, 2 lesbar, 3 steuernd. Für lesbare Kombinatorlogik, keine zweite verborgene Doktrin.
menu_fusion_reactor_options=Fusionsreaktoroptionen
title_fusion_reactor_options=Fusionsreaktoroptionen
fusion-reactor-options=Optionen und Rückfallwerte
fusion-reactor-options-text=Optionen vereinfachen dieselben vier manuellen Stellgrößen. Zurücksetzen wählt Deuterium-Tritium bei mittlerer Temperatur und Einspritzung. „Kollektoren aktualisieren“ erzwingt eine Neubewertung des Reaktors durch nahe Neutronenkollektoren.
fusion-reactor-options-2=Voreinstellungen und Vorrang
fusion-reactor-options-text-2=„Leistung“, „Fluss“ und „Ausgewogen“ wählen sinnvolle manuelle Werte und lassen die Feinsteuerung zugänglich. Im Schaltungsmodus dienen sie als Rückfallwerte für fehlende, ungültige oder auf null gesetzte Signale.
menu_fusion_neutron_collectors=Fusionsquellen und Neutronenkollektoren
title_fusion_neutron_collectors=Fusionsquellen und Neutronenkollektoren
fusion-neutron-collectors=Quellenpriorität der Kollektoren
fusion-neutron-collectors-text=Kollektoren erkennen beide Fusionsstufen, doch Quellenstärke entscheidet. Aquilos Dichtplasmareaktor [item=fusion-reactor] liefert schwache sekundäre Leckage; ESIRs aktiver, passend eingestellter thermonuklearer Reaktor [item=ei-fusion-reactor] liefert starken Fluss. Rezeptänderungen verändern den Neutronenfaktor für nahe Kollektoren; ihre Warteschlangen werden deshalb beim Moduswechsel aktualisiert.
fusion-neutron-collectors-2=Anordnung und Zielkonflikte
fusion-neutron-collectors-text-2=Kollektoren belohnen passende Geometrie. Ein naher Niedrigtemperaturreaktor [item=ei-fusion-reactor] versorgt Brennstoffproduktion mit starkem Fluss; hohe Temperatur kann Kollektoren aushungern, während mehr Wärme entsteht. Ein naher [item=fusion-reactor] liefert nur Hintergrundleckage. Entscheide, ob dein Stern Generator, Brüter oder sorgfältig geteilter Eid sein soll.

