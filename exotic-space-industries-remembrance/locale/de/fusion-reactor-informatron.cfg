[virtual-signal-description]
ei-fusion-set-fuel-1=Schaltungseingang für Brennstoff 1. Werte: 1 Protium, 2 Deuterium, 3 Tritium, 4 Helium-3, 5 Lithium-6.
ei-fusion-set-fuel-2=Schaltungseingang für Brennstoff 2. Werte: 1 Protium, 2 Deuterium, 3 Tritium, 4 Helium-3, 5 Lithium-6.
ei-fusion-set-temperature=Schaltungseingang für Temperatur. Werte: 1 niedrig, 2 mittel, 3 hoch.
ei-fusion-set-injection=Schaltungseingang für Einspritzrate. Werte: 1 niedrig, 2 mittel, 3 hoch.
ei-fusion-state-fuel-1=Gibt den wirksamen Index von Brennstoff 1 aus.
ei-fusion-state-fuel-2=Gibt den wirksamen Index von Brennstoff 2 aus.
ei-fusion-state-temperature=Gibt den wirksamen Temperaturindex aus.
ei-fusion-state-injection=Gibt den wirksamen Einspritzindex aus.
ei-fusion-power=Gibt die geschätzte Reaktorleistung in MW aus.
ei-fusion-neutron-flux=Gibt den Neutronenfluss multipliziert mit 100 aus.
ei-fusion-efficiency=Gibt den Wirkungsgrad in Prozent aus.
ei-fusion-coolant-rate=Gibt heißes Kühlmittel pro Sekunde multipliziert mit 100 aus.
ei-fusion-control-agent=Gibt 1 für manuell oder 2 für Schaltung aus.
ei-fusion-fuel-agent=Gibt 1 für gültig oder 2 für korrigiert aus.
ei-fusion-thermal-agent=Gibt 1 für niedrig, 2 für mittel oder 3 für hoch aus.
ei-fusion-coolant-agent=Gibt 1 für gültigen Kühlmittelbedarf oder 3 für ungültig aus.
ei-fusion-circuit-agent=Gibt 1 für unverdrahtet, 2 für lesbar oder 3 für steuernd aus.
