[mod-setting-name]
ei-admin-tools-enabled=Administrationswerkzeuge aktivieren
ei-admin-new-planets-peaceful=Neue Planeten starten friedlich
ei-admin-restrict-new-players=Neue Spieler auf ihre zuletzt verwendeten Entitäten beschränken

[mod-setting-description]
ei-admin-tools-enabled=Aktiviert die nur Administratoren zugängliche Konsole, Karteneinstellungen, Befehle und Erstellungswerkzeuge. Standardmäßig aktiviert. Administratoren öffnen das Menü mit /ei-admin. Das Öffnen aktiviert keine Cheats und verändert die Welt nicht. Beim Abschalten werden werkzeugeigene Spielermodi, Haftstrafen und Spielgeschwindigkeit zurückgesetzt; abgeschlossene Weltänderungen und gespeicherte Karteneinstellungen bleiben erhalten.
ei-admin-new-planets-peaceful=Bei aktivierten Administrationswerkzeugen starten neu erstellte Planetenoberflächen friedlich. Bestehende Planeten bleiben unverändert. Ausdrücklich gespeicherte Regeln haben Vorrang.
ei-admin-restrict-new-players=Bei aktivierten Administrationswerkzeugen dürfen neu erstellte Spieler nur mit spielergebauten Entitäten interagieren, deren letzter Benutzer sie selbst sind. Natürliche Ressourcen, Bäume und Felsen bleiben nutzbar. Bestehende Spieler bleiben unverändert.

