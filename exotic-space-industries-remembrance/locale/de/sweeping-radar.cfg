informatron-body=Rotes Kabel steuert aktivierte Überschreibungen, grünes Kabel veröffentlicht Berichte. Null ist ein echter Signalwert. Alle fünf Betriebsmodi und Berichtsregeln sind sofort verfügbar. Forschung verbessert Reichweite, Suchkapazität und Energieeffizienz; Qualität zusätzlich die Trefferpunkte.\n\nEine Beobachtung kartiert einen abgedeckten Chunk und erfasst lebende feindliche Militärziele. Positionen und Alter zeigen die letzte Beobachtung, keine Live-Verfolgung. Leere gültige Berichte unterscheiden sich von fehlenden Daten. Unvollständige Berichte sind Untergrenzen: je Abfrage höchstens 128 Kandidaten, je Arbeitsbericht höchstens 2.048 Kontakte.\n\nÜberwachen fordert nie Gelände an. Erkunden stellt global höchstens eine neue Geländeanforderung alle 30 Ticks. Nicht abschließbare Anforderungen verfallen nach 60 Sekunden und markieren unvollständige Abdeckung. Geometrieänderungen verwerfen unfertige Arbeit und Berichte. Manuelle Pause, Einfrieren und ungültige Einstellungen entziehen Berichten die Gültigkeit; ein bereiter Impuls darf seinen abgeschlossenen Bericht behalten. Abgebrochene bezahlte Arbeit wird nicht erstattet.\n\nAlle Radare teilen begrenzte Verarbeitungskapazität. Die anfängliche Flottengrenze beträgt 120 Beobachtungsstarts/s vor Geometrie-, Kontakt-, Strom- und Generierungsgrenzen. Die eingestellte Geschwindigkeit ist eine Anforderung. Das Fenster zeigt den über die Lebensdauer erreichten Durchschnitt, den idealen und den letzten gemessenen Durchlauf. Die grüne Suchpeilung folgt abgeschlossenen Beobachtungen; die animierte Schüssel folgt der erledigten Sucharbeit.\n\nBereitschaftsverbrauch und Beobachtungen nutzen einen verborgenen Strompuffer. Kopien und reparierte Puffer beginnen leer. Aufwertungen erhalten Einstellungen und übertragen nur vorhandene Energie bis zur neuen Puffergrenze. Das gewöhnliche Radar bleibt verfügbar.\n\nElektrische Grundwerte: Schwenkradar — 1 MW Bereitschaft, 8 MJ je Beobachtung, 64 MW Eingangsgrenze, 16 MJ Puffer; Phased-Array-Radar — 2 MW Bereitschaft, 5 MJ je Beobachtung, 128 MW Eingangsgrenze, 10 MJ Puffer. Qualität ergänzt bis zu 4 Chunks Radius und 50% Suchkapazität und senkt die Beobachtungsenergie um bis zu 20%. Die Boni wirken mit Forschung und enden auf legendärer Stufe. Qualität verändert weder Bereitschaft noch gemeinsame Verarbeitungsgrenzen. Bereitschaftsverbrauch bleibt bei Pause oder Impulsbereitschaft bestehen. Eingangsgrenzen sind Ladeobergrenzen; tatsächlicher Verbrauch ist Bereitschaft plus angenommene Beobachtungen.
