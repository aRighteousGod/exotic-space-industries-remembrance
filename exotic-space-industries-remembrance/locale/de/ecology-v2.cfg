[mod-setting-description]
ei-ecology-alert-enabled=Empfange ausgewählte erfolgreiche Ökologieereignisse im nativen Factorio-Alarmfenster. Hauptschalter nur für persönliche Meldungen.
ei-ecology-alert-surfaces=Verwende all oder ein JSON-Array exakter Oberflächennamen. [] bedeutet keine. Höchstens 128 Namen und 4096 Bytes. Die Ökologieoberfläche bearbeitet dieselbe Einstellung. Fehlende Namen treffen nichts.
ei-ecology-alert-current-surface-only=Beschränkt ausgewählte Meldungen auf die aktuell betrachtete Oberfläche einschließlich Fernansicht. Standardmäßig deaktiviert.
ei-ecology-alert-allow-unrevealed=Nur Administratoren: aktuelle Chunk-Sichtbarkeit umgehen. Kategorien und Oberflächenfilter gelten weiter. Standardmäßig deaktiviert. Normale Empfänger benötigen aktuelle Sichtbarkeit; erkundetes Gelände allein reicht nicht.
ei-terrain-periodic-mining-scars=Geeignete arbeitende Steinbrüche und große Erzförderer können freien Naturboden um endliche Vorkommen aufwühlen. Aktive Vorkommen, Infrastruktur und Schutzgebiete bleiben sicher. Erschöpfungsnarben bleiben davon getrennt und ereignisgesteuert.
ei-terrain-periodic-mining-seconds=Basisintervall vor Intensitäts- und Jahreszeiteneinflüssen. Standard 300 Sekunden wird bei „Zurückhaltend“ zu 600 vor Jahreszeiteneinfluss. Verspätete Prüfungen erhalten eine Gelegenheit ohne Nachholversuche.
ei-terrain-periodic-mining-probability=Chance je geeigneter periodischer Gelegenheit. Standard 10%. Ändert nicht die getrennte Chance von 70% je Feld innerhalb eines gewählten Flecks.
ei-ecology-alert-wildfire=Meldet einen erfolgreichen Ökologieeffekt: Vegetationsbrandzündung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten. Ein Vegetationsbrand bedeutet eine erzeugte Zündung, nicht einen verbrannten Wald.
ei-ecology-alert-flood=Meldet einen erfolgreichen Ökologieeffekt: Überschwemmung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-drought=Meldet einen erfolgreichen Ökologieeffekt: Ufertrocknung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-cliff=Meldet einen erfolgreichen Ökologieeffekt: Klippenverwitterung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-paving=Meldet einen erfolgreichen Ökologieeffekt: Pflasterkorrosion. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-pollution=Meldet einen erfolgreichen Ökologieeffekt: Verschmutzungsschäden. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-restoration=Meldet einen erfolgreichen Ökologieeffekt: Geländeerholung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-depletion-scars=Meldet einen erfolgreichen Ökologieeffekt: Erschöpfungsnarben. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-working-scars=Meldet einen erfolgreichen Ökologieeffekt: Narben aktiver Erzförderer. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-mining-restoration=Meldet einen erfolgreichen Ökologieeffekt: Abbauerholung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-tree-stress=Meldet einen erfolgreichen Ökologieeffekt: Baumbelastung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-tree-recovery=Meldet einen erfolgreichen Ökologieeffekt: Baumerholung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-regrowth=Meldet einen erfolgreichen Ökologieeffekt: Wildwuchs. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-aging=Meldet einen erfolgreichen Ökologieeffekt: Baumalterung. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-rot=Meldet einen erfolgreichen Ökologieeffekt: Totholzverfall. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-thermal=Meldet einen erfolgreichen Ökologieeffekt: Thermische Narben. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.
ei-ecology-alert-blood=Meldet einen erfolgreichen Ökologieeffekt: Heilung durch Alienblut. Meldungen aktivieren den Effekt nicht. Sichtbarkeit und persönliche Oberflächenfilter gelten.

[ei-terrain]
controls=Öffne Ökologie über den mechanischen Baum oben links. Blattfarben folgen der Jahreszeit der betrachteten Welt; der Hinweistext nennt sie. „Einfach“ zeigt einen Feldbericht; „Erweitert“ wirksame Einstellungen, aufgezeichnete Ergebnisse und endliche Verarbeitungsgrenzen; „Meldungen“ entspricht Mod-Einstellungen → Pro Spieler. Meldungen verwenden das normale Fenster und erfordern gewöhnlich aktuell sichtbare Chunks. Administrative Spieleingriffe bleiben unter „Gelände und Ökologie“.
v2-coverage=Beobachtungen erfassen eine begrenzte wechselnde Chunk-Auswahl. Ungeprüftes Gelände ist unbekannt; fehlende oder veraltete Werte belegen keine dauerhaft sauberen oder verschmutzten Bedingungen. Erholung restauriert nur ESIR-aufgezeichnete Schäden. Endliche Migration, Erstaufbau und Wartung erscheinen im Wiederaufbaufenster; laufende Ökologie unter „Erweitert“. Eine Erstaufbaugrenze von 100.000 Besuchen bestätigt keine Gesamtkartenprüfung.
mining-v2-note=Arbeitende Förderer haben eine eigene periodische Narbenoption, standardmäßig aktiv: 10% je 300 Basissekunden beziehungsweise 600 bei „Zurückhaltend“ vor Jahreszeiteneinfluss. Angenommene Narbenanfragen verfallen nicht durch Alter. Oberflächenabschaltung pausiert sie. Abbauerholung ist für neue Aufzeichnungen standardmäßig aktiv.
status-unsupported=Nicht unterstützte Oberfläche
status-independent=Unabhängige Fulgora-Steuerung

