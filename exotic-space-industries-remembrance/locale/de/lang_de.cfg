menu_auric_fumarole=Fumarolen zur Goldabscheidung
title_auric_fumarole=Fumarolen zur Goldabscheidung
auric-fumarole=Aurische Fällungsfumarole
auric-fumarole-text=Vulcanus erinnert sich, wo die Wunde wieder aufbrechen darf. Die folgenden Regeln gelten wörtlich.\n\n[font=default-bold]Mögliche Orte:[/font] Aurische Fumarolen entstehen nur auf Vulcanus, auf vulkanischem Boden ohne Lava. Innerhalb von 3 Chunks um den Oberflächenursprung ist die Wahrscheinlichkeit null. Danach steigt sie sanft an und erreicht bei 32 Chunks ihre volle Gewichtung.\n\n[font=default-bold]Erstes Auftreten:[/font] Neu generierte äußere Chunks erhalten nur einen leichten, entfernungsabhängigen Erstversuch statt eines ganzen Felds. Scheitert er, wird der Chunk im Ruheregister erfasst. Neusuche und Nachpflege alter Spielstände bauen die Eignung generierter Vulcanus-Chunks neu auf; sie erzwingen keine sofortige weitere Erscheinungswelle.\n\n[font=default-bold]Ertrag und Lebensdauer:[/font] Jede Fumarole beginnt mit 40000-80000 Ertrag. Unangezapft versiegelt sie sich nach einem deterministischen Fenster von 35-65 Minuten. Einmal angezapft bleibt sie bis zur Erschöpfung. Geschlossene oder erschöpfte Stellen kühlen etwa 60 Minuten mit kleiner deterministischer Abweichung ab und können danach über das Ruhesystem zurückkehren.
auric-fumarole-2=Entstehungsregeln und Neusuche
auric-fumarole-text-2=[font=default-bold]Ruheplan:[/font] Alle 30 Sekunden prüft das Skript global bis zu 6 ruhende Chunks. Gewöhnliche ruhende Chunks würfeln weiterhin die Grundausbruchschance von 0.25%; darauf wirken Entfernung, Schwefelmodulation, lokale Unterdrückung und Füllstand des Entfernungsbands.\n\n[font=default-bold]Bandregelung:[/font] Geeignete generierte Vulcanus-Chunks werden in Entfernungsbändern erfasst: 3-6, 6-16, 16-24, 24-32 und 32+ Chunks vom Ursprung. Unterfüllte Bänder erhalten stärkeren Erholungsdruck, überfüllte werden gedämpft. Versuche bevorzugen die schwächsten Bänder, damit nicht eine erkundete Region alle künftigen Quellen beansprucht.\n\n[font=default-bold]Lokale Unterdrückung und Absicherung:[/font] Aktive aurische Fumarolen innerhalb von 6 Chunks senken die Chance entfernungsabhängig statt über eine harte Anzahlgrenze. Nahe Quellen unterdrücken stärker als äußere; mehrere Quellen addieren ihren Druck. Bleibt Vulcanus für 5 Minuten unter 2 aktiven aurischen Fumarolen, erzwingt die bisherige Bestandssicherung weiterhin bis zu 2 Notfallversuche je Impuls.\n\n[font=default-bold]Platzierung und Neusuche:[/font] Fumarolen müssen nicht in der Chunkmitte liegen; bis zu 24 Positionen innerhalb des Chunks werden versucht. Aurische Fumarolen halten 64 Felder Abstand voneinander. Schwefelsäuregeysire verhindern nur sehr enge Überlappung, ungefähr innerhalb von 16 Feldern; sie bilden keine pauschale 32-Felder-Sperrzone. /ei-auric-fumarole-rescan funktioniert nur auf Vulcanus und baut die ausstehende Ruheeignung generierter Chunks neu auf, statt sofort eine weitere Welle zu erzeugen.


