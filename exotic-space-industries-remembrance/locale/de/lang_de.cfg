ages-and-tech=Technologische Zeitalter
ages-and-tech-text=Exotic Industries berechnet Forschungskosten aus [font=default-bold]Startpreis[/font], [font=default-bold]Kurvenform[/font] und benannter [font=default-bold]Obergrenze[/font] und verteilt den Druck über die gesamte Technologieliste. [font=default-bold]Linear[/font] bleibt gleichmäßig, [font=default-bold]quadratisch[/font] beginnt sanft und beißt später stärker, [font=default-bold]exponentiell[/font] bleibt früh weich und steigt spät steil, und [font=default-bold]Zeitalteranstieg[/font] legt das meiste Gewicht auf spätere Zeitalter.\n\nZeitalterschwellen bestimmen weiterhin, wann ganze Zweige verfügbar werden. Die Skalierung bestimmt, wie stark einseitiges Durchforschen bestraft wird. Die Technologiegewichtung gilt weiterhin; vergünstigte Technologien zählen weniger.
tech=Skalierung der Technologiekosten
tech-text=Exotic Industries berechnet Forschungskosten aus [font=default-bold]Startpreis[/font], [font=default-bold]Kurvenform[/font] und benannter [font=default-bold]Obergrenze[/font] und verteilt den Druck über die gesamte Technologieliste. [font=default-bold]Linear[/font] bleibt gleichmäßig, [font=default-bold]quadratisch[/font] beginnt sanft und beißt später stärker, [font=default-bold]exponentiell[/font] bleibt früh weich und steigt spät steil, und [font=default-bold]Zeitalteranstieg[/font] legt das meiste Gewicht auf spätere Zeitalter.\n\nZeitalterschwellen bestimmen weiterhin, wann ganze Zweige verfügbar werden. Die Skalierung bestimmt, wie stark einseitiges Durchforschen bestraft wird. Die Technologiegewichtung gilt weiterhin; vergünstigte Technologien zählen weniger.
tech-2=Was die Starteinstellungen steuern
tech-text-2=[font=default-bold]Startpreis[/font] bezeichnet die Kosten je Forschungspaketart am Kurvenbeginn. [font=default-bold]Obergrenze[/font] wählt den angestrebten Endbereich von Sonntagsspaziergang bis Sehr teuer. Die [font=default-bold]Kurvenform[/font] enthält auch [font=default-bold]Zeitalteranstieg[/font], der mehr Kosten in späte Zeitalter verschiebt. Der [font=default-bold]Zusatzmultiplikator[/font] skaliert das fertige Kurvenergebnis.\n\nWürde die gewählte Obergrenze an Factorios Multiplikatorlimit von [font=default-bold]x1000[/font] stoßen, erhöht ESIR automatisch den verborgenen effektiven Grundpreis, damit sie erreichbar bleibt.\n\nNutze für EI-Balanceanpassungen diese internen Einstellungen statt der ursprünglichen Forschungsmultiplikatoren. Die Mod steuert diesen Fortschrittsbereich selbst; die ursprünglichen Multiplikatoren bilden eine andere Kurve ab.
tech-3=Praktische Grenzen und Änderungen im Spiel
tech-text-3=Die benannte Obergrenze allein ist keine absolute Garantie. Factorio begrenzt den internen Forschungspreismultiplikator auf [font=default-bold]x1000[/font], daher hängt die tatsächliche Grenze weiterhin vom [font=default-bold]Startpreis[/font] ab. ESIR erhöht bei Bedarf automatisch den verborgenen effektiven Grundpreis, damit höhere Grenzen darstellbar bleiben.\n\nDer [font=default-bold]Zusatzmultiplikator[/font] lässt sich während eines laufenden Spiels am sichersten ändern. Änderungen an [font=default-bold]Startpreis[/font] oder [font=default-bold]Kurvenform[/font] können weiterhin unerwünschte oder unerwartete Folgen haben.
tech-output=Aktueller Zeitalterfortschritt
tech-output-text=Das nächste Zeitalter ist [font=default-bold]__3__[/font]. Derzeit sind [font=default-bold]__1__ / __2__[/font] Prozent des nötigen Wissens für den Übergang erschlossen.\n\n[font=default-bold]Schreite voran oder bleibe an die Vergangenheit gebunden.[/font]


world-gen-related=Informationen zur Welt
world-gen-related-text=Dieser Abschnitt beschreibt die neuen Weltgenerierungssysteme der Mod, geordnet in übersichtliche Unterkategorien.\n\nÖffne sie über das Menü links.\nDiese Änderungen sind nicht bloß kosmetisch.\nSie bestimmen Gelände, Rohstoffverhalten und räumliche Regeln von Grund auf.\n\n[font=default-bold]Verstehe die Schicht oder lass dich von ihr formen.[/font]


crystal-accumulator-resonance=Kristallakkumulator-Resonanz
crystal-accumulator-resonance-text=Kristallakkumulatoren sind außerirdische Resonanzhüllen in generierten Reliktgruppen. Entscheidend sind [font=default-bold]Last[/font] und [font=default-bold]Kohärenz[/font] statt eines einfachen Ein/Aus-Zustands.\n\nDie [font=default-bold]Last[/font] ist im laufenden Spiel ein Resonanzmaß: Sie verbindet die gemittelte Oberflächenleistung der jeweiligen Hülle und Qualität mit der lokalen Belastung dieses Kristalls. Lies sie als Gitterdruck, nicht als exakten Wattwert der einzelnen Einheit.\n\nDas instabile Profil kann als [font=default-bold]schwache Hülle mit 4 MW[/font], [font=default-bold]Grundhülle mit 7.5 MW[/font] oder [font=default-bold]verstärkte Hülle mit 10 MW[/font] auftreten. Gaia klärt dieselbe Geometrie zur [font=default-bold]Gaia-Hülle mit 15 MW[/font]. Inaktive Resthüllen bleiben bis zur Reparatur außerhalb dieser Leiter.
crystal-accumulator-resonance-2=Nauvis-Profil
crystal-accumulator-resonance-text-2=Nauvis ist das festgelegte Grundprofil der instabilen Hülle. Ein dort gefundener oder platzierter [item=ei-crystal-accumulator] zeigt den Resonanzgrundfall: produktiv, fremd und nie ganz zur Ruhe gekommen.\n\nDie Hülle kann zwischen schwacher, Grund- und verstärkter Stufe wechseln, bleibt aber instabil. Nauvis ist keine Heilung. Es ist die Referenzwunde.
crystal-accumulator-resonance-3=Andere Oberflächen und Orbit
crystal-accumulator-resonance-text-3=Außerhalb von Nauvis gelten Planeten außer Gaia und Orbitalplattformen als fremde Profilräume. Die instabile Hülle funktioniert dort, wird aber nicht allein durch das Verlassen ihres Fundorts stabil.\n\nGaia ist die Ausnahme. Dort wird dasselbe Gehäuse zum [item=ei-crystal-accumulator-gaia]stabilen Kristallakkumulator. Seine Grundleistung verdoppelt sich von [font=default-bold]7.5 MW auf 15 MW[/font] und hebt die gesamte Hüllenleiter an.
crystal-accumulator-resonance-4=Qualität ist nicht Kohärenz
crystal-accumulator-resonance-text-4=Verwechsle [font=default-bold]Qualität[/font] nicht mit dem [font=default-bold]Resonanzprofil[/font]. Qualität ist die gewöhnliche Gegenstandseigenschaft. Schwache Hülle, Grundhülle, verstärkte Hülle, Gaia-Hülle und inaktive Resthülle sind die hier beschriebenen Hüllenzustände.\n\nQualität ersetzt die Last- und Kohärenzanzeige nicht. Die Legende beschreibt den Gesang des Gitters, nicht die Fertigungsgüte.
crystal-accumulator-resonance-5=Abbau und Reparatur
crystal-accumulator-resonance-text-5=Kristallakkumulatoren sind zuerst Relikte und dann Ausrüstung. Der Abbau einer instabilen Hülle ist ein gewaltsamer Kohärenzbruch: Rechne mit einem beschädigten Körper statt mit sauberem Versetzen. Die inaktiven Hüllen [item=ei-crystal-accumulator_off-1][item=ei-crystal-accumulator_off-2][item=ei-crystal-accumulator_off-3][item=ei-crystal-accumulator_off-4] bleiben, bis ein [item=ei-crystal-accumulator-repair]Reparatursatz darübergezogen wird.\n\nAlternative Auswahl mit dem Reparaturwerkzeug prüft Akkumulatoren und Resthüllen ohne Verbrauch. Normales Ziehen repariert. Auf Gaia entsteht bei der Wiederherstellung sofort die stabile Variante.
crystal-accumulator-resonance-6=Anzeigenlegende
crystal-accumulator-resonance-text-6=[font=default-bold]Schwache Hülle[/font]: gedämpfte Kohärenz und Leistung unterhalb der Grundstufe.\n[font=default-bold]Grundhülle[/font]: Das instabile Gehäuse hält sein übliches Band von 7.5 MW.\n[font=default-bold]Verstärkte Hülle[/font]: Leistung über der Grundstufe, das Gitter steht unter Belastung.\n[font=default-bold]Gaia-Hülle[/font]: Gaia hat das Gehäuse zur stabilen Stufe mit 15 MW geklärt.\n[font=default-bold]Inaktive Resthülle[/font]: ruhender Artefaktkörper wartet auf Reparatur.\n\nDie Ballungsanzeige liest den nahen Hüllenchor als [font=default-bold]Frei -> Gedrängt -> Belastet -> Chaotisch[/font]. In dieser Reihenfolge wirkt der Kristall nicht mehr zufällig.
crystal-accumulator-resonance-text-7=Prüfe Kristallakkumulatoren und Resthüllen per alternativer Auswahl mit [item=ei-crystal-accumulator-repair], ohne den Satz zu verbrauchen. Ziehe normal nur dann, wenn du reparieren willst.\n\nDie Telemetrie zeigt entweder [font=default-bold]Oberflächenleistung + Belastung[/font] oder [font=default-bold]Belastungsersatzwert[/font]. Kristalle mit gleicher Hülle und Qualität auf derselben Oberfläche teilen die gemittelte Oberflächenleistung. Die lokale Belastung unterscheidet weiterhin die erschöpfte Hülle von ihrer Nachbarin.

resources=Neues Rohstoffsystem
resources-text=Exotic Industries ordnet das Rohstoffsystem neu. Gewöhnliche Erzfelder sind nicht mehr die einzige Quelle. Rohstoffe folgen eigenen Kategorien mit eigenen Regeln, Produktionswegen und räumlichem Verhalten.\nFörderung ist nicht länger trivial.\n[font=default-bold]Gewinnung verlangt Anpassung.[/font]\nVerstehe die Kategorie oder produziere nichts.

stone=Stein
stone-text=Stein ist der häufigste Rohstoff. Er lässt sich wie gewohnt aus Oberflächenfeldern gewinnen; Exotic Industries erweitert die Wege:\n\n[color=orange]Oberflächenförderer[/color] [item=ei-burner-surface-harvester] ermöglichen Tiefenförderung aus jedem Gelände.\n\n[font=default-bold]Manuelles Sammeln bleibt möglich, ist aber ineffizient.[/font]\nStein ist überall.\nEffizienz ist optional. Ausstoß nicht.

surface-patches=Oberflächenvorkommen
surface-patches-text=Nauvis ist nicht gleichförmig. Um die Landestelle bildet die Kruste eine geschützte Industriereserve: [item=ei-poor-iron-chunk]Eisen, [item=ei-poor-copper-chunk]Kupfer, [item=coal]Kohle, [item=stone]Stein und naher [fluid=crude-oil]Öldruck reichen für die erste Industrie.\n\nJenseits der Wiege zerbricht die Oberfläche. [item=ei-poor-iron-chunk]Eisen, [item=ei-poor-copper-chunk]Kupfer und selbst [item=ei-poor-uranium-chunk]Uran überdauern meist als flache Reste, Bruchgürtel und erschöpfte Narbenfelder. Sie sind real, tragen aber keine dauerhafte Metallwirtschaft.\n\nKohle, Stein und Öl bleiben die arbeitende Haut von Nauvis. Nutze die Reserve für Wärme, Bänder und Chemie. Lerne dann das Land zu lesen, sonst täuscht dich die Kruste.

veins=Tiefe Erzadern
veins-text=Erzadern sind anfangs unzugänglich. Sie benötigen [color=orange]Tiefbohrer[/color] [item=ei-deep-drill], eine Fördertechnik des mittleren Spiels für vertikale Ausbeute.\n\nDie Adern folgen festen Landschaftsstrukturen statt allgemeinen Seltenheitswürfen. Metalle liegen in [font=default-bold]Metallgürteln[/font] und [font=default-bold]Sedimentbecken[/font]: [item=ei-iron-chunk]Eisen und [item=ei-copper-chunk]Kupfer bevorzugen Höhenzüge, [item=ei-coal-chunk]Kohle und [item=ei-sulfur-chunk]Schwefel sammeln sich in tieferen Becken.\n\n[font=default-bold]Hydrothermale Grenzgebiete[/font] tragen [item=ei-lead-chunk]Blei und [item=ei-gold-chunk]Gold jenseits des geschützten Startgebiets. [font=default-bold]Äußere Narbenlande[/font] bergen [item=ei-uranium-chunk]Uran; nur seltenste Anomalietaschen darin legen [item=ei-neodym-chunk]Neodym frei.\n\nKritische Stoffe wie Uran, Blei, Gold, Neodym und Immersit liegen ausschließlich in diesen tiefen Schichten.\nSie sind nicht optional.\nSie sind tragend.\n\n[font=default-bold]Oberflächenabbau trägt dich nicht ins Endspiel.[/font] Bohre, lies das Land oder stagniere.

chunk-grades=Arme und reiche Brocken
chunk-grades-text=[item=ei-poor-iron-chunk]Arme Eisenbrocken und [item=ei-poor-copper-chunk]arme Kupferbrocken sind flache, verunreinigte Reste der gebrochenen Oberkruste. Sie sollen Industrie beginnen, nicht dauerhaft tragen. Im Ofen zeigt sich die geringe Güte: [font=default-bold]3 arme Brocken -> 1 Platte[/font], dazu deutlich mehr Schlacke.\n\n[item=ei-iron-chunk]Eisenbrocken und [item=ei-copper-chunk]Kupferbrocken aus tiefen Adern sind der eigentliche Erzkörper. Schon ohne weitere Aufbereitung gilt [font=default-bold]3 vollwertige Brocken -> 2 Platten[/font] mit viel weniger Schlacke. [item=ei-poor-uranium-chunk]Armes Uran folgt derselben Regel: Die Oberfläche deutet es nur an; echtes [item=ei-uranium-chunk]Uran gehört in die Tiefe.
chunk-refining=Reiniger und reines Erz
chunk-refining-text=Der [item=ei-purifier]Reiniger verbessert erstmals wirklich die Brockenqualität. Er wäscht [item=ei-iron-chunk]Eisenbrocken und [item=ei-copper-chunk]Kupferbrocken mit [fluid=water]Wasser zu [item=ei-pure-iron]reinem Eisen oder [item=ei-pure-copper]reinem Kupfer. Das entstehende [fluid=ei-dirty-water]Schmutzwasser muss verarbeitet werden.\n\nDer Zusatzschritt lohnt sich: [font=default-bold]3 arme Brocken -> 1 Platte[/font], [font=default-bold]3 vollwertige Brocken -> 2 Platten[/font], aber [font=default-bold]1 reines Erz -> 2 Platten[/font] bei nur etwa [font=default-bold]1% Schlackenchance[/font]. Tiefe Brocken begründen die Metallwirtschaft; Reinigung macht sie dicht, sauber und industriell.
chunk-refining-2=Lichtbogenofen und Plasmaerhitzer
chunk-refining-text-2=Der [item=ei-arc-furnace]Lichtbogenofen schmilzt Brocken, reines Erz, Platten und Teile zu [fluid=ei-molten-iron]flüssigem Eisen und [fluid=ei-molten-copper]flüssigem Kupfer für Gießketten. Arme Brocken sind möglich, doch die Zahlen sprechen für Aufbereitung: [font=default-bold]3 arme Brocken ergeben nur 15 Flüssigmetall[/font], während [font=default-bold]1 reines Erz 40 ergibt[/font], fast ohne Schlacke.\n\nDer [item=ei-plasma-heater]Plasmaerhitzer erhöht im Quantenzeitalter die Ausbeute: [font=default-bold]3 arme Eisen- oder Kupferbrocken ergeben 20 Flüssigmetall; 1 reines Eisen-, Kupfer-, Gold- oder Bleierz ergibt 50; 1 Einheit zerkleinertes, gereinigtes Neodym ergibt 25 flüssiges Neodym[/font]. Diese sieben Rezepte erzeugen keine Schlacke und profitieren von derselben Schmelzproduktivitätsforschung. Die Rezeptzeiten bleiben gleich und der Erhitzer arbeitet 25 % schneller, verbraucht pro Einheit Metall jedoch weiterhin mehr Strom als der Lichtbogenofen. Gewöhnliche Brocken werden weiterhin gereinigt; die bisherigen Rezepte für Platten, Träger, Teile sowie Gase und Plasma bleiben erhalten.
mining-scars=Abbaunarben
mining-scars-text=Erschöpfte Lagerstätten können nun das umliegende Gelände vernarben. Das gilt nur für [item=ei-burner-quarry], [item=ei-steam-quarry], [item=ei-electric-quarry] und den [item=big-mining-drill].\n\nJedes Erschöpfungsereignis kann einen kleinen Narbenfleck mit zufälligem Versatz nahe der Lagerstätte setzen. Dies ist Geländeschaden, kein zusätzlicher Rohstoffschub.
mining-scars-2=Planetarer Verfall
mining-scars-text-2=Narben verändern Felder entlang planetenspezifischer Ketten: Nauvis-Gras wird zu Erde und Sand, Fulgoras Fels zu Sand, Staub und Dünen, Gleba verrottet, Vulcanus verkohlt, Aquilo verdichtet Schnee und Eis. Wasserfelder und verborgene Felder werden ignoriert; passende Dekorationen werden entfernt.\n\nDie Narben sind die Erinnerung der Karte an das, was du ihr genommen hast.

asteroid-variants=Differenzierte Asteroiden
asteroid-variants-text=Exotic Industries ergänzt sechs Asteroidenfamilien: [item=ei-chemical-asteroid-chunk], [item=ei-organic-asteroid-chunk], [item=ei-rock-asteroid-chunk], [item=ei-uranium-asteroid-chunk], [item=ei-petrified-asteroid-chunk] und [item=ei-scrap-asteroid-chunk]. Sie liegen auf Planetenrouten und werden im [entity=crusher] zerkleinert. Alle zwölf einfachen und fortschrittlichen EI-Asteroidenrezepte profitieren von [font=default-bold]Asteroidenproduktivität[/font].\n\nDer Brecher erhält dafür Flüssigkeitsanschlüsse und ein größeres Ergebnisinventar für gemischte Ausgaben.
chemical-asteroid=Chemische Asteroiden
chemical-asteroid-text=Freigeschaltet durch [font=default-bold]Planetenentdeckung: Aquilo[/font]. Einfache und fortschrittliche Zerkleinerung gewinnen [fluid=ammonia], [item=ei-fluorite] und [fluid=fluorine]. Das fortschrittliche Rezept kann zusätzlich [fluid=lithium-brine] liefern. Ihre seltene Anomalie ist [item=ei-neuro-reactive-residue].
organic-asteroid=Organische Asteroiden
organic-asteroid-text=Freigeschaltet durch [font=default-bold]Planetenentdeckung: Gleba[/font]. Einfache Zerkleinerung verbraucht [fluid=water] und liefert [item=spoilage], [fluid=ei-bio-sludge] und [fluid=ei-ammonia-gas]. Die fortschrittliche Verarbeitung benötigt zusätzlich [item=nutrients] und kann [item=yumako], [item=jellynut], [item=ei-bio-matter] und sogar selten [item=pentapod-egg] liefern. Ihre Anomalie ist [item=ei-sporeglass-heart].
rock-asteroid=Gesteinsasteroiden
rock-asteroid-text=Freigeschaltet durch [font=default-bold]Planetenentdeckung: Vulcanus[/font]. Das einfache Rezept liefert vor allem [item=stone]. Das fortschrittliche erschließt die reichere Mineralschicht: [item=tungsten-ore], [item=calcite] und [item=ei-gold-chunk]. Ihre Anomalie ist [item=ei-gravity-braided-ore].
uranium-asteroid=Uranasteroiden
uranium-asteroid-text=Freigeschaltet, sobald [font=default-bold]Weltraumplattform[/font] Zugang zum differenzierten Feld eröffnet. Beide Rezepte verbrauchen [fluid=sulfuric-acid] und liefern [item=stone], [item=ei-uranium-chunk] und [item=ei-lead-chunk]. Das fortschrittliche Rezept verbraucht mehr Säure für deutlich mehr Uran. Ihre Anomalie ist [item=ei-isotopic-ghost-shell].
petrified-asteroid=Versteinerte Asteroiden
petrified-asteroid-text=Ebenfalls mit [font=default-bold]Weltraumplattform[/font] freigeschaltet. Einfache Zerkleinerung liefert [item=wood], [item=raw-fish], [fluid=ei-liquid-nitrogen] und [fluid=ei-liquid-oxygen]. Die fortschrittliche Verarbeitung benötigt zusätzlich [item=bioflux] und [fluid=fluoroketone-cold], verbessert biologische Ausbeuten und ermöglicht eine geringe Chance auf [item=biter-egg]. Ihre Anomalie ist [item=ei-chrono-fossil-shard].
scrap-asteroid=Schrottasteroiden
scrap-asteroid-text=Freigeschaltet durch [font=default-bold]Planetenentdeckung: Fulgora[/font]. Die Rezepte nutzen die Schrottrecycling-Tabelle und liefern daher einen Bergungsstrom statt eines einzelnen Erzes. Beide Stufen behalten ihre Chancen auf [item=ei-crushed-neodym] und können selten [item=ei-worm-torn-relay-core] freilegen.\n\nDies ist der Weg von Orbitalschrott zu Fabrikvorräten.
asteroid-anomalies=Von Anomalien zu Weltraumdaten
asteroid-anomalies-text=Jede differenzierte Asteroidenfamilie birgt eine Anomalie. Diese sechs Gegenstände speisen besondere Rezepte des [entity=ei-computer-core], werden im Simulator zu Datenkarten und schließlich bei Schwerelosigkeit im [entity=ei-quantum-computer] zu [item=ei-space-data] vereint.\n\nDas Asteroidenfeld ist zugleich Rohstoffquelle und zweite Forschungsfront.

fulgora-day-variation=Fulgoras schwankende Tageslänge
fulgora-day-variation-text=Fulgora hat keine feste Tageslänge. Zu Beginn jedes Zyklus wird die [font=default-bold]Länge des Tag-Nacht-Zyklus[/font] anhand der minimalen und maximalen Startmultiplikatoren neu ausgewürfelt. Standardmäßig liegt jeder Fulgora-Tag zwischen [font=default-bold]10% und 200%[/font] der gewöhnlichen Zykluslänge.
fulgora-day-variation-2=Wann neu gewürfelt wird
fulgora-day-variation-text-2=Die Neuwahl erfolgt möglichst in einem hellen Fenster mit stabilem Licht, damit die Zykluslänge nicht in tiefer Dunkelheit umspringt. Gibt es kein geeignetes Fenster, erzwingt eine Absicherung den Wechsel nach ungefähr einem Standardtag.\n\nDie Starteinstellungen legen den Rahmen fest. Jeder Tag erhält darin seine eigene Zufallslänge.

artifacts=Alien-Artefakte
artifacts-text=Über die Welt verstreut liegen Reste einer uralten Zivilisation, die exotische Materie lange vor deiner Ankunft beherrschte. Ihre Artefakte stecken im Gelände, halb begraben, halb lebendig.\n\nManche ruhen.\nManche funktionieren noch.\nKeines ist zufällig hier.
actifacts-text-2=Sie wurden nicht platziert. [font=default-bold]Sie wurden zurückgelassen, absichtlich oder nicht.[/font] Finde sie. Studiere sie. Fürchte, was sie bedeuten.

gate=Dimensionsübergreifendes Tor
gate-text=Das Tor bewegt Gegenstände durch einen kontrollierten Dimensionsbruch.\n\nJedes Tor bindet sich an Empfänger-IDs statt direkte Oberflächenpositionen. Die Quellkonsole wählt einen Empfänger, der Empfangsanker belegt eine ID. Schaltungssignale können Route und Scharfschaltung überschreiben.\n\nDie Transitkosten hängen von Last und Spanne ab. Übertragungen auf derselben Oberfläche bleiben günstig. Verschiedene Oberflächen am gleichen Weltraumort kosten einen spürbaren Mindestbetrag; Routen bewegter Plattformen werden nach aktuellem Routenfortschritt bewertet.\nDies ist kein Portal. [font=default-bold]Es ist eine Maschine, die sich erinnert, wo sie reißt.[/font]
gate-2=Empfänger und IDs
gate-text-2=Torempfänger sind die Zielanker. Jeder belegt die kleinste freie positive ID seiner Partei, sofern das Schaltungssignal [color=orange]I[/color] sie nicht überschreibt.\n\nDoppelte wirksame IDs verursachen einen Konflikt und sind weder manuell noch über [color=orange]Signal-D[/color] nutzbar, bis er behoben ist.\nDie Empfängerwahl in der Torkonsole bindet das Tor an diese ID statt an eine direkte Position.
gate-3=Torverkabelung
gate-text-3=Steuereingaben werden auf der Quellseite gelesen.\nVerkabelung am sichtbaren Torkörper erreicht den verborgenen Quellbehälter zur Steuerung.\nDie Signalreihe unten zeigt die gelesenen Signale.\n\nDie Priorität ist einfach:\n[color=orange]Signal-D[/color] wählt das Ziel.\n[color=orange]Signal-E[/color] schaltet diese Route scharf oder unscharf.\nEmpfängerseitiges [color=orange]Signal-I[/color] ändert die wirksame Empfänger-ID.\n\nEin gültiges [color=orange]Signal-D[/color] überschreibt stets die manuelle Empfängerwahl.\nErgibt [color=orange]Signal-D[/color] keinen gültigen Empfänger, gilt der manuelle Konsolenempfänger. Ein von null verschiedenes [color=orange]Signal-E[/color] überschreibt weiterhin die Scharfschaltung; sonst gilt der manuelle Zustand.\nDer sichtbare Torkörper genügt daher für reine Steuerverkabelung ohne Telemetrie.\nFehlt [color=orange]Signal-E[/color] oder ist es null, während eine eindeutige [color=orange]Signal-D[/color]-Route besteht, wird diese standardmäßig scharfgeschaltet.
gate-control-signals=Vom Tor gelesene Steuersignale
gate-4=Tor-Telemetrie
gate-text-4=Das Tor gibt Telemetrie über die verborgene [entity=ei-gate-circuit-interface] aus.\nDie Signalreihe unten zeigt die Ausgaben.\nDer Anschluss am sichtbaren Körper kann über den verborgenen Quellbehälter weiterhin Steuersignale führen, ist aber kein eigener Telemetriesender.\n\nDie Schnittstelle aktualisiert nur mit externer Schaltungsverbindung, höchstens einmal pro Sekunde. Wird die Verkabelung entfernt, werden Ausgaben gelöscht, statt als veraltete Daten stehen zu bleiben.\n\nBei Verkabelung:\n[color=orange]ei-gate-active[/color] bleibt vorhanden und zeigt 0 oder 1, je nachdem, ob das Tor aktiviert ist, ein gültiges Ziel hat und oberhalb der Mindestenergie liegt.\n[color=orange]ei-gate-stress[/color] bleibt vorhanden und meldet Belastung auf einer Skala von 0-100.\n[color=orange]ei-gate-energy[/color] meldet gespeicherte Energie in MJ, entfällt bei 0 MJ aber vollständig.\n\nNutze die Signale für Alarme, Puffer oder Steuerungen ohne vollständige Kombinatoraktualisierung in jedem Tick.
gate-telemetry-signals=Vom Tor gesendete Telemetriesignale
gate-5=Belastung und Rückstände
gate-text-5=Jede erfolgreiche Übertragung erhöht die Belastung. Sie steigert den Energiebedarf, verlängert die Abklingzeit und kann bei zu schneller Wiederholung den Empfänger sättigen.\n\nUnscharfe Tore oder Tore unterhalb der Mindestenergie verweigern neue Einlagerung. Abkühlung und Empfängersättigung verwerfen bereits angenommene Fracht nicht; sie verzögern nur die Übertragung, bis Bruch oder Empfänger sich erholen.\n\nDie Konsole zeigt die Sperre nach einer Übertragung als [font=default-bold]Laufzeitzustand: Abkühlend[/font]. [font=default-bold]Empfängerbelastung[/font] spiegelt die aktuelle Zielsättigung. [font=default-bold]Laufzeitzustand: Kritisch[/font] bedeutet überschrittene Instabilitätsschwelle und erhöhtes Entladungsrisiko.\n\nDie Transitspanne zeigt den aktuellen Routendruck. Dieselbe Oberfläche bleibt günstig; Sprünge zwischen Orbit und Planet haben hohe Mindestkosten. Bewegte Plattformempfänger verwenden den aktuellen Routenfortschritt.\n\nBei genügend hoher Belastung kann ein aktiv haltendes Tor kurze elektrische Ranken ausschlagen lassen und nahe Einheiten beschädigen.\n\nÜbernutzung erzeugt außerdem [item=ei-breach-residue], Abfall dimensionaler Vernarbung. Das Tor legt Rückstände zuerst in Quell- oder Empfängerinventaren ab; nur Überschuss fällt am Tor aus. Neutralisiere sie über die Reinigungskette, bevor sie sich anhäufen.\nDas Tor dient stoßweiser Logistik, nicht dauerndem Frachtverkehr.
gate-6=Alte Tore
gate-text-6=Alte Spielstände mit Kisten- oder Positionszielen funktionieren bis zur Neukonfiguration weiter.\nNach Zuweisung eines Empfängers ist dieser maßgeblich; das alte Positionsziel dient nur noch zur Information.\nDie Konsole kann diesen Punkt weiterhin als [font=default-bold]Altes Positionsziel[/font] zeigen, bis er ersetzt oder gelöscht wird.\nSo bleiben alte Spielstände erhalten, während neue Anlagen Empfänger-IDs nutzen.
gate-7=Toreinstimmung
gate-text-7=Aktuelle Startabstimmung: [font=default-bold]__1__[/font]\n\nGeborgen behält den aktuellen Torfortschritt.\nAbgestimmt verschiebt ihn mit teureren Zutaten tiefer ins Alien-Zeitalter.\nResonant verschiebt ihn ins späte Quantenzeitalter.\nParadox verschiebt ihn ins exotische Zeitalter.\n\nDie Abstimmung verändert die Position in der Technologiekette und die Baukosten von Tor und Empfänger. Ihr Verhalten nach dem Bau bleibt gleich.

drone=Drohnenhangar
drone-text=Ein Drohnenport zur Übernahme und Steuerung einer [color=blue]Drohne[/color][entity=ei-drone]. Beim Platzieren entsteht die zugehörige Drohne, die per Klick auf den Port angezeigt wird. Dort lässt sich der Uplink zur Steuerung herstellen. Die Drohne fliegt über Gelände, baut und entfernt Gebäude und bewegt Gegenstände in ihr eigenes Inventar und daraus heraus. Kämpfen kann sie nicht. Mit [color=orange]VERLASSEN[/color] löst du die Verbindung jederzeit; [color=orange]ZURÜCKSETZEN[/color] holt sie zum Port zurück. Ein Flug durch das Tor löst den Transport aus.

repair=Artefaktreparatur
repair-text=Fertige [color=blue]Artefaktreparatursätze[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair], um beschädigte Alien-Artefakte wieder nutzbar zu machen. Ziehe den Satz über das Artefakt; bei erfolgreicher Reparatur wird er verbraucht. Kristallakkumulator-Sätze können per alternativer Auswahl auch Kristalle und Resthüllen prüfen, ohne verbraucht zu werden.

alien=Uralte Alien-Daten
knowledge-text=Die uralte Zivilisation hinterließ neben ihren Artefakten auch einen Teil ihrer Daten.

new-logistics=Neue Logistik
new-logistics-text=Exotic Industries erweitert die Logistik um neue Systeme, Einheiten und Mechaniken. Die Unterkategorien schaffen [font=default-bold]strukturelle Klarheit.[/font]\n\nÖffne sie über das Menü links.\n\nBewegung ist nicht länger trivial.\n\nJede Route ist eine Entscheidung.\n\nJeder Fluss ist ein Entwurf.\n\nEffizienz wird [font=default-bold]verdient.[/font]

train-progression=Zugentwicklung
train-progression-text-2=Züge werden bereits im Dampfzeitalter verfügbar. Die erste [color=orange]Dampflokomotive[/color] [item=ei-steam-basic-locomotive] transportiert Gegenstände, aber keine Flüssigkeiten.\n\nDie [color=orange]fortschrittliche Dampflokomotive[/color] [item=ei-steam-advanced-locomotive] erschließt Flüssigkeitstransport. Beide verbrennen etwa Kohle oder feste Biomasse und können mit Raketen-, Kern- oder Fusionsbrennstoff leistungsfähiger werden.\n\nSpäter wird die schmutzige Verbrennung zum Nachteil. Für saubereren und schnelleren konventionellen Bahnverkehr folgen [color=brown]Dieselkraftstoff[/color] [item=ei-diesel-fuel-unit] und die [color=orange]Diesellokomotive[/color] [item=locomotive].\n\nLogistik wächst mit der Technik.\nBrennstoff bestimmt die Grenze.\nZüge fragen nicht wohin; sie verlangen, was brennt.\n\nMit Gaia zweigt die Bahn in kristalline Feldlogistik ab. Dafür gibt es den eigenen Eintrag [font=default-bold]EM-Züge[/font], denn diese Bahn verhält sich wie vernetzte Strominfrastruktur.
train-progression-text=Züge werden bereits im Dampfzeitalter verfügbar. Die erste [color=orange]Dampflokomotive[/color] [item=ei-steam-basic-locomotive] transportiert Gegenstände, aber keine Flüssigkeiten.\n\nDie [color=orange]fortschrittliche Dampflokomotive[/color] [item=ei-steam-advanced-locomotive] erschließt Flüssigkeitstransport. Beide verbrennen etwa Kohle oder feste Biomasse und können mit Raketen-, Kern- oder Fusionsbrennstoff leistungsfähiger werden.\n\nSpäter wird die schmutzige Verbrennung zum Nachteil. Für saubereren und schnelleren konventionellen Bahnverkehr folgen [color=brown]Dieselkraftstoff[/color] [item=ei-diesel-fuel-unit] und die [color=orange]Diesellokomotive[/color] [item=locomotive].\n\nLogistik wächst mit der Technik.\nBrennstoff bestimmt die Grenze.\nZüge fragen nicht wohin; sie verlangen, was brennt.\n\nMit Gaia zweigt die Bahn in kristalline Feldlogistik ab. Dafür gibt es den eigenen Eintrag [font=default-bold]EM-Züge[/font], denn diese Bahn verhält sich wie vernetzte Strominfrastruktur.

em-trains=EM-Züge
em-trains-text=Gaias späte Eisenbahnen verbrennen nicht; sie koppeln sich an. [item=ei_charger]EM-Ladestationen bilden ein kristallines Feldnetz entlang der Schienen. Die [item=ei_em-locomotive]EM-Lokomotive mit [item=ei_em-cargo-wagon]Güter- und [item=ei_em-fluid-wagon]Tankwaggons fährt in diesem Netz statt mit Kohle oder Diesel.\n\nDa der Antrieb aus dem Ladefeld statt aus Verbrennung stammt, funktionieren dieselben Fahrzeuge auf Planeten und außerweltlichen Strecken. Gaianische Ingenieure behaupten, die Kristalle erinnerten sich an die Schienengeometrie und zögen den Zug durch diese Erinnerung. Physik oder Liturgie: Im Vakuum funktioniert es.
em-trains-2=Qualität, Überbrückung und Übertragungseffizienz
em-trains-text-2=Qualität wirkt auf beiden Seiten. Hochwertigere [item=ei_charger]Ladestationen senken ihren Feldgrundverbrauch um bis zu [font=default-bold]20%[/font] und verbessern die Übertragungseffizienz um weitere [font=default-bold]12%[/font]. Hochwertigere [item=ei_em-locomotive]Lokomotiven benötigen bis zu [font=default-bold]16%[/font] weniger Feldleistung. Die Boni werden über die aktive Qualitätsleiter normiert und unterstützen zusätzliche Mod-Qualitäten zwischen niedrigster und höchster Stufe.\n\nLokomotivqualität schafft außerdem eine [font=default-bold]Überbrückungszeit[/font] nach Verlassen der Ladeabdeckung. Bei höchster Qualität bleibt die Feldkohärenz bis zu [font=default-bold]480 Ticks oder 8 Sekunden[/font] erhalten. Normale Qualität erhält keine Überbrückung. Sie dient kurzen Lücken, Schienenübergängen oder Routingfehlern, nicht dauerhaft unversorgten Strecken.
em-trains-3=Forschung und Feldverhalten
em-trains-text-3=Die Forschungsfamilien [font=default-bold]ei_acc[/font], [font=default-bold]ei_spd[/font] und [font=default-bold]ei_eff[/font] bleiben die globalen Hauptmultiplikatoren. Tempo und Beschleunigung steigen jeweils um [font=default-bold]+10% je Stufe[/font] bis [font=default-bold]+200%[/font]. Ladeeffizienz erreicht über fünf Stufen bis zu [font=default-bold]90% weniger Netzbelastung[/font]. Lokale Qualität von Ladestation und Lokomotive wirkt bei der tatsächlichen Übertragung zusätzlich.\n\nGute EM-Bahn braucht Forschung und Hardware. Bei erneuerter Abdeckung bleibt der Feldbrennstoff gefüllt. Bricht die Abdeckung weg, wird zuerst die Überbrückungsreserve verbraucht; danach steht die Lokomotive still. Gaia verzeiht vieles. Ein gebrochenes Feld gehört nicht dazu.

orbital-scanner=Orbitallogistik-Scanner
orbital-scanner-text=Der Orbitalverbund beginnt mit dem [entity=ei-orbital-combinator]. Scanner gehören auf die Startoberfläche der gewünschten Plattformen. Sie spiegeln nur Plattformen, deren [font=default-bold]Weltraumort dieser Oberfläche entspricht[/font]. Anfragen zeigt konfigurierte Mindestmengen, Unterwegs bereits zugewiesene Fracht, Bedarf den Rest nach Abzug unterwegs befindlicher Fracht und des Zentrallagerbestands.\n\nOrthogonal benachbarte Scanner bilden eine Bank, teilen übergroße Ausgaben auf Fortsetzungsabschnitte auf und senden [virtual-signal=ei-orbital-overflow] bei Platzmangel. Jeder benötigt [font=default-bold]750 kW[/font]. Schaltungsverkabelung hält die Bank aktuell. Ohne Verkabelung aktualisiert sie weiter, solange das Fenster offen ist; danach nur noch in größeren Abständen.
orbital-scanner-2=Transponder, Selektoren und Koordination
orbital-scanner-text-2=[font=default-bold]Verbundrollen[/font]\n\n[entity=ei-platform-transponder] steht auf dem Plattformdeck und vergibt die stabile Plattformnummer für alle nachfolgenden Werkzeuge. Manuelle IDs sind erlaubt; doppelte IDs verschiedener Plattformen bleiben widersprüchlich, bis eine gelöscht wird.\n\n[entity=ei-orbital-selector] steht auf der Versandoberfläche und wählt jeweils ein Ziel. Manuell verwendet er die eingegebene ID, per Schaltung [virtual-signal=ei-platform-id]. Der Regelmodus wählt eine unzugeteilte Plattform derselben Oberfläche mit positivem Bedarf.\n\n[entity=ei-orbital-coordinator] ist die Oberflächeninstanz. Je Partei und Oberfläche bleibt nur einer aktiv. Er vergibt Zuteilungen, damit mehrere Startwege nicht blind dieselbe Plattform bedienen.\n\n[entity=ei-orbital-dispatch-uplink] steht neben dem Raketensilo und gibt die zugeteilte gemischte Frachtliste zur Beladung weiter. Öffne jede Verbundeinheit direkt für ihr Seitenfenster. Die sichtbaren Kombinatorseiten sind reine Telemetrie, keine Konfiguration.\n\n[font=default-bold]Fenstersteuerung[/font]\n\nDer Transponder setzt oder löscht manuelle Plattform-IDs. Der Selektor ändert Modus und im manuellen Modus die Ziel-ID. Der Koordinator fordert eine Verbundaktualisierung an, für Administratoren auch einen Laufzeitneuaufbau. Der Uplink bindet oder löst ein Silo, kann das nächste benachbarte wählen und setzt Übergrößenregel sowie Restbedarfsschwelle.
orbital-scanner-text-2b=[font=default-bold]Zuerst das Seitenfenster öffnen[/font]\n\nDie sichtbaren Kombinatorseiten sind reine Telemetrie. Öffne das Seitenfenster des Scanners oder eines anderen Verbundgeräts zum Ändern der Einstellungen. Die Legende erklärt obere und mittlere Zeilen sowie den Hinweis zur nächsten Aktion.
orbital-scanner-3=Versanduplinks und hybride Beladung
orbital-scanner-text-3=[font=default-bold]Inbetriebnahme[/font]\n\n1. Platziere Transponder auf den Plattformen selbst.\n2. Platziere mindestens einen Selektor auf der Versandoberfläche und gib ihm manuell, per Schaltung oder Regel ein Ziel.\n3. Aktiviere einen Koordinator auf derselben Versandoberfläche.\n4. Platziere Uplinks neben Raketensilos. Nachbarschaft liefert die erste Vorauswahl; bestätige, ersetze oder lösche die Bindung im Seitenfenster und wähle die Übergrößenregel.\n\nDer Verbund arbeitet, wenn ein Selektor bereit ist, die Oberfläche einen aktiven Koordinator hat und ein Uplink gültige Silobindung und Zuteilung besitzt.\n\n[font=default-bold]Sperrzustände[/font]\n\nKein Ziel bedeutet fehlende gültige Plattform-ID. Kein Bedarf bedeutet keinen aktuellen Restbedarf des Ziels. Fehlende Silobindung bedeutet, dass der Uplink nicht an ein echtes Raketensilo gebunden ist. Kein aktiver Koordinator bedeutet, dass der Versandoberfläche ihre aktive Zentrale fehlt.\n\nBeladung bleibt in v1 hybrid: Greifarme, Züge, Anforderungskisten und Schaltungen übernehmen die physische Arbeit. Dauerhaft hält große Aufträge über mehrere Raketen. Einzelschuss gibt nach einem Start frei. Schwelle setzt nur fort, solange der Restbedarf über dem gewählten Mindestwert liegt; dieser Wert gilt nur im Schwellenmodus.
spidertron=Spidertron-Änderungen
spidertron-text=Der [font=default-bold]Spidertron wird früher verfügbar[/font], bereits im Simulationszeitalter. Er benötigt jetzt allerdings Brennstoff.\n\nAnfangs genügen Kohle, Biomasse und andere brennbare Feststoffe. Später verbessern Kern- und Fusionsbrennstoffe Geschwindigkeit, Beschleunigung und Einsatzreichweite erheblich.\n\nEr ist eine [font=default-bold]Plattform der Eskalation.[/font]\n\nMods wie [color=green]Spidertron Patrols[/color] und [color=green]Constructron-Continued[/color] besitzen besondere Integration für das veränderte Spidertron-System von Exotic Industries.\n\nDie Spinne läuft früher, aber mit Zweck, Gewicht und Anspruch.\n\nVersorge sie gut oder [font=default-bold]bleibe zurück.[/font]

cranes-and-belts=Neue Fließbänder und Greifkräne
cranes-and-belts-text=Das [color=orange]Neo-Logistikfließband[/color] [item=ei-neo-belt] besteht aus Hightech-Materialien und erreicht [font=default-bold]90 Gegenstände pro Sekunde[/font], mehr als die ursprünglichen Transportgrenzen. Es trägt Endspielmengen und Fabriken rekursiven Maßstabs.\n\nHinzu kommen [color=orange]Kräne[/color] [item=ei-big-inserter-normal], gewaltige Greifarme mit hoher Kapazität für Massentransport.\n\nNutze sie für:\n\nSchnelles Entladen von Zügen\n\nVerbindungen großer Inventare, etwa Kisten ↔ Lagerhäuser\n\nSteten Fluss, wo gewöhnliche Greifarme unter Druck versagen\n\n[font=default-bold]Geschwindigkeit ist kein Luxus mehr.\nSie ist der Ausgangspunkt.\nLogistik muss mit der Macht wachsen oder daran zerbrechen.[/font]

loaders=Belader
loaders-text=EI-Belader bilden den direkten Zuführungszweig: [item=ei-steam-loader]Dampfbelader, [item=ei-loader]Belader, [item=ei-fast-loader]schneller Belader, [item=ei-express-loader]Expressbelader, [item=ei-turbo-loader]Turbobelader und [item=ei-neo-loader]Neo-Belader. Der Dampfbelader wird mit Logistik verfügbar und benötigt Dampf; der elektrische Standardbelader führt die Kette zur Automation. Jede spätere Stufe erhöht den Durchsatz und benötigt erst Druck, dann Strom.\n\nBelader verbinden den Bandfluss direkt mit Maschinen, Behältern, Waggons und Schnittstellen neben Schienen.\n\nWenn die Greifarm-Schwenkzeit begrenzt, sind Belader die Antwort.
loaders-2=Stapeln
loaders-text-2=[item=ei-steam-loader]Dampf-, [item=ei-loader]Standard- und [item=ei-fast-loader]schnelle Belader bewegen nur ungestapelte Gegenstände. [item=ei-express-loader]Expressbelader erlauben einstellbare Stapel bis [font=default-bold]2[/font]. [item=ei-turbo-loader]Turbobelader stapeln ebenfalls bis [font=default-bold]2[/font]. [item=ei-neo-loader]Neo-Belader übernehmen die volle Bandstapelgrenze des Spiels und lassen sich für mehr Präzision ebenfalls niedriger einstellen.\n\nHöhere Stufen bewegen daher nicht nur schnellere Bänder, sondern dichtere Ladungen auf derselben Fläche.
loaders-3=Filterung
loaders-text-3=[item=ei-steam-loader]Dampf-, [item=ei-loader]Standard-, [item=ei-fast-loader]schnelle und [item=ei-express-loader]Expressbelader verwenden [font=default-bold]einen gemeinsamen Filter[/font] für beide Bandspuren. [item=ei-turbo-loader]Turbo- und [item=ei-neo-loader]Neo-Belader erhalten [font=default-bold]zwei Spurfilter[/font] mit getrennter Steuerung je Bandseite.\n\nDamit bestimmt ein Belader sowohl den Gegenstand als auch seine Zielspur.
loaders-4=Ausrichtung und Platzierung
loaders-text-4=EI-Belader [font=default-bold]richten sich beim Platzieren automatisch auf eine gültige Verbindung aus[/font] und prüfen die Bindung erneut, wenn nahe Bänder verändert werden. Sie prüfen echte Verbindungen mit Bändern, Behältern, Waggons und Positionen neben Schienen.\n\nAn Waggons, Kisten, Maschinen oder Schienenschnittstellen kann ein Belader sich drehen oder seine Flussrichtung umkehren, damit die Verbindung tatsächlich greift. Maßgeblich ist die echte Verbindung.
loaders-5=Energiebedarf
loaders-text-5=[item=ei-steam-loader]Dampfbelader benötigen [font=default-bold]Dampfversorgung[/font] am Flüssigkeitseingang. Die elektrische Reihe beginnt beim [item=ei-loader]Belader: Jeder bewegte Gegenstand verbraucht Energie aus einem internen Puffer. Spätere Stufen erhöhen Puffer und Verbrauch je Gegenstand. Mehr Leistung kostet mehr.\n\nEin elektrischer Belader überbrückt kurze Stromausfälle mit gespeicherter Ladung, hält aber ohne Netzversorgung keinen dauerhaften Spitzendurchsatz. Bei Strommangel fällt zuerst der Durchsatz ab.
bots=Mehr Roboter
bots-text=Remembrance bringt Maschinen schon vor sauberer elektrischer Logistik in die Luft. Die Entwicklung beginnt im [font=default-bold]Dampfzeitalter[/font] mit [item=rp-steam-roboport], [item=rp-steam-logistic-bot] und [item=rp-steam-construction-bot] und führt später zu schwereren, fortschrittlicheren Elektroschwärmen.\n\nSo entsteht früh eine Beziehung zur fliegenden Automation: zuerst roh, später elegant.
steam-bots=Dampfroboter
steam-bots-text=Diese Arbeitergeister aus Messing werden von Kolben, Druck und grober Berechnung getragen. Sie sind die ersten fliegenden Diener einer Industrie, die noch nach heißem Metall und nassem Dampf riecht.\n\nDa die Dampfhangar-Reihe im [font=default-bold]Dampfzeitalter[/font] liegt und die spätere ursprüngliche Robotik dahinter eingeordnet wird, erhältst du fliegende Logistik- und Bauhilfe deutlich früher als gewöhnlich.
steam-bots-2=Kesselblut und Versagen
steam-bots-text-2=Der Preis ist Ausdauer. Dampfroboter fliegen mit gespeichertem Druck und müssen vor dessen Erschöpfung zum Hangar zurück. Geht unterwegs der Dampf aus, [font=default-bold]fallen sie vom Himmel[/font].\n\nDampfhangars schicken sie früh zum Nachladen, doch lange Aufträge, überfüllte Hangars und überdehnte Netze können frühe Bequemlichkeit in Wracks verwandeln.
bots-2=Spätere Roboterreihen
bots-text-2=Mit vollständiger elektrischer Robotik erweitert EI den Schwarm um schwere Frachtroboter für Massentransporte, schwere Bauroboter für schnelle Bauphasen und später fortschrittliche Varianten mit mehr Tempo, Reichweite, Haltbarkeit und Spezialisierung. Der [font=default-bold][color=orange]fortschrittliche Roboterhangar[/color][/font] unterstützt sie mit schnellerem Laden, mehr Roboterplätzen und größerem Arbeitsradius.\n\nDies ist [font=default-bold]ein mechanisiertes Schwarmprotokoll.[/font]


new-mechanics=Neue Spielmechaniken
new-mechanics-text=Exotic Industries führt viele neue Mechaniken ein, die die Grundregeln des Spiels verändern.\n\nSie sind in übersichtliche Unterkategorien gegliedert.\nÖffne sie über das Menü links.\n\n[font=default-bold]Diese Schichten sind nicht optional.[/font]\n\nSie sind die neue Physik der Welt.\n\nStudiere sie oder [font=default-bold]lass dich von ihnen zerlegen.[/font]


beacon-overhaul=Effektverteiler-Überarbeitung
beacon-overhaul-text=Bei aktivierter Effektverteiler-Überlastung darf eine Maschine höchstens von 4 Effektverteilern beeinflusst werden. [font=default-bold]Die Zeit unbegrenzter Häufung ist vorbei.[/font]\n\nEffektverteiler oberhalb der ersten Stufe benötigen außerdem [fluid=ei-liquid-nitrogen] als Kühlmittel. Ohne Kühlung überhitzen sie und schalten ab. Die Logistik muss thermodynamische Stabilität sichern.\n\nDafür wurden Effektverteiler aufgewertet:\n\nMehr Modulplätze\nEin verbesserter Effektverteiler\nZählt bei aktivierter Überlastung als 2 Effektverteiler\nFasst noch mehr Module\nBenötigt mehr Infrastruktur\n\n[font=default-bold]Verstärkung ist nicht länger trivial.[/font]\nSie ist eine mechanische Disziplin.\nBaue präzise oder [font=default-bold]versinke in Ineffizienz.[/font]

specialised-pipes=Spezialrohre und Datenkabel
specialised-pipes-text=Remembrance behandelt Fluidleitungen als Eindämmungstechnik.\n\n[color=orange]Isolierte Rohre[/color] halten kryogene, heiße und chemisch aggressive Fluide stabil. [color=orange]Datenkabel[/color] tragen [color=blue]Simulationssubstrate[/color] [fluid=ei-computing-power]. Gewöhnliche Chemikalien schließen diese Spezialleitungen kurz.\n\nMit der Leitung wählst du auch, welches Versagen sie überstehen kann.
specialised-pipes-2=Fehlerklassen
specialised-pipes-text-2=Unisolierte Rohre, unterirdische Abschnitte, erhöhte Leitungen und Tanks versagen unterschiedlich. [fluid=ei-liquid-nitrogen]Flüssiger Stickstoff und [fluid=ei-liquid-oxygen]flüssiger Sauerstoff verdampfen in gewöhnlichen Leitungen. [fluid=ei-heated-helium-3]Erhitzte Prozessfluide und Lava verursachen heiße Brüche. Fluorketone und Elektrolyt zerreißen Leitungen mit chemischer Entladung.\n\nTanks können heftiger bersten als einfache Rohrsegmente. Erhöhte Leitungen begrenzen die Wirkung und vermeiden großflächige Deckverunreinigung.
specialised-pipes-3=Eindämmungsdisziplin
specialised-pipes-text-3=Isolierte Rohre benötigen weiterhin keine gewöhnliche Rohrheizung. Isoliertes Rohr, unterirdisches Rohr und Tank haben [font=default-bold]0 Heizenergie[/font] und brauchen auf Aquilo oder anderen kalten Oberflächen keine externe Wärme gegen Einfrieren.\n\nNutze sie für unveränderte Fluidzustände: kalte Flüssigkeiten bleiben kalt, reaktive Mischungen eingeschlossen. Spezialleitungen halten stand, wo gewöhnliche Rohre entlüften, kurzschließen oder bersten.
specialised-pipes-4=Signaturen und Überwachung
specialised-pipes-text-4=Bruchfolgen hängen von Leitung und Verunreinigung ab. In gemischten Abschnitten bestimmt der tatsächlich gefährliche Stoff den Bruch, auch wenn er nicht den größten Anteil stellt. Datenfehler erzeugen Lichtbögen, Kryofehler Frost, thermische Fehler Brandspuren und chemische Fehler Nebel oder korrosive Entladung. Datenkabel bleiben selbst bei thermischer oder chemischer Verunreinigung feuerfrei; erhöhte Rohre halten die Explosion lokal. Wiederholte Fehler desselben Segments werden gedrosselt, damit Folgen nicht mehrfach den Bildschirm fluten.\n\nZur Prüfung meldet `/ei_runtime_status` jetzt `fluid(t/u/d/s/cursor/mode)` für erfasst / dringend / geändert / Suche / Wartungszeiger / nächster Wartungsmodus, `fluidfx(qh/ql|sh/sl)` für wartend schwer / wartend leicht | unterdrückt schwer / unterdrückt leicht und `rupture(mode/a/p/d|ob/oi)` für Detailmodus / aktive Aufträge / ausstehende Ringe / geplante Verzögerungsgruppen | überfällige Gruppen / überfällige Einträge.
ei-runtime-status-enabled=ESIR-Laufzeittelemetrie aktiviert.
ei-runtime-status-disabled=ESIR-Laufzeittelemetrie deaktiviert.
ei-runtime-status-usage=Verwendung: /ei_runtime_status [snapshot|auric|auric-detail|telemetry-on|telemetry-off] (ohne Argumente erscheint die aktuelle Laufzeitzusammenfassung).
ei-runtime-status-command-help=Zeigt standardmäßig die aktuelle ESIR-Laufzeitzusammenfassung. Derselbe Befehl unterstützt snapshot, auric, auric-detail, telemetry-on und telemetry-off.
