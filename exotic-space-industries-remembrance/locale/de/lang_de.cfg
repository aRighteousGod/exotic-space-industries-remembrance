default=*ÄNDERE MICH* Standard-Kartengenerierung. [color=red]Diese Voreinstellung wird nicht empfohlen[/color] für Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].
ei-default=Die empfohlene Spielweise für Exotic [color=#08457E]Space[/color] Industries: [color=#FF1493]Remembrance[/color]. Deine Reise beginnt auf Nauvis, wo alle grundlegenden Rohstoffe und die frühe Infrastruktur liegen.\nDies ist die Wiege: vernarbt, vertraut und begrenzt.\nDer Feinddruck auf Nauvis wird in den ersten Zeitaltern gedämpft: größerer Startpuffer, langsamere frühe Evolution und eine standardmäßige Schonzeit, die durch die frühe Elektrizität ausläuft und im Computerzeitalter endet.\nMaterialien des Endspiels und fortschrittliche Systeme warten auf einer getrennten Oberfläche, die später freigeschaltet wird.\nDu wirst die vertraute Welt verlassen.\n[font=default-bold]Du wirst verändert zurückkehren.[/font]


