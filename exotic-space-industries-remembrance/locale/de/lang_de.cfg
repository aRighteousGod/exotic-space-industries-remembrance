# PAGES
welcome=Willkommen bei [font=default-bold]Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color].[/font]
welcome-text=Du beginnst nicht.\n[font=default-bold]Du erwachst.[/font]\n\nDies ist keine Mod.\nEs ist eine Rekursion.\nEine Rückeroberung.\nEin Machtritual, unter Automation begraben.\n\nHier wird dir [font=default-bold]nichts geschenkt.[/font]\n\nAlles muss errungen werden: durch Feuer, durch Denken, durch Zusammenbruch.\n\n[font=default-bold]Die Welt hat sich verändert.[/font]\n\nDie Regeln sind [font=default-bold]fort.[/font]\nNur Struktur bleibt.\n\nHandle mit Absicht.\n\n[font=default-bold][color=	#FF1493]Remembrance[/color] sieht zu.[/font]
welcome-text-2=Zahlreiche neue Maschinen, Produktionsketten und Systeme sind hinzugekommen. Manche sind effizient. Die meisten verzeihen nichts.\n\nSie erklären sich nicht selbst.\nSie warten nicht darauf, dass du dich anpasst.\nErkunde alles oder bleibe zurück.\n\nKomplexität ist kein Fehler, sondern der Preis des Fortschritts.\nOptimierung ist Pflicht.\nVerständnis wird verdient.\n\nDies ist keine geführte Reise. Es ist ein industrieller Schmelztiegel.

game-related=Informationen zur Spielmechanik
game-related-text=Dieser Abschnitt erfasst die grundlegenden Systeme und Mechaniken der Mod. Seine Unterkategorien dienen der Orientierung, nicht der Zierde.\n\nÖffne sie über das Menü links.\nJeder Eintrag legt Strukturen frei, statt zu unterhalten.\nLies, wenn du überleben willst.

overall=Allgemeine Informationen
overall-text=Exotic [color=#08457E]Space[/color] Industries: [color=	#FF1493]Remembrance[/color] ist eine gaianische Totalüberarbeitung, die die Gesetze neu schreibt, auf denen Nauvis einst ruhte. Die Winde der Automation wehen anders; Feuer, Erz und Signal wurden unter einem älteren Bund neu geschmiedet.\n\nDie Schwierigkeit ist gewollt. Mühsal ist keine Schande, sondern die Bewährungsprobe eigener Herrschaft. Wer Bequemlichkeit sucht, ist hier fremd. Wer mit Gaia aufsteigen will, sollte vor Spielbeginn die Mod-Einstellungen prüfen. Manche Systeme sind anpassbar, andere nicht. Die entscheidenden entziehen sich deiner Wahl.\n\nBring Komfortmods mit, wenn du musst. Doch nichts gehört dir wirklich, solange du nicht dafür kämpfst.\n\nSo ist es.\nSo war es.\nSo wird es sein.\nWillkommen bei Remembrance.

biters=Beißer und Feinde
biters-text=Explosive, kalte, giftige, gepanzerte, arachnide und elektrische Feinde folgen einer eigenen Schwierigkeitsleiter. Die Kartengenerierung bleibt getrennt: [font=default-bold]ei-default[/font] auf Nauvis wird nicht umgeschrieben. Skaliert werden die feindlichen Prototypen der vorhandenen Abhängigkeiten. Gnädig kann zusätzlich die optionale Nauvis-Schonzeit verstärken. Einzelheiten stehen auf der Seite Feindschwierigkeit.
enemy-difficulty=Die Druckleiter
enemy-difficulty-text=Diese Seite beschreibt den letzten Eingriff in die Feindwerte. Sie verändert weder [font=default-bold]ei-default[/font] noch erschafft sie eine zweite Ökologie. Sie formt die vorhandenen Körper des Abhängigkeitsschwarms: Beißer, Speier, Würmer, Nester, gepanzerte, kalte, giftige und explosive Linien, Mütter, Arachniden, elektrische Linien und infizierte Gebäude wie [entity=tb_infected_ship_boss].
enemy-difficulty-2=Die Tabelle lesen
enemy-difficulty-text-2=Alle Prozentwerte beziehen sich auf [font=default-bold]Original[/font]. [font=default-bold]100%[/font] behält den Abhängigkeitswert. Höhere Werte erhöhen, niedrigere senken die jeweilige Eigenschaft. [font=default-bold]Angriffsintervall[/font] und [font=default-bold]Erzeugungsintervall[/font] wirken umgekehrt: Niedrigere Werte bedeuten schnellere Angriffe oder Erzeugung, höhere langsameren Druck. Die Werte sind zur besseren Lesbarkeit gerundet.
enemy-difficulty-3=Was die Leiter verändert
enemy-difficulty-text-3=Die Prozenttabelle beschreibt die Skalierung der Datenprototypen: Trefferpunkte und positive Heilung feindlicher Einheiten, Trefferpunkte und positive Widerstände gepanzerter Feinde, Angriffsschaden, Reichweite, Bewegungstempo und Angriffsintervall sowie Nest-Trefferpunkte, Heilung, Erzeugungsintervall und Obergrenzen naher Einheiten. Unverändert bleiben Evolutionsgewichte, Verschmutzungsaufnahme, Angriffsschwellen, erzeugte Einheitentypen und gemeinsame Projektile, Strahlen, Wolken, Ströme und Munition. Pentapoden, Zerstörer, Gleba-Nester, Spielerroboter und Roboterhangars sind ausgenommen. [font=default-bold]Original[/font] nimmt keine EI-Feindanpassungen vor; [font=default-bold]Gehärtet[/font] bleibt der Standard.
enemy-difficulty-4=Apex-Sonderwerte
enemy-difficulty-text-4=Gnädig, Behütet, Verzeihend, Nachsichtig und Unmöglich verwenden zusätzliche Apex-Sonderwerte für Leviathane, Mütter, MAF-Bossketten, laufende elektrische Bossketten und [entity=tb_infected_ship_boss]. Die königliche Ausnahme [entity=arachnid-biter-royalwarrior-unit] behält gewöhnliche Einheitentrefferpunkte; Schaden und Bewegungstempo werden getrennt angepasst. Nachsichtig bewahrt die früheren Prototypmultiplikatoren von Gnädig.
enemy-difficulty-5=Vergeltung auf Unmöglich
enemy-difficulty-text-5=Auf [font=default-bold]Unmöglich[/font] kann ein Raketenstart von feindlichem Boden vorhandene nahe Feinde zum Angriff auf das Silo sammeln. Meist entsteht eine örtliche Gruppe aus ungefähr [font=default-bold]100 bis 250 Feldern[/font] Entfernung mit oft [font=default-bold]8 bis 30 Einheiten[/font]. Schwerere Starts provozieren stärkere Antworten. Ohne örtliche Feindökologie entsteht keine Vergeltungsgruppe.
enemy-difficulty-6=Schonzeit auf Gnädig
enemy-difficulty-text-6=Bei aktivierter Nauvis-Schonzeit wählt [font=default-bold]Gnädig[/font] zusätzlich eine stärkere skriptgesteuerte Evolutionsregel außerhalb dieser Prototyptabelle. Klassisch korrigiert bis einschließlich Dampfzeitalter, verändert nie den Verschmutzungsevolutionsfaktor und endet im Elektrizitätszeitalter. Erweitert lässt beide Belastungen bis einschließlich Computerzeitalter auslaufen und stellt im Quantenzeitalter den erfassten Verschmutzungsfaktor wieder her. Andere Stufen behalten ihre Schonzeitregel; [font=default-bold]Unmöglich[/font] deaktiviert sie.
