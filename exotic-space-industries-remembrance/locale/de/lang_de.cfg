gate-gui-control-source-label=Aktive Steuerung: __1__
gate-gui-control-source-label-tooltip=Manuell verwendet das Tor Empfänger und Zustand der Konsole. Die Schaltung übernimmt nur, wenn Signal-D eine gültige Empfänger-ID ergibt. Dann wählt Signal-D das Ziel und Signal-E schaltet lediglich scharf oder unscharf. Fehlt Signal-E oder ist es 0, wird die gültige Route standardmäßig scharfgeschaltet. Ist Signal-D nicht auflösbar, gilt der manuelle Empfänger. Ein von null verschiedenes Signal-E überschreibt weiterhin die Scharfschaltung; andernfalls gilt der manuelle Zustand.
