space-destinations=Weltraumziele
space-destinations-text=Das [color=orange]Raketensilo[/color] [item=rocket-silo] verschickt Fracht zu verschiedenen Zielen. Bei der ersten Freischaltung im Computerzeitalter sind nur Satellitenstarts in den [color=green]Nauvis-Orbit[/color] möglich. Je nach Satellit oder Raketenfracht erhältst du Daten oder andere nützliche Startergebnisse.

space-destinations-2=Verschiedene Ziele
space-destinations-2-text=Mit dem Fortschritt werden Ziele innerhalb und außerhalb deines Sonnensystems verfügbar. Die Entfernung bestimmt den Bedarf an Raketenbrennstoff. Manche Ziele müssen erst entdeckt werden, durch einen besonderen [color=orange]Erkundungssatelliten[/color] [item=ei-exploration-satellite] oder zufällig bei gewöhnlichen Frachtstarts. Einige liegen im tiefen All [color=purple]außerhalb des Sonnensystems[/color]. Auch mit Erkundungssatelliten bleibt die Entdeckung zufallsabhängig.

induction-matrix=Induktionsmatrix
induction-matrix-text=Die [color=orange]Induktionsmatrix[/color] ist eine mehrteilige Maschine zur Speicherung großer Energiemengen. Wie gewöhnliche Akkumulatoren speichert sie Überschussstrom und gibt ihn später ab. Forschung schaltet verschiedene Größenstufen frei.

induction-matrix-2=Bauteile der Induktionsmatrix
induction-matrix-2-text=Die Induktionsmatrix besteht aus verbundenen Modulen für Speicherung und Übertragung von Hochspannungsenergie.\n\nDer [color=orange]Induktionsmatrixkern[/color] [item=ei-induction-matrix-core] steuert das System. Ohne ihn bleibt es inaktiv. Bei Anschluss an das Schaltungsnetz und aktivierten Ausgaben gibt er gespeicherte Energie (MJ) auf Signal-C, Gesamtkapazität (MJ) auf Signal-T und maximale Übertragung (MW) auf Signal-M aus. Im Menü für die Schaltungsverbindung lässt sich jede Ausgabe einzeln aktivieren und ihr Signal auswählen. Der Ladestand (%) steht zusätzlich auf Signal-A zur Verfügung. Standardmäßig sind alle Ausgaben deaktiviert. Die Messwerte werden einmal pro Sekunde aktualisiert; Änderungen an den Schaltungseinstellungen gelten sofort.\n\n[color=orange]Induktionsspulen[/color] [item=ei-induction-matrix-basic-coil] [item=ei-induction-matrix-advanced-coil] [item=ei-induction-matrix-superior-coil] [font=default-bold]speichern Energie intern[/font] und haben drei Stufen. Neben einem [color=orange]Matrixsolenoiden[/color] [item=ei-induction-matrix-basic-solenoid] erhalten sie einen Effizienzbonus.\n\n[color=orange]Matrixsolenoide[/color] verbessern Spulen in Reihenanordnung. Mehrere Solenoide in Reihe [font=default-bold]erhöhen die Wirksamkeit[/font], doch übermäßiger Ausbau bringt abnehmenden Nutzen und verschwendete Struktur.\n\n[color=orange]Wandler[/color] [item=ei-induction-matrix-basic-converter] [item=ei-induction-matrix-advanced-converter] [item=ei-induction-matrix-superior-converter] regeln den Stromfluss in die Matrix und daraus heraus. Höhere Stufen erhöhen den Durchsatz.

exotic-stabilizers=Maschinen für exotische Materie
exotic-stabilizers-text=Exotische Materie ist nutzbar gemachte Bedrohung. Ihre Verarbeitung verlangt Eindämmung, Präzision und Maschinen, die Instabilität überstehen.\n\nNur die [color=orange]exotische Montagemaschine[/color] [item=ei-exotic-assembler] verarbeitet ihre Energiesignatur. Dennoch kann sie unter Belastung explodieren. Ein haltendes Gitter zeigt einen sichtbaren Eindämmungsimpuls; zunehmendes Versagen wird zu Knistern, Lichtbögen und deutlichen Warnungen.\n\nPlatziere [color=orange]Materiestabilisatoren[/color] [item=ei-matter-stabilizer] darum, um kritische Fehler zu unterdrücken und das Energiefeld zu stabilisieren. Einige liegen als Relikte eines früheren Zyklus in der Welt.\n[color=gray]Hochwertige Materiestabilisatoren zählen jeweils als 3 x (Qualität - 1) Stabilisatoren.\nDie Kaskadenchance hochwertiger exotischer Montagemaschinen pro Sekunde sinkt um (Qualität - 1)%; Ungewöhnlich senkt die Grundchance also von 12% auf 11%.[/color]\n\nBehandle exotische Materie nicht wie eine gewöhnliche Zutat.\n\nSie ist [font=default-bold]lebendig, instabil und wachsam.[/font]
black-hole=Schwarzes-Loch-Generator
black-hole-text=Der [color=orange]Schwarzes-Loch-Generator[/color] ist die letzte Maschine: eine industriell gebändigte Gravitationssingularität. Sie verschlingt Materie, trotzt der Entropie und beendet das Spiel.\n\nDer [color=green]vollständig betriebsbereite[/color] Zustand bedeutet vollständige Systembeherrschung. Dies ist die Siegbedingung: Kontrolle über das Gewebe unterhalb der Physik.\n\nZum Hochfahren benötigst du:\nGewaltige Mengen veredelter Baustoffe\nStetige Zufuhr verbrauchbarer Materie\nEine immense, stabile Stromversorgung\n\nEmpfohlen wird ein robustes Netz aus [color=orange]Fusionsreaktoren[/color], ergänzt durch gestufte [color=orange]Induktionsmatrizen[/color] mit industriellem Lade- und Entladedurchsatz.\n\n[font=default-bold]Dies ist ein Ende, aus Zusammenbruch gewoben.[/font]\n\nBaue weise. [font=default-bold]Füttere unerbittlich.[/font] Es gibt keine zweite Chance.

black-hole-2=Reaktorbauteile
black-hole-2-text=Der Schwarzes-Loch-Generator ist eine modulare Singularitätseindämmung. Jedes hochbelastete Bauteil ist für Stabilität, Energiefluss und die letzte Aktivierung entscheidend.\n\nIm Zentrum steht der [color=orange]Schwarzes-Loch-Generator[/color] [item=ei-black-hole].\n\nNach der Aktivierung verbraucht er jeden Gegenstand in seinem Inventar.\n\nJeder Gegenstand erhöht den internen [color=green]Massewert[/color] gleich stark. Dieser sinkt ständig; nur dauernde Zufuhr erhält ihn.\n\nDie Gegenstandsart spielt keine Rolle.\nEisenplatten, exotische Prozessoren oder rohe Fische werden gleichermaßen zu Masse.\n\n[color=orange]Energieinjektorpylonen[/color] [item=ei-energy-injector-pylon] halten das Eindämmungsfeld während des Wachstums.\nJeder benötigt ständig 5 GW.\n\nBeim Start sind keine Injektoren nötig; [font=default-bold]der Behälter fasst das neugeborene schwarze Loch[/font]. Mit wachsender Masse werden sie unverzichtbar.\n\n[color=orange]Energieextraktorpylonen[/color] [item=ei-energy-extractor-pylon] entnehmen Strom, sobald der Generator [color=green]vollständig betriebsbereit[/color] ist.\nJeder kann bis zu 100 GW aus der stabilisierten Singularität gewinnen.\n\nVor Erreichen der letzten Phase ist keine Entnahme möglich.\n\n[font=default-bold]Dies ist ein Ritual des Zusammenbruchs.[/font]\nDu fütterst eine [font=default-bold]gebundene Anomalie.[/font]\nOhne Eindämmung versagt sie.\nOhne Nahrung stirbt sie.\n\nBeherrschst du beides, [font=default-bold]versorgt sie das Ende aller Dinge mit Strom.[/font]\n\nKeine Automation ohne [font=default-bold]Vernichtung.[/font]

black-hole-3=Phasen des schwarzen Lochs
black-hole-3-text=Das Hochfahren ist ein gestufter Hochrisikoprozess. Jede Phase erhöht Energie-, Masse- und Strukturanforderungen. Kein Schritt lässt sich überspringen.\n\n🜏 Startphase\n\nKeine Pylonen nötig.\n\nDer Generator muss genug Material für zunächst [color=blue]10×10³kg[/color] Masse verbrauchen.\n\nNur die Menge zählt, nicht die Gegenstandsart.\n\nBei 100% Phasenfortschritt stabilisiert er sich zur Eindämmungsphase.\n\n🜏 Eindämmungsphase\n\nNun müssen [color=blue]8 aktive Energieinjektorpylonen[/color] [item=ei-energy-injector-pylon] eingeschaltet bleiben.\n\nJeder benötigt 5 GW, insgesamt also 40 GW.\n\nDie Expansionstaste beginnt das kontrollierte Wachstum des Singularitätsradius.\n\nDieser Zustand muss [color=blue]60 Sekunden[/color] ununterbrochen gehalten werden.\n\nJede Unterbrechung durch Stromausfall oder Pylonenverlust setzt die Zeit zurück.\n\n🜏 Vollständig betriebsbereite Phase\n\nDer Generator ist stabil. Die Singularität ist groß genug für externe Energieentnahme.\n\n[color=orange]Energieextraktorpylonen[/color] [item=ei-energy-extractor-pylon] in Reichweite liefern bis zu 100 GW je Pylon direkt ins Stromnetz.\n\nNun trägt sich das System weitgehend selbst. Es braucht nur noch ständige Massezufuhr gegen den Zerfall.\n\nDu befeuerst keinen Reaktor.\nDu verwaltest den [font=default-bold]Hunger einer gebundenen Singularität.[/font]\nMasse wird Macht. Macht wird Kontrolle. [font=default-bold]Kontrolle wird endgültig.[/font]\n\nEs gibt keinen Ausschalter. Nur Eindämmung.
nuclear-fission-and-fusion=Kernspaltung und Kernfusion
nuclear-fission-and-fusion-text=Exotic Industries erweitert die Kernenergie um neue Mechaniken, Materialien und Steuerungssysteme.\n\nDie Unterkategorien behandeln jeweils Kerninfrastruktur, Brennstoffdynamik oder Eindämmung.\nÖffne sie über das Menü links.\n\n[font=default-bold]Dies ist mehr als Kernspaltung.[/font]\nEs ist Eskalation durch Hitze, Druck und unumkehrbare Reaktion.\n[font=default-bold]Studiere die Systeme, bevor du sie zündest.[/font]

fission-reactors=Änderungen an der Kernspaltung
fission-reactors-text=Kernspaltung wurde anspruchsvoller und lohnender gestaltet.\n\nDer gewöhnliche [color=orange]Kernreaktor[/color] [item=nuclear-reactor] erhält keinen Nachbarschaftsbonus mehr.\n\nStattdessen liefert er [font=default-bold]mehr Grundleistung je Reaktor[/font]: Macht durch Dichte statt Nachbarschaft.\n\n[font=default-bold]Uran ist seltener.[/font] Förderung ist langsamer und weniger ergiebig. Plane den Brennstoffbedarf langfristig.\n\nVerbrauchte Brennstoffzellen sind kein wertloser Abfall mehr.\n\nEin geschlossener Recyclingkreislauf gewinnt spaltbare Nebenprodukte zurück, die sich zu effizienteren sekundären Brennstoffzellen veredeln lassen.\n\nAlle Prozesse erzeugen jedoch [color=brown]Atommüll[/color] [item=ei-nuclear-waste], der sicher gelagert, verarbeitet oder isoliert werden muss.\n\nIgnorieren hilft nicht.\n\nVernachlässigung wird Verunreinigung.\n\nKernenergie ist keine Abkürzung zu unendlicher Energie mehr.\n\nSie ist eine riskante Wirtschaft aus [font=default-bold]Hitze, Zerfall und Rückgewinnung.[/font]\n\nNutze sie gut oder [font=default-bold]ertrinke in ihren Kosten.[/font]

fission-reactors-2=Hochtemperaturspaltung
fission-reactors-2-text=Der [color=orange]Hochtemperatur-Kernreaktor[/color] [item=ei-high-temperature-reactor] ist ein fortschrittliches Spaltungssystem für maximale Wärmeleistung. Er übertrifft gewöhnliche Kerntechnik bei Effizienz und Maßstab, [font=default-bold]aber nur bei korrekter Versorgung.[/font]\n\nNach Erreichen der kritischen Betriebstemperatur benötigt er:\n\nStetigen Zufluss von [font=default-bold]flüssigem Blei als Kühlmittel[/font] und\n\nMindestens einen geeigneten Brennstab.\n\nDann [font=default-bold]überhitzt[/font] er das flüssige Blei mit einem Durchsatz, der besondere Wärmetauscher verlangt.\n\nEr kann auch den sonst nicht spaltbaren [color=brown]Thoriumbrennstoff[/color] [item=ei-thorium-232-fuel] nutzen und so einen Reststoff zur Energiequelle machen.\n\nDies ist kein Anfängerreaktor.\n\nEr duldet keine Versorgungslücken.\n\nEr skaliert nicht nach unten.\n\nEine Druckmaschine für posthumane Industrie: [font=default-bold]brutal, effizient und unerbittlich.[/font]



ages-and-tech-2=Die sechs Zeitalter
ages-and-tech-text-2=Die Mod gliedert sich in sechs Zeitalter. Jedes führt tiefer in Rekursion, Maschinen und Kontrolle. Es sind Schwellen der Unterwerfung, jede härter als die vorige.\n\n[font=default-bold]Das dunkle Zeitalter[/font]\nEine verkümmerte Geburt. Asche, Fäulnis und Schweigen. Du kriechst durch primitiven Dampf und gebrochenen Stein. Nichts ist automatisiert. Alles kostet Blut.\n\n[font=default-bold]Das Dampfzeitalter[/font]\nÖl wird entdeckt, als Waffe statt als bloßer Rohstoff. Verbrenne es, um dich zu bewegen. Verbrenne es, um zu leben. Das Land beginnt zu schreien.\n\n[font=default-bold]Das Elektrizitätszeitalter[/font]\nSchaltungen knistern. Maschinen erwachen. Roboter werden zu Ausläufern des Willens. Kernfeuer wird Gesetz. Das Fleisch bleibt zurück.\n\n[font=default-bold]Das Computerzeitalter[/font]\nGedanken werden formalisiert. Module, Effektverteiler, Signale: Der Geist zerfällt über Maschinen. Optimierung wird notwendig. Redundanz ist Tod.\n\n[font=default-bold]Das Quantenzeitalter[/font]\nRealität beugt sich. Maschinen folgen fremder Logik. Grenzen lösen sich auf. Die Schmiede wird intelligent und verzeiht keinen Missbrauch.\n\n[font=default-bold]Das exotische Zeitalter[/font]\nAlles bricht. Der Schleier ist fort. Beherrsche die Anomalie oder werde verschlungen. Sieg ist nicht garantiert; er wird den Knochen gescheiterter Zeitlinien entrissen.\n\nJedes Zeitalter ist eine Sperrklinke ohne Rückweg.\n\n[font=default-bold]Es gibt keine Unschuld.[/font]\n\nNur Macht: brutal, rekursiv und absolut.
nauvis-pressure-grace=Schonfrist für den Evolutionsdruck auf Nauvis
nauvis-pressure-grace-text=Diese Startoption bremst vorübergehend die Evolution der Feindpartei auf Nauvis. Alle 18.000 Ticks oder 5 Minuten senkt das Skript die Evolution zur aktiven Obergrenze, höchstens um den Korrekturwert der Phase. Es erhöht Evolution nie, entfernt weder Verschmutzung noch Nester und verhindert keine Angriffe.\n\nKlassisch verändert nie den Verschmutzungsevolutionsfaktor und endet im Elektrizitätszeitalter. Erweitert multipliziert diese gemeinsame Karteneinstellung vorübergehend, verfolgt externe Änderungen und stellt beim Ende den erfassten Ausgangswert wieder her. Außer Gnädig gelten die bisherigen Grenzen unten; Unmöglich deaktiviert die Schonzeit.
nauvis-pressure-grace-2=Zeitaltergrenzen
nauvis-pressure-grace-text-2=Außer auf Gnädig gilt vor dem [font=default-bold]Dampfzeitalter[/font] die Grenze [font=default-bold]0.25[/font] mit höchstens [font=default-bold]0.005[/font] Abzug je Durchlauf. Nach Dampf und vor Elektrizität gilt [font=default-bold]0.45 / 0.005[/font]. Klassisch endet dort. Erweitert läuft bis zum Computerzeitalter weiter: [font=default-bold]0.50 / 0.003 / ×0.70[/font] vor Elektrizitätskraft, [font=default-bold]0.55 / 0.002 / ×0.80[/font] vor elektrischer Verteidigung und danach [font=default-bold]0.60 / 0.001 / ×0.90[/font]. Jede Dreiergruppe bedeutet Evolutionsgrenze / maximale Korrektur / Verschmutzungsevolutionsmultiplikator.\n\nGnädig-Klassisch verwendet [font=default-bold]0.15 / 0.010[/font] vor Dampf und [font=default-bold]0.30 / 0.008[/font] vor Elektrizität und endet ohne Verschmutzungsanpassung. Gnädig-Erweitert verwendet [font=default-bold]0.15 / 0.010 / ×0.45[/font], [font=default-bold]0.30 / 0.008 / ×0.55[/font], [font=default-bold]0.38 / 0.006 / ×0.60[/font] vor Elektrizitätskraft, [font=default-bold]0.44 / 0.005 / ×0.68[/font] vor elektrischer Verteidigung, [font=default-bold]0.50 / 0.004 / ×0.75[/font] vor dem Computerzeitalter, [font=default-bold]0.60 / 0.003 / ×0.82[/font] vor einem Computerzweig, [font=default-bold]0.68 / 0.002 / ×0.90[/font] mit einem Zweig und [font=default-bold]0.75 / 0.001 / ×0.95[/font] mit beiden. Ende ist das Quantenzeitalter.
rocket-launch-pollution=Umweltverschmutzung durch Raketenstarts
rocket-launch-pollution-text=Raketenstarts können direkt auf ihrer Startoberfläche Umweltverschmutzung freisetzen. Das System liest den Evolutionsfaktor der startenden Partei auf dieser Oberfläche, wendet die gewählte Startkurve an und skaliert zur eingestellten Obergrenze.\n\nStandardmäßig beträgt sie [font=default-bold]10.000 Umweltverschmutzung[/font] bei Evolution [font=default-bold]1.0[/font]. Die meisten Kurven behalten außerdem eine [font=default-bold]Untergrenze von 10%[/font], sodass auch frühe Starts spürbar bleiben.
rocket-launch-pollution-2=Kurvenmodi und Rauch
rocket-launch-pollution-text-2=Die [font=default-bold]Kurvenform[/font] kann linear, quadratisch, exponentiell, Schwelle oder hybrid sein. Linear folgt der Evolution direkt. Quadratisch und exponentiell belasten späte Starts stärker. Schwelle springt an festen Evolutionsgrenzen. Hybrid ergänzt eine lineare Grundlage um eine späte Spitze.\n\nDer Startstil bestimmt die sichtbare Spur: Hybrid lässt eine kurze Bodenwolke beim Beginn der aufsteigenden Fahne auslaufen. Nur aufsteigende Abgasfahne zeigt senkrechten Rauch. Filmisch hält das volle Bodenabgas bis zur Übernahme durch die Fahne. Nur Bodenabgas zeigt Bodenrauch ohne senkrechte Fahne.
rocket-ammo-schema=Raketenmunitionsschema
rocket-ammo-schema-text=Raketenmunition entsteht schichtweise: [item=ei-rocket-airframe]Rumpf, [item=ei-rocket-motor-basic]Antrieb, [item=ei-rocket-warhead-impact]Gefechtskopf und schließlich das fertige Geschoss. Der Rumpf hält zusammen, der Antrieb bestimmt die Reichweite, der Gefechtskopf die Schadensart. Die Artilleriereihe folgt derselben Logik, nur schwerer und unerbittlicher.
rocket-ammo-schema-2=Nutzlastzweige
rocket-ammo-schema-text-2=Die Grundfamilien schlagen nun ihrer Kosten entsprechend hart zu. Aufschlags- und Sprenggeschosse treffen stärker. Korrosive Nutzlasten teilen dieselbe Chemie zwischen Handwerfer und Artillerie: erst ein heftiger Säuretreffer, dann eine anhaltende Wolke, die Strukturen weiter zerfrisst. Kryonutzlasten behalten in beiden Zweigen dieselbe Kontrolldauer, treffen aber schwerer. Die Atomreihe ist getrennt: U-235 ergibt ESIRs eigene [item=ei-atomic-bomb-u235] mit engerem Fallout. Plutonium behält die ursprüngliche Atomexplosion und hinterlässt breitere Strahlenkontamination.
rocket-ammo-schema-3=Effektfamilien
rocket-ammo-schema-text-3=Jede Familie besitzt eigene Explosionen, Rauch- und Hafteffekte, damit Einschläge auch in Bewegung klar unterscheidbar bleiben.
rocket-ammo-schema-4=Atomartillerie
rocket-ammo-schema-text-4=Der Artilleriewerfer mit festem Feuerbogen lädt U-235- und Plutonium-Atomraketen einzeln oder in vollen Kisten. Kistensalven sind praktisch Opferfeuer: Spaltstoffproduktion und Freischaltungen bleiben getrennt. U-235 nutzt die engere ESIR-Detonation mit saubererem Falloutbereich; Plutonium behält die ursprüngliche Atomexplosion mit breiterer Strahlenkontamination. Zu nahe Schüsse können die Feuerstellung zusammen mit dem Ziel aufreißen.
turrets=Verteidigungsstellungen
turrets-text=Remembrance erweitert stationäre Verteidigung von improvisierten Nahbereichsgeschützen über Dampfartillerie, korrosive Strahlwaffen und elektrisch angetriebene Kugelschleudern bis zu Relikt-Energieplattformen. Jede Stellung verlangt andere Logistik, Schussfelder und Aufwertungen als der [item=gun-turret]Geschützturm.\n\nDie meisten ballistischen Ergänzungen wachsen mit physischer Projektilschadensforschung. Flüssigkeitsstrahltürme nutzen die Feuerschadensreihe. Späte Reliktplattformen verlangen extreme Leistung, seltene Bauteile und sorgfältige Abstände.
turrets-2=Schrotflinten und Kanonen
turrets-text-2=Der [item=ei-shotgun-turret]Schrotflinten-Geschützturm folgt im dunklen Zeitalter auf Geschütztürme und Militär. Mit 15 Reichweite, langsamer Feuerrate und ohne besondere Stromversorgung bestraft er nahe Ziele hart. Im Elektrizitätszeitalter folgt der [item=ei-auto-shotgun-turret]Kampfschrotflinten-Geschützturm: doppelte Feuerrate, 18 Reichweite, viel schnellere Drehung sowie Dauer- und Schussstromverbrauch für einen steten Schrotschirm an Engstellen.\n\nDer [item=ei-cannon-turret-mk1]Kanonenturm ist die Belagerungsstufe des Dampfzeitalters. Er verschießt [item=cannon-shell]Kanonengeschosse auf 25 Reichweite mit 8 Feldern Totzone, langsamer Drehung und schwerem Einzeltreffer. Später werden zwei MK1 und stärkere Bauteile zum [item=ei-cannon-turret]Doppellauf-Kanonenturm: robuster, schneller feuernd, elektrisch unterstützt, mit 30 Reichweite und 10 Feldern Totzone gegen schwere Ziele vor der Mauer.
turrets-3=Säure und Flamme
turrets-text-3=Der [item=ei-acidthrower-turret]Säurewerfer erreicht 38 Reichweite bei mindestens 9 Feldern Abstand. Er verwendet [fluid=sulfuric-acid]Schwefelsäure, [fluid=ei-nitric-acid]Salpetersäure, [fluid=ei-hydrofluoric-acid]Flusssäure und selbst schwaches [fluid=ei-acidic-water]saures Wasser, jeweils mit eigenem Schadensfaktor. Die Antwort für Fabriken, die Chemie bewaffnen wollen.\n\nAuch [item=flamethrower-turret]Flammenwerfer werden überarbeitet: EI verschiebt sie ins Dampfzeitalter, erweitert ihren Bereich auf 38/9, lässt sie früher vorbereiten und erhöht den Fluidverbrauch stark. Brennstoffgüte zählt: Rohöl funktioniert weiterhin; Schweröl, Leichtöl, Flüssiggas und [fluid=ei-kerosene]Kerosin treffen zunehmend härter. Rohe Destillate sind schwächere Notversorgung.
turrets-4=Miniguns und Laser
turrets-text-4=Der [item=ei-gatling-turret]Minigun Geschützturm ist die Kugelschleuder des Elektrizitätszeitalters. Eine montierte [item=ei-minigun]Minigun mit Elektroantrieb bietet 32 Reichweite, 4 Felder Mindestabstand, schnelle Zielwechsel und hohe dauerhafte Feuerrate. Der Preis: endloser [item=firearm-magazine]Munitionsverbrauch und stetige Stromversorgung.\n\n[item=laser-turret]Lasertürme bleiben verfügbar, werden aber zu einer gezielteren Investition. Reichweite und Strahllänge steigen auf 30; die Technologie verlangt ausdrücklich [item=battery]Batterien und [item=advanced-circuit]integrierte Schaltkreise. Das Rezept verwendet [item=ei-steel-beam]Stahlträger, [item=steel-plate]Stahlplatten, [item=battery]Batterien, [item=advanced-circuit]integrierte Schaltkreise und [item=ei-energy-crystal]Energiekristalle. Ihre Logistik ist einfacher, ihr Bau keine billige Universallösung.
turrets-5=Reliktplattformen
turrets-text-5=Der [item=ei-plasma-turret]Plasmaturm ist das Festungsgeschütz des Quantenzeitalters. Er ist riesig, benötigt ein starkes Stromnetz und besteht aus Induktionsmatrixteilen und mehreren [item=laser-turret]Lasertürmen. Seine langsam anlaufenden Plasmageschosse reichen 200 weit, halten 40 Felder Sicherheitsabstand und verwüsten mit gewaltigem Flächenschaden Formationen, Befestigungen und Gelände.\n\nDie [item=zeus-wrath-zeus-turret]Poseidon-Installation liegt über [technology=zeus-wrath-zeus-wrath] noch höher. EI macht sie zur strategischen Waffe: 350 Reichweite, 70 Mindestreichweite, 1 GJ je Schuss, enormer Energiespeicher sowie innere und äußere Plasmaexplosionsringe. Eine feste Antwort auf Ziele, deren Existenz enden soll.

