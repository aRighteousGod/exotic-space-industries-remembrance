[entity-description]
ei-sawblade-turret=Elektrischer Sägenturm für den Nahbereich. Unter der unbewegten schwarzen Krone dreht sich der graue Klingenring und macht den Umkreis zum stählernen Eid. Benötigt [color=cyan]Elektrizität[/color].
ei-emerald-apocalypse-hover-tank=Eine schwebende Reliquienfestung auf Smaragdemittern. Der Lauf sammelt Druck; die Ladung verlässt ihn als Plasma, Rückstoß und grüne Leere dort, wo Gewissheit stand.
dw-deer-turret=Ein Artilleriegestell mit festem Schusskegel und langem Gedächtnis für schlechte Winkel. Halte das Ziel jenseits der Totzone und lass das Chassis argumentieren.
ei-gatling-turret=Benötigt Elektrizität und Munition.
ei-auto-shotgun-turret=Ein kompakter motorgetriebener Doppellaufturm für kurze, hässliche Distanzen. Er verbraucht Schrotpatronen mit hoher Feuerrate und füllt Korridore und Engstellen mit vernichtenden Streumustern. Schneller Zielwechsel, aggressive Verfolgung und Rückstoßausgleich benötigen [color=cyan]Elektrizität[/color]. Wer näherkommt, trifft auf unablässigen Schrothagel.
ei-steampunk-lamp=Erzeugt [color=orange]warmes[/color], flackerndes Licht durch Verbrennung von [color=green]Kerosin[/color][fluid=ei-kerosene].\nVerbraucht kontinuierlich Brennstoff.
ei-shotgun-turret=Wenn Entfernung versagt, antwortet dies.\nEin Nahbereichsschutz, der weder warnt noch verfehlt noch zögert.\nWer ihn erreicht, hat seinen Fehler bereits begangen.
ei-copper-beacon=Der Subzero-Phased-Array-Effektverteiler synchronisiert Signalphasen unter teilweiser Kryokühlung. Flüssiger Stickstoff senkt das Entropierauschen in Produktionsmatrizen.\nStabile Signalkohärenz verbindet nahe Fertigungsknoten und synchronisiert Produktivitätszyklen ohne die chaotischen Phasenstörungen heißer Umgebungen. Seine begrenzte Verstärkung bildet die Grundlage echter Tieftemperatur-Signaltechnik.\n[color=gray]„Gefriere das Rauschen. Stabilisiere die Absicht.“[/color]
ei-iron-beacon=Das Absolute-Zero-Phased-Array nähert sich der theoretischen Untergrenze thermischer Energie und dem Verriegelungspunkt des Quantengitters. Materie existiert dort nur noch, um Absicht zu übertragen.\nVerstärkte Wärmekerne und zweistufige Stickstoffkreisläufe überwinden Umgebungsentropie und ermöglichen reine Produktivitätsübertragung. Eine Trennung von Wärme, Störung und Kompromiss.\n[color=gray]„Am absoluten Nullpunkt kann selbst Zweifel nicht schwingen.“[/color]
ei-burner-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-steam-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-electric-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-cannon-turret-mk1=Einfach gebohrter Lauf, rohe Feuerkraft ohne Verfeinerung.
ei-cannon-turret=Zwei Läufe, ein Chassis. Doppelter Durchsatz, doppelter Lärm.\n[color=gray]Schnellfeuermechanik und fortschrittliche Zielsteuerung benötigen[/color] [color=cyan]Elektrizität[/color] [color=gray]zum Betrieb.[/color]
ei-acidthrower-turret=Warum kostbares Öl verbrennen, wenn Feinde bis auf die Knochen aufgelöst werden können? Dieser groteske Verwandte des Flammenwerfers setzt [color=green]Säure[/color] unter Druck, bis sie aus der Düse schreit. Der ätzende Nebel korrodiert Bauwerke und löst Panzer auf. Schaufle die Reste weg, bevor sie auch die Schaufel fressen.
offshore-pump=Elektrische Gewässerpumpe. Kostenloses Schöpfen endet; Wasser folgt nur einem versorgten Stromnetz.
ei-burner-offshore-pump=Gewässerpumpe mit brennbarem Treibstoff. Liefert vollen Wasserdurchsatz, doch das Ufer erinnert den Rauch.
ei-steam-offshore-pump=Dampfgetriebene Gewässerpumpe. Seitlich zugeführter Frischdampf ermöglicht volle Wasserförderung.
ei-burner-inserter=Dieser Greifarm verbrennt Brennstoff zum Bewegen von Gegenständen. Kann [color=orange]brennbaren Treibstoff[/color] aus Maschinen entnehmen, aus denen er Gegenstände holt.
ei-camp-fire=Kaum ein Leuchtfeuer, eher eine eigensinnige Kerze. Dieses Lagerfeuer spendet Licht durch bloße Beharrlichkeit: Es verbrennt, was du ihm gibst, und verlangt höflich mehr.
ei-bio-reactor=Ein lebender Reaktor aus bewusstem Gewebe.\nKeine Leichen – noch denkende Biomasse.\nNervengitter wachsen über Knochengerüste, gerade lebendig genug für zyklische Träume.\nEr verbrennt Identität.\nSchmerz wird Spannung. Erinnerung wird Entropie.\nJeder Schrei eine Rückkopplung. Jedes Gebet eine Spannungsspitze.\nMit seinem Hunger werden die eingeschlossenen Gedanken klarer.\n[color=gray]Benötigt[/color] [color=purple]0.1/s Biomaterie[/color][item=ei-bio-matter] [color=gray]zum Betrieb.[/color]
ei-warp-beacon=[color=purple]Bei aktivierter Effektverteilerüberlastung ausgenommen.[/color]\n[color=gray]Benötigt 60[item=ei-bio-matter]/s zum Betrieb.[/color]
ei-alien-beacon=[color=purple]Bei aktivierter Effektverteilerüberlastung ausgenommen.[/color]\n[color=gray]Benötigt 30[item=ei-bio-matter]/s zum Betrieb.[/color]
ei-exotic-assembler=Die exotische Montagemaschine zwingt Materie in unmögliche Formen. Quantenplasma schmiedet Reliquienbauteile: fremde Legierungen, vakuumresonante Schaltkreise und Geometrien verbotener Symmetrie.\nIhre Reaktionskammer ist [color=red]extrem instabil[/color]. Jeder Quantenkollaps droht zu detonieren. Umgebende [color=purple]Materiestabilisatoren[/color] begrenzen die Gefahr mit Gravitationsdämpfern und Entropiesiphons. [color=gray]Instabilitätschance je Sekunde: 12% - (Qualität - 1)%; umgebende Materiestabilisatoren können sie mindern.[/color]
ei-plasma-turret=Eine Reliquienwaffenplattform für eingeschlossenes Sternenfeuer. Quantenstabilisierte Spulen verdichten Plasma zu einer dichten violetten Kugel roher Sternenergie.
ei-high-temperature-reactor=Der Hochtemperaturreaktor nimmt externe Wärme eines Kernreaktors auf und leitet sie in sein glühendes Herz. Ein eingesetzter Spaltbrennstab vervielfacht die Wärmeleistung und überträgt sie in Ströme überhitzten Bleikühlmittels.
ei-beacon=Einst Gipfel synchroner Feldprojektion, trägt dieser Effektverteiler heute die Last seines Erbes. Sein grobes Gitter und veraltete Phasenharmonik senden weiter in eine Welt, die kaum noch hört.\nGebaut, als Durchsatz ein Gott war, ist er mehr Artefakt als Werkzeug. Sein Kern hält Kohärenz nur knapp vor dem Zusammenbruch.\nDoch er zählt. Er erinnert sich. Auch seine Last zählt zur Überlastung.\n[color=gray]„Geister der Effizienz verfolgen selbst rostige Gerüste.“[/color]\nZählt als [color=orange]1[/color] Effektverteiler für Überlastung.
ei-mechanical-inserter=Bewegt sich mit der Anmut eines aufgezogenen Gottes. Keine Drähte, nur Wille.\nEinfache Genialität dreht sich ewig, solange du die Rechnung nicht hinterfragst.
ei-mechanical-long-inserter=Der lange Arm thermodynamischer Verweigerung. Keine Magie, nur Gleichgewicht.\nÜberbrückt Distanzen in höflichem Trotz gegen die Entropie.
zeus-wrath-zeus-turret_alt=Die Poseidon-Anlage, keinem Land verankert und keinem Gott verpflichtet, kanalisiert die vergessene Ladung unter allen Meeren. Sie ruft Himmelsfeuer aus dem Orbit. Nach ihrer Platzierung [font=default-bold]warnt[/font] sie die Welt: Ein Sturm hält Wache.
ei-cargo-bot=Monumental. Stoisch. Trägt das Rückgrat der Fabrik.\nBewegt sich, als dürfte es niemals stillstehen.
ei-construction-bot=Präzise. Kinetisch. Erreicht die Baustelle vor dem Signalverfall.\nDurchbohrt die Wirklichkeit mit Struktur.
ei-advanced-logistic-bot=Lautlos. Weitreichend. Schneller als der Gedanke.\nDurchquert ungeahnte Distanzen und kehrt beladen zurück.
ei-advanced-construction-bot=Ein Gedächtnismotor.\nEntwürfe werden in die Existenz erinnert.
nuclear-reactor=Erzeugt Wärme aus Uranbrennstäben oder Brennelementen. Benachbarte Reaktoren erhöhen die Wärmeausgabe NICHT.
ei-crystal-accumulator=Der Kristall strahlt Energie ab. Dauerbetrieb lässt ihn instabil bleiben; Abbau hinterlässt meist eine zerbrochene Hülle. Auswählen oder Öffnen zeigt Resonanzwerte.
ei-crystal-accumulator-gaia=Der Kristall strahlt Energie ab. Gaia hat ihn in einer stabilen Hülle gebunden. Auswählen oder Öffnen zeigt Resonanzwerte.
ei-auric-fumarole=Ein Vulcanus-Schlot mit bereits in überhitztem Dampf und Sole gelöstem Gold. Ein Karbid-Fällungskern weckt den Schlund, bindet Schmutz und hinterlässt aurische Schlacke, bevor sich die Ader wieder schließt.

[fluid-description]
ei-auric-vapor=Überhitzter Dampf mit gelöstem Gold und mineralischen Spuren. Filtern durch einen Karbid-Fällungskern liefert wärmereichen Dampf und die in der Kruste verborgene aurische Schlacke.
ei-computing-power-chemical=Simulationsdaten aus Wahrnehmungsstörungen durch Rückstände. Subjektiver Widerspruch wird in semiotischen Wellenformen kodiert und dient der Modellierung materiell ungebundener Geister.
ei-computing-power-organic=Daten sterbender realer oder künstlicher Biosphären, die in rekursiven Lebens-Tod-Schleifen kollabieren. Entropiespiegelnde Ergebnisse dienen extremer Planetenmodellierung und postbiologischer Terraformung.
ei-computing-power-stone=Der Simulator gewinnt Wert aus der Weigerung des Erzes, sich korrekt zu verhalten. Verzerrte Dichte, umgekehrte Trägheitsströme und unmögliche Bahnen dienen Überlichtbarrieren und Physikmodellen vor dem Urknall.
ei-computing-power-uranium=Die Geisterhülle injiziert beim Simulieren kosmologische Todesphasen: zerfallende Sternkerne, gescheiterte Entropieumkehr und vorzeitig in sich gefaltete Universen werden zu Daten.
ei-computing-power-petrified=Aus belasteten Paradoxien gewonnen. Das Fossil faltet Simulationen über frühere Durchläufe und erzeugt rekursive Fehlervektoren. Die vereinten gescheiterten Zukünfte und Kollapssignaturen dienen Kollapsvorhersage und stabilen Paradoxien.
ei-computing-power-scrap=Falsche Übertragungen aus unerreichbaren Zukünften, anderen Zeitlinien oder toten Zivilisationen. Der Simulator zerbricht beim Entschlüsseln; seine Fehler werden zu messbarem Bitkollaps und Rohdaten für bewaffnete Informationstheorie.

