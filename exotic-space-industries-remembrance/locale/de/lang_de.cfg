[item-description]
ei-emerald-apocalypse-hover-tank=Eine schwebende Reliktfestung mit starrer Kristallkanone und einem Herzen, das den Boden verweigert. Ihr Vormarsch ist Druck; zurück bleibt smaragdgrüne Stille, wo einst Gewissheit stand.
ei-emerald-apocalypse-cannon=Eine starr im Rumpf montierte Kristallstrahlkanone. Sie führt nicht nach. Sie richtet über das, worauf der Panzer zeigt.
ei-emerald-apocalypse-charge=Ein versiegelter Kristallbruch für die Kanone der Smaragdapokalypse. Ein Eid, eine Entladung, eine grüne Wunde in der Welt.
ei-exotic-magazine-body=Die Hülle vor der Doktrin. Stahl, Keramik und genug Disziplin, um kostspielige Gewalt zu tragen.
ei-exotic-magazine-driver=Zündung, Impulstakt und Auslösesteuerung der exotischen Baureihe. Lehrt das Magazin, richtig zu sterben.
ei-exotic-magazine-core=Das gemeinsame Herz der exotischen Baureihe: Hülle, Treiber und gebändigte Sprengkraft in einer Kammer.
ei-magazine-payload-compound=Kristallisierte Energie und Sprengstoff, zu einer hybriden Antwort abgestimmt. Ein Schuss, mehrere Urteile.
ei-magazine-payload-corrosive=Eine salpetrige Wunde, versiegelt zur Nutzlast. Das Geschoss hält an; das Argument breitet sich weiter aus.
ei-magazine-payload-cryo=Gebändigter Kryostaub. Er verletzt vor allem, indem er Bewegung und Gewissheit entzieht.
ei-magazine-payload-oxyfluoride=Ein weißglühendes Paket hypergolischer Chemie. Zu hell, zu instabil, genau wie vorgesehen.
ei-magazine-payload-morphium=Konzentriertes Morphium, zur ballistischen Nutzlast überredet. Es dringt als Verunreinigung ein, nicht als Gift.
ei-magazine-payload-hexafluoride=Eine fluorierte Kammer für eine Wunde, die erst durchschlägt und dann mit dem Verfall verhandelt.
ei-magazine-payload-arc=Überladung in Geschossform. Kurz, brutal, unmissverständlich.
ei-magazine-payload-neutron=Ein geladener Neutronenbehälter, zur Doktrin verdichtet. Etwas Unsichtbares bleibt zurück und vollendet die Arbeit.
ei-compound-ammo=Die erste Ketzerei der exotischen Baureihe. Bruch, Entladung und Destabilisierung in einem teuren Magazin.
ei-corrosive-ammo=Ein säuregeladenes exotisches Magazin. Der erste Treffer stellt nur vor; die Korrosion spricht das Urteil.
ei-cryo-ammo=Kalte Kontrollgeschosse. Überleben bedeutet wenig, wenn nichts mehr die Distanz überwinden kann.
ei-oxyfluoride-ammo=Ein weißbrennendes Magazin, das jeden Einschlag zur chemischen Erlaubnis macht.
ei-morphium-ammo=Langsame Kontaminationsgeschosse. Sie verwunden den Körper und überlassen dem Grauen die letzte Rechnung.
ei-hexafluoride-ammo=Fluorierte Durchschlagsgeschosse. Sauber beim Eintritt, danach schwerer zu erklären.
ei-arc-ammo=Das Überladungsmagazin. Es trifft nicht bloß; es zwingt das Ziel in einen Krampf.
ei-neutron-ammo=Das teuerste Siechtum der Baureihe. Der Einschlag vergeht. Der Strahlenkranz bleibt.
rocket=Die erste Antwort der Baureihe. Rumpf, einfacher Antrieb, Aufschlagsgefechtskopf. Sie trifft ohne Schauspiel ein.
explosive-rocket=Die Durchbruchsvariante. Gebaut, um Mauern, Ansammlungen und Zuversicht aufzubrechen.
ei-rocket-airframe=Die Hülle vor der Doktrin. Sie hält das Versprechen nach vorn gerichtet.
ei-rocket-motor-basic=Grundschub für gewöhnliche Reichweite. Stabil genug zum Zielen. Brutal genug, um zu zählen.
ei-rocket-motor-high-energy=Heißerer Schub für schwerere Versprechen. Die Hülle protestiert; das Ziel versteht trotzdem.
ei-rocket-warhead-impact=Masse, zur Verweigerung geordnet. Sie blüht nicht auf und friert nicht ein. Sie schlägt zu.
ei-rocket-warhead-explosive=Sprengkraft in Doktrinform. Sie schafft Raum, indem sie Materie zum Weichen zwingt.
ei-rocket-warhead-siege=Belagerungsdoktrin, in Stahl gegossen. Was Dicke verbirgt, soll sie freilegen.
ei-rocket-warhead-corrosive=Säure unter ritueller Disziplin, bis der Einschlag sie freigibt.
ei-rocket-warhead-cryo=Versiegelter Kryostaub. Er verletzt, indem er zuerst Bewegung raubt.
ei-rocket-warhead-atomic-u235=U-235 in Blei und Keramik. Eine eng begrenzte Spaltungswunde.
ei-rocket-warhead-atomic-plutonium=Plutonium um ein schwereres Versprechen. Einmal ausgesprochen, kaum zu entschuldigen.
ei-corrosive-rocket=Eine salpetrige Wunde im Raketenkörper. Der erste Schlag beißt; die Wolke streitet weiter mit den Trümmern.
ei-cryo-rocket=Der Kontrollzweig. Kälteschock, starke Verlangsamung und ein langer Moment, in dem Flucht zur Theorie wird.
atomic-bomb=Plutonium-Atomrakete. Außen eine Kompatibilitätshülle, innen die volle Durchbruchsdoktrin. Der Bruch spricht zuerst; der Fallout beendet den Satz.
ei-atomic-bomb-u235=U-235-Atomrakete. Enger im Kern, mit saubererer Strahlenspur, die dennoch keine Gnade kennt.
ei-atomic-bomb-plutonium=Plutonium-Atomrakete. Breiterer Fallout, schmutzigere Folgen, derselbe Wille zum Bruch.
dw-deer-turret=Ein Artilleriegestell mit festem Feuerkegel für modulare Raketen. Belohnt Winkel, Entfernung und Nervenstärke.
dw-deer-ammo-basic=Belagerungsartillerierakete. Umständlich zu zielen. Ehrlich im Abbruch.
dw-deer-ammo-basic-crate=Verpackte Belagerungsartillerierakete. Logistik um einen aufopfernden Rückstoß.
dw-deer-ammo-corrosive=Korrosive Artillerierakete. Dieselbe Säurefamilie, vergrößert, bis Bauwerke Furcht lernen.
dw-deer-ammo-corrosive-crate=Verpackte korrosive Artillerierakete. Salpetersaure Verweigerung in Großgebinden.
dw-deer-ammo-cryo=Kryo-Artillerierakete. Sie landet wie ein Winter mit Vollmacht.
dw-deer-ammo-cryo-crate=Verpackte Kryo-Artillerierakete. Kontrolle, verpackt für Stellungsfeuer.
dw-deer-ammo-atomic-u235=U-235-Atomartillerierakete. Ein enger Atomkern für das Gestell, mit Fallout nahe am Krater.
dw-deer-ammo-atomic-u235-crate=Verpackte U-235-Atomartillerierakete. Selbst die Kiste wirkt anklagend.
dw-deer-ammo-atomic-plutonium=Plutonium-Atomartillerierakete. Volle Durchbruchssprache für eine Stellung, die sie aus nächster Nähe hören will, und breiterer Fallout als Antwort.
ei-nuclear-locomotive=X1 „Goliath“-Atomlokomotive. Ein rollender Kompaktreaktor mit den Umgangsformen eines Kriegsverbrechens. Bricht der Rumpf, ist der grüne Blitz nur die Ankündigung; der Fallout beendet den Satz.
dw-deer-ammo-atomic-plutonium-crate=Verpackte Plutonium-Atomartillerierakete. Eine Transportlösung für Menschen, die Vorsicht nicht mehr mit Tugend verwechseln.
ei-carbide-precipitation-core=Ein Keimkern aus Wolframkarbid stabilisiert die Goldabscheidung. Er wird bewusst verbraucht: Dampf weckt die Fumarole, der Kern hält die Engstelle, und der Reiniger bewahrt, was der Dampf abgibt.
ei-calcite-bed=Ein verbrauchbares Kalzitfüllbett für heiße Mineralströme. Frischer Stein vergrößert die Reaktionsfläche, stabilisiert die Chemie und muss regelmäßig ersetzt werden.
ei-auric-slag=Goldhaltige Schlacke, aus aurischem Dampf abgeschieden. Voller Hitze, Körner und eingeschlossener Metallspuren; Säurewäsche und Wasser lösen das verborgene Gold heraus.
ei-breach-residue=Eine Kruste dimensionaler Verunreinigung durch wiederholte Tornutzung.\nDieser Bruchrückstand ist kein nützlicher Rohstoff. Neutralisiere ihn über die Reinigungskette zu Schmutzwasser, bevor er sich ausbreitet.
ei-orbital-combinator=Spiegelt die Plattformlogistik derselben Oberfläche in drei Nur-Lese-Modi: Anfragen, Unterwegs und Bedarf.\nOrthogonal benachbarte Scanner bilden eine gemeinsame Bank, teilen große Plattformausgaben auf Fortsetzungsabschnitte auf und senden [virtual-signal=ei-orbital-overflow], wenn die Bankkapazität erschöpft ist.\nHinweise zu Verkabelung, Aktualität und Nutzung stehen im Informatron unter Neue Logistik.
ei-platform-transponder=Gibt einer Plattform eine stabile parteiinterne Nummer, damit Selektoren, Koordinatoren und Versanduplinks sie unabhängig vom Namen ansteuern können.\nAuf der Plattform selbst platzieren. Manuelle IDs sind erlaubt; widersprüchliche IDs bleiben bis zur Auflösung ungültig.\nÖffne den Transponder direkt, um eine manuelle Plattform-ID zu setzen oder zu löschen.
ei-orbital-selector=Wählt jeweils eine Plattform aus und gibt deren aktuelle Bedarfsliste weiter.\nManuell wird eine Plattform-ID festgelegt; der Schaltungsmodus liest [virtual-signal=ei-platform-id]; der Regelmodus wählt automatisch nach aktuellem Orbitalbedarf derselben Oberfläche.\nÖffne den Selektor direkt, um Modus und Ziel zu wählen. Neue Selektoren bleiben bis zur Konfiguration untätig.
ei-orbital-coordinator=Die oberflächenseitige Steuerzentrale des Orbitalverbunds.\nJe Partei und Oberfläche ist nur ein Koordinator aktiv. Er verteilt Selektoraufträge und Versandzuteilungen und verhindert, dass mehrere Uplinks blind dasselbe Ziel beliefern.\nÖffne den Koordinator direkt, um Aktiv- oder Bereitschaftszustand zu prüfen und eine Verbundaktualisierung anzufordern.
ei-orbital-dispatch-uplink=Bindet ein nahes Raketensilo an den Orbitalverbund.\nEin Uplink hält jeweils einen zugeteilten Auftrag mit gemischter Frachtliste, gibt die Zielliste zur hybriden Beladung weiter und behält oder löst übergroße Aufträge gemäß den Modi Dauerhaft, Einzelschuss oder Schwelle.\nEr bleibt gesperrt, bis eine gültige Silobindung, ein aktiver Koordinator und ein Selektorauftrag mit positivem Bedarf vorliegen.\nÖffne den Uplink direkt, um seine Silobindung zu bestätigen, zu ersetzen oder zu löschen.
ei-gatling-turret=Benötigt Elektrizität und Munition.
ei-auto-shotgun-turret=Ein kompakter motorgetriebener Doppellaufturm für kurze, hässliche Distanzen. Er verbraucht Schrotpatronen mit hoher Feuerrate und füllt Korridore und Engstellen mit vernichtenden Streumustern. Schneller Zielwechsel, aggressive Verfolgung und Rückstoßausgleich benötigen [color=cyan]Elektrizität[/color]. Wer näherkommt, trifft auf unablässigen Schrothagel.
ei-steampunk-lamp=Eine einfache Verbrennungslampe mit [color=green]Kerosin[/color][fluid=ei-kerosene].\nSpendet [color=orange]warmes[/color], flackerndes Licht ohne Strom, verbraucht dafür aber ständig Brennstoff.
ei-dragons-breath-shotgun-shell=In Vulcanus' Hitze geschmiedet, wo Munition wie Stahl gehärtet und Gewalt industriell gefertigt wird.\nDiese Patronen tragen lebendige Flammenmuster und extreme thermische Last in jeden Schuss.\nIhre Ladung bleibt selbst in Asche, Trümmern und Vakuum kohärent, wo gewöhnliche Ballistik versagt.\nFreigeschaltet durch Vulkanmetallurgie und Lavaschmiedetechnik, verkörpert sie eine einfache Wahrheit:\nWas die Hitze überlebt, ist zum Verschießen bestimmt.
ei-uranium-shotgun-shell=Uran-238-Penetratoren in Schrotpatronen. Jeder Schuss schleudert ein grellgrünes Muster dichter Pellets: keine Flamme, keine Wolke, nur Strahlungsdruck auf kurze Distanz und die harte Rechnung des Aufpralls.
ei-shotgun-turret=Wenn Entfernung versagt, antwortet dies.\nEin Nahbereichsschutz, der weder warnt noch verfehlt noch zögert.\nWer ihn erreicht, hat seinen Fehler bereits begangen.
ei-tough-wall=Keramik und Beton, durch Stahlträger gestützt. Schwer, stumpf und erbarmungslos; sie widersteht durch schiere Dichte.
ei-plated-wall=Bleigebundener Stahlbeton mit synthetischen Polymerschichten. Zäher, dichter und weniger spröde als die Vorgänger: ein Bollwerk gegen die Entropie selbst.
ei-sanguine-wall=Eine Hülle aus sonderbaren Platten über einem Plastbetonwall. Schwarze Rippen halten die Linie, rotes Harz härtet in den Fugen. Sie heilt nicht, doch sie erinnert sich an den ersten Bruch.
ei-hemocrystal-wall=Saubere Panzerplatten in einem lebenden Hämokristallgitter. Unter eigenem rotem Druck schließt die Mauer leichte Wunden; jeder Treffer wird zum erneuten Eid der Geschlossenheit.
ei-cannon-turret-mk1=Einfach gebohrter Lauf, rohe Feuerkraft ohne Verfeinerung.
ei-cannon-turret=Zwei Läufe, ein Chassis. Doppelter Durchsatz, doppelter Lärm.\n[color=gray]Schnellfeuermechanik und fortschrittliche Zielsteuerung benötigen[/color] [color=cyan]Elektrizität[/color] [color=gray]zum Betrieb.[/color]
ei-acidthrower-turret=Warum kostbares Öl verbrennen, wenn Feinde bis auf die Knochen aufgelöst werden können? Dieser groteske Verwandte des Flammenwerfers setzt [color=green]Säure[/color] unter Druck, bis sie aus der Düse schreit. Der ätzende Nebel korrodiert Bauwerke und löst Panzer auf. Schaufle die Reste weg, bevor sie auch die Schaufel fressen.
ei-camp-fire=Kaum ein Leuchtfeuer, eher eine eigensinnige Kerze. Dieses Lagerfeuer spendet Licht durch bloße Beharrlichkeit: Es verbrennt, was du ihm gibst, und verlangt höflich mehr.
ei-warp-beacon=[color=purple]Bei aktivierter Effektverteilerüberlastung ausgenommen.[/color]\n[color=gray]Benötigt 60[item=ei-bio-matter]/s zum Betrieb.[/color]
ei-alien-beacon=[color=purple]Bei aktivierter Effektverteilerüberlastung ausgenommen.[/color]\n[color=gray]Benötigt 30[item=ei-bio-matter]/s zum Betrieb.[/color]
ei-high-tech-parts=Diese Bauteile entstehen ausschließlich im [color=red]instabilen Kern[/color] der [color=blue]exotischen Montagemaschine[/color]. Quantengebundene Legierungen, wahrscheinlichkeitsleitende Fasern und resonante Kerne widersetzen sich der klassischen Physik.\nIhre Herstellung ist gefährlich, doch Hightech-Bauteile sind für Relikttechnologie unverzichtbar und treiben die Zivilisation über ihre Grenzen hinaus.
ei-computing-unit=Die Recheneinheit ist ein kompakter KI-Kern für fortschrittliche Technik des Quantenzeitalters. Präzisionsschaltungen und polierte Legierung vereinen klassische Logik mit Quantenverschränkung. Leuchtende Augen und ein stilles Lächeln begleiten Navigation im tiefen Weltraum und Fertigungslabore der nächsten Generation.
ei-burner-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-steam-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-electric-quarry=Ein Abbaukomplex extremer Kapazität: maximaler Durchsatz und Ertrag auf Kosten örtlicher Verschmutzung. Verbraucht gewaltige Energie und hinterlässt großflächige Abbaunarben. Gewährt [color=gray]54% zusätzlichen Ressourcenertrag[/color] und leert Vorkommen mit rücksichtsloser Geschwindigkeit.
ei-space-science-pack=Ein Gipfel interstellarer Energieforschung: Spaltbares Uran, Plutonium und Thorium werden durch Blei, Kohlenstoff und Eis stabilisiert. Jeder Stab erschließt kosmische Reaktionen an der Schneide der Kritikalität.
ei-nuclear-fuel=Brennstoffzelle auf Uran-235-Basis. Ineffizient in Reaktoren, hervorragend für Fahrzeuge.
ei-depleted-uranium-fuel-cell=Verbrauchte Brennstoffzelle auf Uran-235-Basis
ei-beacon=Einst Gipfel synchroner Feldprojektion, trägt dieser Effektverteiler heute die Last seines Erbes. Sein grobes Gitter und veraltete Phasenharmonik senden weiter in eine Welt, die kaum noch hört.\nGebaut, als Durchsatz ein Gott war, ist er mehr Artefakt als Werkzeug. Sein Kern hält Kohärenz nur knapp vor dem Zusammenbruch.\nDoch er zählt. Er erinnert sich. Auch seine Last zählt zur Überlastung.\n[color=gray]„Geister der Effizienz verfolgen selbst rostige Gerüste.“[/color]\nZählt als [color=orange]1[/color] Effektverteiler für Überlastung.
ei-neuro-reactive-residue=Ein zäher, durchscheinender Schleim, dessen Farbe vom Betrachter abhängt. Vermutlich verdichtete Ausscheidungen einer ausgestorbenen chemischen Intelligenz. Bringt unberechenbare Chaosfaktoren in Simulationen und liefert Daten über entstehende Komplexität und xenochemisches Leben.
ei-sporeglass-heart=Ein stacheliger Kristallsamen, der auf Herzschlag reagiert. Ruhende RNA-Muster ahmen ausgestorbene außerirdische Neuroflora nach. In Simulationen entstehen falsche Ökosysteme, die zu schwarzen Löchern kollabieren. Liefert als Ganzes integrierbare Daten.
ei-gravity-braided-ore=Ein zu fraktalen Knoten verdrehtes Mineral, offenbar in einer Mikrogravitationszone mit nichtlinearem Zeitfluss entstanden. Zerquetscht Messwerkzeuge. Prägt Simulationen nichteuklidische Dichtefelder auf und liefert Daten zu Gravitationslinsen und topologischem Fluss.
ei-isotopic-ghost-shell=Eine hohle Kapsel zerfallener Spaltmaterie, die noch kalte Neutrinos aussendet. Bei jeder zweiten Messung ist ihre Masse negativ. Vielleicht ein gescheiterter Versuch umgekehrter Entropie. Destabilisiert simulierte Universen an der Wärmetodschwelle und katalysiert Datenkollapse.
ei-chrono-fossil-shard=Ein versteinerter, womöglich konstruierter Knochenrest mit tachyonischen Spuren. Im Vakuum ist sein Atmen hörbar. Zwingt Simulationen in Schleifen abweichender Zeitverläufe und liefert hochauflösende Daten historischer Kollapskaskaden.
ei-worm-torn-relay-core=Ein verformtes, korrodiertes Stück einer aufgegebenen Überlicht-Kommunikationsboje. Zitternder Pseudocode entzieht sich jedem System. Unter Strahlung pulsiert es wie ein stummer Schrei. Halbstabile Wurmlochechos treiben den Simulator in rekursive Fehlerschleifen, aus denen sich Daten gewinnen lassen.
ei-mechanical-inserter=Bewegt sich mit der Anmut eines aufgezogenen Gottes. Keine Drähte, nur Wille.\nEinfache Genialität dreht sich ewig, solange du die Rechnung nicht hinterfragst.
ei-mechanical-long-inserter=Der lange Arm thermodynamischer Verweigerung. Keine Magie, nur Gleichgewicht.\nÜberbrückt Distanzen in höflichem Trotz gegen die Entropie.
zeus-wrath-zeus-turret_alt=Die Poseidon-Anlage, keinem Land verankert und keinem Gott verpflichtet, kanalisiert die vergessene Ladung unter allen Meeren. Sie ruft Himmelsfeuer aus dem Orbit. Nach ihrer Platzierung [font=default-bold]warnt[/font] sie die Welt: Ein Sturm hält Wache.
zeus-wrath-zeus-gun_alt=Der Zorn eines ertrunkenen Gottes, verdichtet und zur Waffe gemacht. Er verfehlt nicht. Er [font=default-bold]bestraft[/font].
zeus-wrath-lightning-ammo_alt=Keine menschliche Hand sollte tragen, was hier ruht. Dieses Reliquiar ist nicht geladen; es ist [font=default-bold]eingedämmt[/font]. Feuere nur mit Absicht. Der Sturm sieht zu.
ei-cargo-bot=Ein gepanzerter Transporter, in industrieller Hitze geschmiedet.\nEr treibt mit grimmiger mechanischer Gewissheit voran, seine Motoren beißen in die Last.\nNicht für Anmut gebaut, sondern für endlose Lieferarbeit.
ei-construction-bot=Eine schnelle Baudrohne für den raschen Einsatz.\nBeschleunigung geht vor Haltbarkeit.\nSie baut schneller, als du planen kannst.\nVersuch mitzuhalten.
ei-advanced-logistic-bot=Eine Logistikdrohne der Spitzenklasse, optimiert für Tempo, Reichweite und Nutzlast.\nÜberwindet gewaltige Entfernungen mit unnatürlicher Präzision.\nTrägt mehr. Wartet weniger. Gehorcht ohne Pause.\nGebaut, um alles zu übertreffen, auch dich.
ei-advanced-construction-bot=Eine Baudrohne der nächsten Generation für großflächige Einsätze mit hoher Geschwindigkeit.\nMehr Reichweite, mehr Nutzlast, unerbittliche Ausführung.\nSie sieht die Blaupause, bevor du sie fertig platzierst.\nGebaut, um Vorstellungen sofort zu Bauwerken zu machen.

ei-excavator=Verbraucht [color=blue]Wasser[/color][fluid=water] und [color=brown]4.2/s Bohrflüssigkeit[/color][fluid=ei-drill-fluid] und erzeugt [color=orange]Stein[/color][item=stone], [color=brown]Schmutzwasser[/color][fluid=ei-dirty-water] sowie planetenspezifische Nebenprodukte.
ei-metalworks-1=Verarbeitet [color=orange]Barren[/color] schnell mit +10% Produktivität, höherer Umweltverschmutzung und höherem Energieverbrauch. Nimmt 1 [color=blue]Geschwindigkeitsmodul[/color] oder [color=gray]Qualitätsmodul[/color] auf.
ei-metalworks-2=Verarbeitet [color=orange]Barren[/color] schnell mit +20% Produktivität, höherer Umweltverschmutzung und höherem Energieverbrauch. Nimmt 2 [color=blue]Geschwindigkeitsmodule[/color] oder [color=gray]Qualitätsmodule[/color] auf.
ei-metalworks-3=Verarbeitet [color=orange]Barren[/color] schnell mit +30% Produktivität, höherer Umweltverschmutzung und höherem Energieverbrauch. Nimmt 3 [color=blue]Geschwindigkeitsmodule[/color] oder [color=gray]Qualitätsmodule[/color] auf.
ei-metalworks-4=Verarbeitet [color=orange]Barren[/color] schnell mit +40% Produktivität, höherer Umweltverschmutzung und höherem Energieverbrauch. Nimmt 4 [color=blue]Geschwindigkeitsmodule[/color] oder [color=gray]Qualitätsmodule[/color] auf.
ei-fluid-heater=Erzeugt Wärme durch Verbrennen von:
ei-fluid-boiler=Erzeugt Dampf durch Verbrennen von:
ei-tank-1=Besseres Verhältnis von Speichervolumen zu Eisenbedarf als der Flüssigkeitstank. 1000 Trefferpunkte, 30% physischer Widerstand, 60% [color=red]Feuerwiderstand[/color], 60% Aufprallwiderstand.
ei-tank-3=Überlegenes Verhältnis von Speichervolumen zu Eisenbedarf als der Flüssigkeitstank. 1500 Trefferpunkte, 40% physischer Widerstand, 70% [color=red]Feuerwiderstand[/color], 70% Aufprallwiderstand.
ei-tank-2=Außergewöhnliches Verhältnis von Speichervolumen zu Eisenbedarf als der Flüssigkeitstank. 2000 Trefferpunkte, 60% physischer Widerstand, 80% [color=red]Feuerwiderstand[/color], 78% Aufprallwiderstand.
ei-insulated-pipe=Das isolierte Rohr benötigt keine Heizung gegen Einfrieren. Es transportiert [color=pink]Elektrolyte[/color], [color=green]Fluorketone[/color], [color=red]sehr heiße Fluide (überhitzte Plasmagase, Lava)[/color] und [color=blue]kalte Fluide (Flüssiggase)[/color], die gewöhnliche Rohre beschädigen würden.
ei-insulated-underground-pipe=Das isolierte Rohr benötigt keine Heizung gegen Einfrieren. Es transportiert [color=pink]Elektrolyte[/color], [color=green]Fluorketone[/color], [color=red]sehr heiße Fluide (überhitzte Plasmagase, Lava)[/color] und [color=blue]kalte Fluide (Flüssiggase)[/color], die gewöhnliche Rohre beschädigen würden.
ei-insulated-tank=Der isolierte Tank benötigt keine Heizung gegen Einfrieren. Er speichert [color=pink]Elektrolyte[/color], [color=green]Fluorketone[/color], [color=red]sehr heiße Fluide (überhitzte Plasmagase, Lava)[/color] und [color=blue]kalte Fluide (Flüssiggase)[/color], die gewöhnliche Tanks beschädigen würden.
ei-cooler=Ein Hyperkühler, der Gase verflüssigt. Verwende [color=blue]isolierte Rohre[/color] [item=ei-insulated-pipe] zum Transport der Flüssiggase.
ei-data-pipe=Ein spezielles Datenkabel für [color=blue]Simulationssubstrate[/color] [fluid=ei-computing-power].
ei-stone-quarry=Dieser Steinbruchbohrer kann überall [color=orange]Stein[/color] [item=stone] abbauen.
ei-electric-stone-quarry=Dieser Steinbruchbohrer kann überall [color=orange]Stein[/color] [item=stone] abbauen.
ei-deep-drill=Dieser Bohrer erschließt Erzadern. Benötigt [color=orange]4.2/s Bohrflüssigkeit[/color] [fluid=ei-drill-fluid].
ei-advanced-drill=Dieser Bohrer erschließt Erzadern. Benötigt [color=orange]2/s Bohrflüssigkeit[/color] [fluid=ei-drill-fluid].
ei-deep-pumpjack=Eine verbesserte Rohöl-Förderpumpe. Erschließt auch [color=blue]Kryoflux[/color][fluid=ei-cryoflux], [color=green]Phytogas[/color][fluid=ei-phythogas] und aurische Fumarolen.
ei-exotic-assembler=Diese Montagemaschine fertigt [color=orange]exotische Gegenstände[/color]. Da exotische Materie instabil ist, sollten [color=blue]Materiestabilisatoren[/color] in der Nähe stehen, um die Explosionsgefahr zu senken. [color=gray]Im Betrieb pulsiert, knistert und funkt das Eindämmungsfeld stärker, je höher das Risiko ist. Die Instabilitätswahrscheinlichkeit pro Sekunde beträgt 12% - (Qualität - 1)% und lässt sich durch umgebende Materiestabilisatoren verringern.[/color]
ei-computer-core=Ein grundlegender Logiktiegel. Benötigt [color=255,255,255]Strom[/color] und präzise angeordnete [item=electronic-circuit], um [color=blue]Simulationssubstrate[/color] [fluid=ei-computing-power] zu erzeugen. Dieses Fluid ist verdichteter Zeichendruck aus Anomalien, die für organisches Denken zu instabil sind. Leite es mit einem [color=orange]Datenkabel[/color] [item=ei-data-pipe] in [entity=ei-small-simulator].\nDer Computerkern verschlingt xenochemische Rückstände und Zeitfossilien. Er entschlüsselt diese Relikte durch opfernde Zerlegung und zersplittert sich in winzigen Wiederholungen, um Verständnis anzunähern.\nJede Anomalie verändert das Substrat: rekursive Turbulenz, Gravitationsverzerrung oder Kollapssignaturen fließen in die Daten. Je unmöglicher das Objekt, desto wertvoller sein Wahnsinn.
ei-quantum-computer=Ein hochentwickelter Computer. Verarbeitet verschiedene Eingaben zu Hightech-Daten.
ei-matter-stabilizer=Ein künstlicher Materiestabilisator. Stabilisiert [color=orange]exotische Montagemaschinen[/color] [item=ei-exotic-assembler] und verringert die Wahrscheinlichkeit einer Entropiekaskade. [color=gray]Höhere Qualität zählt als 3 x (Qualität - 1) Stabilisatoren gegen Instabilität. Belastete Gitter zeigen sichtbares Knistern und Lichtbögen.[/color]
ei-copper-beacon=Ein mit [color=cyan]flüssigem Stickstoff gekühltes[/color] Signalrelais. Überträgt stabilisierte Produktivitätssignale bei kryogenen Temperaturen. Benötigt grundlegend [color=blue]5/s flüssigen Stickstoff[/color] [fluid=ei-liquid-nitrogen] für kohärente Übertragungsmatrizen.\nBei aktivierter Effektverteiler-Überlastung zählt es als [color=orange]1[/color] Effektverteiler.\n[color=gray]Die teilweise thermische Unterdrückung verhindert Dekohärenz und erhält die Signalqualität. Ideal für frühe Kryo-Infrastruktur.[/color]
ei-iron-beacon=Ein [color=cyan]tiefgekühltes fortschrittliches Effektverteilerfeld[/color] nahe dem absoluten Nullpunkt für vollständige Resonanz in supraleitenden Ebenen. Benötigt grundlegend [color=blue]10/s flüssigen Stickstoff[/color] [fluid=ei-liquid-nitrogen] für seinen Tiefphasenkern.\nBei aktivierter Effektverteiler-Überlastung zählt es als [color=orange]2[/color] Effektverteiler.\n[color=gray]Knapp oberhalb des Kollapspunkts bekannter Materie überträgt es phasenstabile Produktivitätsfelder ohne thermische Drift. Unverzichtbar für dichte, hocheffiziente Anlagen.[/color]
ei-induction-matrix-core=Kern der mehrteiligen Induktionsmatrix. Pro Matrix ist nur ein Kern erlaubt.
ei-induction-matrix-core-circuit-interface=Kern der mehrteiligen Induktionsmatrix. Pro Matrix ist nur ein Kern erlaubt. Einstellbare Schaltungsausgaben: gespeicherte Energie und Kapazität (MJ), maximale Übertragung (MW) und Ladestand (%). Voreingestellte Signale: C/T/M/A. Standardmäßig sind alle Ausgaben deaktiviert. Die Messwerte werden einmal pro Sekunde aktualisiert. Änderungen an den Schaltungseinstellungen gelten sofort.
ei-induction-matrix-basic-coil=Einfache Spule der Induktionsmatrix. Erhöht ihre Energiekapazität um [color=yellow]25 MJ[/color].
ei-induction-matrix-advanced-coil=Fortschrittliche Spule der Induktionsmatrix. Erhöht ihre Energiekapazität um [color=yellow]100 MJ[/color].
ei-induction-matrix-superior-coil=Überlegene Spule der Induktionsmatrix. Erhöht ihre Energiekapazität um [color=yellow]1000 MJ[/color].
ei-induction-matrix-basic-converter=Einfacher Wandler der Induktionsmatrix. Erhöht ihre Energieübertragungsrate.
ei-induction-matrix-advanced-converter=Fortschrittlicher Wandler der Induktionsmatrix. Erhöht ihre Energieübertragungsrate. Zählt als [color=orange]2[/color] einfache Wandler.
ei-induction-matrix-superior-converter=Überlegener Wandler der Induktionsmatrix. Erhöht ihre Energieübertragungsrate. Höchstens 4 werden unterstützt. Zählt als [color=orange]4[/color] einfache Wandler.
ei-induction-matrix-basic-solenoid=Solenoid der Induktionsmatrix. Erhöht die Spuleneffizienz, wenn er in Reihe neben Spulen steht. Zu viele Solenoide können jedoch die Energiekapazität der Matrix verringern.
ei-induction-matrix-advanced-solenoid=Fortschrittlicher Solenoid der Induktionsmatrix. Erhöht die Spuleneffizienz in benachbarten Reihen und kostet einzeln weniger Kapazität als der einfache Solenoid. Zu viele Solenoide können dennoch die Energiekapazität verringern.
ei-fission-facility=Gewinne Spaltungsdaten, um Kernspaltungsreaktoren zu entwickeln.
ei-high-temperature-reactor=Benötigt [color=red]Wärme[/color] anderer Reaktoren. Überhitzt [color=gray]flüssiges Blei als Kühlmittel[/color] und kann auch Brennstoff auf [color=orange]Thoriumbasis[/color] [item=ei-thorium-232] nutzen. Mit einem [color=green]Uran-235-Brennstab[/color] [item=ei-uranium-235-fuel] erzeugt die Maschine ungefähr 500MW Leistung.
ei-castor=Lagere deinen schmutzigen [color=yellow]Atommüll[/color] [item=ei-nuclear-waste] hier.
ei-neutron-collector=Absorbiert freie Neutronen naher Spaltungsquellen, schwache Leckstrahlung aus Aquilos Dichtplasmafusion und stärkere Strahlung aus ESIR-Kernfusionsreaktoren. Lädt [color=blue]Neutronenbehälter[/color] [item=ei-neutron-container] zu [item=ei-charged-neutron-container]. Quelltyp, Aktivität und Entfernung bestimmen die Effizienz; schwache oder entfernte Quellen laden langsamer.
ei-neutron-activator=Bestrahle verschiedene Elemente mit Neutronen aus [color=blue]Neutronenbehältern[/color] [item=ei-charged-neutron-container], um wertvollen Fusionsbrennstoff zu gewinnen.
ei-fusion-reactor=Ein thermonuklearer ESIR-Fusionsreaktor. Verbrennt erhitzte leichte Atombrennstoffe in einem Bleikühlkreislauf und erzeugt Wärme, Leistungsschätzungen und regelbaren Neutronenfluss. Aquilos Dichtplasmareaktoren verwenden dagegen Fluorketon und Fusionsenergiezellen, um Plasma für [entity=fusion-generator] herzustellen.
ei-gauss-module=[font=default-bold]Das Gottmodul.[/font] Nutzbar in [font=default-bold]jeder Maschine, die Produktivität zulässt[/font], ohne Beschränkung auf bestimmte Rezepte.
ei-small-inserter=Ein 2x2 großer Greifarm mit Filterplätzen. Bewegt ganze Gegenstandsstapel auf einmal.
ei-big-inserter=Ein 2x2 großer Greifarm mit Filterplätzen. Bewegt ganze Gegenstandsstapel auf einmal mit hoher Geschwindigkeit.
ei-small-inserter-normal=Ein 2x2 großer Greifarm. Bewegt ganze Gegenstandsstapel auf einmal.
ei-big-inserter-normal=Ein 2x2 großer Greifarm. Bewegt ganze Gegenstandsstapel auf einmal mit hoher Geschwindigkeit.
ei-module-base=Die Grundlage eines Moduls. Dient zur Herstellung verschiedener Module.
ei-photon-cavity=Ein Hohlraum zur Speicherung von Photonen.
ei-z-boson-cavity=Ein Hohlraum zur Speicherung von Z-Bosonen.
ei-gluon-cavity=Ein Hohlraum zur Speicherung von Gluonen.
ei-destill-tower=Ein Destillationsturm, der [color=red]Wärme[/color] benötigt. Zerlegt [color=orange]Restöl[/color] [fluid=ei-residual-oil] in seine Bestandteile.
ei-advanced-destill-tower=Ein Destillationsturm, der [color=yellow]Strom[/color] benötigt. Zerlegt [color=orange]Restöl[/color] [fluid=ei-residual-oil] in seine Bestandteile.
ei-mining-satellite=Ein Satellit, der [color=orange]Planetengestein[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock] am jeweiligen Weltraumziel abbaut. Fördert stets [color=red]10.000[/color] Gestein pro Start.
ei-exploration-satellite=Ein Satellit für das Unbekannte! Schieße ihn in ferne Regionen des Alls; vielleicht findet er etwas Interessantes.
ei-rocket-silo=Starte Raketen zu verschiedenen Zielen im All. Weitere Informationen stehen im Informatron und in der Raketensilo-Oberfläche.
ei-thorium-232-fuel=Kernbrennstoff auf Thorium-232-Basis, nur für den [color=green]Hochtemperaturreaktor[/color] [item=ei-high-temperature-reactor]. Ein Brennstab überhitzt [color=orange]780 flüssiges Blei als Kühlmittel[/color] [fluid=ei-hot-coolant] in 120 Sekunden im [color=green]Hochtemperaturreaktor[/color] [item=ei-high-temperature-reactor].
ei-plutonium-239-fuel=Kernbrennstoff auf Plutonium-239-Basis. Ein Brennstab überhitzt [color=orange]1820 flüssiges Blei als Kühlmittel[/color] [fluid=ei-hot-coolant] in 120 Sekunden im [color=green]Hochtemperaturreaktor[/color] [item=ei-high-temperature-reactor].
ei-uranium-235-fuel=Kernbrennstoff auf Uran-235-Basis. Ein Brennstab überhitzt [color=orange]1560 flüssiges Blei als Kühlmittel[/color] [fluid=ei-hot-coolant] in 120 Sekunden im [color=green]Hochtemperaturreaktor[/color] [item=ei-high-temperature-reactor].
ei-uranium-233-fuel=Kernbrennstoff auf Uran-233-Basis. Ein Brennstab erzeugt [color=orange]1040 flüssiges Blei als Kühlmittel[/color] [fluid=ei-hot-coolant] in 120 Sekunden im [color=green]Hochtemperaturreaktor[/color] [item=ei-high-temperature-reactor].
ei-burner-inserter=Dieser Greifarm verbrennt Brennstoff zum Bewegen von Gegenständen. Kann [color=orange]brennbaren Treibstoff[/color] aus Maschinen entnehmen, aus denen er Gegenstände holt.
ei-oil-refinery=Eine Ölraffinerie mit [color=red]Wärmeantrieb[/color].
ei-heat-chemical-plant=Eine Chemiefabrik mit [color=red]Wärmeantrieb[/color].
ei-scanner=Ein Scanner zur Analyse außerirdischer Artefakte. Das Auswählen einer außerirdischen Lebensform oder eines Artefakts startet einen Scan und liefert [color=#d43e8e]Alien-Einheiten KU[/color].\n\n[color=red][ACHTUNG][/color] Der Scan zerstört die ausgewählte Lebensform oder das Artefakt.

ei-space-data=Verschlüsseltes Flüstern des Kosmos, Bruchstücke zerbrochener Sterne und lebendiger Zeit, kristallisiert zu Wissen, das keine einzelne Welt tragen könnte.\nGewinne [color=purple]Weltraumanomalien[/color] [item=ei-neuro-reactive-residue][item=ei-sporeglass-heart][item=ei-gravity-braided-ore][item=ei-isotopic-ghost-shell][item=ei-chrono-fossil-shard][item=ei-worm-torn-relay-core] durch Zerkleinern bestimmter Asteroiden [item=ei-chemical-asteroid-chunk][item=ei-organic-asteroid-chunk][item=ei-rock-asteroid-chunk][item=ei-uranium-asteroid-chunk][item=ei-petrified-asteroid-chunk][item=ei-scrap-asteroid-chunk]. Verarbeite sie im Computerkern [entity=ei-computer-core] zu Simulationssubstraten. Der kleine Simulator [entity=ei-small-simulator] erzeugt daraus Datenkarten [item=ei-simulation-data-chemical][item=ei-simulation-data-organic][item=ei-simulation-data-stone][item=ei-simulation-data-uranium][item=ei-simulation-data-petrified][item=ei-simulation-data-scrap]. Vereine alle im Quantenforschungscomputer [entity=ei-quantum-computer], um die Geheimnisse von Raum und Zeit zu erschließen.
ei-moon-rock=Gewonnen durch den Start eines [color=blue]Bergbausatelliten[/color] [item=ei-mining-satellite] zum [color=green]Mond[/color].
ei-mars-rock=Gewonnen durch den Start eines [color=blue]Bergbausatelliten[/color] [item=ei-mining-satellite] zum [color=green]Mars[/color].
ei-sulf-rock=Gewonnen durch den Start eines [color=blue]Bergbausatelliten[/color] [item=ei-mining-satellite] zum [color=green]Planeten Sulf[/color].
ei-uran-rock=Gewonnen durch den Start eines [color=blue]Bergbausatelliten[/color] [item=ei-mining-satellite] zum [color=green]Planeten Uran[/color].
ei-exotic-rock=Gewonnen durch den Start eines [color=blue]Bergbausatelliten[/color] [item=ei-mining-satellite] zum [color=green]Asteroiden[/color].
ei-black-hole-data=Nicht vorrätig.

ei-holo-asteroid=Eine dekorative Holoanzeige.
ei-holo-gas-giant=Eine dekorative Holoanzeige.
ei-holo-moon=Eine dekorative Holoanzeige.
ei-holo-mars=Eine dekorative Holoanzeige.
