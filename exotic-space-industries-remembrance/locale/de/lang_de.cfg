[mod-setting-description]
ei-enable-preliminary-k2so-patch=Lässt die noch in Entwicklung befindliche Kompatibilitätsschicht für Krastorio2 Spaced Out standardmäßig ruhen. Nur aktivieren, wenn du die vorläufigen Anpassungen ausdrücklich testen möchtest.
ei-fulgora-day-length-variation-max-multiplier=Maximaler Multiplikator für Fulgoras schwankende Tageslänge. Zu Beginn jedes Tages wird die Tageslänge mit einem Zufallswert zwischen Minimum und Maximum multipliziert. Ein höheres Maximum erlaubt längere, ein niedrigeres kürzere Tage.
ei-fulgora-day-length-variation-min-multiplier=Minimaler Multiplikator für Fulgoras schwankende Tageslänge. Zu Beginn jedes Tages wird die Tageslänge mit einem Zufallswert zwischen Minimum und Maximum multipliziert. Ein höheres Minimum erhöht, ein niedrigeres senkt die kürzestmögliche Tageslänge.
ei-rocket-launch-pollution-cap=Umweltverschmutzung eines Raketenstarts bei Evolutionsfaktor 1.0.
ei-rocket-launch-pollution-mode=linear -> vorhersehbarer, gleichmäßiger Anstieg mit der Evolution\nquadratisch -> sanfter Beginn, stärkerer Anstieg im späten Spiel\nexponentiell -> sehr sanfter Beginn, steile späte Spitze\nSchwelle -> stufenweise Sprünge an Evolutionsgrenzen\nhybrid -> lineare Grundlage + zusätzlicher später Bonus
ei-rocket-launch-pollution-visual-style=Hybrid beginnt mit einer reduzierten Bodenabgaswolke, die beim Einsetzen der aufsteigenden Abgasfahne ausläuft. Nur aufsteigende Abgasfahne lässt das Bodenabgas weg. Filmisch behält das volle Bodenabgas bis zur Übernahme durch die Fahne. Nur Bodenabgas erhält den Bodenrauch ohne senkrechte Fahne.
ei-check-for-recipe-icons-improvement-mod=Prüft beim Laden/Wiedereinstieg auf das [color=red]SEHR EMPFOHLENE[/color] Recipe Icons Improvement for Exotic Space Industries Remembrance von [color=orange]NaK1119[/color].\nSortiert Rezepte, Gegenstände und Flüssigkeiten und verbessert ihre Symbole für bessere Erkennbarkeit.\nFunktionen:\nÜberarbeitet Gruppierung und Reihenfolge aller Rezepte, Gegenstände und Flüssigkeiten.\nVerbessert verschiedene Symbole für bessere Sichtbarkeit.\nBlendet unnötige Rezepte, Einheiten und weitere Einträge in Factoriopedia und/oder Signalauswahl aus.\nJede Funktion lässt sich in den Starteinstellungen deaktivieren.\nFür bestehende Spielstände:\nDie Mod lässt sich zu Spielständen hinzufügen und daraus entfernen. Werden Rezepte über Gegenstands- oder Flüssigkeitssignale gewählt (außer Rezeptsignalen), können sich die gewählten Rezepte dabei ändern.\nEINSCHRÄNKUNG:\nKrastorio 2 Space Out wird NICHT unterstützt.
ei-tech-scaling-maxCost=Maximale Kosten je [color=red]einzelner[/color] Forschungspaketart pro Technologie.\n[color=pink]Sonntagsspaziergang[/color] — 207\n[color=white]Spaziergang im Park[/color] — 415\n[color=#D2B48C]Fast geschenkt[/color] — 831\n[color=gray]Sehr günstig[/color] — 1662\n[color=white]Standard[/color] — 2500\n[color=cyan]Günstiger[/color] — 3325\n[color=blue]Günstig[/color] — 6750\n[color=yellow]Angemessener Preis[/color] — 12500\n[color=orange]Weniger teuer[/color] — 25000\n[color=red]Teuer[/color] — 50000\n[color=purple]Sehr teuer[/color] — 100000\nFactorio begrenzt den internen Forschungspreismultiplikator weiterhin auf [color=red]x1000[/color]. ESIR erhöht bei Bedarf automatisch den verborgenen effektiven Grundpreis, damit die gewählte Obergrenze erreichbar bleibt.
ei-tech-scaling-curveForm=FORMELHERLEITUNG — Skalierung der Technologiekosten\nAnsatz:\nStartpunkt A = (0, C) → C = Startpreis\nEndpunkt B = (N, X) → X = Höchstkosten\nN = Gesamtzahl der Technologien, n = aktueller Technologieindex\nKostenfunktionen:\nLinear: cost(n) = (X − C) / N · n + C\nQuadratisch: cost(n) = (X − C) / N² · n² + C\nExponentiell: cost(n) = exp(n/N · ln(X + 1 − C)) + C − 1\nTechnologiepreismultiplikatoren (cost(n) / C):\nLinear: f_lin = (X − C) / (N·C) · n + 1\nQuadratisch: f_qua = (X − C) / (N²·C) · n² + 1\nExponentiell: f_exp = (exp(n/N · ln(X + 1 − C)) − 1) / C + 1\nIntegrierte Kosten (Gesamtzahl der Forschungspakete):\nLinear: Area_lin = N/2 · (X + C)\nQuadratisch: Area_qua = N/3 · (X + 2C)\nExponentiell: Area_exp = N · (C − 1 + (X + 1 − C) / ln(X + 1 − C))\nNäherung für große X:\nArea_exp ≈ N·X / 9\nArea_qua ≈ N·X / 3\nArea_lin ≈ N·X / 2\nRelative Schwierigkeit:\nExponentiell < Quadratisch < Linear — exponentiell steigt anfangs sanft und später hart; linear bleibt gleichmäßig; quadratisch liegt dazwischen.\nZeitalteranstieg: nach Zeitaltern gestaffelte, spät betonte Skalierung. Dunkles und Dampfzeitalter bleiben sanft, Elektrizität zieht an, Computer-, Quanten- und exotisches Zeitalter tragen die höchste Last. Die Technologiegewichtung gilt weiterhin, vergünstigte Technologien zählen also weniger.\n[color=red]Änderungen während eines laufenden Spiels können unerwünschte Folgen haben.[/color]
ei-tech-scaling-startPrice=Formelvariable C der Kurve. ESIR kann den verborgenen effektiven Grundpreis erhöhen, wenn die gewählte Obergrenze sonst an Factorios x1000-Limit stößt.\nÄnderungen nach Spielbeginn können weiterhin unerwartete Folgen haben.
ei-tech-scaling-additionalMultiplier=Zusätzlicher Endmultiplikator, angewendet nach Berechnung von Kurve und Obergrenze.\nDieser Wert lässt sich im laufenden Spiel am sichersten ändern.
ei-item-glow-overlay-fidelity=Steuert Leuchtebenen in Gegenstandsbildern. Alle erhält die bisherige Darstellung; Flach behält die Leuchtgrafik ohne Lichtdarstellung; Aus entfernt die Leuchtebenen vollständig.
ei-science-pack-yield-dark=Legt die Herstellungsmenge des Forschungspakets des [color=red]dunklen[/color] Zeitalters fest.
ei-science-pack-yield-steam=Legt die Herstellungsmenge des Forschungspakets des [color=gray]Dampfzeitalters[/color] fest.
ei-science-pack-yield-electricity=Legt die Herstellungsmenge des Forschungspakets des [color=blue]Elektrizitätszeitalters[/color] fest.
ei-science-pack-yield-computer=Legt die Herstellungsmenge des Forschungspakets des [color=yellow]Computerzeitalters[/color] fest.
ei-science-pack-yield-simulation=Legt die Herstellungsmenge des [color=green]Simulationsforschungspakets[/color] fest.
ei-science-pack-yield-alien=Legt die Herstellungsmenge des [color=pink]Alien-Forschungspakets[/color] fest.
ei-science-pack-yield-quantum=Legt die Herstellungsmenge des Forschungspakets des [color=purple]Quantenzeitalters[/color] fest.
ei-science-pack-yield-fusion-quantum=Legt die Herstellungsmenge des [color=cyan]Fusionsquanten-Forschungspakets[/color] fest.
ei-science-pack-yield-exotic=Legt die Herstellungsmenge des Forschungspakets des [color=#00912E]exotischen[/color] Zeitalters fest.
ei-science-pack-yield-black-hole=Legt die Herstellungsmenge des [color=black]exotischen Schwarzes-Loch-Forschungspakets[/color] fest.
ei-em_updater_que=Zeigt bei Energieübertragung eine Markierung zwischen oder über EM-Zügen und Ladestationen.
ei-em_updater_que_width=Passt den Radius der angezeigten Ringe an.
ei-em_updater_que_transparency=Passt die Deckkraft der Ringe an. Bereich 1->100 (undurchsichtig).
ei-em_updater_que_timetolive=Passt die Zeit bis zum Verschwinden eines Rings an.
ei-em_train_glow=Schaltet den Leuchteffekt bei Stromübertragung an EM-Zügen um.
ei-em_train_glow_timetolive=Ticks bis zum Verblassen des Zugleuchtens. Effekte können sich überlagern. Niedrigere Werte verbessern die Leistung. 60 Ticks entsprechen 1 Sekunde.
ei-em_charger_glow=Schaltet den Leuchteffekt bei Stromübertragung an EM-Ladestationen um.
ei-em_charger_glow_timetolive=Ticks bis zum Verblassen des Ladestationsleuchtens. Effekte können sich überlagern. Niedrigere Werte verbessern die Leistung. 60 Ticks entsprechen 1 Sekunde.
ei-max_updates_per_tick=Anzahl der Aktualisierungen je Einheitentyp pro Tick.
ei-ticks_per_full_update=Legt fest, über wie viele Ticks verteilt alle EI-Einheiten aktualisiert werden.
ei-barrel-capacity=Die Kapazität ist absichtlich hoch, da Fässer nur noch bis 1 stapelbar sind.
ei-solar-icon-scaling=Skaliert Platzbedarf und Energieabgabe aller 3 Solarmodulstufen.\nUnter 75% wird die Platzierung [color=cyan]flexibler[/color].\nÜber 75% lässt sich eine bestimmte Leistung mit gleichem Rohstoffeinsatz [color=yellow]leichter[/color] erreichen.
ei-nauvis-main-tracks-override=Erlaubt dem Remembrance-Soundtrack, die ursprünglichen Nauvis-Hauptstücke zu ersetzen.
ei-nauvis-interlude-tracks-override=Erlaubt dem Remembrance-Soundtrack, die ursprünglichen Nauvis-Zwischenspiele zu ersetzen.
ei-nauvis-pressure-grace=Bremst vorübergehend übermäßige Feindentwicklung auf Nauvis. Klassisch endet im Elektrizitätszeitalter und verändert nie die Verschmutzungsevolution. Erweitert endet gewöhnlich im Computerzeitalter; auf Gnädig gelten stärkere Grenzen bis einschließlich Computerzeitalter und das Ende liegt im Quantenzeitalter. Unmöglich deaktiviert die Schonzeit auch bei eingeschalteter Option.
ei-nauvis-pressure-grace-profile=Klassisch korrigiert die Evolution bis einschließlich Dampfzeitalter und endet im Elektrizitätszeitalter, ohne den Verschmutzungsevolutionsfaktor zu ändern. Erweitert, der Standard, lässt Evolution und Verschmutzungsfaktor schrittweise auslaufen, stellt danach den erfassten Ausgangswert wieder her und reicht nur auf Gnädig bis zum Quantenzeitalter.
ei-enemy-difficulty=Wählt ESIRs Feindstufe. Jede Stufe außer Original skaliert feindliche Kampf- und Erzeugungsprototypen; Original lässt die Abhängigkeitswerte unverändert. Gnädig bis Nachsichtig sowie Unmöglich enthalten außerdem Apex-Ausnahmen. Mit aktivierter Nauvis-Schonzeit erhält Gnädig zusätzliche skriptgesteuerte Evolutionsentlastung. Unmöglich deaktiviert diese Schonzeit und kann nach Raketenstarts auf feindlichen Oberflächen nahe Feinde sammeln.
ei-gate-difficulty=Passt Torabstimmung und Fortschritt an. Geborgen behält das aktuelle Tor. Abgestimmt verschiebt es ins späte Alien-Zeitalter, Resonant ins späte Quantenzeitalter und Paradox ins exotische Zeitalter. Für neue Spielstände oder vor Erforschung des Tors vorgesehen.
ei-gate-notifications=Zeigt Tor-Chatmeldungen, etwa Zieländerungen und Warnungen bei Energiemangel.
ei-black-hole-notifications=Zeigt Schwarzes-Loch-Chatmeldungen, etwa Warnungen vor Eindämmungsversagen.
ei-matter-machine-notifications=Zeigt Chatmeldungen von Materiemaschinen, etwa Warnungen vor Entropiekaskaden.
ei-insulated-pipe-notifications=Zeigt Chatmeldungen isolierter Rohre bei Verdampfung, Brüchen und Verunreinigung.

