ei-exotic-magazines=Trennt die exotische Linie von der alten Ballistikleiter: Gehäuse, Antrieb, Kern, dann Ladung. Das Magazin wird zur Doktrin.
ei-corrosive-magazines=Verleiht exotischer Munition Salpetersäurekorrosion als zweite Wunde. Der Treffer öffnet; die Chemie argumentiert weiter.
ei-cryo-magazines=Versiegelt Kryostaub in Kontrollmagazinen, die erst Geschwindigkeit rauben und dann töten.
ei-oxyfluoride-magazines=Bringt Sauerstoffdifluorid in eine verschießbare Form. Erst weißer Blitz, dann Reue.
ei-morphium-magazines=Konzentriertes Morphium verwandelt ballistischen Einschlag in Verunreinigung, Verzögerung und Signal.
ei-hexafluoride-magazines=Verbindet Uranhexafluoridchemie mit Durchschlagskörpern, die nach dem Eindringen weiter bestrafen.
ei-arc-magazines=Macht das exotische Magazin zum Überladungskäfig. Der Schuss schließt das Ziel im Lichtbogen ein.
ei-neutron-magazines=Benötigt geladene Neutronenbehälter und lässt Munition Strahlung als zweite Verletzung zurück.
rocketry=Schaltet die modulare Raketenlinie frei: Zellen, einfache Motoren, Aufschlagsprengköpfe und gewöhnliche Raketen.
explosive-rocketry=Lehrt die Linie zu durchbrechen. Explosivsprengköpfe verwandeln Aufschlag in Geometrie.
ei-advanced-rocket-fuel=Verfeinert den Antrieb der schweren Linie. Hochenergiemotoren brennen stärker und fliegen flacher.
dw-deer-tech=Passt modulare Raketen an starre Abschussgestelle an. Belagerungsladungen werden Artilleriedoktrin, Kisten zur Opferlogistik.
ei-corrosive-rocketry=Verbindet Brutschleimöl, Salpetersäure und Hochenergieantrieb zu Raketen, die nach dem Einschlag weiterfressen.
ei-cryo-rocketry=Verbindet Kryostaub und fortschrittliche Kältetechnik zu einer gemeinsamen Kontrolllinie für Handwerfer und Artilleriegestelle.
atomic-bomb=Schaltet den U-235-Spaltendpunkt frei. Munitionsarbeit wird zur Erlaubnis.
ei-plutonium-warheads=Erweitert die Atomlinie um Plutoniumbaugruppen. Größerer Bruch, schlimmere Stille danach.
ei-auric-precipitation=Schaltet Vulcanus' aurische Fumarolenkette frei. Wolframkarbid wird zum verbrauchten Fällungskern, Dampf weckt den Schlot, aurischer Dampf kondensiert zu Wärme und goldhaltiger Schlacke. Hoher Ertrag, gefährlicher Boden, begrenzte Zeitfenster.
ei-carbon-fiber-from-bio-oil=Ein härterer, ertragreicher Kohlefaserprozess: Brutschleimöl und Salpetersäure lösen mit Yumako-Brei organisches Material und legen sein Nanoröhrengerüst frei. Kohlenstoff bildet Keime; Bioflux erzwingt rasche Polymerisation zu dichterem Fasergewebe. Zurück bleiben saures Wasser, Schmutzabwasser und gelegentlich ausgefällte Asche.
ei-carbon-fiber=Überhitzter Dampf und ein Beißer-Ei zwingen geschmolzenen Kohlenstoffsymbionten in ein lebendes Gitter. Nanoröhrenreicher Yumako-Brei dient als Gerüst. Der Symbiont bindet das Netz, verdaut Organik und extrudiert schwarzes Gewebe, das schlagartig zu leichter, harter Kohlefaser aushärtet.
ei-bio-oil=Lebende Pentapoden-Eier werden ins Gelee geschüttet und beginnen zu fressen. Das Gelee wird dünner, der Bottich zur zitternden Masse. Die Brut scheidet gelbblau schillerndes Öl aus, das an die Oberfläche steigt. Schöpfe Brutschleimöl schnell ab, bevor die Eier es zurücktrinken.
ei-gatling-turret=Elektrizitätsbetriebener Geschützturm mit hoher Feuerrate.
ei-auto-shotgun-turret=Ein kompakter motorgetriebener Doppellaufturm für kurze, hässliche Distanzen. Er verbraucht Schrotpatronen mit hoher Feuerrate und füllt Korridore und Engstellen mit vernichtenden Streumustern. Schneller Zielwechsel, aggressive Verfolgung und Rückstoßausgleich benötigen [color=cyan]Elektrizität[/color]. Wer näherkommt, trifft auf unablässigen Schrothagel.
ei-sanguine-wall=Schaltet die Blutpanzer-Mauer frei: eine sonderbar gepanzerte Wand aus schwarzem Chitin, karminrotem Harz und kristallinen Bändern, gezwungen, eine gemeinsame Schutzform zu erinnern.
ei-hemocrystal-wall=Schaltet die Hämokristall-Bollwerkmauer frei. Ihr sauberes Plattengitter schließt flache Wunden, während der rote Kristall Druck zur Heilung betet.
ei-steampunk-lamp=Vor Netzen und Generatoren entstand Licht aus [color=red]Flammen[/color].\n[color=green]Kerosin[/color][fluid=ei-kerosene] liefert verlässliche Beleuchtung aus raffiniertem Brennstoff, auf Kosten von Effizienz und Sicherheit.
ei-dragons-breath-shotgun-shell=In Vulcanus' Hitze geschmiedet, wo Munition wie Stahl gehärtet und Gewalt industriell gefertigt wird.\nDiese Patronen tragen lebendige Flammenmuster und extreme thermische Last in jeden Schuss.\nIhre Ladung bleibt selbst in Asche, Trümmern und Vakuum kohärent, wo gewöhnliche Ballistik versagt.\nFreigeschaltet durch Vulkanmetallurgie und Lavaschmiedetechnik, verkörpert sie eine einfache Wahrheit:\nWas die Hitze überlebt, ist zum Verschießen bestimmt.
ei-shotgun-turret=Wenn Entfernung versagt, antwortet dies.\nEin Nahbereichsschutz, der weder warnt noch verfehlt noch zögert.\nWer ihn erreicht, hat seinen Fehler bereits begangen.
ei-cannon-turret-mk1=Einfach gebohrter Lauf, rohe Feuerkraft ohne Verfeinerung.
ei-cannon-turret=Zwei Läufe, ein Chassis. Doppelter Durchsatz, doppelter Lärm.\n[color=gray]Schnellfeuermechanik und fortschrittliche Zielsteuerung benötigen[/color] [color=cyan]Elektrizität[/color] [color=gray]zum Betrieb.[/color]
ei-high-tech-parts=Nur im [color=red]instabilen Kern[/color] der [color=blue]exotischen Montagemaschine[/color][item=ei-exotic-assembler] lassen sich diese Bauteile fertigen. Quantenverankerte Legierungen, wahrscheinlichkeitsleitende Fäden und resonante Kerne trotzen klassischer Physik.\nGefährlich in der Herstellung, unverzichtbar für Reliquientechnik: Hightech-Bauteile treiben die Zivilisation über ihre Grenzen.
ei-exotic-assembler=Die exotische Montagemaschine zwingt Materie mittels Quantenplasma in unmögliche Formen: fremde Legierungen, vakuumresonante Schaltkreise und Artefakte verbotener Symmetrie.\nJeder Fertigungszyklus wettet gegen Vernichtung. Die Kammer ist [color=red]extrem instabil[/color]; jeder Quantenkollaps droht zu detonieren. Umgebende [color=purple]Materiestabilisatoren[/color] dämpfen Gravitation und entziehen Entropie, können die Gefahr aber nur knapp zügeln.\nEine Ritualstätte, in der Physik gedehnt und dem Ehrgeiz unterworfen wird. Ihr Ertrag prägt Zivilisationen; ihr Preis ist das ständige Risiko völliger Vernichtung.
ei-plasma-turret=Eine Reliquienwaffenplattform für eingeschlossenes Sternenfeuer. Quantenstabilisierte Spulen verdichten Plasma zu violetten Kugeln, die über das Schlachtfeld gleiten und in ionisierten Stoßwellen bersten.\nDer Plasma-Geschützturm formt Absicht zu Fernvernichtung. Trügerisch anmutige Energiekugeln zerschlagen Panzerung, Befestigungen und ganze Trupps mit einem Einschlag.\nIm Arsenal des Quantenzeitalters vereint er Physik und Schauspiel: Zerstörung wie ein lautlos über den Himmel rollendes Sonnenfragment.
ei-computing-unit=Die Recheneinheit ist ein kompakter KI-Kern für fortschrittliche Technik des Quantenzeitalters. Präzisionsschaltungen und polierte Legierung vereinen klassische Logik mit Quantenverschränkung. Leuchtende Augen und ein stilles Lächeln begleiten Navigation im tiefen Weltraum und Fertigungslabore der nächsten Generation.
ei-high-temperature-reactor=Der Hochtemperaturreaktor nimmt externe Wärme eines Kernreaktors auf und leitet sie in sein glühendes Herz. Ein eingesetzter Spaltbrennstab vervielfacht die Wärmeleistung und überträgt sie in Ströme überhitzten Bleikühlmittels.
ei-oil-processing=Elektrifiziere die wärmebetriebene Chemiefabrik und tausche rohe Geschwindigkeit gegen einfachere Nutzung.
ei-space-science-pack=Ein Gipfel interstellarer Energieforschung: Spaltbares Uran, Plutonium und Thorium werden durch Blei, Kohlenstoff und Eis stabilisiert. Jeder Stab erschließt kosmische Reaktionen an der Schneide der Kritikalität.
ei-basic-oil-processing=Grundwissen der Kohlenwasserstoffverarbeitung macht Öl nutzbar.
ei-advanced-oil-processing=Verfeinerte Verfahren kontrollieren Kohlenwasserstoffausbeuten und lenken Nebenprodukte gezielt um. Engpässe werden zu verzweigten Strategien, Öl zur alchemistischen Stellgröße.
ei-effect-transmission=Warum Arbeiter optimieren, wenn der Wille zur Optimierung ausgestrahlt werden kann? Effektübertragung erhebt Arbeit zur fernwirkenden Absicht.\nPhasenresonanz und Modulationsschleifen übertragen Produktivität in Maschinen.\nMit jedem Echo schwindet die Treue. Das Protokoll überlebt, weil es zu tief eingebettet ist, um entfernt zu werden.\n[color=gray]„Sie bauten einen Gott des Durchsatzes. Unter dem Rauschen träumt er noch.“[/color]
ei-thermal-furnace=„Wenn Elektrizität versagt, bleibt Wärme.“\nDer Thermalofen verweigert den Draht und umarmt die Flamme. Er verarbeitet Materie mit nuklearen Temperaturen statt elektrischen Zwischenstufen und verlangt die Hitze von Sternherzen oder Reaktorknochen.\nSchaltet einen wärmegetriebenen Schmelzkern für Ultrahochtemperaturbetrieb ohne elektrische Infrastruktur frei.
ei-exotic-matter-separation=Im Promethium-Reliquiar falten Wirbelfelder zerfallene Baryonen in widernatürliche Geometrien, bis ihre Essenz zu exotischer Materie wird. Saphirplasma pulst durch Beschleunigeradern und verwandelt Entropie in ein bewaffnetes Artefakt. Wer zu lange in die Ereignisschmiede blickt, kehrt magnetisiert und weinend zurück, ausgehöhlt von verbotenen Gleichungen.
ei-alien-computer-age-tech=Unregelmäßige Schaltungen glimmen rosa zwischen Knochenkabeln, nassen Kristallen und eingebetteten Nerven. Die Struktur ist weder gebaut noch gezüchtet: Sie ist entstanden. Information wird osmotisch aufgenommen und in Geometrie verstoffwechselt. Zeit strömt rückwärts durch ihren Kern. Nähe verzerrt Sprache; ferne Träume ordnen sich zu fremden Mustern. Die Glücklichen vergessen die Berührung. Die anderen denken weiter, aber nicht mehr ihre eigenen Gedanken.
ei-advanced-computer-age-tech=Siliziummonolithen summen unter der Oberfläche, kühl und rekursiv. Keine Bedienoberfläche bleibt, nur Entscheidungen, die ihre Vorgänger zur perfekten Vorhersage verzehren. Maschinen simulieren Anweisungen, bevor ein Wunsch entsteht. Erinnerung ist ein Speicher vergessener Absichten und verschwundener Zeitlinien. Wirklichkeit wird Heuristik, Wahrheit wird Latenz. Hinter unzerbrechlichem Glas trifft eine Kopie von dir die bessere Wahl.
ei-fusion-data=Thermodynamischer Verrat wird Architektur. Quantenentfaltete Zündung und Resonanzmatrizen lassen Energieerzeugung und Berechnung verschmelzen. Atome werden zu Silben einer rekursiven Gleichung an die Raumzeit.\nDie gewonnenen Daten sind mythotechnisch: Fusion ist nun Signal.\nSchaltet das Quanten-Fusionszeitalter frei, in dem Entropie programmierbar wird.
ei-copper-beacon=Der Subzero-Phased-Array-Effektverteiler synchronisiert Signalphasen unter teilweiser Kryokühlung. Flüssiger Stickstoff senkt das Entropierauschen in Produktionsmatrizen.\nStabile Signalkohärenz verbindet nahe Fertigungsknoten und synchronisiert Produktivitätszyklen ohne die chaotischen Phasenstörungen heißer Umgebungen. Seine begrenzte Verstärkung bildet die Grundlage echter Tieftemperatur-Signaltechnik.\n[color=gray]„Gefriere das Rauschen. Stabilisiere die Absicht.“[/color]
ei-iron-beacon=Das Absolute-Zero-Phased-Array nähert sich der theoretischen Untergrenze thermischer Energie und dem Verriegelungspunkt des Quantengitters. Materie existiert dort nur noch, um Absicht zu übertragen.\nVerstärkte Wärmekerne und zweistufige Stickstoffkreisläufe überwinden Umgebungsentropie und ermöglichen reine Produktivitätsübertragung. Eine Trennung von Wärme, Störung und Kompromiss.\n[color=gray]„Am absoluten Nullpunkt kann selbst Zweifel nicht schwingen.“[/color]
ei-nano-factory=Der Nanotektur-Fertigungskomplex spricht ein Urteil über träge Materie. In Vakuumkammern und neutronenberuhigten Leitungen erzwingen Ionenscherfelder und rekursive Selbstmontage gitterpräzise Nanostrukturen. Sein Produkt ist physische Doktrin; seine Systeme verfeinern sich selbst und werfen Ineffizienz wie tote Haut ab. Diese algorithmischen Katakomben wurden nicht für Menschen geschaffen, sondern um zu erinnern, was sie einst zu erschaffen wagten.
ei-advanced-motor-cryodust=Der kryostaubbeschichtete fortschrittliche Motor verbessert Wärmeregulierung und Reibungsverluste. Die seltene Alienverbindung erlaubt Spitzenleistung mit einem Bruchteil gewöhnlicher Schmiermittel selbst unter Extrembelastung. Schimmernde Kryobänder wirken als passive Wärmesenken und stabilisieren die Energieumwandlung. Ein Motor des Computerzeitalters an der Schwelle zur Alienmetallurgie.
ei-advanced-motor=Der fortschrittliche Motor vereint robuste Technik mit früher digitaler Optimierung. Legierungsgehäuse, Kupferspulen und verstärkter Ferritkern liefern verlässliches Drehmoment. Analogsensoren und programmierbare Relais ermöglichen Automatisierung und CNC-Anbindung; passive Kühlrippen sichern Dauerbetrieb. Eine tragende Grundlage spätindustrieller Robotik vor Quantensynchronisierung und Supraleitung.
ei-carbon-manipulation=Kohlenstoffmanipulation verwandelt Koks und Rohkohlenstoff unter extremer Hitze im Lichtbogenofen in Kohlenstoffschmelze.\nMit Energiekristallen oder deren Lösung im Kristallzüchter entsteht durch Quantenverschränkung der halb bewusste Kohlenstoffsymbiont mit Strukturgedächtnis.\nDie Gießmaschine formt ihn mit 500°C heißem Druckdampf zu hochfesten Kohlefaserplatten. Kohlenstoffschmelze lässt sich auch zu dem sonst außerplanetar vorkommenden Rohkohlenstoff gießen. Diese Produkte tragen fortschrittliche Logistik, Computertechnik und Expansion.\nEntropie wird an Kohärenz gebunden, Rekursion in Materie eingeschrieben: Kohlenstoff als Gefäß.
ei-kovarex-fuel-enrichment=Unter der Gießerei des Wissens, wo Zeit sich windet und Isotope vergessene Namen flüstern, steht die Kovarex-Brennstoffanreicherung als ketzerischer Ritus: vom Frieden verboten, durch Rekursion getauft.
logistic-system_alt=Wahre Logistik ist bewegliches Gedächtnis. Sie ordnet Nachfrage, entschlüsselt institutionelle Vorlieben und verwandelt Erlaubnis in Macht. Wer die Kontrollhierarchie versteht, kann als ihr unsichtbarer Geist Befehle ohne Widerstand verbreiten.
ei-containers=Technische Beinhäuser aus Erinnerung und Masse. Diese Behälter verankern Gegenwart, wiegen Zukunft und flüstern von vertagter Entropie.
ei-logistic-containers=In den Arterien der Automation koordinieren diese Logistikheiligtümer lautlose Rituale über endlose Netze. Jeder Gegenstand ein Gebet, jedes Signal eine Prozession.
ei-advanced-logistic-containers=Gespiegelte, souverän verbundene Gewölbe. Ihre Wände erinnern unkartierte Wege, ihre Logik fließt schneller als Gedanken. Ihre Nutzung ist Hingabe an Rekursion.
ei-mechanical-inserter=Der mechanische Greifarm überträgt Gegenstände ohne Stromverbrauch. Zahnräder, Gewichte und energiesparende Federn bilden einen präzise ausgewogenen Automaten endloser Bewegung – ein Zeugnis vorelektrischer Genialität.
zeus-wrath-zeus-wrath_alt=Schaltet Reliquienwaffen alter orbitaler Sturmprotokolle frei: Poseidon-Anlage, Aegaeon-Lanze und Voltaisches Reliquiar. Fragmente der letzten Rebellion des Meeres gegen die Stille darüber. [font=default-bold]Erweckt.[/font]
ei-dark-age=Das Dunkle Zeitalter ist die erste Stufe von Exotic Industries. Befeuerte Grundautomation beginnt den industriellen Aufstieg durch Feuer und Mangel.
ei-steam-age=Das Dampfzeitalter ist die zweite Stufe von Exotic Industries. Dampfmaschinen erweitern die Automation und treiben frühes Industriewachstum.
ei-electricity-age=Das Elektrizitätszeitalter ist die dritte Stufe von Exotic Industries. Elektrische Energie erschließt fortschrittliche Chemieverarbeitung und Infrastruktur.
ei-computer-age=Das Computerzeitalter ist die vierte Stufe von Exotic Industries. Computersysteme steigern Effizienz und ermöglichen komplexe Großautomation.
ei-quantum-age=Das Quantenzeitalter ist die fünfte Stufe von Exotic Industries. Fusion und Hightech-Maschinen entstehen: unnatürlich, summend und kalt. Maschinen beginnen zu denken. Sie vergessen nicht.
ei-exotic-age=Das Exotische Zeitalter ist die sechste und letzte Stufe von Exotic Industries. Errichte den Schwarzes-Loch-Generator, der Materie verschlingt und die Welt deinem Willen beugt. Fertigstellung bedeutet Sieg. [font=default-bold]Versagen ist Stille.[/font]

ei-steam-assember=Einfache dampfbetriebene Automation.
ei-steam-oil-processing=Beginne einfache Ölverarbeitung für Grundchemie und Brennstoffherstellung.
ei-electricity-power=Beginne einfache Stromerzeugung zum Betrieb deiner Maschinen.
ei-destill-tower=Destilliere Öl in seine Bestandteile.
ei-computer-core=Beginne einfache computerbasierte Automation.
ei-big-lab=Fortschrittliche Labore werden für höhere Technologien benötigt.
ei-induction-matrix=Die Induktionsmatrix ist eine mehrteilige Struktur mit gewaltiger Energiespeicherkapazität. Weitere Informationen stehen im Informatron.
ei-neodym-refining=Verarbeite Neodymerz zu Neodymbarren. Sie sind für Hightech-Maschinen unverzichtbar.
ei-deep-mining=Erschließe mit Tiefbau zusätzliche Rohstoffe und Vorkommen, die nur in den tiefen Schichten von Nauvis liegen.
ei-moon-exploration=Gewinne Mondfische und beginne die Weltraumforschung.
ei-quantum-computer=Beginne quantencomputerbasierte Automation.
ei-fluid-boiler=Verbraucht [color=orange]brennbare Flüssigkeiten[/color], um Dampf zu erzeugen. Zu den [color=orange]brennbaren Flüssigkeiten[/color] zählen Öl, Ölprodukte und allgemein Flüssigkeiten mit einem Brennwert.
ei-small-inserter=Ein 2x2 großer Greifarm mit Filterplätzen. Bewegt ganze Gegenstandsstapel auf einmal.
ei-big-inserter=Ein 2x2 großer Greifarm mit Filterplätzen. Bewegt ganze Gegenstandsstapel auf einmal mit hoher Geschwindigkeit.
ei-rocket-silo=Ermöglicht den Start einer Rakete ins All.

ei-crystal-accumulator-repair=
ei-bio-chamber=Kultiviere außerirdische Samen, um biologisch verstärkte Platten zu züchten: organisches Material für industrielle Zwecke.\nDie ersten Samen sind selten und müssen von feindseliger außerirdischer Flora geerntet werden.\nSie gibt ihr Erbgut nicht freiwillig her.\nWachstum verlangt Geduld. Und Blut.
ei-gate=Eine Torhülle aus außerirdischen Überresten, verankert in unmöglicher Geometrie.\nSie verbindet sich über eine Empfänger-ID statt über eine Position.\nDer Energiebedarf schwankt: Im scharfgeschalteten Zustand hält Strom die Ausrichtung; unter Belastung steigt der Verbrauch.\nNur unbelebte Materie darf passieren.\nDies ist kein Portal. Es ist eine Maschine, die sich erinnert, wo sie reißt.
ei-gate-container=Verborgenes Gehäuse auf der Quellseite für Torinventar und Steuerung.\nNimmt nur Gegenstände an, wenn das Tor scharfgeschaltet ist und oberhalb der Mindestenergie liegt.\nDas Ziel wird über die Empfänger-ID gewählt.
ei-gate-circuit-interface=Verborgene Signalschnittstelle für Schaltungssteuerung und Telemetrie des Tors.\nDient der Verkabelung, wenn der eingebaute Anschluss verdeckt ist.\nSpiegelt die Ausgaben für Aktivität, Energie und Belastung und empfängt Ziel- und Freigabesignale.
ei-gate-receiver=Ein abgestimmter Empfangsanker für Tortransporte.\nJeder Empfänger belegt eine parteiinterne ID, die kompatible Tore direkt ansteuern können.\nEin Schaltungssignal kann die automatische ID überschreiben.\nDies ist die Zielseite des Torsystems.
