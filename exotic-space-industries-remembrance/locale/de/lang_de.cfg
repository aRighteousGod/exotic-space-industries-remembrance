title_railgun_cooling=Railgun-Kühlung
railgun-cooling=Railgun-Kühlung
railgun-cooling-text=Die Railgun wird am Geschütz gekühlt; Munition wird dafür nicht zu einer besonderen kühlmittelgespeisten Patrone verarbeitet. Das Geschütz verbraucht kaltes Fluorketon, heißes Fluorketon muss abgeführt werden. Reicht der Kühlkreislauf nicht aus, sperrt sich die Waffe.\n\nDas ist beabsichtigt. Das Geschütz läuft heiß, der Lauf glüht kurz nach, und erst der Kühlmittelweg ermöglicht Dauerfeuer.
railgun-cooling-2=Kühlkreislauf und Ersatzrezept
railgun-cooling-text-2=Im Normalbetrieb verwendet das Geschütz kaltes Fluorketon. Fehlt es, sammelt die Railgun Wärmeschuld, deaktiviert sich und beginnt die Erholung.\n\nEin eisbasiertes Ersatzrezept bietet einen weiteren Weg zu kaltem Fluorketon neben flüssigem Stickstoff. Dabei fällt etwas Dampf an; Kälte entsteht nicht kostenlos.
railgun-cooling-3=Verhalten je Oberfläche
railgun-cooling-text-3=Oberflächen kühlen unterschiedlich. Weltraumplattformen geben Wärme langsam ab, Welten mit Atmosphäre schneller. Aquilo erholt sich durch natürliche Wärmeabgabe am schnellsten; Vulcanus bleibt länger heiß. Dünne Atmosphären oder gering verschmutzte Oberflächen liegen dazwischen. Dieselbe Railgun verhält sich daher je nach Aufstellort deutlich anders.
railgun-cooling-4=Erholung und Status
railgun-cooling-text-4=Gesunde Railguns bleiben nicht in einer dauerhaften Warteschlange. Nur überhitzte oder blockierte Geschütze werden zur Erholung erfasst. Sie bleiben deaktiviert, bis die Wärmeschuld abgebaut ist und der Heißausgang verbrauchtes Fluorketon wieder aufnehmen kann.\n\nDer Status ist aussagekräftig: Grün bedeutet bereit, Gelb Erholung oder blockierter Ausgang, Rot fehlende Kühltechnik oder schwere Überhitzung.
