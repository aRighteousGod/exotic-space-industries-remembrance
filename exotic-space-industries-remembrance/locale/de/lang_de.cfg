ei-bio-oil-synthesis=Lebende Pentapoden-Eier werden ins Gelee geschüttet und beginnen zu fressen. Das Gelee wird dünner, der Bottich zur zitternden Masse. Die Brut scheidet gelbblau schillerndes Öl aus, das an die Oberfläche steigt. Schöpfe Brutschleimöl schnell ab, bevor die Eier es zurücktrinken.
ei-bio-oil-refining=Verarbeitet Brutschleimöl zu mittleren und schweren Destillaten.
ei-water-bio-oil-refining=Verarbeitet Wasser und Brutschleimöl zu mittleren und schweren Destillaten.
ei-steam-bio-oil-refining=Verarbeitet Dampf und Brutschleimöl zu mittleren, schweren und Schmiermitteldestillaten.
ei-plastic-from-bio-oil=Erzeugt Kunststoffstangen aus Flüssiggas und Brutschleimöl.
ei-sulfur-from-bio-oil=Erzeugt Schwefel aus Flüssiggas und Brutschleimöl.
ei-carbon-fiber-from-bio-oil=Ein härterer, ertragreicher Kohlefaserprozess: Brutschleimöl und Salpetersäure lösen mit Yumako-Brei organisches Material und legen sein Nanoröhrengerüst frei. Kohlenstoff bildet Keime; Bioflux erzwingt rasche Polymerisation zu dichterem Fasergewebe. Zurück bleiben saures Wasser, Schmutzabwasser und gelegentlich ausgefällte Asche.
ei-breach-residue-neutralization=Neutralisiert Torrückstände zu Schmutzwasser.
ei-lube-destilate-steam-finishing=Veredelt Schmiermitteldestillat mit Dampf zu stabilem Schmiermittel. Leichte Kohlegasfraktionen entweichen als Nebenprodukt.
ei-lube-destilation=Zersetzt Schmiermittel hydrothermal zu Schweröl und Kohlenstoffrückständen.

