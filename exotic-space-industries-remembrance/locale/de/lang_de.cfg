gate-gui-control-runtime-label=Laufzeitzustand: __1__
gate-gui-control-runtime-label-tooltip=Stabil bedeutet, dass keine Abklingzeitsperre aktiv ist. Abkühlend bedeutet, dass das Tor seine Abklingzeit abwartet und die Übertragung auf dieser Route pausiert. Kritisch bedeutet, dass die Belastung Instabilität und Entladungsrisiko erhöht.
