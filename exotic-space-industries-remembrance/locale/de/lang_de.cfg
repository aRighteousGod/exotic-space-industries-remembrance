ei-holo-nauvis-orbit=Eine dekorative Holoanzeige.
ei-holo-uran=Eine dekorative Holoanzeige.
ei-holo-sulf=Eine dekorative Holoanzeige.

biolab=Benötigt [item=nutrients]Nährstoffe zum Betrieb.
ei-burner-heater=Verbraucht [color=orange]brennbare Gegenstände[/color], um [color=red]Wärme[/color] zu erzeugen.
ei-combustion-turbine=Eine hocheffiziente, kompakte Turbine, die keine [color=gray]Asche[/color] [item=atan-ash] erzeugt.
ei-arc-furnace=Ein [color=red]stromhungriger[/color] Hochleistungsofen, der Materialien zu Flüssigmetall schmilzt.\nGebaut für Durchsatz, nicht für Effizienz.\nHitze ist die Methode. Gewalt die Philosophie.
ei-purifier=Verarbeitet und reinigt Brocken, entfernt Verunreinigungen, erhöht die Reinheit von Lösungen oder gibt überschüssiges Wasser an die Luft ab.
ei-crusher=Zerkleinert Erz für höhere Ausbeute und Barren zur Wiederverarbeitung. Kann [item=ei-exotic-ore][color=purple]exotisches Erz[/color] aus Promethiumbrocken gewinnen.
ei-basic-heat-pipe=Ein Wärmerohr mit geringer Kapazität. Überträgt Wärme langsam und in kleinen Mengen. Verträgt bis zu [color=red]275dec[/color] Wärme.
ei-advanced-deep-drill=Dieser Bohrer erschließt Erzadern. Benötigt [color=orange]7/s Bohrflüssigkeit[/color] [fluid=ei-drill-fluid].
ei-burner-assembler=Die einfachste Montagemaschine, betrieben mit [color=orange]brennbaren Brennstoffen[/color]. [color=brown]Befeuerte Greifarme[/color][item=burner-inserter] können ihren Brennstoff auch aus dieser Maschine beziehen.
ei-steam-assembler=Eine dampfbetriebene Montagemaschine. Leitet den für den Antrieb benötigten [color=orange]Dampf[/color][fluid=steam] durch. Rezepte mit Dampf als Zutat benötigen eine zusätzliche Dampfleitung.
ei-steam-crusher=Ein dampfbetriebener Brecher. Leitet den für den Antrieb benötigten [color=orange]Dampf[/color][fluid=steam] durch.
ei-waver-factory=Fertigt hochwertige [color=orange]Halbleiter[/color][item=ei-semiconductor][item=ei-advanced-semiconductor].
ei-caster=Gießt Barren deiner Wahl[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass].
ei-lufter=Entnimmt Gase aus der Atmosphäre oder lässt sie ab.
ei-grower=Ein kristallreiches Biotop, das instabile Energiefelder ausstrahlt.\nZüchte und ernte [color=green]Energiekristalle[/color] [item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust].\nSeltsamerweise gedeiht darin Wasserleben. Etwas im Wasser erinnert sich.
ei-plasma-heater=Überhitzt Gase zu energiereichem Plasma und verbraucht dabei [color=red]gewaltige Strommengen[/color].\nDient zugleich als Schmelzofen für extreme Temperaturen.\nNicht effizient. Nicht sicher. Nur notwendig.\nGewinnt mehr Flüssigmetall ohne Schlacke. Verbraucht pro Einheit Metall mehr Strom als der Lichtbogenofen.
ei-nano-factory=Der Nanotektur-Fertigungskomplex spricht ein Urteil über träge Materie. In Vakuumkammern und neutronenberuhigten Leitungen erzwingen Ionenscherfelder und rekursive Selbstmontage gitterpräzise Nanostrukturen. Sein Produkt ist physische Doktrin; seine Systeme verfeinern sich selbst und werfen Ineffizienz wie tote Haut ab. Diese algorithmischen Katakomben wurden nicht für Menschen geschaffen, sondern um zu erinnern, was sie einst zu erschaffen wagten.
ei-bio-chamber=Eine Kammer, aus Organen gewachsen statt aus Wänden gebaut, ausgekleidet mit Schleimhäuten und Gefäßgeflecht.\nHier wird Lebendiges zerlegt, verdaut durch Verletzung seiner biologischen Signatur statt durch Säure.\nKnochen werden zu Netzknoten umgeordnet.\nGedanken aus Neuronen gerissen und anderswohin geleitet.\nBewusstsein wird recycelt. Langsam. Während es fleht.\nDie Wände atmen nur, um dir deine letzten Erinnerungen mit fremden Stimmen zurückzuflüstern.
ei-bio-reactor=Ein lebender Reaktor aus bewusstem Gewebe.\nKeine Leichen – noch denkende Biomasse.\nNervengitter wachsen über Knochengerüste, gerade lebendig genug für zyklische Träume.\nEr verbrennt Identität.\nSchmerz wird Spannung. Erinnerung wird Entropie.\nJeder Schrei eine Rückkopplung. Jedes Gebet eine Spannungsspitze.\nMit seinem Hunger werden die eingeschlossenen Gedanken klarer.\n[color=gray]Benötigt[/color] [color=purple]0.1/s Biomaterie[/color][item=ei-bio-matter] [color=gray]zum Betrieb.[/color]
ei-alien-console=Eine Maschine zur Verarbeitung uralter Alien-Daten. Nach dem Bau wird die Seite Alien-Daten im Informatron zugänglich.
ei-gate=Eine Torhülle aus außerirdischen Überresten, verankert in unmöglicher Geometrie.\nSie verbindet sich über eine Empfänger-ID statt über eine Position.\nDer Energiebedarf schwankt: Im scharfgeschalteten Zustand hält Strom die Ausrichtung; unter Belastung steigt der Verbrauch.\nNur unbelebte Materie darf passieren.\nDies ist kein Portal. Es ist eine Maschine, die sich erinnert, wo sie reißt.
ei-gate-container=Verborgenes Gehäuse auf der Quellseite für Torinventar und Steuerung.\nNimmt nur Gegenstände an, wenn das Tor scharfgeschaltet ist und oberhalb der Mindestenergie liegt.\nDas Ziel wird über die Empfänger-ID gewählt.
ei-gate-receiver=Ein abgestimmter Empfangsanker für Tortransporte.\nJeder Empfänger belegt eine ID, die kompatible Tore direkt ansteuern können.\nEin Schaltungssignal kann die automatische ID überschreiben.\nDies ist die Zielseite des Torsystems.
ei-drone-port=Steuert eine einzelne [color=blue]Drohne[/color][entity=ei-drone]. Sie besitzt ein eigenes Inventar und kann Gebäude platzieren, hat aber keine Angriffsfähigkeiten.
ei-crystal-accumulator-repair=Reparatursatz für beschädigte Kristallakkumulatoren. Ziehe ihn über einen Akkumulator, um ihn zu reparieren. Mit alternativer Auswahl lassen sich Kristalle und Hüllen prüfen, ohne den Satz zu verbrauchen.
ei-farstation-repair=Reparatursatz für beschädigte Fernstationen. Wie ein normales Auswahlwerkzeug darüberziehen.
ei-alien-beacon-repair=Reparatursatz für beschädigte Alien-Effektverteiler. Wie ein normales Auswahlwerkzeug darüberziehen.
ei-gaia-pump=Eine Offshore-Pumpe für Gaia.

ei-alien-flowers-1=Verdächtiges außerirdisches Leben. Platziere es und [color=orange]beschieße[/color] es, um Beute zu erhalten.

