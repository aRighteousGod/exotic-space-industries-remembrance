[mod-setting-name]
ei-production-machine-lights=Statuslichter für Produktionsgebäude

[mod-setting-description]
ei-production-machine-lights=Betrifft 28 ESIR-Produktionsgebäude: 23 Statuslichter auf den vorhandenen Anzeigen von 20 Gebäuden. Die acht Gebäude ohne Anzeigen erhalten kein Statuslicht. Im mehrfarbigen Modus überspringt Bottleneck Lite nur die 20 Gebäude mit Statuslichtern; seine Farbeinstellungen ändern die ESIR-Farben nicht. Die Prozessbeleuchtung bleibt in allen Modi erhalten. Das Prozessleuchten des Lichtbogenofens wird separat über dessen Flackereinstellung gesteuert. Farblich passende Leuchtflächen und kleine Lichtquellen: Grün im Betrieb, Gelb bei vollem Ausgang, Orange bei Strommangel und Rot bei sonstigem Stillstand mit vorhandener Energie. Ohne Energie sind die zusätzlichen Leuchtflächen und Lichtquellen unsichtbar. Stellt die 25 ursprünglichen weißen Arbeitslichter wieder her. Lichtbogenofen, Plasmaerhitzer und Gießmaschine behalten ihre ursprünglichen Effekte ohne zusätzliche Statusanzeigen. Bottleneck Lite bleibt unverändert. Keine zusätzlichen Leuchtflächen oder ausgestrahlten Statuslichter. Vorhandene Anzeigen in den Grafiken und Prozesseffekte bleiben erhalten. Bottleneck Lite bleibt unverändert.

