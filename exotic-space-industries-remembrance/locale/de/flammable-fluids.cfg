[mod-setting-name]
ei-flammable-rupture-fidelity=Darstellungsqualität brennbarer Leckagen
ei-fluid-safety-ignored-entities=Von der Flüssigkeitssicherheit ausgenommene Entitäten

[mod-setting-description]
ei-flammable-rupture-fidelity=Regelt Darstellung und Gefahrenausbreitung brennbarer Flüssigkeitsleckagen. „Sparsam“ hält Explosionen kurz. „Standard“ ist voreingestellt. „Filmisch“ verteilt das Schauspiel auf mehr Ringe. „Unbegrenzt“ hebt feste Effektgrenzen auf und kann bei großen Tanks die UPS stark senken.
ei-fluid-safety-ignored-entities=Entitätsprototypnamen, die ESIR-Flüssigkeitssicherheit und brennbare Leckagen ignorieren sollen. Namen mit Komma, Semikolon, Leerzeichen, Tabulator oder Zeilenumbruch trennen. Standardmäßig sind Hilfsentitäten von Interplanetary Fluid Funnel / Linked Pipe geschützt; entferne Namen, um sie wieder von ESIR behandeln zu lassen.

[string-mod-setting]
ei-flammable-rupture-fidelity-lean=Sparsam
ei-flammable-rupture-fidelity-standard=Standard
ei-flammable-rupture-fidelity-cinematic=Filmisch
ei-flammable-rupture-fidelity-unbounded=Unbegrenzt

[string-mod-setting-description]
ei-flammable-rupture-fidelity-lean=Kürzeste Leckagefolge. Vier Ringe, enge Effektgrenzen, keine sekundären Familienakzente und keine massiven Explosionen.
ei-flammable-rupture-fidelity-standard=Standard. Sechs Ringe, mäßige Grenzen, ein deutlicher sekundärer Akzent und zurückhaltende massive Explosionen.
ei-flammable-rupture-fidelity-cinematic=Acht Ringe, größere Rauch- und Feuerbudgets, reichere Familienakzente und eine langsamere, zeremonielle Ausbreitung.
ei-flammable-rupture-fidelity-unbounded=Entfernt feste Darstellungsgrenzen und verarbeitet bereite Ringe möglichst im selben Tick. Für das Schauspiel gedacht, nicht für Schonung.

[exotic-industries-informatron]
menu_flammable_ruptures=Brennbare Leckagen
title_flammable_ruptures=Brennbare Leckagen

flammable-ruptures=Leckage brennbarer Flüssigkeiten
flammable-ruptures-text=Tanks, Rohre, unterirdische Flüssigkeitsverbindungen, Waggons und flüssigkeitsführende Maschinen können beim Tod bersten, wenn genügend brennbare Flüssigkeit eingeschlossen bleibt. Verwendet werden die endgültig geladenen Flüssigkeitsprototypen; Ölprodukte, Gasleitungen und exotische Brennstoffgemische erhalten eigene Folgen.\n\nDer auslösende Schadenstyp zählt: Feuer, Aufprall, Explosionen, Plasma und andere energiereiche Todesarten entzünden eine Leckage deutlich eher als Kälte oder Gift.
flammable-ruptures-2=Darstellungsmodus
flammable-ruptures-text-2=Aktueller Startmodus: [font=default-bold]__1__[/font]\n\n[font=default-bold]Sparsam[/font] hält die Folge kurz und eng begrenzt. [font=default-bold]Standard[/font] ist die vorgesehene Grundeinstellung. [font=default-bold]Filmisch[/font] verteilt eine größere gestufte Blüte auf mehr Ticks. [font=default-bold]Unbegrenzt[/font] entfernt feste Grenzen und lässt den Scheduler bereite Ringe möglichst im selben Tick verarbeiten.
flammable-ruptures-3=Ausbreitung und Risiko
flammable-ruptures-text-3=Verschmutzung entsteht sofort beim Tod; der Rest breitet sich ringweise aus. Explosionen, Rauch, Feuerstellen, Brandspuren und Schaden werden einmal vorausberechnet und über mehrere Ticks freigesetzt, damit große Tankgruppen nicht ihre gesamte Apokalypse in einem Bild erzeugen.\n\nDie Weiterleitung durch unterirdische Rohrpaare nutzt dieselbe Warteschlange. „Unbegrenzt“ gefährdet absichtlich die Leistung – den Preis trägst du.
flammable-ruptures-4=Plattformen und Rohrstrecken
flammable-ruptures-text-4=Auf Weltraumplattformen bleiben Schaden und Ausbreitung entlang verbundener Rohre erhalten; deckweites Bodenfeuer entfällt. Austrittsrauch bleibt enger, Brandspuren entfallen, Flammen entstehen nur an der Bruchstelle und direkt entzündeten Rohrsegmenten. Fundamentschaden folgt derselben örtlichen Kette statt zufällig über das Deck zu spritzen.
