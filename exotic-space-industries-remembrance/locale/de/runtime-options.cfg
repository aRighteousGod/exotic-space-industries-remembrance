[string-mod-setting-description]
ei-flammable-rupture-fidelity-runtime-lean=Kürzeste Leckagefolge. Vier Ringe, enge Effektgrenzen, keine sekundären Familienakzente und keine massiven Explosionen.
ei-flammable-rupture-fidelity-runtime-standard=Standard. Sechs Ringe, mäßige Grenzen, ein deutlicher sekundärer Akzent und zurückhaltende massive Explosionen.
ei-flammable-rupture-fidelity-runtime-cinematic=Acht Ringe, größere Rauch- und Feuerbudgets, reichere Familienakzente und eine langsamere, zeremonielle Ausbreitung.
ei-flammable-rupture-fidelity-runtime-unbounded=Entfernt feste Darstellungsgrenzen und verarbeitet bereite Ringe möglichst im selben Tick. Für das Schauspiel gedacht, nicht für Schonung.
ei-gaian-saucer-wake-visual-fidelity-runtime-off=Das Fahrzeug versiegelt sein Nachbild und reist ohne sichtbare Erinnerung.
ei-gaian-saucer-wake-visual-fidelity-runtime-lean=Nur eine feine farbige Verweigerung folgt der Hülle, kurz und diszipliniert.
ei-gaian-saucer-wake-visual-fidelity-runtime-standard=Der Schweif darf klar sprechen und verblasst, bevor er zur Doktrin wird.
ei-gaian-saucer-wake-visual-fidelity-runtime-cinematic=Der Schweif wird breiter, verweilt und biegt sich mit dem Wendeeid der Untertasse.
ei-gaian-saucer-wake-visual-fidelity-runtime-maximal=Die Hülle hinterlässt überall eine dichte leuchtende Bewegungswunde.
ei-gaian-saucer-wake-visual-fidelity-runtime-unbounded=Die Begrenzung entfällt; die Untertasse darf jedes Schimmern zeichnen, das die Welt erträgt.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-off=Der Unterrumpf versiegelt seine Kreise und bewegt sich ohne sichtbares Schwebeschimmern.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-lean=Vier Emitterkreise antworten dem Boden kurz mit einem zurückhaltenden prismatischen Rand.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-standard=Die Emitter zeichnen stetige Smaragdringe unter den Rumpf, während Bewegung zu Druck wird.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-cinematic=Die Ringe erhellen sich, überlagern sich und zerfallen um jeden Schwebefuß in mintgrüne Prismensplitter.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-maximal=Jeder Emitter öffnet ein dichtes leuchtendes Siegel unter der Reliquie, beinahe andächtig in seiner Gewalt.
ei-emerald-apocalypse-hover-tank-hover-visual-fidelity-runtime-unbounded=Die Begrenzung zerbricht; jeder Schwebefuß darf dem Boden die Passage des Panzers einprägen.
