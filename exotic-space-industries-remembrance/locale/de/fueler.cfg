welcome=Exotic Industries: Brennstoffwächter-Turm
welcome-text=Der Brennstoffwächter ist ein automatisches Versorgungsbauwerk, das geeignete nahe Ziele überwacht und Brennstoff aus seinem Inventar überträgt.\n\nFahrzeugmodus versorgt Züge, Autos, Panzer, Spidertrons, Munitions- und Artillerietürme sowie Artilleriewaggons. Ausrüstungsmodus versorgt befeuerte Ausrüstung in Fahrzeug- und Spielergittern einschließlich brennstoffbetriebener Reaktoren. Bei Platz nimmt er verbrauchten Brennstoff und Rückstände zurück.\n\nWähle im Fenster Zieltyp und Brennstoffziel. Untätigkeit liegt häufig an unpassender Auswahl: Ein auf Lokomotiven gerichteter Turm im Ausrüstungsmodus füllt keine Fahrzeugbrennstoffinventare; Ausrüstungsmodus bedient nur befeuerte Gitterausrüstung.\n\n[font=default-bold]Er fragt nicht. Er dient dem zugewiesenen Kreis.\nEr verlässt weder seine Reichweite noch seinen gewählten Modus.\n\nStelle ihn einmal ein, dann lass ihn arbeiten.[/font]

welcome-text-2=Brennstoffwächter können bewegte Ziele einschließlich fahrender Züge versorgen. Qualität ändert weder Reichweite noch Abklingzeiten, erlaubt aber mehr Ziele je Durchlauf und hilft damit in belebten Depots.\n\nNach Migrationen, Mod-Wechselwirkungen oder beschädigtem Laufzeitzustand können Administratoren mit /rescan_fuelers neu erfassen. Normale Qualitätsregeln für Container vergrößern das Turminventar für Brennstoff und Munition.\n\n[font=default-bold]Diese Türme sind effizient, nicht allwissend.\nJe besser der Turm, desto mehr Arbeit erledigt er zugleich.[/font]

welcome-text-3=Brennstoffbetriebene Reaktorausrüstung wird im Ausrüstungsmodus unterstützt.
