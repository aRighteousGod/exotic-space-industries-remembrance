[item-description]
ei-fueler=Ein autonomer [color=orange]Brennstoffwächter-Turm[/color]. Im Fahrzeugmodus versorgt er Züge, Autos, Panzer, Spidertrons, Munitions- und Artillerietürme sowie Artilleriewaggons. Im Ausrüstungsmodus versorgt er [color=blue]befeuerte Ausrüstung in Fahrzeug- und Spielerausrüstungsgittern, einschließlich brennstoffbetriebener Reaktorausrüstung[/color]. Er entfernt auch [color=red]Verbrennungsrückstände[/color]. Höhere Qualität ermöglicht mehr Ziele je Aktualisierungsdurchlauf, erhöht aber nicht die Reichweite; normale Qualitätsregeln vergrößern weiterhin das Inventar. Weitere Informationen im Informatron.

