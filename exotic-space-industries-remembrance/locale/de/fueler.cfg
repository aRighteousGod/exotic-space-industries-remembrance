[technology-description]
ei-fueler=Der Brennstoffwächter besitzt zwei Modi. Fahrzeugmodus versorgt Züge, Autos, Panzer, Spidertrons, Munitions- und Artillerietürme sowie Artilleriewaggons. Ausrüstungsmodus versorgt befeuerte Ausrüstung in Fahrzeug- und Spielergittern einschließlich brennstoffbetriebener Reaktoren. Wähle im Turmfenster Zieltyp und Brennstoffziel: Fahrzeuginventar oder befeuerte Ausrüstung. Bei Platz nimmt der Turm auch verbrauchten Brennstoff zurück.

