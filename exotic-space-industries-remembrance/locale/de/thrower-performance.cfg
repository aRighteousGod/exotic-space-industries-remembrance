[mod-setting-name]
ei-thrower-performance-profile=Leistung von Flammenwerfer- und Säurewerfer-Geschütztürmen

[mod-setting-description]
ei-thrower-performance-profile=Reduziert nur bei Flammen- und Säurewerfertürmen Strahlpartikel, Feuerhäufigkeit, Rauch sowie Brand- und Korrosionsschadensanwendungen. Größere Treffer erhalten den nominellen Dauerschaden; größere Fluidmengen erhalten den Verbrauch pro Sekunde. Bodenbrandschaden, Wachstum und brennstoffabhängige Lebensdauer bleiben gleich. Original erhält bisheriges Verhalten. 8× und 16× erzeugen grobe Salven: Zielabdeckung in Bewegung, Feueraufbau und Wirkung gegen feste Schadensabzüge unterscheiden sich. Die Faktoren bezeichnen geringere Verarbeitungshäufigkeit, keine garantierten UPS-Gewinne. Hand- und Fahrzeugwaffen bleiben unberührt.\nGrundwerte unten gelten vor Qualität, Forschung und anderen Mods. Spalten: Waffenabklingzeit / Partikelintervall / Partikel pro Sekunde / Treffer- und Fluidmultiplikator / Brandintervall / Korrosionsintervall. Intervalle in Ticks (60 Ticks = 1 Sekunde).

[string-mod-setting]
ei-thrower-performance-profile-original=Original
ei-thrower-performance-profile-2x=2× Reduktion
ei-thrower-performance-profile-4x=4× Reduktion
ei-thrower-performance-profile-8x=8× Reduktion
ei-thrower-performance-profile-16x=16× Reduktion

[string-mod-setting-description]
ei-thrower-performance-profile-original=Bisheriges Verhalten: Abklingzeit 4 Ticks; ein Partikel alle 2 Ticks; 30 Partikel/s; normaler Treffer und Fluidverbrauch; Brandintervall 10 Ticks; Korrosionsintervall 1 Tick.
ei-thrower-performance-profile-2x=Abklingzeit 8 Ticks; ein Partikel alle 4 Ticks; 15 Partikel/s; 2× Trefferschaden und Fluid je Feueraktion; Brandintervall 20 Ticks; Korrosionsintervall 2 Ticks.
ei-thrower-performance-profile-4x=Abklingzeit 16 Ticks; ein Partikel alle 8 Ticks; 7.5 Partikel/s; 4× Trefferschaden und Fluid je Feueraktion; Brandintervall 30 Ticks; Korrosionsintervall 4 Ticks.
ei-thrower-performance-profile-8x=Abklingzeit 32 Ticks; ein Partikel alle 16 Ticks; 3.75 Partikel/s; 8× Trefferschaden und Fluid je Feueraktion; Brandintervall 30 Ticks; Korrosionsintervall 8 Ticks. Grobe Salven beeinflussen Abdeckung und feste Schadensabzüge.
ei-thrower-performance-profile-16x=Abklingzeit 64 Ticks; ein Partikel alle 32 Ticks; 1.875 Partikel/s; 16× Trefferschaden und Fluid je Feueraktion; Brandintervall 30 Ticks; Korrosionsintervall 16 Ticks. Sehr grobe Salven beeinflussen Abdeckung und feste Schadensabzüge.

[thrower-performance]
profile-row=\n__1__: __2__ / __3__ / __4__ / ×__5__ / __6__ / __7__
