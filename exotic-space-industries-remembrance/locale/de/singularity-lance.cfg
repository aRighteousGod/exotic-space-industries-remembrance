[item-description]
ei-singularity-lance=Eine außerirdische Eidmaschine um ein schwebendes Kristallherz. Ihr chromatischer Strahl trennt das Ziel von der Erinnerung daran, ganz gewesen zu sein.

[entity-description]
ei-singularity-lance=Ein erhöhter Kristallaltar für gebündelte außerirdische Gewalt. Das Prisma schwebt über der Maschine, sammelt unmögliche Farbe und entlädt sie als Singularitätslanze entlang der gewählten Linie.

[exotic-industries-informatron]
menu_singularity_lance=Singularitätslanze
title_singularity_lance=Singularitätslanze
turrets-text-6=Die [item=ei-singularity-lance]Singularitätslanze ist ein außerirdisches Klingenprotokoll um ein schwebendes Prisma und einen Pyramidenaltar. Sie hortet Kristallladung, bis die gewählte Linie zum Schnitt wird. Der Strahl schreibt ein Urteil durch den Raum; die Wunde kommt mit dem Schuss, der Zeuge folgt.
singularity-lance=Singularitätslanze
singularity-lance-text=Die [item=ei-singularity-lance]Singularitätslanze ist eine kompakte Hinrichtungsmaschine des Alien-Zeitalters. Über ihrer Pyramidenspitze schwebt ein Kristall, trinkt einen gewaltigen Stromimpuls und öffnet eine helle Wunde über das Schlachtfeld, statt jedes Opfer als einzelnes Projektil zu verfolgen.
singularity-lance-2=Chromatische Spur
singularity-lance-text-2=Jeder bezahlte Schuss folgt seinem Ziel bis zum Strahlkontakt. Direkter Schaden und Schnittschaden treffen mit dem Strahl. Mit Endgültigem Kollaps zieht sich der feste Kontaktpunkt vor einem getrennten Kern- und Außenschlag zusammen. Testament des Schwarzen Lochs hinterlässt dort ein verzögertes Echo.
singularity-lance-3=Auslese der Zeugen
singularity-lance-text-3=Viele Lanzen dürfen zugleich sprechen. Schnitt, Wundmarkierung und Kollapswarnung bleiben; überschüssige Brandspuren und Zierde weichen zuerst. Schaden ist unabhängig vom Schauspiel.
singularity-lance-4=Zeugengelübde
singularity-lance-text-4=Aktuelles Zeugengelübde: __1__. Jede Stufe behält die animierten Kernformen und fließenden Farben erforschter Aufwertungen. Höhere Detailstufen erlauben mehr Leuchten, Kronenimpulse, Narben und Klang. Der Status der platzierten Lanze zeigt den aktuellen dauerhaften Direktschaden deiner Partei; Wunde und Testament ergänzen bedingte Leistung.
