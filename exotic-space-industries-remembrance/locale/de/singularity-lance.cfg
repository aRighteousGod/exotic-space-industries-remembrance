[mod-setting-description]
ei-singularity-lance-visual-fidelity=Bestimmt, wie heftig die Singularitätslanze jeden Schnitt erinnert. Jede Stufe erhält Schnitt, Wundsigille, Kollapswarnung und Testament-Silhouette. Höhere Stufen ergänzen Leuchten, längere Strahlnachbilder, kosmetische Narben und Klang. Dekoration bleibt unter Last begrenzt; Schaden, Energieverbrauch und Reichweite bleiben gleich.

