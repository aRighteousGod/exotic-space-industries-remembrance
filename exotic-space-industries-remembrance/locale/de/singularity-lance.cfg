ei-singularity-lance-visual-fidelity-maximal=Offenbarender Zeuge
ei-singularity-lance-visual-fidelity-unbounded=Entfesselter Zeuge

[string-mod-setting-description]
ei-singularity-lance-visual-fidelity-lean=Nur die notwendige Spur bleibt: kurze Strahlen und die prägende Form jeder erforschten Aufwertung, ohne dekoratives Leuchten oder Narben.
ei-singularity-lance-visual-fidelity-standard=Der Strahl wird klar erinnert und losgelassen, bevor die Wunde zur Doktrin wird.
ei-singularity-lance-visual-fidelity-cinematic=Der Strahl bleibt länger, mit Leuchten und mehr Raum für kosmetische Narben und Klang.
ei-singularity-lance-visual-fidelity-maximal=Das Prisma hält seinen Strahl noch länger. Kernwarnungen behalten ihr genaues Timing; Dekoration bleibt begrenzt.
ei-singularity-lance-visual-fidelity-unbounded=Das längste Strahlnachbild. Der alte Name bleibt, doch Dekorationsgrenzen schützen weiterhin den Takt der Welt.

