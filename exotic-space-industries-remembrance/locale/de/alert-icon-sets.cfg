[mod-setting-name]
ei-alert-icon-set=Symbole für Meldungen
ei-alert-icon-set-default=Standard-Symbole für Meldungen

[mod-setting-description]
ei-alert-icon-set=Wähle die Symbole für deine ESIR-Meldungen und Ökologie-Einstellungen. „Startvorgabe übernehmen“ kopiert die aktuelle Startvorgabe in diese persönliche Einstellung. Deine gespeicherte Auswahl bleibt bei Änderungen der Startvorgabe erhalten.
ei-alert-icon-set-default=Anfänglicher Symbolsatz für Spieler ohne gespeicherte persönliche Auswahl. Bestehende persönliche Einstellungen bleiben erhalten. Standard: Gerenderte Objekte.

[string-mod-setting]
ei-alert-icon-set-vanilla=Symbole im Factorio-Stil
ei-alert-icon-set-default-vanilla=Symbole im Factorio-Stil
ei-alert-icon-set-startup-default=Startvorgabe übernehmen
ei-alert-icon-set-original=Ursprüngliche Symbole
ei-alert-icon-set-svg=Gussmetall-Sigillen
ei-alert-icon-set-rendered=Gerenderte Objekte
ei-alert-icon-set-default-original=Ursprüngliche Symbole
ei-alert-icon-set-default-svg=Gussmetall-Sigillen
ei-alert-icon-set-default-rendered=Gerenderte Objekte
