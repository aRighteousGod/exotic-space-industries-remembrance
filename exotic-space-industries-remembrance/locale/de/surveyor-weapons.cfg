[item-description]
ei-surveyor-carbine=Ein Karabiner des Dampfzeitalters mit Glasoptik. Feuert langsam, doch sein druckkorrigierter Lauf reicht weiter als gewöhnliche automatische Waffen.
ei-surveyor-rifle=Ein stabilisierter elektrischer Surveyor-Rahmen. Der Schuss bleibt bedächtig; das Visierbild wird klarer.
ei-surveyor-cannon=Ein automatischer Surveyor zur Materialbekämpfung im Simulationszeitalter. Seine .50-Kaliber-Disziplin beruht auf modellierten Einschlägen und einer Kohlefaser-Rückstoßstruktur.
ei-adaptive-surveyor=Ein modulares Scharfschützensystem des Quantenzeitalters. Überlegene Daten berechnen Kammer, Lauf, Wind und Ziel, bevor der Abzug seine Bewegung beendet.
ei-inferno-grenade=Eine umgebaute Streugranate, die am Ziel in explosive brennende Splitter zerbricht. Jeder Splitter detoniert beim Aufprall und setzt einen eigenen Feuerring.
ei-incinerator-capsule=Setzt fünf schnelle, von Zerstörerrobotern abgeleitete Einäscherer frei. Sie folgen, brennen und verweigern die Gnade des Feuers.
ei-prediction-snare-mine=Eine ausgelegte Simulationsfalle, die Feindbewegung vorhersagt und nahe Lebewesen mit motorisch störenden Fehlsignalen überflutet.
ei-breach-solver-charge=Eine kompakte Löserladung, die Simulationsdaten in eine enge, überstarke Explosion gegen Nester, Würmer und harte Ziele umsetzt.

