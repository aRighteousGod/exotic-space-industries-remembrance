[technology-description]
ei-surveyor-carbine=Ergänzt den alten Maschinengewehrrahmen um Glas, Druck und eiserne Korrektur. Das Ergebnis ist nicht schneller. Es reicht weiter.
ei-surveyor-rifle=Stabilisiert das Surveyor-Muster mit elektrischer Rückstellung und besserer Optik und führt die Fernschussdoktrin ins Elektrizitätszeitalter.
ei-surveyor-cannon=Macht die Surveyor-Reihe zur automatischen Waffe gegen Materialziele, gestützt durch Simulationsdaten und Kohlefaserplatten. Die Waffe feuert weiter, doch jeder Schuss gehört dem Visier.
ei-adaptive-surveyor=Verwandelt die Surveyor-Reihe mit überlegenen Daten, sonderbaren Panzerplatten und adaptiver Kammerdoktrin in ein Quanten-Fernhinrichtungssystem.
military-5=Formuliert simulierte Tötungsdoktrin: vorausschauende Fallen, Durchbruchsladungen, Infernomunition und Feuerroboter-Eskalation unter einem genehmigten Befehlsrahmen.
ei-inferno-grenade=Genehmigt umgebaute Streugranaten als simulierte Brand-Sperrladungen: Die Hülle zerbricht, Splitter fallen, jeder Einschlag schreibt einen weiteren Feuerring.
ei-incinerator=Genehmigt von Zerstörerrobotern abgeleitete Einäscherer: fünf schnelle Begleiter, die folgen, brennen und die Gnade des Feuers verweigern.
