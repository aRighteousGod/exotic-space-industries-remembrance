[mod-setting-name]
ei-arc-furnace-light-flicker-preset=Lichtflackern des Lichtbogenofens

[mod-setting-description]
ei-arc-furnace-light-flicker-preset=Regelt ausschließlich die Arbeitsbeleuchtung des Lichtbogenofens. „Original“ erhält den unruhigen Lichtbogen. „Reduziert“ und „Sanft“ beruhigen das Flackern. „Statisch“ leuchtet gleichmäßig. „Aus“ entfernt die Arbeitsbeleuchtung; Ofenanimation und rotes Kondensatorglühen im Leerlauf bleiben erhalten.

[string-mod-setting]
ei-arc-furnace-light-flicker-preset-off=Aus
ei-arc-furnace-light-flicker-preset-static=Statisches Leuchten
ei-arc-furnace-light-flicker-preset-soft=Sanftes Pulsieren
ei-arc-furnace-light-flicker-preset-reduced=Reduziertes Flackern
ei-arc-furnace-light-flicker-preset-original=Originalflackern

[string-mod-setting-description]
ei-arc-furnace-light-flicker-preset-off=Entfernt die Arbeitsbeleuchtung. Ofenanimation und rotes Kondensatorglühen im Leerlauf bleiben erhalten.
ei-arc-furnace-light-flicker-preset-static=Hält das Arbeitslicht gleichmäßig und deaktiviert Flackern.
ei-arc-furnace-light-flicker-preset-soft=Ein schwacher, langsamer Lichtpuls beruhigt die Ofenhalle.
ei-arc-furnace-light-flicker-preset-reduced=Erhält die geschichteten Lichtbogenfarben bei langsamerem, schwächerem Flackern.
ei-arc-furnace-light-flicker-preset-original=Erhält die bisherige unruhige Lichtbogenofenbeleuchtung.
