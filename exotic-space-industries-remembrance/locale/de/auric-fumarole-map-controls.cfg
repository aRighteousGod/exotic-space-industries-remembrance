[autoplace-control-descriptions]
ei-auric-fumarole=Häufigkeit skaliert Eruptionschancen und Erholungsversuche. Größe skaliert die Zielanzahl aktiver Schlote, nicht deren Abmessungen. Reichhaltigkeit skaliert Vorräte: 100% entsprechen 40.000–80.000 pro neuem Schlot. Deaktivieren verhindert neue Eruptionen. Bestehende Vorkommen behalten ihre Restvorräte. Fumarolen erscheinen nicht in der Kartengenerierungsvorschau, sondern erst während des Spiels bei aktivem Laufzeitskript.

[exotic-industries-informatron]
auric-fumarole-defaults=Die folgenden Werte beschreiben Karteneinstellungen von 100%. Die Zielanzahl bleibt durch geeignetes Gelände und Abstände begrenzt.
